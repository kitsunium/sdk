functions:
  - doc: |-
      appendAllBounded drains r onto dst, refusing to materialise more than max
      plaintext bytes, and returns dst extended by what it read (kitsunium/sdk#1102).

      The plaintext lands in dst's spare capacity first, read in place, so a
      caller handing a dst large enough for the payload pays no allocation and no
      copy. What does not fit is read into pooled 32 KiB chunks, and dst then grows
      ONCE, to its final length, and the chunks are copied in: one allocation of
      the payload's size, where io.ReadAll's doubling chain and the copy onto dst
      after it cost three and a half times the plaintext.

      It reads one byte past max, so an over-cap stream is detected as overflow
      rather than silently truncated; the caller maps overflow to its own sentinel.
      The +1 saturates at math.MaxInt64 (see below). On overflow or a read fault it
      returns dst at its original length: the caller's prefix intact and never a
      partial payload — dst's spare capacity may have been written, which the
      port's convention allows.

      max is an explicit parameter (production passes maxDecompressedBytes) so the
      overflow path can be exercised against a small cap in tests without
      materialising the production ceiling and without mutating shared state.
    name: appendAllBounded
    params: dst []byte, r io.Reader, max int64
    results: decoded []byte, overflow bool, err error
  - doc: |-
      fillSpare reads r into out's spare capacity, never more than limit bytes
      past len(out), and reports whether the stream ended there. It stops at a
      full buffer or at the limit without probing further: spill decides what
      that means.
    name: fillSpare
    params: out []byte, r io.Reader, limit int64
    results: filled []byte, done bool, err error
  - doc: |-
      spill reads the rest of r into pooled chunks, then grows out once to its
      final length and copies them in. A dst that held the payload exactly finds
      io.EOF on its first chunk read and is returned as it is, unreallocated.
    name: spill
    params: dst, out []byte, r io.Reader, limit, max int64
    results: decoded []byte, overflow bool, err error
  - doc: |-
      settle reports overflow when out holds more than max bytes past dst, and
      hands out back otherwise.
    name: settle
    params: dst, out []byte, max int64
    results: decoded []byte, overflow bool
  - doc: |-
      releaseSpill hands the first spillKeepChunks chunks back to the pool and
      drops the rest, so one large decode cannot leave its whole plaintext pinned
      in the pool.
    name: releaseSpill
    params: chunks []*spillChunk
  - name: NewFlateCompressor
    params: level int
    results: coretransform.Compressor
  - doc: |-
      flateDecompress DEFLATE-decodes src and appends the result to dst, refusing to
      materialise more than max plaintext bytes. An over-cap stream returns the
      FlateFailed sentinel rather than an OOM; a corrupt body returns a wrapped
      flate error. max is an explicit parameter so the overflow backstop is testable
      without mutating shared state.
    name: flateDecompress
    params: dst, src []byte, max int64
    results: decoded []byte, err error
  - doc: |-
      flateDecompressCore is the shared body behind both the layer backstop and the
      caller-supplied ceiling. It reports an over-cap stream as tooLarge rather
      than choosing a sentinel, so each caller can name the fact in its own terms.
    name: flateDecompressCore
    params: dst, src []byte, max int64
    results: decoded []byte, tooLarge bool, err error
  - name: NewGzipCompressor
    params: level int
    results: coretransform.Compressor
  - doc: |-
      storedLevel maps a clamped level onto the field's representation: the
      default is stored as the zero value, so the singleton and a default-level
      compressor built by a constructor are one value.
    name: storedLevel
    params: level int
    results: int
  - doc: |-
      writeLevel is the level the stdlib writer is built at: the stored level,
      the zero value read as DefaultCompression.
    name: writeLevel
    params: stored int
    results: int
  - doc: |-
      gzipDecompress gzip-decodes src and appends the result to dst, refusing to
      materialise more than max plaintext bytes. An over-cap stream returns the
      GzipFailed sentinel rather than an OOM; a bad header or corrupt body returns a
      wrapped gzip error. max is an explicit parameter so the overflow backstop is
      testable without mutating shared state.
    name: gzipDecompress
    params: dst, src []byte, max int64
    results: decoded []byte, err error
  - doc: |-
      gzipDecompressCore is the shared body behind both the layer backstop and the
      caller-supplied ceiling. It reports an over-cap stream as tooLarge rather
      than choosing a sentinel, so each caller can name the fact in its own terms.
    name: gzipDecompressCore
    params: dst, src []byte, max int64
    results: decoded []byte, tooLarge bool, err error
  - doc: |-
      newBoundedStream wraps a decoder box under ceiling, a negative ceiling read
      as zero, as DecompressBounded reads it.
    name: newBoundedStream
    params: box *readerBox, release func(*readerBox), wrap *errs.WrapParams, ceiling int64
    results: "*boundedStream"
  - doc: |-
      newLevelPools builds one recycler per level in the stdlib's accepted band
      [HuffmanOnly, BestCompression] — the same band and the same constants for
      compress/flate, compress/gzip and compress/zlib, which re-export flate's
      (pinned by TestTheThreeLevelBandsAreOne). Building the pools costs nothing
      at package load: recycler.NewPool stores the factory and calls it only on a
      miss, so importing this package does not construct thirty-six encoders.
    name: newLevelPools
    results: "[]*recycler.Pool[W]"
    typeParams: W any
  - doc: |-
      levelPool returns pools' recycler for level, or nil where the level is
      outside the band the stdlib constructors accept. A nil pool is how an
      out-of-range level reaches the stdlib constructor unpooled, which is the
      branch that reports it as a typed error.
    name: levelPool
    params: pools []*recycler.Pool[W], level int
    results: "*recycler.Pool[W]"
    typeParams: W any
  - doc: gzipWriterPoolFor returns the gzip recycler for level, nil out of band.
    name: gzipWriterPoolFor
    params: level int
    results: "*recycler.Pool[*gzip.Writer]"
  - doc: flateWriterPoolFor returns the flate recycler for level, nil out of band.
    name: flateWriterPoolFor
    params: level int
    results: "*recycler.Pool[*flate.Writer]"
  - doc: zlibWriterPoolFor returns the zlib recycler for level, nil out of band.
    name: zlibWriterPoolFor
    params: level int
    results: "*recycler.Pool[*zlib.Writer]"
  - doc: |-
      takeGzipWriter borrows a gzip writer for level, already bound to dst,
      constructing one only on a pool miss. The factory yields nil rather than a
      writer because a writer cannot be built without its destination: an eager
      factory could only bind io.Discard and would then need a second Reset on
      every miss. An out-of-range level has no pool and goes straight to the
      stdlib constructor, which turns it into a typed error.
    name: takeGzipWriter
    params: dst io.Writer, level int
    results: writer *gzip.Writer, err error
  - doc: |-
      releaseGzipWriter returns w to its level's pool, rebound to io.Discard so
      the pool does not pin the buffer this package just handed to the caller.
      level always has a pool here, for the reason releaseZlibWriter states.
    name: releaseGzipWriter
    params: w *gzip.Writer, level int
  - doc: |-
      takeFlateWriter borrows a flate writer for level, already bound to dst,
      constructing one only on a pool miss. The constructor's error is returned
      rather than swallowed, so the scheme keeps surfacing it.
    name: takeFlateWriter
    params: dst io.Writer, level int
    results: writer *flate.Writer, err error
  - doc: |-
      releaseFlateWriter returns w to its level's pool, unbound from the caller's
      output for the reason releaseGzipWriter states.
    name: releaseFlateWriter
    params: w *flate.Writer, level int
  - doc: |-
      takeZlibWriter borrows a zlib writer for level, already bound to dst. An
      out-of-range level has no pool and goes straight to the stdlib constructor,
      which is what turns it into a typed error.
    name: takeZlibWriter
    params: dst io.Writer, level int
    results: writer *zlib.Writer, err error
  - doc: |-
      releaseZlibWriter returns w to its level's pool, unbound from the caller's
      output for the reason releaseGzipWriter states.

      level always has a pool here, and the branch that used to test for one is
      gone rather than left to describe a writer that cannot exist. The chain: this
      function only ever runs from a defer the zlib scheme registers AFTER
      takeZlibWriter returned a nil error; takeZlibWriter's unpooled branch returns
      zlib.NewWriterLevel's own result verbatim; and NewWriterLevel refuses exactly
      `level < HuffmanOnly || level > BestCompression`, which is the same
      expression levelPool tests to report no pool — zlib's constants are flate's. So the two conditions are one condition, and a nil pool here would mean
      a writer the stdlib had refused to build was nonetheless handed back — a
      broken invariant, not a level to handle. It is left to fault, exactly as
      recycler.Pool.Get faults on a wrong-typed entry rather than masking it. The
      equivalence is not asserted at runtime on the hot path; it is pinned across
      the whole int range by TestZlibWriterPoolMatchesStdlibLevelBand.
    name: releaseZlibWriter
    params: w *zlib.Writer, level int
  - doc: |-
      takeGzipReader borrows a gzip decoder already reading src, through the box's
      own reader. Both the miss path and the reuse path validate the gzip header,
      so a malformed stream is rejected identically either way — the error is the
      caller's to wrap.
    name: takeGzipReader
    params: src []byte
    results: box *readerBox, err error
  - doc: |-
      takeGzipStream borrows a gzip decoder already reading the caller's stream r,
      for a StreamingCompressor reader (ADR 0213). The box's own reader is emptied
      so it does not hold a previous call's input.
    name: takeGzipStream
    params: r io.Reader
    results: box *readerBox, err error
  - doc: |-
      fillGzipBox points held's decoder at src — the pooled one when held carries
      a gzip decoder, a new one otherwise — and returns held, or puts it back and
      returns the stream's header fault.
    name: fillGzipBox
    params: held *readerBox, src io.Reader
    results: box *readerBox, err error
  - doc: |-
      releaseGzipReader returns box to the pool still bound to the caller's input,
      which the package-level comment explains.
    name: releaseGzipReader
    params: box *readerBox
  - doc: |-
      takeFlateReader borrows a raw-DEFLATE decoder already reading src. Raw
      DEFLATE has no header, so neither path can reject the stream here; the
      Resetter interface is still allowed to fail, and that failure is returned
      typed rather than discarded.
    name: takeFlateReader
    params: src []byte
    results: box *readerBox, err error
  - doc: |-
      takeFlateReaderFrom is takeFlateReader over an explicit pool, which is the
      seam that lets the Reset-fault branch be gated deterministically: today's
      stdlib cannot reach it, so its gate has to inject a failing decoder, and only
      a pool whose Get returns what Put stored makes that injection certain.
    name: takeFlateReaderFrom
    params: pool readerBoxPool, src []byte
    results: box *readerBox, err error
  - doc: |-
      takeFlateStream borrows a raw-DEFLATE decoder already reading the caller's
      stream r, for a StreamingCompressor reader (ADR 0213).
    name: takeFlateStream
    params: r io.Reader
    results: box *readerBox, err error
  - doc: fillFlateBox points held's decoder at src, as fillGzipBox does for gzip.
    name: fillFlateBox
    params: pool readerBoxPool, held *readerBox, src io.Reader
    results: box *readerBox, err error
  - doc: |-
      releaseFlateReader returns box to the pool still bound to the caller's input,
      which the package-level comment explains.
    name: releaseFlateReader
    params: box *readerBox
  - doc: |-
      takeZlibReader borrows a zlib decoder already reading src, through the box's
      own reader. Both paths parse the RFC 1950 header, so a bad envelope is
      rejected identically either way.
    name: takeZlibReader
    params: src []byte
    results: box *readerBox, err error
  - doc: |-
      takeZlibStream borrows a zlib decoder already reading the caller's stream r,
      for a StreamingCompressor reader (ADR 0213).
    name: takeZlibStream
    params: r io.Reader
    results: box *readerBox, err error
  - doc: fillZlibBox points held's decoder at src, as fillGzipBox does for gzip.
    name: fillZlibBox
    params: held *readerBox, src io.Reader
    results: box *readerBox, err error
  - doc: |-
      releaseZlibReader returns box to the pool still bound to the caller's input,
      which the package-level comment explains.
    name: releaseZlibReader
    params: box *readerBox
  - name: NewZlibCompressor
    params: level int
    results: coretransform.Compressor
  - doc: |-
      usableLevel maps level onto a level that actually compresses, returning
      DefaultCompression for anything that does not. It is the one clamp of the
      three schemes' level knobs (NewGzipCompressor, NewFlateCompressor,
      NewZlibCompressor): compress/gzip and compress/zlib re-export
      compress/flate's level constants, so one band covers all three. Two distinct
      faults land here: a level outside [HuffmanOnly, BestCompression], which the
      stdlib writers reject outright, and NoCompression, which they accept and
      which produces exactly the inert compressor ADR 0031 forbids. Clamping rather
      than refusing is the right side of the ADR 0031 line because every accepted
      level round-trips the caller's bytes identically — the knob trades ratio
      against CPU, it is not the content of the request — and DefaultCompression is
      the level every registered singleton encodes at, the floor a reader accepts
      without being told the number.
    name: usableLevel
    params: level int
    results: int
  - doc: |-
      zlibDecompress zlib-decodes src and appends the result to dst, refusing to
      materialise more than max plaintext bytes. An over-cap stream returns the
      ZlibFailed sentinel rather than an OOM; a bad header, a corrupt body, or a
      failed Adler-32 check returns a wrapped zlib error. max is an explicit
      parameter so the overflow backstop is testable without mutating shared state.
    name: zlibDecompress
    params: dst, src []byte, max int64
    results: decoded []byte, err error
  - doc: |-
      zlibDecompressCore is the shared body behind both the layer backstop and the
      caller-supplied ceiling. It reports an over-cap stream as tooLarge rather
      than choosing a sentinel, so each caller can name the fact in its own terms.
    name: zlibDecompressCore
    params: dst, src []byte, max int64
    results: decoded []byte, tooLarge bool, err error
imports:
  bytes: bytes
  coretransform: github.com/kitsunium/sdk/internal/core/data/transform
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  flate: compress/flate
  gzip: compress/gzip
  io: io
  math: math
  recycler: github.com/kitsunium/sdk/internal/kernel/concur/recycler
  slices: slices
  zlib: compress/zlib
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/data/transform
  name: transform
  purpose: Package transform — shared decompression bound for the stdlib gzip, flate and zlib schemes.
types:
  - doc: |-
      spillChunk is one fixed-size spill buffer. An array, so a chunk is one
      allocation and its pointer is what the pool holds.
    kind: named
    name: spillChunk
    underlying: "[spillChunkBytes]byte"
  - doc: |-
      flateCompressor is the concrete Compressor for the raw DEFLATE wire format.
      The level is fixed at construction and never mutated, so the value stays
      comparable (idempotent re-registration is a no-op) and safe for concurrent
      use.
    fields:
      - doc: |-
          level is the compress/flate level, already clamped by usableLevel; its
          zero value means DefaultCompression, for the reason gzipCompressor's
          field states.
        name: level
        type: int
    kind: struct
    methods:
      - doc: Algorithm implements transform.Compressor and returns the canonical key.
        name: Algorithm
        recv: flateCompressor
        results: coretransform.Algorithm
      - doc: |-
          Compress DEFLATE-encodes src at the receiver's level and appends the result
          to dst.
        name: Compress
        params: dst, src []byte
        recv: c flateCompressor
        results: encoded []byte, err error
      - doc: |-
          DecompressBounded implements core/data/transform.BoundedDecompressor: it decodes
          src under the CALLER's ceiling instead of this layer's backstop, so a caller
          enforcing a tighter limit stops the work at its own bound rather than
          materialising the full backstop and judging the result afterwards.

          max is honoured at every value: zero admits an empty stream and refuses every
          other, and a negative ceiling is clamped to zero. An over-cap stream returns
          coretransform.DecompressedTooLarge, which states only that more than max
          bytes were produced.
        name: DecompressBounded
        params: dst, src []byte, max int64
        recv: c flateCompressor
        results: decoded []byte, err error
      - doc: |-
          Decompress DEFLATE-decodes src and appends the result to dst, bounded by the
          production ceiling (maxDecompressedBytes, see bounded.go) so a bomb cannot
          drive an OOM here. It delegates to flateDecompress, the cap-parameterised core
          a white-box test drives with a lowered cap to exercise the overflow backstop.
        name: Decompress
        params: dst, src []byte
        recv: flateCompressor
        results: decoded []byte, err error
      - doc: |-
          NewReader implements core/data/transform.StreamingCompressor for raw
          DEFLATE: r's stream, decoded under max. Raw DEFLATE has no header, so a
          stream that is not one fails on its first read.
        name: NewReader
        params: r io.Reader, max int64
        recv: flateCompressor
        results: rc io.ReadCloser, err error
      - doc: |-
          NewWriter implements core/data/transform.StreamingCompressor for raw
          DEFLATE: a stream into w at the receiver's level.
        name: NewWriter
        params: w io.Writer
        recv: c flateCompressor
        results: wc io.WriteCloser, err error
    name: flateCompressor
  - doc: |-
      gzipCompressor is the concrete Compressor for the gzip wire format. The level
      is fixed at construction and never mutated, so the value stays comparable
      (idempotent re-registration is a no-op) and safe for concurrent use.
    fields:
      - doc: |-
          level is the compress/gzip level, already clamped by usableLevel. Its
          zero value means DefaultCompression: NoCompression is the one level the
          clamp never lets through, so 0 is free to name the default, and the
          registered singleton is the zero value it has always been.
        name: level
        type: int
    kind: struct
    methods:
      - doc: Algorithm implements transform.Compressor and returns the canonical key.
        name: Algorithm
        recv: gzipCompressor
        results: coretransform.Algorithm
      - doc: |-
          Compress gzip-encodes src at the receiver's level and appends the result to
          dst.
        name: Compress
        params: dst, src []byte
        recv: c gzipCompressor
        results: encoded []byte, err error
      - doc: |-
          DecompressBounded implements core/data/transform.BoundedDecompressor: it decodes
          src under the CALLER's ceiling instead of this layer's backstop, so a caller
          enforcing a tighter limit stops the work at its own bound rather than
          materialising the full backstop and judging the result afterwards.

          max is honoured at every value: zero admits an empty stream and refuses every
          other, and a negative ceiling is clamped to zero. An over-cap stream returns
          coretransform.DecompressedTooLarge, which states only that more than max
          bytes were produced.
        name: DecompressBounded
        params: dst, src []byte, max int64
        recv: c gzipCompressor
        results: decoded []byte, err error
      - doc: |-
          Decompress gzip-decodes src and appends the result to dst, bounded by the
          production ceiling (maxDecompressedBytes, see bounded.go) so a bomb cannot
          drive an OOM here. It delegates to gzipDecompress, the cap-parameterised core
          a white-box test drives with a lowered cap to exercise the overflow backstop.
        name: Decompress
        params: dst, src []byte
        recv: gzipCompressor
        results: decoded []byte, err error
      - doc: |-
          NewReader implements core/data/transform.StreamingCompressor for gzip: r's
          gzip stream, decoded under max. The header is read here, so a stream that is
          not gzip fails now with GzipFailed.
        name: NewReader
        params: r io.Reader, max int64
        recv: gzipCompressor
        results: rc io.ReadCloser, err error
      - doc: |-
          NewWriter implements core/data/transform.StreamingCompressor for gzip: a
          gzip stream into w at the receiver's level.
        name: NewWriter
        params: w io.Writer
        recv: c gzipCompressor
        results: wc io.WriteCloser, err error
    name: gzipCompressor
  - doc: |-
      readerBox carries a recycled decoder, and exists because two of the three
      stdlib decoders have an unexported concrete type: the pool can only hold them
      as io.ReadCloser, and a pool of a nil INTERFACE cannot signal a miss —
      recycler.Pool.Get type-asserts its entry, and a nil interface fails that
      assertion and panics ("recycler: pool yielded unexpected type"), while a nil
      POINTER passes it and reads back as nil. A one-word box makes "no decoder
      yet" representable for all three schemes; gzip alone could have gone in the
      pool unboxed, and does not, so the three schemes read identically.
    fields:
      - doc: rc is the recycled decoder, nil until the first miss has been served.
        name: rc
        type: io.ReadCloser
      - doc: |-
          scheme names which take filled rc, and is the only thing that tells the
          three pools' decoders apart — see readerScheme for the measurement that
          forces it. It is written in the same statement that writes rc, never
          separately, so the two cannot disagree.
        name: scheme
        type: readerScheme
      - doc: |-
          in is the reader over the caller's compressed input that rc decodes
          from. It lives in the box, rebound by each take, because a fresh
          bytes.NewReader per call escapes into the decoder and was one heap
          allocation on every Decompress — the last one a sized dst could not
          shed (kitsunium/sdk#1102). It holds the caller's input until the next
          take, which the decoder did already.
        name: in
        type: bytes.Reader
    kind: struct
    name: readerBox
  - doc: |-
      boundedStream is the reader all three schemes' NewReader return (ADR 0213):
      a pooled decoder read under the caller's ceiling. It hands over at most max
      bytes; once they are out, one more byte is asked of the decoder, and getting
      one fails the read with DecompressedTooLarge where getting the end returns
      io.EOF — the probe is the stream form of appendAllBounded's detector byte.
      Every error is sticky, and Close returns the decoder to its pool once.
    fields:
      - doc: box holds the pooled decoder, nil once Close has handed it back.
        name: box
        type: "*readerBox"
      - doc: release returns box to the pool it was taken from.
        name: release
        type: func(*readerBox)
      - doc: wrap is the scheme's WrapParams, for a decoder's fault.
        name: wrap
        type: "*errs.WrapParams"
      - doc: left is how many bytes the stream may still hand over.
        name: left
        type: int64
      - doc: "err is the sticky outcome: io.EOF, DecompressedTooLarge or a fault."
        name: err
        type: error
      - doc: |-
          probe is the one byte asked of the decoder at the ceiling. A field, so
          the probe does not allocate: the struct is on the heap already.
        name: probe
        type: "[1]byte"
    kind: struct
    methods:
      - doc: Read implements io.Reader under the ceiling.
        name: Read
        params: p []byte
        recv: s *boundedStream
        results: n int, err error
      - doc: |-
          atCeiling asks the decoder for one byte past the ceiling: a byte is a
          stream that wanted more than max, the end is a stream that fitted it.
        name: atCeiling
        recv: s *boundedStream
        results: error
      - doc: |-
          settle turns a decoder's error into the stream's: io.EOF as is, a fault
          under the scheme's sentinel, both sticky.
        name: settle
        params: rerr error
        recv: s *boundedStream
        results: error
      - doc: |-
          Close returns the decoder to its pool, once. It does not close the caller's
          reader; a second Close is a no-op.
        name: Close
        recv: s *boundedStream
        results: error
    name: boundedStream
  - doc: |-
      readerScheme names the wire format a boxed decoder was built for, and exists
      because the type assertion each take performs cannot establish it. MEASURED,
      on the Go 1.27 standard library:

      	*zlib.reader        satisfies flate.Resetter : true
      	*flate.decompressor satisfies zlib.Resetter  : true

      Both interfaces declare the one identical method Reset(io.Reader, []byte)
      error, so each pool's assertion accepts the other pool's decoder and detects
      nothing at all. Only takeGzipReader, which asserts the concrete *gzip.Reader,
      could tell the schemes apart on the type alone; flate.NewReader returns an
      unexported type, so no concrete assertion is available for flate and the
      scheme has to be CARRIED rather than inferred. One field and one comparison
      buy for all three schemes what gzip got for free.

      What the absent detection cost, before this tag, was also measured. A zlib
      decoder reached through the flate pool parsed an RFC 1950 header out of a raw
      DEFLATE stream and returned "zlib: invalid header" under FlateFailed — and
      because the assertion had passed, the take handed the foreign decoder
      straight back to the pool, so every later flate Decompress on that P failed
      identically, for the life of the process. The reverse crossing was quieter
      and worse: a flate decoder reached through the zlib pool ACCEPTED the Reset,
      skipping the two-byte header check that is the zlib scheme's whole reason to
      exist, and went on to judge the stream by the wrong grammar.
    kind: named
    name: readerScheme
    underlying: uint8
  - doc: |-
      readerBoxPool is the half of a decoder pool a take uses: Get never yields nil
      (a miss is a fresh, empty box) and Put hands a box back. *recycler.Pool
      satisfies it; the interface exists so takeFlateReaderFrom's Reset-fault branch
      can be gated on a pool whose Get returns what Put stored. A sync.Pool promises
      no such thing — a Put lands in the current P's private slot, which a goroutine
      migrated to another P cannot reach, and any collection may drop it — so a
      test driving that branch through the real pool can miss its own fixture, and
      one it missed stays behind to poison a later take.
    kind: named
    name: readerBoxPool
    underlying: |-
      interface {
      	// Get borrows a box, a fresh empty one on a miss.
      	Get() *readerBox
      	// Put returns box for a later Get.
      	Put(box *readerBox)
      }
  - doc: |-
      resetter is what the three stdlib writers share: a stream encoder that a
      pool can rebind to another destination.
    kind: named
    name: resetter
    underlying: |-
      interface {
      	io.WriteCloser
      	// Reset rebinds the writer to w, keeping its level.
      	Reset(w io.Writer)
      }
  - doc: |-
      poolStream is the writer all three schemes' NewWriter return (ADR 0213): a
      pooled encoder writing into the caller's w until Close, which writes the
      stream's end and returns the encoder to its level's pool, once.
    fields:
      - doc: w is the pooled encoder; closed says it went back.
        name: w
        type: W
      - name: closed
        type: bool
      - doc: pool is the level's pool w goes back to.
        name: pool
        type: "*recycler.Pool[W]"
      - doc: wrap is the scheme's WrapParams, for an encoder's fault.
        name: wrap
        type: "*errs.WrapParams"
    kind: struct
    methods:
      - doc: "Write implements io.Writer: it compresses p into the caller's w."
        name: Write
        params: p []byte
        recv: s *poolStream[W]
        results: n int, err error
      - doc: |-
          Close writes the stream's end into the caller's w and returns the encoder to
          its pool, unbound from w. It does not close w; a second Close is a no-op.
        name: Close
        recv: s *poolStream[W]
        results: error
    name: poolStream
    typeParams: W resetter
  - doc: |-
      zlibCompressor is the concrete Compressor for the zlib wire format. The level
      is fixed at construction and never mutated, so the value stays comparable
      (idempotent re-registration is a no-op) and safe for concurrent use — the same
      stateless-value shape the gzip and flate schemes use.
    fields:
      - name: level
        type: int
    kind: struct
    methods:
      - doc: |-
          NewReader implements core/data/transform.StreamingCompressor for zlib: r's
          RFC 1950 stream, decoded under max. The two-byte header is read here, so a
          stream that is not zlib fails now with ZlibFailed.
        name: NewReader
        params: r io.Reader, max int64
        recv: zlibCompressor
        results: rc io.ReadCloser, err error
      - doc: |-
          NewWriter implements core/data/transform.StreamingCompressor for zlib: an
          RFC 1950 stream into w at the receiver's level.
        name: NewWriter
        params: w io.Writer
        recv: c zlibCompressor
        results: wc io.WriteCloser, err error
      - doc: Algorithm implements transform.Compressor and returns the canonical key.
        name: Algorithm
        recv: zlibCompressor
        results: coretransform.Algorithm
      - doc: |-
          Compress zlib-encodes src at the receiver's level and appends the result to
          dst.
        name: Compress
        params: dst, src []byte
        recv: c zlibCompressor
        results: encoded []byte, err error
      - doc: |-
          DecompressBounded implements core/data/transform.BoundedDecompressor: it decodes
          src under the CALLER's ceiling instead of this layer's backstop, so a caller
          enforcing a tighter limit stops the work at its own bound rather than
          materialising the full backstop and judging the result afterwards.

          max is honoured at every value: zero admits an empty stream and refuses every
          other, and a negative ceiling is clamped to zero. An over-cap stream returns
          coretransform.DecompressedTooLarge, which states only that more than max
          bytes were produced.
        name: DecompressBounded
        params: dst, src []byte, max int64
        recv: c zlibCompressor
        results: decoded []byte, err error
      - doc: |-
          Decompress zlib-decodes src and appends the result to dst, bounded by the
          production ceiling (maxDecompressedBytes, see bounded.go) so a bomb cannot
          drive an OOM here. It delegates to zlibDecompress, the cap-parameterised core a
          white-box test drives with a lowered cap to exercise the overflow backstop.
          Decoding ignores the receiver's level — the level rides in the stream header.
        name: Decompress
        params: dst, src []byte
        recv: zlibCompressor
        results: decoded []byte, err error
    name: zlibCompressor
vars:
  - doc: |-
      spillPool recycles spill chunks across decodes of all three schemes: a
      chunk carries plaintext bytes and no pointer, so it is scheme-neutral.
    items:
      - name: spillPool
        value: recycler.NewPool(func() *spillChunk { return new(spillChunk) })
    name: spillPool
  - doc: |-
      FlateCompressor is the flate (raw DEFLATE) singleton, registered with
      core/data/transform at package load. Binding the registration result to a named
      var keeps us clear of init().
    items:
      - name: FlateCompressor
        value: coretransform.Register(flateCompressor{})
    name: FlateCompressor
  - doc: |-
      GzipCompressor is the gzip singleton, registered with core/data/transform at
      package load. Binding the registration result to a named var is idiomatic and
      keeps us clear of init().
    items:
      - name: GzipCompressor
        value: coretransform.Register(gzipCompressor{})
    name: GzipCompressor
  - grouped: true
    items:
      - doc: |-
          gzipWriterPools recycles *gzip.Writer per level, since NewGzipCompressor
          gave gzip a level (kitsunium/sdk#900). The level keys the pool for the
          reason zlibWriterPools states: gzip.Writer.Reset preserves it too.
        name: gzipWriterPools
        value: newLevelPools[*gzip.Writer]()
      - doc: |-
          flateWriterPools recycles *flate.Writer per level, since
          NewFlateCompressor (kitsunium/sdk#900); flate.Writer.Reset keeps the
          level the writer was built with, like the other two.
        name: flateWriterPools
        value: newLevelPools[*flate.Writer]()
      - doc: |-
          zlibWriterPools recycles *zlib.Writer per level. The level must key the pool
          because zlib.Writer.Reset deliberately preserves it: a writer recycled into a
          differently-levelled compressor would silently encode at the wrong ratio.
        name: zlibWriterPools
        value: newLevelPools[*zlib.Writer]()
      - doc: |-
          gzipReaderPool recycles the gzip decoder, held in a box rather than
          directly for the reason readerBox states.
        name: gzipReaderPool
        value: recycler.NewPool(func() *readerBox { return &readerBox{} })
      - doc: |-
          flateReaderPool recycles the raw-DEFLATE decoder, whose concrete type the
          stdlib does not export — the box is what makes a miss representable.
        name: flateReaderPool
        value: recycler.NewPool(func() *readerBox { return &readerBox{} })
      - doc: |-
          zlibReaderPool recycles the RFC 1950 decoder, unexported for the same
          reason and boxed the same way, so the three schemes read identically.
        name: zlibReaderPool
        value: recycler.NewPool(func() *readerBox { return &readerBox{} })
    name: gzipWriterPools
  - grouped: true
    items:
      - doc: |-
          gzipWrap is the WrapParams the gzip scheme attaches to a stdlib cause; its
          fields mirror the GzipFailed sentinel.
        name: gzipWrap
        value: |-
          errs.WrapParams{
          		Code:    coretransform.CodeGzipFailed,
          		Reason:  "GZIP_FAILED",
          		Public:  "gzip transform failed",
          		Private: "service/data/transform: compress/gzip returned an error",
          	}
      - doc: |-
          flateWrap is the WrapParams the flate scheme attaches to a stdlib cause,
          mirroring the FlateFailed sentinel.
        name: flateWrap
        value: |-
          errs.WrapParams{
          		Code:    coretransform.CodeFlateFailed,
          		Reason:  "FLATE_FAILED",
          		Public:  "flate transform failed",
          		Private: "service/data/transform: compress/flate returned an error",
          	}
      - doc: |-
          zlibWrap is the WrapParams the zlib scheme attaches to a stdlib cause,
          mirroring the ZlibFailed sentinel.
        name: zlibWrap
        value: |-
          errs.WrapParams{
          		Code:    coretransform.CodeZlibFailed,
          		Reason:  "ZLIB_FAILED",
          		Public:  "zlib transform failed",
          		Private: "service/data/transform: compress/zlib returned an error",
          	}
    name: gzipWrap
  - doc: |-
      ZlibCompressor is the zlib singleton, registered with core/data/transform at
      package load at the stdlib default level. Binding the registration result to a
      named var is idiomatic and keeps us clear of init().
    items:
      - name: ZlibCompressor
        value: "coretransform.Register(zlibCompressor{level: zlib.DefaultCompression})"
    name: ZlibCompressor
