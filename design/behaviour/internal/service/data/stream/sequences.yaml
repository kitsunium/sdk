        eval: m.clk.Now()
        to: m.clk.Now
      - bind: lines
        eval: compactLinesAt(now, m.policy.CompactAfter)
        to: compactLinesAt
      - eval: part.mu.Lock()
        to: part.mu.Lock
      - bind: freed
        eval: part.claim(part.first(now, m.policy.RetainFor))
        to: part.claim
      - bind: lo, line
        eval: part.kept, part.youngFrom(lines)
      - eval: part.mu.Unlock()
        to: part.mu.Unlock
      - opt:
          do:
            - return: corestream.CompactValue{}, freed, nil
          when: line <= lo
      - bind: last, scanned, err
        eval: m.planCompaction(part, lo, line)
        to: m.planCompaction
      - opt:
          do:
            - return: corestream.CompactValue{}, freed, err
          when: err != nil
      - var:
          name: dropped
          type: "[]corestream.Offset"
      - bind: edit
        eval:
          closure:
            params: index uint64, kind uint8, payload []byte
            results: uint8, []byte, bool
            steps:
              - bind: stamp, record, gone, ok
                eval: decodeStored(payload)
                to: decodeStored
              - bind: offset
                eval: corestream.Offset(index)
                to: corestream
              - opt:
                  do:
                    - return: kind, nil, false
                  when: offset < lo || gone || !ok
              - bind: at
                eval: timeOf(stamp)
                to: timeOf
              - bind: held, keyed
                eval: last[string(record.Key)]
              - opt:
                  do:
                    - return: kind, nil, false
                  when: "!lines.drops(record, at, keyed && held == offset)"
              - set: dropped
                value: append(dropped, offset)
              - return: kind, encodeGone(nil, stamp), true
      - opt:
          do:
            - set: part.broken
              to: backendFailed
              value: backendFailed("compact", "", rewriteErr)
            - return: corestream.CompactValue{}, freed, part.broken
          init:
            bind: _, rewriteErr
            eval: part.log.Rewrite(uint64(line), edit)
            to: part.log.Rewrite
          when: rewriteErr != nil
      - eval: part.mu.Lock()
        to: part.mu.Lock
      - op: +=
        set: freed
        to: part.forget
        value: part.forget(dropped)
      - eval: part.mu.Unlock()
        to: part.mu.Unlock
      - return: compactResult(scanned, int64(len(dropped))), freed, nil
        to: compactResult
  - of: (*fileStream).planCompaction
    participants:
      - id: caller
        kind: actor
      - id: (*fileStream).planCompaction
        kind: self
      - id: part.log.Range
        kind: value
      - id: decodeStored
        kind: internal
      - id: noteLast
        kind: internal
    steps:
      - set: last
        value: lastOfKey{}
      - var:
          name: dst
          type: "[][]byte"
      - loop:
          cond: from < line
          do:
            - bind: hi
              eval: min(from+rebuildChunk, line)
            - set: dst, err
              to: part.log.Range
              value: part.log.Range(uint64(from), uint64(hi), math.MaxInt, dst[:0])
            - opt:
                do:
                  - return: nil, 0, backendFailed("compact", "", err)
                when: err != nil
            - loop:
                do:
                  - bind: _, record, gone, ok
                    eval: decodeStored(payload)
                    to: decodeStored
                  - opt:
                      do:
                        - return: nil, 0, backendFailed("decode", "", nil)
