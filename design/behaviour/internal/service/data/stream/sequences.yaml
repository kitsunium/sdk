                  - opt:
                      do:
                        - continue: true
                      when: gone
                  - op: ++
                    set: scanned
                  - eval: noteLast(last, record.Key, from+corestream.Offset(i))
                    to: noteLast
                key: i
                range: dst
                value: payload
          init: from := lo
          post: from += rebuildChunk
      - return: last, scanned, nil
  - of: (*filePart).youngFrom
    participants:
      - id: caller
        kind: actor
      - id: (*filePart).youngFrom
        kind: self
      - id: sort
        kind: stdlib
      - id: p.next
        kind: internal
    steps:
      - bind: young
        eval: |-
          sort.Search(len(p.batches), func(i int) bool {
          		//: younger than the line.
