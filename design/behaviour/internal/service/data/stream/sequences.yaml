      - opt:
          do:
            - return: ""
          when: count == 0
      - var:
          name: freed
          type: int64
      - loop:
          do:
            - op: +=
              set: freed
              to: recordBytes
              value: recordBytes(part.entries[i].Record)
            - set: part.entries[i]
              value: corestream.EntryValue{}
          key: i
          range: count
      - set: part.entries
        value: part.entries[count:]
      - opt:
          do:
            - set: part.entries
              value: nil
          when: len(part.entries) == 0
      - op: +=
        set: part.first
        to: corestream
        value: corestream.Offset(count)
      - op: "-="
        set: part.bytes
        value: freed
      - op: "-="
        set: m.held
        value: freed
      - eval: m.room.fire()
        to: m.room.fire
  - of: (*memoryStream).Trim
