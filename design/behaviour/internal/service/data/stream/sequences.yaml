    participants:
      - id: caller
        kind: actor
      - id: (*fileStream).Compact
        kind: self
      - id: m.checkPartition
        kind: internal
      - id: m.usable
        kind: internal
      - id: part.wmu.Lock
        kind: value
      - id: m.compactPart
        kind: internal
      - id: part.wmu.Unlock
        kind: value
