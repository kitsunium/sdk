            - return: backendFailed("mkdir", dir, mkErr)
              to: backendFailed
          init:
            bind: mkErr
            eval: os.MkdirAll(dir, streamDirMode)
            to: os
          when: mkErr != nil
      - bind: info, statErr
        eval: os.Stat(dir)
        to: os
      - opt:
          do:
            - return: backendFailed("stat", dir, statErr)
              to: backendFailed
          when: statErr != nil
