        eval: m.parts[partition]
      - eval: part.wmu.Lock()
        to: part.wmu.Lock
      - bind: value, freed, err
        eval: m.compactPart(part)
        to: m.compactPart
      - eval: part.wmu.Unlock()
        to: part.wmu.Unlock
      - eval: m.release(freed, false, 0)
        to: m.release
      - return: value, err
  - of: (*fileStream).compactPart
    participants:
      - id: caller
        kind: actor
      - id: (*fileStream).compactPart
        kind: self
      - id: m.clk.Now
        kind: value
      - id: compactLinesAt
        kind: internal
      - id: part.mu.Lock
        kind: value
      - id: part.claim
        kind: internal
      - id: part.mu.Unlock
        kind: value
      - id: m.planCompaction
        kind: internal
      - id: decodeStored
        kind: internal
      - id: corestream
        kind: package
      - id: timeOf
        kind: internal
      - id: part.log.Rewrite
        kind: value
      - id: backendFailed
        kind: internal
      - id: part.forget
        kind: internal
      - id: compactResult
        kind: internal
