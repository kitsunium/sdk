            - return: nil
          when: "!unusable"
      - return: directoryUnusable(dir, why, observed)
        to: directoryUnusable
  - of: prepareSub
    participants:
      - id: caller
        kind: actor
      - id: prepareSub
        kind: self
      - id: filepath
        kind: stdlib
      - id: os
        kind: stdlib
      - id: subUnusableBecause
        kind: internal
    steps:
      - bind: sub
        eval: filepath.Join(dir, name)
