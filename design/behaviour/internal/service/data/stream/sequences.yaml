    participants:
      - id: caller
        kind: actor
      - id: encodeCursor
        kind: self
      - id: binary.LittleEndian.AppendUint64
        kind: value
    steps:
      - bind: out
        eval: binary.LittleEndian.AppendUint64(make([]byte, 0, 8+len(group)), uint64(next))
        to: binary.LittleEndian.AppendUint64
      - return: append(out, group...)
  - of: (*fileStream).Commit
    participants:
      - id: caller
        kind: actor
      - id: (*fileStream).Commit
        kind: self
      - id: misconfigured
        kind: internal
      - id: m.checkPartition
        kind: internal
      - id: m.usable
        kind: internal
      - id: part.mu.RLock
        kind: value
      - id: part.next
        kind: internal
      - id: part.mu.RUnlock
        kind: value
      - id: offsetAhead
        kind: internal
      - id: cursorName
        kind: internal
      - id: m.cursors.WriteAtomic
        kind: value
      - id: backendFailed
        kind: internal
    steps:
      - opt:
          do:
            - return: misconfigured("group")
              to: misconfigured
          when: group == ""
      - opt:
          do:
            - return: refused
          init:
            bind: refused
            eval: m.checkPartition(partition)
            to: m.checkPartition
          when: refused != nil
      - opt:
          do:
            - return: closed
          init:
            bind: closed
            eval: m.usable()
            to: m.usable
          when: closed != nil
      - bind: part
        eval: m.parts[partition]
      - eval: part.mu.RLock()
        to: part.mu.RLock
      - bind: head
        eval: part.next()
        to: part.next
      - eval: part.mu.RUnlock()
        to: part.mu.RUnlock
      - opt:
          do:
            - return: offsetAhead(next, head)
              to: offsetAhead
          when: next > head
      - bind: name
        eval: cursorName(group, partition)
        to: cursorName
      - opt:
          do:
            - return: backendFailed("commit", name, err)
              to: backendFailed
          init:
            bind: err
            eval: m.cursors.WriteAtomic(name, encodeCursor(group, next), fileMode)
            to: m.cursors.WriteAtomic
          when: err != nil
      - return: nil
  - of: (*fileStream).Committed
    participants:
      - id: caller
        kind: actor
      - id: (*fileStream).Committed
        kind: self
      - id: m.checkPartition
        kind: internal
      - id: m.usable
        kind: internal
      - id: cursorName
        kind: internal
      - id: fs
        kind: stdlib
      - id: corestream
        kind: package
    steps:
      - opt:
          do:
            - return: 0, misconfigured("group")
          when: group == ""
      - opt:
          do:
            - return: 0, refused
          init:
            bind: refused
            eval: m.checkPartition(partition)
            to: m.checkPartition
          when: refused != nil
      - opt:
          do:
            - return: 0, closed
          init:
            bind: closed
            eval: m.usable()
            to: m.usable
          when: closed != nil
      - bind: name
        eval: cursorName(group, partition)
        to: cursorName
      - bind: data, err
        eval: fs.ReadFile(m.cursors, name)
        to: fs
      - opt:
          do:
            - return: 0, unknownGroup(group, partition)
          when: errors.Is(err, fs.ErrNotExist)
      - opt:
          do:
            - return: 0, backendFailed("committed", name, err)
          when: err != nil
      - opt:
          do:
            - return: 0, backendFailed("cursor", name, nil)
          when: len(data) < 8 || !bytes.Equal(data[8:], []byte(group))
      - return: corestream.Offset(binary.LittleEndian.Uint64(data)), nil
        to: corestream
