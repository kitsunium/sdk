        to: m.retained
      - bind: kept
        eval: part.entries[skip:]
      - bind: found
        eval: |-
          sort.Search(len(kept), func(i int) bool {
          		//: at or after t.
          		return !kept[i].AppendedAt.Before(t)
          	})
        to: sort
      - return: first + corestream.Offset(found), nil
