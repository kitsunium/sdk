        kind: value
      - id: backendFailed
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: m.lock == nil
      - bind: unlockErr
        eval: flock.Unlock(m.lock)
        to: flock
      - bind: closeErr
        eval: m.lock.Close()
        to: m.lock.Close
      - opt:
          do:
            - return: backendFailed("unlock", lockName, unlockErr)
              to: backendFailed
          when: unlockErr != nil
      - opt:
          do:
            - return: backendFailed("close", lockName, closeErr)
              to: backendFailed
          when: closeErr != nil
      - return: nil
  - of: cursorName
    participants:
      - id: caller
        kind: actor
      - id: cursorName
        kind: self
      - id: sha256
        kind: stdlib
    steps:
      - bind: digest
        eval: sha256.Sum256([]byte(group))
        to: sha256
      - return: hex.EncodeToString(digest[:16]) + "." + strconv.Itoa(partition)
