    participants:
      - id: caller
        kind: actor
      - id: timeOf
        kind: self
      - id: time.Unix(0, stamp).UTC
        kind: value
    steps:
      - return: time.Unix(0, stamp).UTC()
        to: time.Unix(0, stamp).UTC
  - of: (*fileStream).usable
    participants:
      - id: caller
        kind: actor
      - id: (*fileStream).usable
        kind: self
      - id: backendFailed
        kind: internal
    steps:
      - lock:
          mutex: m.mu
      - opt:
          do:
            - return: backendFailed("closed", "", seglog.Closed)
              to: backendFailed
          when: m.closed
      - return: nil
  - of: (*fileStream).Close
    participants:
      - id: caller
        kind: actor
      - id: (*fileStream).Close
        kind: self
      - id: m.mu.Lock
        kind: value
      - id: m.mu.Unlock
        kind: value
      - id: firstError
        kind: internal
    steps:
      - eval: m.mu.Lock()
        to: m.mu.Lock
      - opt:
          do:
            - eval: m.mu.Unlock()
              to: m.mu.Unlock
            - return: nil
          when: m.closed
      - set: m.closed
        value: "true"
      - eval: m.mu.Unlock()
        to: m.mu.Unlock
