      - opt:
          do:
            - return: corestream.AppendValue{}, mixed
          when: mixed != nil
      - set: partition, refused
        to: m.reserve
        value: m.reserve(ctx, size, partition, keyed)
      - opt:
          do:
            - return: corestream.AppendValue{}, refused
          when: refused != nil
      - bind: part
        eval: m.parts[partition]
      - eval: part.wmu.Lock()
        to: part.wmu.Lock
      - bind: appended, freed, failed
        eval: m.write(part, partition, records, size)
        to: m.write
      - eval: part.wmu.Unlock()
        to: part.wmu.Unlock
      - eval: m.release(freed, failed != nil, size)
        to: m.release
      - opt:
          do:
            - return: corestream.AppendValue{}, failed
          when: failed != nil
      - eval: m.wake.fire()
        to: m.wake.fire
      - return: appended, nil
  - of: (*fileStream).write
    participants:
      - id: caller
        kind: actor
      - id: (*fileStream).write
        kind: self
      - id: part.next
        kind: internal
      - id: m.stamp
        kind: internal
      - id: encodeRecord
        kind: internal
      - id: recordBytes
        kind: internal
      - id: part.log.Append
        kind: value
      - id: backendFailed
        kind: internal
      - id: part.mu.RLock
        kind: value
      - id: part.first
        kind: internal
      - id: part.bounded
        kind: internal
      - id: part.mu.RUnlock
        kind: value
      - id: m.syncBatch
        kind: internal
      - id: part.mu.Lock
        kind: value
      - id: part.index
        kind: internal
      - id: part.mu.Unlock
        kind: value
    steps:
      - opt:
          do:
            - return: appended, 0, part.broken
          when: part.broken != nil
      - bind: first
        eval: part.next()
        to: part.next
      - bind: stamp
        eval: m.stamp()
        to: m.stamp
      - bind: sizes
        eval: make([]int64, len(records))
      - loop:
          do:
            - bind: kind
              eval: kindTail
            - opt:
                do:
                  - set: kind
                    value: kindHead
                when: i == 0
            - set: part.scratch
              to: encodeRecord
              value: encodeRecord(part.scratch[:0], stamp, record)
            - set: sizes[i]
              to: recordBytes
              value: recordBytes(record)
            - opt:
                do:
                  - set: part.broken
                    to: backendFailed
                    value: backendFailed("append", "", appendErr)
                  - return: appended, 0, part.broken
                init:
                  bind: appendErr
                  eval: part.log.Append(uint64(first)+uint64(i), kind, part.scratch)
                  to: part.log.Append
                when: appendErr != nil
          key: i
          range: records
          value: record
      - eval: part.mu.RLock()
        to: part.mu.RLock
      - bind: claim
        eval: part.first(timeOf(stamp), m.policy.RetainFor)
        to: part.first
      - set: claim
        to: part.bounded
        value: part.bounded(claim, first, size, m.policy.RetainBytes)
      - eval: part.mu.RUnlock()
        to: part.mu.RUnlock
      - opt:
          do:
            - set: part.broken
              to: backendFailed
              value: backendFailed("sync", "", syncErr)
            - return: appended, 0, part.broken
          init:
            bind: syncErr
            eval: m.syncBatch(part, claim)
            to: m.syncBatch
          when: syncErr != nil
      - eval: part.mu.Lock()
        to: part.mu.Lock
      - set: freed
        to: part.index
        value: part.index(stamp, sizes, claim)
      - eval: part.mu.Unlock()
        to: part.mu.Unlock
      - return: |-
          corestream.AppendValue{
          		Partition: partition,
          		First:     first,
          		Last:      first + corestream.Offset(len(records)-1),
          	}, freed, nil
  - of: (*fileStream).syncBatch
    participants:
      - id: caller
        kind: actor
      - id: (*fileStream).syncBatch
        kind: self
      - id: part.log.Bounds
        kind: value
      - id: part.log.DropBefore
        kind: value
      - id: part.log.Sync
        kind: value
    steps:
      - bind: first, _
        eval: part.log.Bounds()
        to: part.log.Bounds
      - opt:
          do:
            - return: part.log.DropBefore(uint64(claim))
              to: part.log.DropBefore
          when: uint64(claim) > first
      - return: part.log.Sync()
        to: part.log.Sync
  - of: (*fileStream).release
    participants:
      - id: caller
        kind: actor
      - id: (*fileStream).release
        kind: self
      - id: m.mu.Lock
        kind: value
      - id: m.mu.Unlock
        kind: value
      - id: m.room.fire
        kind: internal
    steps:
      - eval: m.mu.Lock()
        to: m.mu.Lock
      - op: "-="
        set: m.held
        value: freed
      - opt:
          do:
            - op: "-="
              set: m.held
              value: size
          when: failed
      - eval: m.mu.Unlock()
        to: m.mu.Unlock
      - opt:
          do:
            - eval: m.room.fire()
              to: m.room.fire
          when: freed > 0 || failed
  - of: (*fileStream).stamp
    participants:
      - id: caller
        kind: actor
      - id: (*fileStream).stamp
        kind: self
      - id: m.clk.Now().UnixNano
        kind: value
    steps:
      - lock:
          mutex: m.mu
      - bind: now
        eval: m.clk.Now().UnixNano()
        to: m.clk.Now().UnixNano
      - set: m.last
        value: max(m.last, now)
      - return: m.last
