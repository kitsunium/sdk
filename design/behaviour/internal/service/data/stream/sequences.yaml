                do:
                  - bind: full
                    eval: streamFull(size, m.held, m.policy.MaxBytes)
                    to: streamFull
                  - eval: m.mu.Unlock()
                    to: m.mu.Unlock
                  - return: full
                when: remaining <= 0 || size > m.policy.MaxBytes
            - bind: wait
              eval: m.untilExpiry(now, remaining)
              to: m.untilExpiry
            - bind: room
              eval: m.room.current()
              to: m.room.current
            - eval: m.mu.Unlock()
              to: m.mu.Unlock
            - opt:
                do:
                  - return: stopped
                init:
                  bind: stopped
                  eval: m.await(ctx, room, wait)
                  to: m.await
                when: stopped != nil
          forever: true
  - of: (*memoryStream).untilExpiry
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStream).untilExpiry
        kind: self
      - id: m.parts[i].entries[0].AppendedAt.Add(m.policy.RetainFor).Sub
        kind: value
    steps:
      - opt:
          do:
            - return: limit
          when: m.policy.RetainFor == 0
      - bind: wait
        eval: limit
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: len(m.parts[i].entries) == 0
            - bind: due
              eval: m.parts[i].entries[0].AppendedAt.Add(m.policy.RetainFor).Sub(now)
              to: m.parts[i].entries[0].AppendedAt.Add(m.policy.RetainFor).Sub
            - opt:
                do:
                  - set: wait
                    value: due
                when: due > 0 && due < wait
          key: i
          range: m.parts
      - return: wait
  - of: (*memoryStream).await
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStream).await
        kind: self
      - id: m.clk.NewTimer
        kind: value
      - id: timer.Stop
        kind: value
      - id: context
        kind: stdlib
    steps:
      - bind: timer
        eval: m.clk.NewTimer(wait)
        to: m.clk.NewTimer
      - defer: timer.Stop()
        to: timer.Stop
      - select:
          cases:
            - comm: <-ctx.Done()
              do:
                - return: context.Cause(ctx)
                  to: context
            - comm: <-room
              do:
                - return: nil
            - comm: <-timer.C()
              do:
                - return: nil
  - of: (*memoryStream).expireAll
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStream).expireAll
        kind: self
      - id: m.drop
        kind: internal
    steps:
      - loop:
          do:
            - eval: m.drop(&m.parts[i], m.expired(&m.parts[i], now))
              to: m.drop
          key: i
          range: m.parts
  - of: (*memoryStream).retainBytes
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStream).retainBytes
        kind: self
      - id: recordBytes
        kind: internal
      - id: m.drop
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: m.policy.RetainBytes == 0
      - bind: excess
        eval: part.bytes - m.policy.RetainBytes
      - bind: count
        eval: "0"
      - loop:
          cond: count < len(part.entries)-fresh && excess > 0
          do:
            - op: "-="
              set: excess
              to: recordBytes
              value: recordBytes(part.entries[count].Record)
            - op: ++
              set: count
      - eval: m.drop(part, count)
        to: m.drop
