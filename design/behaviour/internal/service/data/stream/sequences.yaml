        to: firstError
  - of: (*fileStream).closeParts
    participants:
      - id: caller
        kind: actor
      - id: (*fileStream).closeParts
        kind: self
      - id: part.wmu.Lock
        kind: value
      - id: part.log.Close
        kind: value
      - id: part.wmu.Unlock
        kind: value
      - id: backendFailed
        kind: internal
    steps:
      - var:
          name: first
          type: error
      - loop:
          do:
            - eval: part.wmu.Lock()
              to: part.wmu.Lock
            - bind: closeErr
              eval: part.log.Close()
              to: part.log.Close
            - eval: part.wmu.Unlock()
              to: part.wmu.Unlock
            - opt:
                do:
                  - set: first
                    to: backendFailed
                    value: backendFailed("close", "", closeErr)
                when: closeErr != nil && first == nil
          key: _
          range: m.parts
          value: part
      - return: first
  - of: (*fileStream).closeCursors
    participants:
      - id: caller
        kind: actor
      - id: (*fileStream).closeCursors
        kind: self
      - id: closer.Close
        kind: value
      - id: backendFailed
        kind: internal
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: backendFailed("close", cursorsDir, closeErr)
                    to: backendFailed
                init:
                  bind: closeErr
                  eval: closer.Close()
                  to: closer.Close
                when: closeErr != nil
