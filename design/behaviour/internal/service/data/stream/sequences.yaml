          	})
        to: sort
      - opt:
          do:
            - return: p.next()
              to: p.next
          when: young == len(p.batches)
      - return: max(p.batches[young].first, p.kept)
  - of: prepareRoot
    participants:
      - id: caller
        kind: actor
      - id: prepareRoot
