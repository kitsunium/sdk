functions:
  - doc: |-
      admit checks a batch before anything is written: at least one record, and
      none above maxRecord bytes, key and payload together. It returns the bytes
      the whole batch holds.
    name: admit
    params: records []corestream.RecordValue, maxRecord int
    results: size int64, err error
  - doc: |-
      recordBytes returns what a record counts against every bound: its key and
      payload together.
    name: recordBytes
    params: record corestream.RecordValue
    results: int64
  - doc: |-
      keyedPartition returns the partition a batch's keys name, and whether any
      record is keyed at all. Keyed records naming two partitions are refused:
      a batch is one partition's, written under one sync.
    name: keyedPartition
    params: |2

      	records []corestream.RecordValue, partitions int,
    results: partition int, keyed bool, err error
  - doc: |-
      carve appends src to arena and returns the arena and the copy, capped so an
      append to the copy cannot run into the next one. An empty src stays nil.
    name: carve
    params: arena, src []byte
    results: grown, copied []byte
  - doc: |-
      copyEntries returns a copy of entries a reader may keep and modify: one
      slice of entries and one buffer for every byte they hold.
    name: copyEntries
    params: entries []corestream.EntryValue
    results: "[]corestream.EntryValue"
  - doc: |-
      rootWritableByAnyone reports whether an account outside the owner and group
      can REPLACE an entry of the stream directory: other-write without the
      sticky bit. A sticky world-writable directory — what /tmp is — is
      accepted, since nothing lives at the root but the lock file and the
      subdirectories, which only their owner may then unlink.
    name: rootWritableByAnyone
    params: _ string, info fs.FileInfo
    results: why, observed string, unusable bool
  - doc: |-
      subWritableByAnyone reports whether an account outside the owner and group
      can put an entry into a partition or the cursors' directory at all. There
      an entry IS a segment or a cursor, so the sticky bit exempts nothing: it
      stops an unlink, not a planted one.
    name: subWritableByAnyone
    params: _ string, info fs.FileInfo
    results: why, observed string, unusable bool
  - doc: |-
      reparsePoint reports whether a directory entry is a reparse point. Only
      Windows has them; a Unix indirection is a symbolic link, which the mode
      already says.
    name: reparsePoint
    params: _ fs.FileInfo
    results: bool
  - doc: |-
      offsetField renders an offset as a field: in decimal, exactly, whatever
      its size.
    name: offsetField
    params: key string, offset corestream.Offset
    results: errs.FieldValue
  - doc: unknownPartition refuses a partition outside [0, partitions).
    name: unknownPartition
    params: partition, partitions int
    results: error
  - doc: invalidBatchSize refuses an empty batch or a non-positive read size.
    name: invalidBatchSize
    params: field string, value int
    results: error
  - doc: recordTooLarge refuses the batch holding record index, of size bytes.
    name: recordTooLarge
    params: index int, size int64, maxRecord int
    results: error
  - doc: |-
      partitionsMixed refuses a batch whose record index hashes to got while the
      batch's first keyed record hashed to want.
    name: partitionsMixed
    params: index, want, got int
    results: error
  - doc: offsetTrimmed refuses a read from offset, below first.
    name: offsetTrimmed
    params: offset, first corestream.Offset
    results: error
  - doc: offsetAhead refuses an offset past next.
    name: offsetAhead
    params: offset, next corestream.Offset
    results: error
  - doc: |-
      streamFull refuses an Append of size bytes that found no room under
      maxBytes while held bytes were retained.
    name: streamFull
    params: size, held, maxBytes int64
    results: error
  - doc: misconfigured refuses an argument with no usable value.
    name: misconfigured
    params: field string
    results: error
  - doc: unknownGroup answers a Committed for a group with no cursor on partition.
    name: unknownGroup
    params: group string, partition int
    results: error
  - name: NewFile
    params: cfg FileConfig
    results: s corestream.Stream, err error
  - doc: partitionDir names partition p's directory.
    name: partitionDir
    params: p int
    results: string
  - doc: lockDir takes the exclusive lock on dir's lock file without waiting.
    name: lockDir
    params: dir string
    results: "*os.File, error"
  - doc: checkPartitions refuses a directory holding a partition at or past count.
    name: checkPartitions
    params: dir string, count int
    results: error
  - doc: |-
      abandon drops the error of a release on a path that is already failing:
      the refusal being returned is the one that matters.
    name: abandon
    params: error
  - doc: abandonLog closes a log a refusal leaves behind.
    name: abandonLog
    params: log *seglog.Log
  - doc: abandonStream releases what a refused NewFile opened.
    name: abandonStream
    params: m *fileStream
  - doc: timeOf returns the instant of a stamp, in UTC.
    name: timeOf
    params: stamp int64
    results: time.Time
  - doc: |-
      cursorName names group's cursor on partition under cursors/: a digest of
      the group, so any group name is a safe file name of one length, and the
      partition.
    name: cursorName
    params: group string, partition int
    results: string
  - doc: |-
      encodeCursor is a cursor file's bytes: the offset, then the group itself,
      so a digest collision is detected rather than read as the other group's.
    name: encodeCursor
    params: group string, next corestream.Offset
    results: "[]byte"
  - doc: |-
      prepareRoot creates the stream directory, or checks it when it already
      exists: the queue's root rule, a sticky world-writable directory
      accepted.
    name: prepareRoot
    params: dir string
    results: error
  - doc: |-
      prepareSub creates the directory name under dir owner-only when absent,
      then checks what is there, whoever put it there: the queue's state rule,
      one notch stricter than the root's, since its entries are the records or
      the cursors themselves.

      It is os.Mkdir and os.Lstat, never MkdirAll or Stat, which follow a
      symbolic link: a subdirectory that is one is refused whatever it points
      at, or the records would live wherever the link's author chose.
    name: prepareSub
    params: dir, name string
    results: string, error
  - doc: |-
      rootUnusableBecause is the root rule: refused by shape, then when an
      account outside the owner and group can REPLACE an entry.
    name: rootUnusableBecause
    params: dir string, info fs.FileInfo
    results: why, observed string, unusable bool
  - doc: |-
      subUnusableBecause is the subdirectories' rule: refused by shape, then
      when an account outside the owner and group can put an entry there at all.
    name: subUnusableBecause
    params: dir string, info fs.FileInfo
    results: why, observed string, unusable bool
  - doc: |-
      indirectionOrFile refuses the two shapes no permission makes usable: a
      symbolic link or another reparse point, and an entry that is not a
      directory.
    name: indirectionOrFile
    params: info fs.FileInfo
    results: why string, unusable bool
  - doc: |-
      directoryUnusable refuses the directory value for why, with what the
      verdict was read from when there is one.
    name: directoryUnusable
    params: value, why, observed string
    results: error
  - doc: |-
      backendFailed reports an operation on path the storage refused, cause
      kept in the chain: under STREAM_BACKEND_FAILED for a standard library
      cause, in the trail of an SDK one, whose code wins (rule 6).
    name: backendFailed
    params: op, path string, cause error
    results: error
  - doc: decodeEntries turns the payloads read from offset from on into entries.
    name: decodeEntries
    params: partition int, from corestream.Offset, payloads [][]byte
    results: "[]corestream.EntryValue, error"
  - doc: |-
      encodeRecord appends to dst the segment payload of record, stamped at
      stamp: the instant in Unix nanoseconds, the key's length, the key, the
      payload.
    name: encodeRecord
    params: dst []byte, stamp int64, record corestream.RecordValue
    results: "[]byte"
  - doc: |-
      decodeRecord reads what encodeRecord wrote. The key and the payload alias
      payload, each capped at its end; an empty one is nil, as the memory engine
      answers. ok is false for bytes encodeRecord cannot have written.
    name: decodeRecord
    params: payload []byte
    results: stamp int64, record corestream.RecordValue, ok bool
  - doc: capped returns b with its capacity cut at its length, nil when empty.
    name: capped
    params: b []byte
    results: "[]byte"
  - name: NewMemory
    params: cfg MemoryConfig
    results: s corestream.Stream, err error
  - doc: clockOrSystem resolves a nil clock to the wall clock.
    name: clockOrSystem
    params: clk clock.Timed
    results: clock.Timed
  - name: NewSQL
    params: cfg SQLConfig
    results: s corestream.Stream, err error
  - doc: |-
      sqlWakeFor returns the signal every engine over join's pool and table
      shares in this process — or one of its own when the pool cannot key a map.
    name: sqlWakeFor
    params: join coresql.Joiner, table string
    results: "*wakeSignal"
  - doc: |-
      sqlOwnTxOptions are the options of a transaction the engine opens itself:
      READ COMMITTED on MySQL, whose REPEATABLE READ takes gap locks no statement
      here needs (ADR 0139); every other engine keeps its default.
    name: sqlOwnTxOptions
    params: dialect coresql.Dialect
    results: coresql.TxOptionsValue
  - doc: |-
      nullable binds an empty key or payload as NULL, which reads back as nil,
      as the memory engine keeps an empty one.
    name: nullable
    params: b []byte
    results: "[]byte"
  - doc: |-
      sqlNameable reports whether an instant fits 64-bit Unix nanoseconds, the
      unit every instant of the tables is kept in.
    name: sqlNameable
    params: t time.Time
    results: bool
  - doc: |-
      validateSQLNames refuses a dialect the engine cannot spell and a table name
      it could not interpolate safely.
    name: validateSQLNames
    params: dialect coresql.Dialect, table string
    results: error
  - doc: sqlMisconfigured is SQLStreamMisconfigured naming a field and its problem.
    name: sqlMisconfigured
    params: field, problem string
    results: error
  - doc: sqlClockOrSystem resolves a nil clock to the wall clock.
    name: sqlClockOrSystem
    params: clk clock.Clock
    results: clock.Clock
  - doc: |-
      renderSQLStatements renders every fixed statement of the stream keeping its
      records in table on dialect. The table name was validated at NewSQL.
    name: renderSQLStatements
    params: dialect coresql.Dialect, table string
    results: sqlStatements
  - doc: |-
      lockHeadStatement renders the upsert that creates a partition's head row
      at offset zero when it is missing, and otherwise locks it by writing it
      back unchanged — the row lock that serialises a partition's appenders on
      PostgreSQL and MySQL, and the first write of the transaction on SQLite.
      PostgreSQL wants the existing row's column qualified by its table, SQLite
      names it bare, MySQL has no ON CONFLICT.
    name: lockHeadStatement
    params: dialect coresql.Dialect, h string
    results: string
  - doc: |-
      commitStatement renders the upsert of a group's cursor: the digest of the
      group, the partition, the offset, the group's name for an operator reading
      the table, and the offset again for the update — bound twice rather than
      read back from the insertion, which MySQL spells only with a deprecated
      VALUES().
    name: commitStatement
    params: dialect coresql.Dialect, c string
    results: string
  - doc: |-
      createStreamTableStatements renders the DDL that creates a stream's three
      tables, each statement doing nothing when its table exists, so a migration
      run twice — MySQL commits DDL implicitly, so a run can stop between them —
      changes nothing the second time.

      The UNIQUE constraint on (part, appended_at, record_offset) can never be
      broken, since (part, record_offset) is the key: it builds the index
      OffsetAt and the age bound walk, which PostgreSQL and SQLite declare no
      other way inside CREATE TABLE. A key and a payload admit NULL, which an
      empty one is written as and read back from.
    name: createStreamTableStatements
    params: dialect coresql.Dialect, table string
    results: "[]string"
  - doc: |-
      dropStreamTableStatements renders the reversal of
      createStreamTableStatements, doing nothing for a table already gone.
    name: dropStreamTableStatements
    params: dialect coresql.Dialect, table string
    results: "[]string"
  - name: SQLMigration
    params: dialect coresql.Dialect, table string, version uint64
    results: coresql.MigrationValue, error
  - doc: |-
      nonEmpty reads an empty column back as nil, as the memory engine keeps an
      empty key or payload.
    name: nonEmpty
    params: b []byte
    results: "[]byte"
  - name: Subscribe
    params: ctx context.Context, s corestream.Stream, cfg SubscriberConfig
    results: error
  - doc: ignoreStop reads a failure that is the subscriber's own stop as a stop.
    name: ignoreStop
    params: ctx context.Context, cause error
    results: error
  - doc: subscriberMisconfigured refuses the configuration field names.
    name: subscriberMisconfigured
    params: field string
    results: error
  - doc: newWakeSignal returns a signal with its first channel armed.
    name: newWakeSignal
    results: "*wakeSignal"
imports:
  atomic: sync/atomic
  backoff: github.com/kitsunium/sdk/internal/kernel/backoff
  binary: encoding/binary
  bytes: bytes
  clock: github.com/kitsunium/sdk/internal/kernel/clock
  context: context
  corelock: github.com/kitsunium/sdk/internal/core/app/lock
  corequeue: github.com/kitsunium/sdk/internal/core/data/queue
  coresql: github.com/kitsunium/sdk/internal/core/data/sql
  corestream: github.com/kitsunium/sdk/internal/core/data/stream
  corevfs: github.com/kitsunium/sdk/internal/core/data/vfs
  errors: errors
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  filepath: path/filepath
  flock: github.com/kitsunium/sdk/internal/kernel/fs/flock
  fs: io/fs
  group: github.com/kitsunium/sdk/internal/kernel/concur/group
  hex: encoding/hex
  io: io
  json: encoding/json
  math: math
  os: os
  reflect: reflect
  regexp: regexp
  seglog: github.com/kitsunium/sdk/internal/kernel/fs/seglog
  sha256: crypto/sha256
  slices: slices
  sort: sort
  stdsql: database/sql
  strconv: strconv
  strings: strings
  svcsql: github.com/kitsunium/sdk/internal/service/data/sql
  svcvfs: github.com/kitsunium/sdk/internal/service/data/vfs
  sync: sync
  time: time
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/data/stream
  name: stream
  purpose: Package stream holds the engines of core/data/stream's [Stream] port — memory, a directory of segments over kernel/fs/seglog, and a SQL table joined to the caller's transaction — and the subscriber that reads a stream on behalf of a consumer group (ADR 0231).
types:
  - doc: |-
      fileStream is a stream kept in a directory: one kernel/fs/seglog log per
      partition, and one file per consumer group's cursor.

      # Durability

      An Append is one seglog batch — its records, and a drop record when
      retention moved — written under one Sync: two fdatasyncs whatever the
      number of records, so a crash keeps all of the batch or none of it.

      # Retention

      Every bound is applied to the offset first, at once: a record past
      RetainFor, beyond RetainBytes or below a Trim is unreadable from that
      instant. The storage follows in whole segments: the Append or the Trim
      that moves the first offset records it in its batch, and every sealed
      segment holding only records below it is unlinked after that batch's sync
      — at the next rotation for the segment being written. The age bound is
      computed at read time, as the memory engine's is, and applied by the next
      Append, Trim or backpressure wait.

      # One engine per directory

      A segmented log has one writer, so the engine holds an exclusive lock on
      <Dir>/lock for its life (kernel/fs/flock): a second open of the directory,
      in this process or another, is refused until Close. The Waker of the open
      engine is therefore the directory's.
    fields:
      - name: clk
        type: clock.Timed
      - name: cursors
        type: corevfs.FullFS
      - name: lock
        type: "*os.File"
      - doc: wake is closed by every Append (corestream.Waker).
        name: wake
        type: "*wakeSignal"
      - doc: |-
          room is closed whenever records are released, which an Append
          waiting under PolicyValue.MaxBytes waits for.
        name: room
        type: "*wakeSignal"
      - name: parts
        type: "[]*filePart"
      - name: policy
        type: corestream.PolicyValue
      - doc: |-
          mu guards the four below. It is taken before a partition's mu, never
          after.
        name: mu
        type: sync.Mutex
      - doc: |-
          held is the bytes every partition retains, the figure MaxBytes
          bounds, the batches being written included.
        name: held
        type: int64
      - doc: |-
          last is the latest instant a batch was stamped with, in Unix
          nanoseconds: AppendedAt never goes backwards, across a restart too.
        name: last
        type: int64
      - doc: turn is the partition the next unkeyed batch goes to.
        name: turn
        type: int
      - name: closed
        type: bool
    kind: struct
    methods:
      - doc: |-
          open opens the cursors' filesystem and every partition's log, and indexes
          what the logs hold.
        name: open
        params: dir string
        recv: m *fileStream
        results: error
      - doc: openPart opens and indexes partition p's log, under p<p>/.
        name: openPart
        params: dir string, p int
        recv: m *fileStream
        results: "*filePart, error"
      - doc: Partitions returns how many partitions the stream has.
        name: Partitions
        recv: m *fileStream
        results: int
      - doc: Append writes records to one partition as one batch, under one sync.
        name: Append
        params: |2

          	ctx context.Context, records []corestream.RecordValue,
        recv: m *fileStream
        results: corestream.AppendValue, error
      - doc: |-
          write encodes records into part's log, syncs them as one batch with the
          retention they move, and indexes them. The caller holds part.wmu.
        name: write
        params: |2

          	part *filePart, partition int, records []corestream.RecordValue, size int64,
        recv: m *fileStream
        results: appended corestream.AppendValue, freed int64, err error
      - doc: |-
          syncBatch makes part's pending batch durable: with a drop record when claim
          is past the log's first index, which also unlinks the sealed segments it
          empties, with a plain sync otherwise.
        name: syncBatch
        params: part *filePart, claim corestream.Offset
        recv: m *fileStream
        results: error
      - doc: |-
          release gives back what an Append's retention freed and, when the
          Append failed, the room it had reserved.
        name: release
        params: freed int64, failed bool, size int64
        recv: m *fileStream
      - doc: |-
          stamp returns the instant, in Unix nanoseconds, the batch being appended
          is stamped with: the clock's, or the last stamp when the clock went
          backwards. The caller holds the partition's wmu, so a partition's batches
          are stamped in their order.
        name: stamp
        recv: m *fileStream
        results: int64
      - doc: usable refuses a call on a closed stream. The caller holds no lock.
        name: usable
        recv: m *fileStream
        results: error
      - doc: |-
          Close closes every partition's log and the cursors' filesystem, then
          releases the directory's lock. It reports the first failure; a second
          Close returns nil.
        name: Close
        recv: m *fileStream
        results: error
      - doc: |-
          Commit records next as the offset group reads next on partition, in a
          file of its own published atomically and durably (vfs.WriteAtomic).
        name: Commit
        params: |2

          	_ context.Context, group string, partition int, next corestream.Offset,
        recv: m *fileStream
        results: error
      - doc: Committed returns the offset group committed last on partition.
        name: Committed
        params: |2

          	_ context.Context, group string, partition int,
        recv: m *fileStream
        results: corestream.Offset, error
      - doc: checkPartition refuses a partition outside [0, Partitions()).
        name: checkPartition
        params: partition int
        recv: m *fileStream
        results: error
      - doc: |-
          Read returns up to maxEntries entries of partition from offset from on,
          read from the segments with one read per contiguous run.
        name: Read
        params: |2

          	_ context.Context, partition int, from corestream.Offset, maxEntries int,
        recv: m *fileStream
        results: "[]corestream.EntryValue, error"
      - doc: firstOf returns part's first readable offset now.
        name: firstOf
        params: part *filePart
        recv: m *fileStream
        results: corestream.Offset
      - doc: Bounds returns partition's first retained offset and its next one.
        name: Bounds
        params: _ context.Context, partition int
        recv: m *fileStream
        results: corestream.BoundsValue, error
      - doc: |-
          OffsetAt returns partition's first offset appended at or after t: a
          search of the batches' instants, which the index keeps.
        name: OffsetAt
        params: |2

          	_ context.Context, partition int, t time.Time,
        recv: m *fileStream
        results: corestream.Offset, error
      - doc: Wake returns the channel the next Append closes.
        name: Wake
        recv: m *fileStream
        results: <-chan struct{}
      - doc: |-
          reserve waits until size more bytes fit under PolicyValue.MaxBytes, then
          counts them as held, and returns the partition the batch goes to: its
          keys', or the next in turn for an unkeyed one. On a refusal nothing is
          reserved.

          Room appears only when records are released — by the age bound, by Trim,
          by the byte bound of another Append — so it waits for whichever comes
          first: a release (room), the oldest record reaching its age, the end of
          BlockTimeout, or ctx. It is the memory engine's wait, on this engine's
          index.
        name: reserve
        params: ctx context.Context, size int64, partition int, keyed bool
        recv: m *fileStream
        results: int, error
      - doc: |-
          expireAll claims, in every partition, the records past RetainFor at now,
          and returns the bytes still held. The caller holds m.mu; the storage is
          released by the partition's next Append or Trim.
        name: expireAll
        params: now time.Time
        recv: m *fileStream
        results: int64
      - doc: |-
          untilExpiry returns how long until the oldest retained record of any
          partition expires, capped at limit. The caller holds m.mu.
        name: untilExpiry
        params: now time.Time, limit time.Duration
        recv: m *fileStream
        results: time.Duration
      - doc: await waits for room, for wait on the stream's clock, or for ctx.
        name: await
        params: ctx context.Context, room <-chan struct{}, wait time.Duration
        recv: m *fileStream
        results: error
      - doc: |-
          Trim makes before the first offset partition retains: at once in the
          index, durably by a drop record, and on the device by unlinking every
          sealed segment that then holds nothing readable.
        name: Trim
        params: _ context.Context, partition int, before corestream.Offset
        recv: m *fileStream
        results: error
      - doc: trim is Trim on part, whose wmu the caller holds.
        name: trim
        params: part *filePart, before corestream.Offset
        recv: m *fileStream
        results: freed int64, err error
    name: fileStream
  - fields:
      - doc: |-
          Clock stamps [corestream.EntryValue].AppendedAt, ages records for
          [corestream.PolicyValue].RetainFor, and times the wait
          [corestream.PolicyValue].BlockTimeout allows. The instants are kept
          in the segments, so a stream reopened on another clock ages its
          records by that one. Nil means clock.System.
        name: Clock
        type: clock.Timed
      - doc: |-
          Dir is the stream directory: one segmented log per partition under
          p<partition>/, the groups' cursors under cursors/. It is created
          owner-only when absent, refused when it exists and an account
          outside the owner and group could replace its entries, and its
          subdirectories are refused besides when one is a symbolic link, not a
          directory, or writable by such an account at all — the queue's rule
          (on Windows, read from the access-control list). One engine at a time
          opens a directory: a second, in this process or another, is refused
          while the first is open.
        name: Dir
        type: string
      - doc: |-
          Policy is what the stream enforces; its zero value works. Its
          Partitions cannot shrink across a reopen: a directory holding a
          partition the policy no longer counts is refused.
        name: Policy
        type: corestream.PolicyValue
    kind: struct
    name: FileConfig
  - doc: batchMark is where one batch starts and the instant it was stamped with.
    fields:
      - name: first
        type: corestream.Offset
      - name: stamp
        type: int64
    kind: struct
    name: batchMark
  - doc: |-
      filePart is one partition of a file stream: its segmented log, and the
      index of what the log holds that retention, OffsetAt and the byte bounds
      read without touching the disk.
    fields:
      - name: log
        type: "*seglog.Log"
      - doc: |-
          broken is the write failure that stopped this partition. A batch a
          failure cut short may still be pending in the log, so nothing is ever
          appended after it. Guarded by wmu.
        name: broken
        type: error
      - doc: |-
          scratch is the encoding buffer of the batch being written. Guarded by
          wmu.
        name: scratch
        type: "[]byte"
      - doc: |-
          prefix[i] is the bytes, keys and payloads, of the records from base up
          to base+i excluded; len(prefix)-1 records are indexed.
        name: prefix
        type: "[]int64"
      - doc: |-
          batches holds every indexed batch from the one holding base on, in
          offset order, which is also the order of their instants.
        name: batches
        type: "[]batchMark"
      - doc: base is the offset prefix[0] stands for.
        name: base
        type: corestream.Offset
      - doc: |-
          kept is the first offset retention, Trim or the byte bound have
          claimed for good; the age bound may claim more at read time.
        name: kept
        type: corestream.Offset
      - doc: |-
          mu guards the index. Readers hold it shared and never across a disk
          write: an Append updates the index after its sync.
        name: mu
        type: sync.RWMutex
      - doc: |-
          wmu serialises the partition's writers, Append and Trim, across their
          write and sync.
        name: wmu
        type: sync.Mutex
    kind: struct
    methods:
      - doc: |-
          next returns the offset the partition's next record takes. The caller
          holds mu, or wmu.
        name: next
        recv: p *filePart
        results: corestream.Offset
      - doc: |-
          lastBatch returns the first offset of the newest batch, next when there
          is none. The caller holds mu, or wmu.
        name: lastBatch
        recv: p *filePart
        results: corestream.Offset
      - doc: |-
          between returns the bytes of the records from lo up to hi excluded, both
          within [base, next]. The caller holds mu, or wmu.
        name: between
        params: lo, hi corestream.Offset
        recv: p *filePart
        results: int64
      - doc: |-
          first returns the first offset still readable at now: that of the oldest
          batch still younger than retainFor, next when every one is older, never
          below kept. Zero retainFor keeps every record. The caller holds mu, or wmu.
        name: first
        params: now time.Time, retainFor time.Duration
        recv: p *filePart
        results: corestream.Offset
      - doc: |-
          bounded returns the first offset the byte bound keeps when size more bytes
          follow next: the lowest offset from lo on whose suffix fits retainBytes,
          never past limit — the newest batch, which its own Append never trims.
          Zero retainBytes is unbounded. The caller holds mu, or wmu.
        name: bounded
        params: lo, limit corestream.Offset, size, retainBytes int64
        recv: p *filePart
        results: corestream.Offset
      - doc: |-
          index records a batch of sizes, stamped at stamp, as the records from next
          on, and claims everything below claim. It returns the bytes the claim
          released. The caller holds mu exclusively, and wmu.
        name: index
        params: stamp int64, sizes []int64, claim corestream.Offset
        recv: p *filePart
        results: freed int64
      - doc: |-
          claim makes to the first offset retained for good and returns the bytes it
          released; at or below kept it changes nothing. The caller holds mu
          exclusively.
        name: claim
        params: to corestream.Offset
        recv: p *filePart
        results: freed int64
      - doc: compact lets the index forget what lies far enough below kept.
        name: compact
        recv: p *filePart
      - doc: |-
          offsetAt returns the first offset at or past from whose batch was stamped
          at or after t, next when none was. The caller holds mu.
        name: offsetAt
        params: from corestream.Offset, t time.Time
        recv: p *filePart
        results: corestream.Offset
      - doc: |-
          oldestStamp returns the instant of the batch holding offset from, and
          false when from is next. The caller holds mu.
        name: oldestStamp
        params: from corestream.Offset
        recv: p *filePart
        results: int64, bool
      - doc: |-
          rebuild reads the whole log once and indexes it: every record's size,
          every batch's first offset and instant. A batch whose head a Trim dropped
          starts at the log's first record, a tail. It returns the latest instant
          seen, so the engine's stamps keep never going backwards across a restart.
        name: rebuild
        recv: p *filePart
        results: latest int64, err error
    name: filePart
  - doc: |-
      memPartition is one partition of a memory stream: its retained entries, in
      offset order, and the offset of the first of them.
    fields:
      - doc: entries holds the retained records; entries[i].Offset is first + i.
        name: entries
        type: "[]corestream.EntryValue"
      - doc: |-
          first is the lowest offset still readable. Trimming raises it; nothing
          lowers it, and it stays put when entries is empty, so the next offset
          (first + len(entries)) never moves back.
        name: first
        type: corestream.Offset
      - doc: bytes is the key and payload bytes the retained entries hold.
        name: bytes
        type: int64
    kind: struct
    methods:
      - doc: next returns the offset the partition's next record will take.
        name: next
        recv: p *memPartition
        results: corestream.Offset
    name: memPartition
  - doc: cursorKey names one group's cursor on one partition.
    fields:
      - name: group
        type: string
      - name: partition
        type: int
    kind: struct
    name: cursorKey
  - doc: |-
      memoryStream is a stream that lives entirely in one process's heap.

      # What it is for, and what it is not

      It is the test double. A consumer's suite gets the port's semantics —
      contiguous offsets, per-key placement, retention, every refusal — with no
      directory and no flush, and the conformance suite holds it to the same
      cases as every durable engine, so it cannot drift from them. It is NOT a
      durable stream: a restart is a total loss. Use the file or the SQL engine.

      Retention by age is LAZY, as on the file engine: nothing here runs a timer.
      A read computes the first record still young enough and skips the rest; an
      Append, a Trim or a backpressure wait removes them for good.
    fields:
      - doc: |-
          last is the latest instant a batch was stamped with: AppendedAt never
          goes backwards, so a partition's entries stay sorted by it and
          OffsetAt and the age retention can binary-search them.
        name: last
        type: time.Time
      - name: clk
        type: clock.Timed
      - doc: wake is closed by every Append (corestream.Waker).
        name: wake
        type: "*wakeSignal"
      - doc: |-
          room is closed whenever records are removed, which is what an Append
          waiting under PolicyValue.MaxBytes waits for.
        name: room
        type: "*wakeSignal"
      - doc: cursors holds every group's committed offset (corestream.Committer).
        name: cursors
        type: map[cursorKey]corestream.Offset
      - name: parts
        type: "[]memPartition"
      - name: policy
        type: corestream.PolicyValue
      - doc: held is the bytes every partition retains, the figure MaxBytes bounds.
        name: held
        type: int64
      - doc: turn is the partition the next unkeyed batch goes to.
        name: turn
        type: int
      - doc: |-
          mu is an RWMutex because Read, Bounds, OffsetAt and Committed are
          genuine reads: retention by age is computed, not applied, under it.
        name: mu
        type: sync.RWMutex
    kind: struct
    methods:
      - doc: Partitions returns how many partitions the stream has.
        name: Partitions
        recv: m *memoryStream
        results: int
      - doc: Append writes records to one partition as one batch.
        name: Append
        params: |2

          	ctx context.Context, records []corestream.RecordValue,
        recv: m *memoryStream
        results: corestream.AppendValue, error
      - doc: |-
          store copies records into partition as one batch stamped with one instant,
          then applies RetainBytes to that partition. The caller holds the lock.
        name: store
        params: |2

          	partition int, records []corestream.RecordValue, size int64,
        recv: m *memoryStream
        results: corestream.AppendValue
      - doc: |-
          stamp returns the instant the batch being appended is stamped with: the
          clock's, or the last stamp when the clock went backwards.
        name: stamp
        recv: m *memoryStream
        results: time.Time
      - doc: Commit records next as the offset group reads next on partition.
        name: Commit
        params: |2

          	_ context.Context, group string, partition int, next corestream.Offset,
        recv: m *memoryStream
        results: error
      - doc: Committed returns the offset group committed last on partition.
        name: Committed
        params: |2

          	_ context.Context, group string, partition int,
        recv: m *memoryStream
        results: corestream.Offset, error
      - doc: checkPartition refuses a partition outside [0, Partitions()).
        name: checkPartition
        params: partition int
        recv: m *memoryStream
        results: error
      - doc: |-
          retained returns the offset of partition's first record still young enough
          to read at now, and the index of that record in its entries. The caller
          holds the lock, shared or exclusive.
        name: retained
        params: part *memPartition, now time.Time
        recv: m *memoryStream
        results: corestream.Offset, int
      - doc: |-
          expired returns how many of partition's oldest entries are past
          PolicyValue.RetainFor at now: a record expires once its age reaches the
          bound. The entries are sorted by AppendedAt (stamp), so it is a search.
        name: expired
        params: part *memPartition, now time.Time
        recv: m *memoryStream
        results: int
      - doc: Read returns up to maxEntries entries of partition from offset from on.
        name: Read
        params: |2

          	_ context.Context, partition int, from corestream.Offset, maxEntries int,
        recv: m *memoryStream
        results: "[]corestream.EntryValue, error"
      - doc: Bounds returns partition's first retained offset and its next one.
        name: Bounds
        params: _ context.Context, partition int
        recv: m *memoryStream
        results: corestream.BoundsValue, error
      - doc: OffsetAt returns partition's first offset appended at or after t.
        name: OffsetAt
        params: |2

          	_ context.Context, partition int, t time.Time,
        recv: m *memoryStream
        results: corestream.Offset, error
      - doc: Wake returns the channel the next Append closes.
        name: Wake
        recv: m *memoryStream
        results: <-chan struct{}
      - doc: |-
          reserve waits until size more bytes fit under PolicyValue.MaxBytes and
          returns with the lock held; on a refusal it returns with the lock released.

          Room appears only when records are removed — by retention by age, by Trim —
          so it waits for whichever comes first: a removal (room), the oldest record
          reaching its age, the end of BlockTimeout, or ctx.
        name: reserve
        params: ctx context.Context, size int64
        recv: m *memoryStream
        results: error
      - doc: |-
          untilExpiry returns how long until the oldest retained record of any
          partition expires, capped at limit. The caller holds the lock.
        name: untilExpiry
        params: now time.Time, limit time.Duration
        recv: m *memoryStream
        results: time.Duration
      - doc: await waits for room, for wait on the stream's clock, or for ctx.
        name: await
        params: ctx context.Context, room <-chan struct{}, wait time.Duration
        recv: m *memoryStream
        results: error
      - doc: |-
          expireAll removes, from every partition, the records past RetainFor at
          now. The caller holds the lock exclusively.
        name: expireAll
        params: now time.Time
        recv: m *memoryStream
      - doc: |-
          retainBytes removes part's oldest records while it holds more than
          PolicyValue.RetainBytes, sparing the newest batch of fresh records: a
          batch just acknowledged as appended is never trimmed by its own Append.
        name: retainBytes
        params: part *memPartition, fresh int
        recv: m *memoryStream
      - doc: |-
          drop removes part's count oldest records, releasing their bytes, and wakes
          an Append waiting for room. The caller holds the lock exclusively.
        name: drop
        params: part *memPartition, count int
        recv: m *memoryStream
      - doc: Trim makes before the first offset partition retains.
        name: Trim
        params: _ context.Context, partition int, before corestream.Offset
        recv: m *memoryStream
        results: error
    name: memoryStream
  - fields:
      - doc: |-
          Clock stamps [corestream.EntryValue].AppendedAt, ages records for
          [corestream.PolicyValue].RetainFor, and times the wait
          [corestream.PolicyValue].BlockTimeout allows, so a test drives
          retention and backpressure with a ManualClock and no sleeping. Nil
          means clock.System.
        name: Clock
        type: clock.Timed
      - doc: |-
          Policy is what the stream enforces. Its zero value works: one
          partition, records of up to corestream.DefaultMaxRecordBytes, kept
          forever, never full.
        name: Policy
        type: corestream.PolicyValue
    kind: struct
    name: MemoryConfig
  - doc: |-
      sqlStreamKey names one stream for the process's wake table: the database
      pool and the records' table. Two engines over both are one stream.
    fields:
      - doc: pool is the executor a context with no transaction runs on.
        name: pool
        type: coresql.Executor
      - doc: table is the records' table.
        name: table
        type: string
    kind: struct
    name: sqlStreamKey
  - doc: |-
      sqlStream is a stream kept in three tables of the caller's own database.

      # Why the caller's database, and what that buys

      An Append joins the transaction its context carries (ADR 0151), so its
      records exist if and only if that transaction commits: the outbox, for a
      log. A Commit does the same, so a handler that commits its group's offset
      on its own transaction's context has its effect and its offset in one
      commit — exactly-once in effect.

      # Why offsets commit in order

      The head row of a partition is locked by the Append's first statement and
      held until its transaction ends, so a second appender of that partition
      waits for the first to commit or roll back and then reads the next offset
      the first left. Offsets are therefore assigned in commit order, and a
      reader never sees offset n+1 committed while n is not — it cannot skip a
      record that commits later. Appenders of different partitions do not wait
      on one another.
    fields:
      - name: tm
        type: coresql.Transactor
      - name: clk
        type: clock.Clock
      - name: tx
        type: sqlParts
      - doc: |-
          wake is shared by every engine over the same pool and table in this
          process.
        name: wake
        type: "*wakeSignal"
      - doc: table is the records' table, which every storage failure names.
        name: table
        type: string
      - doc: |-
          swept is, per partition, when this engine last released its expired
          records, in Unix nanoseconds on its clock.
        name: swept
        type: "[]atomic.Int64"
      - name: stmts
        type: sqlStatements
      - name: own
        type: coresql.TxOptionsValue
      - name: policy
        type: corestream.PolicyValue
      - doc: turn counts the unkeyed batches, which go to the partitions in turn.
        name: turn
        type: atomic.Uint64
    kind: struct
    methods:
      - doc: Partitions returns how many partitions the stream has.
        name: Partitions
        recv: s *sqlStream
        results: int
      - doc: |-
          Append writes records to one partition as one batch, in the transaction its
          context carries or in one of its own.
        name: Append
        params: |2

          	ctx context.Context, records []corestream.RecordValue,
        recv: s *sqlStream
        results: corestream.AppendValue, error
      - doc: |-
          write sends an Append's statements on ex: the head locked, then read, the
          records inserted a chunk at a time, the head moved past them. Every record
          of the batch is stamped with one instant, never before the partition's
          previous batch.
        name: write
        params: |2

          	ctx context.Context, ex coresql.Executor, partition int, records []corestream.RecordValue, now int64,
        recv: s *sqlStream
        results: corestream.AppendValue, error
      - doc: |-
          run runs a call's statements where they belong, as the queue's SQL broker
          does (ADR 0151): inside the caller's transaction every call is a savepoint
          of it, so its failure undoes it alone and leaves that transaction usable;
          outside one, a call of several statements runs in a transaction of the
          engine's own, and a call of one statement on the pool.
        name: run
        params: ctx context.Context, several bool, work coresql.TxFunc
        recv: s *sqlStream
        results: error
      - doc: |-
          announce wakes this stream's readers once the transaction ctx carries has
          committed — at once when the call ran in a transaction of its own, which
          has.
        name: announce
        params: ctx context.Context
        recv: s *sqlStream
      - doc: |-
          failed is StreamBackendFailed for step, with the driver's error beside it
          and its text withheld by service/data/sql's Withheld: JOINED rather than
          wrapped, so the verdict's code stays the origin whatever the driver's chain
          holds, and a record's bytes a driver quotes never reach a rendering.
        name: failed
        params: step string, cause error
        recv: s *sqlStream
        results: error
      - doc: |-
          cutoff returns the instant a record must be appended after to be readable
          at now: RetainFor before now, or the dawn of int64 with no age bound.
        name: cutoff
        params: now time.Time
        recv: s *sqlStream
        results: int64
      - doc: |-
          Commit records next as the offset group reads next on partition, in the
          transaction its context carries — so a handler that commits on its own
          transaction's context commits its effect and its offset together — or on
          the pool.

          The partition's next offset is read first, unlocked: it only ever grows, so
          a next at or below the value read is at or below the true one.
        name: Commit
        params: |2

          	ctx context.Context, group string, partition int, next corestream.Offset,
        recv: s *sqlStream
        results: error
      - doc: headNext reads partition's next offset, zero for a partition never written.
        name: headNext
        params: ctx context.Context, partition int
        recv: s *sqlStream
        results: corestream.Offset, error
      - doc: Committed returns the offset group committed last on partition.
        name: Committed
        params: |2

          	ctx context.Context, group string, partition int,
        recv: s *sqlStream
        results: corestream.Offset, error
      - doc: checkPartition refuses a partition outside [0, Partitions()).
        name: checkPartition
        params: partition int
        recv: s *sqlStream
        results: error
      - doc: |-
          Read returns up to maxEntries entries of partition from offset from on, in
          ONE unlocked statement on the executor the context's transaction joins —
          the pool outside one.

          The statement answers the head's next offset beside the readable records
          from from on. Records are stored contiguously from the head's floor and
          stamped in offset order, so the readable ones are a suffix: when the first
          row returned is past from, from was trimmed or expired, and that row is the
          first retained offset; when no record is returned, the partition holds
          nothing readable at or after from, and its next offset is the first
          retained.
        name: Read
        params: |2

          	ctx context.Context, partition int, from corestream.Offset, maxEntries int,
        recv: s *sqlStream
        results: "[]corestream.EntryValue, error"
      - doc: |-
          scanEntries reads the rows of the read statement: the head's next offset on
          each, a record on each but the lone row of a partition with none readable.
          A partition never written has no head row, and its next offset is zero.
        name: scanEntries
        params: |2

          	rows *stdsql.Rows, partition, maxEntries int,
        recv: s *sqlStream
        results: entries []corestream.EntryValue, next corestream.Offset, err error
      - doc: Bounds returns partition's first retained offset and its next one.
        name: Bounds
        params: ctx context.Context, partition int
        recv: s *sqlStream
        results: corestream.BoundsValue, error
      - doc: OffsetAt returns partition's first readable offset appended at or after t.
        name: OffsetAt
        params: |2

          	ctx context.Context, partition int, t time.Time,
        recv: s *sqlStream
        results: corestream.Offset, error
      - doc: |-
          headAndLowest runs a statement answering the head's next offset and the
          lowest offset matching it, and resolves a partition with no head, or no
          matching record, to its next offset.
        name: headAndLowest
        params: |2

          	ctx context.Context, statement, step string, args ...any,
        recv: s *sqlStream
        results: next, lowest corestream.Offset, err error
      - doc: |-
          Wake returns the channel the next committed Append through any engine over
          this stream in this process closes.
        name: Wake
        recv: s *sqlStream
        results: <-chan struct{}
      - doc: |-
          Trim makes before the first offset partition retains.

          The head's floor is raised in one statement under the head's lock, so every
          record below before is unreadable from the commit of that statement — at
          once outside a transaction, at the caller's commit inside one. The rows
          themselves are then deleted in bounded statements, each a savepoint of the
          caller's transaction or a statement of its own: a failure there leaves rows
          nobody can read, which the next Trim or age sweep deletes.
        name: Trim
        params: ctx context.Context, partition int, before corestream.Offset
        recv: s *sqlStream
        results: error
      - doc: |-
          raiseFloor locks partition's head, refuses a before past its next offset,
          and raises its floor to before when that is higher. It reports whether the
          floor moved.
        name: raiseFloor
        params: |2

          	ctx context.Context, ex coresql.Executor, partition int, before corestream.Offset,
        recv: s *sqlStream
        results: bool, error
      - doc: |-
          release deletes partition's stored records below target, at most
          sqlOffsetsPerDelete offsets per statement, from the lowest stored one up.
          Every record it deletes is already unreadable.
        name: release
        params: ctx context.Context, partition int, target int64
        recv: s *sqlStream
        results: error
      - doc: |-
          sweep releases partition's records past RetainFor once its last sweep by
          this engine is older than the sweep period. They are unreadable already —
          every read filters them by age — so a sweep only gives their storage back,
          and a sweep that fails is retried by the next one due: an Append that
          committed is not reported as failed for it.
        name: sweep
        params: ctx context.Context, partition int, now time.Time
        recv: s *sqlStream
    name: sqlStream
  - fields:
      - doc: |-
          Transactor is the transaction manager of the database the stream
          lives in — the one the caller's own transactions are opened with, so
          a call made under one of them joins it. It must also be a
          core/data/sql Joiner and Deferrer, which the SDK's own transactor
          is: the first is how an Append or a Commit joins the caller's
          transaction, the second how the Waker fires only once that
          transaction has committed.
        name: Transactor
        type: coresql.Transactor
      - doc: |-
          Dialect is the engine's, and must be the Transactor's own: the SQL
          the stream speaks to it.
        name: Dialect
        type: coresql.Dialect
      - doc: |-
          Table names the records' table; the heads and the cursors are kept
          in Table__heads and Table__cursors, which [SQLMigration] creates
          with it. It is a lower-case SQL identifier of at most 54 bytes —
          PostgreSQL's 63 less the longest suffix —, words of letters and
          digits joined by single underscores, starting with a letter and not
          with "sqlite_". Two streams over one database and one Table, in one
          process or in twenty, are ONE stream.
        name: Table
        type: string
      - doc: |-
          Policy is what the stream enforces; its zero value works. Its
          RetainBytes and MaxBytes must be zero: the engine keeps no byte
          count. Its Partitions must stay the same for the life of the
          tables: a key's partition is its hash modulo that number.
        name: Policy
        type: corestream.PolicyValue
      - doc: |-
          Clock stamps [corestream.EntryValue].AppendedAt and ages records for
          [corestream.PolicyValue].RetainFor. The instants are the ENGINE's,
          never the database's NOW(), so a test drives retention with a
          ManualClock; engines in several processes over one table compare
          instants their own clocks wrote, and a batch is never stamped before
          the partition's previous one. Nil means clock.System.
        name: Clock
        type: clock.Clock
    kind: struct
    methods:
      - doc: |-
          validate refuses a configuration no SQL stream could run, before any
          statement is sent, and returns what the engine needs of its transactor.
        name: validate
        recv: c *SQLConfig
        results: sqlParts, error
    name: SQLConfig
  - doc: |-
      sqlParts are the two capabilities the SQL engine needs of its transactor,
      found once at NewSQL.
    fields:
      - doc: join says where a statement issued under a context runs.
        name: join
        type: coresql.Joiner
      - doc: hold keeps a wake until the transaction an Append joined commits.
        name: hold
        type: coresql.Deferrer
    kind: struct
    name: sqlParts
  - doc: |-
      sqlStatements are the statements one SQL stream sends, rendered once for
      its dialect and tables at NewSQL; only an INSERT shorter than a full chunk
      is rendered per call.

      The records' table keeps one row per record, keyed (part, record_offset).
      The heads table keeps one row per partition that was ever written: the
      next offset, the floor below which Trim made every record unreadable, and
      the instant of the last batch — the row an Append locks, which serialises
      the appenders of one partition so its offsets commit in order. The cursors
      table keeps one row per group and partition, the group keyed by its
      SHA-256 so no group name is too long for a key.
    fields:
      - doc: |-
          lockHead creates the partition's head row when it is missing and
          locks it in every case: an upsert whose update writes the row back as
          it is. It is the Append's and the Trim's first statement, so on
          SQLite it is also the write that takes the database's write lock
          before anything is read (ADR 0140).
        name: lockHead
        type: string
      - doc: "head reads the locked head row: next offset, floor, last instant."
        name: head
        type: string
      - doc: insertFull inserts a full chunk of sqlRowsPerStatement records.
        name: insertFull
        type: string
      - doc: advance moves the head past a batch and records its instant.
        name: advance
        type: string
      - doc: floor raises the head's floor to a Trim's offset.
        name: floor
        type: string
      - doc: |-
          read reads the head and up to a bound of records from an offset, one
          unlocked statement: the head row LEFT JOINed with the readable
          records, so a partition with no record still answers its next offset.
        name: read
        type: string
      - doc: bounds reads the head's next offset and the lowest readable record.
        name: bounds
        type: string
      - doc: |-
          offsetAt reads the head's next offset and the lowest readable record
          appended at or after an instant.
        name: offsetAt
        type: string
      - doc: lowest reads the lowest offset a partition still stores.
        name: lowest
        type: string
      - doc: release deletes a partition's records below an offset.
        name: release
        type: string
      - doc: headNext reads a partition's next offset, unlocked.
        name: headNext
        type: string
      - doc: commit writes a group's cursor, replacing the one it had.
        name: commit
        type: string
      - doc: committed reads a group's cursor.
        name: committed
        type: string
      - doc: records is the records' quoted table.
        name: records
        type: string
      - doc: dialect selects the placeholder grammar of the per-call INSERT.
        name: dialect
        type: coresql.Dialect
    kind: struct
    methods:
      - doc: insertRows renders the insertion of n records, five placeholders each.
        name: insertRows
        params: n int
        recv: s *sqlStatements
        results: string
      - doc: |-
          insertFor returns the insertion of n records: the full chunk rendered at
          NewSQL, or one rendered now for a shorter one.
        name: insertFor
        params: n int
        recv: s *sqlStatements
        results: string
    name: sqlStatements
  - doc: |-
      subscriber is what every worker of one Subscribe shares; nothing in it
      changes after Subscribe built it.
    fields:
      - name: stream
        type: corestream.Stream
      - name: committer
        type: corestream.Committer
      - doc: waker is the stream's, nil when it has none.
        name: waker
        type: corestream.Waker
      - name: cfg
        type: SubscriberConfig
    kind: struct
    methods:
      - doc: |-
          run is one partition's worker: hold its fence, follow the partition, and
          ask again for a fence lost.
        name: run
        params: ctx context.Context, partition int
        recv: w *subscriber
        results: error
      - doc: |-
          follow reads the partition from the group's offset until ctx ends, the
          fence is lost (nil), or the medium refuses (its error).
        name: follow
        params: ctx context.Context, c *cursor
        recv: w *subscriber
        results: error
      - doc: |-
          start returns the offset the group reads first on partition: the one it
          committed, or the first retained when it never committed.
        name: start
        params: ctx context.Context, partition int
        recv: w *subscriber
        results: corestream.Offset, error
      - doc: |-
          turn reads the batch at the cursor and hands it to the handler, or waits
          when the partition holds nothing past it.
        name: turn
        params: ctx context.Context, c *cursor
        recv: w *subscriber
        results: error
      - doc: |-
          limit is how many records the next Read asks for: one while the cursor is
          inside a batch the park narrowed.
        name: limit
        params: c *cursor
        recv: w *subscriber
        results: int
      - doc: |-
          settle runs the handler over entries and acts on its verdict: the offset
          moves past an accepted batch, a refused one is retried, narrowed or
          parked.
        name: settle
        params: ctx context.Context, c *cursor, entries []corestream.EntryValue
        recv: w *subscriber
        results: error
      - doc: |-
          handle runs the handler, a panic read as a refusal, and reports whether it
          accepted the batch.
        name: handle
        params: ctx context.Context, entries []corestream.EntryValue
        recv: w *subscriber
        results: accepted bool
      - doc: |-
          advance commits past as the group's next offset on the cursor's partition
          and moves the cursor there; a fence that cannot be renewed first leaves
          both where they are.
        name: advance
        params: ctx context.Context, c *cursor, past corestream.Offset
        recv: w *subscriber
        results: error
      - doc: sleep waits for the first of ctx's end, signal and d on the clock.
        name: sleep
        params: ctx context.Context, signal <-chan struct{}, d time.Duration
        recv: w *subscriber
      - doc: |-
          settled runs call on ctx without its cancellation, bounded by
          SettleTimeout on the clock from the instant ctx ends.
        name: settled
        params: ctx context.Context, call func(context.Context) error
        recv: w *subscriber
        results: error
      - doc: |-
          bound cancels a settling call SettleTimeout after ctx ends, unless it is
          done first.
        name: bound
        params: ctx context.Context, done <-chan struct{}, cancel context.CancelFunc
        recv: w *subscriber
      - doc: fenceName is the lock a worker holds on partition.
        name: fenceName
        params: partition int
        recv: w *subscriber
        results: string
      - doc: |-
          acquire takes the partition's fence once: held false when another process
          holds it. Without a Fence every partition is held, by a nil fence.
        name: acquire
        params: ctx context.Context, partition int
        recv: w *subscriber
        results: "*heldFence, bool, error"
      - doc: |-
          renew renews fence when its renewal is due and reports whether it is still
          held; no fence is always held.
        name: renew
        params: ctx context.Context, fence *heldFence
        recv: w *subscriber
        results: bool
      - doc: |-
          bounded shortens a wait of d to the fence's next renewal, so a long wait
          never outlasts the lease it is held under.
        name: bounded
        params: d time.Duration, fence *heldFence
        recv: w *subscriber
        results: time.Duration
      - doc: |-
          release gives the fence up, bounded past a stop; a lease already lost
          releases nothing, which is not a failure.
        name: release
        params: ctx context.Context, fence *heldFence
        recv: w *subscriber
      - doc: |-
          narrowOrPark acts on a batch refused Park.After times: a batch of several
          records is narrowed to its first, so the record that fails is found one
          at a time; a single record is parked and the group's offset committed
          past it.
        name: narrowOrPark
        params: ctx context.Context, c *cursor, entries []corestream.EntryValue
        recv: w *subscriber
        results: error
      - doc: "park publishes entry to the park's queue as a dead letter: its JSON."
        name: park
        params: ctx context.Context, entry corestream.EntryValue
        recv: w *subscriber
        results: error
    name: subscriber
  - doc: cursor is one worker's position on its partition.
    fields:
      - doc: fence is the lease the worker reads under, nil without a Fence.
        name: fence
        type: "*heldFence"
      - doc: retryAt is when a refused batch may be delivered again.
        name: retryAt
        type: time.Time
      - doc: |-
          narrowUntil is the offset below which batches are one record: the
          end of a batch the park narrowed.
        name: narrowUntil
        type: corestream.Offset
      - name: partition
        type: int
      - doc: next is the offset read next.
        name: next
        type: corestream.Offset
      - doc: failures counts the consecutive refusals of the batch at next.
        name: failures
        type: int
    kind: struct
    name: cursor
  - kind: named
    name: CommitMode
    underlying: uint8
  - kind: named
    name: Handler
    underlying: func(ctx context.Context, entries []corestream.EntryValue) error
  - fields:
      - doc: |-
          After is how many consecutive refusals park a record: a batch
          refused After times is narrowed to its first record, and a record
          refused After times alone is parked. Below 1 it is read as 1.
        name: After
        type: int
      - doc: |-
          Broker is the queue the dead letters are published to. It must be
          non-nil; its MaxMessageBytes must hold the JSON of the largest
          record, or the park is refused and Subscribe returns that refusal.
        name: Broker
        type: corequeue.Broker
    kind: struct
    name: ParkConfig
  - fields:
      - doc: |-
          BatchSize is the most records one Read hands the handler. Below 1
          it is read as 1.
        name: BatchSize
        type: int
      - doc: |-
          Clock times the idle wait, the retry wait, the bound on what is sent
          past a stop and the fence's renewals. Nil means clock.System;
          nothing in the subscriber calls time.Sleep.
        name: Clock
        type: clock.Timed
      - doc: |-
          Commit is who moves the offset past an accepted batch:
          [CommitAfterHandler], the zero, or [CommitByHandler]. Any other
          value is refused.
        name: Commit
        type: CommitMode
      - doc: |-
          Fence, when set, makes each worker hold the lock
          "stream:<Name>:<Group>:<partition>" while it reads its partition,
          so the same group in two processes never reads one partition
          twice at once. Nil fences nothing: one process runs the group.
        name: Fence
        type: corelock.Locker
      - doc: |-
          Group names the consumer group whose offsets are read and
          committed. It must not be empty; two groups over one stream read
          every record each, at their own pace.
        name: Group
        type: string
      - doc: Handler processes each batch. It must be non-nil.
        name: Handler
        type: Handler
      - doc: |-
          HandlerIsIdempotent asserts, in code, that Handler is safe to run
          more than once for the same records. It must be true; its zero is
          refused, as queue.ConsumerConfig's is: under [CommitAfterHandler]
          a batch is delivered at least once, and under [CommitByHandler]
          the assertion is that the handler's effect and its commit are one
          transaction, which the SDK cannot see either.
        name: HandlerIsIdempotent
        type: bool
      - doc: |-
          Name names the stream in the fence's lock names. It is required
          when Fence is set, and read for nothing else.
        name: Name
        type: string
      - doc: |-
          Park, when set, sends a record its handler keeps refusing to a
          queue and moves past it. Nil retries forever: the partition stays
          blocked until the handler accepts.
        name: Park
        type: "*ParkConfig"
      - doc: |-
          Partitions are the partitions this subscriber reads, one worker
          each: static assignment, two processes splitting a group naming
          disjoint sets (or both every partition, under Fence). Empty means
          every partition of the stream; a partition outside it, or named
          twice, is refused.
        name: Partitions
        type: "[]int"
      - doc: |-
          PollInterval bounds how long an idle worker waits before reading
          again: the stream's Waker ends the wait at once on an Append in this
          process, so it bounds only what another process appended. Zero, or
          negative, means 100 ms.
        name: PollInterval
        type: time.Duration
      - doc: |-
          Retry is the wait between two deliveries of a refused batch, its
          attempt counting the consecutive refusals. A zero BaseDelay means
          100 ms doubling to 30 s with a fifth of jitter: a curve with no wait
          would spin on a failing handler.
        name: Retry
        type: backoff.Value
      - doc: |-
          SettleTimeout bounds each commit, dead letter and fence release
          sent once ctx has ended, on Clock. Zero, or negative, means 5 s.
        name: SettleTimeout
        type: time.Duration
    kind: struct
    methods:
      - doc: |-
          validate refuses a subscriber that could never run correctly over a stream
          of partitions partitions.
        name: validate
        params: partitions int
        recv: c SubscriberConfig
        results: error
      - doc: missing names the first required field c lacks, or returns "".
        name: missing
        recv: c SubscriberConfig
        results: string
      - doc: |-
          normalized resolves the clamped fields, the partitions included, so every
          worker reads the same numbers.
        name: normalized
        params: partitions int
        recv: c SubscriberConfig
        results: SubscriberConfig
    name: SubscriberConfig
  - doc: heldFence is the lease a worker reads its partition under.
    fields:
      - name: lease
        type: corelock.Lease
      - doc: |-
          renewAt is when the lease is renewed next; zero for a lease that
          cannot expire, which is never renewed.
        name: renewAt
        type: time.Time
      - doc: every is the time between two renewals.
        name: every
        type: time.Duration
    kind: struct
    name: heldFence
  - doc: |-
      wakeSignal is a broadcast: every reader waiting on the channel wakes when it
      is closed, and a fresh channel is armed for the next wait. A channel closed
      and replaced, rather than one value sent, is what makes it a broadcast — a
      send wakes one receiver and is lost if nobody is receiving. It is
      internal/service/data/queue's wakeSignal without the due instant, which a
      stream has no use for: no record of a stream becomes readable on its own.
    fields:
      - doc: ch is the channel handed out until the next fire.
        name: ch
        type: chan struct{}
      - name: mu
        type: sync.Mutex
    kind: struct
    methods:
      - doc: current returns the channel the next fire will close.
        name: current
        recv: w *wakeSignal
        results: <-chan struct{}
      - doc: fire wakes every reader waiting on the current channel and arms the next.
        name: fire
        recv: w *wakeSignal
    name: wakeSignal
vars:
  - doc: |-
      The file engine answers the port, four of its siblings and io.Closer;
      Compactor is #824's.
    grouped: true
    items:
      - name: _
        type: corestream.Stream
        value: (*fileStream)(nil)
      - name: _
        type: corestream.Waker
        value: (*fileStream)(nil)
      - name: _
        type: corestream.Seeker
        value: (*fileStream)(nil)
      - name: _
        type: corestream.Trimmer
        value: (*fileStream)(nil)
      - name: _
        type: corestream.Committer
        value: (*fileStream)(nil)
      - name: _
        type: io.Closer
        value: (*fileStream)(nil)
    name: _
  - doc: |-
      The memory engine answers the port and four of its siblings; Compactor is
      left to the engines that keep segments or rows to rewrite (#824).
    grouped: true
    items:
      - name: _
        type: corestream.Stream
        value: (*memoryStream)(nil)
      - name: _
        type: corestream.Waker
        value: (*memoryStream)(nil)
      - name: _
        type: corestream.Seeker
        value: (*memoryStream)(nil)
      - name: _
        type: corestream.Trimmer
        value: (*memoryStream)(nil)
      - name: _
        type: corestream.Committer
        value: (*memoryStream)(nil)
    name: _#2
  - doc: |-
      sqlWakes is the process's table of SQL streams, so every engine over one
      stream in this process wakes the readers of every other.
    items:
      - name: sqlWakes
        value: |-
          struct {
          	signals map[sqlStreamKey]*wakeSignal
          	mu      sync.Mutex
          }{signals: map[sqlStreamKey]*wakeSignal{}}
    name: sqlWakes
  - doc: |-
      The SQL engine answers the port and four of its siblings; Compactor is
      left to #824.
    grouped: true
    items:
      - name: _
        type: corestream.Stream
        value: (*sqlStream)(nil)
      - name: _
        type: corestream.Waker
        value: (*sqlStream)(nil)
      - name: _
        type: corestream.Seeker
        value: (*sqlStream)(nil)
      - name: _
        type: corestream.Trimmer
        value: (*sqlStream)(nil)
      - name: _
        type: corestream.Committer
        value: (*sqlStream)(nil)
    name: _#3
  - doc: |-
      sqlTablePattern is the only shape a Table may take: words of lower-case
      letters and digits joined by single underscores. It is interpolated, quoted,
      into every statement — an identifier cannot be a bound parameter — so this
      pattern is the whole defence against an injection; and since it holds no
      double underscore, no stream's table is ever another stream's derived one.
    items:
      - name: sqlTablePattern
        value: regexp.MustCompile(`^[a-z][a-z0-9]*(_[a-z0-9]+)*$`)
    name: sqlTablePattern
