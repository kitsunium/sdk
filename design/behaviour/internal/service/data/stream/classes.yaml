# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: worldWritable is the other-write bit.
    items:
      - name: worldWritable
        type: fs.FileMode
        value: "0o002"
    name: worldWritable
  - doc: |-
      streamDirMode is the mode a stream directory, and each directory below
      it, is created with when absent: owner-only.
    items:
      - name: streamDirMode
        type: fs.FileMode
        value: "0o700"
    name: streamDirMode
  - doc: "fileMode is the mode of the lock file and of every cursor: owner-only."
    items:
      - name: fileMode
        type: fs.FileMode
        value: "0o600"
    name: fileMode
  - doc: |-
      cursorsDir is the directory under the stream directory that holds the
      consumer groups' cursors.
    items:
      - name: cursorsDir
        value: "\"cursors\""
    name: cursorsDir
  - doc: |-
      lockName is the file under the stream directory whose lock the open engine
      holds.
    items:
      - name: lockName
        value: "\"lock\""
    name: lockName
  - doc: rebuildChunk is how many records a reopen reads with one Range.
    items:
      - name: rebuildChunk
        value: "4096"
    name: rebuildChunk
  - doc: |-
      compactAfter is how many offsets below the first retained one the index
      keeps before it lets them go: a copy of the index every so often, rather
      than one per trim.
    items:
      - name: compactAfter
        value: "4096"
    name: compactAfter
  - doc: |-
      The kind byte every record of a file stream carries in its segment: the
      first record of a batch is a head, every other one a tail. Recovery groups
      the records into batches by it, which is what keeps the newest batch out of
      RetainBytes' reach after a restart as before one.
    grouped: true
    items:
      - name: kindHead
        type: uint8
        value: "1"
      - name: kindTail
        type: uint8
        value: "2"
    name: kindHead
  - doc: stampBytes is the size of the instant every record opens with.
    items:
      - name: stampBytes
        value: "8"
    name: stampBytes
  - doc: |-
      recordOverhead bounds what the encoding adds to a record's key and
      payload: the instant and the key's length as a uvarint.
    items:
      - name: recordOverhead
        value: stampBytes + binary.MaxVarintLen64
    name: recordOverhead
  - doc: |-
      maxSegmentPayload is the largest payload kernel/fs/seglog takes in one
      record: one gibibyte less its 28-byte header. A policy whose largest record
      could not fit it is refused at construction, so an Append never fails half
      way through a batch.
    items:
      - name: maxSegmentPayload
        value: 1<<30 - 28
    name: maxSegmentPayload
  - doc: |-
      sqlSweepEvery bounds how often an Append releases a partition's expired
      records: at most once per RetainFor, and at least once a minute.
    items:
      - name: sqlSweepEvery
        type: time.Duration
        value: time.Minute
    name: sqlSweepEvery
  - doc: |-
      sqlHeadsSuffix and sqlCursorsSuffix derive the stream's two other tables
      from its records' table.
    grouped: true
    items:
      - name: sqlHeadsSuffix
        type: string
        value: "\"__heads\""
      - name: sqlCursorsSuffix
        type: string
        value: "\"__cursors\""
    name: sqlHeadsSuffix
  - doc: |-
      sqlMaxTableLen is the longest Table NewSQL accepts, in bytes: PostgreSQL's
      63-byte identifier limit less the longest suffix, so no derived name is
      ever truncated into another table's.
    items:
      - name: sqlMaxTableLen
        type: int
        value: 63 - len(sqlCursorsSuffix)
    name: sqlMaxTableLen
  - doc: |-
      sqlReservedPrefix starts every name SQLite keeps for itself: refused on
      every engine, so a stream moves between them unchanged.
    items:
      - name: sqlReservedPrefix
        type: string
        value: "\"sqlite_\""
    name: sqlReservedPrefix
  - doc: |-
      sqlRecordArgs is how many arguments one record binds in an insertion: its
      partition, offset, instant, key and payload.
    items:
      - name: sqlRecordArgs
        type: int
        value: "5"
    name: sqlRecordArgs
  - doc: |-
      sqlRowsPerStatement bounds how many records one INSERT carries: with five
      arguments each, 199 rows bind 995 parameters, under the 999 an SQLite older
      than 3.32 accepts, so a large batch is several statements rather than one
      the engine refuses.
    items:
      - name: sqlRowsPerStatement
        type: int
        value: "199"
    name: sqlRowsPerStatement
  - doc: |-
      sqlOffsetsPerDelete bounds how many offsets one DELETE of a trimmed or
      expired prefix covers, so a long prefix is released by several short
      statements rather than one that holds its locks for as long as it runs.
    items:
      - name: sqlOffsetsPerDelete
        type: int64
        value: "1024"
    name: sqlOffsetsPerDelete
  - doc: |-
      sqlMigrationPrefix starts the name of every migration SQLMigration builds,
      so a version table read during an incident says what created the tables.
    items:
      - name: sqlMigrationPrefix
        type: string
        value: "\"stream \""
    name: sqlMigrationPrefix
  - doc: |-
      The two ways [Subscribe] moves a group's offset past a batch its handler
      accepted. The zero is the subscriber's own commit, which asks nothing of
      the handler.
    grouped: true
    items:
      - doc: |-
          CommitAfterHandler is the zero CommitMode: once the handler returns nil,
          the subscriber commits the offset after the batch's last record on the
          stream's [corestream.Committer]. A stop or a crash between that return
          and the commit delivers the batch again — at least once, on every engine.
        name: CommitAfterHandler
        type: CommitMode
        value: "0"
      - doc: |-
          CommitByHandler leaves the commit to the handler, which calls the
          stream's [corestream.Committer] Commit itself — the group, the batch's
          partition, the offset after its last record — inside the transaction that
          holds its effect. On the SQL engine the effect and the offset then commit
          or roll back together: exactly-once in effect. On an engine whose cursors
          live apart from the handler's effect — memory, file — it stays at least
          once, the cursor durable after the handler. The subscriber commits
          nothing for a batch the handler accepted, only past a record it parked.
        name: CommitByHandler
        type: CommitMode
        value: "1"
    name: CommitAfterHandler
  - doc: |-
      The values a zero field of SubscriberConfig is read as (ADR 0031: each zero
      has one reading, "no opinion", and each value is defensible for any stream).
    grouped: true
    items:
      - doc: |-
          subscriberPollInterval is the queue consumer's default poll, for the
          queue consumer's reason: a tenth of a second of idle latency for what
          another process appended, the Waker covering this process at once.
        name: subscriberPollInterval
        type: time.Duration
        value: 100 * time.Millisecond
      - doc: subscriberSettleTimeout is the queue consumer's default settle bound.
        name: subscriberSettleTimeout
        type: time.Duration
        value: 5 * time.Second
      - doc: |-
          retryBase, retryCeiling and retryJitter are the curve a zero Retry
          reads as: 100 ms doubling to 30 s, widened by up to a fifth.
        name: retryBase
        type: time.Duration
        value: 100 * time.Millisecond
      - name: retryCeiling
        type: time.Duration
        value: 30 * time.Second
      - name: retryJitter
        type: float64
        value: "0.2"
      - doc: retryMultiplier is the curve's growth factor.
        name: retryMultiplier
        type: float64
        value: "2"
    name: subscriberPollInterval
  - doc: |-
      renewShare is the part of a lease's life after which it is renewed: a
      third, the queue consumer's AutoExtend cadence, so two renewals may fail
      before the lease ends.
    items:
      - name: renewShare
        type: int64
        value: "3"
    name: renewShare
