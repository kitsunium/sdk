package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/data/stream
  name: stream
  purpose: Package stream holds the engines of core/data/stream's [Stream] port — memory, a directory of segments over kernel/fs/seglog, and a SQL table joined to the caller's transaction — and the subscriber that reads a stream on behalf of a consumer group (ADR 0231).
types:
  - doc: |-
      fileStream is a stream kept in a directory: one kernel/fs/seglog log per
      partition, and one file per consumer group's cursor.

      # Durability

      An Append is one seglog batch — its records, and a drop record when
      retention moved — written under one Sync: two fdatasyncs whatever the
      number of records, so a crash keeps all of the batch or none of it.

      # Retention

      Every bound is applied to the offset first, at once: a record past
      RetainFor, beyond RetainBytes or below a Trim is unreadable from that
      instant. The storage follows in whole segments: the Append or the Trim
      that moves the first offset records it in its batch, and every sealed
      segment holding only records below it is unlinked after that batch's sync
      — at the next rotation for the segment being written. The age bound is
      computed at read time, as the memory engine's is, and applied by the next
      Append, Trim or backpressure wait.

      # One engine per directory

      A segmented log has one writer, so the engine holds an exclusive lock on
      <Dir>/lock for its life (kernel/fs/flock): a second open of the directory,
      in this process or another, is refused until Close. The Waker of the open
      engine is therefore the directory's.
    fields:
      - name: clk
        type: clock.Timed
      - name: cursors
        type: corevfs.FullFS
      - name: lock
        type: "*os.File"
      - doc: wake is closed by every Append (corestream.Waker).
        name: wake
        type: "*wakeSignal"
      - doc: |-
          room is closed whenever records are released, which an Append
          waiting under PolicyValue.MaxBytes waits for.
        name: room
        type: "*wakeSignal"
      - name: parts
        type: "[]*filePart"
      - name: policy
        type: corestream.PolicyValue
      - doc: |-
          mu guards the four below. It is taken before a partition's mu, never
          after.
        name: mu
        type: sync.Mutex
      - doc: |-
          held is the bytes every partition retains, the figure MaxBytes
          bounds, the batches being written included.
        name: held
        type: int64
      - doc: |-
          last is the latest instant a batch was stamped with, in Unix
          nanoseconds: AppendedAt never goes backwards, across a restart too.
        name: last
        type: int64
      - doc: turn is the partition the next unkeyed batch goes to.
        name: turn
        type: int
      - name: closed
        type: bool
    kind: struct
    methods:
      - doc: |-
          open opens the cursors' filesystem and every partition's log, and indexes
          what the logs hold.
        name: open
        params: dir string
        recv: m *fileStream
        results: error
      - doc: openPart opens and indexes partition p's log, under p<p>/.
        name: openPart
        params: dir string, p int
        recv: m *fileStream
        results: "*filePart, error"
      - doc: Partitions returns how many partitions the stream has.
        name: Partitions
        recv: m *fileStream
        results: int
      - doc: Append writes records to one partition as one batch, under one sync.
        name: Append
        params: |2

          	ctx context.Context, records []corestream.RecordValue,
        recv: m *fileStream
        results: corestream.AppendValue, error
      - doc: |-
          write encodes records into part's log, syncs them as one batch with the
          retention they move, and indexes them. The caller holds part.wmu.
        name: write
        params: |2

          	part *filePart, partition int, records []corestream.RecordValue, size int64,
        recv: m *fileStream
        results: appended corestream.AppendValue, freed int64, err error
      - doc: |-
          syncBatch makes part's pending batch durable: with a drop record when claim
          is past the log's first index, which also unlinks the sealed segments it
          empties, with a plain sync otherwise.
        name: syncBatch
        params: part *filePart, claim corestream.Offset
        recv: m *fileStream
        results: error
      - doc: |-
          release gives back what an Append's retention freed and, when the
          Append failed, the room it had reserved.
        name: release
        params: freed int64, failed bool, size int64
        recv: m *fileStream
      - doc: |-
          stamp returns the instant, in Unix nanoseconds, the batch being appended
          is stamped with: the clock's, or the last stamp when the clock went
          backwards. The caller holds the partition's wmu, so a partition's batches
          are stamped in their order.
        name: stamp
        recv: m *fileStream
        results: int64
      - doc: usable refuses a call on a closed stream. The caller holds no lock.
        name: usable
        recv: m *fileStream
        results: error
      - doc: |-
          Close closes every partition's log and the cursors' filesystem, then
          releases the directory's lock. It reports the first failure; a second
          Close returns nil.
        name: Close
        recv: m *fileStream
        results: error
      - doc: |-
          Commit records next as the offset group reads next on partition, in a
          file of its own published atomically and durably (vfs.WriteAtomic).
        name: Commit
        params: |2

          	_ context.Context, group string, partition int, next corestream.Offset,
        recv: m *fileStream
        results: error
      - doc: Committed returns the offset group committed last on partition.
        name: Committed
        params: |2

          	_ context.Context, group string, partition int,
        recv: m *fileStream
        results: corestream.Offset, error
      - doc: checkPartition refuses a partition outside [0, Partitions()).
        name: checkPartition
        params: partition int
        recv: m *fileStream
        results: error
      - doc: |-
          Read returns up to maxEntries entries of partition from offset from on,
          read from the segments with one read per contiguous run.
        name: Read
        params: |2

          	_ context.Context, partition int, from corestream.Offset, maxEntries int,
        recv: m *fileStream
        results: "[]corestream.EntryValue, error"
      - doc: firstOf returns part's first readable offset now.
        name: firstOf
        params: part *filePart
        recv: m *fileStream
        results: corestream.Offset
      - doc: Bounds returns partition's first retained offset and its next one.
        name: Bounds
        params: _ context.Context, partition int
        recv: m *fileStream
        results: corestream.BoundsValue, error
      - doc: |-
          OffsetAt returns partition's first offset appended at or after t: a
          search of the batches' instants, which the index keeps.
        name: OffsetAt
        params: |2

          	_ context.Context, partition int, t time.Time,
        recv: m *fileStream
        results: corestream.Offset, error
      - doc: Wake returns the channel the next Append closes.
        name: Wake
        recv: m *fileStream
        results: <-chan struct{}
      - doc: |-
          reserve waits until size more bytes fit under PolicyValue.MaxBytes, then
          counts them as held, and returns the partition the batch goes to: its
          keys', or the next in turn for an unkeyed one. On a refusal nothing is
          reserved.

          Room appears only when records are released — by the age bound, by Trim,
          by the byte bound of another Append — so it waits for whichever comes
          first: a release (room), the oldest record reaching its age, the end of
          BlockTimeout, or ctx. It is the memory engine's wait, on this engine's
          index.
        name: reserve
        params: ctx context.Context, size int64, partition int, keyed bool
        recv: m *fileStream
        results: int, error
      - doc: |-
          expireAll claims, in every partition, the records past RetainFor at now,
          and returns the bytes still held. The caller holds m.mu; the storage is
          released by the partition's next Append or Trim.
        name: expireAll
        params: now time.Time
        recv: m *fileStream
        results: int64
      - doc: |-
          untilExpiry returns how long until the oldest retained record of any
          partition expires, capped at limit. The caller holds m.mu.
        name: untilExpiry
        params: now time.Time, limit time.Duration
        recv: m *fileStream
        results: time.Duration
      - doc: await waits for room, for wait on the stream's clock, or for ctx.
        name: await
        params: ctx context.Context, room <-chan struct{}, wait time.Duration
        recv: m *fileStream
        results: error
      - doc: |-
          Trim makes before the first offset partition retains: at once in the
          index, durably by a drop record, and on the device by unlinking every
          sealed segment that then holds nothing readable.
        name: Trim
        params: _ context.Context, partition int, before corestream.Offset
        recv: m *fileStream
        results: error
      - doc: trim is Trim on part, whose wmu the caller holds.
        name: trim
        params: part *filePart, before corestream.Offset
        recv: m *fileStream
        results: freed int64, err error
    name: fileStream
  - fields:
      - doc: |-
          Clock stamps [corestream.EntryValue].AppendedAt, ages records for
          [corestream.PolicyValue].RetainFor, and times the wait
          [corestream.PolicyValue].BlockTimeout allows. The instants are kept
          in the segments, so a stream reopened on another clock ages its
          records by that one. Nil means clock.System.
        name: Clock
        type: clock.Timed
      - doc: |-
          Dir is the stream directory: one segmented log per partition under
          p<partition>/, the groups' cursors under cursors/. It is created
          owner-only when absent, refused when it exists and an account
          outside the owner and group could replace its entries, and its
          subdirectories are refused besides when one is a symbolic link, not a
          directory, or writable by such an account at all — the queue's rule
          (on Windows, read from the access-control list). One engine at a time
          opens a directory: a second, in this process or another, is refused
          while the first is open.
        name: Dir
        type: string
      - doc: |-
          Policy is what the stream enforces; its zero value works. Its
          Partitions cannot shrink across a reopen: a directory holding a
          partition the policy no longer counts is refused.
        name: Policy
        type: corestream.PolicyValue
    kind: struct
    name: FileConfig
  - doc: batchMark is where one batch starts and the instant it was stamped with.
    fields:
      - name: first
        type: corestream.Offset
      - name: stamp
        type: int64
    kind: struct
    name: batchMark
  - doc: |-
      filePart is one partition of a file stream: its segmented log, and the
      index of what the log holds that retention, OffsetAt and the byte bounds
      read without touching the disk.
    fields:
      - name: log
        type: "*seglog.Log"
      - doc: |-
          broken is the write failure that stopped this partition. A batch a
          failure cut short may still be pending in the log, so nothing is ever
          appended after it. Guarded by wmu.
        name: broken
        type: error
      - doc: |-
          scratch is the encoding buffer of the batch being written. Guarded by
          wmu.
        name: scratch
        type: "[]byte"
      - doc: |-
          prefix[i] is the bytes, keys and payloads, of the records from base up
          to base+i excluded; len(prefix)-1 records are indexed.
        name: prefix
        type: "[]int64"
      - doc: |-
          batches holds every indexed batch from the one holding base on, in
          offset order, which is also the order of their instants.
        name: batches
        type: "[]batchMark"
      - doc: base is the offset prefix[0] stands for.
        name: base
        type: corestream.Offset
      - doc: |-
          kept is the first offset retention, Trim or the byte bound have
          claimed for good; the age bound may claim more at read time.
        name: kept
        type: corestream.Offset
      - doc: |-
          mu guards the index. Readers hold it shared and never across a disk
          write: an Append updates the index after its sync.
        name: mu
        type: sync.RWMutex
      - doc: |-
          wmu serialises the partition's writers, Append and Trim, across their
          write and sync.
        name: wmu
        type: sync.Mutex
    kind: struct
    methods:
      - doc: |-
          next returns the offset the partition's next record takes. The caller
          holds mu, or wmu.
        name: next
        recv: p *filePart
        results: corestream.Offset
      - doc: |-
          lastBatch returns the first offset of the newest batch, next when there
          is none. The caller holds mu, or wmu.
        name: lastBatch
        recv: p *filePart
        results: corestream.Offset
      - doc: |-
          between returns the bytes of the records from lo up to hi excluded, both
          within [base, next]. The caller holds mu, or wmu.
        name: between
        params: lo, hi corestream.Offset
        recv: p *filePart
        results: int64
      - doc: |-
          first returns the first offset still readable at now: that of the oldest
          batch still younger than retainFor, next when every one is older, never
          below kept. Zero retainFor keeps every record. The caller holds mu, or wmu.
        name: first
        params: now time.Time, retainFor time.Duration
        recv: p *filePart
        results: corestream.Offset
      - doc: |-
          bounded returns the first offset the byte bound keeps when size more bytes
          follow next: the lowest offset from lo on whose suffix fits retainBytes,
          never past limit — the newest batch, which its own Append never trims.
          Zero retainBytes is unbounded. The caller holds mu, or wmu.
        name: bounded
        params: lo, limit corestream.Offset, size, retainBytes int64
        recv: p *filePart
        results: corestream.Offset
      - doc: |-
          index records a batch of sizes, stamped at stamp, as the records from next
          on, and claims everything below claim. It returns the bytes the claim
          released. The caller holds mu exclusively, and wmu.
        name: index
        params: stamp int64, sizes []int64, claim corestream.Offset
        recv: p *filePart
        results: freed int64
      - doc: |-
          claim makes to the first offset retained for good and returns the bytes it
          released; at or below kept it changes nothing. The caller holds mu
          exclusively.
        name: claim
        params: to corestream.Offset
        recv: p *filePart
        results: freed int64
      - doc: compact lets the index forget what lies far enough below kept.
        name: compact
        recv: p *filePart
      - doc: |-
          offsetAt returns the first offset at or past from whose batch was stamped
          at or after t, next when none was. The caller holds mu.
        name: offsetAt
        params: from corestream.Offset, t time.Time
        recv: p *filePart
        results: corestream.Offset
      - doc: |-
          oldestStamp returns the instant of the batch holding offset from, and
          false when from is next. The caller holds mu.
        name: oldestStamp
        params: from corestream.Offset
        recv: p *filePart
        results: int64, bool
      - doc: |-
          rebuild reads the whole log once and indexes it: every record's size,
          every batch's first offset and instant. A batch whose head a Trim dropped
          starts at the log's first record, a tail. It returns the latest instant
          seen, so the engine's stamps keep never going backwards across a restart.
        name: rebuild
        recv: p *filePart
        results: latest int64, err error
    name: filePart
  - doc: |-
      memPartition is one partition of a memory stream: its retained entries, in
      offset order, and the offset of the first of them.
    fields:
      - doc: entries holds the retained records; entries[i].Offset is first + i.
        name: entries
        type: "[]corestream.EntryValue"
      - doc: |-
          first is the lowest offset still readable. Trimming raises it; nothing
          lowers it, and it stays put when entries is empty, so the next offset
          (first + len(entries)) never moves back.
        name: first
        type: corestream.Offset
      - doc: bytes is the key and payload bytes the retained entries hold.
        name: bytes
        type: int64
    kind: struct
    methods:
      - doc: next returns the offset the partition's next record will take.
        name: next
        recv: p *memPartition
        results: corestream.Offset
    name: memPartition
  - doc: cursorKey names one group's cursor on one partition.
    fields:
      - name: group
        type: string
      - name: partition
        type: int
    kind: struct
    name: cursorKey
  - doc: |-
      memoryStream is a stream that lives entirely in one process's heap.

      # What it is for, and what it is not

      It is the test double. A consumer's suite gets the port's semantics —
      contiguous offsets, per-key placement, retention, every refusal — with no
      directory and no flush, and the conformance suite holds it to the same
      cases as every durable engine, so it cannot drift from them. It is NOT a
      durable stream: a restart is a total loss. Use the file or the SQL engine.

      Retention by age is LAZY, as on the file engine: nothing here runs a timer.
      A read computes the first record still young enough and skips the rest; an
      Append, a Trim or a backpressure wait removes them for good.
    fields:
      - doc: |-
          last is the latest instant a batch was stamped with: AppendedAt never
          goes backwards, so a partition's entries stay sorted by it and
          OffsetAt and the age retention can binary-search them.
        name: last
        type: time.Time
      - name: clk
        type: clock.Timed
      - doc: wake is closed by every Append (corestream.Waker).
        name: wake
        type: "*wakeSignal"
      - doc: |-
          room is closed whenever records are removed, which is what an Append
          waiting under PolicyValue.MaxBytes waits for.
        name: room
        type: "*wakeSignal"
      - doc: cursors holds every group's committed offset (corestream.Committer).
        name: cursors
        type: map[cursorKey]corestream.Offset
      - name: parts
        type: "[]memPartition"
      - name: policy
        type: corestream.PolicyValue
      - doc: held is the bytes every partition retains, the figure MaxBytes bounds.
        name: held
        type: int64
      - doc: turn is the partition the next unkeyed batch goes to.
        name: turn
        type: int
      - doc: |-
          mu is an RWMutex because Read, Bounds, OffsetAt and Committed are
          genuine reads: retention by age is computed, not applied, under it.
        name: mu
        type: sync.RWMutex
    kind: struct
    methods:
      - doc: Partitions returns how many partitions the stream has.
        name: Partitions
        recv: m *memoryStream
        results: int
      - doc: Append writes records to one partition as one batch.
        name: Append
        params: |2

          	ctx context.Context, records []corestream.RecordValue,
        recv: m *memoryStream
        results: corestream.AppendValue, error
      - doc: |-
          store copies records into partition as one batch stamped with one instant,
          then applies RetainBytes to that partition. The caller holds the lock.
        name: store
        params: |2

          	partition int, records []corestream.RecordValue, size int64,
        recv: m *memoryStream
        results: corestream.AppendValue
      - doc: |-
          stamp returns the instant the batch being appended is stamped with: the
          clock's, or the last stamp when the clock went backwards.
        name: stamp
        recv: m *memoryStream
        results: time.Time
      - doc: Commit records next as the offset group reads next on partition.
        name: Commit
        params: |2

          	_ context.Context, group string, partition int, next corestream.Offset,
        recv: m *memoryStream
        results: error
      - doc: Committed returns the offset group committed last on partition.
        name: Committed
        params: |2

          	_ context.Context, group string, partition int,
        recv: m *memoryStream
        results: corestream.Offset, error
      - doc: checkPartition refuses a partition outside [0, Partitions()).
        name: checkPartition
        params: partition int
        recv: m *memoryStream
        results: error
      - doc: |-
          retained returns the offset of partition's first record still young enough
          to read at now, and the index of that record in its entries. The caller
          holds the lock, shared or exclusive.
        name: retained
        params: part *memPartition, now time.Time
        recv: m *memoryStream
        results: corestream.Offset, int
      - doc: |-
          expired returns how many of partition's oldest entries are past
          PolicyValue.RetainFor at now: a record expires once its age reaches the
          bound. The entries are sorted by AppendedAt (stamp), so it is a search.
        name: expired
        params: part *memPartition, now time.Time
        recv: m *memoryStream
        results: int
      - doc: Read returns up to maxEntries entries of partition from offset from on.
        name: Read
        params: |2

          	_ context.Context, partition int, from corestream.Offset, maxEntries int,
        recv: m *memoryStream
        results: "[]corestream.EntryValue, error"
      - doc: Bounds returns partition's first retained offset and its next one.
        name: Bounds
        params: _ context.Context, partition int
        recv: m *memoryStream
        results: corestream.BoundsValue, error
      - doc: OffsetAt returns partition's first offset appended at or after t.
        name: OffsetAt
        params: |2

          	_ context.Context, partition int, t time.Time,
        recv: m *memoryStream
        results: corestream.Offset, error
      - doc: Wake returns the channel the next Append closes.
        name: Wake
        recv: m *memoryStream
        results: <-chan struct{}
      - doc: |-
          reserve waits until size more bytes fit under PolicyValue.MaxBytes and
          returns with the lock held; on a refusal it returns with the lock released.

          Room appears only when records are removed — by retention by age, by Trim —
          so it waits for whichever comes first: a removal (room), the oldest record
          reaching its age, the end of BlockTimeout, or ctx.
        name: reserve
        params: ctx context.Context, size int64
        recv: m *memoryStream
        results: error
      - doc: |-
          untilExpiry returns how long until the oldest retained record of any
          partition expires, capped at limit. The caller holds the lock.
        name: untilExpiry
        params: now time.Time, limit time.Duration
        recv: m *memoryStream
        results: time.Duration
      - doc: await waits for room, for wait on the stream's clock, or for ctx.
        name: await
        params: ctx context.Context, room <-chan struct{}, wait time.Duration
        recv: m *memoryStream
        results: error
      - doc: |-
          expireAll removes, from every partition, the records past RetainFor at
          now. The caller holds the lock exclusively.
        name: expireAll
        params: now time.Time
        recv: m *memoryStream
      - doc: |-
          retainBytes removes part's oldest records while it holds more than
          PolicyValue.RetainBytes, sparing the newest batch of fresh records: a
          batch just acknowledged as appended is never trimmed by its own Append.
        name: retainBytes
        params: part *memPartition, fresh int
        recv: m *memoryStream
      - doc: |-
          drop removes part's count oldest records, releasing their bytes, and wakes
          an Append waiting for room. The caller holds the lock exclusively.
        name: drop
        params: part *memPartition, count int
        recv: m *memoryStream
      - doc: Trim makes before the first offset partition retains.
        name: Trim
        params: _ context.Context, partition int, before corestream.Offset
        recv: m *memoryStream
        results: error
    name: memoryStream
  - fields:
      - doc: |-
          Clock stamps [corestream.EntryValue].AppendedAt, ages records for
          [corestream.PolicyValue].RetainFor, and times the wait
          [corestream.PolicyValue].BlockTimeout allows, so a test drives
          retention and backpressure with a ManualClock and no sleeping. Nil
          means clock.System.
        name: Clock
        type: clock.Timed
      - doc: |-
          Policy is what the stream enforces. Its zero value works: one
          partition, records of up to corestream.DefaultMaxRecordBytes, kept
          forever, never full.
        name: Policy
        type: corestream.PolicyValue
    kind: struct
    name: MemoryConfig
  - doc: |-
      wakeSignal is a broadcast: every reader waiting on the channel wakes when it
      is closed, and a fresh channel is armed for the next wait. A channel closed
      and replaced, rather than one value sent, is what makes it a broadcast — a
      send wakes one receiver and is lost if nobody is receiving. It is
      internal/service/data/queue's wakeSignal without the due instant, which a
      stream has no use for: no record of a stream becomes readable on its own.
    fields:
      - doc: ch is the channel handed out until the next fire.
        name: ch
        type: chan struct{}
      - name: mu
        type: sync.Mutex
    kind: struct
    methods:
      - doc: current returns the channel the next fire will close.
        name: current
        recv: w *wakeSignal
        results: <-chan struct{}
      - doc: fire wakes every reader waiting on the current channel and arms the next.
        name: fire
        recv: w *wakeSignal
    name: wakeSignal
vars:
  - doc: |-
      The file engine answers the port, four of its siblings and io.Closer;
      Compactor is #824's.
    grouped: true
    items:
      - name: _
        type: corestream.Stream
        value: (*fileStream)(nil)
      - name: _
        type: corestream.Waker
        value: (*fileStream)(nil)
      - name: _
        type: corestream.Seeker
        value: (*fileStream)(nil)
      - name: _
        type: corestream.Trimmer
        value: (*fileStream)(nil)
      - name: _
        type: corestream.Committer
        value: (*fileStream)(nil)
      - name: _
        type: io.Closer
        value: (*fileStream)(nil)
    name: _
  - doc: |-
      The memory engine answers the port and four of its siblings; Compactor is
      left to the engines that keep segments or rows to rewrite (#824).
    grouped: true
    items:
      - name: _
        type: corestream.Stream
        value: (*memoryStream)(nil)
      - name: _
        type: corestream.Waker
        value: (*memoryStream)(nil)
      - name: _
        type: corestream.Seeker
        value: (*memoryStream)(nil)
      - name: _
        type: corestream.Trimmer
        value: (*memoryStream)(nil)
      - name: _
        type: corestream.Committer
        value: (*memoryStream)(nil)
    name: _#2
