      - id: o.guardFileTarget
        kind: internal
      - id: publish
        kind: internal
    steps:
      - opt:
          do:
            - return: guardErr
          init:
            bind: guardErr
            eval: o.guardFileTarget(name, perm)
            to: o.guardFileTarget
          when: guardErr != nil
      - return: publish(o.ops, name, data, perm)
        to: publish
  - of: publish
    participants:
      - id: caller
        kind: actor
      - id: publish
        kind: self
      - id: path
        kind: stdlib
      - id: tempPath
        kind: internal
      - id: failPublish
        kind: internal
      - id: writeAndSync
        kind: internal
      - id: discard
        kind: internal
      - id: syncPublished
        kind: internal
    steps:
      - bind: dir
        eval: path.Dir(name)
        to: path
      - bind: tempName, nameErr
        eval: tempPath(dir)
        to: tempPath
      - opt:
          do:
            - return: failPublish(nameErr, kerrs.String("path", name))
              to: failPublish
          when: nameErr != nil
      - bind: file, createErr
        eval: ops.create(tempName, perm)
      - opt:
          do:
            - return: failPublish(createErr, kerrs.String("path", name))
              to: failPublish
          when: createErr != nil
      - opt:
          do:
            - return: discard(ops, tempName, name, writeErr)
              to: discard
          init:
            bind: writeErr
            eval: writeAndSync(file, data)
            to: writeAndSync
          when: writeErr != nil
      - opt:
          do:
            - return: discard(ops, tempName, name, renameErr)
              to: discard
          init:
            bind: renameErr
            eval: ops.rename(tempName, name)
          when: renameErr != nil
      - return: syncPublished(ops, dir, name)
        to: syncPublished
  - of: writeAndSync
    participants:
      - id: caller
        kind: actor
      - id: writeAndSync
        kind: self
      - id: file.Write
        kind: internal
      - id: cmp
        kind: stdlib
      - id: file.Sync
        kind: internal
      - id: file.Close
        kind: internal
    steps:
      - opt:
          do:
            - return: cmp.Or(writeErr, file.Close())
              to: cmp
          init:
            bind: _, writeErr
            eval: file.Write(data)
            to: file.Write
          when: writeErr != nil
      - opt:
          do:
            - return: cmp.Or(syncErr, file.Close())
              to: cmp
          init:
            bind: syncErr
            eval: file.Sync()
            to: file.Sync
          when: syncErr != nil
      - return: file.Close()
        to: file.Close
  - of: syncPublished
    participants:
      - id: caller
        kind: actor
      - id: syncPublished
        kind: self
      - id: kerrs
        kind: package
    steps:
      - bind: syncErr
        eval: ops.syncDir(dir)
      - opt:
          do:
            - return: nil
          when: syncErr == nil
      - return: |-
          kerrs.Wrap(syncErr, kerrs.WrapParams{
          		Code:     corevfs.CodeDirectorySyncFailed,
          		Reason:   "DIRECTORY_SYNC_FAILED",
          		Public:   "The file was published but the directory entry was not flushed",
          		Private:  "service/data/vfs: fsync on the parent directory failed AFTER a successful rename; the content is visible and may not survive a power loss — deliberately not rolled back",
          		ExitCode: exitIOErr,
          	}, kerrs.String("path", name))
        to: kerrs
  - of: discard
    participants:
      - id: caller
        kind: actor
      - id: discard
        kind: self
      - id: failPublish
        kind: internal
    steps:
      - bind: removeErr
        eval: ops.remove(tempName)
      - return: failPublish(cmp.Or(cause, removeErr), kerrs.String("path", name))
        to: failPublish
  - of: tempPath
    participants:
      - id: caller
        kind: actor
      - id: tempPath
        kind: self
      - id: rand
        kind: stdlib
      - id: path
        kind: stdlib
    steps:
      - var:
          name: raw
          type: "[tempNameBytes]byte"
      - bind: _, randErr
        eval: rand.Read(raw[:])
        to: rand
      - opt:
          do:
            - return: "\"\", randErr"
          when: randErr != nil
      - return: path.Join(dir, tempPrefix+hex.EncodeToString(raw[:])+tempSuffix), nil
        to: path
  - of: (*osFS).nativeOps
    steps:
      - return: |-
          atomicOps{
          		create: func(name string, perm fs.FileMode) (tempFile, error) {
          			//: O_EXCL turns a name collision into an error instead of an
          			//: overwrite of somebody else's in-flight publication.
          			file, openErr := o.root.OpenFile(name, os.O_WRONLY|os.O_CREATE|os.O_EXCL, perm)
          			//: never hand back a non-nil interface holding a nil *os.File.
          			if openErr != nil {
          				//: the caller reports PublishFailed.
          				return nil, openErr
          			}
          			//: a real handle.
          			return file, nil
          		},
          		rename:  o.root.Rename,
          		remove:  o.root.Remove,
          		syncDir: o.syncDir,
          	}
  - of: (*osFS).syncDir
    participants:
      - id: caller
        kind: actor
      - id: (*osFS).syncDir
        kind: self
      - id: o.root.Open
        kind: value
      - id: syncDirHandle
        kind: internal
      - id: handle.Close
        kind: value
      - id: cmp
        kind: stdlib
    steps:
      - bind: handle, openErr
        eval: o.root.Open(dir)
        to: o.root.Open
      - opt:
          do:
            - return: openErr
          when: openErr != nil
      - bind: syncErr
        eval: syncDirHandle(handle)
        to: syncDirHandle
      - bind: closeErr
        eval: handle.Close()
        to: handle.Close
      - return: cmp.Or(syncErr, closeErr)
        to: cmp
  - of: (*osFS).WriteFile
    participants:
      - id: caller
        kind: actor
      - id: (*osFS).WriteFile
        kind: self
      - id: o.guardFileTarget
        kind: internal
      - id: o.root.WriteFile
        kind: value
      - id: failWrite
        kind: internal
    steps:
      - opt:
          do:
            - return: guardErr
          init:
            bind: guardErr
            eval: o.guardFileTarget(name, perm)
            to: o.guardFileTarget
          when: guardErr != nil
      - opt:
          do:
            - return: failWrite(writeErr, kerrs.String("path", name))
              to: failWrite
          init:
            bind: writeErr
            eval: o.root.WriteFile(name, data, perm)
            to: o.root.WriteFile
          when: writeErr != nil
      - return: nil
  - of: (*osFS).MkdirAll
    participants:
      - id: caller
        kind: actor
      - id: (*osFS).MkdirAll
        kind: self
      - id: o.guardDirTarget
        kind: internal
      - id: o.root.MkdirAll
        kind: value
      - id: o.classifyBlocked
        kind: internal
    steps:
      - opt:
          do:
            - return: guardErr
          init:
            bind: guardErr
            eval: o.guardDirTarget(name, perm)
            to: o.guardDirTarget
          when: guardErr != nil
      - opt:
          do:
            - return: o.classifyBlocked(name, mkErr)
              to: o.classifyBlocked
          init:
            bind: mkErr
            eval: o.root.MkdirAll(name, perm)
            to: o.root.MkdirAll
          when: mkErr != nil
      - return: nil
  - of: (*osFS).Remove
    participants:
      - id: caller
        kind: actor
      - id: (*osFS).Remove
        kind: self
      - id: corevfs
        kind: package
      - id: o.root.Remove
        kind: value
      - id: o.classifyRemove
        kind: internal
    steps:
      - opt:
          do:
            - return: pathErr
          init:
            bind: pathErr
            eval: corevfs.ValidateWritePath(name)
            to: corevfs
          when: pathErr != nil
      - opt:
          do:
            - return: o.classifyRemove(name, rmErr)
              to: o.classifyRemove
          init:
            bind: rmErr
            eval: o.root.Remove(name)
            to: o.root.Remove
          when: rmErr != nil
      - return: nil
  - of: (*osFS).classifyRemove
    participants:
      - id: caller
        kind: actor
      - id: (*osFS).classifyRemove
        kind: self
      - id: o.root.Lstat
        kind: value
      - id: fs
        kind: stdlib
      - id: verdict
        kind: internal
      - id: failWrite
        kind: internal
    steps:
      - bind: info, statErr
        eval: o.root.Lstat(name)
        to: o.root.Lstat
      - opt:
          do:
            - bind: entries, readErr
              eval: fs.ReadDir(o.read, name)
              to: fs
            - opt:
                do:
                  - return: verdict(corevfs.DirectoryNotEmpty, kerrs.String("path", name))
                    to: verdict
                when: readErr == nil && len(entries) > 0
          when: statErr == nil && info.IsDir()
      - return: failWrite(cause, kerrs.String("path", name))
        to: failWrite
  - of: (*osFS).RemoveAll
    participants:
      - id: caller
        kind: actor
      - id: (*osFS).RemoveAll
        kind: self
      - id: corevfs
        kind: package
      - id: o.root.RemoveAll
        kind: value
      - id: failWrite
        kind: internal
    steps:
      - opt:
          do:
            - return: pathErr
          init:
            bind: pathErr
            eval: corevfs.ValidateWritePath(name)
            to: corevfs
          when: pathErr != nil
      - opt:
          do:
            - return: failWrite(rmErr, kerrs.String("path", name))
              to: failWrite
          init:
            bind: rmErr
            eval: o.root.RemoveAll(name)
            to: o.root.RemoveAll
          when: rmErr != nil
      - return: nil
  - of: syncDirHandle
    participants:
      - id: caller
        kind: actor
      - id: syncDirHandle
        kind: self
      - id: dir.Sync
        kind: value
    steps:
      - return: dir.Sync()
        to: dir.Sync
  - of: verdict
    participants:
      - id: caller
        kind: actor
      - id: verdict
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: kerrs.Wrap(sentinel, kerrs.WrapParams{}, fields...)
        to: kerrs
  - of: failRead
    participants:
      - id: caller
        kind: actor
      - id: failRead
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: |-
          kerrs.Wrap(cause, kerrs.WrapParams{
          		Code:     corevfs.CodeReadFailed,
          		Reason:   "READ_FAILED",
          		Public:   "The filesystem could not read that path",
          		Private:  "core/data/vfs: open, stat or readdir failed; the *fs.PathError cause is wrapped, not replaced, so errors.Is against fs.ErrNotExist still answers",
          		ExitCode: exitIOErr,
          	}, fields...)
        to: kerrs
  - of: failWrite
    participants:
      - id: caller
        kind: actor
      - id: failWrite
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: |-
          kerrs.Wrap(cause, kerrs.WrapParams{
          		Code:     corevfs.CodeWriteFailed,
          		Reason:   "WRITE_FAILED",
          		Public:   "The filesystem could not write that path",
          		Private:  "core/data/vfs: create, write, mkdir or remove failed; the *fs.PathError cause is wrapped, not replaced",
          		ExitCode: exitIOErr,
          	}, fields...)
        to: kerrs
  - of: failPublish
    participants:
      - id: caller
        kind: actor
      - id: failPublish
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: |-
          kerrs.Wrap(cause, kerrs.WrapParams{
          		Code:     corevfs.CodePublishFailed,
          		Reason:   "PUBLISH_FAILED",
          		Public:   "The filesystem could not publish that file",
          		Private:  "core/data/vfs: atomic publication aborted; the previous content is intact and the temporary was removed — the operation is safe to retry",
          		ExitCode: exitIOErr,
          	}, fields...)
        to: kerrs
