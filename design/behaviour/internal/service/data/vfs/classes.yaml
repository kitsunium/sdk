# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: rootName is the one name that always exists in an in-memory filesystem.
    items:
      - name: rootName
        type: string
        value: "\".\""
    name: rootName
  - doc: |-
      rootPerm is the mode the implicit root directory reports. It is never
      applied to anything on a device — nothing here touches one — and exists so
      fs.WalkDir sees a plausible directory at the top of the tree.
    items:
      - name: rootPerm
        type: fs.FileMode
        value: "0o755"
    name: rootPerm
  - doc: |-
      tempPrefix and tempSuffix bracket the name of a temporary that has not been
      published yet. The leading dot keeps it out of an ordinary listing and the
      suffix makes an orphan — which only a crashed process can leave — obvious to
      whoever finds one.
    grouped: true
    items:
      - name: tempPrefix
        type: string
        value: "\".vfs-\""
      - name: tempSuffix
        type: string
        value: "\".tmp\""
    name: tempPrefix
  - doc: |-
      tempNameBytes is the entropy in a temporary's name. Sixteen bytes makes a
      collision with a concurrent publisher in the same directory not worth
      reasoning about, and O_EXCL turns the impossible case into an error rather
      than a silent overwrite.
    items:
      - name: tempNameBytes
        type: int
        value: "16"
    name: tempNameBytes
  - doc: |-
      platformNative reports that this GOOS has every mechanic the disk filesystem
      requires. NewOS reads it and refuses where it is false, rather than building
      a filesystem that would silently provide neither durability nor a meaningful
      permission mode.
    items:
      - name: platformNative
        type: bool
        value: "true"
    name: platformNative
  - doc: exitIOErr matches sysexits EX_IOERR (74). The filesystem itself failed.
    items:
      - name: exitIOErr
        type: int
        value: "74"
    name: exitIOErr
  - doc: |-
      exitConfig matches sysexits EX_CONFIG (78). A root that cannot be opened is
      a wiring fault: the same constructor call will fail identically forever.
    items:
      - name: exitConfig
        type: int
        value: "78"
    name: exitConfig
files:
  - decls: []
    name: doc.go
  - decls:
      - rootName
      - rootPerm
      - memFS
