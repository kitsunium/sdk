    name: mem_node.go
  - decls:
      - (*memFS).WriteFile
      - (*memFS).WriteAtomic
      - (*memFS).checkFileTargetLocked
      - (*memFS).storeLocked
      - (*memFS).MkdirAll
      - (*memFS).createChainLocked
