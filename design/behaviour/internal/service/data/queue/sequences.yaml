            - comm: <-w.handled.Done()
              do:
                - return: "false"
            - comm: <-w.stop
              do:
                - set: w.stop
                  value: nil
                - set: w.stopped
                  value: "true"
                - opt:
                    do:
                      - set: w.drain
                        to: c.cfg.Clock.NewTimer
                        value: c.cfg.Clock.NewTimer(c.cfg.DrainTimeout)
                      - set: w.drained
                        to: w.drain.C
                        value: w.drain.C()
                      - return: "true"
                    when: c.cfg.DrainTimeout > 0
                - return: w.halt(context.Cause(ctx))
                  to: w.halt
            - comm: <-w.drained
              do:
                - return: w.halt(context.Cause(ctx))
                  to: w.halt
            - comm: <-timerC(w.deadline)
              do:
                - return: |-
                    w.halt(kerrs.Wrap(corequeue.LeaseExpired, kerrs.WrapParams{},
                    			kerrs.String("message", w.id), kerrs.String("why", "the handler's lease ends within its margin")))
                  to: w.halt
            - comm: <-tickerC(w.renewal)
