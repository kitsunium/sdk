    steps:
      - return: "&idleGate{found: make(chan struct{})}"
  - of: (*idleGate).enter
    steps:
      - lock:
          mutex: g.mu
      - opt:
          do:
            - return: g.found, false
          when: g.held
      - set: g.held
        value: "true"
      - return: nil, true
  - of: (*idleGate).release
    steps:
      - lock:
          mutex: g.mu
      - set: g.held
        value: "false"
      - opt:
          do:
            - bind: woken
              eval: g.found
            - set: g.found
              value: make(chan struct{})
            - eval: close(woken)
          when: work
