        to: info.Mode
      - opt:
          do:
            - return: "\"\", \"\", false"
          when: mode&worldWritable == 0
      - opt:
          do:
            - return: "\"sticky-world-writable\", mode.String(), true"
          when: mode&os.ModeSticky != 0
