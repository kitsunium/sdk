      - id: caller
        kind: actor
      - id: (*consumer).planFor
        kind: self
      - id: delivery.Lease.ExpiresAt.Sub
        kind: value
    steps:
      - bind: granted
        eval: delivery.Lease.ExpiresAt.Sub(receivedAt)
        to: delivery.Lease.ExpiresAt.Sub
      - opt:
          do:
            - return: leasePlan{}
          when: granted <= 0
      - return: |-
          leasePlan{
          		granted: granted, margin: min(granted/leaseMarginDivisor, c.cfg.SettleTimeout),
          		renewEvery: max(granted/renewDivisor, time.Nanosecond), bounded: true,
          	}
  - of: (*consumer).watch
    participants:
      - id: caller
        kind: actor
      - id: (*consumer).watch
        kind: self
      - id: context
        kind: stdlib
      - id: c.cfg.Clock.NewTimer
        kind: value
      - id: c.cfg.Clock.NewTicker
