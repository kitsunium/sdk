          kerrs.Wrap(cause, kerrs.WrapParams{
          		Code: corequeue.CodeQueueBackendFailed, Reason: "QUEUE_BACKEND_FAILED",
          		Public:   "The queue's storage refused an operation",
          		Private:  "service/data/queue: a filesystem call failed; the fields name the operation and the path",
          		ExitCode: exitIOErr,
          	}, kerrs.String("op", op), kerrs.String("path", name))
        to: kerrs
  - of: (*fileBroker).DeadLettersAfter
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).DeadLettersAfter
        kind: self
      - id: checkBatch
        kind: internal
      - id: b.namesOf
        kind: internal
      - id: parseDead
        kind: internal
      - id: b.readDead
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, invalid
          init:
            bind: invalid
            eval: checkBatch(max)
            to: checkBatch
          when: invalid != nil
      - opt:
          do:
            - return: nil, ctx.Err()
          when: ctx.Err() != nil
      - bind: entries, listErr
        eval: b.namesOf(dirDead)
        to: b.namesOf
      - opt:
          do:
            - return: nil, listErr
          when: listErr != nil
      - var:
          name: out
          type: "[]corequeue.DeadLetterValue"
      - loop:
          do:
            - bind: name, named
              eval: parseDead(base)
              to: parseDead
            - opt:
                do:
                  - continue: true
                when: "!named || name.ID() <= after"
            - bind: record, ok, readErr
              eval: b.readDead(base)
              to: b.readDead
            - opt:
                do:
                  - return: nil, readErr
                when: readErr != nil
            - opt:
                do:
                  - continue: true
                when: "!ok"
            - set: out
              value: append(out, record)
            - opt:
                do:
                  - break: true
                when: len(out) == max
          key: _
          range: entries
          value: base
      - return: out, nil
  - of: (*fileBroker).Purge
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).Purge
        kind: self
      - id: b.unlinkLive
        kind: internal
      - id: b.wake.fire
        kind: internal
    steps:
      - opt:
          do:
            - return: corequeue.PurgeValue{}, ctx.Err()
          when: ctx.Err() != nil
      - bind: queued, queuedErr
        eval: b.unlinkLive(dirReady)
        to: b.unlinkLive
      - opt:
          do:
            - return: "corequeue.PurgeValue{Queued: queued}, queuedErr"
          when: queuedErr != nil
      - bind: leased, leasedErr
        eval: b.unlinkLive(dirInflight)
        to: b.unlinkLive
      - opt:
          do:
            - eval: b.wake.fire()
              to: b.wake.fire
          when: queued+leased > 0
      - return: "corequeue.PurgeValue{Queued: queued, Leased: leased}, leasedErr"
  - of: (*fileBroker).unlinkLive
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).unlinkLive
        kind: self
      - id: b.namesOf
        kind: internal
      - id: parseLive
        kind: internal
      - id: b.root.Remove
        kind: value
      - id: ignoreMissing
        kind: internal
    steps:
      - bind: entries, listErr
        eval: b.namesOf(dir)
        to: b.namesOf
      - opt:
          do:
            - return: 0, listErr
          when: listErr != nil
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                init:
                  bind: _, ok
                  eval: parseLive(dir, base)
                  to: parseLive
                when: "!ok"
            - bind: removeErr
              eval: b.root.Remove(path.Join(dir, base))
              to: b.root.Remove
            - opt:
                do:
                  - opt:
                      do:
                        - return: removed, missing
                      init:
                        bind: missing
                        eval: ignoreMissing("remove", base, removeErr)
                        to: ignoreMissing
                      when: missing != nil
                  - continue: true
                when: removeErr != nil
            - op: ++
              set: removed
          key: _
          range: entries
          value: base
      - return: removed, nil
  - of: (*fileBroker).ReplayDeadLetters
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).ReplayDeadLetters
        kind: self
      - id: checkBatch
        kind: internal
      - id: b.namesOf
        kind: internal
      - id: b.replayRecords
        kind: internal
    steps:
      - opt:
          do:
            - return: 0, invalid
          init:
            bind: invalid
            eval: checkBatch(max)
            to: checkBatch
          when: invalid != nil
      - opt:
          do:
            - return: 0, ctx.Err()
          when: ctx.Err() != nil
      - bind: entries, listErr
        eval: b.namesOf(dirDead)
        to: b.namesOf
      - opt:
          do:
            - return: 0, listErr
          when: listErr != nil
      - loop:
          do:
            - opt:
                do:
                  - return: replayed, ctx.Err()
                when: ctx.Err() != nil
            - bind: queued, replayErr
              eval: b.replayRecords(id, records)
              to: b.replayRecords
            - opt:
                do:
                  - return: replayed, replayErr
                when: replayErr != nil
            - opt:
                do:
                  - continue: true
                when: "!queued"
            - op: ++
              set: replayed
            - opt:
                do:
                  - break: true
                when: replayed == max
          key: id
          range: deadMessages(entries)
          value: records
      - return: replayed, nil
  - of: deadMessages
    participants:
      - id: caller
        kind: actor
      - id: deadMessages
        kind: self
      - id: parseDead
        kind: internal
      - id: name.ID
        kind: internal
    steps:
      - return:
          closure:
            params: yield func(string, []string) bool
            steps:
              - var:
                  name: id
                  type: string
              - var:
                  name: records
                  type: "[]string"
              - loop:
                  do:
                    - bind: name, named
                      eval: parseDead(base)
                      to: parseDead
                    - opt:
                        do:
                          - continue: true
                        when: "!named"
                    - opt:
                        do:
                          - opt:
                              do:
                                - return: ""
                              when: "!yield(id, records)"
                          - set: records
                            value: nil
                        when: name.ID() != id && len(records) > 0
                    - set: id
                      to: name.ID
                      value: name.ID()
                    - set: records
                      value: append(records, base)
                  key: _
                  range: entries
                  value: base
              - opt:
                  do:
                    - return: ""
                  when: len(records) > 0 && !yield(id, records)
  - of: (*fileBroker).PurgeDeadLetters
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).PurgeDeadLetters
        kind: self
      - id: checkBatch
        kind: internal
      - id: b.removeDeadFailedBy
        kind: internal
    steps:
      - opt:
          do:
            - return: 0, invalid
          init:
            bind: invalid
            eval: checkBatch(max)
            to: checkBatch
          when: invalid != nil
      - opt:
          do:
            - return: 0, ctx.Err()
          when: ctx.Err() != nil
      - return: b.removeDeadFailedBy(ctx, before.UnixNano()-1, max)
        to: b.removeDeadFailedBy
  - of: (*fileBroker).sweepRetention
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).sweepRetention
        kind: self
      - id: b.deadSwept.Load
        kind: value
      - id: b.removeDeadFailedBy
        kind: internal
    steps:
      - bind: swept
        eval: b.deadSwept.Load()
        to: b.deadSwept.Load
      - opt:
          do:
            - return: nil
          when: "!retentionDue(b.policy, swept, now) || !b.deadSwept.CompareAndSwap(swept, now)"
      - bind: _, err
        eval: b.removeDeadFailedBy(context.Background(), retentionCutoff(b.policy, now), deadSweepAll)
        to: b.removeDeadFailedBy
      - return: err
  - of: (*fileBroker).removeDeadFailedBy
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).removeDeadFailedBy
        kind: self
      - id: b.namesOf
        kind: internal
      - id: b.removeIfFailedBy
        kind: internal
    steps:
      - bind: entries, listErr
        eval: b.namesOf(dirDead)
        to: b.namesOf
      - opt:
          do:
            - return: 0, listErr
          when: listErr != nil
      - loop:
          do:
            - opt:
                do:
                  - return: removed, ctx.Err()
                when: ctx.Err() != nil || removed == max
            - bind: gone, removeErr
              eval: b.removeIfFailedBy(base, cutoff)
              to: b.removeIfFailedBy
            - opt:
                do:
                  - return: removed, removeErr
                when: removeErr != nil
            - opt:
                do:
                  - op: ++
                    set: removed
                when: gone
          key: _
          range: entries
          value: base
      - return: removed, nil
  - of: (*fileBroker).removeIfFailedBy
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).removeIfFailedBy
        kind: self
      - id: b.deadFailedAt
        kind: internal
      - id: b.root.Remove
        kind: value
    steps:
      - bind: failed, known, headErr
        eval: b.deadFailedAt(base)
        to: b.deadFailedAt
      - opt:
          do:
            - return: false, headErr
          when: headErr != nil
      - opt:
          do:
            - return: false, nil
          when: "!known || failed > cutoff"
      - bind: removeErr
        eval: b.root.Remove(path.Join(dirDead, base))
        to: b.root.Remove
      - opt:
          do:
            - return: false, ignoreMissing("remove", base, removeErr)
          when: removeErr != nil
      - return: true, nil
  - of: (*fileBroker).deadFailedAt
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).deadFailedAt
        kind: self
      - id: parseDead
        kind: internal
      - id: b.root.Open
        kind: value
      - id: io
        kind: stdlib
      - id: file.Close
        kind: value
      - id: bytes
        kind: stdlib
      - id: decodeDead
        kind: internal
      - id: record.FailedAt.UnixNano
        kind: value
    steps:
      - opt:
          do:
            - return: 0, false, nil
          init:
            bind: _, named
            eval: parseDead(base)
            to: parseDead
          when: "!named"
      - bind: file, openErr
        eval: b.root.Open(path.Join(dirDead, base))
        to: b.root.Open
      - opt:
          do:
            - return: 0, false, ignoreMissing("open", base, openErr)
          when: openErr != nil
      - bind: head
        eval: make([]byte, deadHeaderMax)
      - bind: n, readErr
        eval: io.ReadFull(file, head)
        to: io
      - bind: closeErr
        eval: file.Close()
        to: file.Close
      - opt:
          do:
            - return: 0, false, backendFailed("read", base, readErr)
          when: readErr != nil && readErr != io.ErrUnexpectedEOF && readErr != io.EOF
      - opt:
          do:
            - return: 0, false, backendFailed("close", base, closeErr)
          when: closeErr != nil
      - bind: header, _, split
        eval: bytes.Cut(head[:n], []byte(deadHeaderSep))
        to: bytes
      - opt:
          do:
            - return: 0, false, nil
          when: "!split"
      - bind: record, ok
        eval: decodeDead(append(header, deadHeaderSep...))
        to: decodeDead
      - opt:
          do:
            - return: 0, false, nil
          when: "!ok || record.FailedAt.IsZero()"
      - return: record.FailedAt.UnixNano(), true, nil
        to: record.FailedAt.UnixNano
  - of: (*fileBroker).PublishMany
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).PublishMany
        kind: self
      - id: checkSizes
        kind: internal
      - id: b.clk.Now
        kind: value
      - id: b.publishEach
        kind: internal
      - id: mintFileBatch
        kind: internal
      - id: batcher.WriteAtomicAll
        kind: value
      - id: b.wakeIfAny
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, ctx.Err()
          when: ctx.Err() != nil
      - opt:
          do:
            - return: nil, tooLarge
          init:
            bind: tooLarge
            eval: checkSizes(payloads, b.policy.MaxMessageBytes)
            to: checkSizes
          when: tooLarge != nil
      - opt:
          do:
            - return: nil, nil
          when: len(payloads) == 0
      - bind: now
        eval: b.clk.Now()
        to: b.clk.Now
      - bind: batcher, batched
        eval: b.publisher.(corevfs.AtomicBatchWriter)
      - opt:
          do:
            - return: b.publishEach(payloads, now)
              to: b.publishEach
          when: "!batched"
      - bind: messages, files, mintErr
        eval: mintFileBatch(payloads, now)
        to: mintFileBatch
      - opt:
          do:
            - return: nil, mintErr
          when: mintErr != nil
      - bind: published, writeErr
        eval: batcher.WriteAtomicAll(files, messageMode)
        to: batcher.WriteAtomicAll
      - opt:
          do:
            - eval: b.wakeIfAny(published)
              to: b.wakeIfAny
            - opt:
                do:
                  - set: published
                    value: "0"
                when: kerrs.HasCode(writeErr, corevfs.CodeDirectorySyncFailed)
            - return: messages[:published], backendFailed("publish", dirReady, writeErr)
          when: writeErr != nil
      - eval: b.wakeIfAny(published)
        to: b.wakeIfAny
      - return: messages, nil
  - of: mintFileBatch
    participants:
      - id: caller
        kind: actor
      - id: mintFileBatch
        kind: self
      - id: randomHex
        kind: internal
    steps:
      - bind: messages
        eval: make([]corequeue.MessageValue, len(payloads))
      - bind: files
        eval: make([]corevfs.FileValue, len(payloads))
      - loop:
          do:
            - bind: entropy, entropyErr
              eval: randomHex(idEntropyBytes)
              to: randomHex
            - opt:
                do:
                  - return: nil, nil, backendFailed("rand", "", entropyErr)
                when: entropyErr != nil
            - bind: name
              eval: "nameValue{At: now.UnixNano(), EnqueuedAt: now.UnixNano(), Entropy: entropy, Priority: corequeue.PriorityNormal}"
            - set: messages[index]
              value: "corequeue.MessageValue{ID: name.ID(), Payload: payload, EnqueuedAt: now}"
            - set: files[index]
              value: "corevfs.FileValue{Name: path.Join(dirReady, name.readyName()), Data: payload}"
          key: index
          range: payloads
          value: payload
      - return: messages, files, nil
  - of: (*fileBroker).publishEach
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).publishEach
        kind: self
      - id: b.write
        kind: internal
      - id: b.wakeIfAny
        kind: internal
    steps:
      - bind: messages
        eval: make([]corequeue.MessageValue, 0, len(payloads))
      - loop:
          do:
            - bind: name, writeErr
              eval: b.write(payload, now, now, corequeue.PriorityNormal)
              to: b.write
            - opt:
                do:
                  - eval: b.wakeIfAny(len(messages))
                    to: b.wakeIfAny
                  - return: messages, writeErr
                when: writeErr != nil
            - set: messages
              value: "append(messages, corequeue.MessageValue{ID: name.ID(), Payload: payload, EnqueuedAt: now})"
          key: _
          range: payloads
          value: payload
      - eval: b.wakeIfAny(len(messages))
        to: b.wakeIfAny
      - return: messages, nil
  - of: (*fileBroker).wakeIfAny
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).wakeIfAny
        kind: self
      - id: b.wake.fire
        kind: internal
    steps:
      - opt:
          do:
            - eval: b.wake.fire()
              to: b.wake.fire
          when: n > 0
  - of: (*fileBroker).AckMany
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).AckMany
        kind: self
      - id: b.Ack
        kind: internal
      - id: ackOutcomeOf
        kind: internal
    steps:
      - bind: result
        eval: "corequeue.AckResultValue{Outcomes: make([]corequeue.AckOutcome, len(receipts))}"
      - loop:
          do:
            - bind: ackErr
              eval: b.Ack(ctx, receipt)
              to: b.Ack
            - opt:
                do:
                  - set: result.Outcomes[index]
                    value: corequeue.AckAcknowledged
                  - continue: true
                when: ackErr == nil
            - opt:
                do:
                  - return: result, ackErr
                when: ctx.Err() != nil || !refusedReceipt(ackErr)
            - set: result.Outcomes[index]
              to: ackOutcomeOf
              value: ackOutcomeOf(ackErr)
          key: index
          range: receipts
          value: receipt
      - return: result, nil
  - of: (*fileBroker).AllMessages
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).AllMessages
        kind: self
      - id: yieldFailure
        kind: internal
      - id: b.liveFiles
        kind: internal
      - id: b.readLive
        kind: internal
    steps:
      - return:
          closure:
            params: yield func(corequeue.LiveMessageValue, error) bool
            steps:
              - opt:
                  do:
                    - eval: yieldFailure(yield, ctx.Err())
                      to: yieldFailure
                    - return: ""
                  when: ctx.Err() != nil
              - bind: found, listErr
                eval: b.liveFiles(after)
                to: b.liveFiles
              - opt:
                  do:
                    - eval: yieldFailure(yield, listErr)
                      to: yieldFailure
                    - return: ""
                  when: listErr != nil
              - loop:
                  do:
                    - bind: live, ok, readErr
                      eval: b.readLive(ctx, f)
                      to: b.readLive
                    - opt:
                        do:
                          - eval: yieldFailure(yield, readErr)
                            to: yieldFailure
                          - return: ""
                        when: readErr != nil
                    - opt:
                        do:
                          - continue: true
                        when: "!ok"
                    - opt:
                        do:
                          - return: ""
                        when: "!yield(live, nil)"
                  key: _
                  range: found
                  value: f
  - of: (*fileBroker).readLive
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).readLive
        kind: self
      - id: b.root.ReadFile
        kind: value
    steps:
      - opt:
          do:
            - return: corequeue.LiveMessageValue{}, false, ctx.Err()
          when: ctx.Err() != nil
      - bind: payload, readErr
        eval: b.root.ReadFile(path.Join(f.dir, f.base))
        to: b.root.ReadFile
      - opt:
          do:
            - return: corequeue.LiveMessageValue{}, false, ignoreMissing("read", f.base, readErr)
          when: readErr != nil
      - return: |-
          corequeue.LiveMessageValue{
          		VisibleAt:  f.name.AtTime(),
          		Message:    corequeue.MessageValue{ID: f.id, Payload: payload, EnqueuedAt: f.name.EnqueuedTime()},
          		Deliveries: f.name.Deliveries, Leased: f.leased, Priority: f.name.Priority,
          	}, true, nil
  - of: prepareQueueDir
    participants:
      - id: caller
        kind: actor
      - id: prepareQueueDir
        kind: self
      - id: kerrs
        kind: package
      - id: os
        kind: stdlib
      - id: backendFailed
        kind: internal
      - id: checkQueueDir
        kind: internal
      - id: makeStates
        kind: internal
    steps:
      - opt:
          do:
            - return: kerrs.Wrap(corequeue.QueueDirectoryUnusable, kerrs.WrapParams{}, kerrs.String("field", "Dir"))
              to: kerrs
          when: dir == ""
      - opt:
          do:
            - return: backendFailed("mkdir", dir, mkErr)
              to: backendFailed
          init:
            bind: mkErr
            eval: os.MkdirAll(dir, queueDirMode)
            to: os
          when: mkErr != nil
      - bind: info, statErr
        eval: os.Stat(dir)
        to: os
      - opt:
          do:
            - return: backendFailed("stat", dir, statErr)
              to: backendFailed
          when: statErr != nil
      - opt:
          do:
            - return: unsafe
          init:
            bind: unsafe
            eval: checkQueueDir(dir, info)
            to: checkQueueDir
          when: unsafe != nil
      - return: makeStates(dir)
        to: makeStates
  - of: checkQueueDir
    participants:
      - id: caller
        kind: actor
      - id: checkQueueDir
        kind: self
      - id: unusableBecause
        kind: internal
      - id: kerrs
        kind: package
    steps:
      - bind: why, observed, unusable
        eval: unusableBecause(dir, info)
        to: unusableBecause
      - opt:
          do:
            - return: nil
          when: "!unusable"
      - return: |-
          kerrs.Wrap(corequeue.QueueDirectoryUnusable, kerrs.WrapParams{},
          		withObserved(observed, kerrs.String("field", "Dir"), kerrs.String("value", dir), kerrs.String("why", why))...)
        to: kerrs
  - of: withObserved
    steps:
      - opt:
          do:
            - return: fields
          when: observed == ""
      - return: append(fields, kerrs.String("observed", observed))
  - of: unusableBecause
    participants:
      - id: caller
        kind: actor
      - id: unusableBecause
        kind: self
      - id: indirectionOrFile
        kind: internal
      - id: rootWritableByAnyone
        kind: internal
    steps:
      - opt:
          do:
            - return: why, "", true
          init:
            bind: why, unusable
            eval: indirectionOrFile(info)
            op: =
            to: indirectionOrFile
          when: unusable
      - return: rootWritableByAnyone(dir, info)
        to: rootWritableByAnyone
  - of: stateUnusableBecause
    participants:
      - id: caller
        kind: actor
      - id: stateUnusableBecause
        kind: self
      - id: indirectionOrFile
        kind: internal
      - id: stateWritableByAnyone
        kind: internal
    steps:
      - opt:
          do:
            - return: why, "", true
          init:
            bind: why, unusable
            eval: indirectionOrFile(info)
            op: =
            to: indirectionOrFile
          when: unusable
      - return: stateWritableByAnyone(dir, info)
        to: stateWritableByAnyone
  - of: indirectionOrFile
    steps:
      - opt:
          do:
            - return: "\"symlink\", true"
          when: info.Mode()&fs.ModeSymlink != 0 || reparsePoint(info)
      - opt:
          do:
            - return: "\"not-a-directory\", true"
          when: "!info.IsDir()"
      - return: "\"\", false"
  - of: makeStates
    participants:
      - id: caller
        kind: actor
      - id: makeStates
        kind: self
      - id: prepareState
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: stateErr
                init:
                  bind: stateErr
                  eval: prepareState(dir, state)
                  to: prepareState
                when: stateErr != nil
          key: _
          range: stateDirs
          value: state
      - return: nil
  - of: prepareState
    participants:
      - id: caller
        kind: actor
      - id: prepareState
        kind: self
      - id: path
        kind: stdlib
      - id: os
        kind: stdlib
      - id: backendFailed
        kind: internal
      - id: stateUnusableBecause
        kind: internal
      - id: kerrs
        kind: package
    steps:
      - bind: statePath
        eval: path.Join(dir, state)
        to: path
      - opt:
          do:
            - return: backendFailed("mkdir", state, mkErr)
              to: backendFailed
          init:
            bind: mkErr
            eval: os.Mkdir(statePath, queueDirMode)
            to: os
          when: mkErr != nil && !os.IsExist(mkErr)
      - bind: info, statErr
        eval: os.Lstat(statePath)
        to: os
      - opt:
          do:
            - return: backendFailed("lstat", state, statErr)
              to: backendFailed
          when: statErr != nil
      - bind: why, observed, unusable
        eval: stateUnusableBecause(statePath, info)
        to: stateUnusableBecause
      - opt:
          do:
            - return: nil
          when: "!unusable"
      - return: |-
          kerrs.Wrap(corequeue.QueueDirectoryUnusable, kerrs.WrapParams{},
          		withObserved(observed, kerrs.String("field", "Dir"), kerrs.String("state", state),
          			kerrs.String("value", statePath), kerrs.String("why", why))...)
        to: kerrs
  - of: (*fileBroker).Nack
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).Nack
        kind: self
      - id: b.nackWith
        kind: internal
    steps:
      - return: |-
          b.nackWith(ctx, receipt, cause, func(deliveries int) time.Duration {
          		//: the curve every broker waits on.
          		return retryDelay(b.policy, deliveries, b.random)
          	})
        to: b.nackWith
  - of: (*fileBroker).NackAfter
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).NackAfter
        kind: self
      - id: nackDeadline
        kind: internal
      - id: b.nackWith
        kind: internal
    steps:
      - opt:
          do:
            - return: corequeue.NackValue{}, invalid
          init:
            bind: _, invalid
            eval: nackDeadline(b.clk.Now(), delay)
            to: nackDeadline
          when: invalid != nil
      - return: |-
          b.nackWith(ctx, receipt, cause, func(int) time.Duration {
          		//: a negative delay is now.
          		return max(delay, 0)
          	})
        to: b.nackWith
  - of: (*fileBroker).nackWith
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).nackWith
        kind: self
      - id: b.resolve
        kind: internal
      - id: b.clk.Now
        kind: value
      - id: b.nackDead
        kind: internal
      - id: b.root.Rename
        kind: value
      - id: b.dropStale
        kind: internal
      - id: b.wake.fire
        kind: internal
    steps:
      - bind: held
        eval: string(receipt)
      - bind: name, resolveErr
        eval: b.resolve(ctx, held)
        to: b.resolve
      - opt:
          do:
            - return: corequeue.NackValue{}, resolveErr
          when: resolveErr != nil
      - bind: now
        eval: b.clk.Now()
        to: b.clk.Now
      - opt:
          do:
            - return: b.nackDead(name, held, cause, now.UnixNano())
              to: b.nackDead
          when: name.Deliveries >= b.policy.MaxDeliveries
      - bind: requeued
        eval: |-
          nameValue{
          		At: now.Add(wait(name.Deliveries)).UnixNano(), EnqueuedAt: name.EnqueuedAt,
          		Entropy: name.Entropy, Deliveries: name.Deliveries, Priority: name.Priority,
          	}
      - bind: renameErr
        eval: |-
          b.root.Rename(
          		path.Join(dirInflight, held), path.Join(dirReady, requeued.readyName()))
        to: b.root.Rename
      - opt:
          do:
            - return: corequeue.NackValue{}, b.classifyMissing("rename", held, renameErr)
          when: renameErr != nil
      - opt:
          do:
            - return: corequeue.NackValue{}, dropErr
          init:
            bind: dropErr
            eval: b.dropStale(path.Join(dirInflight, held))
            to: b.dropStale
          when: dropErr != nil
      - eval: b.wake.fire()
        to: b.wake.fire
      - return: |-
          corequeue.NackValue{
          		Deliveries: name.Deliveries, VisibleAt: time.Unix(0, requeued.At),
          	}, nil
  - of: (*fileBroker).Reject
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).Reject
        kind: self
      - id: b.resolve
        kind: internal
      - id: b.clk.Now().UnixNano
        kind: value
      - id: b.bury
        kind: internal
    steps:
      - bind: held
        eval: string(receipt)
      - bind: name, resolveErr
        eval: b.resolve(ctx, held)
        to: b.resolve
      - opt:
          do:
            - return: resolveErr
          when: resolveErr != nil
      - bind: failedAt
        eval: b.clk.Now().UnixNano()
        to: b.clk.Now().UnixNano
      - return: b.bury(name, held, describeCause(cause), failedAt)
        to: b.bury
  - of: (*fileBroker).Release
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).Release
        kind: self
      - id: b.resolve
        kind: internal
      - id: b.root.Rename
        kind: value
      - id: b.classifyMissing
        kind: internal
      - id: b.dropStale
        kind: internal
      - id: b.wake.fire
        kind: internal
    steps:
      - bind: held
        eval: string(receipt)
      - bind: name, resolveErr
        eval: b.resolve(ctx, held)
        to: b.resolve
      - opt:
          do:
            - return: resolveErr
          when: resolveErr != nil
      - bind: requeued
        eval: |-
          nameValue{
          		At: b.clk.Now().UnixNano(), EnqueuedAt: name.EnqueuedAt,
          		Entropy: name.Entropy, Deliveries: max(name.Deliveries-1, 0), Priority: name.Priority,
          	}
      - bind: renameErr
        eval: |-
          b.root.Rename(
          		path.Join(dirInflight, held), path.Join(dirReady, requeued.readyName()))
        to: b.root.Rename
      - opt:
          do:
            - return: b.classifyMissing("rename", held, renameErr)
              to: b.classifyMissing
          when: renameErr != nil
      - opt:
          do:
            - return: dropErr
          init:
            bind: dropErr
            eval: b.dropStale(path.Join(dirInflight, held))
            to: b.dropStale
          when: dropErr != nil
      - eval: b.wake.fire()
        to: b.wake.fire
      - return: nil
  - of: (*fileBroker).nackDead
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).nackDead
        kind: self
      - id: b.bury
        kind: internal
    steps:
      - opt:
          do:
            - return: corequeue.NackValue{}, buryErr
          init:
            bind: buryErr
            eval: b.bury(name, receipt, describeCause(cause), now)
            to: b.bury
          when: buryErr != nil
      - return: "corequeue.NackValue{Deliveries: name.Deliveries, DeadLettered: true}, nil"
  - of: (*fileBroker).Extend
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).Extend
        kind: self
      - id: b.clk.Now().Add
        kind: value
      - id: b.resolve
        kind: internal
      - id: randomHex
        kind: internal
      - id: b.renameLease
        kind: internal
    steps:
      - opt:
          do:
            - return: |-
                corequeue.LeaseValue{}, kerrs.Wrap(corequeue.QueueMisconfigured, kerrs.WrapParams{},
                			kerrs.String("field", "Extend.by"), kerrs.Int64("value_ns", int64(by)))
          when: by <= 0
      - bind: deadline
        eval: b.clk.Now().Add(by)
        to: b.clk.Now().Add
      - opt:
          do:
            - return: |-
                corequeue.LeaseValue{}, kerrs.Wrap(corequeue.QueueMisconfigured, kerrs.WrapParams{},
                			kerrs.String("field", "Extend.by"), kerrs.Int64("value_ns", int64(by)))
          when: "!nameable(deadline)"
      - bind: held
        eval: string(receipt)
      - bind: name, resolveErr
        eval: b.resolve(ctx, held)
        to: b.resolve
      - opt:
          do:
            - return: corequeue.LeaseValue{}, resolveErr
          when: resolveErr != nil
      - bind: entropy, entropyErr
        eval: randomHex(leaseEntropyBytes)
        to: randomHex
      - opt:
          do:
            - return: corequeue.LeaseValue{}, backendFailed("rand", "", entropyErr)
          when: entropyErr != nil
      - return: b.renameLease(name, held, entropy, deadline.UnixNano())
        to: b.renameLease
  - of: (*fileBroker).renameLease
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).renameLease
        kind: self
      - id: renewed.inflightName
        kind: internal
      - id: b.root.Rename
        kind: value
    steps:
      - bind: renewed
        eval: |-
          nameValue{
          		At: deadline, EnqueuedAt: name.EnqueuedAt, Entropy: name.Entropy,
          		Deliveries: name.Deliveries, Lease: entropy, Priority: name.Priority,
          	}
      - bind: target
        eval: renewed.inflightName()
        to: renewed.inflightName
      - bind: renameErr
        eval: b.root.Rename(path.Join(dirInflight, receipt), path.Join(dirInflight, target))
        to: b.root.Rename
      - opt:
          do:
            - return: corequeue.LeaseValue{}, b.classifyMissing("rename", receipt, renameErr)
          when: renameErr != nil
      - return: |-
          corequeue.LeaseValue{
          		Receipt: corequeue.ReceiptValue(target), ExpiresAt: renewed.AtTime(),
          	}, nil
  - of: (*fileBroker).bury
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).bury
        kind: self
      - id: b.root.ReadFile
        kind: value
      - id: b.classifyMissing
        kind: internal
      - id: encodeDead
        kind: internal
      - id: b.publisher.WriteAtomic
        kind: value
      - id: backendFailed
        kind: internal
      - id: ignoreMissing
        kind: internal
    steps:
      - bind: payload, readErr
        eval: b.root.ReadFile(path.Join(dirInflight, receipt))
        to: b.root.ReadFile
      - opt:
          do:
            - return: b.classifyMissing("read", receipt, readErr)
              to: b.classifyMissing
          when: readErr != nil
      - bind: record
        eval: encodeDead(name, cause, now, payload)
        to: encodeDead
      - opt:
          do:
            - return: backendFailed("publish", dirDead, writeErr)
              to: backendFailed
          init:
            bind: writeErr
            eval: |-
              b.publisher.WriteAtomic(
              		path.Join(dirDead, name.deadName()), record, messageMode,
              	)
            to: b.publisher.WriteAtomic
          when: writeErr != nil
      - return: ignoreMissing("remove", receipt, b.root.Remove(path.Join(dirInflight, receipt)))
        to: ignoreMissing
  - of: (*fileBroker).DeadLetters
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).DeadLetters
        kind: self
      - id: b.DeadLettersAfter
        kind: internal
    steps:
      - return: b.DeadLettersAfter(ctx, "", max)
        to: b.DeadLettersAfter
  - of: (*fileBroker).readDead
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).readDead
        kind: self
      - id: parseDead
        kind: internal
      - id: b.root.ReadFile
        kind: value
      - id: decodeDead
        kind: internal
    steps:
      - bind: name, named
        eval: parseDead(base)
        to: parseDead
      - opt:
          do:
            - return: corequeue.DeadLetterValue{}, false, nil
          when: "!named"
      - bind: raw, readErr
        eval: b.root.ReadFile(path.Join(dirDead, base))
        to: b.root.ReadFile
      - opt:
          do:
            - return: corequeue.DeadLetterValue{}, false, ignoreMissing("read", base, readErr)
          when: readErr != nil
      - bind: decoded, sound
        eval: decodeDead(raw)
        to: decodeDead
      - set: decoded.Priority
        value: name.Priority
      - return: decoded, sound, nil
  - of: encodeDead
    participants:
      - id: caller
        kind: actor
      - id: encodeDead
        kind: self
      - id: header.WriteString
        kind: value
    steps:
      - var:
          name: header
          type: strings.Builder
      - eval: header.WriteString(deadMagic + "\n")
        to: header.WriteString
      - eval: header.WriteString("id " + name.ID() + "\n")
        to: header.WriteString
      - eval: header.WriteString("enqueued " + strconv.FormatInt(name.EnqueuedAt, decimalBase) + "\n")
        to: header.WriteString
      - eval: header.WriteString("failed " + strconv.FormatInt(failedAt, decimalBase) + "\n")
        to: header.WriteString
      - eval: header.WriteString("deliveries " + strconv.Itoa(name.Deliveries) + "\n")
        to: header.WriteString
      - eval: header.WriteString("code " + strconv.FormatUint(uint64(cause.code), decimalBase) + "\n")
        to: header.WriteString
      - opt:
          do:
            - eval: header.WriteString("trail " + encodeTrail(cause.trail) + "\n")
              to: header.WriteString
          when: len(cause.trail) > 0
      - eval: header.WriteString("reason " + oneLine(cause.reason) + "\n")
        to: header.WriteString
      - eval: header.WriteString("public " + oneLine(cause.public) + "\n")
        to: header.WriteString
      - eval: header.WriteString("\n")
        to: header.WriteString
      - bind: record
        eval: make([]byte, 0, header.Len()+len(payload))
      - set: record
        value: append(record, header.String()...)
      - return: append(record, payload...)
  - of: decodeDead
    participants:
      - id: caller
        kind: actor
      - id: decodeDead
        kind: self
      - id: bytes
        kind: stdlib
      - id: strings
        kind: stdlib
    steps:
      - bind: head, payload, split
        eval: bytes.Cut(raw, []byte(deadHeaderSep))
        to: bytes
      - bind: lines
        eval: strings.Split(string(head), "\n")
        to: strings
      - opt:
          do:
            - return: corequeue.DeadLetterValue{}, false
          when: "!split || len(lines) == 0 || lines[0] != deadMagic"
      - bind: fields
        eval: map[string]string{}
      - loop:
          do:
            - bind: key, value, found
              eval: strings.Cut(line, " ")
              to: strings
            - opt:
                do:
                  - set: fields[key]
                    value: value
                when: found
          key: _
          range: lines[1:]
          value: line
      - return: |-
          corequeue.DeadLetterValue{
          		Message: corequeue.MessageValue{
          			ID: fields["id"], Payload: payload, EnqueuedAt: nanoField(fields["enqueued"]),
          		},
          		FailedAt: nanoField(fields["failed"]), Deliveries: intField(fields["deliveries"]),
          		Code: uint32(intField(fields["code"])), Reason: oneLine(fields["reason"]), Cause: oneLine(fields["public"]),
          		Trail: decodeTrail(fields["trail"]),
          	}, true
  - of: oneLine
    participants:
      - id: caller
        kind: actor
      - id: oneLine
        kind: self
      - id: strings.NewReplacer("\n", " ", "\r", " ").Replace
        kind: value
    steps:
      - bind: stripped
        eval: strings.NewReplacer("\n", " ", "\r", " ").Replace(value)
        to: strings.NewReplacer("\n", " ", "\r", " ").Replace
      - bind: runes
        eval: "[]rune(stripped)"
      - opt:
          do:
            - return: string(runes[:publicMaxRunes])
          when: len(runes) > publicMaxRunes
      - return: stripped
  - of: nanoField
    participants:
      - id: caller
        kind: actor
      - id: nanoField
        kind: self
      - id: strconv
        kind: stdlib
      - id: time
        kind: stdlib
    steps:
      - bind: nanos, err
        eval: strconv.ParseInt(value, decimalBase, int64Bits)
        to: strconv
      - opt:
          do:
            - return: time.Time{}
          when: err != nil
      - return: time.Unix(0, nanos)
        to: time
  - of: intField
    participants:
      - id: caller
        kind: actor
      - id: intField
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - bind: count, err
        eval: strconv.Atoi(value)
        to: strconv
      - opt:
          do:
            - return: "0"
          when: err != nil
      - return: count
  - of: (*stateListing).reusable
    steps:
      - return: |-
          modTime.Equal(l.modTime) &&
          		modTime.Before(l.listedAt.Add(-racyMargin)) &&
          		now.Sub(l.listedAt) < listingMaxAge
  - of: (*listings).slot
    steps:
      - switch:
          cases:
            - case: dirReady
              do:
                - return: "&l.ready"
            - case: dirInflight
              do:
                - return: "&l.inflight"
            - case: dirDead
              do:
                - return: "&l.dead"
            - default: true
              do:
                - return: nil
          "on": state
  - of: (*fileBroker).namesOf
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).namesOf
        kind: self
      - id: b.listed.slot
        kind: internal
      - id: b.readNames
        kind: internal
      - id: b.root.Stat
        kind: value
      - id: slot.Load
        kind: value
      - id: slot.Store
        kind: value
    steps:
      - bind: slot
        eval: b.listed.slot(state)
        to: b.listed.slot
      - opt:
          do:
            - return: b.readNames(state)
              to: b.readNames
          when: slot == nil
      - bind: listedAt
        eval: b.listed.wall()
      - bind: info, statErr
        eval: b.root.Stat(state)
        to: b.root.Stat
      - opt:
          do:
            - return: nil, backendFailed("stat", state, statErr)
          when: statErr != nil
      - opt:
          do:
            - return: cached.names, nil
          init:
            bind: cached
            eval: slot.Load()
            to: slot.Load
          when: cached != nil && cached.reusable(info.ModTime(), listedAt)
      - bind: read, readErr
        eval: b.readNames(state)
        to: b.readNames
      - opt:
          do:
            - return: nil, readErr
          when: readErr != nil
      - eval: "slot.Store(&stateListing{listedAt: listedAt, modTime: info.ModTime(), names: read})"
        to: slot.Store
      - return: read, nil
  - of: (*fileBroker).readNames
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).readNames
        kind: self
      - id: b.root.Open
        kind: value
      - id: dir.Readdirnames
        kind: value
      - id: dir.Close
        kind: value
      - id: sortState
        kind: internal
    steps:
      - bind: dir, openErr
        eval: b.root.Open(state)
        to: b.root.Open
      - opt:
          do:
            - return: nil, backendFailed("readdir", state, openErr)
          when: openErr != nil
      - bind: read, readErr
        eval: dir.Readdirnames(-1)
        to: dir.Readdirnames
      - bind: closeErr
        eval: dir.Close()
        to: dir.Close
      - opt:
          do:
            - return: nil, backendFailed("readdir", state, cmp.Or(readErr, closeErr))
          when: readErr != nil || closeErr != nil
      - eval: sortState(state, read)
        to: sortState
      - return: read, nil
  - of: sortState
    participants:
      - id: caller
        kind: actor
      - id: sortState
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - switch:
          cases:
            - case: dirReady
              do:
                - eval: slices.SortFunc(names, compareReady)
                  to: slices
            - case: dirInflight, dirDead
              do:
                - eval: slices.SortFunc(names, compareStem)
                  to: slices
            - default: true
              do:
                - eval: slices.Sort(names)
                  to: slices
          "on": state
  - of: nameValue.ID
    participants:
      - id: caller
        kind: actor
      - id: nameValue.ID
        kind: self
      - id: messageID
        kind: internal
    steps:
      - return: messageID(n.EnqueuedAt, n.Entropy)
        to: messageID
  - of: messageID
    steps:
      - return: pad(enqueuedAt) + "-" + entropy
  - of: parseMessageID
    participants:
      - id: caller
        kind: actor
      - id: parseMessageID
        kind: self
      - id: strings
        kind: stdlib
      - id: parseNano
        kind: internal
    steps:
      - bind: instant, entropy, split
        eval: strings.Cut(id, "-")
        to: strings
      - opt:
          do:
            - return: 0, "", false
          when: "!split || !isHexOfWidth(entropy, idEntropyBytes)"
      - set: enqueuedAt, ok
        to: parseNano
        value: parseNano(instant)
      - return: enqueuedAt, entropy, ok
  - of: nameValue.AtTime
    participants:
      - id: caller
        kind: actor
      - id: nameValue.AtTime
        kind: self
      - id: time
        kind: stdlib
    steps:
      - return: time.Unix(0, n.At)
        to: time
  - of: nameValue.EnqueuedTime
    participants:
      - id: caller
        kind: actor
      - id: nameValue.EnqueuedTime
        kind: self
      - id: time
        kind: stdlib
    steps:
      - return: time.Unix(0, n.EnqueuedAt)
        to: time
  - of: nameValue.readyName
    participants:
      - id: caller
        kind: actor
      - id: nameValue.readyName
        kind: self
      - id: atLevel
        kind: internal
    steps:
      - return: |-
          atLevel(n.Priority, strings.Join([]string{
          		pad(n.At), pad(n.EnqueuedAt), n.Entropy, padCount(n.Deliveries),
          	}, ".")+suffixMessage)
        to: atLevel
  - of: nameValue.inflightName
    participants:
      - id: caller
        kind: actor
      - id: nameValue.inflightName
        kind: self
      - id: atLevel
        kind: internal
    steps:
      - return: |-
          atLevel(n.Priority, strings.Join([]string{
          		pad(n.At), pad(n.EnqueuedAt), n.Entropy, padCount(n.Deliveries), n.Lease,
          	}, ".")+suffixMessage)
        to: atLevel
  - of: nameValue.deadName
    participants:
      - id: caller
        kind: actor
      - id: nameValue.deadName
        kind: self
      - id: atLevel
        kind: internal
    steps:
      - return: |-
          atLevel(n.Priority, strings.Join([]string{
          		pad(n.EnqueuedAt), n.Entropy, padCount(n.Deliveries),
          	}, ".")+suffixDead)
        to: atLevel
  - of: parseReady
    participants:
      - id: caller
        kind: actor
      - id: parseReady
        kind: self
      - id: splitLeveled
        kind: internal
      - id: assemble
        kind: internal
    steps:
      - bind: fields, level, split
        eval: splitLeveled(base, suffixMessage, readyFields)
        to: splitLeveled
      - opt:
          do:
            - return: nameValue{}, false
          when: "!split"
      - set: name, ok
        to: assemble
        value: assemble(fields[posAt], fields[posEnqueued], fields[posEntropy], fields[posDeliveries], "")
      - set: name.Priority
        value: level
      - return: name, ok
  - of: parseInflight
    participants:
      - id: caller
        kind: actor
      - id: parseInflight
        kind: self
      - id: splitLeveled
        kind: internal
      - id: assemble
        kind: internal
    steps:
      - bind: fields, level, split
        eval: splitLeveled(base, suffixMessage, inflightFields)
        to: splitLeveled
      - opt:
          do:
            - return: nameValue{}, false
          when: "!split || fields[posLease] == \"\""
      - set: name, ok
        to: assemble
        value: assemble(fields[posAt], fields[posEnqueued], fields[posEntropy], fields[posDeliveries], fields[posLease])
      - set: name.Priority
        value: level
      - return: name, ok
  - of: parseDead
    participants:
      - id: caller
        kind: actor
      - id: parseDead
        kind: self
      - id: splitLeveled
        kind: internal
      - id: assemble
        kind: internal
    steps:
      - bind: fields, level, split
        eval: splitLeveled(base, suffixDead, deadFields)
        to: splitLeveled
      - opt:
          do:
            - return: nameValue{}, false
          when: "!split"
      - set: name, ok
        to: assemble
        value: assemble(fields[posDeadEnqueued], fields[posDeadEnqueued], fields[posDeadEntropy], fields[posDeadDeliveries], "")
      - set: name.Priority
        value: level
      - return: name, ok
  - of: splitLeveled
    participants:
      - id: caller
        kind: actor
      - id: splitLeveled
        kind: self
      - id: nameStem
        kind: internal
      - id: levelOf
        kind: internal
      - id: splitName
        kind: internal
    steps:
      - bind: digit, stem
        eval: nameStem(base)
        to: nameStem
      - bind: level, known
        eval: levelOf(digit)
        to: levelOf
      - opt:
          do:
            - return: fields, corequeue.PriorityNormal, false
          when: "!known || (level == corequeue.PriorityNormal && len(stem) != len(base))"
      - set: fields, ok
        to: splitName
        value: splitName(stem, suffix, want)
      - return: fields, level, ok
  - of: atLevel
    steps:
      - opt:
          do:
            - return: name
          when: level == corequeue.PriorityNormal
      - return: string(rune('0'+int(corequeue.PriorityHighest-level))) + "." + name
  - of: nameStem
    steps:
      - opt:
          do:
            - return: base[0], base[2:]
          when: len(base) > 2 && base[1] == '.'
      - return: normalDigit, base
  - of: levelOf
    steps:
      - opt:
          do:
            - return: corequeue.PriorityNormal, true
          when: digit == normalDigit
      - opt:
          do:
            - return: corequeue.PriorityNormal, false
          when: digit < '0' || digit > '0'+byte(corequeue.PriorityHighest-corequeue.PriorityLowest)
      - return: corequeue.PriorityHighest - corequeue.Priority(digit-'0'), true
  - of: compareReady
    participants:
      - id: caller
        kind: actor
      - id: compareReady
        kind: self
      - id: nameStem
        kind: internal
      - id: cmp
        kind: stdlib
    steps:
      - bind: firstDigit, firstStem
        eval: nameStem(first)
        to: nameStem
      - bind: secondDigit, secondStem
        eval: nameStem(second)
        to: nameStem
      - return: cmp.Or(cmp.Compare(firstDigit, secondDigit), strings.Compare(firstStem, secondStem))
        to: cmp
  - of: compareStem
    participants:
      - id: caller
        kind: actor
      - id: compareStem
        kind: self
      - id: nameStem
        kind: internal
      - id: strings
        kind: stdlib
    steps:
      - bind: _, firstStem
        eval: nameStem(first)
        to: nameStem
      - bind: _, secondStem
        eval: nameStem(second)
        to: nameStem
      - return: strings.Compare(firstStem, secondStem)
        to: strings
  - of: assemble
    participants:
      - id: caller
        kind: actor
      - id: assemble
        kind: self
      - id: parseNano
        kind: internal
      - id: parseCount
        kind: internal
    steps:
      - bind: atNanos, atOK
        eval: parseNano(at)
        to: parseNano
      - bind: enqueuedNanos, enqueuedOK
        eval: parseNano(enqueued)
        to: parseNano
      - bind: count, countOK
        eval: parseCount(deliveries)
        to: parseCount
      - opt:
          do:
            - return: nameValue{}, false
          when: "!atOK || !enqueuedOK || !countOK || !randomFieldsWellFormed(entropy, lease)"
      - return: |-
          nameValue{
          		At: atNanos, EnqueuedAt: enqueuedNanos,
          		Entropy: entropy, Deliveries: count, Lease: lease,
          	}, true
  - of: splitName
    participants:
      - id: caller
        kind: actor
      - id: splitName
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - bind: stem, trimmed
        eval: strings.CutSuffix(base, suffix)
        to: strings
      - opt:
          do:
            - return: fields, false
          when: "!trimmed"
      - loop:
          do:
            - bind: field, rest, more
              eval: strings.Cut(stem, ".")
              to: strings
            - opt:
                do:
                  - return: "[maxNameFields]string{}, false"
                when: more != (index < want-1)
            - set: fields[index]
              value: field
            - set: stem
              value: rest
          key: index
          range: want
      - return: fields, true
  - of: parseNano
    participants:
      - id: caller
        kind: actor
      - id: parseNano
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - opt:
          do:
            - return: 0, false
          when: len(field) != nanoWidth || strings.Trim(field, "0123456789") != ""
      - bind: value, err
        eval: strconv.ParseInt(field, decimalBase, int64Bits)
        to: strconv
      - opt:
          do:
            - return: 0, false
          when: err != nil || value < 0
      - return: value, true
  - of: parseCount
    participants:
      - id: caller
        kind: actor
      - id: parseCount
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - opt:
          do:
            - return: 0, false
          when: |-
            len(field) < deliveryWidth || strings.Trim(field, "0123456789") != "" ||
            		(len(field) > deliveryWidth && field[0] == '0')
      - bind: count, err
        eval: strconv.Atoi(field)
        to: strconv
      - opt:
          do:
            - return: 0, false
          when: err != nil
      - return: count, true
  - of: randomFieldsWellFormed
    steps:
      - return: isHexOfWidth(entropy, idEntropyBytes) && (lease == "" || isHexOfWidth(lease, leaseEntropyBytes))
  - of: isHexOfWidth
    steps:
      - return: len(field) == hex.EncodedLen(n) && isHex(field)
  - of: nameable
    steps:
      - return: "!at.Before(time.Unix(0, 0)) && !at.After(time.Unix(0, math.MaxInt64))"
  - of: pad
    participants:
      - id: caller
        kind: actor
      - id: pad
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - bind: digits
        eval: strconv.FormatInt(nanos, decimalBase)
        to: strconv
      - return: strings.Repeat("0", max(0, nanoWidth-len(digits))) + digits
  - of: padCount
    participants:
      - id: caller
        kind: actor
      - id: padCount
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - bind: digits
        eval: strconv.Itoa(count)
        to: strconv
      - return: strings.Repeat("0", max(0, deliveryWidth-len(digits))) + digits
  - of: (*fileBroker).PublishOnce
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).PublishOnce
        kind: self
      - id: checkSize
        kind: internal
      - id: b.clk.Now
        kind: value
      - id: onceUntil
        kind: internal
      - id: b.sweepOnce
        kind: internal
      - id: onceDigest
        kind: internal
      - id: b.reservedUntil
        kind: internal
      - id: b.write
        kind: internal
      - id: b.reserve
        kind: internal
      - id: b.wake.fire
        kind: internal
      - id: b.withdraw
        kind: internal
    steps:
      - opt:
          do:
            - return: corequeue.MessageValue{}, false, ctx.Err()
          when: ctx.Err() != nil
      - opt:
          do:
            - return: corequeue.MessageValue{}, false, tooLarge
          init:
            bind: tooLarge
            eval: checkSize(len(payload), b.policy.MaxMessageBytes)
            to: checkSize
          when: tooLarge != nil
      - bind: now
        eval: b.clk.Now()
        to: b.clk.Now
      - bind: until, invalid
        eval: onceUntil(now, key, window)
        to: onceUntil
      - opt:
          do:
            - return: corequeue.MessageValue{}, false, invalid
          when: invalid != nil
      - opt:
          do:
            - return: corequeue.MessageValue{}, false, sweepErr
          init:
            bind: sweepErr
            eval: b.sweepOnce(now)
            to: b.sweepOnce
          when: sweepErr != nil
      - bind: digest
        eval: onceDigest(key)
        to: onceDigest
      - bind: held, readErr
        eval: b.reservedUntil(digest)
        to: b.reservedUntil
      - opt:
          do:
            - return: corequeue.MessageValue{}, false, readErr
          when: readErr != nil
      - opt:
          do:
            - return: corequeue.MessageValue{}, false, nil
          when: held > now.UnixNano()
      - bind: name, writeErr
        eval: b.write(payload, now, now, corequeue.PriorityNormal)
        to: b.write
      - opt:
          do:
            - return: corequeue.MessageValue{}, false, writeErr
          when: writeErr != nil
      - set: message
        value: "corequeue.MessageValue{ID: name.ID(), Payload: payload, EnqueuedAt: now}"
      - bind: reserved, reserveErr
        eval: b.reserve(digest, until.UnixNano(), now.UnixNano())
        to: b.reserve
      - opt:
          do:
            - eval: b.wake.fire()
              to: b.wake.fire
            - return: message, true, nil
          when: reserveErr == nil && reserved
      - return: b.withdraw(message, name, reserveErr)
        to: b.withdraw
  - of: (*fileBroker).withdraw
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).withdraw
        kind: self
      - id: b.root.Remove
        kind: value
      - id: b.wake.fire
        kind: internal
    steps:
      - bind: removeErr
        eval: b.root.Remove(path.Join(dirReady, name.readyName()))
        to: b.root.Remove
      - opt:
          do:
            - eval: b.wake.fire()
              to: b.wake.fire
            - return: message, true, nil
          when: os.IsNotExist(removeErr)
      - opt:
          do:
            - eval: b.wake.fire()
              to: b.wake.fire
            - return: corequeue.MessageValue{}, false, backendFailed("remove", dirReady, removeErr)
          when: removeErr != nil
      - opt:
          do:
            - return: corequeue.MessageValue{}, false, reserveErr
          when: reserveErr != nil
      - return: corequeue.MessageValue{}, false, nil
  - of: (*fileBroker).reserve
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).reserve
        kind: self
      - id: b.createReservation
        kind: internal
      - id: b.reservedUntil
        kind: internal
      - id: b.dropPassed
        kind: internal
    steps:
      - loop:
          do:
            - bind: created, createErr
              eval: b.createReservation(digest, until)
              to: b.createReservation
            - opt:
                do:
                  - return: false, createErr
                when: createErr != nil
            - opt:
                do:
                  - return: true, nil
                when: created
            - bind: held, readErr
              eval: b.reservedUntil(digest)
              to: b.reservedUntil
            - opt:
                do:
                  - return: false, readErr
                when: readErr != nil
            - opt:
                do:
                  - return: false, nil
                when: held > now
            - opt:
                do:
                  - return: false, dropErr
                init:
                  bind: dropErr
                  eval: b.dropPassed(digest, now)
                  to: b.dropPassed
                when: dropErr != nil
          range: onceTakeovers
      - return: false, nil
  - of: (*fileBroker).createReservation
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).createReservation
        kind: self
      - id: randomHex
        kind: internal
      - id: path
        kind: stdlib
      - id: b.root.OpenFile
        kind: value
      - id: file.WriteString
        kind: value
      - id: file.Close
        kind: value
      - id: b.root.Link
        kind: value
      - id: ignoreMissing
        kind: internal
    steps:
      - bind: entropy, entropyErr
        eval: randomHex(leaseEntropyBytes)
        to: randomHex
      - opt:
          do:
            - return: false, backendFailed("rand", "", entropyErr)
          when: entropyErr != nil
      - bind: written
        eval: path.Join(dirOnce, digest+"."+entropy+suffixNew)
        to: path
      - bind: file, openErr
        eval: b.root.OpenFile(written, os.O_WRONLY|os.O_CREATE|os.O_EXCL, messageMode)
        to: b.root.OpenFile
      - opt:
          do:
            - return: false, backendFailed("create", dirOnce, openErr)
          when: openErr != nil
      - bind: _, writeErr
        eval: file.WriteString(pad(until))
        to: file.WriteString
      - opt:
          do:
            - return: |-
                false, errors.Join(backendFailed("write", dirOnce, errors.Join(writeErr, closeErr)),
                			ignoreMissing("remove", dirOnce, b.root.Remove(written)))
          init:
            bind: closeErr
            eval: file.Close()
            to: file.Close
          when: writeErr != nil || closeErr != nil
      - bind: linkErr
        eval: b.root.Link(written, path.Join(dirOnce, digest+suffixOnce))
        to: b.root.Link
      - bind: removeErr
        eval: ignoreMissing("remove", dirOnce, b.root.Remove(written))
        to: ignoreMissing
      - opt:
          do:
            - return: false, removeErr
          when: errors.Is(linkErr, fs.ErrExist)
      - opt:
          do:
            - return: false, errors.Join(backendFailed("link", dirOnce, linkErr), removeErr)
          when: linkErr != nil
      - return: true, nil
  - of: (*fileBroker).reservedUntil
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).reservedUntil
        kind: self
      - id: b.root.ReadFile
        kind: value
      - id: parseNano
        kind: internal
    steps:
      - bind: content, readErr
        eval: b.root.ReadFile(path.Join(dirOnce, digest+suffixOnce))
        to: b.root.ReadFile
      - opt:
          do:
            - return: 0, nil
          when: errors.Is(readErr, fs.ErrNotExist)
      - opt:
          do:
            - return: 0, backendFailed("read", dirOnce, readErr)
          when: readErr != nil
      - bind: until, ok
        eval: parseNano(string(content))
        to: parseNano
      - opt:
          do:
            - return: 0, nil
          when: "!ok"
      - return: until, nil
  - of: (*fileBroker).dropPassed
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).dropPassed
        kind: self
      - id: randomHex
        kind: internal
      - id: backendFailed
        kind: internal
      - id: path
        kind: stdlib
      - id: b.root.Rename
        kind: value
      - id: b.root.Link
        kind: value
      - id: ignoreMissing
        kind: internal
    steps:
      - bind: entropy, entropyErr
        eval: randomHex(leaseEntropyBytes)
        to: randomHex
      - opt:
          do:
            - return: backendFailed("rand", "", entropyErr)
              to: backendFailed
          when: entropyErr != nil
      - bind: reservation
        eval: path.Join(dirOnce, digest+suffixOnce)
        to: path
      - bind: aside
        eval: path.Join(dirOnce, digest+"."+entropy+suffixGone)
        to: path
      - bind: renameErr
        eval: b.root.Rename(reservation, aside)
        to: b.root.Rename
      - opt:
          do:
            - return: nil
          when: errors.Is(renameErr, fs.ErrNotExist)
      - opt:
          do:
            - return: backendFailed("rename", dirOnce, renameErr)
              to: backendFailed
          when: renameErr != nil
      - opt:
          do:
            - opt:
                do:
                  - return: backendFailed("link", dirOnce, linkErr)
                    to: backendFailed
                init:
                  bind: linkErr
                  eval: b.root.Link(aside, reservation)
                  to: b.root.Link
                when: linkErr != nil && !errors.Is(linkErr, fs.ErrExist)
          when: b.asideStillRuns(aside, now)
      - return: ignoreMissing("remove", dirOnce, b.root.Remove(aside))
        to: ignoreMissing
  - of: (*fileBroker).asideStillRuns
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).asideStillRuns
        kind: self
      - id: b.root.ReadFile
        kind: value
      - id: parseNano
        kind: internal
    steps:
      - bind: content, readErr
        eval: b.root.ReadFile(name)
        to: b.root.ReadFile
      - opt:
          do:
            - return: "false"
          when: readErr != nil
      - bind: until, ok
        eval: parseNano(string(content))
        to: parseNano
      - return: ok && until > now
  - of: (*fileBroker).sweepOnce
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).sweepOnce
        kind: self
      - id: b.onceSwept.Load
        kind: value
      - id: b.namesOf
        kind: internal
      - id: b.sweepEntry
        kind: internal
    steps:
      - bind: last
        eval: b.onceSwept.Load()
        to: b.onceSwept.Load
      - bind: recent
        eval: last != 0 && now.UnixNano() >= last && now.UnixNano()-last < int64(onceSweepEvery)
      - opt:
          do:
            - return: nil
          when: recent || !b.onceSwept.CompareAndSwap(last, now.UnixNano())
      - bind: entries, listErr
        eval: b.namesOf(dirOnce)
        to: b.namesOf
      - opt:
          do:
            - return: listErr
          when: listErr != nil
      - loop:
          do:
            - opt:
                do:
                  - return: sweepErr
                init:
                  bind: sweepErr
                  eval: b.sweepEntry(base, now.UnixNano())
                  to: b.sweepEntry
                when: sweepErr != nil
          key: _
          range: entries
          value: base
      - return: nil
  - of: (*fileBroker).sweepEntry
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).sweepEntry
        kind: self
      - id: strings
        kind: stdlib
      - id: b.reservedUntil
        kind: internal
      - id: b.dropPassed
        kind: internal
      - id: path
        kind: stdlib
      - id: ignoreMissing
        kind: internal
    steps:
      - opt:
          do:
            - bind: held, readErr
              eval: b.reservedUntil(digest)
              to: b.reservedUntil
            - opt:
                do:
                  - return: readErr
                when: readErr != nil
            - opt:
                do:
                  - return: nil
                when: held > now
            - return: b.dropPassed(digest, now)
              to: b.dropPassed
          init:
            bind: digest, isReservation
            eval: strings.CutSuffix(base, suffixOnce)
            to: strings
          when: isReservation
      - bind: name
        eval: path.Join(dirOnce, base)
        to: path
      - opt:
          do:
            - return: ignoreMissing("remove", dirOnce, b.root.Remove(name))
              to: ignoreMissing
          when: |-
            (strings.HasSuffix(base, suffixGone) && !b.asideStillRuns(name, now)) ||
            		(strings.HasSuffix(base, suffixNew) && b.writtenAndPassed(name, now))
      - return: nil
  - of: (*fileBroker).writtenAndPassed
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).writtenAndPassed
        kind: self
      - id: b.root.ReadFile
        kind: value
      - id: parseNano
        kind: internal
    steps:
      - bind: content, readErr
        eval: b.root.ReadFile(name)
        to: b.root.ReadFile
      - opt:
          do:
            - return: "false"
          when: readErr != nil
      - bind: until, ok
        eval: parseNano(string(content))
        to: parseNano
      - return: ok && until <= now
  - of: (*fileBroker).Receive
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).Receive
        kind: self
      - id: checkBatch
        kind: internal
      - id: b.clk.Now().UnixNano
        kind: value
      - id: b.reclaim
        kind: internal
      - id: b.sweepRetention
        kind: internal
      - id: b.leaseVisible
        kind: internal
      - id: b.wake.record
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, invalid
          init:
            bind: invalid
            eval: checkBatch(max)
            to: checkBatch
          when: invalid != nil
      - opt:
          do:
            - return: nil, ctx.Err()
          when: ctx.Err() != nil
      - bind: now
        eval: b.clk.Now().UnixNano()
        to: b.clk.Now().UnixNano
      - bind: lapse, reclaimErr
        eval: b.reclaim(now)
        to: b.reclaim
      - opt:
          do:
            - return: nil, reclaimErr
          when: reclaimErr != nil
      - opt:
          do:
            - return: nil, sweepErr
          init:
            bind: sweepErr
            eval: b.sweepRetention(now)
            to: b.sweepRetention
          when: sweepErr != nil
      - bind: batch, visible, leaseErr
        eval: b.leaseVisible(now, max)
        to: b.leaseVisible
      - opt:
          do:
            - return: nil, leaseErr
          when: leaseErr != nil
      - var:
          name: leased
          type: int64
      - opt:
          do:
            - set: leased
              value: now + int64(b.policy.VisibilityTimeout)
          when: len(batch) > 0
      - eval: b.wake.record(earliest(lapse, visible, leased))
        to: b.wake.record
      - return: batch, nil
  - of: (*fileBroker).leaseVisible
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).leaseVisible
        kind: self
      - id: b.namesOf
        kind: internal
      - id: b.leaseStep
        kind: internal
    steps:
      - bind: entries, listErr
        eval: b.namesOf(dirReady)
        to: b.namesOf
      - opt:
          do:
            - return: nil, 0, listErr
          when: listErr != nil
      - bind: walk
        eval: "leaseWalk{now: now, max: max}"
      - loop:
          do:
            - bind: full, stepErr
              eval: b.leaseStep(&walk, base)
              to: b.leaseStep
            - opt:
                do:
                  - return: nil, 0, stepErr
                when: stepErr != nil
            - opt:
                do:
                  - return: walk.out, now, nil
                when: full
          key: _
          range: entries
          value: base
      - return: walk.out, walk.later, nil
  - of: (*fileBroker).leaseStep
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).leaseStep
        kind: self
      - id: parseReady
        kind: internal
      - id: nameStem
        kind: internal
      - id: b.takeLease
        kind: internal
    steps:
      - bind: name, ok
        eval: parseReady(base)
        to: parseReady
      - bind: digit, _
        eval: nameStem(base)
        to: nameStem
      - opt:
          do:
            - return: false, nil
          when: "!ok || digit == walk.skipping"
      - opt:
          do:
            - set: walk.later, walk.skipping
              value: earliest(walk.later, name.At), digit
            - return: false, nil
          when: name.At > walk.now
      - opt:
          do:
            - return: false, b.expireReady(name, base, walk.now)
          when: messageExpired(b.policy, name.EnqueuedAt, walk.now)
      - opt:
          do:
            - return: true, nil
          when: len(walk.out) == walk.max
      - bind: delivery, leased, leaseErr
        eval: b.takeLease(name, base, walk.now)
        to: b.takeLease
      - opt:
          do:
            - set: walk.out
              value: append(walk.out, delivery)
          when: leased
      - return: false, leaseErr
  - of: (*fileBroker).takeLease
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).takeLease
        kind: self
      - id: randomHex
        kind: internal
      - id: leasedName.inflightName
        kind: internal
      - id: b.root.Rename
        kind: value
      - id: b.dropStale
        kind: internal
      - id: b.readLeased
        kind: internal
    steps:
      - bind: lease, entropyErr
        eval: randomHex(leaseEntropyBytes)
        to: randomHex
      - opt:
          do:
            - return: corequeue.DeliveryValue{}, false, backendFailed("rand", "", entropyErr)
          when: entropyErr != nil
      - bind: leasedName
        eval: |-
          nameValue{
          		At: now + int64(b.policy.VisibilityTimeout), EnqueuedAt: name.EnqueuedAt,
          		Entropy: name.Entropy, Deliveries: name.Deliveries + 1, Lease: lease, Priority: name.Priority,
          	}
      - bind: target
        eval: leasedName.inflightName()
        to: leasedName.inflightName
      - bind: renameErr
        eval: b.root.Rename(path.Join(dirReady, base), path.Join(dirInflight, target))
        to: b.root.Rename
      - opt:
          do:
            - opt:
                do:
                  - opt:
                      do:
                        - return: corequeue.DeliveryValue{}, false, dropErr
                      init:
                        bind: dropErr
                        eval: b.dropStale(path.Join(dirInflight, target))
                        to: b.dropStale
                      when: dropErr != nil
                when: os.IsNotExist(renameErr)
            - return: corequeue.DeliveryValue{}, false, ignoreMissing("rename", base, renameErr)
          when: renameErr != nil
      - opt:
          do:
            - return: corequeue.DeliveryValue{}, false, dropErr
          init:
            bind: dropErr
            eval: b.dropStale(path.Join(dirReady, base))
            to: b.dropStale
          when: dropErr != nil
      - return: b.readLeased(leasedName, target)
        to: b.readLeased
  - of: (*fileBroker).readLeased
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).readLeased
        kind: self
      - id: b.root.ReadFile
        kind: value
    steps:
      - bind: payload, readErr
        eval: b.root.ReadFile(path.Join(dirInflight, receipt))
        to: b.root.ReadFile
      - opt:
          do:
            - return: corequeue.DeliveryValue{}, false, backendFailed("read", receipt, readErr)
          when: readErr != nil
      - return: |-
          corequeue.DeliveryValue{
          		Message: corequeue.MessageValue{
          			ID: name.ID(), Payload: payload, EnqueuedAt: name.EnqueuedTime(),
          		},
          		Lease: corequeue.LeaseValue{
          			Receipt: corequeue.ReceiptValue(receipt), ExpiresAt: name.AtTime(),
          		},
          		Deliveries: name.Deliveries,
          	}, true, nil
  - of: (*fileBroker).reclaim
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).reclaim
        kind: self
      - id: b.namesOf
        kind: internal
      - id: parseInflight
        kind: internal
      - id: b.recoverOne
        kind: internal
    steps:
      - bind: entries, listErr
        eval: b.namesOf(dirInflight)
        to: b.namesOf
      - opt:
          do:
            - return: 0, listErr
          when: listErr != nil
      - loop:
          do:
            - bind: name, ok
              eval: parseInflight(base)
              to: parseInflight
            - opt:
                do:
                  - continue: true
                when: "!ok"
            - opt:
                do:
                  - return: name.At, nil
                when: name.At > now
            - opt:
                do:
                  - return: 0, recoverErr
                init:
                  bind: recoverErr
                  eval: b.recoverOne(name, base, now)
                  to: b.recoverOne
                when: recoverErr != nil
          key: _
          range: entries
          value: base
      - return: 0, nil
  - of: (*fileBroker).recoverOne
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).recoverOne
        kind: self
      - id: b.bury
        kind: internal
      - id: b.root.Rename
        kind: value
      - id: ignoreMissing
        kind: internal
      - id: b.dropStale
        kind: internal
    steps:
      - opt:
          do:
            - return: "b.bury(name, base, causeValue{reason: reasonLeaseExpired}, now)"
              to: b.bury
          when: name.Deliveries >= b.policy.MaxDeliveries
      - bind: requeued
        eval: |-
          nameValue{
          		//: a lapsed lease has ALREADY waited a whole visibility timeout, so it
          		//: is not charged the retry delay on top: a crashed consumer must not
          		//: be punished harder than a failing one.
          		At: now, EnqueuedAt: name.EnqueuedAt, Entropy: name.Entropy, Deliveries: name.Deliveries,
          		Priority: name.Priority,
          	}
      - bind: renameErr
        eval: b.root.Rename(path.Join(dirInflight, base), path.Join(dirReady, requeued.readyName()))
        to: b.root.Rename
      - opt:
          do:
            - return: ignoreMissing("rename", base, renameErr)
              to: ignoreMissing
          when: renameErr != nil
      - return: b.dropStale(path.Join(dirInflight, base))
        to: b.dropStale
  - of: (*fileBroker).dropStale
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).dropStale
        kind: self
      - id: ignoreMissing
        kind: internal
    steps:
      - return: ignoreMissing("remove", name, b.root.Remove(name))
        to: ignoreMissing
  - of: ignoreMissing
    participants:
      - id: caller
        kind: actor
      - id: ignoreMissing
        kind: self
      - id: backendFailed
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: cause == nil || os.IsNotExist(cause)
      - return: backendFailed(op, name, cause)
        to: backendFailed
  - of: (*fileBroker).expireReady
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).expireReady
        kind: self
      - id: randomHex
        kind: internal
      - id: backendFailed
        kind: internal
      - id: claimed.inflightName
        kind: internal
      - id: b.root.Rename
        kind: value
      - id: b.dropStale
        kind: internal
      - id: ignoreMissing
        kind: internal
      - id: b.bury
        kind: internal
    steps:
      - bind: lease, entropyErr
        eval: randomHex(leaseEntropyBytes)
        to: randomHex
      - opt:
          do:
            - return: backendFailed("rand", "", entropyErr)
              to: backendFailed
          when: entropyErr != nil
      - bind: claimed
        eval: |-
          nameValue{
          		At: now + int64(b.policy.VisibilityTimeout), EnqueuedAt: name.EnqueuedAt,
          		Entropy: name.Entropy, Deliveries: name.Deliveries, Lease: lease, Priority: name.Priority,
          	}
      - bind: target
        eval: claimed.inflightName()
        to: claimed.inflightName
      - bind: renameErr
        eval: b.root.Rename(path.Join(dirReady, base), path.Join(dirInflight, target))
        to: b.root.Rename
      - opt:
          do:
            - opt:
                do:
                  - opt:
                      do:
                        - return: dropErr
                      init:
                        bind: dropErr
                        eval: b.dropStale(path.Join(dirInflight, target))
                        to: b.dropStale
                      when: dropErr != nil
                when: os.IsNotExist(renameErr)
            - return: ignoreMissing("rename", base, renameErr)
              to: ignoreMissing
          when: renameErr != nil
      - opt:
          do:
            - return: dropErr
          init:
            bind: dropErr
            eval: b.dropStale(path.Join(dirReady, base))
            to: b.dropStale
          when: dropErr != nil
      - return: b.bury(claimed, target, expiredCause(), now)
        to: b.bury
  - of: (*fileBroker).ReplayDeadLetter
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).ReplayDeadLetter
        kind: self
      - id: ctx.Err
        kind: value
      - id: b.deadRecordsOf
        kind: internal
      - id: b.replayRecords
        kind: internal
      - id: deadLetterNotFound
        kind: internal
    steps:
      - opt:
          do:
            - return: ctx.Err()
              to: ctx.Err
          when: ctx.Err() != nil
      - bind: records, listErr
        eval: b.deadRecordsOf(id)
        to: b.deadRecordsOf
      - opt:
          do:
            - return: listErr
          when: listErr != nil
      - bind: queued, replayErr
        eval: b.replayRecords(id, records)
        to: b.replayRecords
      - opt:
          do:
            - return: replayErr
          when: replayErr != nil
      - opt:
          do:
            - return: deadLetterNotFound("file", id)
              to: deadLetterNotFound
          when: "!queued"
      - return: nil
  - of: (*fileBroker).replayRecords
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).replayRecords
        kind: self
      - id: b.readDead
        kind: internal
      - id: parseDead
        kind: internal
      - id: b.publisher.WriteAtomic
        kind: value
      - id: b.wake.fire
        kind: internal
    steps:
      - loop:
          do:
            - bind: record, ok, readErr
              eval: b.readDead(base)
              to: b.readDead
            - opt:
                do:
                  - return: false, readErr
                when: readErr != nil
            - opt:
                do:
                  - continue: true
                when: "!ok || record.Message.ID != id"
            - bind: name, _
              eval: parseDead(base)
              to: parseDead
            - bind: requeued
              eval: "nameValue{At: b.clk.Now().UnixNano(), EnqueuedAt: name.EnqueuedAt, Entropy: name.Entropy, Priority: name.Priority}"
            - opt:
                do:
                  - return: false, backendFailed("publish", dirReady, writeErr)
                init:
                  bind: writeErr
                  eval: |-
                    b.publisher.WriteAtomic(
                    			path.Join(dirReady, requeued.readyName()), record.Message.Payload, messageMode,
                    		)
                  to: b.publisher.WriteAtomic
                when: writeErr != nil
            - eval: b.wake.fire()
              to: b.wake.fire
            - return: true, b.removeDead(records)
          key: _
          range: records
          value: base
      - return: false, nil
  - of: (*fileBroker).DeleteDeadLetter
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).DeleteDeadLetter
        kind: self
      - id: ctx.Err
        kind: value
      - id: b.deadRecordsOf
        kind: internal
      - id: deadLetterNotFound
        kind: internal
      - id: b.removeDead
        kind: internal
    steps:
      - opt:
          do:
            - return: ctx.Err()
              to: ctx.Err
          when: ctx.Err() != nil
      - bind: records, listErr
        eval: b.deadRecordsOf(id)
        to: b.deadRecordsOf
      - opt:
          do:
            - return: listErr
          when: listErr != nil
      - opt:
          do:
            - return: deadLetterNotFound("file", id)
              to: deadLetterNotFound
          when: len(records) == 0
      - return: b.removeDead(records)
        to: b.removeDead
  - of: (*fileBroker).PutDeadLetter
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).PutDeadLetter
        kind: self
      - id: checkDeadLetter
        kind: internal
      - id: randomHex
        kind: internal
      - id: encodeDead
        kind: internal
      - id: b.publisher.WriteAtomic
        kind: value
      - id: name.ID
        kind: internal
    steps:
      - opt:
          do:
            - return: "\"\", ctx.Err()"
          when: ctx.Err() != nil
      - opt:
          do:
            - return: "\"\", invalid"
          init:
            bind: invalid
            eval: checkDeadLetter(dead, b.policy.MaxMessageBytes)
            to: checkDeadLetter
          when: invalid != nil
      - bind: entropy, entropyErr
        eval: randomHex(idEntropyBytes)
        to: randomHex
      - opt:
          do:
            - return: "\"\", backendFailed(\"rand\", \"\", entropyErr)"
          when: entropyErr != nil
      - bind: name
        eval: |-
          nameValue{
          		EnqueuedAt: dead.Message.EnqueuedAt.UnixNano(), Entropy: entropy, Deliveries: dead.Deliveries, Priority: dead.Priority,
          	}
      - bind: cause
        eval: "causeValue{reason: dead.Reason, public: dead.Cause, code: dead.Code, trail: dead.Trail}"
      - bind: record
        eval: encodeDead(name, cause, dead.FailedAt.UnixNano(), dead.Message.Payload)
        to: encodeDead
      - opt:
          do:
            - return: "\"\", backendFailed(\"publish\", dirDead, writeErr)"
          init:
            bind: writeErr
            eval: b.publisher.WriteAtomic(path.Join(dirDead, name.deadName()), record, messageMode)
            to: b.publisher.WriteAtomic
          when: writeErr != nil
      - return: name.ID(), nil
        to: name.ID
  - of: (*fileBroker).Messages
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).Messages
        kind: self
      - id: checkBatch
        kind: internal
      - id: b.liveFiles
        kind: internal
      - id: b.root.ReadFile
        kind: value
      - id: ignoreMissing
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, invalid
          init:
            bind: invalid
            eval: checkBatch(max)
            to: checkBatch
          when: invalid != nil
      - opt:
          do:
            - return: nil, ctx.Err()
          when: ctx.Err() != nil
      - bind: found, listErr
        eval: b.liveFiles(after)
        to: b.liveFiles
      - opt:
          do:
            - return: nil, listErr
          when: listErr != nil
      - var:
          name: out
          type: "[]corequeue.LiveMessageValue"
      - loop:
          do:
            - bind: payload, readErr
              eval: b.root.ReadFile(path.Join(f.dir, f.base))
              to: b.root.ReadFile
            - opt:
                do:
                  - opt:
                      do:
                        - return: nil, missing
                      init:
                        bind: missing
                        eval: ignoreMissing("read", f.base, readErr)
                        to: ignoreMissing
                      when: missing != nil
                  - continue: true
                when: readErr != nil
            - set: out
              value: |-
                append(out, corequeue.LiveMessageValue{
                			VisibleAt:  f.name.AtTime(),
                			Message:    corequeue.MessageValue{ID: f.id, Payload: payload, EnqueuedAt: f.name.EnqueuedTime()},
                			Deliveries: f.name.Deliveries, Leased: f.leased, Priority: f.name.Priority,
                		})
            - opt:
                do:
                  - break: true
                when: len(out) == max
          key: _
          range: found
          value: f
      - return: out, nil
  - of: (*fileBroker).liveFiles
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).liveFiles
        kind: self
      - id: b.namesOf
        kind: internal
      - id: parseLive
        kind: internal
      - id: slices
        kind: stdlib
    steps:
      - var:
          name: found
          type: "[]liveFile"
      - loop:
          do:
            - bind: entries, err
              eval: b.namesOf(dir)
              to: b.namesOf
            - opt:
                do:
                  - return: nil, err
                when: err != nil
            - loop:
                do:
                  - bind: name, ok
                    eval: parseLive(dir, base)
                    to: parseLive
                  - opt:
                      do:
                        - continue: true
                      when: "!ok || name.ID() <= after"
                  - set: found
                    value: "append(found, liveFile{dir: dir, base: base, id: name.ID(), name: name, leased: dir == dirInflight})"
                key: _
                range: entries
                value: base
          key: _
          range: "[]string{dirReady, dirInflight}"
          value: dir
      - eval: |-
          slices.SortFunc(found, func(x, y liveFile) int {
          		//: byte order of the identifiers, as the SQL broker's ORDER BY id.
          		return strings.Compare(x.id, y.id)
          	})
        to: slices
      - return: found, nil
  - of: parseLive
    participants:
      - id: caller
        kind: actor
      - id: parseLive
        kind: self
      - id: parseInflight
        kind: internal
      - id: parseReady
        kind: internal
    steps:
      - opt:
          do:
            - return: parseInflight(base)
              to: parseInflight
          when: dir == dirInflight
      - return: parseReady(base)
        to: parseReady
  - of: (*fileBroker).PutMessage
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).PutMessage
        kind: self
      - id: checkLiveMessage
        kind: internal
      - id: randomHex
        kind: internal
      - id: b.publisher.WriteAtomic
        kind: value
      - id: b.wake.fire
        kind: internal
      - id: name.ID
        kind: internal
    steps:
      - opt:
          do:
            - return: "\"\", ctx.Err()"
          when: ctx.Err() != nil
      - opt:
          do:
            - return: "\"\", invalid"
          init:
            bind: invalid
            eval: checkLiveMessage(live, b.policy.MaxMessageBytes)
            to: checkLiveMessage
          when: invalid != nil
      - bind: entropy, entropyErr
        eval: randomHex(idEntropyBytes)
        to: randomHex
      - opt:
          do:
            - return: "\"\", backendFailed(\"rand\", \"\", entropyErr)"
          when: entropyErr != nil
      - bind: name
        eval: |-
          nameValue{
          		At: live.VisibleAt.UnixNano(), EnqueuedAt: live.Message.EnqueuedAt.UnixNano(),
          		Entropy: entropy, Deliveries: live.Deliveries, Priority: live.Priority,
          	}
      - opt:
          do:
            - return: "\"\", backendFailed(\"publish\", dirReady, writeErr)"
          init:
            bind: writeErr
            eval: b.publisher.WriteAtomic(path.Join(dirReady, name.readyName()), live.Message.Payload, messageMode)
            to: b.publisher.WriteAtomic
          when: writeErr != nil
      - eval: b.wake.fire()
        to: b.wake.fire
      - return: name.ID(), nil
        to: name.ID
  - of: (*fileBroker).deadRecordsOf
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).deadRecordsOf
        kind: self
      - id: parseMessageID
        kind: internal
      - id: b.namesOf
        kind: internal
      - id: nameStem
        kind: internal
      - id: parseDead
        kind: internal
    steps:
      - bind: enqueued, entropy, minted
        eval: parseMessageID(id)
        to: parseMessageID
      - opt:
          do:
            - return: nil, nil
          when: "!minted"
      - bind: entries, listErr
        eval: b.namesOf(dirDead)
        to: b.namesOf
      - opt:
          do:
            - return: nil, listErr
          when: listErr != nil
      - bind: prefix
        eval: pad(enqueued) + "." + entropy + "."
      - loop:
          do:
            - bind: _, stem
              eval: nameStem(base)
              to: nameStem
            - opt:
                do:
                  - set: records
                    value: append(records, base)
                init:
                  bind: _, named
                  eval: parseDead(base)
                  to: parseDead
                when: named && strings.HasPrefix(stem, prefix)
          key: _
          range: entries
          value: base
      - return: records, nil
  - of: (*fileBroker).removeDead
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).removeDead
        kind: self
      - id: ignoreMissing
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: removeErr
                init:
                  bind: removeErr
                  eval: ignoreMissing("remove", base, b.root.Remove(path.Join(dirDead, base)))
                  to: ignoreMissing
                when: removeErr != nil
          key: _
          range: records
          value: base
      - return: nil
  - of: (*fileBroker).Stats
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).Stats
        kind: self
      - id: b.countLive
        kind: internal
      - id: b.countDead
        kind: internal
      - id: time
        kind: stdlib
    steps:
      - opt:
          do:
            - return: corequeue.StatsValue{}, ctx.Err()
          when: ctx.Err() != nil
      - var:
          name: stats
          type: corequeue.StatsValue
      - var:
          name: oldest
          type: int64
      - loop:
          do:
            - opt:
                do:
                  - return: corequeue.StatsValue{}, listErr
                init:
                  bind: listErr
                  eval: b.countLive(dir, &stats, &oldest)
                  to: b.countLive
                when: listErr != nil
          key: _
          range: "[]string{dirReady, dirInflight}"
          value: dir
      - bind: dead, deadErr
        eval: b.countDead()
        to: b.countDead
      - opt:
          do:
            - return: corequeue.StatsValue{}, deadErr
          when: deadErr != nil
      - set: stats.Dead
        value: dead
      - opt:
          do:
            - set: stats.OldestEnqueuedAt
              to: time
              value: time.Unix(0, oldest)
          when: oldest != 0
      - return: stats, nil
  - of: (*fileBroker).countLive
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).countLive
        kind: self
      - id: b.namesOf
        kind: internal
      - id: parseLive
        kind: internal
      - id: earliest
        kind: internal
      - id: name.AtTime
        kind: internal
    steps:
      - bind: entries, listErr
        eval: b.namesOf(dir)
        to: b.namesOf
      - opt:
          do:
            - return: listErr
          when: listErr != nil
      - loop:
          do:
            - bind: name, ok
              eval: parseLive(dir, base)
              to: parseLive
            - opt:
                do:
                  - continue: true
                when: "!ok"
            - set: "*oldest"
              to: earliest
              value: earliest(*oldest, name.EnqueuedAt)
            - opt:
                do:
                  - op: ++
                    set: stats.Leased
                  - continue: true
                when: dir == dirInflight
            - opt:
                do:
                  - set: stats.NextDueAt
                    to: name.AtTime
                    value: name.AtTime()
                when: stats.Queued == 0 || name.AtTime().Before(stats.NextDueAt)
            - op: ++
              set: stats.Queued
          key: _
          range: entries
          value: base
      - return: nil
  - of: (*fileBroker).countDead
    participants:
      - id: caller
        kind: actor
      - id: (*fileBroker).countDead
        kind: self
      - id: b.namesOf
        kind: internal
      - id: parseDead
        kind: internal
    steps:
      - bind: dead, deadErr
        eval: b.namesOf(dirDead)
        to: b.namesOf
      - opt:
          do:
            - return: 0, deadErr
          when: deadErr != nil
      - var:
          name: count
          type: int64
      - loop:
          do:
            - opt:
                do:
                  - op: ++
                    set: count
                init:
                  bind: _, named
                  eval: parseDead(base)
                  to: parseDead
                when: named
          key: _
          range: dead
          value: base
      - return: count, nil
  - of: expiredCause
    participants:
      - id: caller
        kind: actor
      - id: expiredCause
        kind: self
      - id: describeCause
        kind: internal
    steps:
      - return: describeCause(corequeue.MessageExpired)
        to: describeCause
  - of: messageExpired
    steps:
      - return: policy.MaxAge > 0 && now-enqueued >= int64(policy.MaxAge)
  - of: retentionDue
    steps:
      - opt:
          do:
            - return: "false"
          when: policy.DeadLetterRetention <= 0
      - return: swept == 0 || now-swept >= int64(retentionSweepEvery)
  - of: retentionCutoff
    steps:
      - return: now - int64(policy.DeadLetterRetention)
  - of: NewMemory
    participants:
      - id: caller
        kind: actor
      - id: NewMemory
        kind: self
      - id: cfg.Policy.Validate
        kind: value
      - id: randomHex
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, invalid
          init:
            bind: invalid
            eval: cfg.Policy.Validate()
            to: cfg.Policy.Validate
          when: invalid != nil
      - bind: nonce, nonceErr
        eval: randomHex(instanceNonceBytes)
        to: randomHex
      - opt:
          do:
            - return: nil, backendFailed("rand", "", nonceErr)
          when: nonceErr != nil
      - return: |-
          &memoryBroker{
          		policy:   cfg.Policy.Normalized(),
          		clk:      clockOrSystem(cfg.Clock),
          		random:   randomOrDefault(cfg.Random),
          		nonce:    nonce,
          		wake:     newWakeSignal(),
          		inflight: map[corequeue.ReceiptValue]*memRecord{},
          		//: earliest deadline first, so the reclaim scan meets the most
          		//: overdue lease and stops at the first one still held.
          		expiry: newLeaseExpiries(),
          		//: the earliest window's end first, for the same early stop.
          		once:     map[string]time.Time{},
          		onceEnds: heap.New(func(a, b onceEnd) int { return a.at.Compare(b.at) }),
          	}, nil
  - of: (*memoryBroker).Publish
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).Publish
        kind: self
      - id: checkSize
        kind: internal
      - id: b.clk.Now
        kind: value
      - id: b.enqueue
        kind: internal
    steps:
      - opt:
          do:
            - return: corequeue.MessageValue{}, ctx.Err()
          when: ctx.Err() != nil
      - opt:
          do:
            - return: corequeue.MessageValue{}, tooLarge
          init:
            bind: tooLarge
            eval: checkSize(len(payload), b.policy.MaxMessageBytes)
            to: checkSize
          when: tooLarge != nil
      - lock:
          mutex: b.mu
      - bind: now
        eval: b.clk.Now()
        to: b.clk.Now
      - return: b.enqueue(payload, now, now, corequeue.PriorityNormal), nil
        to: b.enqueue
  - of: (*memoryBroker).enqueue
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).enqueue
        kind: self
      - id: b.enqueueQuiet
        kind: internal
      - id: b.wake.fire
        kind: internal
    steps:
      - bind: message
        eval: b.enqueueQuiet(payload, now, visibleAt, level)
        to: b.enqueueQuiet
      - eval: b.wake.fire()
        to: b.wake.fire
      - return: message
  - of: (*memoryBroker).enqueueQuiet
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).enqueueQuiet
        kind: self
      - id: b.insertReady
        kind: internal
    steps:
      - op: ++
        set: b.seq
      - bind: record
        eval: |-
          &memRecord{
          		//: the caller's slice is copied, so a producer that reuses its buffer
          		//: cannot rewrite a message the queue has already accepted.
          		payload: slices.Clone(payload), id: memID(now, b.seq),
          		enqueuedAt: now, visibleAt: visibleAt, seq: b.seq, priority: level,
          	}
      - eval: b.insertReady(record)
        to: b.insertReady
      - return: "corequeue.MessageValue{ID: record.id, Payload: payload, EnqueuedAt: now}"
  - of: (*memoryBroker).PublishPriority
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).PublishPriority
        kind: self
      - id: checkPriority
        kind: internal
      - id: checkSize
        kind: internal
      - id: b.clk.Now
        kind: value
      - id: b.enqueue
        kind: internal
    steps:
      - opt:
          do:
            - return: corequeue.MessageValue{}, ctx.Err()
          when: ctx.Err() != nil
      - opt:
          do:
            - return: corequeue.MessageValue{}, invalid
          init:
            bind: invalid
            eval: checkPriority(level)
            to: checkPriority
          when: invalid != nil
      - opt:
          do:
            - return: corequeue.MessageValue{}, tooLarge
          init:
            bind: tooLarge
            eval: checkSize(len(payload), b.policy.MaxMessageBytes)
            to: checkSize
          when: tooLarge != nil
      - lock:
          mutex: b.mu
      - bind: now
        eval: b.clk.Now()
        to: b.clk.Now
      - return: b.enqueue(payload, now, now, level), nil
        to: b.enqueue
  - of: (*memoryBroker).PublishAt
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).PublishAt
        kind: self
      - id: checkSize
        kind: internal
      - id: b.clk.Now
        kind: value
      - id: publishVisibleAt
        kind: internal
      - id: b.enqueue
        kind: internal
    steps:
      - opt:
          do:
            - return: corequeue.MessageValue{}, ctx.Err()
          when: ctx.Err() != nil
      - opt:
          do:
            - return: corequeue.MessageValue{}, tooLarge
          init:
            bind: tooLarge
            eval: checkSize(len(payload), b.policy.MaxMessageBytes)
            to: checkSize
          when: tooLarge != nil
      - lock:
          mutex: b.mu
      - bind: now
        eval: b.clk.Now()
        to: b.clk.Now
      - bind: visibleAt, invalid
        eval: publishVisibleAt(now, at)
        to: publishVisibleAt
      - opt:
          do:
            - return: corequeue.MessageValue{}, invalid
          when: invalid != nil
      - return: b.enqueue(payload, now, visibleAt, corequeue.PriorityNormal), nil
        to: b.enqueue
  - of: (*memoryBroker).PublishOnce
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).PublishOnce
        kind: self
      - id: checkSize
        kind: internal
      - id: b.clk.Now
        kind: value
      - id: onceUntil
        kind: internal
      - id: b.dropPassedOnce
        kind: internal
      - id: b.onceEnds.Push
        kind: value
      - id: b.enqueue
        kind: internal
    steps:
      - opt:
          do:
            - return: corequeue.MessageValue{}, false, ctx.Err()
          when: ctx.Err() != nil
      - opt:
          do:
            - return: corequeue.MessageValue{}, false, tooLarge
          init:
            bind: tooLarge
            eval: checkSize(len(payload), b.policy.MaxMessageBytes)
            to: checkSize
          when: tooLarge != nil
      - lock:
          mutex: b.mu
      - bind: now
        eval: b.clk.Now()
        to: b.clk.Now
      - bind: until, invalid
        eval: onceUntil(now, key, window)
        to: onceUntil
      - opt:
          do:
            - return: corequeue.MessageValue{}, false, invalid
          when: invalid != nil
      - eval: b.dropPassedOnce(now)
        to: b.dropPassedOnce
      - opt:
          do:
            - return: corequeue.MessageValue{}, false, nil
          init:
            bind: held, reserved
            eval: b.once[key]
          when: reserved && held.After(now)
      - set: b.once[key]
        value: until
      - eval: "b.onceEnds.Push(onceEnd{at: until, key: key})"
        to: b.onceEnds.Push
      - return: b.enqueue(payload, now, now, corequeue.PriorityNormal), true, nil
        to: b.enqueue
  - of: (*memoryBroker).dropPassedOnce
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).dropPassedOnce
        kind: self
      - id: b.onceEnds.Peek
        kind: value
      - id: b.onceEnds.Pop
        kind: value
    steps:
      - loop:
          do:
            - bind: end, pending
              eval: b.onceEnds.Peek()
              to: b.onceEnds.Peek
            - opt:
                do:
                  - return: ""
                when: "!pending || end.at.After(now)"
            - eval: b.onceEnds.Pop()
              to: b.onceEnds.Pop
            - opt:
                do:
                  - eval: delete(b.once, end.key)
                init:
                  bind: held, reserved
                  eval: b.once[end.key]
                when: reserved && held.Equal(end.at)
          forever: true
  - of: (*memoryBroker).Receive
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).Receive
        kind: self
      - id: checkBatch
        kind: internal
      - id: b.clk.Now
        kind: value
      - id: b.reclaimExpired
        kind: internal
      - id: b.sweepRetention
        kind: internal
      - id: b.takeEligible
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, invalid
          init:
            bind: invalid
            eval: checkBatch(max)
            to: checkBatch
          when: invalid != nil
      - opt:
          do:
            - return: nil, ctx.Err()
          when: ctx.Err() != nil
      - lock:
          mutex: b.mu
      - bind: now
        eval: b.clk.Now()
        to: b.clk.Now
      - eval: b.reclaimExpired(now)
        to: b.reclaimExpired
      - eval: b.sweepRetention(now)
        to: b.sweepRetention
      - var:
          name: out
          type: "[]corequeue.DeliveryValue"
      - loop:
          cond: len(out) < max
          do:
            - bind: record
              eval: b.takeEligible(now)
              to: b.takeEligible
            - opt:
                do:
                  - break: true
                when: record == nil
            - set: out
              value: append(out, b.lease(record, now))
      - return: out, nil
  - of: (*memoryBroker).takeEligible
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).takeEligible
        kind: self
      - id: b.takeVisible
        kind: internal
    steps:
      - loop:
          cond: level >= 0
          do:
            - opt:
                do:
                  - return: head
                init:
                  bind: head
                  eval: b.takeVisible(level, now)
                  to: b.takeVisible
                when: head != nil
          init: level := priorityLevels - 1
          post: level--
      - return: nil
  - of: (*memoryBroker).takeVisible
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).takeVisible
        kind: self
      - id: b.bury
        kind: internal
    steps:
      - bind: list
        eval: b.ready[level]
      - loop:
          cond: len(list) > 0 && !list[0].visibleAt.After(now) && b.expired(list[0].enqueuedAt, now)
          do:
            - eval: b.bury(list[0], now, expiredCause())
              to: b.bury
            - set: list
              value: list[1:]
      - set: b.ready[level]
        value: list
      - opt:
          do:
            - return: nil
          when: len(list) == 0 || list[0].visibleAt.After(now)
      - set: b.ready[level]
        value: list[1:]
      - return: list[0]
  - of: (*memoryBroker).lease
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).lease
        kind: self
      - id: now.Add
        kind: value
      - id: b.mintReceipt
        kind: internal
      - id: b.expiry.Push
        kind: value
    steps:
      - op: ++
        set: b.seq
      - op: ++
        set: record.deliveries
      - set: record.expiresAt
        to: now.Add
        value: now.Add(b.policy.VisibilityTimeout)
      - set: record.receipt
        to: b.mintReceipt
        value: b.mintReceipt()
      - set: b.inflight[record.receipt]
        value: record
      - set: record.lapse
        to: b.expiry.Push
        value: "b.expiry.Push(leaseExpiry{at: record.expiresAt, receipt: record.receipt})"
      - return: |-
          corequeue.DeliveryValue{
          		Message: corequeue.MessageValue{
          			ID: record.id, Payload: slices.Clone(record.payload), EnqueuedAt: record.enqueuedAt,
          		},
          		Lease:      corequeue.LeaseValue{Receipt: record.receipt, ExpiresAt: record.expiresAt},
          		Deliveries: record.deliveries,
          	}
  - of: (*memoryBroker).mintReceipt
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).mintReceipt
        kind: self
      - id: corequeue
        kind: package
    steps:
      - return: corequeue.ReceiptValue(b.nonce + "-" + strconv.FormatUint(b.seq, receiptRadix))
        to: corequeue
  - of: (*memoryBroker).Ack
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).Ack
        kind: self
      - id: ctx.Err
        kind: value
      - id: b.resolve
        kind: internal
      - id: b.unlease
        kind: internal
    steps:
      - opt:
          do:
            - return: ctx.Err()
              to: ctx.Err
          when: ctx.Err() != nil
      - lock:
          mutex: b.mu
      - bind: record, resolveErr
        eval: b.resolve(receipt)
        to: b.resolve
      - opt:
          do:
            - return: resolveErr
          when: resolveErr != nil
      - eval: b.unlease(record)
        to: b.unlease
      - return: nil
  - of: (*memoryBroker).Nack
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).Nack
        kind: self
      - id: b.nackWith
        kind: internal
    steps:
      - return: |-
          b.nackWith(ctx, receipt, cause, func(deliveries int) time.Duration {
          		//: the curve every broker waits on.
          		return retryDelay(b.policy, deliveries, b.random)
          	})
        to: b.nackWith
  - of: (*memoryBroker).NackAfter
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).NackAfter
        kind: self
      - id: nackDeadline
        kind: internal
      - id: b.nackWith
        kind: internal
    steps:
      - opt:
          do:
            - return: corequeue.NackValue{}, invalid
          init:
            bind: _, invalid
            eval: nackDeadline(b.clk.Now(), delay)
            to: nackDeadline
          when: invalid != nil
      - return: |-
          b.nackWith(ctx, receipt, cause, func(int) time.Duration {
          		//: a negative delay is now.
          		return max(delay, 0)
          	})
        to: b.nackWith
  - of: (*memoryBroker).nackWith
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).nackWith
        kind: self
      - id: b.resolve
        kind: internal
      - id: b.unlease
        kind: internal
      - id: b.clk.Now
        kind: value
      - id: b.bury
        kind: internal
      - id: now.Add
        kind: value
      - id: b.insertReady
        kind: internal
      - id: b.wake.fire
        kind: internal
    steps:
      - opt:
          do:
            - return: corequeue.NackValue{}, ctx.Err()
          when: ctx.Err() != nil
      - lock:
          mutex: b.mu
      - bind: record, resolveErr
        eval: b.resolve(receipt)
        to: b.resolve
      - opt:
          do:
            - return: corequeue.NackValue{}, resolveErr
          when: resolveErr != nil
      - eval: b.unlease(record)
        to: b.unlease
      - bind: now
        eval: b.clk.Now()
        to: b.clk.Now
      - opt:
          do:
            - eval: b.bury(record, now, describeCause(cause))
              to: b.bury
            - return: "corequeue.NackValue{Deliveries: record.deliveries, DeadLettered: true}, nil"
          when: record.deliveries >= b.policy.MaxDeliveries
      - set: record.visibleAt
        to: now.Add
        value: now.Add(wait(record.deliveries))
      - eval: b.insertReady(record)
        to: b.insertReady
      - eval: b.wake.fire()
        to: b.wake.fire
      - return: "corequeue.NackValue{Deliveries: record.deliveries, VisibleAt: record.visibleAt}, nil"
  - of: (*memoryBroker).Reject
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).Reject
        kind: self
      - id: ctx.Err
        kind: value
      - id: b.resolve
        kind: internal
      - id: b.unlease
        kind: internal
      - id: b.bury
        kind: internal
    steps:
      - opt:
          do:
            - return: ctx.Err()
              to: ctx.Err
          when: ctx.Err() != nil
      - lock:
          mutex: b.mu
      - bind: record, resolveErr
        eval: b.resolve(receipt)
        to: b.resolve
      - opt:
          do:
            - return: resolveErr
          when: resolveErr != nil
      - eval: b.unlease(record)
        to: b.unlease
      - eval: b.bury(record, b.clk.Now(), describeCause(cause))
        to: b.bury
      - return: nil
  - of: (*memoryBroker).Release
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).Release
        kind: self
      - id: ctx.Err
        kind: value
      - id: b.resolve
        kind: internal
      - id: b.unlease
        kind: internal
      - id: b.clk.Now
        kind: value
      - id: b.insertReady
        kind: internal
      - id: b.wake.fire
        kind: internal
    steps:
      - opt:
          do:
            - return: ctx.Err()
              to: ctx.Err
          when: ctx.Err() != nil
      - lock:
          mutex: b.mu
      - bind: record, resolveErr
        eval: b.resolve(receipt)
        to: b.resolve
      - opt:
          do:
            - return: resolveErr
          when: resolveErr != nil
      - eval: b.unlease(record)
        to: b.unlease
      - set: record.deliveries
        value: max(record.deliveries-1, 0)
      - set: record.visibleAt
        to: b.clk.Now
        value: b.clk.Now()
      - eval: b.insertReady(record)
        to: b.insertReady
      - eval: b.wake.fire()
        to: b.wake.fire
      - return: nil
  - of: (*memoryBroker).ReplayDeadLetter
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).ReplayDeadLetter
        kind: self
      - id: ctx.Err
        kind: value
      - id: b.takeDead
        kind: internal
      - id: deadLetterNotFound
        kind: internal
      - id: b.requeueDead
        kind: internal
      - id: b.wake.fire
        kind: internal
    steps:
      - opt:
          do:
            - return: ctx.Err()
              to: ctx.Err
          when: ctx.Err() != nil
      - lock:
          mutex: b.mu
      - bind: dead, found
        eval: b.takeDead(id)
        to: b.takeDead
      - opt:
          do:
            - return: deadLetterNotFound("memory", id)
              to: deadLetterNotFound
          when: "!found"
      - eval: b.requeueDead(dead, b.clk.Now())
        to: b.requeueDead
      - eval: b.wake.fire()
        to: b.wake.fire
      - return: nil
  - of: (*memoryBroker).DeleteDeadLetter
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).DeleteDeadLetter
        kind: self
      - id: ctx.Err
        kind: value
      - id: b.takeDead
        kind: internal
      - id: deadLetterNotFound
        kind: internal
    steps:
      - opt:
          do:
            - return: ctx.Err()
              to: ctx.Err
          when: ctx.Err() != nil
      - lock:
          mutex: b.mu
      - opt:
          do:
            - return: deadLetterNotFound("memory", id)
              to: deadLetterNotFound
          init:
            bind: _, found
            eval: b.takeDead(id)
            to: b.takeDead
          when: "!found"
      - return: nil
  - of: (*memoryBroker).PutDeadLetter
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).PutDeadLetter
        kind: self
      - id: checkDeadLetter
        kind: internal
      - id: memID
        kind: internal
      - id: slices
        kind: stdlib
      - id: cloneTrail
        kind: internal
      - id: b.insertDead
        kind: internal
    steps:
      - opt:
          do:
            - return: "\"\", ctx.Err()"
          when: ctx.Err() != nil
      - opt:
          do:
            - return: "\"\", invalid"
          init:
            bind: invalid
            eval: checkDeadLetter(dead, b.policy.MaxMessageBytes)
            to: checkDeadLetter
          when: invalid != nil
      - lock:
          mutex: b.mu
      - op: ++
        set: b.seq
      - set: dead.Message.ID
        to: memID
        value: memID(dead.Message.EnqueuedAt, b.seq)
      - set: dead.Message.Payload
        to: slices
        value: slices.Clone(dead.Message.Payload)
      - set: dead.Trail
        to: cloneTrail
        value: cloneTrail(dead.Trail)
      - eval: b.insertDead(dead)
        to: b.insertDead
      - return: dead.Message.ID, nil
  - of: (*memoryBroker).Messages
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).Messages
        kind: self
      - id: checkBatch
        kind: internal
      - id: b.readyAfter
        kind: internal
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil, invalid
          init:
            bind: invalid
            eval: checkBatch(max)
            to: checkBatch
          when: invalid != nil
      - opt:
          do:
            - return: nil, ctx.Err()
          when: ctx.Err() != nil
      - lock:
          mutex: b.mu
          read: true
      - bind: found
        eval: b.readyAfter(after)
        to: b.readyAfter
      - loop:
          do:
            - opt:
                do:
                  - set: found
                    value: append(found, record)
                when: record.id > after
          key: _
          range: b.inflight
          value: record
      - eval: |-
          slices.SortFunc(found, func(x, y *memRecord) int {
          		//: byte order of the identifiers, as the durable brokers list them.
          		return strings.Compare(x.id, y.id)
          	})
        to: slices
      - var:
          name: live
          type: "[]corequeue.LiveMessageValue"
      - loop:
          do:
            - bind: _, leased
              eval: b.inflight[record.receipt]
            - bind: visibleAt
              eval: record.visibleAt
            - opt:
                do:
                  - set: visibleAt
                    value: record.expiresAt
                when: leased && record.receipt != ""
            - set: live
              value: append(live, liveOf(record, visibleAt, leased && record.receipt != ""))
          key: _
          range: found[:min(max, len(found))]
          value: record
      - return: live, nil
  - of: liveOf
    steps:
      - return: |-
          corequeue.LiveMessageValue{
          		VisibleAt:  visibleAt,
          		Message:    corequeue.MessageValue{ID: record.id, Payload: slices.Clone(record.payload), EnqueuedAt: record.enqueuedAt},
          		Deliveries: record.deliveries, Leased: leased, Priority: record.priority,
          	}
  - of: (*memoryBroker).PutMessage
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).PutMessage
        kind: self
      - id: checkLiveMessage
        kind: internal
      - id: b.insertReady
        kind: internal
      - id: b.wake.fire
        kind: internal
    steps:
      - opt:
          do:
            - return: "\"\", ctx.Err()"
          when: ctx.Err() != nil
      - opt:
          do:
            - return: "\"\", invalid"
          init:
            bind: invalid
            eval: checkLiveMessage(live, b.policy.MaxMessageBytes)
            to: checkLiveMessage
          when: invalid != nil
      - lock:
          mutex: b.mu
      - op: ++
        set: b.seq
      - bind: record
        eval: |-
          &memRecord{
          		payload: slices.Clone(live.Message.Payload), id: memID(live.Message.EnqueuedAt, b.seq),
          		enqueuedAt: live.Message.EnqueuedAt, visibleAt: live.VisibleAt, seq: b.seq, deliveries: live.Deliveries,
          		priority: live.Priority,
          	}
      - eval: b.insertReady(record)
        to: b.insertReady
      - eval: b.wake.fire()
        to: b.wake.fire
      - return: record.id, nil
  - of: (*memoryBroker).takeDead
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).takeDead
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: at
        eval: slices.IndexFunc(b.dead, func(record corequeue.DeadLetterValue) bool { return record.Message.ID == id })
        to: slices
      - opt:
          do:
            - return: corequeue.DeadLetterValue{}, false
          when: at < 0
      - set: dead
        value: b.dead[at]
      - set: b.dead
        to: slices
        value: slices.Delete(b.dead, at, at+1)
      - return: dead, true
  - of: (*memoryBroker).Extend
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).Extend
        kind: self
      - id: b.clk.Now().Add
        kind: value
      - id: b.resolve
        kind: internal
      - id: b.mintReceipt
        kind: internal
      - id: b.expiry.Update
        kind: value
    steps:
      - bind: deadline
        eval: b.clk.Now().Add(by)
        to: b.clk.Now().Add
      - opt:
          do:
            - return: |-
                corequeue.LeaseValue{}, kerrs.Wrap(corequeue.QueueMisconfigured, kerrs.WrapParams{},
                			kerrs.String("field", "Extend.by"), kerrs.Int64("value_ns", int64(by)))
          when: by <= 0 || !nameable(deadline)
      - opt:
          do:
            - return: corequeue.LeaseValue{}, ctx.Err()
          when: ctx.Err() != nil
      - lock:
          mutex: b.mu
      - bind: record, resolveErr
        eval: b.resolve(receipt)
        to: b.resolve
      - opt:
          do:
            - return: corequeue.LeaseValue{}, resolveErr
          when: resolveErr != nil
      - eval: delete(b.inflight, record.receipt)
      - op: ++
        set: b.seq
      - set: record.expiresAt
        value: deadline
      - set: record.receipt
        to: b.mintReceipt
        value: b.mintReceipt()
      - set: b.inflight[record.receipt]
        value: record
      - eval: "b.expiry.Update(record.lapse, leaseExpiry{at: record.expiresAt, receipt: record.receipt})"
        to: b.expiry.Update
      - return: "corequeue.LeaseValue{Receipt: record.receipt, ExpiresAt: record.expiresAt}, nil"
  - of: (*memoryBroker).Wake
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).Wake
        kind: self
      - id: b.wake.current
        kind: internal
      - id: b.earliestReady
        kind: internal
      - id: b.expiry.Peek
        kind: value
      - id: wakeValue
        kind: internal
    steps:
      - lock:
          mutex: b.mu
          read: true
      - bind: signal, _
        eval: b.wake.current()
        to: b.wake.current
      - bind: due
        eval: b.earliestReady()
        to: b.earliestReady
      - opt:
          do:
            - set: due
              value: lapse.at
          init:
            bind: lapse, _, held
            eval: b.expiry.Peek()
            to: b.expiry.Peek
          when: held && (due.IsZero() || lapse.at.Before(due))
      - return: wakeValue(signal, due, b.clk.Now())
        to: wakeValue
  - of: (*memoryBroker).DeadLetters
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).DeadLetters
        kind: self
      - id: b.DeadLettersAfter
        kind: internal
    steps:
      - return: b.DeadLettersAfter(ctx, "", max)
        to: b.DeadLettersAfter
  - of: (*memoryBroker).resolve
    steps:
      - bind: held, leased
        eval: b.inflight[receipt]
      - opt:
          do:
            - return: held, nil
          when: leased && held.expiresAt.After(b.clk.Now())
      - opt:
          do:
            - return: |-
                nil, kerrs.Wrap(corequeue.UnknownReceipt, kerrs.WrapParams{},
                			kerrs.String("broker", "memory"))
          when: "!strings.HasPrefix(string(receipt), b.nonce+\"-\")"
      - return: |-
          nil, kerrs.Wrap(corequeue.LeaseExpired, kerrs.WrapParams{},
          		kerrs.String("broker", "memory"))
  - of: (*memoryBroker).reclaimExpired
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).reclaimExpired
        kind: self
      - id: b.expiry.Peek
        kind: value
      - id: b.expiry.Pop
        kind: value
      - id: b.recoverExpired
        kind: internal
    steps:
      - loop:
          do:
            - bind: due, _, pending
              eval: b.expiry.Peek()
              to: b.expiry.Peek
            - opt:
                do:
                  - return: ""
                when: "!pending || due.at.After(now)"
            - eval: b.expiry.Pop()
              to: b.expiry.Pop
            - bind: record, leased
              eval: b.inflight[due.receipt]
            - opt:
                do:
                  - continue: true
                when: "!leased"
            - set: record.lapse
              value: heap.Handle{}
            - eval: delete(b.inflight, due.receipt)
            - eval: b.recoverExpired(record, now)
              to: b.recoverExpired
          forever: true
  - of: (*memoryBroker).unlease
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).unlease
        kind: self
      - id: b.expiry.Remove
        kind: value
    steps:
      - eval: delete(b.inflight, record.receipt)
      - eval: b.expiry.Remove(record.lapse)
        to: b.expiry.Remove
      - set: record.lapse
        value: heap.Handle{}
  - of: newLeaseExpiries
    participants:
      - id: caller
        kind: actor
      - id: newLeaseExpiries
        kind: self
      - id: heap
        kind: package
    steps:
      - return: heap.NewIndexed(func(a, b leaseExpiry) int { return a.at.Compare(b.at) })
        to: heap
  - of: (*memoryBroker).recoverExpired
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).recoverExpired
        kind: self
      - id: b.bury
        kind: internal
      - id: b.insertReady
        kind: internal
    steps:
      - opt:
          do:
            - eval: "b.bury(record, now, causeValue{reason: reasonLeaseExpired})"
              to: b.bury
            - return: ""
          when: record.deliveries >= b.policy.MaxDeliveries
      - set: record.visibleAt
        value: now
      - eval: b.insertReady(record)
        to: b.insertReady
  - of: (*memoryBroker).bury
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).bury
        kind: self
      - id: b.insertDead
        kind: internal
    steps:
      - eval: |-
          b.insertDead(corequeue.DeadLetterValue{
          		Message: corequeue.MessageValue{
          			ID: record.id, Payload: slices.Clone(record.payload), EnqueuedAt: record.enqueuedAt,
          		},
          		Deliveries: record.deliveries, FailedAt: now,
          		Reason: cause.reason, Cause: cause.public, Code: cause.code, Trail: cause.trail,
          		Priority: record.priority,
          	})
        to: b.insertDead
  - of: (*memoryBroker).insertDead
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).insertDead
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: at, _
        eval: slices.BinarySearchFunc(b.dead, dead.Message.ID, compareDeadID)
        to: slices
      - set: b.dead
        to: slices
        value: slices.Insert(b.dead, at, dead)
  - of: compareDeadID
    participants:
      - id: caller
        kind: actor
      - id: compareDeadID
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - return: strings.Compare(held.Message.ID, id)
        to: strings
  - of: (*memoryBroker).insertReady
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).insertReady
        kind: self
      - id: readyIndex
        kind: internal
      - id: slices
        kind: stdlib
    steps:
      - bind: level
        eval: readyIndex(record.priority)
        to: readyIndex
      - bind: list
        eval: b.ready[level]
      - bind: at
        eval: len(list)
      - loop:
          cond: at > 0 && laterThan(list[at-1], record)
          do:
            - op: "--"
              set: at
      - set: b.ready[level]
        to: slices
        value: slices.Insert(list, at, record)
  - of: (*memoryBroker).readyAfter
    steps:
      - var:
          name: found
          type: "[]*memRecord"
      - loop:
          do:
            - loop:
                do:
                  - opt:
                      do:
                        - set: found
                          value: append(found, record)
                      when: record.id > after
                key: _
                range: list
                value: record
          key: _
          range: b.ready
          value: list
      - return: found
  - of: (*memoryBroker).readyCount
    steps:
      - bind: count
        eval: "0"
      - loop:
          do:
            - op: +=
              set: count
              value: len(list)
          key: _
          range: b.ready
          value: list
      - return: count
  - of: laterThan
    participants:
      - id: caller
        kind: actor
      - id: laterThan
        kind: self
      - id: first.visibleAt.After
        kind: value
    steps:
      - opt:
          do:
            - return: first.seq > second.seq
          when: first.visibleAt.Equal(second.visibleAt)
      - return: first.visibleAt.After(second.visibleAt)
        to: first.visibleAt.After
  - of: memID
    participants:
      - id: caller
        kind: actor
      - id: memID
        kind: self
      - id: padBase36
        kind: internal
    steps:
      - var:
          name: id
          type: "[2*memIDHalfWidth + 1]byte"
      - eval: padBase36(id[:memIDHalfWidth], uint64(max(now.UnixNano(), 0)))
        to: padBase36
      - set: id[memIDHalfWidth]
        value: "'-'"
      - eval: padBase36(id[memIDHalfWidth+1:], seq)
        to: padBase36
      - return: string(id[:])
  - of: padBase36
    participants:
      - id: caller
        kind: actor
      - id: padBase36
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - var:
          name: scratch
          type: "[memIDHalfWidth]byte"
      - bind: digits
        eval: strconv.AppendUint(scratch[:0], n, receiptRadix)
        to: strconv
      - bind: pad
        eval: len(into) - len(digits)
      - loop:
          do:
            - set: into[index]
              value: "'0'"
          key: index
          range: pad
      - eval: copy(into[pad:], digits)
  - of: (*memoryBroker).DeadLettersAfter
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).DeadLettersAfter
        kind: self
      - id: checkBatch
        kind: internal
      - id: b.deadAfter
        kind: internal
      - id: slices
        kind: stdlib
      - id: cloneTrail
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, invalid
          init:
            bind: invalid
            eval: checkBatch(max)
            to: checkBatch
          when: invalid != nil
      - opt:
          do:
            - return: nil, ctx.Err()
          when: ctx.Err() != nil
      - lock:
          mutex: b.mu
          read: true
      - bind: from
        eval: b.deadAfter(after)
        to: b.deadAfter
      - set: dead
        to: slices
        value: slices.Clone(b.dead[from:min(from+max, len(b.dead))])
      - loop:
          do:
            - set: dead[index].Message.Payload
              to: slices
              value: slices.Clone(dead[index].Message.Payload)
            - set: dead[index].Trail
              to: cloneTrail
              value: cloneTrail(dead[index].Trail)
          key: index
          range: dead
      - return: dead, nil
  - of: (*memoryBroker).deadAfter
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).deadAfter
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: at, found
        eval: slices.BinarySearchFunc(b.dead, after, compareDeadID)
        to: slices
      - opt:
          do:
            - return: at + 1
          when: found
      - return: at
  - of: (*memoryBroker).Stats
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).Stats
        kind: self
      - id: earlierOf
        kind: internal
    steps:
      - opt:
          do:
            - return: corequeue.StatsValue{}, ctx.Err()
          when: ctx.Err() != nil
      - lock:
          mutex: b.mu
          read: true
      - bind: stats
        eval: |-
          corequeue.StatsValue{
          		Queued: int64(b.readyCount()), Leased: int64(len(b.inflight)), Dead: int64(len(b.dead)),
          		NextDueAt: b.earliestReady(),
          	}
      - loop:
          do:
            - loop:
                do:
                  - set: stats.OldestEnqueuedAt
                    to: earlierOf
                    value: earlierOf(stats.OldestEnqueuedAt, record.enqueuedAt)
                key: _
                range: list
                value: record
          key: _
          range: b.ready
          value: list
      - loop:
          do:
            - set: stats.OldestEnqueuedAt
              to: earlierOf
              value: earlierOf(stats.OldestEnqueuedAt, record.enqueuedAt)
          key: _
          range: b.inflight
          value: record
      - return: stats, nil
  - of: earlierOf
    steps:
      - opt:
          do:
            - return: candidate
          when: held.IsZero() || candidate.Before(held)
      - return: held
  - of: (*memoryBroker).Purge
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).Purge
        kind: self
      - id: newLeaseExpiries
        kind: internal
      - id: b.wake.fire
        kind: internal
    steps:
      - opt:
          do:
            - return: corequeue.PurgeValue{}, ctx.Err()
          when: ctx.Err() != nil
      - lock:
          mutex: b.mu
      - bind: purged
        eval: "corequeue.PurgeValue{Queued: b.readyCount(), Leased: len(b.inflight)}"
      - eval: clear(b.ready[:])
      - eval: clear(b.inflight)
      - set: b.expiry
        to: newLeaseExpiries
        value: newLeaseExpiries()
      - eval: b.wake.fire()
        to: b.wake.fire
      - return: purged, nil
  - of: (*memoryBroker).ReplayDeadLetters
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).ReplayDeadLetters
        kind: self
      - id: checkBatch
        kind: internal
      - id: b.clk.Now
        kind: value
      - id: b.requeueDead
        kind: internal
      - id: slices
        kind: stdlib
      - id: b.wake.fire
        kind: internal
    steps:
      - opt:
          do:
            - return: 0, invalid
          init:
            bind: invalid
            eval: checkBatch(max)
            to: checkBatch
          when: invalid != nil
      - opt:
          do:
            - return: 0, ctx.Err()
          when: ctx.Err() != nil
      - lock:
          mutex: b.mu
      - set: replayed
        value: min(max, len(b.dead))
      - bind: now
        eval: b.clk.Now()
        to: b.clk.Now
      - loop:
          do:
            - eval: b.requeueDead(dead, now)
              to: b.requeueDead
          key: _
          range: b.dead[:replayed]
          value: dead
      - set: b.dead
        to: slices
        value: slices.Delete(b.dead, 0, replayed)
      - opt:
          do:
            - eval: b.wake.fire()
              to: b.wake.fire
          when: replayed > 0
      - return: replayed, nil
  - of: (*memoryBroker).requeueDead
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).requeueDead
        kind: self
      - id: b.insertReady
        kind: internal
    steps:
      - op: ++
        set: b.seq
      - eval: |-
          b.insertReady(&memRecord{
          		payload: dead.Message.Payload, id: dead.Message.ID,
          		enqueuedAt: dead.Message.EnqueuedAt, visibleAt: now, seq: b.seq, priority: dead.Priority,
          	})
        to: b.insertReady
  - of: (*memoryBroker).PurgeDeadLetters
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).PurgeDeadLetters
        kind: self
      - id: checkBatch
        kind: internal
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - return: 0, invalid
          init:
            bind: invalid
            eval: checkBatch(max)
            to: checkBatch
          when: invalid != nil
      - opt:
          do:
            - return: 0, ctx.Err()
          when: ctx.Err() != nil
      - lock:
          mutex: b.mu
      - set: b.dead
        to: slices
        value: |-
          slices.DeleteFunc(b.dead, func(dead corequeue.DeadLetterValue) bool {
          		//: the first max that failed before the instant, in list order.
          		if removed < max && dead.FailedAt.Before(before) {
          			removed++
          			return true
          		}
          		return false
          	})
      - return: removed, nil
  - of: (*memoryBroker).sweepRetention
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).sweepRetention
        kind: self
      - id: now.UnixNano
        kind: value
      - id: time
        kind: stdlib
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - return: ""
          when: "!retentionDue(b.policy, b.swept, now.UnixNano())"
      - set: b.swept
        to: now.UnixNano
        value: now.UnixNano()
      - bind: cutoff
        eval: time.Unix(0, retentionCutoff(b.policy, now.UnixNano()))
        to: time
      - set: b.dead
        to: slices
        value: |-
          slices.DeleteFunc(b.dead, func(dead corequeue.DeadLetterValue) bool {
          		//: failed at or before the cutoff: kept as long as the policy said.
          		return !dead.FailedAt.After(cutoff)
          	})
  - of: (*memoryBroker).expired
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).expired
        kind: self
      - id: messageExpired
        kind: internal
    steps:
      - return: messageExpired(b.policy, enqueuedAt.UnixNano(), now.UnixNano())
        to: messageExpired
  - of: (*memoryBroker).PublishMany
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).PublishMany
        kind: self
      - id: checkSizes
        kind: internal
      - id: b.clk.Now
        kind: value
      - id: b.enqueueQuiet
        kind: internal
      - id: b.wake.fire
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, ctx.Err()
          when: ctx.Err() != nil
      - opt:
          do:
            - return: nil, tooLarge
          init:
            bind: tooLarge
            eval: checkSizes(payloads, b.policy.MaxMessageBytes)
            to: checkSizes
          when: tooLarge != nil
      - opt:
          do:
            - return: nil, nil
          when: len(payloads) == 0
      - lock:
          mutex: b.mu
      - bind: now
        eval: b.clk.Now()
        to: b.clk.Now
      - bind: messages
        eval: make([]corequeue.MessageValue, len(payloads))
      - loop:
          do:
            - set: messages[index]
              to: b.enqueueQuiet
              value: b.enqueueQuiet(payload, now, now, corequeue.PriorityNormal)
          key: index
          range: payloads
          value: payload
      - eval: b.wake.fire()
        to: b.wake.fire
      - return: messages, nil
  - of: (*memoryBroker).AckMany
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).AckMany
        kind: self
      - id: b.resolve
        kind: internal
      - id: ackOutcomeOf
        kind: internal
      - id: b.unlease
        kind: internal
    steps:
      - bind: result
        eval: "corequeue.AckResultValue{Outcomes: make([]corequeue.AckOutcome, len(receipts))}"
      - opt:
          do:
            - return: result, ctx.Err()
          when: ctx.Err() != nil
      - lock:
          mutex: b.mu
      - loop:
          do:
            - bind: record, resolveErr
              eval: b.resolve(receipt)
              to: b.resolve
            - opt:
                do:
                  - set: result.Outcomes[index]
                    to: ackOutcomeOf
                    value: ackOutcomeOf(resolveErr)
                  - continue: true
                when: resolveErr != nil
            - eval: b.unlease(record)
              to: b.unlease
            - set: result.Outcomes[index]
              value: corequeue.AckAcknowledged
          key: index
          range: receipts
          value: receipt
      - return: result, nil
  - of: (*memoryBroker).AllMessages
    participants:
      - id: caller
        kind: actor
      - id: (*memoryBroker).AllMessages
        kind: self
      - id: pagedMessages
        kind: internal
    steps:
      - return: pagedMessages(ctx, after, b.Messages)
        to: pagedMessages
  - of: ackOutcomeOf
    steps:
      - opt:
          do:
            - return: corequeue.AckUnknownReceipt
          when: kerrs.HasCode(err, corequeue.CodeUnknownReceipt)
      - return: corequeue.AckLeaseExpired
  - of: clockOrSystem
    steps:
      - opt:
          do:
            - return: clock.System
          when: clk == nil
      - return: clk
  - of: describeCause
    participants:
      - id: caller
        kind: actor
      - id: describeCause
        kind: self
      - id: kerrs
        kind: package
      - id: trailCodes
        kind: internal
    steps:
      - opt:
          do:
            - return: "causeValue{reason: reasonUnreported}"
          when: cause == nil
      - bind: described
        eval: "causeValue{public: kerrs.PublicOf(cause)}"
      - bind: reason, named
        eval: kerrs.ReasonOf(cause)
        to: kerrs
      - opt:
          do:
            - set: described.reason
              value: reason
          when: named
      - bind: code, coded
        eval: kerrs.CodeOf(cause)
        to: kerrs
      - opt:
          do:
            - set: described.code
              value: uint32(code)
          when: coded
      - set: described.trail
        to: trailCodes
        value: trailCodes(kerrs.TrailOf(cause))
      - return: described
  - of: trailCodes
    steps:
      - opt:
          do:
            - return: nil
          when: len(trail) == 0
      - bind: kept
        eval: trail[max(len(trail)-maxDeadTrail, 0):]
      - bind: codes
        eval: make([]uint32, len(kept))
      - loop:
          do:
            - set: codes[i]
              value: uint32(code)
          key: i
          range: kept
          value: code
      - return: codes
  - of: cloneTrail
    participants:
      - id: caller
        kind: actor
      - id: cloneTrail
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil
          when: len(trail) == 0
      - return: slices.Clone(trail)
        to: slices
  - of: encodeTrail
    participants:
      - id: caller
        kind: actor
      - id: encodeTrail
        kind: self
      - id: strconv
        kind: stdlib
      - id: strings
        kind: stdlib
    steps:
      - bind: parts
        eval: make([]string, len(trail))
      - loop:
          do:
            - set: parts[i]
              to: strconv
              value: strconv.FormatUint(uint64(code), decimalBase)
          key: i
          range: trail
          value: code
      - return: strings.Join(parts, trailSeparator)
        to: strings
  - of: decodeTrail
    participants:
      - id: caller
        kind: actor
      - id: decodeTrail
        kind: self
      - id: strings
        kind: stdlib
      - id: strconv
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil
          when: text == ""
      - bind: parts
        eval: strings.Split(text, trailSeparator)
        to: strings
      - opt:
          do:
            - return: nil
          when: len(parts) > maxDeadTrail
      - bind: codes
        eval: make([]uint32, len(parts))
      - loop:
          do:
            - bind: code, err
              eval: strconv.ParseUint(part, decimalBase, uint32Bits)
              to: strconv
            - opt:
                do:
                  - return: nil
                when: err != nil
            - set: codes[i]
              value: uint32(code)
          key: i
          range: parts
          value: part
      - return: codes
  - of: checkBatch
    participants:
      - id: caller
        kind: actor
      - id: checkBatch
        kind: self
      - id: kerrs
        kind: package
    steps:
      - opt:
          do:
            - return: kerrs.Wrap(corequeue.InvalidBatchSize, kerrs.WrapParams{}, kerrs.Int("max", max))
              to: kerrs
          when: max <= 0
      - return: nil
  - of: randomHex
    participants:
      - id: caller
        kind: actor
      - id: randomHex
        kind: self
      - id: rand
        kind: stdlib
      - id: hex
        kind: stdlib
    steps:
      - bind: raw
        eval: make([]byte, n)
      - bind: _, randErr
        eval: rand.Read(raw)
        to: rand
      - opt:
          do:
            - return: "\"\", randErr"
          when: randErr != nil
      - return: hex.EncodeToString(raw), nil
        to: hex
  - of: checkSize
    participants:
      - id: caller
        kind: actor
      - id: checkSize
        kind: self
      - id: kerrs
        kind: package
    steps:
      - opt:
          do:
            - return: |-
                kerrs.Wrap(corequeue.MessageTooLarge, kerrs.WrapParams{},
                			kerrs.Int("size", size), kerrs.Int("max", maxBytes))
              to: kerrs
          when: size > maxBytes
      - return: nil
  - of: deadLetterNotFound
    participants:
      - id: caller
        kind: actor
      - id: deadLetterNotFound
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: |-
          kerrs.Wrap(corequeue.DeadLetterNotFound, kerrs.WrapParams{},
          		kerrs.String("broker", broker), kerrs.String("id", id))
        to: kerrs
  - of: checkDeadLetter
    participants:
      - id: caller
        kind: actor
      - id: checkDeadLetter
        kind: self
      - id: messageField
        kind: internal
      - id: causeField
        kind: internal
      - id: kerrs
        kind: package
      - id: checkSize
        kind: internal
    steps:
      - bind: field, refused
        eval: messageField(dead)
        to: messageField
      - opt:
          do:
            - set: field, refused
              to: causeField
              value: causeField(dead)
          when: "!refused"
      - opt:
          do:
            - return: kerrs.Wrap(corequeue.InvalidDeadLetter, kerrs.WrapParams{}, kerrs.String("field", field))
              to: kerrs
          when: refused
      - return: checkSize(len(dead.Message.Payload), maxBytes)
        to: checkSize
  - of: messageField
    steps:
      - switch:
          cases:
            - case: dead.Message.ID != ""
              do:
                - return: "\"Message.ID\", true"
            - case: dead.Deliveries < 1 || dead.Deliveries > maxDeadDeliveries
              do:
                - return: "\"Deliveries\", true"
            - case: "!priorityKnown(dead.Priority)"
              do:
                - return: "\"Priority\", true"
            - case: "!nameable(dead.Message.EnqueuedAt)"
              do:
                - return: "\"Message.EnqueuedAt\", true"
            - case: "!nameable(dead.FailedAt)"
              do:
                - return: "\"FailedAt\", true"
            - default: true
              do:
                - return: "\"\", false"
  - of: causeField
    steps:
      - switch:
          cases:
            - case: "!keptAsWritten(dead.Reason)"
              do:
                - return: "\"Reason\", true"
            - case: "!keptAsWritten(dead.Cause)"
              do:
                - return: "\"Cause\", true"
            - case: len(dead.Trail) > maxDeadTrail
              do:
                - return: "\"Trail\", true"
            - default: true
              do:
                - return: "\"\", false"
  - of: checkLiveMessage
    participants:
      - id: caller
        kind: actor
      - id: checkLiveMessage
        kind: self
      - id: kerrs
        kind: package
      - id: checkSize
        kind: internal
    steps:
      - bind: field
        eval: "\"\""
      - switch:
          cases:
            - case: live.Message.ID != ""
              do:
                - set: field
                  value: "\"Message.ID\""
            - case: live.Leased
              do:
                - set: field
                  value: "\"Leased\""
            - case: live.Deliveries < 0 || live.Deliveries > maxDeadDeliveries
              do:
                - set: field
                  value: "\"Deliveries\""
            - case: "!priorityKnown(live.Priority)"
              do:
                - set: field
                  value: "\"Priority\""
            - case: "!nameable(live.Message.EnqueuedAt)"
              do:
                - set: field
                  value: "\"Message.EnqueuedAt\""
            - case: "!nameable(live.VisibleAt)"
              do:
                - set: field
                  value: "\"VisibleAt\""
      - opt:
          do:
            - return: kerrs.Wrap(corequeue.InvalidMessage, kerrs.WrapParams{}, kerrs.String("field", field))
              to: kerrs
          when: field != ""
      - return: checkSize(len(live.Message.Payload), maxBytes)
        to: checkSize
  - of: nackDeadline
    participants:
      - id: caller
        kind: actor
      - id: nackDeadline
        kind: self
      - id: now.Add
        kind: value
    steps:
      - bind: visibleAt
        eval: now.Add(max(delay, 0))
        to: now.Add
      - opt:
          do:
            - return: |-
                time.Time{}, kerrs.Wrap(corequeue.QueueMisconfigured, kerrs.WrapParams{},
                			kerrs.String("field", "NackAfter.delay"), kerrs.Int64("value_ns", int64(delay)))
          when: "!nameable(visibleAt)"
      - return: visibleAt, nil
  - of: publishVisibleAt
    steps:
      - opt:
          do:
            - return: now, nil
          when: "!at.After(now)"
      - opt:
          do:
            - return: |-
                time.Time{}, kerrs.Wrap(corequeue.QueueMisconfigured, kerrs.WrapParams{},
                			kerrs.String("field", "PublishAt.at"), kerrs.String("instant", at.UTC().Format(time.RFC3339Nano)))
          when: "!nameable(at)"
      - return: at, nil
  - of: onceUntil
    participants:
      - id: caller
        kind: actor
      - id: onceUntil
        kind: self
      - id: now.Add
        kind: value
    steps:
      - bind: field
        eval: "\"\""
      - bind: until
        eval: now.Add(window)
        to: now.Add
      - switch:
          cases:
            - case: key == ""
              do:
                - set: field
                  value: "\"PublishOnce.key\""
            - case: window <= 0 || !nameable(until)
              do:
                - set: field
                  value: "\"PublishOnce.window\""
      - opt:
          do:
            - return: |-
                time.Time{}, kerrs.Wrap(corequeue.QueueMisconfigured, kerrs.WrapParams{},
                			kerrs.String("field", field), kerrs.Int64("window_ns", int64(window)))
          when: field != ""
      - return: until, nil
  - of: onceDigest
    participants:
      - id: caller
        kind: actor
      - id: onceDigest
        kind: self
      - id: sha256
        kind: stdlib
      - id: hex
        kind: stdlib
    steps:
      - bind: sum
        eval: sha256.Sum256([]byte(key))
        to: sha256
      - return: hex.EncodeToString(sum[:])
        to: hex
  - of: keptAsWritten
    steps:
      - return: "!strings.ContainsAny(value, \"\\r\\n\") && utf8.RuneCountInString(value) <= publicMaxRunes"
  - of: priorityKnown
    steps:
      - return: level >= corequeue.PriorityLowest && level <= corequeue.PriorityHighest
  - of: checkPriority
    participants:
      - id: caller
        kind: actor
      - id: checkPriority
        kind: self
      - id: kerrs
        kind: package
    steps:
      - opt:
          do:
            - return: nil
          when: priorityKnown(level)
      - return: |-
          kerrs.Wrap(corequeue.QueueMisconfigured, kerrs.WrapParams{},
          		kerrs.String("field", "PublishPriority.level"), kerrs.Int("level", int(level)))
        to: kerrs
  - of: readyIndex
    steps:
      - return: int(level - corequeue.PriorityLowest)
  - of: retryDelay
    participants:
      - id: caller
        kind: actor
      - id: retryDelay
        kind: self
      - id: kbackoff
        kind: package
      - id: drawBetween
        kind: internal
      - id: time
        kind: stdlib
    steps:
      - opt:
          do:
            - return: policy.RetryDelay
          when: policy.MaxRetryDelay <= 0
      - bind: grown
        eval: kbackoff.Grow(policy.RetryDelay, policy.MaxRetryDelay, 0, deliveries)
        to: kbackoff
      - switch:
          cases:
            - case: kbackoff.JitterFull
              do:
                - return: drawBetween(0, grown, random)
                  to: drawBetween
            - case: kbackoff.JitterDecorrelated
              do:
                - bind: previous
                  eval: kbackoff.Grow(policy.RetryDelay, policy.MaxRetryDelay, 0, deliveries-1)
                  to: kbackoff
                - bind: upper
                  eval: policy.MaxRetryDelay
                - opt:
                    do:
                      - set: upper
                        to: time
                        value: time.Duration(bound)
                    init:
                      bind: bound
                      eval: float64(previous) * decorrelatedFactor
                    when: bound < float64(upper)
                - return: drawBetween(policy.RetryDelay, max(upper, policy.RetryDelay), random)
                  to: drawBetween
            - default: true
              do:
                - opt:
                    do:
                      - return: grown
                    when: policy.RetryJitter <= 0
                - return: drawBetween(grown, grown+time.Duration(float64(grown)*policy.RetryJitter), random)
                  to: drawBetween
          "on": policy.RetryJitterMode
  - of: drawBetween
    steps:
      - opt:
          do:
            - return: low
          when: high <= low
      - bind: fraction
        eval: min(max(random(), 0), 1)
      - return: min(low+time.Duration(fraction*float64(high-low+1)), high)
  - of: randomOrDefault
    steps:
      - opt:
          do:
            - return: rand.Float64
          when: random == nil
      - return: random
  - of: NewSQL
    participants:
      - id: caller
        kind: actor
      - id: NewSQL
        kind: self
      - id: cfg.validate
        kind: internal
    steps:
      - bind: parts, invalid
        eval: cfg.validate()
        to: cfg.validate
      - opt:
          do:
            - return: nil, invalid
          when: invalid != nil
      - return: |-
          &sqlBroker{
          		tm: cfg.Transactor, clk: clockOrSystem(cfg.Clock), tx: parts,
          		wake: sqlWakeFor(parts.join, cfg.Table), table: cfg.Table,
          		stmts: renderSQLStatements(cfg.Dialect, cfg.Table, sqlColumns{trail: cfg.Trail, priority: cfg.Priority}), own: sqlOwnTxOptions(cfg.Dialect),
          		policy: cfg.Policy.Normalized(), random: randomOrDefault(cfg.Random),
          	}, nil
  - of: sqlWakeFor
    participants:
      - id: caller
        kind: actor
      - id: sqlWakeFor
        kind: self
      - id: join.Join
        kind: value
      - id: newWakeSignal
        kind: internal
      - id: sqlWakes.forKey
        kind: internal
    steps:
      - bind: pool, _
        eval: join.Join(context.Background())
        to: join.Join
      - opt:
          do:
            - return: newWakeSignal()
              to: newWakeSignal
          when: pool == nil || !reflect.TypeOf(pool).Comparable()
      - return: "sqlWakes.forKey(sqlQueueKey{pool: pool, table: table})"
        to: sqlWakes.forKey
  - of: sqlOwnTxOptions
    steps:
      - opt:
          do:
            - return: "coresql.TxOptionsValue{Isolation: stdsql.LevelReadCommitted}"
          when: dialect == coresql.DialectMySQL
      - return: coresql.TxOptionsValue{}
  - of: (*sqlBroker).Publish
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).Publish
        kind: self
      - id: b.publishRow
        kind: internal
    steps:
      - return: b.publishRow(ctx, payload, time.Time{}, corequeue.PriorityNormal)
        to: b.publishRow
  - of: (*sqlBroker).PublishAt
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).PublishAt
        kind: self
      - id: b.publishRow
        kind: internal
    steps:
      - return: b.publishRow(ctx, payload, at, corequeue.PriorityNormal)
        to: b.publishRow
  - of: (*sqlBroker).PublishPriority
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).PublishPriority
        kind: self
      - id: b.checkLevel
        kind: internal
      - id: b.publishRow
        kind: internal
    steps:
      - opt:
          do:
            - return: corequeue.MessageValue{}, invalid
          init:
            bind: invalid
            eval: b.checkLevel(level)
            to: b.checkLevel
          when: invalid != nil
      - return: b.publishRow(ctx, payload, time.Time{}, level)
        to: b.publishRow
  - of: (*sqlBroker).checkLevel
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).checkLevel
        kind: self
      - id: checkPriority
        kind: internal
      - id: kerrs
        kind: package
    steps:
      - opt:
          do:
            - return: invalid
          init:
            bind: invalid
            eval: checkPriority(level)
            to: checkPriority
          when: invalid != nil
      - opt:
          do:
            - return: |-
                kerrs.Wrap(corequeue.QueueMisconfigured, kerrs.WrapParams{},
                			kerrs.String("field", "SQLConfig.Priority"), kerrs.Int("level", int(level)))
              to: kerrs
          when: level != corequeue.PriorityNormal && !b.stmts.priority
      - return: nil
  - of: (*sqlBroker).publishRow
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).publishRow
        kind: self
      - id: checkSize
        kind: internal
      - id: randomHex
        kind: internal
      - id: b.clk.Now
        kind: value
      - id: publishVisibleAt
        kind: internal
      - id: messageID
        kind: internal
      - id: b.run
        kind: internal
      - id: b.announce
        kind: internal
    steps:
      - opt:
          do:
            - return: corequeue.MessageValue{}, ctx.Err()
          when: ctx.Err() != nil
      - opt:
          do:
            - return: corequeue.MessageValue{}, tooLarge
          init:
            bind: tooLarge
            eval: checkSize(len(payload), b.policy.MaxMessageBytes)
            to: checkSize
          when: tooLarge != nil
      - bind: entropy, entropyErr
        eval: randomHex(idEntropyBytes)
        to: randomHex
      - opt:
          do:
            - return: corequeue.MessageValue{}, backendFailed("rand", "", entropyErr)
          when: entropyErr != nil
      - bind: now
        eval: b.clk.Now()
        to: b.clk.Now
      - opt:
          do:
            - return: corequeue.MessageValue{}, clockRefused(now)
          when: "!nameable(now)"
      - bind: visibleAt, invalid
        eval: publishVisibleAt(now, at)
        to: publishVisibleAt
      - opt:
          do:
            - return: corequeue.MessageValue{}, invalid
          when: invalid != nil
      - bind: id
        eval: messageID(now.UnixNano(), entropy)
        to: messageID
      - bind: insertErr
        eval: |-
          b.run(ctx, false, func(txCtx context.Context, ex coresql.Executor) error {
          		//: one row: live, queued, due at its visibility, never delivered. A nil
          		//: or empty payload may be stored as NULL, which reads back as empty.
          		statement, args := b.stmts.insertAt(level, []byte(id), visibleAt.UnixNano(), now.UnixNano(), payload)
          		if _, execErr := ex.ExecContext(txCtx, statement, args...); execErr != nil {
          			//: QueueBackendFailed, the driver's text withheld.
          			return b.failed("publish", execErr)
          		}
          		//: inserted.
          		return nil
          	})
        to: b.run
      - opt:
          do:
            - return: corequeue.MessageValue{}, insertErr
          when: insertErr != nil
      - eval: b.announce(ctx)
        to: b.announce
      - return: "corequeue.MessageValue{ID: id, Payload: payload, EnqueuedAt: now}, nil"
  - of: (*sqlBroker).Ack
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).Ack
        kind: self
      - id: b.receiptOf
        kind: internal
      - id: b.clk.Now().UnixNano
        kind: value
      - id: b.run
        kind: internal
    steps:
      - bind: held, err
        eval: b.receiptOf(ctx, receipt)
        to: b.receiptOf
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: now
        eval: b.clk.Now().UnixNano()
        to: b.clk.Now().UnixNano
      - return: |-
          b.run(ctx, false, func(txCtx context.Context, ex coresql.Executor) error {
          		result, execErr := ex.ExecContext(txCtx, b.stmts.ack, held.args(now)...)
          		//: gone, LeaseExpired, or QueueBackendFailed.
          		return b.leased(result, execErr, "acknowledge")
          	})
        to: b.run
  - of: (*sqlBroker).Nack
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).Nack
        kind: self
      - id: b.nackWith
        kind: internal
    steps:
      - return: |-
          b.nackWith(ctx, receipt, cause, func(deliveries int) time.Duration {
          		//: the curve every broker waits on.
          		return retryDelay(b.policy, deliveries, b.random)
          	})
        to: b.nackWith
  - of: (*sqlBroker).NackAfter
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).NackAfter
        kind: self
      - id: nackDeadline
        kind: internal
      - id: b.nackWith
        kind: internal
    steps:
      - opt:
          do:
            - return: corequeue.NackValue{}, invalid
          init:
            bind: _, invalid
            eval: nackDeadline(b.clk.Now(), delay)
            to: nackDeadline
          when: invalid != nil
      - return: |-
          b.nackWith(ctx, receipt, cause, func(int) time.Duration {
          		//: a negative delay is now.
          		return max(delay, 0)
          	})
        to: b.nackWith
  - of: (*sqlBroker).nackWith
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).nackWith
        kind: self
      - id: b.receiptOf
        kind: internal
      - id: b.clk.Now
        kind: value
      - id: now.Add
        kind: value
      - id: b.buryHeld
        kind: internal
      - id: b.run
        kind: internal
      - id: b.announce
        kind: internal
    steps:
      - bind: held, err
        eval: b.receiptOf(ctx, receipt)
        to: b.receiptOf
      - opt:
          do:
            - return: corequeue.NackValue{}, err
          when: err != nil
      - bind: now
        eval: b.clk.Now()
        to: b.clk.Now
      - bind: visibleAt
        eval: now.Add(wait(held.deliveries))
        to: now.Add
      - opt:
          do:
            - return: corequeue.NackValue{}, clockRefused(now)
          when: "!nameable(now) || !nameable(visibleAt)"
      - opt:
          do:
            - opt:
                do:
                  - return: corequeue.NackValue{}, buryErr
                init:
                  bind: buryErr
                  eval: b.buryHeld(ctx, held, describeCause(cause), now)
                  to: b.buryHeld
                when: buryErr != nil
            - return: "corequeue.NackValue{Deliveries: held.deliveries, DeadLettered: true}, nil"
          when: held.deliveries >= b.policy.MaxDeliveries
      - bind: retryErr
        eval: |-
          b.run(ctx, false, func(txCtx context.Context, ex coresql.Executor) error {
          		result, execErr := ex.ExecContext(txCtx, b.stmts.retry, append([]any{visibleAt.UnixNano()}, held.args(now.UnixNano())...)...)
          		//: queued again, LeaseExpired, or QueueBackendFailed.
          		return b.leased(result, execErr, "hand a message back")
          	})
        to: b.run
      - opt:
          do:
            - return: corequeue.NackValue{}, retryErr
          when: retryErr != nil
      - eval: b.announce(ctx)
        to: b.announce
      - return: "corequeue.NackValue{Deliveries: held.deliveries, VisibleAt: time.Unix(0, visibleAt.UnixNano())}, nil"
  - of: (*sqlBroker).Release
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).Release
        kind: self
      - id: b.receiptOf
        kind: internal
      - id: b.clk.Now
        kind: value
      - id: clockRefused
        kind: internal
      - id: b.run
        kind: internal
      - id: b.announce
        kind: internal
    steps:
      - bind: held, err
        eval: b.receiptOf(ctx, receipt)
        to: b.receiptOf
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: now
        eval: b.clk.Now()
        to: b.clk.Now
      - opt:
          do:
            - return: clockRefused(now)
              to: clockRefused
          when: "!nameable(now)"
      - bind: releaseErr
        eval: |-
          b.run(ctx, false, func(txCtx context.Context, ex coresql.Executor) error {
          		result, execErr := ex.ExecContext(txCtx, b.stmts.release, append([]any{now.UnixNano()}, held.args(now.UnixNano())...)...)
          		//: queued again, LeaseExpired, or QueueBackendFailed.
          		return b.leased(result, execErr, "release a message")
          	})
        to: b.run
      - opt:
          do:
            - return: releaseErr
          when: releaseErr != nil
      - eval: b.announce(ctx)
        to: b.announce
      - return: nil
  - of: (*sqlBroker).Extend
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).Extend
        kind: self
      - id: b.clk.Now
        kind: value
      - id: now.Add
        kind: value
      - id: b.receiptOf
        kind: internal
      - id: randomHex
        kind: internal
      - id: b.run
        kind: internal
    steps:
      - bind: now
        eval: b.clk.Now()
        to: b.clk.Now
      - bind: deadline
        eval: now.Add(by)
        to: now.Add
      - opt:
          do:
            - return: |-
                corequeue.LeaseValue{}, kerrs.Wrap(corequeue.QueueMisconfigured, kerrs.WrapParams{},
                			kerrs.String("field", "Extend.by"), kerrs.Int64("value_ns", int64(by)))
          when: by <= 0 || !nameable(deadline)
      - bind: held, err
        eval: b.receiptOf(ctx, receipt)
        to: b.receiptOf
      - opt:
          do:
            - return: corequeue.LeaseValue{}, err
          when: err != nil
      - bind: renewed, entropyErr
        eval: randomHex(sqlLeaseEntropyBytes)
        to: randomHex
      - opt:
          do:
            - return: corequeue.LeaseValue{}, backendFailed("rand", "", entropyErr)
          when: entropyErr != nil
      - bind: extendErr
        eval: |-
          b.run(ctx, false, func(txCtx context.Context, ex coresql.Executor) error {
          		args := append([]any{deadline.UnixNano(), []byte(renewed)}, held.args(now.UnixNano())...)
          		result, execErr := ex.ExecContext(txCtx, b.stmts.extend, args...)
          		//: renewed, LeaseExpired, or QueueBackendFailed.
          		return b.leased(result, execErr, "extend a lease")
          	})
        to: b.run
      - opt:
          do:
            - return: corequeue.LeaseValue{}, extendErr
          when: extendErr != nil
      - return: |-
          corequeue.LeaseValue{
          		Receipt:   sqlReceiptValue(held.id, held.deliveries, renewed),
          		ExpiresAt: time.Unix(0, deadline.UnixNano()),
          	}, nil
  - of: (*sqlBroker).Wake
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).Wake
        kind: self
      - id: b.wake.current
        kind: internal
      - id: time
        kind: stdlib
      - id: wakeValue
        kind: internal
    steps:
      - bind: signal, due
        eval: b.wake.current()
        to: b.wake.current
      - var:
          name: at
          type: time.Time
      - opt:
          do:
            - set: at
              to: time
              value: time.Unix(0, due)
          when: due != 0
      - return: wakeValue(signal, at, b.clk.Now())
        to: wakeValue
  - of: (*sqlBroker).run
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).run
        kind: self
      - id: b.tx.join.Join
        kind: value
      - id: b.tm.Transact
        kind: value
    steps:
      - bind: ex, inTx
        eval: b.tx.join.Join(ctx)
        to: b.tx.join.Join
      - opt:
          do:
            - return: b.tm.Transact(ctx, coresql.TxOptionsValue{}, work)
              to: b.tm.Transact
          when: inTx
      - opt:
          do:
            - return: work(ctx, ex)
          when: "!several"
      - return: b.tm.Transact(ctx, b.own, work)
        to: b.tm.Transact
  - of: (*sqlBroker).announce
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).announce
        kind: self
      - id: b.wake.fire
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: b.tx.hold.Defer(ctx, b.wake.fire)
      - eval: b.wake.fire()
        to: b.wake.fire
  - of: (*sqlBroker).buryHeld
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).buryHeld
        kind: self
      - id: clockRefused
        kind: internal
      - id: b.run
        kind: internal
    steps:
      - opt:
          do:
            - return: clockRefused(now)
              to: clockRefused
          when: "!nameable(now)"
      - return: |-
          b.run(ctx, false, func(txCtx context.Context, ex coresql.Executor) error {
          		args := append(b.stmts.causeArgs(now.UnixNano(), cause), held.args(now.UnixNano())...)
          		result, execErr := ex.ExecContext(txCtx, b.stmts.bury, args...)
          		//: dead, LeaseExpired, or QueueBackendFailed.
          		return b.leased(result, execErr, "dead-letter a message")
          	})
        to: b.run
  - of: (*sqlBroker).receiptOf
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).receiptOf
        kind: self
      - id: parseSQLReceipt
        kind: internal
    steps:
      - opt:
          do:
            - return: sqlReceipt{}, ctx.Err()
          when: ctx.Err() != nil
      - bind: held, ok
        eval: parseSQLReceipt(string(receipt))
        to: parseSQLReceipt
      - opt:
          do:
            - return: |-
                sqlReceipt{}, kerrs.Wrap(corequeue.UnknownReceipt, kerrs.WrapParams{},
                			kerrs.String("broker", sqlBrokerName))
          when: "!ok"
      - return: held, nil
  - of: (*sqlBroker).leased
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).leased
        kind: self
      - id: rowsAffected
        kind: internal
      - id: b.failed
        kind: internal
      - id: kerrs
        kind: package
    steps:
      - bind: n, err
        eval: rowsAffected(result, execErr)
        to: rowsAffected
      - opt:
          do:
            - return: b.failed(step, err)
              to: b.failed
          when: err != nil
      - opt:
          do:
            - return: kerrs.Wrap(corequeue.LeaseExpired, kerrs.WrapParams{}, kerrs.String("broker", sqlBrokerName))
              to: kerrs
          when: n == 0
      - return: nil
  - of: clockRefused
    participants:
      - id: caller
        kind: actor
      - id: clockRefused
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: |-
          kerrs.Wrap(corequeue.QueueMisconfigured, kerrs.WrapParams{},
          		kerrs.String("field", "Clock"), kerrs.String("instant", now.UTC().Format(time.RFC3339Nano)))
        to: kerrs
  - of: (*sqlBroker).failed
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).failed
        kind: self
      - id: errors
        kind: stdlib
    steps:
      - return: |-
          errors.Join(
          		kerrs.Wrap(corequeue.QueueBackendFailed, kerrs.WrapParams{}, kerrs.String("op", step), kerrs.String("table", b.table)),
          		svcsql.NewWithheld(cause))
        to: errors
  - of: sqlReceipt.args
    steps:
      - return: "[]any{[]byte(r.id), []byte(r.lease), int64(r.deliveries), now}"
  - of: sqlReceiptValue
    participants:
      - id: caller
        kind: actor
      - id: sqlReceiptValue
        kind: self
      - id: corequeue
        kind: package
    steps:
      - return: corequeue.ReceiptValue(id + "." + padCount(deliveries) + "." + lease)
        to: corequeue
  - of: parseSQLReceipt
    participants:
      - id: caller
        kind: actor
      - id: parseSQLReceipt
        kind: self
      - id: strings
        kind: stdlib
      - id: parseMessageID
        kind: internal
      - id: parseCount
        kind: internal
    steps:
      - bind: fields
        eval: strings.Split(receipt, ".")
        to: strings
      - opt:
          do:
            - return: sqlReceipt{}, false
          when: len(fields) != sqlReceiptFields
      - bind: _, _, minted
        eval: parseMessageID(fields[0])
        to: parseMessageID
      - bind: deliveries, counted
        eval: parseCount(fields[1])
        to: parseCount
      - opt:
          do:
            - return: sqlReceipt{}, false
          when: "!minted || !counted || deliveries < 1 || !isHexOfWidth(fields[2], sqlLeaseEntropyBytes)"
      - return: "sqlReceipt{id: fields[0], deliveries: deliveries, lease: fields[2]}, true"
  - of: rowsAffected
    participants:
      - id: caller
        kind: actor
      - id: rowsAffected
        kind: self
      - id: result.RowsAffected
        kind: value
    steps:
      - opt:
          do:
            - return: 0, execErr
          when: execErr != nil
      - return: result.RowsAffected()
        to: result.RowsAffected
  - of: (*sqlBroker).Stats
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).Stats
        kind: self
      - id: b.tx.join.Join
        kind: value
      - id: ex.QueryContext
        kind: value
      - id: rows.Scan
        kind: value
      - id: time
        kind: stdlib
      - id: earliest
        kind: internal
    steps:
      - opt:
          do:
            - return: corequeue.StatsValue{}, ctx.Err()
          when: ctx.Err() != nil
      - bind: ex, _
        eval: b.tx.join.Join(ctx)
        to: b.tx.join.Join
      - bind: rows, err
        eval: ex.QueryContext(ctx, b.stmts.bulk.stats)
        to: ex.QueryContext
      - opt:
          do:
            - return: corequeue.StatsValue{}, b.failed("count the queue", err)
          when: err != nil
      - defer: func() { err = b.finishRows(rows, "count the queue", err) }()
      - var:
          name: oldest
          type: int64
      - loop:
          do:
            - opt:
                do:
                  - break: true
                when: "!rows.Next()"
            - leaf: a var of several names, or of no type
              stmt: var dead, leased, count, firstEnqueued, firstDue int64
            - opt:
                do:
                  - return: corequeue.StatsValue{}, b.failed("count the queue", scanErr)
                init:
                  bind: scanErr
                  eval: rows.Scan(&dead, &leased, &count, &firstEnqueued, &firstDue)
                  to: rows.Scan
                when: scanErr != nil
            - switch:
                cases:
                  - case: dead != 0
                    do:
                      - op: +=
                        set: stats.Dead
                        value: count
                      - continue: true
                  - case: leased != 0
                    do:
                      - op: +=
                        set: stats.Leased
                        value: count
                  - default: true
                    do:
                      - op: +=
                        set: stats.Queued
                        value: count
                      - set: stats.NextDueAt
                        to: time
                        value: time.Unix(0, firstDue)
            - set: oldest
              to: earliest
              value: earliest(oldest, firstEnqueued)
          range: sqlStatsGroups + 1
      - opt:
          do:
            - set: stats.OldestEnqueuedAt
              to: time
              value: time.Unix(0, oldest)
          when: oldest != 0
      - return: stats, nil
  - of: (*sqlBroker).Purge
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).Purge
        kind: self
      - id: b.run
        kind: internal
      - id: b.announce
        kind: internal
    steps:
      - opt:
          do:
            - return: corequeue.PurgeValue{}, ctx.Err()
          when: ctx.Err() != nil
      - var:
          name: purged
          type: corequeue.PurgeValue
      - bind: err
        eval: |-
          b.run(ctx, true, func(txCtx context.Context, ex coresql.Executor) error {
          		queued, queuedErr := rowsAffected(ex.ExecContext(txCtx, b.stmts.bulk.purgeQueued))
          		//: the database refused.
          		if queuedErr != nil {
          			//: QueueBackendFailed.
          			return b.failed("purge the queue", queuedErr)
          		}
          		leased, leasedErr := rowsAffected(ex.ExecContext(txCtx, b.stmts.bulk.purgeLeased))
          		//: the database refused.
          		if leasedErr != nil {
          			//: QueueBackendFailed.
          			return b.failed("purge the queue", leasedErr)
          		}
          		purged = corequeue.PurgeValue{Queued: int(queued), Leased: int(leased)}
          		return nil
          	})
        to: b.run
      - opt:
          do:
            - return: corequeue.PurgeValue{}, err
          when: err != nil
      - eval: b.announce(ctx)
        to: b.announce
      - return: purged, nil
  - of: (*sqlBroker).ReplayDeadLetters
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).ReplayDeadLetters
        kind: self
      - id: checkBatch
        kind: internal
      - id: b.clk.Now().UnixNano
        kind: value
      - id: b.run
        kind: internal
      - id: b.announce
        kind: internal
    steps:
      - opt:
          do:
            - return: 0, invalid
          init:
            bind: invalid
            eval: checkBatch(max)
            to: checkBatch
          when: invalid != nil
      - opt:
          do:
            - return: 0, ctx.Err()
          when: ctx.Err() != nil
      - bind: now
        eval: b.clk.Now().UnixNano()
        to: b.clk.Now().UnixNano
      - set: err
        to: b.run
        value: |-
          b.run(ctx, false, func(txCtx context.Context, ex coresql.Executor) error {
          		n, execErr := rowsAffected(ex.ExecContext(txCtx, b.stmts.bulk.replayMany, now, int64(max)))
          		//: the database refused.
          		if execErr != nil {
          			//: QueueBackendFailed.
          			return b.failed("replay dead letters", execErr)
          		}
          		replayed = int(n)
          		return nil
          	})
      - opt:
          do:
            - return: 0, err
          when: err != nil
      - opt:
          do:
            - eval: b.announce(ctx)
              to: b.announce
          when: replayed > 0
      - return: replayed, nil
  - of: (*sqlBroker).PurgeDeadLetters
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).PurgeDeadLetters
        kind: self
      - id: checkBatch
        kind: internal
      - id: b.run
        kind: internal
    steps:
      - opt:
          do:
            - return: 0, invalid
          init:
            bind: invalid
            eval: checkBatch(max)
            to: checkBatch
          when: invalid != nil
      - opt:
          do:
            - return: 0, ctx.Err()
          when: ctx.Err() != nil
      - set: err
        to: b.run
        value: |-
          b.run(ctx, false, func(txCtx context.Context, ex coresql.Executor) error {
          		n, execErr := rowsAffected(ex.ExecContext(txCtx, b.stmts.bulk.purgeDeadMany, before.UnixNano(), int64(max)))
          		//: the database refused.
          		if execErr != nil {
          			//: QueueBackendFailed.
          			return b.failed("purge dead letters", execErr)
          		}
          		removed = int(n)
          		return nil
          	})
      - return: removed, err
  - of: (*sqlBroker).sweepRetention
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).sweepRetention
        kind: self
      - id: b.deadSwept.Load
        kind: value
      - id: b.run
        kind: internal
    steps:
      - bind: swept
        eval: b.deadSwept.Load()
        to: b.deadSwept.Load
      - opt:
          do:
            - return: nil
          when: "!retentionDue(b.policy, swept, now) || !b.deadSwept.CompareAndSwap(swept, now)"
      - return: |-
          b.run(ctx, false, func(txCtx context.Context, ex coresql.Executor) error {
          		//: the database refused.
          		if _, execErr := ex.ExecContext(txCtx, b.stmts.bulk.retention, retentionCutoff(b.policy, now)); execErr != nil {
          			//: QueueBackendFailed.
          			return b.failed("delete expired dead letters", execErr)
          		}
          		return nil
          	})
        to: b.run
  - of: (*sqlBroker).expireDue
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).expireDue
        kind: self
      - id: ex.ExecContext
        kind: value
      - id: b.failed
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: b.policy.MaxAge <= 0
      - bind: args
        eval: append(b.stmts.causeArgs(now, expiredCause()), now-int64(b.policy.MaxAge), now)
      - opt:
          do:
            - return: b.failed("dead-letter expired messages", execErr)
              to: b.failed
          init:
            bind: _, execErr
            eval: ex.ExecContext(ctx, b.stmts.bulk.expire, args...)
            to: ex.ExecContext
          when: execErr != nil
      - return: nil
  - of: (*sqlBroker).PublishMany
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).PublishMany
        kind: self
      - id: checkSizes
        kind: internal
      - id: b.clk.Now
        kind: value
      - id: mintBatch
        kind: internal
      - id: bulkRowsPerStatement
        kind: internal
      - id: b.run
        kind: internal
      - id: b.announce
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, ctx.Err()
          when: ctx.Err() != nil
      - opt:
          do:
            - return: nil, tooLarge
          init:
            bind: tooLarge
            eval: checkSizes(payloads, b.policy.MaxMessageBytes)
            to: checkSizes
          when: tooLarge != nil
      - opt:
          do:
            - return: nil, nil
          when: len(payloads) == 0
      - bind: now
        eval: b.clk.Now()
        to: b.clk.Now
      - opt:
          do:
            - return: nil, clockRefused(now)
          when: "!nameable(now)"
      - bind: messages, args, mintErr
        eval: mintBatch(payloads, now)
        to: mintBatch
      - opt:
          do:
            - return: nil, mintErr
          when: mintErr != nil
      - bind: perStatement
        eval: bulkRowsPerStatement(sqlInsertArgs)
        to: bulkRowsPerStatement
      - bind: insertErr
        eval: |-
          b.run(ctx, len(payloads) > perStatement, func(txCtx context.Context, ex coresql.Executor) error {
          		//: one INSERT per chunk of rows.
          		for chunk := range slices.Chunk(args, perStatement*sqlInsertArgs) {
          			//: the database refused: the transaction rolls the batch back.
          			if _, execErr := ex.ExecContext(txCtx, b.stmts.bulk.insertRows(len(chunk)/sqlInsertArgs), chunk...); execErr != nil {
          				//: QueueBackendFailed.
          				return b.failed("publish a batch", execErr)
          			}
          		}
          		return nil
          	})
        to: b.run
      - opt:
          do:
            - return: nil, insertErr
          when: insertErr != nil
      - eval: b.announce(ctx)
        to: b.announce
      - return: messages, nil
  - of: mintBatch
    participants:
      - id: caller
        kind: actor
      - id: mintBatch
        kind: self
      - id: randomHex
        kind: internal
      - id: messageID
        kind: internal
    steps:
      - bind: messages
        eval: make([]corequeue.MessageValue, len(payloads))
      - bind: args
        eval: make([]any, 0, len(payloads)*sqlInsertArgs)
      - loop:
          do:
            - bind: entropy, entropyErr
              eval: randomHex(idEntropyBytes)
              to: randomHex
            - opt:
                do:
                  - return: nil, nil, backendFailed("rand", "", entropyErr)
                when: entropyErr != nil
            - bind: id
              eval: messageID(now.UnixNano(), entropy)
              to: messageID
            - set: messages[index]
              value: "corequeue.MessageValue{ID: id, Payload: payload, EnqueuedAt: now}"
            - set: args
              value: append(args, []byte(id), now.UnixNano(), now.UnixNano(), payload)
          key: index
          range: payloads
          value: payload
      - return: messages, args, nil
  - of: (*sqlBroker).AckMany
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).AckMany
        kind: self
      - id: parseSQLReceipt
        kind: internal
      - id: b.clk.Now().UnixNano
        kind: value
      - id: bulkRowsPerStatement
        kind: internal
      - id: b.run
        kind: internal
    steps:
      - bind: result
        eval: "corequeue.AckResultValue{Outcomes: make([]corequeue.AckOutcome, len(receipts))}"
      - opt:
          do:
            - return: result, ctx.Err()
          when: ctx.Err() != nil
      - bind: held
        eval: make([]sqlReceipt, 0, len(receipts))
      - bind: positions
        eval: make([]int, 0, len(receipts))
      - loop:
          do:
            - bind: parsed, ok
              eval: parseSQLReceipt(string(receipt))
              to: parseSQLReceipt
            - opt:
                do:
                  - set: result.Outcomes[index]
                    value: corequeue.AckUnknownReceipt
                  - continue: true
                when: "!ok"
            - set: held, positions
              value: append(held, parsed), append(positions, index)
          key: index
          range: receipts
          value: receipt
      - opt:
          do:
            - return: result, nil
          when: len(held) == 0
      - bind: now
        eval: b.clk.Now().UnixNano()
        to: b.clk.Now().UnixNano
      - bind: perStatement
        eval: bulkRowsPerStatement(sqlAckArgs)
        to: bulkRowsPerStatement
      - bind: several
        eval: len(held) > perStatement || b.stmts.dialect == coresql.DialectMySQL
      - bind: landed
        eval: map[sqlLanded]bool{}
      - bind: ackErr
        eval: |-
          b.run(ctx, several, func(txCtx context.Context, ex coresql.Executor) error {
          		clear(landed)
          		//: one statement — two on MySQL — per chunk of receipts.
          		for chunk := range slices.Chunk(held, perStatement) {
          			//: the database refused: nothing of a transaction lands.
          			if err := b.ackChunk(txCtx, ex, now, chunk, landed); err != nil {
          				return err
          			}
          		}
          		return nil
          	})
        to: b.run
      - opt:
          do:
            - return: result, ackErr
          when: ackErr != nil
      - loop:
          do:
            - bind: key
              eval: "sqlLanded{id: receipt.id, lease: receipt.lease}"
            - set: result.Outcomes[positions[position]]
              value: corequeue.AckLeaseExpired
            - opt:
                do:
                  - set: result.Outcomes[positions[position]]
                    value: corequeue.AckAcknowledged
                  - eval: delete(landed, key)
                when: landed[key]
          key: position
          range: held
          value: receipt
      - return: result, nil
  - of: (*sqlBroker).ackChunk
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).ackChunk
        kind: self
      - id: b.stmts.bulk.ackRows
        kind: internal
      - id: b.stmts.bulk.ackPick
        kind: internal
      - id: b.readLanded
        kind: internal
      - id: ex.ExecContext
        kind: value
      - id: b.failed
        kind: internal
    steps:
      - bind: args
        eval: make([]any, 0, 1+len(chunk)*sqlAckArgs)
      - set: args
        value: append(args, now)
      - loop:
          do:
            - set: args
              value: append(args, []byte(receipt.id), []byte(receipt.lease), int64(receipt.deliveries))
          key: _
          range: chunk
          value: receipt
      - bind: read
        eval: b.stmts.bulk.ackRows(len(chunk))
        to: b.stmts.bulk.ackRows
      - opt:
          do:
            - set: read
              to: b.stmts.bulk.ackPick
              value: b.stmts.bulk.ackPick(len(chunk))
          when: b.stmts.dialect == coresql.DialectMySQL
      - opt:
          do:
            - return: readErr
          init:
            bind: readErr
            eval: b.readLanded(ctx, ex, read, args, landed)
            to: b.readLanded
          when: readErr != nil
      - opt:
          do:
            - opt:
                do:
                  - return: b.failed("acknowledge a batch", execErr)
                    to: b.failed
                init:
                  bind: _, execErr
                  eval: ex.ExecContext(ctx, b.stmts.bulk.ackRows(len(chunk)), args...)
                  to: ex.ExecContext
                when: execErr != nil
          when: b.stmts.dialect == coresql.DialectMySQL
      - return: nil
  - of: (*sqlBroker).readLanded
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).readLanded
        kind: self
      - id: ex.QueryContext
        kind: value
      - id: b.failed
        kind: internal
      - id: rows.Scan
        kind: value
    steps:
      - bind: rows, err
        eval: ex.QueryContext(ctx, query, args...)
        to: ex.QueryContext
      - opt:
          do:
            - return: b.failed("acknowledge a batch", err)
              to: b.failed
          when: err != nil
      - defer: func() { err = b.finishRows(rows, "acknowledge a batch", err) }()
      - loop:
          cond: rows.Next()
          do:
            - var:
                name: key
                type: sqlLanded
            - opt:
                do:
                  - return: b.failed("acknowledge a batch", scanErr)
                    to: b.failed
                init:
                  bind: scanErr
                  eval: rows.Scan(&key.id, &key.lease)
                  to: rows.Scan
                when: scanErr != nil
            - set: landed[key]
              value: "true"
      - return: nil
  - of: (*sqlBroker).AllMessages
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).AllMessages
        kind: self
      - id: pagedMessages
        kind: internal
    steps:
      - return: pagedMessages(ctx, after, b.Messages)
        to: pagedMessages
  - of: renderSQLBulkStatements
    steps:
      - bind: p
        eval: dialect.Placeholder
      - bind: causeArgs
        eval: sqlCauseArgs
      - opt:
          do:
            - op: ++
              set: causeArgs
          when: trail
      - bind: leased
        eval: "\"CASE WHEN lease IS NULL THEN 0 ELSE 1 END\""
      - bind: s
        eval: |-
          sqlBulkStatements{
          		stats: "SELECT dead, " + leased + ", COUNT(*), MIN(enqueued_at), MIN(due) FROM " + quoted +
          			" WHERE dead < 2 GROUP BY dead, " + leased,
          		purgeQueued: "DELETE FROM " + quoted + " WHERE dead = 0 AND lease IS NULL",
          		purgeLeased: "DELETE FROM " + quoted + " WHERE dead = 0 AND lease IS NOT NULL",
          		expire: "UPDATE " + quoted + " SET " + causeSet + " WHERE dead = 0 AND enqueued_at <= " + p(causeArgs+1) +
          			" AND due <= " + p(causeArgs+2),
          		retention: "DELETE FROM " + quoted + " WHERE dead = 1 AND due <= " + p(1),
          		table:     quoted, dialect: dialect, causeArgs: causeArgs,
          	}
      - bind: replaySet
        eval: "\"UPDATE \" + quoted + \" SET dead = 0, due = \" + p(1) + \", deliveries = 0, \" + cleared"
      - opt:
          do:
            - set: s.replayMany
              value: replaySet + " WHERE dead = 1 ORDER BY id LIMIT " + p(2)
            - set: s.purgeDeadMany
              value: "\"DELETE FROM \" + quoted + \" WHERE dead = 1 AND due < \" + p(1) + \" ORDER BY id LIMIT \" + p(2)"
            - return: s
          when: dialect == coresql.DialectMySQL
      - set: s.replayMany
        value: |-
          replaySet + " WHERE dead = 1 AND id IN (SELECT id FROM " + quoted +
          		" WHERE dead = 1 ORDER BY id LIMIT " + p(2) + ")"
      - set: s.purgeDeadMany
        value: |-
          "DELETE FROM " + quoted + " WHERE dead = 1 AND id IN (SELECT id FROM " + quoted +
          		" WHERE dead = 1 AND due < " + p(1) + " ORDER BY id LIMIT " + p(2) + ")"
      - return: s
  - of: (*sqlBulkStatements).ackRows
    steps:
      - bind: statement
        eval: "\"DELETE FROM \" + s.table + s.ackHeld(n)"
      - opt:
          do:
            - return: statement
          when: s.dialect == coresql.DialectMySQL
      - return: statement + " RETURNING id, lease"
  - of: (*sqlBulkStatements).ackPick
    steps:
      - return: "\"SELECT id, lease FROM \" + s.table + s.ackHeld(n) + \" FOR UPDATE\""
  - of: bulkRowsPerStatement
    steps:
      - return: max(1, (sqlRowsPerStatement+2)/argsPerRow)
  - of: (*SQLConfig).validate
    participants:
      - id: caller
        kind: actor
      - id: (*SQLConfig).validate
        kind: self
      - id: c.Policy.Validate
        kind: value
      - id: validateSQLTable
        kind: internal
    steps:
      - opt:
          do:
            - return: sqlParts{}, invalid
          init:
            bind: invalid
            eval: c.Policy.Validate()
            to: c.Policy.Validate
          when: invalid != nil
      - opt:
          do:
            - return: sqlParts{}, sqlMisconfigured("Transactor", "nil")
          when: c.Transactor == nil
      - bind: joiner, joins
        eval: c.Transactor.(coresql.Joiner)
      - bind: deferrer, defers
        eval: c.Transactor.(coresql.Deferrer)
      - opt:
          do:
            - return: sqlParts{}, sqlMisconfigured("Transactor", "not a core/data/sql Joiner and Deferrer")
          when: "!joins || !defers"
      - opt:
          do:
            - return: "sqlParts{}, sqlMisconfigured(\"Dialect\", \"not one the SDK speaks: \"+c.Dialect.String())"
          when: "!c.Dialect.Valid()"
      - opt:
          do:
            - return: sqlParts{}, tableErr
          init:
            bind: tableErr
            eval: validateSQLTable(c.Table)
            to: validateSQLTable
          when: tableErr != nil
      - return: "sqlParts{join: joiner, hold: deferrer}, nil"
  - of: validateSQLTable
    participants:
      - id: caller
        kind: actor
      - id: validateSQLTable
        kind: self
      - id: kerrs
        kind: package
    steps:
      - var:
          name: problem
          type: string
      - switch:
          cases:
            - case: "!sqlTablePattern.MatchString(table)"
              do:
                - set: problem
                  value: "\"not a lower-case SQL identifier\""
            - case: len(table) > MaxSQLTableLen
              do:
                - set: problem
                  value: "\"longer than \" + strconv.Itoa(MaxSQLTableLen) + \" bytes\""
            - case: strings.Contains(table, sqlTableSeparator)
              do:
                - set: problem
                  value: "\"holds three underscores in a row\""
            - case: strings.HasPrefix(table, sqlReservedPrefix)
              do:
                - set: problem
                  value: "\"starts with sqlite_, which SQLite reserves\""
            - default: true
              do:
                - return: nil
      - return: |-
          kerrs.Wrap(corequeue.SQLQueueMisconfigured, kerrs.WrapParams{},
          		kerrs.String("setting", "Table"), kerrs.String("problem", problem), kerrs.String("table", table))
        to: kerrs
  - of: sqlMisconfigured
    participants:
      - id: caller
        kind: actor
      - id: sqlMisconfigured
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: |-
          kerrs.Wrap(corequeue.SQLQueueMisconfigured, kerrs.WrapParams{},
          		kerrs.String("setting", setting), kerrs.String("problem", problem))
        to: kerrs
  - of: (*sqlBroker).Reject
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).Reject
        kind: self
      - id: b.receiptOf
        kind: internal
      - id: b.buryHeld
        kind: internal
    steps:
      - bind: held, err
        eval: b.receiptOf(ctx, receipt)
        to: b.receiptOf
      - opt:
          do:
            - return: err
          when: err != nil
      - return: b.buryHeld(ctx, held, describeCause(cause), b.clk.Now())
        to: b.buryHeld
  - of: (*sqlBroker).DeadLetters
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).DeadLetters
        kind: self
      - id: b.DeadLettersAfter
        kind: internal
    steps:
      - return: b.DeadLettersAfter(ctx, "", max)
        to: b.DeadLettersAfter
  - of: (*sqlBroker).DeadLettersAfter
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).DeadLettersAfter
        kind: self
      - id: checkBatch
        kind: internal
      - id: b.tx.join.Join
        kind: value
      - id: ex.QueryContext
        kind: value
      - id: scanDeadLetter
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, invalid
          init:
            bind: invalid
            eval: checkBatch(max)
            to: checkBatch
          when: invalid != nil
      - opt:
          do:
            - return: nil, ctx.Err()
          when: ctx.Err() != nil
      - bind: ex, _
        eval: b.tx.join.Join(ctx)
        to: b.tx.join.Join
      - bind: rows, err
        eval: ex.QueryContext(ctx, b.stmts.deadList, []byte(after), int64(max))
        to: ex.QueryContext
      - opt:
          do:
            - return: nil, b.failed("read the dead letters", err)
          when: err != nil
      - defer: func() { err = b.finishRows(rows, "read the dead letters", err) }()
      - loop:
          cond: rows.Next()
          do:
            - bind: record, scanErr
              eval: scanDeadLetter(rows, b.stmts.trail, b.stmts.priority)
              to: scanDeadLetter
            - opt:
                do:
                  - return: nil, b.failed("read the dead letters", scanErr)
                when: scanErr != nil
            - set: dead
              value: append(dead, record)
      - return: dead, nil
  - of: scanDeadLetter
    participants:
      - id: caller
        kind: actor
      - id: scanDeadLetter
        kind: self
      - id: rows.Scan
        kind: internal
    steps:
      - leaf: a var of several names, or of no type
        stmt: var id, reason, cause, trail, payload []byte
      - leaf: a var of several names, or of no type
        stmt: var enqueuedAt, deliveries, failedAt, level int64
      - var:
          name: code
          type: stdsql.NullInt64
      - bind: dest
        eval: "[]any{&id, &enqueuedAt, &deliveries, &failedAt, &reason, &cause, &code, &payload}"
      - opt:
          do:
            - set: dest
              value: "[]any{&id, &enqueuedAt, &deliveries, &failedAt, &reason, &cause, &code, &trail, &payload}"
          when: withTrail
      - opt:
          do:
            - set: dest
              value: append(dest, &level)
          when: withPriority
      - opt:
          do:
            - return: corequeue.DeadLetterValue{}, err
          init:
            bind: err
            eval: rows.Scan(dest...)
            to: rows.Scan
          when: err != nil
      - return: |-
          corequeue.DeadLetterValue{
          		Message: corequeue.MessageValue{
          			ID: string(id), Payload: payload, EnqueuedAt: time.Unix(0, enqueuedAt),
          		},
          		FailedAt: time.Unix(0, failedAt), Deliveries: int(deliveries),
          		Reason: string(reason), Cause: string(cause), Code: uint32(code.Int64), //nolint:gosec // written from a uint32
          		Trail: decodeTrail(string(trail)), Priority: corequeue.Priority(level), //nolint:gosec // written from a Priority
          	}, nil
  - of: (*sqlBroker).ReplayDeadLetter
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).ReplayDeadLetter
        kind: self
      - id: ctx.Err
        kind: value
      - id: b.clk.Now().UnixNano
        kind: value
      - id: b.run
        kind: internal
      - id: b.announce
        kind: internal
    steps:
      - opt:
          do:
            - return: ctx.Err()
              to: ctx.Err
          when: ctx.Err() != nil
      - bind: now
        eval: b.clk.Now().UnixNano()
        to: b.clk.Now().UnixNano
      - bind: err
        eval: |-
          b.run(ctx, false, func(txCtx context.Context, ex coresql.Executor) error {
          		result, execErr := ex.ExecContext(txCtx, b.stmts.replay, now, []byte(id))
          		//: queued, DeadLetterNotFound, or QueueBackendFailed.
          		return b.deadLetterMoved(result, execErr, "replay a dead letter", id)
          	})
        to: b.run
      - opt:
          do:
            - return: err
          when: err != nil
      - eval: b.announce(ctx)
        to: b.announce
      - return: nil
  - of: (*sqlBroker).DeleteDeadLetter
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).DeleteDeadLetter
        kind: self
      - id: ctx.Err
        kind: value
      - id: b.run
        kind: internal
    steps:
      - opt:
          do:
            - return: ctx.Err()
              to: ctx.Err
          when: ctx.Err() != nil
      - return: |-
          b.run(ctx, false, func(txCtx context.Context, ex coresql.Executor) error {
          		result, execErr := ex.ExecContext(txCtx, b.stmts.deleteDead, []byte(id))
          		//: gone, DeadLetterNotFound, or QueueBackendFailed.
          		return b.deadLetterMoved(result, execErr, "delete a dead letter", id)
          	})
        to: b.run
  - of: (*sqlBroker).PutDeadLetter
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).PutDeadLetter
        kind: self
      - id: checkDeadLetter
        kind: internal
      - id: b.checkLevel
        kind: internal
      - id: randomHex
        kind: internal
      - id: dead.Message.EnqueuedAt.UnixNano
        kind: value
      - id: messageID
        kind: internal
      - id: b.run
        kind: internal
    steps:
      - opt:
          do:
            - return: "\"\", ctx.Err()"
          when: ctx.Err() != nil
      - opt:
          do:
            - return: "\"\", invalid"
          init:
            bind: invalid
            eval: checkDeadLetter(dead, b.policy.MaxMessageBytes)
            to: checkDeadLetter
          when: invalid != nil
      - opt:
          do:
            - return: "\"\", invalid"
          init:
            bind: invalid
            eval: b.checkLevel(dead.Priority)
            to: b.checkLevel
          when: invalid != nil
      - bind: entropy, entropyErr
        eval: randomHex(idEntropyBytes)
        to: randomHex
      - opt:
          do:
            - return: "\"\", backendFailed(\"rand\", \"\", entropyErr)"
          when: entropyErr != nil
      - bind: enqueuedAt
        eval: dead.Message.EnqueuedAt.UnixNano()
        to: dead.Message.EnqueuedAt.UnixNano
      - bind: id
        eval: messageID(enqueuedAt, entropy)
        to: messageID
      - bind: err
        eval: |-
          b.run(ctx, false, func(txCtx context.Context, ex coresql.Executor) error {
          		_, execErr := ex.ExecContext(txCtx, b.stmts.putDead,
          			b.stmts.putDeadArgs(id, dead)...)
          		//: the insertion did not complete.
          		if execErr != nil {
          			//: QueueBackendFailed, the driver's text withheld.
          			return b.failed("write a dead letter", execErr)
          		}
          		//: written.
          		return nil
          	})
        to: b.run
      - opt:
          do:
            - return: "\"\", err"
          when: err != nil
      - return: id, nil
  - of: (*sqlBroker).Messages
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).Messages
        kind: self
      - id: checkBatch
        kind: internal
      - id: b.tx.join.Join
        kind: value
      - id: ex.QueryContext
        kind: value
      - id: rows.Scan
        kind: value
    steps:
      - opt:
          do:
            - return: nil, invalid
          init:
            bind: invalid
            eval: checkBatch(max)
            to: checkBatch
          when: invalid != nil
      - opt:
          do:
            - return: nil, ctx.Err()
          when: ctx.Err() != nil
      - bind: ex, _
        eval: b.tx.join.Join(ctx)
        to: b.tx.join.Join
      - bind: rows, err
        eval: ex.QueryContext(ctx, b.stmts.liveList, []byte(after), int64(max))
        to: ex.QueryContext
      - opt:
          do:
            - return: nil, b.failed("read the messages", err)
          when: err != nil
      - defer: func() { err = b.finishRows(rows, "read the messages", err) }()
      - var:
          name: id
          type: string
      - leaf: a var of several names, or of no type
        stmt: var lease, payload []byte
      - leaf: a var of several names, or of no type
        stmt: var enqueuedAt, deliveries, due, level int64
      - bind: dest
        eval: "[]any{&id, &enqueuedAt, &deliveries, &due, &lease, &payload}"
      - opt:
          do:
            - set: dest
              value: append(dest, &level)
          when: b.stmts.priority
      - loop:
          cond: rows.Next()
          do:
            - opt:
                do:
                  - return: nil, b.failed("read the messages", scanErr)
                init:
                  bind: scanErr
                  eval: rows.Scan(dest...)
                  to: rows.Scan
                when: scanErr != nil
            - set: live
              value: |-
                append(live, corequeue.LiveMessageValue{
                			VisibleAt:  time.Unix(0, due),
                			Message:    corequeue.MessageValue{ID: id, Payload: payload, EnqueuedAt: time.Unix(0, enqueuedAt)},
                			Deliveries: int(deliveries), Leased: lease != nil,
                			Priority: corequeue.Priority(level), //nolint:gosec // written from a Priority
                		})
      - return: live, nil
  - of: (*sqlBroker).PutMessage
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).PutMessage
        kind: self
      - id: checkLiveMessage
        kind: internal
      - id: b.checkLevel
        kind: internal
      - id: randomHex
        kind: internal
      - id: live.Message.EnqueuedAt.UnixNano
        kind: value
      - id: messageID
        kind: internal
      - id: b.run
        kind: internal
      - id: b.announce
        kind: internal
    steps:
      - opt:
          do:
            - return: "\"\", ctx.Err()"
          when: ctx.Err() != nil
      - opt:
          do:
            - return: "\"\", invalid"
          init:
            bind: invalid
            eval: checkLiveMessage(live, b.policy.MaxMessageBytes)
            to: checkLiveMessage
          when: invalid != nil
      - opt:
          do:
            - return: "\"\", invalid"
          init:
            bind: invalid
            eval: b.checkLevel(live.Priority)
            to: b.checkLevel
          when: invalid != nil
      - bind: entropy, entropyErr
        eval: randomHex(idEntropyBytes)
        to: randomHex
      - opt:
          do:
            - return: "\"\", backendFailed(\"rand\", \"\", entropyErr)"
          when: entropyErr != nil
      - bind: enqueuedAt
        eval: live.Message.EnqueuedAt.UnixNano()
        to: live.Message.EnqueuedAt.UnixNano
      - bind: id
        eval: messageID(enqueuedAt, entropy)
        to: messageID
      - bind: err
        eval: |-
          b.run(ctx, false, func(txCtx context.Context, ex coresql.Executor) error {
          		args := []any{[]byte(id), live.VisibleAt.UnixNano(), enqueuedAt, int64(live.Deliveries), live.Message.Payload}
          		//: the level, last, where the table keeps one.
          		if b.stmts.priority {
          			args = append(args, int64(live.Priority))
          		}
          		_, execErr := ex.ExecContext(txCtx, b.stmts.putLive, args...)
          		//: the insertion did not complete.
          		if execErr != nil {
          			//: QueueBackendFailed, the driver's text withheld.
          			return b.failed("write a message", execErr)
          		}
          		//: written.
          		return nil
          	})
        to: b.run
      - opt:
          do:
            - return: "\"\", err"
          when: err != nil
      - eval: b.announce(ctx)
        to: b.announce
      - return: id, nil
  - of: (*sqlBroker).deadLetterMoved
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).deadLetterMoved
        kind: self
      - id: rowsAffected
        kind: internal
      - id: b.failed
        kind: internal
      - id: deadLetterNotFound
        kind: internal
    steps:
      - bind: n, err
        eval: rowsAffected(result, execErr)
        to: rowsAffected
      - opt:
          do:
            - return: b.failed(step, err)
              to: b.failed
          when: err != nil
      - opt:
          do:
            - return: deadLetterNotFound(sqlBrokerName, id)
              to: deadLetterNotFound
          when: n == 0
      - return: nil
  - of: renderSQLStatements
    participants:
      - id: caller
        kind: actor
      - id: renderSQLStatements
        kind: self
      - id: dialect.QuoteIdent
        kind: value
      - id: stmts.withPriority
        kind: internal
      - id: svcsql
        kind: package
    steps:
      - bind: trail
        eval: cols.trail
      - bind: quoted
        eval: dialect.QuoteIdent(table)
        to: dialect.QuoteIdent
      - bind: place
        eval: dialect.Placeholder
      - bind: causeSet
        eval: "\"dead = 1, due = \" + place(1) + \", lease = NULL, reason = \" + place(2) + \", cause = \" + place(3) + \", code = \" + place(4)"
      - bind: heldFrom, deadColumns, cleared
        eval: sqlCauseArgs+1, "reason, cause, code", "reason = NULL, cause = NULL, code = NULL"
      - bind: putColumns, putValues
        eval: "\"reason, cause, code\", place(6)+\", \"+place(7)+\", \"+place(8)"
      - opt:
          do:
            - op: +=
              set: causeSet
              value: "\", \" + sqlTrailColumn + \" = \" + place(sqlCauseArgs+1)"
            - set: heldFrom, deadColumns
              value: sqlCauseArgs+2, deadColumns+", "+sqlTrailColumn
            - op: +=
              set: cleared
              value: "\", \" + sqlTrailColumn + \" = NULL\""
            - set: putColumns, putValues
              value: putColumns+", "+sqlTrailColumn, putValues+", "+place(9)
          when: trail
      - bind: stmts
        eval: |-
          sqlStatements{
          		insert: "INSERT INTO " + quoted + " (id, dead, due, enqueued_at, deliveries, payload) VALUES (" +
          			place(1) + ", 0, " + place(2) + ", " + place(3) + ", 0, " + place(4) + ")",
          		probe: "SELECT MIN(due) FROM " + quoted + " WHERE dead = 0",
          		//: the lease's read locks the rows it returns and skips those another
          		//: transaction holds, so two consumers never wait on each other's
          		//: messages and never take the same one; MySQL needs 8.0.1 for it and
          		//: MariaDB 10.6, and an older server's refusal is QUEUE_BACKEND_FAILED.
          		//: SQLite has no such clause and needs none: its writer holds the
          		//: database's only write lock.
          		pick: "SELECT id, enqueued_at, deliveries, lease, payload FROM " + quoted + " WHERE dead = 0 AND due <= " + place(1) +
          			" ORDER BY due, id LIMIT " + place(2) + dialect.ForUpdateSkipLocked(),
          		next:    "SELECT MIN(due) FROM " + quoted + " WHERE dead = 0 AND due > " + place(1),
          		ack:     "DELETE FROM " + quoted + " WHERE " + sqlHeldBy(dialect, 1),
          		retry:   "UPDATE " + quoted + " SET due = " + place(1) + ", lease = NULL WHERE " + sqlHeldBy(dialect, 2),
          		bury:    "UPDATE " + quoted + " SET " + causeSet + " WHERE " + sqlHeldBy(dialect, heldFrom),
          		extend:  "UPDATE " + quoted + " SET due = " + place(1) + ", lease = " + place(2) + " WHERE " + sqlHeldBy(dialect, 3),
          		release: "UPDATE " + quoted + " SET due = " + place(1) + ", lease = NULL, deliveries = deliveries - 1 WHERE " + sqlHeldBy(dialect, 2),
          		deadList: "SELECT id, enqueued_at, deliveries, due, " + deadColumns + ", payload FROM " + quoted +
          			" WHERE dead = 1 AND id > " + place(1) + " ORDER BY id LIMIT " + place(2),
          		replay:     "UPDATE " + quoted + " SET dead = 0, due = " + place(1) + ", deliveries = 0, " + cleared + " WHERE id = " + place(2) + " AND dead = 1",
          		deleteDead: "DELETE FROM " + quoted + " WHERE id = " + place(1) + " AND dead = 1",
          		table:      quoted,
          		dialect:    dialect,
          		trail:      trail,
          		putDead: "INSERT INTO " + quoted + " (id, dead, due, enqueued_at, deliveries, payload, " + putColumns + ") VALUES (" +
          			place(1) + ", 1, " + place(2) + ", " + place(3) + ", " + place(4) + ", " + place(5) + ", " + putValues + ")",
          		liveList: "SELECT id, enqueued_at, deliveries, due, lease, payload FROM " + quoted + " WHERE dead = 0 AND id > " + place(1) +
          			" ORDER BY id LIMIT " + place(2),
          		putLive: "INSERT INTO " + quoted + " (id, dead, due, enqueued_at, deliveries, payload) VALUES (" +
          			place(1) + ", 0, " + place(2) + ", " + place(3) + ", " + place(4) + ", " + place(5) + ")",
          		once: renderSQLOnceStatements(dialect, quoted),
          		bulk: renderSQLBulkStatements(dialect, quoted, causeSet, cleared, trail),
          		buryExhausted: "UPDATE " + quoted + " SET " + causeSet + " WHERE dead = 0 AND lease IS NOT NULL AND due <= " +
          			place(heldFrom) + " AND deliveries >= " + place(heldFrom+1),
          	}
      - opt:
          do:
            - eval: stmts.withPriority(dialect, quoted)
              to: stmts.withPriority
          when: cols.priority
      - opt:
          do:
            - set: stmts.lock
              to: svcsql
              value: svcsql.FileLockSQL(quoted)
          when: dialect == coresql.DialectSQLite
      - opt:
          do:
            - set: stmts.leaseReturning
              value: |-
                "UPDATE " + quoted + " SET due = " + place(1) + ", lease = " + place(2) +
                			", deliveries = deliveries + 1 FROM (SELECT id, due FROM " + quoted +
                			" WHERE dead = 0 AND due <= " + place(3) + " AND (lease IS NULL OR deliveries < " + place(4) + ")" +
                			" ORDER BY due, id LIMIT " + place(5) + dialect.ForUpdateSkipLocked() + ") AS picked WHERE " + quoted + ".id = picked.id" +
                			" RETURNING " + quoted + ".id, " + quoted + ".enqueued_at, " + quoted + ".deliveries, " + quoted + ".payload, picked.due"
          when: dialect == coresql.DialectPostgres && !cols.priority
      - return: stmts
  - of: (*sqlStatements).withPriority
    participants:
      - id: caller
        kind: actor
      - id: (*sqlStatements).withPriority
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - bind: p
        eval: dialect.Placeholder
      - set: s.priority
        value: "true"
      - set: s.pick
        value: |-
          "SELECT id, enqueued_at, deliveries, lease, payload FROM " + quoted + " WHERE dead = 0 AND due <= " + p(1) +
          		" ORDER BY " + sqlPriorityColumn + " DESC, due, id LIMIT " + p(2) + dialect.ForUpdateSkipLocked()
      - set: s.insertPriority
        value: |-
          "INSERT INTO " + quoted + " (id, dead, due, enqueued_at, deliveries, payload, " + sqlPriorityColumn +
          		") VALUES (" + p(1) + ", 0, " + p(2) + ", " + p(3) + ", 0, " + p(4) + ", " + p(5) + ")"
      - set: s.putLive
        value: |-
          "INSERT INTO " + quoted + " (id, dead, due, enqueued_at, deliveries, payload, " + sqlPriorityColumn +
          		") VALUES (" + p(1) + ", 0, " + p(2) + ", " + p(3) + ", " + p(4) + ", " + p(5) + ", " + p(6) + ")"
      - bind: putColumns, putValues, last
        eval: "\"reason, cause, code\", p(6)+\", \"+p(7)+\", \"+p(8), sqlPutDeadArgs+1"
      - opt:
          do:
            - set: putColumns, putValues, last
              value: putColumns+", "+sqlTrailColumn, putValues+", "+p(sqlPutDeadArgs+1), sqlPutDeadArgs+2
          when: s.trail
      - set: s.putDead
        value: |-
          "INSERT INTO " + quoted + " (id, dead, due, enqueued_at, deliveries, payload, " + putColumns + ", " + sqlPriorityColumn +
          		") VALUES (" + p(1) + ", 1, " + p(2) + ", " + p(3) + ", " + p(4) + ", " + p(5) + ", " + putValues + ", " + p(last) + ")"
      - set: s.deadList
        to: strings
        value: strings.Replace(s.deadList, ", payload FROM ", ", payload, "+sqlPriorityColumn+" FROM ", 1)
      - set: s.liveList
        to: strings
        value: strings.Replace(s.liveList, ", payload FROM ", ", payload, "+sqlPriorityColumn+" FROM ", 1)
  - of: (*sqlStatements).insertAt
    steps:
      - opt:
          do:
            - return: s.insert, []any{id, due, enqueued, payload}
          when: level == corequeue.PriorityNormal
      - return: s.insertPriority, []any{id, due, enqueued, payload, int64(level)}
  - of: sqlHeldBy
    participants:
      - id: caller
        kind: actor
      - id: sqlHeldBy
        kind: self
      - id: dialect.Placeholder
        kind: value
    steps:
      - bind: p
        eval:
          closure:
            params: n int
            results: string
            steps:
              - return: dialect.Placeholder(first + n)
                to: dialect.Placeholder
      - return: "\"id = \" + p(0) + \" AND lease = \" + p(1) + \" AND deliveries = \" + p(2) + \" AND dead = 0 AND due > \" + p(3)"
  - of: (*sqlStatements).leaseRows
    steps:
      - return: |-
          "UPDATE " + s.table + " SET due = " + s.dialect.Placeholder(1) + ", lease = " + s.dialect.Placeholder(2) +
          		", deliveries = deliveries + 1 WHERE dead = 0 AND id IN (" + s.list(3, n) + ")"
  - of: (*sqlStatements).buryRows
    steps:
      - bind: p
        eval: s.dialect.Placeholder
      - bind: set, first
        eval: "\"\", sqlCauseArgs+1"
      - opt:
          do:
            - set: set, first
              value: "\", \"+sqlTrailColumn+\" = \"+p(sqlCauseArgs+1), sqlCauseArgs+2"
          when: s.trail
      - return: |-
          "UPDATE " + s.table + " SET dead = 1, due = " + p(1) + ", lease = NULL, reason = " + p(2) + ", cause = " + p(3) +
          		", code = " + p(4) + set + " WHERE dead = 0 AND id IN (" + s.list(first, n) + ")"
  - of: (*sqlStatements).causeArgs
    steps:
      - bind: args
        eval: "[]any{now, []byte(oneLine(cause.reason)), []byte(oneLine(cause.public)), int64(cause.code)}"
      - opt:
          do:
            - set: args
              value: append(args, trailArg(cause.trail))
          when: s.trail
      - return: args
  - of: (*sqlStatements).putDeadArgs
    steps:
      - bind: args
        eval: |-
          []any{
          		[]byte(id), dead.FailedAt.UnixNano(), dead.Message.EnqueuedAt.UnixNano(), int64(dead.Deliveries), dead.Message.Payload,
          		[]byte(dead.Reason), []byte(dead.Cause), int64(dead.Code),
          	}
      - opt:
          do:
            - set: args
              value: append(args, trailArg(dead.Trail))
          when: s.trail
      - opt:
          do:
            - set: args
              value: append(args, int64(dead.Priority))
          when: s.priority
      - return: args
  - of: trailArg
    steps:
      - opt:
          do:
            - return: nil
          when: len(trail) == 0
      - return: "[]byte(encodeTrail(trail))"
  - of: renderSQLOnceStatements
    steps:
      - bind: p
        eval: dialect.Placeholder
      - return: |-
          sqlOnceStatements{
          		drop:  "DELETE FROM " + q + " WHERE id = " + p(1) + " AND dead = 2 AND due <= " + p(2),
          		claim: onceClaimStatement(dialect, q),
          		pick:  "SELECT id FROM " + q + " WHERE dead = 2 AND due <= " + p(1) + " ORDER BY due, id LIMIT " + p(2) + dialect.ForUpdateSkipLocked(),
          	}
  - of: (*sqlStatements).onceSweepRows
    steps:
      - return: |-
          "DELETE FROM " + s.table + " WHERE dead = 2 AND due <= " + s.dialect.Placeholder(1) +
          		" AND id IN (" + s.list(2, n) + ")"
  - of: onceClaimStatement
    steps:
      - bind: p
        eval: dialect.Placeholder
      - bind: values
        eval: "\" INTO \" + q + \" (id, dead, due, enqueued_at, deliveries) VALUES (\" + p(1) + \", 2, \" + p(2) + \", \" + p(3) + \", 0)\""
      - opt:
          do:
            - return: "\"INSERT IGNORE\" + values"
          when: dialect == coresql.DialectMySQL
      - return: "\"INSERT\" + values + \" ON CONFLICT (id) DO NOTHING\""
  - of: (*sqlStatements).list
    participants:
      - id: caller
        kind: actor
      - id: (*sqlStatements).list
        kind: self
      - id: s.dialect.Placeholder
        kind: value
      - id: strings
        kind: stdlib
    steps:
      - bind: marks
        eval: make([]string, n)
      - loop:
          do:
            - set: marks[i]
              to: s.dialect.Placeholder
              value: s.dialect.Placeholder(first + i)
          key: i
          range: marks
      - return: strings.Join(marks, ", ")
        to: strings
  - of: createQueueTableStatements
    participants:
      - id: caller
        kind: actor
      - id: createQueueTableStatements
        kind: self
      - id: dialect.QuoteIdent
        kind: value
    steps:
      - bind: q
        eval: dialect.QuoteIdent(table)
        to: dialect.QuoteIdent
      - switch:
          cases:
            - case: coresql.DialectMySQL
              do:
                - return: |-
                    []string{"CREATE TABLE IF NOT EXISTS " + q + " (id VARBINARY(" + strconv.Itoa(sqlIDColumnLen) + ") NOT NULL," +
                    			" dead TINYINT NOT NULL, due BIGINT NOT NULL, enqueued_at BIGINT NOT NULL, deliveries INT NOT NULL," +
                    			" lease VARBINARY(" + strconv.Itoa(sqlLeaseColumnLen) + ") NULL, payload LONGBLOB NULL," +
                    			" reason VARBINARY(" + strconv.Itoa(sqlCauseColumnLen) + ") NULL, cause VARBINARY(" + strconv.Itoa(sqlCauseColumnLen) + ") NULL," +
                    			" code BIGINT NULL, " + sqlTrailColumn + " " + trailColumnType(dialect) + ", PRIMARY KEY (id), UNIQUE KEY (dead, due, id)) ENGINE=InnoDB"}
            - case: coresql.DialectPostgres
              do:
                - return: |-
                    []string{"CREATE TABLE IF NOT EXISTS " + q + " (id bytea NOT NULL PRIMARY KEY, dead smallint NOT NULL," +
                    			" due bigint NOT NULL, enqueued_at bigint NOT NULL, deliveries integer NOT NULL, lease bytea, payload bytea," +
                    			" reason bytea, cause bytea, code bigint, " + sqlTrailColumn + " " + trailColumnType(dialect) + ", UNIQUE (dead, due, id))"}
            - default: true
              do:
                - return: |-
                    []string{"CREATE TABLE IF NOT EXISTS " + q + " (id BLOB NOT NULL PRIMARY KEY, dead INTEGER NOT NULL," +
                    			" due INTEGER NOT NULL, enqueued_at INTEGER NOT NULL, deliveries INTEGER NOT NULL, lease BLOB, payload BLOB," +
                    			" reason BLOB, cause BLOB, code INTEGER, " + sqlTrailColumn + " " + trailColumnType(dialect) + ", UNIQUE (dead, due, id))"}
          "on": dialect
  - of: dropQueueTableStatements
    steps:
      - return: "[]string{\"DROP TABLE IF EXISTS \" + dialect.QuoteIdent(table)}"
  - of: SQLMigration
    participants:
      - id: caller
        kind: actor
      - id: SQLMigration
        kind: self
      - id: validateSQLTable
        kind: internal
      - id: createQueueTableStatements
        kind: internal
      - id: migration.Validate
        kind: value
    steps:
      - opt:
          do:
            - return: "coresql.MigrationValue{}, sqlMisconfigured(\"Dialect\", \"not one the SDK speaks: \"+dialect.String())"
          when: "!dialect.Valid()"
      - opt:
          do:
            - return: coresql.MigrationValue{}, err
          init:
            bind: err
            eval: validateSQLTable(table)
            to: validateSQLTable
          when: err != nil
      - bind: up
        eval: createQueueTableStatements(dialect, table)
        to: createQueueTableStatements
      - bind: migration
        eval: |-
          coresql.MigrationValue{
          		Version: version,
          		Name:    sqlMigrationPrefix + table,
          		Up:      svcsql.Statements(up...),
          		Down:    svcsql.Statements(dropQueueTableStatements(dialect, table)...),
          		//: what Up runs, fingerprinted: an install that recorded it refuses a
          		//: build whose statement differs (#1056).
          		Checksum: svcsql.ChecksumOf(up...),
          	}
      - opt:
          do:
            - return: coresql.MigrationValue{}, err
          init:
            bind: err
            eval: migration.Validate()
            to: migration.Validate
          when: err != nil
      - return: migration, nil
  - of: SQLTrailMigration
    participants:
      - id: caller
        kind: actor
      - id: SQLTrailMigration
        kind: self
      - id: validateSQLTable
        kind: internal
      - id: renderTrailColumnStatements
        kind: internal
      - id: migration.Validate
        kind: value
    steps:
      - opt:
          do:
            - return: "coresql.MigrationValue{}, sqlMisconfigured(\"Dialect\", \"not one the SDK speaks: \"+dialect.String())"
          when: "!dialect.Valid()"
      - opt:
          do:
            - return: coresql.MigrationValue{}, err
          init:
            bind: err
            eval: validateSQLTable(table)
            to: validateSQLTable
          when: err != nil
      - bind: statements
        eval: renderTrailColumnStatements(dialect, table)
        to: renderTrailColumnStatements
      - bind: migration
        eval: |-
          coresql.MigrationValue{
          		Version: version,
          		Name:    sqlTrailMigrationPrefix + table,
          		Up:      statements.step(table, false),
          		Down:    statements.step(table, true),
          	}
      - opt:
          do:
            - return: coresql.MigrationValue{}, err
          init:
            bind: err
            eval: migration.Validate()
            to: migration.Validate
          when: err != nil
      - return: migration, nil
  - of: (*sqlBroker).PublishOnce
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).PublishOnce
        kind: self
      - id: checkSize
        kind: internal
      - id: randomHex
        kind: internal
      - id: b.clk.Now
        kind: value
      - id: onceUntil
        kind: internal
      - id: messageID
        kind: internal
      - id: b.run
        kind: internal
      - id: b.announce
        kind: internal
    steps:
      - opt:
          do:
            - return: corequeue.MessageValue{}, false, ctx.Err()
          when: ctx.Err() != nil
      - opt:
          do:
            - return: corequeue.MessageValue{}, false, tooLarge
          init:
            bind: tooLarge
            eval: checkSize(len(payload), b.policy.MaxMessageBytes)
            to: checkSize
          when: tooLarge != nil
      - bind: entropy, entropyErr
        eval: randomHex(idEntropyBytes)
        to: randomHex
      - opt:
          do:
            - return: corequeue.MessageValue{}, false, backendFailed("rand", "", entropyErr)
          when: entropyErr != nil
      - bind: now
        eval: b.clk.Now()
        to: b.clk.Now
      - opt:
          do:
            - return: corequeue.MessageValue{}, false, clockRefused(now)
          when: "!nameable(now)"
      - bind: until, invalid
        eval: onceUntil(now, key, window)
        to: onceUntil
      - opt:
          do:
            - return: corequeue.MessageValue{}, false, invalid
          when: invalid != nil
      - bind: id
        eval: messageID(now.UnixNano(), entropy)
        to: messageID
      - bind: digest
        eval: "[]byte(onceDigest(key))"
      - bind: runErr
        eval: |-
          b.run(ctx, true, func(txCtx context.Context, ex coresql.Executor) error {
          		//: what this run of the work decided, and nothing a run before it did.
          		published = false
          		claimed, claimErr := b.claimOnce(txCtx, ex, digest, until.UnixNano(), now.UnixNano())
          		//: the claim did not complete.
          		if claimErr != nil {
          			//: QueueBackendFailed, the driver's text withheld.
          			return claimErr
          		}
          		//: the key is this publication's: the message joins it.
          		if claimed {
          			//: one row: live, queued, visible now, never delivered.
          			if _, execErr := ex.ExecContext(txCtx, b.stmts.insert, []byte(id), now.UnixNano(), now.UnixNano(), payload); execErr != nil {
          				//: QueueBackendFailed — the claim rolls back with it.
          				return b.failed("publish", execErr)
          			}
          			published = true
          		}
          		//: the passed reservations of other keys, a bounded number.
          		return b.sweepOnce(txCtx, ex, now.UnixNano())
          	})
        to: b.run
      - opt:
          do:
            - return: corequeue.MessageValue{}, false, runErr
          when: runErr != nil
      - opt:
          do:
            - return: corequeue.MessageValue{}, false, nil
          when: "!published"
      - eval: b.announce(ctx)
        to: b.announce
      - return: "corequeue.MessageValue{ID: id, Payload: payload, EnqueuedAt: now}, true, nil"
  - of: (*sqlBroker).claimOnce
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).claimOnce
        kind: self
      - id: ex.ExecContext
        kind: value
      - id: rowsAffected
        kind: internal
    steps:
      - opt:
          do:
            - return: false, b.failed("drop a passed reservation", execErr)
          init:
            bind: _, execErr
            eval: ex.ExecContext(ctx, b.stmts.once.drop, digest, now)
            to: ex.ExecContext
          when: execErr != nil
      - bind: result, execErr
        eval: ex.ExecContext(ctx, b.stmts.once.claim, digest, until, now)
        to: ex.ExecContext
      - bind: n, err
        eval: rowsAffected(result, execErr)
        to: rowsAffected
      - opt:
          do:
            - return: false, b.failed("reserve a key", err)
          when: err != nil
      - return: n == 1, nil
  - of: (*sqlBroker).sweepOnce
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).sweepOnce
        kind: self
      - id: b.pickPassedOnce
        kind: internal
      - id: ex.ExecContext
        kind: value
      - id: b.failed
        kind: internal
    steps:
      - bind: ids, err
        eval: b.pickPassedOnce(ctx, ex, now)
        to: b.pickPassedOnce
      - opt:
          do:
            - return: err
          when: err != nil || len(ids) == 0
      - opt:
          do:
            - return: b.failed("remove the passed reservations", execErr)
              to: b.failed
          init:
            bind: _, execErr
            eval: ex.ExecContext(ctx, b.stmts.onceSweepRows(len(ids)), append([]any{now}, ids...)...)
            to: ex.ExecContext
          when: execErr != nil
      - return: nil
  - of: (*sqlBroker).pickPassedOnce
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).pickPassedOnce
        kind: self
      - id: ex.QueryContext
        kind: value
      - id: rows.Scan
        kind: value
    steps:
      - bind: rows, err
        eval: ex.QueryContext(ctx, b.stmts.once.pick, now, int64(sqlOnceSweepRows))
        to: ex.QueryContext
      - opt:
          do:
            - return: nil, b.failed("read the passed reservations", err)
          when: err != nil
      - defer: func() { err = b.finishRows(rows, "read the passed reservations", err) }()
      - loop:
          cond: rows.Next()
          do:
            - var:
                name: id
                type: "[]byte"
            - opt:
                do:
                  - return: nil, b.failed("read the passed reservations", scanErr)
                init:
                  bind: scanErr
                  eval: rows.Scan(&id)
                  to: rows.Scan
                when: scanErr != nil
            - set: ids
              value: append(ids, id)
      - return: ids, nil
  - of: SQLPriorityMigration
    participants:
      - id: caller
        kind: actor
      - id: SQLPriorityMigration
        kind: self
      - id: validateSQLTable
        kind: internal
      - id: renderPriorityColumnStatements
        kind: internal
      - id: migration.Validate
        kind: value
    steps:
      - opt:
          do:
            - return: "coresql.MigrationValue{}, sqlMisconfigured(\"Dialect\", \"not one the SDK speaks: \"+dialect.String())"
          when: "!dialect.Valid()"
      - opt:
          do:
            - return: coresql.MigrationValue{}, err
          init:
            bind: err
            eval: validateSQLTable(table)
            to: validateSQLTable
          when: err != nil
      - bind: statements
        eval: renderPriorityColumnStatements(dialect, table)
        to: renderPriorityColumnStatements
      - bind: migration
        eval: |-
          coresql.MigrationValue{
          		Version: version,
          		Name:    sqlPriorityMigrationPrefix + table,
          		Up:      statements.step(table, false),
          		Down:    statements.step(table, true),
          	}
      - opt:
          do:
            - return: coresql.MigrationValue{}, err
          init:
            bind: err
            eval: migration.Validate()
            to: migration.Validate
          when: err != nil
      - return: migration, nil
  - of: renderPriorityColumnStatements
    participants:
      - id: caller
        kind: actor
      - id: renderPriorityColumnStatements
        kind: self
      - id: dialect.QuoteIdent
        kind: value
    steps:
      - bind: q
        eval: dialect.QuoteIdent(table)
        to: dialect.QuoteIdent
      - bind: index
        eval: dialect.QuoteIdent(priorityIndexName(table))
        to: dialect.QuoteIdent
      - bind: columns
        eval: "\"(dead, \" + sqlPriorityColumn + \", due, id)\""
      - switch:
          cases:
            - case: coresql.DialectPostgres
              do:
                - return: |-
                    priorityColumnStatements{
                    			probe: priorityProbe("column_name",
                    				"information_schema.columns WHERE table_schema = current_schema() AND table_name = "+dialect.Placeholder(1)),
                    			add: []string{
                    				"ALTER TABLE " + q + " ADD COLUMN " + sqlPriorityColumn + " smallint NOT NULL DEFAULT 0",
                    				"CREATE INDEX IF NOT EXISTS " + index + " ON " + q + " " + columns,
                    			},
                    			drop: []string{"DROP INDEX IF EXISTS " + index, "ALTER TABLE " + q + " DROP COLUMN " + sqlPriorityColumn},
                    		}
            - case: coresql.DialectMySQL
              do:
                - return: |-
                    priorityColumnStatements{
                    			probe: priorityProbe("column_name",
                    				"information_schema.columns WHERE table_schema = DATABASE() AND table_name = "+dialect.Placeholder(1)),
                    			add: []string{"ALTER TABLE " + q + " ADD COLUMN " + sqlPriorityColumn +
                    				" SMALLINT NOT NULL DEFAULT 0, ADD INDEX " + index + " " + columns},
                    			drop: []string{"ALTER TABLE " + q + " DROP INDEX " + index + ", DROP COLUMN " + sqlPriorityColumn},
                    		}
            - default: true
              do:
                - return: |-
                    priorityColumnStatements{
                    			probe: priorityProbe("name", "pragma_table_info("+dialect.Placeholder(1)+")"),
                    			add: []string{
                    				"ALTER TABLE " + q + " ADD COLUMN " + sqlPriorityColumn + " INTEGER NOT NULL DEFAULT 0",
                    				"CREATE INDEX IF NOT EXISTS " + index + " ON " + q + " " + columns,
                    			},
                    			drop: []string{"DROP INDEX IF EXISTS " + index, "ALTER TABLE " + q + " DROP COLUMN " + sqlPriorityColumn},
                    		}
          "on": dialect
  - of: priorityIndexName
    participants:
      - id: caller
        kind: actor
      - id: priorityIndexName
        kind: self
      - id: sha256
        kind: stdlib
    steps:
      - bind: name
        eval: table + sqlPriorityIndexSuffix
      - opt:
          do:
            - return: name
          when: len(name) <= MaxSQLTableLen
      - bind: sum
        eval: sha256.Sum256([]byte(table))
        to: sha256
      - bind: tag
        eval: "\"_\" + hex.EncodeToString(sum[:sqlPriorityIndexHash])"
      - return: table[:MaxSQLTableLen-len(tag)-len(sqlPriorityIndexSuffix)] + tag + sqlPriorityIndexSuffix
  - of: priorityProbe
    steps:
      - return: "\"SELECT COUNT(*), COALESCE(SUM(CASE WHEN \" + nameColumn + \" = '\" + sqlPriorityColumn + \"' THEN 1 ELSE 0 END), 0) FROM \" + catalogue"
  - of: priorityColumnStatements.step
    participants:
      - id: caller
        kind: actor
      - id: priorityColumnStatements.step
        kind: self
      - id: ex.QueryRowContext(ctx, s.probe, table).Scan
        kind: value
      - id: ex.ExecContext
        kind: value
    steps:
      - bind: statements
        eval: s.add
      - opt:
          do:
            - set: statements
              value: s.drop
          when: drop
      - return:
          closure:
            params: ctx context.Context, ex coresql.Executor
            results: error
            steps:
              - leaf: a var of several names, or of no type
                stmt: var columns, levels int64
              - opt:
                  do:
                    - return: err
                  init:
                    bind: err
                    eval: ex.QueryRowContext(ctx, s.probe, table).Scan(&columns, &levels)
                    to: ex.QueryRowContext(ctx, s.probe, table).Scan
                  when: err != nil
              - opt:
                  do:
                    - return: nil
                  when: columns == 0 || (levels > 0) != drop
              - loop:
                  do:
                    - opt:
                        do:
                          - return: err
                        init:
                          bind: _, err
                          eval: ex.ExecContext(ctx, statement)
                          to: ex.ExecContext
                        when: err != nil
                  key: _
                  range: statements
                  value: statement
              - return: nil
  - of: (*sqlBroker).Receive
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).Receive
        kind: self
      - id: checkBatch
        kind: internal
      - id: b.receiveInstants
        kind: internal
      - id: b.tx.join.Join
        kind: value
      - id: b.probeOutside
        kind: internal
      - id: b.leaseInTransaction
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, invalid
          init:
            bind: invalid
            eval: checkBatch(max)
            to: checkBatch
          when: invalid != nil
      - opt:
          do:
            - return: nil, ctx.Err()
          when: ctx.Err() != nil
      - bind: at, instantsErr
        eval: b.receiveInstants(ctx)
        to: b.receiveInstants
      - opt:
          do:
            - return: nil, instantsErr
          when: instantsErr != nil
      - bind: ex, inTx
        eval: b.tx.join.Join(ctx)
        to: b.tx.join.Join
      - opt:
          do:
            - bind: probed, answered, probeErr
              eval: b.probeOutside(ctx, ex, at, max)
              to: b.probeOutside
            - opt:
                do:
                  - return: probed, probeErr
                when: answered
          when: "!inTx"
      - return: b.leaseInTransaction(ctx, at, max)
        to: b.leaseInTransaction
  - of: (*sqlBroker).receiveInstants
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).receiveInstants
        kind: self
      - id: b.clk.Now
        kind: value
      - id: clockNow.Add
        kind: value
    steps:
      - bind: clockNow
        eval: b.clk.Now()
        to: b.clk.Now
      - bind: deadline
        eval: clockNow.Add(b.policy.VisibilityTimeout)
        to: clockNow.Add
      - opt:
          do:
            - return: sqlInstants{}, clockRefused(clockNow)
          when: "!nameable(clockNow) || !nameable(deadline)"
      - bind: at
        eval: "sqlInstants{now: clockNow.UnixNano(), deadline: deadline.UnixNano()}"
      - return: at, b.sweepRetention(ctx, at.now)
  - of: (*sqlBroker).probeOutside
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).probeOutside
        kind: self
      - id: b.minDue
        kind: internal
      - id: b.wake.record
        kind: internal
      - id: b.receiveReturning
        kind: internal
    steps:
      - bind: due, probeErr
        eval: b.minDue(ctx, ex, b.stmts.probe, "probe the queue")
        to: b.minDue
      - opt:
          do:
            - return: nil, true, probeErr
          when: probeErr != nil
      - opt:
          do:
            - eval: b.wake.record(due.Int64)
              to: b.wake.record
            - return: nil, true, nil
          when: "!due.Valid || due.Int64 > at.now"
      - opt:
          do:
            - set: batch, err
              to: b.receiveReturning
              value: b.receiveReturning(ctx, ex, at, max)
            - return: batch, true, err
          when: b.stmts.leaseReturning != ""
      - return: nil, false, nil
  - of: (*sqlBroker).leaseInTransaction
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).leaseInTransaction
        kind: self
      - id: b.run
        kind: internal
      - id: b.wake.record
        kind: internal
    steps:
      - var:
          name: batch
          type: "[]corequeue.DeliveryValue"
      - var:
          name: next
          type: int64
      - bind: leaseErr
        eval: |-
          b.run(ctx, true, func(txCtx context.Context, ex coresql.Executor) error {
          		var err error
          		batch, next, err = b.leaseDue(txCtx, ex, at, max)
          		//: nil, or QueueBackendFailed.
          		return err
          	})
        to: b.run
      - opt:
          do:
            - return: nil, leaseErr
          when: leaseErr != nil
      - eval: b.wake.record(next)
        to: b.wake.record
      - return: batch, nil
  - of: (*sqlBroker).leaseDue
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).leaseDue
        kind: self
      - id: ex.ExecContext
        kind: value
      - id: b.expireDue
        kind: internal
      - id: b.leaseRound
        kind: internal
      - id: b.minDue
        kind: internal
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: nil, 0, b.failed("lock the queue", lockErr)
                init:
                  bind: _, lockErr
                  eval: ex.ExecContext(ctx, b.stmts.lock)
                  to: ex.ExecContext
                when: lockErr != nil
          when: b.stmts.lock != ""
      - opt:
          do:
            - return: nil, 0, expireErr
          init:
            bind: expireErr
            eval: b.expireDue(ctx, ex, at.now)
            to: b.expireDue
          when: expireErr != nil
      - loop:
          cond: len(batch) < max
          do:
            - bind: want
              eval: max - len(batch)
            - bind: round, roundErr
              eval: b.leaseRound(ctx, ex, at, want)
              to: b.leaseRound
            - opt:
                do:
                  - return: nil, 0, roundErr
                when: roundErr != nil
            - set: batch
              value: append(batch, round.batch...)
            - opt:
                do:
                  - break: true
                when: round.read < want
      - opt:
          do:
            - return: batch, at.now, nil
          when: len(batch) == max
      - bind: due, err
        eval: b.minDue(ctx, ex, b.stmts.next, "read the next due instant", at.now)
        to: b.minDue
      - return: batch, earliest(due.Int64, at.deadline), err
  - of: (*sqlBroker).leaseRound
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).leaseRound
        kind: self
      - id: b.pickDue
        kind: internal
      - id: b.buryLapsed
        kind: internal
      - id: b.leaseRows
        kind: internal
    steps:
      - bind: picked, err
        eval: b.pickDue(ctx, ex, at.now, want)
        to: b.pickDue
      - opt:
          do:
            - return: sqlLeaseRound{}, err
          when: err != nil
      - leaf: a var of several names, or of no type
        stmt: var buried, leasing []sqlPicked
      - loop:
          do:
            - opt:
                do:
                  - set: buried
                    value: append(buried, row)
                  - continue: true
                when: row.leased && row.deliveries >= int64(b.policy.MaxDeliveries)
            - set: leasing
              value: append(leasing, row)
          key: _
          range: picked
          value: row
      - opt:
          do:
            - return: sqlLeaseRound{}, buryErr
          init:
            bind: buryErr
            eval: b.buryLapsed(ctx, ex, at.now, buried)
            to: b.buryLapsed
          when: buryErr != nil
      - bind: batch, leaseErr
        eval: b.leaseRows(ctx, ex, at.deadline, leasing)
        to: b.leaseRows
      - return: "sqlLeaseRound{batch: batch, read: len(picked)}, leaseErr"
  - of: (*sqlBroker).pickDue
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).pickDue
        kind: self
      - id: ex.QueryContext
        kind: value
      - id: rows.Scan
        kind: value
    steps:
      - bind: rows, err
        eval: ex.QueryContext(ctx, b.stmts.pick, now, int64(want))
        to: ex.QueryContext
      - opt:
          do:
            - return: nil, b.failed("read the due messages", err)
          when: err != nil
      - defer: func() { err = b.finishRows(rows, "read the due messages", err) }()
      - loop:
          cond: rows.Next()
          do:
            - var:
                name: row
                type: sqlPicked
            - var:
                name: lease
                type: "[]byte"
            - opt:
                do:
                  - return: nil, b.failed("read the due messages", scanErr)
                init:
                  bind: scanErr
                  eval: rows.Scan(&row.id, &row.enqueuedAt, &row.deliveries, &lease, &row.payload)
                  to: rows.Scan
                when: scanErr != nil
            - set: row.leased
              value: lease != nil
            - set: picked
              value: append(picked, row)
      - return: picked, nil
  - of: (*sqlBroker).buryLapsed
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).buryLapsed
        kind: self
      - id: ex.ExecContext
        kind: value
      - id: b.failed
        kind: internal
    steps:
      - loop:
          do:
            - bind: args
              eval: "append(b.stmts.causeArgs(now, causeValue{reason: reasonLeaseExpired}), idArgs(chunk)...)"
            - opt:
                do:
                  - return: b.failed("dead-letter lapsed leases", err)
                    to: b.failed
                init:
                  bind: _, err
                  eval: ex.ExecContext(ctx, b.stmts.buryRows(len(chunk)), args...)
                  to: ex.ExecContext
                when: err != nil
          key: chunk
          range: slices.Chunk(rows, sqlRowsPerStatement)
      - return: nil
  - of: (*sqlBroker).leaseRows
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).leaseRows
        kind: self
      - id: randomHex
        kind: internal
      - id: ex.ExecContext
        kind: value
    steps:
      - opt:
          do:
            - return: nil, nil
          when: len(rows) == 0
      - bind: lease, entropyErr
        eval: randomHex(sqlLeaseEntropyBytes)
        to: randomHex
      - opt:
          do:
            - return: nil, backendFailed("rand", "", entropyErr)
          when: entropyErr != nil
      - loop:
          do:
            - bind: args
              eval: append([]any{deadline, []byte(lease)}, idArgs(chunk)...)
            - opt:
                do:
                  - return: nil, b.failed("lease the due messages", execErr)
                init:
                  bind: _, execErr
                  eval: ex.ExecContext(ctx, b.stmts.leaseRows(len(chunk)), args...)
                  to: ex.ExecContext
                when: execErr != nil
          key: chunk
          range: slices.Chunk(rows, sqlRowsPerStatement)
      - set: batch
        value: make([]corequeue.DeliveryValue, 0, len(rows))
      - loop:
          do:
            - bind: deliveries
              eval: int(row.deliveries) + 1
            - set: batch
              value: |-
                append(batch, corequeue.DeliveryValue{
                			Message: corequeue.MessageValue{ID: row.id, Payload: row.payload, EnqueuedAt: time.Unix(0, row.enqueuedAt)},
                			Lease: corequeue.LeaseValue{
                				Receipt: sqlReceiptValue(row.id, deliveries, lease), ExpiresAt: time.Unix(0, deadline),
                			},
                			Deliveries: deliveries,
                		})
          key: _
          range: rows
          value: row
      - return: batch, nil
  - of: (*sqlBroker).minDue
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).minDue
        kind: self
      - id: ex.QueryRowContext(ctx, query, args...).Scan
        kind: value
    steps:
      - opt:
          do:
            - return: stdsql.NullInt64{}, b.failed(step, scanErr)
          init:
            bind: scanErr
            eval: ex.QueryRowContext(ctx, query, args...).Scan(&due)
            to: ex.QueryRowContext(ctx, query, args...).Scan
          when: scanErr != nil
      - return: due, nil
  - of: (*sqlBroker).finishRows
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).finishRows
        kind: self
      - id: errors
        kind: stdlib
      - id: b.failed
        kind: internal
    steps:
      - bind: iterErr, closeErr
        eval: rows.Err(), rows.Close()
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: b.failed(step, cause)
              to: b.failed
          init:
            bind: cause
            eval: errors.Join(iterErr, closeErr)
            to: errors
          when: cause != nil
      - return: nil
  - of: idArgs
    steps:
      - bind: args
        eval: make([]any, len(rows))
      - loop:
          do:
            - set: args[i]
              value: "[]byte(row.id)"
          key: i
          range: rows
          value: row
      - return: args
  - of: (*sqlBroker).receiveReturning
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).receiveReturning
        kind: self
      - id: b.expireDue
        kind: internal
      - id: b.leaseReturning
        kind: internal
      - id: b.wake.record
        kind: internal
      - id: ex.ExecContext
        kind: value
      - id: b.minDue
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, expireErr
          init:
            bind: expireErr
            eval: b.expireDue(ctx, ex, at.now)
            to: b.expireDue
          when: expireErr != nil
      - set: batch, err
        to: b.leaseReturning
        value: b.leaseReturning(ctx, ex, at, max)
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - opt:
          do:
            - eval: b.wake.record(at.now)
              to: b.wake.record
            - return: batch, nil
          when: len(batch) == max
      - bind: args
        eval: "append(b.stmts.causeArgs(at.now, causeValue{reason: reasonLeaseExpired}), at.now, int64(b.policy.MaxDeliveries))"
      - opt:
          do:
            - return: nil, b.failed("dead-letter lapsed leases", buryErr)
          init:
            bind: _, buryErr
            eval: ex.ExecContext(ctx, b.stmts.buryExhausted, args...)
            to: ex.ExecContext
          when: buryErr != nil
      - bind: due, nextErr
        eval: b.minDue(ctx, ex, b.stmts.next, "read the next due instant", at.now)
        to: b.minDue
      - opt:
          do:
            - return: nil, nextErr
          when: nextErr != nil
      - eval: b.wake.record(earliest(due.Int64, at.deadline))
        to: b.wake.record
      - return: batch, nil
  - of: (*sqlBroker).leaseReturning
    participants:
      - id: caller
        kind: actor
      - id: (*sqlBroker).leaseReturning
        kind: self
      - id: randomHex
        kind: internal
      - id: ex.QueryContext
        kind: value
      - id: rows.Scan
        kind: value
      - id: sortedByDue
        kind: internal
    steps:
      - bind: lease, entropyErr
        eval: randomHex(sqlLeaseEntropyBytes)
        to: randomHex
      - opt:
          do:
            - return: nil, backendFailed("rand", "", entropyErr)
          when: entropyErr != nil
      - bind: rows, err
        eval: |-
          ex.QueryContext(ctx, b.stmts.leaseReturning,
          		at.deadline, []byte(lease), at.now, int64(b.policy.MaxDeliveries), int64(max))
        to: ex.QueryContext
      - opt:
          do:
            - return: nil, b.failed("lease the due messages", err)
          when: err != nil
      - defer: func() { err = b.finishRows(rows, "lease the due messages", err) }()
      - var:
          name: wasDue
          type: "[]int64"
      - loop:
          cond: rows.Next()
          do:
            - var:
                name: id
                type: string
            - var:
                name: payload
                type: "[]byte"
            - leaf: a var of several names, or of no type
              stmt: var enqueuedAt, deliveries, due int64
            - opt:
                do:
                  - return: nil, b.failed("lease the due messages", scanErr)
                init:
                  bind: scanErr
                  eval: rows.Scan(&id, &enqueuedAt, &deliveries, &payload, &due)
                  to: rows.Scan
                when: scanErr != nil
            - set: wasDue
              value: append(wasDue, due)
            - set: batch
              value: |-
                append(batch, corequeue.DeliveryValue{
                			Message: corequeue.MessageValue{ID: id, Payload: payload, EnqueuedAt: time.Unix(0, enqueuedAt)},
                			Lease: corequeue.LeaseValue{
                				Receipt: sqlReceiptValue(id, int(deliveries), lease), ExpiresAt: time.Unix(0, at.deadline),
                			},
                			Deliveries: int(deliveries),
                		})
      - return: sortedByDue(batch, wasDue), nil
        to: sortedByDue
  - of: sortedByDue
    participants:
      - id: caller
        kind: actor
      - id: sortedByDue
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: order
        eval: make([]int, len(batch))
      - loop:
          do:
            - set: order[i]
              value: i
          key: i
          range: order
      - eval: |-
          slices.SortFunc(order, func(x, y int) int {
          		//: visibility first, the identifier on a tie.
          		return cmp.Or(cmp.Compare(due[x], due[y]), strings.Compare(batch[x].Message.ID, batch[y].Message.ID))
          	})
        to: slices
      - bind: sorted
        eval: make([]corequeue.DeliveryValue, len(batch))
      - loop:
          do:
            - set: sorted[at]
              value: batch[from]
          key: at
          range: order
          value: from
      - return: sorted
  - of: renderTrailColumnStatements
    participants:
      - id: caller
        kind: actor
      - id: renderTrailColumnStatements
        kind: self
      - id: dialect.QuoteIdent
        kind: value
    steps:
      - bind: q
        eval: dialect.QuoteIdent(table)
        to: dialect.QuoteIdent
      - bind: column
        eval: sqlTrailColumn + " " + trailColumnType(dialect)
      - switch:
          cases:
            - case: coresql.DialectPostgres
              do:
                - return: |-
                    trailColumnStatements{
                    			add:  "ALTER TABLE IF EXISTS " + q + " ADD COLUMN IF NOT EXISTS " + column,
                    			drop: "ALTER TABLE IF EXISTS " + q + " DROP COLUMN IF EXISTS " + sqlTrailColumn,
                    		}
            - case: coresql.DialectMySQL
              do:
                - return: |-
                    trailColumnStatements{
                    			probe: trailProbe("column_name",
                    				"information_schema.columns WHERE table_schema = DATABASE() AND table_name = "+dialect.Placeholder(1)),
                    			add:  "ALTER TABLE " + q + " ADD COLUMN " + column,
                    			drop: "ALTER TABLE " + q + " DROP COLUMN " + sqlTrailColumn,
                    		}
            - default: true
              do:
                - return: |-
                    trailColumnStatements{
                    			probe: trailProbe("name", "pragma_table_info("+dialect.Placeholder(1)+")"),
                    			add:   "ALTER TABLE " + q + " ADD COLUMN " + column,
                    			drop:  "ALTER TABLE " + q + " DROP COLUMN " + sqlTrailColumn,
                    		}
          "on": dialect
  - of: trailProbe
    steps:
      - return: "\"SELECT COUNT(*), COALESCE(SUM(CASE WHEN \" + nameColumn + \" = '\" + sqlTrailColumn + \"' THEN 1 ELSE 0 END), 0) FROM \" + catalogue"
  - of: trailColumnStatements.step
    participants:
      - id: caller
        kind: actor
      - id: trailColumnStatements.step
        kind: self
      - id: svcsql
        kind: package
      - id: ex.QueryRowContext(ctx, s.probe, table).Scan
        kind: value
      - id: ex.ExecContext
        kind: value
    steps:
      - bind: statement
        eval: s.add
      - opt:
          do:
            - set: statement
              value: s.drop
          when: drop
      - opt:
          do:
            - return: svcsql.Statements(statement)
              to: svcsql
          when: s.probe == ""
      - return:
          closure:
            params: ctx context.Context, ex coresql.Executor
            results: error
            steps:
              - leaf: a var of several names, or of no type
                stmt: var columns, trails int64
              - opt:
                  do:
                    - return: err
                  init:
                    bind: err
                    eval: ex.QueryRowContext(ctx, s.probe, table).Scan(&columns, &trails)
                    to: ex.QueryRowContext(ctx, s.probe, table).Scan
                  when: err != nil
              - opt:
                  do:
                    - return: nil
                  when: columns == 0 || (trails > 0) != drop
              - bind: _, err
                eval: ex.ExecContext(ctx, statement)
                to: ex.ExecContext
              - return: err
  - of: trailColumnType
    steps:
      - switch:
          cases:
            - case: coresql.DialectMySQL
              do:
                - return: "\"VARBINARY(\" + strconv.Itoa(sqlTrailColumnLen) + \") NULL\""
            - case: coresql.DialectPostgres
              do:
                - return: "\"bytea\""
            - default: true
              do:
                - return: "\"BLOB\""
          "on": dialect
  - of: newWakeSignal
    steps:
      - return: "&wakeSignal{ch: make(chan struct{})}"
  - of: (*wakeSignal).current
    steps:
      - lock:
          mutex: w.mu
      - return: w.ch, w.due
  - of: (*wakeSignal).fire
    steps:
      - lock:
          mutex: w.mu
      - bind: fired
        eval: w.ch
      - set: w.ch
        value: make(chan struct{})
      - eval: close(fired)
  - of: (*wakeSignal).record
    steps:
      - lock:
          mutex: w.mu
      - set: w.due
        value: due
  - of: wakeValue
    steps:
      - opt:
          do:
            - return: "corequeue.WakeValue{Signal: signal}"
          when: due.IsZero()
      - return: "corequeue.WakeValue{Signal: signal, In: due.Sub(now), Scheduled: true}"
  - of: newWakeTable
    steps:
      - return: "&wakeTable[K]{byQueue: make(map[K]weak.Pointer[wakeSignal])}"
  - of: forDir
    participants:
      - id: caller
        kind: actor
      - id: forDir
        kind: self
      - id: fileWakes.forKey
        kind: internal
    steps:
      - return: fileWakes.forKey(canonicalDir(dir))
        to: fileWakes.forKey
  - of: (*wakeTable).forKey
    participants:
      - id: caller
        kind: actor
      - id: (*wakeTable).forKey
        kind: self
      - id: held.Value
        kind: value
      - id: newWakeSignal
        kind: internal
      - id: weak
        kind: stdlib
      - id: runtime
        kind: stdlib
    steps:
      - lock:
          mutex: d.mu
      - opt:
          do:
            - opt:
                do:
                  - return: signal
                init:
                  bind: signal
                  eval: held.Value()
                  to: held.Value
                when: signal != nil
          init:
            bind: held, found
            eval: d.byQueue[key]
          when: found
      - bind: signal
        eval: newWakeSignal()
        to: newWakeSignal
      - set: d.byQueue[key]
        to: weak
        value: weak.Make(signal)
      - eval: runtime.AddCleanup(signal, d.drop, key)
        to: runtime
      - return: signal
  - of: (*wakeTable).drop
    steps:
      - lock:
          mutex: d.mu
      - opt:
          do:
            - eval: delete(d.byQueue, key)
          init:
            bind: held, found
            eval: d.byQueue[key]
          when: found && held.Value() == nil
  - of: canonicalDir
    participants:
      - id: caller
        kind: actor
      - id: canonicalDir
        kind: self
      - id: filepath
        kind: stdlib
    steps:
      - bind: resolved, absErr
        eval: filepath.Abs(dir)
        to: filepath
      - opt:
          do:
            - return: filepath.Clean(dir)
              to: filepath
          when: absErr != nil
      - opt:
          do:
            - return: linked
          init:
            bind: linked, evalErr
            eval: filepath.EvalSymlinks(resolved)
            to: filepath
          when: evalErr == nil
      - return: resolved
