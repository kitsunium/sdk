    participants:
      - id: caller
        kind: actor
      - id: timerC
        kind: self
      - id: timer.C
        kind: value
    steps:
      - opt:
          do:
            - return: nil
          when: timer == nil
      - return: timer.C()
        to: timer.C
  - of: tickerC
    participants:
      - id: caller
