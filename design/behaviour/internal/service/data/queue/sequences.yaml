      - id: caller
        kind: actor
      - id: (*consumer).renewWatched
        kind: self
      - id: c.renew
        kind: internal
      - id: w.halt
        kind: internal
      - id: w.deadline.Reset
        kind: value
    steps:
      - bind: lease, renewErr
        eval: c.renew(ctx, w.lease.Receipt, w.plan.granted)
        to: c.renew
      - opt:
          do:
            - return: w.halt(renewErr)
              to: w.halt
          when: renewErr != nil
      - set: w.lease
        value: lease
      - eval: w.deadline.Reset(lease.ExpiresAt.Sub(c.cfg.Clock.Now()) - w.plan.margin)
        to: w.deadline.Reset
      - return: "true"
  - of: (*watched).halt
    steps:
      - eval: w.cancel(cause)
      - return: "false"
  - of: (*watched).finish
    participants:
      - id: caller
        kind: actor
      - id: (*watched).finish
        kind: self
      - id: w.watcher.Wait
        kind: value
      - id: stopTimer
        kind: internal
      - id: w.renewal.Stop
        kind: value
    steps:
      - opt:
          do:
            - return: w.lease, failure != nil && ctx.Err() != nil
          when: w.cancel == nil
      - eval: w.markHandled()
      - eval: w.watcher.Wait()
        to: w.watcher.Wait
      - eval: stopTimer(w.deadline)
        to: stopTimer
      - eval: stopTimer(w.drain)
        to: stopTimer
      - opt:
          do:
            - eval: w.renewal.Stop()
              to: w.renewal.Stop
          when: w.renewal != nil
      - eval: w.cancel(context.Canceled)
      - return: w.lease, w.stopped && failure != nil
