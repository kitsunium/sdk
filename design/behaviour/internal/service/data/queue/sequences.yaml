  - of: (*consumer).renew
    participants:
      - id: caller
        kind: actor
      - id: (*consumer).renew
        kind: self
      - id: c.bounded
        kind: internal
    steps:
      - set: err
        to: c.bounded
        value: |-
          c.bounded(ctx, "extend", true, func(settleCtx context.Context) error {
          		var extendErr error
          		lease, extendErr = c.extender.Extend(settleCtx, receipt, by)
          		//: renewed, LeaseExpired, or the medium refusing.
          		return extendErr
          	})
      - return: lease, err
  - of: (*consumer).bounded
    participants:
      - id: caller
        kind: actor
      - id: (*consumer).bounded
        kind: self
      - id: context
        kind: stdlib
      - id: c.cfg.Clock.NewTimer
        kind: value
      - id: c.bound
        kind: internal
    steps:
      - bind: settleCtx, cancel
        eval: context.WithCancelCause(context.WithoutCancel(ctx))
        to: context
      - var:
          name: armed
          type: clock.Timer
      - opt:
          do:
            - set: armed
              to: c.cfg.Clock.NewTimer
              value: c.cfg.Clock.NewTimer(c.cfg.SettleTimeout)
          when: always || ctx.Err() != nil
      - bind: done, exited
        eval: make(chan struct{}), make(chan struct{})
      - go: |-
          c.bound(ctx, armed, done, exited, func() {
          		//: the medium did not answer within the bound.
          		cancel(kerrs.Wrap(corequeue.QueueBackendFailed, kerrs.WrapParams{},
          			kerrs.String("op", op), kerrs.String("settle_timeout", c.cfg.SettleTimeout.String())))
          	})
        to: c.bound
      - bind: err
        eval: call(settleCtx)
      - eval: close(done)
      - eval: <-exited
      - bind: cut, cause
        eval: settleCtx.Err() != nil, context.Cause(settleCtx)
      - eval: cancel(context.Canceled)
      - opt:
          do:
            - return: err
          when: err == nil || !cut
      - return: cause
  - of: (*consumer).bound
    participants:
      - id: caller
        kind: actor
      - id: (*consumer).bound
        kind: self
      - id: c.cfg.Clock.NewTimer
        kind: value
      - id: armed.Stop
        kind: value
    steps:
      - defer: close(exited)
      - opt:
          do:
            - select:
                cases:
                  - comm: <-done
                    do:
                      - return: ""
                  - comm: <-ctx.Done()
                    do:
                      - set: armed
                        to: c.cfg.Clock.NewTimer
                        value: c.cfg.Clock.NewTimer(c.cfg.SettleTimeout)
          when: armed == nil
      - defer: armed.Stop()
        to: armed.Stop
      - select:
          cases:
            - comm: <-armed.C()
              do:
                - eval: expire()
            - comm: <-done
  - of: rootWritableByAnyone
    participants:
      - id: caller
        kind: actor
      - id: rootWritableByAnyone
        kind: self
      - id: info.Mode
        kind: value
    steps:
      - bind: mode
        eval: info.Mode()
        to: info.Mode
      - opt:
          do:
            - return: "\"\", \"\", false"
          when: mode&worldWritable == 0 || mode&os.ModeSticky != 0
      - return: "\"world-writable\", mode.String(), true"
