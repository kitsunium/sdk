    steps:
      - opt:
          do:
            - return: nil
          when: kerrs.HasCode(cause, corequeue.CodeLeaseExpired)
      - return: cause
  - of: ignoreCancelled
    steps:
      - opt:
          do:
            - return: nil
          when: ctx.Err() != nil
      - return: cause
