      - opt:
          do:
            - return: w
          when: "!plan.bounded && c.cfg.DrainTimeout <= 0"
      - set: w.ctx, w.cancel
        to: context
        value: context.WithCancelCause(context.WithoutCancel(ctx))
      - set: w.handled, w.markHandled
        to: context
        value: context.WithCancel(context.WithoutCancel(ctx))
