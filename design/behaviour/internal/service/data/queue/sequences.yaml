    steps:
      - return: "&ackedWindow{held: make(map[string]int, size), ring: make([]string, 0, size)}"
  - of: (*ackedWindow).holds
    steps:
      - opt:
          do:
            - return: "false"
          when: w == nil
      - lock:
          mutex: w.mu
      - bind: _, held
        eval: w.held[id]
      - return: held
  - of: (*ackedWindow).remember
    steps:
      - opt:
          do:
            - return: ""
          when: w == nil
      - lock:
          mutex: w.mu
      - opt:
          do:
            - return: ""
          init:
            bind: _, held
            eval: w.held[id]
          when: held
      - opt:
          do:
            - set: w.held[id]
              value: len(w.ring)
            - set: w.ring
              value: append(w.ring, id)
            - return: ""
          when: len(w.ring) < cap(w.ring)
      - eval: delete(w.held, w.ring[w.next])
      - set: w.ring[w.next], w.held[id]
        value: id, w.next
      - set: w.next
        value: (w.next + 1) % len(w.ring)
  - of: ConsumerConfig.validate
    participants:
      - id: caller
        kind: actor
      - id: ConsumerConfig.validate
        kind: self
      - id: kerrs
        kind: package
    steps:
