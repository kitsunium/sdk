              value: c.cfg.Clock.NewTicker(plan.renewEvery)
          when: plan.bounded && c.extender != nil
      - eval: |-
          w.watcher.Go(func() {
          		//: until the handler returns or its context is ended.
          		for c.oversee(ctx, w) {
          		}
          	})
        to: w.watcher.Go
      - return: w
