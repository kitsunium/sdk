  heap: github.com/kitsunium/sdk/internal/kernel/collections/heap
  hex: encoding/hex
  io: io
  iter: iter
  kbackoff: github.com/kitsunium/sdk/internal/kernel/backoff
  kerrs: github.com/kitsunium/sdk/internal/kernel/errs
  math: math
  os: os
  path: path
  rand: math/rand/v2
  reflect: reflect
  regexp: regexp
  runtime: runtime
  sha256: crypto/sha256
  slices: slices
  stdsql: database/sql
  strconv: strconv
  strings: strings
  svcsql: github.com/kitsunium/sdk/internal/service/data/sql
  svcvfs: github.com/kitsunium/sdk/internal/service/data/vfs
  sync: sync
  time: time
  utf8: unicode/utf8
  weak: weak
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/data/queue
  name: queue
  purpose: "Package queue — the consumer engine: the pull loop that runs a Handler on a CONSUMER'S goroutine, which is the third axis of ADR 0053's frontier."
types:
  - doc: |-
      consumer is what every worker of one Consume call shares: the broker, the
      resolved configuration and the broker's siblings, asked once. Nothing in it
      changes after newConsumer, so the workers read it without a lock.
    fields:
      - doc: |-
          broker is the queue; the four siblings below are its, nil each where
          it lacks one — and extender nil too unless AutoExtend asked for it.
        name: broker
        type: corequeue.Broker
      - name: waker
        type: corequeue.Waker
      - name: releaser
        type: corequeue.Releaser
      - name: rejecter
        type: corequeue.Rejecter
      - name: delayer
        type: corequeue.DelayedNacker
      - name: extender
        type: corequeue.LeaseExtender
      - doc: |-
          acked remembers the messages handled in this process
          (ConsumerConfig.AckedWindow); nil when the window is off.
        name: acked
        type: "*ackedWindow"
      - doc: "gate lets one idle worker at a time poll for the others (issue #1049)."
        name: gate
        type: "*idleGate"
      - name: cfg
        type: ConsumerConfig
    kind: struct
    methods:
      - doc: |-
          pump is one worker: lease, process, acknowledge, repeat. It returns only
          when its context ends or the storage refuses.
        name: pump
        params: ctx context.Context
        recv: c *consumer
        results: error
      - doc: |-
          turn is one round of a worker: a lease, then the batch processed and
          acknowledged, or the wait an empty queue asks for. It reports stop when the
          worker returns, with the error pump returns — nil when the consumer was
          stopped.
        name: turn
        params: ctx context.Context, probing *bool
        recv: c *consumer
        results: stop bool, err error
      - doc: |-
          idleTurn waits for a worker's next look at an empty queue (issue #1049).
          One idle worker of the Consume — the first to find the queue empty, then
          whichever takes the slot it hands on — waits as an idle worker always did,
          on the broker's wake and its poll, and looks for all of them; every other
          idle worker waits only until that one finds work, or the consumer stops.
          So Parallelism idle workers poll once per interval, not Parallelism times,
          and a publication still reaches them at once: the polling worker is woken,
          finds it, and wakes the rest. It reports false when ctx ended.
        name: idleTurn
        params: ctx context.Context, signal <-chan struct{}, probing *bool
        recv: c *consumer
        results: bool
      - doc: |-
          settleBatch runs the handler over each delivery and reports each outcome to
          the broker, stopping only if the STORAGE refuses.

          A stop that lands in the middle of the batch hands every message not yet
          started back at once, uncounted (kitsunium/sdk#474): before, each was handed
          to the handler under a dead context and nacked on it, and every durable
          broker refused that nack, so the message stayed leased for a whole
          visibility timeout and came back one delivery closer to the dead-letter
          store — a deployment burnt a delivery of work nobody had tried. A message
          whose lease has run down to the margin before its turn comes is handed back
          the same way, or renewed first under AutoExtend.
        name: settleBatch
        params: ctx context.Context, batch []corequeue.DeliveryValue, receivedAt time.Time
        recv: c *consumer
        results: error
      - doc: |-
          prepare decides, just before a message's turn, whether its lease still
          leaves the handler room: renewed first under AutoExtend once a third of it
          is spent, handed back when it is down to the margin, as it is otherwise. It
          reports whether to run the handler, and the delivery to run it on.
        name: prepare
        params: |2

          	ctx context.Context, delivery corequeue.DeliveryValue, plan leasePlan,
        recv: c *consumer
        results: ready bool, prepared corequeue.DeliveryValue, err error
      - doc: process runs the handler on one delivery, watched, and reports its outcome.
        name: process
        params: ctx context.Context, delivery corequeue.DeliveryValue, plan leasePlan
        recv: c *consumer
        results: error
      - doc: |-
          settle reports a handler's outcome to the broker.

          A LeaseExpired from the broker is swallowed on purpose and it is the only
          thing that is: this consumer took too long, the message is already queued
          again or dead-lettered, and there is nothing it can do about that except
          keep working. Anything else is the storage refusing, which the worker must
          not poll its way past.

          A failure the handler marked with core/data/queue.DoNotRetry is rejected
          rather than nacked when the broker is a core/data/queue.Rejecter:
          dead-lettered at once, with the handler's cause, instead of retried until
          MaxDeliveries. A broker without the sibling is nacked as before — the
          shortcut is lost, never the message — and a panic is never the mark,
          because guard carries the recovered value as a field of HANDLER_PANICKED and
          never as its origin.

          A failure once the consumer is stopping — its drain over, or the lease's
          margin reached during it — is not the message's: it is handed back
          uncounted, unless it is a panic, which is.

          A failure the handler marked with core/data/queue.RetryAfter is nacked
          with the delay it names when the broker is a core/data/queue.DelayedNacker
          (ADR 0183), its delivery counted, and nacked as any other failure — after
          the policy's delay — when it is not. DoNotRetry and a stop are read first,
          so a failure marked both ways is rejected, and one a stop cut short is
          handed back.

          Every outcome is sent on ctx WITHOUT its cancellation, bounded by
          SettleTimeout: the work is done, or was stopped, and a stop that lands
          between the handler's return and the report — the consumer's context
          cancelled by Close or a lifecycle's Stop — must not abandon it. Abandoned,
          the message stayed leased and came back after the visibility timeout, a
          duplicate a graceful stop caused, on every broker whose verbs honour their
          context (kitsunium/sdk#472, #474).
        name: settle
        params: ctx context.Context, receipt corequeue.ReceiptValue, failure error, stopped bool
        recv: c *consumer
        results: error
      - doc: |-
          handBackAll hands back, in order, every delivery of a batch the handler
          never started, stopping at the first the medium refuses.
        name: handBackAll
        params: ctx context.Context, rest []corequeue.DeliveryValue
        recv: c *consumer
        results: error
      - doc: |-
          handBack returns a message this consumer did not finish: released — at
          once, its delivery not counted — by a broker that can, nacked by one that
          cannot, which retries it after its delay with the delivery counted, so the
          courtesy is lost and never the message. The nack carries no cause: nothing
          failed, and a message that runs out of attempts this way is recorded as an
          unreported failure.
        name: handBack
        params: ctx context.Context, receipt corequeue.ReceiptValue
        recv: c *consumer
        results: error
      - doc: nack hands a message back as a failure, bounded as every outcome is.
        name: nack
        params: ctx context.Context, receipt corequeue.ReceiptValue, cause error
        recv: c *consumer
        results: error
      - doc: planFor measures delivery's lease from the instant its batch arrived.
        name: planFor
        params: delivery corequeue.DeliveryValue, receivedAt time.Time
        recv: c *consumer
        results: leasePlan
      - doc: |-
          watch prepares the handler's context for delivery. When there is nothing
          to watch — no lease to bound, no drain, so no renewal either — it is the
          consumer's own, as it always was; otherwise one goroutine watches the stop,
          the drain, the lease's margin and AutoExtend's cadence.

          Goroutine lifecycle: at most one, started here and joined by finish, which
          process calls on every path once the handler has returned. Its timers are
          armed HERE, before the handler starts, so a test driving a ManualClock
          finds them armed once the handler runs; finish stops every one.
        name: watch
        params: ctx context.Context, delivery corequeue.DeliveryValue, plan leasePlan
        recv: c *consumer
        results: "*watched"
      - doc: |-
          oversee is one turn of the watcher: it ends the handler's context on the
          consumer's stop — at once, or once DrainTimeout has passed — and a margin
          before the lease ends, and renews the lease under AutoExtend, moving that
          margin with it. It reports whether to keep watching.
        name: oversee
        params: ctx context.Context, w *watched
        recv: c *consumer
        results: bool
      - doc: |-
          renewWatched renews the lease a watched handler runs under and moves its
          margin with it, or cancels the handler with the refusal: its work is
          becoming a duplicate, and it hears so through its context.
        name: renewWatched
        params: ctx context.Context, w *watched
        recv: c *consumer
        results: bool
      - doc: renew extends the lease receipt names by by, bounded as every outcome is.
        name: renew
        params: |2

          	ctx context.Context, receipt corequeue.ReceiptValue, by time.Duration,
        recv: c *consumer
        results: lease corequeue.LeaseValue, err error
      - doc: |-
          bounded runs call on ctx WITHOUT its cancellation, bounded by SettleTimeout
          on the consumer's clock from the instant the consumer stops — at once when
          it already has, or when always is set, as a renewal's is. A call the bound
          cut short is QUEUE_BACKEND_FAILED naming op — the medium did not answer in
          time — and any other answer is call's own.

          While the consumer runs, an outcome is not timed: nothing waits on it but
          the worker, which the medium's own failure reaches, and an idle worker's
          clock then holds no wait but its poll — what a test driving a ManualClock
          counts on with BlockUntil.

          Goroutine lifecycle: one per call waits for the stop and then the bound's
          timer. It ends when call returns (done closes) or when the timer fires and
          cancels call's context, and bounded joins it before returning, so none
          outlives the call.
        name: bounded
        params: ctx context.Context, op string, always bool, call func(context.Context) error
        recv: c *consumer
        results: error
      - doc: |-
          bound is bounded's goroutine: it arms the bound when the consumer stops,
          unless armed already is, and calls expire when the bound elapses before
          done closes. It stops the timer it waited on, whichever way it returns.
        name: bound
        params: ctx context.Context, armed clock.Timer, done <-chan struct{}, exited chan<- struct{}, expire func()
        recv: c *consumer
    name: consumer
  - doc: |-
      ackedWindow is the bounded memory of the messages one Consume handled in
      this process (ConsumerConfig.AckedWindow): the last n identifiers, oldest
      forgotten first. It is the mail spool's DeliveredMemory lifted into the
      engine, for every broker (issue #1046).

      Every worker of the Consume shares it, so it takes a mutex: a ring alone is
      one producer and one consumer, and here every worker is both. A nil window
      remembers nothing and holds nothing, so a Consume without one pays one nil
      check per message.
    fields:
      - doc: held maps each remembered identifier to the slot of ring it sits in.
        name: held
        type: map[string]int
      - doc: |-
          ring holds the identifiers in the order they were remembered; next is
          the slot the next one takes — the oldest, once the ring is full.
        name: ring
        type: "[]string"
      - name: next
        type: int
      - name: mu
        type: sync.Mutex
    kind: struct
    methods:
      - doc: holds reports whether id is among the identifiers the window remembers.
        name: holds
        params: id string
        recv: w *ackedWindow
        results: bool
      - doc: |-
          remember adds id to the window, forgetting the oldest identifier when the
          window is full. An identifier already held is not added twice.
        name: remember
        params: id string
        recv: w *ackedWindow
    name: ackedWindow
  - fields:
      - doc: Handler processes one delivery. It must be non-nil.
        name: Handler
        type: corequeue.Handler
      - doc: |-
          Clock drives the idle wait, the handler's lease bound, the drain, the
          bound on each outcome and the lease renewals. Nil means clock.System.

          Nothing in this package calls time.Sleep; an idle worker waits through
          Waiter.After and a cancelled context wakes it immediately.

          A lease's end is the broker's instant and is read on this clock, so it
          must be the broker's: a test drives both with one ManualClock. A lease
          that already looks ended on this clock the moment it is received —
          two clocks that disagree — is not bounded at all, as before the bound
          existed, rather than never run.
        name: Clock
        type: clock.Timed
      - doc: |-
          PollInterval is how long a worker waits after finding the queue empty.
          Zero means [DefaultPollInterval]; negative is read as zero.

          When the broker is a [corequeue.Waker] — every broker in this package
          is — it is an upper bound and not a cadence: a Publish or a Nack in
          this process wakes the worker at once, and a retry delay ending or a
          lease lapsing wakes it at that instant. What is left for the poll to
          find is a publication another process made into a durable queue, so set
          it to how late such a message may be noticed — seconds, not
          milliseconds, is the usual answer — and an idle consumer then costs
          nothing between polls.
        name: PollInterval
        type: time.Duration
      - doc: |-
          Parallelism is how many independent workers run. Each one polls, leases
          and processes on its OWN goroutine, which is what makes this the
          consumer's goroutine rather than the publisher's.

          Non-positive is clamped to 1: one worker is what a caller who did not
          think about concurrency wants, it is never wrong, and there is nothing
          here for the SDK to invent.

          Above 1 there is NO ordering left, in any sense.
        name: Parallelism
        type: int
      - doc: |-
          BatchSize is how many messages one worker leases per poll. Non-positive
          is clamped to 1.

          Above 1 a worker processes its batch SEQUENTIALLY, so the extra
          messages are held under a lease they are not yet being worked on: a
          batch of 50 with a 30-second visibility timeout gives the last message
          30 seconds minus the other 49's processing time. Batch for throughput
          against a durable broker, where one poll is a directory read; do not
          batch to get parallelism, which is what Parallelism is.

          A message whose lease has run down to the margin [Consume] keeps
          before its turn comes is not started: it is handed back uncounted
          and leased again by a later poll — or, with AutoExtend, renewed
          before it starts.
        name: BatchSize
        type: int
      - doc: |-
          SettleTimeout bounds each outcome a worker reports once ctx has
          ended — an acknowledgement, a nack, a rejection or a release — and
          each lease renewal AutoExtend sends. Zero means
          [DefaultSettleTimeout]; negative is read as zero.

          Every outcome is sent on the consumer's context WITHOUT its
          cancellation, so a stop landing between a handler's return and its
          acknowledgement does not abandon it (kitsunium/sdk#472) and a batch a
          stop interrupts is still handed back. That is what needs a bound: a
          medium that stopped answering would otherwise hold the stop forever.
          It runs on Clock, from the instant ctx ends — while the consumer
          runs an outcome is not timed, and nothing but the worker waits on
          it. An outcome the bound cut short is QueueBackendFailed, which a
          stopping consumer reads as its stop, not as a failure.

          It also caps the margin a handler is stopped by before its lease
          ends: a tenth of the lease, at most this.
        name: SettleTimeout
        type: time.Duration
      - doc: |-
          DrainTimeout is how long the message a worker is handling when ctx
          ends may still run before its handler's context is cancelled — River's
          SoftStopTimeout. Zero cancels it at once, which is what a stop always
          did; negative is read as zero.

          A handler that finishes inside it is acknowledged; one the drain cut
          short is handed back uncounted, through the broker's
          [corequeue.Releaser]. No new message is leased once ctx has ended,
          and the lease bound still applies: a drain never keeps a handler past
          the margin before its lease ends. Measured on Clock. A caller's stop
          budget — a lifecycle component's — must cover it plus SettleTimeout.
        name: DrainTimeout
        type: time.Duration
      - doc: |-
          AckedWindow is how many message identifiers the engine remembers
          having handled: the last AckedWindow messages whose handler returned
          nil or [corequeue.Acknowledged] in this process. A delivery of one of
          them — its lease lapsed before the acknowledgement landed, and the
          broker delivered it again — is acknowledged without running the
          handler a second time.

          It narrows the duplicates at-least-once delivery leaves, as the mail
          spool's memory of what it delivered does, for every broker; it does
          not remove them. The window is this process's and is lost when it
          stops: a redelivery to another consumer, or after a restart, still
          runs the handler, which is still idempotent. Zero, or negative,
          remembers nothing — every delivery runs the handler, what Consume
          always did.
        name: AckedWindow
        type: int
      - doc: |-
          AutoExtend renews the lease of the message a handler is running, a
          third of the lease after it was granted or last renewed, for as long
          as the handler runs — the heartbeat of SQS, JetStream's in-progress
          acknowledgement, Temporal's activity heartbeat. A message of a batch
          whose lease is a third spent when its turn comes is renewed before
          its handler starts. Each renewal is as long as the lease the broker
          first granted, and is bounded by SettleTimeout.

          It needs the broker's [corequeue.LeaseExtender]; without it, or when
          false, the lease is never renewed and the handler is stopped a margin
          before it ends. A renewal the broker refuses — the lease lapsed, the
          medium failed — cancels the handler's context with that refusal as
          its cause: its work is now a duplicate in the making.

          A renewal replaces the receipt, and the engine acknowledges with the
          newest one. So a handler that extends its own lease — parking its
          message, as the mail spool does — must leave AutoExtend false: the
          receipt it holds is void after the first renewal.
        name: AutoExtend
        type: bool
      - doc: |-
          HandlerIsIdempotent asserts, IN CODE, that Handler is safe to run more
          than once for the same message.

          It must be true. Its zero value is false and is REFUSED
          ([corequeue.ConsumerMisconfigured]), and that refusal is the domain's
          one piece of deliberate ceremony.

          The reason is that this queue delivers AT LEAST ONCE and cannot do
          otherwise. A consumer that dies between finishing the work and
          acknowledging it has done the work and not said so, and the message
          comes back — that is not a bug to be fixed, it is the only honest
          behaviour available to a queue whose consumers can die. Exactly-once
          delivery does not exist over a transport; what exists is at-least-once
          plus an idempotent consumer, and the second half is the caller's.

          The SDK cannot check it, so it makes the caller assert it where a
          reviewer will see it. It is precisely
          resilience.HedgeConfig.Idempotent's instrument, for precisely its
          reason, and it has the same useful side effect:
          `grep -rn HandlerIsIdempotent` enumerates every place in a codebase
          where somebody promised this.
        name: HandlerIsIdempotent
        type: bool
    kind: struct
    methods:
      - doc: validate refuses a consumer wiring that could never run correctly.
        name: validate
        recv: c ConsumerConfig
        results: error
      - doc: |-
          normalized resolves the clamped fields, so every worker reads the same
          numbers rather than each remembering to apply the same default.
        name: normalized
        recv: c ConsumerConfig
        results: ConsumerConfig
    name: ConsumerConfig
  - doc: |-
      idleGate is the slot one idle worker of a Consume holds while it polls an
      empty queue for all of them (issue #1049): before it, every idle worker
      asked the broker on its own — eight workers, eight probes of the same empty
      table or eight scans of the same directories per poll interval.

      The holder releases it when it finds work — waking every worker waiting on
      it, each of which looks once — or when it stops. A worker holding work
      never holds the slot.
    fields:
      - doc: found is closed when the holder finds work, and replaced.
        name: found
        type: chan struct{}
      - name: mu
        type: sync.Mutex
      - doc: held reports that an idle worker polls.
        name: held
        type: bool
    kind: struct
    methods:
      - doc: |-
          enter takes the slot when it is free — took true — or returns the channel
          its holder closes when it finds work.
        name: enter
        recv: g *idleGate
        results: found <-chan struct{}, took bool
      - doc: |-
          release frees the slot, and when work was found wakes every worker waiting
          on it.
        name: release
        params: work bool
        recv: g *idleGate
    name: idleGate
  - doc: |-
      leasePlan is how one delivery's lease is judged: how long the broker
      granted it, the margin the handler is stopped by, and how often AutoExtend
      renews it.
    fields:
      - doc: |-
          granted is the lease's length as the broker granted it, read on the
          consumer's clock when the batch arrived; it is also what a renewal
          asks for.
        name: granted
        type: time.Duration
      - doc: margin is how long before the lease ends the handler is stopped.
        name: margin
        type: time.Duration
      - doc: renewEvery is AutoExtend's cadence.
        name: renewEvery
        type: time.Duration
      - doc: |-
          bounded is false when the lease already looked ended on the consumer's
          clock as it arrived — two clocks that disagree — and is then not judged.
        name: bounded
        type: bool
    kind: struct
    name: leasePlan
  - doc: |-
      watched is one handler run under watch: the context the handler gets, and
      what watches it.
    fields:
      - doc: ctx is the handler's context.
        name: ctx
        type: context.Context
      - doc: cancel ends ctx with a cause; nil when ctx is the consumer's own.
        name: cancel
        type: context.CancelCauseFunc
      - doc: |-
          handled ends when the handler returns; markHandled ends it, and may be
          called more than once.
        name: handled
        type: context.Context
      - name: markHandled
        type: context.CancelFunc
      - doc: |-
          deadline fires a margin before the lease ends; renewal ticks
          AutoExtend; drain fires DrainTimeout after the stop. Each is nil when
          unused, and every one is stopped by finish.
        name: deadline
        type: clock.Timer
      - name: renewal
        type: clock.Ticker
      - name: drain
        type: clock.Timer
      - doc: |-
          stop is the consumer's stop until it is seen, nil after; drained is
          the drain's channel once it is armed. The watcher's alone.
        name: stop
        type: <-chan struct{}
      - name: drained
        type: <-chan time.Time
      - doc: id names the message in a cause.
        name: id
        type: string
      - doc: |-
          lease is the lease the handler runs under, renewed by the watcher.
          The watcher owns it, and stopped, until watcher.Wait returns.
        name: lease
        type: corequeue.LeaseValue
      - doc: plan is how the lease is judged.
        name: plan
        type: leasePlan
      - doc: watcher is the watching goroutine.
        name: watcher
        type: sync.WaitGroup
      - doc: |-
          stopped reports that the consumer stopped while the handler ran: a
          failure that follows is the stop's, whether the drain, the stop itself
          or the lease's margin during the drain ended the handler.
        name: stopped
        type: bool
    kind: struct
    methods:
      - doc: halt cancels the handler's context with cause and ends the watch.
        name: halt
        params: cause error
        recv: w *watched
        results: bool
      - doc: |-
          finish ends the watch once the handler has returned with failure: it joins
          the watcher, stops every timer it armed and releases the context. It
          returns the lease the handler ended under — renewed or not — and whether
          the consumer's stop cut the handler short.
        name: finish
        params: ctx context.Context, failure error
        recv: w *watched
        results: lease corequeue.LeaseValue, stopped bool
    name: watched
  - doc: |-
      fileBroker is a queue whose entire state is a directory.

      # What survives, and what that costs

      Nothing about the queue's contents lives in this process. Which messages
      are waiting, which are leased, when each lease lapses and how many times
      each has been delivered are all encoded in directory ENTRIES (see
      file_name.go). A consumer that is SIGKILLed therefore loses nothing but its
      own lease, and any other consumer — in any process on the machine — reads
      the same facts from the same names.

      The price is that every call is syscalls rather than a map lookup, and that
      [fileBroker.Publish] pays two device flushes because the guarantee it makes
      is that a crash one instruction later does not lose the message. Both are
      measured in BENCH.md, and the ratio against [NewMemory] is the actionable
      number: it is large, it is supposed to be, and it is the cost of the column
      of ADR 0053's frontier table that this domain lives in.

      # No lock, deliberately

      Two consumers reaching for the same queued message both attempt the same
      rename; the kernel gives it to one and gives the other ENOENT, which the
      loser reads as "somebody else took it" and moves on. That is the whole
      exclusion mechanism. It needs no lock file, it cannot be held by a dead
      process, and — unlike flock(2), which ADR 0052 MEASURED giving zero
      exclusion between goroutines sharing one open file description — it works
      identically for two goroutines and for two processes.
    fields:
      - doc: |-
          root confines every name this broker touches to the queue directory.
          It is the only long-lived handle in the package, and it holds no
          knowledge of the queue's contents.
        name: root
        type: "*os.Root"
      - doc: |-
          publisher is internal/service/data/vfs, used for the two writes that must
          be atomic AND durable. See NewFile's comment for why it is not used
          for the state transitions.
        name: publisher
        type: corevfs.AtomicWriter
      - name: clk
        type: clock.Clock
      - doc: |-
          wake is shared by every broker over the same directory in this
          process — they are one queue — so a publication through any of them
          wakes the consumers of all. A publication from another process closes
          nothing; the consumer's poll finds it.
        name: wake
        type: "*wakeSignal"
      - doc: random draws the retry jitter (FileConfig.Random).
        name: random
        type: func() float64
      - name: policy
        type: corequeue.PolicyValue
      - doc: |-
          onceSwept is when this broker last swept the passed PublishOnce
          reservations, in Unix nanoseconds on its clock; zero before the first.
        name: onceSwept
        type: atomic.Int64
      - doc: |-
          deadSwept is when this broker last swept the dead letters past the
          policy's DeadLetterRetention, in Unix nanoseconds on its clock; zero
          before the first.
        name: deadSwept
        type: atomic.Int64
      - doc: |-
          listed is the last listing of each state directory, reused while the
          directory's mtime says nothing changed (file_listing.go, issue #811).
        name: listed
        type: listings
    kind: struct
    methods:
      - doc: |-
          Wake reports what an idle consumer should wait on: the signal the next
          Publish or Nack through any broker over this directory in this process
          closes, and how long until the earliest message the last Receive saw
          becomes receivable on its own.

          That instant is only as fresh as the last Receive in this process, because
          the directory is the state and reading it is what Receive does — Wake reads
          nothing. It can be stale in the harmless direction only: a message another
          process took, or a lease since extended, wakes a consumer early to an empty
          Receive, which reads the names again and records a fresh instant.
        name: Wake
        recv: b *fileBroker
        results: corequeue.WakeValue
      - doc: |-
          Close releases the broker's directory descriptors: its own root, and the
          one its atomic publisher holds.

          It satisfies io.Closer, reached by type assertion (ADR 0039) exactly as the
          session file store's Close is, so the frozen Broker port grows no method.
          os.Root closes itself once garbage collected, but a process that opens
          brokers in a loop should get its descriptors back when it says so. The
          messages stay on disk: Close ends this broker's use of them, and every call
          after it fails.
        name: Close
        recv: b *fileBroker
        results: error
      - doc: |-
          Publish writes payload into the queue and flushes it.

          When it returns nil the message is on the device: a power cut one
          instruction later does not lose it. That flush is most of what the call
          costs, and BENCH.md says how much.
        name: Publish
        params: |2

          	ctx context.Context, payload []byte,
        recv: b *fileBroker
        results: message corequeue.MessageValue, err error
      - doc: |-
          write publishes payload durably as a queued message at level, enqueued at
          now and visible at visibleAt, and returns its name. It wakes nobody: the
          caller does, once the message is one it keeps.
        name: write
        params: payload []byte, now, visibleAt time.Time, level corequeue.Priority
        recv: b *fileBroker
        results: nameValue, error
      - doc: |-
          PublishPriority publishes payload as Publish does, at level
          (core/data/queue.PriorityPublisher): a level other than the normal one
          opens the queued name with its digit, so the listing sorts the levels,
          highest first, before visibility, and a Receive empties a level of its
          visible messages before it looks at the next.
        name: PublishPriority
        params: |2

          	ctx context.Context, payload []byte, level corequeue.Priority,
        recv: b *fileBroker
        results: message corequeue.MessageValue, err error
      - doc: |-
          PublishAt publishes payload as Publish does, under a queued name whose
          visibility instant is at (core/data/queue.DelayedPublisher): the directory
          sorts by that instant, so a Receive meets it at its turn and not before.
        name: PublishAt
        params: |2

          	ctx context.Context, payload []byte, at time.Time,
        recv: b *fileBroker
        results: message corequeue.MessageValue, err error
      - doc: Ack unlinks the leased message. It is the only call that removes one.
        name: Ack
        params: ctx context.Context, receipt corequeue.ReceiptValue
        recv: b *fileBroker
        results: error
      - doc: |-
          resolve reads a receipt, checks the lease is still held, and returns the
          facts its name carries.

          The two refusals are distinguished by SHAPE rather than by provenance,
          which is the opposite of the memory broker's rule and for a stated reason:
          this queue is inter-process, so a receipt minted by another process is
          perfectly legitimate here and a broker-instance nonce would refuse the
          domain's whole point. What is refused is a string that is not a name this
          package writes — and since the grammar admits only digits and lower-case
          hex, no receipt can name a file outside the in-flight directory.
        name: resolve
        params: ctx context.Context, receipt string
        recv: b *fileBroker
        results: name nameValue, err error
      - doc: |-
          classifyMissing turns an absent in-flight file into the domain's verdict and
          anything else into a backend failure.
        name: classifyMissing
        params: op, name string, cause error
        recv: b *fileBroker
        results: error
      - doc: |-
          DeadLettersAfter returns up to max dead letters whose identifier sorts after
          after, in name order — which, the name opening with the zero-padded enqueue
          instant and the entropy the identifier is made of, is identifier order
          (core/data/queue.DeadLetterPager). It reads the directory once.
        name: DeadLettersAfter
        params: |2

          	ctx context.Context, after string, max int,
        recv: b *fileBroker
        results: dead []corequeue.DeadLetterValue, err error
      - doc: |-
          Purge unlinks every queued, then every in-flight message, and no dead
          letter (core/data/queue.Purger). Queued first: a message a consumer leases
          meanwhile moves into flight, which is read after, so it is not missed. A
          name gone by the time it is unlinked was taken by somebody else and is not
          counted.
        name: Purge
        params: ctx context.Context
        recv: b *fileBroker
        results: corequeue.PurgeValue, error
      - doc: |-
          unlinkLive removes every message dir holds by the state's grammar and
          counts the ones it removed.
        name: unlinkLive
        params: dir string
        recv: b *fileBroker
        results: removed int, err error
      - doc: |-
          ReplayDeadLetters replays up to max dead letters, oldest enqueued first,
          over one read of the dead-letter directory
          (core/data/queue.DeadLetterBulkManager). Each is replayed as
          ReplayDeadLetter replays one — the queued file published first, the
          records removed after —, so a failure or a cancellation part-way leaves
          every dead letter not counted still dead.
        name: ReplayDeadLetters
        params: ctx context.Context, max int
        recv: b *fileBroker
        results: replayed int, err error
      - doc: |-
          PurgeDeadLetters deletes up to max dead letters whose failure instant is
          before before, oldest enqueued first, over one read of the directory and
          one read of each record's header (core/data/queue.DeadLetterBulkManager).
        name: PurgeDeadLetters
        params: ctx context.Context, before time.Time, max int
        recv: b *fileBroker
        results: removed int, err error
      - doc: |-
          sweepRetention removes every dead letter past the policy's
          DeadLetterRetention, at most once a minute per broker on its clock.
        name: sweepRetention
        params: now int64
        recv: b *fileBroker
        results: error
      - doc: |-
          removeDeadFailedBy removes, in name order and up to max, every dead-letter
          record whose failure instant is at or before cutoff, and counts them. A
          record whose header cannot be read — a stray, a planted file, one still
          being published — is left alone: what it records is unknown.
        name: removeDeadFailedBy
        params: ctx context.Context, cutoff int64, max int
        recv: b *fileBroker
        results: removed int, err error
      - doc: |-
          removeIfFailedBy removes the dead-letter record base when its failure
          instant is known and at or before cutoff, and reports whether this call
          removed it. A record removed meanwhile by somebody else is not this call's
          to count.
        name: removeIfFailedBy
        params: base string, cutoff int64
        recv: b *fileBroker
        results: gone bool, err error
      - doc: |-
          deadFailedAt reads the failure instant of the dead-letter record base from
          its header alone, never its payload.
        name: deadFailedAt
        params: base string
        recv: b *fileBroker
        results: failed int64, known bool, err error
      - doc: |-
          PublishMany publishes every payload in order and wakes once
          (core/data/queue.BatchPublisher). Every name is minted first; then the
          batch goes to vfs's AtomicBatchWriter in one call — each message its own
          atomic publication, its file flushed before its rename, and ready/ flushed
          ONCE after the last rename (issue #827), where a Publish per message paid a
          directory flush each. A publisher without the sibling publishes message by
          message, as before.

          On a failure at the k-th payload, the messages returned beside the error —
          the first k−1 — are on the device, and the rest were never written. A
          directory flush that fails leaves the batch visible and its durability in
          doubt: nothing is returned as published then, as Publish returns nothing
          beside the same failure, and a retry may deliver a message twice — which
          at-least-once permits.
        name: PublishMany
        params: ctx context.Context, payloads [][]byte
        recv: b *fileBroker
        results: "[]corequeue.MessageValue, error"
      - doc: |-
          publishEach publishes the payloads one by one, each through Publish's own
          durable write, and stops at the first failure with what was published.
        name: publishEach
        params: payloads [][]byte, now time.Time
        recv: b *fileBroker
        results: "[]corequeue.MessageValue, error"
      - doc: wakeIfAny wakes the consumers of this queue when n messages were queued.
        name: wakeIfAny
        params: n int
        recv: b *fileBroker
      - doc: |-
          AckMany acknowledges every receipt as Ack acknowledges one — an unlink each,
          no flush, as Ack's — and reports one outcome per receipt
          (core/data/queue.Acker). A failure of the medium stops the batch: the
          receipts after it are reported not attempted.
        name: AckMany
        params: ctx context.Context, receipts []corequeue.ReceiptValue
        recv: b *fileBroker
        results: corequeue.AckResultValue, error
      - doc: |-
          AllMessages yields the live messages in identifier order over one read of
          each state directory, reading each payload only when its message is
          yielded (core/data/queue.MessageLister).
        name: AllMessages
        params: ctx context.Context, after string
        recv: b *fileBroker
        results: iter.Seq2[corequeue.LiveMessageValue, error]
      - doc: |-
          readLive reads the payload of the live message f names, ok false when it
          moved since the listing.
        name: readLive
        params: ctx context.Context, f liveFile
        recv: b *fileBroker
        results: live corequeue.LiveMessageValue, ok bool, err error
      - doc: Nack hands the message back and reports what the broker decided.
        name: Nack
        params: |2

          	ctx context.Context, receipt corequeue.ReceiptValue, cause error,
        recv: b *fileBroker
        results: verdict corequeue.NackValue, err error
      - doc: |-
          NackAfter hands the message back as Nack does, under a queued name visible
          delay after now instead of after the policy's retry delay
          (core/data/queue.DelayedNacker).
        name: NackAfter
        params: |2

          	ctx context.Context, receipt corequeue.ReceiptValue, cause error, delay time.Duration,
        recv: b *fileBroker
        results: verdict corequeue.NackValue, err error
      - doc: |-
          nackWith is Nack and NackAfter: the message renamed back into the queue,
          visible after wait, or buried with cause when it has no attempt left.
        name: nackWith
        params: |2

          	ctx context.Context, receipt corequeue.ReceiptValue, cause error, wait func(deliveries int) time.Duration,
        recv: b *fileBroker
        results: verdict corequeue.NackValue, err error
      - doc: |-
          Reject dead-letters the leased message at once with cause, whatever its
          delivery count (core/data/queue.Rejecter): the same burial a nack on the last
          attempt makes, reached sooner.
        name: Reject
        params: ctx context.Context, receipt corequeue.ReceiptValue, cause error
        recv: b *fileBroker
        results: error
      - doc: |-
          Release hands the leased message back, visible now, with the delivery its
          lease counted given back (core/data/queue.Releaser): one rename from the
          in-flight name to a queued name carrying the instant read now and the count
          one lower — the name a PutMessage of a message never tried writes, at zero.
        name: Release
        params: ctx context.Context, receipt corequeue.ReceiptValue
        recv: b *fileBroker
        results: error
      - doc: nackDead buries a message that has run out of attempts.
        name: nackDead
        params: |2

          	name nameValue, receipt string, cause error, now int64,
        recv: b *fileBroker
        results: verdict corequeue.NackValue, err error
      - doc: |-
          Extend renews a lease and mints the receipt that replaces it.

          A by whose deadline a name cannot carry — one that reaches past
          2262-04-11 — is refused with QueueMisconfigured, before anything is renamed,
          so the lease the caller already holds is untouched. Validate bounds the
          policy's own durations with corequeue.MaxDeadlineOffset; this one is chosen
          at runtime and never passes through it, so the instant itself is checked.
        name: Extend
        params: |2

          	ctx context.Context, receipt corequeue.ReceiptValue, by time.Duration,
        recv: b *fileBroker
        results: lease corequeue.LeaseValue, err error
      - doc: renameLease moves an in-flight message to a new deadline.
        name: renameLease
        params: |2

          	name nameValue, receipt, entropy string, deadline int64,
        recv: b *fileBroker
        results: lease corequeue.LeaseValue, err error
      - doc: |-
          bury writes the dead-letter record and then removes the in-flight message.

          That ORDER is the one that degrades correctly. A crash between the two
          leaves the message both abandoned and in flight; its lease lapses, it is
          buried a second time, and the second record lands on the SAME name — the
          enqueue instant, the entropy and the delivery count are all fixed by then —
          so the atomic publication overwrites it and the store holds one record. The
          opposite order would lose the message entirely, which is the one outcome
          this domain exists to prevent.
        name: bury
        params: name nameValue, receipt string, cause causeValue, now int64
        recv: b *fileBroker
        results: error
      - doc: |-
          DeadLetters returns up to max abandoned messages, oldest first, and removes
          none of them.
        name: DeadLetters
        params: |2

          	ctx context.Context, max int,
        recv: b *fileBroker
        results: dead []corequeue.DeadLetterValue, err error
      - doc: readDead reads and decodes one dead-letter record.
        name: readDead
        params: |2

          	base string,
        recv: b *fileBroker
        results: record corequeue.DeadLetterValue, ok bool, err error
      - doc: |-
          namesOf lists one state directory in the state's order (sortState) —
          which, because of the zero-padded instant that opens every name after its
          level, is the order of TIME within a level.

          A state's listing is reused while its directory's mtime has not moved and
          was already old when the listing began (racyMargin, listingMaxAge): an
          idle consumer's poll, a count, a listing of a queue nobody touches cost one
          stat per directory rather than a read and a sort of every entry (issue
          #811). Any change moves the mtime — a publication, a lease, an
          acknowledgement, in this process or another —, and the next look reads the
          directory again, so a busy queue is read on every Receive as before: that
          is O(entries) per call, measured in BENCH.md, and a caller with millions in
          flight wants a broker over a system built for that, behind this same port.
        name: namesOf
        params: state string
        recv: b *fileBroker
        results: names []string, err error
      - doc: |-
          readNames reads every entry name of one directory, sorted. Names alone:
          the grammar needs nothing else, and a fs.DirEntry per entry was half of
          what a listing allocated.
        name: readNames
        params: state string
        recv: b *fileBroker
        results: names []string, err error
      - doc: |-
          PublishOnce publishes payload unless key is still reserved, and reserves it
          for window (core/data/queue.OncePublisher).

          # A reservation is a file, created exclusively

          The key's reservation is once/<sha256 of the key>.key, holding the end of
          its window as nanoWidth digits. It is written under a name of its own,
          created with O_EXCL, and linked to the key's: link(2) refuses an existing
          name as O_EXCL does, so two producers reserving one key — in one process or
          in two — race on that one link and the kernel gives it to one of them, and
          the reservation is never seen without its end. A passed reservation is
          renamed aside before it is removed, so a producer taking it over never
          removes the one another producer has just made.

          # The message first, then the reservation

          A crash must cost at most a duplicate, never a lost message (the port's
          contract). So the message is written durably FIRST, then the key reserved.
          A crash between the two leaves a message and no reservation: a retry
          publishes it again, which at-least-once already permits. The other order
          would leave a reservation with no message, and every retry inside the
          window would be told the message went out.

          The common duplicate — a retry long after the first publication — is read
          off the reservation before anything is written, and costs no write. Only a
          race inside the same instant writes a message and then withdraws it, by
          unlinking its queued name before anybody is woken; a consumer that leased
          it in that instant makes it a publication after all, and the call says so.

          The reservation is not flushed: a power cut may forget it, which is a
          duplicate, and a reservation whose end cannot be read back is read as passed.
        name: PublishOnce
        params: |2

          	ctx context.Context, key string, payload []byte, window time.Duration,
        recv: b *fileBroker
        results: message corequeue.MessageValue, published bool, err error
      - doc: |-
          withdraw unlinks the queued message PublishOnce wrote but could not reserve
          a key for, and reports the call's outcome: a duplicate when the key was
          taken, the reservation's failure when it failed — and a publication after
          all when a consumer leased the message before it could be withdrawn.
        name: withdraw
        params: |2

          	message corequeue.MessageValue, name nameValue, reserveErr error,
        recv: b *fileBroker
        results: corequeue.MessageValue, bool, error
      - doc: |-
          reserve creates the key's reservation, ending at until, and reports whether
          this call made it. An existing reservation whose window has passed by now
          is taken over; one still running means another publication holds the key.
        name: reserve
        params: digest string, until, now int64
        recv: b *fileBroker
        results: bool, error
      - doc: |-
          createReservation creates once/<digest>.key holding the end of its window,
          and reports false, and no failure, when the name exists.

          The end is written first, into a name of its own created with O_EXCL, and
          that file is then linked to the reservation's name — link(2) refuses an
          existing name as O_EXCL does, and the name appears with its content. A
          reservation created and written in two steps would be read empty between
          them, as passed, by a producer racing this one, which would then take it
          over and publish too.
        name: createReservation
        params: digest string, until int64
        recv: b *fileBroker
        results: bool, error
      - doc: |-
          reservedUntil reads the end of the key's reservation, in Unix nanoseconds:
          0 when there is none, and when the file holds no end it can read — a
          reservation a crash cut short, which is read as passed.
        name: reservedUntil
        params: digest string
        recv: b *fileBroker
        results: int64, error
      - doc: |-
          dropPassed removes the key's reservation when its window has passed by now.

          It renames the reservation aside first and reads what it renamed, so a
          reservation another producer made since this one read the passed one is put
          back rather than removed: removing it would let a third publication through
          a window that is still running.
        name: dropPassed
        params: digest string, now int64
        recv: b *fileBroker
        results: error
      - doc: |-
          asideStillRuns reports whether the reservation renamed aside to name ends
          after now.
        name: asideStillRuns
        params: name string, now int64
        recv: b *fileBroker
        results: bool
      - doc: |-
          sweepOnce removes every reservation whose window has passed by now, and
          every one set aside and left behind by a crash — at most once per
          onceSweepEvery for this broker, measured on its clock.
        name: sweepOnce
        params: now time.Time
        recv: b *fileBroker
        results: error
      - doc: |-
          sweepEntry removes one entry of the reservations' directory when it no
          longer holds a key: a reservation whose window has passed, or a passed one
          a crash left set aside. Anything else — a running reservation, one another
          producer is putting back, a stranger — is left alone.
        name: sweepEntry
        params: base string, now int64
        recv: b *fileBroker
        results: error
      - doc: |-
          writtenAndPassed reports whether name holds the end of a window, and that
          end is not after now.
        name: writtenAndPassed
        params: name string, now int64
        recv: b *fileBroker
        results: bool
      - doc: |-
          Receive reclaims lapsed leases, then leases up to max visible messages.

          Reclaiming FIRST is the whole recovery mechanism and it is deliberately not
          a background task. There is no sweeper goroutine, no timer and no daemon:
          a lease held by a process that has since been killed is noticed by whoever
          looks next, which is exactly this call, in whatever process makes it. A
          sweeper would be a fourth thing that can die, and it would have to be
          elected between processes to avoid all of them sweeping at once.
        name: Receive
        params: |2

          	ctx context.Context, max int,
        recv: b *fileBroker
        results: batch []corequeue.DeliveryValue, err error
      - doc: |-
          leaseVisible walks the queued messages level by level, highest first, each
          level in visibility order, and leases up to max of them. A level's first
          message not yet visible ends that level's walk, never the next level's: a
          high message held back does not hold back a visible normal one (ADR 0054,
          amended 2026-11-03). It also returns the instant, in Unix nanoseconds, at
          which the next queued message becomes visible — now itself when it stopped
          on a full batch with more behind it, zero when nothing else is queued.
        name: leaseVisible
        params: |2

          	now int64, max int,
        recv: b *fileBroker
        results: batch []corequeue.DeliveryValue, next int64, err error
      - doc: |-
          leaseStep leases the queued message base names into walk's batch when it is
          visible, buries it when it is past its MaxAge, and skips the rest of a level
          whose first message is not yet visible. It reports full when the batch is
          full and base is visible.
        name: leaseStep
        params: walk *leaseWalk, base string
        recv: b *fileBroker
        results: full bool, err error
      - doc: |-
          takeLease moves one queued message into flight and reads it back.

          The rename IS the exclusion. Two consumers — in one process or in two —
          both attempt it; the kernel gives it to one and gives the other ENOENT.
          There is no lock to hold, nothing for a dead process to keep, and the
          resolution is identical for goroutines and for processes, which ADR 0052
          measured that flock(2) is emphatically not.
        name: takeLease
        params: |2

          	name nameValue, base string, now int64,
        recv: b *fileBroker
        results: delivery corequeue.DeliveryValue, leased bool, err error
      - doc: readLeased reads the payload of a message this consumer has just leased.
        name: readLeased
        params: |2

          	name nameValue, receipt string,
        recv: b *fileBroker
        results: delivery corequeue.DeliveryValue, leased bool, err error
      - doc: |-
          reclaim returns every lapsed lease to the queue, or to the dead-letter
          store when it has no attempts left, and returns the deadline, in Unix
          nanoseconds, of the earliest lease still held — zero when none is.

          It is what makes the domain's headline promise true: a consumer that is
          SIGKILLed never acknowledges and never nacks, so its message is recovered
          by this scan and by nothing else. A message whose consumers keep dying is
          dead-lettered by the SAME comparison a nack uses — otherwise the poison
          message that killed the process would be redelivered forever, killing every
          consumer that touched it.
        name: reclaim
        params: now int64
        recv: b *fileBroker
        results: next int64, err error
      - doc: recoverOne decides what becomes of one lapsed lease.
        name: recoverOne
        params: name nameValue, base string, now int64
        recv: b *fileBroker
        results: error
      - doc: |-
          dropStale removes name when a rename left it behind, and is nothing when
          it is gone — the answer of every kernel whose rename is one step. OpenBSD's
          FFS renames in two (link the new name, unlink the old), and two consumers
          racing on one message there left it under two names, one queued and one
          leased by nobody (#398: a queued command's restart test saw it, then
          delivered the message twice). The queue's one rule — a message has exactly
          one name, and that name is its state — holds only if the stale one is
          removed. Only a name this broker owns at that instant is ever passed: a
          source it has just renamed away, or a target carrying its own fresh lease.
        name: dropStale
        params: name string
        recv: b *fileBroker
        results: error
      - doc: |-
          expireReady moves one queued message past the policy's MaxAge to the
          dead-letter store, with MESSAGE_EXPIRED and the count it had.

          It claims the message first, by the rename that IS the exclusion — into
          flight, under a lease of its own and with its count unchanged —, so two
          consumers never bury it twice; then it buries what it holds, as a lapsed
          lease with no attempt left is buried. A crash between the two leaves an
          ordinary lease, which lapses, is reclaimed, and is expired again.
        name: expireReady
        params: name nameValue, base string, now int64
        recv: b *fileBroker
        results: error
      - doc: |-
          ReplayDeadLetter queues the dead letter id again, visible now, with its
          delivery count reset (core/data/queue.DeadLetterManager). It keeps its ID, its
          payload and its enqueue instant.

          The queued file is published first — atomically and durably, as Publish
          does — and the dead-letter record is removed after, which is the order that
          degrades correctly: a crash between the two leaves the message queued AND
          still dead, so a second replay would queue it twice — a duplicate the
          at-least-once guarantee permits — where the opposite order would lose it.
          Two replays racing each other can queue it twice for the same reason: a
          record cannot be renamed into the queue, because a queued message is its
          payload alone, so there is no rename for the loser to lose.
        name: ReplayDeadLetter
        params: ctx context.Context, id string
        recv: b *fileBroker
        results: error
      - doc: |-
          replayRecords queues the message id again from the first of its records
          that reads back as id, then removes every one of them, and reports whether
          it queued it: false when none could be read — removed meanwhile, or never
          a record of id.
        name: replayRecords
        params: id string, records []string
        recv: b *fileBroker
        results: queued bool, err error
      - doc: |-
          DeleteDeadLetter removes every record of the dead letter id for good
          (core/data/queue.DeadLetterManager).
        name: DeleteDeadLetter
        params: ctx context.Context, id string
        recv: b *fileBroker
        results: error
      - doc: |-
          PutDeadLetter writes dead into the dead-letter directory as it is given,
          under an identifier minted from its enqueue instant
          (core/data/queue.DeadLetterWriter).

          The record is the one a burial writes — the same header, the payload
          verbatim — published atomically and durably, so it is on the device when
          the call returns and a crash leaves it whole or absent. A dead letter is
          never receivable, so no consumer is woken.
        name: PutDeadLetter
        params: ctx context.Context, dead corequeue.DeadLetterValue
        recv: b *fileBroker
        results: string, error
      - doc: |-
          Messages lists up to max live messages — queued and in flight — whose
          identifier sorts after after, in the byte order of their identifiers
          (core/data/queue.MessageReader). It renames nothing: a name already says a
          message's state, deadline and count, so the listing reads the two
          directories and the payloads, and leases nothing.
        name: Messages
        params: ctx context.Context, after string, max int
        recv: b *fileBroker
        results: "[]corequeue.LiveMessageValue, error"
      - doc: |-
          liveFiles names every queued and in-flight message whose identifier sorts
          after after, sorted by identifier. A file whose name is not one this broker
          writes — a publication's temporary, a stray — is skipped.
        name: liveFiles
        params: after string
        recv: b *fileBroker
        results: "[]liveFile, error"
      - doc: |-
          PutMessage writes live into the queue as a queued message, under an
          identifier minted from its enqueue instant
          (core/data/queue.MessageWriter): its file in ready/ named by its visibility
          instant, its enqueue instant and its delivery count — the state a retry
          leaves —, published atomically and durably as Publish publishes. An idle
          consumer over this directory is woken; a message not yet visible waits for
          its instant, as a retried one does.
        name: PutMessage
        params: ctx context.Context, live corequeue.LiveMessageValue
        recv: b *fileBroker
        results: string, error
      - doc: |-
          deadRecordsOf lists the names of every dead-letter record of the message
          id, in name order. There is normally one; a crash between a replay's two
          steps, or a message that died twice, can leave more, and they all name one
          message. An identifier that is not one this broker mints names nothing.
        name: deadRecordsOf
        params: id string
        recv: b *fileBroker
        results: records []string, err error
      - doc: |-
          removeDead unlinks the given dead-letter records. A record already gone is
          not a failure: somebody else replayed or deleted it first, and the outcome
          is the one asked for.
        name: removeDead
        params: records []string
        recv: b *fileBroker
        results: error
      - doc: |-
          Stats counts the three state directories by their names, opening no file
          (core/data/queue.Counter): the counts are the entries the grammar accepts,
          the oldest instant the smallest enqueue instant a live name carries, and
          the next due the smallest visibility instant a queued name carries.
        name: Stats
        params: ctx context.Context
        recv: b *fileBroker
        results: corequeue.StatsValue, error
      - doc: |-
          countLive adds to stats the messages the live state directory dir names —
          queued or in flight — and lowers oldest to the earliest enqueue instant
          among them.
        name: countLive
        params: dir string, stats *corequeue.StatsValue, oldest *int64
        recv: b *fileBroker
        results: error
      - doc: countDead counts the dead-letter records, as DeadLetters lists them.
        name: countDead
        recv: b *fileBroker
        results: int64, error
    name: fileBroker
  - fields:
      - doc: |-
          Clock reads time. It is the narrow half of kernel/clock because this
          broker never waits: a lapsed lease is noticed by the next Receive, not
          by a timer.

          Injecting a ManualClock makes every deadline in a SINGLE-process test
          instant. It cannot make a cross-process test instant, and that
          asymmetry is not an oversight: a lease deadline is a wall-clock instant
          written into a filename precisely so that another process can read it,
          and another process does not share this one's fake clock. The
          consumer-death test therefore waits on the real clock, and says so.

          Nil means clock.System.
        name: Clock
        type: clock.Clock
      - doc: |-
          Random draws the retry jitter [corequeue.PolicyValue].RetryJitter asks
          for: a number in [0, 1), as math/rand/v2.Float64 returns. Nil means
          math/rand/v2.Float64. A test injects a fixed sequence and asserts every
          retry instant to the nanosecond, as it does without a jitter; the
          three brokers draw from it identically, so the memory broker stays an
          exact double. It may be called by several goroutines at once.
        name: Random
        type: func() float64
      - doc: |-
          Dir is the queue directory. It is created owner-only when absent, and
          refused when it exists and any account outside the owner and group
          could replace its entries. Its three state directories are held to the
          same rule — created owner-only, checked when somebody else made them —
          and refused besides when one is a symlink or not a directory at all.
          On Windows "owner-only" is not something a mode can say: a directory
          inherits its parent's access control list, and the rule reads that list
          instead (dirtrust_windows.go).

          Two brokers over one Dir — in one process or in two — are ONE queue.
          That is the domain's inter-process claim, and it is the whole reason
          the directory is the configuration rather than an implementation
          detail.
        name: Dir
        type: string
      - doc: |-
          Policy is the delivery discipline. Its zero value is refused; see
          core/data/queue.PolicyValue.
        name: Policy
        type: corequeue.PolicyValue
    kind: struct
    name: FileConfig
  - doc: |-
      stateListing is one state directory's names as one read found them, and the
      two instants that decide whether the next look may reuse them.
    fields:
      - doc: |-
          listedAt is the real clock's reading BEFORE the directory was read:
          every change the read could have missed happened after it.
        name: listedAt
        type: time.Time
      - doc: modTime is the directory's mtime as stat read it before the listing.
        name: modTime
        type: time.Time
      - doc: |-
          names is the directory's entries in the state's order. It is never
          written once the listing is stored: every caller only reads it.
        name: names
        type: "[]string"
    kind: struct
    methods:
      - doc: |-
          reusable reports whether this listing still names what the directory
          holds: the directory's mtime is the one the listing recorded, that mtime
          is older than the listing by racyMargin — a change in the listing's own
          tick could not have left it unchanged —, and the listing is younger than
          listingMaxAge.
        name: reusable
        params: modTime, now time.Time
        recv: l *stateListing
        results: bool
    name: stateListing
  - doc: |-
      listings holds the last listing of each state a Receive, a listing or a
      count reads. The reservations' directory is not among them: its sweep reads
      it once a minute at most.
    fields:
      - doc: |-
          wall reads the real clock — never the broker's, which a test may hold
          still: the instants compared are the filesystem's, and it stamps them
          from the real clock. A field so a test can move it.
        name: wall
        type: func() time.Time
      - name: ready
        type: atomic.Pointer[stateListing]
      - name: inflight
        type: atomic.Pointer[stateListing]
      - name: dead
        type: atomic.Pointer[stateListing]
    kind: struct
    methods:
      - doc: |-
          slot returns the cell holding state's last listing, nil for a directory
          that is never cached.
        name: slot
        params: state string
        recv: l *listings
        results: "*atomic.Pointer[stateListing]"
    name: listings
  - doc: |-
      nameValue is a message's identity and state, as encoded in its filename.

      # Why the state is in the NAME and not in a file

      Because rename(2) is the only operation a POSIX filesystem offers that
      changes a fact indivisibly and refuses for the loser. Every transition this
      broker makes — queued to leased, leased back to queued, leased to abandoned
      — is one rename, so it either happened or it did not, no two consumers can
      both win it, and a process killed between two of them leaves the filesystem
      in a state the next process can read without recovering anything.

      The alternative — a state file, or a header rewritten in place — needs a
      lock to be read-modify-written, and a lock needs an owner that can die. The
      whole point of this broker is that its owner can die.

      # Why the instants are int64 nanoseconds

      Because that is what a NAME carries. A time.Time is a wall clock, a
      monotonic reading and a location, none of which survives being written into
      a filename — and holding two of them made this value large enough that
      every transition passed it by reference-sized copies it did not need. As
      nanoseconds the value fits comfortably below the linter's by-value
      threshold, and the conversion to a time.Time happens once, at the boundary
      where a caller actually wants one.
    fields:
      - doc: |-
          Entropy is the message's random half; EnqueuedAt and it together are
          the message identifier.
        name: Entropy
        type: string
      - doc: Lease is the receipt's random half, empty for a queued message.
        name: Lease
        type: string
      - doc: |-
          At is the instant the name sorts on, in Unix nanoseconds: the
          visibility instant for a queued message, the lease deadline for an
          in-flight one.
        name: At
        type: int64
      - doc: |-
          EnqueuedAt is when the message was first accepted, in Unix
          nanoseconds. It never changes.
        name: EnqueuedAt
        type: int64
      - doc: Deliveries is how many times the message has been handed out.
        name: Deliveries
        type: int
      - doc: |-
          Priority is the level the message is delivered at. The normal level
          adds nothing to a name — its names are the ones written before
          priorities existed, byte for byte —, every other level a leading
          digit (atLevel).
        name: Priority
        type: corequeue.Priority
    kind: struct
    methods:
      - doc: |-
          ID returns the opaque message identifier. It is stable across every
          redelivery and it is what a dead letter is joined to a log line by.
        name: ID
        recv: n nameValue
        results: string
      - doc: |-
          AtTime returns [nameValue.At] as an instant, for the one boundary that
          wants one: the lease deadline handed to a consumer.
        name: AtTime
        recv: n nameValue
        results: time.Time
      - doc: EnqueuedTime returns [nameValue.EnqueuedAt] as an instant.
        name: EnqueuedTime
        recv: n nameValue
        results: time.Time
      - doc: readyName renders a queued message's filename.
        name: readyName
        recv: n nameValue
        results: string
      - doc: |-
          inflightName renders a leased message's filename, which is also its
          receipt.
        name: inflightName
        recv: n nameValue
        results: string
      - doc: deadName renders an abandoned message's filename.
        name: deadName
        recv: n nameValue
        results: string
    name: nameValue
  - doc: leaseWalk is what leaseVisible carries from one queued name to the next.
    fields:
      - doc: |-
          out is the batch; nil until something is eligible, so an empty poll
          allocates nothing.
        name: out
        type: "[]corequeue.DeliveryValue"
      - doc: now is the instant visibility is judged at, in Unix nanoseconds.
        name: now
        type: int64
      - doc: later is the earliest instant a level's walk stopped at.
        name: later
        type: int64
      - doc: max bounds the batch.
        name: max
        type: int
      - doc: |-
          skipping is the digit of the level being skipped — none at first,
          since no digit is a zero byte.
        name: skipping
        type: byte
    kind: struct
    name: leaseWalk
  - doc: |-
      liveFile is one live message as the directories name it: the state
      directory it sits in, its file name, and what that name says.
    fields:
      - doc: dir is ready/ or inflight/, and base the file's name in it.
        name: dir
        type: string
      - doc: dir is ready/ or inflight/, and base the file's name in it.
        name: base
        type: string
      - doc: id is the message's identifier, which the listing sorts on.
        name: id
        type: string
      - doc: name is what the file name records.
        name: name
        type: nameValue
      - doc: leased reports an in-flight message.
        name: leased
        type: bool
    kind: struct
    name: liveFile
  - doc: |-
      leaseExpiry is one entry in the deadline heap: when a lease lapses and
      which lease it is.

      The deadline is the order; the receipt finds the record a popped entry
      lapses. Each lease has exactly one entry, named by the record's Handle, so
      an entry is never stale (#1036).
    fields:
      - name: at
        type: time.Time
      - name: receipt
        type: corequeue.ReceiptValue
    kind: struct
    name: leaseExpiry
  - doc: |-
      memRecord is one message and everything the in-memory broker keeps about
      it: the payload, its identity, where it sits in the visibility order, and
      the lease it is currently under.

      It is held by POINTER throughout, so moving a message between the ready
      list and the in-flight map never copies the payload header and never
      desynchronises two copies of the delivery count.
    fields:
      - name: enqueuedAt
        type: time.Time
      - name: visibleAt
        type: time.Time
      - name: expiresAt
        type: time.Time
      - name: id
        type: string
      - name: receipt
        type: corequeue.ReceiptValue
      - name: payload
        type: "[]byte"
      - doc: |-
          lapse names the lease's entry in the broker's expiry heap; the zero
          Handle while the record is not in flight.
        name: lapse
        type: heap.Handle
      - name: seq
        type: uint64
      - name: deliveries
        type: int
      - doc: |-
          priority is the level the message is delivered at; it picks the
          ready list the record waits in.
        name: priority
        type: corequeue.Priority
    kind: struct
    name: memRecord
  - doc: |-
      memoryBroker is a queue that lives entirely in one process's heap.

      # What it is for, and what it is emphatically not

      It is the test double. A consumer's own suite gets the port's semantics —
      leasing, redelivery on a lapsed lease, the delivery count, the dead-letter
      path, every refusal — with no directory, no flush and no cleanup, which is
      what makes those tests fast enough to run on every save.

      It is NOT a queue in the sense the domain's frontier means. It is one
      process, so it crosses no boundary; it holds nothing on a device, so a
      restart is indistinguishable from a total loss. A caller who reaches for it
      in production has bought the asynchrony and thrown away the durability —
      which is precisely the confusion ADR 0053 drew the frontier to prevent, one
      layer down. Use [NewFile].

      Its lease expiry is LAZY: nothing here runs a timer, and an expired lease is
      noticed by the next Receive. That is a deliberate match for the file
      broker, which cannot do anything else — a lease held by a process that has
      since died is only ever noticed by whoever looks next.
    fields:
      - name: clk
        type: clock.Clock
      - doc: inflight holds the leased records by their receipt.
        name: inflight
        type: map[corequeue.ReceiptValue]*memRecord
      - doc: |-
          expiry orders the leases by DEADLINE so a reclaim scan can stop at the
          first one that is still held.

          It exists because the benchmark said so. Without it the reclaim scan
          ranged over the whole inflight MAP on every Receive — a map has no
          order, so there was nothing to stop early on — and a queue with a deep
          in-flight set paid for all of it on every poll: 105 µs per lease against
          the 1.83 µs it costs now, for a verb that is a few hundred nanoseconds
          of actual work. The file broker never had the problem, because its
          in-flight directory sorts by deadline and its scan breaks. See BENCH.md.

          Each entry is named by the Handle its record keeps (memRecord.lapse):
          an Extend re-keys it in place and an Ack, a Nack, a Reject or a
          Release removes it, each in O(log n), so the heap holds exactly the
          leases in flight and every entry it pops is live (#1036). Before, the
          entries were removed lazily — an acknowledgement left its entry to be
          discarded when popped, and every Extend left one more behind.
        name: expiry
        type: "*heap.IndexedHeap[leaseExpiry]"
      - doc: |-
          once holds each PublishOnce key still reserved, by the end of its
          window; onceEnds orders those ends so a passed one is dropped at the
          next PublishOnce without a scan (core/data/queue.OncePublisher).
        name: once
        type: map[string]time.Time
      - name: onceEnds
        type: "*heap.Heap[onceEnd]"
      - doc: |-
          wake is what an idle consumer of this broker waits on: closed by a
          Publish and by a Nack that hands a message back.
        name: wake
        type: "*wakeSignal"
      - doc: nonce prefixes every receipt this broker mints.
        name: nonce
        type: string
      - doc: |-
          ready holds the queued records, one list per level — the lowest at
          index 0, readyIndex — each ordered by visibleAt then seq (ADR 0054,
          amended 2026-11-03).
        name: ready
        type: "[priorityLevels][]*memRecord"
      - doc: |-
          dead holds what the broker gave up on, in the byte order of their
          identifiers — the order DeadLetters and DeadLettersAfter list, the
          durable brokers' (ADR 0054, amended 2026-11-02) —, kept at insertion.
        name: dead
        type: "[]corequeue.DeadLetterValue"
      - doc: random draws the retry jitter (MemoryConfig.Random).
        name: random
        type: func() float64
      - doc: |-
          swept is when the last dead-letter retention sweep ran, in Unix
          nanoseconds; zero for never.
        name: swept
        type: int64
      - name: policy
        type: corequeue.PolicyValue
      - doc: |-
          mu is an RWMutex because DeadLetters is a genuine read: an
          investigation must not serialise against the consumers it is
          investigating. Everything else takes it exclusively, including Receive
          — a lease MUTATES, which is why core/data/queue names the verb Receive and
          not Peek.
        name: mu
        type: sync.RWMutex
      - name: seq
        type: uint64
    kind: struct
    methods:
      - doc: Publish appends payload and returns the message the broker minted.
        name: Publish
        params: |2

          	ctx context.Context, payload []byte,
        recv: b *memoryBroker
        results: message corequeue.MessageValue, err error
      - doc: |-
          enqueue queues payload at level, enqueued at now and visible at visibleAt,
          wakes every idle consumer, and returns the message it minted. The caller
          holds the write lock and has checked the payload's size.
        name: enqueue
        params: payload []byte, now, visibleAt time.Time, level corequeue.Priority
        recv: b *memoryBroker
        results: corequeue.MessageValue
      - doc: |-
          enqueueQuiet is enqueue without the wake, for a batch that wakes once. The
          caller holds mu.
        name: enqueueQuiet
        params: payload []byte, now, visibleAt time.Time, level corequeue.Priority
        recv: b *memoryBroker
        results: corequeue.MessageValue
      - doc: |-
          PublishPriority queues payload at level (core/data/queue.PriorityPublisher):
          a record in that level's ready list, which a Receive empties of its visible
          records before it looks at a lower level.
        name: PublishPriority
        params: |2

          	ctx context.Context, payload []byte, level corequeue.Priority,
        recv: b *memoryBroker
        results: message corequeue.MessageValue, err error
      - doc: |-
          PublishAt queues payload, received by no consumer before at
          (core/data/queue.DelayedPublisher): a record whose visibility is at, in the
          ready list's visibility order.
        name: PublishAt
        params: |2

          	ctx context.Context, payload []byte, at time.Time,
        recv: b *memoryBroker
        results: message corequeue.MessageValue, err error
      - doc: |-
          PublishOnce queues payload unless key is still reserved, and reserves it
          for window (core/data/queue.OncePublisher). The reservations are a map from
          key to the end of its window, and a heap of those ends drops the passed ones
          at the next PublishOnce — the lazy purge the durable brokers make too.
        name: PublishOnce
        params: |2

          	ctx context.Context, key string, payload []byte, window time.Duration,
        recv: b *memoryBroker
        results: message corequeue.MessageValue, published bool, err error
      - doc: |-
          dropPassedOnce removes every reservation whose window has ended by now. The
          caller holds the write lock.
        name: dropPassedOnce
        params: now time.Time
        recv: b *memoryBroker
      - doc: Receive leases up to max messages.
        name: Receive
        params: |2

          	ctx context.Context, max int,
        recv: b *memoryBroker
        results: batch []corequeue.DeliveryValue, err error
      - doc: |-
          takeEligible removes and returns the oldest visible record of the highest
          level that has one, or nil: a level whose head is not yet visible holds
          back nobody below it.
        name: takeEligible
        params: now time.Time
        recv: b *memoryBroker
        results: "*memRecord"
      - doc: |-
          takeVisible removes and returns the head of one level's ready list when it
          is visible, burying first every visible head past its MaxAge.
        name: takeVisible
        params: level int, now time.Time
        recv: b *memoryBroker
        results: "*memRecord"
      - doc: lease moves record into flight and builds the delivery for it.
        name: lease
        params: record *memRecord, now time.Time
        recv: b *memoryBroker
        results: corequeue.DeliveryValue
      - doc: |-
          mintReceipt returns a receipt unique to this broker and this lease. The
          caller holds the write lock and has already advanced seq.
        name: mintReceipt
        recv: b *memoryBroker
        results: corequeue.ReceiptValue
      - doc: Ack removes the leased message permanently.
        name: Ack
        params: ctx context.Context, receipt corequeue.ReceiptValue
        recv: b *memoryBroker
        results: error
      - doc: Nack hands the message back and reports what the broker decided.
        name: Nack
        params: |2

          	ctx context.Context, receipt corequeue.ReceiptValue, cause error,
        recv: b *memoryBroker
        results: verdict corequeue.NackValue, err error
      - doc: |-
          NackAfter hands the message back as Nack does, receivable delay after now
          instead of after the policy's retry delay (core/data/queue.DelayedNacker).
        name: NackAfter
        params: |2

          	ctx context.Context, receipt corequeue.ReceiptValue, cause error, delay time.Duration,
        recv: b *memoryBroker
        results: verdict corequeue.NackValue, err error
      - doc: |-
          nackWith is Nack and NackAfter: the message handed back after wait, or
          dead-lettered with cause when it has no attempt left.
        name: nackWith
        params: |2

          	ctx context.Context, receipt corequeue.ReceiptValue, cause error, wait func(deliveries int) time.Duration,
        recv: b *memoryBroker
        results: verdict corequeue.NackValue, err error
      - doc: |-
          Reject dead-letters the leased message at once with cause, whatever its
          delivery count (core/data/queue.Rejecter).
        name: Reject
        params: ctx context.Context, receipt corequeue.ReceiptValue, cause error
        recv: b *memoryBroker
        results: error
      - doc: |-
          Release hands the leased message back, visible now, with the delivery its
          lease counted given back (core/data/queue.Releaser).
        name: Release
        params: ctx context.Context, receipt corequeue.ReceiptValue
        recv: b *memoryBroker
        results: error
      - doc: |-
          ReplayDeadLetter queues the dead letter id again, visible now, with its
          delivery count reset (core/data/queue.DeadLetterManager). It keeps its ID, its
          payload and its enqueue instant.
        name: ReplayDeadLetter
        params: ctx context.Context, id string
        recv: b *memoryBroker
        results: error
      - doc: |-
          DeleteDeadLetter removes the dead letter id for good
          (core/data/queue.DeadLetterManager).
        name: DeleteDeadLetter
        params: ctx context.Context, id string
        recv: b *memoryBroker
        results: error
      - doc: |-
          PutDeadLetter appends dead to the dead-letter store as it is given, under an
          identifier minted from its enqueue instant and this broker's sequence
          (core/data/queue.DeadLetterWriter). The payload is copied, so a caller that
          reuses its buffer cannot rewrite the record.
        name: PutDeadLetter
        params: ctx context.Context, dead corequeue.DeadLetterValue
        recv: b *memoryBroker
        results: string, error
      - doc: |-
          Messages lists up to max live messages — queued and leased — whose
          identifier sorts after after, in the byte order of their identifiers
          (core/data/queue.MessageReader), each payload a copy. It is a read: it
          leases nothing and reclaims no lapsed lease.
        name: Messages
        params: ctx context.Context, after string, max int
        recv: b *memoryBroker
        results: "[]corequeue.LiveMessageValue, error"
      - doc: |-
          PutMessage queues live as it is given, under an identifier minted from its
          enqueue instant and this broker's sequence (core/data/queue.MessageWriter):
          visible at its instant, with its count, its payload copied. An idle
          consumer is woken.
        name: PutMessage
        params: ctx context.Context, live corequeue.LiveMessageValue
        recv: b *memoryBroker
        results: string, error
      - doc: |-
          takeDead removes and returns the dead letter id. The caller holds the write
          lock.
        name: takeDead
        params: id string
        recv: b *memoryBroker
        results: dead corequeue.DeadLetterValue, found bool
      - doc: Extend renews a lease and mints the receipt that replaces it.
        name: Extend
        params: |2

          	ctx context.Context, receipt corequeue.ReceiptValue, by time.Duration,
        recv: b *memoryBroker
        results: lease corequeue.LeaseValue, err error
      - doc: |-
          Wake reports what an idle consumer should wait on: the signal the next
          Publish or Nack closes, and how long until the earliest message this broker
          holds becomes receivable on its own — the head of the ready list, whose
          retry delay is ending, or the earliest lease, whose holder may have died.

          Both are read from the structures Receive itself uses, under the same lock,
          so the answer is never staler than the call. The expiry heap holds exactly
          the leases in flight, so its top is a lease that can still lapse.
        name: Wake
        recv: b *memoryBroker
        results: corequeue.WakeValue
      - doc: |-
          DeadLetters returns up to max abandoned messages, oldest enqueued first,
          and removes none of them: DeadLettersAfter's first page.
        name: DeadLetters
        params: |2

          	ctx context.Context, max int,
        recv: b *memoryBroker
        results: dead []corequeue.DeadLetterValue, err error
      - doc: |-
          resolve returns the record a receipt names, or the reason it names none.

          The nonce is what makes the two refusals distinguishable without keeping a
          record of every receipt ever issued: one carrying THIS broker's prefix was
          minted here and has since lapsed, and one carrying anything else — a forged
          string, a receipt from another queue, one held across a restart — was never
          ours. "You were too slow" and "this was never yours" are different bugs.
        name: resolve
        params: receipt corequeue.ReceiptValue
        recv: b *memoryBroker
        results: record *memRecord, err error
      - doc: |-
          reclaimExpired returns every lapsed lease to the queue, or to the
          dead-letter store when it has no attempts left.

          A message whose consumer died is dead-lettered by the SAME count comparison
          a nack uses: a process that crashes on every attempt must eventually stop
          being retried, or the poison message that killed it loops forever.
        name: reclaimExpired
        params: now time.Time
        recv: b *memoryBroker
      - doc: |-
          unlease takes record out of flight: out of the in-flight map, and its
          deadline out of the expiry heap. The caller holds the write lock.
        name: unlease
        params: record *memRecord
        recv: b *memoryBroker
      - doc: recoverExpired decides what becomes of one lapsed lease.
        name: recoverExpired
        params: record *memRecord, now time.Time
        recv: b *memoryBroker
      - doc: bury moves a record into the dead-letter store with its cause.
        name: bury
        params: record *memRecord, now time.Time, cause causeValue
        recv: b *memoryBroker
      - doc: |-
          insertDead keeps the dead list in the byte order of the identifiers, so the
          memory broker lists its dead letters as the durable ones do — by enqueue
          instant, whatever order they died in — and a cursor resumes by a binary
          search.
        name: insertDead
        params: dead corequeue.DeadLetterValue
        recv: b *memoryBroker
      - doc: |-
          insertReady places record in its level's list, in visibility order, ties
          broken by seq.

          The list is kept ordered at INSERTION rather than sorted at Receive: a
          consumer polls far more often than a producer publishes, so sorting on the
          read path would re-derive on every poll an order the insert already knows.
        name: insertReady
        params: record *memRecord
        recv: b *memoryBroker
      - doc: |-
          earliestReady is the earliest instant a queued record becomes visible: the
          earliest head of the levels' lists, each in visibility order; the zero
          time.Time when nothing waits.
        name: earliestReady
        recv: b *memoryBroker
        results: time.Time
      - doc: |-
          readyAfter is every queued record, every level's, whose identifier sorts
          after after, in no order.
        name: readyAfter
        params: after string
        recv: b *memoryBroker
        results: "[]*memRecord"
      - doc: readyCount is how many records wait, every level together.
        name: readyCount
        recv: b *memoryBroker
        results: int
      - doc: |-
          DeadLettersAfter returns up to max dead letters whose identifier sorts after
          after, in the byte order of their identifiers, and removes none of them
          (core/data/queue.DeadLetterPager).
        name: DeadLettersAfter
        params: |2

          	ctx context.Context, after string, max int,
        recv: b *memoryBroker
        results: dead []corequeue.DeadLetterValue, err error
      - doc: |-
          deadAfter is the index of the first dead letter whose identifier sorts
          after after. The caller holds mu.
        name: deadAfter
        params: after string
        recv: b *memoryBroker
        results: int
      - doc: Stats counts the queue as the heap holds it (core/data/queue.Counter).
        name: Stats
        params: ctx context.Context
        recv: b *memoryBroker
        results: corequeue.StatsValue, error
      - doc: |-
          Purge removes every live message, waiting and leased, and no dead letter
          (core/data/queue.Purger).
        name: Purge
        params: ctx context.Context
        recv: b *memoryBroker
        results: corequeue.PurgeValue, error
      - doc: |-
          ReplayDeadLetters replays up to max dead letters, oldest enqueued first
          (core/data/queue.DeadLetterBulkManager). Under one lock it cannot fail
          part-way.
        name: ReplayDeadLetters
        params: ctx context.Context, max int
        recv: b *memoryBroker
        results: replayed int, err error
      - doc: |-
          requeueDead puts dead back into the queue, visible at now, its count reset,
          keeping its identifier, payload and enqueue instant. The caller holds mu
          and has taken dead out of the store.
        name: requeueDead
        params: dead corequeue.DeadLetterValue, now time.Time
        recv: b *memoryBroker
      - doc: |-
          PurgeDeadLetters deletes up to max dead letters that failed before before,
          oldest enqueued first (core/data/queue.DeadLetterBulkManager).
        name: PurgeDeadLetters
        params: ctx context.Context, before time.Time, max int
        recv: b *memoryBroker
        results: removed int, err error
      - doc: |-
          sweepRetention removes every dead letter past the policy's
          DeadLetterRetention, at most once a minute on the broker's clock. The
          caller holds mu.
        name: sweepRetention
        params: now time.Time
        recv: b *memoryBroker
      - doc: |-
          expired reports whether a message enqueued at enqueuedAt has reached the
          policy's MaxAge by now.
        name: expired
        params: enqueuedAt, now time.Time
        recv: b *memoryBroker
        results: bool
      - doc: |-
          PublishMany appends every payload under one lock and wakes once
          (core/data/queue.BatchPublisher). It cannot fail part-way: every payload is
          checked first, and nothing else can refuse.
        name: PublishMany
        params: ctx context.Context, payloads [][]byte
        recv: b *memoryBroker
        results: "[]corequeue.MessageValue, error"
      - doc: |-
          AckMany acknowledges every receipt under one lock, one outcome each
          (core/data/queue.Acker).
        name: AckMany
        params: ctx context.Context, receipts []corequeue.ReceiptValue
        recv: b *memoryBroker
        results: corequeue.AckResultValue, error
      - doc: |-
          AllMessages yields the live messages a page at a time
          (core/data/queue.MessageLister).
        name: AllMessages
        params: ctx context.Context, after string
        recv: b *memoryBroker
        results: iter.Seq2[corequeue.LiveMessageValue, error]
    name: memoryBroker
  - fields:
      - doc: |-
          Clock reads time. A memory broker never WAITS — expiry is noticed on
          the next Receive — so it asks for the narrow half of kernel/clock and
          a test can drive every deadline in this package with a ManualClock and
          no sleeping at all.

          Nil means clock.System.
        name: Clock
        type: clock.Clock
      - doc: |-
          Random draws the retry jitter [corequeue.PolicyValue].RetryJitter asks
          for: a number in [0, 1), as math/rand/v2.Float64 returns. Nil means
          math/rand/v2.Float64. A test injects a fixed sequence and asserts every
          retry instant to the nanosecond, as it does without a jitter; the
          three brokers draw from it identically, so the memory broker stays an
          exact double. It may be called by several goroutines at once.
        name: Random
        type: func() float64
      - doc: |-
          Policy is the delivery discipline. Its zero value is refused; see
          core/data/queue.PolicyValue.
        name: Policy
        type: corequeue.PolicyValue
    kind: struct
    name: MemoryConfig
  - doc: |-
      onceEnd is one entry in the in-memory broker's heap of PublishOnce windows:
      when a reservation ends and which key it holds.

      It carries the end as well as the key so a POPPED entry can be checked
      against the key's current reservation — a key reserved again after its
      window ended leaves the old entry in the heap, and comparing the two ends is
      how the stale one is recognised, as leaseExpiry's is.
    fields:
      - name: at
        type: time.Time
      - name: key
        type: string
    kind: struct
    name: onceEnd
  - doc: |-
      causeValue is what a dead letter keeps of the failure that produced it:
      the SCREAMING_SNAKE reason, the wire-safe Public half, the dotted-quad
      code, and the codes its wraps added — the trail, where a sentinel a wrapper
      added stays readable once the origin's code is all the rest says.

      It is deliberately NOT the error. An error cannot be written to a device
      and read back as itself, and the half of it that could be — the Private
      message — is the half CLAUDE.md rule 4 defines as log-only. So the record
      keeps what a stranger investigating a queue is allowed to see, and the
      message identifier joins it to the log line the failing process wrote.
    fields:
      - name: reason
        type: string
      - name: public
        type: string
      - name: trail
        type: "[]uint32"
      - name: code
        type: uint32
    kind: struct
    name: causeValue
  - doc: |-
      sqlQueueKey names one queue for the process's wake table: the database pool
      and the table. Two brokers over the same pool and table are one queue.
    fields:
      - doc: pool is the executor a context with no transaction runs on.
        name: pool
        type: coresql.Executor
      - doc: table is the queue's table.
        name: table
        type: string
    kind: struct
    name: sqlQueueKey
  - doc: |-
      sqlBroker is a queue kept in one table of the caller's own database.

      # Why the caller's database, and what that buys

      A queue in the database the application already writes can hold a message
      in the SAME transaction as the write that caused it: Publish joins the
      transaction its context carries, so the message exists if and only if that
      transaction commits. That is the transactional outbox, and it is the one
      thing neither other broker can offer — a file broker's publication is
      durable at once, whatever the caller's transaction then does.

      # What it keeps, and where

      Everything is in the table and nothing in this process: which messages are
      queued, leased and dead, each lease's deadline, each message's delivery
      count. So a consumer that is SIGKILLed loses only its lease, as with the
      file broker, and any process over the same database sees the same queue.
      Exclusion between consumers is the engine's row lock — FOR UPDATE SKIP
      LOCKED on PostgreSQL and MySQL — or SQLite's single writer.
    fields:
      - doc: tm opens the broker's own transactions, and savepoints in the caller's.
        name: tm
        type: coresql.Transactor
      - doc: clk stamps every instant the broker writes.
        name: clk
        type: clock.Clock
      - doc: tx says where a statement runs, and holds a wake until a commit.
        name: tx
        type: sqlParts
      - doc: |-
          wake is shared by every broker over the same pool and table in this
          process, as the file broker's is by every broker over one directory.
        name: wake
        type: "*wakeSignal"
      - doc: table is the queue's table, which every storage failure names.
        name: table
        type: string
      - doc: stmts are the rendered statements.
        name: stmts
        type: sqlStatements
      - doc: own are the options of a transaction the broker opens itself.
        name: own
        type: coresql.TxOptionsValue
      - doc: random draws the retry jitter (SQLConfig.Random).
        name: random
        type: func() float64
      - name: policy
        type: corequeue.PolicyValue
      - doc: |-
          deadSwept is when this broker last deleted the dead letters past the
          policy's DeadLetterRetention, in Unix nanoseconds on its clock; zero
          before the first.
        name: deadSwept
        type: atomic.Int64
    kind: struct
    methods:
      - doc: |-
          Publish inserts payload into the queue and returns the message minted for
          it.

          Inside a transaction its context carries, the insertion is a savepoint of
          that transaction: the message is receivable once the transaction commits,
          and never existed if it rolls back — and a failed insertion undoes itself
          alone, leaving the caller's transaction usable. Outside one, it is one
          statement on the pool, durable when it returns. Either way the consumers of
          this queue in this process are woken once the message is committed, and
          not before: a wake for a message a rollback took back would find nothing.
        name: Publish
        params: |2

          	ctx context.Context, payload []byte,
        recv: b *sqlBroker
        results: message corequeue.MessageValue, err error
      - doc: |-
          PublishAt inserts payload into the queue as Publish does, its row due at at
          rather than now (core/data/queue.DelayedPublisher): the lease's read takes
          rows by due, so no consumer receives it before then. Its enqueue instant is
          now, and its identifier is minted from it.
        name: PublishAt
        params: |2

          	ctx context.Context, payload []byte, at time.Time,
        recv: b *sqlBroker
        results: message corequeue.MessageValue, err error
      - doc: |-
          PublishPriority inserts payload into the queue at level
          (core/data/queue.PriorityPublisher): its row's priority column holds the
          level, and the lease's read takes the due rows of the highest level first.
          A broker whose SQLConfig.Priority is unset keeps no level: it publishes at
          the normal one as Publish does, and refuses any other.
        name: PublishPriority
        params: |2

          	ctx context.Context, payload []byte, level corequeue.Priority,
        recv: b *sqlBroker
        results: message corequeue.MessageValue, err error
      - doc: |-
          checkLevel refuses a level outside the closed set, and one other than the
          normal level on a table without the priority column (SQLConfig.Priority).
        name: checkLevel
        params: level corequeue.Priority
        recv: b *sqlBroker
        results: error
      - doc: publishRow inserts payload at level, due at at — now when at has passed.
        name: publishRow
        params: |2

          	ctx context.Context, payload []byte, at time.Time, level corequeue.Priority,
        recv: b *sqlBroker
        results: message corequeue.MessageValue, err error
      - doc: Ack deletes the leased message. It is the only call that removes one.
        name: Ack
        params: ctx context.Context, receipt corequeue.ReceiptValue
        recv: b *sqlBroker
        results: error
      - doc: Nack hands the message back and reports what the broker decided.
        name: Nack
        params: |2

          	ctx context.Context, receipt corequeue.ReceiptValue, cause error,
        recv: b *sqlBroker
        results: verdict corequeue.NackValue, err error
      - doc: |-
          NackAfter hands the message back as Nack does, its row due delay after now
          instead of after the policy's retry delay (core/data/queue.DelayedNacker):
          the same one statement, bound to another instant.
        name: NackAfter
        params: |2

          	ctx context.Context, receipt corequeue.ReceiptValue, cause error, delay time.Duration,
        recv: b *sqlBroker
        results: verdict corequeue.NackValue, err error
      - doc: |-
          nackWith is Nack and NackAfter: the row due again after wait, or buried with
          cause when it has no attempt left.
        name: nackWith
        params: |2

          	ctx context.Context, receipt corequeue.ReceiptValue, cause error, wait func(deliveries int) time.Duration,
        recv: b *sqlBroker
        results: verdict corequeue.NackValue, err error
      - doc: |-
          Release hands the leased message back, visible now, with the delivery its
          lease counted given back (core/data/queue.Releaser): one statement, under
          the condition every lease-ending statement carries.
        name: Release
        params: ctx context.Context, receipt corequeue.ReceiptValue
        recv: b *sqlBroker
        results: error
      - doc: |-
          Extend renews a lease and mints the receipt that replaces it.

          A by whose deadline 64-bit Unix nanoseconds cannot carry — one that reaches
          past 2262-04-11 — is refused with QueueMisconfigured before a statement is
          sent, exactly as the file broker refuses the name it could not write.
        name: Extend
        params: |2

          	ctx context.Context, receipt corequeue.ReceiptValue, by time.Duration,
        recv: b *sqlBroker
        results: lease corequeue.LeaseValue, err error
      - doc: |-
          Wake reports what an idle consumer should wait on: the signal the next
          committed Publish, Nack or replay through any broker over this queue in this
          process closes, and how long until the earliest instant the last Receive
          learnt a message becomes receivable on its own.

          Like the file broker's, that instant is only as fresh as the last Receive in
          this process, which reads it from the table; it can be stale only in the
          harmless direction, and a publication from another process closes nothing —
          the poll finds it.
        name: Wake
        recv: b *sqlBroker
        results: corequeue.WakeValue
      - doc: |-
          run runs a call's statements where they belong, as docstore's SQL engine
          runs a write (ADR 0139 §D5).

          Inside the caller's transaction, every call that writes is a savepoint of
          it, however many statements it sends: its failure undoes it alone, and on
          PostgreSQL clears the aborted state a failed statement leaves, so the
          caller's transaction stays usable. Outside one, a call of several statements
          runs in a transaction of the broker's own, and a call of one statement runs
          on the pool, where one statement is atomic by itself.
        name: run
        params: ctx context.Context, several bool, work coresql.TxFunc
        recv: b *sqlBroker
        results: error
      - doc: |-
          announce wakes this queue's idle consumers once the transaction ctx carries
          has committed — at once when the call ran on the pool or in a transaction of
          the broker's own, which has.
        name: announce
        params: ctx context.Context
        recv: b *sqlBroker
      - doc: buryHeld dead-letters the leased message a receipt names, with cause.
        name: buryHeld
        params: ctx context.Context, held sqlReceipt, cause causeValue, now time.Time
        recv: b *sqlBroker
        results: error
      - doc: |-
          receiptOf reads a receipt, refusing one this broker could not have minted,
          and a caller that has already given up.
        name: receiptOf
        params: ctx context.Context, receipt corequeue.ReceiptValue
        recv: b *sqlBroker
        results: sqlReceipt, error
      - doc: |-
          leased turns a statement that ends or renews one lease into the call's
          verdict: one row is the lease still held, none is a lease that lapsed — or
          was renewed, reclaimed, dead-lettered or acknowledged by somebody else.

          The refusals are distinguished by SHAPE, as the file broker's are: this
          queue is inter-process, so a receipt minted by another process over the
          same table is legitimate, and a well-formed receipt that matches no lease
          is the one that lost it.
        name: leased
        params: result stdsql.Result, execErr error, step string
        recv: b *sqlBroker
        results: error
      - doc: |-
          failed is QueueBackendFailed for step, with the driver's error beside it and
          its text withheld by service/data/sql's Withheld. The two are JOINED rather than
          wrapped, so the verdict's code stays the origin whatever the driver's chain
          holds.
        name: failed
        params: step string, cause error
        recv: b *sqlBroker
        results: error
      - doc: |-
          Stats counts the table by state and lease in one statement, reading no
          payload (core/data/queue.Counter). Inside the caller's transaction it
          counts what that transaction sees.
        name: Stats
        params: ctx context.Context
        recv: b *sqlBroker
        results: stats corequeue.StatsValue, err error
      - doc: |-
          Purge deletes every live row — those without a lease, then those with one —
          in one transaction, and no dead letter or PublishOnce reservation
          (core/data/queue.Purger).
        name: Purge
        params: ctx context.Context
        recv: b *sqlBroker
        results: corequeue.PurgeValue, error
      - doc: |-
          ReplayDeadLetters replays up to max dead letters, oldest enqueued first, in
          one statement (core/data/queue.DeadLetterBulkManager): atomic, so it never
          fails part-way.
        name: ReplayDeadLetters
        params: ctx context.Context, max int
        recv: b *sqlBroker
        results: replayed int, err error
      - doc: |-
          PurgeDeadLetters deletes up to max dead letters that failed before before,
          oldest enqueued first, in one statement
          (core/data/queue.DeadLetterBulkManager).
        name: PurgeDeadLetters
        params: ctx context.Context, before time.Time, max int
        recv: b *sqlBroker
        results: removed int, err error
      - doc: |-
          sweepRetention deletes every dead letter past the policy's
          DeadLetterRetention, at most once a minute per broker on its clock, in one
          statement on the transaction ctx carries or the pool.
        name: sweepRetention
        params: ctx context.Context, now int64
        recv: b *sqlBroker
        results: error
      - doc: |-
          expireDue buries every due row past the policy's MaxAge with
          MESSAGE_EXPIRED, in the lease's transaction, before its first pick. A
          policy with no MaxAge sends nothing.
        name: expireDue
        params: ctx context.Context, ex coresql.Executor, now int64
        recv: b *sqlBroker
        results: error
      - doc: |-
          PublishMany inserts every payload in multi-row INSERTs — one when the batch
          fits one statement — on the transaction ctx carries, or in one of the
          broker's own when it takes several, so the batch exists entirely or not
          at all (core/data/queue.BatchPublisher).
        name: PublishMany
        params: ctx context.Context, payloads [][]byte
        recv: b *sqlBroker
        results: "[]corequeue.MessageValue, error"
      - doc: |-
          AckMany deletes the rows every receipt holds in one statement per chunk of
          receipts, and reads which landed from the rows it deleted
          (core/data/queue.Acker): RETURNING on PostgreSQL and SQLite, a locking read
          first on MySQL. A receipt this broker cannot parse is never sent.
        name: AckMany
        params: ctx context.Context, receipts []corequeue.ReceiptValue
        recv: b *sqlBroker
        results: corequeue.AckResultValue, error
      - doc: |-
          ackChunk deletes the rows chunk holds and records each one deleted in
          landed.
        name: ackChunk
        params: |2

          	ctx context.Context, ex coresql.Executor, now int64, chunk []sqlReceipt, landed map[sqlLanded]bool,
        recv: b *sqlBroker
        results: error
      - doc: |-
          readLanded runs query and records the (identifier, lease) of every row it
          returns in landed.
        name: readLanded
        params: |2

          	ctx context.Context, ex coresql.Executor, query string, args []any, landed map[sqlLanded]bool,
        recv: b *sqlBroker
        results: err error
      - doc: |-
          AllMessages yields the live rows a page at a time, each page one unlocked
          read after the last identifier (core/data/queue.MessageLister).
        name: AllMessages
        params: ctx context.Context, after string
        recv: b *sqlBroker
        results: iter.Seq2[corequeue.LiveMessageValue, error]
      - doc: |-
          Reject dead-letters the leased message at once with cause, whatever its
          delivery count (core/data/queue.Rejecter): the burial a nack on the last attempt
          makes, reached sooner, in one statement.
        name: Reject
        params: ctx context.Context, receipt corequeue.ReceiptValue, cause error
        recv: b *sqlBroker
        results: error
      - doc: |-
          DeadLetters returns up to max dead letters, in the order they died, and
          removes none of them. Inside a transaction its context carries, it reads
          what that transaction sees.
        name: DeadLetters
        params: |2

          	ctx context.Context, max int,
        recv: b *sqlBroker
        results: dead []corequeue.DeadLetterValue, err error
      - doc: |-
          DeadLettersAfter reads up to max dead letters whose identifier sorts after
          after, in identifier order — the primary key's — in one statement
          (core/data/queue.DeadLetterPager). Inside the caller's transaction it reads
          what that transaction sees.
        name: DeadLettersAfter
        params: |2

          	ctx context.Context, after string, max int,
        recv: b *sqlBroker
        results: dead []corequeue.DeadLetterValue, err error
      - doc: |-
          ReplayDeadLetter queues the dead letter id again, visible now, with its
          delivery count reset (core/data/queue.DeadLetterManager). It keeps its ID, its
          payload and its enqueue instant; its cause is cleared with its death.

          It is one statement that changes the row's state, so two replays racing each
          other cannot both queue it: the second finds no dead letter and is refused
          DEAD_LETTER_NOT_FOUND. Inside a transaction its context carries, the replay
          stands or falls with it, and the consumers are woken after its commit.
        name: ReplayDeadLetter
        params: ctx context.Context, id string
        recv: b *sqlBroker
        results: error
      - doc: |-
          DeleteDeadLetter removes the dead letter id for good
          (core/data/queue.DeadLetterManager).
        name: DeleteDeadLetter
        params: ctx context.Context, id string
        recv: b *sqlBroker
        results: error
      - doc: |-
          PutDeadLetter writes dead into the table as a dead letter, as it is given,
          under an identifier minted from its enqueue instant
          (core/data/queue.DeadLetterWriter).

          It is one INSERT. Inside a transaction its context carries, it is a
          savepoint of that transaction, so the dead letter exists if and only if the
          transaction commits; outside one, it is durable when it returns. A dead
          letter is never receivable, so no consumer is woken.
        name: PutDeadLetter
        params: ctx context.Context, dead corequeue.DeadLetterValue
        recv: b *sqlBroker
        results: string, error
      - doc: |-
          Messages lists up to max live messages — queued and leased — whose
          identifier sorts after after, in identifier order
          (core/data/queue.MessageReader): one read, which locks nothing and changes
          nothing. Inside a transaction its context carries, it reads what that
          transaction sees.
        name: Messages
        params: ctx context.Context, after string, max int
        recv: b *sqlBroker
        results: live []corequeue.LiveMessageValue, err error
      - doc: |-
          PutMessage writes live into the table as a queued message, under an
          identifier minted from its enqueue instant (core/data/queue.MessageWriter):
          one INSERT of a live row, due at its visibility instant, with its count.
          Inside a transaction its context carries, it is a savepoint of that
          transaction, and the consumers are woken after its commit, as a
          publication's are.
        name: PutMessage
        params: ctx context.Context, live corequeue.LiveMessageValue
        recv: b *sqlBroker
        results: string, error
      - doc: |-
          deadLetterMoved turns a statement on one dead letter into the call's
          verdict: one row is the dead letter acted on, none is one the store does not
          hold.
        name: deadLetterMoved
        params: result stdsql.Result, execErr error, step, id string
        recv: b *sqlBroker
        results: error
      - doc: |-
          PublishOnce inserts payload into the queue unless key is still reserved, and
          reserves it for window (core/data/queue.OncePublisher), all in one
          transaction: the caller's, as a savepoint of it, or one of the broker's own.

          A reservation is a row of the queue's own table — dead = 2, the key's
          SHA-256 as its id, the end of its window as its due — so the table's primary
          key is the unique constraint, and a database that ran SQLMigration before
          this sibling existed needs nothing more. The call removes the key's passed
          reservation, claims the key with an insertion that affects no row when it
          is taken, inserts the message only when the claim did, and removes up to
          sqlOnceSweepRows passed reservations of other keys — those another
          transaction holds are skipped, never waited for, where the engine can.

          The reservation and the message commit together or not at all, so on this
          broker a crash costs nothing: no duplicate, no loss. Two producers claiming
          one key at once are ordered by the engine — the second waits on the first's
          row until it commits, then affects nothing, or claims the key if the first
          rolled back.
        name: PublishOnce
        params: |2

          	ctx context.Context, key string, payload []byte, window time.Duration,
        recv: b *sqlBroker
        results: message corequeue.MessageValue, published bool, err error
      - doc: |-
          claimOnce removes the key's reservation when its window has passed by now,
          then reserves the key until until, and reports whether the claim affected a
          row — whether the key is this call's.
        name: claimOnce
        params: ctx context.Context, ex coresql.Executor, digest []byte, until, now int64
        recv: b *sqlBroker
        results: bool, error
      - doc: |-
          sweepOnce removes up to sqlOnceSweepRows reservations whose window has
          passed by now, of any key: read locked and skipping those another
          transaction holds, then removed by identifier.
        name: sweepOnce
        params: ctx context.Context, ex coresql.Executor, now int64
        recv: b *sqlBroker
        results: error
      - doc: |-
          pickPassedOnce reads the identifiers of up to sqlOnceSweepRows reservations
          whose window has passed by now — locked, and skipping those another
          transaction holds, where the engine can.
        name: pickPassedOnce
        params: ctx context.Context, ex coresql.Executor, now int64
        recv: b *sqlBroker
        results: ids []any, err error
      - doc: |-
          Receive leases up to max due messages, burying on the way every lapsed
          lease with no attempt left.

          An idle Receive is ONE read and takes no lock: the earliest instant any live
          row is due. Only when something is due does it open a transaction — of its
          own, or a savepoint of the caller's — read the due rows in order, locked,
          skipping those another consumer holds, and lease them in one statement. So a
          queue whose consumers sleep on the Waker costs its database one indexed read
          per poll, and none of SQLite's single write lock.

          A lease whose consumer died is due at its deadline, and the same read finds
          it: with attempts left it is leased again, its count moved on; without, it
          is dead-lettered with LEASE_EXPIRED, exactly as the other brokers' reclaim
          does. There is no sweeper, here either: a lapsed lease is noticed by
          whoever looks next.
        name: Receive
        params: |2

          	ctx context.Context, max int,
        recv: b *sqlBroker
        results: batch []corequeue.DeliveryValue, err error
      - doc: |-
          receiveInstants reads the clock once for a Receive — the instant a lease is
          judged against and the deadline one taken now gets — refusing a clock this
          broker could not write down, and sweeps the dead letters past their
          retention on the same look, at most once a minute, in a statement of its
          own.
        name: receiveInstants
        params: ctx context.Context
        recv: b *sqlBroker
        results: sqlInstants, error
      - doc: |-
          probeOutside asks, outside any transaction, whether anything is due, and
          answers the Receive when it can: nothing due — the probe's record is the
          wake —, or, on PostgreSQL, the lease taken in one statement with no
          transaction of the broker's own (issue #1042). answered is false when the
          lease must run in a transaction.
        name: probeOutside
        params: |2

          	ctx context.Context, ex coresql.Executor, at sqlInstants, max int,
        recv: b *sqlBroker
        results: batch []corequeue.DeliveryValue, answered bool, err error
      - doc: |-
          leaseInTransaction leases up to max due rows in a transaction — the
          broker's own, or a savepoint of the caller's — and records when the next
          row becomes due once the leases stand.
        name: leaseInTransaction
        params: ctx context.Context, at sqlInstants, max int
        recv: b *sqlBroker
        results: "[]corequeue.DeliveryValue, error"
      - doc: |-
          leaseDue leases up to max due rows inside the transaction ex runs, and
          returns them with the instant an idle consumer should look again.
        name: leaseDue
        params: |2

          	ctx context.Context, ex coresql.Executor, at sqlInstants, max int,
        recv: b *sqlBroker
        results: batch []corequeue.DeliveryValue, next int64, err error
      - doc: |-
          leaseRound reads up to want due rows, buries the lapsed ones with no
          attempt left, and leases the rest.
        name: leaseRound
        params: ctx context.Context, ex coresql.Executor, at sqlInstants, want int
        recv: b *sqlBroker
        results: sqlLeaseRound, error
      - doc: |-
          pickDue reads up to want due rows, oldest due first — locked, and skipping
          those another transaction holds, where the engine can.
        name: pickDue
        params: ctx context.Context, ex coresql.Executor, now int64, want int
        recv: b *sqlBroker
        results: picked []sqlPicked, err error
      - doc: |-
          buryLapsed dead-letters the given lapsed leases with LEASE_EXPIRED, a
          bounded number of rows per statement.
        name: buryLapsed
        params: ctx context.Context, ex coresql.Executor, now int64, rows []sqlPicked
        recv: b *sqlBroker
        results: error
      - doc: |-
          leaseRows leases the given rows under one lease — one deadline, one random
          half — a bounded number per statement, and returns their deliveries in the
          order they were read.
        name: leaseRows
        params: |2

          	ctx context.Context, ex coresql.Executor, deadline int64, rows []sqlPicked,
        recv: b *sqlBroker
        results: batch []corequeue.DeliveryValue, err error
      - doc: |-
          minDue runs a query answering one MIN(due) and returns it — NULL, which is
          "no row to take the minimum of", kept apart from a real instant of zero.
        name: minDue
        params: |2

          	ctx context.Context, ex coresql.Executor, query, step string, args ...any,
        recv: b *sqlBroker
        results: due stdsql.NullInt64, err error
      - doc: |-
          finishRows closes rows and returns the read's verdict: err when the read had
          already failed, else the failure that ended the iteration early — which Next
          reports only as "no more rows" — else the close's.
        name: finishRows
        params: rows rowSet, step string, err error
        recv: b *sqlBroker
        results: error
      - doc: |-
          receiveReturning leases up to max due messages outside the caller's
          transaction in ONE statement — leaseReturning, atomic by itself, so it runs
          on the pool with no BEGIN and no COMMIT (issue #1042). A batch it did not
          fill buries the lapsed leases with no attempt left, which the statement
          skips, and asks when the next message is due. A policy with a MaxAge buries
          the expired messages first, in a statement of its own.

          RETURNING promises no order, so the batch is sorted by the instant each row
          was due, then its identifier: pick's order, the queue's visibility order.
        name: receiveReturning
        params: |2

          	ctx context.Context, ex coresql.Executor, at sqlInstants, max int,
        recv: b *sqlBroker
        results: batch []corequeue.DeliveryValue, err error
      - doc: |-
          leaseReturning sends the one statement that leases, and reads the rows it
          leased into deliveries under one lease, in identifier order.
        name: leaseReturning
        params: |2

          	ctx context.Context, ex coresql.Executor, at sqlInstants, max int,
        recv: b *sqlBroker
        results: batch []corequeue.DeliveryValue, err error
    name: sqlBroker
  - doc: "sqlReceipt is what a receipt names: one lease on one message."
    fields:
      - doc: id is the message identifier.
        name: id
        type: string
      - doc: lease is the lease's random half, hex.
        name: lease
        type: string
      - doc: deliveries is the delivery count the lease was taken at.
        name: deliveries
        type: int
    kind: struct
    methods:
      - doc: |-
          args binds the condition sqlHeldBy renders: the identifier, the lease, the
          delivery count, and the instant the lease must still be ahead of.
        name: args
        params: now int64
        recv: r sqlReceipt
        results: "[]any"
    name: sqlReceipt
  - doc: |-
      sqlLanded names a row AckMany deleted: its identifier and the lease it was
      held under.
    fields:
      - name: id
        type: string
      - name: lease
        type: string
    kind: struct
    name: sqlLanded
  - doc: |-
      sqlBulkStatements are the statements of the siblings that act on a whole
      queue (ADR 0054 and ADR 0151, amended 2026-11-02): rendered once, beside
      the others, and sent only by the calls that need them — a broker whose
      policy has no MaxAge and no DeadLetterRetention sends none of them from
      Receive.
    fields:
      - doc: |-
          stats counts the rows by state and lease, with the earliest enqueue and
          due instants of each group: Counter.Stats in one statement.
        name: stats
        type: string
      - doc: |-
          purgeQueued and purgeLeased delete the live rows without and with a
          lease: Purger.Purge, which reports the two counts apart.
        name: purgeQueued
        type: string
      - doc: |-
          purgeQueued and purgeLeased delete the live rows without and with a
          lease: Purger.Purge, which reports the two counts apart.
        name: purgeLeased
        type: string
      - doc: |-
          expire buries every live row past MaxAge that is due — waiting and
          visible, or a lapsed lease — with MESSAGE_EXPIRED.
        name: expire
        type: string
      - doc: |-
          retention deletes every dead letter that failed at or before an
          instant.
        name: retention
        type: string
      - doc: |-
          replayMany replays the oldest dead letters, up to a bound, as replay
          replays one; purgeDeadMany deletes the oldest that failed before an
          instant, up to a bound. MySQL spells the bound as the UPDATE's or the
          DELETE's own ORDER BY … LIMIT, the others as a sub-select of the ids.
        name: replayMany
        type: string
      - doc: |-
          replayMany replays the oldest dead letters, up to a bound, as replay
          replays one; purgeDeadMany deletes the oldest that failed before an
          instant, up to a bound. MySQL spells the bound as the UPDATE's or the
          DELETE's own ORDER BY … LIMIT, the others as a sub-select of the ids.
        name: purgeDeadMany
        type: string
      - doc: table is the table's quoted name; dialect its placeholders.
        name: table
        type: string
      - name: dialect
        type: coresql.Dialect
      - doc: causeArgs is how many arguments a burial's cause binds.
        name: causeArgs
        type: int
    kind: struct
    methods:
      - doc: |-
          insertRows renders the INSERT of n messages, published as insert publishes
          one: n rows of (identifier, due, enqueue instant, payload).
        name: insertRows
        params: n int
        recv: s *sqlBulkStatements
        results: string
      - doc: |-
          ackHeld renders the condition AckMany's statements share: a live row whose
          lease is still ahead of the first argument and that one of n receipts —
          identifier, lease, count — holds.
        name: ackHeld
        params: n int
        recv: s *sqlBulkStatements
        results: string
      - doc: |-
          ackRows renders AckMany's DELETE of n receipts' rows. On PostgreSQL and
          SQLite it returns the identifier and lease of each row it deleted, so the
          one statement says which receipts landed; on MySQL, which has no
          RETURNING, ackPick reads them first in the same transaction.
        name: ackRows
        params: n int
        recv: s *sqlBulkStatements
        results: string
      - doc: |-
          ackPick renders MySQL's read of the rows AckMany's DELETE will remove,
          locked, in the transaction that removes them.
        name: ackPick
        params: n int
        recv: s *sqlBulkStatements
        results: string
    name: sqlBulkStatements
  - fields:
      - doc: |-
          Transactor is the transaction manager of the database the queue lives
          in — the one the caller's own transactions are opened with, so a call
          made under one of them joins it. It must also be a core/data/sql Joiner and
          Deferrer, which the SDK's own transactor is: the first is how a
          publication joins the caller's transaction, the second how it wakes a
          consumer only once that transaction has committed.
        name: Transactor
        type: coresql.Transactor
      - doc: |-
          Clock stamps every instant the broker writes — a message's visibility,
          a lease's deadline, a dead letter's failure — and reads the instant a
          lease is judged against. Nil means clock.System.

          The instants are the BROKER's, never the database's NOW(): a test
          drives every deadline with a ManualClock, as it does the other two
          brokers'. Brokers in several processes over one table compare
          instants their own clocks wrote, so those clocks must agree to within
          the precision a lease needs — as they must for the file broker.
        name: Clock
        type: clock.Clock
      - doc: |-
          Random draws the retry jitter [corequeue.PolicyValue].RetryJitter asks
          for: a number in [0, 1), as math/rand/v2.Float64 returns. Nil means
          math/rand/v2.Float64. A test injects a fixed sequence and asserts every
          retry instant to the nanosecond, as it does without a jitter; the
          three brokers draw from it identically, so the memory broker stays an
          exact double. It may be called by several goroutines at once.
        name: Random
        type: func() float64
      - doc: |-
          Table names the queue's one table, which [SQLMigration] creates. It is
          a lower-case SQL identifier of at most [MaxSQLTableLen] bytes, holds no
          three underscores in a row — docstore's derived tables do — and does
          not start with "sqlite_".

          Two brokers over one database and one Table — in one process or in
          twenty — are ONE queue, as two file brokers over one directory are.
        name: Table
        type: string
      - doc: |-
          Policy is the delivery discipline. Its zero value is refused; see
          core/data/queue.PolicyValue.
        name: Policy
        type: corequeue.PolicyValue
      - doc: |-
          Dialect is the engine's, and must be the Transactor's own: the SQL the
          broker speaks to it.
        name: Dialect
        type: coresql.Dialect
      - doc: |-
          Trail makes the broker keep a dead letter's trail
          (core/data/queue.DeadLetterValue.Trail) in the table's trail column,
          which [SQLMigration] creates and [SQLTrailMigration] adds to a table an
          earlier SQLMigration created: run that migration before setting it.
          Unset, the broker sends the statements it sent before the column
          existed, and a dead letter it buries or reads has no trail.
        name: Trail
        type: bool
      - doc: |-
          Priority makes the broker keep a message's level
          (core/data/queue.PriorityPublisher) in the table's priority column,
          which [SQLPriorityMigration] adds, and hand out the visible rows of
          the highest level first: run that migration before setting it.
          Unset, the broker sends the statements it sent before the column
          existed, reads every message as core/data/queue.PriorityNormal, and
          refuses to publish or write one at any other level.
        name: Priority
        type: bool
    kind: struct
    methods:
      - doc: |-
          validate refuses a configuration no SQL broker could run, before any
          statement is sent, and returns what the broker needs of its transactor.
        name: validate
        recv: c *SQLConfig
        results: sqlParts, error
    name: SQLConfig
  - doc: |-
      sqlParts are the two capabilities the SQL broker needs of its transactor,
      found once at NewSQL.
    fields:
      - doc: join says where a statement issued under a context runs.
        name: join
        type: coresql.Joiner
      - doc: hold keeps a wake until the transaction a publication joined commits.
        name: hold
        type: coresql.Deferrer
    kind: struct
    name: sqlParts
  - doc: scanner is what reading one row needs of *sql.Rows.
    kind: named
    name: scanner
    underlying: |-
      interface {
      	// Scan copies the row's columns into dest.
      	Scan(dest ...any) error
      }
  - doc: |-
      sqlColumns are the optional columns a broker's statements name: each one
      an SQLConfig option, and each one absent from every statement without it.
    fields:
      - doc: trail is SQLConfig.Trail.
        name: trail
        type: bool
      - doc: priority is SQLConfig.Priority.
        name: priority
        type: bool
    kind: struct
    name: sqlColumns
  - doc: |-
      sqlStatements are the statements one SQL broker sends, rendered for its
      dialect and table.

      One table holds the whole queue, and a row's state is three columns: dead
      is 0 for a live message and 1 for a dead letter; lease is NULL for a queued
      message and the lease's random half for a leased one; due is the instant
      the row next matters on its own — a queued message's visibility, a leased
      one's deadline, a dead letter's failure. So every live row whose due has
      passed is either receivable or a lease whose holder may have died, and one
      ordered read finds both.

      A third state, dead = 2, is no message: it is a PublishOnce reservation
      (ADR 0183), its id the key's SHA-256 in hex — 64 bytes, no dash, so never a
      message's identifier — and its due the end of its window. The primary key is
      its unique constraint, so the table needs no migration for it, and every
      statement above names dead = 0 or dead = 1 and never reads one.
    fields:
      - doc: insert publishes a message.
        name: insert
        type: string
      - doc: |-
          probe reads the earliest instant any live row is due: nothing is
          receivable before it, so an idle Receive reads only this.
        name: probe
        type: string
      - doc: |-
          lock takes SQLite's write lock with a write that writes nothing, before
          the lease's first read; empty on every other engine.
        name: lock
        type: string
      - doc: |-
          pick reads the live rows due by now, oldest due first, locked and
          skipping those another transaction holds where the engine can.
        name: pick
        type: string
      - doc: next reads the earliest instant a live row becomes due after now.
        name: next
        type: string
      - doc: |-
          leaseReturning leases up to a bound of the due rows in ONE statement —
          an UPDATE … FROM a locked, skipping sub-select, RETURNING what a
          delivery needs and the instant each row was due — on PostgreSQL, for a
          Receive outside the caller's transaction (issue #1042). Empty on MySQL,
          which has no UPDATE … RETURNING, and on SQLite, whose RETURNING cannot
          name the sub-select's due and so cannot keep a batch in visibility
          order: both keep the transaction of pick and leaseRows. It skips a
          lapsed lease with no attempt left, which buryExhausted buries.
        name: leaseReturning
        type: string
      - doc: |-
          buryExhausted buries, with LEASE_EXPIRED, every lapsed lease with no
          attempt left: what leaseReturning skips.
        name: buryExhausted
        type: string
      - doc: |-
          ack, retry, bury and extend end or renew one lease, matching the
          receipt's identifier, lease and delivery count, and a deadline still
          ahead.
        name: ack
        type: string
      - doc: |-
          ack, retry, bury and extend end or renew one lease, matching the
          receipt's identifier, lease and delivery count, and a deadline still
          ahead.
        name: retry
        type: string
      - doc: |-
          ack, retry, bury and extend end or renew one lease, matching the
          receipt's identifier, lease and delivery count, and a deadline still
          ahead.
        name: bury
        type: string
      - doc: |-
          ack, retry, bury and extend end or renew one lease, matching the
          receipt's identifier, lease and delivery count, and a deadline still
          ahead.
        name: extend
        type: string
      - doc: |-
          release hands one lease back as retry does, visible at once, with the
          delivery count it moved on moved back, under the same condition.
        name: release
        type: string
      - doc: |-
          deadList reads the dead letters after an identifier, in identifier
          order — the enqueue order every broker lists them in (issue #1043).
        name: deadList
        type: string
      - doc: replay and deleteDead act on one dead letter.
        name: replay
        type: string
      - doc: replay and deleteDead act on one dead letter.
        name: deleteDead
        type: string
      - doc: |-
          putDead writes a dead letter as it is given: dead, its failure instant
          as its due, its count and its cause.
        name: putDead
        type: string
      - doc: |-
          liveList reads the live messages after an identifier, in identifier
          order, without a lock: a copy's listing, not a lease.
        name: liveList
        type: string
      - doc: |-
          putLive writes a live message as it is given: queued, visible at its
          due, with its count.
        name: putLive
        type: string
      - doc: once are PublishOnce's fixed statements.
        name: once
        type: sqlOnceStatements
      - doc: bulk are the statements of the siblings that act on a whole queue.
        name: bulk
        type: sqlBulkStatements
      - doc: table is the table's quoted name.
        name: table
        type: string
      - doc: dialect selects the placeholder grammar of the per-call ones.
        name: dialect
        type: coresql.Dialect
      - doc: |-
          insertPriority publishes a message at a level other than the normal
          one; empty without SQLConfig.Priority.
        name: insertPriority
        type: string
      - doc: |-
          trail is SQLConfig.Trail: every burial writes the trail column, the
          dead-letter read returns it, a replay clears it.
        name: trail
        type: bool
      - doc: |-
          priority is SQLConfig.Priority: the lease's read takes the highest
          level first, a copy writes and the listings read the priority column.
        name: priority
        type: bool
    kind: struct
    methods:
      - doc: |-
          withPriority renders the statements SQLConfig.Priority changes: the
          lease's read takes the highest level first — the index SQLPriorityMigration
          creates over (dead, priority, due, id) serves it —, a copy writes the
          level, the listings read it, and insertPriority publishes at a level.
        name: withPriority
        params: dialect coresql.Dialect, quoted string
        recv: s *sqlStatements
      - doc: |-
          insertAt is the statement and arguments of a publication at level: the
          insertion every broker sends at the normal level, insertPriority with the
          level last at any other.
        name: insertAt
        params: level corequeue.Priority, id []byte, due, enqueued int64, payload []byte
        recv: s *sqlStatements
        results: string, []any
      - doc: |-
          leaseRows renders the lease of n rows: their deadline, their lease's random
          half, and their delivery count moved on — for the rows still live.
        name: leaseRows
        params: n int
        recv: s *sqlStatements
        results: string
      - doc: |-
          buryRows renders the burial of n rows whose leases lapsed with no attempt
          left: dead, with the failure's instant and cause — and its trail, with
          SQLConfig.Trail, so no trail an earlier death left survives this one.
        name: buryRows
        params: n int
        recv: s *sqlStatements
        results: string
      - doc: |-
          causeArgs binds a burial's instant and cause: the instant, the reason, the
          wire-safe Public half and the code, each bounded as the file broker bounds
          its record's header, then — with SQLConfig.Trail — the trail, NULL for
          none.
        name: causeArgs
        params: now int64, cause causeValue
        recv: s *sqlStatements
        results: "[]any"
      - doc: |-
          putDeadArgs binds PutDeadLetter's insertion of dead under id: the row's
          identifier, instants, count and payload, then its cause, as given — with
          SQLConfig.Trail, its trail last.
        name: putDeadArgs
        params: id string, dead corequeue.DeadLetterValue
        recv: s *sqlStatements
        results: "[]any"
      - doc: |-
          onceSweepRows renders the removal of n passed reservations, picked by
          oncePick: still reservations, and still passed at the instant bound first.
        name: onceSweepRows
        params: n int
        recv: s *sqlStatements
        results: string
      - doc: list renders n comma-separated placeholders, numbered from first.
        name: list
        params: first, n int
        recv: s *sqlStatements
        results: string
    name: sqlStatements
  - doc: |-
      sqlOnceStatements are PublishOnce's fixed statements (ADR 0183), over
      reservation rows — dead = 2 — of the queue's own table.
    fields:
      - doc: drop removes one key's reservation once its window has passed.
        name: drop
        type: string
      - doc: claim reserves a key, affecting no row when the key is still reserved.
        name: claim
        type: string
      - doc: |-
          pick reads the passed reservations of any key, locked and skipping
          those another transaction holds where the engine can.
        name: pick
        type: string
    kind: struct
    name: sqlOnceStatements
  - doc: |-
      priorityColumnStatements are what SQLPriorityMigration sends to add the
      priority column and its index to a queue's table, or to drop them, on one
      dialect. Every engine reads the table's columns from its catalogue first —
      the table's name bound, never interpolated —, so a table that is not there
      or already has the column is left alone: an index cannot be created IF NOT
      EXISTS over a table that is not there.
    fields:
      - doc: |-
          probe counts the table's columns and, among them, the priority column:
          (0, 0) for no table.
        name: probe
        type: string
      - doc: add adds the column and the index, in order.
        name: add
        type: "[]string"
      - doc: drop drops the index and the column, in order.
        name: drop
        type: "[]string"
    kind: struct
    methods:
      - doc: |-
          step is SQLPriorityMigration's Up — the column and its index added — or,
          with drop, its Down — both dropped —, each only where it changes something.
        name: step
        params: table string, drop bool
        recv: s priorityColumnStatements
        results: coresql.Step
    name: priorityColumnStatements
  - doc: sqlPicked is one row the lease's read returned.
    fields:
      - doc: id is the message identifier.
        name: id
        type: string
      - doc: payload is the message.
        name: payload
        type: "[]byte"
      - doc: enqueuedAt is when the message was first published, Unix nanoseconds.
        name: enqueuedAt
        type: int64
      - doc: deliveries is how many times the message has been handed out so far.
        name: deliveries
        type: int64
      - doc: leased reports a row that was under a lease — now lapsed.
        name: leased
        type: bool
    kind: struct
    name: sqlPicked
  - doc: sqlLeaseRound is what one read of due rows decided.
    fields:
      - doc: batch are the deliveries it leased, oldest due first.
        name: batch
        type: "[]corequeue.DeliveryValue"
      - doc: |-
          read is how many rows the read returned: fewer than asked means nothing
          else is due, or everything else due is held by another transaction.
        name: read
        type: int
    kind: struct
    name: sqlLeaseRound
  - doc: |-
      sqlInstants are the two instants one Receive reads its clock for: the
      instant a lease is judged against, and the deadline a lease taken now gets.
    fields:
      - doc: now is the instant, in Unix nanoseconds.
        name: now
        type: int64
      - doc: deadline is now plus the visibility timeout, checked representable.
        name: deadline
        type: int64
    kind: struct
    name: sqlInstants
  - doc: |-
      rowSet is what finishing a read needs of *sql.Rows: the failure that ended
      the iteration early, and the close.
    kind: named
    name: rowSet
    underlying: |-
      interface {
      	// Err returns the failure that ended the iteration, or nil.
      	Err() error
      	// Close releases the rows.
      	Close() error
      }
  - doc: |-
      trailColumnStatements are the statements SQLTrailMigration sends to add
      the trail column to a queue's table, or to drop it, on one dialect.

      PostgreSQL says "only when it is (not) there" in the statement itself.
      SQLite and MySQL have no IF EXISTS nor IF NOT EXISTS on a column, so the
      migration reads the table's columns from the catalogue first — with the
      table's name bound, never interpolated — and sends the ALTER only when it
      changes something: a run that MySQL's implicit commit stopped after its ALTER, a
      table SQLMigration created with the column, and a table not created yet
      all leave nothing to do.
    fields:
      - doc: |-
          probe counts the table's columns and, among them, the trail column:
          (0, 0) for no table. Empty on PostgreSQL.
        name: probe
        type: string
      - doc: add adds the column.
        name: add
        type: string
      - doc: drop drops it.
        name: drop
        type: string
    kind: struct
    methods:
      - doc: |-
          step is SQLTrailMigration's Up — the column added — or, with drop, its
          Down — the column dropped —, each only where it changes something.
        name: step
        params: table string, drop bool
        recv: s trailColumnStatements
        results: coresql.Step
    name: trailColumnStatements
  - doc: |-
      wakeSignal is a broadcast: every consumer waiting on the channel wakes when
      it is closed, and a fresh channel is armed for the next wait. A channel
      closed and replaced, rather than one value sent, is what makes it a
      broadcast — a send wakes one receiver and is lost if nobody is receiving.

      For the durable broker it also keeps the earliest instant a message the
      broker last saw becomes receivable on its own, because that broker's state
      is a directory and the only moment it can learn the instant is while a
      Receive is already reading the names.
    fields:
      - doc: ch is the channel handed out until the next fire.
        name: ch
        type: chan struct{}
      - doc: |-
          due is the earliest known instant, in Unix nanoseconds, at which a
          message becomes receivable with no further event; zero when none.
        name: due
        type: int64
      - name: mu
        type: sync.Mutex
    kind: struct
    methods:
      - doc: current returns the channel the next fire will close.
        name: current
        recv: w *wakeSignal
        results: signal <-chan struct{}, due int64
      - doc: fire wakes every consumer waiting on the current channel and arms the next.
        name: fire
        recv: w *wakeSignal
      - doc: |-
          record replaces the known due instant with what a scan just read. The
          LATEST scan wins rather than the earliest instant, because a scan reads the
          whole state: an instant it did not see has since been acted on.
        name: record
        params: due int64
        recv: w *wakeSignal
    name: wakeSignal
  - doc: |-
      wakeTable holds, per queue, the signal every durable broker over that queue
      in this process shares — weakly, so a queue whose brokers have all been
      collected does not keep an entry forever.

      Two brokers over one queue are ONE queue — two over one FileConfig.Dir, two
      over one database pool and SQLConfig.Table — so a publication through either
      must wake the consumers of both. Keying the signal by broker instance would
      have made that true only when the producer and the consumer happened to hold
      the same value. K is what names a queue: a directory's canonical spelling
      for the file broker, the pool and the table for the SQL one.
    fields:
      - name: byQueue
        type: map[K]weak.Pointer[wakeSignal]
      - name: mu
        type: sync.Mutex
    kind: struct
    methods:
      - doc: |-
          forKey returns the signal shared by every broker over the queue key names,
          creating it.
        name: forKey
        params: key K
        recv: d *wakeTable[K]
        results: "*wakeSignal"
      - doc: drop removes key's entry once its signal has been collected.
        name: drop
        params: key K
        recv: d *wakeTable[K]
    name: wakeTable
    typeParams: K comparable
vars:
  - doc: |-
      stateDirs is the three state directories and the reservations', hoisted so
      preparing a queue directory does not allocate a slice literal every time.
    items:
      - name: stateDirs
        value: "[]string{dirReady, dirInflight, dirDead, dirOnce}"
    name: stateDirs
  - doc: sqlWakes is the process's table of SQL queues.
    items:
      - name: sqlWakes
        value: newWakeTable[sqlQueueKey]()
    name: sqlWakes
  - doc: |-
      sqlTablePattern is the only shape a table name may take. It is
      interpolated, quoted, into every statement — an identifier cannot be a
      bound parameter — so this pattern is the whole defence against an
      injection. Lower case, because PostgreSQL folds an unquoted name to it and
      MySQL's case sensitivity follows the server's filesystem.
    items:
      - name: sqlTablePattern
        value: regexp.MustCompile(`^[a-z_][a-z0-9_]*$`)
    name: sqlTablePattern
  - doc: |-
      fileWakes is the process's table of directories. It is process-wide by
      necessity: the point is to connect brokers that know nothing of each other.
    items:
      - name: fileWakes
        value: newWakeTable[string]()
    name: fileWakes
