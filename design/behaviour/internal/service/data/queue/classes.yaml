# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      allMessagesPage is how many live messages an AllMessages iterator reads per
      page of a broker's Messages: large enough that a queue of thousands costs a
      handful of reads, small enough that a page's payloads stay a bounded heap.
    items:
      - name: allMessagesPage
        type: int
        value: "256"
    name: allMessagesPage
  - doc: |-
      armTimerRounds bounds how many times armUntil re-arms a timer the clock
      moved past while it was being armed.
    items:
      - name: armTimerRounds
        type: int
        value: "4"
    name: armTimerRounds
  - doc: |-
      DefaultPollInterval is how long an idle worker waits before asking again,
      when [ConsumerConfig.PollInterval] is left at zero.

      It is a CLAMP and not a refusal (ADR 0031): its zero has one reading — "you
      did not think about polling" — and 100 ms is defensible for every queue,
      because it bounds idle latency at a tenth of a second while costing one
      probe per tenth of a second — on the file broker a stat of each state
      directory while the queue is quiet, a read of them once it moves. A caller
      who cares picks their own.

      Every broker in this package is a [corequeue.Waker], so for them it bounds
      only what a wake cannot see — a publication made by ANOTHER process into a
      durable queue — and a caller that has no such producer can raise it a
      hundredfold. It stays at 100 ms because a zero must keep meaning what it
      always meant for a broker that cannot wake anyone.
    items:
      - name: DefaultPollInterval
        type: time.Duration
        value: 100 * time.Millisecond
    name: DefaultPollInterval
  - doc: |-
      DefaultSettleTimeout bounds one acknowledgement, nack, rejection or release
      [Consume] sends once its context has ended, and one lease renewal, when
      [ConsumerConfig.SettleTimeout] is left at zero.

      It is a CLAMP and not a refusal (ADR 0031): its zero has one reading — "you
      did not think about how long the medium may take to record an outcome" —
      and five seconds is far above what a flush-free rename or one indexed
      statement costs while still letting a stop end when the medium has stopped
      answering. It is also the most a handler is stopped early by: the margin
      kept before a lease ends is a tenth of the lease, at most the
      SettleTimeout in force.
    items:
      - name: DefaultSettleTimeout
        type: time.Duration
        value: 5 * time.Second
    name: DefaultSettleTimeout
  - doc: |-
      leaseMarginDivisor sets the margin a handler is stopped by before its lease
      ends: a tenth of the lease, capped at SettleTimeout — room for the nack of a
      handler that ran out of time to land while the lease still holds.
    items:
      - name: leaseMarginDivisor
        type: time.Duration
        value: "10"
    name: leaseMarginDivisor
  - doc: |-
      renewDivisor sets AutoExtend's cadence: a renewal every third of the lease,
      which leaves room for two consecutive failures before it lapses — the
      cadence lock's Keepalive recommends for the same reason.
    items:
      - name: renewDivisor
        type: time.Duration
        value: "3"
    name: renewDivisor
  - doc: worldWritable is the other-write bit.
    items:
      - name: worldWritable
        type: fs.FileMode
        value: "0o002"
    name: worldWritable
  - doc: |-
      exitIOErr matches sysexits EX_IOERR (74), QUEUE_BACKEND_FAILED's exit code,
      which backendFailed restates: a filesystem that refused an operation may
      accept the next one, so the caller's retry is meaningful in a way a
      configuration refusal's is not.
    items:
      - name: exitIOErr
        type: int
        value: "74"
    name: exitIOErr
  - doc: |-
      deadSweepAll is the bound of a retention sweep: every record the directory
      holds.
    items:
      - name: deadSweepAll
        type: int
        value: int(^uint(0) >> 1)
    name: deadSweepAll
  - doc: |-
      deadHeaderMax bounds what a sweep reads of a dead-letter record to find its
      failure instant: a header this package writes is well under it — seven
      short lines, a trail of sixteen codes, a reason and a cause of 120 runes —
      so the payload behind it is never read, and a record whose header does not
      end within it is not one this package wrote.
    items:
      - name: deadHeaderMax
        type: int
        value: "4096"
    name: deadHeaderMax
  - doc: |-
      queueDirMode is the mode a queue directory is CREATED with when it is
      absent: owner-only. A directory this broker created has the mode it asked
      for, so [checkQueueDir] is about directories somebody else created.
    items:
      - name: queueDirMode
        type: fs.FileMode
        value: "0o700"
    name: queueDirMode
  - doc: |-
      messageMode is the mode every message file is published with. Owner-only,
      because the payload is the caller's data and this domain has no way to know
      whether it is a cache warm-up or a password reset.
    items:
      - name: messageMode
        type: fs.FileMode
        value: "0o600"
    name: messageMode
  - doc: |-
      deadMagic opens every dead-letter record. A file whose first line is not
      this is not one of ours, and a future format change gets a new number
      rather than a silent misparse.
    items:
      - name: deadMagic
        type: string
        value: "\"ktnq/1\""
    name: deadMagic
  - doc: |-
      deadHeaderSep ends the header. Everything after it, byte for byte, is the
      payload — which is why the header is line-based and the payload is not
      escaped, quoted or encoded: a queue moves arbitrary bytes, and any encoding
      applied here would be a second thing to get wrong.
    items:
      - name: deadHeaderSep
        type: string
        value: "\"\\n\\n\""
    name: deadHeaderSep
  - doc: |-
      publicMaxRunes bounds what is copied from a failure's Public half. CLAUDE.md
      rule 4 already caps a DEFINED sentinel at 120 runes with no newline, but
      errs.NewRuntime accepts a runtime string, so a cause reaching this package
      from a consumer's own code can carry anything at all. It is bounded and
      stripped of line breaks HERE rather than trusted, because a newline in this
      field would end the header early and turn the rest of the reason into
      payload.
    items:
      - name: publicMaxRunes
        type: int
        value: "120"
    name: publicMaxRunes
  - doc: |-
      racyMargin is how much older than the listing that read it a directory's
      modification instant must be for the listing to be reused (issue #811).

      A directory's mtime is the filesystem's record of its last change, stamped
      from the kernel's coarse clock — up to one tick behind the real one — and
      truncated to the filesystem's granularity: a nanosecond on ext4, XFS, Btrfs
      or APFS, one second on ext3 or HFS+, two on FAT. A change made after a
      listing began can therefore carry the very mtime the listing recorded, when
      both fall in one tick: the directory changed, and its mtime did not. Git
      meets the same fact in its index and names it "racily clean" — an entry
      whose file changed in the second the index was written is looked at again,
      whatever its stat says. The broker does the same: a listing whose
      directory's mtime is within racyMargin of the instant the listing began is
      never reused, so a publication in the same tick as a listing is seen by the
      next Receive. Three seconds covers the coarsest granularity named above
      plus the coarse clock's lag, with room to spare.
    items:
      - name: racyMargin
        type: time.Duration
        value: 3 * time.Second
    name: racyMargin
  - doc: |-
      listingMaxAge bounds how long a listing is reused even when its directory's
      mtime says nothing changed: past it, the next look reads the directory
      again. It is what keeps "finally seen" unconditional where the mtime cannot
      be trusted at all — a wall clock stepped back across a listing, a network
      filesystem stamping with a server clock far behind this one, a tool that
      restores a directory's mtime — at the cost of one read per directory every
      listingMaxAge on a queue nobody touches. It runs on the monotonic clock, so
      a step of the wall clock does not stretch it.
    items:
      - name: listingMaxAge
        type: time.Duration
        value: 10 * time.Second
    name: listingMaxAge
  - doc: |-
      The three directories are the three states. A message is queued, leased, or
      abandoned, and it is in exactly one of them because rename(2) moves it
      between them indivisibly.
    grouped: true
    items:
      - name: dirReady
        type: string
        value: "\"ready\""
      - name: dirInflight
        type: string
        value: "\"inflight\""
      - name: dirDead
        type: string
        value: "\"dead\""
    name: dirReady
  - doc: |-
      dirOnce holds the PublishOnce reservations, one file per key still
      reserved (core/data/queue.OncePublisher). It is no state of a message —
      nothing in it is ever delivered — but it is held to the states' rule: an
      account that could plant a file there could hold any key reserved, and drop
      every publication under it.
    items:
      - name: dirOnce
        type: string
        value: "\"once\""
    name: dirOnce
  - doc: |-
      The two suffixes distinguish a message from anything else that may appear
      in one of those directories — notably the `.vfs-*.tmp` temporary an atomic
      publication creates beside its target, which a scan MUST skip rather than
      deliver as a half-written message.
    grouped: true
    items:
      - name: suffixMessage
        type: string
        value: "\".msg\""
      - name: suffixDead
        type: string
        value: "\".dead\""
    name: suffixMessage
  - doc: |-
      nanoWidth zero-pads an instant to the width of the largest int64
      (9223372036854775807 is 19 digits), so that a LEXICOGRAPHIC sort of the
      directory is a CHRONOLOGICAL sort of its messages. That equality is the
      whole reason FIFO costs nothing here: os.ReadDir already sorts by name.
    items:
      - name: nanoWidth
        type: int
        value: "19"
    name: nanoWidth
  - doc: |-
      deliveryWidth pads the delivery count. It is cosmetic — nothing sorts on it
      and it is parsed with strconv — but a fixed width keeps a directory listing
      readable by whoever is investigating at three in the morning.
    items:
      - name: deliveryWidth
        type: int
        value: "3"
    name: deliveryWidth
  - doc: |-
      decimalBase is the base every number in a name is written in. Decimal, not
      something denser, because the whole point of putting the state in the name
      is that a person can read it with ls.
    items:
      - name: decimalBase
        type: int
        value: "10"
    name: decimalBase
  - doc: |-
      idEntropyBytes is the entropy in a message identifier. Two messages
      published in the same nanosecond by two different PROCESSES have no
      sequence number to fall back on — that is what makes this queue
      inter-process — so the tie is broken by eight bytes of randomness rather
      than by a counter no other process can see.
    items:
      - name: idEntropyBytes
        type: int
        value: "8"
    name: idEntropyBytes
  - doc: |-
      leaseEntropyBytes is the entropy in a receipt. It makes two consumers that
      lease two different messages in the same nanosecond unable to collide on an
      in-flight name, which matters because a rename onto an existing name would
      silently DESTROY the other consumer's message.
    items:
      - name: leaseEntropyBytes
        type: int
        value: "4"
    name: leaseEntropyBytes
  - doc: |-
      int64Bits is the width strconv parses an instant at. It is named because a
      bare 64 in a ParseInt call is the one place a silent truncation would be
      invisible: an instant parsed at 32 bits would wrap in 2038.
    items:
      - name: int64Bits
        type: int
        value: "64"
    name: int64Bits
  - doc: |-
      uint32Bits is the width strconv parses a trail's code at: a dotted-quad
      code is a uint32, and one wider is not a code this package wrote.
    items:
      - name: uint32Bits
        type: int
        value: "32"
    name: uint32Bits
  - doc: The number of dot-separated fields each name carries.
    grouped: true
    items:
      - name: readyFields
        type: int
        value: "4"
      - name: inflightFields
        type: int
        value: "5"
      - name: deadFields
        type: int
        value: "3"
    name: readyFields
  - doc: "maxNameFields is the most fields any name carries: the in-flight grammar's."
    items:
      - name: maxNameFields
        type: int
        value: inflightFields
    name: maxNameFields
  - doc: |-
      normalDigit stands for the normal level in the order of the names: it is
      never written, since a normal name carries no digit.
    items:
      - name: normalDigit
        type: byte
        value: "'0' + byte(corequeue.PriorityHighest-corequeue.PriorityNormal)"
    name: normalDigit
  - doc: |-
      The position of each field within a queued or in-flight name. They are
      named rather than written as indices because the two layouts differ only by
      their last field, and an off-by-one between them would read a delivery
      count as a lease and be caught by nothing but a failing round trip.
    grouped: true
    items:
      - name: posAt
        type: int
        value: iota
      - name: posEnqueued
      - name: posEntropy
      - name: posDeliveries
      - name: posLease
    name: posAt
  - doc: |-
      The position of each field within a dead letter's name, which carries no
      visibility instant and no lease.
    grouped: true
    items:
      - name: posDeadEnqueued
        type: int
        value: iota
      - name: posDeadEntropy
      - name: posDeadDeliveries
    name: posDeadEnqueued
  - doc: "suffixOnce ends a reservation's name: the key's digest, then this."
    items:
      - name: suffixOnce
        type: string
        value: "\".key\""
    name: suffixOnce
  - doc: |-
      suffixGone ends the name a passed reservation is renamed to before it is
      removed: the key's digest, a random half, then this.
    items:
      - name: suffixGone
        type: string
        value: "\".gone\""
    name: suffixGone
  - doc: |-
      suffixNew ends the name a reservation is written under before it is linked
      to its own: the key's digest, a random half, then this.
    items:
      - name: suffixNew
        type: string
        value: "\".new\""
    name: suffixNew
  - doc: |-
      onceTakeovers bounds how many times one PublishOnce takes a passed
      reservation over before it reads the key as held: each round lost is
      another publication that reserved the key meanwhile.
    items:
      - name: onceTakeovers
        type: int
        value: "2"
    name: onceTakeovers
  - doc: |-
      onceSweepEvery is how often one broker sweeps the reservations whose window
      has passed. Each sweep reads the whole directory, so it is not paid on
      every PublishOnce; between two, a passed reservation costs a file and
      nothing else, since every read of one checks its end.
    items:
      - name: onceSweepEvery
        type: time.Duration
        value: time.Minute
    name: onceSweepEvery
  - doc: |-
      retentionSweepEvery is how often, at most, a broker's Receive looks for a
      dead letter past PolicyValue.DeadLetterRetention, on the broker's clock: a
      retention is days, so a minute late costs nothing, and a Receive that swept
      on every poll would pay a scan of the dead-letter store each time.
    items:
      - name: retentionSweepEvery
        type: time.Duration
        value: time.Minute
    name: retentionSweepEvery
  - doc: |-
      instanceNonceBytes is the entropy in a broker's receipt prefix. It is what
      lets an unknown receipt be told apart from an expired one without keeping a
      record of every receipt ever issued: a receipt carrying THIS broker's nonce
      was minted here and has since lapsed, and one carrying anything else was
      never ours.
    items:
      - name: instanceNonceBytes
        type: int
        value: "8"
    name: instanceNonceBytes
  - doc: |-
      memIDHalfWidth is how many base-36 digits the widest uint64 takes: each
      half of a memory identifier is padded to it, so identifiers sort by value.
    items:
      - name: memIDHalfWidth
        type: int
        value: "13"
    name: memIDHalfWidth
  - doc: |-
      receiptRadix is the base a memory receipt's counter is written in. Base 36
      keeps it short without needing a second alphabet, and nothing ever parses
      it back — a receipt is opaque.
    items:
      - name: receiptRadix
        type: int
        value: "36"
    name: receiptRadix
  - doc: |-
      reasonLeaseExpired is the Reason recorded on a dead letter that died by
      running out of attempts without any consumer ever reporting a cause — the
      signature of a handler that crashes the process, since a process that dies
      cannot nack. It is spelled the same as core/data/queue.LeaseExpired's Reason on
      purpose: it is the same event, seen from the broker rather than from the
      consumer that lost the race.
    items:
      - name: reasonLeaseExpired
        type: string
        value: "\"LEASE_EXPIRED\""
    name: reasonLeaseExpired
  - doc: |-
      reasonUnreported is the Reason recorded when a consumer nacked with a nil
      cause. "It did not work and I cannot say why" is a real answer and is
      recorded as one, rather than as an empty string a reader would take for a
      bug in this package.
    items:
      - name: reasonUnreported
        type: string
        value: "\"UNREPORTED\""
    name: reasonUnreported
  - doc: |-
      maxDeadDeliveries is the largest delivery count PutDeadLetter and
      PutMessage write: the
      SQL broker's deliveries column is a 32-bit INT on MySQL, and a count the
      table cannot hold is refused before a statement is sent, by every broker
      alike.
    items:
      - name: maxDeadDeliveries
        type: int
        value: math.MaxInt32
    name: maxDeadDeliveries
  - doc: |-
      maxDeadTrail is the most trail codes a dead letter keeps: the kernel's own
      bound on an error's trail (errs keeps sixteen, its origin's first wrap and
      the newest), so a trail describeCause reads is never cut, and one
      PutDeadLetter is handed longer is refused rather than cut, by every broker
      alike.
    items:
      - name: maxDeadTrail
        type: int
        value: "16"
    name: maxDeadTrail
  - doc: |-
      trailSeparator joins a trail's codes where a broker writes it as text: the
      file broker's header line and the SQL broker's column.
    items:
      - name: trailSeparator
        type: string
        value: "\",\""
    name: trailSeparator
  - doc: |-
      priorityLevels is how many levels a broker orders: PriorityLowest to
      PriorityHighest.
    items:
      - name: priorityLevels
        type: int
        value: int(corequeue.PriorityHighest-corequeue.PriorityLowest) + 1
    name: priorityLevels
  - doc: |-
      decorrelatedFactor is how far above the previous wait a decorrelated draw
      may reach: kernel/backoff's, the Builders' Library's `sleep * 3`.
    items:
      - name: decorrelatedFactor
        type: float64
        value: "3"
    name: decorrelatedFactor
  - doc: |-
      sqlLeaseEntropyBytes is the entropy in a lease's random half. It is the
      proof a receipt holds the lease — the identifier is known to anyone who can
      read the queue — so it is as wide as a message's own entropy.
    items:
      - name: sqlLeaseEntropyBytes
        type: int
        value: "8"
    name: sqlLeaseEntropyBytes
  - doc: |-
      sqlReceiptFields is how many dot-separated fields a receipt carries: the
      message identifier, the delivery count, the lease's random half.
    items:
      - name: sqlReceiptFields
        type: int
        value: "3"
    name: sqlReceiptFields
  - doc: sqlBrokerName names this broker in its refusals' fields.
    items:
      - name: sqlBrokerName
        type: string
        value: "\"sql\""
    name: sqlBrokerName
  - doc: |-
      sqlStatsGroups is how many groups the stats statement can answer: live
      without a lease, live with one, and dead.
    items:
      - name: sqlStatsGroups
        type: int
        value: "3"
    name: sqlStatsGroups
  - doc: |-
      sqlInsertArgs is how many arguments one row of a multi-row INSERT binds:
      the identifier, the due instant, the enqueue instant and the payload.
    items:
      - name: sqlInsertArgs
        type: int
        value: "4"
    name: sqlInsertArgs
  - doc: |-
      sqlAckArgs is how many arguments one receipt of AckMany's statement binds:
      the identifier, the lease and the delivery count.
    items:
      - name: sqlAckArgs
        type: int
        value: "3"
    name: sqlAckArgs
  - doc: |-
      MaxSQLTableLen is the longest table name [NewSQL] and [SQLMigration] accept,
      in bytes: PostgreSQL's identifier limit. The broker derives no table from
      it, so the whole limit is the caller's.
    items:
      - name: MaxSQLTableLen
        type: int
        value: "63"
    name: MaxSQLTableLen
  - doc: |-
      sqlTableSeparator is the run of underscores docstore's SQL engine appends
      to a table name to derive its own tables. A queue's table holds none, so it
      can never be one of a document store's in the same database.
    items:
      - name: sqlTableSeparator
        type: string
        value: "\"___\""
    name: sqlTableSeparator
  - doc: |-
      sqlReservedPrefix starts every name SQLite keeps for itself: creating a
      table under it is an error there, so it is refused on every engine and a
      queue moves between them unchanged.
    items:
      - name: sqlReservedPrefix
        type: string
        value: "\"sqlite_\""
    name: sqlReservedPrefix
  - doc: |-
      sqlRowsPerStatement bounds how many identifiers one lease or burial of a
      batch names. With its four other arguments it stays under the 999 bound
      parameters of an SQLite older than 3.32, so a large batch is several
      statements rather than one the engine refuses.
    items:
      - name: sqlRowsPerStatement
        type: int
        value: "500"
    name: sqlRowsPerStatement
  - doc: |-
      sqlIDColumnLen is the width of MySQL's id column, in bytes. An identifier is
      a 19-digit instant, a dash and 16 hex digits — 36 bytes — and the column
      leaves room for a longer one without a migration.
    items:
      - name: sqlIDColumnLen
        type: int
        value: "64"
    name: sqlIDColumnLen
  - doc: |-
      sqlLeaseColumnLen is the width of MySQL's lease column: the hex of the
      lease's random half.
    items:
      - name: sqlLeaseColumnLen
        type: int
        value: "32"
    name: sqlLeaseColumnLen
  - doc: |-
      sqlCauseArgs is how many arguments a burial's cause binds before the trail
      and the identifiers: the instant, the reason, the cause and the code.
    items:
      - name: sqlCauseArgs
        type: int
        value: "4"
    name: sqlCauseArgs
  - doc: |-
      sqlTrailColumnLen is the width of MySQL's trail column: maxDeadTrail codes
      of at most ten decimal digits, and the commas between them.
    items:
      - name: sqlTrailColumnLen
        type: int
        value: maxDeadTrail*11 - 1
    name: sqlTrailColumnLen
  - doc: sqlTrailColumn is the column SQLConfig.Trail keeps a dead letter's trail in.
    items:
      - name: sqlTrailColumn
        type: string
        value: "\"trail\""
    name: sqlTrailColumn
  - doc: |-
      sqlPriorityColumn is the column SQLConfig.Priority keeps a message's level
      in (ADR 0054, amended 2026-11-03).
    items:
      - name: sqlPriorityColumn
        type: string
        value: "\"priority\""
    name: sqlPriorityColumn
  - doc: |-
      sqlPutDeadArgs is how many arguments PutDeadLetter's insertion binds
      before the optional columns': the identifier, the two instants, the count,
      the payload and the three of the cause.
    items:
      - name: sqlPutDeadArgs
        type: int
        value: "8"
    name: sqlPutDeadArgs
  - doc: |-
      sqlCauseColumnLen is the width of MySQL's reason and cause columns. What a
      dead letter keeps of a failure is bounded to publicMaxRunes runes, at most
      four bytes each.
    items:
      - name: sqlCauseColumnLen
        type: int
        value: 4 * publicMaxRunes
    name: sqlCauseColumnLen
  - doc: |-
      sqlMigrationPrefix starts the name of every migration SQLMigration builds, so
      a version table read during an incident says what created the table.
    items:
      - name: sqlMigrationPrefix
        type: string
        value: "\"queue \""
    name: sqlMigrationPrefix
  - doc: |-
      sqlTrailMigrationPrefix starts the name of every migration
      SQLTrailMigration builds, beside SQLMigration's in the caller's version
      table.
    items:
      - name: sqlTrailMigrationPrefix
        type: string
        value: "\"queue trail \""
    name: sqlTrailMigrationPrefix
  - doc: |-
      sqlOnceSweepRows bounds how many passed reservations one PublishOnce
      removes besides its own key's: enough to outpace the reservations one call
      adds, and one bounded statement whatever the backlog.
    items:
      - name: sqlOnceSweepRows
        type: int
        value: "100"
    name: sqlOnceSweepRows
  - doc: |-
      sqlPriorityMigrationPrefix starts the name of every migration
      SQLPriorityMigration builds, the table's name after it.
    items:
      - name: sqlPriorityMigrationPrefix
        type: string
        value: "\"queue priority \""
    name: sqlPriorityMigrationPrefix
  - doc: |-
      sqlPriorityIndexSuffix ends the name of the index SQLPriorityMigration
      creates over (dead, priority, due, id).
    items:
      - name: sqlPriorityIndexSuffix
        type: string
        value: "\"_priority\""
    name: sqlPriorityIndexSuffix
  - doc: |-
      sqlPriorityIndexHash is how many bytes of the table name's SHA-256 a
      shortened index name keeps, so two long table names sharing a prefix still
      name two indexes.
    items:
      - name: sqlPriorityIndexHash
        type: int
        value: "4"
    name: sqlPriorityIndexHash
files:
  - decls:
      - allMessagesPage
      - checkSizes
      - pagedMessages
      - refusedReceipt
      - yieldFailure
    name: bulk.go
  - decls:
      - armTimerRounds
      - Consume
      - consumer
      - newConsumer
      - (*consumer).pump
      - (*consumer).turn
      - (*consumer).idleTurn
      - idleFor
      - idle
      - armUntil
      - (*consumer).settleBatch
      - (*consumer).prepare
      - (*consumer).process
      - (*consumer).settle
      - (*consumer).handBackAll
      - (*consumer).handBack
      - (*consumer).nack
      - guard
      - ignoreLapsed
      - ignoreCancelled
