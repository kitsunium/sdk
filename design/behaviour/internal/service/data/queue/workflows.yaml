            - set: held
              value: append(held, "(id = "+p(first)+" AND lease = "+p(first+1)+" AND deliveries = "+p(first+2)+")"...)
          key: receipt
          range: "n"
      - return: "\" WHERE dead = 0 AND due > \" + p(1) + \" AND (\" + string(held) + \")\""
  - of: earliest
    steps:
      - var:
          name: first
          type: int64
      - loop:
