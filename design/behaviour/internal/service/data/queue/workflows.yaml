          do:
            - opt:
                do:
                  - set: due
                    value: list[0].visibleAt
                when: len(list) > 0 && (due.IsZero() || list[0].visibleAt.Before(due))
          key: _
          range: b.ready
          value: list
      - return: due
  - of: (*sqlBulkStatements).insertRows
    steps:
      - bind: rows
        eval: make([]byte, 0, n*32)
      - loop:
          do:
            - opt:
                do:
                  - set: rows
                    value: append(rows, ", "...)
                when: row > 0
            - bind: first
              eval: row*sqlInsertArgs + 1
            - set: rows
              value: |-
                append(rows, "("+s.dialect.Placeholder(first)+", 0, "+s.dialect.Placeholder(first+1)+", "+
                			s.dialect.Placeholder(first+2)+", 0, "+s.dialect.Placeholder(first+3)+")"...)
          key: row
          range: "n"
      - return: "\"INSERT INTO \" + s.table + \" (id, dead, due, enqueued_at, deliveries, payload) VALUES \" + string(rows)"
  - of: (*sqlBulkStatements).ackHeld
