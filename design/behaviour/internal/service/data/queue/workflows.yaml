workflows:
  - of: isHex
    steps:
      - loop:
          do:
            - bind: char
              eval: field[index]
            - opt:
                do:
                  - return: "false"
                when: (char < '0' || char > '9') && (char < 'a' || char > 'f')
          key: index
          range: len(field)
      - return: "true"
  - of: (*memoryBroker).earliestReady
