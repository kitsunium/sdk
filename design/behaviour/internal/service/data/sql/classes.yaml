# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      DefaultMaxLifetime is the connection lifetime a non-positive
      [PoolConfig.MaxLifetime] clamps to.

      database/sql reads 0 as "reuse a connection forever", and a connection that
      lives forever survives a failover, a DNS change and a credential rotation —
      it keeps talking to a replica that has been demoted, and nothing in the
      application ever notices. The exact number matters far less than its being
      FINITE, so this is a clamp rather than a refusal (ADR 0031): thirty minutes
      is long enough to be invisible on the hot path and short enough that a
      topology change is picked up without a restart.
    items:
      - name: DefaultMaxLifetime
        type: time.Duration
        value: 30 * time.Minute
    name: DefaultMaxLifetime
  - doc: |-
      DefaultMaxIdle is the idle-connection ceiling a non-positive
      [PoolConfig.MaxIdle] clamps to — the same value database/sql itself uses, so
      the clamp changes nothing a caller could have observed.
    items:
      - name: DefaultMaxIdle
        type: int
        value: "2"
    name: DefaultMaxIdle
  - doc: |-
      DefaultCheckTimeout is the liveness-probe budget a non-positive
      [Config.CheckTimeout] clamps to. A health check that can hang forever is
      not a health check.
    items:
      - name: DefaultCheckTimeout
        type: time.Duration
        value: 5 * time.Second
    name: DefaultCheckTimeout
  - doc: |-
      savepointPrefix names every savepoint this package creates. It is a fixed
      SDK-owned prefix so a savepoint in a database log is attributable, and so a
      caller's own savepoints (if they issue any by hand) cannot collide with the
      runner's.
    items:
      - name: savepointPrefix
        type: string
        value: "\"ktn_sp_\""
    name: savepointPrefix
  - doc: decimalBase is the radix used when rendering counters into identifiers.
    items:
      - name: decimalBase
        type: int
        value: "10"
    name: decimalBase
  - doc: |-
      directionUp / directionDown label a migration failure so the error says
      which way the schema was moving when it broke.
    grouped: true
    items:
      - name: directionUp
        type: string
        value: "\"up\""
      - name: directionDown
        type: string
        value: "\"down\""
    name: directionUp
  - doc: |-
      DefaultVersionTable is the table an empty [MigrateConfig.VersionTable]
      clamps to. The name matches the de-facto convention of every migration tool
      in the ecosystem, so an operator inspecting a database recognises it without
      being told.
    items:
      - name: DefaultVersionTable
        type: string
        value: "\"schema_migrations\""
    name: DefaultVersionTable
  - doc: |-
      DefaultLockTimeout is the migration-lock budget a non-positive
      [MigrateConfig.LockTimeout] clamps to.

      A migration run that waits forever for another holder is a deployment that
      hangs with no output, which is strictly worse than one that fails and says
      why. Two minutes is longer than almost every migration and shorter than
      every deployment timeout that would otherwise kill the pod first.
    items:
      - name: DefaultLockTimeout
        type: time.Duration
        value: 2 * time.Minute
    name: DefaultLockTimeout
  - doc: |-
      DefaultLockRetryInterval is how often a blocked runner retries the
      non-blocking lock acquisition. A non-positive
      [MigrateConfig.LockRetryInterval] clamps to it.
    items:
      - name: DefaultLockRetryInterval
        type: time.Duration
        value: 250 * time.Millisecond
    name: DefaultLockRetryInterval
  - doc: |-
      commitPhase labels a SQLite run whose final COMMIT failed: every migration
      the run applied is undone with it, so the database is where it was.
    items:
      - name: commitPhase
        type: string
        value: "\"commit\""
    name: commitPhase
  - doc: |-
      lockPhase labels every error raised while taking or releasing the migration
      lock, so a failed run says which phase it died in.
    items:
      - name: lockPhase
        type: string
        value: "\"lock\""
    name: lockPhase
  - doc: |-
      tablePhase labels every error raised while reading or writing the version
      table, so a failed run says which phase it died in.
    items:
      - name: tablePhase
        type: string
        value: "\"version-table\""
    name: tablePhase
  - doc: |-
      The bind positions of the version row's three columns, 1-based as every
      supported placeholder grammar counts them. Named because a bare 2 and 3 in
      an INSERT are exactly the literals a column reorder silently invalidates.
    grouped: true
    items:
      - comment: "1"
        name: bindVersion
        type: int
        value: iota + 1
      - comment: "2"
        name: bindName
      - comment: "3"
        name: bindAppliedAt
    name: bindVersion
  - doc: |-
      rootScope identifies the scope of a root transaction. A savepoint scope is
      identified by its savepoint counter, which starts at one, so zero is free
      for the root and sorts before every scope opened inside it.
    items:
      - name: rootScope
        type: uint64
        value: "0"
    name: rootScope
