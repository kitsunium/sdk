        to: s.inner.Close
  - of: (*observedStmt).NumInput
    participants:
      - id: caller
        kind: actor
      - id: (*observedStmt).NumInput
        kind: self
      - id: s.inner.NumInput
        kind: value
    steps:
      - return: s.inner.NumInput()
        to: s.inner.NumInput
  - of: (*observedStmt).Exec
    participants:
      - id: caller
        kind: actor
      - id: (*observedStmt).Exec
        kind: self
      - id: s.ExecContext
        kind: internal
    steps:
      - return: s.ExecContext(context.Background(), named(args))
        to: s.ExecContext
  - of: (*observedStmt).Query
    participants:
      - id: caller
