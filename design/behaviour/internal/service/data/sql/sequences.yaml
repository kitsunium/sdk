      - eval: end(affected(result, err), err)
      - return: result, err
  - of: (*observedStmt).QueryContext
    participants:
      - id: caller
        kind: actor
      - id: (*observedStmt).QueryContext
        kind: self
      - id: s.conn.obs.Begin
        kind: value
      - id: queryer.QueryContext
        kind: value
      - id: s.inner.Query
        kind: value
    steps:
      - bind: end
        eval: s.conn.obs.Begin(ctx, coresql.StatementQuery, s.query)
        to: s.conn.obs.Begin
      - var:
          name: rows
          type: driver.Rows
      - var:
          name: err
