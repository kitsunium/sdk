                init:
                  bind: err
                  eval: m.revertOne(ctx, migration)
                  to: m.revertOne
                when: err != nil
          key: _
          range: slices.Backward(m.plan.migrations)
          value: migration
      - return: nil
  - of: (*migrator).assertNoUnknown
    participants:
      - id: caller
        kind: actor
      - id: (*migrator).assertNoUnknown
        kind: self
      - id: slices
        kind: stdlib
      - id: kerrs
        kind: package
    steps:
      - bind: known
        eval: make(map[uint64]bool, len(m.plan.migrations))
      - loop:
          do:
            - set: known[migration.Version]
              value: "true"
          key: _
          range: m.plan.migrations
          value: migration
      - bind: remaining
        eval: slices.Sorted(maps.Keys(applied))
        to: slices
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: version <= target || known[version]
            - return: |-
                kerrs.Wrap(coresql.MigrationUnknownVersion, kerrs.WrapParams{},
                			kerrs.String("version", strconv.FormatUint(version, decimalBase)))
              to: kerrs
          key: _
          range: remaining
          value: version
      - return: nil
  - of: (*migrator).applyOne
    participants:
      - id: caller
        kind: actor
      - id: (*migrator).applyOne
        kind: self
      - id: m.tx.Transact
        kind: internal
      - id: failed
        kind: internal
    steps:
      - bind: err
        eval: |-
          m.tx.Transact(ctx, coresql.TxOptionsValue{}, func(txCtx context.Context, ex coresql.Executor) error {
          		//: the step runs on the SAME executor as the bookkeeping row, which
          		//: is what makes the two commit together on a transactional-DDL
          		//: engine — see the package CLAUDE.md for the MySQL caveat.
          		if stepErr := migration.Up(txCtx, ex); stepErr != nil {
          			//: verbatim, so the caller's errors.Is still answers.
          			return stepErr
          		}
          		//: the version row is written by the same transaction it describes.
          		return m.record(txCtx, ex, migration)
          	})
        to: m.tx.Transact
      - opt:
          do:
            - return: failed(coresql.MigrationFailed, err, versionField(migration), directionField(directionUp))
              to: failed
          when: err != nil
      - return: nil
  - of: (*migrator).revertOne
    participants:
      - id: caller
        kind: actor
      - id: (*migrator).revertOne
        kind: self
      - id: m.tx.Transact
        kind: internal
      - id: failed
        kind: internal
    steps:
      - bind: err
        eval: |-
          m.tx.Transact(ctx, coresql.TxOptionsValue{}, func(txCtx context.Context, ex coresql.Executor) error {
          		//: an Irreversible step fails here, with the caller's own declaration.
          		if stepErr := migration.Down(txCtx, ex); stepErr != nil {
          			//: verbatim, so errs.HasCode(err, CodeMigrationIrreversible) works.
          			return stepErr
          		}
          		//: the version row is removed by the same transaction that undid it.
          		return m.forget(txCtx, ex, migration)
          	})
        to: m.tx.Transact
      - opt:
          do:
            - return: failed(coresql.MigrationFailed, err, versionField(migration), directionField(directionDown))
              to: failed
          when: err != nil
      - return: nil
  - of: versionField
    participants:
      - id: caller
        kind: actor
      - id: versionField
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: kerrs.String("version", strconv.FormatUint(migration.Version, decimalBase))
        to: kerrs
  - of: directionField
    participants:
      - id: caller
        kind: actor
      - id: directionField
        kind: self
      - id: kerrs
        kind: package
    steps:
      - return: kerrs.String("direction", direction)
        to: kerrs
  - of: identStart
    steps:
      - return: c == '_' || 'a' <= c && c <= 'z' || 'A' <= c && c <= 'Z'
  - of: MigrateConfig.resolve
    participants:
      - id: caller
        kind: actor
      - id: MigrateConfig.resolve
        kind: self
      - id: m.resolvedTable
        kind: internal
      - id: slices
        kind: stdlib
      - id: validateSet
        kind: internal
    steps:
      - bind: table, err
        eval: m.resolvedTable()
        to: m.resolvedTable
      - opt:
          do:
            - return: migratePlan{}, err
          when: err != nil
      - bind: sorted
        eval: slices.Clone(m.Migrations)
        to: slices
      - eval: |-
          slices.SortFunc(sorted, func(a, b coresql.MigrationValue) int {
          		//: cmp.Compare on uint64 without converting to a signed type.
          		return compareVersions(a.Version, b.Version)
          	})
        to: slices
      - opt:
          do:
            - return: migratePlan{}, verr
          init:
            bind: verr
            eval: validateSet(sorted)
            to: validateSet
          when: verr != nil
      - return: |-
          migratePlan{
          		migrations: sorted, table: table,
          		lockBudget: m.lockBudget(), retry: m.retryInterval(),
          		checksums: slices.ContainsFunc(sorted, func(mv coresql.MigrationValue) bool { return mv.Checksum != "" }),
          	}, nil
  - of: MigrateConfig.resolvedTable
    steps:
      - bind: name
        eval: m.VersionTable
      - opt:
          do:
            - set: name
              value: DefaultVersionTable
          when: name == ""
      - opt:
          do:
            - return: "\"\", kerrs.Wrap(coresql.VersionTableInvalid, kerrs.WrapParams{}, kerrs.String(\"table\", name))"
          when: "!isIdentifier(name)"
      - return: name, nil
  - of: MigrateConfig.lockBudget
    steps:
      - opt:
          do:
            - return: DefaultLockTimeout
          when: m.LockTimeout <= 0
      - return: m.LockTimeout
  - of: MigrateConfig.retryInterval
    steps:
      - opt:
          do:
            - return: DefaultLockRetryInterval
          when: m.LockRetryInterval <= 0
      - return: m.LockRetryInterval
  - of: compareVersions
    steps:
      - opt:
          do:
            - return: "-1"
          when: a < b
      - opt:
          do:
            - return: "1"
          when: a > b
      - return: "0"
  - of: validateSet
    participants:
      - id: caller
        kind: actor
      - id: validateSet
        kind: self
      - id: migration.Validate
        kind: value
      - id: kerrs
        kind: package
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: migration.Validate()
                  to: migration.Validate
                when: err != nil
            - opt:
                do:
                  - continue: true
                when: index == 0
            - opt:
                do:
                  - return: |-
                      kerrs.Wrap(coresql.DuplicateMigration, kerrs.WrapParams{},
                      				kerrs.String("version", strconv.FormatUint(migration.Version, decimalBase)))
                    to: kerrs
                when: sorted[index-1].Version == migration.Version
          key: index
          range: sorted
          value: migration
      - return: nil
  - of: (*migrator).underFileLock
    participants:
      - id: caller
        kind: actor
      - id: (*migrator).underFileLock
        kind: self
      - id: m.cfg.clk.Now().Add
        kind: value
      - id: m.fileLockedRun
        kind: internal
      - id: m.pause
        kind: internal
    steps:
      - bind: deadline
        eval: m.cfg.clk.Now().Add(m.plan.lockBudget)
        to: m.cfg.clk.Now().Add
      - loop:
          do:
            - bind: busy, err
              eval: m.fileLockedRun(ctx, work)
              to: m.fileLockedRun
            - opt:
                do:
                  - return: err
                when: "!busy"
            - opt:
                do:
                  - return: pauseErr
                init:
                  bind: pauseErr
                  eval: m.pause(ctx, deadline)
                  to: m.pause
                when: pauseErr != nil
          forever: true
  - of: (*migrator).fileLockedRun
    participants:
      - id: caller
        kind: actor
      - id: (*migrator).fileLockedRun
        kind: self
      - id: m.tx.Transact
        kind: internal
    steps:
      - var:
          name: outcome
          type: error
      - bind: began
        eval: "false"
      - set: err
        to: m.tx.Transact
        value: |-
          m.tx.Transact(ctx, coresql.TxOptionsValue{}, func(txCtx context.Context, ex coresql.Executor) error {
          		began = true
          		//: nothing runs before the lock is held.
          		if lockErr := m.takeFileLock(txCtx, ex); lockErr != nil {
          			busy = lockBusy(lockErr)
          			//: rolled back either way; a real failure also names its phase.
          			return failed(coresql.MigrationFailed, lockErr, kerrs.String("phase", lockPhase))
          		}
          		//: every migration runs in its own savepoint of this transaction.
          		outcome = work(txCtx)
          		//: COMMIT what applied, even when a later migration failed: the one
          		//: that failed has already rolled back to its own savepoint.
          		return nil
          	})
      - opt:
          do:
            - set: busy
              value: "true"
          when: "!began && err != nil && lockBusy(err)"
      - opt:
          do:
            - opt:
                do:
                  - return: false, err
                when: kerrs.HasCode(err, coresql.CodeRollbackFailed)
            - return: true, nil
          when: busy
      - return: false, errors.Join(outcome, runPhase(err, began, outcome))
  - of: runPhase
    participants:
      - id: caller
        kind: actor
      - id: runPhase
        kind: self
      - id: failed
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          when: err == nil || kerrs.HasCode(err, coresql.CodeMigrationFailed)
      - opt:
          do:
            - return: failed(coresql.MigrationFailed, err, kerrs.String("phase", lockPhase))
              to: failed
          when: "!began"
      - opt:
          do:
            - return: err
          when: outcome != nil
      - return: failed(coresql.MigrationFailed, err, kerrs.String("phase", commitPhase))
        to: failed
  - of: (*migrator).takeFileLock
    participants:
      - id: caller
        kind: actor
      - id: (*migrator).takeFileLock
        kind: self
      - id: ex.ExecContext
        kind: value
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: _, err
            eval: ex.ExecContext(ctx, createTableSQL(m.plan.table, m.plan.checksums))
            to: ex.ExecContext
          when: err != nil
      - bind: _, err
        eval: ex.ExecContext(ctx, FileLockSQL(m.plan.table))
        to: ex.ExecContext
      - return: err
  - of: lockBusy
    participants:
      - id: caller
        kind: actor
      - id: lockBusy
        kind: self
      - id: err.Error
        kind: value
    steps:
      - opt:
          do:
            - return: "false"
          when: errors.Is(err, context.Canceled) || errors.Is(err, context.DeadlineExceeded)
      - bind: text
        eval: err.Error()
        to: err.Error
      - loop:
          do:
            - opt:
                do:
                  - return: "true"
                when: strings.Contains(text, marker)
          key: _
          range: busyMarkers
          value: marker
      - return: "false"
  - of: (*migrator).acquire
    participants:
      - id: caller
        kind: actor
      - id: (*migrator).acquire
        kind: self
      - id: m.cfg.db.Conn
        kind: value
      - id: m.waitForLock
        kind: internal
    steps:
      - bind: conn, err
        eval: m.cfg.db.Conn(ctx)
        to: m.cfg.db.Conn
      - opt:
          do:
            - return: nil, failed(coresql.MigrationFailed, err, kerrs.String("phase", lockPhase))
          when: err != nil
      - set: held, err
        to: m.waitForLock
        value: m.waitForLock(ctx, conn)
      - opt:
          do:
            - return: nil, errors.Join(err, closeVerdict(conn))
          when: err != nil
      - return: held, nil
  - of: (*migrator).waitForLock
    participants:
      - id: caller
        kind: actor
      - id: (*migrator).waitForLock
        kind: self
      - id: tryLockSQL
        kind: internal
      - id: unlockSQL
        kind: internal
      - id: m.cfg.clk.Now().Add
        kind: value
      - id: tryOnce
        kind: internal
      - id: m.pause
        kind: internal
    steps:
      - bind: query, arg
        eval: tryLockSQL(m.cfg.dialect, m.plan.table)
        to: tryLockSQL
      - bind: release, releaseArg
        eval: unlockSQL(m.cfg.dialect, m.plan.table)
        to: unlockSQL
      - bind: deadline
        eval: m.cfg.clk.Now().Add(m.plan.lockBudget)
        to: m.cfg.clk.Now().Add
      - loop:
          do:
            - bind: granted, err
              eval: tryOnce(ctx, conn, query, arg)
              to: tryOnce
            - opt:
                do:
                  - return: nil, failed(coresql.MigrationFailed, err, kerrs.String("phase", lockPhase))
                when: err != nil
            - opt:
                do:
                  - return: "&advisoryLock{conn: conn, query: release, arg: releaseArg}, nil"
                when: granted
            - opt:
                do:
                  - return: nil, err
                init:
                  bind: err
                  eval: m.pause(ctx, deadline)
                  to: m.pause
                when: err != nil
          forever: true
  - of: (*migrator).pause
    participants:
      - id: caller
        kind: actor
      - id: (*migrator).pause
        kind: self
      - id: failed
        kind: internal
    steps:
      - opt:
          do:
            - return: failed(coresql.MigrationLockTimeout, nil)
              to: failed
          when: "!m.cfg.clk.Now().Before(deadline)"
      - select:
          cases:
            - comm: <-ctx.Done()
              do:
                - return: failed(coresql.MigrationFailed, ctx.Err(), kerrs.String("phase", lockPhase))
                  to: failed
            - comm: <-m.cfg.clk.After(m.plan.retry)
              do:
                - return: nil
  - of: tryOnce
    participants:
      - id: caller
        kind: actor
      - id: tryOnce
        kind: self
      - id: conn.QueryRowContext(ctx, query, arg).Scan
        kind: value
      - id: lockGranted
        kind: internal
    steps:
      - var:
          name: answer
          type: any
      - set: err
        to: conn.QueryRowContext(ctx, query, arg).Scan
        value: conn.QueryRowContext(ctx, query, arg).Scan(&answer)
      - opt:
          do:
            - return: false, err
          when: err != nil
      - return: lockGranted(answer), nil
        to: lockGranted
  - of: lockGranted
    steps:
      - typeswitch:
          bind: value
          cases:
            - do:
                - return: value
              types: bool
            - do:
                - return: value == 1
              types: int64
            - do:
                - return: string(value) == "1"
              types: "[]byte"
            - do:
                - return: value == "1"
              types: string
            - default: true
              do:
                - return: "false"
          "on": answer
  - of: (*advisoryLock).release
    participants:
      - id: caller
        kind: actor
      - id: (*advisoryLock).release
        kind: self
      - id: l.conn.ExecContext
        kind: value
      - id: errors
        kind: stdlib
    steps:
      - bind: _, unlockErr
        eval: l.conn.ExecContext(cleanup(ctx), l.query, l.arg)
        to: l.conn.ExecContext
      - return: errors.Join(unlockErr, closeVerdict(l.conn))
        to: errors
  - of: closeVerdict
    participants:
      - id: caller
        kind: actor
      - id: closeVerdict
        kind: self
      - id: conn.Close
        kind: value
      - id: failed
        kind: internal
    steps:
      - bind: err
        eval: conn.Close()
        to: conn.Close
      - opt:
          do:
            - return: nil
          when: err == nil
      - return: failed(coresql.MigrationFailed, err, kerrs.String("phase", lockPhase))
        to: failed
  - of: createTableSQL
    steps:
      - bind: columns
        eval: "\"version BIGINT NOT NULL PRIMARY KEY, name TEXT NOT NULL, applied_at_unix BIGINT NOT NULL\""
      - opt:
          do:
            - op: +=
              set: columns
              value: "\", checksum TEXT\""
          when: checksums
      - return: "\"CREATE TABLE IF NOT EXISTS \" + table + \" (\" + columns + \")\""
  - of: checksumProbeSQL
    steps:
      - return: "\"SELECT checksum FROM \" + table + \" WHERE 1 = 0\""
  - of: addChecksumSQL
    steps:
      - return: "\"ALTER TABLE \" + table + \" ADD COLUMN checksum TEXT\""
  - of: (*migrator).ensureTable
    participants:
      - id: caller
        kind: actor
      - id: (*migrator).ensureTable
        kind: self
      - id: m.tx.Join
        kind: internal
      - id: ex.ExecContext
        kind: value
      - id: failed
        kind: internal
    steps:
      - bind: ex, _
        eval: m.tx.Join(ctx)
        to: m.tx.Join
      - bind: _, err
        eval: ex.ExecContext(ctx, createTableSQL(m.plan.table, m.plan.checksums))
        to: ex.ExecContext
      - opt:
          do:
            - return: failed(coresql.MigrationFailed, err, kerrs.String("phase", tablePhase))
              to: failed
          when: err != nil
      - opt:
          do:
            - return: nil
          when: "!m.plan.checksums || !locked || m.hasChecksumColumn(ctx)"
      - set: _, err
        to: ex.ExecContext
        value: ex.ExecContext(ctx, addChecksumSQL(m.plan.table))
      - opt:
          do:
            - return: failed(coresql.MigrationFailed, err, kerrs.String("phase", tablePhase))
              to: failed
          when: err != nil
      - return: nil
  - of: (*migrator).hasChecksumColumn
    participants:
      - id: caller
        kind: actor
      - id: (*migrator).hasChecksumColumn
        kind: self
      - id: m.tx.Join
        kind: internal
      - id: ex.QueryContext
        kind: value
    steps:
      - bind: ex, _
        eval: m.tx.Join(ctx)
        to: m.tx.Join
      - bind: rows, err
        eval: ex.QueryContext(ctx, checksumProbeSQL(m.plan.table))
        to: ex.QueryContext
      - opt:
          do:
            - return: "false"
          when: err != nil
      - return: rows.Close() == nil
  - of: (*migrator).applied
    participants:
      - id: caller
        kind: actor
      - id: (*migrator).applied
        kind: self
      - id: m.verified
        kind: internal
      - id: m.tx.Join
        kind: internal
      - id: ex.QueryContext
        kind: value
      - id: scanVersions
        kind: internal
    steps:
      - opt:
          do:
            - return: m.verified(ctx, locked, direction)
              to: m.verified
          when: m.plan.checksums && (locked || m.hasChecksumColumn(ctx))
      - bind: ex, _
        eval: m.tx.Join(ctx)
        to: m.tx.Join
      - bind: rows, err
        eval: ex.QueryContext(ctx, "SELECT version FROM "+m.plan.table+" ORDER BY version")
        to: ex.QueryContext
      - opt:
          do:
            - return: nil, 0, failed(coresql.MigrationFailed, err, kerrs.String("phase", tablePhase))
          when: err != nil
      - defer: |-
          func() {
          		//: a close error after a successful scan still invalidates the read.
          		if cerr := rows.Close(); cerr != nil && err == nil {
          			//: the driver's error travels beside the verdict.
          			err = failed(coresql.MigrationFailed, cerr, kerrs.String("phase", tablePhase))
          		}
          	}()
      - return: scanVersions(rows)
        to: scanVersions
  - of: (*migrator).verified
    participants:
      - id: caller
        kind: actor
      - id: (*migrator).verified
        kind: self
      - id: m.recordedChecksums
        kind: internal
      - id: m.compareChecksums
        kind: internal
      - id: m.backfill
        kind: internal
    steps:
      - bind: sums, highest, err
        eval: m.recordedChecksums(ctx)
        to: m.recordedChecksums
      - opt:
          do:
            - return: nil, 0, err
          when: err != nil
      - bind: missing, changed
        eval: m.compareChecksums(sums, direction)
        to: m.compareChecksums
      - opt:
          do:
            - return: nil, 0, changed
          when: changed != nil
      - opt:
          do:
            - opt:
                do:
                  - return: nil, 0, err
                init:
                  bind: err
                  eval: m.backfill(ctx, missing)
                  to: m.backfill
                when: err != nil
          when: locked
      - set: versions
        value: make(map[uint64]bool, len(sums))
      - loop:
          do:
            - set: versions[version]
              value: "true"
          key: version
          range: sums
      - return: versions, highest, nil
  - of: (*migrator).recordedChecksums
    participants:
      - id: caller
        kind: actor
      - id: (*migrator).recordedChecksums
        kind: self
      - id: m.tx.Join
        kind: internal
      - id: ex.QueryContext
        kind: value
      - id: rows.Scan
        kind: value
      - id: rows.Err
        kind: value
    steps:
      - bind: ex, _
        eval: m.tx.Join(ctx)
        to: m.tx.Join
      - bind: rows, err
        eval: ex.QueryContext(ctx, "SELECT version, checksum FROM "+m.plan.table+" ORDER BY version")
        to: ex.QueryContext
      - opt:
          do:
            - return: nil, 0, failed(coresql.MigrationFailed, err, kerrs.String("phase", tablePhase))
          when: err != nil
      - defer: |-
          func() {
          		//: a close error after a successful scan still invalidates the read.
          		if cerr := rows.Close(); cerr != nil && err == nil {
          			//: the driver's error travels beside the verdict.
          			err = failed(coresql.MigrationFailed, cerr, kerrs.String("phase", tablePhase))
          		}
          	}()
      - set: sums
        value: make(map[uint64]stdsql.NullString)
      - loop:
          cond: rows.Next()
          do:
            - var:
                name: recorded
                type: int64
            - var:
                name: sum
                type: stdsql.NullString
            - opt:
                do:
                  - return: nil, 0, failed(coresql.MigrationFailed, serr, kerrs.String("phase", tablePhase))
                init:
                  bind: serr
                  eval: rows.Scan(&recorded, &sum)
                  to: rows.Scan
                when: serr != nil
            - opt:
                do:
                  - return: |-
                      nil, 0, failed(coresql.MigrationFailed, nil,
                      				kerrs.String("phase", tablePhase), kerrs.Int64("version", recorded))
                when: recorded < 0
            - set: sums[uint64(recorded)]
              value: sum
            - set: highest
              value: max(highest, uint64(recorded))
      - opt:
          do:
            - return: nil, 0, failed(coresql.MigrationFailed, rerr, kerrs.String("phase", tablePhase))
          init:
            bind: rerr
            eval: rows.Err()
            to: rows.Err
          when: rerr != nil
      - return: sums, highest, nil
  - of: (*migrator).backfill
    participants:
      - id: caller
        kind: actor
      - id: (*migrator).backfill
        kind: self
      - id: m.tx.Join
        kind: internal
      - id: ex.ExecContext
        kind: value
      - id: failed
        kind: internal
    steps:
      - bind: ex, _
        eval: m.tx.Join(ctx)
        to: m.tx.Join
      - bind: query
        eval: |-
          "UPDATE " + m.plan.table + " SET checksum = " + m.cfg.dialect.Placeholder(bindBackfillChecksum) +
          		" WHERE version = " + m.cfg.dialect.Placeholder(bindBackfillVersion) + " AND checksum IS NULL"
      - loop:
          do:
            - opt:
                do:
                  - return: failed(coresql.MigrationFailed, err, kerrs.String("phase", tablePhase), versionField(migration))
                    to: failed
                init:
                  bind: _, err
                  eval: ex.ExecContext(ctx, query, migration.Checksum, int64(migration.Version))
                  to: ex.ExecContext
                when: err != nil
          key: _
          range: missing
          value: migration
      - return: nil
  - of: checksumArg
    steps:
      - opt:
          do:
            - return: nil
          when: sum == ""
      - return: sum
  - of: (*migrator).record
    participants:
      - id: caller
        kind: actor
      - id: (*migrator).record
        kind: self
      - id: ex.ExecContext
        kind: value
    steps:
      - opt:
          do:
            - bind: query
              eval: |-
                "INSERT INTO " + m.plan.table + " (version, name, applied_at_unix, checksum) VALUES (" +
                			m.cfg.dialect.Placeholder(bindVersion) + ", " + m.cfg.dialect.Placeholder(bindName) + ", " +
                			m.cfg.dialect.Placeholder(bindAppliedAt) + ", " + m.cfg.dialect.Placeholder(bindChecksum) + ")"
            - bind: _, err
              eval: |-
                ex.ExecContext(ctx, query,
                			int64(migration.Version), migration.Name, m.cfg.clk.Now().Unix(), checksumArg(migration.Checksum))
              to: ex.ExecContext
            - return: err
          when: m.plan.checksums
      - bind: query
        eval: |-
          "INSERT INTO " + m.plan.table + " (version, name, applied_at_unix) VALUES (" +
          		m.cfg.dialect.Placeholder(bindVersion) + ", " + m.cfg.dialect.Placeholder(bindName) + ", " +
          		m.cfg.dialect.Placeholder(bindAppliedAt) + ")"
      - bind: _, err
        eval: |-
          ex.ExecContext(ctx, query,
          		int64(migration.Version), migration.Name, m.cfg.clk.Now().Unix())
        to: ex.ExecContext
      - return: err
  - of: (*migrator).forget
    participants:
      - id: caller
        kind: actor
      - id: (*migrator).forget
        kind: self
      - id: ex.ExecContext
        kind: value
    steps:
      - bind: query
        eval: "\"DELETE FROM \" + m.plan.table + \" WHERE version = \" + m.cfg.dialect.Placeholder(bindVersion)"
      - bind: _, err
        eval: ex.ExecContext(ctx, query, int64(migration.Version))
        to: ex.ExecContext
      - return: err
  - of: scanVersions
    participants:
      - id: caller
        kind: actor
      - id: scanVersions
        kind: self
      - id: rows.Scan
        kind: value
      - id: rows.Err
        kind: value
    steps:
      - set: versions
        value: make(map[uint64]bool)
      - loop:
          cond: rows.Next()
          do:
            - var:
                name: recorded
                type: int64
            - opt:
                do:
                  - return: nil, 0, failed(coresql.MigrationFailed, serr, kerrs.String("phase", tablePhase))
                init:
                  bind: serr
                  eval: rows.Scan(&recorded)
                  to: rows.Scan
                when: serr != nil
            - opt:
                do:
                  - return: |-
                      nil, 0, failed(coresql.MigrationFailed, nil,
                      				kerrs.String("phase", tablePhase), kerrs.Int64("version", recorded))
                when: recorded < 0
            - bind: version
              eval: uint64(recorded)
            - set: versions[version]
              value: "true"
            - opt:
                do:
                  - set: highest
                    value: version
                when: version > highest
      - opt:
          do:
            - return: nil, 0, failed(coresql.MigrationFailed, rerr, kerrs.String("phase", tablePhase))
          init:
            bind: rerr
            eval: rows.Err()
            to: rows.Err
          when: rerr != nil
      - return: versions, highest, nil
  - of: Observe
    steps:
      - opt:
          do:
            - return: c
          when: obs == nil
      - return: "&observedConnector{inner: c, obs: obs}"
  - of: bounded
    steps:
      - opt:
          do:
            - return: query
          when: len(query) <= MaxObservedQuery
      - bind: cut
        eval: MaxObservedQuery
      - loop:
          cond: cut > 0 && !utf8.RuneStart(query[cut])
          do:
            - op: "--"
              set: cut
      - return: query[:cut]
