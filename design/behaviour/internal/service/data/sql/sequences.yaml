      - bind: end
        eval: c.obs.Begin(ctx, coresql.StatementExec, bounded(query))
        to: c.obs.Begin
      - bind: result, err
        eval: execer.ExecContext(ctx, query, args)
        to: execer.ExecContext
      - eval: end(affected(result, err), err)
      - return: result, err
  - of: (*observedConn).QueryContext
    participants:
      - id: caller
