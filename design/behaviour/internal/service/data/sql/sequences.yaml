            eval: c.inner.(driver.Validator)
          when: ok
      - return: "true"
  - of: (*observedConn).CheckNamedValue
    participants:
      - id: caller
        kind: actor
      - id: (*observedConn).CheckNamedValue
        kind: self
      - id: checker.CheckNamedValue
