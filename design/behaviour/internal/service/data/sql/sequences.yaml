      - return: "&observedRows{inner: rows, end: end}, nil"
  - of: (*observedStmt).CheckNamedValue
    participants:
      - id: caller
        kind: actor
      - id: (*observedStmt).CheckNamedValue
        kind: self
      - id: checker.CheckNamedValue
        kind: value
      - id: s.conn.CheckNamedValue
        kind: internal
    steps:
      - opt:
          do:
            - return: checker.CheckNamedValue(value)
              to: checker.CheckNamedValue
          init:
            bind: checker, ok
            eval: s.inner.(driver.NamedValueChecker)
          when: ok
      - return: s.conn.CheckNamedValue(value)
        to: s.conn.CheckNamedValue
  - of: (*observedTx).Commit
    participants:
      - id: caller
        kind: actor
      - id: (*observedTx).Commit
        kind: self
      - id: t.obs.Begin
        kind: value
      - id: t.inner.Commit
        kind: value
    steps:
      - bind: end
        eval: t.obs.Begin(t.ctx, coresql.StatementCommit, textCommit)
        to: t.obs.Begin
      - bind: err
        eval: t.inner.Commit()
        to: t.inner.Commit
      - eval: end(0, err)
      - return: err
  - of: (*observedTx).Rollback
    participants:
      - id: caller
        kind: actor
      - id: (*observedTx).Rollback
        kind: self
      - id: t.obs.Begin
        kind: value
      - id: t.inner.Rollback
        kind: value
    steps:
      - bind: end
        eval: t.obs.Begin(t.ctx, coresql.StatementRollback, textRollback)
        to: t.obs.Begin
      - bind: err
        eval: t.inner.Rollback()
        to: t.inner.Rollback
      - eval: end(0, err)
      - return: err
  - of: (*observedRows).Columns
    participants:
      - id: caller
        kind: actor
      - id: (*observedRows).Columns
        kind: self
      - id: r.inner.Columns
        kind: value
    steps:
      - return: r.inner.Columns()
        to: r.inner.Columns
  - of: (*observedRows).Next
    participants:
      - id: caller
        kind: actor
      - id: (*observedRows).Next
        kind: self
      - id: r.inner.Next
        kind: value
    steps:
      - bind: err
        eval: r.inner.Next(dest)
        to: r.inner.Next
      - opt:
          do:
            - op: ++
              set: r.read
            - return: nil
          when: err == nil
      - opt:
          do:
            - set: r.failed
              value: err
          when: "!errors.Is(err, io.EOF) && r.failed == nil"
      - return: err
  - of: (*observedRows).Close
    participants:
      - id: caller
        kind: actor
      - id: (*observedRows).Close
        kind: self
      - id: r.inner.Close
        kind: value
    steps:
      - bind: err
        eval: r.inner.Close()
        to: r.inner.Close
      - opt:
          do:
            - set: r.told
              value: "true"
            - eval: r.end(r.read, errors.Join(r.failed, err))
          when: "!r.told"
      - return: err
  - of: affected
    participants:
      - id: caller
        kind: actor
      - id: affected
        kind: self
      - id: result.RowsAffected
        kind: value
    steps:
      - opt:
          do:
            - return: "0"
          when: err != nil || result == nil
      - bind: n, countErr
        eval: result.RowsAffected()
        to: result.RowsAffected
      - opt:
          do:
            - return: "0"
          when: countErr != nil
      - return: "n"
  - of: named
    steps:
      - bind: out
        eval: make([]driver.NamedValue, len(args))
      - loop:
          do:
            - set: out[i]
              value: "driver.NamedValue{Ordinal: i + 1, Value: arg}"
          key: i
          range: args
          value: arg
      - return: out
  - of: values
    steps:
      - bind: out
        eval: make([]driver.Value, len(args))
      - loop:
          do:
            - set: out[i]
              value: arg.Value
          key: i
          range: args
          value: arg
      - return: out
  - of: SlowQueries
    steps:
      - opt:
          do:
            - set: clk
              value: clock.System
          when: clk == nil
      - return: "slowQueries{threshold: threshold, log: log, clk: clk}"
  - of: slowQueries.Begin
    participants:
      - id: caller
        kind: actor
      - id: slowQueries.Begin
        kind: self
      - id: s.clk.Now
        kind: value
      - id: s.clk.Since
        kind: value
      - id: s.log.Log
        kind: value
    steps:
      - bind: start
        eval: s.clk.Now()
        to: s.clk.Now
      - return:
          closure:
            params: rows int64, err error
            steps:
              - bind: took
                eval: s.clk.Since(start)
                to: s.clk.Since
              - opt:
                  do:
                    - return: ""
                  when: took < s.threshold || errors.Is(err, driver.ErrSkip) || s.log == nil || !s.log.Enabled(ctx, level.Warn)
              - bind: attrs
                eval: |-
                  []corelogger.AttrValue{
                  			{Key: "kind", Value: corelogger.StringValue(kind.String())},
                  			{Key: "query", Value: corelogger.StringValue(query)},
                  			{Key: "duration", Value: corelogger.DurationValue(took)},
                  			{Key: "rows", Value: corelogger.Int64Value(rows)},
                  		}
              - opt:
                  do:
                    - set: attrs
                      value: "append(attrs, corelogger.AttrValue{Key: \"error\", Value: corelogger.StringValue(NewWithheld(err).Error())})"
                  when: err != nil
              - eval: "s.log.Log(ctx, level.Warn, \"sql: a slow statement\", attrs...)"
                to: s.log.Log
  - of: Traced
    steps:
      - return: "traced{tracer: tracer}"
  - of: traced.Begin
    participants:
      - id: caller
        kind: actor
      - id: traced.Begin
        kind: self
      - id: t.tracer.Start
        kind: value
      - id: span.SetAttrs
        kind: value
      - id: span.SetStatus
        kind: value
      - id: span.End
        kind: value
    steps:
      - bind: _, span
        eval: |-
          t.tracer.Start(ctx, "sql "+kind.String(), coretrace.SpanParams{
          		Kind:  coretrace.SpanKindClient,
          		Attrs: []coreotel.AttrValue{coreotel.String("db.query.text", query)},
          	})
        to: t.tracer.Start
      - return:
          closure:
            params: rows int64, err error
            steps:
              - eval: span.SetAttrs(coreotel.Int64("db.response.returned_rows", rows))
                to: span.SetAttrs
              - opt:
                  do:
                    - eval: span.SetStatus(coretrace.StatusError, NewWithheld(err).Error())
                      to: span.SetStatus
                  when: err != nil && !errors.Is(err, driver.ErrSkip)
              - eval: span.End()
                to: span.End
  - of: NewRetrying
    steps:
      - opt:
          do:
            - return: nil, kerrs.Wrap(coresql.ConfigInvalid, kerrs.WrapParams{}, kerrs.String("missing", "transactor"))
          when: tm == nil
      - bind: r
        eval: "&retrying{inner: tm, attempts: cfg.attempts(), curve: cfg.curve(), transient: cfg.classifier(), clk: cfg.clock()}"
      - bind: joiner, joins
        eval: tm.(coresql.Joiner)
      - bind: deferrer, defers
        eval: tm.(coresql.Deferrer)
      - bind: aborter, aborts
        eval: tm.(coresql.Aborter)
      - opt:
          do:
            - set: r.joiner, _
              value: tm.(coresql.Joiner)
            - return: r, nil
          when: "!joins || !defers || !aborts"
      - set: r.joiner
        value: joiner
      - return: "&retryingSiblings{retrying: r, Joiner: joiner, Deferrer: deferrer, Aborter: aborter}, nil"
  - of: RetryConfig.attempts
    steps:
      - opt:
          do:
            - return: DefaultRetryAttempts
          when: c.Attempts <= 0
      - return: c.Attempts
  - of: RetryConfig.curve
    steps:
      - opt:
          do:
            - return: "kbackoff.Value{BaseDelay: DefaultRetryDelay, JitterMode: kbackoff.JitterFull}"
          when: c.Backoff == (kbackoff.Value{})
      - return: c.Backoff
  - of: RetryConfig.classifier
    steps:
      - opt:
          do:
            - return: Classify
          when: c.Transient == nil
      - return: c.Transient
  - of: RetryConfig.clock
    steps:
      - opt:
          do:
            - return: clock.System
          when: c.Clock == nil
      - return: c.Clock
  - of: (*retrying).Transact
    participants:
      - id: caller
        kind: actor
      - id: (*retrying).Transact
        kind: self
      - id: r.inner.Transact
        kind: value
      - id: context
        kind: stdlib
      - id: failed
        kind: internal
      - id: r.wait
        kind: internal
      - id: errors
        kind: stdlib
    steps:
      - opt:
          do:
            - return: r.inner.Transact(ctx, opts, fn)
              to: r.inner.Transact
          when: fn == nil || r.nested(ctx)
      - bind: marked
        eval: "context.WithValue(ctx, retryMark{owner: r}, struct{}{})"
        to: context
      - loop:
          do:
            - bind: err
              eval: r.inner.Transact(marked, opts, fn)
              to: r.inner.Transact
            - opt:
                do:
                  - return: err
                when: err == nil || ctx.Err() != nil || !r.retriable(err)
            - opt:
                do:
                  - return: failed(coresql.TxRetriesExhausted, err, kerrs.Int("attempts", attempt))
                    to: failed
                when: attempt >= r.attempts
            - opt:
                do:
                  - return: errors.Join(err, waitErr)
                    to: errors
                init:
                  bind: waitErr
                  eval: r.wait(ctx, attempt)
                  to: r.wait
                when: waitErr != nil
          init: attempt := 1
          post: attempt++
  - of: (*retrying).nested
    participants:
      - id: caller
        kind: actor
      - id: (*retrying).nested
        kind: self
      - id: r.joiner.Join
        kind: value
    steps:
      - opt:
          do:
            - return: "true"
          when: "ctx.Value(retryMark{owner: r}) != nil"
      - opt:
          do:
            - return: "false"
          when: r.joiner == nil
      - bind: _, inTx
        eval: r.joiner.Join(ctx)
        to: r.joiner.Join
      - return: inTx
  - of: (*retrying).retriable
    steps:
      - opt:
          do:
            - return: "false"
          when: errors.Is(err, context.Canceled) || errors.Is(err, context.DeadlineExceeded)
      - return: r.transient(err)
  - of: (*retrying).wait
    participants:
      - id: caller
        kind: actor
      - id: (*retrying).wait
        kind: self
      - id: r.clk.NewTimer
        kind: value
      - id: timer.Stop
        kind: value
      - id: context
        kind: stdlib
    steps:
      - bind: timer
        eval: r.clk.NewTimer(r.curve.Delay(attempt))
        to: r.clk.NewTimer
      - defer: timer.Stop()
        to: timer.Stop
      - select:
          cases:
            - comm: <-timer.C()
              do:
                - return: nil
            - comm: <-ctx.Done()
              do:
                - return: context.Cause(ctx)
                  to: context
  - of: Classify
    participants:
      - id: caller
        kind: actor
      - id: Classify
        kind: self
      - id: anyCause
        kind: internal
    steps:
      - opt:
          do:
            - return: "false"
          when: err == nil || errors.Is(err, context.Canceled) || errors.Is(err, context.DeadlineExceeded)
      - return: anyCause(err, transientCause)
        to: anyCause
  - of: transientCause
    steps:
      - opt:
          do:
            - switch:
                cases:
                  - case: "\"40001\", \"40P01\""
                    do:
                      - return: "true"
                "on": stated.SQLState()
            - return: "false"
          init:
            bind: stated, ok
            eval: err.(interface{ SQLState() string })
          when: ok
      - opt:
          do:
            - switch:
                cases:
                  - case: sqliteBusy, sqliteLocked
                    do:
                      - return: "true"
                "on": coded.Code() & sqlitePrimary
          init:
            bind: coded, ok
            eval: err.(interface{ Code() int })
          when: ok
      - return: "false"
  - of: anyCause
    participants:
      - id: caller
        kind: actor
      - id: anyCause
        kind: self
    steps:
      - opt:
          do:
            - return: "false"
          when: err == nil
      - opt:
          do:
            - return: "true"
          when: match(err)
      - typeswitch:
          bind: unwrapped
          cases:
            - do:
                - loop:
                    do:
                      - opt:
                          do:
                            - return: "true"
                          when: anyCause(cause, match)
                    key: _
                    range: unwrapped.Unwrap()
                    value: cause
              types: interface{ Unwrap() []error }
            - do:
                - return: anyCause(unwrapped.Unwrap(), match)
                  to: anyCause
              types: interface{ Unwrap() error }
          "on": err
      - return: "false"
  - of: Each
    participants:
      - id: caller
        kind: actor
      - id: Each
        kind: self
      - id: yieldFailure
        kind: internal
      - id: firstFailure
        kind: internal
    steps:
      - return:
          closure:
            params: yield func(T, error) bool
            steps:
              - opt:
                  do:
                    - return: ""
                  when: rows == nil
              - bind: closed
                eval: "false"
              - defer: |-
                  func() {
                  			//: the paths below close explicitly; this one is a stop or a panic.
                  			if !closed {
                  				_ = rows.Close()
                  			}
                  		}()
              - loop:
                  cond: rows.Next()
                  do:
                    - bind: value, err
                      eval: scan(rows)
                    - opt:
                        do:
                          - set: closed
                            value: "true"
                          - eval: yieldFailure(yield, firstFailure(err, rows.Close()))
                            to: yieldFailure
                          - return: ""
                        when: err != nil
                    - opt:
                        do:
                          - return: ""
                        when: "!yield(value, nil)"
              - set: closed
                value: "true"
              - opt:
                  do:
                    - eval: yieldFailure(yield, err)
                      to: yieldFailure
                  init:
                    bind: err
                    eval: firstFailure(rows.Err(), rows.Close())
                    to: firstFailure
                  when: err != nil
  - of: firstFailure
    steps:
      - opt:
          do:
            - return: err
          when: err != nil
      - return: closeErr
  - of: yieldFailure
    steps:
      - var:
          name: zero
          type: T
      - opt:
          do:
            - return: ""
          when: "!yield(zero, err)"
  - of: InsertRows
    participants:
      - id: caller
        kind: actor
      - id: InsertRows
        kind: self
      - id: insertable
        kind: internal
      - id: rowsPerStatement
        kind: internal
      - id: ex.ExecContext
        kind: value
      - id: result.RowsAffected
        kind: value
    steps:
      - opt:
          do:
            - return: 0, err
          init:
            bind: err
            eval: insertable(d, into.Columns, rows)
            to: insertable
          when: err != nil
      - bind: cols
        eval: into.Columns
      - bind: per
        eval: rowsPerStatement(d, len(cols), into.PerStatement)
        to: rowsPerStatement
      - bind: head
        eval: "\"INSERT INTO \" + into.Table + \" (\" + strings.Join(cols, \", \") + \") VALUES \""
      - bind: args
        eval: make([]any, 0, min(len(rows), per)*len(cols))
      - loop:
          cond: start < len(rows)
          do:
            - bind: chunk
              eval: rows[start:min(start+per, len(rows))]
            - set: args
              value: args[:0]
            - loop:
                do:
                  - set: args
                    value: append(args, row...)
                key: _
                range: chunk
                value: row
            - bind: result, execErr
              eval: ex.ExecContext(ctx, valuesSQL(head, d, len(chunk), len(cols)), args...)
              to: ex.ExecContext
            - opt:
                do:
                  - return: inserted, execErr
                when: execErr != nil
            - alt:
                - do:
                    - op: +=
                      set: inserted
                      value: "n"
                  init:
                    bind: n, countErr
                    eval: result.RowsAffected()
                    to: result.RowsAffected
                  when: countErr == nil
                - do:
                    - op: +=
                      set: inserted
                      value: int64(len(chunk))
                  else: true
          init: start := 0
          post: start += per
      - return: inserted, nil
  - of: insertable
    participants:
      - id: caller
        kind: actor
      - id: insertable
        kind: self
      - id: kerrs
        kind: package
    steps:
      - opt:
          do:
            - return: kerrs.Wrap(coresql.ConfigInvalid, kerrs.WrapParams{}, kerrs.String("missing", "dialect"))
              to: kerrs
          when: "!d.Valid()"
      - opt:
          do:
            - return: kerrs.Wrap(coresql.ConfigInvalid, kerrs.WrapParams{}, kerrs.String("missing", "columns"))
              to: kerrs
          when: len(cols) == 0
      - loop:
          do:
            - opt:
                do:
                  - return: |-
                      kerrs.Wrap(coresql.ConfigInvalid, kerrs.WrapParams{},
                      				kerrs.String("invalid", "row width"), kerrs.Int("row", i), kerrs.Int("width", len(row)),
                      				kerrs.Int("columns", len(cols)))
                    to: kerrs
                when: len(row) != len(cols)
          key: i
          range: rows
          value: row
      - return: nil
  - of: rowsPerStatement
    steps:
      - bind: ceiling
        eval: serverMaxParams
      - opt:
          do:
            - set: ceiling
              value: sqliteMaxParams
          when: d == coresql.DialectSQLite
      - bind: most
        eval: max(ceiling/width, 1)
      - opt:
          do:
            - return: most
          when: asked <= 0 || asked > most
      - return: asked
  - of: valuesSQL
    participants:
      - id: caller
        kind: actor
      - id: valuesSQL
        kind: self
      - id: b.Grow
        kind: value
      - id: b.WriteString
        kind: value
      - id: b.String
        kind: value
    steps:
      - var:
          name: b
          type: strings.Builder
      - eval: b.Grow(len(head) + n*width*len(strconv.Itoa(n*width))*2)
        to: b.Grow
      - eval: b.WriteString(head)
        to: b.WriteString
      - loop:
          do:
            - opt:
                do:
                  - eval: b.WriteString(", ")
                    to: b.WriteString
                when: row > 0
            - eval: b.WriteString("(")
              to: b.WriteString
            - loop:
                cond: col <= width
                do:
                  - opt:
                      do:
                        - eval: b.WriteString(", ")
                          to: b.WriteString
                      when: col > 1
                  - eval: b.WriteString(d.Placeholder(row*width + col))
                    to: b.WriteString
                init: col := 1
                post: col++
            - eval: b.WriteString(")")
              to: b.WriteString
          key: row
          range: "n"
      - return: b.String()
        to: b.String
  - of: failed
    participants:
      - id: caller
        kind: actor
      - id: failed
        kind: self
      - id: kerrs
        kind: package
      - id: errors
        kind: stdlib
    steps:
      - bind: verdict
        eval: kerrs.Wrap(sentinel, kerrs.WrapParams{}, fields...)
        to: kerrs
      - opt:
          do:
            - return: verdict
          when: cause == nil
      - return: errors.Join(verdict, cause)
        to: errors
  - of: Statements
    participants:
      - id: caller
        kind: actor
      - id: Statements
        kind: self
      - id: ex.ExecContext
        kind: value
    steps:
      - return:
          closure:
            params: ctx context.Context, ex coresql.Executor
            results: error
            steps:
              - loop:
                  do:
                    - opt:
                        do:
                          - return: err
                        init:
                          bind: _, err
                          eval: ex.ExecContext(ctx, stmt)
                          to: ex.ExecContext
                        when: err != nil
                  key: _
                  range: stmts
                  value: stmt
              - return: nil
  - of: ChecksumOf
    participants:
      - id: caller
        kind: actor
      - id: ChecksumOf
        kind: self
      - id: sha256
        kind: stdlib
      - id: binary.BigEndian.PutUint64
        kind: value
      - id: digest.Write
        kind: value
      - id: hex
        kind: stdlib
    steps:
      - bind: digest
        eval: sha256.New()
        to: sha256
      - var:
          name: length
          type: "[8]byte"
      - loop:
          do:
            - eval: binary.BigEndian.PutUint64(length[:], uint64(len(stmt)))
              to: binary.BigEndian.PutUint64
            - set: _, _
              to: digest.Write
              value: digest.Write(length[:])
            - set: _, _
              to: digest.Write
              value: digest.Write([]byte(stmt))
          key: _
          range: stmts
          value: stmt
      - return: hex.EncodeToString(digest.Sum(nil))
        to: hex
  - of: NewTransactor
    participants:
      - id: caller
        kind: actor
      - id: NewTransactor
        kind: self
      - id: cfg.resolve
        kind: internal
    steps:
      - bind: res, err
        eval: cfg.resolve()
        to: cfg.resolve
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - return: "&transactor{cfg: res}, nil"
  - of: (*transactor).Transact
    participants:
      - id: caller
        kind: actor
      - id: (*transactor).Transact
        kind: self
      - id: kerrs
        kind: package
      - id: scopeFor
        kind: internal
      - id: t.nested
        kind: internal
      - id: t.root
        kind: internal
    steps:
      - opt:
          do:
            - return: kerrs.Wrap(coresql.ConfigInvalid, kerrs.WrapParams{}, kerrs.String("missing", "fn"))
              to: kerrs
          when: fn == nil
      - opt:
          do:
            - return: t.nested(ctx, scope, opts, fn)
              to: t.nested
          init:
            bind: scope
            eval: scopeFor(ctx, t)
            to: scopeFor
          when: scope != nil
      - return: t.root(ctx, opts, fn)
        to: t.root
  - of: (*transactor).root
    participants:
      - id: caller
        kind: actor
      - id: (*transactor).root
        kind: self
      - id: t.poolFor(opts).BeginTx
        kind: value
      - id: failed
        kind: internal
      - id: newScopedExecutor
        kind: internal
      - id: scoped.retire
        kind: internal
      - id: t.settle
        kind: internal
      - id: state.drain
        kind: internal
      - id: runAborted
        kind: internal
    steps:
      - bind: tx, err
        eval: t.poolFor(opts).BeginTx(ctx, opts.StdOptions())
        to: t.poolFor(opts).BeginTx
      - opt:
          do:
            - return: failed(coresql.BeginFailed, err)
              to: failed
          when: err != nil
      - bind: state
        eval: "&txState{tx: tx, dialect: t.cfg.dialect, budget: t.cfg.budget}"
      - bind: scoped
        eval: newScopedExecutor(state)
        to: newScopedExecutor
      - bind: settled
        eval: "false"
      - defer: |-
          func() {
          		//: the ordinary paths settle the transaction themselves.
          		if settled {
          			//: nothing left to undo.
          			return
          		}
          		//: a PANIC left the transaction open. Retire the handle and roll
          		//: back, then let the panic continue with its original stack — see
          		//: the package doc: a panic is not a database outcome, and
          		//: converting it here would hide a bug at the site that produced it.
          		//: What was held for a commit that will never happen is dropped.
          		scoped.retire()
          		_, aborted := state.drain(false)
          		//: the panic is the news and it is already travelling, so there is no
          		//: return value left to report a rollback failure on. It is recorded
          		//: on the STATE instead: a unit of work that leaked its executor past
          		//: the panic then gets a typed refusal rather than a statement sent
          		//: to a connection database/sql has already discarded.
          		if rbErr := tx.Rollback(); rbErr != nil && !txEnded(rbErr) {
          			//: the transaction's real state is unknown from here.
          			state.poison(failed(coresql.RollbackFailed, rbErr))
          		}
          		//: the work is undone: what waited for that is told, before the
          		//: panic continues.
          		runAborted(aborted)
          	}()
      - set: err
        value: "fn(withScope(ctx, &txScope{owner: t, state: state, exec: scoped, id: rootScope}), scoped)"
      - set: settled
        value: "true"
      - eval: scoped.retire()
        to: scoped.retire
      - set: err
        to: t.settle
        value: t.settle(state, err)
      - bind: held, aborted
        eval: state.drain(err == nil)
        to: state.drain
      - loop:
          do:
            - eval: fn.fn()
          key: _
          range: held
          value: fn
      - eval: runAborted(aborted)
        to: runAborted
      - return: err
  - of: (*transactor).poolFor
    steps:
      - opt:
          do:
            - return: t.cfg.replica
          when: opts.ReadOnly && t.cfg.replica != nil
      - return: t.cfg.db
  - of: (*transactor).settle
    participants:
      - id: caller
        kind: actor
      - id: (*transactor).settle
        kind: self
      - id: errors
        kind: stdlib
      - id: state.poisonedErr
        kind: internal
      - id: state.tx.Commit
        kind: value
      - id: failed
        kind: internal
    steps:
      - opt:
          do:
            - return: errors.Join(cause, rollback(state))
              to: errors
          when: cause != nil
      - opt:
          do:
            - return: errors.Join(failed(coresql.TxPoisoned, poison), rollback(state))
              to: errors
          init:
            bind: poison
            eval: state.poisonedErr()
            to: state.poisonedErr
          when: poison != nil
      - opt:
          do:
            - return: failed(coresql.CommitFailed, err)
              to: failed
          init:
            bind: err
            eval: state.tx.Commit()
            to: state.tx.Commit
          when: err != nil
      - return: nil
  - of: rollback
    participants:
      - id: caller
        kind: actor
      - id: rollback
        kind: self
      - id: state.tx.Rollback
        kind: value
      - id: failed
        kind: internal
    steps:
      - bind: err
        eval: state.tx.Rollback()
        to: state.tx.Rollback
      - opt:
          do:
            - return: nil
          when: err == nil || errors.Is(err, stdsql.ErrTxDone)
      - return: failed(coresql.RollbackFailed, err)
        to: failed
  - forward: context.WithoutCancel
    of: cleanup
  - of: txEnded
    participants:
      - id: caller
        kind: actor
      - id: txEnded
        kind: self
      - id: errors
        kind: stdlib
    steps:
      - return: errors.Is(err, stdsql.ErrTxDone)
        to: errors
  - of: (*transactor).nested
    participants:
      - id: caller
        kind: actor
      - id: (*transactor).nested
        kind: self
      - id: kerrs
        kind: package
      - id: scope.state.poisonedErr
        kind: internal
      - id: failed
        kind: internal
      - id: scope.state.nextSavepoint
        kind: internal
      - id: savepointSQL
        kind: internal
      - id: scope.state.tx.ExecContext
        kind: value
      - id: t.runNested
        kind: internal
    steps:
      - opt:
          do:
            - return: kerrs.Wrap(coresql.NestedIsolation, kerrs.WrapParams{})
              to: kerrs
          when: "!opts.IsZero()"
      - opt:
          do:
            - return: failed(coresql.TxPoisoned, poison)
              to: failed
          init:
            bind: poison
            eval: scope.state.poisonedErr()
            to: scope.state.poisonedErr
          when: poison != nil
      - bind: id, name
        eval: scope.state.nextSavepoint()
        to: scope.state.nextSavepoint
      - bind: create, undo, release
        eval: savepointSQL(scope.state.dialect, name)
        to: savepointSQL
      - opt:
          do:
            - return: |-
                failed(coresql.SavepointFailed, err,
                			kerrs.String("statement", "SAVEPOINT"), kerrs.String("savepoint", name))
              to: failed
          init:
            bind: _, err
            eval: scope.state.tx.ExecContext(ctx, create)
            to: scope.state.tx.ExecContext
          when: err != nil
      - return: "t.runNested(ctx, scope, fn, savepointStmts{name: name, undo: undo, release: release, id: id})"
        to: t.runNested
  - of: (*transactor).runNested
    participants:
      - id: caller
        kind: actor
      - id: (*transactor).runNested
        kind: self
      - id: newScopedExecutor
        kind: internal
      - id: scoped.retire
        kind: internal
      - id: t.settleNested
        kind: internal
    steps:
      - bind: scoped
        eval: newScopedExecutor(scope.state)
        to: newScopedExecutor
      - bind: settled
        eval: "false"
      - defer: |-
          func() {
          		//: the ordinary paths settle the savepoint themselves.
          		if settled {
          			//: nothing left to undo.
          			return
          		}
          		//: a PANIC unwound past the scope. Retire the handle and undo the
          		//: savepoint so the outer transaction is not left carrying half of
          		//: an abandoned unit of work; the panic then continues. What the
          		//: scope held for the commit goes with its work.
          		scoped.retire()
          		undone := scope.state.dropFrom(sp.id)
          		//: best-effort, and on a DETACHED context: a panic often coexists
          		//: with a cancellation, and the undo must outlive it. A failure here
          		//: POISONS, so the outer scope refuses to commit half of an abandoned
          		//: unit of work — that is the channel this path reports on, since the
          		//: panic itself is already carrying the diagnosis upward.
          		if _, undoErr := scope.state.tx.ExecContext(cleanup(ctx), sp.undo); undoErr != nil {
          			//: the engine's state is unknown; nothing may be committed.
          			scope.state.poison(failed(coresql.SavepointFailed, undoErr,
          				kerrs.String("statement", "ROLLBACK TO"), kerrs.String("savepoint", sp.name)))
          		}
          		//: the scope's work is undone — or the transaction is poisoned, and
          		//: will never commit it: what waited for that is told.
          		runAborted(undone)
          	}()
      - bind: err
        eval: "fn(withScope(ctx, &txScope{owner: t, state: scope.state, exec: scoped, id: sp.id}), scoped)"
      - set: settled
        value: "true"
      - eval: scoped.retire()
        to: scoped.retire
      - return: t.settleNested(ctx, scope, sp, err)
        to: t.settleNested
  - of: (*transactor).settleNested
    participants:
      - id: caller
        kind: actor
      - id: (*transactor).settleNested
        kind: self
      - id: scope.state.dropFrom
        kind: internal
      - id: t.undoSavepoint
        kind: internal
      - id: runAborted
        kind: internal
      - id: errors
        kind: stdlib
      - id: scope.state.tx.ExecContext
        kind: value
      - id: failed
        kind: internal
      - id: scope.state.poison
        kind: internal
    steps:
      - opt:
          do:
            - bind: undone
              eval: scope.state.dropFrom(sp.id)
              to: scope.state.dropFrom
            - bind: undoErr
              eval: t.undoSavepoint(ctx, scope, sp)
              to: t.undoSavepoint
            - eval: runAborted(undone)
              to: runAborted
            - return: errors.Join(cause, undoErr)
              to: errors
          when: cause != nil
      - opt:
          do:
            - opt:
                do:
                  - return: nil
                when: txEnded(err)
            - bind: verdict
              eval: |-
                failed(coresql.SavepointFailed, err,
                			kerrs.String("statement", "RELEASE"), kerrs.String("savepoint", sp.name))
              to: failed
            - eval: scope.state.poison(verdict)
              to: scope.state.poison
            - return: verdict
          init:
            bind: _, err
            eval: scope.state.tx.ExecContext(cleanup(ctx), sp.release)
            to: scope.state.tx.ExecContext
          when: err != nil
      - return: nil
  - of: (*transactor).undoSavepoint
    participants:
      - id: caller
        kind: actor
      - id: (*transactor).undoSavepoint
        kind: self
      - id: scope.state.tx.ExecContext
        kind: value
      - id: failed
        kind: internal
      - id: scope.state.poison
        kind: internal
    steps:
      - bind: _, err
        eval: scope.state.tx.ExecContext(cleanup(ctx), sp.undo)
        to: scope.state.tx.ExecContext
      - opt:
          do:
            - return: nil
          when: err == nil || txEnded(err)
      - bind: verdict
        eval: |-
          failed(coresql.SavepointFailed, err,
          		kerrs.String("statement", "ROLLBACK TO"), kerrs.String("savepoint", sp.name))
        to: failed
      - eval: scope.state.poison(verdict)
        to: scope.state.poison
      - return: verdict
  - of: scopeOf
    steps:
      - bind: scope, _
        eval: ctx.Value(scopeKey).(*txScope)
      - return: scope
  - of: withScope
    participants:
      - id: caller
        kind: actor
      - id: withScope
        kind: self
      - id: scopeOf
        kind: internal
      - id: context
        kind: stdlib
    steps:
      - set: scope.parent
        to: scopeOf
        value: scopeOf(ctx)
      - return: context.WithValue(ctx, scopeKey, scope)
        to: context
  - of: (*txState).nextSavepoint
    steps:
      - lock:
          mutex: s.mu
      - op: ++
        set: s.counter
      - return: s.counter, savepointName(s.counter)
  - of: (*txState).poison
    steps:
      - lock:
          mutex: s.mu
      - opt:
          do:
            - set: s.poisoned
              value: cause
          when: s.poisoned == nil
  - of: (*txState).poisonedErr
    steps:
      - lock:
          mutex: s.mu
          read: true
      - return: s.poisoned
  - of: (*txState).hold
    steps:
      - lock:
          mutex: s.mu
      - opt:
          do:
            - return: "false"
          when: s.ended
      - opt:
          do:
            - set: s.held
              value: "append(s.held, heldFn{fn: fn, scope: scope})"
          when: fn != nil
      - return: "true"
  - of: (*txState).holdAbort
    steps:
      - lock:
          mutex: s.mu
      - opt:
          do:
            - return: "false"
          when: s.ended
      - opt:
          do:
            - set: s.aborted
              value: "append(s.aborted, abortFn{ctx: context.WithoutCancel(ctx), fn: fn, scope: scope})"
          when: fn != nil
      - return: "true"
  - of: (*txState).dropFrom
    participants:
      - id: caller
        kind: actor
      - id: (*txState).dropFrom
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - lock:
          mutex: s.mu
      - bind: inside
        eval:
          closure:
            params: scope uint64
            results: bool
            steps:
              - return: scope >= from
      - set: s.held
        to: slices
        value: slices.DeleteFunc(s.held, func(h heldFn) bool { return inside(h.scope) })
      - var:
          name: undone
          type: "[]abortFn"
      - bind: kept
        eval: s.aborted[:0]
      - loop:
          do:
            - opt:
                do:
                  - set: undone
                    value: append(undone, held)
                  - continue: true
                when: inside(held.scope)
            - set: kept
              value: append(kept, held)
          key: _
          range: s.aborted
          value: held
      - eval: clear(s.aborted[len(kept):])
      - set: s.aborted
        value: kept
      - return: undone
  - of: (*txState).drain
    steps:
      - lock:
          mutex: s.mu
      - set: s.ended
        value: "true"
      - set: held, aborted
        value: s.held, s.aborted
      - set: s.held, s.aborted
        value: nil, nil
      - opt:
          do:
            - return: nil, aborted
          when: "!committed"
      - return: held, nil
  - of: runAborted
    steps:
      - loop:
          do:
            - eval: held.fn(held.ctx)
          key: _
          range: slices.Backward(aborted)
          value: held
  - of: NewWithheld
    steps:
      - return: "Withheld{cause: cause}"
  - of: Withheld.Error
    participants:
      - id: caller
        kind: actor
      - id: Withheld.Error
        kind: self
      - id: fmt
        kind: stdlib
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: ended.Error() + " (the driver's text is withheld)"
                when: errors.Is(w.cause, ended)
          key: _
          range: "[]error{context.DeadlineExceeded, context.Canceled}"
          value: ended
      - opt:
          do:
            - return: fmt.Sprintf("%T SQLSTATE %s (the driver's text is withheld)", w.cause, stated.SQLState())
              to: fmt
          init:
            bind: stated, ok
            eval: |-
              errors.AsType[interface {
              		error
              		SQLState() string
              	}](w.cause)
          when: ok
      - opt:
          do:
            - return: fmt.Sprintf("%T code %d (the driver's text is withheld)", w.cause, coded.Code())
              to: fmt
          init:
            bind: coded, ok
            eval: |-
              errors.AsType[interface {
              		error
              		Code() int
              	}](w.cause)
          when: ok
      - return: fmt.Sprintf("%T (the driver's text is withheld)", w.cause)
        to: fmt
  - of: Withheld.Unwrap
    steps:
      - return: w.cause
