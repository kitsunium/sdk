      - bind: rows, err
        eval: queryer.QueryContext(ctx, query, args)
        to: queryer.QueryContext
      - opt:
          do:
            - eval: end(0, err)
            - return: nil, err
          when: err != nil
      - return: "&observedRows{inner: rows, end: end}, nil"
  - of: (*observedConn).Ping
    participants:
      - id: caller
        kind: actor
      - id: (*observedConn).Ping
