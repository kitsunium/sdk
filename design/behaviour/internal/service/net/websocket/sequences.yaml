                refuse(w, http.StatusForbidden, "origin", origin,
                			"a proxy forwarded this request, so the scheme the browser used is not visible here "+
                				"and the default same-origin rule cannot see a downgrade; "+
                				"use AllowOrigins to name the origins, or AllowAnyOrigin")
              to: refuse
          when: forwardedScheme(r)
      - opt:
          do:
            - return: nil
          when: sameOrigin(origin, r)
      - return: |-
          refuse(w, http.StatusForbidden, "origin", origin,
          		"the origin names another host, or plain http on a connection this server encrypted; "+
          			"use AllowOrigins or AllowAnyOrigin to permit it")
        to: refuse
  - of: sameOrigin
    participants:
      - id: caller
        kind: actor
      - id: sameOrigin
        kind: self
      - id: url
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "false"
          when: strings.EqualFold(origin, nullOrigin)
      - bind: parsed, perr
        eval: url.Parse(origin)
        to: url
      - opt:
          do:
            - return: "false"
          when: perr != nil || parsed.Host == ""
      - return: strings.EqualFold(parsed.Host, r.Host) && schemeConsistent(parsed.Scheme, r)
  - of: schemeConsistent
    participants:
      - id: caller
        kind: actor
      - id: schemeConsistent
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "true"
          when: r.TLS == nil
      - return: strings.EqualFold(scheme, httpsScheme)
        to: strings
  - of: refuse
    participants:
      - id: caller
        kind: actor
      - id: refuse
        kind: self
      - id: http
        kind: stdlib
      - id: errs
        kind: package
    steps:
      - eval: http.Error(w, http.StatusText(status), status)
        to: http
      - return: |-
          errs.Wrap(corenet.WSHandshakeFailed, errs.WrapParams{},
          		errs.String(key, value),
          		errs.Int("status", status),
          		errs.String("why", why))
        to: errs
  - of: hasToken
    steps:
      - loop:
          do:
            - loop:
                do:
                  - opt:
                      do:
                        - return: "true"
                      when: strings.EqualFold(strings.TrimSpace(entry), token)
                key: entry
                range: strings.SplitSeq(value, ",")
          key: _
          range: values
          value: value
      - return: "false"
  - of: chooseSubprotocol
    participants:
      - id: caller
        kind: actor
      - id: chooseSubprotocol
        kind: self
      - id: r.Header.Values
        kind: value
    steps:
      - opt:
          do:
            - return: "\"\", false"
          when: len(preferred) == 0
      - bind: offered
        eval: r.Header.Values(corenet.WSProtocolHeader)
        to: r.Header.Values
      - loop:
          do:
            - opt:
                do:
                  - return: want, true
                when: hasExactToken(offered, want)
          key: _
          range: preferred
          value: want
      - return: "\"\", false"
  - of: hasExactToken
    steps:
      - loop:
          do:
            - loop:
                do:
                  - opt:
                      do:
                        - return: "true"
                      when: strings.TrimSpace(entry) == token
                key: entry
                range: strings.SplitSeq(value, ",")
          key: _
          range: values
          value: value
      - return: "false"
  - of: canHijack
    participants:
      - id: caller
        kind: actor
      - id: canHijack
        kind: self
      - id: unwrapped.Unwrap
        kind: internal
    steps:
      - loop:
          do:
            - typeswitch:
                bind: unwrapped
                cases:
                  - do:
                      - return: "true"
                    types: http.Hijacker
                  - do:
                      - set: w
                        to: unwrapped.Unwrap
                        value: unwrapped.Unwrap()
                    types: interface{ Unwrap() http.ResponseWriter }
                  - default: true
                    do:
                      - return: "false"
                "on": w
          forever: true
  - of: hijack
    participants:
      - id: caller
        kind: actor
      - id: hijack
        kind: self
      - id: http.NewResponseController(w).Hijack
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - bind: socket, rw, herr
        eval: http.NewResponseController(w).Hijack()
        to: http.NewResponseController(w).Hijack
      - opt:
          do:
            - return: |-
                nil, nil, errs.Wrap(corenet.WSUpgradeUnsupported, errs.WrapParams{},
                			errs.String("cause", herr.Error()))
          when: herr != nil
      - eval: swallowErr(rw.Flush())
        to: swallowErr
      - return: socket, rw.Reader, nil
  - of: writeAccept
    participants:
      - id: caller
        kind: actor
      - id: writeAccept
        kind: self
      - id: socket.Write
        kind: value
      - id: errs
        kind: package
    steps:
      - var:
          name: response
          type: "[]byte"
      - set: response
        value: append(response, switchingProtocols...)
      - set: response
        value: "append(response, \"Upgrade: \"+corenet.WSUpgradeToken+crlf...)"
      - set: response
        value: "append(response, \"Connection: Upgrade\"+crlf...)"
      - set: response
        value: "append(response, corenet.WSAcceptHeader+\": \"+AcceptKey(key)+crlf...)"
      - opt:
          do:
            - set: response
              value: "append(response, corenet.WSProtocolHeader+\": \"+subprotocol+crlf...)"
          when: subprotocol != ""
      - set: response
        value: append(response, crlf...)
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.WSHandshakeFailed, errs.WrapParams{},
                			errs.String("cause", werr.Error()),
                			errs.String("why", "the 101 response could not be written"))
              to: errs
          init:
            bind: _, werr
            eval: socket.Write(response)
            to: socket.Write
          when: werr != nil
      - return: nil
  - of: AcceptKey
    participants:
      - id: caller
        kind: actor
      - id: AcceptKey
        kind: self
      - id: sha1
        kind: stdlib
      - id: base64.StdEncoding.EncodeToString
        kind: value
    steps:
      - bind: sum
        eval: sha1.Sum([]byte(key + corenet.WSGUID))
        to: sha1
      - return: base64.StdEncoding.EncodeToString(sum[:])
        to: base64.StdEncoding.EncodeToString
  - of: ValidateKey
    participants:
      - id: caller
        kind: actor
      - id: ValidateKey
        kind: self
      - id: errs
        kind: package
      - id: base64.StdEncoding.DecodeString
        kind: value
    steps:
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.WSHandshakeFailed, errs.WrapParams{},
                			errs.String("header", corenet.WSKeyHeader),
                			errs.String("why", "the header is missing"))
              to: errs
          when: key == ""
      - bind: raw, derr
        eval: base64.StdEncoding.DecodeString(key)
        to: base64.StdEncoding.DecodeString
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.WSHandshakeFailed, errs.WrapParams{},
                			errs.String("header", corenet.WSKeyHeader),
                			errs.String("why", "the value is not base64"))
              to: errs
          when: derr != nil
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.WSHandshakeFailed, errs.WrapParams{},
                			errs.String("header", corenet.WSKeyHeader),
                			errs.Int("decoded_length", len(raw)),
                			errs.String("why", "the key must decode to exactly sixteen bytes"))
              to: errs
          when: len(raw) != corenet.WSKeyLen
      - return: nil
  - of: NewLoopHandler
    participants:
      - id: caller
        kind: actor
      - id: NewLoopHandler
        kind: self
      - id: resolve
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, errs.Wrap(corenet.WSConnMisconfigured, errs.WrapParams{}, errs.String("option", "source"))
          when: src == nil
      - var:
          name: probe
          type: config
      - loop:
          do:
            - eval: opt(&probe)
          key: _
          range: opts
          value: opt
      - opt:
          do:
            - return: |-
                nil, errs.Wrap(corenet.WSConnMisconfigured, errs.WrapParams{}, errs.String("option", "WriteTimeout"),
                			errs.String("why", "a loop's OutputCap bounds a connection that stopped reading"))
          when: probe.writeTimeout != 0
      - bind: cfg, err
        eval: resolve(opts)
        to: resolve
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - return: "&LoopHandler{src: src, cfg: cfg}, nil"
  - of: (*statusRecorder).Header
    steps:
      - return: r.header
  - of: (*statusRecorder).Write
    steps:
      - return: len(p), nil
  - of: (*statusRecorder).WriteHeader
    steps:
      - set: r.status
        value: status
  - of: shimRequest
    participants:
      - id: caller
        kind: actor
      - id: shimRequest
        kind: self
      - id: copyField
        kind: internal
    steps:
      - bind: h
        eval: make(http.Header, 6)
      - loop:
          do:
            - eval: copyField(h, req, name)
              to: copyField
          key: _
          range: handshakeFields
          value: name
      - bind: method, host
        eval: string(req.Method), string(req.Host)
      - return: "&http.Request{Method: method, Host: host, Header: h, ProtoMajor: 1, ProtoMinor: 1}"
  - of: copyField
    participants:
      - id: caller
        kind: actor
      - id: copyField
        kind: self
      - id: req.Field
        kind: value
      - id: h.Add
        kind: value
    steps:
      - bind: value, ok
        eval: req.Field(name)
        to: req.Field
      - opt:
          do:
            - return: ""
          when: "!ok"
      - eval: h.Add(name, string(value))
        to: h.Add
  - of: (*LoopHandler).ServeHTTP1
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).ServeHTTP1
        kind: self
      - id: shimRequest
        kind: internal
      - id: verifyHandshake
        kind: internal
      - id: appendRefusalFields
        kind: internal
      - id: h.src.OpenWS
        kind: internal
      - id: r.Header.Get
        kind: value
      - id: chooseSubprotocol
        kind: internal
      - id: h.markSubprotocol
        kind: internal
    steps:
      - bind: r
        eval: shimRequest(req)
        to: shimRequest
      - bind: rec
        eval: "&statusRecorder{header: http.Header{}, status: http.StatusBadRequest}"
      - opt:
          do:
            - set: res.Status
              value: rec.status
            - set: res.Header
              to: appendRefusalFields
              value: appendRefusalFields(res.Header, rec.header)
            - return: ""
          init:
            bind: err
            eval: verifyHandshake(rec, r, &h.cfg)
            to: verifyHandshake
          when: err != nil
      - bind: status
        eval: h.src.OpenWS(req)
        to: h.src.OpenWS
      - opt:
          do:
            - set: res.Status
              value: status
            - return: ""
          when: status != 0
      - bind: key
        eval: r.Header.Get(corenet.WSKeyHeader)
        to: r.Header.Get
      - bind: chosen, agreed
        eval: chooseSubprotocol(h.cfg.subprotocols, r)
        to: chooseSubprotocol
      - bind: out
        eval: append(res.Header, upgradeField...)
      - set: out
        value: append(out, AcceptKey(key)...)
      - set: out
        value: append(out, fieldEnd...)
      - opt:
          do:
            - set: out
              value: append(out, protocolField...)
            - set: out
              value: append(out, chosen...)
            - set: out
              value: append(out, fieldEnd...)
          when: agreed
      - set: res.Upgrade, res.Header
        value: true, out
      - eval: h.markSubprotocol(req, chosen, agreed)
        to: h.markSubprotocol
  - of: appendRefusalFields
    steps:
      - loop:
          do:
            - loop:
                do:
                  - set: dst
                    value: append(dst, name...)
                  - set: dst
                    value: "append(dst, \": \"...)"
                  - set: dst
                    value: append(dst, v...)
                  - set: dst
                    value: append(dst, fieldEnd...)
                key: _
                range: values
                value: v
          key: name
          range: h
          value: values
      - return: dst
  - of: (*LoopHandler).markSubprotocol
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).markSubprotocol
        kind: self
      - id: h.conn
        kind: internal
    steps:
      - bind: ws
        eval: h.conn(req.Lane, req.Conn)
        to: h.conn
      - set: ws.subprotocol
        value: "0"
      - opt:
          do:
            - return: ""
          when: "!agreed"
      - loop:
          do:
            - opt:
                do:
                  - set: ws.subprotocol
                    value: uint8(i + 1)
                  - return: ""
                when: name == chosen
          key: i
          range: h.cfg.subprotocols
          value: name
  - of: (*LoopHandler).OnStreamOpen
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).OnStreamOpen
        kind: self
      - id: h.conn
        kind: internal
      - id: h.armHeartbeat
        kind: internal
      - id: h.src.WSOpened
        kind: internal
    steps:
      - bind: ws
        eval: h.conn(s.IO.Loop(), s.Ref)
        to: h.conn
      - bind: sub
        eval: "\"\""
      - opt:
          do:
            - set: sub
              value: h.cfg.subprotocols[ws.subprotocol-1]
          when: ws.subprotocol > 0
      - eval: h.armHeartbeat(s)
        to: h.armHeartbeat
      - eval: "h.src.WSOpened(LoopConnValue{h: h, s: s}, sub)"
        to: h.src.WSOpened
  - of: (*LoopHandler).armHeartbeat
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).armHeartbeat
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - opt:
          do:
            - eval: swallowErr(s.Deadline(h.cfg.pingInterval))
              to: swallowErr
          when: "!h.cfg.noPing && h.cfg.pingInterval > 0"
  - of: (*LoopHandler).OnStreamTimeout
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).OnStreamTimeout
        kind: self
      - id: h.conn
        kind: internal
      - id: swallowErr
        kind: internal
      - id: h.armHeartbeat
        kind: internal
    steps:
      - bind: ws
        eval: h.conn(s.IO.Loop(), s.Ref)
        to: h.conn
      - opt:
          do:
            - set: ws.dead
              value: "true"
            - eval: swallowErr(s.End())
              to: swallowErr
            - return: ""
          when: ws.awaiting
      - set: ws.awaiting
        value: "true"
      - eval: "swallowErr(LoopConnValue{h: h, s: s}.Ping(nil))"
        to: swallowErr
      - eval: h.armHeartbeat(s)
        to: h.armHeartbeat
  - of: (*LoopHandler).OnStreamDrain
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).OnStreamDrain
        kind: self
      - id: h.conn
        kind: internal
      - id: swallowErr
        kind: internal
    steps:
      - bind: ws
        eval: h.conn(s.IO.Loop(), s.Ref)
        to: h.conn
      - eval: swallowErr(h.closeWith(s, ws, corenet.WSCloseGoingAway, ""))
        to: swallowErr
  - of: (*LoopHandler).OnStreamClose
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).OnStreamClose
        kind: self
      - id: h.src.WSClosed
        kind: internal
      - id: h.conn
        kind: internal
    steps:
      - eval: "h.src.WSClosed(LoopConnValue{h: h, s: s}, err)"
        to: h.src.WSClosed
      - bind: ws
        eval: h.conn(s.IO.Loop(), s.Ref)
        to: h.conn
      - set: "*ws"
        value: "wsConn{gen: ws.gen}"
  - of: (*LoopHandler).lane
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).lane
        kind: self
      - id: h.lanes.Load
        kind: value
      - id: h.growLane
        kind: internal
    steps:
      - opt:
          do:
            - return: (*p)[i]
          init:
            bind: p
            eval: h.lanes.Load()
            to: h.lanes.Load
          when: p != nil && i < len(*p) && (*p)[i] != nil
      - return: h.growLane(i)
        to: h.growLane
  - of: (*LoopHandler).growLane
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).growLane
        kind: self
      - id: h.lanes.Load
        kind: value
      - id: h.lanes.Store
        kind: value
    steps:
      - lock:
          mutex: h.mu
      - var:
          name: cur
          type: "[]*wsLane"
      - opt:
          do:
            - set: cur
              value: "*p"
          init:
            bind: p
            eval: h.lanes.Load()
            to: h.lanes.Load
          when: p != nil
      - opt:
          do:
            - return: cur[i]
          when: i < len(cur) && cur[i] != nil
      - bind: next
        eval: make([]*wsLane, max(len(cur), i+1))
      - eval: copy(next, cur)
      - set: next[i]
        value: "&wsLane{}"
      - eval: h.lanes.Store(&next)
        to: h.lanes.Store
      - return: next[i]
  - of: (*LoopHandler).conn
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).conn
        kind: self
      - id: h.lane
        kind: internal
    steps:
      - bind: st
        eval: h.lane(lane)
        to: h.lane
      - bind: ring, slot
        eval: int(ref.Ring), int(ref.Slot)
      - opt:
          do:
            - set: st.conns
              value: append(st.conns, make([][]wsConn, ring+1-len(st.conns))...)
          when: ring >= len(st.conns)
      - opt:
          do:
            - bind: grown
              eval: make([]wsConn, max(slot+1, 2*len(st.conns[ring])))
            - eval: copy(grown, st.conns[ring])
            - set: st.conns[ring]
              value: grown
          when: slot >= len(st.conns[ring])
      - bind: ws
        eval: "&st.conns[ring][slot]"
      - opt:
          do:
            - set: "*ws"
              value: "wsConn{gen: ref.Gen}"
          when: ws.gen != ref.Gen
      - return: ws
  - of: NewLoopConnValue
    steps:
      - return: "LoopConnValue{h: h, s: s}"
  - of: LoopConnValue.Conn
    steps:
      - return: c.s.Ref
  - of: LoopConnValue.Send
    participants:
      - id: caller
        kind: actor
      - id: LoopConnValue.Send
        kind: self
      - id: c.frame
        kind: internal
    steps:
      - bind: op
        eval: corenet.WSText
      - opt:
          do:
            - set: op
              value: corenet.WSBinary
          when: m.Binary
      - return: c.frame(op, m.Data)
        to: c.frame
  - of: LoopConnValue.Ping
    participants:
      - id: caller
        kind: actor
      - id: LoopConnValue.Ping
        kind: self
      - id: c.frame
        kind: internal
    steps:
      - return: c.frame(corenet.WSPing, payload)
        to: c.frame
  - of: LoopConnValue.frame
    participants:
      - id: caller
        kind: actor
      - id: LoopConnValue.frame
        kind: self
      - id: c.h.lane
        kind: internal
      - id: AppendFrame
        kind: internal
      - id: c.s.Send
        kind: value
    steps:
      - bind: lane
        eval: c.h.lane(c.s.IO.Loop())
        to: c.h.lane
      - bind: wire, err
        eval: AppendFrame(lane.out[:0], op, true, payload)
        to: AppendFrame
      - opt:
          do:
            - return: err
          when: err != nil
      - set: lane.out
        value: wire
      - return: c.s.Send(wire)
        to: c.s.Send
  - of: LoopConnValue.CloseWith
    participants:
      - id: caller
        kind: actor
      - id: LoopConnValue.CloseWith
        kind: self
      - id: c.h.conn
        kind: internal
      - id: c.h.closeWith
        kind: internal
    steps:
      - bind: ws
        eval: c.h.conn(c.s.IO.Loop(), c.s.Ref)
        to: c.h.conn
      - return: c.h.closeWith(c.s, ws, code, reason)
        to: c.h.closeWith
  - of: (*LoopHandler).closeWith
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).closeWith
        kind: self
      - id: h.lane
        kind: internal
      - id: AppendClosePayload
        kind: internal
      - id: AppendFrame
        kind: internal
      - id: swallowErr
        kind: internal
      - id: s.End
        kind: value
    steps:
      - opt:
          do:
            - return: nil
          when: ws.dead
      - set: ws.dead
        value: "true"
      - bind: lane
        eval: h.lane(s.IO.Loop())
        to: h.lane
      - bind: payload, err
        eval: AppendClosePayload(lane.out[:0], code, reason)
        to: AppendClosePayload
      - opt:
          do:
            - bind: wire, ferr
              eval: AppendFrame(nil, corenet.WSClose, true, payload)
              to: AppendFrame
            - opt:
                do:
                  - eval: swallowErr(s.Send(wire))
                    to: swallowErr
                when: ferr == nil
          when: err == nil
      - return: s.End()
        to: s.End
  - of: (*LoopHandler).OnUpgradedData
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).OnUpgradedData
        kind: self
      - id: h.conn
        kind: internal
      - id: h.step
        kind: internal
    steps:
      - bind: ws
        eval: h.conn(s.IO.Loop(), s.Ref)
        to: h.conn
      - opt:
          do:
            - return: len(buf)
          when: ws.dead
      - set: ws.awaiting
        value: "false"
      - bind: used
        eval: "0"
      - loop:
          cond: used < len(buf) && !ws.dead
          do:
            - bind: n, more
              eval: h.step(s, ws, buf[used:])
              to: h.step
            - op: +=
              set: used
              value: "n"
            - opt:
                do:
                  - break: true
                when: "!more"
      - opt:
          do:
            - return: len(buf)
          when: ws.dead
      - return: used
  - of: (*LoopHandler).step
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).step
        kind: self
      - id: h.payload
        kind: internal
      - id: FrameHeaderLen
        kind: internal
      - id: ParseFrameHeader
        kind: internal
      - id: h.fail
        kind: internal
      - id: header.ValidateFromClient
        kind: internal
      - id: h.control
        kind: internal
      - id: h.payloadFrom
        kind: internal
    steps:
      - opt:
          do:
            - return: h.payload(s, ws, buf)
              to: h.payload
          when: ws.frameLeft > 0
      - opt:
          do:
            - return: 0, false
          when: len(buf) < MinHeaderLen
      - bind: want
        eval: FrameHeaderLen(buf[:MinHeaderLen])
        to: FrameHeaderLen
      - opt:
          do:
            - return: 0, false
          when: len(buf) < want
      - bind: header, herr
        eval: ParseFrameHeader(buf[:want])
        to: ParseFrameHeader
      - opt:
          do:
            - eval: h.fail(s, ws, corenet.WSCloseProtocolError)
              to: h.fail
            - return: len(buf), false
          when: herr != nil
      - opt:
          do:
            - eval: h.fail(s, ws, corenet.WSCloseProtocolError)
              to: h.fail
            - return: len(buf), false
          init:
            bind: merr
            eval: header.ValidateFromClient()
            to: header.ValidateFromClient
          when: merr != nil
      - opt:
          do:
            - eval: h.fail(s, ws, corenet.WSCloseTooLarge)
              to: h.fail
            - return: len(buf), false
          when: "!header.OpCode.IsControl() && header.Length > uint64(h.cfg.maxFrameSize)"
      - opt:
          do:
            - return: h.control(s, ws, buf, want, header)
              to: h.control
          when: header.OpCode.IsControl()
      - opt:
          do:
            - return: len(buf), false
          when: "!h.startData(s, ws, header)"
      - return: h.payloadFrom(s, ws, buf, want)
        to: h.payloadFrom
  - of: (*LoopHandler).startData
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).startData
        kind: self
      - id: h.fail
        kind: internal
      - id: h.complete
        kind: internal
    steps:
      - alt:
          - do:
              - opt:
                  do:
                    - eval: h.fail(s, ws, corenet.WSCloseProtocolError)
                      to: h.fail
                    - return: "false"
                  when: ws.msgState == 0
            when: header.OpCode == corenet.WSContinuation
          - do:
              - opt:
                  do:
                    - eval: h.fail(s, ws, corenet.WSCloseProtocolError)
                      to: h.fail
                    - return: "false"
                  when: ws.msgState != 0
              - set: ws.op, ws.msg
                value: header.OpCode, ws.msg[:0]
            else: true
      - opt:
          do:
            - eval: h.fail(s, ws, corenet.WSCloseTooLarge)
              to: h.fail
            - return: "false"
          when: int64(len(ws.msg))+int64(header.Length) > h.cfg.maxMessageSize
      - set: ws.frameLeft, ws.key, ws.maskPos
        value: header.Length, header.MaskKey, 0
      - set: ws.msgState
        value: msgOpen
      - opt:
          do:
            - set: ws.msgState
              value: msgOpenFinal
          when: header.Final
      - opt:
          do:
            - eval: h.complete(s, ws, nil)
              to: h.complete
          when: header.Length == 0 && header.Final
      - return: "true"
  - of: (*LoopHandler).payloadFrom
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).payloadFrom
        kind: self
      - id: h.payload
        kind: internal
    steps:
      - bind: n, more
        eval: h.payload(s, ws, buf[header:])
        to: h.payload
      - return: header + n, more
  - of: (*LoopHandler).payload
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).payload
        kind: self
      - id: applyMaskAt
        kind: internal
      - id: h.complete
        kind: internal
    steps:
      - bind: take
        eval: int(min(uint64(len(buf)), ws.frameLeft))
      - bind: chunk
        eval: buf[:take]
      - eval: applyMaskAt(chunk, ws.key, ws.maskPos)
        to: applyMaskAt
      - op: "-="
        set: ws.frameLeft
        value: uint64(take)
      - op: +=
        set: ws.maskPos
        value: uint64(take)
      - opt:
          do:
            - set: ws.msg
              value: append(ws.msg, chunk...)
            - return: take, false
          when: ws.frameLeft > 0
      - opt:
          do:
            - set: ws.msg
              value: append(ws.msg, chunk...)
            - return: take, true
          when: ws.msgState != msgOpenFinal
      - alt:
          - do:
              - eval: h.complete(s, ws, chunk)
                to: h.complete
            when: len(ws.msg) == 0
          - do:
              - set: ws.msg
                value: append(ws.msg, chunk...)
              - eval: h.complete(s, ws, ws.msg)
                to: h.complete
            else: true
      - return: take, !ws.dead
  - of: (*LoopHandler).complete
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).complete
        kind: self
      - id: h.fail
        kind: internal
      - id: h.src.WSMessage
        kind: internal
    steps:
      - set: ws.msgState
        value: "0"
      - opt:
          do:
            - eval: h.fail(s, ws, corenet.WSCloseInvalidPayload)
              to: h.fail
            - return: ""
          when: ws.op == corenet.WSText && ValidateText(data) != nil
      - eval: "h.src.WSMessage(LoopConnValue{h: h, s: s}, corenet.WSMessageValue{Binary: ws.op == corenet.WSBinary, Data: data})"
        to: h.src.WSMessage
      - alt:
          - do:
              - set: ws.msg
                value: nil
            when: cap(ws.msg) > smallMessageCap
          - do:
              - set: ws.msg
                value: ws.msg[:0]
            else: true
  - of: (*LoopHandler).control
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).control
        kind: self
      - id: ApplyMask
        kind: internal
      - id: swallowErr
        kind: internal
      - id: h.serveClose
        kind: internal
    steps:
      - bind: end
        eval: header + int(f.Length)
      - opt:
          do:
            - return: 0, false
          when: len(buf) < end
      - bind: payload
        eval: buf[header:end]
      - eval: ApplyMask(payload, f.MaskKey)
        to: ApplyMask
      - switch:
          cases:
            - case: corenet.WSPing
              do:
                - eval: "swallowErr(LoopConnValue{h: h, s: s}.frame(corenet.WSPong, payload))"
                  to: swallowErr
            - case: corenet.WSPong
            - case: corenet.WSClose
              do:
                - eval: h.serveClose(s, ws, payload)
                  to: h.serveClose
            - default: true
          "on": f.OpCode
      - return: end, !ws.dead
  - of: (*LoopHandler).serveClose
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).serveClose
        kind: self
      - id: ParseClosePayload
        kind: internal
      - id: h.fail
        kind: internal
      - id: swallowErr
        kind: internal
    steps:
      - bind: code, _, perr
        eval: ParseClosePayload(payload)
        to: ParseClosePayload
      - opt:
          do:
            - eval: h.fail(s, ws, closeCodeFor(perr))
              to: h.fail
            - return: ""
          when: perr != nil
      - eval: swallowErr(h.closeWith(s, ws, code.Echoable(), ""))
        to: swallowErr
  - of: (*LoopHandler).fail
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).fail
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - eval: swallowErr(h.closeWith(s, ws, code, ""))
        to: swallowErr
  - of: applyMaskAt
    participants:
      - id: caller
        kind: actor
      - id: applyMaskAt
        kind: self
      - id: ApplyMask
        kind: internal
    steps:
      - var:
          name: rotated
          type: "[MaskLen]byte"
      - loop:
          do:
            - set: rotated[i]
              value: key[(uint64(i)+pos)%uint64(MaskLen)]
          key: i
          range: rotated
      - eval: ApplyMask(payload, rotated)
        to: ApplyMask
  - of: Subprotocols
    participants:
      - id: caller
        kind: actor
      - id: Subprotocols
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: snapshot
        eval: slices.Clone(names)
        to: slices
      - return:
          closure:
            params: c *config
            steps:
              - set: c.subprotocols
                value: snapshot
  - of: MaxMessageSize
    steps:
      - return:
          closure:
            params: c *config
            steps:
              - set: c.maxMessageSize
                value: "n"
  - of: MaxFrameSize
    steps:
      - return:
          closure:
            params: c *config
            steps:
              - set: c.maxFrameSize
                value: "n"
  - of: PingInterval
    steps:
      - return:
          closure:
            params: c *config
            steps:
              - set: c.pingInterval
                value: d
              - set: c.noPing
                value: "false"
  - of: WithoutPing
    steps:
      - return:
          closure:
            params: c *config
            steps:
              - set: c.noPing
                value: "true"
  - of: WriteTimeout
    steps:
      - return:
          closure:
            params: c *config
            steps:
              - set: c.writeTimeout
                value: d
  - of: AllowOrigins
    participants:
      - id: caller
        kind: actor
      - id: AllowOrigins
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: snapshot
        eval: slices.Clone(origins)
        to: slices
      - return:
          closure:
            params: c *config
            steps:
              - set: c.allowedOrigins
                value: snapshot
              - set: c.anyOrigin
                value: "false"
  - of: AllowAnyOrigin
    steps:
      - return:
          closure:
            params: c *config
            steps:
              - set: c.anyOrigin
                value: "true"
  - of: resolve
    participants:
      - id: caller
        kind: actor
      - id: resolve
        kind: self
      - id: refuseUninterpretable
        kind: internal
      - id: clampToDefaults
        kind: internal
    steps:
      - var:
          name: cfg
          type: config
      - loop:
          do:
            - eval: opt(&cfg)
          key: _
          range: opts
          value: opt
      - opt:
          do:
            - return: config{}, verr
          init:
            bind: verr
            eval: refuseUninterpretable(&cfg)
            to: refuseUninterpretable
          when: verr != nil
      - eval: clampToDefaults(&cfg)
        to: clampToDefaults
      - opt:
          do:
            - return: |-
                config{}, misconfigured("MaxFrameSize", cfg.maxFrameSize,
                			"the frame ceiling is above the message ceiling, so it can never be reached")
          when: cfg.maxFrameSize > cfg.maxMessageSize
      - return: cfg, nil
  - of: refuseUninterpretable
    participants:
      - id: caller
        kind: actor
      - id: refuseUninterpretable
        kind: self
      - id: misconfigured
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: |-
                      misconfigured("Subprotocols", int64(index),
                      				"a subprotocol name must be a non-empty RFC 7230 token")
                    to: misconfigured
                when: "!isToken(name)"
          key: index
          range: cfg.subprotocols
          value: name
      - opt:
          do:
            - return: |-
                misconfigured("PingInterval", int64(cfg.pingInterval),
                			"a negative interval has no meaning; use WithoutPing to disable it")
              to: misconfigured
          when: cfg.pingInterval < 0
      - opt:
          do:
            - return: |-
                misconfigured("WriteTimeout", int64(cfg.writeTimeout),
                			"a negative write budget has no meaning")
              to: misconfigured
          when: cfg.writeTimeout < 0
      - opt:
          do:
            - return: |-
                misconfigured("MaxMessageSize", cfg.maxMessageSize,
                			"a negative ceiling has no meaning, and there is no unbounded setting")
              to: misconfigured
          when: cfg.maxMessageSize < 0
      - opt:
          do:
            - return: |-
                misconfigured("MaxFrameSize", cfg.maxFrameSize,
                			"a negative ceiling has no meaning, and there is no unbounded setting")
              to: misconfigured
          when: cfg.maxFrameSize < 0
      - opt:
          do:
            - return: |-
                misconfigured("MaxMessageSize", cfg.maxMessageSize,
                			"the ceiling exceeds the largest slice this platform can index")
              to: misconfigured
          when: cfg.maxMessageSize > math.MaxInt
      - return: nil
  - of: clampToDefaults
    steps:
      - opt:
          do:
            - set: cfg.pingInterval
              value: DefaultPingInterval
          when: cfg.pingInterval == 0
      - opt:
          do:
            - set: cfg.writeTimeout
              value: DefaultWriteTimeout
          when: cfg.writeTimeout == 0
      - opt:
          do:
            - set: cfg.maxMessageSize
              value: DefaultMaxMessageSize
          when: cfg.maxMessageSize == 0
      - opt:
          do:
            - set: cfg.maxFrameSize
              value: DefaultMaxFrameSize
          when: cfg.maxFrameSize == 0
      - opt:
          do:
            - set: cfg.clock
              value: clock.System
          when: cfg.clock == nil
  - of: isTokenChar
    steps:
      - opt:
          do:
            - return: "true"
          when: ('a' <= c && c <= 'z') || ('A' <= c && c <= 'Z') || ('0' <= c && c <= '9')
      - return: strings.IndexByte("!#$%&'*+-.^_`|~", c) >= 0
  - of: misconfigured
    participants:
      - id: caller
        kind: actor
      - id: misconfigured
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(corenet.WSConnMisconfigured, errs.WrapParams{},
          		errs.String("option", option),
          		errs.Int64("value", value),
          		errs.String("why", why))
        to: errs
  - of: ValidateText
    participants:
      - id: caller
        kind: actor
      - id: ValidateText
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.WSInvalidPayload, errs.WrapParams{},
                			errs.Int("length", len(b)),
                			errs.String("why", "the text payload is not valid UTF-8"))
              to: errs
          when: "!utf8.Valid(b)"
      - return: nil
  - of: NewConn
    participants:
      - id: caller
        kind: actor
      - id: NewConn
        kind: self
      - id: newConn
        kind: internal
    steps:
      - return: newConn(socket, buffered, subprotocol, cfg, draining)
        to: newConn
  - of: newConn
    participants:
      - id: caller
        kind: actor
      - id: newConn
        kind: self
      - id: swallowErr
        kind: internal
      - id: c.watch
        kind: internal
      - id: c.startHeartbeat
        kind: internal
    steps:
      - bind: c
        eval: |-
          &Conn{
          		raw:         socket,
          		br:          buffered,
          		subprotocol: subprotocol,
          		cfg:         *cfg,
          		wbuf:        make([]byte, 0, initialWriteCapacity),
          		done:        make(chan struct{}),
          	}
      - eval: swallowErr(socket.SetDeadline(time.Time{}))
        to: swallowErr
      - eval: c.watch(draining)
        to: c.watch
      - eval: c.startHeartbeat()
        to: c.startHeartbeat
      - return: c
  - of: (*Conn).Subprotocol
    steps:
      - return: c.subprotocol
  - of: (*Conn).Done
    steps:
      - return: c.done
  - of: (*Conn).PeerCloseCode
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).PeerCloseCode
        kind: self
      - id: corenet
        kind: package
    steps:
      - return: corenet.WSCloseCode(c.peerCode.Load())
        to: corenet
  - of: (*Conn).Receive
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).Receive
        kind: self
      - id: c.ended
        kind: internal
      - id: c.nextHeader
        kind: internal
      - id: c.rx.Add
        kind: value
      - id: c.serveControl
        kind: internal
      - id: c.assemble
        kind: internal
      - id: c.completeMessage
        kind: internal
    steps:
      - opt:
          do:
            - return: corenet.WSMessageValue{}, eerr
          init:
            bind: eerr
            eval: c.ended()
            to: c.ended
          when: eerr != nil
      - loop:
          do:
            - bind: header, herr
              eval: c.nextHeader()
              to: c.nextHeader
            - opt:
                do:
                  - return: corenet.WSMessageValue{}, herr
                when: herr != nil
            - eval: c.rx.Add(1)
              to: c.rx.Add
            - opt:
                do:
                  - opt:
                      do:
                        - return: corenet.WSMessageValue{}, cerr
                      init:
                        bind: cerr
                        eval: c.serveControl(header)
                        to: c.serveControl
                      when: cerr != nil
                  - continue: true
                when: header.OpCode.IsControl()
            - bind: complete, derr
              eval: c.assemble(header)
              to: c.assemble
            - opt:
                do:
                  - return: corenet.WSMessageValue{}, derr
                when: derr != nil
            - opt:
                do:
                  - continue: true
                when: "!complete"
            - return: c.completeMessage()
              to: c.completeMessage
          forever: true
  - of: (*Conn).assemble
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).assemble
        kind: self
      - id: c.trackFragment
        kind: internal
      - id: c.readDataPayload
        kind: internal
    steps:
      - opt:
          do:
            - return: false, ferr
          init:
            bind: ferr
            eval: c.trackFragment(header)
            to: c.trackFragment
          when: ferr != nil
      - opt:
          do:
            - return: false, derr
          init:
            bind: derr
            eval: c.readDataPayload(header)
            to: c.readDataPayload
          when: derr != nil
      - return: header.Final, nil
  - of: (*Conn).Send
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).Send
        kind: self
      - id: ValidateText
        kind: internal
      - id: c.sendFrame
        kind: internal
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: verr
                init:
                  bind: verr
                  eval: ValidateText(message.Data)
                  to: ValidateText
                when: verr != nil
          when: "!message.Binary"
      - return: c.sendFrame(message.OpCode(), message.Data)
        to: c.sendFrame
  - of: (*Conn).SendText
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).SendText
        kind: self
      - id: c.Send
        kind: internal
    steps:
      - return: "c.Send(corenet.WSMessageValue{Data: []byte(text)})"
        to: c.Send
  - of: (*Conn).SendBinary
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).SendBinary
        kind: self
      - id: c.Send
        kind: internal
    steps:
      - return: "c.Send(corenet.WSMessageValue{Binary: true, Data: data})"
        to: c.Send
  - of: (*Conn).Ping
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).Ping
        kind: self
      - id: c.sendFrame
        kind: internal
    steps:
      - return: c.sendFrame(corenet.WSPing, payload)
        to: c.sendFrame
  - of: (*Conn).Close
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).Close
        kind: self
      - id: c.CloseWith
        kind: internal
    steps:
      - return: c.CloseWith(corenet.WSCloseNormal, "")
        to: c.CloseWith
  - of: (*Conn).CloseWith
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).CloseWith
        kind: self
      - id: AppendClosePayload
        kind: internal
      - id: c.terminate
        kind: internal
      - id: c.join
        kind: internal
      - id: errs
        kind: package
      - id: swallowErr
        kind: internal
    steps:
      - var:
          name: scratch
          type: "[corenet.WSMaxControlPayload]byte"
      - opt:
          do:
            - eval: c.terminate()
              to: c.terminate
            - eval: c.join()
              to: c.join
            - return: verr
          init:
            bind: _, verr
            eval: AppendClosePayload(scratch[:0], code, reason)
            to: AppendClosePayload
          when: verr != nil
      - opt:
          do:
            - eval: c.terminate()
              to: c.terminate
            - eval: c.join()
              to: c.join
            - return: |-
                errs.Wrap(corenet.WSInvalidPayload, errs.WrapParams{},
                			errs.Int("close_code", int(code)),
                			errs.String("why", "1010 is a client's code; a server never initiates a close with it"))
              to: errs
          when: code == corenet.WSCloseExtensionRequired
      - eval: swallowErr(c.sendClose(code, reason))
        to: swallowErr
      - eval: c.terminate()
        to: c.terminate
      - eval: c.join()
        to: c.join
      - return: nil
  - of: (*Conn).nextHeader
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).nextHeader
        kind: self
      - id: io
        kind: stdlib
      - id: FrameHeaderLen
        kind: internal
      - id: ParseFrameHeader
        kind: internal
      - id: parsed.ValidateFromClient
        kind: internal
    steps:
      - opt:
          do:
            - return: FrameHeaderValue{}, c.socketGone(rerr)
          init:
            bind: _, rerr
            eval: io.ReadFull(c.br, c.hdr[:MinHeaderLen])
            to: io
          when: rerr != nil
      - bind: want
        eval: FrameHeaderLen(c.hdr[:MinHeaderLen])
        to: FrameHeaderLen
      - opt:
          do:
            - opt:
                do:
                  - return: FrameHeaderValue{}, c.socketGone(rerr)
                init:
                  bind: _, rerr
                  eval: io.ReadFull(c.br, c.hdr[MinHeaderLen:want])
                  to: io
                when: rerr != nil
          when: want > MinHeaderLen
      - bind: parsed, perr
        eval: ParseFrameHeader(c.hdr[:want])
        to: ParseFrameHeader
      - opt:
          do:
            - return: FrameHeaderValue{}, c.failConnection(corenet.WSCloseProtocolError, perr)
          when: perr != nil
      - opt:
          do:
            - return: FrameHeaderValue{}, c.failConnection(corenet.WSCloseProtocolError, merr)
          init:
            bind: merr
            eval: parsed.ValidateFromClient()
            to: parsed.ValidateFromClient
          when: merr != nil
      - opt:
          do:
            - return: |-
                FrameHeaderValue{}, c.failConnection(corenet.WSCloseTooLarge,
                			errs.Wrap(corenet.WSMessageTooLarge, errs.WrapParams{},
                				errs.Int64("announced", int64(parsed.Length)),
                				errs.Int64("ceiling", c.cfg.maxFrameSize),
                				errs.String("why", "the frame announces more than the frame ceiling")))
          when: "!parsed.OpCode.IsControl() && parsed.Length > uint64(c.cfg.maxFrameSize)"
      - return: parsed, nil
  - of: (*Conn).trackFragment
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).trackFragment
        kind: self
      - id: c.failConnection
        kind: internal
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: |-
                      c.failConnection(corenet.WSCloseProtocolError,
                      				errs.Wrap(corenet.WSProtocolViolation, errs.WrapParams{},
                      					errs.String("why", "a continuation frame arrived with no message in progress")))
                    to: c.failConnection
                when: "!c.assembling"
            - return: nil
          when: header.OpCode == corenet.WSContinuation
      - opt:
          do:
            - return: |-
                c.failConnection(corenet.WSCloseProtocolError,
                			errs.Wrap(corenet.WSProtocolViolation, errs.WrapParams{},
                				errs.String("opcode", header.OpCode.String()),
                				errs.String("why", "a new data frame interrupted a fragmented message")))
              to: c.failConnection
          when: c.assembling
      - set: c.assembling
        value: "true"
      - set: c.msgOp
        value: header.OpCode
      - set: c.msg
        value: c.msg[:0]
      - return: nil
  - of: (*Conn).readDataPayload
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).readDataPayload
        kind: self
      - id: c.failConnection
        kind: internal
      - id: io
        kind: stdlib
      - id: c.socketGone
        kind: internal
      - id: ApplyMask
        kind: internal
    steps:
      - bind: start
        eval: len(c.msg)
      - opt:
          do:
            - return: |-
                c.failConnection(corenet.WSCloseTooLarge,
                			errs.Wrap(corenet.WSMessageTooLarge, errs.WrapParams{},
                				errs.Int64("accumulated", int64(start)+int64(header.Length)),
                				errs.Int64("ceiling", c.cfg.maxMessageSize),
                				errs.String("why", "the reassembled message exceeds the message ceiling")))
              to: c.failConnection
          when: int64(start)+int64(header.Length) > c.cfg.maxMessageSize
      - bind: size
        eval: int(header.Length)
      - set: c.msg
        value: slices.Grow(c.msg, size)[:start+size]
      - opt:
          do:
            - return: c.socketGone(rerr)
              to: c.socketGone
          init:
            bind: _, rerr
            eval: io.ReadFull(c.br, c.msg[start:])
            to: io
          when: rerr != nil
      - eval: ApplyMask(c.msg[start:], header.MaskKey)
        to: ApplyMask
      - return: nil
  - of: (*Conn).completeMessage
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).completeMessage
        kind: self
      - id: ValidateText
        kind: internal
    steps:
      - set: c.assembling
        value: "false"
      - opt:
          do:
            - opt:
                do:
                  - return: corenet.WSMessageValue{}, c.failConnection(corenet.WSCloseInvalidPayload, verr)
                init:
                  bind: verr
                  eval: ValidateText(c.msg)
                  to: ValidateText
                when: verr != nil
          when: c.msgOp == corenet.WSText
      - return: "corenet.WSMessageValue{Binary: c.msgOp == corenet.WSBinary, Data: c.msg}, nil"
  - of: (*Conn).serveControl
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).serveControl
        kind: self
      - id: c.readControlPayload
        kind: internal
      - id: c.sendFrame
        kind: internal
      - id: c.serveClose
        kind: internal
    steps:
      - bind: size
        eval: int(header.Length)
      - bind: payload
        eval: c.ctl[:size]
      - opt:
          do:
            - opt:
                do:
                  - return: rerr
                init:
                  bind: rerr
                  eval: c.readControlPayload(payload, header.MaskKey)
                  to: c.readControlPayload
                when: rerr != nil
          when: size > 0
      - switch:
          cases:
            - case: corenet.WSPing
              do:
                - return: c.sendFrame(corenet.WSPong, payload)
                  to: c.sendFrame
            - case: corenet.WSPong
              do:
                - return: nil
            - default: true
              do:
                - return: c.serveClose(payload)
                  to: c.serveClose
          "on": header.OpCode
  - of: (*Conn).readControlPayload
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).readControlPayload
        kind: self
      - id: io
        kind: stdlib
      - id: c.socketGone
        kind: internal
      - id: ApplyMask
        kind: internal
    steps:
      - opt:
          do:
            - return: c.socketGone(rerr)
              to: c.socketGone
          init:
            bind: _, rerr
            eval: io.ReadFull(c.br, payload)
            to: io
          when: rerr != nil
      - eval: ApplyMask(payload, key)
        to: ApplyMask
      - return: nil
  - of: (*Conn).serveClose
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).serveClose
        kind: self
      - id: ParseClosePayload
        kind: internal
      - id: c.failConnection
        kind: internal
      - id: c.peerCode.Store
        kind: value
      - id: swallowErr
        kind: internal
      - id: c.terminate
        kind: internal
      - id: errs
        kind: package
    steps:
      - bind: code, reason, perr
        eval: ParseClosePayload(payload)
        to: ParseClosePayload
      - opt:
          do:
            - return: c.failConnection(closeCodeFor(perr), perr)
              to: c.failConnection
          when: perr != nil
      - eval: c.peerCode.Store(uint32(code))
        to: c.peerCode.Store
      - eval: swallowErr(c.sendClose(code.Echoable(), ""))
        to: swallowErr
      - eval: c.terminate()
        to: c.terminate
      - return: |-
          errs.Wrap(corenet.WSConnClosed, errs.WrapParams{},
          		errs.Int("close_code", int(code)),
          		errs.String("reason", reason))
        to: errs
  - of: (*Conn).sendFrame
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).sendFrame
        kind: self
      - id: c.ended
        kind: internal
      - id: errs
        kind: package
      - id: c.writeLocked
        kind: internal
    steps:
      - lock:
          mutex: c.wmu
      - opt:
          do:
            - return: eerr
          init:
            bind: eerr
            eval: c.ended()
            to: c.ended
          when: eerr != nil
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.WSConnClosed, errs.WrapParams{},
                			errs.String("why", "a Close frame has already been sent"))
              to: errs
          when: c.closeSent
      - return: c.writeLocked(op, payload)
        to: c.writeLocked
  - of: (*Conn).sendClose
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).sendClose
        kind: self
      - id: AppendClosePayload
        kind: internal
      - id: c.writeLocked
        kind: internal
    steps:
      - lock:
          mutex: c.wmu
      - opt:
          do:
            - return: nil
          when: c.closeSent
      - var:
          name: scratch
          type: "[corenet.WSMaxControlPayload]byte"
      - bind: payload, perr
        eval: AppendClosePayload(scratch[:0], code, reason)
        to: AppendClosePayload
      - opt:
          do:
            - return: perr
          when: perr != nil
      - set: c.closeSent
        value: "true"
      - return: c.writeLocked(corenet.WSClose, payload)
        to: c.writeLocked
  - of: (*Conn).writeLocked
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).writeLocked
        kind: self
      - id: AppendFrame
        kind: internal
      - id: swallowErr
        kind: internal
      - id: c.raw.Write
        kind: internal
      - id: c.terminate
        kind: internal
      - id: errs
        kind: package
    steps:
      - bind: frame, eerr
        eval: AppendFrame(c.wbuf[:0], op, true, payload)
        to: AppendFrame
      - opt:
          do:
            - return: eerr
          when: eerr != nil
      - set: c.wbuf
        value: frame
      - eval: swallowErr(c.raw.SetWriteDeadline(time.Now().Add(c.cfg.writeTimeout)))
        to: swallowErr
      - opt:
          do:
            - eval: c.terminate()
              to: c.terminate
            - return: |-
                errs.Wrap(corenet.WSConnClosed, errs.WrapParams{},
                			errs.String("cause", werr.Error()))
              to: errs
          init:
            bind: _, werr
            eval: c.raw.Write(frame)
            to: c.raw.Write
          when: werr != nil
      - return: nil
  - of: (*Conn).failConnection
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).failConnection
        kind: self
      - id: swallowErr
        kind: internal
      - id: c.terminate
        kind: internal
    steps:
      - eval: swallowErr(c.sendClose(code, ""))
        to: swallowErr
      - eval: c.terminate()
        to: c.terminate
      - return: cause
  - of: (*Conn).socketGone
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).socketGone
        kind: self
      - id: c.terminate
        kind: internal
      - id: errs
        kind: package
    steps:
      - eval: c.terminate()
        to: c.terminate
      - return: |-
          errs.Wrap(corenet.WSConnClosed, errs.WrapParams{},
          		errs.String("cause", cause.Error()))
        to: errs
  - of: (*Conn).ended
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).ended
        kind: self
      - id: errs
        kind: package
    steps:
      - select:
          cases:
            - comm: <-c.done
              do:
                - return: errs.Wrap(corenet.WSConnClosed, errs.WrapParams{})
                  to: errs
            - default: true
      - return: nil
  - of: (*Conn).end
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).end
        kind: self
      - id: c.endOnce.Do
        kind: value
    steps:
      - eval: |-
          c.endOnce.Do(func() {
          		//: every observer — Receive, Send, Done, the heartbeat — sees this.
          		close(c.done)
          	})
        to: c.endOnce.Do
  - of: (*Conn).terminate
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).terminate
        kind: self
      - id: c.end
        kind: internal
      - id: swallowErr
        kind: internal
    steps:
      - eval: c.end()
        to: c.end
      - eval: swallowErr(c.raw.Close())
        to: swallowErr
  - of: (*Conn).join
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).join
        kind: self
      - id: c.pinger.Stop
        kind: value
      - id: c.watcher.Stop
        kind: value
    steps:
      - opt:
          do:
            - eval: c.pinger.Stop()
              to: c.pinger.Stop
          when: c.pinger != nil
      - eval: c.watcher.Stop()
        to: c.watcher.Stop
  - of: (*Conn).watch
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).watch
        kind: self
      - id: worker
        kind: package
    steps:
      - set: c.watcher
        to: worker
        value: |-
          worker.Start(func(stop <-chan struct{}) {
          		select {
          		//: Close is joining us.
          		case <-stop:
          		//: the connection already ended some other way.
          		case <-c.done:
          		//: the server began draining. §7.4.1 has a code that says exactly
          		//: this, and a peer told "going away" reconnects somewhere else
          		//: instead of discovering a severed socket and guessing why.
          		case <-draining:
          			swallowErr(c.sendClose(corenet.WSCloseGoingAway, "server shutting down"))
          			c.terminate()
          		}
          	})
  - of: (*Conn).startHeartbeat
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).startHeartbeat
        kind: self
      - id: c.rx.Load
        kind: value
      - id: worker
        kind: package
    steps:
      - opt:
          do:
            - return: ""
          when: c.cfg.noPing
      - set: c.hb.seen
        to: c.rx.Load
        value: c.rx.Load()
      - set: c.pinger
        to: worker
        value: |-
          worker.Every(c.cfg.pingInterval, c.heartbeat,
          		worker.WithClock(c.cfg.clock), worker.WithDone(c.done))
  - of: (*Conn).heartbeat
    participants:
      - id: caller
        kind: actor
      - id: (*Conn).heartbeat
        kind: self
      - id: c.rx.Load
        kind: value
      - id: c.terminate
        kind: internal
    steps:
      - bind: current
        eval: c.rx.Load()
        to: c.rx.Load
      - opt:
          do:
            - eval: c.terminate()
              to: c.terminate
            - return: ""
          when: c.hb.probed && current == c.hb.seen
      - set: c.hb.seen
        value: current
      - set: c.hb.probed
        value: c.Ping(nil) == nil
  - of: closeCodeFor
    steps:
      - opt:
          do:
            - return: corenet.WSCloseInvalidPayload
          when: errs.HasCode(cause, corenet.CodeWSInvalidPayload)
      - return: corenet.WSCloseProtocolError
  - of: swallowErr
    steps:
      - opt:
          do:
            - return: ""
          when: err == nil
