# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      CloseCodeLen is the width of the status code that opens a Close frame's
      payload. A Close payload is therefore either empty or at least this long —
      one byte is not "a truncated code", it is a protocol error.
    items:
      - name: CloseCodeLen
        type: int
        value: "2"
    name: CloseCodeLen
  - doc: MaskLen is the width of the masking key a client prefixes to every frame.
    items:
      - name: MaskLen
        type: int
        value: "4"
    name: MaskLen
  - doc: |-
      MinHeaderLen is the shortest possible frame header: flags/opcode and the
      mask bit with a 7-bit length.
    items:
      - name: MinHeaderLen
        type: int
        value: "2"
    name: MinHeaderLen
  - doc: |-
      MaxHeaderLen is the longest possible frame header: the two fixed bytes, a
      64-bit extended length, and a masking key.
    items:
      - name: MaxHeaderLen
        type: int
        value: MinHeaderLen + length64Width + MaskLen
    name: MaxHeaderLen
  - doc: Frame header bit masks and length markers, from the diagram in RFC 6455 §5.2.
    grouped: true
    items:
      - name: finBit
        type: byte
        value: "0x80"
      - name: reservedBits
        type: byte
        value: "0x70"
      - name: opCodeBits
        type: byte
        value: "0x0F"
      - name: maskBit
        type: byte
        value: "0x80"
      - name: lengthBits
        type: byte
        value: "0x7F"
      - name: length16Marker
        type: byte
        value: "126"
      - name: length64Marker
        type: byte
        value: "127"
      - name: length16Width
        type: int
        value: "2"
      - name: length64Width
        type: int
        value: "8"
    name: finBit
  - doc: |-
      Masking strides. They are not protocol constants — RFC 6455 fixes only
      MaskLen — but sizes ApplyMask moves the payload in, and both are
      multiples of MaskLen so the key never has to be rotated to stay aligned.
    grouped: true
    items:
      - doc: "maskWordWidth is one 64-bit word: the four-byte key spelled twice."
        name: maskWordWidth
        type: int
        value: 2 * MaskLen
      - doc: |-
          maskBlockWidth is four of those, unrolled so the loop's compare and
          branch are amortised over four words instead of one.
        name: maskBlockWidth
        type: int
        value: maskWordsPerBlock * maskWordWidth
      - doc: |-
          maskWordsPerBlock is how many words one block iteration writes. It is
          four because that is where the store port saturates on the machine
          BENCH.md was taken on; nothing in the protocol prefers any value.
        name: maskWordsPerBlock
        type: int
        value: "4"
      - doc: |-
          maskQuadBits is the masking key's width in BITS, which is how far the
          key must be shifted to spell it a second time inside one word.
        name: maskQuadBits
        type: int
        value: 8 * MaskLen
      - doc: |-
          The four word offsets inside one block, named so the unrolled writes
          cannot drift out of step with maskWordWidth.
        name: maskWordAt0
        type: int
        value: 0 * maskWordWidth
      - name: maskWordAt1
        type: int
        value: 1 * maskWordWidth
      - name: maskWordAt2
        type: int
        value: 2 * maskWordWidth
      - name: maskWordAt3
        type: int
        value: 3 * maskWordWidth
    name: maskWordWidth
  - doc: |-
      switchingProtocols is the status line every successful upgrade begins with.
      It is written by hand because by then the response belongs to us: net/http's
      ResponseWriter is out of the picture the moment the socket is hijacked.
    items:
      - name: switchingProtocols
        type: string
        value: "\"HTTP/1.1 101 Switching Protocols\\r\\n\""
    name: switchingProtocols
  - doc: crlf terminates every header line and, on its own, the header block.
    items:
      - name: crlf
        type: string
        value: "\"\\r\\n\""
    name: crlf
  - doc: |-
      nullOrigin is what a browser sends for a sandboxed iframe, a data: URL or a
      file:// page. It names an OPAQUE origin — one that is deliberately equal to
      no other — so it can never satisfy a same-origin rule.
    items:
      - name: nullOrigin
        type: string
        value: "\"null\""
    name: nullOrigin
  - doc: |-
      httpsScheme is the only scheme an Origin may carry when this server
      terminated the request's TLS itself: the browser demonstrably connected over
      https, so a page it loaded over plain http is a different origin.
    items:
      - name: httpsScheme
        type: string
        value: "\"https\""
    name: httpsScheme
  - doc: |-
      DefaultPingInterval is how often an idle connection proves the peer is still
      there. It sits under the idle timeout of every proxy worth naming (nginx and
      most cloud load balancers default to 60 s), so a connection that has nothing
      to say still survives the intermediaries between it and its peer.
    items:
      - name: DefaultPingInterval
        type: time.Duration
        value: 30 * time.Second
    name: DefaultPingInterval
  - doc: |-
      DefaultWriteTimeout bounds ONE frame's write. A connection has no total write
      budget by nature; this is what stops a peer that has stopped reading from
      pinning a goroutine and a socket buffer forever.
    items:
      - name: DefaultWriteTimeout
        type: time.Duration
        value: 10 * time.Second
    name: DefaultWriteTimeout
  - doc: |-
      DefaultMaxMessageSize is the ceiling on one reassembled message. It exists
      because a message's size is chosen by the PEER, one 64-bit field at a time,
      and fragmentation lets that peer keep choosing until the process dies.
    items:
      - comment: 1 MiB
        name: DefaultMaxMessageSize
        type: int64
        value: 1 << 20
    name: DefaultMaxMessageSize
  - doc: |-
      DefaultMaxFrameSize is the ceiling on a single frame's announced payload. It
      is checked before any buffer is sized, which is the whole point: the number
      being checked is the number the attacker wrote.
    items:
      - comment: 1 MiB
        name: DefaultMaxFrameSize
        type: int64
        value: 1 << 20
    name: DefaultMaxFrameSize
  - doc: |-
      initialWriteCapacity pre-sizes the per-connection frame buffer. A few hundred
      bytes covers the overwhelming majority of messages, and the buffer is reused
      for the connection's whole life, so a steady-state send allocates nothing.
    items:
      - name: initialWriteCapacity
        type: int
        value: "512"
    name: initialWriteCapacity
