          do:
            - eval: c.goAway()
              to: c.goAway
          when: closing
      - opt:
          do:
            - eval: st.finishRequest(c.e, idx, prev)
              to: st.finishRequest
          when: idx != noIndex && st.requests[idx].slot == noIndex
  - of: (*h2Call).dispatch
    participants:
      - id: caller
        kind: actor
      - id: (*h2Call).dispatch
        kind: self
      - id: c.offload
        kind: internal
      - id: st.give
        kind: internal
      - id: c.answer
        kind: internal
    steps:
      - bind: st
        eval: c.st
      - switch:
          cases:
            - case: res.Pending
              do:
                - set: idx
                  to: c.offload
                  value: c.offload(stream, res, isHead, idx)
                - eval: st.give(res)
                  to: st.give
            - case: res.Defer
              do:
                - set: st.deferred
                  value: "append(st.deferred, deferredAnswer{res: res, ref: c.ref, stream: stream, isHead: isHead})"
            - default: true
              do:
                - eval: c.answer(stream, res, isHead)
                  to: c.answer
                - eval: st.give(res)
                  to: st.give
      - return: idx
  - of: (*h2Call).answer
    participants:
      - id: caller
        kind: actor
      - id: (*h2Call).answer
        kind: self
      - id: c.answerStatus
        kind: internal
      - id: st.lane.Headers
        kind: internal
      - id: st.lane.Send
        kind: internal
