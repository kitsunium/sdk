          do:
            - opt:
                do:
                  - eval: f.connError(corehttp2.ErrCodeFrameSize)
                    to: f.connError
                  - return: nil
                when: len(payload) < priorityFieldsLen
            - set: payload
              value: payload[priorityFieldsLen:]
          when: h.Flags&corehttp2.FlagPriority != 0
      - return: payload
  - of: (*feedRun).onHeaderBlock
    participants:
      - id: caller
        kind: actor
      - id: (*feedRun).onHeaderBlock
        kind: self
      - id: f.l.find
        kind: internal
      - id: f.headersOnOpenStream
        kind: internal
      - id: f.connError
        kind: internal
      - id: f.emit
        kind: internal
      - id: f.l.countErr
        kind: internal
      - id: AppendRSTStream
        kind: internal
      - id: f.l.newStream
        kind: internal
      - id: f.l.streams[idx].set
        kind: internal
    steps:
      - bind: idx, _
        eval: f.l.find(f.c, f.h.StreamID)
        to: f.l.find
      - opt:
          do:
            - eval: f.headersOnOpenStream(idx, seq)
              to: f.headersOnOpenStream
            - return: ""
          when: idx != noIndex
      - opt:
          do:
            - eval: f.connError(corehttp2.ErrCodeProtocol)
              to: f.connError
            - return: ""
          when: f.h.StreamID <= f.c.lastStream
      - set: f.c.lastStream
        value: f.h.StreamID
      - opt:
          do:
            - eval: "f.emit(Event{Kind: EventHeaders, Stream: f.h.StreamID, Data: seq.block, Flags: EventDiscard})"
              to: f.emit
            - eval: f.l.countErr(corehttp2.ErrCodeRefusedStream)
              to: f.l.countErr
            - set: f.dst
              to: AppendRSTStream
              value: AppendRSTStream(f.dst, f.h.StreamID, corehttp2.ErrCodeRefusedStream)
            - return: ""
          when: f.c.has(flagGoAway) || int(f.c.open) >= f.l.limits.MaxStreams
      - set: f.c.lastOpen
        value: f.h.StreamID
      - set: idx
        to: f.l.newStream
        value: f.l.newStream(f.c, f.h.StreamID)
      - opt:
          do:
            - eval: f.l.streams[idx].set(streamRemoteClosed)
              to: f.l.streams[idx].set
          when: seq.endStream
      - eval: "f.emit(Event{Kind: EventHeaders, Stream: f.h.StreamID, Data: seq.block, Flags: endFlag(seq.endStream)})"
        to: f.emit
  - of: (*feedRun).headersOnOpenStream
    participants:
      - id: caller
        kind: actor
      - id: (*feedRun).headersOnOpenStream
        kind: self
      - id: f.emit
        kind: internal
      - id: f.streamError
        kind: internal
    steps:
      - bind: st
        eval: "&f.l.streams[idx]"
      - eval: "f.emit(Event{Kind: EventHeaders, Stream: st.id, Data: seq.block, Flags: EventDiscard})"
        to: f.emit
      - opt:
          do:
            - eval: f.streamError(idx, corehttp2.ErrCodeStreamClosed)
              to: f.streamError
            - return: ""
          when: st.has(streamRemoteClosed)
      - eval: f.streamError(idx, corehttp2.ErrCodeProtocol)
        to: f.streamError
  - of: (*feedRun).continuationFrame
    participants:
      - id: caller
        kind: actor
      - id: (*feedRun).continuationFrame
        kind: self
      - id: f.connError
        kind: internal
    steps:
      - eval: f.connError(corehttp2.ErrCodeProtocol)
        to: f.connError
      - return: "0"
  - of: endFlag
    steps:
      - opt:
          do:
            - return: EventEndStream
          when: end
      - return: "0"
  - of: (*Lane).Headers
    participants:
      - id: caller
        kind: actor
      - id: (*Lane).Headers
        kind: self
      - id: l.find
        kind: internal
      - id: NewEncoder(int(c.peerMaxFrame)).AppendHeaders
        kind: internal
      - id: l.streams[idx].set
        kind: internal
      - id: f.finishIfDone
        kind: internal
    steps:
      - bind: idx, _
        eval: l.find(c, stream)
        to: l.find
      - opt:
          do:
            - return: dst, nil
          when: idx == noIndex
      - bind: out, err
        eval: NewEncoder(int(c.peerMaxFrame)).AppendHeaders(dst, stream, res, endStream)
        to: NewEncoder(int(c.peerMaxFrame)).AppendHeaders
      - opt:
          do:
            - return: dst, err
          when: err != nil
      - opt:
          do:
            - bind: f
              eval: "feedRun{l: l, c: c, dst: out}"
            - eval: l.streams[idx].set(streamLocalClosed)
              to: l.streams[idx].set
            - eval: f.finishIfDone(idx)
              to: f.finishIfDone
            - set: out
              value: f.dst
          when: endStream
      - return: out, nil
  - of: (*Lane).Send
    participants:
      - id: caller
        kind: actor
      - id: (*Lane).Send
        kind: self
      - id: l.find
        kind: internal
      - id: f.sendNow
        kind: internal
    steps:
      - bind: idx, _
        eval: l.find(c, stream)
        to: l.find
      - opt:
          do:
            - return: dst
          when: idx == noIndex
      - bind: f
        eval: "feedRun{l: l, c: c, dst: dst}"
      - eval: f.sendNow(idx, body, endStream)
        to: f.sendNow
      - return: f.dst
  - of: (*feedRun).sendNow
    participants:
      - id: caller
        kind: actor
      - id: (*feedRun).sendNow
        kind: self
      - id: f.appendData
        kind: internal
      - id: f.hold
        kind: internal
      - id: st.set
        kind: internal
      - id: f.finishIfDone
        kind: internal
    steps:
      - bind: st
        eval: "&f.l.streams[idx]"
      - bind: "n"
        eval: f.appendData(st, p, end)
        to: f.appendData
      - opt:
          do:
            - eval: f.hold(idx, p[n:], end)
              to: f.hold
            - return: ""
          when: n < len(p)
      - opt:
          do:
            - eval: st.set(streamLocalClosed)
              to: st.set
            - eval: f.finishIfDone(idx)
              to: f.finishIfDone
          when: end
  - of: (*feedRun).appendData
    participants:
      - id: caller
        kind: actor
      - id: (*feedRun).appendData
        kind: self
      - id: corehttp2
        kind: package
      - id: AppendFrameHeader
        kind: internal
    steps:
      - bind: "n"
        eval: min(len(p), int(max(st.sendWindow, 0)), int(max(f.c.sendWindow, 0)))
      - bind: sent
        eval: "0"
      - bind: maxFrame
        eval: int(f.c.peerMaxFrame)
      - loop:
          cond: sent < n
          do:
            - bind: size
              eval: min(n-sent, maxFrame)
            - bind: flags
              eval: corehttp2.FrameFlags(0)
              to: corehttp2
            - opt:
                do:
                  - set: flags
                    value: corehttp2.FlagEndStream
                when: end && sent+size == len(p)
            - set: f.dst
              to: AppendFrameHeader
              value: "AppendFrameHeader(f.dst, corehttp2.FrameValue{Type: corehttp2.FrameData, Flags: flags, StreamID: st.id, Length: size})"
            - set: f.dst
              value: append(f.dst, p[sent:sent+size]...)
            - op: +=
              set: sent
              value: size
      - op: "-="
        set: st.sendWindow
        value: int32(n)
      - op: "-="
        set: f.c.sendWindow
        value: int32(n)
      - opt:
          do:
            - set: f.dst
              to: AppendFrameHeader
              value: "AppendFrameHeader(f.dst, corehttp2.FrameValue{Type: corehttp2.FrameData, Flags: corehttp2.FlagEndStream, StreamID: st.id})"
          when: end && len(p) == 0
      - return: "n"
  - of: (*feedRun).hold
    participants:
      - id: caller
        kind: actor
      - id: (*feedRun).hold
        kind: self
      - id: f.connError
        kind: internal
      - id: f.l.holdOf
        kind: internal
      - id: st.set
        kind: internal
    steps:
      - bind: st
        eval: "&f.l.streams[idx]"
      - opt:
          do:
            - eval: f.connError(corehttp2.ErrCodeEnhanceYourCalm)
              to: f.connError
            - return: ""
          when: int(f.c.held)+len(p) > int(f.l.holdCap)
      - bind: h
        eval: f.l.holdOf(f.c)
        to: f.l.holdOf
      - opt:
          do:
            - op: +=
              set: h.dead
              value: st.holdLen
            - set: h.buf
              value: append(h.buf, h.buf[st.holdOff:st.holdOff+st.holdLen]...)
            - set: st.holdOff
              value: int32(len(h.buf)) - st.holdLen
          when: st.holdLen > 0 && int(st.holdOff+st.holdLen) != len(h.buf)
      - opt:
          do:
            - set: st.holdOff
              value: int32(len(h.buf))
          when: st.holdLen == 0
      - set: h.buf
        value: append(h.buf, p...)
      - op: +=
        set: st.holdLen
        value: int32(len(p))
      - op: +=
        set: f.c.held
        value: int32(len(p))
      - opt:
          do:
            - eval: st.set(streamHoldEnd)
              to: st.set
          when: end
  - of: (*Lane).holdOf
    participants:
      - id: caller
        kind: actor
      - id: (*Lane).holdOf
        kind: self
      - id: l.takeHold
        kind: internal
    steps:
      - opt:
          do:
            - set: c.hold
              to: l.takeHold
              value: l.takeHold()
          when: c.hold == noIndex
      - return: "&l.holds[c.hold]"
  - of: (*Lane).takeHold
    steps:
      - opt:
          do:
            - bind: id
              eval: l.freeHolds[n-1]
            - set: l.freeHolds
              value: l.freeHolds[:n-1]
            - return: id
          init:
            bind: "n"
            eval: len(l.freeHolds)
          when: n > 0
      - set: l.holds
        value: append(l.holds, holdBuffer{})
      - return: int32(len(l.holds) - 1)
  - of: (*Lane).flushHolds
    participants:
      - id: caller
        kind: actor
      - id: (*Lane).flushHolds
        kind: self
      - id: l.flushStream
        kind: internal
      - id: l.compactHold
        kind: internal
    steps:
      - bind: c
        eval: f.c
      - opt:
          do:
            - return: ""
          when: c.held == 0
      - loop:
          cond: idx != noIndex && c.sendWindow > 0
          do:
            - bind: next
              eval: l.streams[idx].next
            - eval: l.flushStream(f, idx)
              to: l.flushStream
            - set: idx
              value: next
          init: idx := c.head
      - eval: l.compactHold(c)
        to: l.compactHold
  - of: (*Lane).flushStream
    participants:
      - id: caller
        kind: actor
      - id: (*Lane).flushStream
        kind: self
      - id: st.has
        kind: internal
      - id: f.appendData
        kind: internal
      - id: st.set
        kind: internal
      - id: f.finishIfDone
        kind: internal
    steps:
      - bind: st
        eval: "&l.streams[idx]"
      - opt:
          do:
            - return: ""
          when: st.holdLen == 0 || st.sendWindow <= 0
      - bind: buf
        eval: l.holds[f.c.hold].buf
      - bind: p
        eval: "buf[st.holdOff : st.holdOff+st.holdLen]"
      - bind: end
        eval: st.has(streamHoldEnd)
        to: st.has
      - bind: "n"
        eval: f.appendData(st, p, end)
        to: f.appendData
      - op: +=
        set: st.holdOff
        value: int32(n)
      - op: "-="
        set: st.holdLen
        value: int32(n)
      - op: "-="
        set: f.c.held
        value: int32(n)
      - op: +=
        set: l.holds[f.c.hold].dead
        value: int32(n)
      - opt:
          do:
            - eval: st.set(streamLocalClosed)
              to: st.set
            - eval: f.finishIfDone(idx)
              to: f.finishIfDone
          when: st.holdLen == 0 && end
  - of: (*Lane).compactHold
    participants:
      - id: caller
        kind: actor
      - id: (*Lane).compactHold
        kind: self
      - id: l.releaseHold
        kind: internal
      - id: l.moveHoldDown
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: c.hold == noIndex
      - opt:
          do:
            - eval: l.releaseHold(c)
              to: l.releaseHold
            - return: ""
          when: c.held == 0
      - bind: h
        eval: "&l.holds[c.hold]"
      - opt:
          do:
            - eval: l.moveHoldDown(c, h)
              to: l.moveHoldDown
          when: int(h.dead)*2 > len(h.buf)
  - of: (*Lane).moveHoldDown
    participants:
      - id: caller
        kind: actor
      - id: (*Lane).moveHoldDown
        kind: self
      - id: l.lowestHold
        kind: internal
    steps:
      - bind: write
        eval: int32(0)
      - loop:
          do:
            - bind: idx
              eval: l.lowestHold(c, write)
              to: l.lowestHold
            - opt:
                do:
                  - break: true
                when: idx == noIndex
            - bind: st
              eval: "&l.streams[idx]"
            - eval: copy(h.buf[write:], h.buf[st.holdOff:st.holdOff+st.holdLen])
            - set: st.holdOff
              value: write
            - op: +=
              set: write
              value: st.holdLen
          forever: true
      - set: h.buf
        value: h.buf[:write]
      - set: h.dead
        value: "0"
  - of: (*Lane).Consume
    participants:
      - id: caller
        kind: actor
      - id: (*Lane).Consume
        kind: self
      - id: l.find
        kind: internal
    steps:
      - op: +=
        set: c.peerCredit
        value: int32(n)
      - bind: idx, _
        eval: l.find(c, stream)
        to: l.find
      - opt:
          do:
            - return: ""
          when: idx == noIndex || l.streams[idx].has(streamRemoteClosed)
      - op: +=
        set: l.streams[idx].peerCredit
        value: int32(n)
  - of: (*Lane).AppendCredits
    participants:
      - id: caller
        kind: actor
      - id: (*Lane).AppendCredits
        kind: self
      - id: AppendWindowUpdate
        kind: internal
    steps:
      - loop:
          cond: idx != noIndex
          do:
            - bind: st
              eval: "&l.streams[idx]"
            - opt:
                do:
                  - set: dst
                    to: AppendWindowUpdate
                    value: AppendWindowUpdate(dst, st.id, uint32(st.peerCredit))
                  - op: +=
                    set: st.peerWindow
                    value: st.peerCredit
                  - set: st.peerCredit
                    value: "0"
                when: st.peerCredit >= int32(l.limits.ReceivePerStream)/creditDivisor
          init: idx := c.head
          post: idx = l.streams[idx].next
      - opt:
          do:
            - set: dst
              to: AppendWindowUpdate
              value: AppendWindowUpdate(dst, 0, uint32(c.peerCredit))
            - op: +=
              set: c.peerWindow
              value: c.peerCredit
            - set: c.peerCredit
              value: "0"
          when: c.peerCredit >= int32(l.limits.ReceivePerConn)/creditDivisor
      - return: dst
  - of: (*Lane).GoAway
    participants:
      - id: caller
        kind: actor
      - id: (*Lane).GoAway
        kind: self
      - id: c.set
        kind: internal
      - id: AppendGoAway
        kind: internal
    steps:
      - opt:
          do:
            - return: dst
          when: c.has(flagGoAway)
      - eval: c.set(flagGoAway)
        to: c.set
      - return: AppendGoAway(dst, c.lastOpen, code)
        to: AppendGoAway
  - of: (*Lane).Abort
    participants:
      - id: caller
        kind: actor
      - id: (*Lane).Abort
        kind: self
      - id: c.set
        kind: internal
      - id: AppendGoAway
        kind: internal
    steps:
      - eval: c.set(flagClosing)
        to: c.set
      - return: AppendGoAway(dst, c.lastOpen, code)
        to: AppendGoAway
  - of: (*Lane).ResetStream
    participants:
      - id: caller
        kind: actor
      - id: (*Lane).ResetStream
        kind: self
      - id: l.find
        kind: internal
      - id: AppendRSTStream
        kind: internal
      - id: l.closeStream
        kind: internal
    steps:
      - bind: idx, _
        eval: l.find(c, stream)
        to: l.find
      - opt:
          do:
            - return: dst
          when: idx == noIndex
      - set: dst
        to: AppendRSTStream
        value: AppendRSTStream(dst, stream, code)
      - eval: l.closeStream(c, idx)
        to: l.closeStream
      - return: dst
  - of: (*Lane).OpenStreams
    steps:
      - return: int(c.open)
  - of: (*feedRun).settingsFrame
    participants:
      - id: caller
        kind: actor
      - id: (*feedRun).settingsFrame
        kind: self
      - id: f.connError
        kind: internal
      - id: f.settingsAck
        kind: internal
      - id: f.frameLen
        kind: internal
      - id: f.c.set
        kind: internal
      - id: f.spendControl
        kind: internal
      - id: f.applySettings
        kind: internal
      - id: AppendSettingsAck
        kind: internal
      - id: f.l.flushHolds
        kind: internal
    steps:
      - opt:
          do:
            - eval: f.connError(corehttp2.ErrCodeProtocol)
              to: f.connError
            - return: "0"
          when: f.h.StreamID != 0
