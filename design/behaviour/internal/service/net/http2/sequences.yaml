      - opt:
          do:
            - eval: f.connError(corehttp2.ErrCodeProtocol)
              to: f.connError
            - return: "0"
          when: f.h.StreamID == 0
      - opt:
          do:
            - eval: f.connError(corehttp2.ErrCodeProtocol)
              to: f.connError
            - return: "0"
          when: f.h.StreamID%2 == 0
