      - opt:
          do:
            - eval: f.connError(corehttp2.ErrCodeFrameSize)
              to: f.connError
            - return: ""
          when: f.h.Length != settingsAckLen
      - eval: f.spendControl()
        to: f.spendControl
      - eval: f.c.decoder.acknowledge()
        to: f.c.decoder.acknowledge
  - of: (*feedRun).applySettings
    participants:
      - id: caller
        kind: actor
      - id: (*feedRun).applySettings
        kind: self
      - id: corehttp2
        kind: package
      - id: binary.BigEndian.Uint32
        kind: value
      - id: f.applySetting
        kind: internal
    steps:
      - bind: payload
        eval: f.payload
