    participants:
      - id: caller
        kind: actor
      - id: Encoder.splitBlock
        kind: self
      - id: AppendFrameHeader
        kind: internal
    steps:
      - bind: maxFrame
        eval: max(e.maxFrame, corehttp2.DefaultMaxFrame)
      - bind: blockLen
        eval: len(dst) - blockStart
      - bind: extra
        eval: (blockLen - 1) / maxFrame
      - bind: end
        eval: len(dst) + extra*corehttp2.FrameHeaderLen
      - set: dst
        value: append(dst, make([]byte, extra*corehttp2.FrameHeaderLen)...)
      - bind: writeTail
        eval: end
      - loop:
          cond: i > 0
          do:
            - bind: fragment
              eval: blockLen - i*maxFrame
            - bind: fragStart
              eval: blockStart + i*maxFrame
            - bind: fragEnd
              eval: fragStart + fragment
            - eval: copy(dst[writeTail-fragment:writeTail], dst[fragStart:fragEnd])
