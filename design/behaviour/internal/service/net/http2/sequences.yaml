    participants:
      - id: caller
        kind: actor
      - id: (*h2Call).resetMalformed
        kind: self
      - id: c.a.aborter.AbortBody
        kind: value
      - id: st.lane.ResetStream
        kind: internal
      - id: st.finishRequest
        kind: internal
    steps:
      - bind: st
        eval: c.st
      - bind: r
        eval: st.requests[idx]
      - opt:
          do:
            - eval: c.a.aborter.AbortBody(&r.req)
