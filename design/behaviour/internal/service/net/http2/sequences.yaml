      - id: caller
        kind: actor
      - id: (*h2Call).serve
        kind: self
      - id: st.take
        kind: internal
      - id: c.a.h.ServeHTTP1
        kind: value
      - id: c.dispatch
        kind: internal
      - id: c.goAway
        kind: internal
      - id: st.finishRequest
        kind: internal
    steps:
      - bind: st
        eval: c.st
      - bind: res
        eval: st.take()
        to: st.take
