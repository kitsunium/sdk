          do:
            - return: nil, 0, corehttp2.CompressionFailed
          when: word&huffFail != 0
      - opt:
          do:
            - set: scratch
              value: append(scratch, byte(word>>huffSymShift))
          when: word&huffEmit != 0
      - return: scratch, word & huffStateMask, nil
  - of: NewDecoder
    steps:
      - bind: capacity
        eval: max(table, corehttp2.DefaultHeaderTable)
      - return: |-
          Decoder{
          		maxList:    maxList,
          		capacity:   int32(capacity),
          		limit:      int32(corehttp2.DefaultHeaderTable),
          		advertised: int32(table),
          		maxSize:    int32(corehttp2.DefaultHeaderTable),
