      - id: caller
        kind: actor
      - id: (*feedRun).frame
        kind: self
      - id: ParseFrameHeader
        kind: internal
      - id: f.connError
        kind: internal
      - id: f.spendControl
        kind: internal
      - id: f.dispatchLow
        kind: internal
      - id: f.dispatchHigh
        kind: internal
    steps:
      - bind: h, n, code
        eval: ParseFrameHeader(in, f.l.limits.MaxFrame)
        to: ParseFrameHeader
      - opt:
          do:
            - return: "0"
          when: n == 0
      - opt:
          do:
            - eval: f.connError(code)
              to: f.connError
            - return: "0"
          when: code != corehttp2.ErrCodeNoError
      - opt:
          do:
            - return: "0"
          when: len(in) < n+h.Length
      - set: f.h, f.payload
        value: h, in[n:n+h.Length]
      - opt:
          do:
            - eval: f.connError(corehttp2.ErrCodeProtocol)
              to: f.connError
            - return: "0"
          when: "!f.c.has(flagSettings) && (h.Type != corehttp2.FrameSettings || h.Flags&corehttp2.FlagAck != 0)"
      - opt:
          do:
            - eval: f.spendControl()
              to: f.spendControl
            - return: n + h.Length
          when: h.Type > frameKnownMax
      - opt:
          do:
            - return: f.dispatchLow(in)
              to: f.dispatchLow
          when: h.Type <= corehttp2.FrameSettings
      - return: f.dispatchHigh()
        to: f.dispatchHigh
  - of: (*feedRun).dispatchLow
    participants:
      - id: caller
        kind: actor
      - id: (*feedRun).dispatchLow
        kind: self
      - id: f.dataFrame
        kind: internal
      - id: f.headersFrame
        kind: internal
      - id: f.priorityFrame
        kind: internal
      - id: f.rstFrame
        kind: internal
      - id: f.settingsFrame
        kind: internal
    steps:
      - switch:
          cases:
            - case: corehttp2.FrameData
              do:
                - return: f.dataFrame()
                  to: f.dataFrame
            - case: corehttp2.FrameHeaders
              do:
                - return: f.headersFrame(in)
                  to: f.headersFrame
            - case: corehttp2.FramePriority
              do:
                - return: f.priorityFrame()
                  to: f.priorityFrame
            - case: corehttp2.FrameRSTStream
              do:
                - return: f.rstFrame()
                  to: f.rstFrame
            - default: true
              do:
                - return: f.settingsFrame()
                  to: f.settingsFrame
          "on": f.h.Type
  - of: (*feedRun).dispatchHigh
    participants:
      - id: caller
        kind: actor
      - id: (*feedRun).dispatchHigh
        kind: self
      - id: f.pushFrame
        kind: internal
      - id: f.pingFrame
        kind: internal
      - id: f.goAwayFrame
        kind: internal
      - id: f.windowFrame
        kind: internal
      - id: f.continuationFrame
        kind: internal
    steps:
      - switch:
          cases:
            - case: corehttp2.FramePushPromise
              do:
                - return: f.pushFrame()
                  to: f.pushFrame
            - case: corehttp2.FramePing
              do:
                - return: f.pingFrame()
                  to: f.pingFrame
            - case: corehttp2.FrameGoAway
              do:
                - return: f.goAwayFrame()
                  to: f.goAwayFrame
            - case: corehttp2.FrameWindowUpdate
              do:
                - return: f.windowFrame()
                  to: f.windowFrame
            - default: true
              do:
                - return: f.continuationFrame()
                  to: f.continuationFrame
          "on": f.h.Type
  - of: (*feedRun).frameLen
    steps:
      - return: corehttp2.FrameHeaderLen + f.h.Length
  - of: (*feedRun).spendControl
    participants:
      - id: caller
        kind: actor
      - id: (*feedRun).spendControl
        kind: self
      - id: f.connError
        kind: internal
    steps:
      - op: ++
        set: f.c.control
      - opt:
          do:
            - eval: f.connError(corehttp2.ErrCodeEnhanceYourCalm)
              to: f.connError
          when: f.c.control > controlPerBatch
  - of: (*feedRun).connError
    participants:
      - id: caller
        kind: actor
      - id: (*feedRun).connError
        kind: self
      - id: f.c.set
        kind: internal
      - id: f.l.countErr
        kind: internal
      - id: AppendGoAway
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: f.c.has(flagClosing)
      - eval: f.c.set(flagClosing)
        to: f.c.set
      - eval: f.l.countErr(code)
        to: f.l.countErr
      - set: f.dst
        to: AppendGoAway
        value: AppendGoAway(f.dst, f.c.lastOpen, code)
  - of: (*feedRun).streamError
    participants:
      - id: caller
        kind: actor
      - id: (*feedRun).streamError
        kind: self
      - id: f.l.countErr
        kind: internal
      - id: AppendRSTStream
        kind: internal
      - id: f.l.closeStream
        kind: internal
    steps:
      - bind: stream
        eval: f.l.streams[idx].id
      - eval: f.l.countErr(code)
        to: f.l.countErr
      - set: f.dst
        to: AppendRSTStream
        value: AppendRSTStream(f.dst, stream, code)
      - eval: f.l.closeStream(f.c, idx)
        to: f.l.closeStream
      - set: f.l.events
        value: "append(f.l.events, Event{Kind: EventReset, Stream: stream, Code: code})"
  - of: (*feedRun).emit
    steps:
      - set: f.l.events
        value: append(f.l.events, ev)
  - of: (*Lane).newStream
    steps:
      - bind: idx
        eval: l.freeStream
      - alt:
          - do:
              - set: l.freeStream
                value: l.streams[idx].next
            when: idx != noIndex
          - do:
              - set: l.streams
                value: append(l.streams, streamState{})
              - set: idx
                value: int32(len(l.streams) - 1)
            else: true
      - set: l.streams[idx]
        value: |-
          streamState{
          		id:         id,
          		next:       c.head,
          		peerWindow: int32(l.limits.ReceivePerStream),
          		sendWindow: c.initialSend,
          	}
      - set: c.head
        value: idx
      - op: ++
        set: c.open
      - return: idx
  - of: (*Lane).closeStream
    participants:
      - id: caller
        kind: actor
      - id: (*Lane).closeStream
        kind: self
      - id: l.find
        kind: internal
      - id: l.freeStreamSlot
        kind: internal
    steps:
      - bind: id
        eval: l.streams[idx].id
      - bind: _, prev
        eval: l.find(c, id)
        to: l.find
      - bind: st
        eval: "&l.streams[idx]"
      - alt:
          - do:
              - set: c.head
                value: st.next
            when: prev == noIndex
          - do:
              - set: l.streams[prev].next
                value: st.next
            else: true
      - op: "--"
        set: c.open
      - op: "-="
        set: c.held
        value: st.holdLen
      - eval: l.freeStreamSlot(idx)
        to: l.freeStreamSlot
  - of: (*Lane).freeStreamSlot
    steps:
      - set: l.streams[idx].next
        value: l.freeStream
      - set: l.freeStream
        value: idx
  - of: (*Lane).releaseHold
    steps:
      - opt:
          do:
            - return: ""
          when: c.hold == noIndex
      - opt:
          do:
            - set: l.holds[c.hold].buf
              value: nil
          when: cap(l.holds[c.hold].buf) > holdKeepMax
      - set: l.holds[c.hold].buf
        value: l.holds[c.hold].buf[:0]
      - set: l.holds[c.hold].dead
        value: "0"
      - set: l.freeHolds
        value: append(l.freeHolds, c.hold)
      - set: c.hold
        value: noIndex
  - of: (*feedRun).finishIfDone
    participants:
      - id: caller
        kind: actor
      - id: (*feedRun).finishIfDone
        kind: self
      - id: AppendRSTStream
        kind: internal
      - id: f.refundReset
        kind: internal
      - id: f.l.closeStream
        kind: internal
