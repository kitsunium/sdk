          do:
            - eval: f.connError(code)
              to: f.connError
            - return: h, 0, false
          when: code != corehttp2.ErrCodeNoError
      - opt:
          do:
            - return: h, 0, false
          when: len(in) < n+h.Length
      - opt:
          do:
            - eval: f.connError(corehttp2.ErrCodeProtocol)
              to: f.connError
            - return: h, 0, false
          when: h.Type != corehttp2.FrameContinuation || h.StreamID != f.h.StreamID
