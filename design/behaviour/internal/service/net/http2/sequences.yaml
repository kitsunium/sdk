      - id: st.finishRequest
        kind: internal
    steps:
      - bind: st
        eval: c.st
      - bind: idx, prev
        eval: st.findRequest(c.e, ev.Stream)
        to: st.findRequest
      - opt:
          do:
            - return: ""
          when: idx == noIndex
      - bind: r
        eval: st.requests[idx]
      - opt:
          do:
            - eval: c.a.aborter.AbortBody(&r.req)
              to: c.a.aborter.AbortBody
