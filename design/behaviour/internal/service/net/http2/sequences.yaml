      - opt:
          do:
            - return: 0, corehttp2.CompressionFailed
          when: value > maxHpackInt
      - return: value, nil
  - of: (*decodeRun).indexed
    participants:
      - id: caller
        kind: actor
      - id: (*decodeRun).indexed
        kind: self
      - id: r.readInt
        kind: internal
      - id: r.fieldByIndex
        kind: internal
      - id: r.emit
        kind: internal
    steps:
      - bind: index, err
        eval: r.readInt(prefix7)
        to: r.readInt
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: corehttp2.CompressionFailed
          when: index == 0
      - bind: field, err
        eval: r.fieldByIndex(index)
        to: r.fieldByIndex
      - opt:
          do:
            - return: err
          when: err != nil
      - return: r.emit(&field)
        to: r.emit
  - of: (*decodeRun).fieldByIndex
    participants:
      - id: caller
        kind: actor
      - id: (*decodeRun).fieldByIndex
        kind: self
      - id: staticField
        kind: internal
      - id: r.dynamicField
        kind: internal
    steps:
      - opt:
          do:
            - return: staticField(index), nil
              to: staticField
          when: index <= staticLen
      - return: r.dynamicField(index)
        to: r.dynamicField
  - of: staticField
