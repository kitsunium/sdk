            - bind: id
              eval: corehttp2.SettingID(binary.BigEndian.Uint16(payload))
              to: corehttp2
            - bind: val
              eval: binary.BigEndian.Uint32(payload[2:])
              to: binary.BigEndian.Uint32
            - set: payload
              value: payload[settingLenLocal:]
            - eval: f.applySetting(id, val)
              to: f.applySetting
  - of: (*feedRun).applySetting
    participants:
      - id: caller
        kind: actor
      - id: (*feedRun).applySetting
        kind: self
      - id: f.applyInitialWindow
        kind: internal
      - id: f.applyMaxFrame
        kind: internal
      - id: f.applyEnablePush
        kind: internal
    steps:
      - switch:
          cases:
            - case: corehttp2.SettingInitialWindowSize
              do:
                - eval: f.applyInitialWindow(val)
                  to: f.applyInitialWindow
            - case: corehttp2.SettingMaxFrameSize
              do:
                - eval: f.applyMaxFrame(val)
                  to: f.applyMaxFrame
            - case: corehttp2.SettingEnablePush
              do:
                - eval: f.applyEnablePush(val)
                  to: f.applyEnablePush
            - default: true
          "on": id
  - of: (*feedRun).applyEnablePush
    participants:
      - id: caller
        kind: actor
      - id: (*feedRun).applyEnablePush
        kind: self
      - id: f.connError
        kind: internal
    steps:
      - opt:
          do:
            - eval: f.connError(corehttp2.ErrCodeProtocol)
              to: f.connError
          when: val > 1
  - of: (*feedRun).applyMaxFrame
    participants:
      - id: caller
        kind: actor
      - id: (*feedRun).applyMaxFrame
        kind: self
      - id: f.connError
        kind: internal
    steps:
      - opt:
          do:
            - eval: f.connError(corehttp2.ErrCodeProtocol)
              to: f.connError
            - return: ""
          when: int64(val) < int64(corehttp2.DefaultMaxFrame) || int64(val) > int64(corehttp2.MaxFrameLimit)
      - set: f.c.peerMaxFrame
        value: int32(val)
  - of: (*feedRun).applyInitialWindow
    participants:
      - id: caller
        kind: actor
      - id: (*feedRun).applyInitialWindow
        kind: self
      - id: f.connError
        kind: internal
    steps:
      - opt:
          do:
            - eval: f.connError(corehttp2.ErrCodeFlowControl)
