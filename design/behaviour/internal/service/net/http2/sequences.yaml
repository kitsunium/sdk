    steps:
      - return: |-
          h.Flags&corehttp2.FlagPadded != 0 &&
          		(h.Type == corehttp2.FrameData || h.Type == corehttp2.FrameHeaders)
  - of: judgePadding
    steps:
      - opt:
          do:
            - return: h, corehttp2.FrameHeaderLen, corehttp2.ErrCodeProtocol
          when: h.Length == 0
      - opt:
          do:
            - return: corehttp2.FrameValue{}, 0, corehttp2.ErrCodeNoError
          when: len(buf) < paddedHeaderLen
      - opt:
          do:
            - return: h, corehttp2.FrameHeaderLen, corehttp2.ErrCodeProtocol
          when: int(buf[corehttp2.FrameHeaderLen]) >= h.Length
      - return: h, corehttp2.FrameHeaderLen, corehttp2.ErrCodeNoError
  - of: AppendFrameHeader
    steps:
      - return: |-
          append(dst,
          		byte(h.Length>>byte0Shift), byte(h.Length>>byte1Shift), byte(h.Length),
          		byte(h.Type), byte(h.Flags),
          		byte(h.StreamID>>24), byte(h.StreamID>>16), byte(h.StreamID>>8), byte(h.StreamID))
  - of: AppendSettings
    participants:
      - id: caller
        kind: actor
      - id: AppendSettings
        kind: self
      - id: AppendFrameHeader
        kind: internal
      - id: binary.BigEndian.AppendUint16
        kind: value
      - id: binary.BigEndian.AppendUint32
        kind: value
    steps:
      - set: dst
        to: AppendFrameHeader
        value: |-
          AppendFrameHeader(dst, corehttp2.FrameValue{
          		Type:   corehttp2.FrameSettings,
          		Length: len(settings) * settingLen,
          	})
      - loop:
          do:
            - set: dst
              to: binary.BigEndian.AppendUint16
              value: binary.BigEndian.AppendUint16(dst, uint16(s.ID))
            - set: dst
              to: binary.BigEndian.AppendUint32
              value: binary.BigEndian.AppendUint32(dst, s.Val)
          key: _
          range: settings
          value: s
      - return: dst
  - of: AppendSettingsAck
    participants:
      - id: caller
        kind: actor
      - id: AppendSettingsAck
        kind: self
      - id: AppendFrameHeader
        kind: internal
    steps:
      - return: "AppendFrameHeader(dst, corehttp2.FrameValue{Type: corehttp2.FrameSettings, Flags: corehttp2.FlagAck})"
        to: AppendFrameHeader
  - of: AppendWindowUpdate
    participants:
      - id: caller
        kind: actor
      - id: AppendWindowUpdate
        kind: self
      - id: AppendFrameHeader
        kind: internal
      - id: binary.BigEndian.AppendUint32
        kind: value
    steps:
      - set: dst
        to: AppendFrameHeader
        value: |-
          AppendFrameHeader(dst, corehttp2.FrameValue{
          		Type: corehttp2.FrameWindowUpdate, StreamID: stream, Length: windowUpdateLen,
          	})
      - return: binary.BigEndian.AppendUint32(dst, increment&streamIDMask)
        to: binary.BigEndian.AppendUint32
  - of: AppendRSTStream
    participants:
      - id: caller
        kind: actor
      - id: AppendRSTStream
        kind: self
      - id: AppendFrameHeader
        kind: internal
      - id: binary.BigEndian.AppendUint32
        kind: value
    steps:
      - set: dst
        to: AppendFrameHeader
        value: |-
          AppendFrameHeader(dst, corehttp2.FrameValue{
          		Type: corehttp2.FrameRSTStream, StreamID: stream, Length: rstStreamLen,
          	})
      - return: binary.BigEndian.AppendUint32(dst, uint32(code))
        to: binary.BigEndian.AppendUint32
  - of: AppendGoAway
    participants:
      - id: caller
        kind: actor
      - id: AppendGoAway
        kind: self
      - id: AppendFrameHeader
        kind: internal
      - id: binary.BigEndian.AppendUint32
        kind: value
    steps:
      - set: dst
        to: AppendFrameHeader
        value: "AppendFrameHeader(dst, corehttp2.FrameValue{Type: corehttp2.FrameGoAway, Length: goAwayLen})"
      - set: dst
        to: binary.BigEndian.AppendUint32
        value: binary.BigEndian.AppendUint32(dst, last&streamIDMask)
      - return: binary.BigEndian.AppendUint32(dst, uint32(code))
        to: binary.BigEndian.AppendUint32
  - of: AppendPing
    participants:
      - id: caller
        kind: actor
      - id: AppendPing
        kind: self
      - id: AppendFrameHeader
        kind: internal
    steps:
      - bind: h
        eval: "corehttp2.FrameValue{Type: corehttp2.FramePing, Length: pingLen}"
      - opt:
          do:
            - set: h.Flags
              value: corehttp2.FlagAck
          when: ack
      - set: dst
        to: AppendFrameHeader
        value: AppendFrameHeader(dst, h)
      - return: append(dst, data[:]...)
  - of: (*Decoder).Decode
    participants:
      - id: caller
        kind: actor
      - id: (*Decoder).Decode
        kind: self
      - id: r.step
        kind: internal
    steps:
      - bind: r
        eval: "decodeRun{d: d, mem: mem, block: block, scratch: scratch, req: req}"
      - set: req.NFields
        value: "0"
      - loop:
          cond: len(r.block) > 0
          do:
            - opt:
                do:
                  - return: r.scratch, err
                init:
                  bind: err
                  eval: r.step()
                  to: r.step
                when: err != nil
      - opt:
          do:
            - return: r.scratch, corehttp2.FieldMalformed
          when: r.invalid
      - return: r.scratch, nil
  - of: (*decodeRun).step
    participants:
      - id: caller
        kind: actor
      - id: (*decodeRun).step
        kind: self
      - id: r.indexed
        kind: internal
      - id: r.literal
        kind: internal
      - id: r.sizeUpdate
        kind: internal
    steps:
      - bind: first
        eval: r.block[0]
      - switch:
          cases:
            - case: first&indexedPrefix != 0
              do:
                - return: r.indexed()
                  to: r.indexed
            - case: first&incrementalMask == incrementalBits
              do:
                - return: r.literal(prefix6, true)
                  to: r.literal
            - case: first&sizeUpdateMask == sizeUpdateBits
              do:
                - return: r.sizeUpdate()
                  to: r.sizeUpdate
            - default: true
              do:
                - return: r.literal(prefix4, false)
                  to: r.literal
  - of: (*decodeRun).readInt
    participants:
      - id: caller
        kind: actor
      - id: (*decodeRun).readInt
        kind: self
      - id: r.readContinuation
        kind: internal
    steps:
      - bind: mask
        eval: byte(1)<<prefix - 1
      - bind: value
        eval: int(r.block[0] & mask)
      - set: r.block
        value: r.block[1:]
      - opt:
          do:
            - return: value, nil
          when: value < int(mask)
