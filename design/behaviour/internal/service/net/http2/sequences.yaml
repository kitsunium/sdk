      - bind: at
        eval: staticOffsetSlots * (index - 1)
      - bind: nameOff, nameLen
        eval: int(staticOffsets[at]), int(staticOffsets[at+1])
      - bind: valOff, valLen
        eval: int(staticOffsets[at+2]), int(staticOffsets[at+3])
      - return: |-
          decodedField{
          		name:  staticBytes[nameOff : nameOff+nameLen : nameOff+nameLen],
          		value: staticBytes[valOff : valOff+valLen : valOff+valLen],
          	}
  - of: (*decodeRun).dynamicField
