  - of: (*Decoder).acknowledge
    steps:
      - set: d.limit
        value: d.advertised
  - of: (*Decoder).slots
    steps:
      - return: d.capacity / entryOverhead
  - of: (*Decoder).ringPut
    steps:
      - bind: "n"
        eval: copy(mem[at:d.capacity], p)
      - eval: copy(mem, p[n:])
      - return: (at + int32(len(p))) % d.capacity
  - of: (*Decoder).ringGet
    steps:
      - opt:
          do:
            - return: append(dst, mem[at:at+n]...)
          when: at+n <= d.capacity
      - bind: first
        eval: d.capacity - at
      - set: dst
        value: append(dst, mem[at:d.capacity]...)
      - return: append(dst, mem[:n-first]...)
  - of: (*Decoder).slotAt
    participants:
      - id: caller
        kind: actor
      - id: (*Decoder).slotAt
        kind: self
      - id: d.slots
        kind: internal
    steps:
      - bind: slots
        eval: d.slots()
        to: d.slots
      - bind: slot
        eval: (d.top - age + slots) % slots
      - bind: at
        eval: d.capacity + slot*slotLen
      - return: int32(uint16(mem[at]) | uint16(mem[at+1])<<8)
  - of: (*Decoder).storeSlot
    steps:
      - set: d.top
        value: (d.top + 1) % d.slots()
      - bind: at
        eval: d.capacity + d.top*slotLen
      - set: mem[at]
        value: byte(offset)
      - set: mem[at+1]
        value: byte(offset >> 8)
  - of: (*Decoder).entryAt
    participants:
      - id: caller
        kind: actor
      - id: (*Decoder).entryAt
        kind: self
      - id: d.slotAt
        kind: internal
      - id: d.ringGet
        kind: internal
    steps:
      - bind: at
        eval: d.slotAt(mem, age)
        to: d.slotAt
      - var:
          name: hdr
          type: "[entryHeaderLen]byte"
      - bind: dst
        eval: d.ringGet(mem, hdr[:0], at, entryHeaderLen)
        to: d.ringGet
      - bind: flag, nameLen, valueLen
        eval: dst[0], d.u16(dst[1:]), d.u16(dst[3:])
      - bind: start
        eval: len(scratch)
      - set: scratch
        to: d.ringGet
        value: d.ringGet(mem, scratch, (at+entryHeaderLen)%d.capacity, int32(nameLen))
      - bind: mid
        eval: len(scratch)
      - set: scratch
        to: d.ringGet
        value: d.ringGet(mem, scratch, (at+entryHeaderLen+int32(nameLen))%d.capacity, int32(valueLen))
      - return: |-
          decodedField{
          		name:    scratch[start:mid:mid],
          		value:   scratch[mid:len(scratch):len(scratch)],
          		invalid: flag&entryFlagInvalid != 0,
          	}, scratch
  - of: (*Decoder).entrySize
    participants:
      - id: caller
        kind: actor
      - id: (*Decoder).entrySize
        kind: self
      - id: d.slotAt
        kind: internal
      - id: d.ringGet
        kind: internal
    steps:
      - bind: at
        eval: d.slotAt(mem, age)
        to: d.slotAt
      - var:
          name: hdr
          type: "[entryHeaderLen]byte"
      - bind: dst
        eval: d.ringGet(mem, hdr[:0], at, entryHeaderLen)
        to: d.ringGet
      - return: int32(d.u16(dst[1:])), int32(d.u16(dst[3:]))
  - of: (*Decoder).nameAt
    participants:
      - id: caller
        kind: actor
      - id: (*Decoder).nameAt
        kind: self
      - id: d.slotAt
        kind: internal
      - id: d.ringGet
        kind: internal
    steps:
      - bind: at
        eval: d.slotAt(mem, age)
        to: d.slotAt
      - var:
          name: hdr
          type: "[entryHeaderLen]byte"
      - bind: dst
        eval: d.ringGet(mem, hdr[:0], at, entryHeaderLen)
        to: d.ringGet
      - bind: nameLen
        eval: int32(d.u16(dst[1:]))
      - bind: start
        eval: len(scratch)
      - set: scratch
        to: d.ringGet
        value: d.ringGet(mem, scratch, (at+entryHeaderLen)%d.capacity, nameLen)
      - return: scratch[start:len(scratch):len(scratch)], scratch
  - of: (*Decoder).u16
    steps:
      - return: uint16(b[0]) | uint16(b[1])<<8
  - of: (*Decoder).evictOldest
    participants:
      - id: caller
        kind: actor
      - id: (*Decoder).evictOldest
        kind: self
      - id: d.entrySize
        kind: internal
    steps:
      - bind: nameLen, valueLen
        eval: d.entrySize(mem, d.count-1)
        to: d.entrySize
      - bind: stored
        eval: entryHeaderLen + nameLen + valueLen
      - set: d.tail
        value: (d.tail + stored) % d.capacity
      - op: "-="
        set: d.size
        value: nameLen + valueLen + entryOverhead
      - op: "--"
        set: d.count
  - of: (*Decoder).shrinkTo
    participants:
      - id: caller
        kind: actor
      - id: (*Decoder).shrinkTo
        kind: self
      - id: d.evictOldest
        kind: internal
    steps:
      - loop:
          cond: d.size > target
          do:
            - eval: d.evictOldest(mem)
              to: d.evictOldest
  - of: (*Decoder).insert
    participants:
      - id: caller
        kind: actor
      - id: (*Decoder).insert
        kind: self
      - id: d.shrinkTo
        kind: internal
      - id: d.ringPut
        kind: internal
      - id: d.storeSlot
        kind: internal
    steps:
      - bind: size
        eval: int32(len(name)) + int32(len(value)) + entryOverhead
      - opt:
          do:
            - eval: d.shrinkTo(mem, 0)
              to: d.shrinkTo
            - return: ""
          when: size > d.maxSize
      - eval: d.shrinkTo(mem, d.maxSize-size)
        to: d.shrinkTo
      - bind: at
        eval: d.head
      - var:
          name: flag
          type: byte
      - opt:
          do:
            - set: flag
              value: entryFlagInvalid
          when: invalid
      - bind: hdr
        eval: "[entryHeaderLen]byte{flag, byte(len(name)), byte(len(name) >> 8), byte(len(value)), byte(len(value) >> 8)}"
      - bind: next
        eval: d.ringPut(mem, at, hdr[:])
        to: d.ringPut
      - set: next
        to: d.ringPut
        value: d.ringPut(mem, next, name)
      - set: d.head
        to: d.ringPut
        value: d.ringPut(mem, next, value)
      - eval: d.storeSlot(mem, at)
        to: d.storeSlot
      - op: ++
        set: d.count
      - op: +=
        set: d.size
        value: size
  - of: validField
    steps:
      - return: validName(f.name) && validValue(f.value)
  - of: nameByte
    steps:
      - return: c >= firstVisible && c <= lastVisible && (c < firstUpper || c > lastUpper) && c != asciiColon
  - of: validValue
    steps:
      - opt:
          do:
            - return: "true"
          when: len(value) == 0
      - return: "!isOWS(value[0]) && !isOWS(value[len(value)-1]) && valueStop.Index(value) < 0"
  - of: isOWS
    steps:
      - return: c == asciiSpace || c == asciiTab
  - of: HandleLoop
    steps:
      - bind: w, _
        eval: h.(corenet.HTTP1Worker)
      - bind: r, _
        eval: h.(corenet.HTTP1BodyReader)
      - bind: ab, _
        eval: h.(corenet.HTTP1BodyAborter)
      - return: |-
          &LoopHandler{
          		h: h, p: p, h1: http1.HandleLoop(h, p), worker: w, reader: r, aborter: ab,
          		serveH1: true, serveH2: true, maxBody: p.Limits().Body, holdCap: defaultHoldCap,
          	}
  - of: NewLoopHandler
    participants:
      - id: caller
        kind: actor
      - id: NewLoopHandler
        kind: self
      - id: HandleLoop
        kind: internal
    steps:
      - return: HandleLoop(h, p)
        to: HandleLoop
  - of: (*LoopHandler).OnStart
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).OnStart
        kind: self
      - id: a.h1.OnStart
        kind: value
      - id: a.state
        kind: internal
    steps:
      - eval: a.h1.OnStart(lanes)
        to: a.h1.OnStart
      - loop:
          do:
            - eval: a.state(i)
              to: a.state
          key: i
          range: lanes
  - of: (*LoopHandler).Honours
    steps:
      - return: k == corenet.OptionProtocols || k == corenet.OptionHTTP2
  - of: (*LoopHandler).SetHTTP
    steps:
      - set: a.limits
        value: v.HTTP2
      - opt:
          do:
            - set: a.serveH1, a.serveH2
              value: false, false
            - loop:
                do:
                  - set: a.serveH1
                    value: a.serveH1 || p == protoHTTP1
                  - set: a.serveH2
                    value: a.serveH2 || p == protoH2
                key: _
                range: v.Protocols
                value: p
          when: v.Protocols != nil
      - opt:
          do:
            - set: a.serveH2
              value: "false"
          when: v.HTTP2Off
  - of: (*LoopHandler).CheckSpill
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).CheckSpill
        kind: self
      - id: a.h1.CheckSpill
        kind: value
      - id: a.checkH2Spill
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: a.h1.CheckSpill(spillCap)
            to: a.h1.CheckSpill
          when: err != nil
      - return: a.checkH2Spill(spillCap)
        to: a.checkH2Spill
  - of: (*LoopHandler).checkH2Spill
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).checkH2Spill
        kind: self
      - id: a.limits.Resolve
        kind: value
      - id: errs
        kind: package
    steps:
      - bind: limits, err
        eval: a.limits.Resolve()
        to: a.limits.Resolve
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: frames
        eval: int(maxContinuationFrames) + 1
      - bind: need
        eval: max(limits.MaxFrame, blockBoundFactor*limits.MaxHeaderList+frames*corehttp2.FrameHeaderLen)
      - opt:
          do:
            - return: |-
                errs.Wrap(corehttp2.LimitsRefused, errs.WrapParams{},
                			errs.String("reason", "spill"), errs.Int("spill_cap", spillCap), errs.Int("needed", need+corehttp2.FrameHeaderLen))
              to: errs
          when: spillCap < need+corehttp2.FrameHeaderLen
      - return: nil
  - of: (*LoopHandler).Unwrap
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).Unwrap
        kind: self
      - id: a.h1.Unwrap
        kind: value
    steps:
      - return: a.h1.Unwrap()
        to: a.h1.Unwrap
  - of: (*LoopHandler).OnOpen
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).OnOpen
        kind: self
      - id: a.state
        kind: internal
      - id: st.remember
        kind: internal
      - id: st.entry
        kind: internal
    steps:
      - bind: st
        eval: a.state(io.Loop())
        to: a.state
      - eval: st.remember(io)
        to: st.remember
      - bind: e
        eval: st.entry(ref)
        to: st.entry
      - set: e.kind, e.gen, e.flags
        value: kindSniffing, ref.Gen, entryLive
      - set: e.requests, e.buffered
        value: noIndex, 0
  - of: (*LoopHandler).OnData
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).OnData
        kind: self
      - id: a.state
        kind: internal
      - id: st.entry
        kind: internal
      - id: a.sniff
        kind: internal
      - id: a.h1.OnData
        kind: value
      - id: a.feed
        kind: internal
    steps:
      - bind: st
        eval: a.state(io.Loop())
        to: a.state
      - bind: e
        eval: st.entry(ref)
        to: st.entry
      - opt:
          do:
            - bind: ready, used
              eval: a.sniff(io, ref, e, buf)
              to: a.sniff
            - opt:
                do:
                  - return: used
                when: "!ready"
          when: e.kind == kindSniffing
      - switch:
          cases:
            - case: kindHTTP1
              do:
                - return: a.h1.OnData(io, ref, buf)
                  to: a.h1.OnData
            - case: kindHTTP2
              do:
                - return: a.feed(io, ref, st, e, buf)
                  to: a.feed
            - default: true
              do:
                - return: len(buf)
          "on": e.kind
  - of: (*LoopHandler).sniff
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).sniff
        kind: self
      - id: bytes
        kind: stdlib
      - id: a.state
        kind: internal
      - id: st.lane.Open
        kind: internal
      - id: a.h1.OnOpen
        kind: value
      - id: a.writeClose
        kind: internal
    steps:
      - bind: "n"
        eval: min(len(buf), clientPrefaceLen)
      - bind: match
        eval: bytes.Equal(buf[:n], clientPrefaceBytes[:n])
        to: bytes
      - opt:
          do:
            - return: false, 0
          when: match && n < clientPrefaceLen
      - switch:
          cases:
            - case: match && a.serveH2
              do:
                - bind: st
                  eval: a.state(io.Loop())
                  to: a.state
                - eval: st.lane.Open(&e.conn)
                  to: st.lane.Open
                - set: e.kind
                  value: kindHTTP2
                - return: true, 0
            - case: "!match && a.serveH1"
              do:
                - eval: a.h1.OnOpen(io, ref)
                  to: a.h1.OnOpen
                - set: e.kind
                  value: kindHTTP1
                - return: true, 0
            - default: true
              do:
                - set: e.kind
                  value: kindRefused
                - eval: a.writeClose(io, ref, refusalPreface, true)
                  to: a.writeClose
                - return: false, len(buf)
  - of: (*LoopHandler).writeClose
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).writeClose
        kind: self
      - id: io.Write
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          init:
            bind: err
            eval: io.Write(ref, p)
            to: io.Write
          when: err == nil && !closing
      - eval: swallowErr(io.Close(ref))
        to: swallowErr
  - of: (*LoopHandler).OnTimeout
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).OnTimeout
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - eval: swallowErr(io.Close(ref))
        to: swallowErr
  - of: (*LoopHandler).OnWritable
    steps:
      - set: _, _
        value: io, ref
  - of: (*LoopHandler).OnClose
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).OnClose
        kind: self
      - id: a.state
        kind: internal
      - id: st.entry
        kind: internal
      - id: a.h1.OnClose
        kind: value
      - id: st.closeRequests
        kind: internal
      - id: st.lane.Close
        kind: internal
    steps:
      - bind: st
        eval: a.state(io.Loop())
        to: a.state
      - bind: e
        eval: st.entry(ref)
        to: st.entry
      - opt:
          do:
            - eval: a.h1.OnClose(io, ref, err)
              to: a.h1.OnClose
          when: e.kind == kindHTTP1
      - opt:
          do:
            - eval: st.closeRequests(a, e)
              to: st.closeRequests
            - eval: st.lane.Close(&e.conn)
              to: st.lane.Close
          when: e.kind == kindHTTP2
      - set: e.kind, e.flags
        value: kindRefused, 0
  - of: (*LoopHandler).state
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).state
        kind: self
      - id: a.lanes.Load
        kind: value
      - id: a.grow
        kind: internal
    steps:
      - opt:
          do:
            - return: (*p)[i]
          init:
            bind: p
            eval: a.lanes.Load()
            to: a.lanes.Load
          when: p != nil && i < len(*p) && (*p)[i] != nil
      - return: a.grow(i)
        to: a.grow
  - of: (*LoopHandler).grow
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).grow
        kind: self
      - id: a.lanes.Load
        kind: value
      - id: newLaneState
        kind: internal
      - id: a.lanes.Store
        kind: value
    steps:
      - lock:
          mutex: a.mu
      - var:
          name: cur
          type: "[]*laneState"
      - opt:
          do:
            - set: cur
              value: "*p"
          init:
            bind: p
            eval: a.lanes.Load()
            to: a.lanes.Load
          when: p != nil
      - opt:
          do:
            - return: cur[i]
          when: i < len(cur) && cur[i] != nil
      - bind: next
        eval: make([]*laneState, max(len(cur), i+1))
      - eval: copy(next, cur)
      - bind: st
        eval: newLaneState(a, i)
        to: newLaneState
      - set: next[i]
        value: st
      - eval: a.lanes.Store(&next)
        to: a.lanes.Store
      - return: st
  - of: swallowErr
    steps:
      - opt:
          do:
            - return: ""
          when: err == nil
  - of: (*connEntry).live
    steps:
      - return: e.flags&entryLive != 0
  - of: (*requestState).has
    steps:
      - return: r.flags&f == f
  - of: newLaneState
    participants:
      - id: caller
        kind: actor
      - id: newLaneState
        kind: self
      - id: a.limits.Resolve
        kind: value
      - id: st.slots.Store
        kind: value
    steps:
      - bind: resolved, err
        eval: a.limits.Resolve()
        to: a.limits.Resolve
      - opt:
          do:
            - set: resolved
              value: defaultLaneLimits
          when: err != nil
      - bind: st
        eval: "&laneState{lane: newLaneResolved(resolved, a.maxBody, a.holdCap), index: i, freeRequests: noIndex}"
      - set: st.req.Lane
        value: i
      - var:
          name: empty
          type: "[]*workSlot"
      - eval: st.slots.Store(&empty)
        to: st.slots.Store
      - return: st
  - of: (*laneState).remember
    participants:
      - id: caller
        kind: actor
      - id: (*laneState).remember
        kind: self
      - id: st.post.Store
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: st.post.Load() != nil
      - eval: "st.post.Store(&postHolder{io: io})"
        to: st.post.Store
  - of: (*laneState).entry
    steps:
      - bind: ring, slot
        eval: int(ref.Ring), int(ref.Slot)
      - opt:
          do:
            - set: st.entries
              value: append(st.entries, make([][]connEntry, ring+1-len(st.entries))...)
          when: ring >= len(st.entries)
      - opt:
          do:
            - bind: grown
              eval: make([]connEntry, max(slot+1, entriesGrowth(len(st.entries[ring]))))
            - eval: copy(grown, st.entries[ring])
            - set: st.entries[ring]
              value: grown
          when: slot >= len(st.entries[ring])
      - return: "&st.entries[ring][slot]"
  - of: entriesGrowth
    steps:
      - opt:
          do:
            - return: entriesInitial
          when: n == 0
      - opt:
          do:
            - return: 2 * n
          when: n < entriesDoubleBelow
      - return: n + n/2
  - of: (*laneState).take
    steps:
      - opt:
          do:
            - return: "&corenet.HTTP1ResponseValue{}"
          when: len(st.free) == 0
      - bind: res
        eval: st.free[len(st.free)-1]
      - set: st.free
        value: st.free[:len(st.free)-1]
      - set: "*res"
        value: corenet.HTTP1ResponseValue{}
      - return: res
  - of: (*laneState).give
    steps:
      - set: st.free
        value: append(st.free, res)
  - of: (*laneState).takeRequest
    participants:
      - id: caller
        kind: actor
      - id: (*laneState).takeRequest
        kind: self
      - id: r.resetKeepingBuffers
        kind: internal
    steps:
      - bind: idx
        eval: st.freeRequests
      - alt:
          - do:
              - set: st.freeRequests
                value: st.requests[idx].next
            when: idx != noIndex
          - do:
              - set: st.requests
                value: append(st.requests, &requestState{})
              - set: idx
                value: int32(len(st.requests) - 1)
            else: true
      - bind: r
        eval: st.requests[idx]
      - eval: r.resetKeepingBuffers(stream, e.requests)
        to: r.resetKeepingBuffers
      - set: e.requests
        value: idx
      - return: idx, r
  - of: (*requestState).resetKeepingBuffers
    steps:
      - bind: head, body
        eval: r.head[:0], r.body[:0]
      - set: "*r"
        value: "requestState{stream: stream, next: next, slot: noIndex, head: head, body: body}"
  - of: (*laneState).unlinkRequest
    steps:
      - bind: r
        eval: st.requests[idx]
      - alt:
          - do:
              - set: e.requests
                value: r.next
            when: prev == noIndex
          - do:
              - set: st.requests[prev].next
                value: r.next
            else: true
  - of: (*laneState).release
    steps:
      - bind: r
        eval: st.requests[idx]
      - opt:
          do:
            - set: r.body
              value: nil
          when: cap(r.body) > holdKeepMax
      - opt:
          do:
            - set: r.head
              value: nil
          when: cap(r.head) > holdKeepMax
      - set: r.next
        value: st.freeRequests
      - set: st.freeRequests
        value: idx
  - of: (*laneState).finishRequest
    participants:
      - id: caller
        kind: actor
      - id: (*laneState).finishRequest
        kind: self
      - id: st.lane.Consume
        kind: internal
      - id: st.unlinkRequest
        kind: internal
    steps:
      - bind: r
        eval: st.requests[idx]
      - opt:
          do:
            - eval: st.lane.Consume(&e.conn, r.stream, int(r.uncredited))
              to: st.lane.Consume
            - set: r.uncredited
              value: "0"
          when: r.uncredited > 0
      - op: "-="
        set: e.buffered
        value: int32(len(r.body))
      - eval: st.unlinkRequest(e, idx, prev)
        to: st.unlinkRequest
      - set: st.completed
        value: append(st.completed, idx)
  - of: (*laneState).closeRequests
    participants:
      - id: caller
        kind: actor
      - id: (*laneState).closeRequests
        kind: self
      - id: a.aborter.AbortBody
        kind: value
      - id: (*st.slots.Load())[r.slot].cancelled.Store
        kind: value
      - id: st.release
        kind: internal
    steps:
      - loop:
          cond: idx != noIndex
          do:
            - bind: r
              eval: st.requests[idx]
            - bind: next
              eval: r.next
            - opt:
                do:
                  - eval: a.aborter.AbortBody(&r.req)
                    to: a.aborter.AbortBody
                when: r.has(requestReading) && a.aborter != nil
            - opt:
                do:
                  - eval: (*st.slots.Load())[r.slot].cancelled.Store(true)
                    to: (*st.slots.Load())[r.slot].cancelled.Store
                when: r.slot != noIndex
            - eval: st.release(idx)
              to: st.release
            - set: idx
              value: next
          init: idx := e.requests
      - set: e.requests, e.buffered
        value: noIndex, 0
  - of: h2Worker.Work
    participants:
      - id: caller
        kind: actor
      - id: h2Worker.Work
        kind: self
      - id: w.h1.Work
        kind: value
      - id: w.a.worker.WorkHTTP1
        kind: value
    steps:
      - opt:
          do:
            - eval: w.h1.Work(lane, job)
              to: w.h1.Work
            - return: ""
          when: job.Slot&slotHTTP2 == 0
      - bind: slot
        eval: (*w.a.state(lane).slots.Load())[job.Slot&^slotHTTP2]
      - opt:
          do:
            - return: ""
          when: slot.cancelled.Load()
      - eval: w.a.worker.WorkHTTP1(lane, job.Arg, &slot.res)
        to: w.a.worker.WorkHTTP1
  - of: (*LoopHandler).Worker
    steps:
      - opt:
          do:
            - return: nil
          when: a.worker == nil
      - return: "h2Worker{a: a, h1: a.h1.Worker()}"
  - of: (*LoopHandler).OnOutbound
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).OnOutbound
        kind: self
      - id: a.h1.OnOutbound
        kind: value
    steps:
      - set: a.holdCap
        value: v.OutputCap
      - eval: a.h1.OnOutbound(v)
        to: a.h1.OnOutbound
      - loop:
          do:
            - set: a.state(i).outbound
              value: out
          key: i
          range: v.Lanes
          value: out
  - of: (*LoopHandler).OnDone
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).OnDone
        kind: self
      - id: a.h1.OnDone
        kind: value
      - id: a.state
        kind: internal
      - id: st.entry
        kind: internal
      - id: st.freeSlot
        kind: internal
      - id: a.answerSlot
        kind: internal
    steps:
      - opt:
          do:
            - eval: a.h1.OnDone(io, job)
              to: a.h1.OnDone
            - return: ""
          when: job.Slot&slotHTTP2 == 0
      - bind: st
        eval: a.state(io.Loop())
        to: a.state
      - bind: idx
        eval: job.Slot &^ slotHTTP2
      - bind: slot
        eval: (*st.slots.Load())[idx]
      - opt:
          do:
            - return: ""
          when: slot.gen != job.Gen
      - bind: e
        eval: st.entry(slot.ref)
        to: st.entry
      - opt:
          do:
            - eval: st.freeSlot(idx)
              to: st.freeSlot
            - return: ""
          when: slot.cancelled.Load() || !e.live() || e.gen != slot.ref.Gen
      - eval: a.answerSlot(io, st, e, slot, idx)
        to: a.answerSlot
  - of: (*LoopHandler).answerSlot
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).answerSlot
        kind: self
      - id: c.answer
        kind: internal
      - id: c.goAway
        kind: internal
      - id: st.finishSlot
        kind: internal
      - id: st.lane.AppendCredits
        kind: internal
      - id: a.writeClose
        kind: internal
      - id: st.freeSlot
        kind: internal
    steps:
      - bind: c
        eval: "h2Call{a: a, io: io, ref: slot.ref, st: st, e: e}"
      - bind: "off"
        eval: len(st.out)
      - eval: c.answer(slot.stream, &slot.res, slot.isHead)
        to: c.answer
      - opt:
          do:
            - eval: c.goAway()
              to: c.goAway
          when: slot.res.Close || io.Pressure(slot.ref)
      - eval: st.finishSlot(e, slot.stream)
        to: st.finishSlot
      - set: st.out
        to: st.lane.AppendCredits
        value: st.lane.AppendCredits(&e.conn, st.out)
      - bind: out
        eval: st.out[off:]
      - eval: a.writeClose(io, slot.ref, out, st.lane.Closing(&e.conn) || st.lane.Done(&e.conn))
        to: a.writeClose
      - set: st.out
        value: st.out[:off]
      - eval: st.freeSlot(idx)
        to: st.freeSlot
  - of: (*laneState).finishSlot
    participants:
      - id: caller
        kind: actor
      - id: (*laneState).finishSlot
        kind: self
      - id: st.findRequest
        kind: internal
      - id: st.finishRequest
        kind: internal
      - id: st.releaseCompleted
        kind: internal
    steps:
      - bind: idx, prev
        eval: st.findRequest(e, stream)
        to: st.findRequest
      - opt:
          do:
            - return: ""
          when: idx == noIndex
      - set: st.requests[idx].slot
        value: noIndex
      - eval: st.finishRequest(e, idx, prev)
        to: st.finishRequest
      - opt:
          do:
            - eval: st.releaseCompleted()
              to: st.releaseCompleted
          when: len(st.active) == 0
  - of: (*laneState).releaseCompleted
    participants:
      - id: caller
        kind: actor
      - id: (*laneState).releaseCompleted
        kind: self
      - id: st.release
        kind: internal
    steps:
      - loop:
          do:
            - eval: st.release(idx)
              to: st.release
          key: _
          range: st.completed
          value: idx
      - set: st.completed
        value: st.completed[:0]
  - of: (*h2Call).offload
    participants:
      - id: caller
        kind: actor
      - id: (*h2Call).offload
        kind: self
      - id: c.answerStatus
        kind: internal
      - id: st.takeSlot
        kind: internal
      - id: slot.cancelled.Store
        kind: value
      - id: st.outbound.Send
        kind: value
      - id: st.freeSlot
        kind: internal
      - id: c.answerUnavailable
        kind: internal
      - id: st.takeRequest
        kind: internal
    steps:
      - bind: st
        eval: c.st
      - opt:
          do:
            - eval: c.answerStatus(stream, statusInternal)
              to: c.answerStatus
            - return: idx
          when: res.Defer || c.a.worker == nil || st.outbound == nil
      - bind: slot, slotIdx
        eval: st.takeSlot()
        to: st.takeSlot
      - set: slot.ref, slot.stream, slot.isHead
        value: c.ref, stream, isHead
      - set: slot.res
        value: corenet.HTTP1ResponseValue{}
      - eval: slot.cancelled.Store(false)
        to: slot.cancelled.Store
      - bind: job
        eval: "corenet.LoopJobValue{Ref: c.ref, Slot: slotIdx | slotHTTP2, Gen: slot.gen, Arg: res.Job}"
      - opt:
          do:
            - eval: st.freeSlot(slotIdx)
              to: st.freeSlot
            - eval: c.answerUnavailable(stream)
              to: c.answerUnavailable
            - return: idx
          init:
            bind: err
            eval: st.outbound.Send(c.io, job)
            to: st.outbound.Send
          when: err != nil
      - opt:
          do:
            - set: idx, _
              to: st.takeRequest
              value: st.takeRequest(c.e, stream)
          when: idx == noIndex
      - set: st.requests[idx].slot
        value: int32(slotIdx)
      - return: idx
  - of: (*h2Call).answerUnavailable
    participants:
      - id: caller
        kind: actor
      - id: (*h2Call).answerUnavailable
        kind: self
      - id: st.lane.Headers
        kind: internal
    steps:
      - bind: st
        eval: c.st
      - bind: res
        eval: "&corenet.HTTP1ResponseValue{Status: statusUnavailable, Header: retryAfter}"
      - bind: out, err
        eval: st.lane.Headers(&c.e.conn, stream, res, true, st.out)
        to: st.lane.Headers
      - opt:
          do:
            - set: st.out
              value: out
          when: err == nil
  - of: (*laneState).takeSlot
    participants:
      - id: caller
        kind: actor
      - id: (*laneState).takeSlot
        kind: self
      - id: st.slots.Store
        kind: value
    steps:
      - opt:
          do:
            - bind: idx
              eval: st.freeSlots[n-1]
            - set: st.freeSlots
              value: st.freeSlots[:n-1]
            - bind: slot
              eval: (*st.slots.Load())[idx]
            - op: ++
              set: slot.gen
            - return: slot, idx
          init:
            bind: "n"
            eval: len(st.freeSlots)
          when: n > 0
      - bind: cur
        eval: "*st.slots.Load()"
      - bind: next
        eval: make([]*workSlot, len(cur)+1, max(2*len(cur), len(cur)+1))
      - eval: copy(next, cur)
      - bind: slot
        eval: "&workSlot{idx: uint32(len(cur))}"
      - set: next[len(cur)]
        value: slot
      - eval: st.slots.Store(&next)
        to: st.slots.Store
      - return: slot, slot.idx
  - of: (*laneState).freeSlot
    steps:
      - set: st.freeSlots
        value: append(st.freeSlots, idx)
  - of: (*LoopHandler).Draining
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).Draining
        kind: self
      - id: a.lanes.Load
        kind: value
      - id: a.announce
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: a.draining.Swap(true)
      - bind: p
        eval: a.lanes.Load()
        to: a.lanes.Load
      - opt:
          do:
            - return: ""
          when: p == nil
      - loop:
          do:
            - eval: a.announce(st)
              to: a.announce
          key: _
          range: "*p"
          value: st
  - of: (*LoopHandler).announce
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).announce
        kind: self
      - id: st.post.Load
        kind: value
      - id: st.goAwayDone.Store
        kind: value
      - id: drainKeys.Add
        kind: value
      - id: drainRegistry.Store
        kind: value
      - id: holder.io.Post
        kind: value
      - id: drainRegistry.Delete
        kind: value
    steps:
      - bind: holder
        eval: st.post.Load()
        to: st.post.Load
      - opt:
          do:
            - eval: st.goAwayDone.Store(true)
              to: st.goAwayDone.Store
            - return: ""
          when: holder == nil
      - bind: key
        eval: drainKeys.Add(1)
        to: drainKeys.Add
      - eval: drainRegistry.Store(key, st)
        to: drainRegistry.Store
      - opt:
          do:
            - eval: drainRegistry.Delete(key)
              to: drainRegistry.Delete
            - eval: st.goAwayDone.Store(true)
              to: st.goAwayDone.Store
          init:
            bind: err
            eval: holder.io.Post(runDrainGoAway, key)
            to: holder.io.Post
          when: err != nil
  - of: runDrainGoAway
    participants:
      - id: caller
        kind: actor
      - id: runDrainGoAway
        kind: self
      - id: drainRegistry.LoadAndDelete
        kind: value
      - id: st.announceDrain
        kind: internal
    steps:
      - bind: v, ok
        eval: drainRegistry.LoadAndDelete(key)
        to: drainRegistry.LoadAndDelete
      - opt:
          do:
            - return: ""
          when: "!ok"
      - bind: st, _
        eval: v.(*laneState)
      - eval: st.announceDrain(io)
        to: st.announceDrain
  - of: (*laneState).announceDrain
    participants:
      - id: caller
        kind: actor
      - id: (*laneState).announceDrain
        kind: self
      - id: st.announceConn
        kind: internal
      - id: st.goAwayDone.Store
        kind: value
    steps:
      - loop:
          do:
            - loop:
                do:
                  - bind: e
                    eval: "&st.entries[ring][slot]"
                  - opt:
                      do:
                        - continue: true
                      when: "!e.live() || e.kind != kindHTTP2"
                  - eval: "st.announceConn(io, corenet.LoopConnRef{Ring: uint32(ring), Slot: uint32(slot), Gen: e.gen}, e)"
                    to: st.announceConn
                key: slot
                range: st.entries[ring]
          key: ring
          range: st.entries
      - eval: st.goAwayDone.Store(true)
        to: st.goAwayDone.Store
  - of: (*laneState).announceConn
    participants:
      - id: caller
        kind: actor
      - id: (*laneState).announceConn
        kind: self
      - id: st.lane.GoAway
        kind: internal
      - id: swallowErr
        kind: internal
    steps:
      - opt:
          do:
            - op: "|="
              set: e.flags
              value: entryGoAway
            - set: st.jobOut
              to: st.lane.GoAway
              value: st.lane.GoAway(&e.conn, corehttp2.ErrCodeNoError, st.jobOut[:0])
            - eval: swallowErr(io.Write(ref, st.jobOut))
              to: swallowErr
          when: e.flags&entryGoAway == 0
      - opt:
          do:
            - eval: swallowErr(io.Close(ref))
              to: swallowErr
          when: st.lane.Done(&e.conn)
  - of: (*LoopHandler).InFlight
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).InFlight
        kind: self
      - id: a.state
        kind: internal
      - id: st.peek
        kind: internal
    steps:
      - bind: st
        eval: a.state(lane)
        to: a.state
      - bind: e
        eval: st.peek(ref)
        to: st.peek
      - opt:
          do:
            - return: "false"
          when: e == nil || e.kind != kindHTTP2
      - opt:
          do:
            - return: "true"
          when: a.draining.Load() && !st.goAwayDone.Load()
      - return: st.lane.OpenStreams(&e.conn) > 0
  - of: (*LoopHandler).Pending
    steps:
      - return: a.h1.Pending(lane, ref) || a.InFlight(lane, ref)
  - of: (*laneState).peek
    steps:
      - bind: ring, slot
        eval: int(ref.Ring), int(ref.Slot)
      - opt:
          do:
            - return: nil
          when: ring >= len(st.entries) || slot >= len(st.entries[ring])
      - bind: e
        eval: "&st.entries[ring][slot]"
      - opt:
          do:
            - return: nil
          when: "!e.live() || e.gen != ref.Gen"
      - return: e
  - of: mapRequest
    participants:
      - id: caller
        kind: actor
      - id: mapRequest
        kind: self
      - id: resetMapped
        kind: internal
      - id: m.pseudo
        kind: internal
      - id: m.regular
        kind: internal
      - id: m.host
        kind: internal
      - id: joinCookies
        kind: internal
      - id: m.judge
        kind: internal
    steps:
      - eval: resetMapped(req)
        to: resetMapped
      - set: req.Proto, req.Stream
        value: protoMajorHTTP2, stream
      - var:
          name: m
          type: mapState
      - bind: write
        eval: "0"
      - loop:
          do:
            - bind: name
              eval: req.Fields[i].Name
            - opt:
                do:
                  - eval: m.pseudo(name, req.Fields[i].Value)
                    to: m.pseudo
                  - continue: true
                when: len(name) > 0 && name[0] == ':'
            - eval: m.regular(req, i)
              to: m.regular
            - opt:
                do:
                  - set: req.Fields[write]
                    value: req.Fields[i]
                when: write != i
            - op: ++
              set: write
          key: i
          range: req.NFields
      - set: req.NFields
        value: write
      - opt:
          do:
            - set: m.v.malformed
              value: "true"
            - return: m.v
          when: m.v.malformed || !m.complete()
      - set: req.Method, req.Target, req.Scheme
        value: m.method, m.target, m.scheme
      - set: req.Host, req.HasHost
        to: m.host
        value: m.host(req)
      - opt:
          do:
            - set: m.v.refusal
              value: http1.RefusalTargetHost
            - return: m.v
          when: m.hostConflict(req)
      - opt:
          do:
            - eval: joinCookies(req, st)
              to: joinCookies
          when: m.crumbs > 1
      - set: req.ContentLength
        value: m.v.wanted
      - set: m.v.refusal
        to: m.judge
        value: m.judge(req)
      - return: m.v
  - of: resetMapped
    participants:
      - id: caller
        kind: actor
      - id: resetMapped
        kind: self
      - id: req.Auth.Reset
        kind: value
      - id: req.RequestID.Reset
        kind: value
    steps:
      - set: req.Method, req.Target, req.Host, req.Authorization, req.Body
        value: nil, nil, nil, nil, nil
      - set: req.Path, req.Query, req.Scheme
        value: nil, nil, nil
      - set: req.ContentLength
        value: "0"
      - set: req.HeadLen, req.Consumed, req.Route, req.RoutePrefix
        value: 0, 0, 0, 0
      - set: req.HasHost, req.HasAuthorization, req.Close, req.Authenticated
        value: false, false, false, false
      - eval: req.Auth.Reset()
        to: req.Auth.Reset
      - set: req.Trace
        value: trace.SpanContextValue{}
      - eval: req.RequestID.Reset()
        to: req.RequestID.Reset
  - of: (*mapState).pseudo
    participants:
      - id: caller
        kind: actor
      - id: (*mapState).pseudo
        kind: self
      - id: m.setOnce
        kind: internal
    steps:
      - opt:
          do:
            - set: m.v.malformed
              value: "true"
            - return: ""
          when: m.seenRegular
      - switch:
          cases:
            - case: bytes.Equal(name, pseudoMethod)
              do:
                - eval: m.setOnce(seenMethod, &m.method, value)
                  to: m.setOnce
            - case: bytes.Equal(name, pseudoPath)
              do:
                - eval: m.setOnce(seenTarget, &m.target, value)
                  to: m.setOnce
            - case: bytes.Equal(name, pseudoScheme)
              do:
                - eval: m.setOnce(seenScheme, &m.scheme, value)
                  to: m.setOnce
            - case: bytes.Equal(name, pseudoAuthority)
              do:
                - eval: m.setOnce(seenAuthority, &m.authority, value)
                  to: m.setOnce
            - default: true
              do:
                - set: m.v.malformed
                  value: "true"
  - of: (*mapState).setOnce
    steps:
      - opt:
          do:
            - set: m.v.malformed
              value: "true"
            - return: ""
          when: m.seen&bit != 0
      - op: "|="
        set: m.seen
        value: bit
      - set: "*slot"
        value: value
  - of: (*mapState).regular
    participants:
      - id: caller
        kind: actor
      - id: (*mapState).regular
        kind: self
      - id: m.authorization
        kind: internal
      - id: m.contentLength
        kind: internal
      - id: m.host1
        kind: internal
      - id: m.refuse
        kind: internal
      - id: m.te
        kind: internal
    steps:
      - set: m.seenRegular
        value: "true"
      - bind: f
        eval: "&req.Fields[i]"
      - switch:
          cases:
            - case: bytes.Equal(f.Name, fieldAuthorization)
              do:
                - eval: m.authorization(req, f.Value)
                  to: m.authorization
            - case: bytes.Equal(f.Name, fieldContentLength)
              do:
                - eval: m.contentLength(f.Value)
                  to: m.contentLength
            - case: bytes.Equal(f.Name, fieldCookie)
              do:
                - op: ++
                  set: m.crumbs
            - case: string(f.Name) == hostFieldName
              do:
                - eval: m.host1()
                  to: m.host1
            - case: bytes.Equal(f.Name, fieldExpect)
              do:
                - eval: m.refuse(http1.RefusalExpect)
                  to: m.refuse
            - case: bytes.Equal(f.Name, fieldTE)
              do:
                - eval: m.te(f.Value)
                  to: m.te
            - case: connectionSpecific(f.Name)
              do:
                - set: m.v.malformed
                  value: "true"
  - of: (*mapState).te
    steps:
      - opt:
          do:
            - set: m.v.malformed
              value: "true"
          when: "!bytes.EqualFold(value, valueTrailers)"
  - of: connectionSpecific
    steps:
      - return: |-
          bytes.Equal(name, fieldConnection) || bytes.Equal(name, fieldKeepAlive) ||
          		bytes.Equal(name, fieldProxyConnection) || bytes.Equal(name, fieldTransferEncoding) ||
          		bytes.Equal(name, fieldUpgrade)
  - of: (*mapState).host1
    participants:
      - id: caller
        kind: actor
      - id: (*mapState).host1
        kind: self
      - id: m.refuse
        kind: internal
    steps:
      - op: ++
        set: m.hosts
      - opt:
          do:
            - eval: m.refuse(http1.RefusalHostDuplicated)
              to: m.refuse
          when: m.hosts > 1
  - of: (*mapState).authorization
    participants:
      - id: caller
        kind: actor
      - id: (*mapState).authorization
        kind: self
      - id: m.refuse
        kind: internal
    steps:
      - opt:
          do:
            - eval: m.refuse(http1.RefusalAuthorizationDuplicated)
              to: m.refuse
            - return: ""
          when: req.HasAuthorization
      - set: req.HasAuthorization
        value: "true"
      - set: req.Authorization
        value: value
  - of: (*mapState).contentLength
    participants:
      - id: caller
        kind: actor
      - id: (*mapState).contentLength
        kind: self
      - id: m.refuse
        kind: internal
      - id: parseDecimal
        kind: internal
    steps:
      - opt:
          do:
            - eval: m.refuse(http1.RefusalContentLengthDuplicated)
              to: m.refuse
            - return: ""
          when: m.v.declared
      - bind: n, ok
        eval: parseDecimal(value)
        to: parseDecimal
      - opt:
          do:
            - eval: m.refuse(http1.RefusalContentLength)
              to: m.refuse
            - return: ""
          when: "!ok"
      - set: m.v.wanted, m.v.declared
        value: n, true
  - of: (*mapState).refuse
    steps:
      - opt:
          do:
            - set: m.v.refusal
              value: r
          when: m.v.refusal == http1.RefusalNone
  - of: (*mapState).complete
    steps:
      - opt:
          do:
            - return: "false"
          when: m.seen&seenMethod == 0
      - opt:
          do:
            - return: "true"
          when: bytes.Equal(m.method, methodConnect)
      - return: m.seen&seenScheme != 0 && len(m.target) > 0
  - of: (*mapState).host
    participants:
      - id: caller
        kind: actor
      - id: (*mapState).host
        kind: self
      - id: req.Field
        kind: value
    steps:
      - opt:
          do:
            - return: m.authority, true
          when: m.seen&seenAuthority != 0
      - bind: v, ok
        eval: req.Field(hostFieldName)
        to: req.Field
      - return: v, ok
  - of: (*mapState).hostConflict
    participants:
      - id: caller
        kind: actor
      - id: (*mapState).hostConflict
        kind: self
      - id: req.Field
        kind: value
    steps:
      - opt:
          do:
            - return: "false"
          when: m.seen&seenAuthority == 0
      - bind: v, ok
        eval: req.Field(hostFieldName)
        to: req.Field
      - return: ok && !bytes.Equal(v, m.authority)
  - of: (*mapState).judge
    participants:
      - id: caller
        kind: actor
      - id: (*mapState).judge
        kind: self
      - id: http1
        kind: package
    steps:
      - opt:
          do:
            - return: m.v.refusal
          when: m.v.refusal != http1.RefusalNone
      - opt:
          do:
            - return: http1.RefusalMethodUnsupported
          when: bytes.Equal(m.method, methodConnect)
      - opt:
          do:
            - return: http1.RefusalTargetForm
          when: m.target[0] != '/' && (len(m.target) != 1 || m.target[0] != '*')
      - return: http1.Canonical(req)
        to: http1
  - of: copyRequest
    participants:
      - id: caller
        kind: actor
      - id: copyRequest
        kind: self
      - id: slices
        kind: stdlib
      - id: copyBytes
        kind: internal
    steps:
      - bind: size
        eval: len(src.Method) + len(src.Target) + len(src.Host) + len(src.Authorization) + len(src.Path) + len(src.Query) + len(src.Scheme)
      - loop:
          do:
            - op: +=
              set: size
              value: len(src.Fields[i].Name) + len(src.Fields[i].Value)
          key: i
          range: src.NFields
      - set: head
        to: slices
        value: slices.Grow(head[:0], size)
      - set: "*dst"
        value: "*src"
      - set: dst.Method, head
        to: copyBytes
        value: copyBytes(head, src.Method)
      - set: dst.Target, head
        to: copyBytes
        value: copyBytes(head, src.Target)
      - set: dst.Host, head
        to: copyBytes
        value: copyBytes(head, src.Host)
      - set: dst.Authorization, head
        to: copyBytes
        value: copyBytes(head, src.Authorization)
      - set: dst.Path, head
        to: copyBytes
        value: copyBytes(head, src.Path)
      - set: dst.Query, head
        to: copyBytes
        value: copyBytes(head, src.Query)
      - set: dst.Scheme, head
        to: copyBytes
        value: copyBytes(head, src.Scheme)
      - set: dst.Fields
        value: src.Fields
      - loop:
          do:
            - set: dst.Fields[i].Name, head
              to: copyBytes
              value: copyBytes(head, src.Fields[i].Name)
            - set: dst.Fields[i].Value, head
              to: copyBytes
              value: copyBytes(head, src.Fields[i].Value)
          key: i
          range: src.NFields
      - return: head
  - of: copyBytes
    steps:
      - opt:
          do:
            - return: nil, head
          when: b == nil
      - bind: start
        eval: len(head)
      - set: head
        value: append(head, b...)
      - return: head[start:len(head):len(head)], head
  - of: (*LoopHandler).feed
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).feed
        kind: self
      - id: st.lane.Feed
        kind: internal
      - id: c.event
        kind: internal
      - id: c.goAway
        kind: internal
      - id: st.pushWrite
        kind: internal
    steps:
      - bind: "off"
        eval: len(st.out)
      - bind: n, out
        eval: st.lane.Feed(&e.conn, buf, st.out)
        to: st.lane.Feed
      - set: st.out
        value: out
      - bind: c
        eval: "h2Call{a: a, io: io, ref: ref, st: st, e: e}"
      - loop:
          do:
            - eval: c.event(ev)
              to: c.event
          key: _
          range: st.lane.Events()
          value: ev
      - opt:
          do:
            - eval: c.goAway()
              to: c.goAway
          when: io.Pressure(ref)
      - eval: st.pushWrite(ref, off, e)
        to: st.pushWrite
      - return: "n"
  - of: (*laneState).pushWrite
    steps:
      - opt:
          do:
            - set: st.writes
              value: "append(st.writes, write{ref: ref, off: off, end: len(st.out)})"
          when: len(st.out) > off
      - opt:
          do:
            - set: e.activeAt
              value: st.lane.epoch
            - set: st.active
              value: append(st.active, ref)
          when: e.activeAt != st.lane.epoch
  - of: (*h2Call).event
    participants:
      - id: caller
        kind: actor
      - id: (*h2Call).event
        kind: self
      - id: c.onHeaders
        kind: internal
      - id: c.onData
        kind: internal
      - id: c.onReset
        kind: internal
    steps:
      - switch:
          cases:
            - case: EventHeaders
              do:
                - eval: c.onHeaders(ev)
                  to: c.onHeaders
            - case: EventData
              do:
                - eval: c.onData(ev)
                  to: c.onData
            - case: EventReset
              do:
                - eval: c.onReset(ev)
                  to: c.onReset
            - default: true
          "on": ev.Kind
  - of: (*h2Call).onHeaders
    participants:
      - id: caller
        kind: actor
      - id: (*h2Call).onHeaders
        kind: self
      - id: st.lane.Decode
        kind: internal
      - id: st.countAbort
        kind: internal
      - id: st.lane.Abort
        kind: internal
      - id: st.lane.ResetStream
        kind: internal
      - id: st.lane.find
        kind: internal
      - id: c.open
        kind: internal
    steps:
      - bind: st
        eval: c.st
      - var:
          name: err
          type: error
      - set: st.scratch, err
        to: st.lane.Decode
        value: st.lane.Decode(&c.e.conn, ev.Data, st.scratch, &st.req)
      - opt:
          do:
            - eval: st.countAbort(err)
              to: st.countAbort
            - set: st.out
              to: st.lane.Abort
              value: st.lane.Abort(&c.e.conn, corehttp2.ErrCodeCompression, st.out)
            - return: ""
          when: err != nil && !errors.Is(err, corehttp2.FieldMalformed)
      - opt:
          do:
            - return: ""
          when: ev.Flags&EventDiscard != 0
      - opt:
          do:
            - op: ++
              set: st.errs[corehttp2.ErrorTypeProtocol]
            - set: st.out
              to: st.lane.ResetStream
              value: st.lane.ResetStream(&c.e.conn, ev.Stream, corehttp2.ErrCodeProtocol, st.out)
            - return: ""
          when: err != nil
      - opt:
          do:
            - return: ""
          init:
            bind: idx, _
            eval: st.lane.find(&c.e.conn, ev.Stream)
            to: st.lane.find
          when: idx == noIndex
      - eval: c.open(ev.Stream, ev.Flags&EventEndStream != 0)
        to: c.open
  - of: (*h2Call).open
    participants:
      - id: caller
        kind: actor
      - id: (*h2Call).open
        kind: self
      - id: mapRequest
        kind: internal
      - id: st.lane.ResetStream
        kind: internal
      - id: c.answerStatus
        kind: internal
      - id: c.serve
        kind: internal
      - id: c.keep
        kind: internal
    steps:
      - bind: st
        eval: c.st
      - bind: req
        eval: "&st.req"
      - bind: verdict
        eval: mapRequest(req, st, stream)
        to: mapRequest
      - switch:
          cases:
            - case: verdict.malformed
              do:
                - op: ++
                  set: st.errs[corehttp2.ErrorTypeProtocol]
                - set: st.out
                  to: st.lane.ResetStream
                  value: st.lane.ResetStream(&c.e.conn, stream, corehttp2.ErrCodeProtocol, st.out)
            - case: verdict.refusal != http1.RefusalNone
              do:
                - eval: c.answerStatus(stream, verdict.refusal.Status())
                  to: c.answerStatus
            - case: end
              do:
                - eval: c.serve(stream, req, noIndex, noIndex)
                  to: c.serve
            - default: true
              do:
                - eval: c.keep(stream, verdict)
                  to: c.keep
  - of: (*h2Call).keep
    participants:
      - id: caller
        kind: actor
      - id: (*h2Call).keep
        kind: self
      - id: st.takeRequest
        kind: internal
      - id: copyRequest
        kind: internal
    steps:
      - bind: st
        eval: c.st
      - bind: _, r
        eval: st.takeRequest(c.e, stream)
        to: st.takeRequest
      - set: r.head
        to: copyRequest
        value: copyRequest(&r.req, &st.req, r.head)
      - set: r.wanted
        value: v.wanted
      - opt:
          do:
            - op: "|="
              set: r.flags
              value: requestDeclared
          when: v.declared
      - opt:
          do:
            - op: "|="
              set: r.flags
              value: requestHead
          when: bytes.Equal(r.req.Method, methodHEAD)
  - of: (*h2Call).onData
    participants:
      - id: caller
        kind: actor
      - id: (*h2Call).onData
        kind: self
      - id: st.findRequest
        kind: internal
      - id: st.lane.Consume
        kind: internal
      - id: c.refuseBody
        kind: internal
      - id: c.resetMalformed
        kind: internal
      - id: c.take
        kind: internal
    steps:
      - bind: st
        eval: c.st
      - bind: idx, prev
        eval: st.findRequest(c.e, ev.Stream)
        to: st.findRequest
      - opt:
          do:
            - eval: st.lane.Consume(&c.e.conn, ev.Stream, len(ev.Data))
              to: st.lane.Consume
            - return: ""
          when: idx == noIndex
      - bind: r
        eval: st.requests[idx]
      - opt:
          do:
            - eval: st.lane.Consume(&c.e.conn, ev.Stream, len(ev.Data))
              to: st.lane.Consume
            - return: ""
          when: r.has(requestRefused)
      - opt:
          do:
            - eval: c.refuseBody(idx, prev, statusContentTooLarge)
              to: c.refuseBody
            - return: ""
          when: ev.Flags&EventOverBody != 0
      - opt:
          do:
            - eval: c.resetMalformed(idx, prev)
              to: c.resetMalformed
            - return: ""
          when: r.has(requestDeclared) && r.received()+int64(len(ev.Data)) > r.wanted
      - eval: c.take(idx, prev, r, ev)
        to: c.take
  - of: (*requestState).received
    steps:
      - return: int64(len(r.body)) + r.chunks
  - of: (*h2Call).take
    participants:
      - id: caller
        kind: actor
      - id: (*h2Call).take
        kind: self
      - id: c.a.reader.OnBody
        kind: value
      - id: st.lane.Consume
        kind: internal
      - id: c.buffer
        kind: internal
      - id: c.resetMalformed
        kind: internal
      - id: c.serve
