              to: ParseFrameHeader
            - set: f.l.join
              value: append(f.l.join, in[off+n:off+n+h.Length]...)
            - op: +=
              set: "off"
              value: n + h.Length
      - bind: block
        eval: f.l.join[start:len(f.l.join):len(f.l.join)]
      - return: "headerSequence{total: end, block: block, endStream: endStream}"
  - of: (*feedRun).fragmentOf
    participants:
      - id: caller
        kind: actor
      - id: (*feedRun).fragmentOf
        kind: self
      - id: f.connError
        kind: internal
    steps:
      - opt:
          do:
            - bind: pad
              eval: int(payload[0])
            - set: payload
              value: "payload[1 : len(payload)-pad]"
          when: h.Flags&corehttp2.FlagPadded != 0
