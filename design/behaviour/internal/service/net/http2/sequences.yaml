  - of: (*decodeRun).sizeUpdate
    participants:
      - id: caller
        kind: actor
      - id: (*decodeRun).sizeUpdate
        kind: self
      - id: r.readInt
        kind: internal
      - id: r.d.shrinkTo
        kind: internal
