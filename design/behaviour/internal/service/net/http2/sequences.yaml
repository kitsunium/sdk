        eval: uint(0)
      - loop:
          do:
            - opt:
                do:
                  - return: 0, corehttp2.CompressionFailed
                when: len(r.block) == 0
            - bind: b
              eval: r.block[0]
            - set: r.block
              value: r.block[1:]
            - op: +=
              set: value
              value: int(b&^continuationBit) << shift
            - opt:
                do:
                  - return: checkedInt(value)
                    to: checkedInt
                when: b&continuationBit == 0
            - op: +=
              set: shift
              value: continuationShift
          range: maxIntBytes
