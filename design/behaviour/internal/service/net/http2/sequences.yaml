      - id: caller
        kind: actor
      - id: Encoder.AppendHeaders
        kind: self
      - id: cmpInt
        kind: internal
      - id: AppendFrameHeader
        kind: internal
      - id: appendStatus
        kind: internal
      - id: appendResponseFields
        kind: internal
      - id: appendExtraFields
        kind: internal
