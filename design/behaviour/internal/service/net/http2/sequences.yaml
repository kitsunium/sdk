        to: f.c.set
      - eval: f.spendControl()
        to: f.spendControl
      - eval: f.applySettings()
        to: f.applySettings
      - opt:
          do:
            - set: f.dst
              to: AppendSettingsAck
              value: AppendSettingsAck(f.dst)
            - eval: f.l.flushHolds(f)
              to: f.l.flushHolds
          when: "!f.c.has(flagClosing)"
      - return: f.frameLen()
        to: f.frameLen
  - of: (*feedRun).settingsAck
    participants:
      - id: caller
        kind: actor
      - id: (*feedRun).settingsAck
        kind: self
      - id: f.connError
        kind: internal
      - id: f.spendControl
        kind: internal
      - id: f.c.decoder.acknowledge
        kind: internal
