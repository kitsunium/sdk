        value: int32(size)
      - eval: r.d.shrinkTo(r.mem, r.d.maxSize)
        to: r.d.shrinkTo
      - return: nil
  - of: (*decodeRun).literal
    participants:
      - id: caller
        kind: actor
      - id: (*decodeRun).literal
        kind: self
      - id: r.readInt
        kind: internal
      - id: r.literalName
        kind: internal
      - id: r.readString
        kind: internal
      - id: validField
        kind: internal
      - id: r.emit
        kind: internal
      - id: r.d.insert
        kind: internal
    steps:
      - bind: nameIndex, err
        eval: r.readInt(prefix)
        to: r.readInt
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: field, err
        eval: r.literalName(nameIndex)
        to: r.literalName
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: field.value, err
            eval: r.readString(r.budget(&field))
            op: =
            to: r.readString
          when: err != nil
      - set: field.invalid
        to: validField
        value: "!validField(&field)"
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: r.emit(&field)
            to: r.emit
          when: err != nil
      - opt:
          do:
            - eval: r.d.insert(r.mem, field.name, field.value, field.invalid)
              to: r.d.insert
          when: index
      - return: nil
  - of: (*decodeRun).budget
    steps:
      - return: max(r.d.maxList-r.list-len(f.name)-listFieldOverhead, 0)
  - of: (*decodeRun).literalName
