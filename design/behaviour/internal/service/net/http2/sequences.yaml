              to: AppendFrameHeader
            - op: "-="
              set: writeTail
              value: fragment + corehttp2.FrameHeaderLen
            - set: blockLen
              value: fragStart - blockStart
          init: i := extra
          post: i--
      - bind: h
        eval: "corehttp2.FrameValue{Type: corehttp2.FrameHeaders, Flags: flags &^ corehttp2.FlagEndHeaders, StreamID: stream, Length: maxFrame}"
      - eval: AppendFrameHeader(dst[:start], h)
        to: AppendFrameHeader
      - return: dst
  - of: (*decodeRun).huffmanString
