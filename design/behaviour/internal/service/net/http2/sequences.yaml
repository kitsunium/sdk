    participants:
      - id: caller
        kind: actor
      - id: unservable
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - opt:
          do:
            - eval: swallowErr(c.Close())
              to: swallowErr
          init:
            bind: c, ok
            eval: res.File.R.(io.Closer)
          when: ok && res.File.R != nil
      - return: res.Stream || res.Upgrade || res.File.R != nil
  - of: (*h2Call).answerStatus
    participants:
      - id: caller
        kind: actor
      - id: (*h2Call).answerStatus
        kind: self
      - id: st.lane.Headers
        kind: internal
    steps:
      - bind: st
        eval: c.st
      - bind: res
        eval: "&corenet.HTTP1ResponseValue{Status: status}"
      - bind: out, err
        eval: st.lane.Headers(&c.e.conn, stream, res, true, st.out)
        to: st.lane.Headers
      - opt:
          do:
            - set: st.out
              value: out
          when: err == nil
  - of: (*h2Call).goAway
    participants:
      - id: caller
        kind: actor
      - id: (*h2Call).goAway
        kind: self
      - id: c.st.lane.GoAway
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: c.e.flags&entryGoAway != 0
      - op: "|="
        set: c.e.flags
        value: entryGoAway
      - set: c.st.out
        to: c.st.lane.GoAway
        value: c.st.lane.GoAway(&c.e.conn, corehttp2.ErrCodeNoError, c.st.out)
  - of: (*LoopHandler).OnBatchEnd
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).OnBatchEnd
        kind: self
      - id: a.state
        kind: internal
      - id: a.h1.MarkServed
        kind: value
      - id: a.h1.OnBatchEnd
        kind: value
      - id: a.completeDeferred
        kind: internal
      - id: a.flush
        kind: internal
      - id: a.publish
        kind: internal
      - id: st.endBatch
        kind: internal
    steps:
      - bind: st
        eval: a.state(io.Loop())
        to: a.state
      - opt:
          do:
            - eval: a.h1.MarkServed(st.index)
              to: a.h1.MarkServed
          when: st.served > 0
      - eval: a.h1.OnBatchEnd(io)
        to: a.h1.OnBatchEnd
      - opt:
          do:
            - return: ""
          when: len(st.active) == 0 && len(st.writes) == 0 && len(st.deferred) == 0
      - eval: a.completeDeferred(io, st)
        to: a.completeDeferred
      - eval: a.flush(io, st)
        to: a.flush
      - eval: a.publish(st)
        to: a.publish
      - eval: st.endBatch()
        to: st.endBatch
  - of: (*LoopHandler).publish
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).publish
        kind: self
      - id: a.requests.Add
        kind: value
      - id: st.lane.TakeErrors
        kind: internal
      - id: a.errs[i].Add
        kind: value
    steps:
      - opt:
          do:
            - eval: a.requests.Add(uint64(st.served))
              to: a.requests.Add
          when: st.served > 0
      - eval: st.lane.TakeErrors(st.errs[:])
        to: st.lane.TakeErrors
      - loop:
          do:
            - opt:
                do:
                  - eval: a.errs[i].Add(n)
                    to: a.errs[i].Add
                  - set: st.errs[i]
                    value: "0"
                when: n > 0
          key: i
          range: st.errs
          value: "n"
  - of: (*laneState).countAbort
    steps:
      - opt:
          do:
            - op: ++
              set: st.errs[corehttp2.ErrorTypeHeaderList]
            - return: ""
          when: errors.Is(err, corehttp2.HeadersTooLarge)
      - op: ++
        set: st.errs[corehttp2.ErrorTypeCompression]
  - of: (*LoopHandler).HTTPCounts
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).HTTPCounts
        kind: self
      - id: a.h1.HTTPCounts
        kind: value
      - id: a.requests.Load
        kind: value
      - id: a.errs[i].Load
        kind: value
    steps:
      - bind: v
        eval: a.h1.HTTPCounts()
        to: a.h1.HTTPCounts
      - set: v.HTTP2Requests
        to: a.requests.Load
        value: a.requests.Load()
      - loop:
          do:
            - opt:
                do:
                  - set: v.HTTP2Errors
                    value: "append(v.HTTP2Errors, corehttp2.ErrorCountValue{Type: corehttp2.ErrorType(i), Count: n})"
                init:
                  bind: "n"
                  eval: a.errs[i].Load()
                  to: a.errs[i].Load
                when: n > 0
          key: i
          range: a.errs
      - return: v
  - of: (*LoopHandler).completeDeferred
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).completeDeferred
        kind: self
      - id: st.entry
        kind: internal
      - id: st.give
        kind: internal
      - id: c.answer
        kind: internal
      - id: st.pushWrite
        kind: internal
    steps:
      - loop:
          do:
            - bind: d
              eval: "&st.deferred[i]"
            - bind: e
              eval: st.entry(d.ref)
              to: st.entry
            - opt:
                do:
                  - eval: st.give(d.res)
                    to: st.give
                  - continue: true
                when: "!e.live() || e.gen != d.ref.Gen"
            - bind: c
              eval: "h2Call{a: a, io: io, ref: d.ref, st: st, e: e}"
            - bind: "off"
              eval: len(st.out)
            - opt:
                do:
                  - set: d.res.Status
                    value: statusInternal
                  - set: d.res.Header, d.res.Body
                    value: nil, nil
                when: d.res.Defer
            - eval: c.answer(d.stream, d.res, d.isHead)
              to: c.answer
            - eval: st.give(d.res)
              to: st.give
            - eval: st.pushWrite(d.ref, off, e)
              to: st.pushWrite
          key: i
          range: st.deferred
      - set: st.deferred
        value: st.deferred[:0]
  - of: (*LoopHandler).flush
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).flush
        kind: self
      - id: st.credit
        kind: internal
      - id: st.writeAll
        kind: internal
      - id: a.closeIfDone
        kind: internal
    steps:
      - eval: st.credit()
        to: st.credit
      - eval: st.writeAll(io)
        to: st.writeAll
      - loop:
          do:
            - eval: a.closeIfDone(io, ref, st)
              to: a.closeIfDone
          key: _
          range: st.active
          value: ref
  - of: (*laneState).credit
    participants:
      - id: caller
        kind: actor
      - id: (*laneState).credit
        kind: self
      - id: st.entry
        kind: internal
      - id: st.lane.AppendCredits
        kind: internal
      - id: st.pushWrite
        kind: internal
    steps:
      - loop:
          do:
            - bind: e
              eval: st.entry(ref)
              to: st.entry
            - opt:
                do:
                  - continue: true
                when: "!e.live() || e.gen != ref.Gen"
            - bind: "off"
              eval: len(st.out)
            - set: st.out
              to: st.lane.AppendCredits
              value: st.lane.AppendCredits(&e.conn, st.out)
            - eval: st.pushWrite(ref, off, e)
              to: st.pushWrite
          key: _
          range: st.active
          value: ref
  - of: (*laneState).writeAll
    participants:
      - id: caller
        kind: actor
      - id: (*laneState).writeAll
        kind: self
      - id: st.entry
        kind: internal
      - id: io.Write
        kind: value
    steps:
      - loop:
          do:
            - bind: e
              eval: st.entry(w.ref)
              to: st.entry
            - opt:
                do:
                  - continue: true
                when: "!e.live() || e.gen != w.ref.Gen"
            - opt:
                do:
                  - op: "|="
                    set: e.flags
                    value: entryEnded
                init:
                  bind: err
                  eval: io.Write(w.ref, st.out[w.off:w.end])
                  to: io.Write
                when: err != nil
          key: _
          range: st.writes
          value: w
  - of: (*LoopHandler).closeIfDone
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).closeIfDone
        kind: self
      - id: st.entry
        kind: internal
      - id: swallowErr
        kind: internal
    steps:
      - bind: e
        eval: st.entry(ref)
        to: st.entry
      - opt:
          do:
            - return: ""
          when: "!e.live() || e.gen != ref.Gen"
      - opt:
          do:
            - eval: swallowErr(io.Close(ref))
              to: swallowErr
          when: e.flags&entryEnded != 0 || st.lane.Closing(&e.conn) || st.lane.Done(&e.conn)
  - of: (*laneState).endBatch
    participants:
      - id: caller
        kind: actor
      - id: (*laneState).endBatch
        kind: self
      - id: st.lane.EndBatch
        kind: internal
      - id: st.release
        kind: internal
    steps:
      - eval: st.lane.EndBatch()
        to: st.lane.EndBatch
      - set: st.out, st.writes, st.active
        value: st.out[:0], st.writes[:0], st.active[:0]
      - set: st.scratch, st.served
        value: st.scratch[:0], 0
      - loop:
          do:
            - eval: st.release(idx)
              to: st.release
          key: _
          range: st.completed
          value: idx
      - set: st.completed
        value: st.completed[:0]
