      - opt:
          do:
            - return: "decodedField{name: staticField(nameIndex).name}, nil"
          when: nameIndex <= staticLen
      - return: r.dynamicName(nameIndex)
        to: r.dynamicName
  - of: (*decodeRun).dynamicName
    participants:
      - id: caller
        kind: actor
      - id: (*decodeRun).dynamicName
        kind: self
      - id: r.d.entrySize
        kind: internal
      - id: r.d.nameAt
        kind: internal
    steps:
