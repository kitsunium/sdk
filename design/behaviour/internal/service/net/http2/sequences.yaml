              - op: "|="
                set: r.flags
                value: requestReading
              - eval: c.a.reader.OnBody(&r.req, ev.Data, end)
                to: c.a.reader.OnBody
              - eval: st.lane.Consume(&c.e.conn, ev.Stream, len(ev.Data))
                to: st.lane.Consume
            when: c.a.reader != nil
          - do:
              - eval: c.buffer(r, ev)
                to: c.buffer
            else: true
      - opt:
          do:
            - opt:
