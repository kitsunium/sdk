            - return: f.c.scanOff, max(f.c.scanBlock, firstLen)
          when: f.c.scanOff > frameEnd && int(f.c.scanOff) <= len(in)
      - set: f.c.scanFrames
        value: "0"
      - return: frameEnd, firstLen
  - of: (*feedRun).withinBlockBound
