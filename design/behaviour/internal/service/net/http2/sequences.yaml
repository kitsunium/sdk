          do:
            - return: dst, false
          when: valueStop.Index(value) >= 0
      - opt:
          do:
            - return: dst, true
          when: isConnectionField(name)
      - return: appendNamedField(dst, name, value), true
        to: appendNamedField
  - of: appendNamedField
    participants:
      - id: caller
        kind: actor
      - id: appendNamedField
        kind: self
      - id: staticNameIndex
        kind: internal
      - id: appendIndexedLiteralName
        kind: internal
      - id: appendString
        kind: internal
      - id: appendIntOfLen
        kind: internal
      - id: foldToLower
        kind: internal
    steps:
      - opt:
          do:
            - set: dst
              to: appendIndexedLiteralName
              value: appendIndexedLiteralName(dst, index)
            - return: appendString(dst, value)
              to: appendString
          init:
            bind: index
            eval: staticNameIndex(name)
            to: staticNameIndex
          when: index > 0
      - set: dst
        value: append(dst, neverIndexedByte)
      - set: dst
        to: appendIntOfLen
        value: appendIntOfLen(dst, len(name))
      - bind: at
        eval: len(dst)
      - set: dst
        value: append(dst, name...)
      - eval: foldToLower(dst[at:])
        to: foldToLower
      - return: appendString(dst, value)
        to: appendString
  - of: lowerByte
    steps:
      - opt:
          do:
            - return: c | toLower
          when: c >= firstUpper && c <= lastUpper
      - return: c
  - of: appendString
    participants:
      - id: caller
        kind: actor
      - id: appendString
        kind: self
      - id: appendIntOfLen
        kind: internal
    steps:
      - set: dst
        to: appendIntOfLen
        value: appendIntOfLen(dst, len(s))
      - return: append(dst, s...)
  - of: appendIntOfLen
    steps:
      - opt:
          do:
            - return: append(dst, byte(n))
          when: n < stringLenThreshold
      - set: dst
        value: append(dst, byte(stringLenThreshold))
      - op: "-="
        set: "n"
        value: stringLenThreshold
      - loop:
          cond: n >= int(continuationBit)
          do:
            - set: dst
              value: append(dst, byte(n%int(continuationBit))|continuationBit)
            - op: /=
              set: "n"
              value: int(continuationBit)
      - return: append(dst, byte(n))
  - of: foldToLower
    participants:
      - id: caller
        kind: actor
      - id: foldToLower
        kind: self
      - id: lowerByte
        kind: internal
    steps:
      - loop:
          do:
            - set: b[i]
              to: lowerByte
              value: lowerByte(c)
          key: i
          range: b
          value: c
  - of: Encoder.frameBlock
    participants:
      - id: caller
        kind: actor
      - id: Encoder.frameBlock
        kind: self
      - id: AppendFrameHeader
        kind: internal
      - id: e.splitBlock
        kind: internal
