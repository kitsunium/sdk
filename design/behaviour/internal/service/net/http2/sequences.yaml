      - bind: st
        eval: c.st
      - opt:
          do:
            - eval: c.answerStatus(stream, statusInternal)
              to: c.answerStatus
            - return: ""
          when: unservable(res)
      - bind: body
        eval: res.Body
      - bind: endOnHeaders
        eval: len(body) == 0 || isHead
      - bind: out, err
        eval: st.lane.Headers(&c.e.conn, stream, res, endOnHeaders, st.out)
        to: st.lane.Headers
      - opt:
          do:
            - eval: c.answerStatus(stream, statusInternal)
              to: c.answerStatus
            - return: ""
          when: err != nil
      - set: st.out
        value: out
      - opt:
          do:
            - set: st.out
              to: st.lane.Send
              value: st.lane.Send(&c.e.conn, stream, body, st.out, true)
          when: "!endOnHeaders"
