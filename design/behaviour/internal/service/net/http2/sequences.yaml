      - loop:
          cond: idx != noIndex
          do:
            - bind: st
              eval: "&f.l.streams[idx]"
            - bind: next
              eval: int64(st.sendWindow) + delta
            - opt:
                do:
                  - eval: f.connError(corehttp2.ErrCodeFlowControl)
                    to: f.connError
                  - return: ""
                when: next > int64(corehttp2.MaxWindow)
            - set: st.sendWindow
              value: int32(next)
          init: idx := f.c.head
          post: idx = f.l.streams[idx].next
      - set: f.c.initialSend
        value: int32(val)
  - of: ParseFrameHeader
    participants:
      - id: caller
        kind: actor
      - id: ParseFrameHeader
        kind: self
      - id: judgePadding
        kind: internal
    steps:
      - opt:
          do:
            - return: corehttp2.FrameValue{}, 0, corehttp2.ErrCodeNoError
          when: len(buf) < corehttp2.FrameHeaderLen
      - bind: h
        eval: |-
          corehttp2.FrameValue{
          		Type:     corehttp2.FrameType(buf[3]),
          		Flags:    corehttp2.FrameFlags(buf[4]),
          		StreamID: binary.BigEndian.Uint32(buf[5:9]) & streamIDMask,
          		Length:   int(buf[0])<<byte0Shift | int(buf[1])<<byte1Shift | int(buf[2]),
          	}
      - opt:
          do:
            - return: h, corehttp2.FrameHeaderLen, corehttp2.ErrCodeFrameSize
          when: h.Length > maxFrame
      - opt:
          do:
            - return: h, corehttp2.FrameHeaderLen, corehttp2.ErrCodeNoError
          when: "!isPaddedFrame(h)"
      - return: judgePadding(buf, h)
        to: judgePadding
