  - doc: |-
      valueStop is what a field value may not hold: NUL, LF and CR, RFC 9113
      §8.2.1.
    items:
      - name: valueStop
        value: swar.NewSet(asciiLF, asciiCR, 1, false)
    name: valueStop
  - doc: |-
      refusalPreface is the whole answer to a connection speaking a version the
      group does not serve: a 400, and the connection closed.
    items:
      - name: refusalPreface
        value: "[]byte(\"HTTP/1.1 400 Bad Request\\r\\nContent-Length: 0\\r\\nConnection: close\\r\\n\\r\\n\")"
    name: refusalPreface
  - doc: |-
      defaultLaneLimits are the bounds a lane falls back on, every field the
      protocol's or the group's default, so resolving them cannot fail.
    items:
      - name: defaultLaneLimits
        value: |-
          corehttp2.LimitsValue{
          	MaxStreams: corehttp2.DefaultMaxStreams, ReceivePerStream: corehttp2.DefaultReceivePerStream,
          	ReceivePerConn: 4 * corehttp2.DefaultReceivePerStream, MaxFrame: corehttp2.DefaultMaxFrame,
          	HeaderTable: corehttp2.DefaultHeaderTable, MaxHeaderList: corehttp2.DefaultMaxHeaderList,
          }
    name: defaultLaneLimits
  - doc: "The package's vars: a 503's field and the drain's Post registry."
    grouped: true
    items:
      - doc: retryAfter is the field a 503 for a full queue carries.
        name: retryAfter
        value: "[]byte(\"Retry-After: 1\\r\\n\")"
      - doc: drainKeys numbers the drain's Post arguments.
        name: drainKeys
        type: atomic.Uintptr
      - doc: |-
          drainRegistry maps a drain's Post argument to its lane: an argument is
          an integer and the registered op no closure, so the lane is found by a
          key.
        name: drainRegistry
        type: sync.Map
    name: retryAfter
  - doc: |-
      The pseudo-fields of a request, RFC 9113 §8.3.1, and the regular fields the
      mapping reads.
    grouped: true
    items:
      - doc: pseudoMethod is the method.
        name: pseudoMethod
        value: "[]byte(\":method\")"
      - doc: pseudoPath is the target.
        name: pseudoPath
        value: "[]byte(\":path\")"
      - doc: pseudoScheme is the scheme.
        name: pseudoScheme
        value: "[]byte(\":scheme\")"
      - doc: pseudoAuthority is the authority.
        name: pseudoAuthority
        value: "[]byte(\":authority\")"
      - doc: fieldAuthorization is the Authorization field.
        name: fieldAuthorization
        value: "[]byte(\"authorization\")"
      - doc: fieldContentLength is the Content-Length field.
        name: fieldContentLength
        value: "[]byte(\"content-length\")"
      - doc: fieldCookie is the Cookie field, split over several by §8.2.3.
        name: fieldCookie
        value: "[]byte(\"cookie\")"
      - doc: fieldExpect is the Expect field, refused by the profile.
        name: fieldExpect
        value: "[]byte(\"expect\")"
      - doc: fieldTE is the TE field, which may hold "trailers" alone.
        name: fieldTE
        value: "[]byte(\"te\")"
      - doc: valueTrailers is what a TE field may hold.
        name: valueTrailers
        value: "[]byte(\"trailers\")"
      - doc: |-
          fieldConnection through fieldUpgrade are the connection-specific fields
          RFC 9113 §8.2.2 calls malformed.
        name: fieldConnection
        value: "[]byte(\"connection\")"
      - name: fieldKeepAlive
        value: "[]byte(\"keep-alive\")"
      - name: fieldProxyConnection
        value: "[]byte(\"proxy-connection\")"
      - name: fieldTransferEncoding
        value: "[]byte(\"transfer-encoding\")"
      - name: fieldUpgrade
        value: "[]byte(\"upgrade\")"
      - doc: methodConnect is the method the profile refuses.
        name: methodConnect
        value: "[]byte(\"CONNECT\")"
      - doc: cookieSep joins a Cookie field's crumbs, §8.2.3.
        name: cookieSep
        value: "[]byte(\"; \")"
    name: pseudoMethod
  - doc: methodHEAD is the one method whose answer has no body.
    items:
      - name: methodHEAD
        value: "[]byte(\"HEAD\")"
    name: methodHEAD
