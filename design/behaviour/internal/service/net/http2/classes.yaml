functions:
  - name: NewLane
    params: v corehttp2.LimitsValue, maxBody int64, holdCap int
    results: "*Lane, error"
  - doc: newLaneResolved returns one lane's state for bounds already resolved.
    name: newLaneResolved
    params: resolved corehttp2.LimitsValue, maxBody int64, holdCap int
    results: "*Lane"
  - doc: dataFlags builds an EventData's flags.
    name: dataFlags
    params: end, over bool
    results: EventFlags
  - doc: |-
      appendServerPreface writes the SETTINGS the server opens with: the bounds
      that differ from the protocol's defaults, and the connection window raised.
    name: appendServerPreface
    params: dst []byte, l *Lane
    results: "[]byte"
  - doc: endFlag builds an event's END_STREAM flag.
    name: endFlag
    params: end bool
    results: EventFlags
  - name: ParseFrameHeader
    params: buf []byte, maxFrame int
    results: corehttp2.FrameValue, int, corehttp2.ErrCode
  - doc: isPaddedFrame reports whether h is a frame that carries a pad length.
    name: isPaddedFrame
    params: h corehttp2.FrameValue
    results: bool
  - doc: |-
      judgePadding reads a padded frame's pad length and refuses padding that does
      not leave the rest of the payload shorter than the frame's length.
    name: judgePadding
    params: buf []byte, h corehttp2.FrameValue
    results: corehttp2.FrameValue, int, corehttp2.ErrCode
  - name: AppendFrameHeader
    params: dst []byte, h corehttp2.FrameValue
    results: "[]byte"
  - name: AppendSettings
    params: dst []byte, settings []corehttp2.SettingValue
    results: "[]byte"
  - name: AppendSettingsAck
    params: dst []byte
    results: "[]byte"
  - name: AppendWindowUpdate
    params: dst []byte, stream, increment uint32
    results: "[]byte"
  - name: AppendRSTStream
    params: dst []byte, stream uint32, code corehttp2.ErrCode
    results: "[]byte"
  - name: AppendGoAway
    params: dst []byte, last uint32, code corehttp2.ErrCode
    results: "[]byte"
  - name: AppendPing
    params: dst []byte, ack bool, data *[8]byte
    results: "[]byte"
  - doc: checkedInt refuses an integer past any table or block.
    name: checkedInt
    params: value int
    results: int, error
  - doc: staticField returns a static entry's bytes, aliasing the immutable table.
    name: staticField
    params: index int
    results: decodedField
  - name: NewEncoder
    params: maxFrame int
    results: Encoder
  - doc: cmpInt returns v unless it is zero, then def.
    name: cmpInt
    params: v, def int
    results: int
  - doc: |-
      sendableStatus mirrors AppendResponse: a status of the profile, no body on
      a status that carries none.
    name: sendableStatus
    params: status int, res *corenet.HTTP1ResponseValue
    results: bool
  - doc: appendStatus appends the :status field.
    name: appendStatus
    params: dst []byte, status int
    results: "[]byte"
  - doc: appendContentLength appends a content-length field.
    name: appendContentLength
    params: dst []byte, n int
    results: "[]byte"
  - doc: |-
      appendIndexedLiteralName opens a never-indexed literal whose name is at
      index in the static table.
    name: appendIndexedLiteralName
    params: dst []byte, index int
    results: "[]byte"
  - doc: |-
      appendExtraFields appends the fields http1's writer adds after Header: the
      CORS lines, Retry-After and X-Request-Id.
    name: appendExtraFields
    params: dst []byte, res *corenet.HTTP1ResponseValue
    results: "[]byte, bool"
  - doc: |-
      appendResponseFields re-reads res.Header's lines as HPACK literals, false on
      a malformed line.
    name: appendResponseFields
    params: dst, header []byte
    results: "[]byte, bool"
  - doc: "appendField appends one \"Name: value\" line as a literal field."
    name: appendField
    params: dst, line []byte
    results: "[]byte, bool"
  - doc: isToken reports whether name is an RFC 9110 token.
    name: isToken
    params: name []byte
    results: bool
  - doc: |-
      isConnectionField reports whether name is one of the fields HTTP/2 does not
      carry; the comparison folds, the line's case being a handler's.
    name: isConnectionField
    params: name []byte
    results: bool
  - doc: |-
      appendNamedField appends a literal field: the name by static index when the
      table has it, otherwise lowercased as a string; the value as a plain string.
    name: appendNamedField
    params: dst, name, value []byte
    results: "[]byte"
  - doc: equalFold reports whether name and s are equal once ASCII capitals fold.
    name: equalFold
    params: name []byte, s string
    results: bool
  - doc: lowerByte folds an ASCII capital to lowercase.
    name: lowerByte
    params: c byte
    results: byte
  - doc: |-
      appendString appends a plain string, RFC 7541 §5.2: the length as a 7-bit
      integer, no Huffman coding.
    name: appendString
    params: dst, s []byte
    results: "[]byte"
  - doc: |-
      appendIntOfLen appends a string length as a 7-bit integer with the
      Huffman bit clear, RFC 7541 §5.1.
    name: appendIntOfLen
    params: dst []byte, n int
    results: "[]byte"
  - doc: foldToLower lowercases ASCII capitals in place.
    name: foldToLower
    params: b []byte
  - doc: |-
      staticNameIndex returns the static table's lowest index for name, compared
      without regard to ASCII case, zero when it has none.
    name: staticNameIndex
    params: name []byte
    results: int
  - doc: equalFoldBytes reports whether name equals the lowercase table name b.
    name: equalFoldBytes
    params: name, b []byte
    results: bool
  - doc: |-
      huffStep runs the automaton over one nibble, appending the symbol a code
      ended with, if any.
    name: huffStep
    params: scratch []byte, state uint32, nibble byte
    results: "[]byte, uint32, error"
  - name: NewDecoder
    params: table, maxList int
    results: Decoder
  - name: TableMem
    params: table int
    results: int
  - doc: |-
      validField reports whether f's name and value are well-formed, RFC 9113
      §8.2.1.
    name: validField
    params: f *decodedField
    results: bool
  - doc: |-
      validName reports whether name is a well-formed field name: lowercase,
      visible ASCII, the first colon of a pseudo-field only.
    name: validName
    params: name []byte
    results: bool
  - doc: nameByte reports whether c may be in a field name after its first colon.
    name: nameByte
    params: c byte
    results: bool
  - doc: |-
      validValue reports whether value is a well-formed field value: no NUL, LF
      or CR, no leading or trailing whitespace.
    name: validValue
    params: value []byte
    results: bool
  - doc: isOWS reports whether c is a space or a tab.
    name: isOWS
    params: c byte
    results: bool
  - name: HandleLoop
    params: h corenet.HTTP1Handler, p http1.Parser
    results: "*LoopHandler"
  - name: NewLoopHandler
    params: h corenet.HTTP1Handler, p http1.Parser
    results: "*LoopHandler"
  - doc: |-
      swallowErr intentionally discards a non-actionable error: the adapter has
      no caller to return a refused Close to.
    name: swallowErr
    params: err error
  - doc: |-
      newLaneState builds lane i's state. A bound Resolve refuses is judged at
      Start, and the zero bounds resolve, so NewLane does not fail here.
    name: newLaneState
    params: a *LoopHandler, i int
    results: "*laneState"
  - doc: "entriesGrowth is the size a full table grows to: doubled, from sixteen."
    name: entriesGrowth
    params: n int
    results: int
  - doc: |-
      runDrainGoAway is the op the drain posts: on the lane's thread, it writes
      GOAWAY on every HTTP/2 connection and closes those with no open stream.
    name: runDrainGoAway
    params: io corenet.LoopIO, key uintptr
  - doc: |-
      mapRequest fills the request value's Method, Target, Host, Authorization and
      ContentLength from its decoded fields, removes the pseudo-fields from
      Fields, joins a split Cookie and computes the canonical target. It reports
      what to do with the stream.
    name: mapRequest
    params: req *corenet.HTTP1RequestValue, st *laneState, stream uint32
    results: mapVerdict
  - doc: |-
      resetMapped clears what mapRequest and a link may have left from the lane's
      previous request.
    name: resetMapped
    params: req *corenet.HTTP1RequestValue
  - doc: connectionSpecific reports a field RFC 9113 §8.2.2 forbids on HTTP/2.
    name: connectionSpecific
    params: name []byte
    results: bool
  - doc: parseDecimal reads a non-negative decimal integer that fits an int64.
    name: parseDecimal
    params: b []byte
    results: int64, bool
  - doc: |-
      joinCookies concatenates the Cookie fields into the first, §8.2.3, and
      removes the others.
    name: joinCookies
    params: req *corenet.HTTP1RequestValue, st *laneState
  - doc: |-
      copyRequest makes dst hold src, every slice repointed at bytes appended to
      head: the request outlives the batch's buffers. It returns head grown.
    name: copyRequest
    params: dst, src *corenet.HTTP1RequestValue, head []byte
    results: "[]byte"
  - doc: |-
      copyBytes appends b to head and returns the slice of head holding it, nil
      for nil.
    name: copyBytes
    params: head, b []byte
    results: dst, grown []byte
  - doc: |-
      unservable reports an answer HTTP/2 does not carry on the loop: a
      close-delimited stream, an Upgrade or a file body; a file's reader is
      closed, as http1 closes one it does not send.
    name: unservable
    params: res *corenet.HTTP1ResponseValue
    results: bool
imports:
  atomic: sync/atomic
  binary: encoding/binary
  bytes: bytes
  corehttp2: github.com/kitsunium/sdk/internal/core/net/http2
  corenet: github.com/kitsunium/sdk/internal/core/net
  errors: errors
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  http1: github.com/kitsunium/sdk/internal/service/net/http1
  io: io
  slices: slices
  strconv: strconv
  swar: github.com/kitsunium/sdk/internal/kernel/swar
  sync: sync
  trace: github.com/kitsunium/sdk/internal/core/observe/trace
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/net/http2
  name: http2
  purpose: "Package http2 is the SDK's HTTP/2 codec for the loop engine's sibling profile (ADR 0220, amending ADR 0186 §D6): pure functions over []byte and no I/O, the shape http1 has."
types:
  - doc: connFlags are the booleans of a Conn, packed to keep it pointer-free and small.
    kind: named
    name: connFlags
    underlying: uint8
  - doc: streamFlags are the booleans of a streamState.
    kind: named
    name: streamFlags
    underlying: uint8
  - fields:
      - doc: decoder is the connection's HPACK table's bookkeeping.
        name: decoder
        type: Decoder
      - doc: peerWindow is what the peer may send on the connection.
        name: peerWindow
        type: int32
      - doc: sendWindow is what we may send on the connection.
        name: sendWindow
        type: int32
      - doc: peerCredit is consumed bytes not yet acknowledged on the connection.
        name: peerCredit
        type: int32
      - doc: |-
          initialSend is the stream send window a new stream starts with: the
          peer's INITIAL_WINDOW_SIZE.
        name: initialSend
        type: int32
      - doc: peerMaxFrame is the largest frame the peer accepts.
        name: peerMaxFrame
        type: int32
      - doc: "head is the newest open stream, noIndex when none: the list by index."
        name: head
        type: int32
      - doc: open counts the streams on the list.
        name: open
        type: int32
      - doc: |-
          lastStream is the highest stream id the peer has used: a new stream
          must be above it, §5.1.1, refused or not.
        name: lastStream
        type: uint32
      - doc: "lastOpen is the highest stream id admitted: what GOAWAY names, §6.8."
        name: lastOpen
        type: uint32
      - doc: |-
          table is the dynamic table's block in the lane's arena; noIndex until
          the connection's first field block.
        name: table
        type: int32
      - doc: |-
          hold is the connection's held-bytes buffer in the lane's arena; noIndex
          when nothing is held.
        name: hold
        type: int32
      - doc: held counts the bytes held unsent, all streams.
        name: held
        type: int32
      - doc: resets is what is left of the Rapid Reset budget.
        name: resets
        type: int32
      - doc: control counts this batch's frames that ask for an answer or do no work.
        name: control
        type: int32
      - doc: epoch is the batch control was counted in.
        name: epoch
        type: uint32
      - doc: |-
          scanFrames is how many CONTINUATION frames of the field block waiting
          at the front of the input are already known good.
        name: scanFrames
        type: int32
      - doc: scanOff is where they end, relative to the HEADERS frame's first byte.
        name: scanOff
        type: int32
      - doc: scanBlock counts the field block's bytes seen so far.
        name: scanBlock
        type: int32
      - doc: flags are the connection's booleans.
        name: flags
        type: connFlags
    kind: struct
    methods:
      - doc: has reports whether the flags are all set.
        name: has
        params: f connFlags
        recv: c *Conn
        results: bool
      - doc: set raises the flags.
        name: set
        params: f connFlags
        recv: c *Conn
    name: Conn
  - doc: |-
      streamState is one open stream, indexed by Conn.head and threaded by next:
      a pointer-free arena per lane.
    fields:
      - doc: id is the stream's identifier.
        name: id
        type: uint32
      - doc: next links the stream to an older one on the connection, or to the free list.
        name: next
        type: int32
      - doc: peerWindow is what the peer may still send on the stream.
        name: peerWindow
        type: int32
      - doc: sendWindow is what we may still send on the stream.
        name: sendWindow
        type: int32
      - doc: peerCredit is consumed bytes not yet acknowledged on the stream.
        name: peerCredit
        type: int32
      - doc: holdOff locates the stream's held bytes in the connection's buffer.
        name: holdOff
        type: int32
      - doc: holdLen counts them.
        name: holdLen
        type: int32
      - doc: bodyLen counts the body bytes received so far.
        name: bodyLen
        type: int32
      - doc: flags are the stream's booleans.
        name: flags
        type: streamFlags
    kind: struct
    methods:
      - doc: has reports whether the flags are all set.
        name: has
        params: f streamFlags
        recv: s *streamState
        results: bool
      - doc: set raises the flags.
        name: set
        params: f streamFlags
        recv: s *streamState
    name: streamState
  - kind: named
    name: EventKind
    underlying: uint8
  - kind: named
    name: EventFlags
    underlying: uint8
  - fields:
      - doc: Kind says what the event is.
        name: Kind
        type: EventKind
      - doc: Stream is the stream concerned; zero for an EventGoAway.
        name: Stream
        type: uint32
      - doc: |-
          Data is the field block of an EventHeaders, or the body bytes of an
          EventData.
        name: Data
        type: "[]byte"
      - doc: Flags carries what the frame said beside its bytes.
        name: Flags
        type: EventFlags
      - doc: Code is the error code an EventReset or EventGoAway carried.
        name: Code
        type: corehttp2.ErrCode
    kind: struct
    name: Event
  - doc: |-
      holdBuffer is the bytes held unsent for one connection: DATA waiting for
      flow-control credit, bounded by the lane's holdCap.
    fields:
      - doc: buf holds the bytes, compacted once more than half of it is dead.
        name: buf
        type: "[]byte"
      - doc: dead counts the bytes in buf no stream refers to.
        name: dead
        type: int32
    kind: struct
    name: holdBuffer
  - fields:
      - doc: limits are the resolved bounds of the group.
        name: limits
        type: corehttp2.LimitsValue
      - doc: |-
          errs counts the errors Feed answered, by corehttp2.ErrorType, until
          TakeErrors.
        name: errs
        type: "[corehttp2.ErrorTypes]uint64"
      - doc: maxBody is the body bound a request is refused past (413).
        name: maxBody
        type: int32
      - doc: holdCap is the most DATA one connection may hold unsent.
        name: holdCap
        type: int32
      - doc: streams is the arena of stream states.
        name: streams
        type: "[]streamState"
      - doc: freeStream is the free list's head in streams.
        name: freeStream
        type: int32
      - doc: tables hands out the HPACK tables.
        name: tables
        type: tableArena
      - doc: holds are the held-bytes buffers, by Conn.hold.
        name: holds
        type: "[]holdBuffer"
      - doc: freeHolds are the holds no connection uses.
        name: freeHolds
        type: "[]int32"
      - doc: events are the last Feed's events.
        name: events
        type: "[]Event"
      - doc: join is the current batch's reassembled field blocks.
        name: join
        type: "[]byte"
      - doc: epoch numbers the batches, from one.
        name: epoch
        type: uint32
    kind: struct
    methods:
      - name: Open
        params: c *Conn
        recv: l *Lane
      - name: Close
        params: c *Conn
        recv: l *Lane
      - name: Events
        recv: l *Lane
        results: "[]Event"
      - name: EndBatch
        recv: l *Lane
      - name: TakeErrors
        params: dst []uint64
        recv: l *Lane
      - doc: countErr counts an error Feed answers with code.
        name: countErr
        params: code corehttp2.ErrCode
        recv: l *Lane
      - name: Decode
        params: c *Conn, block, scratch []byte, req *corenet.HTTP1RequestValue
        recv: l *Lane
        results: "[]byte, error"
      - name: Closing
        params: c *Conn
        recv: "*Lane"
        results: bool
      - name: Done
        params: c *Conn
        recv: "*Lane"
        results: bool
      - name: Feed
        params: c *Conn, buf, dst []byte
        recv: l *Lane
        results: int, []byte
      - doc: |-
          find returns the arena index of stream id on c and its predecessor, or
          noIndex: a walk of the list, newest first, stopped at the first older id
          (ids only grow, so nothing older can match past it).
        name: find
        params: c *Conn, id uint32
        recv: l *Lane
        results: idx, prev int32
      - doc: |-
          newStream opens stream id at the head of the list, newest first, windows
          taken from the peer's settings and the receive bound.
        name: newStream
        params: c *Conn, id uint32
        recv: l *Lane
        results: int32
      - doc: closeStream unlinks stream idx from c and frees it.
        name: closeStream
        params: c *Conn, idx int32
        recv: l *Lane
      - doc: freeStreamSlot returns a stream slot to the free list.
        name: freeStreamSlot
        params: idx int32
        recv: l *Lane
      - doc: releaseHold gives a connection's hold buffer back to the lane.
        name: releaseHold
        params: c *Conn
        recv: l *Lane
      - name: Headers
        params: c *Conn, stream uint32, res *corenet.HTTP1ResponseValue, endStream bool, dst []byte
        recv: l *Lane
        results: "[]byte, error"
      - name: Send
        params: c *Conn, stream uint32, body, dst []byte, endStream bool
        recv: l *Lane
        results: "[]byte"
      - doc: holdOf returns c's hold buffer, taking one from the lane on first use.
        name: holdOf
        params: c *Conn
        recv: l *Lane
        results: "*holdBuffer"
      - doc: takeHold returns a free buffer, growing the arena when none is free.
        name: takeHold
        recv: l *Lane
        results: int32
      - doc: |-
          flushHolds sends whatever the windows now allow of every stream's held
          bytes, in the order the streams opened (newest first); called from Feed
          after a SETTINGS or WINDOW_UPDATE. Nothing is copied from the hold buffer
          until a compaction asks for it.
        name: flushHolds
        params: f *feedRun
        recv: l *Lane
      - doc: flushStream sends what the windows allow of one stream's held bytes.
        name: flushStream
        params: f *feedRun, idx int32
        recv: l *Lane
      - doc: |-
          compactHold reclaims the buffer's dead bytes: when nothing is held any
          more it goes back to the lane, and otherwise once more than half of it is
          dead the live ranges are moved down.
        name: compactHold
        params: c *Conn
        recv: l *Lane
      - doc: |-
          moveHoldDown moves every stream's held range to the front of its buffer, in
          offset order, so no byte is overwritten before it is copied.
        name: moveHoldDown
        params: c *Conn, h *holdBuffer
        recv: l *Lane
      - doc: |-
          lowestHold returns the holding stream with the lowest offset at or past
          from: the next range to compact, one scan of the list per range.
        name: lowestHold
        params: c *Conn, from int32
        recv: l *Lane
        results: int32
      - name: Consume
        params: c *Conn, stream uint32, n int
        recv: l *Lane
      - name: AppendCredits
        params: c *Conn, dst []byte
        recv: l *Lane
        results: "[]byte"
      - name: GoAway
        params: c *Conn, code corehttp2.ErrCode, dst []byte
        recv: l *Lane
        results: "[]byte"
      - name: Abort
        params: c *Conn, code corehttp2.ErrCode, dst []byte
        recv: "*Lane"
        results: "[]byte"
      - name: ResetStream
        params: c *Conn, stream uint32, code corehttp2.ErrCode, dst []byte
        recv: l *Lane
        results: "[]byte"
      - name: OpenStreams
        params: c *Conn
        recv: "*Lane"
        results: int
    name: Lane
  - doc: tableArena hands out HPACK tables of one size from chunks, pointer-free.
    fields:
      - doc: size is one table's bytes.
        name: size
        type: int
      - doc: chunks are the arena's chunks, tableChunk tables each.
        name: chunks
        type: "[][]byte"
      - doc: free are the tables on the free list.
        name: free
        type: "[]int32"
      - doc: next is the first table never handed out.
        name: next
        type: int32
    kind: struct
    methods:
      - doc: get returns a free table's id, growing the arena when none is free.
        name: get
        recv: a *tableArena
        results: int32
      - doc: mem returns the memory of table id.
        name: mem
        params: id int32
        recv: a *tableArena
        results: "[]byte"
      - doc: put returns table id to the free list.
        name: put
        params: id int32
        recv: a *tableArena
    name: tableArena
  - doc: feedRun is one Feed's cursor, on its stack.
    fields:
      - doc: l is the lane.
        name: l
        type: "*Lane"
      - doc: c is the connection.
        name: c
        type: "*Conn"
      - doc: buf is the input.
        name: buf
        type: "[]byte"
      - doc: dst receives the connection's own answers.
        name: dst
        type: "[]byte"
      - doc: h is the current frame's header.
        name: h
        type: corehttp2.FrameValue
      - doc: payload is the current frame's payload.
        name: payload
        type: "[]byte"
    kind: struct
    methods:
      - doc: |-
          priorityFrame ignores the deprecated priority signal, §6.3, once it is well
          formed: it opens no stream and takes no work.
        name: priorityFrame
        recv: f *feedRun
        results: int
      - doc: rstFrame handles RST_STREAM, §6.4.
        name: rstFrame
        recv: f *feedRun
        results: int
      - doc: rstOnAbsent answers a RST_STREAM for a stream not on the list.
        name: rstOnAbsent
        recv: f *feedRun
      - doc: |-
          spendReset charges one reset to the Rapid Reset budget, CVE-2023-44487: a
          client that opens and cancels streams without letting any finish pays for
          each, and ends the connection when the budget is gone.
        name: spendReset
        recv: f *feedRun
      - doc: "pushFrame refuses a PUSH_PROMISE: a client cannot push, §8.4."
        name: pushFrame
        recv: f *feedRun
        results: int
      - doc: pingFrame answers a PING, §6.7.
        name: pingFrame
        recv: f *feedRun
        results: int
      - doc: "goAwayFrame reads the peer's GOAWAY, §6.8: it opens nothing new."
        name: goAwayFrame
        recv: f *feedRun
        results: int
      - doc: windowFrame handles WINDOW_UPDATE, §6.9.
        name: windowFrame
        recv: f *feedRun
        results: int
      - doc: connectionCredit applies a WINDOW_UPDATE on the connection, §6.9.1.
        name: connectionCredit
        params: inc uint32
        recv: f *feedRun
      - doc: streamCredit applies a WINDOW_UPDATE on a stream, §6.9.1.
        name: streamCredit
        params: inc uint32
        recv: f *feedRun
      - doc: creditOnAbsent answers a WINDOW_UPDATE for a stream not on the list.
        name: creditOnAbsent
        params: inc uint32
        recv: f *feedRun
      - doc: dataFrame handles a DATA frame, RFC 9113 §6.1.
        name: dataFrame
        recv: f *feedRun
        results: int
      - doc: |-
          dataOnAbsent answers DATA for a stream not on the list: idle is a connection
          error, §5.1; a closed stream is a stream error, and its bytes still count
          against the connection, §5.2.
        name: dataOnAbsent
        recv: f *feedRun
      - doc: |-
          discardAgainstConn charges a frame to the connection window and credits it
          back at once: no handler will read these bytes.
        name: discardAgainstConn
        recv: f *feedRun
      - doc: dataOnStream receives DATA on an open or half-closed stream.
        name: dataOnStream
        params: idx int32
        recv: f *feedRun
      - doc: |-
          deliverData strips the padding, accumulates the body and reports the
          event; the padding is credited back at once since nothing reads it.
        name: deliverData
        params: idx int32
        recv: f *feedRun
      - doc: startBatch resets the connection's control budget for a new batch.
        name: startBatch
        recv: f *feedRun
      - doc: |-
          preface reads the client connection preface, RFC 9113 §3.4, and writes the
          server's: its SETTINGS and the connection's window raised to the bound. It
          reports the bytes it took and whether frames may be read: once the preface
          was consumed earlier, zero bytes and true.
        name: preface
        recv: f *feedRun
        results: int, bool
      - doc: |-
          frame consumes one frame, or one header sequence, from the input's front.
          It returns the bytes taken, 0 while the frame is not whole.
        name: frame
        params: in []byte
        recv: f *feedRun
        results: int
      - doc: dispatchLow handles the frame types DATA through SETTINGS.
        name: dispatchLow
        params: in []byte
        recv: f *feedRun
        results: int
      - doc: dispatchHigh handles the frame types PUSH_PROMISE through CONTINUATION.
        name: dispatchHigh
        recv: f *feedRun
        results: int
      - doc: frameLen returns the whole frame's length on the wire.
        name: frameLen
        recv: f *feedRun
        results: int
      - doc: |-
          spendControl charges one frame to the connection's batch budget; a frame
          past it ends the connection, ENHANCE_YOUR_CALM, RFC 9113 §10.5: a flood of
          frames that take no work is refused before it costs output.
        name: spendControl
        recv: f *feedRun
      - doc: |-
          connError ends the connection: GOAWAY with code, and nothing more is read.
          A second error of the same input writes nothing.
        name: connError
        params: code corehttp2.ErrCode
        recv: f *feedRun
      - doc: "streamError ends one stream: RST_STREAM with code, and its event."
        name: streamError
        params: idx int32, code corehttp2.ErrCode
        recv: f *feedRun
      - doc: emit reports an event for the adapter.
        name: emit
        params: ev Event
        recv: f *feedRun
      - doc: |-
          finishIfDone closes a stream once both halves are done: its answer fully
          written (END_STREAM sent, nothing held) and the peer's half closed. A
          response that ended first while the body is still arriving is ended with
          RST_STREAM(NO_ERROR), RFC 9113 §8.1, so the rest is discarded.
        name: finishIfDone
        params: idx int32
        recv: f *feedRun
      - doc: |-
          refundReset returns one unit of the Rapid Reset budget, a stream having
          finished its life normally.
        name: refundReset
        recv: f *feedRun
      - doc: |-
          headersFrame handles a HEADERS frame, RFC 9113 §6.2, the whole sequence of
          frames that carries one field block being read at once.
        name: headersFrame
        params: in []byte
        recv: f *feedRun
        results: int
      - doc: |-
          readSequence walks the frames carrying one field block, RFC 9113 §6.10:
          HEADERS then CONTINUATIONs of its stream, none interleaved, the fragment
          bytes and the frames bounded before anything is copied. Progress is kept in
          the Conn so a block trickled a byte at a time is walked once, not re-read.
        name: readSequence
        params: in []byte
        recv: f *feedRun
        results: headerSequence, bool
      - doc: |-
          resumeScan returns where to resume walking the block's CONTINUATIONs: past
          the frames an earlier call found good, or from the start when the input no
          longer holds them.
        name: resumeScan
        params: in []byte, firstLen int32
        recv: f *feedRun
        results: off, blockLen int32
      - doc: |-
          withinBlockBound refuses a block past the bytes a Huffman-coded field list
          could take, or spread over too many frames: a CONTINUATION flood. The
          connection ends with ENHANCE_YOUR_CALM before anything is copied.
        name: withinBlockBound
        params: blockLen int32
        recv: f *feedRun
        results: bool
      - doc: |-
          nextContinuation reads the next frame of a field block: it must be a
          CONTINUATION of the block's stream, §6.10, and whole.
        name: nextContinuation
        params: in []byte
        recv: f *feedRun
        results: corehttp2.FrameValue, int, bool
      - doc: joinSequence builds the whole block of a sequence past one frame.
        name: joinSequence
        params: in, first []byte, end int, endStream bool
        recv: f *feedRun
        results: headerSequence
      - doc: |-
          fragmentOf returns a HEADERS payload's field-block fragment, without its pad
          length, padding and priority fields, RFC 9113 §6.2.
        name: fragmentOf
        params: h corehttp2.FrameValue, payload []byte
        recv: f *feedRun
        results: "[]byte"
      - doc: onHeaderBlock admits or refuses a complete field block.
        name: onHeaderBlock
        params: seq *headerSequence
        recv: f *feedRun
      - doc: |-
          headersOnOpenStream refuses a HEADERS frame on an open stream: a trailer is
          out of the profile, §8.1's trailers refused as http1 refuses them; a stream
          that already closed its half is STREAM_CLOSED, §5.1. Either way the block is
          decoded for the table's sake.
        name: headersOnOpenStream
        params: idx int32, seq *headerSequence
        recv: f *feedRun
      - doc: |-
          continuationFrame refuses a CONTINUATION outside a field block, §6.10: a
          sequence is read whole by headersFrame, so one seen here is out of place.
        name: continuationFrame
        recv: f *feedRun
        results: int
      - doc: sendNow writes what the windows allow of p on stream idx, and holds the rest.
        name: sendNow
        params: idx int32, p []byte, end bool
        recv: f *feedRun
      - doc: |-
          appendData writes DATA frames for p, bounded by both windows and the frame
          size; a stream with no window, or p empty, writes at most one empty DATA
          that carries END_STREAM.
        name: appendData
        params: st *streamState, p []byte, end bool
        recv: f *feedRun
        results: int
      - doc: |-
          hold copies what the windows did not allow into the connection's buffer,
          bounded by holdCap; END_STREAM stays with the held bytes.
        name: hold
        params: idx int32, p []byte, end bool
        recv: f *feedRun
      - doc: |-
          settingsFrame handles SETTINGS, §6.5: an ACK moves the decoder's bound, a
          new set is applied and acknowledged in the same batch.
        name: settingsFrame
        recv: f *feedRun
        results: int
      - doc: "settingsAck handles a SETTINGS ACK: the peer has our table bound."
        name: settingsAck
        recv: f *feedRun
      - doc: applySettings walks the frame's parameters in order, §6.5.3.
        name: applySettings
        recv: f *feedRun
      - doc: applySetting applies one parameter, §6.5.2.
        name: applySetting
        params: id corehttp2.SettingID, val uint32
        recv: f *feedRun
      - doc: applyEnablePush refuses a value the setting cannot take, §6.5.2.
        name: applyEnablePush
        params: val uint32
        recv: f *feedRun
      - doc: applyMaxFrame moves the frame size the server writes to, §6.5.2.
        name: applyMaxFrame
        params: val uint32
        recv: f *feedRun
      - doc: |-
          applyInitialWindow adjusts every open stream's send window by the change in
          the initial window, §6.9.2: it may push a window negative, and a window past
          the protocol's maximum ends the connection.
        name: applyInitialWindow
        params: val uint32
        recv: f *feedRun
    name: feedRun
  - doc: headerSequence is a HEADERS frame and its CONTINUATIONs read together.
    fields:
      - doc: total is the sequence's bytes on the wire.
        name: total
        type: int
      - doc: block is the assembled field block.
        name: block
        type: "[]byte"
      - doc: endStream reports END_STREAM on the HEADERS frame.
        name: endStream
        type: bool
    kind: struct
    name: headerSequence
  - doc: |-
      decodeRun is one Decode call's cursor: the block, what it fills, and the
      running header list size. It lives on Decode's stack.
    fields:
      - doc: d is the connection's table.
        name: d
        type: "*Decoder"
      - doc: mem is the table's memory.
        name: mem
        type: "[]byte"
      - doc: block is what is left of the field block.
        name: block
        type: "[]byte"
      - doc: scratch receives every byte a field is not aliased from.
        name: scratch
        type: "[]byte"
      - doc: req receives the fields.
        name: req
        type: "*corenet.HTTP1RequestValue"
      - doc: list is the header list so far, RFC 9113 §6.5.2's measure.
        name: list
        type: int
      - doc: |-
          invalid reports a field RFC 9113 §8.2.1 calls malformed: reported at
          the block's end, so the table stays in step with the peer.
        name: invalid
        type: bool
      - doc: |-
          updatesDone is set once a field was decoded: a table size update comes
          first or not at all, RFC 7541 §4.2.
        name: updatesDone
        type: bool
    kind: struct
    methods:
      - doc: step decodes one representation, RFC 7541 §6.
        name: step
        recv: r *decodeRun
        results: error
      - doc: |-
          readInt decodes an integer of the given prefix width off the block's front,
          RFC 7541 §5.1, and advances past it.
        name: readInt
        params: prefix uint8
        recv: r *decodeRun
        results: int, error
      - doc: readContinuation accumulates an integer's continuation bytes.
        name: readContinuation
        params: value int
        recv: r *decodeRun
        results: int, error
      - doc: "indexed decodes an indexed field, §6.1: the whole field is an index."
        name: indexed
        recv: r *decodeRun
        results: error
      - doc: fieldByIndex looks an index up in the static then the dynamic table.
        name: fieldByIndex
        params: index int
        recv: r *decodeRun
        results: decodedField, error
      - doc: |-
          dynamicField looks an index up in the dynamic table and copies the entry
          out, charged against the list before the copy: the entry could be evicted
          by a later insert of the same block, so it is never aliased.
        name: dynamicField
        params: index int
        recv: r *decodeRun
        results: decodedField, error
      - doc: emit charges a field to the list and appends it to the request.
        name: emit
        params: f *decodedField
        recv: r *decodeRun
        results: error
      - doc: |-
          sizeUpdate applies a dynamic table size update, §6.3: only before the
          block's first field, and never past what the server advertised.
        name: sizeUpdate
        recv: r *decodeRun
        results: error
      - doc: |-
          literal decodes a literal field, §6.2: the name by index or as a string, the
          value as a string, added to the table when index is set.
        name: literal
        params: prefix uint8, index bool
        recv: r *decodeRun
        results: error
      - doc: budget is how many decoded value bytes this field may still take.
        name: budget
        params: f *decodedField
        recv: r *decodeRun
        results: int
      - doc: |-
          literalName returns a literal field's name: by index, or as a string. A
          name found by index is judged again with its value, since the table's
          verdict covers a whole field and a literal reuses only its name.
        name: literalName
        params: nameIndex int
        recv: r *decodeRun
        results: decodedField, error
      - doc: |-
          dynamicName copies the name of a dynamic entry into the scratch, charging
          its bytes first: a literal reuses only the entry's name.
        name: dynamicName
        params: index int
        recv: r *decodeRun
        results: decodedField, error
      - doc: |-
          readString decodes a string literal, §5.2: aliased from the block when plain,
          decoded into scratch when Huffman-coded, its decoded size at most budget.
        name: readString
        params: budget int
        recv: r *decodeRun
        results: "[]byte, error"
      - doc: |-
          huffmanString decodes a Huffman-coded string into the scratch, RFC 7541
          §5.2: a nibble automaton, one table look-up a nibble, bounded by budget and
          by the input's own length, so a code cannot expand a string past what is
          allowed.
        name: huffmanString
        params: raw []byte, budget int
        recv: r *decodeRun
        results: "[]byte, error"
    name: decodeRun
  - doc: decodedField is one field while it is being built.
    fields:
      - doc: name and value are its bytes.
        name: name
        type: "[]byte"
      - doc: name and value are its bytes.
        name: value
        type: "[]byte"
      - doc: |-
          invalid is the verdict on them; a table or static field carries
          its verdict with it.
        name: invalid
        type: bool
    kind: struct
    name: decodedField
  - fields:
      - doc: maxFrame is the largest frame the peer accepts.
        name: maxFrame
        type: int
    kind: struct
    methods:
      - name: AppendHeaders
        params: dst []byte, stream uint32, res *corenet.HTTP1ResponseValue, endStream bool
        recv: e Encoder
        results: "[]byte, error"
      - doc: |-
          frameBlock writes the header of the frame the block occupies and, when the
          block is larger than maxFrame, splits it over CONTINUATION frames. Bytes are
          moved within dst, so it allocates only when dst must grow.
        name: frameBlock
        params: dst []byte, start, blockStart int, stream uint32, endStream bool
        recv: e Encoder
        results: "[]byte"
      - doc: |-
          splitBlock frames a block over one HEADERS and as many CONTINUATION frames
          as it takes, writing from the end so nothing is copied twice.
        name: splitBlock
        params: dst []byte, start, blockStart int, stream uint32, flags corehttp2.FrameFlags
        recv: e Encoder
        results: "[]byte"
    name: Encoder
  - fields:
      - doc: maxList is the header list ceiling, RFC 9113 §6.5.2's measure.
        name: maxList
        type: int
      - doc: capacity is mem's ring, the most the table can ever hold.
        name: capacity
        type: int32
      - doc: |-
          limit is the largest table the peer may announce now: the protocol's
          default until our SETTINGS is acknowledged, then what we advertised.
        name: limit
        type: int32
      - doc: advertised is what our SETTINGS says limit becomes.
        name: advertised
        type: int32
      - doc: maxSize is the table's current size limit, the peer's last size update.
        name: maxSize
        type: int32
      - doc: size is the entries' total as RFC 7541 §4.1 counts it.
        name: size
        type: int32
      - doc: head is the ring offset the next entry is written at.
        name: head
        type: int32
      - doc: tail is the ring offset of the oldest entry.
        name: tail
        type: int32
      - doc: count is how many entries the table holds.
        name: count
        type: int32
      - doc: top is the slot of the newest entry.
        name: top
        type: int32
    kind: struct
    methods:
      - name: Decode
        params: mem, block, scratch []byte, req *corenet.HTTP1RequestValue
        recv: d *Decoder
        results: "[]byte, error"
      - doc: |-
          acknowledge moves the peer's bound to what our SETTINGS advertised, the
          moment it has acknowledged them (RFC 7541 §4.2).
        name: acknowledge
        recv: d *Decoder
      - doc: slots returns the table's number of offset slots.
        name: slots
        recv: d *Decoder
        results: int32
      - doc: ringPut copies p into the ring at at and returns the offset past it.
        name: ringPut
        params: mem []byte, at int32, p []byte
        recv: d *Decoder
        results: int32
      - doc: ringGet appends n ring bytes starting at at to dst.
        name: ringGet
        params: mem, dst []byte, at, n int32
        recv: d *Decoder
        results: "[]byte"
      - doc: "slotAt returns the ring offset the slot of age age holds: zero is the newest."
        name: slotAt
        params: mem []byte, age int32
        recv: d *Decoder
        results: int32
      - doc: storeSlot records an entry's ring offset as the newest slot.
        name: storeSlot
        params: mem []byte, offset int32
        recv: d *Decoder
      - doc: "entryAt reads the entry of age age: appended to scratch, and returned."
        name: entryAt
        params: mem, scratch []byte, age int32
        recv: d *Decoder
        results: decodedField, []byte
      - doc: entrySize reads the stored name and value lengths of the entry of age age.
        name: entrySize
        params: mem []byte, age int32
        recv: d *Decoder
        results: nameLen, valueLen int32
      - doc: nameAt appends the name of the entry of age age to scratch and returns it.
        name: nameAt
        params: mem, scratch []byte, age int32
        recv: d *Decoder
        results: name, grown []byte
      - doc: u16 reads a stored little-endian length.
        name: u16
        params: b []byte
        recv: d *Decoder
        results: uint16
      - doc: evictOldest drops the table's oldest entry, RFC 7541 §4.4.
        name: evictOldest
        params: mem []byte
        recv: d *Decoder
      - doc: shrinkTo evicts oldest entries until size is at most target.
        name: shrinkTo
        params: mem []byte, target int32
        recv: d *Decoder
      - doc: |-
          insert adds a field to the table, evicting first, RFC 7541 §4.4. A field
          bigger than the table empties it and is not added.
        name: insert
        params: mem, name, value []byte, invalid bool
        recv: d *Decoder
    name: Decoder
  - doc: connKind is what a connection's first bytes made of it.
    kind: named
    name: connKind
    underlying: uint8
  - fields:
      - doc: h serves every request of both versions.
        name: h
        type: corenet.HTTP1Handler
      - doc: p frames HTTP/1.1 requests and bounds the head of a request of both.
        name: p
        type: http1.Parser
      - doc: h1 serves the connections that do not open with the preface.
        name: h1
        type: "*http1.LoopHandler"
      - doc: |-
          worker, reader and aborter are h's optional capabilities, nil when it
          lacks them; its HTTP1Batcher is the embedded adapter's to call, once a
          batch for both versions.
        name: worker
        type: corenet.HTTP1Worker
      - name: reader
        type: corenet.HTTP1BodyReader
      - name: aborter
        type: corenet.HTTP1BodyAborter
      - doc: limits are HTTP/2's bounds, as a group option gave them.
        name: limits
        type: corehttp2.LimitsValue
      - doc: serveH1 and serveH2 say which versions the group serves.
        name: serveH1
        type: bool
      - doc: serveH1 and serveH2 say which versions the group serves.
        name: serveH2
        type: bool
      - doc: maxBody bounds a request's body.
        name: maxBody
        type: int64
      - doc: holdCap bounds what one connection holds unsent.
        name: holdCap
        type: int
      - doc: lanes holds each lane's state at its LoopIO.Loop index, replaced under mu.
        name: lanes
        type: atomic.Pointer[[]*laneState]
      - doc: mu serialises the first sight of a lane.
        name: mu
        type: sync.Mutex
      - doc: draining is set once the group's drain began.
        name: draining
        type: atomic.Bool
      - doc: requests counts the HTTP/2 requests served, added once a batch.
        name: requests
        type: atomic.Uint64
      - doc: errs counts the HTTP/2 errors by corehttp2.ErrorType, added once a batch.
        name: errs
        type: "[corehttp2.ErrorTypes]atomic.Uint64"
    kind: struct
    methods:
      - name: OnStart
        params: lanes int
        recv: a *LoopHandler
      - name: Honours
        params: k corenet.OptionKind
        recv: "*LoopHandler"
        results: bool
      - name: SetHTTP
        params: v corenet.LoopHTTPValue
        recv: a *LoopHandler
      - name: CheckSpill
        params: spillCap int
        recv: a *LoopHandler
        results: error
      - doc: |-
          checkH2Spill refuses a group whose spill cannot hold the largest frame or
          field block HTTP/2's bounds admit: a frame incomplete in the spill stays
          there whole.
        name: checkH2Spill
        params: spillCap int
        recv: a *LoopHandler
        results: error
      - name: Unwrap
        recv: a *LoopHandler
        results: corenet.HTTP1Handler
      - name: OnOpen
        params: io corenet.LoopIO, ref corenet.LoopConnRef
        recv: a *LoopHandler
      - name: OnData
        params: io corenet.LoopIO, ref corenet.LoopConnRef, buf []byte
        recv: a *LoopHandler
        results: int
      - doc: |-
          sniff judges a connection's first bytes against the preface and reports
          whether its version is decided: when it is not, the sniff consumed what the
          second result says.
        name: sniff
        params: io corenet.LoopIO, ref corenet.LoopConnRef, e *connEntry, buf []byte
        recv: a *LoopHandler
        results: bool, int
      - doc: |-
          writeClose writes p and closes ref when closing, or when the write is
          refused.
        name: writeClose
        params: io corenet.LoopIO, ref corenet.LoopConnRef, p []byte, closing bool
        recv: "*LoopHandler"
      - name: OnTimeout
        params: io corenet.LoopIO, ref corenet.LoopConnRef
        recv: "*LoopHandler"
      - name: OnWritable
        params: io corenet.LoopIO, ref corenet.LoopConnRef
        recv: "*LoopHandler"
      - name: OnClose
        params: io corenet.LoopIO, ref corenet.LoopConnRef, err error
        recv: a *LoopHandler
      - doc: state returns lane i's state, built on the lane's first call.
        name: state
        params: i int
        recv: a *LoopHandler
        results: "*laneState"
      - doc: |-
          grow builds lane i's state and publishes a table that holds it. A lane that
          cannot be built holds no state and serves no HTTP/2: Honours and
          CheckSpill have already judged the limits at Start, so this happens only
          when a lane is first seen after a change the Start would have refused.
        name: grow
        params: i int
        recv: a *LoopHandler
        results: "*laneState"
      - name: Worker
        recv: a *LoopHandler
        results: corenet.LoopWorker
      - name: OnOutbound
        params: v corenet.LoopOutboundValue
        recv: a *LoopHandler
      - name: OnDone
        params: io corenet.LoopIO, job corenet.LoopJobValue
        recv: a *LoopHandler
      - doc: |-
          answerSlot writes a worker's answer on its stream, ends the connection when
          it was the last of a closing one, and frees the slot.
        name: answerSlot
        params: io corenet.LoopIO, st *laneState, e *connEntry, slot *workSlot, idx uint32
        recv: a *LoopHandler
      - name: Draining
        recv: a *LoopHandler
      - doc: |-
          announce posts the drain's GOAWAY to st's thread; a lane with no connection
          yet, or whose queue refuses, skips it, and the drain closes what it finds.
        name: announce
        params: st *laneState
        recv: "*LoopHandler"
      - name: InFlight
        params: lane int, ref corenet.LoopConnRef
        recv: a *LoopHandler
        results: bool
      - name: Pending
        params: lane int, ref corenet.LoopConnRef
        recv: a *LoopHandler
        results: bool
      - doc: |-
          feed runs Feed over buf and serves what it reports, and returns the bytes
          it took: a partial frame stays in the spill.
        name: feed
        params: io corenet.LoopIO, ref corenet.LoopConnRef, st *laneState, e *connEntry, buf []byte
        recv: a *LoopHandler
        results: int
      - name: OnBatchEnd
        params: io corenet.LoopIO
        recv: a *LoopHandler
      - doc: |-
          publish adds the batch's requests and errors to the adapter's counts: one
          atomic add a batch for the requests, one a type counted for the errors.
        name: publish
        params: st *laneState
        recv: a *LoopHandler
      - name: HTTPCounts
        recv: a *LoopHandler
        results: corenet.HTTPCountsValue
      - doc: |-
          completeDeferred appends the batch's deferred answers now that EndBatch has
          run; one still deferred is answered 500.
        name: completeDeferred
        params: io corenet.LoopIO, st *laneState
        recv: a *LoopHandler
      - doc: |-
          flush credits the batch's connections and writes its output in order, then
          closes the connections that ended.
        name: flush
        params: io corenet.LoopIO, st *laneState
        recv: a *LoopHandler
      - doc: |-
          closeIfDone closes ref when its output was refused, a protocol error ended
          it, or a GOAWAY went out and no stream is left open.
        name: closeIfDone
        params: io corenet.LoopIO, ref corenet.LoopConnRef, st *laneState
        recv: "*LoopHandler"
    name: LoopHandler
  - doc: |-
      connEntry is one connection of a lane. An idle HTTP/2 connection holds this
      and nothing else: no request record, no table, no buffer.
    fields:
      - doc: conn is the protocol state.
        name: conn
        type: Conn
      - doc: |-
          requests is the head of the connection's list of open requests in the
          lane's request table, noIndex when none.
        name: requests
        type: int32
      - doc: buffered counts the body bytes the connection's open requests hold.
        name: buffered
        type: int32
      - doc: gen is the generation of the connection the entry describes.
        name: gen
        type: uint32
      - doc: activeAt is the lane batch the connection was last active in.
        name: activeAt
        type: uint32
      - doc: kind is what the connection's first bytes made of it.
        name: kind
        type: connKind
      - doc: flags are the entry's booleans.
        name: flags
        type: entryFlags
    kind: struct
    methods:
      - doc: live reports whether the entry holds an open connection.
        name: live
        recv: e *connEntry
        results: bool
    name: connEntry
  - doc: entryFlags are a connEntry's booleans.
    kind: named
    name: entryFlags
    underlying: uint8
  - doc: |-
      requestState is one HTTP/2 request that outlives the OnData that opened it:
      a body still arriving, or an answer a worker owes. Pooled by the lane.
    fields:
      - doc: stream is the stream it answers.
        name: stream
        type: uint32
      - doc: next links the connection's list, or the free list.
        name: next
        type: int32
      - doc: req is the request as the handler sees it; its slices alias head.
        name: req
        type: corenet.HTTP1RequestValue
      - doc: head holds the bytes req's slices alias.
        name: head
        type: "[]byte"
      - doc: body accumulates a body the handler takes whole.
        name: body
        type: "[]byte"
      - doc: uncredited counts body bytes not yet consumed for flow control.
        name: uncredited
        type: int32
      - doc: slot is the worker slot answering it, noIndex when none.
        name: slot
        type: int32
      - doc: wanted is the declared body length, from content-length.
        name: wanted
        type: int64
      - doc: chunks counts the bytes given to OnBody.
        name: chunks
        type: int64
      - doc: flags are the request's booleans.
        name: flags
        type: requestFlags
    kind: struct
    methods:
      - doc: has reports whether the flags are all set.
        name: has
        params: f requestFlags
        recv: r *requestState
        results: bool
      - doc: |-
          resetKeepingBuffers clears r for a new request, keeping the backing of its
          head and body so a churn of requests does not allocate them again.
        name: resetKeepingBuffers
        params: stream uint32, next int32
        recv: r *requestState
      - doc: received is the body bytes the record has seen so far.
        name: received
        recv: r *requestState
        results: int64
    name: requestState
  - doc: requestFlags are a requestState's booleans.
    kind: named
    name: requestFlags
    underlying: uint8
  - doc: |-
      workSlot is one pending answer: what the lane's worker fills. Slots are
      never moved, so the worker holds one by pointer, and the worker reads
      nothing else of the lane.
    fields:
      - doc: idx is the slot's index in the table.
        name: idx
        type: uint32
      - doc: gen is the slot's generation, moved on at each take.
        name: gen
        type: uint32
      - doc: ref is the connection it answers.
        name: ref
        type: corenet.LoopConnRef
      - doc: stream is the stream it answers.
        name: stream
        type: uint32
      - doc: isHead is whether the request's method was HEAD.
        name: isHead
        type: bool
      - doc: res is the answer the worker fills.
        name: res
        type: corenet.HTTP1ResponseValue
      - doc: |-
          cancelled is set once the stream or connection ended: the worker skips
          the work, and the answer is dropped.
        name: cancelled
        type: atomic.Bool
    kind: struct
    name: workSlot
  - doc: deferredAnswer is one answer the batch's end completes.
    fields:
      - doc: res is the response the handler completes in EndBatch.
        name: res
        type: "*corenet.HTTP1ResponseValue"
      - doc: ref is the connection it answers on.
        name: ref
        type: corenet.LoopConnRef
      - doc: stream is the stream.
        name: stream
        type: uint32
      - doc: isHead is whether the request was a HEAD.
        name: isHead
        type: bool
    kind: struct
    name: deferredAnswer
  - doc: write is one range of the batch's output.
    fields:
      - doc: ref is the connection it goes out on.
        name: ref
        type: corenet.LoopConnRef
      - doc: off and end bound it in out.
        name: "off"
        type: int
      - doc: off and end bound it in out.
        name: end
        type: int
    kind: struct
    name: write
  - doc: |-
      laneState is one lane's state. Only that lane's thread touches it, except
      where a field says.
    fields:
      - doc: lane is the protocol state of every HTTP/2 connection of the lane.
        name: lane
        type: "*Lane"
      - doc: index is the lane's own number.
        name: index
        type: int
      - doc: req is the request value every HTTP/2 request is decoded into.
        name: req
        type: corenet.HTTP1RequestValue
      - doc: scratch holds decoded strings.
        name: scratch
        type: "[]byte"
      - doc: count numbers the lane's HTTP/2 requests, for HTTP1RequestValue.ID.
        name: count
        type: uint64
      - doc: out is the batch's output.
        name: out
        type: "[]byte"
      - doc: jobOut is what a job's answer is written from.
        name: jobOut
        type: "[]byte"
      - doc: writes are the ranges of out, in order.
        name: writes
        type: "[]write"
      - doc: active are the connections the batch fed.
        name: active
        type: "[]corenet.LoopConnRef"
      - doc: entries is the connection table, by ring and slot.
        name: entries
        type: "[][]connEntry"
      - doc: requests are the open requests by index; freeRequests their free list.
        name: requests
        type: "[]*requestState"
      - name: freeRequests
        type: int32
      - doc: completed are the requests answered this batch, returned at its end.
        name: completed
        type: "[]int32"
      - doc: deferred are the batch's deferred answers.
        name: deferred
        type: "[]deferredAnswer"
      - doc: free are the response values no request holds.
        name: free
        type: "[]*corenet.HTTP1ResponseValue"
      - doc: served counts the requests the batch handed to the handler.
        name: served
        type: int
      - doc: |-
          errs counts the batch's HTTP/2 errors by corehttp2.ErrorType: the
          codec's, taken at the batch's end, and the adapter's own answers.
        name: errs
        type: "[corehttp2.ErrorTypes]uint64"
      - doc: outbound is the lane's queue to its worker, nil when nothing offloads.
        name: outbound
        type: corenet.LoopOutbound
      - doc: |-
          slots are the worker slots, replaced under no lock since only this lane
          grows it; the worker reads through it.
        name: slots
        type: atomic.Pointer[[]*workSlot]
      - doc: freeSlots are the indexes of the slots no answer holds.
        name: freeSlots
        type: "[]uint32"
      - doc: post is the lane's LoopIO, published once for the drain's Post.
        name: post
        type: atomic.Pointer[postHolder]
      - doc: goAwayDone is set when the drain's GOAWAY went out on this lane.
        name: goAwayDone
        type: atomic.Bool
    kind: struct
    methods:
      - doc: remember publishes the lane's LoopIO once, for the drain's Post.
        name: remember
        params: io corenet.LoopIO
        recv: st *laneState
      - doc: |-
          entry returns ref's entry, growing the table on first sight of its ring or
          slot; a slot's next connection reuses the entry's Conn, whose arenas the
          last OnClose released.
        name: entry
        params: ref corenet.LoopConnRef
        recv: st *laneState
        results: "*connEntry"
      - doc: take returns a zeroed response value for one request.
        name: take
        recv: st *laneState
        results: "*corenet.HTTP1ResponseValue"
      - doc: |-
          give returns res to the pool. Its slices are the handler's and are dropped
          at the next take.
        name: give
        params: res *corenet.HTTP1ResponseValue
        recv: st *laneState
      - doc: |-
          takeRequest returns a request record, cleared, linked at the head of e's
          list, and its index.
        name: takeRequest
        params: e *connEntry, stream uint32
        recv: st *laneState
        results: int32, *requestState
      - doc: findRequest returns the record of stream on e and its predecessor, or noIndex.
        name: findRequest
        params: e *connEntry, stream uint32
        recv: st *laneState
        results: idx, prev int32
      - doc: unlinkRequest removes record idx from e's list, without freeing it.
        name: unlinkRequest
        params: e *connEntry, idx, prev int32
        recv: st *laneState
      - doc: |-
          release returns record idx to the free list at the batch's end; a body or
          head a large request grew is dropped rather than kept, so the pool's
          memory follows the common request.
        name: release
        params: idx int32
        recv: st *laneState
      - doc: |-
          finishRequest drops record idx from e, crediting what it never consumed and
          the bytes it held, and queues it for the batch's end, its bytes still valid
          for a handler that deferred its answer.
        name: finishRequest
        params: e *connEntry, idx, prev int32
        recv: st *laneState
      - doc: |-
          closeRequests abandons every open request of e: an OnBody handler is told,
          a worker's answer is cancelled.
        name: closeRequests
        params: a *LoopHandler, e *connEntry
        recv: st *laneState
      - doc: finishSlot drops stream's record, its answer having left.
        name: finishSlot
        params: e *connEntry, stream uint32
        recv: st *laneState
      - doc: releaseCompleted returns the answered requests to the pool.
        name: releaseCompleted
        recv: st *laneState
      - doc: |-
          takeSlot returns a free worker slot and its index, growing the table by
          publication, never in place, so the worker can read it without a lock.
        name: takeSlot
        recv: st *laneState
        results: "*workSlot, uint32"
      - doc: freeSlot returns slot idx to the free list.
        name: freeSlot
        params: idx uint32
        recv: st *laneState
      - doc: announceDrain walks the lane's connections.
        name: announceDrain
        params: io corenet.LoopIO
        recv: st *laneState
      - doc: |-
          announceConn writes GOAWAY(NO_ERROR) on one connection and closes it when
          nothing is in flight.
        name: announceConn
        params: io corenet.LoopIO, ref corenet.LoopConnRef, e *connEntry
        recv: st *laneState
      - doc: |-
          peek returns ref's entry when it is ref's connection's, nil otherwise; it
          resets nothing.
        name: peek
        params: ref corenet.LoopConnRef
        recv: st *laneState
        results: "*connEntry"
      - doc: |-
          pushWrite records what the batch has appended since off as ref's, and marks
          the connection active once per batch.
        name: pushWrite
        params: ref corenet.LoopConnRef, off int, e *connEntry
        recv: st *laneState
      - doc: |-
          countAbort counts a field block Decode refused: a header list past its
          bound, or a block HPACK could not decode.
        name: countAbort
        params: err error
        recv: st *laneState
      - doc: credit appends the batch's window credits, one frame per stream at most.
        name: credit
        recv: st *laneState
      - doc: |-
          writeAll writes the batch's output in the order it was made; a refused
          write ends its connection, as a refused http1 answer does.
        name: writeAll
        params: io corenet.LoopIO
        recv: st *laneState
      - doc: |-
          endBatch ends the lane's batch: the output and scratches cleared, the
          protocol state's batch ended, the requests answered returned to the pool.
        name: endBatch
        recv: st *laneState
    name: laneState
  - doc: postHolder boxes a LoopIO for an atomic pointer.
    fields:
      - doc: io is the lane's LoopIO.
        name: io
        type: corenet.LoopIO
    kind: struct
    name: postHolder
  - doc: |-
      h2Worker is the corenet.LoopWorker the adapter offloads to: it runs the
      handler's HTTP1Worker on a slot of its own, or hands the job to the embedded
      HTTP/1.1 adapter's.
    fields:
      - doc: a is the adapter.
        name: a
        type: "*LoopHandler"
      - doc: h1 is the embedded HTTP/1.1 adapter's worker.
        name: h1
        type: corenet.LoopWorker
    kind: struct
    methods:
      - doc: Work implements corenet.LoopWorker, on the lane's worker goroutine.
        name: Work
        params: lane int, job corenet.LoopJobValue
        recv: w h2Worker
    name: h2Worker
  - doc: pseudoSet is which pseudo-fields a request carried.
    kind: named
    name: pseudoSet
    underlying: uint8
  - doc: mapVerdict is what mapping one request found.
    fields:
      - doc: refusal is what to answer on the stream, RefusalNone to serve it.
        name: refusal
        type: http1.Refusal
      - doc: malformed ends the stream with RST_STREAM(PROTOCOL_ERROR), §8.1.1.
        name: malformed
        type: bool
      - doc: wanted is the declared content length, if declared.
        name: wanted
        type: int64
      - doc: declared says a content-length was given.
        name: declared
        type: bool
    kind: struct
    name: mapVerdict
  - doc: mapState gathers the fields' verdicts across one request's walk.
    fields:
      - doc: method, target, scheme and authority are the pseudo-fields.
        name: method
        type: "[]byte"
      - doc: method, target, scheme and authority are the pseudo-fields.
        name: target
        type: "[]byte"
      - doc: method, target, scheme and authority are the pseudo-fields.
        name: scheme
        type: "[]byte"
      - doc: method, target, scheme and authority are the pseudo-fields.
        name: authority
        type: "[]byte"
      - doc: |-
          seenRegular is set once a regular field went by: a pseudo-field after it
          is malformed, §8.3.
        name: seenRegular
        type: bool
      - doc: seen is which pseudo-fields the request gave.
        name: seen
        type: pseudoSet
      - doc: hosts counts the Host fields.
        name: hosts
        type: int
      - doc: crumbs counts the Cookie fields.
        name: crumbs
        type: int
      - doc: v is the verdict so far.
        name: v
        type: mapVerdict
    kind: struct
    methods:
      - doc: pseudo records one pseudo-field; a repeated, unknown or late one is malformed.
        name: pseudo
        params: name, value []byte
        recv: m *mapState
      - doc: setOnce keeps value in *slot, marking the request malformed on a repeat.
        name: setOnce
        params: bit pseudoSet, slot *[]byte, value []byte
        recv: m *mapState
      - doc: regular reads the fields of index i the mapping cares about.
        name: regular
        params: req *corenet.HTTP1RequestValue, i int
        recv: m *mapState
      - doc: te accepts the one value a TE field may hold, "trailers", §8.2.2.
        name: te
        params: value []byte
        recv: m *mapState
      - doc: host1 refuses a second Host field, as HTTP/1.1 does.
        name: host1
        recv: m *mapState
      - doc: authorization keeps the one Authorization field a Bearer link reads.
        name: authorization
        params: req *corenet.HTTP1RequestValue, value []byte
        recv: m *mapState
      - doc: |-
          contentLength reads the declared length, refused as HTTP/1.1 refuses a
          malformed one; a second one is refused too.
        name: contentLength
        params: value []byte
        recv: m *mapState
      - doc: refuse keeps the first refusal of a request.
        name: refuse
        params: r http1.Refusal
        recv: m *mapState
      - doc: |-
          complete reports whether the request has the pseudo-fields §8.3.1 demands:
          :method, and on every method but CONNECT, :scheme and :path. A CONNECT is
          refused by judge, whatever else it names.
        name: complete
        recv: m *mapState
        results: bool
      - doc: host returns the request's Host, :authority first and a Host field otherwise.
        name: host
        params: req *corenet.HTTP1RequestValue
        recv: m *mapState
        results: "[]byte, bool"
      - doc: |-
          hostConflict reports a request naming two different servers: an :authority
          beside a Host field that differs.
        name: hostConflict
        params: req *corenet.HTTP1RequestValue
        recv: m *mapState
        results: bool
      - doc: |-
          judge computes the canonical target and refuses a form the profile does not
          serve: a CONNECT, an absolute-form :path.
        name: judge
        params: req *corenet.HTTP1RequestValue
        recv: m *mapState
        results: http1.Refusal
    name: mapState
  - doc: h2Call is one callback's connection, what the stream handlers read of it.
    fields:
      - doc: a is the adapter.
        name: a
        type: "*LoopHandler"
      - doc: io and ref are the callback's.
        name: io
        type: corenet.LoopIO
      - name: ref
        type: corenet.LoopConnRef
      - doc: st is the lane's state, e the connection's entry.
        name: st
        type: "*laneState"
      - name: e
        type: "*connEntry"
    kind: struct
    methods:
      - doc: |-
          offload queues the pending answer res on its worker, or answers it at once
          when no worker can take it. It returns the record that stays for the job.
        name: offload
        params: stream uint32, res *corenet.HTTP1ResponseValue, isHead bool, idx int32
        recv: c *h2Call
        results: int32
      - doc: answerUnavailable writes a 503 with Retry-After on stream.
        name: answerUnavailable
        params: stream uint32
        recv: c *h2Call
      - doc: event serves one event of Feed.
        name: event
        params: ev Event
        recv: c *h2Call
      - doc: |-
          onHeaders decodes a field block and opens, refuses or serves its request. A
          block on a stream the machine refused is decoded and dropped.
        name: onHeaders
        params: ev Event
        recv: c *h2Call
      - doc: |-
          open maps a decoded request and serves or defers it: at once when it carries
          no body, otherwise a record keeps it until its last DATA.
        name: open
        params: stream uint32, end bool
        recv: c *h2Call
      - doc: |-
          keep copies the decoded request into a record of its own, which outlives
          this batch, for its body to arrive.
        name: keep
        params: stream uint32, v mapVerdict
        recv: c *h2Call
      - doc: |-
          onData accumulates a stream's body, serves the request on its last byte,
          and refuses a body past its bound or its declared length.
        name: onData
        params: ev Event
        recv: c *h2Call
      - doc: |-
          take gives one DATA event to the handler that reads as it arrives, or
          accumulates it, and serves the request on its end.
        name: take
        params: idx, prev int32, r *requestState, ev Event
        recv: c *h2Call
      - doc: |-
          buffer appends a chunk to the record's body, crediting it at once while the
          connection's buffered bodies stay under the receive bound: past it the
          credit waits for the answer, so the peer's flow control stops what memory
          would otherwise not.
        name: buffer
        params: r *requestState, ev Event
        recv: c *h2Call
      - doc: refuseBody answers status on the stream, its body dropped.
        name: refuseBody
        params: idx, prev int32, status int
        recv: c *h2Call
      - doc: |-
          resetMalformed ends the stream with RST_STREAM(PROTOCOL_ERROR), its body
          dropped.
        name: resetMalformed
        params: idx, prev int32
        recv: c *h2Call
      - doc: |-
          onReset forgets a stream the peer or the state machine ended: its record is
          dropped and a worker's answer cancelled, its slot freed when it comes back.
        name: onReset
        params: ev Event
        recv: c *h2Call
      - doc: |-
          serve hands a whole request to h and answers, defers or offloads as it asks.
          idx is the request's record, or noIndex when it never needed one.
        name: serve
        params: stream uint32, req *corenet.HTTP1RequestValue, idx, prev int32
        recv: c *h2Call
      - doc: |-
          dispatch takes the handler's answer: at once, at the batch's end, or by the
          worker. It returns the record that stays for a worker.
        name: dispatch
        params: stream uint32, res *corenet.HTTP1ResponseValue, isHead bool, idx int32
        recv: c *h2Call
        results: int32
      - doc: |-
          answer writes res on stream: HEADERS, then DATA unless it is a HEAD or empty.
          A response the writer refuses is answered 500.
        name: answer
        params: stream uint32, res *corenet.HTTP1ResponseValue, isHead bool
        recv: c *h2Call
      - doc: |-
          answerStatus writes a bodiless answer of status on stream, ending it; a
          request whose body is still arriving is reset with NO_ERROR by the codec.
        name: answerStatus
        params: stream uint32, status int
        recv: c *h2Call
      - doc: |-
          goAway writes GOAWAY(NO_ERROR) once: the connection serves its streams and
          closes when they end.
        name: goAway
        recv: c *h2Call
    name: h2Call
vars:
  - doc: clientPrefaceBytes is the client connection preface, RFC 9113 §3.4.
    items:
      - name: clientPrefaceBytes
        value: "[]byte(clientPrefaceText)"
    name: clientPrefaceBytes
  - grouped: true
    items:
      - doc: |-
          tokenBits is the RFC 9110 §5.6.2 token characters as a bit set, one
          word per 64 bytes.
        name: tokenBits
        value: "[4]uint64{0x03ff6cfa00000000, 0x57ffffffc7fffffe, 0x0000000000000000, 0x0000000000000000}"
      - doc: |-
          staticStatusCodes are the seven statuses the static table holds, RFC 7541
          Appendix A, in index order from firstStaticStatus.
        name: staticStatusCodes
        value: "[...]uint16{200, 204, 206, 304, 400, 404, 500}"
      - doc: |-
          connectionFields are RFC 9113 §8.2.2's connection-specific names, which
          an HTTP/2 message never carries, and content-length, which the encoder
          writes itself: a response's copies are dropped.
