# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: The connection state machine's numbers, RFC 9113 and ADR 0220.
    grouped: true
    items:
      - doc: clientPrefaceLen is the length of the client connection preface, §3.4.
        name: clientPrefaceLen
        type: int
        value: "24"
      - doc: noIndex marks the end of a stream list or a table not taken.
        name: noIndex
        type: int32
        value: "-1"
      - doc: |-
          defaultHoldCap is the most DATA one connection may hold unsent: the
          loop's OutputCap default, what the adapter names when it has none.
        name: defaultHoldCap
        type: int
        value: 1 << 20
      - doc: |-
          controlPerBatch is how many frames that ask for an answer, or do no
          useful work, one batch may carry on one connection: past it the
          connection is ending the peer's flood, RFC 9113 §10.5.
        name: controlPerBatch
        type: int32
        value: "1024"
      - doc: |-
          resetBudgetFactor sizes the Rapid Reset budget, in MaxStreams: the peer
          resets at most that many unfinished streams net of those it let finish.
        name: resetBudgetFactor
        type: int32
        value: "2"
      - doc: |-
          maxContinuationFrames bounds the frames of one field block: past them
          it is a CONTINUATION flood, however few bytes each carries.
        name: maxContinuationFrames
        type: int32
        value: "32"
      - doc: |-
          blockBoundFactor sizes the bytes of a whole field block, in the
          header-list ceiling: Huffman coding can only expand a string so far.
        name: blockBoundFactor
        type: int
        value: "4"
      - doc: |-
          creditDivisor is the fraction of a window consumed before a WINDOW_UPDATE
          is written for it: small acknowledgments never leave.
        name: creditDivisor
        type: int32
        value: "4"
      - doc: holdKeepMax is the largest buffer the lane keeps for reuse.
        name: holdKeepMax
        type: int
        value: 1 << 16
      - doc: frameKnownMax is the largest frame type this package dispatches on.
        name: frameKnownMax
        type: corehttp2.FrameType
        value: corehttp2.FrameContinuation
      - doc: settingsAckLen is a SETTINGS ACK's payload length.
        name: settingsAckLen
        type: int
        value: "0"
      - doc: settingLenLocal is the wire size of one SETTINGS parameter.
        name: settingLenLocal
        type: int
        value: "6"
    name: clientPrefaceLen
  - doc: tableChunk is how many tables one chunk of the table arena holds.
    items:
      - name: tableChunk
        type: int32
        value: "64"
    name: tableChunk
  - grouped: true
    items:
      - doc: flagPreface says the client preface has been read.
        name: flagPreface
        type: connFlags
        value: 1 << iota
      - doc: flagSettings says the client's first SETTINGS has been read.
        name: flagSettings
      - doc: "flagGoAway says a GOAWAY left: no new stream is admitted."
        name: flagGoAway
      - doc: "flagPeerGoAway says the client sent GOAWAY: it opens no new stream."
        name: flagPeerGoAway
      - doc: "flagClosing says the connection ended with an error: nothing more is read."
        name: flagClosing
    name: flagPreface
  - grouped: true
    items:
      - doc: streamRemoteClosed says the peer's half is closed (END_STREAM received).
        name: streamRemoteClosed
        type: streamFlags
        value: 1 << iota
      - doc: "streamLocalClosed says our half is closed: END_STREAM sent."
        name: streamLocalClosed
      - doc: "streamOverBody says the body ran past the bound: nothing more is kept."
        name: streamOverBody
      - doc: streamHoldEnd says END_STREAM follows the held bytes.
        name: streamHoldEnd
    name: streamRemoteClosed
  - grouped: true
    items:
      - doc: EventHeaders is a whole field block for a stream, to decode with Lane.Decode.
        name: EventHeaders
        type: EventKind
        value: iota
      - doc: EventData is a stream's DATA payload, padding removed.
        name: EventData
      - doc: EventReset is a stream the peer or the state machine ended.
        name: EventReset
      - doc: EventGoAway is the peer's GOAWAY; it opens no new stream.
        name: EventGoAway
    name: EventHeaders
  - grouped: true
    items:
      - doc: EventEndStream reports the stream's last frame arrived with this event.
        name: EventEndStream
        type: EventFlags
        value: 1 << iota
      - doc: |-
          EventDiscard reports an EventHeaders whose stream was refused: decoded only
          to keep the connection's table in step, RFC 9113 §4.3, and dropped.
        name: EventDiscard
      - doc: |-
          EventOverBody reports an EventData whose bytes passed the body bound: the
          adapter refuses the request (413) and the codec keeps nothing more.
        name: EventOverBody
    name: EventEndStream
  - doc: clientPrefaceText is the client connection preface, RFC 9113 §3.4.
    items:
      - name: clientPrefaceText
        type: string
        value: "\"PRI * HTTP/2.0\\r\\n\\r\\nSM\\r\\n\\r\\n\""
    name: clientPrefaceText
  - doc: The wire layouts of the frames the state machine reads, RFC 9113 §6.
    grouped: true
    items:
      - doc: priorityFieldsLen is a HEADERS frame's priority field length.
        name: priorityFieldsLen
        type: int
        value: "5"
      - doc: priorityFrameLen is a PRIORITY frame's payload length.
        name: priorityFrameLen
        type: int
        value: "5"
      - doc: streamIDFieldLen is the bytes of a stream id or an error code.
        name: streamIDFieldLen
        type: int
        value: "4"
      - doc: goAwayMinLen is a GOAWAY's fixed payload.
        name: goAwayMinLen
        type: int
        value: "8"
      - doc: pingPayloadLen is a PING's fixed payload.
        name: pingPayloadLen
        type: int
        value: "8"
    name: priorityFieldsLen
  - doc: The frame layer's wire numbers, RFC 9113 §4.1 and §6.
    grouped: true
    items:
      - doc: streamIDMask clears the reserved bit of a frame header's stream field.
        name: streamIDMask
        type: uint32
        value: 1<<31 - 1
      - doc: paddedHeaderLen is the bytes a padded frame's pad length needs read.
        name: paddedHeaderLen
        type: int
        value: "10"
      - doc: settingLen is the wire length of one SETTINGS parameter.
        name: settingLen
        type: int
        value: "6"
      - doc: windowUpdateLen is the payload of a WINDOW_UPDATE frame.
        name: windowUpdateLen
        type: int
        value: "4"
      - doc: rstStreamLen is the payload of an RST_STREAM frame.
        name: rstStreamLen
        type: int
        value: "4"
      - doc: goAwayLen is the payload of a GOAWAY frame with no debug data.
        name: goAwayLen
        type: int
        value: "8"
      - doc: pingLen is the payload of a PING frame.
        name: pingLen
        type: int
        value: "8"
      - doc: byte0Shift and byte1Shift and byte2Shift place the frame length's bytes.
        name: byte0Shift
        type: uint
        value: "16"
      - name: byte1Shift
        type: uint
        value: "8"
    name: streamIDMask
  - doc: |-
      The representation prefixes of RFC 7541 §6: which field a block's byte
      opens.
    grouped: true
    items:
      - doc: indexedPrefix is the indexed field's high bit (§6.1), an integer of 7 bits.
        name: indexedPrefix
        type: byte
        value: "0x80"
      - doc: |-
          incrementalMask and incrementalBits recognise a literal with
          incremental indexing (§6.2.1), an integer of 6 bits.
        name: incrementalMask
        type: byte
        value: "0xc0"
      - name: incrementalBits
        type: byte
        value: "0x40"
      - doc: |-
          sizeUpdateMask and sizeUpdateBits recognise a dynamic table size update
          (§6.3), an integer of 5 bits.
        name: sizeUpdateMask
        type: byte
        value: "0xe0"
      - name: sizeUpdateBits
        type: byte
        value: "0x20"
      - doc: integer prefix widths.
        name: prefix7
        type: uint8
        value: "7"
      - name: prefix6
        type: uint8
        value: "6"
      - name: prefix5
        type: uint8
        value: "5"
      - name: prefix4
        type: uint8
        value: "4"
      - doc: huffmanBit marks a Huffman-coded string, §5.2.
        name: huffmanBit
        type: byte
        value: "0x80"
      - doc: continuationBit marks an integer's continuation byte, §5.1.
        name: continuationBit
        type: byte
        value: "0x80"
      - doc: continuationShift is the bits one continuation byte adds to an integer.
        name: continuationShift
        type: uint
        value: "7"
      - doc: |-
          maxIntBytes is how many continuation bytes an integer may take: past
          them it overflows anything a table or a block can hold.
        name: maxIntBytes
        type: int
        value: "5"
      - doc: "maxHpackInt bounds a decoded integer: well over any table or block."
        name: maxHpackInt
        type: int
        value: 1 << 28
      - doc: firstDynamicIndex is the table index of the newest dynamic entry.
        name: firstDynamicIndex
        type: int
        value: "62"
      - doc: staticOffsetSlots is how many staticOffsets entries one entry takes.
        name: staticOffsetSlots
        type: int
        value: "4"
      - doc: |-
          listFieldOverhead is what RFC 9113 §6.5.2 adds to a field's name and
          value: 32, the same as an entry's table overhead (RFC 7541 §4.1).
        name: listFieldOverhead
        type: int
        value: "32"
    name: indexedPrefix
  - doc: |-
      The response framing's values, mirroring http1's writer.
      extraFieldMax is the room for a Retry-After or X-Request-Id line.
    items:
      - name: extraFieldMax
        type: int
        value: "128"
    name: extraFieldMax
  - grouped: true
    items:
      - doc: statusOK is what a zero HTTP1ResponseValue.Status means.
        name: statusOK
        type: int
        value: "200"
      - doc: statusNoContent carries neither a length nor a body.
        name: statusNoContent
        type: int
        value: "204"
      - doc: statusNotModified carries neither a length nor a body.
        name: statusNotModified
        type: int
        value: "304"
      - doc: statusMin is the lowest status the profile sends.
        name: statusMin
        type: int
        value: "200"
      - doc: statusMax is the highest three-digit status.
        name: statusMax
        type: int
        value: "999"
      - doc: |-
          neverIndexedByte opens a never-indexed literal, RFC 7541 §6.2.3: four
          high bits, then the name's index in a 4-bit integer.
        name: neverIndexedByte
        type: byte
        value: "0x10"
      - doc: prefix4Max is the largest index a 4-bit integer holds in one byte.
        name: prefix4Max
        type: int
        value: "15"
      - doc: statusNameIndex is :status's name index in the static table, Appendix A.
        name: statusNameIndex
        type: int
        value: "8"
      - doc: firstStaticStatus is the static index of the first of staticStatusCodes.
        name: firstStaticStatus
        type: int
        value: "8"
      - doc: contentLengthIndex is content-length's name index in the static table.
        name: contentLengthIndex
        type: int
        value: "28"
      - doc: "statusFieldLen is a three-digit status: the value's length in bytes."
        name: statusFieldLen
        type: byte
        value: "3"
      - doc: maxNameLen bounds a response field's name.
        name: maxNameLen
        type: int
        value: "4096"
      - doc: decimal is the base a status and a content length are written in.
        name: decimal
        type: int
        value: "10"
      - doc: |-
          stringLenThreshold is the largest string length a 7-bit length integer
          holds in one byte.
        name: stringLenThreshold
        type: int
        value: "127"
      - doc: asciiColonByte separates a header line's name and value.
        name: asciiColonByte
        type: byte
        value: "':'"
      - doc: toLower is the bit that folds an ASCII capital to lowercase.
        name: toLower
        type: byte
        value: "0x20"
    name: statusOK
  - doc: The bits of a huffTable word.
    grouped: true
    items:
      - doc: huffEmit says a symbol ended on this nibble.
        name: huffEmit
        type: uint32
        value: 1 << 8
      - doc: "huffFail says no code can take this nibble: an EOS, or too much padding."
        name: huffFail
        type: uint32
        value: 1 << 9
      - doc: huffStateMask extracts a word's next state.
        name: huffStateMask
        type: uint32
        value: "0xff"
      - doc: huffSymShift places the emitted symbol in a word.
        name: huffSymShift
        type: uint
        value: "16"
      - doc: nibbleShift places a byte's high nibble.
        name: nibbleShift
        type: uint
        value: "4"
      - doc: lowNibble extracts a byte's low nibble.
        name: lowNibble
        type: byte
        value: "0x0f"
    name: huffEmit
  - doc: huffStates is how many states the automaton has.
    items:
      - name: huffStates
        type: int
        value: "256"
    name: huffStates
  - grouped: true
    items:
      - doc: |-
          staticLen is the number of entries of the static table, RFC 7541
          Appendix A; a dynamic entry's index starts one past it.
        name: staticLen
        type: int
        value: "61"
      - doc: staticNameMax is the longest name of the static table.
        name: staticNameMax
        type: int
        value: "27"
    name: staticLen
  - doc: |-
      The dynamic table's layout (RFC 7541 §4): mem[:capacity] is a byte ring of
      entries, mem[capacity:] a ring of two-byte offsets, one slot per entry. An
      entry's stored form is its five-byte header — a flag, the name's and the
      value's lengths — then the name and the value, wrapping the ring. RFC 7541
      §4.1 counts an entry at its name, its value and 32, so stored bytes never
      fill the ring: 5 of those 32 hold the header.
    grouped: true
    items:
      - doc: |-
          entryFlagInvalid marks a stored field RFC 9113 §8.2.1 calls malformed: a
          later reference to it is malformed too, with no second byte scan.
        name: entryFlagInvalid
        type: byte
        value: "1"
      - doc: entryHeaderLen is the bytes of a stored entry's header.
        name: entryHeaderLen
        type: int32
        value: "5"
      - doc: entryOverhead is what RFC 7541 §4.1 adds to an entry's name and value.
        name: entryOverhead
        type: int32
        value: "32"
      - doc: slotLen is the bytes of one offset slot.
        name: slotLen
        type: int32
        value: "2"
    name: entryFlagInvalid
  - doc: The bytes RFC 9113 §8.2.1 looks at.
    grouped: true
    items:
      - doc: |-
          asciiTab and asciiSpace are the whitespace a value may not begin or end
          with.
        name: asciiTab
        type: byte
        value: "'\\t'"
      - name: asciiSpace
        type: byte
        value: "' '"
      - doc: asciiColon opens a pseudo-field's name and nothing else.
        name: asciiColon
        type: byte
        value: "':'"
      - doc: asciiLF and asciiCR are, with NUL, never in a value.
        name: asciiLF
        type: byte
        value: "'\\n'"
      - name: asciiCR
        type: byte
        value: "'\\r'"
      - doc: firstUpper and lastUpper bound the capitals a field name may not hold.
        name: firstUpper
        type: byte
        value: "'A'"
      - name: lastUpper
        type: byte
        value: "'Z'"
      - doc: firstVisible is the lowest byte a field name may hold.
        name: firstVisible
        type: byte
        value: "0x21"
      - doc: lastVisible is the highest byte a field name may hold.
        name: lastVisible
        type: byte
        value: "0x7e"
    name: asciiTab
  - doc: What a connection's first bytes made of it.
    grouped: true
    items:
      - doc: |-
          kindSniffing is a connection whose bytes so far match the preface, or
          which sent none.
        name: kindSniffing
        type: connKind
        value: iota
      - doc: kindHTTP1 is a connection the embedded HTTP/1.1 adapter serves.
        name: kindHTTP1
      - doc: kindHTTP2 is a connection speaking HTTP/2.
        name: kindHTTP2
      - doc: kindRefused is a connection answered 400 and closing.
        name: kindRefused
    name: kindSniffing
  - doc: protoHTTP1 and protoH2 are the group's two ALPN identifiers.
    grouped: true
    items:
      - doc: protoHTTP1 is HTTP/1.1's identifier.
        name: protoHTTP1
        type: string
        value: "\"http/1.1\""
      - doc: protoH2 is HTTP/2's identifier.
        name: protoH2
        type: string
        value: "\"h2\""
    name: protoHTTP1
  - doc: connEntry's flags.
    grouped: true
    items:
      - doc: entryLive is set between OnOpen and OnClose.
        name: entryLive
        type: entryFlags
        value: 1 << iota
      - doc: entryGoAway is set once a GOAWAY left on this connection.
        name: entryGoAway
      - doc: entryEnded is set when the connection's output was refused.
        name: entryEnded
    name: entryLive
  - doc: requestState's flags.
    grouped: true
    items:
      - doc: requestDeclared is set when a content-length was given.
        name: requestDeclared
        type: requestFlags
        value: 1 << iota
      - doc: requestHead is set when the request's method is HEAD.
        name: requestHead
      - doc: |-
          requestRefused is set once an error answer went: its remaining bytes
          are dropped.
        name: requestRefused
      - doc: requestReading is set once OnBody has been called.
        name: requestReading
    name: requestDeclared
  - doc: The connection table's growth.
    grouped: true
    items:
      - doc: entriesInitial is the first size of a ring's table.
        name: entriesInitial
        type: int
        value: "16"
      - doc: entriesDoubleBelow is the table size below which entriesGrowth doubles.
        name: entriesDoubleBelow
        type: int
        value: "1024"
    name: entriesInitial
  - grouped: true
    items:
      - doc: |-
          slotHTTP2 marks a job's Slot as this adapter's own, apart from the embedded
          HTTP/1.1 adapter's jobs: both offload through the lane's one worker.
        name: slotHTTP2
        type: uint32
        value: 1 << 31
      - doc: statusUnavailable answers a pending request its lane's full queue refused.
        name: statusUnavailable
        type: int
        value: "503"
    name: slotHTTP2
  - doc: Which pseudo-fields a request gave.
    grouped: true
    items:
      - doc: seenMethod is :method.
        name: seenMethod
        type: pseudoSet
        value: 1 << iota
      - doc: seenTarget is :path.
        name: seenTarget
      - doc: seenScheme is :scheme.
        name: seenScheme
      - doc: seenAuthority is :authority.
        name: seenAuthority
    name: seenMethod
  - doc: The mapping's constants.
    grouped: true
    items:
      - doc: hostFieldName is the Host field, as Field looks it up.
        name: hostFieldName
        type: string
        value: "\"host\""
      - doc: maxDecimalDigits is the most digits an int64 surely holds.
        name: maxDecimalDigits
        type: int
        value: "18"
      - doc: protoMajorHTTP2 is what mapRequest sets Proto to.
        name: protoMajorHTTP2
        type: uint8
        value: "2"
      - doc: decimalBase is the radix of a Content-Length.
        name: decimalBase
        type: int64
        value: "10"
    name: hostFieldName
  - doc: The statuses the adapter answers by itself.
    grouped: true
    items:
      - doc: statusContentTooLarge answers a body past its bound.
        name: statusContentTooLarge
        type: int
        value: "413"
      - doc: statusInternal answers a response the writer refused.
        name: statusInternal
        type: int
        value: "500"
    name: statusContentTooLarge
  - doc: |-
      A request's ID, as http1's: the lane on top, a counter below, with one bit
      apart so an HTTP/2 request never shares an ID with an HTTP/1.1 one of its lane.
    grouped: true
    items:
      - doc: idLaneShift places the lane in an ID's top 16 bits.
        name: idLaneShift
        type: uint
        value: "48"
      - doc: idHTTP2Bit sets HTTP/2 apart.
        name: idHTTP2Bit
        type: uint64
        value: 1 << 47
      - doc: idCounterMask keeps the counter under idHTTP2Bit.
        name: idCounterMask
        type: uint64
        value: idHTTP2Bit - 1
    name: idLaneShift
