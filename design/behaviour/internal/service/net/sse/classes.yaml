# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      retryBase is the numeric base the retry field is written in. The format
      says decimal, so this is not a choice.
    items:
      - name: retryBase
        type: int
        value: "10"
    name: retryBase
  - doc: |-
      crlfWidth is how many bytes a CRLF terminator occupies. Naming it is the
      point: treating CRLF as two terminators emits a spurious empty data line
      between every pair of lines, which is a corruption nobody reads back.
    items:
      - name: crlfWidth
        type: int
        value: "2"
    name: crlfWidth
  - doc: |-
      DefaultKeepAlive is the comment cadence a stream uses when the caller sets
      none. It sits under the idle timeout of every proxy worth naming — nginx and
      most cloud load balancers default to 60 s, some CDNs to 30 — so a stream that
      has nothing to say still proves it is alive before anything cuts it.
    items:
      - name: DefaultKeepAlive
        type: time.Duration
        value: 15 * time.Second
    name: DefaultKeepAlive
  - doc: |-
      DefaultWriteTimeout bounds ONE frame's write. It is not a budget for the
      stream, which by nature has none; it is what stops a peer that has stopped
      reading from pinning a goroutine and a socket buffer forever.
    items:
      - name: DefaultWriteTimeout
        type: time.Duration
        value: 10 * time.Second
    name: DefaultWriteTimeout
  - doc: |-
      initialFrameCapacity pre-sizes the per-stream encode buffer. One frame of a
      few hundred bytes is the overwhelmingly common shape, and the buffer is
      reused for the stream's whole life, so a steady-state send allocates nothing
      once it has reached its high-water mark — which is exactly why
      maxRetainedFrameCapacity exists.
    items:
      - name: initialFrameCapacity
        type: int
        value: "512"
    name: initialFrameCapacity
  - doc: |-
      maxRetainedFrameCapacity is the buffer size above which reuse stops being
      unconditional. The buffer is kept for the stream's whole LIFE, so with no
      ceiling at all one outsized event pins its own size until the client
      disconnects — measured, a single one-mebibyte event left 1 056 768 B held per
      stream forever, which on 10 000 streams is 10.6 GB bought by something that
      happened once.

      64 KiB is chosen against what a stream costs otherwise: 10 000 streams at the
      ceiling is 640 MB, against 5 MB at the 512-byte floor and against a measured
      80.8 MB for everything else 10 000 streams hold. Below the ceiling, churning
      a buffer would buy nothing worth measuring, so reuse is unconditional there.

      It is NOT a hard cap, and retain says why: releasing on size alone made a
      stream that genuinely sends outsized frames re-grow its buffer on every send,
      which measured 25.5 µs against 6.6 µs for the same frame — 3.89×, a
      regression paid by exactly the workload the ceiling was never aimed at.
    items:
      - name: maxRetainedFrameCapacity
        type: int
        value: 64 * 1024
    name: maxRetainedFrameCapacity
  - doc: |-
      retainUseFraction is how much of an oversized buffer the last frame must
      still be using for the stream to keep it. A half is coarse on purpose: it
      separates "this stream works at this size" from "this stream is done with
      that size" without inventing a third case, and no finer setting was measured
      to matter.
    items:
      - name: retainUseFraction
        type: int
        value: "2"
    name: retainUseFraction
  - doc: |-
      keepAliveComment is the text of the periodic keep-alive. It is a comment,
      which every client ignores by construction, so it can never be mistaken for
      an event by a consumer that forgot to filter it.
    items:
      - name: keepAliveComment
        type: string
        value: "\"keep-alive\""
    name: keepAliveComment
files:
  - decls: []
    name: doc.go
  - decls:
      - retryBase
      - crlfWidth
      - AppendEvent
      - AppendComment
      - validateComment
      - appendData
      - terminatorWidth
      - advance
      - firstTerminator
      - indexFrom
      - appendField
    name: frame.go
  - decls:
      - DefaultKeepAlive
      - DefaultWriteTimeout
      - Option
      - config
      - KeepAlive
      - WithoutKeepAlive
      - WriteTimeout
      - Retry
      - resolve
    name: options.go
  - decls:
      - initialFrameCapacity
      - maxRetainedFrameCapacity
      - retainUseFraction
      - keepAliveComment
      - Stream
      - New
      - (*Stream).LastEventID
      - (*Stream).Done
      - (*Stream).Send
      - (*Stream).Comment
      - (*Stream).Close
      - (*Stream).retain
      - (*Stream).write
      - (*Stream).ended
      - (*Stream).end
      - (*Stream).watch
      - (*Stream).startKeepAlive
      - setStreamHeaders
