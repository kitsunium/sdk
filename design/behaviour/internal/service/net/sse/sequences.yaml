      - id: setStreamHeaders
        kind: self
      - id: h.Set
        kind: value
    steps:
      - eval: h.Set("Content-Type", corenet.SSEContentType)
        to: h.Set
      - opt:
          do:
            - eval: h.Set("Cache-Control", "no-cache")
              to: h.Set
          when: h.Get("Cache-Control") == ""
      - opt:
          do:
            - eval: h.Set("X-Accel-Buffering", "no")
              to: h.Set
          when: h.Get("X-Accel-Buffering") == ""
  - of: canFlush
    participants:
      - id: caller
        kind: actor
      - id: canFlush
        kind: self
      - id: unwrapped.Unwrap
        kind: internal
    steps:
      - loop:
          do:
            - typeswitch:
                bind: unwrapped
                cases:
                  - do:
                      - return: "true"
                    types: interface{ FlushError() error }, http.Flusher
                  - do:
                      - set: w
                        to: unwrapped.Unwrap
                        value: unwrapped.Unwrap()
                    types: interface{ Unwrap() http.ResponseWriter }
                  - default: true
                    do:
                      - return: "false"
                "on": w
          forever: true
