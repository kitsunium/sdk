    items:
      - doc: |-
          acceptDepth is how many single-shot accepts a ring keeps in flight per
          listener.
        name: acceptDepth
        type: int
        value: "32"
      - doc: |-
          acceptReserve is the free direct-descriptor entries a ring keeps: under
          it the ring stops accepting, and it resumes at twice as many.
        name: acceptReserve
        type: int
        value: "16"
