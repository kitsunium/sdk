functions:
  - doc: pinThread sets the calling thread's CPU mask to cpu alone.
    name: pinThread
    params: cpu int
    results: error
  - doc: |-
      reportAffinity records the loop-affinity row once every loop reported
      ready: on when every loop's thread is pinned, missing — a fault, the group
      asked — with the first refusal, and unprobed when Affinity names nothing.
    name: reportAffinity
    params: rep *capReport, loops []*loop
  - doc: |-
      busyPollOf resolves v's window, rounded up to whole microseconds, and its
      budget; checkValue already held both to their ranges.
    name: busyPollOf
    params: v corenet.LoopValue
    results: busyPollPlan
  - doc: |-
      busyPollField names the busy-poll field of v out of its range, "" when
      both are in it.
    name: busyPollField
    params: v corenet.LoopValue
    results: string
  - doc: callHook tells a test's counter about a busy-poll call about to be issued.
    name: callHook
    params: hook func(string), call string
  - doc: setEpollParams is EPIOCSPARAMS on epfd.
    name: setEpollParams
    params: epfd int, p *epollParams
    results: syscall.Errno
  - doc: |-
      probeBusyPollEpoll is busy-poll's stage on epoll: EPIOCSPARAMS with a zero
      window on a throwaway instance (ENOTTY before 6.9). It reports the row and
      returns what each loop's instance takes; a switched-off row issues nothing.
    name: probeBusyPollEpoll
    params: cfg *Config, sw capSwitches, rep *capReport, sz *sizing
    results: epollBusy
  - doc: |-
      epollProbe asks a throwaway instance for EPIOCSPARAMS; a test plays a
      kernel before 6.9.
    name: epollProbe
    params: hooks *loopHooks
    results: syscall.Errno
  - doc: |-
      reportBusyEpoll turns the row missing when a loop's instance refused what
      the probe's took.
    name: reportBusyEpoll
    params: rep *capReport, loops []*epollLoop
  - doc: capClassOf is c's class, and false for a capability the loop does not report.
    name: capClassOf
    params: c corenet.Capability
    results: string, bool
  - name: CheckCapabilities
    params: group string, v corenet.LoopValue
    results: error
  - doc: |-
      checkValue refuses Affinity and NotsentLowat out of their ranges; loops is
      the group's loop count, a non-positive one not resolved yet, and then the
      count of Affinity is not judged.
    name: checkValue
    params: group string, v corenet.LoopValue, loops int
    results: error
  - doc: newSwitches reads cfg's switches.
    name: newSwitches
    params: cfg *Config
    results: capSwitches
  - doc: |-
      newReport starts a report: every row unprobed by backend, a switched-off
      one disabled, a class B one named as such.
    name: newReport
    params: s capSwitches, backend string
    results: capReport
  - name: Unprobed
    params: backend string, disabled []corenet.Capability, disabledBy string
    results: "[]corenet.CapabilityValue"
  - doc: emptyConn is a slot's state on the free list.
    name: emptyConn
    params: gen uint32
    results: connCtl
  - doc: newRing builds ring i of lp over drv.
    name: newRing
    params: lp *loop, i int, drv driver
    results: "*ring"
  - doc: |-
      slotCap is the capacity a ring's table of capacity cur grows to: double,
      64 at least, up to slotStep slots more, never past table.
    name: slotCap
    params: cur, table int
    results: int
  - doc: growTo returns s with capacity c, its elements copied.
    name: growTo
    params: s []T, c int
    results: "[]T"
    typeParams: T any
  - doc: |-
      clampConsumed treats an OnData return outside 0 to n as n, as LoopHandler
      documents.
    name: clampConsumed
    params: v, n int
    results: int
  - doc: closeErr maps a close reason to the preallocated error OnClose receives.
    name: closeErr
    params: reason uint8, errno int32
    results: error
  - doc: |-
      deadlineTick is the first tick whose batch starts at least d after now,
      both from the loop's epoch: the absolute instant rounded up to a tick
      boundary, one-based as the tick is, and saturated rather than overflowed.
      Counted from the call, not from the batch's tick, so a deadline set late
      in a long batch fires no earlier than asked; no adapter of the request
      path sets one a request.
    name: deadlineTick
    params: now, d time.Duration
    results: int64
  - doc: threadCheck compiles no check without the loopdebug build tag.
    name: threadCheck
    params: _ int
    results: func() bool
  - doc: |-
      newListenerSet shares fds among their takers: takersOf(i) of them hand
      listener i back.
    name: newListenerSet
    params: fds []int, takersOf func(i int) int
    results: "*listenerSet"
  - doc: |-
      takersOfShards counts the takers of a group whose listeners may each belong
      to one loop: a shard is taken by that loop's rings, a shared listener by
      every loop's.
    name: takersOfShards
    params: owners []int, loops, rings int
    results: func(int) int
  - doc: ownersOf is cfg's listeners' owners, in Config.Listeners' order.
    name: ownersOf
    params: ls []Listener
    results: "[]int"
  - doc: |-
      ownedBy reports whether loop index accepts on listener i: its shard, or a
      listener every loop shares.
    name: ownedBy
    params: owners []int, i, index int
    results: bool
  - doc: |-
      doneOutside is a taker's queueDone at the start: a shard of another loop
      was never this one's to take, so it starts handed back (#856).
    name: doneOutside
    params: owners []int, index int
    results: "[]bool"
  - doc: |-
      takeAfter says what an accept4 failure means for the drain's take, live
      the connections the group still holds.
    name: takeAfter
    params: err error, live int64
    results: uint8
  - doc: |-
      startEpoll starts g's loops on epoll.

      Goroutine lifecycle: it launches one goroutine per loop, locked to its
      thread, which returns once the loop stopped or drained, and one reaper that
      waits for them all, closes the listeners the drain did not and closes fin,
      then returns.
    name: startEpoll
    params: g *Group, cfg *Config
    results: error
  - doc: |-
      probeExclusive asks a throwaway epoll instance whether it takes
      EPOLLEXCLUSIVE (4.5), on an eventfd of its own, and reports it. It returns
      the flag every listener registration carries.
    name: probeExclusive
    params: sw capSwitches, rep *capReport
    results: uint32
  - doc: errnoOf extracts the errno of a syscall error, EIO when it is none.
    name: errnoOf
    params: err error
    results: int32
  - doc: secondaryWakeVerdict is the verdict, wakeUnprobed before the probe ran.
    name: secondaryWakeVerdict
    results: string
  - name: Start
    params: cfg Config
    results: "*Group, error"
  - doc: |-
      checkShards refuses a listener owned by a loop the group does not have
      (server sizes the shards from the Loops the group resolved to).
    name: checkShards
    params: cfg Config, loops int
    results: error
  - doc: newLoop builds loop i of g, its rings empty, its slab mapped by mapper.
    name: newLoop
    params: g *Group, cfg Config, i int, mapper func(int) ([]byte, error), unmapper func([]byte) error
    results: "*loop"
  - doc: |-
      swallowErr intentionally discards a non-actionable error, recording the
      discard so the error audit treats it as deliberate rather than dropped.

      The loop has no caller to return to on these paths: a descriptor it closes
      is already out of its tables, a mapping it unmaps is already out of its
      slab, an epoll_ctl on a listener or a connection the loop is about to drop
      or retry at the next readiness, and the start line's writer is the
      caller's own object. None of them changes what the loop does next.
    name: swallowErr
    params: err error
  - doc: |-
      startNative starts g on the backend cfg asks for. auto takes io_uring when
      the staged probe passes and epoll otherwise, the reason in State and on the
      start line (the batchDegradation precedent); an explicit io_uring the probe
      refused is LoopBackendUnavailable. The portable backend is server's, never
      the leaf's (ADR 0186 §D3).
    name: startNative
    params: g *Group, cfg *Config
    results: error
  - doc: |-
      noDelay sets TCP_NODELAY on a listener, inherited by every socket it
      accepts, unless the operator switched tcp-nodelay off. A socket that
      refuses it still serves; server reads the option back for State.
    name: noDelay
    params: fd int, sw capSwitches
  - doc: |-
      descriptorLimit is the effective RLIMIT_NOFILE soft limit, zero when it
      cannot be read.
    name: descriptorLimit
    results: uint64
  - doc: mmapAnon maps n bytes of private anonymous memory, outside the Go heap.
    name: mmapAnon
    params: n int
    results: "[]byte, error"
  - doc: |-
      dupCloexec duplicates fd, close-on-exec from its birth, to the lowest free
      number.
    name: dupCloexec
    params: fd int
    results: int, error
  - doc: closeFDs closes every valid descriptor of fds.
    name: closeFDs
    params: fds []int
  - doc: closeListeners closes the hand-off descriptors of a group that never started.
    name: closeListeners
    params: ls []Listener
  - doc: unavailable wraps a setup failure as LoopBackendUnavailable naming the step.
    name: unavailable
    params: step string, err error
    results: error
  - doc: |-
      setKeepAlive sets SO_KEEPALIVE with the idle time and the interval of d
      (zero is keepAliveDefault) and keepAliveProbes probes, then reads the idle
      time back.
    name: setKeepAlive
    params: fd int, d time.Duration
    results: error
  - doc: |-
      setUserTimeout sets TCP_USER_TIMEOUT to d in whole milliseconds and reads
      it back.
    name: setUserTimeout
    params: fd int, d time.Duration
    results: error
  - doc: |-
      setDeferAccept sets TCP_DEFER_ACCEPT to d in whole seconds. The kernel
      rounds it to its retransmission schedule, so only a positive reading is
      required back.
    name: setDeferAccept
    params: fd int, d time.Duration
    results: error
  - doc: optionRows are the rows the listener options own, as cfg asks for them.
    name: optionRows
    params: cfg *Config, sw capSwitches
    results: "[]optionRow"
  - doc: |-
      lowatOf is the TCP_NOTSENT_LOWAT a group asks for: its value, or
      defaultNotsentLowat when only opted into.
    name: lowatOf
    params: v corenet.LoopValue
    results: int
  - doc: setNotsentLowat sets TCP_NOTSENT_LOWAT to n bytes and reads it back.
    name: setNotsentLowat
    params: fd, n int
    results: error
  - doc: |-
      incomingCPURow sets SO_INCOMING_CPU on each per-loop listener whose loop
      Affinity pins, and reads it back: the kernel's SO_REUSEPORT lookup then
      prefers the listener whose CPU took the connection (#857). It needs both
      Shards(0)'s listeners and an Affinity; without either the row reads
      unprobed with what is missing.
    name: incomingCPURow
    params: cfg *Config, sw capSwitches
    results: listenerRow
  - doc: setIncomingCPU sets SO_INCOMING_CPU to cpu and reads it back.
    name: setIncomingCPU
    params: fd, cpu int
    results: error
  - doc: "newTally starts a tally: every row unprobed, for want of a TCP listener."
    name: newTally
    params: opts []optionRow
    results: "*tally"
  - doc: |-
      prepareListeners sets TCP_NODELAY and the listener options of ADR 0189's
      rows on every TCP listener of cfg, before any accept, so each accepted
      socket inherits them, and reads each back: what it found is the rows of
      State. A listener of another family, a Unix socket, takes none of them and
      is no refusal of the kernel's. It returns the descriptors in order.
    name: prepareListeners
    params: cfg *Config, sw capSwitches
    results: fds []int, rows []listenerRow
  - doc: |-
      listenerRows is prepareListeners with the rows read off the per-loop
      listeners appended: reuseport-loops (#856) and so-incoming-cpu (#857).
    name: listenerRows
    params: cfg *Config, sw capSwitches
    results: fds []int, rows []listenerRow
  - doc: |-
      tcpListener reports whether fd is a TCP listener: the options of this file
      mean nothing, and are refused by the kernel, on any other family.
    name: tcpListener
    params: fd int
    results: bool
  - doc: ceilUnits is d in whole units, rounded up, at least one for a positive d.
    name: ceilUnits
    params: d, unit time.Duration
    results: int
  - doc: |-
      errOr is err, or def when err is nil: a reading that came back wrong has no
      error of its own.
    name: errOr
    params: err error, def syscall.Errno
    results: error
  - doc: expectOpt reads an integer option back and fails unless it is want.
    name: expectOpt
    params: fd, level, opt, want int
    results: error
  - doc: |-
      shardRow is the reuseport-loops row: on when every listener owned by one
      loop reads SO_REUSEPORT back, missing — a fault, the group asked — when one
      does not, and unprobed for a group with no such listener (#856).
    name: shardRow
    params: ls []Listener
    results: listenerRow
  - doc: |-
      refuseSeqpacket refuses a group that listens on a unixpacket socket
      (SOCK_SEQPACKET): both backends read a connection as a byte stream, into a
      buffer that cuts a record longer than itself with no flag to say so, and a
      record that reached OnData cut would be the silent truncation the engine's
      datagram rule forbids. A refusal at Start, not a cut (ADR 0031, #974);
      unix and tcp stay.
    name: refuseSeqpacket
    params: cfg *Config
    results: error
  - doc: |-
      pktinfoSource reads one IP_PKTINFO or IPV6_PKTINFO payload into the source a
      reply to its sender leaves from, as server's pinWriter reads it: on IPv4 the
      kernel's ipi_spec_dst — the interface's address for a broadcast or a
      multicast destination —, on IPv6 the destination itself unless it is a
      group, a mapped broadcast or nothing. ok is false for any other message.
    name: pktinfoSource
    params: level, typ int, data []byte
    results: src replySource, ok bool
  - doc: |-
      pktinfo4 reads an in_pktinfo's ipi_spec_dst; an all-zero one names no
      source.
    name: pktinfo4
    params: data []byte
    results: replySource
  - doc: |-
      pktinfo6 reads an in6_pktinfo's address: a reply cannot leave from a group,
      a mapped broadcast or nothing.
    name: pktinfo6
    params: data []byte
    results: replySource
  - doc: |-
      writePktinfo writes the cmsg that sends from src on a socket of family into
      c, and returns the bytes it took: zero when src names nothing this family
      sends from. The interface index stays zero, so the routing table still
      decides the way out, as server's pinWriter leaves it.
    name: writePktinfo
    params: c []byte, family uint16, src replySource
    results: int
  - doc: "cmsgSpace is CMSG_SPACE(n): the header and n bytes, aligned to eight."
    name: cmsgSpace
    params: n int
    results: int
  - name: StartPacket
    params: cfg *PacketConfig
    results: PacketLane, error
  - doc: |-
      startPacket is StartPacket with the suite's injection: failStage names the
      probe stage that fails, empty for none.

      Goroutine lifecycle: StartPacket's — one per lane, locked to its OS thread,
      started here; it returns once Stop is asked or a handover drained the
      socket, and closes Done last.

      IFACE-OPAQUE: StartPacket's lane, the same value.
    name: startPacket
    params: cfg *PacketConfig, failStage string
    results: PacketLane, error
  - doc: loopbackPair opens two UDP sockets on 127.0.0.1, the first bound.
    name: loopbackPair
    results: rx, tx int, why string
  - doc: closePair closes the self-test's two sockets.
    name: closePair
    params: rx, tx int
  - doc: socketFamily is fd's address family, AF_INET or AF_INET6.
    name: socketFamily
    params: fd int
    results: uint16, string
  - doc: isInet4 reports an IPv4 socket address.
    name: isInet4
    params: sa syscall.Sockaddr
    results: bool
  - doc: isInet6 reports an IPv6 socket address.
    name: isInet6
    params: sa syscall.Sockaddr
    results: bool
  - doc: |-
      prepRecvmsg fills s as a multishot RECVMSG on a process descriptor into the
      lane's buffer group: each completion's buffer starts with an
      io_uring_recvmsg_out, then hdr's name and control rooms, then the payload.
    name: prepRecvmsg
    params: s *sqe, fd int, hdr *syscall.Msghdr, ud uint64
  - doc: prepSendmsg fills s as a SENDMSG of the record at hdr.
    name: prepSendmsg
    params: s *sqe, fd int, hdr unsafe.Pointer, ud uint64
  - doc: |-
      splitRecvmsgOut reads one multishot RECVMSG buffer: its name, its control
      data, its payload and the message's flags.
    name: splitRecvmsgOut
    params: b []byte
    results: name, ctrl, payload []byte, flags uint32
  - doc: |-
      sockaddrPort reads a sockaddr_in or sockaddr_in6 into an AddrPort; the
      zero AddrPort for anything else.
    name: sockaddrPort
    params: name []byte
    results: netip.AddrPort
  - doc: |-
      extendsRun reports whether r, after prev, extends the run first opened: one
      peer and one source, contiguous bytes, every datagram but the last of the run's size, the
      payload within gsoMaxBytes.
    name: extendsRun
    params: first, prev, r pendingReply, total int
    results: bool
  - doc: |-
      encodeSockaddr writes to as the socket's family addresses it into b and
      returns its length, zero when the family cannot address it.
    name: encodeSockaddr
    params: b []byte, to netip.AddrPort, family uint16
    results: uint32
  - doc: addMoved adds *n to a and zeroes it, only when it moved.
    name: addMoved
    params: a *atomic.Uint64, n *uint64
  - doc: |-
      peerCred reads SO_PEERCRED of fd into a structure that stays on the stack:
      the standard library's GetsockoptUcred returns a pointer to a heap one, an
      allocation a loop's callback does not pay.
    name: peerCred
    params: fd int
    results: syscall.Ucred, bool
  - doc: |-
      peerOf reads the credentials of the peer of the Unix socket fd, as the kernel
      recorded them when the connection was made (SO_PEERCRED). It allocates
      nothing on every architecture but linux/386 (peerCred). A socket of another
      family answers false — the kernel would answer zeros for a TCP one, which
      name nobody — and so does a peer in a process namespace the kernel cannot
      translate (a process id of zero).
    name: peerOf
    params: fd int
    results: corenet.LoopPeerValue, bool
  - doc: unixListener reports whether any of fds is a Unix listener.
    name: unixListener
    params: fds []int
    results: bool
  - doc: newPostQueue allocates a queue of postQueueCap entries.
    name: newPostQueue
    params: wake func()
    results: "*postQueue"
  - doc: |-
      resolve applies the defaults and the one ring formula of ADR 0186 §D5 to v,
      against the effective descriptor limit. A limit of zero leaves no
      descriptor for anything, and is refused before the division it would
      otherwise reach.
    name: resolve
    params: v corenet.LoopValue, maxConns int, rlimit uint64
    results: sizing, error
  - doc: |-
      ringCount is the one formula: the explicit value, otherwise
      ⌈target / table⌉, and one when no bound was set.
    name: ringCount
    params: explicit, target int, table uint64
    results: int, string
  - doc: |-
      batchWaitOf resolves the grouped wait: BatchWait's default, off when
      negative, never past the tick; BatchWaitMin's default, never past cqBatch,
      since one batch reaps no more.
    name: batchWaitOf
    params: v corenet.LoopValue, cqBatch int
    results: time.Duration, int
  - doc: |-
      yieldFor is the yield interval of a group of loops in a process of procs
      Ps: yieldEvery while a P is left over, none otherwise — with every P
      running a loop, a yield only hands the loop's own P around (ADR 0199).
    name: yieldFor
    params: procs, loops int
    results: time.Duration
  - name: ResolveLoops
    params: n int
    results: int, string
  - doc: orDefault returns v, or def when v is zero or less.
    name: orDefault
    params: v, def int
    results: int
  - doc: |-
      slabBudgetFor is each loop's slab budget and where it came from (#809):
      the caller's own, else a quarter of the cgroup allowance memlimit read
      shared by loops loops, at most defaultSlabBudget and at least floor — one
      connection's largest chunk, so a loop can serve one —, else
      defaultSlabBudget.
    name: slabBudgetFor
    params: explicit int, mem coreproc.MemoryLimitValue, loops, floor int
    results: int, string
  - doc: newSlab builds a slab whose largest class holds maxChunk bytes.
    name: newSlab
    params: maxChunk, budget int, mapper func(n int) ([]byte, error)
    results: "*slab"
  - doc: classOf is the smallest class whose chunk holds n bytes.
    name: classOf
    params: n int
    results: uint8
  - doc: scratch is buf cleared at length n, grown only when its capacity is short.
    name: scratch
    params: buf []T, n int
    results: "[]T"
    typeParams: T any
  - doc: storeU stores v to a, once it differs from what was published.
    name: storeU
    params: a *atomic.Uint64, was *uint64, v uint64
  - doc: storeI is storeU for a gauge.
    name: storeI
    params: a *atomic.Int64, was *int64, v int64
  - doc: uringSetup is io_uring_setup(2).
    name: uringSetup
    params: entries uint32, p *uringParams
    results: int, syscall.Errno
  - doc: uringRegister is io_uring_register(2).
    name: uringRegister
    params: fd int, op uintptr, arg unsafe.Pointer, n uint32
    results: syscall.Errno
  - doc: |-
      uringEnterWait is io_uring_enter(2) that may block: one Syscall6, so the
      runtime knows the thread is in the kernel, per batch.
    name: uringEnterWait
    params: fd int, submit, minComplete, flags uint32, arg unsafe.Pointer, argSz uintptr
    results: int, syscall.Errno
  - doc: |-
      uringEnterSubmit is io_uring_enter(2) that only submits and never blocks:
      RawSyscall6, with no scheduler round trip.
    name: uringEnterSubmit
    params: fd int, submit uint32
    results: int, syscall.Errno
  - doc: |-
      uringEnterFlags is uringEnterSubmit with flags: GETEVENTS with
      min_complete zero, which never blocks, and REGISTERED_RING.
    name: uringEnterFlags
    params: fd int, submit, flags uint32
    results: int, syscall.Errno
  - doc: |-
      fixedFd is the descriptor field of an SQE flagged IOSQE_FIXED_FILE: the
      direct-descriptor index itself, 0-based.
    name: fixedFd
    params: index uint32
    results: int32
  - doc: |-
      targetIndex is the file_index field that names a direct descriptor for
      IORING_OP_CLOSE and for an accept into a chosen index: the index plus one,
      zero meaning "not a direct descriptor".
    name: targetIndex
    params: index uint32
    results: uint32
  - doc: |-
      bundleRecv sends bundleProbeBytes over a socket pair and receives them on
      u with one single-shot bundle recv, returning its result or its errno.
    name: bundleRecv
    params: u *uring
    results: int, syscall.Errno
  - doc: |-
      layoutFlags is the SQ layout every ring takes: NO_SQARRAY as asked, or
      because SQ_REWIND needs it, and SQ_REWIND once its self-test passed.
    name: layoutFlags
    params: sw capSwitches, found uint32, rewind bool
    results: uint32
  - doc: |-
      probeReason names a probe step's refusal. EEXIST is a defect of the probe,
      never of the kernel: a SINGLE_ISSUER ring entered or registered off the
      thread that set it up (ADR 0189), which a probe run under LockOSThread from
      setup to close never does.
    name: probeReason
    params: step string, errno syscall.Errno
    results: string
  - doc: |-
      slowFanWake reports whether this kernel leaves a secondary ring's
      completion to the primary's timeout (#703), probing it once.
    name: slowFanWake
    results: bool
  - doc: |-
      probeFanWake reproduces a loop of two rings on a thread of its own: a
      primary polling the secondaries' eventfd, a secondary whose CQ notifies
      it and which polls a pipe, the pipe written from another thread once the
      primary waits. It times the primary's wake from the write and returns the
      verdict; a probe that cannot be set up says prompt, the loop unchanged.
      Without register the secondary notifies nothing: the suite's negative
      control, which must read slow.

      Goroutine lifecycle: one writer, started here and joined before return.
    name: probeFanWake
    params: register bool
    results: string
  - doc: |-
      fanWakeRig builds the probe's two rings, its eventfd and its pipe:
      rings[0] the primary, rings[1] the secondary; fds the eventfd, then the
      pipe's read and write ends.
    name: fanWakeRig
    params: register bool
    results: rings []*uring, fds []int, ok bool
  - doc: |-
      fanWakeWait waits on the primary, bounded by fanWakeBound, for the
      eventfd's poll, and returns when it came; zero when it never did.
    name: fanWakeWait
    params: u *uring
    results: time.Time
  - doc: fanEventReaped reaps u and reports whether the eventfd's poll completed.
    name: fanEventReaped
    params: u *uring
    results: bool
  - doc: |-
      fanTickFor is the primary's plain wait of a loop with rings rings: the
      tick, or fanWakeTick where the kernel's wake is slow and a secondary
      exists.
    name: fanTickFor
    params: rings int
    results: kernelTimespec
  - doc: armedAny reports whether any listener has an accept in flight.
    name: armedAny
    params: armed []int
    results: bool
  - doc: "udPack builds a user_data: the operation, 24 bits of generation, the slot."
    name: udPack
    params: op uint64, gen, slot uint32
    results: uint64
  - doc: udOp is the operation a user_data names, in its top byte.
    name: udOp
    params: ud uint64
    results: uint64
  - doc: udGen is the 24 bits of generation a user_data carries.
    name: udGen
    params: ud uint64
    results: uint32
  - doc: udSlot is the slot a user_data names, in its low half.
    name: udSlot
    params: ud uint64
    results: uint32
  - doc: |-
      startIOURing starts g's loops on io_uring. A loop whose probe fails stops
      the others; the error names the stage and the kernel's answer.

      Goroutine lifecycle: it launches one goroutine per loop, locked to its
      thread, which returns once the loop stopped or drained; one reaper that
      waits for them all and closes fin; and, once the group runs, one goroutine
      that waits on fin, closes the listeners the drain did not and returns.
    name: startIOURing
    params: g *Group, cfg *Config
    results: error
  - doc: probeError is a probe stage's failure.
    name: probeError
    params: stage string, errno syscall.Errno
    results: error
  - doc: orErrno returns the first non-zero errno.
    name: orErrno
    params: a, b syscall.Errno
    results: syscall.Errno
  - doc: |-
      bufCountFor is how many provided buffers a ring of table entries may hand
      its kernel: the table rounded up to a power of two, defaultBufs at least,
      maxBufs at most.
    name: bufCountFor
    params: table int
    results: uint32
  - doc: |-
      fillMargin is how many free entries of a table of table entries make a
      ring full: an eighth, and never under twice the accept reserve, so the
      next ring accepts before this one pauses.
    name: fillMargin
    params: table int
    results: int
  - doc: |-
      reapShape is how many completions one reap takes and how many reaps a
      ring gets a batch: CQBatch, reapRounds times; under a budget the same
      share in reaps of budgetChunk, the clock looked at between them.
    name: reapShape
    params: sz *sizing
    results: chunk, rounds int
  - doc: |-
      takeWaits reports whether an accept's failure leaves the drain's take
      going: its own cancel, a connection the peer abandoned, a signal, an empty
      queue (EAGAIN, should a kernel honour the listener's O_NONBLOCK), or no
      descriptor until a close frees one — live, the connections the group
      still holds, says one will.
    name: takeWaits
    params: res int32, live int64
    results: bool
  - doc: |-
      bufBudgetFor is the bytes of provided buffers one loop of sz may hand its
      rings: loopBufBudget, or less under MaxConns — a buffer for each of the
      loop's share of the connections, and the first ones every ring starts
      with —, since a burst never needs a buffer more than a connection sends
      (ADR 0203 §D2).
    name: bufBudgetFor
    params: sz *sizing
    results: uint64
  - doc: held is how many buffers the kernel holds, every group together.
    name: held
    params: inRing []int
    results: int
  - doc: fillStale overwrites b with staleFill.
    name: fillStale
    params: b []byte
  - doc: |-
      queued is how many connections wait in the listening socket fd's queue:
      TCP_INFO's count on a TCP listener; on one TCP_INFO does not answer — a
      Unix socket — acceptDepth when a zero-timeout poll says it is readable, and
      zero otherwise. An accept armed past what waits is cancelled once the queue
      reads empty.
    name: queued
    params: fd int
    results: int
  - doc: |-
      readable polls fd for input with a zero timeout: a listening socket is
      readable while its accept queue holds a connection.
    name: readable
    params: fd int
    results: bool
  - doc: |-
      listenerQueue is the listening socket's accept queue (TCP_INFO's unacked
      on a listener), zero when it cannot be read.
    name: listenerQueue
    params: fd int
    results: uint32
  - doc: |-
      prepPeerCred fills s as SOCKET_URING_OP_GETSOCKOPT of SO_PEERCRED on direct
      descriptor index, written to cred. The command's fields share the SQE's
      unions: cmd_op the low half of off, level and optname the two halves of
      addr, optlen file_index and optval addr3 — little-endian on every
      architecture this file builds on.
    name: prepPeerCred
    params: s *sqe, index uint32, cred *syscall.Ucred, ud uint64
  - doc: |-
      prepInstall fills s as IORING_OP_FILES_UPDATE of the one process
      descriptor at *fd into a free direct entry, which the kernel writes back
      to *fd.
    name: prepInstall
    params: s *sqe, fd *int32, ud uint64
  - doc: |-
      unixListeners reports, per descriptor of fds, whether it is a Unix
      listener.
    name: unixListeners
    params: fds []int
    results: "[]bool"
  - doc: peerSeesEnd reports whether fd reads end-of-stream within 200 ms.
    name: peerSeesEnd
    params: fd int
    results: bool
  - doc: |-
      selfTestRing opens the self-test's ring with flags, and gives it buffers
      and a table as a serving ring has them. A failure closes it.
    name: selfTestRing
    params: flags uint32, direct bool
    results: "*uring, error"
  - doc: |-
      selfTestClient connects a blocking client socket to the loopback port and
      writes the payload, which waits in the socket before the recv is armed. A
      failure closes the socket.
    name: selfTestClient
    params: port int, payload []byte
    results: int, error
  - doc: |-
      loopbackListener binds a listening socket on 127.0.0.1, port chosen by the
      kernel.
    name: loopbackListener
    results: fd, port int, err error
  - doc: |-
      openURing sets an io_uring of entries SQEs up with flags, mapping it and building the
      views. It returns the errno of the step that failed.
    name: openURing
    params: entries, flags uint32
    results: "*uring, string, syscall.Errno"
  - doc: errnoOfErr extracts an errno, EIO otherwise.
    name: errnoOfErr
    params: err error
    results: syscall.Errno
  - doc: |-
      registerBufRing is IORING_REGISTER_PBUF_RING with reg, resv zero as the
      uapi requires. Ubuntu's noble kernel 6.8.0-147 inverts that check
      (io_uring/kbuf.c: `if (!memchr_inv(reg.resv, 0, sizeof(reg.resv)))
      return -EINVAL;`, Ubuntu-6.8.0-147.147) and refuses every zero resv; on
      EINVAL the registration is tried once more with one resv byte set, which
      that kernel accepts and a correct one refuses again with EINVAL.
    name: registerBufRing
    params: fd int, reg *bufReg
    results: syscall.Errno
  - doc: |-
      singleShot turns a multishot recv into a single-shot one: one
      completion, never F_MORE, re-armed by the state machine after it.
    name: singleShot
    params: s *sqe
  - doc: |-
      prepAccept fills s as an accept on lfd into a kernel-allocated direct
      descriptor: multishot for the probe's self-test, single-shot for serving
      (uRing.armAccepts says why).
    name: prepAccept
    params: s *sqe, lfd int, ud uint64, multishot bool
  - doc: |-
      prepRecv fills s as a multishot recv on direct descriptor index, selecting
      provided buffers from group bgid.
    name: prepRecv
    params: s *sqe, index uint32, bgid uint16, ud uint64
  - doc: prepSend fills s as a send of p on direct descriptor index.
    name: prepSend
    params: s *sqe, index uint32, p []byte, ud uint64
  - doc: |-
      prepSendZC fills s as a zero-copy send of p on direct descriptor index
      (IORING_OP_SEND_ZC): the pages stay the kernel's until the notification.
    name: prepSendZC
    params: s *sqe, index uint32, p []byte, ud uint64
  - doc: prepSpliceIn fills s as the step in, linked to the splice out behind it.
    name: prepSpliceIn
    params: s *sqe, in spliceIn, ud uint64
  - doc: |-
      prepSpliceOut fills s as a splice of n bytes from the read end of a pipe to
      the socket at index, non-blocking.
    name: prepSpliceOut
    params: s *sqe, pipeR int32, index, n uint32, ud uint64
  - doc: prepPollOut fills s as a one-shot POLLOUT on the socket at index.
    name: prepPollOut
    params: s *sqe, index uint32, ud uint64
  - doc: |-
      prepCancelFixed fills s as a cancel of every operation on direct descriptor
      index. Only the probe's release check uses it, on a ring of a few
      requests: the kernel finds them by walking every armed request
      (io_poll_file_find), which a serving ring cannot afford at each close.
    name: prepCancelFixed
    params: s *sqe, index uint32, ud uint64
  - doc: |-
      prepShutdownFixed fills s as shutdown(2) with how on direct descriptor
      index. It sends the FIN without waiting for the file to be put, which a
      direct descriptor's close may defer (uRing.shutdown says why).
    name: prepShutdownFixed
    params: s *sqe, index uint32, how int, ud uint64
  - doc: |-
      onProcessFD turns an SQE filled for a direct descriptor into the same
      operation on the process descriptor of the same number: no fixed-file
      flag, a cancel that looks the number up in the process table, an accept
      that installs into it, close-on-exec.
    name: onProcessFD
    params: s *sqe
  - doc: prepCloseDirect fills s as the close of direct descriptor index.
    name: prepCloseDirect
    params: s *sqe, index uint32, ud uint64
  - doc: prepCancelUserData fills s as a cancel of every operation carrying target.
    name: prepCancelUserData
    params: s *sqe, target, ud uint64
  - doc: prepPollMulti fills s as a multishot POLLIN on a process descriptor.
    name: prepPollMulti
    params: s *sqe, fd int, ud uint64
  - doc: |-
      sendZCRound sends three bytes zero-copy from a connected UDP socket to a
      loopback one on u and reads the send's CQE, then its notification.
    name: sendZCRound
    params: u *uring
    results: string
  - doc: |-
      sendZCReap waits, bounded, for a zero-copy send's CQE and its
      notification: whether each came, and the send's result.
    name: sendZCReap
    params: u *uring
    results: sent, notified bool, sendRes int32
  - doc: newWheel builds a wheel for n slots, its clock at tick now.
    name: newWheel
    params: n int, now int64
    results: "*wheel"
  - doc: zcrxField names the ZCRX field of v out of its range, "" when none is.
    name: zcrxField
    params: v corenet.LoopValue
    results: string
  - doc: |-
      zcrxOf resolves v.ZCRX: the area's default, rounded up to whole pages of
      page bytes.
    name: zcrxOf
    params: v corenet.LoopValue, page int
    results: corenet.ZCRXValue
  - doc: |-
      zcrxRegister registers z's queue on a ring of its own, set up as a
      receiving ring must be — DEFER_TASKRUN, SINGLE_ISSUER on this locked
      thread, CQE32 — with an area of z.AreaBytes and a refill ring of one page,
      both mapped here, and closes it: the ring's close releases the queue,
      which the kernel restarts on registration and again on release. It returns
      the kernel's answer: ENODEV for an unknown interface, EPERM without
      CAP_NET_ADMIN, EINVAL before 6.15 or for a queue the driver cannot split,
      EOPNOTSUPP for a driver without the queue API.
    name: zcrxRegister
    params: z corenet.ZCRXValue
    results: syscall.Errno
imports:
  atomic: sync/atomic
  binary: encoding/binary
  bits: math/bits
  bytes: bytes
  cmp: cmp
  context: context
  corenet: github.com/kitsunium/sdk/internal/core/net
  coreproc: github.com/kitsunium/sdk/internal/core/proc
  errors: errors
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  fmt: fmt
  io: io
  math: math
  netip: net/netip
  os: os
  runtime: runtime
  slices: slices
  stdnet: net
  strconv: strconv
  sync: sync
  syscall: syscall
  time: time
  unsafe: unsafe
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/net/loop
  name: loop
  purpose: "Package loop is the network domain's event-loop engine (ADR 0186): the native backends a plaintext stream group runs on when it is served by a corenet.LoopHandler — epoll on every Linux architecture, io_uring after a staged probe of the running kernel — and nothing else of the SDK."
types:
  - doc: |-
      busyPollPlan is what busy-poll asks of the kernel: the window in whole
      microseconds and epoll's budget, zero for the kernel's.
    fields:
      - name: usecs
        type: uint32
      - name: budget
        type: uint16
    kind: struct
    name: busyPollPlan
  - doc: epollParams is struct epoll_params (include/uapi/linux/eventpoll.h, 6.9).
    fields:
      - name: usecs
        type: uint32
      - name: budget
        type: uint16
      - name: prefer
        type: uint8
      - name: pad
        type: uint8
    kind: struct
    name: epollParams
  - doc: |-
      epollBusy is busy-poll on one epoll loop: the parameters its instance
      takes, none when the row is off, and the kernel's refusal of them.
    fields:
      - name: "on"
        type: bool
      - name: params
        type: epollParams
      - name: hook
        type: func(string)
      - name: errno
        type: syscall.Errno
    kind: struct
    methods:
      - doc: |-
          apply sets the loop's instance's parameters, when the row is on, and keeps
          the kernel's refusal for the report.
        name: apply
        params: epfd int
        recv: b *epollBusy
    name: epollBusy
  - doc: |-
      uringNAPI is struct io_uring_napi as 6.9 lays it out: 6.13 names pad[0]
      opcode and the first half of resv op_param, both zero for the dynamic
      tracking this backend asks for.
    fields:
      - name: busyPollTo
        type: uint32
      - name: prefer
        type: uint8
      - name: pad
        type: "[3]uint8"
      - name: resv
        type: uint64
    kind: struct
    name: uringNAPI
  - doc: |-
      capClass is one capability the loop reports and its class, in the order
      State lists them.
    fields:
      - doc: name is the capability.
        name: name
        type: corenet.Capability
      - doc: class is its class.
        name: class
        type: string
    kind: struct
    name: capClass
  - doc: |-
      capSwitches is what the group may use: the operator's switches and the
      code's opt-ins, read once at Start.
    fields:
      - doc: off holds what the operator switched off, with offBy saying how.
        name: "off"
        type: "[]corenet.Capability"
      - name: offBy
        type: string
      - doc: want holds the class A-code capabilities the code opted into.
        name: want
        type: "[]corenet.Capability"
    kind: struct
    methods:
      - doc: disabled reports whether the operator switched c off.
        name: disabled
        params: c corenet.Capability
        recv: s capSwitches
        results: bool
      - doc: |-
          wants reports whether c may be used: class A-kernel unless switched off,
          class A-code when opted into and not switched off.
        name: wants
        params: c corenet.Capability
        recv: s capSwitches
        results: bool
    name: capSwitches
  - doc: |-
      capReport is the rows a backend fills, one per loopCaps entry, in order,
      and the class A-code capabilities the code opted into.
    fields:
      - name: rows
        type: "[]corenet.CapabilityValue"
      - name: want
        type: "[]corenet.Capability"
    kind: struct
    methods:
      - doc: |-
          set records c's status and reason, unless the operator switched it off.
          An absent class A-code capability the code opted into is missing.
        name: set
        params: c corenet.Capability, status, reason string
        recv: r *capReport
      - doc: wanted reports whether the code opted into c, a class A-code capability.
        name: wanted
        params: c corenet.Capability
        recv: r *capReport
        results: bool
      - doc: |-
          found records a probed capability: on when the group uses it, available
          when nobody asked for it, absent with reason when the kernel lacks it.
        name: found
        params: s capSwitches, c corenet.Capability, present bool, reason string
        recv: r *capReport
      - doc: apply records rows in rep, the operator's disabled rows kept as they are.
        name: apply
        params: rows []listenerRow
        recv: r *capReport
    name: capReport
  - doc: |-
      connCtl is one connection slot's control state. It holds no pointer, so the
      table of them is a pointer-free Go slice the race detector sees and the
      collector does not scan (ADR 0186 §D7); every byte it names lives in the
      slab.
    fields:
      - doc: gen is the slot's generation, never zero once the slot has served.
        name: gen
        type: uint32
      - doc: state and flags are the slot's state and its flags.
        name: state
        type: uint8
      - name: flags
        type: uint8
      - doc: reason is why the connection closed; errno its errno when it is rErrno.
        name: reason
        type: uint8
      - name: errno
        type: int32
      - doc: |-
          fd is the connection's descriptor: a process descriptor on epoll, a
          direct-descriptor index on io_uring.
        name: fd
        type: int32
      - doc: |-
          ops counts operations in flight on io_uring; the slot is released only
          at zero.
        name: ops
        type: int32
      - doc: |-
          spill holds the unconsumed input; out the written, unsent output;
          flight the output the kernel is sending.
        name: spill
        type: chunkRef
      - name: out
        type: chunkRef
      - name: flight
        type: chunkRef
      - doc: lastIO is the tick of the last byte received or sent.
        name: lastIO
        type: int64
      - doc: deadline is the handler's deadline tick, zero when none.
        name: deadline
        type: int64
      - doc: lruPrev and lruNext link the ring's open connections, least recent first.
        name: lruPrev
        type: int32
      - name: lruNext
        type: int32
      - doc: dirtyNext links the ring's dirty list.
        name: dirtyNext
        type: int32
      - doc: fileFD is the file being sent, the engine's own duplicate; -1 when none.
        name: fileFD
        type: int32
      - doc: |-
          pipeR and pipeW are the pipe the file crosses on io_uring, a connection's
          own, -1 when none; pipeHeld how many bytes the pipe holds.
        name: pipeR
        type: int32
      - doc: |-
          pipeR and pipeW are the pipe the file crosses on io_uring, a connection's
          own, -1 when none; pipeHeld how many bytes the pipe holds.
        name: pipeW
        type: int32
      - name: pipeHeld
        type: int32
      - doc: fileOps counts the file's operations in flight on io_uring.
        name: fileOps
        type: uint8
      - doc: fileBits holds ffEOF, ffFull and ffPoll.
        name: fileBits
        type: uint8
      - doc: |-
          zc is how the flight leaves (#969): zcOff by plain sends, zcOn every
          send of it zero-copy, zcHold none for now — zcPend is at its bound —
          until its notifications came, the rest then sent plainly. zcPend counts
          its sends whose notification has not come: the flight's chunk is the
          kernel's until it reaches zero. zcVoid counts the notifications still
          to come of sends the kernel refused, which pinned nothing (#1396): they
          hold the slot, never the flight.
        name: zc
        type: uint8
      - name: zcPend
        type: uint8
      - name: zcVoid
        type: uint8
      - doc: fileErr is the errno a file operation failed with, zero when none.
        name: fileErr
        type: int32
      - doc: fileOff is the next byte of the file to send, fileLeft how many are left.
        name: fileOff
        type: int64
      - name: fileLeft
        type: int64
    kind: struct
    methods:
      - doc: sending reports whether the slot holds output, sent or not, or a file.
        name: sending
        recv: c *connCtl
        results: bool
      - doc: pending is how many output bytes the slot holds, sent or not.
        name: pending
        recv: c *connCtl
        results: int
    name: connCtl
  - doc: |-
      driver is what a backend does for the core: send a connection's output and
      release its descriptor. The core owns every other decision.
    kind: named
    name: driver
    underlying: |-
      interface {
      	// flush starts or continues sending slot's output. It is called on the
      	// loop's thread, once the batch's callbacks have returned.
      	flush(r *ring, slot int32)
      	// shutdown releases slot's descriptor once OnClose has been called; the
      	// backend calls r.release(slot) when nothing of the connection remains in
      	// the kernel.
      	shutdown(r *ring, slot int32)
      	// unread reports whether slot's socket holds bytes not yet received, so
      	// eviction never closes a connection mid-request.
      	unread(r *ring, slot int32) bool
      }
  - doc: |-
      shared is what every loop of one group shares: the connection bound and
      the counters it is judged on.
    fields:
      - doc: live is the group's open connections, across loops.
        name: live
        type: atomic.Int64
      - doc: rejected counts connections closed at accept by MaxConns.
        name: rejected
        type: atomic.Uint64
      - doc: |-
          hist counts batch durations by power of two, for the p99 State
          reports: loops write it, State reads it.
        name: hist
        type: "[batchBuckets]atomic.Uint64"
    kind: struct
    methods:
      - doc: observe records one batch's duration in the group's histogram.
        name: observe
        params: d time.Duration
        recv: g *shared
      - doc: |-
          batchP99 returns the upper bound of the bucket holding the 99th
          percentile, zero before any batch.
        name: batchP99
        recv: g *shared
        results: time.Duration
    name: shared
  - doc: |-
      ring is one descriptor shard of a loop: its slot table, its timers, its
      least-recently-used list and its counters.
    fields:
      - doc: lp is the loop the ring belongs to; index its place in it.
        name: lp
        type: "*loop"
      - name: index
        type: int
      - doc: conns is the slot table, grown on demand up to the loop's table size.
        name: conns
        type: "[]connCtl"
      - doc: free is a stack of released slots.
        name: free
        type: "[]int32"
      - doc: live is the ring's open connections.
        name: live
        type: int
      - doc: wheel times every slot's deadline and idle bound.
        name: wheel
        type: "*wheel"
      - doc: |-
          lruHead and lruTail bound the list of open connections, least recent
          at the head.
        name: lruHead
        type: int32
      - name: lruTail
        type: int32
      - doc: dirtyHead starts the list of slots to flush at the end of the batch.
        name: dirtyHead
        type: int32
      - doc: |-
          compact lists the slots whose spill's head was consumed in the batch,
          compacted at its end. A slice, not a link in the slot: a slot released
          inside the batch is reset whole, and a link would cut the list there.
        name: compact
        type: "[]int32"
      - doc: drv is the backend.
        name: drv
        type: driver
      - doc: st is the ring's counters, published at the end of each batch.
        name: st
        type: ringCounters
      - name: pub
        type: "*ringStats"
      - doc: "seen is what pub last held: publish stores only what moved."
        name: seen
        type: seen
      - doc: draining is a ring that accepts nothing more.
        name: draining
        type: bool
    kind: struct
    methods:
      - doc: |-
          take reserves a slot for a new connection on descriptor fd. It reports
          false when the ring's table is full; the caller closes fd. The backend
          registers the slot, then calls opened.
        name: take
        params: fd int32
        recv: r *ring
        results: int32, bool
      - doc: |-
          opened counts the connection taken on slot, flags its pressure, arms its
          timers and calls OnOpen.
        name: opened
        params: slot int32
        recv: r *ring
      - doc: abandon returns a slot taken for a connection that never opened.
        name: abandon
        params: slot int32
        recv: r *ring
      - doc: ref is slot's current reference.
        name: ref
        params: slot int32
        recv: r *ring
        results: corenet.LoopConnRef
      - doc: |-
          deliver hands data, received on slot, to the handler behind any spill, and
          keeps what it does not consume. data must stay valid until OnBatchEnd
          returns, as the handler's buf does.
        name: deliver
        params: slot int32, data []byte
        recv: r *ring
      - doc: keep copies an unconsumed tail into a fresh spill.
        name: keep
        params: slot int32, tail []byte
        recv: r *ring
      - doc: |-
          appendSpill adds data behind slot's spill. The spill's bytes already handed
          to the handler stay where they are until OnBatchEnd: a spill too small is
          copied to a larger chunk and the old one released after the batch, never
          compacted or reallocated in place.
        name: appendSpill
        params: slot int32, data []byte
        recv: r *ring
        results: bool
      - doc: |-
          spillRoom returns the free bytes behind slot's spill, growing it to a chunk
          with at least want free bytes within the cap, so a backend can read
          straight into it. It returns nil when the spill is at its cap or the budget
          is spent; the caller then closes or reads elsewhere.
        name: spillRoom
        params: slot int32, want int
        recv: r *ring
        results: "[]byte"
      - doc: |-
          deliverSpill hands n bytes read straight into slot's spill (spillRoom) to
          the handler with the rest of the spill.
        name: deliverSpill
        params: slot int32, n int
        recv: r *ring
      - doc: |-
          consumed advances slot's spill past the n bytes the handler consumed: a
          spill consumed whole goes back once the batch is over, a head consumed is
          listed for the compaction at the batch's end.
        name: consumed
        params: slot int32, n int
        recv: r *ring
      - doc: hasSpill reports whether slot holds unconsumed input.
        name: hasSpill
        params: slot int32
        recv: r *ring
        results: bool
      - doc: |-
          compactSpill moves slot's spill's unconsumed bytes to the front of its chunk.
          It runs after OnBatchEnd, when no handed-out buffer survives.
        name: compactSpill
        params: slot int32
        recv: r *ring
      - doc: markDirty puts slot on the list flushed at the end of the batch.
        name: markDirty
        params: slot int32
        recv: r *ring
      - doc: |-
          flushDirty sends every dirty slot's output and finishes the closes it
          waited for. It runs once OnBatchEnd has returned.
        name: flushDirty
        recv: r *ring
      - doc: |-
          settle flushes slot's output and finishes it when it was waiting to close
          and has nothing left to send.
        name: settle
        params: slot int32
        recv: r *ring
      - doc: |-
          sent records that some of slot's output was sent, and fires OnWritable when
          a producer waits and the output fell under the low-water mark. The byte
          count is the driver's to pass; the pending total already reflects it.
        name: sent
        params: slot int32, _ int
        recv: r *ring
      - doc: fail closes slot now for reason, whatever output it holds.
        name: fail
        params: slot int32, reason uint8, errno int32
        recv: r *ring
      - doc: |-
          finish calls OnClose, releases every chunk and timer of slot, and hands the
          descriptor to the backend; the slot returns to the free list once the
          backend calls release.
        name: finish
        params: slot int32, reason uint8, errno int32
        recv: r *ring
      - doc: |-
          release returns a dead slot to the free list. The backend calls it once the
          descriptor is closed and no operation of the slot remains in flight, so the
          slot's memory and generation move on only then.
        name: release
        params: slot int32
        recv: r *ring
      - doc: |-
          armTimer arms slot's timer at the earlier of its deadline and its idle
          bound.
        name: armTimer
        params: slot int32
        recv: r *ring
      - doc: |-
          expire is the wheel's callback: it fires the handler's deadline or closes
          an idle connection, and re-arms what is still due later.
        name: expire
        params: slot int32
        recv: r *ring
      - doc: lruPush appends slot as the most recent.
        name: lruPush
        params: slot int32
        recv: r *ring
      - doc: lruUnlink removes slot from the list.
        name: lruUnlink
        params: slot int32
        recv: r *ring
      - doc: lruTouch moves slot to the most recent end.
        name: lruTouch
        params: slot int32
        recv: r *ring
      - doc: |-
          evict closes up to evictPerTick connections idle for at least the eviction
          age, least recent first, never one holding unread or unconsumed bytes or
          output. It returns how many it closed.
        name: evict
        recv: r *ring
        results: int
      - doc: |-
          compactListed compacts the spill of every slot listed in the batch, so the
          batch's end costs the slots it touched, not the open ones. A slot released
          and taken again since its listing is compacted harmlessly: compactSpill
          moves nothing it does not have to.
        name: compactListed
        recv: r *ring
      - doc: |-
          countClose counts a close the engine decided itself: the input past its
          ceiling and the idle bound (#975).
        name: countClose
        params: reason uint8
        recv: r *ring
      - doc: |-
          refuseOutput counts a Write refused with LoopOutputFull, asks for
          OnWritable, and returns the refusal.
        name: refuseOutput
        params: c *connCtl
        recv: r *ring
        results: error
      - doc: wrote records n bytes of output the kernel took.
        name: wrote
        params: n int
        recv: r *ring
      - doc: |-
          dropFile releases slot's file as the connection goes, no operation of it
          left in flight.
        name: dropFile
        params: slot int32
        recv: r *ring
      - doc: |-
          fileDone ends slot's file, its last byte gone: its descriptor and pipe
          released, a producer told, and the slot settled, a close having waited for it.
        name: fileDone
        params: slot int32
        recv: r *ring
      - doc: full reports whether the ring's table has no slot left for a connection.
        name: full
        recv: r *ring
        results: bool
      - doc: |-
          drainable reports whether the drain closes the open connection c now: no
          partial input, and either it has sent something — its request was read —
          or it stayed silent for drainQuiet.
        name: drainable
        params: c *connCtl
        recv: r *ring
        results: bool
      - doc: publish copies the ring's counters to its atomics, those that moved.
        name: publish
        recv: r *ring
    name: ring
  - doc: |-
      seen is what a ring last published. A counter is stored to its atomic only
      when it moved: an atomic store is a full barrier, a counter that did not move
      in a batch (most of them, in most batches) is not worth one, and the
      batch's cost does not grow with the counters State reads (#975).
    fields:
      - name: ""
        role: embedded
        type: ringCounters
      - name: conns
        type: int64
      - name: draining
        type: bool
    kind: struct
    name: seen
  - doc: ringCounters are a ring's counters as its thread keeps them, plain.
    fields:
      - name: accepted
        type: uint64
      - name: closed
        type: uint64
      - name: batches
        type: uint64
      - name: completions
        type: uint64
      - name: starved
        type: uint64
      - name: retries
        type: uint64
      - name: pauses
        type: uint64
      - name: evicted
        type: uint64
      - name: watchdog
        type: uint64
      - name: cut
        type: uint64
      - doc: |-
          bytesIn and bytesOut count the bytes delivered to the handler and sent;
          outRefused the Writes refused with LoopOutputFull; spillClosed,
          timeouts and idleClosed the closes for rSpill and rIdle and the
          deadlines fired (#975).
        name: bytesIn
        type: uint64
      - doc: |-
          bytesIn and bytesOut count the bytes delivered to the handler and sent;
          outRefused the Writes refused with LoopOutputFull; spillClosed,
          timeouts and idleClosed the closes for rSpill and rIdle and the
          deadlines fired (#975).
        name: bytesOut
        type: uint64
      - doc: |-
          bytesIn and bytesOut count the bytes delivered to the handler and sent;
          outRefused the Writes refused with LoopOutputFull; spillClosed,
          timeouts and idleClosed the closes for rSpill and rIdle and the
          deadlines fired (#975).
        name: outRefused
        type: uint64
      - name: spillClosed
        type: uint64
      - name: timeouts
        type: uint64
      - name: idleClosed
        type: uint64
      - doc: |-
          pending is the bytes written and not yet sent: Write adds, a send
          subtracts, and a close or a release subtracts what the slot still held.
        name: pending
        type: int64
    kind: struct
    name: ringCounters
  - doc: |-
      ringStats are a ring's counters as State reads them, published at the
      end of each batch.
    fields:
      - name: conns
        type: atomic.Int64
      - name: accepted
        type: atomic.Uint64
      - name: closed
        type: atomic.Uint64
      - name: batches
        type: atomic.Uint64
      - name: completions
        type: atomic.Uint64
      - name: starved
        type: atomic.Uint64
      - name: retries
        type: atomic.Uint64
      - name: pauses
        type: atomic.Uint64
      - name: evicted
        type: atomic.Uint64
      - name: watchdog
        type: atomic.Uint64
      - name: cut
        type: atomic.Uint64
      - name: bytesIn
        type: atomic.Uint64
      - name: bytesOut
        type: atomic.Uint64
      - name: outRefused
        type: atomic.Uint64
      - name: spillClosed
        type: atomic.Uint64
      - name: timeouts
        type: atomic.Uint64
      - name: idleClosed
        type: atomic.Uint64
      - name: pending
        type: atomic.Int64
      - name: draining
        type: atomic.Bool
    kind: struct
    name: ringStats
  - doc: |-
      loop is one loop: a thread, its rings, its slab, and the LoopIO its
      handler is called with. Everything but post is touched by the loop's
      thread alone.
    fields:
      - doc: index is the loop's place in its group.
        name: index
        type: int
      - doc: |-
          cpu is the CPU LoopValue.Affinity pins the loop's thread to, -1 for
          none; pinErr is the kernel's refusal, set on the loop's thread before it
          reports ready (#857).
        name: cpu
        type: int
      - name: pinErr
        type: error
      - doc: tid is the loop's thread, set as pin runs on it.
        name: tid
        type: int
      - doc: shrunkAt is the tick the slab last shrank at (#809).
        name: shrunkAt
        type: int64
      - doc: |-
          sz is the group's resolved configuration; idle its idle bound in
          ticks, zero for none; evictIdle the idle age eviction waits for.
        name: sz
        type: sizing
      - name: idle
        type: int64
      - name: evictIdle
        type: int64
      - doc: h is the handler.
        name: h
        type: corenet.LoopHandler
      - doc: drainer is h as a LoopDrainer, nil when it is not one.
        name: drainer
        type: corenet.LoopDrainer
      - doc: busy is Config.Busy, nil when nothing offloads.
        name: busy
        type: func(lane int, ref corenet.LoopConnRef) bool
      - doc: grp is what the group's loops share.
        name: grp
        type: "*shared"
      - doc: rings are the loop's rings.
        name: rings
        type: "[]*ring"
      - doc: slab holds every spill and output byte of the loop.
        name: slab
        type: "*slab"
      - doc: |-
          slabInUse and slabMapped are the slab's gauges as State reads them,
          published at the end of each batch.
        name: slabInUse
        type: atomic.Int64
      - doc: |-
          slabInUse and slabMapped are the slab's gauges as State reads them,
          published at the end of each batch.
        name: slabMapped
        type: atomic.Int64
      - doc: seenInUse and seenMapped are what they last held.
        name: seenInUse
        type: int64
      - doc: seenInUse and seenMapped are what they last held.
        name: seenMapped
        type: int64
      - doc: post is the loop's queue of posted operations.
        name: post
        type: "*postQueue"
      - doc: |-
          deferred are chunks released once OnBatchEnd has returned, since a
          buffer handed to OnData stays valid until then.
        name: deferred
        type: "[]chunkRef"
      - doc: tick is the loop's clock, in ticks since start.
        name: tick
        type: int64
      - name: epoch
        type: time.Time
      - doc: |-
          threadOK reports whether the caller runs on the loop's thread; nil when
          the check is not compiled (the loopdebug build tag).
        name: threadOK
        type: func() bool
      - doc: draining refuses new connections and closes idle ones.
        name: draining
        type: bool
      - doc: "hard is the loop's hard pressure: out of descriptors, or at MaxConns."
        name: hard
        type: bool
      - doc: lowWater is the output mark under which OnWritable fires.
        name: lowWater
        type: int
      - doc: |-
          started is when the running batch started, ended when the last one
          ended, yielded when the loop last yielded to the scheduler (sz.yield):
          each on the monotonic clock since epoch, one read a batch's end and one
          its start (begin).
        name: started
        type: time.Duration
      - name: ended
        type: time.Duration
      - name: yielded
        type: time.Duration
    kind: struct
    methods:
      - doc: |-
          pin pins the loop's locked thread to its CPU, when Affinity names one
          (#857), and keeps the kernel's refusal for the report: a loop the kernel
          refuses serves unpinned. It runs on the loop's thread, after LockOSThread
          and before the loop reports ready.
        name: pin
        recv: lp *loop
      - doc: |-
          evictable reports whether slot of r may be evicted: open, with nothing
          unconsumed, unsent or unread, and no answer out with a worker.
        name: evictable
        params: r *ring, slot int32
        recv: lp *loop
        results: bool
      - doc: waits reports whether slot of r waits on the handler's worker (R3).
        name: waits
        params: r *ring, slot int32
        recv: lp *loop
        results: bool
      - doc: "begin starts a batch: the clock read once, the tick derived from it."
        name: begin
        recv: lp *loop
      - doc: |-
          shrinkSlab lets the slab give back, once a tick, what a burst left idle
          (#809).
        name: shrinkSlab
        recv: lp *loop
      - doc: |-
          overBudget reports whether the batch has run for sz.batchBudget, never
          without one: one read of the monotonic clock (ADR 0206).
        name: overBudget
        recv: lp *loop
        results: bool
      - doc: |-
          endBatch runs once OnBatchEnd has returned: flushes, releases the chunks the
          batch held, compacts spills, and publishes the counters.
        name: endBatch
        recv: lp *loop
      - doc: |-
          yield hands the loop's thread back to the Go scheduler once sz.yield has
          passed since the last time, at the very end of a batch (ADR 0199). A loop
          locked to its thread never goes through the scheduler on its own: its P's
          schedtick never moves, so sysmon preempts it every 10 ms and retakes its P
          in the middle of a wait. It reports whether it yielded.
        name: yield
        recv: lp *loop
        results: bool
      - doc: lookup resolves ref to its ring and slot, or reports it stale.
        name: lookup
        params: ref corenet.LoopConnRef
        recv: lp *loop
        results: "*ring, int32, bool"
      - doc: "Write implements corenet.LoopIO: it copies p into ref's output."
        name: Write
        params: ref corenet.LoopConnRef, p []byte
        recv: lp *loop
        results: error
      - doc: |-
          queue copies p into slot's output, which the caller checked may hold it,
          and reports false when the slab's budget is spent.
        name: queue
        params: r *ring, slot int32, c *connCtl, p []byte
        recv: lp *loop
        results: bool
      - doc: |-
          growOut moves c's unsent output to a chunk with room for n more bytes. The
          output is never what the kernel reads, so it may move; the flight never.
        name: growOut
        params: c *connCtl, n int
        recv: lp *loop
        results: bool
      - doc: |-
          Close implements corenet.LoopIO: the connection closes once its output has
          left.
        name: Close
        params: ref corenet.LoopConnRef
        recv: lp *loop
        results: error
      - doc: SetDeadline implements corenet.LoopIO, on the loop's timer wheel.
        name: SetDeadline
        params: ref corenet.LoopConnRef, d time.Duration
        recv: lp *loop
        results: error
      - doc: Pressure implements corenet.LoopIO.
        name: Pressure
        params: ref corenet.LoopConnRef
        recv: lp *loop
        results: bool
      - doc: "Post implements corenet.LoopIO: the one call any goroutine may make."
        name: Post
        params: op corenet.PostFunc, arg uintptr
        recv: lp *loop
        results: error
      - doc: |-
          Peer implements corenet.LoopPeer (ADR 0148, #974): who is on the other side
          of a Unix connection, as SO_PEERCRED recorded it. It answers false for a TCP
          connection, a stale ref, a connection whose descriptor the backend holds in
          a ring's table — a direct descriptor has no process descriptor to ask — and
          off the loop's thread, under loopdebug.
        name: Peer
        params: ref corenet.LoopConnRef
        recv: lp *loop
        results: corenet.LoopPeerValue, bool
      - doc: |-
          Loop implements corenet.LoopIO: the loop's index in its group, set at build
          and never written again, so any goroutine may read it.
        name: Loop
        recv: lp *loop
        results: int
      - doc: |-
          WriteFile implements corenet.LoopFileWriter: head, then the file's Len bytes
          from Off, queued behind the output. The descriptor is duplicated first, so
          the caller's own may close at once, and the duplicate stays the engine's until the file is
          done or the slot's last operation is over: a descriptor named in a queued
          SQE, or in the kernel's, cannot have been recycled under it. A file of the
          head alone is a Write.
        name: WriteFile
        params: ref corenet.LoopConnRef, head []byte, file corenet.LoopFileSpanValue
        recv: lp *loop
        results: error
      - doc: |-
          closeSettled starts the drain's close of every connection of r the drain
          may close (drainable) that has no answer out with a worker (R3): each
          closes once its output has left; mid-request ones, and ones waiting on a
          worker, finish first.
        name: closeSettled
        params: r *ring
        recv: lp *loop
    name: loop
  - doc: |-
      peerer is the optional side of a driver that can name a connection's
      peer: the backends whose slot holds a process descriptor to ask.
    kind: named
    name: peerer
    underlying: |-
      interface {
      	// peer returns the credentials of slot's peer, false when slot is not a
      	// Unix connection or its descriptor cannot be asked.
      	peer(r *ring, slot int32) (corenet.LoopPeerValue, bool)
      }
  - doc: |-
      fileSender is the optional side of a driver that sends a file's bytes from
      the kernel. Both native backends implement it; a platform without one has
      no driver at all, and LoopFileWriter refuses.
    kind: named
    name: fileSender
    underlying: |-
      interface {
      	// beginFile takes what sending a file on slot needs — a duplicate of fd, a
      	// pipe — and records it in the slot; a refusal leaves the slot untouched.
      	beginFile(r *ring, slot int32, fd int) error
      	// endFile releases what beginFile took, the file done or the slot's last
      	// operation over: nothing of it is left in the kernel.
      	endFile(r *ring, slot int32)
      }
  - doc: |-
      listenerSet is a group's listeners as its loops share them through the
      drain (plan P6). Each taker — a loop on epoll, a ring on io_uring — takes
      its share of a listener's queue once its own accepts are over, then hands
      the listener back; the last one closes it, so the listener closes before
      the established connections drain, and never while a taker may still
      accept on it. Whatever no taker closed — a group stopped, not drained —
      closes once every loop returned.
    fields:
      - doc: fds are the listeners, in the order of Config.Listeners.
        name: fds
        type: "[]int"
      - doc: left is how many takers have still to hand each listener back.
        name: left
        type: "[]atomic.Int32"
      - doc: |-
          closed is set once a listener is closed, by its last taker or by
          closeRest.
        name: closed
        type: "[]atomic.Bool"
      - doc: |-
          accepts counts each listener's accepted connections, every taker
          together: io_uring's watchdog reads in it that a listener's queue
          moves, whichever ring took the connections (ADR 0200 §D1).
        name: accepts
        type: "[]atomic.Uint64"
    kind: struct
    methods:
      - doc: |-
          handBack hands listener i back: its taker will accept on it no more. The
          last taker closes it.
        name: handBack
        params: i int
        recv: ls *listenerSet
      - doc: accepted counts a connection accepted on listener i.
        name: accepted
        params: i int
        recv: ls *listenerSet
      - doc: |-
          acceptsOf is how many connections listener i gave so far, every taker
          together.
        name: acceptsOf
        params: i int
        recv: ls *listenerSet
        results: uint64
      - doc: closeRest closes every listener no taker closed.
        name: closeRest
        recv: ls *listenerSet
      - doc: close closes listener i once.
        name: close
        params: i int
        recv: ls *listenerSet
    name: listenerSet
  - doc: epollRunner runs one epoll loop per thread.
    fields:
      - name: loops
        type: "[]*epollLoop"
      - name: wg
        type: sync.WaitGroup
      - name: fin
        type: chan struct{}
      - doc: |-
          lfds are the group's listeners; set shares them through the drain,
          and closes what the drain did not once every loop returned.
        name: lfds
        type: "[]int"
      - name: set
        type: "*listenerSet"
    kind: struct
    methods:
      - doc: drain implements runner.
        name: drain
        recv: er *epollRunner
      - doc: stop implements runner.
        name: stop
        recv: er *epollRunner
      - doc: wait implements runner.
        name: wait
        recv: er *epollRunner
      - doc: done implements runner.
        name: done
        recv: er *epollRunner
        results: <-chan struct{}
    name: epollRunner
  - doc: "epollLoop is one loop on epoll: one ring, one epoll instance, one thread."
    fields:
      - name: lp
        type: "*loop"
      - name: r
        type: "*ring"
      - name: epfd
        type: int
      - name: evfd
        type: int
      - doc: |-
          lfds are the listeners, shared with the group's other loops; owners
          says which of them this loop accepts on (a SO_REUSEPORT shard belongs
          to one loop, #856); set is the group's hold on them through the drain.
        name: lfds
        type: "[]int"
      - name: owners
        type: "[]int"
      - name: set
        type: "*listenerSet"
      - doc: |-
          queueDone is, per listener, that the loop took its queue as the group
          drains and handed it back; taken how many connections it took from it.
        name: queueDone
        type: "[]bool"
      - name: taken
        type: "[]int"
      - doc: |-
          armed reports whether the listeners are in the epoll set; rearmAt is
          the tick an EMFILE backoff ends at, backoff its current length.
        name: armed
        type: bool
      - name: rearmAt
        type: int64
      - name: backoff
        type: int64
      - doc: events receives one epoll_wait.
        name: events
        type: "[]syscall.EpollEvent"
      - doc: arena is the read arena; off how much of it this batch used.
        name: arena
        type: "[]byte"
      - name: "off"
        type: int
      - doc: drainReq and stopReq are the group's requests, set from any goroutine.
        name: drainReq
        type: atomic.Bool
      - name: stopReq
        type: atomic.Bool
      - doc: tid is the loop's thread, for the loopdebug check.
        name: tid
        type: int
      - doc: |-
          wakeMu orders a wake against the eventfd's close: a Post or a request
          that lands as the loop stops must never write a descriptor number the
          process has reused since.
        name: wakeMu
        type: sync.Mutex
      - doc: evClosed is set once the eventfd is closed.
        name: evClosed
        type: bool
      - doc: |-
          excl is EPOLLEXCLUSIVE when the group registers its listeners with it,
          zero when the operator switched it off or the kernel lacks it.
        name: excl
        type: uint32
      - doc: busy is busy-poll on this loop's instance (#979).
        name: busy
        type: epollBusy
    kind: struct
    methods:
      - doc: wake writes the loop's eventfd. It is safe from any goroutine.
        name: wake
        recv: el *epollLoop
      - doc: |-
          setup builds the loop's epoll instance, eventfd, arena and ring on its own
          thread.
        name: setup
        recv: el *epollLoop
        results: error
      - doc: ctl adds or modifies fd in the epoll set, tagging the event with tag and gen.
        name: ctl
        params: op, fd int, events uint32, tag int32, gen uint32
