  - doc: The operations a CQE's user_data names, in its top byte.
    grouped: true
    items:
      - name: udRecv
        type: uint64
        value: iota + 1
      - name: udSend
      - name: udCancel
      - name: udClose
      - name: udAccept
      - name: udWake
      - name: udFan
      - name: udAcceptCancel
      - name: udOrphanClose
      - name: udShutdown
    name: udRecv
  - grouped: true
    items:
      - doc: |-
          acceptDepth is how many single-shot accepts a ring keeps in flight per
          listener.
        name: acceptDepth
        type: int
        value: "32"
      - doc: |-
          acceptReserve is the free direct-descriptor entries a ring keeps: under
          it the ring stops accepting, and it resumes at twice as many.
        name: acceptReserve
        type: int
        value: "16"
      - doc: starvedCap bounds the connections waiting for a provided buffer.
        name: starvedCap
        type: int
        value: "65536"
      - doc: |-
          reapRounds bounds the CQ batches one ring reaps per iteration, so one
          ring cannot starve the others forever.
        name: reapRounds
        type: int
        value: "4"
      - doc: |-
          staleFill is the byte a provided buffer is overwritten with under the
          fill hook: a stale byte read back shows as it.
        name: staleFill
        type: byte
        value: "0xAA"
      - doc: |-
          maxProcessFDs bounds slotOf on process descriptors, whatever
          RLIMIT_NOFILE says.
        name: maxProcessFDs
        type: uint64
        value: 1 << 22
      - doc: genMask keeps the 24 bits of a generation user_data carries.
        name: genMask
        type: uint32
        value: 1<<24 - 1
      - doc: |-
          sweepCloses is the fewest closes since the last sweep started that
          start the next one on a ring whose closes put their files late
          (uRing.sweep); a quarter of the table when that is more.
        name: sweepCloses
        type: uint64
        value: "8192"
      - doc: |-
          sweepEvery is how many ticks after the last sweep the next one starts,
          whatever the closes, once at least one happened.
        name: sweepEvery
        type: int64
        value: "1000"
      - doc: sweepScan is the fewest slots a sweep walks per tick.
        name: sweepScan
        type: int
        value: "128"
      - doc: |-
          sweepTicks is the most ticks a pass takes, so a large table is walked
          in a second.
        name: sweepTicks
        type: int
        value: "100"
      - doc: noEpoch marks a slot with no recv armed.
        name: noEpoch
        type: uint64
        value: 1<<64 - 1
    name: acceptDepth
  - doc: |-
      peerPeekBytes is the release check's read buffer: any read will do, the
      check only waits for the end of the stream.
    items:
      - name: peerPeekBytes
        type: int
        value: "64"
    name: peerPeekBytes
  - grouped: true
    items:
      - doc: |-
          uringEntries is a serving ring's SQ size; CLAMP lets the kernel lower
          it, and the size it grants is read back from the params. A ring's SQ and
          CQ are charged to RLIMIT_MEMLOCK for a process without CAP_IPC_LOCK
          (an 8 MiB default on most distributions), so they are sized to keep a
          few rings within it rather than to the largest burst: a full SQ submits
          inline, a full CQ overflows into the kernel's list (NODROP).
        name: uringEntries
        type: uint32
        value: "1024"
      - doc: probeEntries sizes the probe's short-lived rings.
        name: probeEntries
        type: uint32
        value: "16"
      - doc: cqFactor is how many times uringEntries CQSIZE asks for the CQ.
        name: cqFactor
        type: uint32
        value: "4"
      - doc: bufGroup is the provided-buffer group every recv selects from.
        name: bufGroup
        type: uint16
        value: "1"
      - doc: defaultBufs is how many provided buffers a ring has.
        name: defaultBufs
        type: uint32
        value: "4096"
      - doc: defaultBufSize is the size of one provided buffer, in bytes.
        name: defaultBufSize
        type: uint32
        value: "4096"
      - doc: enterRetries bounds the retries of a busy submit.
        name: enterRetries
        type: int
        value: "8"
    name: uringEntries
  - grouped: true
    items:
      - doc: |-
          tickEvery is the timer wheel's resolution: a deadline fires no earlier
          than asked and at most one tick late.
        name: tickEvery
        type: time.Duration
        value: 10 * time.Millisecond
      - doc: |-
          wheelSlots is the wheel's circumference, a power of two; a deadline
          further than wheelSlots ticks away waits in its bucket for its round.
        name: wheelSlots
        type: int64
        value: "1024"
      - doc: noLink ends a bucket list.
        name: noLink
        type: int32
        value: "-1"
    name: tickEvery
