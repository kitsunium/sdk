        name: Disabled
        type: "[]corenet.Capability"
      - doc: |-
          DisabledBy says how they were switched off in State; empty is
          KITSUNIUM_NET_DISABLE.
        name: DisabledBy
        type: string
      - doc: |-
          LoopsSource is where Value.Loops came from, for State, when server
          resolved it already: LoopsAuto read as GOMAXPROCS is "auto". Empty lets
          the group say it itself.
        name: LoopsSource
        type: string
      - doc: |-
          Memory is the soft-memory-limit derivation server read (memlimit.Derive):
          its Allowance, when one was found, sizes a slab budget LoopValue leaves
          at zero (#809). The zero value derives nothing.
        name: Memory
        type: coreproc.MemoryLimitValue
      - doc: |-
          tableCap, when positive, caps every ring's table below the descriptor
          limit: the conformance suite's tiny slot table.
        name: tableCap
        type: int
      - doc: hooks are the conformance suite's other fault injections.
        name: hooks
        type: loopHooks
    kind: struct
    name: Config
  - doc: |-
      loopHooks are the conformance suite's fault injections; zero in
      production.
    fields:
      - doc: "bufs and bufSize override io_uring's provided buffers: a two-entry ring."
        name: bufs
