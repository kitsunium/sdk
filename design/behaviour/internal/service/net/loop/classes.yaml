  - doc: |-
      The setup flags every ring may carry: the floor every kernel the backend
      serves accepts, and SINGLE_ISSUER, which 6.0 added.
    grouped: true
    items:
      - doc: setupBase is what a ring carries whatever the probe finds.
        name: setupBase
        type: uint32
        value: setupCoopTaskrun | setupSubmitAll
      - doc: |-
          rewindFirst and rewindSecond are the user_data of SQ_REWIND's two
          self-test NOPs: the order they complete in is the contract.
        name: rewindFirst
        type: uint64
        value: "0xA1"
      - name: rewindSecond
        type: uint64
        value: "0xA2"
    name: setupBase
  - grouped: true
    items:
      - doc: |-
          fanWakeTick bounds the primary's plain wait of a loop with secondary
          rings on a kernel whose wake is slow (#703): the extra latency of a
          secondary's exchange is bounded by it instead of by tickEvery.
        name: fanWakeTick
        type: time.Duration
        value: time.Millisecond
      - doc: |-
          fanWakeDelay is how long after the primary's wait starts the probe's
          writer writes.
        name: fanWakeDelay
        type: time.Duration
        value: 2 * time.Millisecond
      - doc: fanWakeBound is the probe's longest wait.
        name: fanWakeBound
        type: time.Duration
        value: 50 * time.Millisecond
      - doc: |-
          fanWakeSlow is the delay past which the wake counts as slow: half the
          tick, which a prompt wake (tens of microseconds) never nears.
        name: fanWakeSlow
        type: time.Duration
        value: tickEvery / 2
