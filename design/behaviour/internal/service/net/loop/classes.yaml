        type: uint64
        value: 1 << 22
      - doc: genMask keeps the 24 bits of a generation user_data carries.
        name: genMask
        type: uint32
        value: 1<<24 - 1
      - doc: |-
          sweepCloses is the fewest closes since the last sweep started that
          start the next one on a ring whose closes put their files late
          (uRing.sweep); a quarter of the table when that is more.
        name: sweepCloses
        type: uint64
        value: "8192"
      - doc: |-
          sweepEvery is how many ticks after the last sweep the next one starts,
          whatever the closes, once at least one happened.
        name: sweepEvery
        type: int64
        value: "1000"
      - doc: sweepScan is the fewest slots a sweep walks per tick.
        name: sweepScan
        type: int
        value: "128"
      - doc: |-
          sweepTicks is the most ticks a pass takes, so a large table is walked
          in a second.
        name: sweepTicks
        type: int
        value: "100"
      - doc: noEpoch marks a slot with no recv armed.
        name: noEpoch
        type: uint64
        value: 1<<64 - 1
      - doc: |-
          closeBackstopTicks is how long a closed slot may wait on an operation
          after its shutdown was issued before closeBackstop cancels it.
        name: closeBackstopTicks
        type: int64
        value: "100"
      - doc: |-
          ulSplice is uLoop.features' bit for IORING_OP_SPLICE (5.7): WriteFile is
          refused without it, and the codec falls back to its copy path.
        name: ulSplice
        type: uint8
        value: 1 << 0
      - doc: |-
          fileStepBytes bounds a file step, the pipe's capacity by default: each is
          one splice in and one splice out, chained.
        name: fileStepBytes
        type: int64
        value: 64 << 10
      - doc: |-
          budgetChunk is how many completions a ring reaps between two looks at
          the clock while LoopValue.BatchBudget bounds the batch (ADR 0206): a
          clock read each, at a few dozen nanoseconds, against a few
          microseconds of serving a completion.
        name: budgetChunk
        type: int
        value: "16"
      - doc: |-
          closingCompact is the fewest looked-at closes compactClosing moves
          out of a queue that never empties.
        name: closingCompact
        type: int
        value: "1024"
      - doc: |-
          loopBufBudget bounds the bytes of provided buffers one loop hands its
          rings' kernels, every ring together: resident once the kernel wrote
          them, never taken back (ADR 0203 §D2).
        name: loopBufBudget
        type: uint64
        value: 128 << 20
      - doc: |-
          groupSlack is how many buffers of a group are kept beyond the recvs
          armed on it. A multishot recv that received tries again at once, and
          that try takes a buffer from the ring and recycles it on EAGAIN, or
          fails the recv with ENOBUFS on an empty ring (io_recv, io_recv_finish,
          io_uring/net.c, 6.12 to 7.0): a group with exactly a buffer a recv
          ends its every burst with spurious ENOBUFS, each a completion and a
          re-arm (ADR 0203 §D2).
        name: groupSlack
        type: int
        value: "32"
      - doc: |-
          fillFull is uRing.fill's bit for a ring near its table's end, or
          passed over, so the ring after it accepts too.
        name: fillFull
        type: uint8
        value: "1"
      - doc: |-
          fillClosed is uRing.fill's bit for a ring a ring before it keeps from
          accepting: one of them is not full.
        name: fillClosed
        type: uint8
        value: "2"
      - doc: |-
          fillShare is the share of its table, as a divisor, a ring may still
          have free when the next ring starts accepting (uRing.fillStep): an
          eighth, so the next ring's accepts are armed well before this one
          pauses under its reserve (ADR 0203 §D1).
        name: fillShare
        type: int
        value: "8"
    name: acceptDepth
  - doc: |-
      The socket command a direct descriptor's peer is read with (#974), declared
      in-tree for the same reason as the rest of the ABI (ADR 0018): Linux
      include/uapi/linux/io_uring.h, 6.7.
    grouped: true
    items:
      - doc: |-
          opURingCmd is IORING_OP_URING_CMD (5.19): a command of the file's own
          driver, a socket's since 6.7.
        name: opURingCmd
        type: uint8
        value: "46"
      - doc: |-
          sockOpGetsockopt is SOCKET_URING_OP_GETSOCKOPT (6.7): getsockopt on the
          command's socket, SOL_SOCKET only, its result the option's length.
        name: sockOpGetsockopt
        type: uint32
        value: "2"
      - doc: "ucredLen is sizeof(struct ucred): what a SO_PEERCRED read returns."
        name: ucredLen
        type: int32
        value: int32(unsafe.Sizeof(syscall.Ucred{}))
      - doc: |-
          opFilesUpdate is IORING_OP_FILES_UPDATE (5.6): with its offset
          fileIndexAlloc (5.19) it installs process descriptors into the direct
          table, at free entries the kernel picks and writes back.
        name: opFilesUpdate
        type: uint8
        value: "20"
    name: opURingCmd
  - doc: |-
      peerPeekBytes is the release check's read buffer: any read will do, the
      check only waits for the end of the stream.
    items:
      - name: peerPeekBytes
        type: int
        value: "64"
    name: peerPeekBytes
  - grouped: true
    items:
      - doc: |-
          uringEntries is a serving ring's SQ size; CLAMP lets the kernel lower
          it, and the size it grants is read back from the params. A ring's SQ and
          CQ are charged to RLIMIT_MEMLOCK for a process without CAP_IPC_LOCK
          (an 8 MiB default on most distributions), so they are sized to keep a
          few rings within it rather than to the largest burst: a full SQ submits
          inline, a full CQ overflows into the kernel's list (NODROP).
        name: uringEntries
        type: uint32
        value: "1024"
      - doc: probeEntries sizes the probe's short-lived rings.
        name: probeEntries
        type: uint32
        value: "16"
      - doc: cqFactor is how many times uringEntries CQSIZE asks for the CQ.
        name: cqFactor
        type: uint32
        value: "4"
      - doc: |-
          bufGroup is the first provided-buffer group a recv selects from; a
          ring's group g is bufGroup+g.
        name: bufGroup
        type: uint16
        value: "1"
      - doc: |-
          defaultBufs is the fewest provided buffers a ring may hand the kernel,
          and the entries of each of its buffer rings. They are mapped at setup
          and handed out as the ring needs them (uRing.provide): an untouched
          buffer is no resident memory, so a ring's buffers cost the most it
          ever had out at once, not its count (ADR 0201 §D1).
        name: defaultBufs
        type: uint32
        value: "8192"
      - doc: |-
          maxBufs is the most provided buffers a ring may hand the kernel: a
          bid is 16 bits. A ring may have as many as its table holds
          connections, a power of two, in groups of defaultBufs registered as
          they are first needed (ADR 0203 §D2).
        name: maxBufs
        type: uint32
        value: 1 << 16
      - doc: |-
          defaultBufSize is the size of one provided buffer, in bytes: an HTTP
          request of a keep-alive connection fits in one; a larger one arrives
          over several completions, as a split read always could.
        name: defaultBufSize
        type: uint32
        value: "2048"
      - doc: bufsFirst is how many buffers a ring hands the kernel at setup.
        name: bufsFirst
        type: uint32
        value: "512"
      - doc: bufsStep is the fewest more it hands each time it runs short.
        name: bufsStep
        type: uint32
        value: "512"
      - doc: enterRetries bounds the retries of a busy submit.
        name: enterRetries
        type: int
        value: "8"
    name: uringEntries
  - grouped: true
    items:
      - doc: |-
          sendZCProbeWait bounds each of the probe's two waits: its send's CQE,
          then its notification.
        name: sendZCProbeWait
        type: time.Duration
        value: 200 * time.Millisecond
      - doc: sendZCProbeTries bounds the probe's waits for its two CQEs.
        name: sendZCProbeTries
        type: int
        value: "4"
      - doc: |-
          sendZCProbeCQEs is the most CQEs one of its reaps takes: the send's
          and the notification.
        name: sendZCProbeCQEs
        type: int
        value: "2"
    name: sendZCProbeWait
  - grouped: true
    items:
      - doc: |-
          tickEvery is the timer wheel's resolution: a deadline fires no earlier
          than asked and at most one tick late.
        name: tickEvery
        type: time.Duration
        value: 10 * time.Millisecond
      - doc: |-
          wheelSlots is the wheel's circumference, a power of two; a deadline
          further than wheelSlots ticks away waits in its bucket for its round.
        name: wheelSlots
        type: int64
        value: "1024"
      - doc: noLink ends a bucket list.
        name: noLink
        type: int32
        value: "-1"
    name: tickEvery
  - doc: |-
      uring-zcrx's area and its probe's reasons (#980, ADR 0189 amended
      2026-11-11).
    grouped: true
    items:
      - doc: |-
          defaultZCRXArea is the area LoopValue.ZCRX takes when AreaBytes is
          zero.
        name: defaultZCRXArea
        type: int
        value: 4 << 20
      - doc: reasonZCRXKernel is the row's reason on a kernel without the opcode.
        name: reasonZCRXKernel
        type: string
        value: "\"kernel: IORING_OP_RECV_ZC unsupported (before 6.15); \" + reasonClassB"
      - doc: |-
          reasonZCRXNone is the row's reason when the kernel has it and no
          interface is named.
        name: reasonZCRXNone
        type: string
        value: "\"available: no interface configured; \" + reasonClassB"
    name: defaultZCRXArea
  - doc: |-
      The zero-copy receive ABI (include/uapi/linux/io_uring.h, Linux 6.15),
      in-tree as the rest of it (ADR 0018). Only the probe issues any of it: no
      RECV_ZC is ever submitted while uring-zcrx is class B.
    grouped: true
    items:
      - doc: opRecvZC is IORING_OP_RECV_ZC.
        name: opRecvZC
        type: uint8
        value: "58"
      - doc: regZCRXIfq is IORING_REGISTER_ZCRX_IFQ.
        name: regZCRXIfq
        type: uintptr
        value: "32"
      - doc: |-
          setupCQE32 is IORING_SETUP_CQE32 (5.19): a RECV_ZC completion carries
          struct io_uring_zcrx_cqe in a CQE's second 16 bytes.
        name: setupCQE32
        type: uint32
        value: 1 << 11
      - doc: |-
          zcrxAreaShift is IORING_ZCRX_AREA_SHIFT: a completion's offset names
          its area above it.
        name: zcrxAreaShift
        type: uint64
        value: "48"
      - doc: |-
          memRegionTypeUser is IORING_MEM_REGION_TYPE_USER: the refill ring's
          region is memory the loop mapped.
        name: memRegionTypeUser
        type: uint32
        value: "1"
      - doc: |-
          zcrxRQEntries is the refill ring the probe asks for; with its header
          of two cache lines it fits one page.
        name: zcrxRQEntries
        type: uint32
        value: "128"
      - doc: |-
          zcrxRingHeader is struct io_uring's size, the refill ring's head and
          tail on cache lines of their own, which the region holds before the
          entries (io_allocate_rbuf_ring).
        name: zcrxRingHeader
        type: uintptr
        value: "128"
    name: opRecvZC
