  - doc: |-
      chunkRef names one chunk of the slab by size class and index, and how
      much of it is used. It holds no pointer, so the connection table that
      carries it stays pointer-free (ADR 0186 §D7).
    fields:
      - doc: idx is the chunk's index in its class, noChunk when none.
        name: idx
        type: int32
      - doc: cls is the size class.
        name: cls
        type: uint8
      - doc: off is the first byte still meaningful; len the end of the data.
        name: "off"
        type: int32
      - name: len
        type: int32
    kind: struct
    methods:
      - doc: empty reports whether the ref holds no chunk.
        name: empty
        recv: c chunkRef
        results: bool
    name: chunkRef
  - doc: |-
      slab is a loop's shared store of payload memory, cut into power-of-two
      size classes and mapped outside the Go heap (ADR 0186 §D7): what the
      kernel reads or writes never moves, and the collector scans none of it.
      It belongs to one loop, so it takes no lock.
    fields:
      - doc: classes holds each class's arenas and free chunks, smallest first.
        name: classes
        type: "[]slabClass"
      - doc: inUse is the bytes handed out; budget its ceiling.
        name: inUse
        type: int
      - name: budget
        type: int
      - doc: mapper maps a new arena; the platform's mmap, a heap slice elsewhere.
        name: mapper
        type: func(n int) ([]byte, error)
      - doc: mapped is every mapping, for release.
        name: mapped
        type: "[][]byte"
    kind: struct
    methods:
      - doc: |-
          alloc returns a chunk holding at least n bytes, or false when n passes the
          largest class, the budget, or the mapping fails.
        name: alloc
        params: n int
        recv: s *slab
        results: chunkRef, bool
      - doc: grow maps one arena for c and pushes its chunks on the free stack.
        name: grow
        params: c *slabClass
        recv: s *slab
        results: bool
      - doc: free returns the chunk to its class. A ref that holds nothing is ignored.
        name: free
        params: r chunkRef
        recv: s *slab
      - doc: bytes returns the whole chunk r names.
        name: bytes
        params: r chunkRef
        recv: s *slab
        results: "[]byte"
      - doc: data returns the meaningful bytes of r, off to len.
        name: data
        params: r chunkRef
        recv: s *slab
        results: "[]byte"
      - doc: size returns the capacity of r's chunk.
        name: size
        params: r chunkRef
        recv: s *slab
        results: int
    name: slab
  - doc: slabClass is one size class.
    fields:
      - doc: size is the chunk size; perArena how many chunks one arena holds.
        name: size
        type: int
      - name: perArena
        type: int
      - doc: arenas are the class's mappings, in index order.
        name: arenas
        type: "[][]byte"
      - doc: free is a stack of free chunk indexes.
        name: free
        type: "[]int32"
    kind: struct
    name: slabClass
