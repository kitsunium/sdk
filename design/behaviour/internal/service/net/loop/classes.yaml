        name: setup
        recv: el *epollLoop
        results: error
      - doc: ctl adds or modifies fd in the epoll set, tagging the event with tag and gen.
        name: ctl
        params: op, fd int, events uint32, tag int32, gen uint32
        recv: el *epollLoop
        results: error
      - doc: |-
          armListeners puts every listener in the epoll set, one loop woken per
          connection.
        name: armListeners
        recv: el *epollLoop
      - doc: disarmListeners takes every listener out of the epoll set.
        name: disarmListeners
        recv: el *epollLoop
      - doc: run is the loop's thread.
        name: run
        params: wg *sync.WaitGroup, ready chan<- error
        recv: el *epollLoop
      - doc: |-
          wait blocks for the next batch of events, a tick at most while anything is
          timed.
        name: wait
        recv: el *epollLoop
        results: int
      - doc: handle dispatches n events.
        name: handle
        params: n int
        recv: el *epollLoop
      - doc: drainWake reads the eventfd's counter and runs the posted operations.
        name: drainWake
        recv: el *epollLoop
      - doc: accept takes up to epollAcceptBurst connections from lfd.
        name: accept
        params: lfd int
        recv: el *epollLoop
      - doc: |-
          acceptFailed handles an accept4 failure and reports whether it ends the
          burst.
        name: acceptFailed
        params: err error
        recv: el *epollLoop
        results: bool
      - doc: |-
          admit registers the accepted descriptor nfd on the ring, or closes it:
          MaxConns and a full table refuse. A draining loop admits too: what it takes
          from the queue is served, never closed unread.
        name: admit
        params: nfd int
        recv: el *epollLoop
      - doc: reject closes nfd at accept, counts the refusal and raises hard pressure.
        name: reject
        params: nfd int
        recv: el *epollLoop
      - doc: |-
          pause disarms the listeners for a backoff after EMFILE or ENFILE, and
          raises hard pressure so idle connections can be evicted.
        name: pause
        recv: el *epollLoop
      - doc: |-
          pace re-arms the listeners once a backoff ended, and evicts idle
          connections while the loop is under hard pressure.
        name: pace
        recv: el *epollLoop
      - doc: conn serves the events of the connection on slot.
        name: conn
        params: slot int32, gen, events uint32
        recv: el *epollLoop
      - doc: |-
          writable resumes slot's output on EPOLLOUT, and stops asking for room once
          it drained.
        name: writable
        params: slot int32
        recv: el *epollLoop
      - doc: readable serves slot's input and hang-up events.
        name: readable
        params: slot int32, events uint32
        recv: el *epollLoop
      - doc: read reads once from slot and hands the bytes to the handler.
        name: read
        params: slot int32
        recv: el *epollLoop
      - doc: |-
          readBuf is where slot's next read lands: behind a spill, straight into it
          so the handler sees one run; otherwise the read arena. ok is false when
          there is no room: the spill failed the connection, or the arena is spent.
        name: readBuf
        params: slot int32
        recv: el *epollLoop
        results: buf []byte, inSpill, ok bool
      - doc: |-
          received hands the n bytes just read for slot to the handler, from where
          they were read.
        name: received
        params: slot int32, data []byte, inSpill bool
        recv: el *epollLoop
      - doc: |-
          outEvents is the event mask slot wants: reading unless its peer is done,
          writing while output waits on the socket.
        name: outEvents
        params: c *connCtl
        recv: el *epollLoop
        results: uint32
      - doc: "flush implements driver: it writes slot's output until the socket is full."
        name: flush
        params: r *ring, slot int32
        recv: el *epollLoop
      - doc: |-
          shutdown implements driver: the descriptor leaves the set and closes, and
          the slot is free at once, since epoll holds nothing in flight.
        name: shutdown
        params: r *ring, slot int32
        recv: el *epollLoop
      - doc: "unread implements driver: SIOCINQ, the bytes the socket holds unread."
        name: unread
        params: r *ring, slot int32
        recv: el *epollLoop
        results: bool
      - doc: control applies the group's drain and stop requests.
        name: control
        recv: el *epollLoop
      - doc: |-
          takeQueues takes every listener's queue to EAGAIN once the listeners left
          the loop's set, admitting each connection, and hands each listener back to
          the group's set, whose last loop closes it: a connection the kernel
          completed before the close is served, not reset by it (plan P6).

          It runs at every batch of the drain until each listener is handed back: a
          take that waits for descriptors goes on once the drain's closes free some.
        name: takeQueues
        recv: el *epollLoop
      - doc: queuesTaken reports whether the loop handed every listener back.
        name: queuesTaken
        recv: el *epollLoop
        results: bool
      - doc: |-
          takeQueue accepts from listener i, lfd, queueTakeBatch at most this batch,
          and reports whether its take is over: the queue empty, the listener failed,
          or queueTakeMax taken. Out of descriptors, or with the ring's table full,
          it waits for the drain's closes; out of descriptors with no connection of
          the group left to close, its take is over.
        name: takeQueue
        params: i, lfd int
        recv: el *epollLoop
        results: bool
      - doc: closeAll closes every connection still open, as the loop stops.
        name: closeAll
        recv: el *epollLoop
      - doc: teardown releases everything the loop owns but the listeners.
        name: teardown
        recv: el *epollLoop
    name: epollLoop
  - fields:
      - doc: FD is the duplicated descriptor, close-on-exec.
        name: FD
        type: int
    kind: struct
    name: Listener
  - fields:
      - doc: Group is the group's name, for the start line and State.
        name: Group
        type: string
      - doc: Value is the group's LoopValue.
        name: Value
        type: corenet.LoopValue
      - doc: |-
          MaxConns is LimitsValue.MaxConns: past it a connection is accepted and
          closed at once. Zero sets no ceiling.
