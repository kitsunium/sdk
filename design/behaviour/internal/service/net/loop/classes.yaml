# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: The classes a capability row names (ADR 0189).
    grouped: true
    items:
      - doc: "classKernel is class A-kernel: on once the probe validates it."
        name: classKernel
        type: string
        value: "\"a-kernel\""
      - doc: "classCode is class A-code: on only when LoopValue.Capabilities opts in."
        name: classCode
        type: string
        value: "\"a-code\""
      - doc: "classB is class B: declared, never turned on by this step."
        name: classB
        type: string
        value: "\"b\""
    name: classKernel
  - doc: The statuses a capability row reports (ADR 0189).
    grouped: true
    items:
      - doc: statusOn is probed and in use.
        name: statusOn
        type: string
        value: "\"on\""
      - doc: statusAvailable is probed and present, not asked for.
        name: statusAvailable
        type: string
        value: "\"available\""
      - doc: statusAbsent is probed, and the kernel lacks it.
        name: statusAbsent
        type: string
        value: "\"absent\""
      - doc: |-
          statusMissing is a class A-code capability the code opted into and the
          kernel lacks: server reports it as a fault.
        name: statusMissing
        type: string
        value: "\"missing\""
      - doc: "statusDisabled is switched off by the operator: never probed."
        name: statusDisabled
        type: string
        value: "\"disabled\""
      - doc: statusUnprobed is of no use to the backend the group runs on.
        name: statusUnprobed
        type: string
        value: "\"unprobed\""
    name: statusOn
  - doc: reasonClassB is the reason every class B row gives.
    items:
      - name: reasonClassB
        type: string
        value: "\"class B: declared, not built until BENCH.md shows its threshold\""
    name: reasonClassB
  - doc: |-
      The states of a connection slot. A slot returns to stFree only once its
      backend released the descriptor and every operation still in flight, its
      generation moved on.
    grouped: true
    items:
      - doc: stFree is a slot on the free list.
        name: stFree
        type: uint8
        value: iota
      - doc: stOpen serves its connection.
        name: stOpen
      - doc: stClosing was asked to close and still has output to send.
        name: stClosing
      - doc: |-
          stDead has called OnClose and waits for its backend to release the
          descriptor and every operation still in flight.
        name: stDead
    name: stFree
  - doc: The flags of a connection slot.
    grouped: true
    items:
      - doc: fPressure is the soft pressure set at accept.
        name: fPressure
        type: uint8
        value: 1 << iota
      - doc: |-
          fWantWritable asks for OnWritable once the output falls under the
          low-water mark.
        name: fWantWritable
      - doc: fDirty puts the slot on its ring's dirty list.
        name: fDirty
      - doc: fPeerDone is a peer that sent its last byte.
        name: fPeerDone
      - doc: |-
          fSending is output the backend holds: EPOLLOUT armed, or a send in
          flight.
        name: fSending
      - doc: |-
          fHeard is a peer that sent at least one byte: the drain closes a
          connection that has not only once it stayed silent for drainQuiet.
        name: fHeard
      - doc: fCompact puts the slot on its ring's compaction list.
        name: fCompact
    name: fPressure
  - doc: |-
      The reasons a connection is closed, mapped to the preallocated error
      OnClose receives (closeErr).
    grouped: true
    items:
      - doc: |-
          rNone is a clean close, by the handler or the peer: OnClose receives
          nil.
        name: rNone
        type: uint8
        value: iota
      - doc: rSpill is unconsumed input past SpillCap, or the slab's budget spent.
        name: rSpill
      - doc: rIdle is no traffic for IdleTimeout.
        name: rIdle
      - doc: rDrain is the group's drain or stop.
        name: rDrain
      - doc: rErrno is a socket failure; the slot's errno says which.
        name: rErrno
      - doc: rEvict is an idle connection evicted under hard pressure.
        name: rEvict
    name: rNone
  - grouped: true
    items:
      - doc: |-
          lowWaterDiv sets the output low-water mark at OutputCap / lowWaterDiv:
          a connection refused with LoopOutputFull hears OnWritable once its
          pending output falls under it.
        name: lowWaterDiv
        type: int
        value: "4"
      - doc: |-
          evictPerTick paces hard-pressure eviction: at most this many idle
          connections closed per ring and tick.
        name: evictPerTick
        type: int
        value: "16"
      - doc: |-
          slotStep is the most slots a ring's table grows by at once: doubling
          up to it, then by it. Past a few thousand connections append's growth
          left up to a quarter of the table unused and briefly held the old array
          beside the new one, about 100 B a slot each.
        name: slotStep
        type: int
        value: "2048"
    name: lowWaterDiv
  - doc: |-
      loopDebug reports whether the loopdebug build tag compiled the thread
      check in.
    items:
      - name: loopDebug
        value: "false"
    name: loopDebug
  - grouped: true
    items:
      - doc: |-
          drainQuiet is how long the drain leaves open a connection that has sent
          nothing yet. One accepted as the drain began has its request on the way:
          closed before it is read, the request would meet a closed socket and the
          peer a reset. One that stays silent that long is closed like any other.
        name: drainQuiet
        type: time.Duration
        value: time.Second
      - doc: drainQuietTicks is drainQuiet in ticks.
        name: drainQuietTicks
        type: int64
        value: int64(drainQuiet / tickEvery)
      - doc: |-
          queueTakeMax bounds how many connections the drain takes from one
          listener's queue, a loop on epoll, a ring on io_uring: past it the
          arrivals outpace the drain — no grace let the routing stop —, and what
          is left in the queue meets the close.
        name: queueTakeMax
        type: int
        value: 1 << 16
      - doc: |-
          queueTakeBatch bounds what epoll's drain takes from one listener in one
          batch, so the loop serves between two takes.
        name: queueTakeBatch
        type: int
        value: 8 * epollAcceptBurst
    name: drainQuiet
  - doc: What an accept's failure means for epoll's drain take (takeAfter).
    grouped: true
    items:
      - doc: "takeOver ends the take: the queue is empty, or the listener failed."
        name: takeOver
        type: uint8
        value: iota
      - doc: |-
          takeLater waits for the next batch: no descriptor until a close, with
          a connection of the group left whose close frees one.
        name: takeLater
      - doc: "takeNext skips one connection: the peer abandoned it, or a signal."
        name: takeNext
    name: takeOver
  - grouped: true
    items:
      - doc: |-
          epollAcceptBurst is the most connections one listener readiness
          accepts before the loop serves the events already in hand.
        name: epollAcceptBurst
        type: int
        value: "128"
      - doc: readChunk is the most bytes one read asks for.
        name: readChunk
        type: int
        value: 16 << 10
      - doc: |-
          minRead is the least room in the read arena worth a read: below it the
          connection is read on the next iteration, its readiness still level.
        name: minRead
        type: int
        value: 2 << 10
      - doc: |-
          arenaSize is the loop's read arena: where a batch's received bytes
          live until OnBatchEnd returns.
        name: arenaSize
        type: int
        value: 2 << 20
      - doc: |-
          backoffMin is the first wait before a listener disarmed by EMFILE or
          ENFILE is armed again, in ticks (5 ms rounds up to one).
        name: backoffMin
        type: int64
        value: "1"
      - doc: backoffMax caps that wait, doubled at each pause, at one second.
        name: backoffMax
        type: int64
        value: int64(time.Second / tickEvery)
      - doc: tagWake marks the epoll event of the wake eventfd, not a connection.
        name: tagWake
        type: int32
        value: "-1"
      - doc: tagListen marks listener i's epoll event, at tagListen-i.
        name: tagListen
        type: int32
        value: "-2"
      - doc: |-
          efdNonblock is EFD_NONBLOCK (include/uapi/linux/eventfd.h, the O_
          flag's value).
        name: efdNonblock
        type: uintptr
        value: syscall.O_NONBLOCK
      - doc: |-
          efdCloexec is EFD_CLOEXEC (include/uapi/linux/eventfd.h, the O_ flag's
          value).
        name: efdCloexec
        type: uintptr
        value: syscall.O_CLOEXEC
      - doc: |-
          epollExclusive is EPOLLEXCLUSIVE (include/uapi/linux/eventpoll.h, 4.5):
          one loop woken per incoming connection, not every loop.
        name: epollExclusive
        type: uint32
        value: 1 << 28
      - doc: siocinq is SIOCINQ, FIONREAD on a socket (asm-generic/ioctls.h).
        name: siocinq
        type: uintptr
        value: "0x541B"
      - doc: connEvents are a connection's events while it reads.
        name: connEvents
        type: uint32
        value: syscall.EPOLLIN | syscall.EPOLLRDHUP
    name: epollAcceptBurst
  - doc: |-
      idleSlotHeapBudget is the most Go heap, in bytes, one idle connection
      costs on a native backend — 256 bytes, its slot and its timer link, as the
      package documentation states. The memory test measures the same bound.
    items:
      - name: idleSlotHeapBudget
        type: uintptr
        value: "256"
    name: idleSlotHeapBudget
  - doc: |-
      A slot and its timer link — the wheel's next, prev and at entries — must
      fit idleSlotHeapBudget: past it the difference is a negative uintptr
      constant, which does not compile.
    items:
      - name: _
        type: uintptr
        value: idleSlotHeapBudget - (unsafe.Sizeof(connCtl{}) + 2*unsafe.Sizeof(int32(0)) + unsafe.Sizeof(int64(0)))
    name: _
  - doc: backendEpoll is the backend startEpoll reports.
    items:
      - name: backendEpoll
        type: corenet.LoopBackend
        value: corenet.LoopBackendEpoll
    name: backendEpoll
  - doc: |-
      The io_uring accept watchdog's bounds. They live in a file every Linux
      architecture builds, not beside the watchdog, because the conformance suite
      reads them on every Linux architecture, io_uring's wave 1 or not.
    grouped: true
    items:
      - doc: |-
          watchdogTicks is how long an accept may look stalled — armed, the
          listener's queue not empty, no accept completion on any ring — before
          the watchdog re-arms it.
        name: watchdogTicks
        type: int64
        value: "100"
      - doc: |-
          watchdogFires is how many re-arms the watchdog makes before the ring
          drains.
        name: watchdogFires
        type: int
        value: "3"
    name: watchdogTicks
  - doc: |-
      postQueueCap is how many posted operations one loop holds before Post
      refuses with LoopPostQueueFull.
    items:
      - name: postQueueCap
        type: int
        value: "4096"
    name: postQueueCap
  - grouped: true
    items:
      - doc: |-
          ioringMaxFixedFiles is IORING_MAX_FIXED_FILES, the most entries one
          io_uring file table holds (io_uring/rsrc.h, 1 << 20 since 5.11).
        name: ioringMaxFixedFiles
        type: uint64
        value: 1 << 20
      - doc: |-
          defaultCQBatch is how many completions or events one iteration reaps
          when LoopValue.CQBatch is zero.
        name: defaultCQBatch
        type: int
        value: "512"
      - doc: |-
          defaultSpillCap is LoopValue.SpillCap's default: one request head and
          a modest body, unconsumed, per connection.
        name: defaultSpillCap
        type: int
        value: 64 << 10
      - doc: defaultOutputCap is LoopValue.OutputCap's default.
        name: defaultOutputCap
        type: int
        value: 1 << 20
      - doc: |-
          ringsExplicit is a Rings the LoopValue set; the three ringsX values
          are where Rings came from, as State reports it.
        name: ringsExplicit
        type: string
        value: "\"explicit\""
      - doc: |-
          ringsDerived is a Rings the formula derived: ⌈target / table⌉, more
          than one.
        name: ringsDerived
        type: string
        value: "\"derived\""
      - doc: |-
          ringsSingle is one ring: no bound to size against, or one table holds
          the target.
        name: ringsSingle
        type: string
        value: "\"single\""
      - doc: |-
          loopsExplicit is a positive LoopValue.Loops; the three loopsX values
          are where Loops came from, as State reports it.
        name: loopsExplicit
        type: string
        value: "\"explicit\""
      - doc: "loopsAuto is LoopsAuto: GOMAXPROCS less one read at Start."
        name: loopsAuto
        type: string
        value: "\"auto\""
      - doc: "loopsSingle is a zero LoopValue.Loops: one loop (R8)."
        name: loopsSingle
        type: string
        value: "\"single\""
      - doc: |-
          defaultBatchWait is LoopValue.BatchWait's default: the most the
          grouped io_uring wait adds to a request's latency (ADR 0199).
        name: defaultBatchWait
        type: time.Duration
        value: 250 * time.Microsecond
      - doc: defaultBatchWaitMin is LoopValue.BatchWaitMin's default.
        name: defaultBatchWaitMin
        type: int
        value: "32"
      - doc: |-
          batchWaitFrom is the fewest completions a batch must have reaped for
          the next wait to be grouped: below it the loop is not loaded, and
          waiting would only add latency.
        name: batchWaitFrom
        type: uint64
        value: "4"
      - doc: |-
          spacingWeight is the weight of one batch in the moving average of the
          time between two arrivals (ADR 0202): an eighth, so a burst of a few
          batches does not swing it, and a few dozen settle it.
        name: spacingWeight
        type: time.Duration
        value: "8"
      - doc: |-
          yieldEvery is the most serving time between two yields of a native
          loop to the Go scheduler, when GOMAXPROCS leaves it a spare P (ADR
          0199). Measured: 2 ms and 5 ms cost the same.
        name: yieldEvery
        type: time.Duration
        value: 5 * time.Millisecond
    name: ioringMaxFixedFiles
  - grouped: true
    items:
      - doc: minClassShift is the smallest chunk, 2 KiB.
        name: minClassShift
        type: uint
        value: "11"
      - doc: |-
          arenaBytes is the least memory one mapping adds to a class: chunks are
          mapped a quarter of a mebibyte at a time, or one chunk when a chunk is
          larger.
        name: arenaBytes
        type: int
        value: 256 << 10
      - doc: |-
          defaultSlabBudget is the global ceiling on the bytes a loop's
          connections hold in spill and output together. Past it a Write is
          refused with LoopOutputFull and an unconsumed tail closes its
          connection with LoopSpillFull: load is shed by name, never by the
          kernel's OOM killer.
        name: defaultSlabBudget
        type: int
        value: 128 << 20
      - doc: noChunk marks a chunkRef that holds nothing.
        name: noChunk
        type: int32
        value: "-1"
    name: minClassShift
  - doc: |-
      batchBuckets is the batch-duration histogram's width: bucket i counts
      batches of under 2^i nanoseconds.
    items:
      - name: batchBuckets
        type: int
        value: "40"
    name: batchBuckets
  - doc: |-
      The io_uring ABI this backend speaks, declared in-tree because the standard
      library's syscall package has none of it and golang.org/x/sys is banned
      (ADR 0018). Every number and layout is Linux include/uapi/linux/io_uring.h
      as of 6.8, and the layouts are frozen by uring_abi_linux_internal_test.go's
      Sizeof and Offsetof checks. The four architectures share the generic syscall
      table, where io_uring has had the same numbers since 5.1.
    grouped: true
    items:
      - name: sysIOURingSetup
        type: uintptr
        value: "425"
      - name: sysIOURingEnter
        type: uintptr
        value: "426"
      - name: sysIOURingRegister
        type: uintptr
        value: "427"
      - doc: io_uring_setup flags.
        name: setupCQSize
        type: uint32
        value: 1 << 3
      - name: setupClamp
        type: uint32
        value: 1 << 4
      - name: setupSubmitAll
        type: uint32
        value: 1 << 7
      - name: setupCoopTaskrun
        type: uint32
        value: 1 << 8
      - name: setupSingleIssuer
        type: uint32
        value: 1 << 12
      - name: setupDeferTaskrun
        type: uint32
        value: 1 << 13
      - doc: |-
          setupNoSQArray is IORING_SETUP_NO_SQARRAY (6.6): the SQ tail indexes
          the SQEs directly and sqOff.array reads zero.
        name: setupNoSQArray
        type: uint32
        value: 1 << 16
      - doc: |-
          setupSQRewind is IORING_SETUP_SQ_REWIND (7.0): the kernel ignores the
          SQ head and tail and takes every submission from SQE 0. It requires
          NO_SQARRAY and refuses SQPOLL, which this backend never sets.
        name: setupSQRewind
        type: uint32
        value: 1 << 20
      - doc: io_uring_params.features.
        name: featSingleMmap
        type: uint32
        value: 1 << 0
      - name: featNoDrop
        type: uint32
        value: 1 << 1
      - name: featExtArg
        type: uint32
        value: 1 << 8
      - doc: featMinTimeout is IORING_FEAT_MIN_TIMEOUT (6.12), class B's min_wait.
        name: featMinTimeout
        type: uint32
        value: 1 << 15
      - doc: featRecvSendBundle is IORING_FEAT_RECVSEND_BUNDLE (6.10).
        name: featRecvSendBundle
        type: uint32
        value: 1 << 14
      - doc: io_uring_enter flags.
        name: enterGetEvents
        type: uint32
        value: 1 << 0
      - name: enterExtArg
        type: uint32
        value: 1 << 3
      - doc: |-
          enterRegisteredRing is IORING_ENTER_REGISTERED_RING: fd is the index
          IORING_REGISTER_RING_FDS returned, not a descriptor.
        name: enterRegisteredRing
        type: uint32
        value: 1 << 4
      - doc: SQ ring flags.
        name: sqCQOverflow
        type: uint32
        value: 1 << 1
      - doc: mmap offsets.
        name: offSQRing
        type: uintptr
        value: "0"
      - name: offCQRing
        type: uintptr
        value: "0x8000000"
      - name: offSQEs
        type: uintptr
        value: "0x10000000"
      - doc: Opcodes.
        name: opNop
        type: uint8
        value: "0"
      - name: opPollAdd
        type: uint8
        value: "6"
      - name: opAccept
        type: uint8
        value: "13"
      - name: opAsyncCancel
        type: uint8
        value: "14"
      - name: opClose
        type: uint8
        value: "19"
      - name: opRead
        type: uint8
        value: "22"
      - name: opSend
        type: uint8
        value: "26"
      - name: opRecv
        type: uint8
        value: "27"
      - name: opShutdown
        type: uint8
        value: "34"
      - doc: SQE flags.
        name: sqeFixedFile
        type: uint8
        value: 1 << 0
      - doc: |-
          sqeIOHardlink is IOSQE_IO_HARDLINK: the next SQE starts once this one
          completed, whatever its result.
        name: sqeIOHardlink
        type: uint8
        value: 1 << 3
      - name: sqeAsync
        type: uint8
        value: 1 << 4
      - name: sqeBufferSelect
        type: uint8
        value: 1 << 5
      - doc: ioprio flags of accept and recv.
        name: acceptMultishot
        type: uint16
        value: 1 << 0
      - name: recvMultishot
        type: uint16
        value: 1 << 1
      - doc: |-
          recvBundle is IORING_RECVSEND_BUNDLE (6.10): a recv fills several
          provided buffers, consecutive in their ring, in one completion.
        name: recvBundle
        type: uint16
        value: 1 << 4
      - doc: "len flag of POLL_ADD: a multishot poll."
        name: pollAddMulti
        type: uint32
        value: 1 << 0
      - doc: Cancel flags.
        name: cancelAll
        type: uint32
        value: 1 << 0
      - name: cancelFD
        type: uint32
        value: 1 << 1
      - name: cancelFDFixed
        type: uint32
        value: 1 << 3
      - doc: CQE flags.
        name: cqeFBuffer
        type: uint32
        value: 1 << 0
      - name: cqeFMore
        type: uint32
        value: 1 << 1
      - doc: |-
          cqeFBufMore is IORING_CQE_F_BUF_MORE (6.12): the completion's buffer
          stays the kernel's, partly consumed, for more completions.
        name: cqeFBufMore
        type: uint32
        value: 1 << 4
      - name: cqeBufferShift
        type: uint32
        value: "16"
      - doc: |-
          fileIndexAlloc is IORING_FILE_INDEX_ALLOC, (~0U): the kernel picks a
          free slot of the direct-descriptor table and returns it in res.
        name: fileIndexAlloc
        type: uint32
        value: "0xFFFFFFFF"
      - doc: io_uring_register opcodes.
        name: regEventFD
        type: uintptr
        value: "4"
      - name: regProbe
        type: uintptr
        value: "8"
      - name: regFiles2
        type: uintptr
        value: "13"
      - name: regRingFDs
        type: uintptr
        value: "20"
      - name: unregRingFDs
        type: uintptr
        value: "21"
      - name: regPbufRing
        type: uintptr
        value: "22"
      - name: unregPbufRing
        type: uintptr
        value: "23"
      - doc: "ringFDsMax is IO_RINGFD_REG_MAX: a thread registers at most 16 rings."
        name: ringFDsMax
        type: int
        value: "16"
      - doc: ringFDAlloc is the offset -1U that lets the kernel pick the index.
        name: ringFDAlloc
        type: uint32
        value: "0xFFFFFFFF"
      - doc: |-
          pbufRingMmap is IOU_PBUF_RING_MMAP (6.4): the kernel allocates the
          buffer ring and the loop maps it, at offPbufRing | bgid << offPbufShift,
          so no user page is pinned against RLIMIT_MEMLOCK.
        name: pbufRingMmap
        type: uint16
        value: "1"
      - doc: |-
          pbufRingInc is IOU_PBUF_RING_INC (6.12): a buffer is consumed as far
          as each completion took, and serves the next from where it stopped.
        name: pbufRingInc
        type: uint16
        value: "2"
      - name: offPbufRing
        type: uintptr
        value: "0x80000000"
      - name: offPbufShift
        type: uintptr
        value: "16"
      - doc: rsrcRegisterSparse is IORING_RSRC_REGISTER_SPARSE.
        name: rsrcRegisterSparse
        type: uint32
        value: 1 << 0
      - doc: probeOpSupported is IO_URING_OP_SUPPORTED.
        name: probeOpSupported
        type: uint16
        value: 1 << 0
      - doc: probeOps is how many entries the probe asks about.
        name: probeOps
        type: uint32
        value: "64"
      - doc: errnoETIME and the others the enter loop branches on.
        name: errnoETIME
        value: syscall.Errno(62)
      - name: errnoECANCELED
        value: syscall.Errno(125)
      - name: errnoENOBUFS
        type: syscall.Errno
        value: syscall.ENOBUFS
    name: sysIOURingSetup
  - grouped: true
    items:
      - doc: |-
          bundleProbeBufs is the bundle probe's buffers: two, so a bundle that
          spans them shows.
        name: bundleProbeBufs
        type: uint32
        value: "2"
      - doc: bundleProbeSize is the bytes of one of them.
        name: bundleProbeSize
        type: uint32
        value: "64"
      - doc: "bundleProbeBytes is what the probe sends: more than one buffer holds."
        name: bundleProbeBytes
        type: int
        value: "100"
      - doc: bundleProbeWait bounds the probe's wait for its completion.
        name: bundleProbeWait
        type: time.Duration
        value: 200 * time.Millisecond
    name: bundleProbeBufs
  - doc: |-
      The setup flags every ring may carry: the floor every kernel the backend
      serves accepts, and SINGLE_ISSUER, which 6.0 added.
    grouped: true
    items:
      - doc: setupBase is what a ring carries whatever the probe finds.
        name: setupBase
        type: uint32
        value: setupCoopTaskrun | setupSubmitAll
      - doc: |-
          rewindFirst and rewindSecond are the user_data of SQ_REWIND's two
          self-test NOPs: the order they complete in is the contract.
        name: rewindFirst
        type: uint64
        value: "0xA1"
      - name: rewindSecond
        type: uint64
        value: "0xA2"
    name: setupBase
  - doc: The operations a CQE's user_data names, in its top byte.
    grouped: true
    items:
      - name: udRecv
        type: uint64
        value: iota + 1
      - name: udSend
      - name: udCancel
      - name: udClose
      - name: udAccept
      - name: udWake
      - name: udFan
      - name: udAcceptCancel
      - name: udOrphanClose
      - name: udShutdown
    name: udRecv
  - grouped: true
    items:
      - doc: |-
          acceptDepth is how many single-shot accepts a ring keeps in flight per
          listener.
        name: acceptDepth
        type: int
        value: "32"
      - doc: |-
          acceptReserve is the free direct-descriptor entries a ring keeps: under
          it the ring stops accepting, and it resumes at twice as many.
        name: acceptReserve
        type: int
        value: "16"
      - doc: pollIn is POLLIN (asm-generic/poll.h).
        name: pollIn
        type: int16
        value: "0x1"
      - doc: |-
          takeOn is uRing.take for a ring that takes its share of the
          listeners' queues as the group drains.
        name: takeOn
        type: uint8
        value: "0"
      - doc: takeOff is uRing.take for a ring that takes nothing more.
        name: takeOff
        type: uint8
        value: "1"
      - doc: starvedCap bounds the connections waiting for a provided buffer.
        name: starvedCap
        type: int
        value: "65536"
      - doc: |-
          reapRounds bounds the CQ batches one ring reaps per iteration, so one
          ring cannot starve the others forever.
        name: reapRounds
        type: int
        value: "4"
      - doc: |-
          staleFill is the byte a provided buffer is overwritten with under the
          fill hook: a stale byte read back shows as it.
        name: staleFill
        type: byte
        value: "0xAA"
      - doc: |-
          maxProcessFDs bounds slotOf on process descriptors, whatever
          RLIMIT_NOFILE says.
        name: maxProcessFDs
        type: uint64
        value: 1 << 22
      - doc: genMask keeps the 24 bits of a generation user_data carries.
        name: genMask
        type: uint32
        value: 1<<24 - 1
      - doc: |-
          sweepCloses is the fewest closes since the last sweep started that
          start the next one on a ring whose closes put their files late
          (uRing.sweep); a quarter of the table when that is more.
        name: sweepCloses
        type: uint64
        value: "8192"
      - doc: |-
          sweepEvery is how many ticks after the last sweep the next one starts,
          whatever the closes, once at least one happened.
        name: sweepEvery
        type: int64
        value: "1000"
      - doc: sweepScan is the fewest slots a sweep walks per tick.
        name: sweepScan
        type: int
        value: "128"
      - doc: |-
          sweepTicks is the most ticks a pass takes, so a large table is walked
          in a second.
        name: sweepTicks
        type: int
        value: "100"
      - doc: noEpoch marks a slot with no recv armed.
        name: noEpoch
        type: uint64
        value: 1<<64 - 1
      - doc: |-
          closeBackstopTicks is how long a closed slot may wait on an operation
          after its shutdown was issued before closeBackstop cancels it.
        name: closeBackstopTicks
        type: int64
        value: "100"
      - doc: |-
          closingCompact is the fewest looked-at closes compactClosing moves
          out of a queue that never empties.
        name: closingCompact
        type: int
        value: "1024"
      - doc: |-
          loopBufBudget bounds the bytes of provided buffers one loop hands its
          rings' kernels, every ring together: resident once the kernel wrote
          them, never taken back (ADR 0203 §D2).
        name: loopBufBudget
        type: uint64
        value: 128 << 20
      - doc: |-
          groupSlack is how many buffers of a group are kept beyond the recvs
          armed on it. A multishot recv that received tries again at once, and
          that try takes a buffer from the ring and recycles it on EAGAIN, or
          fails the recv with ENOBUFS on an empty ring (io_recv, io_recv_finish,
          io_uring/net.c, 6.12 to 7.0): a group with exactly a buffer a recv
          ends its every burst with spurious ENOBUFS, each a completion and a
          re-arm (ADR 0203 §D2).
        name: groupSlack
        type: int
        value: "32"
      - doc: |-
          fillFull is uRing.fill's bit for a ring near its table's end, or
          passed over, so the ring after it accepts too.
        name: fillFull
        type: uint8
        value: "1"
      - doc: |-
          fillClosed is uRing.fill's bit for a ring a ring before it keeps from
          accepting: one of them is not full.
        name: fillClosed
        type: uint8
        value: "2"
      - doc: |-
          fillShare is the share of its table, as a divisor, a ring may still
          have free when the next ring starts accepting (uRing.fillStep): an
          eighth, so the next ring's accepts are armed well before this one
          pauses under its reserve (ADR 0203 §D1).
        name: fillShare
        type: int
        value: "8"
    name: acceptDepth
  - doc: |-
      peerPeekBytes is the release check's read buffer: any read will do, the
      check only waits for the end of the stream.
    items:
      - name: peerPeekBytes
        type: int
        value: "64"
    name: peerPeekBytes
  - grouped: true
    items:
      - doc: |-
          uringEntries is a serving ring's SQ size; CLAMP lets the kernel lower
          it, and the size it grants is read back from the params. A ring's SQ and
          CQ are charged to RLIMIT_MEMLOCK for a process without CAP_IPC_LOCK
          (an 8 MiB default on most distributions), so they are sized to keep a
          few rings within it rather than to the largest burst: a full SQ submits
          inline, a full CQ overflows into the kernel's list (NODROP).
        name: uringEntries
        type: uint32
        value: "1024"
      - doc: probeEntries sizes the probe's short-lived rings.
        name: probeEntries
        type: uint32
        value: "16"
      - doc: cqFactor is how many times uringEntries CQSIZE asks for the CQ.
        name: cqFactor
        type: uint32
        value: "4"
      - doc: |-
          bufGroup is the first provided-buffer group a recv selects from; a
          ring's group g is bufGroup+g.
        name: bufGroup
        type: uint16
        value: "1"
      - doc: |-
          defaultBufs is the fewest provided buffers a ring may hand the kernel,
          and the entries of each of its buffer rings. They are mapped at setup
          and handed out as the ring needs them (uRing.provide): an untouched
          buffer is no resident memory, so a ring's buffers cost the most it
          ever had out at once, not its count (ADR 0201 §D1).
        name: defaultBufs
        type: uint32
        value: "8192"
      - doc: |-
          maxBufs is the most provided buffers a ring may hand the kernel: a
          bid is 16 bits. A ring may have as many as its table holds
          connections, a power of two, in groups of defaultBufs registered as
          they are first needed (ADR 0203 §D2).
        name: maxBufs
        type: uint32
        value: 1 << 16
      - doc: |-
          defaultBufSize is the size of one provided buffer, in bytes: an HTTP
          request of a keep-alive connection fits in one; a larger one arrives
          over several completions, as a split read always could.
        name: defaultBufSize
        type: uint32
        value: "2048"
      - doc: bufsFirst is how many buffers a ring hands the kernel at setup.
        name: bufsFirst
        type: uint32
        value: "512"
      - doc: bufsStep is the fewest more it hands each time it runs short.
        name: bufsStep
        type: uint32
        value: "512"
      - doc: enterRetries bounds the retries of a busy submit.
        name: enterRetries
        type: int
        value: "8"
    name: uringEntries
  - grouped: true
    items:
      - doc: |-
          tickEvery is the timer wheel's resolution: a deadline fires no earlier
          than asked and at most one tick late.
        name: tickEvery
        type: time.Duration
        value: 10 * time.Millisecond
      - doc: |-
          wheelSlots is the wheel's circumference, a power of two; a deadline
          further than wheelSlots ticks away waits in its bucket for its round.
        name: wheelSlots
        type: int64
        value: "1024"
      - doc: noLink ends a bucket list.
        name: noLink
        type: int32
        value: "-1"
    name: tickEvery
