      - doc: hooks are the conformance suite's other fault injections.
        name: hooks
        type: loopHooks
    kind: struct
    name: Config
  - doc: |-
      loopHooks are the conformance suite's fault injections; zero in
      production.
    fields:
      - doc: "bufs and bufSize override io_uring's provided buffers: a two-entry ring."
        name: bufs
        type: uint32
      - doc: "bufs and bufSize override io_uring's provided buffers: a two-entry ring."
        name: bufSize
        type: uint32
      - doc: fill writes 0xAA over a provided buffer before it returns to the ring.
        name: fill
        type: bool
      - doc: shuffle returns a batch's buffers in a scrambled order.
        name: shuffle
        type: bool
      - doc: failStage fails the io_uring probe at the named stage.
        name: failStage
        type: string
      - doc: |-
          primaryIdle keeps io_uring's primary ring from accepting, so every
          connection lands on a secondary (P3a's wake test).
        name: primaryIdle
        type: bool
      - doc: |-
          secondaryPlain sets io_uring's secondary rings up without
          COOP_TASKRUN: the kernel then signals the thread for their task work.
        name: secondaryPlain
        type: bool
      - doc: sweepEvery shortens io_uring's sweep period, in ticks.
        name: sweepEvery
        type: int64
      - doc: |-
          taken sees the opcode and flags of every SQE a serving io_uring ring
          hands the kernel, on the loop's thread: the stop tests count what a
          close issues.
        name: taken
        type: func(op, flags uint8, opFlags uint32)
      - doc: |-
          bufSeen sees, on the loop's thread, each buffer a recv completion
          used — its bid, where its bytes start in the buffer, how many, whether
          the kernel keeps the buffer (BUF_MORE), and first on a completion's
          first buffer, a bundle's following ones without — and, with returned
          set, each buffer handed back to the kernel. The incremental and bundle
          tests check a buffer is returned only once the kernel let it go.
        name: bufSeen
        type: func(bid uint16, off, n int, kept, first, returned bool)
