    methods:
      - doc: pollFD arms a multishot POLLIN on fd, tagged op.
        name: pollFD
        params: fd int, op uint64
        recv: rr *uRing
      - doc: |-
          armAccepts keeps up to acceptDepth single-shot accepts in flight per
          listener, never more than the entries left above the reserve. A multishot
          accept into a direct-descriptor table keeps accepting the whole listen
          backlog before the loop can see the reserve reached: past the table's last
          entry the kernel accepts the connection, cannot install it, and drops it
          (ENFILE), which CI saw on a 6.11 kernel. Single-shot accepts, each holding
          one entry until it completes, cannot overshoot.
        name: armAccepts
        recv: rr *uRing
      - doc: |-
          acceptsNothing reports a ring that arms no accept: paused, draining,
          closed until the rings before it are full, or the primary a test keeps
          idle.
        name: acceptsNothing
        recv: rr *uRing
        results: bool
      - doc: |-
          passedOver reports a ring that accepts nothing for a reason of its own,
          whatever its table holds: the watchdog drained it, or it is the primary a
          test keeps idle. The ring after it accepts in its place.
        name: passedOver
        recv: rr *uRing
        results: bool
      - doc: |-
          fillAtStart sets the fill state of a ring as it is built, after the rings
          before it: full when passed over from the start, closed behind a ring that
          has room — every ring past the first, unless the primary is a test's idle
          one.
        name: fillAtStart
        recv: rr *uRing
      - doc: |-
          fillStep moves the ring's fill state with hysteresis: full once its free
          entries fall to fillMargin, or once it is passed over; not full again only
          past twice the margin, so a table hovering at the margin does not open and
          close the next ring at each batch. A ring a ring before it no longer lets
          accept cancels its accepts in flight once; the connections it holds stay
          (ADR 0203 §D1). The rings are stepped in order, so ring i reads its
          predecessors' state of this batch.
        name: fillStep
        recv: rr *uRing
      - doc: |-
          acceptRoom is how many more accepts may be in flight: the free entries
          above the reserve, less those the accepts in flight will take.
        name: acceptRoom
        recv: rr *uRing
        results: int
      - doc: |-
          cancelAccepts cancels every accept in flight; their completions disarm
          them.
        name: cancelAccepts
        recv: rr *uRing
      - doc: |-
          cancelAccept cancels every accept in flight on listener i, and reports
          whether the SQ had room for the cancel.
        name: cancelAccept
        params: i int
        recv: rr *uRing
        results: bool
      - doc: |-
          takeQueues takes the ring's share of every listener's queue as the group
          drains (plan P6). Once the cancels of its accepts came back — an accept
          that completed as its cancel crossed it is served like any other —, it
          arms as many single-shot accepts as the queue holds (TCP_INFO), within the
          room above the reserve, and hands the listener back to the group's set
          once the queue is empty and none is in flight; the last ring closes it. An
          accept left waiting on an empty queue, because another ring took the
          connection, is cancelled again.
        name: takeQueues
        recv: rr *uRing
      - doc: takeQueue is takeQueues' step on listener i, fd.
        name: takeQueue
        params: i, fd int
        recv: rr *uRing
      - doc: |-
          armTake arms n single-shot accepts on listener i, fd, for the drain's take,
          and says how many the SQ had room for.
        name: armTake
        params: i, fd, n int
        recv: rr *uRing
        results: int
      - doc: |-
          used is how many direct-descriptor entries the ring holds, draining slots
          included: an index stays the kernel's until its close completes.
        name: used
        recv: rr *uRing
        results: int
      - doc: |-
          pace pauses accepting under the reserve and resumes at twice it. The
          reserve is acceptReserve entries, an eighth of a smaller table, and at
          least one: a full table pauses whatever its size.
        name: pace
        recv: rr *uRing
      - doc: |-
          reapAll reaps the ring's CQ until it is empty, a batch at a time, and
          flushes an overflow the kernel held back.
        name: reapAll
        recv: rr *uRing
      - doc: handle serves one completion.
        name: handle
        params: c *cqe
        recv: rr *uRing
      - doc: onConnOp serves the completion of an operation slot issued.
        name: onConnOp
        params: op uint64, slot int32, gen uint32, c *cqe
        recv: rr *uRing
      - doc: onAccept takes a new direct descriptor into a slot and arms its recv.
        name: onAccept
        params: li int, c *cqe
        recv: rr *uRing
      - doc: |-
          countAccept counts a connection accepted on listener li in the group's
          set: the listener's queue moved, whatever becomes of the connection.
        name: countAccept
        params: li int
        recv: rr *uRing
      - doc: |-
          acceptFailed pauses the ring when an accept failed for want of entries:
          closes make room.
        name: acceptFailed
        params: res int32
        recv: rr *uRing
      - doc: |-
          takeFailed ends the ring's take on an accept failure that says the
          listener is broken, or on a lack of descriptors with no connection of the
          group left to free one; its own cancel, a connection the peer abandoned,
          an empty queue and any other lack of descriptors only wait.
        name: takeFailed
        params: res int32
        recv: rr *uRing
      - doc: |-
          refuses reports whether a connection accepted on index is closed at once:
          the watchdog drained the ring while the group serves, MaxConns is reached,
          or the index is past the table. The group's drain adds no refusal of its
          own: an accept that completed as its cancel crossed it, or one the drain's
          take armed, is served unless MaxConns is reached, as at any time.
        name: refuses
        params: index uint32
        recv: rr *uRing
        results: bool
      - doc: orphanClose closes a direct descriptor no slot owns.
        name: orphanClose
        params: index uint32
        recv: rr *uRing
      - doc: armRecv arms slot's multishot recv on the roomiest group, counted.
        name: armRecv
        params: slot int32
        recv: rr *uRing
      - doc: |-
          roomiest is the group with the most buffers handed to the kernel beyond
          the recvs armed on it and groupSlack, among those left still holds one of when left is
          given; -1 when none does. A recv armed on a group with room has a buffer of
          its own there when every connection sends at once: a multishot recv stays
          on its group, so a group armed past its buffers starves at each burst
          however many the other groups hold (ADR 0203 §D2).
        name: roomiest
        params: left []int
        recv: rr *uRing
        results: int
      - doc: armRecvOn arms slot's multishot recv on buffer group g, counted.
        name: armRecvOn
        params: slot int32, g int
        recv: rr *uRing
      - doc: setEpoch records the closes count slot's recv was armed at, or noEpoch.
        name: setEpoch
        params: slot int32, epoch uint64
        recv: rr *uRing
      - doc: owns reports whether user_data's generation is slot's.
        name: owns
        params: slot int32, gen uint32
        recv: rr *uRing
        results: bool
      - doc: onRecv delivers received bytes and keeps the multishot armed.
        name: onRecv
        params: slot int32, gen uint32, c *cqe
        recv: rr *uRing
      - doc: |-
          takeBuf places the bytes a recv completion received in rr.segs, one
          slice a buffer — several for a bundle (ADR 0205) —, none without a
          buffer, and queues each buffer to go back after the batch once the kernel
          is done with it: incrementally consumed, the last only on a completion
          without BUF_MORE (ADR 0204).
        name: takeBuf
        params: c *cqe
        recv: rr *uRing
      - doc: |-
          recvCancelled re-arms the recv of a connection still open whose recv was
          cancelled and ended.
        name: recvCancelled
        params: slot int32, more bool
        recv: rr *uRing
      - doc: |-
          recvBytes delivers the bytes a completion received, rr.segs, to an open
          connection, buffer by buffer as split reads, and re-arms its recv when the
          multishot ended.
        name: recvBytes
        params: slot int32, more bool
        recv: rr *uRing
      - doc: |-
          recvStarved queues an open connection whose recv ran out of buffers, to
          be re-armed as buffers come back; past the bounded queue it fails.
        name: recvStarved
        params: slot int32
        recv: rr *uRing
      - doc: |-
          recvEOF marks an open connection's peer done: it settles at the end of the
          batch, its output still leaving.
        name: recvEOF
        params: slot int32
        recv: rr *uRing
      - doc: "failLive fails slot with errno unless it already finished: only once."
        name: failLive
        params: slot, errno int32
        recv: rr *uRing
      - doc: onSend advances slot's flight, resubmitting what a short send left.
        name: onSend
        params: slot int32, gen uint32, c *cqe
        recv: rr *uRing
      - doc: |-
          sendProgress records n bytes of slot's flight sent. A short send resubmits
          the rest of the same flight, never grown, and reports true; otherwise the
          flight is released and an alive connection is flushed again.
        name: sendProgress
        params: slot, n int32
        recv: rr *uRing
        results: bool
      - doc: opDone counts a cancel's completion.
        name: opDone
        params: slot int32, gen uint32
        recv: rr *uRing
      - doc: |-
          maybeClose closes a dead slot's direct descriptor once no operation of it
          remains in flight: only then can the kernel not hand the index out again
          while a completion for it is still coming.
        name: maybeClose
        params: slot int32
        recv: rr *uRing
      - doc: onClose releases the slot whose direct descriptor closed.
        name: onClose
        params: slot int32, gen uint32
        recv: rr *uRing
      - doc: onWake runs the posted operations.
        name: onWake
        params: c *cqe
        recv: rr *uRing
      - doc: onFan resets the secondaries' eventfd.
        name: onFan
        params: c *cqe
        recv: rr *uRing
      - doc: |-
          returnBuffers gives the batch's buffers back to the kernel, then re-arms
          the recvs that ran out, as many as the kernel holds buffers for.
        name: returnBuffers
        recv: rr *uRing
      - doc: |-
          provide hands the kernel buffers it never had when the ring runs short:
          a recv found its ring empty since the last look — each such ENOBUFS is one
          buffer the burst lacked —, or the ring holds under a quarter of those
          provided. It grows by as many as recvs starved, bufsStep at least, up to
          the ring's count and within what is left of the loop's budget, and never
          gives any back: a ring's buffers follow the most it had out at once, its
          live connections' bursts, rather than its table (ADR 0201 §D1, ADR 0203
          §D2).
        name: provide
        recv: rr *uRing
      - doc: |-
          credit counts bids from to to-1, just handed to the kernel, in their
          groups.
        name: credit
        params: from, to uint32
        recv: rr *uRing
      - doc: |-
          giveBack adds each buffer the batch handed out back to the ring, filled
          with staleFill under test, and publishes them once.
        name: giveBack
        recv: rr *uRing
      - doc: |-
          rearmStarved re-arms one starved recv per buffer the kernel holds, the
          oldest first, each on the group with the most buffers not yet promised; a
          recv re-armed on an empty ring would only fail again. inRing counts a
          buffer out only once its completion is reaped, so the completions still
          in the CQ are taken off first — each may hold one —, and nothing is
          re-armed while the kernel holds completions back (overflow): re-armed on
          buffers already gone, a backlog of tens of thousands starved over and over
          (ADR 0203 §D2).
        name: rearmStarved
        recv: rr *uRing
      - doc: |-
          flush implements driver: the output becomes the flight, and the flight is
          sent. The flight never grows while the kernel holds it.
        name: flush
        params: r *ring, slot int32
        recv: rr *uRing
      - doc: sendFlight submits the unsent rest of slot's flight.
        name: sendFlight
        params: slot int32
        recv: rr *uRing
      - doc: |-
          shutdown implements driver. Every close goes the same way, whoever asked
          for it, the peer included: shutdown(SHUT_RDWR) on the descriptor, and the
          close once the count of operations in flight reaches zero (maybeClose).

          The shutdown is what tells the peer. Before 6.13 a direct descriptor's
          close only hangs its file on the table's current resource node, and nodes
          are put strictly in order: one idle connection whose recv was armed early
          holds the file of every later close, and with it the FIN (io_uring/rsrc.c,
          io_rsrc_node_ref_zero, until 6.13 gave each file a node of its own). The
          shutdown sends the FIN at once, whatever the put does later; a peer that
          closed first is shut down too, or the socket would sit in CLOSE_WAIT and
          its peer in FIN_WAIT2 until the put.

          The shutdown also ends every operation still on the socket, so no cancel
          follows it (ADR 0200 §D2). inet_shutdown sets sk_shutdown and calls
          sk_state_change whatever the state, TCP_CLOSE included
          (net/ipv4/af_inet.c, 6.8 to 7.0), which wakes every waiter of the socket:
          the recv retries and ends on zero, a send waiting for room fails with
          EPIPE. A cancel by descriptor, which the close hard-linked behind the
          shutdown before, walks every bucket of the ring's poll table at each step
          (io_uring/poll.c, io_poll_file_find) and every pending io-wq work: one
          costs every armed request of the ring, a drain of n connections n², and
          60 000 idle connections took 249 s to stop. Should an operation outlive
          the shutdown all the same, closeBackstop cancels it by user_data, which
          looks one hash bucket up, after closeBackstopTicks. The shutdown is
          counted and never skips its completion: the close is due when the count
          reaches zero, not when the recv ends.
        name: shutdown
        params: r *ring, slot int32
        recv: rr *uRing
      - doc: |-
          closeBackstop cancels, by user_data, the recv and the send of every slot
          whose shutdown was issued closeBackstopTicks ago and that still waits on
          an operation: the shutdown ends them (uRing.shutdown), so this only bounds
          a close the kernel would otherwise hold forever. The slots wait in the
          order their shutdowns were issued, so the walk stops at the first not due.
        name: closeBackstop
        recv: rr *uRing
      - doc: |-
          compactClosing drops the closes closeBackstop looked at: all of them once
          every one was, or, on a ring that closes faster than the backstop's delay
          and so never empties the queue, the looked-at prefix once it is most of
          the queue. The queue then holds about a delay's worth of closes, never
          one entry per close for the ring's life.
        name: compactClosing
        recv: rr *uRing
      - doc: |-
          backstop cancels the recv, and the send in flight, of w's slot when it is
          still the same connection and still waits on an operation. It reports
          false when the SQ had no room.
        name: backstop
        params: w closeWait
        recv: rr *uRing
        results: bool
      - doc: |-
          cancelOp cancels slot's operation op by its user_data, counted, and
          reports false when the SQ had no room.
        name: cancelOp
        params: slot int32, op uint64
        recv: rr *uRing
        results: bool
      - doc: |-
          sweep bounds the files a direct descriptor's close leaves pinned where the
          put is deferred (sweepOn, before 6.13): a closed socket, its inode and its
          file wait for every recv armed before the close, and an idle connection's
          multishot recv never completes by itself, so with churn and one old
          keep-alive the pinned sockets would grow without bound. Each costs about
          3.6 KiB of kernel slab and no descriptor (the TCP object, its socket inode,
          its file and its dentry, read from /proc/slabinfo on 6.8 and 6.12; the
          package's CLAUDE.md has the sizes).

          A pass starts once the closes since the last one started reach a quarter
          of the table, 8192 at least, or sweepEvery ticks after the last with at
          least one close. It walks the table in at most sweepTicks ticks, sweepScan
          slots a tick at least, and cancels every recv armed before the pass began
          and before a close; recvCancelled arms each again under the current node,
          so the older nodes drain and their files are put. Pinned sockets stay
          under that threshold plus one second of closes, and a pass costs at most
          one cancel and one re-arm per open connection, so at most four of each per
          close. Bytes that arrive between the cancel and the re-arm wait in the
          socket and are read by the new recv: nothing is lost.
        name: sweep
        recv: rr *uRing
      - doc: |-
          sweepDue reports whether a sweep pass is due at tick: enough closes since
          the last one started, or its period elapsed with at least one.
        name: sweepDue
        params: tick int64
        recv: rr *uRing
        results: bool
      - doc: |-
          cancelOld cancels slot's recv when it was armed before the pass began and
          before a close. It reports false when the SQ had no room.
        name: cancelOld
        params: slot int32
        recv: rr *uRing
        results: bool
      - doc: |-
          unread implements driver. A direct descriptor has no process descriptor
          to ask SIOCINQ of, so it is never evicted blind: it reports unread. A
          process descriptor is asked, as epoll asks it.
        name: unread
        params: r *ring, slot int32
        recv: rr *uRing
        results: bool
      - doc: |-
          watchdog re-arms an accept that looks stalled, and drains a ring whose
          accept stays stalled. It acts on an observable stall only: the accept armed
          and not paused, the listener's queue not empty, and no accept completion
          for watchdogTicks — on this ring, nor on any other ring of the group for
          that listener. Several rings arm accepts on one listener and the kernel
          hands each connection to one of them: a ring whose accepts lose the race
          for a while sees no completion while the queue moves, and judging it alone
          drained healthy rings one after the other, the last one left taking every
          connection until its table filled (ADR 0200 §D1).
        name: watchdog
        recv: rr *uRing
      - doc: |-
          stalledOn reports whether listener i, fd, stalls for this ring: an accept
          armed, connections queued, and no accept on it by any ring of the group
          since the watchdog last looked. A queue that moved starts the window and
          the re-arms over.
        name: stalledOn
        params: i, fd int
        recv: rr *uRing
        results: bool
    name: uRing
  - doc: |-
      closeWait is a slot whose close waits on its shutdown: its generation then,
      and the tick its backstop is due at.
    fields:
      - name: slot
        type: int32
      - name: gen
        type: uint32
      - name: at
        type: int64
    kind: struct
    name: closeWait
  - doc: "uLoop is one loop on io_uring: one thread owns every ring."
    fields:
      - name: lp
        type: "*loop"
      - name: rings
        type: "[]*uRing"
      - name: lfds
        type: "[]int"
      - doc: set is the group's hold on the listeners through the drain.
        name: set
        type: "*listenerSet"
      - name: hooks
        type: loopHooks
      - doc: |-
          wakefd is the Post eventfd, polled by the primary ring; fanfd the
          secondary rings' completion eventfd, polled by the primary too.
        name: wakefd
        type: int
      - name: fanfd
        type: int
      - doc: wakeMu orders a wake against the eventfd's close.
        name: wakeMu
        type: sync.Mutex
      - name: evClosed
        type: bool
      - name: drainReq
        type: atomic.Bool
      - name: stopReq
        type: atomic.Bool
      - name: tid
        type: int
      - doc: flags is the setup flags the probe settled on; stage the stage reached.
        name: flags
        type: uint32
      - name: stage
        type: string
      - doc: |-
          direct is whether connections live in the rings' direct-descriptor
          tables (the probe's release check passed) or in the process table.
        name: direct
        type: bool
      - doc: sw is what the group may use; rep what the probe found (ADR 0189).
        name: sw
        type: capSwitches
      - name: rep
        type: capReport
      - doc: |-
          primary and secondary are the setup flags of ring 0, the one the
          thread waits on, and of the others: DEFER_TASKRUN only on the primary
          (P3a), the others posting their completions themselves (COOP).
        name: primary
        type: uint32
      - doc: |-
          primary and secondary are the setup flags of ring 0, the one the
          thread waits on, and of the others: DEFER_TASKRUN only on the primary
          (P3a), the others posting their completions themselves (COOP).
        name: secondary
        type: uint32
      - doc: |-
          uses is what the probe settled the rings use; registered is how many
          rings are registered with the thread.
        name: uses
        type: ringUses
      - name: registered
        type: int
      - doc: |-
          reaped is how many completions the last batch reaped, every ring
          together, arrived how many of them carried a connection's bytes;
          spacing is the moving average of the time between two arrivals,
          lastArrival when the last batch that had some started: what decides
          whether the next wait is grouped (ADR 0202).
        name: reaped
        type: uint64
      - name: arrived
        type: uint64
      - name: spacing
        type: time.Duration
      - name: lastArrival
        type: time.Duration
      - doc: |-
          incRefused is the kernel's refusal of IOU_PBUF_RING_INC to a ring of
          the loop, zero while none refused it.
        name: incRefused
        type: syscall.Errno
      - doc: |-
          bufBytes is the bytes of provided buffers the loop's rings handed
          their kernels so far, bounded by bufBudget (bufBudgetFor).
        name: bufBytes
        type: uint64
    kind: struct
    methods:
      - doc: |-
          probeBundle decides whether the loop's recvs are bundles
          (IORING_RECVSEND_BUNDLE): the group opted into uring-recv-bundle (class
          A-code), the operator did not switch it off, the kernel advertises IORING_FEAT_RECVSEND_BUNDLE, and on a ring of
          its own one bundle recv of bundleProbeBytes fills both of two buffers set
          up as the serving rings' are. A kernel that refuses the flag (EINVAL) or
          fills one buffer only reports the capability absent: through 6.14 a
          buffer ring consumed incrementally hands a bundle one buffer
          (io_ring_buffers_peek's nr_avail = 1 under IOBL_INC, io_uring/kbuf.c
          v6.12 to v6.14, gone in v6.15), which a bundle gains nothing from (ADR
          0205). It runs on the loop's thread, after the rings are built.
        name: probeBundle
        recv: ul *uLoop
      - doc: |-
          bundleRefusal runs the bundle probe and says why bundles are refused, ""
          when one spanned both buffers.
        name: bundleRefusal
        recv: ul *uLoop
        results: string
      - doc: |-
          probe runs stages 1 to 3 on throwaway rings, on this locked thread from
          setup to close (ADR 0189): io_uring_setup with every flag the switches
          allow, giving them up one by one on EINVAL (setupDrops); the features;
          REGISTER_PROBE for every op this backend issues; RING_FDS registered and
          unregistered before the close; SQ_REWIND's partial submit. It settles the
          primary's and the secondaries' flags and fills the report.
        name: probe
        recv: ul *uLoop
        results: error
      - doc: |-
          openDescending opens the probe's ring with every setup flag the switches
          allow and gives them up in setupDrops' order while the kernel answers
          EINVAL, recording each one given up as absent. It returns the ring and the
          flags it was opened with.
        name: openDescending
        recv: ul *uLoop
        results: "*uring, uint32, error"
      - doc: |-
          probeFlags is the first setup the probe tries: every class A-code flag the
          operator left on, SQ_REWIND only with NO_SQARRAY, which it requires, and
          DEFER_TASKRUN in place of COOP_TASKRUN.
        name: probeFlags
        recv: ul *uLoop
        results: uint32
      - doc: |-
          giveUp drops flag from flags after the kernel refused it, reporting the
          capability it names absent; DEFER_TASKRUN given up makes the ring
          cooperative again.
        name: giveUp
        params: flags, flag uint32, name corenet.Capability, errno syscall.Errno
        recv: ul *uLoop
        results: uint32
      - doc: |-
          probeRingFDs registers the probe's ring with this thread and unregisters
          it before the ring closes: a ring left registered outlives its close.
        name: probeRingFDs
        params: probed *uring
        recv: ul *uLoop
      - doc: |-
          rewindSelfTest checks SQ_REWIND's contract on the probe's ring: two NOPs
          filled from SQE 0, one submitted, then the one left moved to SQE 0 and
          submitted, each completion carrying its own user_data. A kernel that read
          the head instead of SQE 0 would complete the first twice.
        name: rewindSelfTest
        params: probed *uring
        recv: ul *uLoop
        results: bool
      - doc: |-
          settle derives the serving flags from what setup accepted and reports the
          setup capabilities. found is the probe ring's flags, rewind whether
          SQ_REWIND passed its self-test, features the kernel's.
        name: settle
        params: found uint32, rewind bool, features uint32
        recv: ul *uLoop
      - doc: |-
          reportMinTimeout is class B's MIN_TIMEOUT row: what the features say,
          never turned on (minWaitUsec stays zero). The grouped wait bounds its
          timeout instead (ADR 0199 §D3): what min_wait_usec does once its window
          passed empty differs across the kernels that advertise it.
        name: reportMinTimeout
        params: features uint32
        recv: ul *uLoop
      - doc: |-
          reportSelfTest records what the self-test proved: multishot recv and the
          buffer ring served the payload, and the release check chose the mode.
        name: reportSelfTest
        params: direct bool
        recv: ul *uLoop
      - doc: |-
          registerRing registers a serving ring with this thread when RING_FDS is
          on, at most ringFDsMax a thread: a ring past them is entered by its
          descriptor, which the report says.
        name: registerRing
        params: u *uring
        recv: ul *uLoop
      - doc: wake writes the Post eventfd.
        name: wake
        recv: ul *uLoop
      - doc: run is the loop's thread.
        name: run
        params: wg *sync.WaitGroup, ready chan<- error, rings int
        recv: ul *uLoop
      - doc: setup runs the staged probe on this thread, then builds the rings.
        name: setup
        params: rings int
        recv: ul *uLoop
        results: error
      - doc: |-
          build creates the Post queue, the two eventfds and every ring, and arms
          the primary's polls. sweep is whether the rings sweep deferred puts.
        name: build
        params: rings int, sweep bool
        recv: ul *uLoop
        results: error
      - doc: |-
          newRing builds ring i: its io_uring, its sparse table, its buffers, and
          its accepts. sweep is whether it sweeps deferred puts.
        name: newRing
        params: i int, sweep bool
        recv: ul *uLoop
        results: "*uRing, error"
      - doc: |-
          setupBufs gives ring u its provided buffers, consumed incrementally
          (IOU_PBUF_RING_INC) unless the operator switched it off or the kernel
          refused it to a ring of the loop before: the first refusal settles the
          loop's rings, and the report (ADR 0204).
        name: setupBufs
        params: u *uring
        recv: ul *uLoop
        results: syscall.Errno
      - doc: |-
          reportPbufInc records what the rings' buffer rings settled:
          IOU_PBUF_RING_INC on, or absent with the kernel's refusal. A switched-off
          row stays disabled: the flag was never asked for.
        name: reportPbufInc
        recv: ul *uLoop
      - doc: |-
          bufShape is a ring's provided buffers: how many it may have, their size,
          and how many it starts with; or a test's tiny buffer ring, all of it from
          the start.
        name: bufShape
        recv: ul *uLoop
        results: bufs, size, first uint32
      - doc: |-
          registerFan registers the secondaries' eventfd as ring i's CQ notifier,
          never the Post eventfd; the primary, ring 0, needs none.
        name: registerFan
        params: i int, u *uring
        recv: ul *uLoop
        results: error
      - doc: |-
          registerTable registers ring u's sparse direct-descriptor table of n
          entries, when connections are direct descriptors.
        name: registerTable
        params: u *uring, n uint32
        recv: ul *uLoop
        results: error
      - doc: |-
          slotSpace is how many numbers slotOf maps: the table's entries for direct
          descriptors, every process descriptor below RLIMIT_NOFILE otherwise.
        name: slotSpace
        params: table uint32
        recv: ul *uLoop
        results: int
      - doc: onFD adapts an SQE filled for a direct descriptor to the loop's mode.
        name: onFD
        params: s *sqe
        recv: ul *uLoop
      - doc: "opens reports whether ring i may accept: every ring before it is full."
        name: opens
        params: i int
        recv: ul *uLoop
        results: bool
      - doc: |-
          queuesTaken reports whether every ring of the loop handed every listener
          back.
        name: queuesTaken
        recv: ul *uLoop
        results: bool
      - doc: "serve is the loop: one wait on the primary, every ring reaped, one batch."
        name: serve
        recv: ul *uLoop
      - doc: |-
          waitArgs is the next wait's timeout and completions: the tick and one, or,
          while the completions come often enough (busy), the grouped wait —
          sz.batchWaitMin completions or sz.batchWait, whichever comes first (ADR
          0199, ADR 0202). A loop draining waits plainly: the drain is paced by the
          tick.
        name: waitArgs
        params: tick, grouped *kernelTimespec
        recv: ul *uLoop
        results: "*kernelTimespec, uint32"
      - doc: |-
          busy reports whether a grouped wait would gather more than one arrival:
          the last batch reaped batchWaitFrom completions or more, or it reaped some
          and the arrivals come, on average, at least two within the grouped wait's
          bound. Below that a grouped window is as likely to hold one arrival as
          none, and wakes the loop as often as the plain wait does.
        name: busy
        recv: ul *uLoop
        results: bool
      - doc: |-
          woke folds the batch's arrivals into spacing: the time since the last batch
          that had some, shared among them. A batch with none — sends completing, the
          tick — says nothing about how often requests come.
        name: woke
        recv: ul *uLoop
      - doc: |-
          batch is one iteration: the wait on the primary, every ring reaped, the
          drain, the timers, OnBatchEnd, the buffers returned and the yield.
        name: batch
        params: ts *kernelTimespec, want uint32, tick *kernelTimespec
        recv: ul *uLoop
      - doc: live is the loop's open connections and slots still held by the kernel.
        name: live
        recv: ul *uLoop
        results: int
      - doc: bufLeft is the bytes of buffers the loop may still hand its rings.
        name: bufLeft
        recv: ul *uLoop
        results: uint64
      - doc: control applies the group's drain.
        name: control
        recv: ul *uLoop
      - doc: |-
          startDrain begins the group's drain on every ring: its accepts in flight
          cancelled, a ring the watchdog drained already set to take nothing.
        name: startDrain
        recv: ul *uLoop
      - doc: |-
          closeAll fails every open connection as the loop stops, and lets the
          cancels and closes they issue complete, a bounded time.
        name: closeAll
        recv: ul *uLoop
      - doc: teardown releases the rings, the eventfds and the slab.
        name: teardown
        recv: ul *uLoop
      - doc: |-
          selfTest is the probe's last stage: on a ring of its own, a multishot
          accept into a direct descriptor on a loopback listener, a connection, and
          a multishot recv that must deliver the payload through the buffer ring.
          Any failure, or a second without the completions, falls back to epoll.

          It then runs the release check (releases): whether the loop's close, a
          shutdown first, tells the peer at once on a direct descriptor, and whether
          a close alone would leave the socket pinned. It reports the first as
          direct and the second as deferred.
        name: selfTest
        params: flags uint32
        recv: ul *uLoop
        results: direct, deferred bool, err error
    name: uLoop
  - doc: ringUses is what a loop's rings use beyond their setup flags.
    fields:
      - doc: |-
          multishot is whether recvs are multishot; ringFDs whether rings are
          registered with the thread.
        name: multishot
        type: bool
      - doc: |-
          multishot is whether recvs are multishot; ringFDs whether rings are
          registered with the thread.
        name: ringFDs
        type: bool
      - doc: |-
          recvFlags are ioprio flags every recv carries: recvBundle when a recv
          fills several buffers in one completion (ADR 0205).
        name: recvFlags
        type: uint16
    kind: struct
    name: ringUses
  - doc: uringRunner runs the group's io_uring loops.
    fields:
      - name: loops
        type: "[]*uLoop"
      - name: wg
        type: sync.WaitGroup
      - name: fin
        type: chan struct{}
      - name: lfds
        type: "[]int"
      - doc: |-
          set shares the listeners through the drain and closes, once every loop
          returned, what the drain did not.
        name: set
        type: "*listenerSet"
    kind: struct
    methods:
      - doc: drain implements runner.
        name: drain
        recv: ur *uringRunner
      - doc: stop implements runner.
        name: stop
        recv: ur *uringRunner
      - doc: wait implements runner.
        name: wait
        recv: ur *uringRunner
      - doc: done implements runner.
        name: done
        recv: ur *uringRunner
        results: <-chan struct{}
    name: uringRunner
  - doc: |-
      selfTestRun is the self-test's exchange: the ring it runs on, the direct
      descriptor the accept returned, and the bytes the recv delivered.
    fields:
      - doc: u is the self-test's own ring.
        name: u
        type: "*uring"
      - doc: index is the payload's direct descriptor, -1 before the accept.
        name: index
        type: int32
      - doc: got is what the recv delivered so far.
        name: got
        type: "[]byte"
      - doc: accepted are the release check's direct descriptors, in order.
        name: accepted
        type: "[]int32"
      - doc: |-
          done counts the release check's shutdown and cancel completions and
          the ends of its recvs; closed is its close's.
        name: done
        type: int
      - name: closed
        type: bool
      - doc: mode is how the self-test runs.
        name: mode
        type: selfTestMode
    kind: struct
    methods:
      - doc: |-
          releases is the release check. The payload's connection stays open, its
          multishot recv armed first: the oldest request of the table, as a
          keep-alive that idles is. Before 6.13 every file closed after it is put
          only once that recv completes (io_uring/rsrc.c, io_rsrc_node_ref_zero puts
          nodes in order), which an idle recv never does.

          A second connection is closed the way the loop closes: shutdown(SHUT_RDWR),
          which ends its recv, then close_direct. Its peer must read the end within
          200 ms, whatever the put does: that is direct. A third is closed without
          the shutdown, its recv cancelled then close: its peer reads no end where the
          put waits for the oldest recv, which is deferred, and the rings sweep. A
          check that cannot run judges the loop unable, which only costs capacity:
          connections live in the process table.
        name: releases
        params: port int
        recv: st *selfTestRun
        results: direct, deferred bool
      - doc: |-
          victim connects a client, waits for its accept and its armed recv, closes
          the accepted direct descriptor (after a shutdown when shut is set) and
          reports whether the client read the end within 200 ms. ok is false when
          the connection or its close never completed.
        name: victim
        params: port int, shut bool
        recv: st *selfTestRun
        results: sawEnd, ok bool
      - doc: |-
          closeAccepted closes the payload's process descriptor; a direct one goes
          with the ring.
        name: closeAccepted
        recv: st *selfTestRun
      - doc: armRecv arms the self-test's recv on res, the way the loop arms one.
        name: armRecv
        params: res int32, slot uint32
        recv: st *selfTestRun
      - doc: |-
          pump reaps the self-test's completions until done reports true or 500 ms
          are up.
        name: pump
        params: done func() bool
        recv: st *selfTestRun
      - doc: |-
          exchange reaps the self-test's completions until the payload came back
          whole, or a second is up.
        name: exchange
        recv: st *selfTestRun
      - doc: |-
          onCQE serves one self-test completion: the accept arms the recv on its
          index, the recv appends the bytes of its provided buffer.
        name: onCQE
        params: c *cqe
        recv: st *selfTestRun
      - doc: |-
          onRecv appends the bytes of a recv's provided buffer and gives the buffer
          back; a single-shot recv of the payload that ended with bytes is armed
          again.
        name: onRecv
        params: c *cqe
        recv: st *selfTestRun
      - doc: |-
          countEnd counts a release check's recv that ended, on the shutdown's end
          or its cancel: its close may go.
        name: countEnd
        params: c *cqe
        recv: st *selfTestRun
      - doc: |-
          onAccept arms a recv on every accepted index: the payload's first, then
          the release check's.
        name: onAccept
        params: res int32
        recv: st *selfTestRun
      - doc: |-
          verdict is nil once the payload came back whole, otherwise the stage that
          never completed.
        name: verdict
        recv: st *selfTestRun
        results: error
    name: selfTestRun
  - doc: selfTestMode is how the self-test runs, as the switches say.
    fields:
      - doc: |-
          fds is a self-test on process descriptors, uring-direct switched off;
          multishot whether its recv is multishot.
        name: fds
        type: bool
      - doc: |-
          fds is a self-test on process descriptors, uring-direct switched off;
          multishot whether its recv is multishot.
        name: multishot
        type: bool
    kind: struct
    name: selfTestMode
  - doc: |-
      uring is one io_uring instance: its mappings, the views into them, and its
      provided-buffer ring. It belongs to one loop thread.
    fields:
      - name: fd
        type: int
      - name: params
        type: uringParams
      - doc: ringMem is the SQ and CQ rings' single mapping; sqeMem the SQEs'.
        name: ringMem
        type: "[]byte"
      - name: sqeMem
        type: "[]byte"
      - doc: The SQ ring's fields, in the mapping.
        name: sqHead
        type: "*uint32"
      - name: sqTail
        type: "*uint32"
      - name: sqFlags
        type: "*uint32"
      - name: sqMask
        type: uint32
      - name: sqLen
        type: uint32
      - name: sqes
        type: "[]sqe"
      - doc: |-
          tail is the next SQE this thread fills; submitted the tail last handed
          to the kernel.
        name: tail
        type: uint32
      - name: submitted
        type: uint32
      - doc: The CQ ring's fields, in the mapping.
        name: cqHead
        type: "*uint32"
      - name: cqTail
        type: "*uint32"
      - name: cqMask
        type: uint32
      - name: cqLen
        type: uint32
      - name: cqes
        type: "[]cqe"
      - doc: |-
          bufMem is every buffer's mapping, by bid; bufCount how many it holds,
          bufSize the bytes of one, bufPer the entries of one group's ring.
        name: bufMem
        type: "[]byte"
      - name: bufCount
        type: uint32
      - name: bufSize
        type: uint32
      - name: bufPer
        type: uint32
      - doc: |-
          groups are the provided-buffer groups registered so far: group g
          holds bids g*bufPer to (g+1)*bufPer-1 and is registered as
          bufGroup+g, once its first bid is handed out.
        name: groups
        type: "[]pbufGroup"
      - doc: |-
          bufProvided is how many buffers, bids 0 to bufProvided-1, the kernel
          has been given so far; the others were never touched.
        name: bufProvided
        type: uint32
      - doc: |-
          bufInc is whether the groups' rings are consumed incrementally
          (IOU_PBUF_RING_INC): a buffer serves completions until one comes
          without IORING_CQE_F_BUF_MORE, each from where the last stopped,
          bufOff[bid] bytes in. incRefused is the kernel's answer when it
          refused the flag.
        name: bufInc
        type: bool
      - name: bufOff
        type: "[]uint32"
      - name: incRefused
        type: syscall.Errno
      - doc: |-
          bufPos is, per bid, the ring tail it was last added at: its entry in
          its group's ring, where a bundle that starts in it goes on.
        name: bufPos
        type: "[]uint16"
      - doc: retries counts busy submits retried.
        name: retries
        type: uint64
      - doc: |-
          setup is the flags the ring was set up with, as asked: what the kernel
          writes back into params is not read for them.
        name: setup
        type: uint32
      - doc: |-
          ringIdx is the ring's index among its thread's registered rings
          (IORING_REGISTER_RING_FDS), -1 when it is entered by descriptor.
        name: ringIdx
        type: int32
      - doc: |-
          taken sees every SQE the kernel took, on the ring's thread; nil but in
          the stop tests (loopHooks.taken).
        name: taken
        type: func(op, flags uint8, opFlags uint32)
    kind: struct
    methods:
      - doc: |-
          mapRings maps the SQ and CQ rings, one mapping under FEAT_SINGLE_MMAP, and
          the SQEs. It returns the step that failed and the kernel's errno.
        name: mapRings
        recv: u *uring
        results: step string, errno syscall.Errno
      - doc: |-
          buildViews points the ring's fields into its mappings, and maps SQ slot i
          to SQE i once and for all.
        name: buildViews
        recv: u *uring
      - doc: |-
          close releases every mapping and the ring, its registration with the
          thread first: a ring still registered stays referenced by the thread and
          outlives its close, its direct descriptors with it (P3c).
        name: close
        recv: u *uring
      - doc: |-
          get returns a zeroed SQE, submitting what is queued when the SQ is full.
          It returns nil only when the kernel takes nothing after the bounded
          retries.
        name: get
        recv: u *uring
        results: "*sqe"
      - doc: "noArray is NO_SQARRAY: there is no SQ array to fill."
        name: noArray
        recv: u *uring
        results: bool
      - doc: |-
          rewind is SQ_REWIND: the kernel takes every submission from SQE 0, so the
          pending SQEs are always sqes[0:pending] (uring.slot).
        name: rewind
        recv: u *uring
        results: bool
      - doc: |-
          deferred is DEFER_TASKRUN: completions are posted only when this thread
          enters with GETEVENTS, which every submit then does with min_complete 0.
        name: deferred
        recv: u *uring
        results: bool
      - doc: |-
          room reports whether n more SQEs fit: against the kernel's head, or,
          under SQ_REWIND, against the SQEs filled since the last submit.
        name: room
        params: n uint32
        recv: u *uring
        results: bool
      - doc: |-
          slot is the SQE the next get fills: the tail's, or, under SQ_REWIND, the
          one after those pending, the submitter filling from SQE 0.
        name: slot
        recv: u *uring
        results: "*sqe"
      - doc: |-
          consumed records got SQEs taken by the kernel. Under SQ_REWIND a partial
          submit leaves the rest at sqes[got:pending], and the kernel starts at 0
          again: they are moved down, in order, links and all.
        name: consumed
        params: got uint32
        recv: u *uring
      - doc: |-
          see hands the got SQEs the kernel just took to taken, oldest first: from
          SQE 0 under SQ_REWIND, from the last submitted tail otherwise.
        name: see
        params: got uint32
        recv: u *uring
      - doc: |-
          publish hands every filled SQE to the kernel's view of the SQ tail; under
          SQ_REWIND the tail stays zero and the count passed to enter is the view.
        name: publish
        recv: u *uring
      - doc: |-
          enterSubmit submits n SQEs: the plain submit, which inlines, when no
          flag is asked for, one with flags otherwise.
        name: enterSubmit
        params: fd int, n, flags uint32
        recv: u *uring
        results: int, syscall.Errno
      - doc: |-
          enterTarget is the fd argument and the flag of every enter: the
          registered index when the ring has one, the descriptor otherwise.
        name: enterTarget
        recv: u *uring
        results: int, uint32
      - doc: |-
          registerRing registers the ring with the calling thread
          (IORING_REGISTER_RING_FDS), the kernel picking the index. It must run on
          the thread that enters it, and unregisterRing on the same one.
        name: registerRing
        recv: u *uring
        results: syscall.Errno
      - doc: unregisterRing drops the thread's registration, if any.
        name: unregisterRing
        recv: u *uring
      - doc: pending is how many SQEs are published but not yet submitted.
        name: pending
        recv: u *uring
        results: uint32
      - doc: |-
          submit submits every pending SQE without waiting. EINTR retries; EBUSY and
          EAGAIN return so the caller reaps and retries, counted.
        name: submit
        recv: u *uring
      - doc: |-
          wait submits what is pending and blocks until want completions or the
          timeout, in one io_uring_enter with EXT_ARG. ETIME is the tick, or the
          grouped wait's bound (ADR 0199). The kernel wakes the thread once the CQ
          holds want entries past its head, or when ts runs out, and an ETIME with
          completions in the CQ returns zero (io_cqring_wait, io_uring/io_uring.c,
          6.8 to 7.0); either way the caller reaps what came. A completion already in
          the CQ makes it a submit, with no scheduler round trip, and no system call
          at all when nothing is pending (ADR 0202).
        name: wait
        params: ts *kernelTimespec, want uint32
        recv: u *uring
      - doc: ready is how many completions wait in the CQ.
        name: ready
        recv: u *uring
        results: uint32
      - doc: reap calls fn for up to max completions and advances the head past them.
        name: reap
        params: max int, fn func(c *cqe)
        recv: u *uring
        results: int
      - doc: |-
          overflowed reports a CQ the kernel had to hold back (NODROP):
          flushOverflow moves it into the CQ.
        name: overflowed
        recv: u *uring
        results: bool
      - doc: |-
          flushOverflow submits what is pending and enters with GETEVENTS and
          min_complete zero, which never blocks: the kernel moves the completions it
          held back into the CQ only on its wait path (io_cqring_wait, 6.8 to 7.0),
          never on a plain submit. A secondary ring is otherwise entered only to
          submit, so a CQ that overflowed there stayed held — every close of a
          drain on that ring waiting on a completion it never saw.
        name: flushOverflow
        recv: u *uring
      - doc: |-
          setupBuffers maps count buffers of size bytes, registers the ring of their
          first group, and hands the kernel the first first of them; growBufs hands
          it the others, registering each further group as its first bid goes out.
          count must be a power of two, at most maxBufs; a group holds defaultBufs
          of them, or count when that is fewer. The mapping is private and
          anonymous, so a buffer the kernel was never given is no resident page, and
          a group never needed costs no kernel memory. With inc the rings are asked
          for incremental consumption; a kernel that refuses it (EINVAL, before
          6.12) gets the rings as before, the refusal kept in incRefused.
        name: setupBuffers
        params: count, size, first uint32, inc bool
        recv: u *uring
        results: syscall.Errno
      - doc: |-
          growBufs hands the kernel up to n buffers it never had, in bid order,
          published once, and says how many. Every bid is in its group's ring at most
          once, so a ring never holds more than its entries. A group whose ring the
          kernel refuses ends the growth there: the ring keeps the groups it has.
        name: growBufs
        params: n uint32
        recv: u *uring
        results: uint32
      - doc: addGroup registers the ring of the next group and maps it.
        name: addGroup
        recv: u *uring
        results: syscall.Errno
      - doc: |-
          mapBufRing registers group bgid's ring of count entries, with flags, and
          maps it. It asks the kernel to allocate it (IOU_PBUF_RING_MMAP, 6.4): a
          ring in user pages is pinned and charged to RLIMIT_MEMLOCK, which an
          unprivileged process runs out of after a few rings (CI's non-root lane
          did). A kernel that does not know the flag (EINVAL) gets the ring in user
          pages; with flags, an EINVAL is returned instead, since the kernel may
          refuse those as well (a kernel with IOU_PBUF_RING_INC has MMAP).
        name: mapBufRing
        params: bgid uint16, count uint32, flags uint16
        recv: u *uring
        results: "[]byte, syscall.Errno"
      - doc: bufEntries views group g's buffer ring.
        name: bufEntries
        params: g int
        recv: u *uring
        results: "[]uringBuf"
      - doc: groupOf is the group buffer bid belongs to.
        name: groupOf
        params: bid uint16
        recv: u *uring
        results: int
      - doc: |-
          spans appends to segs the n bytes a completion received, buffer by
          buffer from bid in its ring's order, and to bids each one's buffer, and
          says whether the kernel keeps the last (bufMore, incremental only): it is
          done with every other one. Without a bundle the bytes fit in bid. Under
          incremental consumption the first buffer's bytes start where its previous
          completion stopped, and the kernel moves on from it once full
          (io_kbuf_inc_commit, io_uring/kbuf.c, 6.12 to 7.0): IORING_CQE_F_BUF_MORE
          on a bundle's completion speaks of its last buffer, its bid of the first
          (__io_put_kbufs). Without it a buffer is consumed whole whatever it took,
          a bundle's buffers filled in turn (ADR 0205).
        name: spans
        params: bid uint16, n int32, bufMore bool, segs [][]byte, bids []uint16
        recv: u *uring
        results: "[][]byte, []uint16, bool"
      - doc: "nextBid is the buffer at the ring entry after bid's: a bundle's next."
        name: nextBid
        params: bid uint16
        recv: u *uring
        results: uint16
      - doc: buf returns buffer bid's bytes.
        name: buf
        params: bid uint16
        recv: u *uring
        results: "[]byte"
      - doc: |-
          addBuf writes buffer bid at its group's ring's next entry, unpublished.
          Entry 0's bid shares its word with the ring's tail, so it is kept in
          shadowBid and written with the tail by publishBufs.
        name: addBuf
        params: bid uint16
        recv: u *uring
      - doc: |-
          publishBufs makes every added buffer the kernel's: for each group with
          one, a 32-bit store of entry 0's bid and the tail, its ring's last two
          bytes, after every entry field was written. The word is little-endian on
          every architecture this file builds for: bid in the low half, tail in the
          high one.
        name: publishBufs
        recv: u *uring
      - doc: registerSparse registers a sparse direct-descriptor table of n entries.
        name: registerSparse
        params: n uint32
        recv: u *uring
        results: syscall.Errno
      - doc: supports asks REGISTER_PROBE whether every op of ops is supported.
        name: supports
        params: ops ...uint8
        recv: u *uring
        results: bool, syscall.Errno
    name: uring
  - doc: |-
      pbufGroup is one provided-buffer group: its ring's mapping, its tail, and
      entry 0's bid, written with the tail; dirty is a buffer added since the
      tail was last published.
    fields:
      - name: ring
        type: "[]byte"
      - name: tail
        type: uint16
      - name: shadowBid
        type: uint16
      - name: dirty
        type: bool
      - doc: |-
          order is the bid at each entry of the ring, as last added: a bundle's
          buffers after its first are the entries after the first's (ADR 0205).
        name: order
        type: "[]uint16"
    kind: struct
    name: pbufGroup
  - doc: |-
      wheel is a hashed timer wheel over one ring's connection slots: one timer
      per slot, armed at an absolute tick, in index-linked buckets, so it holds
      no pointer and arming costs no allocation.
    fields:
      - doc: buckets holds the first slot of each bucket.
        name: buckets
        type: "[]int32"
      - doc: |-
          next and prev link a bucket's slots; at is each slot's armed tick, zero
          when unarmed.
        name: next
        type: "[]int32"
      - name: prev
        type: "[]int32"
      - name: at
        type: "[]int64"
      - doc: now is the last tick the wheel advanced to.
        name: now
        type: int64
      - doc: |-
          due collects the slots one advance fires, reused across advances: the
          buckets are unlinked before any fires, so a callback that arms or
          disarms another slot never walks a list under the wheel's feet.
        name: due
        type: "[]int32"
    kind: struct
    methods:
      - doc: |-
          arm sets slot's timer to fire at tick, replacing any previous one. A tick
          at or before now fires on the next advance.
        name: arm
        params: slot int32, tick int64
        recv: w *wheel
      - doc: disarm clears slot's timer; an unarmed slot is left as it is.
        name: disarm
        params: slot int32
        recv: w *wheel
      - doc: |-
          reserve gives the wheel room for c slots, so grow appends without
          reallocating: the wheel's arrays follow the ring's table step by step.
        name: reserve
        params: c int
        recv: w *wheel
      - doc: grow extends the wheel to n slots, the new ones unarmed.
        name: grow
        params: n int
        recv: w *wheel
      - doc: armed reports slot's armed tick, zero when none.
        name: armed
        params: slot int32
        recv: w *wheel
        results: int64
      - doc: |-
          advance moves the wheel to tick now and calls fire for every slot whose
          tick has come, disarming it first, so fire may arm it again. It walks each
          bucket passed once at most.
        name: advance
        params: now int64, fire func(slot int32)
        recv: w *wheel
    name: wheel
vars:
  - doc: |-
      loopCaps are the capabilities a loop group reports, class A-kernel first.
      tcp-nodelay is server's socket probe, merged into the report by server.
    items:
      - name: loopCaps
        value: |-
          [...]capClass{
          	{corenet.CapabilityURingMultishotRecv, classKernel},
          	{corenet.CapabilityURingPbuf, classKernel},
          	{corenet.CapabilityURingPbufInc, classKernel},
          	{corenet.CapabilityURingDirect, classKernel},
          	{corenet.CapabilityEpollExclusive, classKernel},
          	{corenet.CapabilityURingDeferTaskrun, classCode},
          	{corenet.CapabilityURingNoSQArray, classCode},
          	{corenet.CapabilityURingRingFDs, classCode},
          	{corenet.CapabilityURingSQRewind, classCode},
          	{corenet.CapabilityURingRecvBundle, classCode},
          	{corenet.CapabilityURingSendZC, classB},
          	{corenet.CapabilityURingBundle, classB},
          	{corenet.CapabilityBusyPoll, classB},
          	{corenet.CapabilityURingZCRX, classB},
          	{corenet.CapabilityReuseportCBPF, classB},
          	{corenet.CapabilityTCPDeferAccept, classB},
          	{corenet.CapabilityURingMinTimeout, classB},
          }
    name: loopCaps
  - doc: |-
      setupDrops is the order in which the probe gives up setup flags on EINVAL,
      the newest first, so a flag is never dropped before one that requires it:
      SQ_REWIND before NO_SQARRAY (REWIND⇒NO_SQARRAY), DEFER_TASKRUN before
      SINGLE_ISSUER (DEFER⇒SINGLE).
    items:
      - name: setupDrops
        value: |-
          [...]struct {
          	flag uint32
          	name corenet.Capability
          }{
          	{setupSQRewind, corenet.CapabilityURingSQRewind},
          	{setupNoSQArray, corenet.CapabilityURingNoSQArray},
          	{setupDeferTaskrun, corenet.CapabilityURingDeferTaskrun},
          	{setupSingleIssuer, ""},
          }
    name: setupDrops
  - doc: |-
      selfTestPayload is what the loopback self-test sends and expects back
      through a provided buffer.
    items:
      - name: selfTestPayload
        value: "[]byte(\"kitsunium net/loop io_uring self-test\")"
    name: selfTestPayload
