        name: set
        params: f uint8, on bool
        recv: lp *packetLane
      - doc: Handover implements PacketLane.
        name: Handover
        recv: lp *packetLane
      - doc: Stop implements PacketLane.
        name: Stop
        recv: lp *packetLane
      - doc: Done implements PacketLane.
        name: Done
        recv: lp *packetLane
        results: <-chan struct{}
      - doc: |-
          run is the lane's thread: the probe, then the batches until a stop or
          the end of a handover.

          Goroutine lifecycle: one per lane, started by StartPacket, locked to its
          OS thread; it returns once Stop is asked, or a handover drained the socket,
          and closes the lane's done last.
        name: run
        params: ready chan<- error
        recv: lp *packetLane
      - doc: |-
          setup opens the ring, probes it and self-tests it, then arms the socket's
          receive and the wake poll; it returns the failed stage and why.
        name: setup
        recv: lp *packetLane
        results: stage, why string
      - doc: |-
          openRing opens the lane's ring — COOP_TASKRUN and SINGLE_ISSUER where the
          kernel takes them —, asks REGISTER_PROBE for the lane's ops and registers
          the provided buffers; it returns the failed stage and why.
        name: openRing
        recv: lp *packetLane
        results: stage, why string
      - doc: |-
          armSocket reads the socket's family, opens the wake eventfd, asks for UDP
          GRO and arms the receive and the wake; it returns the failed stage and why.
        name: armSocket
        recv: lp *packetLane
        results: stage, why string
      - doc: |-
          mapArenas maps the reply arena, its records and the handover's buffer,
          outside the Go heap: the kernel reads them after Reply returned.
        name: mapArenas
        recv: lp *packetLane
        results: string
      - doc: |-
          selfTest arms a multishot RECVMSG on a loopback socket of its own, sends
          it one datagram and reads it back from a provided buffer: the header, the
          sender's family and the payload. It returns why it failed.
        name: selfTest
        recv: lp *packetLane
        results: string
      - doc: |-
          probeOne arms the self-test's receive on rx, sends it three bytes from tx,
          takes the first completion, then cancels the receive and reaps its end.
        name: probeOne
        params: rx, tx int
        recv: lp *packetLane
        results: cqe, string
      - doc: |-
          awaitFinals reaps the self-test's cancel and its receive's last
          completion, within probeFinalTries waits.
        name: awaitFinals
        params: ts *kernelTimespec
        recv: lp *packetLane
      - doc: armRecv arms the socket's multishot RECVMSG.
        name: armRecv
        recv: lp *packetLane
      - doc: armWake arms the multishot poll on the wake eventfd.
        name: armWake
        recv: lp *packetLane
      - doc: wake writes the lane's eventfd; any goroutine may call it.
        name: wake
        recv: lp *packetLane
      - doc: serve runs the batches until a stop, or the end of a handover.
        name: serve
        recv: lp *packetLane
      - doc: |-
          batch reaps every completion, ends the batch for the handler, sends its
          replies and gives the buffers back.
        name: batch
        recv: lp *packetLane
      - doc: |-
          endBatch calls OnBatchEnd after a batch that handed a datagram on, queues
          its replies, returns its buffers and publishes its counts.
        name: endBatch
        recv: lp *packetLane
      - doc: complete handles one completion.
        name: complete
        params: c *cqe
        recv: lp *packetLane
      - doc: "received handles a RECVMSG completion: its buffer's datagrams, handed on."
        name: received
        params: c *cqe
        recv: lp *packetLane
      - doc: |-
          deliver hands each datagram of one message to the handler: a coalesced
          one split at UDP GRO's segment size, a cut one counted and dropped, a
          datagram past the ceiling counted and dropped.
        name: deliver
        params: name, ctrl, payload []byte, flags uint32
        recv: lp *packetLane
      - doc: one hands one datagram on, or counts it past the ceiling.
        name: one
        params: from netip.AddrPort, d []byte
        recv: lp *packetLane
      - doc: |-
          control walks a message's control data: UDP GRO's segment size, returned,
          SO_RXQ_OVFL's count, added to the kernel's drops, and the destination the
          message reached, into lp.cur.
        name: control
        params: ctrl []byte
        recv: lp *packetLane
        results: int
      - doc: |-
          cmsg reads one control message: UDP_GRO's segment size, returned in place
          of seg, or SO_RXQ_OVFL's count, whose growth joins the drops.
        name: cmsg
        params: m []byte, seg int
        recv: lp *packetLane
        results: int
      - doc: |-
          Reply implements corenet.PacketLoopIO: p copied into the reply arena, sent
          after the batch, from the destination to reached in it (#972, flush).
        name: Reply
        params: to netip.AddrPort, p []byte
        recv: lp *packetLane
        results: error
      - doc: "Loop implements corenet.PacketLoopIO: the lane's index."
        name: Loop
        recv: lp *packetLane
        results: int
      - doc: |-
          flush turns the queued replies into SENDMSG SQEs: a run to one peer of one
          size — the last possibly shorter — as one UDP_SEGMENT send, at most
          gsoMaxSegments datagrams and gsoMaxBytes of payload (ADR 0192 §D5).
        name: flush
        recv: lp *packetLane
      - doc: runEnd is the end of the UDP_SEGMENT run starting at i.
        name: runEnd
        params: pend []pendingReply, i int
        recv: lp *packetLane
        results: int
      - doc: |-
          send writes one SENDMSG record for run and queues its SQE; a peer the
          socket cannot address, or a ring that takes nothing, counts the run as
          failed.
        name: send
        params: run []pendingReply
        recv: lp *packetLane
      - doc: |-
          writeControl writes run's control data into ctl and returns its length,
          whether it names a source and whether it is a UDP_SEGMENT send: the source
          first (#972), so a refused one is cut off the front (unpin), then the
          segment size of a run.
        name: writeControl
        params: ctl []byte, run []pendingReply
        recv: lp *packetLane
        results: used int, pinned, gso bool
      - doc: |-
          sent handles a SENDMSG completion: a refusal counted, GSO switched off
          on EIO, and the arena reset once nothing is in flight.
        name: sent
        params: c *cqe
        recv: lp *packetLane
      - doc: |-
          refusedSend handles record k's refusal: a source the kernel will not send
          from sent again from its own choice — reported true, still in flight —,
          anything else counted, GSO switched off on EIO.
        name: refusedSend
        params: k int, errno syscall.Errno
        recv: lp *packetLane
        results: bool
      - doc: |-
          gsoRefused handles a UDP_SEGMENT send's refusal: EIO, a device without
          checksum offload, sends one datagram a message from now on; EMSGSIZE, a
          sizing bug, is counted and GSO kept.
        name: gsoRefused
        params: errno syscall.Errno
        recv: lp *packetLane
      - doc: settle resets the reply arena once no reply is queued or in flight.
        name: settle
        recv: lp *packetLane
      - doc: |-
          publish adds the batch's counts to server's counters, each only when it
          moved: an atomic add is a barrier.
        name: publish
        recv: lp *packetLane
      - doc: |-
          beginHandover cancels the socket's receive; the batches go on until its
          final completion.
        name: beginHandover
        recv: lp *packetLane
      - doc: |-
          finishHandover reads what the socket still holds to EAGAIN, serves it,
          sends every reply, and switches UDP GRO off: nothing coalesced is left to
          a successor that may not split it (ADR 0192 §D4).
        name: finishHandover
        recv: lp *packetLane
      - doc: |-
          quiesce ends, before the ring closes, the requests that hold the socket's
          file: the armed receive is cancelled and the replies in flight complete,
          reaped within packetSendWaits waits of packetQuiesceWait. A request left to
          the ring's close keeps the file until the kernel's exit work runs it down,
          after Close has returned, and the port stays bound until then: a bind of
          the same address right after Close met EADDRINUSE (#1336's CI,
          TestPacketLoop_closeStopsLanes). Nothing is handed to the handler: the
          receive's last datagrams stay in its buffers, the lane stopping.
        name: quiesce
        recv: lp *packetLane
      - doc: |-
          cancelRecv queues the cancel of the socket's receive, when one is armed
          and the SQ has room — it has, once a batch ended.
        name: cancelRecv
        recv: lp *packetLane
      - doc: |-
          quiesceCQE is quiesce's completion handler: the receive's last completion
          disarms it, a send's leaves the flight; nothing is handed on, nothing sent
          again.
        name: quiesceCQE
        params: c *cqe
        recv: lp *packetLane
      - doc: reapCQ reaps every completion the lane's CQ holds through fn.
        name: reapCQ
        params: fn func(c *cqe)
        recv: lp *packetLane
      - doc: |-
          readOne reads one message with recvmsg(2) into the handover's buffer and
          delivers it; false at EAGAIN or on an error.
        name: readOne
        recv: lp *packetLane
        results: bool
      - doc: |-
          release closes the ring, the eventfd and the socket, and unmaps the
          arenas, once quiesce ended the requests that hold the socket.
        name: release
        recv: lp *packetLane
    name: packetLane
  - doc: |-
      postQueue is a loop's preallocated queue of posted operations, the one
      door another goroutine has into a loop (ADR 0186 §D4).

      The protocol: a poster appends under mu, then moves pending from false to
      true; only the poster that wins that CAS wakes the loop, so a burst of posts
      costs one wake-up. The loop clears pending BEFORE it drains, so a post that
      lands after the drain began either is seen by it or wins the next CAS and
      wakes the loop again. Each operation is popped under mu, so it runs once.
    fields:
      - doc: mu guards the ring below.
        name: mu
        type: sync.Mutex
      - doc: ops and args are the ring's storage, allocated once.
        name: ops
        type: "[]corenet.PostFunc"
      - name: args
        type: "[]uintptr"
      - doc: head is the next slot to pop; n how many are queued.
        name: head
        type: int
      - name: "n"
        type: int
      - doc: pending is true from a winning post to the loop's next drain.
        name: pending
        type: atomic.Bool
      - doc: closed refuses every post once the loop has stopped.
        name: closed
        type: bool
      - doc: "wake rouses the loop: an eventfd write on the native backends."
        name: wake
        type: func()
    kind: struct
    methods:
      - doc: |-
          post queues op and wakes the loop when it is the first since its last
          drain.
        name: post
        params: op corenet.PostFunc, arg uintptr
        recv: q *postQueue
        results: error
      - doc: |-
          drain runs every queued operation on the calling loop, in order. It clears
          pending first: see the type's comment.
        name: drain
        params: io corenet.LoopIO
        recv: q *postQueue
        results: int
      - doc: |-
          close refuses every later post. Operations already queued are dropped by
          the loop that stops.
        name: close
        recv: q *postQueue
    name: postQueue
  - doc: |-
      sizing is a loop group's resolved configuration: every zero of the
      LoopValue replaced by its default, the ring count derived once.
    fields:
      - doc: loops is the number of loops; loopsSource where it came from.
        name: loops
        type: int
      - name: loopsSource
        type: string
      - doc: |-
          slabBudget is each loop's slab ceiling, slabSource where it came from
          (#809); zero only in a test's hand-built sizing, read as the default.
        name: slabBudget
        type: int
      - name: slabSource
        type: string
      - doc: rings is the number of rings per loop.
        name: rings
        type: int
      - doc: ringsSource is where rings came from.
        name: ringsSource
        type: string
      - doc: tableSize is the most connections one ring holds.
        name: tableSize
        type: int
      - doc: cqBatch bounds one iteration's reaping.
        name: cqBatch
        type: int
      - doc: spillCap and outputCap are the per-connection byte ceilings.
        name: spillCap
        type: int
      - name: outputCap
        type: int
      - doc: softConns flags pressure past it; zero sets no soft bound.
        name: softConns
        type: int
      - doc: maxConns refuses past it; zero sets no ceiling.
        name: maxConns
        type: int
      - doc: rlimit is the effective RLIMIT_NOFILE soft limit.
        name: rlimit
        type: uint64
      - doc: |-
          batchWait bounds io_uring's grouped wait, zero when it is off;
          batchWaitMin is the completions it waits for.
        name: batchWait
        type: time.Duration
      - name: batchWaitMin
        type: int
      - doc: |-
          batchBudget bounds one io_uring batch's reaping, zero for none (ADR
          0206).
        name: batchBudget
        type: time.Duration
      - doc: |-
          sendZCMin is the smallest flight sent zero-copy once uring-send-zc is
          on (#969).
        name: sendZCMin
        type: int
      - doc: |-
          busyPoll is busy-poll's window and budget, used once the row is on
          (#979).
        name: busyPoll
        type: busyPollPlan
      - doc: |-
          zcrx is the queue uring-zcrx's probe registers, its area resolved
          (#980).
        name: zcrx
        type: corenet.ZCRXValue
      - doc: |-
          yield is the most serving time between two yields to the scheduler,
          zero for none: Start sets it (yieldFor), once GOMAXPROCS is read.
        name: yield
        type: time.Duration
    kind: struct
    name: sizing
  - doc: |-
      chunkRef names one chunk of the slab by size class and index, and how
      much of it is used. It holds no pointer, so the connection table that
      carries it stays pointer-free (ADR 0186 §D7).
    fields:
      - doc: idx is the chunk's index in its class, noChunk when none.
        name: idx
        type: int32
      - doc: cls is the size class.
        name: cls
        type: uint8
      - doc: off is the first byte still meaningful; len the end of the data.
        name: "off"
        type: int32
      - name: len
        type: int32
    kind: struct
    methods:
      - doc: empty reports whether the ref holds no chunk.
        name: empty
        recv: c chunkRef
        results: bool
    name: chunkRef
  - doc: |-
      slab is a loop's shared store of payload memory, cut into power-of-two
      size classes and mapped outside the Go heap (ADR 0186 §D7): what the
      kernel reads or writes never moves, and the collector scans none of it.
      It belongs to one loop, so it takes no lock.
    fields:
      - doc: classes holds each class's arenas and free chunks, smallest first.
        name: classes
        type: "[]slabClass"
      - doc: inUse is the bytes handed out; budget its ceiling.
        name: inUse
        type: int
      - name: budget
        type: int
      - doc: |-
          mapper maps a new arena; the platform's mmap, a heap slice elsewhere.
          unmap releases one, nil when the Go heap owns them.
        name: mapper
        type: func(n int) ([]byte, error)
      - name: unmap
        type: func([]byte) error
      - doc: mappedBytes is the bytes the arenas map now.
        name: mappedBytes
        type: int
    kind: struct
    methods:
      - doc: |-
          alloc returns a chunk holding at least n bytes, or false when n passes the
          largest class, the budget, or the mapping fails.
        name: alloc
        params: n int
        recv: s *slab
        results: chunkRef, bool
      - doc: grow maps one arena for c and pushes its chunks on the free stack.
        name: grow
        params: c *slabClass
        recv: s *slab
        results: bool
      - doc: free returns the chunk to its class. A ref that holds nothing is ignored.
        name: free
        params: r chunkRef
        recv: s *slab
      - doc: |-
          shrink unmaps, in each class holding two wholly free arenas or more, every
          one of them but one, at most shrinkPerTick arenas a call, highest index
          first: the loop calls it once a tick, so a burst's arenas go back within
          a second of idle and a class keeps one for the next connection (#809).
        name: shrink
        recv: s *slab
      - doc: |-
          reclaimable reports whether shrink has an arena to give back: a class
          holding two wholly free arenas or more. A loop with nothing timed sleeps
          until an event only once it is false, so a burst's arenas go back however
          quiet the loop falls, and an idle loop wakes for nothing once they have
          (#809).
        name: reclaimable
        recv: s *slab
        results: bool
      - doc: |-
          shrinkClass unmaps n of c's idle arenas and drops their chunks from the free
          stack in one pass, and says how many it unmapped.
        name: shrinkClass
        params: c *slabClass, n int
        recv: s *slab
        results: int
      - doc: unmapDropped unmaps every arena dropped marks, each a hole for the next grow.
        name: unmapDropped
        params: c *slabClass
        recv: s *slab
      - doc: release unmaps every arena, as the loop stops.
        name: release
        recv: s *slab
      - doc: bytes returns the whole chunk r names.
        name: bytes
        params: r chunkRef
        recv: s *slab
        results: "[]byte"
      - doc: data returns the meaningful bytes of r, off to len.
        name: data
        params: r chunkRef
        recv: s *slab
        results: "[]byte"
      - doc: size returns the capacity of r's chunk.
        name: size
        params: r chunkRef
        recv: s *slab
        results: int
    name: slab
  - doc: slabClass is one size class.
    fields:
      - doc: size is the chunk size; perArena how many chunks one arena holds.
        name: size
        type: int
      - name: perArena
        type: int
      - doc: |-
          arenas are the class's mappings, in index order; nil is an arena
          unmapped by shrink, its indexes held on holes for the next grow.
        name: arenas
        type: "[][]byte"
      - name: holes
        type: "[]int32"
      - doc: free is a stack of free chunk indexes.
        name: free
        type: "[]int32"
      - doc: |-
          freeIn and dropped are shrink's scratch (#809): each arena's chunks on
          the free stack, counted on the tick so the alloc and free path keeps no
          count of its own, and the arenas one pass unmaps.
        name: freeIn
        type: "[]int32"
      - name: dropped
        type: "[]bool"
    kind: struct
    methods:
      - doc: |-
          pickIdle marks in dropped up to n idle arenas of c, highest first, and
          says how many.
        name: pickIdle
        params: n int
        recv: c *slabClass
        results: int
      - doc: |-
          idleArenas counts, into freeIn, each arena's chunks on the free stack, and
          returns how many mapped arenas have every chunk there: one walk of the free
          stack on the tick, so the alloc and free path keeps no count of its own.
        name: idleArenas
        recv: c *slabClass
        results: int
    name: slabClass
