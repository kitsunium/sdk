      - doc: fill writes 0xAA over a provided buffer before it returns to the ring.
        name: fill
        type: bool
      - doc: shuffle returns a batch's buffers in a scrambled order.
        name: shuffle
        type: bool
      - doc: failStage fails the io_uring probe at the named stage.
        name: failStage
        type: string
      - doc: |-
          primaryIdle keeps io_uring's primary ring from accepting, so every
          connection lands on a secondary (P3a's wake test).
        name: primaryIdle
        type: bool
      - doc: |-
          secondaryPlain sets io_uring's secondary rings up without
          COOP_TASKRUN: the kernel then signals the thread for their task work.
