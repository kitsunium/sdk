        results: error
      - name: Close
        recv: g *Group
        results: error
      - name: State
        recv: g *Group
        results: corenet.LoopStateValue
      - name: Rejected
        recv: g *Group
        results: uint64
      - name: Live
        recv: g *Group
        results: int64
    name: Group
  - doc: runner is a backend's handle on its threads.
    kind: named
    name: runner
    underlying: |-
      interface {
      	// drain asks every loop to stop accepting and close its connections as
      	// they settle.
      	drain()
      	// stop asks every loop to close everything now.
      	stop()
      	// wait blocks until every loop's thread has returned.
      	wait()
      	// done is closed once every loop's thread has returned.
      	done() <-chan struct{}
      }
  - doc: |-
      postQueue is a loop's preallocated queue of posted operations, the one
      door another goroutine has into a loop (ADR 0186 §D4).

      The protocol: a poster appends under mu, then moves pending from false to
      true; only the poster that wins that CAS wakes the loop, so a burst of posts
      costs one wake-up. The loop clears pending BEFORE it drains, so a post that
      lands after the drain began either is seen by it or wins the next CAS and
      wakes the loop again. Each operation is popped under mu, so it runs once.
    fields:
      - doc: mu guards the ring below.
        name: mu
        type: sync.Mutex
      - doc: ops and args are the ring's storage, allocated once.
        name: ops
        type: "[]corenet.PostFunc"
      - name: args
        type: "[]uintptr"
      - doc: head is the next slot to pop; n how many are queued.
        name: head
        type: int
      - name: "n"
        type: int
      - doc: pending is true from a winning post to the loop's next drain.
        name: pending
        type: atomic.Bool
      - doc: closed refuses every post once the loop has stopped.
        name: closed
        type: bool
      - doc: "wake rouses the loop: an eventfd write on the native backends."
        name: wake
        type: func()
    kind: struct
    methods:
      - doc: |-
          post queues op and wakes the loop when it is the first since its last
          drain.
        name: post
        params: op corenet.PostFunc, arg uintptr
        recv: q *postQueue
        results: error
      - doc: |-
          drain runs every queued operation on the calling loop, in order. It clears
          pending first: see the type's comment.
        name: drain
        params: io corenet.LoopIO
        recv: q *postQueue
        results: int
      - doc: |-
          close refuses every later post. Operations already queued are dropped by
          the loop that stops.
        name: close
        recv: q *postQueue
    name: postQueue
  - doc: |-
      sizing is a loop group's resolved configuration: every zero of the
      LoopValue replaced by its default, the ring count derived once.
    fields:
      - doc: loops is the number of loops; loopsSource where it came from.
        name: loops
        type: int
      - name: loopsSource
        type: string
