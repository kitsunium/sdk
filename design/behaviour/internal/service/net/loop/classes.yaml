    kind: struct
    name: getEventsArg
  - doc: kernelTimespec is struct __kernel_timespec.
    fields:
      - name: sec
        type: int64
      - name: nsec
        type: int64
    kind: struct
    name: kernelTimespec
  - doc: probeHeader is struct io_uring_probe without its flexible array.
    fields:
      - name: lastOp
        type: uint8
      - name: opsLen
        type: uint8
      - name: resv
        type: uint16
      - name: resv2
        type: "[3]uint32"
    kind: struct
    name: probeHeader
  - doc: probeOp is struct io_uring_probe_op.
    fields:
      - name: op
        type: uint8
      - name: resv
        type: uint8
      - name: flags
        type: uint16
      - name: resv2
        type: uint32
    kind: struct
