# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      cpuMaskBytes is the CPU mask pinThread hands sched_setaffinity: one bit a
      CPU up to maxAffinityCPU.
    items:
      - name: cpuMaskBytes
        type: int
        value: (maxAffinityCPU + 1) / 8
    name: cpuMaskBytes
  - doc: busy-poll's window and budget (#979, ADR 0189 amended 2026-11-11).
    grouped: true
    items:
      - doc: |-
          defaultBusyPoll is the window busy-poll takes when LoopValue.BusyPoll is
          zero: the value Documentation/networking/napi.rst gives its examples,
          held until the paired gate measures another.
        name: defaultBusyPoll
        type: time.Duration
        value: 50 * time.Microsecond
      - doc: |-
          maxBusyPoll bounds LoopValue.BusyPoll: past a second a loop would spin
          rather than wait.
        name: maxBusyPoll
        type: time.Duration
        value: time.Second
      - doc: |-
          maxBusyPollBudget bounds LoopValue.BusyPollBudget: epoll_params'
          busy_poll_budget is 16 bits.
        name: maxBusyPollBudget
        type: int
        value: 1<<16 - 1
      - doc: |-
          reasonBusyPollOn is the row's reason once on: what it polls, and what it
          cannot.
        name: reasonBusyPollOn
        type: string
        value: "\"polls the NAPI ids of the loop's sockets; loopback and a veth without GRO have none\""
    name: defaultBusyPoll
  - doc: |-
      The two requests of struct epoll_params, _IOW and _IOR of type 0x8A on its
      8 bytes, as this architecture encodes a direction.
    grouped: true
    items:
      - name: epiocSParams
        type: uintptr
        value: iocWrite<<iocDirShift | 8<<16 | 0x8A<<8 | 1
      - name: epiocGParams
        type: uintptr
        value: iocRead<<iocDirShift | 8<<16 | 0x8A<<8 | 2
    name: epiocSParams
  - doc: |-
      The generic ioctl encoding (include/uapi/asm-generic/ioctl.h): the
      direction in the top two bits.
    grouped: true
    items:
      - name: iocDirShift
        type: uintptr
        value: "30"
      - name: iocWrite
        type: uintptr
        value: "1"
      - name: iocRead
        type: uintptr
        value: "2"
    name: iocDirShift
  - doc: |-
      regNAPI is IORING_REGISTER_NAPI (6.9). Its unregister, 28, is never
      issued: closing the ring frees what it registered (io_napi_free).
    items:
      - name: regNAPI
        type: uintptr
        value: "27"
    name: regNAPI
  - doc: The classes a capability row names (ADR 0189).
    grouped: true
    items:
      - doc: "classKernel is class A-kernel: on once the probe validates it."
        name: classKernel
        type: string
        value: "\"a-kernel\""
      - doc: "classCode is class A-code: on only when LoopValue.Capabilities opts in."
        name: classCode
        type: string
        value: "\"a-code\""
      - doc: "classB is class B: declared, never turned on by this step."
        name: classB
        type: string
        value: "\"b\""
    name: classKernel
  - doc: The statuses a capability row reports (ADR 0189).
    grouped: true
    items:
      - doc: statusOn is probed and in use.
        name: statusOn
        type: string
        value: "\"on\""
      - doc: statusAvailable is probed and present, not asked for.
        name: statusAvailable
        type: string
        value: "\"available\""
      - doc: statusAbsent is probed, and the kernel lacks it.
        name: statusAbsent
        type: string
        value: "\"absent\""
      - doc: |-
          statusMissing is a class A-code capability the code opted into and the
          kernel lacks: server reports it as a fault.
        name: statusMissing
        type: string
        value: "\"missing\""
      - doc: "statusDisabled is switched off by the operator: never probed."
        name: statusDisabled
        type: string
        value: "\"disabled\""
      - doc: statusUnprobed is of no use to the backend the group runs on.
        name: statusUnprobed
        type: string
        value: "\"unprobed\""
    name: statusOn
  - doc: reasonClassB is the reason every class B row gives.
    items:
      - name: reasonClassB
        type: string
        value: "\"class B: declared, not built until BENCH.md shows its threshold\""
    name: reasonClassB
  - doc: |-
      maxAffinityCPU bounds LoopValue.Affinity: the CPU mask pinThread hands
      sched_setaffinity has that many bits.
    items:
      - name: maxAffinityCPU
        type: int
        value: "8191"
    name: maxAffinityCPU
  - doc: |-
      The states of a connection slot. A slot returns to stFree only once its
      backend released the descriptor and every operation still in flight, its
      generation moved on.
    grouped: true
    items:
      - doc: stFree is a slot on the free list.
        name: stFree
        type: uint8
        value: iota
      - doc: stOpen serves its connection.
        name: stOpen
      - doc: stClosing was asked to close and still has output to send.
        name: stClosing
      - doc: |-
          stDead has called OnClose and waits for its backend to release the
          descriptor and every operation still in flight.
        name: stDead
      - doc: |-
          stPeer is a Unix connection accepted on an io_uring direct descriptor
          whose peer the socket command is reading: not opened yet (#974).
        name: stPeer
    name: stFree
  - doc: The flags of a connection slot.
    grouped: true
    items:
      - doc: fPressure is the soft pressure set at accept.
        name: fPressure
        type: uint8
        value: 1 << iota
      - doc: |-
          fWantWritable asks for OnWritable once the output falls under the
          low-water mark.
        name: fWantWritable
      - doc: fDirty puts the slot on its ring's dirty list.
        name: fDirty
      - doc: fPeerDone is a peer that sent its last byte.
        name: fPeerDone
      - doc: |-
          fSending is output the backend holds: EPOLLOUT armed, or a send in
          flight.
        name: fSending
      - doc: |-
          fHeard is a peer that sent at least one byte: the drain closes a
          connection that has not only once it stayed silent for drainQuiet.
        name: fHeard
      - doc: fCompact puts the slot on its ring's compaction list.
        name: fCompact
      - doc: fDrained is a connection whose handler the drain has told once.
        name: fDrained
    name: fPressure
  - doc: "How a flight leaves on io_uring (connCtl.zc, #969)."
    grouped: true
    items:
      - doc: "zcOff: by IORING_OP_SEND."
        name: zcOff
        type: uint8
        value: iota
      - doc: "zcOn: by IORING_OP_SEND_ZC, every send of it."
        name: zcOn
      - doc: |-
          zcHold: no send for now; the last notification of the flight sends its
          rest by IORING_OP_SEND.
        name: zcHold
    name: zcOff
  - doc: The bits of connCtl.fileBits, io_uring's file state.
    grouped: true
    items:
      - doc: ffEOF is a read that returned nothing.
        name: ffEOF
        type: uint8
        value: 1 << iota
      - doc: ffFull is a splice the socket refused for room.
        name: ffFull
      - doc: ffPoll is the POLLOUT that waits for it.
        name: ffPoll
    name: ffEOF
  - doc: |-
      The reasons a connection is closed, mapped to the preallocated error
      OnClose receives (closeErr).
    grouped: true
    items:
      - doc: |-
          rNone is a clean close, by the handler or the peer: OnClose receives
          nil.
        name: rNone
        type: uint8
        value: iota
      - doc: rSpill is unconsumed input past SpillCap, or the slab's budget spent.
        name: rSpill
      - doc: rIdle is no traffic for IdleTimeout.
        name: rIdle
      - doc: rDrain is the group's drain or stop.
        name: rDrain
      - doc: rErrno is a socket failure; the slot's errno says which.
        name: rErrno
      - doc: rEvict is an idle connection evicted under hard pressure.
        name: rEvict
      - doc: rFile is a file body that ended before its declared length.
        name: rFile
    name: rNone
  - grouped: true
    items:
      - doc: |-
          lowWaterDiv sets the output low-water mark at OutputCap / lowWaterDiv:
          a connection refused with LoopOutputFull hears OnWritable once its
          pending output falls under it.
        name: lowWaterDiv
        type: int
        value: "4"
      - doc: |-
          evictPerTick paces hard-pressure eviction: at most this many idle
          connections closed per ring and tick.
        name: evictPerTick
        type: int
        value: "16"
      - doc: |-
          slotStep is the most slots a ring's table grows by at once: doubling
          up to it, then by it. Past a few thousand connections append's growth
          left up to a quarter of the table unused and briefly held the old array
          beside the new one, about 100 B a slot each.
        name: slotStep
        type: int
        value: "2048"
    name: lowWaterDiv
  - doc: |-
      loopDebug reports whether the loopdebug build tag compiled the thread
      check in.
    items:
      - name: loopDebug
        value: "false"
    name: loopDebug
  - grouped: true
    items:
      - doc: |-
          drainQuiet is how long the drain leaves open a connection that has sent
          nothing yet. One accepted as the drain began has its request on the way:
          closed before it is read, the request would meet a closed socket and the
          peer a reset. One that stays silent that long is closed like any other.
        name: drainQuiet
        type: time.Duration
        value: time.Second
      - doc: drainQuietTicks is drainQuiet in ticks.
        name: drainQuietTicks
        type: int64
        value: int64(drainQuiet / tickEvery)
      - doc: |-
          queueTakeMax bounds how many connections the drain takes from one
          listener's queue, a loop on epoll, a ring on io_uring: past it the
          arrivals outpace the drain — no grace let the routing stop —, and what
          is left in the queue meets the close.
        name: queueTakeMax
        type: int
        value: 1 << 16
      - doc: |-
          acceptBurst is the most connections one listener readiness accepts, on
          epoll and on kqueue, before the loop serves the events already in hand.
        name: acceptBurst
        type: int
        value: "128"
      - doc: |-
          queueTakeBatch bounds what the drain of epoll or kqueue takes from one
          listener in one batch, so the loop serves between two takes.
        name: queueTakeBatch
        type: int
        value: 8 * acceptBurst
    name: drainQuiet
  - doc: |-
      What an accept's failure means for the drain take of epoll and kqueue
      (takeAfter).
    grouped: true
    items:
      - doc: "takeOver ends the take: the queue is empty, or the listener failed."
        name: takeOver
        type: uint8
        value: iota
      - doc: |-
          takeLater waits for the next batch: no descriptor until a close, with
          a connection of the group left whose close frees one.
        name: takeLater
      - doc: "takeNext skips one connection: the peer abandoned it, or a signal."
        name: takeNext
    name: takeOver
  - grouped: true
    items:
      - doc: |-
          epollAcceptBurst is the most connections one listener readiness
          accepts before the loop serves the events already in hand.
        name: epollAcceptBurst
        type: int
        value: acceptBurst
      - doc: readChunk is the most bytes one read asks for.
        name: readChunk
        type: int
        value: 16 << 10
      - doc: |-
          minRead is the least room in the read arena worth a read: below it the
          connection is read on the next iteration, its readiness still level.
        name: minRead
        type: int
        value: 2 << 10
      - doc: |-
          arenaSize is the loop's read arena: where a batch's received bytes
          live until OnBatchEnd returns.
        name: arenaSize
        type: int
        value: 2 << 20
      - doc: |-
          backoffMin is the first wait before a listener disarmed by EMFILE or
          ENFILE is armed again, in ticks (5 ms rounds up to one).
        name: backoffMin
        type: int64
        value: "1"
      - doc: backoffMax caps that wait, doubled at each pause, at one second.
        name: backoffMax
        type: int64
        value: int64(time.Second / tickEvery)
      - doc: tagWake marks the epoll event of the wake eventfd, not a connection.
        name: tagWake
        type: int32
        value: "-1"
      - doc: tagListen marks listener i's epoll event, at tagListen-i.
        name: tagListen
        type: int32
        value: "-2"
      - doc: |-
          efdNonblock is EFD_NONBLOCK (include/uapi/linux/eventfd.h, the O_
          flag's value).
        name: efdNonblock
        type: uintptr
        value: syscall.O_NONBLOCK
      - doc: |-
          efdCloexec is EFD_CLOEXEC (include/uapi/linux/eventfd.h, the O_ flag's
          value).
        name: efdCloexec
        type: uintptr
        value: syscall.O_CLOEXEC
      - doc: |-
          epollExclusive is EPOLLEXCLUSIVE (include/uapi/linux/eventpoll.h, 4.5):
          one loop woken per incoming connection, not every loop.
        name: epollExclusive
        type: uint32
        value: 1 << 28
      - doc: siocinq is SIOCINQ, FIONREAD on a socket (asm-generic/ioctls.h).
        name: siocinq
        type: uintptr
        value: "0x541B"
      - doc: |-
          sendfileStep is the most bytes one sendfile asks for before the loop goes
          back to its other connections, a file on a fast peer no reason to stay
          on the one connection.
        name: sendfileStep
        type: int64
        value: 1 << 20
      - doc: connEvents are a connection's events while it reads.
        name: connEvents
        type: uint32
        value: syscall.EPOLLIN | syscall.EPOLLRDHUP
    name: epollAcceptBurst
  - doc: |-
      The verdicts of the secondary-wake probe (#703), as the group's log line
      names them.
    grouped: true
    items:
      - doc: |-
          wakeUnprobed is a process whose probe never ran: no io_uring loop with
          a secondary ring started yet, or no io_uring here.
        name: wakeUnprobed
        type: string
        value: "\"unprobed\""
      - doc: |-
          wakePrompt is a kernel that wakes the primary's wait for a secondary
          ring's completion.
        name: wakePrompt
        type: string
        value: "\"prompt\""
      - doc: |-
          wakeSlow is a kernel that leaves the primary's wait to its timeout: a
          loop with secondaries then waits fanWakeTick at most.
        name: wakeSlow
        type: string
        value: "\"slow\""
    name: wakeUnprobed
  - doc: |-
      idleSlotHeapBudget is the most Go heap, in bytes, one idle connection
      costs on a native backend — 256 bytes, its slot and its timer link, as the
      package documentation states. The memory test measures the same bound.
    items:
      - name: idleSlotHeapBudget
        type: uintptr
        value: "256"
    name: idleSlotHeapBudget
  - doc: backendEpoll is the backend startEpoll reports.
    items:
      - name: backendEpoll
        type: corenet.LoopBackend
        value: corenet.LoopBackendEpoll
    name: backendEpoll
  - doc: |-
      The io_uring accept watchdog's bounds. They live in a file every Linux
      architecture builds, not beside the watchdog, because the conformance suite
      reads them on every Linux architecture, io_uring's wave 1 or not.
    grouped: true
    items:
      - doc: |-
          watchdogTicks is how long an accept may look stalled — armed, the
          listener's queue not empty, no accept completion on any ring — before
          the watchdog re-arms it.
        name: watchdogTicks
        type: int64
        value: "100"
      - doc: |-
          watchdogFires is how many re-arms the watchdog makes before the ring
          drains.
        name: watchdogFires
        type: int
        value: "3"
    name: watchdogTicks
  - doc: |-
      soReusePort is SO_REUSEPORT (Linux 3.9, socket.h): absent from package
      syscall on every Linux architecture, cited here as ADR 0018 asks.
    items:
      - name: soReusePort
        type: int
        value: "0xF"
    name: soReusePort
  - doc: |-
      soIncomingCPU is SO_INCOMING_CPU (Linux 3.19, settable since 4.4,
      asm-generic/socket.h): absent from package syscall, cited here as ADR 0018
      asks.
    items:
      - name: soIncomingCPU
        type: int
        value: "49"
    name: soIncomingCPU
  - doc: |-
      tcpNotsentLowat is TCP_NOTSENT_LOWAT (Linux 3.12, tcp.h): absent from
      package syscall, cited here as ADR 0018 asks.
    items:
      - name: tcpNotsentLowat
        type: int
        value: "25"
    name: tcpNotsentLowat
  - doc: |-
      defaultNotsentLowat is the TCP_NOTSENT_LOWAT of an opt-in with no value:
      128 KiB (#857).
    items:
      - name: defaultNotsentLowat
        type: int
        value: 128 << 10
    name: defaultNotsentLowat
  - doc: |-
      tcpUserTimeout is TCP_USER_TIMEOUT (Linux 2.6.37, tcp.h): absent from
      package syscall, cited here as ADR 0018 asks.
    items:
      - name: tcpUserTimeout
        type: int
        value: "0x12"
    name: tcpUserTimeout
  - doc: |-
      keepAliveDefault is the idle time and the interval of a keepalive the
      caller left unset: the standard library's own, which the goroutine
      engine's accepted sockets get from net.Listener.Accept.
    items:
      - name: keepAliveDefault
        type: time.Duration
        value: 15 * time.Second
    name: keepAliveDefault
  - doc: |-
      keepAliveProbes is how many unanswered probes end a connection: the
      standard library's own.
    items:
      - name: keepAliveProbes
        type: int
        value: "9"
    name: keepAliveProbes
  - doc: The states of a datagram lane, which Handover and Stop move forward only.
    grouped: true
    items:
      - doc: laneServe is a lane serving its socket.
        name: laneServe
        type: int32
        value: iota
      - doc: laneHandover is a lane asked to drain its socket and stop.
        name: laneHandover
      - doc: laneStop is a lane asked to stop now.
        name: laneStop
    name: laneServe
  - doc: |-
      The destination a datagram reached (#972), read from its control data and
      written back into the reply's SENDMSG: a wildcard socket answers from the
      address its peer wrote to, not from the kernel's choice.
    grouped: true
    items:
      - doc: ipprotoIP and ipPktinfo name IP_PKTINFO's cmsg (include/uapi/linux/in.h).
        name: ipprotoIP
        type: int
        value: "0"
      - name: ipPktinfo
        type: int
        value: "8"
      - doc: ipprotoIPv6 and ipv6Pktinfo name IPV6_PKTINFO's (include/uapi/linux/in6.h).
        name: ipprotoIPv6
        type: int
        value: "41"
      - name: ipv6Pktinfo
        type: int
        value: "50"
      - doc: "inPktinfoBytes is struct in_pktinfo: ifindex, ipi_spec_dst, ipi_addr."
        name: inPktinfoBytes
        type: int
        value: "12"
      - doc: "in6PktinfoBytes is struct in6_pktinfo: ipi6_addr, ipi6_ifindex."
        name: in6PktinfoBytes
        type: int
        value: "20"
      - doc: |-
          packetSeenMax is the most senders a lane remembers within one batch, the
          newest kept: one a buffer the kernel can fill before OnBatchEnd.
        name: packetSeenMax
        type: int
        value: "128"
      - doc: ipv4Bytes and ipv6Bytes are an address's length in each family.
        name: ipv4Bytes
        type: uint8
        value: "4"
      - name: ipv6Bytes
        type: uint8
        value: "16"
      - doc: |-
          recordControlOff is where a SENDMSG record's control data starts: after
          its msghdr (56), its iovec (16) and the peer's sockaddr (32).
        name: recordControlOff
        type: int
        value: "104"
    name: ipprotoIP
  - doc: The datagram lane's part of the io_uring ABI, and its sizes (#852).
    grouped: true
    items:
      - doc: opSendmsg is IORING_OP_SENDMSG.
        name: opSendmsg
        type: uint8
        value: "9"
      - doc: opRecvmsg is IORING_OP_RECVMSG; multishot since 6.0.
        name: opRecvmsg
        type: uint8
        value: "10"
      - doc: |-
          recvmsgOutBytes is struct io_uring_recvmsg_out: namelen, controllen,
          payloadlen and flags, four u32 at the head of each buffer.
        name: recvmsgOutBytes
        type: int
        value: "16"
      - doc: |-
          packetNameRoom is the room each buffer keeps for the sender's address,
          a sockaddr_in6 (28 bytes) rounded up.
        name: packetNameRoom
        type: int
        value: "32"
      - doc: |-
          packetCtrlRoom is the room each buffer keeps for control messages:
          UDP_GRO's int, SO_RXQ_OVFL's u32 and an in6_pktinfo fit with room left.
        name: packetCtrlRoom
        type: int
        value: "128"
      - doc: |-
          packetPayloadRoom is the payload room of each buffer: a GRO train is at
          most 64 KiB.
        name: packetPayloadRoom
        type: int
        value: 1 << 16
      - doc: packetBufs is how many buffers a lane gives the kernel, a power of two.
        name: packetBufs
        type: uint32
        value: "128"
      - doc: packetEntries sizes a lane's ring.
        name: packetEntries
        type: uint32
        value: "256"
      - doc: packetReplies is the most replies a lane has queued or in flight.
        name: packetReplies
        type: int
        value: "1024"
      - doc: packetOutBytes is the reply payload arena of a lane.
        name: packetOutBytes
        type: int
        value: 1 << 20
      - doc: |-
          packetRecordBytes is one SENDMSG's record in the reply arena: its
          msghdr, its iovec, the peer's sockaddr, then the control data — the
          source's IP_PKTINFO or IPV6_PKTINFO (40 at most) and the UDP_SEGMENT
          cmsg (24).
        name: packetRecordBytes
        type: int
        value: "192"
      - doc: gsoMaxSegments is the most datagrams one UDP_SEGMENT send carries.
        name: gsoMaxSegments
        type: int
        value: "64"
      - doc: gsoMaxBytes is the most payload one UDP_SEGMENT send carries.
        name: gsoMaxBytes
        type: int
        value: "65507"
      - doc: |-
          packetDrainMax bounds the datagrams a handover reads after its
          receive ended.
        name: packetDrainMax
        type: int
        value: 1 << 16
      - doc: packetProbeWait bounds the self-test's wait for its datagram.
        name: packetProbeWait
        type: int64
        value: "200_000_000"
      - doc: packetTick is the lane's longest wait, a backstop to its eventfd.
        name: packetTick
        type: int64
        value: "100_000_000"
      - doc: packetSendWaits bounds a handover's waits for its replies' completions.
        name: packetSendWaits
        type: int
        value: "50"
      - doc: |-
          packetQuiesceWait is one of quiesce's waits, packetSendWaits of them at
          most: a cancel and a send complete in microseconds.
        name: packetQuiesceWait
        type: int64
        value: "10_000_000"
    name: opSendmsg
  - doc: The kinds of a lane's user_data.
    grouped: true
    items:
      - name: pudRecv
        type: uint64
        value: 1 << 56
      - name: pudSend
        type: uint64
        value: 2 << 56
      - name: pudWake
        type: uint64
        value: 3 << 56
      - doc: pudProbe is the self-test's receive.
        name: pudProbe
        type: uint64
        value: 4 << 56
      - doc: pudCancel is a cancel's own completion.
        name: pudCancel
        type: uint64
        value: 5 << 56
      - doc: pudKind masks the kind.
        name: pudKind
        type: uint64
        value: 0xFF << 56
    name: pudRecv
  - doc: The socket-level constants the lane reads and sets, Linux's uapi values.
    grouped: true
    items:
      - name: solUDP
        type: int
        value: "17"
      - name: udpGRO
        type: int
        value: "104"
      - name: udpSegment
        type: int
        value: "103"
      - name: soRxqOvfl
        type: int
        value: "40"
      - name: msgTrunc
        type: uint32
        value: "0x20"
      - name: msgCtrunc
        type: uint32
        value: "0x08"
      - name: afInet
        type: uint16
        value: "2"
      - name: afInet6
        type: uint16
        value: "10"
      - doc: cmsgHdrBytes is struct cmsghdr on a 64-bit architecture.
        name: cmsgHdrBytes
        type: int
        value: "16"
      - doc: segmentCmsgBytes is CMSG_SPACE of UDP_SEGMENT's u16.
        name: segmentCmsgBytes
        type: uint64
        value: "24"
      - doc: sockaddrIn4Bytes and sockaddrIn6Bytes are sockaddr_in and sockaddr_in6.
        name: sockaddrIn4Bytes
        type: uint32
        value: "16"
      - name: sockaddrIn6Bytes
        type: uint32
        value: "28"
      - doc: cmsgAlign is CMSG_ALIGN's unit on a 64-bit architecture.
        name: cmsgAlign
        type: int
        value: "8"
