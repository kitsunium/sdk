                cases:
                  - case: s.disabled(lc.name)
                    do:
                      - set: row.Status, row.Reason
                        value: statusDisabled, s.offBy
                  - case: lc.class == classB
                    do:
                      - set: row.Reason
                        value: reasonClassB
            - set: rows
              value: append(rows, row)
          key: _
          range: loopCaps
          value: lc
      - return: "capReport{rows: rows, want: s.want}"
