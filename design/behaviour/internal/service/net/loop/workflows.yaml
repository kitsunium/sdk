                    value: status, reason
                when: r.rows[i].Name == c && r.rows[i].Status != statusDisabled
          key: i
          range: r.rows
  - of: (*uLoop).opens
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: "false"
                when: rr.fill&fillFull == 0
