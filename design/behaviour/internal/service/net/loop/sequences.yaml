      - bind: per
        eval: rr.u.bufPer
      - loop:
          cond: from < to
          do:
            - bind: g
              eval: int(from / per)
            - bind: end
              eval: min(to, (uint32(g)+1)*per)
            - loop:
                cond: len(rr.inRing) <= g
                do:
                  - set: rr.inRing
                    value: append(rr.inRing, 0)
                  - set: rr.given
                    value: append(rr.given, 0)
                  - set: rr.armedOn
                    value: append(rr.armedOn, 0)
            - op: +=
              set: rr.inRing[g]
              value: int(end - from)
            - op: +=
              set: rr.given[g]
              value: int(end - from)
            - set: from
              value: end
  - of: (*uRing).giveBack
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).giveBack
        kind: self
      - id: fillStale
