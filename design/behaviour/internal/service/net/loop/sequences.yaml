        eval: c.free[:0]
      - loop:
          do:
            - opt:
                do:
                  - set: keep
                    value: append(keep, idx)
                when: "!c.dropped[int(idx)/c.perArena]"
          key: _
          range: c.free
          value: idx
      - set: c.free
        value: keep
      - eval: s.unmapDropped(c)
        to: s.unmapDropped
