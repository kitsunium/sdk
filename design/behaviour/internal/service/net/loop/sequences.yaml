# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
sequences:
  - of: CheckCapabilities
    participants:
      - id: caller
        kind: actor
      - id: CheckCapabilities
        kind: self
      - id: capClassOf
        kind: internal
      - id: errs
        kind: package
    steps:
      - loop:
          do:
            - bind: class, ok
              eval: capClassOf(c)
              to: capClassOf
            - opt:
                do:
                  - return: |-
                      errs.Wrap(corenet.LoopCapabilityRefused, errs.WrapParams{},
                      				errs.String("group", group), errs.String("capability", string(c)))
                    to: errs
                when: "!ok || class == classB"
          key: _
          range: v.Capabilities
          value: c
      - return: nil
  - of: newSwitches
    steps:
      - bind: by
        eval: cfg.DisabledBy
      - opt:
          do:
            - set: by
              value: corenet.EnvDisable
          when: by == ""
      - return: "capSwitches{off: cfg.Disabled, offBy: by, want: cfg.Value.Capabilities}"
  - of: capSwitches.disabled
    participants:
      - id: caller
        kind: actor
      - id: capSwitches.disabled
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - return: slices.Contains(s.off, c)
        to: slices
  - of: capSwitches.wants
    participants:
      - id: caller
        kind: actor
      - id: capSwitches.wants
        kind: self
      - id: capClassOf
        kind: internal
    steps:
      - opt:
          do:
            - return: "false"
          when: s.disabled(c)
      - bind: class, _
        eval: capClassOf(c)
        to: capClassOf
      - return: class == classKernel || slices.Contains(s.want, c)
  - of: (*capReport).wanted
    participants:
      - id: caller
        kind: actor
      - id: (*capReport).wanted
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - return: slices.Contains(r.want, c)
        to: slices
  - of: (*capReport).found
    participants:
      - id: caller
        kind: actor
      - id: (*capReport).found
        kind: self
      - id: r.set
        kind: internal
    steps:
      - switch:
          cases:
            - case: "!present"
              do:
                - eval: r.set(c, statusAbsent, reason)
                  to: r.set
            - case: s.wants(c)
              do:
                - eval: r.set(c, statusOn, "")
                  to: r.set
            - default: true
              do:
                - eval: r.set(c, statusAvailable, "")
                  to: r.set
  - of: Unprobed
    steps:
      - return: "newReport(newSwitches(&Config{Disabled: disabled, DisabledBy: disabledBy}), backend).rows"
  - of: (*connCtl).pending
    steps:
      - return: int(c.out.len-c.out.off) + int(c.flight.len-c.flight.off)
  - of: emptyConn
    steps:
      - return: |-
          connCtl{
          		gen: gen, fd: -1, state: stFree, reason: rNone,
          		spill: chunkRef{idx: noChunk}, out: chunkRef{idx: noChunk}, flight: chunkRef{idx: noChunk},
          		lruPrev: noLink, lruNext: noLink, dirtyNext: noLink,
          	}
  - of: newRing
    steps:
      - return: |-
          &ring{
          		lp: lp, index: i, drv: drv,
          		wheel:   newWheel(0, lp.tick),
          		lruHead: noLink, lruTail: noLink, dirtyHead: noLink,
          		pub: &ringStats{},
          	}
  - of: (*ring).take
    participants:
      - id: caller
        kind: actor
      - id: (*ring).take
        kind: self
      - id: r.wheel.grow
        kind: internal
      - id: emptyConn
        kind: internal
    steps:
      - var:
          name: slot
          type: int32
      - alt:
          - do:
              - set: slot
                value: r.free[n-1]
              - set: r.free
                value: r.free[:n-1]
            init:
              bind: "n"
              eval: len(r.free)
            when: n > 0
          - do:
              - opt:
                  do:
                    - return: 0, false
                  when: len(r.conns) >= r.lp.sz.tableSize
              - set: slot
                value: int32(len(r.conns))
              - set: r.conns
                value: append(r.conns, emptyConn(0))
              - eval: r.wheel.grow(len(r.conns))
                to: r.wheel.grow
            else: true
      - bind: c
        eval: "&r.conns[slot]"
      - bind: gen
        eval: c.gen + 1
      - opt:
          do:
            - set: gen
              value: "1"
          when: gen == 0
      - set: "*c"
        to: emptyConn
        value: emptyConn(gen)
      - set: c.state, c.fd, c.lastIO
        value: stOpen, fd, r.lp.tick
      - return: slot, true
  - of: (*ring).opened
    participants:
      - id: caller
        kind: actor
      - id: (*ring).opened
        kind: self
      - id: r.lp.grp.live.Add
        kind: value
      - id: r.lruPush
        kind: internal
      - id: r.armTimer
        kind: internal
      - id: r.lp.h.OnOpen
        kind: value
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - bind: live
        eval: r.lp.grp.live.Add(1)
        to: r.lp.grp.live.Add
      - op: ++
        set: r.live
      - op: ++
        set: r.st.accepted
      - opt:
          do:
            - op: "|="
              set: c.flags
              value: fPressure
          init:
            bind: soft
            eval: r.lp.sz.softConns
          when: soft > 0 && live > int64(soft)
      - eval: r.lruPush(slot)
        to: r.lruPush
      - eval: r.armTimer(slot)
        to: r.armTimer
      - eval: r.lp.h.OnOpen(r.lp, r.ref(slot))
        to: r.lp.h.OnOpen
  - of: (*ring).abandon
    participants:
      - id: caller
        kind: actor
      - id: (*ring).abandon
        kind: self
      - id: emptyConn
        kind: internal
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - set: "*c"
        to: emptyConn
        value: emptyConn(c.gen)
      - set: r.free
        value: append(r.free, slot)
  - of: (*ring).ref
    steps:
      - return: "corenet.LoopConnRef{Ring: uint32(r.index), Slot: uint32(slot), Gen: r.conns[slot].gen}"
  - of: (*ring).deliver
    participants:
      - id: caller
        kind: actor
      - id: (*ring).deliver
        kind: self
      - id: r.lruTouch
        kind: internal
      - id: clampConsumed
        kind: internal
      - id: r.keep
        kind: internal
      - id: lp.slab.data
        kind: internal
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - opt:
          do:
            - return: ""
          when: c.state != stOpen || len(data) == 0
      - set: c.lastIO
        value: r.lp.tick
      - op: "|="
        set: c.flags
        value: fHeard
      - eval: r.lruTouch(slot)
        to: r.lruTouch
      - bind: lp
        eval: r.lp
      - opt:
          do:
            - bind: "n"
              eval: clampConsumed(lp.h.OnData(lp, r.ref(slot), data), len(data))
              to: clampConsumed
            - opt:
                do:
                  - eval: r.keep(slot, data[n:])
                    to: r.keep
                when: c.state == stOpen && n < len(data)
            - return: ""
          when: c.spill.empty()
      - opt:
          do:
            - return: ""
          when: "!r.appendSpill(slot, data)"
      - bind: buf
        eval: lp.slab.data(c.spill)
        to: lp.slab.data
      - bind: "n"
        eval: clampConsumed(lp.h.OnData(lp, r.ref(slot), buf), len(buf))
        to: clampConsumed
      - set: c
        value: "&r.conns[slot]"
      - op: +=
        set: c.spill.off
        value: int32(n)
      - opt:
          do:
            - set: lp.deferred
              value: append(lp.deferred, c.spill)
            - set: c.spill
              value: "chunkRef{idx: noChunk}"
          when: c.spill.off == c.spill.len
  - of: (*ring).keep
    participants:
      - id: caller
        kind: actor
      - id: (*ring).keep
        kind: self
      - id: r.fail
        kind: internal
      - id: lp.slab.alloc
        kind: internal
    steps:
      - bind: lp
        eval: r.lp
      - opt:
          do:
            - eval: r.fail(slot, rSpill, 0)
              to: r.fail
            - return: ""
          when: len(tail) > lp.sz.spillCap
      - bind: ch, ok
        eval: lp.slab.alloc(len(tail))
        to: lp.slab.alloc
      - opt:
          do:
            - eval: r.fail(slot, rSpill, 0)
              to: r.fail
            - return: ""
          when: "!ok"
      - set: ch.len
        value: int32(copy(lp.slab.bytes(ch), tail))
      - set: r.conns[slot].spill
        value: ch
  - of: (*ring).appendSpill
    participants:
      - id: caller
        kind: actor
      - id: (*ring).appendSpill
        kind: self
      - id: r.fail
        kind: internal
      - id: lp.slab.alloc
        kind: internal
      - id: lp.slab.bytes
        kind: internal
    steps:
      - bind: lp
        eval: r.lp
      - bind: c
        eval: "&r.conns[slot]"
      - bind: held
        eval: int(c.spill.len - c.spill.off)
      - opt:
          do:
            - eval: r.fail(slot, rSpill, 0)
              to: r.fail
            - return: "false"
          when: held+len(data) > lp.sz.spillCap
      - opt:
          do:
            - op: +=
              set: c.spill.len
              value: int32(copy(lp.slab.bytes(c.spill)[c.spill.len:], data))
            - return: "true"
          when: lp.slab.size(c.spill)-int(c.spill.len) >= len(data)
      - bind: ch, ok
        eval: lp.slab.alloc(held + len(data))
        to: lp.slab.alloc
      - opt:
          do:
            - eval: r.fail(slot, rSpill, 0)
              to: r.fail
            - return: "false"
          when: "!ok"
      - bind: dst
        eval: lp.slab.bytes(ch)
        to: lp.slab.bytes
      - bind: "n"
        eval: copy(dst, lp.slab.data(c.spill))
      - op: +=
        set: "n"
        value: copy(dst[n:], data)
      - set: ch.len
        value: int32(n)
      - set: lp.deferred
        value: append(lp.deferred, c.spill)
      - set: c.spill
        value: ch
      - return: "true"
  - of: (*ring).spillRoom
    participants:
      - id: caller
        kind: actor
      - id: (*ring).spillRoom
        kind: self
      - id: lp.slab.alloc
        kind: internal
    steps:
      - bind: lp
        eval: r.lp
      - bind: c
        eval: "&r.conns[slot]"
      - bind: held
        eval: int(c.spill.len - c.spill.off)
      - bind: room
        eval: min(want, lp.sz.spillCap-held)
      - opt:
          do:
            - return: nil
          when: room <= 0
      - bind: free
        eval: lp.slab.size(c.spill) - int(c.spill.len)
      - opt:
          do:
            - return: "lp.slab.bytes(c.spill)[c.spill.len : int(c.spill.len)+room]"
          when: free >= room
      - bind: ch, ok
        eval: lp.slab.alloc(held + room)
        to: lp.slab.alloc
      - opt:
          do:
            - return: nil
          when: "!ok"
      - set: ch.len
        value: int32(copy(lp.slab.bytes(ch), lp.slab.data(c.spill)))
      - set: lp.deferred
        value: append(lp.deferred, c.spill)
      - set: c.spill
        value: ch
      - return: "lp.slab.bytes(ch)[ch.len : int(ch.len)+room]"
  - of: (*ring).deliverSpill
    participants:
      - id: caller
        kind: actor
      - id: (*ring).deliverSpill
        kind: self
      - id: r.lruTouch
        kind: internal
      - id: lp.slab.data
        kind: internal
      - id: clampConsumed
        kind: internal
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - op: +=
        set: c.spill.len
        value: int32(n)
      - set: c.lastIO
        value: r.lp.tick
      - op: "|="
        set: c.flags
        value: fHeard
      - eval: r.lruTouch(slot)
        to: r.lruTouch
      - bind: lp
        eval: r.lp
      - bind: buf
        eval: lp.slab.data(c.spill)
        to: lp.slab.data
      - bind: used
        eval: clampConsumed(lp.h.OnData(lp, r.ref(slot), buf), len(buf))
        to: clampConsumed
      - set: c
        value: "&r.conns[slot]"
      - op: +=
        set: c.spill.off
        value: int32(used)
      - opt:
          do:
            - set: lp.deferred
              value: append(lp.deferred, c.spill)
            - set: c.spill
              value: "chunkRef{idx: noChunk}"
          when: c.spill.off == c.spill.len
  - of: (*ring).hasSpill
    participants:
      - id: caller
        kind: actor
      - id: (*ring).hasSpill
        kind: self
      - id: r.conns[slot].spill.empty
        kind: internal
    steps:
      - return: "!r.conns[slot].spill.empty()"
        to: r.conns[slot].spill.empty
  - of: (*ring).compactSpill
    participants:
      - id: caller
        kind: actor
      - id: (*ring).compactSpill
        kind: self
      - id: r.lp.slab.bytes
        kind: internal
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - opt:
          do:
            - return: ""
          when: c.spill.empty() || c.spill.off == 0
      - bind: b
        eval: r.lp.slab.bytes(c.spill)
        to: r.lp.slab.bytes
      - bind: "n"
        eval: copy(b, b[c.spill.off:c.spill.len])
      - set: c.spill.off, c.spill.len
        value: 0, int32(n)
  - of: clampConsumed
    steps:
      - opt:
          do:
            - return: "n"
          when: v < 0 || v > n
      - return: v
  - of: (*ring).markDirty
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - opt:
          do:
            - return: ""
          when: c.flags&fDirty != 0
      - op: "|="
        set: c.flags
        value: fDirty
      - set: c.dirtyNext
        value: r.dirtyHead
      - set: r.dirtyHead
        value: slot
  - of: (*ring).flushDirty
    participants:
      - id: caller
        kind: actor
      - id: (*ring).flushDirty
        kind: self
      - id: r.settle
        kind: internal
    steps:
      - loop:
          cond: s != noLink
          do:
            - set: r.dirtyHead
              value: noLink
            - loop:
                cond: s != noLink
                do:
                  - bind: c
                    eval: "&r.conns[s]"
                  - bind: nxt
                    eval: c.dirtyNext
                  - op: "&^="
                    set: c.flags
                    value: fDirty
                  - set: c.dirtyNext
                    value: noLink
                  - eval: r.settle(s)
                    to: r.settle
                  - set: s
                    value: nxt
            - set: s
              value: r.dirtyHead
          init: s := r.dirtyHead
  - of: (*ring).settle
    participants:
      - id: caller
        kind: actor
      - id: (*ring).settle
        kind: self
      - id: r.drv.flush
        kind: internal
      - id: r.finish
        kind: internal
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - opt:
          do:
            - return: ""
          when: c.state != stOpen && c.state != stClosing
      - opt:
          do:
            - eval: r.drv.flush(r, slot)
              to: r.drv.flush
            - set: c
              value: "&r.conns[slot]"
          when: c.pending() > 0
      - opt:
          do:
            - eval: r.finish(slot, c.reason, c.errno)
              to: r.finish
          when: (c.state == stClosing || c.flags&fPeerDone != 0) && c.pending() == 0 && c.state != stDead
  - of: (*ring).sent
    participants:
      - id: caller
        kind: actor
      - id: (*ring).sent
        kind: self
      - id: r.lp.h.OnWritable
        kind: value
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - set: c.lastIO
        value: r.lp.tick
      - opt:
          do:
            - op: "&^="
              set: c.flags
              value: fWantWritable
            - eval: r.lp.h.OnWritable(r.lp, r.ref(slot))
              to: r.lp.h.OnWritable
          when: c.flags&fWantWritable != 0 && c.state == stOpen && c.pending() < r.lp.lowWater
  - of: (*ring).fail
    participants:
      - id: caller
        kind: actor
      - id: (*ring).fail
        kind: self
      - id: r.finish
        kind: internal
    steps:
      - opt:
          do:
            - eval: r.finish(slot, reason, errno)
              to: r.finish
          when: r.conns[slot].state == stOpen || r.conns[slot].state == stClosing
  - of: (*ring).finish
    participants:
      - id: caller
        kind: actor
      - id: (*ring).finish
        kind: self
      - id: r.ref
        kind: internal
      - id: r.wheel.disarm
        kind: internal
      - id: r.lruUnlink
        kind: internal
      - id: lp.grp.live.Add
        kind: value
      - id: lp.h.OnClose
        kind: value
      - id: r.drv.shutdown
        kind: internal
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - bind: ref
        eval: r.ref(slot)
        to: r.ref
      - set: c.state
        value: stDead
      - set: c.reason, c.errno
        value: reason, errno
      - eval: r.wheel.disarm(slot)
        to: r.wheel.disarm
      - eval: r.lruUnlink(slot)
        to: r.lruUnlink
      - bind: lp
        eval: r.lp
      - set: lp.deferred
        value: append(lp.deferred, c.spill, c.out)
      - set: c.spill, c.out
        value: "chunkRef{idx: noChunk}, chunkRef{idx: noChunk}"
      - op: "--"
        set: r.live
      - op: ++
        set: r.st.closed
      - eval: lp.grp.live.Add(-1)
        to: lp.grp.live.Add
      - eval: lp.h.OnClose(lp, ref, closeErr(reason, errno))
        to: lp.h.OnClose
      - eval: r.drv.shutdown(r, slot)
        to: r.drv.shutdown
  - of: (*ring).release
    participants:
      - id: caller
        kind: actor
      - id: (*ring).release
        kind: self
      - id: emptyConn
        kind: internal
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - set: r.lp.deferred
        value: append(r.lp.deferred, c.flight)
      - set: "*c"
        to: emptyConn
        value: emptyConn(c.gen)
      - set: r.free
        value: append(r.free, slot)
  - of: closeErr
    participants:
      - id: caller
        kind: actor
      - id: closeErr
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - switch:
          cases:
            - case: rSpill
              do:
                - return: corenet.LoopSpillFull
            - case: rIdle
              do:
                - return: os.ErrDeadlineExceeded
            - case: rDrain
              do:
                - return: corenet.ServerClosed
            - case: rEvict
              do:
                - return: corenet.ConnLimitReached
            - case: rErrno
              do:
                - return: syscall.Errno(errno)
                  to: syscall
            - default: true
              do:
                - return: nil
          "on": reason
  - of: (*ring).armTimer
    participants:
      - id: caller
        kind: actor
      - id: (*ring).armTimer
        kind: self
      - id: r.wheel.disarm
        kind: internal
      - id: r.wheel.arm
        kind: internal
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - bind: at
        eval: c.deadline
      - opt:
          do:
            - bind: exp
              eval: c.lastIO + idle
            - opt:
                do:
                  - set: at
                    value: exp
                when: at == 0 || exp < at
          init:
            bind: idle
            eval: r.lp.idle
          when: idle > 0
      - opt:
          do:
            - eval: r.wheel.disarm(slot)
              to: r.wheel.disarm
            - return: ""
          when: at == 0
      - eval: r.wheel.arm(slot, at)
        to: r.wheel.arm
  - of: (*ring).expire
    participants:
      - id: caller
        kind: actor
      - id: (*ring).expire
        kind: self
      - id: r.finish
        kind: internal
      - id: r.armTimer
        kind: internal
      - id: r.lp.h.OnTimeout
        kind: value
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - opt:
          do:
            - return: ""
          when: c.state != stOpen
      - bind: now
        eval: r.lp.tick
      - opt:
          do:
            - eval: r.finish(slot, rIdle, 0)
              to: r.finish
            - return: ""
          init:
            bind: idle
            eval: r.lp.idle
          when: idle > 0 && c.lastIO+idle <= now && c.pending() == 0
      - opt:
          do:
            - set: c.deadline
              value: "0"
            - eval: r.armTimer(slot)
              to: r.armTimer
            - eval: r.lp.h.OnTimeout(r.lp, r.ref(slot))
              to: r.lp.h.OnTimeout
            - return: ""
          when: c.deadline != 0 && c.deadline <= now
      - eval: r.armTimer(slot)
        to: r.armTimer
  - of: (*ring).lruPush
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - set: c.lruPrev, c.lruNext
        value: r.lruTail, noLink
      - alt:
          - do:
              - set: r.conns[r.lruTail].lruNext
                value: slot
            when: r.lruTail != noLink
          - do:
              - set: r.lruHead
                value: slot
            else: true
      - set: r.lruTail
        value: slot
  - of: (*ring).lruUnlink
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - alt:
          - do:
              - set: r.conns[c.lruPrev].lruNext
                value: c.lruNext
            when: c.lruPrev != noLink
          - do:
              - set: r.lruHead
                value: c.lruNext
            when: r.lruHead == slot
      - alt:
          - do:
              - set: r.conns[c.lruNext].lruPrev
                value: c.lruPrev
            when: c.lruNext != noLink
          - do:
              - set: r.lruTail
                value: c.lruPrev
            when: r.lruTail == slot
      - set: c.lruPrev, c.lruNext
        value: noLink, noLink
  - of: (*ring).lruTouch
    participants:
      - id: caller
        kind: actor
      - id: (*ring).lruTouch
        kind: self
      - id: r.lruUnlink
        kind: internal
      - id: r.lruPush
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: r.lruTail == slot
      - eval: r.lruUnlink(slot)
        to: r.lruUnlink
      - eval: r.lruPush(slot)
        to: r.lruPush
  - of: (*ring).evict
    participants:
      - id: caller
        kind: actor
      - id: (*ring).evict
        kind: self
      - id: r.finish
        kind: internal
    steps:
      - bind: lp
        eval: r.lp
      - opt:
          do:
            - return: "0"
          when: lp.evictIdle <= 0
      - bind: done
        eval: "0"
      - bind: s
        eval: r.lruHead
      - loop:
          cond: s != noLink && done < evictPerTick
          do:
            - bind: c
              eval: "&r.conns[s]"
            - bind: nxt
              eval: c.lruNext
            - opt:
                do:
                  - break: true
                when: lp.tick-c.lastIO < lp.evictIdle
            - opt:
                do:
                  - op: ++
                    set: r.st.evicted
                  - eval: r.finish(s, rEvict, 0)
                    to: r.finish
                  - op: ++
                    set: done
                when: c.state == stOpen && c.spill.empty() && c.pending() == 0 && !r.drv.unread(r, s)
            - set: s
              value: nxt
      - return: done
  - of: (*loop).endBatch
    participants:
      - id: caller
        kind: actor
      - id: (*loop).endBatch
        kind: self
      - id: r.flushDirty
        kind: internal
      - id: lp.slab.free
        kind: internal
      - id: r.compactAll
        kind: internal
      - id: r.publish
        kind: internal
      - id: lp.grp.observe
        kind: internal
    steps:
      - loop:
          do:
            - eval: r.flushDirty()
              to: r.flushDirty
          key: _
          range: lp.rings
          value: r
      - loop:
          do:
            - eval: lp.slab.free(ch)
              to: lp.slab.free
          key: _
          range: lp.deferred
          value: ch
      - set: lp.deferred
        value: lp.deferred[:0]
      - loop:
          do:
            - eval: r.compactAll()
              to: r.compactAll
            - op: ++
              set: r.st.batches
            - eval: r.publish()
              to: r.publish
          key: _
          range: lp.rings
          value: r
      - eval: lp.grp.observe(time.Since(started))
        to: lp.grp.observe
  - of: (*ring).compactAll
    participants:
      - id: caller
        kind: actor
      - id: (*ring).compactAll
        kind: self
      - id: r.compactSpill
        kind: internal
    steps:
      - loop:
          cond: s != noLink
          do:
            - eval: r.compactSpill(s)
              to: r.compactSpill
          init: s := r.lruHead
          post: s = r.conns[s].lruNext
  - of: (*loop).now
    steps:
      - return: int64(time.Since(lp.epoch)/tickEvery) + 1
  - of: (*loop).lookup
    steps:
      - opt:
          do:
            - return: nil, 0, false
          when: int(ref.Ring) >= len(lp.rings)
      - bind: r
        eval: lp.rings[ref.Ring]
      - opt:
          do:
            - return: nil, 0, false
          when: int(ref.Slot) >= len(r.conns)
      - bind: c
        eval: "&r.conns[ref.Slot]"
      - opt:
          do:
            - return: nil, 0, false
          when: c.gen != ref.Gen || c.state != stOpen || ref.Gen == 0
      - return: r, int32(ref.Slot), true
  - of: (*loop).Write
    participants:
      - id: caller
        kind: actor
      - id: (*loop).Write
        kind: self
      - id: lp.lookup
        kind: internal
      - id: lp.slab.alloc
        kind: internal
      - id: r.markDirty
        kind: internal
    steps:
      - opt:
          do:
            - return: corenet.LoopWrongThread
          when: lp.threadOK != nil && !lp.threadOK()
      - bind: r, slot, ok
        eval: lp.lookup(ref)
        to: lp.lookup
      - opt:
          do:
            - return: corenet.LoopStaleRef
          when: "!ok"
      - opt:
          do:
            - return: nil
          when: len(p) == 0
      - bind: c
        eval: "&r.conns[slot]"
      - opt:
          do:
            - op: "|="
              set: c.flags
              value: fWantWritable
            - return: corenet.LoopOutputFull
          when: c.pending()+len(p) > lp.sz.outputCap
      - alt:
          - do:
              - bind: ch, ok
                eval: lp.slab.alloc(len(p))
                to: lp.slab.alloc
              - opt:
                  do:
                    - op: "|="
                      set: c.flags
                      value: fWantWritable
                    - return: corenet.LoopOutputFull
                  when: "!ok"
              - set: c.out
                value: ch
            when: c.out.empty()
          - do:
              - opt:
                  do:
                    - op: "|="
                      set: c.flags
                      value: fWantWritable
                    - return: corenet.LoopOutputFull
                  when: "!lp.growOut(c, len(p))"
            when: lp.slab.size(c.out)-int(c.out.len) < len(p)
      - op: +=
        set: c.out.len
        value: int32(copy(lp.slab.bytes(c.out)[c.out.len:], p))
