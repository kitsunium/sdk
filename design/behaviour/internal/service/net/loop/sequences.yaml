            - case: syscall.ECONNABORTED, syscall.EINTR
              do:
                - return: takeNext
            - default: true
              do:
                - return: takeOver
          "on": err
  - of: (*ring).full
    steps:
      - return: len(r.free) == 0 && len(r.conns) >= r.lp.sz.tableSize
  - of: (*ring).drainable
    steps:
      - return: c.state == stOpen && c.spill.empty() && (c.flags&fHeard != 0 || r.lp.tick-c.lastIO >= drainQuietTicks)
  - of: startEpoll
    participants:
      - id: caller
        kind: actor
      - id: startEpoll
        kind: self
      - id: newSwitches
        kind: internal
      - id: newReport
        kind: internal
      - id: probeExclusive
        kind: internal
      - id: noDelay
        kind: internal
      - id: newListenerSet
        kind: internal
      - id: newLoop
        kind: internal
      - id: runner.wg.Add
        kind: value
      - id: el.run
        kind: internal
      - id: runner.stop
        kind: internal
      - id: runner.wait
        kind: internal
