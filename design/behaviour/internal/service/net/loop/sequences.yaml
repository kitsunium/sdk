        to: newSwitches
      - set: g.caps
        to: newReport
        value: newReport(sw, "epoll")
      - bind: excl
        eval: probeExclusive(sw, &g.caps)
        to: probeExclusive
      - loop:
          do:
            - eval: noDelay(l.FD, sw)
              to: noDelay
            - set: runner.lfds
              value: append(runner.lfds, l.FD)
          key: _
          range: cfg.Listeners
          value: l
      - set: runner.set
        to: newListenerSet
        value: newListenerSet(runner.lfds, g.sz.loops)
      - bind: ready
        eval: make(chan error, g.sz.loops)
      - loop:
          do:
            - bind: lp
              eval: newLoop(g, *cfg, i, mmapAnon)
              to: newLoop
            - bind: el
              eval: |-
