  - of: (*selfTestRun).exchange
    participants:
      - id: caller
        kind: actor
      - id: (*selfTestRun).exchange
        kind: self
      - id: time.Now().Add
        kind: value
      - id: st.u.wait
        kind: internal
      - id: st.u.reap
