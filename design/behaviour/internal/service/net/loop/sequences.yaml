      - set: s.flags
        value: sqeFixedFile
      - set: s.off
        value: spliceNoOffset
      - set: s.addr
        value: spliceNoOffset
      - set: s.len
        value: "n"
      - set: s.fileIdx
        value: uint32(pipeR)
      - set: s.opFlags
        value: spliceMove | spliceNonblock
      - set: s.userData
        value: ud
  - of: prepPollOut
    participants:
      - id: caller
        kind: actor
      - id: prepPollOut
        kind: self
      - id: fixedFd
        kind: internal
    steps:
      - set: s.opcode
        value: opPollAdd
      - set: s.fd
        to: fixedFd
        value: fixedFd(index)
      - set: s.flags
        value: sqeFixedFile
      - set: s.opFlags
        value: uint32(syscall.EPOLLOUT)
      - set: s.userData
        value: ud
  - of: prepCancelFixed
    participants:
      - id: caller
        kind: actor
      - id: prepCancelFixed
        kind: self
      - id: fixedFd
        kind: internal
    steps:
      - set: s.opcode
        value: opAsyncCancel
      - set: s.fd
        to: fixedFd
        value: fixedFd(index)
      - set: s.opFlags
        value: cancelFD | cancelFDFixed | cancelAll
      - set: s.userData
        value: ud
  - of: prepShutdownFixed
    participants:
      - id: caller
        kind: actor
      - id: prepShutdownFixed
        kind: self
      - id: fixedFd
        kind: internal
    steps:
      - set: s.opcode
        value: opShutdown
      - set: s.fd
        to: fixedFd
        value: fixedFd(index)
      - set: s.flags
        value: sqeFixedFile
      - set: s.len
        value: uint32(how)
      - set: s.userData
        value: ud
  - of: onProcessFD
    steps:
      - op: "&^="
        set: s.flags
        value: sqeFixedFile
      - switch:
          cases:
            - case: opAccept
              do:
                - set: s.fileIdx
                  value: "0"
                - set: s.opFlags
                  value: syscall.SOCK_CLOEXEC
            - case: opAsyncCancel
              do:
                - op: "&^="
                  set: s.opFlags
                  value: cancelFDFixed
          "on": s.opcode
  - of: prepCloseDirect
    participants:
      - id: caller
        kind: actor
      - id: prepCloseDirect
        kind: self
      - id: targetIndex
        kind: internal
    steps:
      - set: s.opcode
        value: opClose
      - set: s.fileIdx
        to: targetIndex
        value: targetIndex(index)
      - set: s.userData
        value: ud
  - of: prepCancelUserData
    steps:
      - set: s.opcode
        value: opAsyncCancel
      - set: s.addr
        value: target
      - set: s.opFlags
        value: cancelAll
      - set: s.userData
        value: ud
  - of: prepPollMulti
    steps:
      - set: s.opcode
        value: opPollAdd
      - set: s.fd
        value: int32(fd)
      - set: s.opFlags
        value: uint32(syscall.EPOLLIN)
      - set: s.len
        value: pollAddMulti
      - set: s.userData
        value: ud
  - of: (*uLoop).probeSendZC
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).probeSendZC
        kind: self
      - id: ul.sendZCRefusal
        kind: internal
      - id: ul.rep.found
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: ul.sw.disabled(corenet.CapabilityURingSendZC)
      - bind: reason
        eval: ul.sendZCRefusal()
        to: ul.sendZCRefusal
      - opt:
          do:
            - set: ul.uses.sendZCMin
              value: ul.lp.sz.sendZCMin
          when: reason == "" && ul.sw.wants(corenet.CapabilityURingSendZC)
      - eval: ul.rep.found(ul.sw, corenet.CapabilityURingSendZC, reason == "", reason)
        to: ul.rep.found
  - of: (*uLoop).sendZCRefusal
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).sendZCRefusal
        kind: self
      - id: openURing
        kind: internal
      - id: u.close
        kind: internal
      - id: u.supports
        kind: internal
      - id: sendZCRound
        kind: internal
    steps:
      - opt:
          do:
            - return: "\"send zc refused: \" + syscall.EINVAL.Error()"
          when: ul.hooks.failStage == "send_zc"
      - bind: u, step, errno
        eval: openURing(probeEntries, 0)
        to: openURing
      - opt:
          do:
            - return: "\"send zc probe \" + step + \": \" + errno.Error()"
          when: errno != 0
      - defer: u.close()
        to: u.close
      - bind: ok, perr
        eval: u.supports(opSendZC)
        to: u.supports
      - opt:
          do:
            - return: "\"REGISTER_PROBE: SEND_ZC unsupported\""
          when: perr != 0 || !ok
      - return: sendZCRound(u)
        to: sendZCRound
  - of: sendZCRound
    participants:
      - id: caller
        kind: actor
      - id: sendZCRound
        kind: self
      - id: loopbackPair
        kind: internal
      - id: closePair
        kind: internal
      - id: syscall
        kind: stdlib
      - id: u.get
        kind: internal
      - id: prepSendZC
        kind: internal
      - id: onProcessFD
        kind: internal
      - id: sendZCReap
        kind: internal
    steps:
      - bind: rx, tx, why
        eval: loopbackPair()
        to: loopbackPair
      - opt:
          do:
            - return: "\"send zc probe \" + why"
          when: why != ""
      - defer: closePair(rx, tx)
        to: closePair
      - bind: sa, err
        eval: syscall.Getsockname(rx)
        to: syscall
      - opt:
          do:
            - return: "\"send zc probe getsockname: \" + err.Error()"
          when: err != nil
      - opt:
          do:
            - return: "\"send zc probe connect: \" + err.Error()"
          init:
            bind: err
            eval: syscall.Connect(tx, sa)
            to: syscall
          when: err != nil
      - bind: s
        eval: u.get()
        to: u.get
      - opt:
          do:
            - return: "\"send zc probe: no SQE\""
          when: s == nil
      - bind: payload
        eval: "[]byte(\"kit\")"
      - eval: prepSendZC(s, 0, payload, udSend)
        to: prepSendZC
      - eval: onProcessFD(s)
        to: onProcessFD
      - set: s.fd
        value: int32(tx)
      - bind: sent, notified, res
        eval: sendZCReap(u)
        to: sendZCReap
      - switch:
          cases:
            - case: res < 0
              do:
                - return: "\"send zc refused: \" + syscall.Errno(-res).Error()"
            - case: "!sent || res != int32(len(payload))"
              do:
                - return: "\"send zc: no completion with F_MORE within the bound\""
            - case: "!notified"
              do:
                - return: "\"send zc: no notification within the bound\""
      - return: "\"\""
  - of: sendZCReap
    participants:
      - id: caller
        kind: actor
      - id: sendZCReap
        kind: self
      - id: u.wait
        kind: internal
      - id: u.reap
        kind: internal
    steps:
      - bind: ts
        eval: "kernelTimespec{nsec: int64(sendZCProbeWait)}"
      - loop:
          cond: "!notified && i < sendZCProbeTries"
          do:
            - eval: u.wait(&ts, 1)
              to: u.wait
            - eval: |-
                u.reap(sendZCProbeCQEs, func(c *cqe) {
                			//: the notification, or the send's own CQE.
                			if c.flags&cqeFNotif != 0 {
                				notified = true
                				return
                			}
                			sent, sendRes = c.flags&cqeFMore != 0, c.res
                		})
              to: u.reap
            - opt:
                do:
                  - break: true
                when: sendRes < 0
          init: i := 0
          post: i++
      - return: sent, notified, sendRes
  - of: (*uRing).zeroCopyDone
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).zeroCopyDone
        kind: self
      - id: rr.releaseFlight
        kind: internal
      - id: rr.sendPlainly
        kind: internal
      - id: rr.maybeClose
        kind: internal
    steps:
      - bind: cc
        eval: "&rr.r.conns[slot]"
      - opt:
          do:
            - opt:
                do:
                  - op: "--"
                    set: cc.ops
                  - op: "--"
                    set: cc.zcPend
                when: c.flags&cqeFMore == 0
            - return: "false"
          when: c.flags&cqeFNotif == 0
      - op: "--"
        set: cc.ops
      - op: "--"
        set: cc.zcPend
      - bind: alive
        eval: cc.state == stOpen || cc.state == stClosing
      - switch:
          cases:
            - case: cc.zcPend != 0 || cc.flags&fSending == 0
            - case: cc.flight.off >= cc.flight.len
              do:
                - eval: rr.releaseFlight(slot, alive)
                  to: rr.releaseFlight
            - case: cc.zc == zcHold
              do:
                - eval: rr.sendPlainly(slot, alive)
                  to: rr.sendPlainly
      - eval: rr.maybeClose(slot)
        to: rr.maybeClose
      - return: "true"
  - of: (*uRing).zeroCopyHandled
    steps:
      - return: rr.zeroCopyDone(slot, c) || (rr.r.conns[slot].zc == zcOn && rr.zeroCopyRefused(slot, c.res))
  - of: (*uRing).zeroCopyRefused
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).zeroCopyRefused
        kind: self
      - id: rr.sendPlainly
        kind: internal
      - id: rr.maybeClose
        kind: internal
    steps:
      - switch:
          cases:
            - case: syscall.EOPNOTSUPP
              do:
                - set: rr.ul.uses.sendZCMin
                  value: "0"
            - case: syscall.ENOMEM
            - default: true
              do:
                - return: "false"
          "on": syscall.Errno(-res)
      - bind: cc
        eval: "&rr.r.conns[slot]"
      - op: "--"
        set: cc.ops
      - opt:
          do:
            - set: cc.zc
              value: zcHold
            - return: "true"
          when: cc.zcPend > 0
      - eval: rr.sendPlainly(slot, cc.state == stOpen || cc.state == stClosing)
        to: rr.sendPlainly
      - eval: rr.maybeClose(slot)
        to: rr.maybeClose
      - return: "true"
  - of: (*uRing).sendPlainly
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).sendPlainly
        kind: self
      - id: rr.sendFlight
        kind: internal
    steps:
      - bind: cc
        eval: "&rr.r.conns[slot]"
      - set: cc.zc
        value: zcOff
      - opt:
          do:
            - eval: rr.sendFlight(slot)
              to: rr.sendFlight
            - return: ""
          when: alive
      - op: "&^="
        set: cc.flags
        value: fSending
  - of: newWheel
    steps:
      - bind: w
        eval: |-
          &wheel{
          		buckets: make([]int32, wheelSlots),
          		next:    make([]int32, n),
          		prev:    make([]int32, n),
          		at:      make([]int64, n),
          		now:     now,
          	}
      - loop:
          do:
            - set: w.buckets[i]
              value: noLink
          key: i
          range: w.buckets
      - return: w
  - of: (*wheel).arm
    participants:
      - id: caller
        kind: actor
      - id: (*wheel).arm
        kind: self
      - id: w.disarm
        kind: internal
    steps:
      - eval: w.disarm(slot)
        to: w.disarm
      - set: tick
        value: max(tick, w.now+1)
      - set: w.at[slot]
        value: tick
      - bind: b
        eval: tick & (wheelSlots - 1)
      - set: w.prev[slot]
        value: noLink
      - set: w.next[slot]
        value: w.buckets[b]
      - opt:
          do:
            - set: w.prev[h]
              value: slot
          init:
            bind: h
            eval: w.buckets[b]
          when: h != noLink
      - set: w.buckets[b]
        value: slot
  - of: (*wheel).disarm
    participants:
      - id: caller
        kind: actor
      - id: (*wheel).disarm
        kind: self
      - id: w.armed
        kind: internal
    steps:
      - bind: at
        eval: w.armed(slot)
        to: w.armed
      - opt:
          do:
            - return: ""
          when: at == 0
      - bind: b
        eval: at & (wheelSlots - 1)
      - alt:
          - do:
              - set: w.next[p]
                value: w.next[slot]
            init:
              bind: p
              eval: w.prev[slot]
            when: p != noLink
          - do:
              - set: w.buckets[b]
                value: w.next[slot]
            else: true
      - opt:
          do:
            - set: w.prev[n]
              value: w.prev[slot]
          init:
            bind: "n"
            eval: w.next[slot]
          when: n != noLink
      - set: w.at[slot]
        value: "0"
  - of: (*wheel).reserve
    steps:
      - opt:
          do:
            - return: ""
          when: cap(w.at) >= c
      - set: w.next, w.prev, w.at
        value: growTo(w.next, c), growTo(w.prev, c), growTo(w.at, c)
  - of: (*wheel).grow
    steps:
      - loop:
          cond: len(w.at) < n
          do:
            - set: w.next
              value: append(w.next, noLink)
            - set: w.prev
              value: append(w.prev, noLink)
            - set: w.at
              value: append(w.at, 0)
  - of: (*wheel).armed
    steps:
      - return: w.at[slot]
  - of: (*wheel).advance
    participants:
      - id: caller
        kind: actor
      - id: (*wheel).advance
        kind: self
      - id: w.disarm
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: now <= w.now
      - bind: from
        eval: w.now + 1
      - opt:
          do:
            - set: from
              value: now - wheelSlots + 1
          when: now-from >= wheelSlots
      - set: w.now
        value: now
      - set: w.due
        value: w.due[:0]
      - loop:
          cond: t <= now
          do:
            - bind: b
              eval: t & (wheelSlots - 1)
            - bind: s
              eval: w.buckets[b]
            - loop:
                cond: s != noLink
                do:
                  - bind: nxt
                    eval: w.next[s]
                  - opt:
                      do:
                        - eval: w.disarm(s)
                          to: w.disarm
                        - set: w.due
                          value: append(w.due, s)
                      when: w.at[s] <= now
                  - set: s
                    value: nxt
          init: t := from
          post: t++
      - loop:
          do:
            - eval: fire(s)
          key: _
          range: w.due
          value: s
  - of: zcrxField
    steps:
      - switch:
          cases:
            - case: v.ZCRX.Queue < 0
              do:
                - return: "\"ZCRX.Queue\""
            - case: v.ZCRX.AreaBytes < 0
              do:
                - return: "\"ZCRX.AreaBytes\""
      - return: "\"\""
  - of: zcrxOf
    steps:
      - bind: z
        eval: v.ZCRX
      - opt:
          do:
            - set: z.AreaBytes
              value: defaultZCRXArea
          when: z.AreaBytes == 0
      - set: z.AreaBytes
        value: (z.AreaBytes + page - 1) / page * page
      - return: z
  - of: (*uLoop).probeZCRX
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).probeZCRX
        kind: self
      - id: ul.rep.set
        kind: internal
      - id: ul.zcrxRegisterPlayed
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: ul.sw.disabled(corenet.CapabilityURingZCRX) || ul.lp.index != 0
      - opt:
          do:
            - eval: ul.rep.set(corenet.CapabilityURingZCRX, statusAbsent, reasonZCRXKernel)
              to: ul.rep.set
            - return: ""
          when: "!ul.zcrxOp()"
      - bind: z
        eval: ul.lp.sz.zcrx
      - opt:
          do:
            - eval: ul.rep.set(corenet.CapabilityURingZCRX, statusAvailable, reasonZCRXNone)
              to: ul.rep.set
            - return: ""
          when: z.Interface == ""
      - bind: step
        eval: "\"register_zcrx_ifq \" + z.Interface + \" queue \" + strconv.Itoa(z.Queue) + \": \""
      - bind: errno
        eval: ul.zcrxRegisterPlayed(z)
        to: ul.zcrxRegisterPlayed
      - opt:
          do:
            - eval: ul.rep.set(corenet.CapabilityURingZCRX, statusAbsent, step+errno.Error()+"; "+reasonClassB)
              to: ul.rep.set
            - return: ""
          when: errno != 0
      - eval: ul.rep.set(corenet.CapabilityURingZCRX, statusAvailable, step+"accepted on a throwaway ring; "+reasonClassB)
        to: ul.rep.set
  - of: (*uLoop).zcrxOp
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).zcrxOp
        kind: self
      - id: openURing
        kind: internal
      - id: u.close
        kind: internal
      - id: u.supports
        kind: internal
    steps:
      - switch:
          cases:
            - case: ul.hooks.failStage == "zcrx"
              do:
                - return: "false"
            - case: ul.hooks.zcrxKernel
              do:
                - return: "true"
      - bind: u, _, errno
        eval: openURing(probeEntries, 0)
        to: openURing
      - opt:
          do:
            - return: "false"
          when: errno != 0
      - defer: u.close()
        to: u.close
      - bind: ok, errno
        eval: u.supports(opRecvZC)
        to: u.supports
      - return: ok && errno == 0
  - of: (*uLoop).zcrxRegisterPlayed
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).zcrxRegisterPlayed
        kind: self
      - id: syscall
        kind: stdlib
      - id: zcrxRegister
        kind: internal
    steps:
      - opt:
          do:
            - return: syscall.Errno(ul.hooks.zcrxErrno)
              to: syscall
          when: ul.hooks.zcrxKernel
      - return: zcrxRegister(z)
        to: zcrxRegister
  - of: zcrxRegister
    participants:
      - id: caller
        kind: actor
      - id: zcrxRegister
        kind: self
      - id: stdnet
        kind: stdlib
      - id: openURing
        kind: internal
      - id: u.close
        kind: internal
      - id: mmapAnon
        kind: internal
      - id: uringRegister
        kind: internal
      - id: runtime
        kind: stdlib
    steps:
      - bind: ifc, err
        eval: stdnet.InterfaceByName(z.Interface)
        to: stdnet
      - opt:
          do:
            - return: syscall.ENODEV
          when: err != nil
      - bind: u, _, errno
        eval: openURing(probeEntries, setupSingleIssuer|setupDeferTaskrun|setupCQE32)
        to: openURing
      - opt:
          do:
            - return: errno
          when: errno != 0
      - defer: u.close()
        to: u.close
      - bind: area, err
        eval: mmapAnon(z.AreaBytes)
        to: mmapAnon
      - opt:
          do:
            - return: syscall.ENOMEM
          when: err != nil
      - defer: func() { swallowErr(syscall.Munmap(area)) }()
      - bind: region, err
        eval: mmapAnon(syscall.Getpagesize())
        to: mmapAnon
      - opt:
          do:
            - return: syscall.ENOMEM
          when: err != nil
      - defer: func() { swallowErr(syscall.Munmap(region)) }()
      - opt:
          do:
            - return: syscall.EINVAL
          when: zcrxRingHeader+uintptr(zcrxRQEntries)*unsafe.Sizeof(zcrxRQE{}) > uintptr(len(region))
      - bind: areaReg
        eval: "&zcrxAreaReg{addr: uint64(uintptr(unsafe.Pointer(&area[0]))), len: uint64(len(area))}"
      - bind: rd
        eval: "&regionDesc{userAddr: uint64(uintptr(unsafe.Pointer(&region[0]))), size: uint64(len(region)), flags: memRegionTypeUser}"
      - bind: reg
        eval: |-
          &zcrxIfqReg{
          		ifIdx: uint32(ifc.Index), ifRxq: uint32(z.Queue), rqEntries: zcrxRQEntries,
          		areaPtr: uint64(uintptr(unsafe.Pointer(areaReg))), regionPtr: uint64(uintptr(unsafe.Pointer(rd))),
          	}
      - set: errno
        to: uringRegister
        value: uringRegister(u.fd, regZCRXIfq, unsafe.Pointer(reg), 1)
      - eval: runtime.KeepAlive(areaReg)
        to: runtime
      - eval: runtime.KeepAlive(rd)
        to: runtime
      - return: errno
