        to: rr.ul.set.acceptsOf
      - bind: moved
        eval: n != rr.seen[i]
      - set: rr.seen[i]
        value: "n"
      - set: rr.lastAccept
        value: rr.ul.lp.tick
      - opt:
          do:
            - set: rr.stalls
              value: "0"
          when: moved
      - return: "!moved"
