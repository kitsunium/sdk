          do:
            - eval: st.u.wait(&tick)
              to: st.u.wait
            - eval: st.u.reap(64, st.onCQE)
              to: st.u.reap
  - of: (*selfTestRun).onCQE
    participants:
      - id: caller
        kind: actor
      - id: (*selfTestRun).onCQE
        kind: self
      - id: st.onAccept
