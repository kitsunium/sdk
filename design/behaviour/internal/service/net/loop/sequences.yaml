        kind: stdlib
      - id: g.hist[min(i, batchBuckets-1)].Add
        kind: value
    steps:
      - bind: i
        eval: bits.Len64(uint64(max(d, 0)))
        to: bits
      - eval: g.hist[min(i, batchBuckets-1)].Add(1)
        to: g.hist[min(i, batchBuckets-1)].Add
  - of: (*shared).batchP99
    participants:
      - id: caller
        kind: actor
      - id: (*shared).batchP99
        kind: self
      - id: g.hist[i].Load
        kind: value
      - id: time
        kind: stdlib
    steps:
      - var:
          name: counts
          type: "[batchBuckets]uint64"
      - var:
          name: total
          type: uint64
      - loop:
          do:
            - set: counts[i]
              to: g.hist[i].Load
              value: g.hist[i].Load()
            - op: +=
              set: total
              value: counts[i]
          key: i
          range: counts
      - opt:
          do:
            - return: "0"
          when: total == 0
      - bind: want
        eval: total - total/100
      - var:
          name: seen
          type: uint64
      - loop:
          do:
            - op: +=
              set: seen
              value: "n"
            - opt:
                do:
                  - return: time.Duration(uint64(1) << uint(i))
                    to: time
                when: seen >= want
          key: i
          range: counts
          value: "n"
      - return: time.Duration(uint64(1) << uint(batchBuckets-1))
        to: time
  - of: storeU
    participants:
      - id: caller
