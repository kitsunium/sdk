            - return: "0"
          init:
            bind: err
            eval: syscall.EpollCtl(epfd, syscall.EPOLL_CTL_ADD, int(efd), ev)
            to: syscall
          when: err != nil
      - eval: rep.found(sw, corenet.CapabilityEpollExclusive, true, "")
        to: rep.found
      - return: epollExclusive
  - of: (*epollRunner).drain
    participants:
      - id: caller
        kind: actor
      - id: (*epollRunner).drain
        kind: self
      - id: el.drainReq.Store
        kind: value
      - id: el.wake
        kind: internal
    steps:
      - loop:
          do:
            - eval: el.drainReq.Store(true)
              to: el.drainReq.Store
            - eval: el.wake()
              to: el.wake
          key: _
          range: er.loops
          value: el
  - of: (*epollRunner).stop
    participants:
      - id: caller
        kind: actor
      - id: (*epollRunner).stop
        kind: self
      - id: el.stopReq.Store
        kind: value
      - id: el.wake
        kind: internal
    steps:
      - loop:
          do:
            - eval: el.stopReq.Store(true)
              to: el.stopReq.Store
            - eval: el.wake()
              to: el.wake
          key: _
          range: er.loops
          value: el
  - of: (*epollRunner).wait
    steps:
      - eval: <-er.fin
  - of: (*epollRunner).done
    steps:
      - return: er.fin
  - of: (*epollLoop).wake
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).wake
        kind: self
      - id: syscall
        kind: stdlib
      - id: swallowErr
        kind: internal
