      - id: lp.slab.alloc
        kind: internal
      - id: lp.slab.free
        kind: internal
    steps:
      - bind: held
        eval: int(c.out.len - c.out.off)
      - bind: ch, ok
        eval: lp.slab.alloc(held + n)
        to: lp.slab.alloc
      - opt:
          do:
            - return: "false"
          when: "!ok"
      - set: ch.len
        value: int32(copy(lp.slab.bytes(ch), lp.slab.data(c.out)))
      - eval: lp.slab.free(c.out)
        to: lp.slab.free
      - set: c.out
        value: ch
      - return: "true"
  - of: (*loop).Close
    participants:
      - id: caller
        kind: actor
      - id: (*loop).Close
        kind: self
      - id: lp.lookup
        kind: internal
      - id: r.markDirty
        kind: internal
    steps:
      - opt:
          do:
            - return: corenet.LoopWrongThread
          when: lp.threadOK != nil && !lp.threadOK()
      - bind: r, slot, ok
        eval: lp.lookup(ref)
        to: lp.lookup
      - opt:
          do:
            - return: corenet.LoopStaleRef
          when: "!ok"
      - set: r.conns[slot].state
        value: stClosing
      - eval: r.markDirty(slot)
        to: r.markDirty
      - return: nil
  - of: (*loop).SetDeadline
    participants:
      - id: caller
        kind: actor
      - id: (*loop).SetDeadline
        kind: self
      - id: lp.lookup
        kind: internal
      - id: r.armTimer
        kind: internal
    steps:
      - opt:
          do:
            - return: corenet.LoopWrongThread
          when: lp.threadOK != nil && !lp.threadOK()
      - bind: r, slot, ok
        eval: lp.lookup(ref)
        to: lp.lookup
      - opt:
          do:
            - return: corenet.LoopStaleRef
          when: "!ok"
      - bind: c
        eval: "&r.conns[slot]"
      - alt:
          - do:
              - set: c.deadline
                value: "0"
            when: d <= 0
          - do:
              - set: c.deadline
                value: lp.now() + int64((d+tickEvery-1)/tickEvery)
            else: true
      - eval: r.armTimer(slot)
        to: r.armTimer
      - return: nil
  - of: (*loop).Pressure
    participants:
      - id: caller
        kind: actor
      - id: (*loop).Pressure
        kind: self
      - id: lp.lookup
        kind: internal
    steps:
      - bind: r, slot, ok
        eval: lp.lookup(ref)
        to: lp.lookup
      - opt:
          do:
            - return: "false"
          when: "!ok"
      - return: r.conns[slot].flags&fPressure != 0 || lp.hard
  - of: (*loop).Post
    participants:
      - id: caller
        kind: actor
      - id: (*loop).Post
        kind: self
      - id: lp.post.post
        kind: internal
    steps:
      - return: lp.post.post(op, arg)
        to: lp.post.post
  - of: (*loop).Loop
    steps:
      - return: lp.index
  - of: threadCheck
    steps:
      - return: nil
  - of: newListenerSet
    participants:
      - id: caller
        kind: actor
      - id: newListenerSet
        kind: self
      - id: ls.left[i].Store
        kind: value
    steps:
      - bind: ls
