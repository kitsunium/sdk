    participants:
      - id: caller
        kind: actor
      - id: (*slab).alloc
        kind: self
      - id: classOf
        kind: internal
    steps:
      - bind: cls
        eval: classOf(n)
        to: classOf
      - opt:
          do:
            - return: "chunkRef{idx: noChunk}, false"
          when: int(cls) >= len(s.classes)
      - bind: c
        eval: "&s.classes[cls]"
      - opt:
          do:
            - return: "chunkRef{idx: noChunk}, false"
