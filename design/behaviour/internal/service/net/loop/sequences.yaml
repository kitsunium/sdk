  - of: (*uring).enterSubmit
    participants:
      - id: caller
        kind: actor
      - id: (*uring).enterSubmit
        kind: self
      - id: uringEnterSubmit
        kind: internal
      - id: uringEnterFlags
        kind: internal
    steps:
      - opt:
          do:
            - return: uringEnterSubmit(fd, n)
              to: uringEnterSubmit
          when: flags == 0
      - return: uringEnterFlags(fd, n, flags)
        to: uringEnterFlags
  - of: (*uring).enterTarget
    steps:
      - opt:
          do:
            - return: int(u.ringIdx), enterRegisteredRing
          when: u.ringIdx >= 0
      - return: u.fd, 0
  - of: (*uring).registerRing
    participants:
      - id: caller
        kind: actor
      - id: (*uring).registerRing
        kind: self
      - id: uringRegister
        kind: internal
    steps:
      - bind: upd
        eval: "new(rsrcUpdate{offset: ringFDAlloc, data: uint64(u.fd)})"
      - bind: errno
        eval: uringRegister(u.fd, regRingFDs, unsafe.Pointer(upd), 1)
        to: uringRegister
      - opt:
          do:
            - return: errno
          when: errno != 0
      - set: u.ringIdx
        value: int32(upd.offset)
      - return: "0"
  - of: (*uring).unregisterRing
    participants:
      - id: caller
        kind: actor
      - id: (*uring).unregisterRing
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: u.ringIdx < 0 || u.fd < 0
      - bind: upd
        eval: "new(rsrcUpdate{offset: uint32(u.ringIdx)})"
      - eval: swallowErr(uringRegister(u.fd, unregRingFDs, unsafe.Pointer(upd), 1))
        to: swallowErr
      - set: u.ringIdx
        value: "-1"
  - of: (*uring).pending
    steps:
      - return: u.tail - u.submitted
  - of: (*uring).submit
    participants:
      - id: caller
        kind: actor
      - id: (*uring).submit
        kind: self
      - id: u.publish
        kind: internal
      - id: u.pending
        kind: internal
      - id: u.enterTarget
        kind: internal
      - id: u.enterSubmit
        kind: internal
      - id: u.consumed
        kind: internal
    steps:
      - eval: u.publish()
        to: u.publish
      - loop:
          do:
            - bind: "n"
              eval: u.pending()
              to: u.pending
            - opt:
                do:
                  - return: ""
                when: n == 0
            - bind: fd, reg
              eval: u.enterTarget()
              to: u.enterTarget
            - bind: flags
              eval: reg
            - opt:
                do:
                  - op: "|="
                    set: flags
                    value: enterGetEvents
                when: u.deferred()
            - bind: got, errno
              eval: u.enterSubmit(fd, n, flags)
              to: u.enterSubmit
            - switch:
                cases:
                  - case: "0"
                    do:
                      - eval: u.consumed(uint32(got))
                        to: u.consumed
                  - case: syscall.EINTR
                  - default: true
                    do:
                      - op: ++
                        set: u.retries
                      - return: ""
                "on": errno
          range: enterRetries
  - of: (*uring).wait
    participants:
      - id: caller
        kind: actor
      - id: (*uring).wait
        kind: self
      - id: u.publish
        kind: internal
      - id: u.enterTarget
        kind: internal
      - id: uringEnterWait
        kind: internal
      - id: u.consumed
        kind: internal
    steps:
      - eval: u.publish()
        to: u.publish
      - bind: arg
        eval: "getEventsArg{ts: uint64(uintptr(unsafe.Pointer(ts)))}"
      - bind: minComplete
        eval: uint32(1)
      - opt:
          do:
            - set: minComplete
              value: "0"
          when: u.ready() > 0
      - bind: fd, reg
        eval: u.enterTarget()
        to: u.enterTarget
      - bind: got, errno
        eval: uringEnterWait(fd, u.pending(), minComplete, enterGetEvents|enterExtArg|reg, unsafe.Pointer(&arg), unsafe.Sizeof(arg))
        to: uringEnterWait
      - switch:
          cases:
            - case: "0"
              do:
                - eval: u.consumed(uint32(got))
                  to: u.consumed
            - case: errnoETIME, syscall.EINTR
            - default: true
              do:
                - op: ++
                  set: u.retries
          "on": errno
  - of: (*uring).ready
    steps:
      - return: atomic.LoadUint32(u.cqTail) - *u.cqHead
  - of: (*uring).reap
    participants:
      - id: caller
        kind: actor
      - id: (*uring).reap
        kind: self
      - id: atomic
        kind: stdlib
    steps:
      - bind: head
        eval: "*u.cqHead"
      - bind: tail
        eval: atomic.LoadUint32(u.cqTail)
        to: atomic
      - bind: "n"
        eval: "0"
      - loop:
          cond: head != tail && n < max
          do:
            - eval: fn(&u.cqes[head&u.cqMask])
            - op: ++
              set: head
            - op: ++
              set: "n"
      - eval: atomic.StoreUint32(u.cqHead, head)
        to: atomic
      - return: "n"
  - of: (*uring).overflowed
    steps:
      - return: atomic.LoadUint32(u.sqFlags)&sqCQOverflow != 0
  - of: (*uring).setupBuffers
    participants:
      - id: caller
        kind: actor
      - id: (*uring).setupBuffers
        kind: self
      - id: syscall
        kind: stdlib
      - id: errnoOfErr
        kind: internal
      - id: u.mapBufRing
        kind: internal
      - id: u.addBuf
        kind: internal
      - id: u.publishBufs
        kind: internal
    steps:
      - bind: bm, err
        eval: syscall.Mmap(-1, 0, int(count)*int(size), syscall.PROT_READ|syscall.PROT_WRITE, syscall.MAP_PRIVATE|syscall.MAP_ANONYMOUS)
        to: syscall
      - opt:
          do:
            - return: errnoOfErr(err)
              to: errnoOfErr
          when: err != nil
      - set: u.bufMem, u.bufCount, u.bufSize
        value: bm, count, size
      - opt:
          do:
            - return: errno
          init:
            bind: errno
            eval: u.mapBufRing(count)
            to: u.mapBufRing
          when: errno != 0
      - loop:
          do:
            - eval: u.addBuf(uint16(bid))
              to: u.addBuf
          key: bid
          range: count
      - eval: u.publishBufs()
        to: u.publishBufs
      - return: "0"
  - of: (*uring).mapBufRing
    participants:
      - id: caller
        kind: actor
      - id: (*uring).mapBufRing
        kind: self
      - id: registerBufRing
        kind: internal
      - id: syscall
        kind: stdlib
      - id: errnoOfErr
        kind: internal
    steps:
      - bind: ringBytes
        eval: max(int(count)*int(unsafe.Sizeof(uringBuf{})), syscall.Getpagesize())
      - bind: errno
        eval: "registerBufRing(u.fd, &bufReg{ringEntries: count, bgid: bufGroup, flags: pbufRingMmap})"
        to: registerBufRing
      - opt:
          do:
            - bind: "off"
              eval: offPbufRing | uintptr(bufGroup)<<offPbufShift
            - bind: rm, err
              eval: syscall.Mmap(u.fd, int64(off), ringBytes, syscall.PROT_READ|syscall.PROT_WRITE, syscall.MAP_SHARED|syscall.MAP_POPULATE)
              to: syscall
            - opt:
                do:
                  - return: errnoOfErr(err)
                    to: errnoOfErr
                when: err != nil
            - set: u.bufRing
              value: rm
            - return: "0"
          when: errno == 0
      - opt:
          do:
            - return: errno
          when: errno != syscall.EINVAL
      - bind: rm, err
        eval: syscall.Mmap(-1, 0, ringBytes, syscall.PROT_READ|syscall.PROT_WRITE, syscall.MAP_PRIVATE|syscall.MAP_ANONYMOUS)
        to: syscall
      - opt:
          do:
            - return: errnoOfErr(err)
              to: errnoOfErr
          when: err != nil
      - set: u.bufRing
        value: rm
      - return: "registerBufRing(u.fd, &bufReg{ringAddr: uint64(uintptr(unsafe.Pointer(&rm[0]))), ringEntries: count, bgid: bufGroup})"
        to: registerBufRing
  - of: registerBufRing
    participants:
      - id: caller
        kind: actor
      - id: registerBufRing
        kind: self
      - id: uringRegister
        kind: internal
    steps:
      - bind: errno
        eval: uringRegister(fd, regPbufRing, unsafe.Pointer(reg), 1)
        to: uringRegister
      - opt:
          do:
            - return: errno
          when: errno != syscall.EINVAL
      - bind: quirk
        eval: "*reg"
      - set: quirk.resv[2]
        value: "1"
      - return: uringRegister(fd, regPbufRing, unsafe.Pointer(&quirk), 1)
        to: uringRegister
  - of: (*uring).bufEntries
    participants:
      - id: caller
        kind: actor
      - id: (*uring).bufEntries
        kind: self
      - id: unsafe
        kind: stdlib
    steps:
      - return: unsafe.Slice((*uringBuf)(unsafe.Pointer(&u.bufRing[0])), u.bufCount)
        to: unsafe
  - of: (*uring).buf
    steps:
      - bind: o
        eval: int(bid) * int(u.bufSize)
      - return: "u.bufMem[o : o+int(u.bufSize) : o+int(u.bufSize)]"
  - of: (*uring).addBuf
    steps:
      - bind: i
        eval: uint32(u.bufTail) & (u.bufCount - 1)
      - bind: e
        eval: "&u.bufEntries()[i]"
      - set: e.addr
        value: uint64(uintptr(unsafe.Pointer(&u.bufMem[int(bid)*int(u.bufSize)])))
      - set: e.len
        value: u.bufSize
      - alt:
          - do:
              - set: u.shadowBid
                value: bid
            when: i == 0
          - do:
              - set: e.bid
                value: bid
            else: true
      - op: ++
        set: u.bufTail
  - of: (*uring).publishBufs
    participants:
      - id: caller
        kind: actor
      - id: (*uring).publishBufs
        kind: self
      - id: atomic
        kind: stdlib
    steps:
      - bind: w
        eval: (*uint32)(unsafe.Pointer(&u.bufRing[12]))
      - eval: atomic.StoreUint32(w, uint32(u.shadowBid)|uint32(u.bufTail)<<16)
        to: atomic
  - of: (*uring).registerSparse
    participants:
      - id: caller
        kind: actor
      - id: (*uring).registerSparse
        kind: self
      - id: uringRegister
        kind: internal
    steps:
      - bind: r
        eval: "rsrcRegister{nr: n, flags: rsrcRegisterSparse}"
      - return: uringRegister(u.fd, regFiles2, unsafe.Pointer(&r), uint32(unsafe.Sizeof(r)))
        to: uringRegister
  - of: (*uring).supports
    participants:
      - id: caller
        kind: actor
      - id: (*uring).supports
        kind: self
      - id: uringRegister
        kind: internal
    steps:
      - var:
          name: p
          type: probeBuf
      - opt:
          do:
            - return: false, errno
          init:
            bind: errno
            eval: uringRegister(u.fd, regProbe, unsafe.Pointer(&p), probeOps)
            to: uringRegister
          when: errno != 0
      - loop:
          do:
            - opt:
                do:
                  - return: false, 0
                when: op > p.hdr.lastOp || p.ops[op].flags&probeOpSupported == 0
          key: _
          range: ops
          value: op
      - return: true, 0
  - of: singleShot
    steps:
      - op: "&^="
        set: s.ioprio
        value: recvMultishot
  - of: prepAccept
    steps:
      - set: s.opcode
        value: opAccept
      - set: s.fd
        value: int32(lfd)
      - opt:
          do:
            - set: s.ioprio
              value: acceptMultishot
          when: multishot
      - set: s.fileIdx
        value: fileIndexAlloc
      - set: s.userData
        value: ud
  - of: prepRecv
    participants:
      - id: caller
        kind: actor
      - id: prepRecv
        kind: self
      - id: fixedFd
        kind: internal
    steps:
      - set: s.opcode
        value: opRecv
      - set: s.fd
        to: fixedFd
        value: fixedFd(index)
      - set: s.flags
        value: sqeFixedFile | sqeBufferSelect
      - set: s.ioprio
        value: recvMultishot
      - set: s.bufIndex
        value: bufGroup
      - set: s.userData
        value: ud
  - of: prepSend
    participants:
      - id: caller
        kind: actor
      - id: prepSend
        kind: self
      - id: fixedFd
        kind: internal
    steps:
      - set: s.opcode
        value: opSend
      - set: s.fd
        to: fixedFd
        value: fixedFd(index)
      - set: s.flags
        value: sqeFixedFile
      - set: s.addr
        value: uint64(uintptr(unsafe.Pointer(&p[0])))
      - set: s.len
        value: uint32(len(p))
      - set: s.opFlags
        value: uint32(syscall.MSG_NOSIGNAL)
      - set: s.userData
        value: ud
  - of: prepCancelFixed
    participants:
      - id: caller
        kind: actor
      - id: prepCancelFixed
        kind: self
      - id: fixedFd
        kind: internal
    steps:
      - set: s.opcode
        value: opAsyncCancel
      - set: s.fd
        to: fixedFd
        value: fixedFd(index)
      - set: s.opFlags
        value: cancelFD | cancelFDFixed | cancelAll
      - set: s.userData
        value: ud
  - of: prepShutdownFixed
    participants:
      - id: caller
        kind: actor
      - id: prepShutdownFixed
        kind: self
      - id: fixedFd
        kind: internal
    steps:
      - set: s.opcode
        value: opShutdown
      - set: s.fd
        to: fixedFd
        value: fixedFd(index)
      - set: s.flags
        value: sqeFixedFile
      - set: s.len
        value: uint32(how)
      - set: s.userData
        value: ud
  - of: onProcessFD
    steps:
      - op: "&^="
        set: s.flags
        value: sqeFixedFile
      - switch:
          cases:
            - case: opAccept
              do:
                - set: s.fileIdx
                  value: "0"
                - set: s.opFlags
                  value: syscall.SOCK_CLOEXEC
            - case: opAsyncCancel
              do:
                - op: "&^="
                  set: s.opFlags
                  value: cancelFDFixed
          "on": s.opcode
  - of: prepCloseDirect
    participants:
      - id: caller
        kind: actor
      - id: prepCloseDirect
        kind: self
      - id: targetIndex
        kind: internal
    steps:
      - set: s.opcode
        value: opClose
      - set: s.fileIdx
        to: targetIndex
        value: targetIndex(index)
      - set: s.userData
        value: ud
  - of: prepCancelUserData
    steps:
      - set: s.opcode
        value: opAsyncCancel
      - set: s.addr
        value: target
      - set: s.opFlags
        value: cancelAll
      - set: s.userData
        value: ud
  - of: prepPollMulti
    steps:
      - set: s.opcode
        value: opPollAdd
      - set: s.fd
        value: int32(fd)
      - set: s.opFlags
        value: uint32(syscall.EPOLLIN)
      - set: s.len
        value: pollAddMulti
      - set: s.userData
        value: ud
  - of: newWheel
    steps:
      - bind: w
        eval: |-
          &wheel{
          		buckets: make([]int32, wheelSlots),
          		next:    make([]int32, n),
          		prev:    make([]int32, n),
          		at:      make([]int64, n),
          		now:     now,
          	}
      - loop:
          do:
            - set: w.buckets[i]
              value: noLink
          key: i
          range: w.buckets
      - return: w
  - of: (*wheel).arm
    participants:
      - id: caller
        kind: actor
      - id: (*wheel).arm
        kind: self
      - id: w.disarm
        kind: internal
    steps:
      - eval: w.disarm(slot)
        to: w.disarm
      - set: tick
        value: max(tick, w.now+1)
      - set: w.at[slot]
        value: tick
      - bind: b
        eval: tick & (wheelSlots - 1)
      - set: w.prev[slot]
        value: noLink
      - set: w.next[slot]
        value: w.buckets[b]
      - opt:
          do:
            - set: w.prev[h]
              value: slot
          init:
            bind: h
            eval: w.buckets[b]
          when: h != noLink
      - set: w.buckets[b]
        value: slot
  - of: (*wheel).disarm
    participants:
      - id: caller
        kind: actor
      - id: (*wheel).disarm
        kind: self
      - id: w.armed
        kind: internal
    steps:
      - bind: at
        eval: w.armed(slot)
        to: w.armed
      - opt:
          do:
            - return: ""
          when: at == 0
      - bind: b
        eval: at & (wheelSlots - 1)
      - alt:
          - do:
              - set: w.next[p]
                value: w.next[slot]
            init:
              bind: p
              eval: w.prev[slot]
            when: p != noLink
          - do:
              - set: w.buckets[b]
                value: w.next[slot]
            else: true
      - opt:
          do:
            - set: w.prev[n]
              value: w.prev[slot]
          init:
            bind: "n"
            eval: w.next[slot]
          when: n != noLink
      - set: w.at[slot]
        value: "0"
  - of: (*wheel).grow
    steps:
      - loop:
          cond: len(w.at) < n
          do:
            - set: w.next
              value: append(w.next, noLink)
            - set: w.prev
              value: append(w.prev, noLink)
            - set: w.at
              value: append(w.at, 0)
  - of: (*wheel).armed
    steps:
      - return: w.at[slot]
  - of: (*wheel).advance
    participants:
      - id: caller
        kind: actor
      - id: (*wheel).advance
        kind: self
      - id: w.disarm
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: now <= w.now
      - bind: from
        eval: w.now + 1
      - opt:
          do:
            - set: from
              value: now - wheelSlots + 1
          when: now-from >= wheelSlots
      - set: w.now
        value: now
      - set: w.due
        value: w.due[:0]
      - loop:
          cond: t <= now
          do:
            - bind: b
              eval: t & (wheelSlots - 1)
            - bind: s
              eval: w.buckets[b]
            - loop:
                cond: s != noLink
                do:
                  - bind: nxt
                    eval: w.next[s]
                  - opt:
                      do:
                        - eval: w.disarm(s)
                          to: w.disarm
                        - set: w.due
                          value: append(w.due, s)
                      when: w.at[s] <= now
                  - set: s
                    value: nxt
          init: t := from
          post: t++
      - loop:
          do:
            - eval: fire(s)
          key: _
          range: w.due
          value: s
