          init:
            bind: errno
            eval: uringRegister(u.fd, regEventFD, unsafe.Pointer(fd), 1)
            to: uringRegister
          when: errno != 0
      - return: nil
  - of: (*uLoop).registerTable
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).registerTable
        kind: self
      - id: u.registerSparse
        kind: internal
      - id: probeError
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: "!ul.direct && ul.hooks.failStage != \"sparse_files\""
      - bind: errno
        eval: u.registerSparse(n)
        to: u.registerSparse
      - opt:
          do:
            - return: probeError("sparse_files", orErrno(errno, syscall.EOPNOTSUPP))
              to: probeError
          when: errno != 0 || ul.hooks.failStage == "sparse_files"
      - return: nil
  - of: (*uLoop).slotSpace
    steps:
      - opt:
          do:
            - return: int(table)
