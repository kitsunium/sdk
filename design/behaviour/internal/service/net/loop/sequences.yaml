            - bind: s
              eval: st.u.get()
              to: st.u.get
            - eval: prepShutdownFixed(s, index, syscall.SHUT_RDWR, udPack(udShutdown, 0, 0))
              to: prepShutdownFixed
            - op: "|="
              set: s.flags
              value: sqeIOHardlink
            - set: ops
              value: "2"
          when: shut
      - eval: prepCancelFixed(st.u.get(), index, udPack(udCancel, 0, 0))
        to: prepCancelFixed
      - eval: st.pump(func() bool { return st.done >= ops })
        to: st.pump
      - set: st.closed
        value: "false"
      - eval: prepCloseDirect(st.u.get(), index, udPack(udClose, 0, 0))
        to: prepCloseDirect
      - eval: st.pump(func() bool { return st.closed })
        to: st.pump
      - opt:
          do:
            - return: false, false
          when: "!st.closed"
      - return: peerSeesEnd(cfd), true
        to: peerSeesEnd
  - of: peerSeesEnd
    participants:
      - id: caller
        kind: actor
      - id: peerSeesEnd
        kind: self
      - id: time.Now().Add
        kind: value
      - id: syscall
        kind: stdlib
      - id: time
        kind: stdlib
    steps:
      - var:
          name: buf
          type: "[peerPeekBytes]byte"
      - bind: deadline
        eval: time.Now().Add(200 * time.Millisecond)
        to: time.Now().Add
      - loop:
          cond: time.Now().Before(deadline)
          do:
            - bind: n, _, err
              eval: syscall.Recvfrom(fd, buf[:], syscall.MSG_DONTWAIT)
              to: syscall
            - opt:
                do:
                  - return: "true"
                when: n == 0 && err == nil
            - eval: time.Sleep(5 * time.Millisecond)
              to: time
      - return: "false"
