        value: int(bufs)
      - set: rr.slotOf
        to: slices
        value: slices.Repeat([]int32{-1}, ul.slotSpace(table))
      - opt:
          do:
            - eval: u.close()
              to: u.close
            - return: nil, err
          init:
            bind: err
            eval: ul.registerFan(i, u)
            to: ul.registerFan
          when: err != nil
      - eval: rr.armAccepts()
        to: rr.armAccepts
      - return: rr, nil
  - of: (*uLoop).bufShape
    steps:
      - opt:
          do:
            - return: ul.hooks.bufs, max(ul.hooks.bufSize, 64)
          when: ul.hooks.bufs > 0
      - return: defaultBufs, defaultBufSize
  - of: (*uLoop).registerFan
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).registerFan
        kind: self
      - id: uringRegister
        kind: internal
      - id: probeError
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: i == 0
      - bind: fd
        eval: new(int32(ul.fanfd))
      - opt:
          do:
            - return: probeError("register_eventfd", errno)
