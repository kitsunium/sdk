          when: direct
      - eval: ul.reportSelfTest(direct)
        to: ul.reportSelfTest
      - return: ul.build(rings, direct && deferred)
        to: ul.build
  - of: (*uLoop).build
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).build
        kind: self
      - id: newPostQueue
        kind: internal
      - id: syscall
        kind: stdlib
      - id: probeError
        kind: internal
      - id: ul.newRing
        kind: internal
      - id: ul.reportPbufInc
        kind: internal
      - id: ul.probeBundle
        kind: internal
      - id: ul.probeSendZC
        kind: internal
      - id: ul.probeBusyPoll
        kind: internal
      - id: ul.probeZCRX
        kind: internal
      - id: primary.pollFD
        kind: internal
    steps:
      - bind: lp
        eval: ul.lp
      - set: lp.post
        to: newPostQueue
        value: newPostQueue(ul.wake)
      - bind: wfd, _, e1
        eval: syscall.RawSyscall(syscall.SYS_EVENTFD2, 0, efdNonblock|efdCloexec, 0)
        to: syscall
      - bind: ffd, _, e2
        eval: syscall.RawSyscall(syscall.SYS_EVENTFD2, 0, efdNonblock|efdCloexec, 0)
        to: syscall
      - opt:
          do:
            - return: probeError("eventfd", orErrno(e1, e2))
