  - of: (*slabClass).idleArenas
    participants:
      - id: caller
        kind: actor
      - id: (*slabClass).idleArenas
        kind: self
      - id: scratch
        kind: internal
    steps:
      - set: c.freeIn
        to: scratch
        value: scratch(c.freeIn, len(c.arenas))
      - loop:
          do:
            - op: ++
              set: c.freeIn[int(idx)/c.perArena]
          key: _
          range: c.free
          value: idx
      - bind: "n"
        eval: "0"
      - loop:
          do:
            - opt:
                do:
                  - op: ++
                    set: "n"
