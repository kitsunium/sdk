        to: openURing
      - opt:
          do:
            - return: "\"bundle probe \" + step + \": \" + errno.Error()"
          when: errno != 0
      - defer: u.close()
        to: u.close
      - opt:
          do:
            - return: "\"IORING_FEAT_RECVSEND_BUNDLE not advertised\""
