    steps:
      - opt:
          do:
            - return: yieldEvery
          when: procs > loops
      - return: "0"
  - of: ResolveLoops
    steps:
      - opt:
          do:
            - return: n, loopsExplicit
          when: n > 0
      - opt:
          do:
            - return: 1, loopsSingle
          when: n != corenet.LoopsAuto
