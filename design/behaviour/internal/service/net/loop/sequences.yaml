        eval: "&slab{budget: budget, mapper: mapper, classes: make([]slabClass, int(top)+1)}"
      - loop:
          do:
            - bind: size
              eval: 1 << (minClassShift + uint(i))
            - set: s.classes[i]
              value: "slabClass{size: size, perArena: max(arenaBytes/size, 1)}"
          key: i
          range: s.classes
      - return: s
  - of: classOf
    steps:
      - opt:
          do:
            - return: "0"
          when: n <= 1<<minClassShift
      - return: uint8(uint(bits.Len(uint(n-1))) - minClassShift)
