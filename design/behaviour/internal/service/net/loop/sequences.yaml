  - of: ringCount
    steps:
      - opt:
          do:
            - return: explicit, ringsExplicit
          when: explicit > 0
      - opt:
          do:
            - return: 1, ringsSingle
          when: target <= 0
      - bind: "n"
        eval: (uint64(target) + table - 1) / table
      - opt:
          do:
            - return: 1, ringsSingle
          when: n <= 1
      - return: int(n), ringsDerived
  - of: batchWaitOf
    participants:
      - id: caller
        kind: actor
      - id: batchWaitOf
        kind: self
      - id: time
        kind: stdlib
    steps:
      - bind: d
        eval: time.Duration(v.BatchWait)
        to: time
