          		pub: &ringStats{},
          	}
  - of: slotCap
    steps:
      - return: max(min(max(2*cur, 64), cur+slotStep, table), cur+1)
  - of: growTo
    steps:
      - bind: g
        eval: make([]T, len(s), c)
      - eval: copy(g, s)
      - return: g
  - of: (*ring).take
    participants:
      - id: caller
        kind: actor
      - id: (*ring).take
        kind: self
      - id: slotCap
        kind: internal
      - id: growTo
        kind: internal
      - id: r.wheel.reserve
        kind: internal
      - id: r.wheel.grow
        kind: internal
      - id: emptyConn
        kind: internal
    steps:
      - var:
          name: slot
          type: int32
      - alt:
          - do:
              - set: slot
                value: r.free[n-1]
              - set: r.free
                value: r.free[:n-1]
            init:
              bind: "n"
              eval: len(r.free)
            when: n > 0
          - do:
              - opt:
                  do:
                    - return: 0, false
                  when: len(r.conns) >= r.lp.sz.tableSize
              - set: slot
                value: int32(len(r.conns))
              - opt:
                  do:
                    - bind: c
                      eval: slotCap(cap(r.conns), r.lp.sz.tableSize)
                      to: slotCap
                    - set: r.conns
                      to: growTo
                      value: growTo(r.conns, c)
                    - eval: r.wheel.reserve(c)
                      to: r.wheel.reserve
                  when: len(r.conns) == cap(r.conns)
              - set: r.conns
                value: append(r.conns, emptyConn(0))
              - eval: r.wheel.grow(len(r.conns))
                to: r.wheel.grow
            else: true
      - bind: c
        eval: "&r.conns[slot]"
      - bind: gen
        eval: c.gen + 1
      - opt:
          do:
            - set: gen
              value: "1"
          when: gen == 0
      - set: "*c"
        to: emptyConn
        value: emptyConn(gen)
      - set: c.state, c.fd, c.lastIO
        value: stOpen, fd, r.lp.tick
      - return: slot, true
  - of: (*ring).opened
    participants:
      - id: caller
        kind: actor
      - id: (*ring).opened
        kind: self
      - id: r.lp.grp.live.Add
        kind: value
      - id: r.lruPush
        kind: internal
      - id: r.armTimer
        kind: internal
      - id: r.lp.h.OnOpen
        kind: value
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - bind: live
        eval: r.lp.grp.live.Add(1)
        to: r.lp.grp.live.Add
      - op: ++
        set: r.live
      - op: ++
        set: r.st.accepted
      - opt:
          do:
            - op: "|="
              set: c.flags
              value: fPressure
          init:
            bind: soft
            eval: r.lp.sz.softConns
          when: soft > 0 && live > int64(soft)
      - eval: r.lruPush(slot)
        to: r.lruPush
      - eval: r.armTimer(slot)
        to: r.armTimer
      - eval: r.lp.h.OnOpen(r.lp, r.ref(slot))
        to: r.lp.h.OnOpen
  - of: (*ring).abandon
    participants:
      - id: caller
        kind: actor
      - id: (*ring).abandon
        kind: self
      - id: emptyConn
        kind: internal
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - set: "*c"
        to: emptyConn
        value: emptyConn(c.gen)
      - set: r.free
        value: append(r.free, slot)
  - of: (*loop).evictable
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - return: c.state == stOpen && c.spill.empty() && c.pending() == 0 && c.fileFD < 0 && !r.drv.unread(r, slot) && !lp.waits(r, slot)
  - of: (*loop).waits
    steps:
      - return: lp.busy != nil && lp.busy(lp.index, r.ref(slot))
  - of: (*ring).ref
    steps:
      - return: "corenet.LoopConnRef{Ring: uint32(r.index), Slot: uint32(slot), Gen: r.conns[slot].gen}"
  - of: (*ring).deliver
    participants:
      - id: caller
        kind: actor
      - id: (*ring).deliver
        kind: self
      - id: r.lruTouch
        kind: internal
      - id: clampConsumed
        kind: internal
      - id: r.keep
        kind: internal
      - id: lp.slab.data
        kind: internal
      - id: r.consumed
        kind: internal
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - opt:
          do:
            - return: ""
          when: c.state != stOpen || len(data) == 0
      - set: c.lastIO
        value: r.lp.tick
      - op: "|="
        set: c.flags
        value: fHeard
      - op: +=
        set: r.st.bytesIn
        value: uint64(len(data))
      - eval: r.lruTouch(slot)
        to: r.lruTouch
      - bind: lp
        eval: r.lp
      - opt:
          do:
            - bind: "n"
              eval: clampConsumed(lp.h.OnData(lp, r.ref(slot), data), len(data))
              to: clampConsumed
            - opt:
                do:
                  - eval: r.keep(slot, data[n:])
                    to: r.keep
                when: c.state == stOpen && n < len(data)
            - return: ""
          when: c.spill.empty()
      - opt:
          do:
            - return: ""
          when: "!r.appendSpill(slot, data)"
      - bind: buf
        eval: lp.slab.data(c.spill)
        to: lp.slab.data
      - bind: "n"
        eval: clampConsumed(lp.h.OnData(lp, r.ref(slot), buf), len(buf))
        to: clampConsumed
      - eval: r.consumed(slot, n)
        to: r.consumed
  - of: (*ring).keep
    participants:
      - id: caller
        kind: actor
      - id: (*ring).keep
        kind: self
      - id: r.fail
        kind: internal
      - id: lp.slab.alloc
        kind: internal
    steps:
      - bind: lp
        eval: r.lp
      - opt:
          do:
            - eval: r.fail(slot, rSpill, 0)
              to: r.fail
            - return: ""
          when: len(tail) > lp.sz.spillCap
      - bind: ch, ok
        eval: lp.slab.alloc(len(tail))
        to: lp.slab.alloc
      - opt:
          do:
            - eval: r.fail(slot, rSpill, 0)
              to: r.fail
            - return: ""
          when: "!ok"
      - set: ch.len
        value: int32(copy(lp.slab.bytes(ch), tail))
      - set: r.conns[slot].spill
        value: ch
  - of: (*ring).appendSpill
    participants:
      - id: caller
        kind: actor
      - id: (*ring).appendSpill
        kind: self
      - id: r.fail
        kind: internal
      - id: lp.slab.alloc
        kind: internal
      - id: lp.slab.bytes
        kind: internal
    steps:
      - bind: lp
        eval: r.lp
      - bind: c
        eval: "&r.conns[slot]"
      - bind: held
        eval: int(c.spill.len - c.spill.off)
      - opt:
          do:
            - eval: r.fail(slot, rSpill, 0)
              to: r.fail
            - return: "false"
          when: held+len(data) > lp.sz.spillCap
      - opt:
          do:
            - op: +=
              set: c.spill.len
              value: int32(copy(lp.slab.bytes(c.spill)[c.spill.len:], data))
            - return: "true"
          when: lp.slab.size(c.spill)-int(c.spill.len) >= len(data)
      - bind: ch, ok
        eval: lp.slab.alloc(held + len(data))
        to: lp.slab.alloc
      - opt:
          do:
            - eval: r.fail(slot, rSpill, 0)
              to: r.fail
            - return: "false"
          when: "!ok"
      - bind: dst
        eval: lp.slab.bytes(ch)
        to: lp.slab.bytes
      - bind: "n"
        eval: copy(dst, lp.slab.data(c.spill))
      - op: +=
        set: "n"
        value: copy(dst[n:], data)
      - set: ch.len
        value: int32(n)
      - set: lp.deferred
        value: append(lp.deferred, c.spill)
      - set: c.spill
        value: ch
      - return: "true"
  - of: (*ring).spillRoom
    participants:
      - id: caller
        kind: actor
      - id: (*ring).spillRoom
        kind: self
      - id: lp.slab.alloc
        kind: internal
    steps:
      - bind: lp
        eval: r.lp
      - bind: c
        eval: "&r.conns[slot]"
      - bind: held
        eval: int(c.spill.len - c.spill.off)
      - bind: room
        eval: min(want, lp.sz.spillCap-held)
      - opt:
          do:
            - return: nil
          when: room <= 0
      - bind: free
        eval: lp.slab.size(c.spill) - int(c.spill.len)
      - opt:
          do:
            - return: "lp.slab.bytes(c.spill)[c.spill.len : int(c.spill.len)+room]"
          when: free >= room
      - bind: ch, ok
        eval: lp.slab.alloc(held + room)
        to: lp.slab.alloc
      - opt:
          do:
            - return: nil
          when: "!ok"
      - set: ch.len
        value: int32(copy(lp.slab.bytes(ch), lp.slab.data(c.spill)))
      - set: lp.deferred
        value: append(lp.deferred, c.spill)
      - set: c.spill
        value: ch
      - return: "lp.slab.bytes(ch)[ch.len : int(ch.len)+room]"
  - of: (*ring).deliverSpill
    participants:
      - id: caller
        kind: actor
      - id: (*ring).deliverSpill
        kind: self
      - id: r.lruTouch
        kind: internal
      - id: lp.slab.data
        kind: internal
      - id: r.consumed
        kind: internal
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - op: +=
        set: c.spill.len
        value: int32(n)
      - set: c.lastIO
        value: r.lp.tick
      - op: "|="
        set: c.flags
        value: fHeard
      - op: +=
        set: r.st.bytesIn
        value: uint64(n)
      - eval: r.lruTouch(slot)
        to: r.lruTouch
      - bind: lp
        eval: r.lp
      - bind: buf
        eval: lp.slab.data(c.spill)
        to: lp.slab.data
      - eval: r.consumed(slot, clampConsumed(lp.h.OnData(lp, r.ref(slot), buf), len(buf)))
        to: r.consumed
  - of: (*ring).consumed
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - opt:
          do:
            - return: ""
          when: c.spill.empty()
      - op: +=
        set: c.spill.off
        value: int32(n)
      - opt:
          do:
            - set: r.lp.deferred
              value: append(r.lp.deferred, c.spill)
            - set: c.spill
              value: "chunkRef{idx: noChunk}"
            - return: ""
          when: c.spill.off == c.spill.len
      - opt:
          do:
            - op: "|="
              set: c.flags
              value: fCompact
            - set: r.compact
              value: append(r.compact, slot)
          when: c.spill.off > 0 && c.flags&fCompact == 0
  - of: (*ring).hasSpill
    participants:
      - id: caller
        kind: actor
      - id: (*ring).hasSpill
        kind: self
      - id: r.conns[slot].spill.empty
        kind: internal
    steps:
      - return: "!r.conns[slot].spill.empty()"
        to: r.conns[slot].spill.empty
  - of: (*ring).compactSpill
    participants:
      - id: caller
        kind: actor
      - id: (*ring).compactSpill
        kind: self
      - id: r.lp.slab.bytes
        kind: internal
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - opt:
          do:
            - return: ""
          when: c.spill.empty() || c.spill.off == 0
      - bind: b
        eval: r.lp.slab.bytes(c.spill)
        to: r.lp.slab.bytes
      - bind: "n"
        eval: copy(b, b[c.spill.off:c.spill.len])
      - set: c.spill.off, c.spill.len
        value: 0, int32(n)
  - of: clampConsumed
    steps:
      - opt:
          do:
            - return: "n"
          when: v < 0 || v > n
      - return: v
  - of: (*ring).markDirty
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - opt:
          do:
            - return: ""
          when: c.flags&fDirty != 0
      - op: "|="
        set: c.flags
        value: fDirty
      - set: c.dirtyNext
        value: r.dirtyHead
      - set: r.dirtyHead
        value: slot
  - of: (*ring).flushDirty
    participants:
      - id: caller
        kind: actor
      - id: (*ring).flushDirty
        kind: self
      - id: r.settle
        kind: internal
    steps:
      - loop:
          cond: s != noLink
          do:
            - set: r.dirtyHead
              value: noLink
            - loop:
                cond: s != noLink
                do:
                  - bind: c
                    eval: "&r.conns[s]"
                  - bind: nxt
                    eval: c.dirtyNext
                  - op: "&^="
                    set: c.flags
                    value: fDirty
                  - set: c.dirtyNext
                    value: noLink
                  - eval: r.settle(s)
                    to: r.settle
                  - set: s
                    value: nxt
            - set: s
              value: r.dirtyHead
          init: s := r.dirtyHead
  - of: (*ring).settle
    participants:
      - id: caller
        kind: actor
      - id: (*ring).settle
        kind: self
      - id: r.drv.flush
        kind: internal
      - id: r.finish
        kind: internal
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - opt:
          do:
            - return: ""
          when: c.state != stOpen && c.state != stClosing
      - opt:
          do:
            - eval: r.drv.flush(r, slot)
              to: r.drv.flush
            - set: c
              value: "&r.conns[slot]"
          when: c.sending()
      - opt:
          do:
            - eval: r.finish(slot, c.reason, c.errno)
              to: r.finish
          when: (c.state == stClosing || c.flags&fPeerDone != 0) && !c.sending() && c.state != stDead
  - of: (*ring).sent
    participants:
      - id: caller
        kind: actor
      - id: (*ring).sent
        kind: self
      - id: r.lp.h.OnWritable
        kind: value
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - set: c.lastIO
        value: r.lp.tick
      - opt:
          do:
            - op: "&^="
              set: c.flags
              value: fWantWritable
            - eval: r.lp.h.OnWritable(r.lp, r.ref(slot))
              to: r.lp.h.OnWritable
          when: c.flags&fWantWritable != 0 && c.state == stOpen && c.pending() < r.lp.lowWater && c.fileFD < 0
  - of: (*ring).fail
    participants:
      - id: caller
        kind: actor
      - id: (*ring).fail
        kind: self
      - id: r.finish
        kind: internal
    steps:
      - opt:
          do:
            - eval: r.finish(slot, reason, errno)
              to: r.finish
          when: r.conns[slot].state == stOpen || r.conns[slot].state == stClosing
  - of: (*ring).finish
    participants:
      - id: caller
        kind: actor
      - id: (*ring).finish
        kind: self
      - id: r.ref
        kind: internal
      - id: r.wheel.disarm
        kind: internal
      - id: r.lruUnlink
        kind: internal
      - id: r.countClose
        kind: internal
      - id: lp.grp.live.Add
        kind: value
      - id: lp.h.OnClose
        kind: value
      - id: r.drv.shutdown
        kind: internal
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - bind: ref
        eval: r.ref(slot)
        to: r.ref
      - set: c.state
        value: stDead
      - set: c.reason, c.errno
        value: reason, errno
      - eval: r.wheel.disarm(slot)
        to: r.wheel.disarm
      - eval: r.lruUnlink(slot)
        to: r.lruUnlink
      - bind: lp
        eval: r.lp
      - set: lp.deferred
        value: append(lp.deferred, c.spill, c.out)
      - op: "-="
        set: r.st.pending
        value: int64(c.out.len - c.out.off)
      - set: c.spill, c.out
        value: "chunkRef{idx: noChunk}, chunkRef{idx: noChunk}"
      - op: "--"
        set: r.live
      - op: ++
        set: r.st.closed
      - eval: r.countClose(reason)
        to: r.countClose
      - eval: lp.grp.live.Add(-1)
        to: lp.grp.live.Add
      - eval: lp.h.OnClose(lp, ref, closeErr(reason, errno))
        to: lp.h.OnClose
      - eval: r.drv.shutdown(r, slot)
        to: r.drv.shutdown
  - of: (*ring).release
    participants:
      - id: caller
        kind: actor
      - id: (*ring).release
        kind: self
      - id: emptyConn
        kind: internal
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - set: r.lp.deferred
        value: append(r.lp.deferred, c.flight)
      - op: "-="
        set: r.st.pending
        value: int64(c.flight.len - c.flight.off)
      - set: "*c"
        to: emptyConn
        value: emptyConn(c.gen)
      - set: r.free
        value: append(r.free, slot)
  - of: closeErr
    participants:
      - id: caller
        kind: actor
      - id: closeErr
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - switch:
          cases:
            - case: rSpill
              do:
                - return: corenet.LoopSpillFull
            - case: rIdle
              do:
                - return: os.ErrDeadlineExceeded
            - case: rDrain
              do:
                - return: corenet.ServerClosed
            - case: rEvict
              do:
                - return: corenet.ConnLimitReached
            - case: rFile
              do:
                - return: corenet.LoopFileTruncated
            - case: rErrno
              do:
                - return: syscall.Errno(errno)
                  to: syscall
            - default: true
              do:
                - return: nil
          "on": reason
  - of: (*ring).armTimer
    participants:
      - id: caller
        kind: actor
      - id: (*ring).armTimer
        kind: self
      - id: r.wheel.disarm
        kind: internal
      - id: r.wheel.arm
        kind: internal
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - bind: at
        eval: c.deadline
      - opt:
          do:
            - bind: exp
              eval: c.lastIO + idle
            - opt:
                do:
                  - set: at
                    value: exp
                when: at == 0 || exp < at
          init:
            bind: idle
            eval: r.lp.idle
          when: idle > 0
      - opt:
          do:
            - eval: r.wheel.disarm(slot)
              to: r.wheel.disarm
            - return: ""
          when: at == 0
      - eval: r.wheel.arm(slot, at)
        to: r.wheel.arm
  - of: (*ring).expire
    participants:
      - id: caller
        kind: actor
      - id: (*ring).expire
        kind: self
      - id: r.finish
        kind: internal
      - id: r.armTimer
        kind: internal
      - id: r.lp.h.OnTimeout
        kind: value
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - opt:
          do:
            - return: ""
          when: c.state != stOpen
      - bind: now
        eval: r.lp.tick
      - opt:
          do:
            - eval: r.finish(slot, rIdle, 0)
              to: r.finish
            - return: ""
          init:
            bind: idle
            eval: r.lp.idle
          when: idle > 0 && c.lastIO+idle <= now && c.pending() == 0
      - opt:
          do:
            - set: c.deadline
              value: "0"
            - eval: r.armTimer(slot)
              to: r.armTimer
            - op: ++
              set: r.st.timeouts
            - eval: r.lp.h.OnTimeout(r.lp, r.ref(slot))
              to: r.lp.h.OnTimeout
            - return: ""
          when: c.deadline != 0 && c.deadline <= now
      - eval: r.armTimer(slot)
        to: r.armTimer
  - of: (*ring).lruPush
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - set: c.lruPrev, c.lruNext
        value: r.lruTail, noLink
      - alt:
          - do:
              - set: r.conns[r.lruTail].lruNext
                value: slot
            when: r.lruTail != noLink
          - do:
              - set: r.lruHead
                value: slot
            else: true
      - set: r.lruTail
        value: slot
  - of: (*ring).lruUnlink
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - alt:
          - do:
              - set: r.conns[c.lruPrev].lruNext
                value: c.lruNext
            when: c.lruPrev != noLink
          - do:
              - set: r.lruHead
                value: c.lruNext
            when: r.lruHead == slot
      - alt:
          - do:
              - set: r.conns[c.lruNext].lruPrev
                value: c.lruPrev
            when: c.lruNext != noLink
          - do:
              - set: r.lruTail
                value: c.lruPrev
            when: r.lruTail == slot
      - set: c.lruPrev, c.lruNext
        value: noLink, noLink
  - of: (*ring).lruTouch
    participants:
      - id: caller
        kind: actor
      - id: (*ring).lruTouch
        kind: self
      - id: r.lruUnlink
        kind: internal
      - id: r.lruPush
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: r.lruTail == slot
      - eval: r.lruUnlink(slot)
        to: r.lruUnlink
      - eval: r.lruPush(slot)
        to: r.lruPush
  - of: (*ring).evict
    participants:
      - id: caller
        kind: actor
      - id: (*ring).evict
        kind: self
      - id: r.finish
        kind: internal
    steps:
      - bind: lp
        eval: r.lp
      - opt:
          do:
            - return: "0"
          when: lp.evictIdle <= 0
      - bind: done
        eval: "0"
      - bind: s
        eval: r.lruHead
      - loop:
          cond: s != noLink && done < evictPerTick
          do:
            - bind: c
              eval: "&r.conns[s]"
            - bind: nxt
              eval: c.lruNext
            - opt:
                do:
                  - break: true
                when: lp.tick-c.lastIO < lp.evictIdle
            - opt:
                do:
                  - op: ++
                    set: r.st.evicted
                  - eval: r.finish(s, rEvict, 0)
                    to: r.finish
                  - op: ++
                    set: done
                when: lp.evictable(r, s)
            - set: s
              value: nxt
      - return: done
  - of: (*loop).begin
    participants:
      - id: caller
        kind: actor
      - id: (*loop).begin
        kind: self
      - id: time
        kind: stdlib
    steps:
      - set: lp.started
        to: time
        value: time.Since(lp.epoch)
      - set: lp.tick
        value: int64(lp.started/tickEvery) + 1
  - of: (*loop).shrinkSlab
    participants:
      - id: caller
        kind: actor
      - id: (*loop).shrinkSlab
        kind: self
      - id: lp.slab.shrink
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: lp.tick == lp.shrunkAt
      - set: lp.shrunkAt
        value: lp.tick
      - eval: lp.slab.shrink()
        to: lp.slab.shrink
  - of: (*loop).overBudget
    steps:
      - return: lp.sz.batchBudget > 0 && time.Since(lp.epoch)-lp.started >= lp.sz.batchBudget
  - of: (*loop).endBatch
    participants:
      - id: caller
        kind: actor
      - id: (*loop).endBatch
        kind: self
      - id: r.flushDirty
        kind: internal
      - id: lp.slab.free
        kind: internal
      - id: r.compactListed
        kind: internal
      - id: r.publish
        kind: internal
      - id: storeI
        kind: internal
      - id: time
        kind: stdlib
      - id: lp.grp.observe
        kind: internal
    steps:
      - loop:
          do:
            - eval: r.flushDirty()
              to: r.flushDirty
          key: _
          range: lp.rings
          value: r
      - loop:
          do:
            - eval: lp.slab.free(ch)
              to: lp.slab.free
          key: _
          range: lp.deferred
          value: ch
      - set: lp.deferred
        value: lp.deferred[:0]
      - loop:
          do:
            - eval: r.compactListed()
              to: r.compactListed
            - op: ++
              set: r.st.batches
            - eval: r.publish()
              to: r.publish
          key: _
          range: lp.rings
          value: r
      - eval: storeI(&lp.slabInUse, &lp.seenInUse, int64(lp.slab.inUse))
        to: storeI
      - eval: storeI(&lp.slabMapped, &lp.seenMapped, int64(lp.slab.mappedBytes))
        to: storeI
      - set: lp.ended
        to: time
        value: time.Since(lp.epoch)
      - eval: lp.grp.observe(lp.ended - lp.started)
        to: lp.grp.observe
  - of: (*loop).yield
    participants:
      - id: caller
        kind: actor
      - id: (*loop).yield
        kind: self
      - id: runtime
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "false"
          when: lp.sz.yield <= 0 || lp.ended-lp.yielded < lp.sz.yield
      - set: lp.yielded
        value: lp.ended
      - eval: runtime.Gosched()
        to: runtime
      - return: "true"
  - of: (*ring).compactListed
    participants:
      - id: caller
        kind: actor
      - id: (*ring).compactListed
        kind: self
      - id: r.compactSpill
        kind: internal
    steps:
      - loop:
          do:
            - op: "&^="
              set: r.conns[s].flags
              value: fCompact
            - eval: r.compactSpill(s)
              to: r.compactSpill
          key: _
          range: r.compact
          value: s
      - set: r.compact
        value: r.compact[:0]
  - of: (*loop).lookup
    steps:
      - opt:
          do:
            - return: nil, 0, false
          when: int(ref.Ring) >= len(lp.rings)
      - bind: r
        eval: lp.rings[ref.Ring]
      - opt:
          do:
            - return: nil, 0, false
          when: int(ref.Slot) >= len(r.conns)
      - bind: c
        eval: "&r.conns[ref.Slot]"
      - opt:
          do:
            - return: nil, 0, false
          when: c.gen != ref.Gen || c.state != stOpen || ref.Gen == 0
      - return: r, int32(ref.Slot), true
  - of: (*loop).Write
    participants:
      - id: caller
        kind: actor
      - id: (*loop).Write
        kind: self
      - id: lp.lookup
        kind: internal
      - id: r.refuseOutput
        kind: internal
    steps:
      - opt:
          do:
            - return: corenet.LoopWrongThread
          when: lp.threadOK != nil && !lp.threadOK()
      - bind: r, slot, ok
        eval: lp.lookup(ref)
        to: lp.lookup
      - opt:
          do:
            - return: corenet.LoopStaleRef
          when: "!ok"
      - opt:
          do:
            - return: nil
          when: len(p) == 0
      - bind: c
        eval: "&r.conns[slot]"
      - opt:
          do:
            - return: r.refuseOutput(c)
              to: r.refuseOutput
          when: c.fileFD >= 0 || c.pending()+len(p) > lp.sz.outputCap || !lp.queue(r, slot, c, p)
      - return: nil
  - of: (*loop).queue
    participants:
      - id: caller
        kind: actor
      - id: (*loop).queue
        kind: self
      - id: lp.slab.alloc
        kind: internal
      - id: r.markDirty
        kind: internal
    steps:
      - alt:
          - do:
              - bind: ch, ok
                eval: lp.slab.alloc(len(p))
                to: lp.slab.alloc
              - opt:
                  do:
                    - return: "false"
                  when: "!ok"
              - set: c.out
                value: ch
            when: c.out.empty()
          - do:
              - opt:
                  do:
                    - return: "false"
                  when: "!lp.growOut(c, len(p))"
            when: lp.slab.size(c.out)-int(c.out.len) < len(p)
      - op: +=
        set: c.out.len
        value: int32(copy(lp.slab.bytes(c.out)[c.out.len:], p))
      - op: +=
        set: r.st.pending
        value: int64(len(p))
      - eval: r.markDirty(slot)
        to: r.markDirty
      - return: "true"
  - of: (*loop).growOut
    participants:
      - id: caller
        kind: actor
      - id: (*loop).growOut
        kind: self
      - id: lp.slab.alloc
        kind: internal
      - id: lp.slab.free
        kind: internal
    steps:
      - bind: held
        eval: int(c.out.len - c.out.off)
      - bind: ch, ok
        eval: lp.slab.alloc(held + n)
        to: lp.slab.alloc
      - opt:
          do:
            - return: "false"
          when: "!ok"
      - set: ch.len
        value: int32(copy(lp.slab.bytes(ch), lp.slab.data(c.out)))
      - eval: lp.slab.free(c.out)
        to: lp.slab.free
      - set: c.out
        value: ch
      - return: "true"
  - of: (*loop).Close
    participants:
      - id: caller
        kind: actor
      - id: (*loop).Close
        kind: self
      - id: lp.lookup
        kind: internal
      - id: r.markDirty
        kind: internal
    steps:
      - opt:
          do:
            - return: corenet.LoopWrongThread
          when: lp.threadOK != nil && !lp.threadOK()
      - bind: r, slot, ok
        eval: lp.lookup(ref)
        to: lp.lookup
      - opt:
          do:
            - return: corenet.LoopStaleRef
          when: "!ok"
      - set: r.conns[slot].state
        value: stClosing
      - eval: r.markDirty(slot)
        to: r.markDirty
      - return: nil
  - of: (*loop).SetDeadline
    participants:
      - id: caller
        kind: actor
      - id: (*loop).SetDeadline
        kind: self
      - id: lp.lookup
        kind: internal
      - id: deadlineTick
        kind: internal
      - id: r.armTimer
        kind: internal
    steps:
      - opt:
          do:
            - return: corenet.LoopWrongThread
          when: lp.threadOK != nil && !lp.threadOK()
      - bind: r, slot, ok
        eval: lp.lookup(ref)
        to: lp.lookup
      - opt:
          do:
            - return: corenet.LoopStaleRef
          when: "!ok"
      - bind: c
        eval: "&r.conns[slot]"
      - alt:
          - do:
              - set: c.deadline
                value: "0"
            when: d <= 0
          - do:
              - set: c.deadline
                to: deadlineTick
                value: deadlineTick(time.Since(lp.epoch), d)
            else: true
      - eval: r.armTimer(slot)
        to: r.armTimer
      - return: nil
  - of: deadlineTick
    steps:
      - opt:
          do:
            - return: math.MaxInt64
          when: d > math.MaxInt64-now-tickEvery
      - return: int64((now+d+tickEvery-1)/tickEvery) + 1
  - of: (*loop).Pressure
    participants:
      - id: caller
        kind: actor
      - id: (*loop).Pressure
        kind: self
      - id: lp.lookup
        kind: internal
    steps:
      - bind: r, slot, ok
        eval: lp.lookup(ref)
        to: lp.lookup
      - opt:
          do:
            - return: "false"
          when: "!ok"
      - return: r.conns[slot].flags&fPressure != 0 || lp.hard
  - of: (*loop).Post
    participants:
      - id: caller
        kind: actor
      - id: (*loop).Post
        kind: self
      - id: lp.post.post
        kind: internal
    steps:
      - return: lp.post.post(op, arg)
        to: lp.post.post
  - of: (*loop).Peer
    participants:
      - id: caller
        kind: actor
      - id: (*loop).Peer
        kind: self
      - id: lp.lookup
        kind: internal
      - id: pr.peer
        kind: internal
    steps:
      - opt:
          do:
            - return: corenet.LoopPeerValue{}, false
          when: lp.threadOK != nil && !lp.threadOK()
      - bind: r, slot, ok
        eval: lp.lookup(ref)
        to: lp.lookup
      - opt:
          do:
            - return: corenet.LoopPeerValue{}, false
          when: "!ok"
      - bind: pr, ok
        eval: r.drv.(peerer)
      - opt:
          do:
            - return: corenet.LoopPeerValue{}, false
          when: "!ok"
      - return: pr.peer(r, slot)
        to: pr.peer
  - of: (*loop).Loop
    steps:
      - return: lp.index
  - of: (*ring).countClose
    steps:
      - switch:
          cases:
            - case: rSpill
              do:
                - op: ++
                  set: r.st.spillClosed
            - case: rIdle
              do:
                - op: ++
                  set: r.st.idleClosed
          "on": reason
  - of: (*ring).refuseOutput
    steps:
      - op: "|="
        set: c.flags
        value: fWantWritable
      - op: ++
        set: r.st.outRefused
      - return: corenet.LoopOutputFull
  - of: (*ring).wrote
    steps:
      - op: +=
        set: r.st.bytesOut
        value: uint64(n)
      - op: "-="
        set: r.st.pending
        value: int64(n)
  - of: (*loop).WriteFile
    participants:
      - id: caller
        kind: actor
      - id: (*loop).WriteFile
        kind: self
      - id: lp.lookup
        kind: internal
      - id: lp.Write
        kind: internal
      - id: r.refuseOutput
        kind: internal
      - id: fs.beginFile
        kind: internal
      - id: fs.endFile
        kind: internal
      - id: r.markDirty
        kind: internal
    steps:
      - opt:
          do:
            - return: corenet.LoopWrongThread
          when: lp.threadOK != nil && !lp.threadOK()
      - bind: r, slot, ok
        eval: lp.lookup(ref)
        to: lp.lookup
      - opt:
          do:
            - return: corenet.LoopStaleRef
          when: "!ok"
      - opt:
          do:
            - return: lp.Write(ref, head)
              to: lp.Write
          when: file.Len <= 0
      - bind: c
        eval: "&r.conns[slot]"
      - opt:
          do:
            - return: r.refuseOutput(c)
              to: r.refuseOutput
          when: c.fileFD >= 0 || c.pending()+len(head) > lp.sz.outputCap
      - bind: fs, ok
        eval: r.drv.(fileSender)
      - opt:
          do:
            - return: corenet.LoopFileRefused
          when: "!ok"
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: fs.beginFile(r, slot, file.FD)
            to: fs.beginFile
          when: err != nil
      - opt:
          do:
            - eval: fs.endFile(r, slot)
              to: fs.endFile
            - return: r.refuseOutput(c)
              to: r.refuseOutput
          when: len(head) > 0 && !lp.queue(r, slot, c, head)
      - set: c.fileOff, c.fileLeft
        value: file.Off, file.Len
      - eval: r.markDirty(slot)
        to: r.markDirty
      - return: nil
  - of: (*ring).dropFile
    participants:
      - id: caller
        kind: actor
      - id: (*ring).dropFile
        kind: self
      - id: fs.endFile
        kind: internal
    steps:
      - opt:
          do:
            - eval: fs.endFile(r, slot)
              to: fs.endFile
          init:
            bind: fs, ok
            eval: r.drv.(fileSender)
          when: ok && r.conns[slot].fileFD >= 0
  - of: (*ring).fileDone
    participants:
      - id: caller
        kind: actor
      - id: (*ring).fileDone
        kind: self
      - id: fs.endFile
        kind: internal
      - id: r.markDirty
        kind: internal
      - id: r.lp.h.OnWritable
        kind: value
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - opt:
          do:
            - eval: fs.endFile(r, slot)
              to: fs.endFile
          init:
            bind: fs, ok
            eval: r.drv.(fileSender)
          when: ok
      - set: c.lastIO
        value: r.lp.tick
      - op: "&^="
        set: c.flags
        value: fWantWritable
      - eval: r.markDirty(slot)
        to: r.markDirty
      - opt:
          do:
            - eval: r.lp.h.OnWritable(r.lp, r.ref(slot))
              to: r.lp.h.OnWritable
          when: c.state == stOpen
  - of: threadCheck
    steps:
      - return: nil
  - of: newListenerSet
    participants:
      - id: caller
        kind: actor
      - id: newListenerSet
        kind: self
      - id: ls.left[i].Store
        kind: value
    steps:
      - bind: ls
        eval: "&listenerSet{fds: fds, left: make([]atomic.Int32, len(fds)), closed: make([]atomic.Bool, len(fds)), accepts: make([]atomic.Uint64, len(fds))}"
      - loop:
          do:
            - eval: ls.left[i].Store(int32(takersOf(i)))
              to: ls.left[i].Store
          key: i
          range: ls.left
      - return: ls
  - of: takersOfShards
    steps:
      - return:
          closure:
            params: i int
            results: int
            steps:
              - opt:
                  do:
                    - return: rings
                  when: owners[i] != 0
              - return: loops * rings
  - of: ownersOf
    steps:
      - bind: out
        eval: make([]int, len(ls))
      - loop:
          do:
            - set: out[i]
              value: l.Loop
          key: i
          range: ls
          value: l
      - return: out
  - of: ownedBy
    steps:
      - return: owners[i] == 0 || owners[i] == index+1
  - of: (*listenerSet).handBack
    participants:
      - id: caller
        kind: actor
      - id: (*listenerSet).handBack
        kind: self
      - id: ls.close
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: ls.left[i].Add(-1) != 0
      - eval: ls.close(i)
        to: ls.close
  - of: (*listenerSet).accepted
    participants:
      - id: caller
        kind: actor
      - id: (*listenerSet).accepted
        kind: self
      - id: ls.accepts[i].Add
        kind: value
    steps:
      - eval: ls.accepts[i].Add(1)
        to: ls.accepts[i].Add
  - of: (*listenerSet).acceptsOf
    participants:
      - id: caller
        kind: actor
      - id: (*listenerSet).acceptsOf
        kind: self
      - id: ls.accepts[i].Load
        kind: value
    steps:
      - return: ls.accepts[i].Load()
        to: ls.accepts[i].Load
  - of: (*listenerSet).closeRest
    participants:
      - id: caller
        kind: actor
      - id: (*listenerSet).closeRest
        kind: self
      - id: ls.close
        kind: internal
    steps:
      - loop:
          do:
            - eval: ls.close(i)
              to: ls.close
          key: i
          range: ls.fds
  - of: (*listenerSet).close
    participants:
      - id: caller
        kind: actor
      - id: (*listenerSet).close
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "!ls.closed[i].CompareAndSwap(false, true)"
      - eval: swallowErr(syscall.Close(ls.fds[i]))
        to: swallowErr
  - of: doneOutside
    participants:
      - id: caller
        kind: actor
      - id: doneOutside
        kind: self
      - id: ownedBy
        kind: internal
    steps:
      - bind: done
        eval: make([]bool, len(owners))
      - loop:
          do:
            - set: done[i]
              to: ownedBy
              value: "!ownedBy(owners, i, index)"
          key: i
          range: owners
      - return: done
  - of: (*ring).full
    steps:
      - return: len(r.free) == 0 && len(r.conns) >= r.lp.sz.tableSize
  - of: (*ring).drainable
    steps:
      - return: c.state == stOpen && c.spill.empty() && (c.flags&fHeard != 0 || r.lp.tick-c.lastIO >= drainQuietTicks)
  - of: (*loop).closeSettled
    participants:
      - id: caller
        kind: actor
      - id: (*loop).closeSettled
        kind: self
      - id: lp.drainer.OnDrain
        kind: value
      - id: r.markDirty
        kind: internal
    steps:
      - loop:
          cond: s != noLink
          do:
            - bind: c
              eval: "&r.conns[s]"
            - bind: nxt
              eval: c.lruNext
            - opt:
                do:
                  - opt:
                      do:
                        - op: "|="
                          set: c.flags
                          value: fDrained
                        - eval: lp.drainer.OnDrain(lp, r.ref(s))
                          to: lp.drainer.OnDrain
                        - set: s
                          value: nxt
                        - continue: true
                      when: lp.drainer != nil && c.flags&fDrained == 0
                  - set: c.state, c.reason
                    value: stClosing, rDrain
                  - eval: r.markDirty(s)
                    to: r.markDirty
                when: r.drainable(c) && !lp.waits(r, s)
            - set: s
              value: nxt
          init: s := r.lruHead
  - of: takeAfter
    steps:
      - switch:
          cases:
            - case: syscall.EMFILE, syscall.ENFILE
              do:
                - opt:
                    do:
                      - return: takeOver
                    when: live == 0
                - return: takeLater
            - case: syscall.ECONNABORTED, syscall.EINTR, syscall.EPROTO, syscall.ENOPROTOOPT, syscall.EHOSTDOWN, syscall.ENONET, syscall.EHOSTUNREACH, syscall.EOPNOTSUPP, syscall.ENETUNREACH, syscall.ENETDOWN
              do:
                - return: takeNext
            - default: true
              do:
                - return: takeOver
          "on": err
  - of: startEpoll
    participants:
      - id: caller
        kind: actor
      - id: startEpoll
        kind: self
      - id: newSwitches
        kind: internal
      - id: newReport
        kind: internal
      - id: probeExclusive
        kind: internal
      - id: probeBusyPollEpoll
        kind: internal
      - id: listenerRows
        kind: internal
      - id: g.caps.apply
        kind: internal
      - id: ownersOf
        kind: internal
      - id: newListenerSet
        kind: internal
      - id: newLoop
        kind: internal
      - id: runner.wg.Add
        kind: value
      - id: el.run
        kind: internal
      - id: runner.stop
        kind: internal
      - id: runner.wait
        kind: internal
      - id: reportAffinity
        kind: internal
      - id: reportBusyEpoll
        kind: internal
    steps:
      - bind: fin
        eval: make(chan struct{})
      - bind: runner
        eval: "&epollRunner{fin: fin}"
      - bind: sw
        eval: newSwitches(cfg)
        to: newSwitches
      - set: g.caps
        to: newReport
        value: newReport(sw, "epoll")
      - bind: excl
        eval: probeExclusive(sw, &g.caps)
        to: probeExclusive
      - bind: busy
        eval: probeBusyPollEpoll(cfg, sw, &g.caps, &g.sz)
        to: probeBusyPollEpoll
      - bind: lfds, rows
        eval: listenerRows(cfg, sw)
        to: listenerRows
      - set: runner.lfds
        value: lfds
      - eval: g.caps.apply(rows)
        to: g.caps.apply
      - bind: owners
        eval: ownersOf(cfg.Listeners)
        to: ownersOf
      - set: runner.set
        to: newListenerSet
        value: newListenerSet(runner.lfds, takersOfShards(owners, g.sz.loops, 1))
      - bind: ready
        eval: make(chan error, g.sz.loops)
      - loop:
          do:
            - bind: lp
              eval: newLoop(g, *cfg, i, mmapAnon, syscall.Munmap)
              to: newLoop
            - bind: el
              eval: |-
                &epollLoop{
                			lp: lp, lfds: runner.lfds, owners: owners, set: runner.set,
                			queueDone: doneOutside(owners, i), taken: make([]int, len(runner.lfds)),
                			epfd: -1, evfd: -1, events: make([]syscall.EpollEvent, g.sz.cqBatch), backoff: backoffMin, excl: excl, busy: busy,
                		}
            - set: runner.loops
              value: append(runner.loops, el)
            - set: g.loops
              value: append(g.loops, lp)
            - eval: runner.wg.Add(1)
              to: runner.wg.Add
            - go: el.run(&runner.wg, ready)
              to: el.run
          key: i
          range: g.sz.loops
      - var:
          name: first
          type: error
      - loop:
          do:
            - opt:
                do:
                  - set: first
                    value: err
                init:
                  bind: err
                  eval: <-ready
                when: err != nil && first == nil
          range: g.sz.loops
      - set: g.ctl
        value: runner
      - go: |-
          func() {
          		runner.wg.Wait()
          		runner.set.closeRest()
          		close(fin)
          	}()
      - opt:
          do:
            - eval: runner.stop()
              to: runner.stop
            - eval: runner.wait()
              to: runner.wait
            - return: first
          when: first != nil
      - eval: reportAffinity(&g.caps, g.loops)
        to: reportAffinity
      - eval: reportBusyEpoll(&g.caps, runner.loops)
        to: reportBusyEpoll
      - set: g.backend
        value: backendEpoll
      - return: nil
  - of: probeExclusive
    participants:
      - id: caller
        kind: actor
      - id: probeExclusive
        kind: self
      - id: syscall
        kind: stdlib
      - id: rep.set
        kind: internal
      - id: closeFDs
        kind: internal
      - id: rep.found
        kind: internal
    steps:
      - opt:
          do:
            - return: "0"
          when: sw.disabled(corenet.CapabilityEpollExclusive)
      - bind: epfd, err
        eval: syscall.EpollCreate1(syscall.EPOLL_CLOEXEC)
        to: syscall
      - opt:
          do:
            - eval: "rep.set(corenet.CapabilityEpollExclusive, statusAbsent, \"epoll_create1: \"+err.Error())"
              to: rep.set
            - return: "0"
          when: err != nil
      - defer: closeFDs([]int{epfd})
        to: closeFDs
      - bind: efd, _, errno
        eval: syscall.RawSyscall(syscall.SYS_EVENTFD2, 0, efdNonblock|efdCloexec, 0)
        to: syscall
      - opt:
          do:
            - eval: "rep.set(corenet.CapabilityEpollExclusive, statusAbsent, \"eventfd: \"+errno.Error())"
              to: rep.set
            - return: "0"
          when: errno != 0
      - defer: closeFDs([]int{int(efd)})
        to: closeFDs
      - bind: ev
        eval: "new(syscall.EpollEvent{Events: syscall.EPOLLIN | epollExclusive})"
      - opt:
          do:
            - eval: "rep.set(corenet.CapabilityEpollExclusive, statusAbsent, \"epoll_ctl: \"+err.Error())"
              to: rep.set
            - return: "0"
          init:
            bind: err
            eval: syscall.EpollCtl(epfd, syscall.EPOLL_CTL_ADD, int(efd), ev)
            to: syscall
          when: err != nil
      - eval: rep.found(sw, corenet.CapabilityEpollExclusive, true, "")
        to: rep.found
      - return: epollExclusive
  - of: (*epollRunner).drain
    participants:
      - id: caller
        kind: actor
      - id: (*epollRunner).drain
        kind: self
      - id: el.drainReq.Store
        kind: value
      - id: el.wake
        kind: internal
    steps:
      - loop:
          do:
            - eval: el.drainReq.Store(true)
              to: el.drainReq.Store
            - eval: el.wake()
              to: el.wake
          key: _
          range: er.loops
          value: el
  - of: (*epollRunner).stop
    participants:
      - id: caller
        kind: actor
      - id: (*epollRunner).stop
        kind: self
      - id: el.stopReq.Store
        kind: value
      - id: el.wake
        kind: internal
    steps:
      - loop:
          do:
            - eval: el.stopReq.Store(true)
              to: el.stopReq.Store
            - eval: el.wake()
              to: el.wake
          key: _
          range: er.loops
          value: el
  - of: (*epollRunner).wait
    steps:
      - eval: <-er.fin
  - of: (*epollRunner).done
    steps:
      - return: er.fin
  - of: (*epollLoop).wake
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).wake
        kind: self
      - id: syscall
        kind: stdlib
      - id: swallowErr
        kind: internal
    steps:
      - lock:
          mutex: el.wakeMu
      - opt:
          do:
            - return: ""
          when: el.evClosed || el.evfd < 0
      - bind: one
        eval: new(uint64(1))
      - bind: _, _, errno
        eval: syscall.RawSyscall(syscall.SYS_WRITE, uintptr(el.evfd), uintptr(unsafe.Pointer(one)), 8)
        to: syscall
      - eval: swallowErr(errno)
        to: swallowErr
  - of: (*epollLoop).setup
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).setup
        kind: self
      - id: syscall
        kind: stdlib
      - id: unavailable
        kind: internal
      - id: el.busy.apply
        kind: internal
      - id: el.ctl
        kind: internal
      - id: mmapAnon
        kind: internal
      - id: newPostQueue
        kind: internal
      - id: newRing
        kind: internal
      - id: el.armListeners
        kind: internal
    steps:
      - bind: epfd, err
        eval: syscall.EpollCreate1(syscall.EPOLL_CLOEXEC)
        to: syscall
      - opt:
          do:
            - return: unavailable("epoll_create1", err)
              to: unavailable
          when: err != nil
      - set: el.epfd
        value: epfd
      - eval: el.busy.apply(epfd)
        to: el.busy.apply
      - bind: evfd, _, errno
        eval: syscall.RawSyscall(syscall.SYS_EVENTFD2, 0, efdNonblock|efdCloexec, 0)
        to: syscall
      - opt:
          do:
            - return: unavailable("eventfd2", errno)
              to: unavailable
          when: errno != 0
      - set: el.evfd
        value: int(evfd)
      - opt:
          do:
            - return: unavailable("epoll_ctl eventfd", err)
              to: unavailable
          init:
            bind: err
            eval: el.ctl(syscall.EPOLL_CTL_ADD, el.evfd, syscall.EPOLLIN, tagWake, 0)
            to: el.ctl
          when: err != nil
      - bind: arena, err
        eval: mmapAnon(arenaSize)
        to: mmapAnon
      - opt:
          do:
            - return: unavailable("mmap arena", err)
              to: unavailable
          when: err != nil
      - set: el.arena
        value: arena
      - bind: lp
        eval: el.lp
      - set: lp.post
        to: newPostQueue
        value: newPostQueue(el.wake)
      - set: el.r
        to: newRing
        value: newRing(lp, 0, el)
      - set: lp.rings
        value: "[]*ring{el.r}"
      - eval: el.armListeners()
        to: el.armListeners
      - return: nil
  - of: (*epollLoop).ctl
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).ctl
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: ev
        eval: "new(syscall.EpollEvent{Events: events, Fd: tag, Pad: int32(gen)})"
      - return: syscall.EpollCtl(el.epfd, op, fd, ev)
        to: syscall
  - of: (*epollLoop).armListeners
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).armListeners
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: el.armed || el.lp.draining
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: "!ownedBy(el.owners, i, el.lp.index)"
            - eval: swallowErr(el.ctl(syscall.EPOLL_CTL_ADD, fd, syscall.EPOLLIN|el.excl, tagListen-int32(i), 0))
              to: swallowErr
          key: i
          range: el.lfds
          value: fd
      - set: el.armed
        value: "true"
  - of: (*epollLoop).disarmListeners
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).disarmListeners
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "!el.armed"
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: "!ownedBy(el.owners, i, el.lp.index)"
            - eval: swallowErr(syscall.EpollCtl(el.epfd, syscall.EPOLL_CTL_DEL, fd, nil))
              to: swallowErr
          key: i
          range: el.lfds
          value: fd
      - set: el.armed
        value: "false"
  - of: (*epollLoop).run
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).run
        kind: self
      - id: wg.Done
        kind: value
      - id: runtime
        kind: stdlib
      - id: syscall
        kind: stdlib
      - id: threadCheck
        kind: internal
      - id: el.lp.pin
        kind: internal
      - id: el.setup
        kind: internal
      - id: el.teardown
        kind: internal
      - id: el.wait
        kind: internal
      - id: lp.begin
        kind: internal
      - id: el.handle
        kind: internal
      - id: el.control
        kind: internal
      - id: el.r.wheel.advance
        kind: internal
      - id: lp.shrinkSlab
        kind: internal
      - id: el.pace
        kind: internal
      - id: lp.h.OnBatchEnd
        kind: value
      - id: lp.endBatch
        kind: internal
      - id: lp.yield
        kind: internal
      - id: el.closeAll
        kind: internal
    steps:
      - defer: wg.Done()
        to: wg.Done
      - eval: runtime.LockOSThread()
        to: runtime
      - set: el.tid
        to: syscall
        value: syscall.Gettid()
      - set: el.lp.threadOK
        to: threadCheck
        value: threadCheck(el.tid)
      - eval: el.lp.pin()
        to: el.lp.pin
      - opt:
          do:
            - eval: el.teardown()
              to: el.teardown
            - send:
                chan: ready
                value: err
            - return: ""
          init:
            bind: err
            eval: el.setup()
            to: el.setup
          when: err != nil
      - send:
          chan: ready
          value: nil
      - bind: lp
        eval: el.lp
      - loop:
          do:
            - bind: "n"
              eval: el.wait()
              to: el.wait
            - eval: lp.begin()
              to: lp.begin
            - eval: el.handle(n)
              to: el.handle
            - eval: el.control()
              to: el.control
            - eval: el.r.wheel.advance(lp.tick, el.r.expire)
              to: el.r.wheel.advance
            - eval: lp.shrinkSlab()
              to: lp.shrinkSlab
            - eval: el.pace()
              to: el.pace
            - eval: lp.h.OnBatchEnd(lp)
              to: lp.h.OnBatchEnd
            - eval: lp.endBatch()
              to: lp.endBatch
            - set: el.off
              value: "0"
            - eval: lp.yield()
              to: lp.yield
            - opt:
                do:
                  - break: true
                when: el.stopReq.Load() || (lp.draining && el.r.live == 0 && el.queuesTaken())
          forever: true
      - eval: el.closeAll()
        to: el.closeAll
      - eval: el.teardown()
        to: el.teardown
  - of: (*epollLoop).wait
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).wait
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: timeout
        eval: int(tickEvery / time.Millisecond)
      - opt:
          do:
            - set: timeout
              value: "-1"
          when: el.r.live == 0 && el.armed && !el.lp.draining && !el.lp.slab.reclaimable()
      - bind: n, err
        eval: syscall.EpollWait(el.epfd, el.events, timeout)
        to: syscall
      - opt:
          do:
            - return: "0"
          when: err != nil
      - op: +=
        set: el.r.st.completions
        value: uint64(n)
      - return: "n"
  - of: (*epollLoop).handle
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).handle
        kind: self
      - id: el.drainWake
        kind: internal
      - id: el.accept
        kind: internal
      - id: el.conn
        kind: internal
    steps:
      - loop:
          do:
            - bind: ev
              eval: "&el.events[i]"
            - switch:
                cases:
                  - case: ev.Fd == tagWake
                    do:
                      - eval: el.drainWake()
                        to: el.drainWake
                  - case: ev.Fd <= tagListen
                    do:
                      - eval: el.accept(el.lfds[tagListen-ev.Fd])
                        to: el.accept
                  - default: true
                    do:
                      - eval: el.conn(ev.Fd, uint32(ev.Pad), ev.Events)
                        to: el.conn
          key: i
          range: "n"
  - of: (*epollLoop).drainWake
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).drainWake
        kind: self
      - id: syscall
        kind: stdlib
      - id: swallowErr
        kind: internal
      - id: el.lp.post.drain
        kind: internal
    steps:
      - var:
          name: buf
          type: "[8]byte"
      - bind: _, _, errno
        eval: syscall.RawSyscall(syscall.SYS_READ, uintptr(el.evfd), uintptr(unsafe.Pointer(&buf[0])), 8)
        to: syscall
      - eval: swallowErr(errno)
        to: swallowErr
      - opt:
          do:
            - panic: "\"net/loop: Post consumer off its loop's thread\""
          when: el.lp.threadOK != nil && !el.lp.threadOK()
      - eval: el.lp.post.drain(el.lp)
        to: el.lp.post.drain
  - of: (*epollLoop).accept
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).accept
        kind: self
      - id: syscall
        kind: stdlib
      - id: el.admit
        kind: internal
    steps:
      - loop:
          do:
            - bind: nfd, _, err
              eval: syscall.Accept4(lfd, syscall.SOCK_NONBLOCK|syscall.SOCK_CLOEXEC)
              to: syscall
            - opt:
                do:
                  - opt:
                      do:
                        - return: ""
                      when: el.acceptFailed(err)
                  - continue: true
                when: err != nil
            - eval: el.admit(nfd)
              to: el.admit
          range: epollAcceptBurst
  - of: (*epollLoop).acceptFailed
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).acceptFailed
        kind: self
      - id: el.pause
        kind: internal
    steps:
      - switch:
          cases:
            - case: syscall.EAGAIN
              do:
                - return: "true"
            - case: syscall.EMFILE, syscall.ENFILE
              do:
                - eval: el.pause()
                  to: el.pause
                - return: "true"
            - case: syscall.ECONNABORTED, syscall.EINTR
              do:
                - return: "false"
            - default: true
              do:
                - return: "true"
          "on": err
  - of: (*epollLoop).admit
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).admit
        kind: self
      - id: el.reject
        kind: internal
      - id: rg.take
        kind: internal
      - id: el.ctl
        kind: internal
      - id: rg.abandon
        kind: internal
      - id: swallowErr
        kind: internal
      - id: rg.opened
        kind: internal
    steps:
      - bind: lp, rg
        eval: el.lp, el.r
      - opt:
          do:
            - eval: el.reject(nfd)
              to: el.reject
            - return: ""
          init:
            bind: m
            eval: lp.sz.maxConns
          when: m > 0 && lp.grp.live.Load() >= int64(m)
      - bind: slot, ok
        eval: rg.take(int32(nfd))
        to: rg.take
      - opt:
          do:
            - eval: el.reject(nfd)
              to: el.reject
            - return: ""
          when: "!ok"
      - opt:
          do:
            - eval: rg.abandon(slot)
              to: rg.abandon
            - eval: swallowErr(syscall.Close(nfd))
              to: swallowErr
            - return: ""
          init:
            bind: err
            eval: el.ctl(syscall.EPOLL_CTL_ADD, nfd, connEvents, slot, rg.conns[slot].gen)
            to: el.ctl
          when: err != nil
      - set: el.backoff
        value: backoffMin
      - eval: rg.opened(slot)
        to: rg.opened
  - of: (*epollLoop).reject
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).reject
        kind: self
      - id: swallowErr
        kind: internal
      - id: el.lp.grp.rejected.Add
        kind: value
    steps:
      - eval: swallowErr(syscall.Close(nfd))
        to: swallowErr
      - eval: el.lp.grp.rejected.Add(1)
        to: el.lp.grp.rejected.Add
      - set: el.lp.hard
        value: "true"
  - of: (*epollLoop).pause
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).pause
        kind: self
      - id: el.disarmListeners
        kind: internal
    steps:
      - eval: el.disarmListeners()
        to: el.disarmListeners
      - set: el.rearmAt
        value: el.lp.tick + el.backoff
      - set: el.backoff
        value: min(el.backoff*2, backoffMax)
      - set: el.lp.hard
        value: "true"
      - op: ++
        set: el.r.st.pauses
  - of: (*epollLoop).pace
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).pace
        kind: self
      - id: el.armListeners
        kind: internal
      - id: el.r.evict
        kind: internal
    steps:
      - bind: lp
        eval: el.lp
      - opt:
          do:
            - eval: el.armListeners()
              to: el.armListeners
          when: "!el.armed && !lp.draining && lp.tick >= el.rearmAt"
      - opt:
          do:
            - eval: el.r.evict()
              to: el.r.evict
            - opt:
                do:
                  - set: lp.hard
                    value: "false"
                when: el.armed && (lp.sz.maxConns == 0 || lp.grp.live.Load() < int64(lp.sz.maxConns))
          when: lp.hard
  - of: (*epollLoop).conn
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).conn
        kind: self
      - id: el.writable
        kind: internal
      - id: el.readable
        kind: internal
    steps:
      - bind: r
        eval: el.r
      - opt:
          do:
            - return: ""
          when: int(slot) >= len(r.conns) || r.conns[slot].gen != gen
      - opt:
          do:
            - eval: el.writable(slot)
              to: el.writable
          when: events&syscall.EPOLLOUT != 0 && r.conns[slot].state != stDead
      - eval: el.readable(slot, events)
        to: el.readable
  - of: (*epollLoop).writable
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).writable
        kind: self
      - id: el.flush
        kind: internal
      - id: swallowErr
        kind: internal
    steps:
      - bind: r
        eval: el.r
      - op: "&^="
        set: r.conns[slot].flags
        value: fSending
      - eval: el.flush(r, slot)
        to: el.flush
      - bind: c
        eval: "&r.conns[slot]"
      - opt:
          do:
            - eval: swallowErr(el.ctl(syscall.EPOLL_CTL_MOD, int(c.fd), el.outEvents(c), slot, c.gen))
              to: swallowErr
          when: c.state != stDead && c.flags&fSending == 0
  - of: (*epollLoop).readable
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).readable
        kind: self
      - id: el.read
        kind: internal
      - id: r.fail
        kind: internal
    steps:
      - bind: r
        eval: el.r
      - bind: c
        eval: "&r.conns[slot]"
      - opt:
          do:
            - eval: el.read(slot)
              to: el.read
            - return: ""
          when: events&(syscall.EPOLLIN|syscall.EPOLLRDHUP|syscall.EPOLLHUP|syscall.EPOLLERR) != 0 && c.state == stOpen && c.flags&fPeerDone == 0
      - opt:
          do:
            - eval: r.fail(slot, rErrno, int32(syscall.ECONNRESET))
              to: r.fail
          when: events&(syscall.EPOLLHUP|syscall.EPOLLERR) != 0 && (c.state == stOpen || c.state == stClosing)
  - of: (*epollLoop).read
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).read
        kind: self
      - id: el.readBuf
        kind: internal
      - id: syscall
        kind: stdlib
      - id: el.received
        kind: internal
      - id: swallowErr
        kind: internal
      - id: r.markDirty
        kind: internal
      - id: r.fail
        kind: internal
    steps:
      - bind: buf, inSpill, ok
        eval: el.readBuf(slot)
        to: el.readBuf
      - opt:
          do:
            - return: ""
          when: "!ok"
      - bind: r
        eval: el.r
      - bind: c
        eval: "&r.conns[slot]"
      - bind: n, err
        eval: syscall.Read(int(c.fd), buf)
        to: syscall
      - switch:
          cases:
            - case: n > 0
              do:
                - eval: el.received(slot, buf[:n], inSpill)
                  to: el.received
            - case: n == 0 && err == nil
              do:
                - op: "|="
                  set: c.flags
                  value: fPeerDone
                - eval: swallowErr(el.ctl(syscall.EPOLL_CTL_MOD, int(c.fd), el.outEvents(c), slot, c.gen))
                  to: swallowErr
                - eval: r.markDirty(slot)
                  to: r.markDirty
            - case: err == syscall.EAGAIN || err == syscall.EINTR
            - default: true
              do:
                - eval: r.fail(slot, rErrno, errnoOf(err))
                  to: r.fail
  - of: (*epollLoop).readBuf
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).readBuf
        kind: self
      - id: r.spillRoom
        kind: internal
      - id: r.fail
        kind: internal
    steps:
      - bind: r
        eval: el.r
      - opt:
          do:
            - set: buf
              to: r.spillRoom
              value: r.spillRoom(slot, readChunk)
            - opt:
                do:
                  - eval: r.fail(slot, rSpill, 0)
                    to: r.fail
                  - return: nil, true, false
                when: buf == nil
            - return: buf, true, true
          when: r.hasSpill(slot)
      - opt:
          do:
            - return: nil, false, false
          when: len(el.arena)-el.off < minRead
      - return: el.arena[el.off:min(len(el.arena), el.off+readChunk)], false, true
  - of: (*epollLoop).received
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).received
        kind: self
      - id: el.r.deliverSpill
        kind: internal
      - id: el.r.deliver
        kind: internal
    steps:
      - alt:
          - do:
              - eval: el.r.deliverSpill(slot, len(data))
                to: el.r.deliverSpill
            when: inSpill
          - do:
              - op: +=
                set: el.off
                value: len(data)
              - eval: el.r.deliver(slot, data)
                to: el.r.deliver
            else: true
  - of: (*epollLoop).outEvents
    steps:
      - var:
          name: ev
          type: uint32
      - opt:
          do:
            - op: "|="
              set: ev
              value: connEvents
          when: c.state == stOpen && c.flags&fPeerDone == 0
      - opt:
          do:
            - op: "|="
              set: ev
              value: syscall.EPOLLOUT
          when: c.flags&fSending != 0
      - return: ev
  - of: (*epollLoop).flush
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).flush
        kind: self
      - id: lp.slab.data
        kind: internal
      - id: el.afterOutput
        kind: internal
      - id: syscall
        kind: stdlib
      - id: r.wrote
        kind: internal
      - id: lp.slab.free
        kind: internal
      - id: r.sent
        kind: internal
      - id: swallowErr
        kind: internal
      - id: r.fail
        kind: internal
    steps:
      - bind: lp
        eval: el.lp
      - loop:
          do:
            - bind: c
              eval: "&r.conns[slot]"
            - opt:
                do:
                  - return: ""
                when: c.flags&fSending != 0
            - bind: data
              eval: lp.slab.data(c.out)
              to: lp.slab.data
            - opt:
                do:
                  - eval: el.afterOutput(r, slot)
                    to: el.afterOutput
                  - return: ""
                when: len(data) == 0
            - bind: n, err
              eval: syscall.Write(int(c.fd), data)
              to: syscall
            - switch:
                cases:
                  - case: n > 0
                    do:
                      - op: +=
                        set: c.out.off
                        value: int32(n)
                      - eval: r.wrote(n)
                        to: r.wrote
                      - opt:
                          do:
                            - eval: lp.slab.free(c.out)
                              to: lp.slab.free
                            - set: c.out
                              value: "chunkRef{idx: noChunk}"
                          when: c.out.off == c.out.len
                      - eval: r.sent(slot, n)
                        to: r.sent
                  - case: err == syscall.EAGAIN
                    do:
                      - op: "|="
                        set: c.flags
                        value: fSending
                      - eval: swallowErr(el.ctl(syscall.EPOLL_CTL_MOD, int(c.fd), el.outEvents(c), slot, c.gen))
                        to: swallowErr
                      - return: ""
                  - case: err == syscall.EINTR
                  - default: true
                    do:
                      - eval: r.fail(slot, rErrno, errnoOf(err))
                        to: r.fail
                      - return: ""
          forever: true
  - of: (*epollLoop).afterOutput
    steps:
      - loop:
          cond: r.conns[slot].fileFD >= 0 && r.conns[slot].state != stDead && el.sendFile(r, slot)
          do: null
  - of: (*epollLoop).sendFile
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).sendFile
        kind: self
      - id: syscall
        kind: stdlib
      - id: r.fileDone
        kind: internal
      - id: r.fail
        kind: internal
      - id: swallowErr
        kind: internal
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - bind: "off"
        eval: c.fileOff
      - bind: n, err
        eval: syscall.Sendfile(int(c.fd), int(c.fileFD), &off, int(min(c.fileLeft, sendfileStep)))
        to: syscall
      - switch:
          cases:
            - case: n > 0
              do:
                - set: c.fileOff, c.fileLeft
                  value: off, c.fileLeft-int64(n)
                - op: +=
                  set: r.st.bytesOut
                  value: uint64(n)
                - set: c.lastIO
                  value: el.lp.tick
                - opt:
                    do:
                      - eval: r.fileDone(slot)
                        to: r.fileDone
                      - return: "false"
                    when: c.fileLeft == 0
            - case: err == syscall.EINTR
              do:
                - return: "true"
            - case: err == nil
              do:
                - eval: r.fail(slot, rFile, 0)
                  to: r.fail
                - return: "false"
            - case: err == syscall.EAGAIN
            - default: true
              do:
                - eval: r.fail(slot, rErrno, errnoOf(err))
                  to: r.fail
                - return: "false"
      - op: "|="
        set: c.flags
        value: fSending
      - eval: swallowErr(el.ctl(syscall.EPOLL_CTL_MOD, int(c.fd), el.outEvents(c), slot, c.gen))
        to: swallowErr
      - return: "false"
  - of: (*epollLoop).beginFile
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).beginFile
        kind: self
      - id: dupCloexec
        kind: internal
    steps:
      - bind: dup, err
        eval: dupCloexec(fd)
        to: dupCloexec
      - opt:
          do:
            - return: corenet.LoopFileRefused
          when: err != nil
      - set: r.conns[slot].fileFD
        value: int32(dup)
      - return: nil
  - of: (*epollLoop).endFile
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).endFile
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - eval: swallowErr(syscall.Close(int(c.fileFD)))
        to: swallowErr
      - set: c.fileFD, c.fileOff, c.fileLeft
        value: "-1, 0, 0"
  - of: (*epollLoop).shutdown
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).shutdown
        kind: self
      - id: swallowErr
        kind: internal
      - id: r.dropFile
        kind: internal
      - id: r.release
        kind: internal
      - id: el.armListeners
        kind: internal
    steps:
      - bind: fd
        eval: int(r.conns[slot].fd)
      - eval: swallowErr(syscall.EpollCtl(el.epfd, syscall.EPOLL_CTL_DEL, fd, nil))
        to: swallowErr
      - eval: swallowErr(syscall.Close(fd))
        to: swallowErr
      - eval: r.dropFile(slot)
        to: r.dropFile
      - eval: r.release(slot)
        to: r.release
      - opt:
          do:
            - eval: el.armListeners()
              to: el.armListeners
          when: "!el.armed && !el.lp.draining"
  - of: (*epollLoop).peer
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).peer
        kind: self
      - id: peerOf
        kind: internal
    steps:
      - return: peerOf(int(r.conns[slot].fd))
        to: peerOf
  - of: (*epollLoop).unread
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).unread
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - var:
          name: "n"
          type: int32
      - bind: _, _, errno
        eval: syscall.Syscall(syscall.SYS_IOCTL, uintptr(r.conns[slot].fd), siocinq, uintptr(unsafe.Pointer(&n)))
        to: syscall
      - return: errno != 0 || n > 0
  - of: (*epollLoop).control
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).control
        kind: self
      - id: el.disarmListeners
        kind: internal
      - id: el.takeQueues
        kind: internal
      - id: lp.closeSettled
        kind: internal
    steps:
      - bind: lp, r
        eval: el.lp, el.r
      - opt:
          do:
            - set: lp.draining
              value: "true"
            - set: r.draining
              value: "true"
            - eval: el.disarmListeners()
              to: el.disarmListeners
          when: el.drainReq.Load() && !lp.draining
      - opt:
          do:
            - eval: el.takeQueues()
              to: el.takeQueues
            - eval: lp.closeSettled(r)
              to: lp.closeSettled
          when: lp.draining
  - of: (*epollLoop).takeQueues
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).takeQueues
        kind: self
      - id: el.set.handBack
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - set: el.queueDone[i]
                    value: "true"
                  - eval: el.set.handBack(i)
                    to: el.set.handBack
                when: "!el.queueDone[i] && el.takeQueue(i, fd)"
          key: i
          range: el.lfds
          value: fd
  - of: (*epollLoop).queuesTaken
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).queuesTaken
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - return: "!slices.Contains(el.queueDone, false)"
        to: slices
  - of: (*epollLoop).takeQueue
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).takeQueue
        kind: self
      - id: syscall
        kind: stdlib
      - id: el.admit
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: el.taken[i] >= queueTakeMax
                when: el.taken[i] >= queueTakeMax || el.r.full()
            - bind: nfd, _, err
              eval: syscall.Accept4(lfd, syscall.SOCK_NONBLOCK|syscall.SOCK_CLOEXEC)
              to: syscall
            - opt:
                do:
                  - switch:
                      cases:
                        - case: takeOver
                          do:
                            - return: "true"
                        - case: takeLater
                          do:
                            - return: "false"
                        - case: takeNext
                          do:
                            - continue: true
                      "on": takeAfter(err, el.lp.grp.live.Load())
                when: err != nil
            - op: ++
              set: el.taken[i]
            - eval: el.admit(nfd)
              to: el.admit
          range: queueTakeBatch
      - return: "false"
  - of: (*epollLoop).closeAll
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).closeAll
        kind: self
      - id: r.fail
        kind: internal
      - id: r.publish
        kind: internal
    steps:
      - bind: r
        eval: el.r
      - loop:
          cond: r.lruHead != noLink
          do:
            - eval: r.fail(r.lruHead, rDrain, 0)
              to: r.fail
      - eval: r.publish()
        to: r.publish
  - of: (*epollLoop).teardown
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).teardown
        kind: self
      - id: lp.post.close
        kind: internal
      - id: el.disarmListeners
        kind: internal
      - id: el.wakeMu.Lock
        kind: value
      - id: closeFDs
        kind: internal
      - id: el.wakeMu.Unlock
        kind: value
      - id: swallowErr
        kind: internal
      - id: lp.slab.release
        kind: internal
    steps:
      - bind: lp
        eval: el.lp
      - opt:
          do:
            - eval: lp.post.close()
              to: lp.post.close
          when: lp.post != nil
      - eval: el.disarmListeners()
        to: el.disarmListeners
      - eval: el.wakeMu.Lock()
        to: el.wakeMu.Lock
      - eval: closeFDs([]int{el.epfd, el.evfd})
        to: closeFDs
      - set: el.evClosed
        value: "true"
      - eval: el.wakeMu.Unlock()
        to: el.wakeMu.Unlock
      - opt:
          do:
            - eval: swallowErr(syscall.Munmap(el.arena))
              to: swallowErr
          when: el.arena != nil
      - eval: lp.slab.release()
        to: lp.slab.release
  - of: errnoOf
    steps:
      - opt:
          do:
            - return: int32(e)
          init:
            bind: e, ok
            eval: err.(syscall.Errno)
          when: ok
      - return: int32(syscall.EIO)
  - of: secondaryWakeVerdict
    steps:
      - bind: v, ok
        eval: secondaryWake.Load().(string)
      - opt:
          do:
            - return: wakeUnprobed
          when: "!ok"
      - return: v
  - of: Start
    participants:
      - id: caller
        kind: actor
      - id: Start
        kind: self
      - id: descriptorLimit
        kind: internal
      - id: resolve
        kind: internal
      - id: closeListeners
        kind: internal
      - id: CheckCapabilities
        kind: internal
      - id: errors
        kind: stdlib
      - id: slabBudgetFor
        kind: internal
      - id: yieldFor
        kind: internal
      - id: startNative
        kind: internal
      - id: fmt
        kind: stdlib
      - id: swallowErr
        kind: internal
    steps:
      - bind: rlimit
        eval: descriptorLimit()
        to: descriptorLimit
      - bind: sz, err
        eval: resolve(cfg.Value, cfg.MaxConns, rlimit)
        to: resolve
      - opt:
          do:
            - eval: closeListeners(cfg.Listeners)
              to: closeListeners
            - return: nil, err
          when: err != nil
      - opt:
          do:
            - eval: closeListeners(cfg.Listeners)
              to: closeListeners
            - return: nil, errs.Wrap(corenet.HandlerMissing, errs.WrapParams{}, errs.String("group", cfg.Group))
          when: cfg.Handler == nil
      - opt:
          do:
            - eval: closeListeners(cfg.Listeners)
              to: closeListeners
            - return: nil, err
          init:
            bind: err
            eval: CheckCapabilities(cfg.Group, cfg.Value)
            to: CheckCapabilities
          when: err != nil
      - opt:
          do:
            - eval: closeListeners(cfg.Listeners)
              to: closeListeners
            - return: nil, err
          init:
            bind: err
            eval: errors.Join(checkShards(cfg, sz.loops), checkValue(cfg.Group, cfg.Value, sz.loops))
            to: errors
          when: err != nil
      - set: sz.slabBudget, sz.slabSource
        to: slabBudgetFor
        value: slabBudgetFor(cfg.Value.SlabBudget, cfg.Memory, sz.loops, max(sz.outputCap, sz.spillCap))
      - opt:
          do:
            - set: sz.loopsSource
              value: cfg.LoopsSource
          when: cfg.LoopsSource != ""
      - opt:
          do:
            - set: sz.tableSize
              value: cfg.tableCap
          when: cfg.tableCap > 0
      - bind: g
        eval: "&Group{name: cfg.Group, sz: sz, grp: &shared{}, procs: runtime.GOMAXPROCS(0)}"
      - set: g.sz.yield
        to: yieldFor
        value: yieldFor(g.procs, sz.loops)
      - opt:
          do:
            - eval: closeListeners(cfg.Listeners)
              to: closeListeners
            - return: nil, err
          init:
            bind: err
            eval: startNative(g, &cfg)
            to: startNative
          when: err != nil
      - bind: w
        eval: cfg.Log
      - opt:
          do:
            - set: w
              value: os.Stderr
          when: w == nil
      - bind: _, werr
        eval: |-
          fmt.Fprintf(w, "net/loop: group=%q backend=%s probe=%s reason=%q loops=%d loops_source=%s rings=%d rings_source=%s table=%d cq_batch=%d spill_cap=%d output_cap=%d rlimit_nofile=%d gomaxprocs=%d batch_wait=%s batch_wait_min=%d yield=%s secondary_wake=%s\n",
          		g.name, g.backend, g.stage, g.reason, g.sz.loops, g.sz.loopsSource, g.sz.rings, g.sz.ringsSource, g.sz.tableSize, g.sz.cqBatch, g.sz.spillCap, g.sz.outputCap, g.sz.rlimit, g.procs, g.sz.batchWait, g.sz.batchWaitMin, g.sz.yield, secondaryWakeVerdict())
        to: fmt
      - eval: swallowErr(werr)
        to: swallowErr
      - return: g, nil
  - of: checkShards
    participants:
      - id: caller
        kind: actor
      - id: checkShards
        kind: self
      - id: errs
        kind: package
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: |-
                      errs.Wrap(corenet.LoopOptionUnsupported, errs.WrapParams{},
                      				errs.String("group", cfg.Group), errs.String("option", corenet.OptionShards.String()),
                      				errs.Int("loops", loops), errs.Int("shard", l.Loop))
                    to: errs
                when: l.Loop > loops
          key: _
          range: cfg.Listeners
          value: l
      - return: nil
  - of: (*Group).Shutdown
    participants:
      - id: caller
        kind: actor
      - id: (*Group).Shutdown
        kind: self
      - id: g.ctl.drain
        kind: internal
      - id: g.ctl.stop
        kind: internal
      - id: g.ctl.wait
        kind: internal
      - id: errs
        kind: package
    steps:
      - eval: g.ctl.drain()
        to: g.ctl.drain
      - select:
          cases:
            - comm: <-g.ctl.done()
              do:
                - return: nil
            - comm: <-ctx.Done()
              do:
                - eval: g.ctl.stop()
                  to: g.ctl.stop
                - eval: g.ctl.wait()
                  to: g.ctl.wait
                - return: errs.Wrap(corenet.DrainTimeout, errs.WrapParams{}, errs.String("group", g.name))
                  to: errs
  - of: (*Group).Close
    participants:
      - id: caller
        kind: actor
      - id: (*Group).Close
        kind: self
      - id: g.once.Do
        kind: value
    steps:
      - eval: |-
          g.once.Do(func() {
          		g.ctl.stop()
          		g.ctl.wait()
          	})
        to: g.once.Do
      - return: nil
  - of: (*Group).State
    participants:
      - id: caller
        kind: actor
      - id: (*Group).State
        kind: self
      - id: lp.slabInUse.Load
        kind: value
      - id: lp.slabMapped.Load
        kind: value
    steps:
      - bind: st
        eval: |-
          corenet.LoopStateValue{
          		Group: g.name, Backend: g.backend, ProbeStage: g.stage,
          		Degraded: g.reason != "", DegradedReason: g.reason,
          		Loops: g.sz.loops, LoopsSource: g.sz.loopsSource, Rings: g.sz.rings, RingsSource: g.sz.ringsSource,
          		RLimitNoFile: g.sz.rlimit, GOMAXPROCS: g.procs,
          		BatchP99:         corenet.DurationValue(g.grp.batchP99()),
          		SlabBudgetSource: g.sz.slabSource,
          		Capabilities:     slices.Clone(g.caps.rows),
          	}
      - loop:
          do:
            - op: +=
              set: st.SlabInUse
              to: lp.slabInUse.Load
              value: lp.slabInUse.Load()
            - op: +=
              set: st.SlabMapped
              to: lp.slabMapped.Load
              value: lp.slabMapped.Load()
            - op: +=
              set: st.SlabBudget
              value: int64(lp.slab.budget)
          key: _
          range: g.loops
          value: lp
      - loop:
          do:
            - loop:
                do:
                  - bind: p
                    eval: r.pub
                  - set: st.RingStates
                    value: |-
                      append(st.RingStates, corenet.LoopRingStateValue{
                      				Loop: lp.index, Ring: r.index, Conns: p.conns.Load(),
                      				Accepted: p.accepted.Load(), Closed: p.closed.Load(),
                      				Batches: p.batches.Load(), Completions: p.completions.Load(),
                      				BufferStarved: p.starved.Load(), EnterRetries: p.retries.Load(),
                      				AcceptPauses: p.pauses.Load(), Evicted: p.evicted.Load(),
                      				WatchdogFires: p.watchdog.Load(), Draining: p.draining.Load(),
                      				BatchesCut: p.cut.Load(),
                      				BytesIn:    p.bytesIn.Load(), BytesOut: p.bytesOut.Load(),
                      				OutputRefused: p.outRefused.Load(), SpillClosed: p.spillClosed.Load(),
                      				Timeouts: p.timeouts.Load(), IdleClosed: p.idleClosed.Load(),
                      				PendingOutput: p.pending.Load(),
                      			})
                key: _
                range: lp.rings
                value: r
          key: _
          range: g.loops
          value: lp
      - return: st
  - of: (*Group).Rejected
    participants:
      - id: caller
        kind: actor
      - id: (*Group).Rejected
        kind: self
      - id: g.grp.rejected.Load
        kind: value
    steps:
      - return: g.grp.rejected.Load()
        to: g.grp.rejected.Load
  - of: (*Group).Live
    participants:
      - id: caller
        kind: actor
      - id: (*Group).Live
        kind: self
      - id: g.grp.live.Load
        kind: value
    steps:
      - return: g.grp.live.Load()
        to: g.grp.live.Load
  - of: newLoop
    participants:
      - id: caller
        kind: actor
      - id: newLoop
        kind: self
      - id: time
        kind: stdlib
      - id: newSlab
        kind: internal
    steps:
      - bind: lp
        eval: |-
          &loop{
          		index: i, sz: g.sz, h: cfg.Handler, busy: cfg.Busy, grp: g.grp,
          		epoch:    time.Now(),
          		lowWater: g.sz.outputCap / lowWaterDiv,
          		// the first batch's end is past any interval: the first yield is
          		// due there.
          		yielded: -g.sz.yield,
          	}
      - opt:
          do:
            - set: lp.idle
              value: int64((cfg.IdleTimeout + tickEvery - 1) / tickEvery)
          when: cfg.IdleTimeout > 0
      - opt:
          do:
            - set: lp.evictIdle
              value: int64((d + tickEvery - 1) / tickEvery)
          init:
            bind: d
            eval: time.Duration(cfg.Value.EvictIdle)
            to: time
          when: d > 0
      - set: lp.drainer, _
        value: cfg.Handler.(corenet.LoopDrainer)
      - set: lp.cpu
        value: "-1"
      - opt:
          do:
            - set: lp.cpu
              value: cfg.Value.Affinity[i]
          when: i < len(cfg.Value.Affinity) && !newSwitches(&cfg).disabled(corenet.CapabilityLoopAffinity)
      - set: lp.slab
        to: newSlab
        value: newSlab(max(g.sz.outputCap, g.sz.spillCap), cmp.Or(g.sz.slabBudget, defaultSlabBudget), mapper)
      - set: lp.slab.unmap
        value: unmapper
      - set: lp.tick
        value: "1"
      - return: lp
  - of: swallowErr
    steps:
      - opt:
          do:
            - return: ""
          when: err == nil
  - of: startNative
    participants:
      - id: caller
        kind: actor
      - id: startNative
        kind: self
      - id: refuseSeqpacket
        kind: internal
      - id: startEpoll
        kind: internal
      - id: startIOURing
        kind: internal
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: refuseSeqpacket(cfg)
            to: refuseSeqpacket
          when: err != nil
      - switch:
          cases:
            - case: corenet.LoopBackendAuto
              do:
                - opt:
                    do:
                      - set: g.stage
                        value: "\"epoll\""
                      - return: startEpoll(g, cfg)
                        to: startEpoll
                    when: slices.Contains(cfg.Disabled, corenet.CapabilityURingPbuf)
                - bind: err
                  eval: startIOURing(g, cfg)
                  to: startIOURing
                - opt:
                    do:
                      - return: nil
                    when: err == nil
                - set: g.stage
                  value: "\"epoll\""
                - set: g.reason
                  value: "\"io_uring unavailable: \" + err.Error()"
                - return: startEpoll(g, cfg)
                  to: startEpoll
            - case: corenet.LoopBackendIOURing
              do:
                - return: startIOURing(g, cfg)
                  to: startIOURing
            - case: corenet.LoopBackendEpoll
              do:
                - set: g.stage
                  value: "\"epoll\""
                - return: startEpoll(g, cfg)
                  to: startEpoll
            - case: corenet.LoopBackendKqueue
              do:
                - return: |-
                    errs.Wrap(coreproc.UnsupportedPlatform, errs.WrapParams{},
                    			errs.String("group", cfg.Group), errs.String("backend", cfg.Value.Backend.String()))
                  to: errs
            - default: true
              do:
                - return: |-
                    errs.Wrap(corenet.LoopBackendUnavailable, errs.WrapParams{},
                    			errs.String("group", cfg.Group), errs.String("backend", cfg.Value.Backend.String()),
                    			errs.String("reason", "not a backend of the leaf"))
                  to: errs
          "on": cfg.Value.Backend
  - of: noDelay
    participants:
      - id: caller
        kind: actor
      - id: noDelay
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: sw.disabled(corenet.CapabilityTCPNoDelay)
      - eval: swallowErr(syscall.SetsockoptInt(fd, syscall.IPPROTO_TCP, syscall.TCP_NODELAY, 1))
        to: swallowErr
  - of: descriptorLimit
    participants:
      - id: caller
        kind: actor
      - id: descriptorLimit
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - var:
          name: lim
          type: syscall.Rlimit
      - opt:
          do:
            - return: "0"
          init:
            bind: err
            eval: syscall.Getrlimit(syscall.RLIMIT_NOFILE, &lim)
            to: syscall
          when: err != nil
      - return: lim.Cur
  - of: mmapAnon
    participants:
      - id: caller
        kind: actor
      - id: mmapAnon
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - return: syscall.Mmap(-1, 0, n, syscall.PROT_READ|syscall.PROT_WRITE, syscall.MAP_PRIVATE|syscall.MAP_ANONYMOUS)
        to: syscall
  - of: dupCloexec
    participants:
      - id: caller
        kind: actor
      - id: dupCloexec
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: nfd, _, errno
        eval: syscall.Syscall(syscall.SYS_FCNTL, uintptr(fd), syscall.F_DUPFD_CLOEXEC, 0)
        to: syscall
      - opt:
          do:
            - return: "-1, errno"
          when: errno != 0
      - return: int(nfd), nil
  - of: closeFDs
    participants:
      - id: caller
        kind: actor
      - id: closeFDs
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - eval: swallowErr(syscall.Close(fd))
                    to: swallowErr
                when: fd >= 0
          key: _
          range: fds
          value: fd
  - of: closeListeners
    participants:
      - id: caller
        kind: actor
      - id: closeListeners
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - loop:
          do:
            - eval: swallowErr(syscall.Close(l.FD))
              to: swallowErr
          key: _
          range: ls
          value: l
  - of: unavailable
    participants:
      - id: caller
        kind: actor
      - id: unavailable
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(corenet.LoopBackendUnavailable, errs.WrapParams{},
          		errs.String("stage", step), errs.String("reason", err.Error()))
        to: errs
  - of: setKeepAlive
    participants:
      - id: caller
        kind: actor
      - id: setKeepAlive
        kind: self
      - id: syscall
        kind: stdlib
      - id: expectOpt
        kind: internal
    steps:
      - opt:
          do:
            - set: d
              value: keepAliveDefault
          when: d == 0
      - bind: secs
        eval: max(ceilUnits(d, time.Second), 1)
      - loop:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: syscall.SetsockoptInt(fd, o.level, o.opt, o.val)
                  to: syscall
                when: err != nil
          key: _
          range: |-
            [...]struct{ level, opt, val int }{
            		{syscall.SOL_SOCKET, syscall.SO_KEEPALIVE, 1},
            		{syscall.IPPROTO_TCP, syscall.TCP_KEEPIDLE, secs},
            		{syscall.IPPROTO_TCP, syscall.TCP_KEEPINTVL, secs},
            		{syscall.IPPROTO_TCP, syscall.TCP_KEEPCNT, keepAliveProbes},
            	}
          value: o
      - return: expectOpt(fd, syscall.IPPROTO_TCP, syscall.TCP_KEEPIDLE, secs)
        to: expectOpt
  - of: setUserTimeout
    participants:
      - id: caller
        kind: actor
      - id: setUserTimeout
        kind: self
      - id: ceilUnits
        kind: internal
      - id: syscall
        kind: stdlib
      - id: expectOpt
        kind: internal
    steps:
      - bind: ms
        eval: ceilUnits(d, time.Millisecond)
        to: ceilUnits
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: syscall.SetsockoptInt(fd, syscall.IPPROTO_TCP, tcpUserTimeout, ms)
            to: syscall
          when: err != nil
      - return: expectOpt(fd, syscall.IPPROTO_TCP, tcpUserTimeout, ms)
        to: expectOpt
  - of: setDeferAccept
    participants:
      - id: caller
        kind: actor
      - id: setDeferAccept
        kind: self
      - id: syscall
        kind: stdlib
      - id: errOr
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: syscall.SetsockoptInt(fd, syscall.IPPROTO_TCP, syscall.TCP_DEFER_ACCEPT, max(ceilUnits(d, time.Second), 1))
            to: syscall
          when: err != nil
      - bind: v, err
        eval: syscall.GetsockoptInt(fd, syscall.IPPROTO_TCP, syscall.TCP_DEFER_ACCEPT)
        to: syscall
      - opt:
          do:
            - return: errOr(err, syscall.EINVAL)
              to: errOr
          when: err != nil || v <= 0
      - return: nil
  - of: optionRows
    steps:
      - bind: ka
        eval: "optionRow{name: corenet.CapabilityTCPKeepAlive, what: \"SO_KEEPALIVE\", apply: func(fd int) error { return setKeepAlive(fd, cfg.KeepAlive) }}"
      - opt:
          do:
            - set: ka.skip
              value: "\"KeepAlive is negative\""
          when: cfg.KeepAlive < 0
      - bind: ut
        eval: "optionRow{name: corenet.CapabilityTCPUserTimeout, what: \"TCP_USER_TIMEOUT\", apply: func(fd int) error { return setUserTimeout(fd, cfg.UserTimeout) }}"
      - opt:
          do:
            - set: ut.skip
              value: "\"no UserTimeout\""
          when: cfg.UserTimeout <= 0
      - bind: da
        eval: "optionRow{name: corenet.CapabilityTCPDeferAccept, what: \"TCP_DEFER_ACCEPT\", apply: func(fd int) error { return setDeferAccept(fd, cfg.ReadTimeout) }}"
      - switch:
          cases:
            - case: "!sw.wants(corenet.CapabilityTCPDeferAccept)"
              do:
                - set: da.skip
                  value: "\"not opted into\""
            - case: cfg.ReadTimeout <= 0
              do:
                - set: da.skip
                  value: "\"no read bound\""
      - bind: lw
        eval: "optionRow{name: corenet.CapabilityTCPNotsentLowat, what: \"TCP_NOTSENT_LOWAT\", apply: func(fd int) error { return setNotsentLowat(fd, lowatOf(cfg.Value)) }}"
      - opt:
          do:
            - set: lw.skip
              value: "\"not opted into\""
          when: "!sw.wants(corenet.CapabilityTCPNotsentLowat)"
      - return: "[]optionRow{ka, ut, da, lw}"
  - of: lowatOf
    steps:
      - opt:
          do:
            - return: v.NotsentLowat
          when: v.NotsentLowat > 0
      - return: defaultNotsentLowat
  - of: setNotsentLowat
    participants:
      - id: caller
        kind: actor
      - id: setNotsentLowat
        kind: self
      - id: expectOpt
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: setsockoptHook(fd, syscall.IPPROTO_TCP, tcpNotsentLowat, n)
          when: err != nil
      - return: expectOpt(fd, syscall.IPPROTO_TCP, tcpNotsentLowat, n)
        to: expectOpt
  - of: incomingCPURow
    participants:
      - id: caller
        kind: actor
      - id: incomingCPURow
        kind: self
      - id: setIncomingCPU
        kind: internal
    steps:
      - bind: row
        eval: "listenerRow{name: corenet.CapabilitySOIncomingCPU, status: statusUnprobed, reason: \"not opted into\"}"
      - opt:
          do:
            - return: row
          when: "!sw.wants(corenet.CapabilitySOIncomingCPU)"
      - opt:
          do:
            - set: row.reason
              value: "\"no Affinity\""
            - return: row
          when: len(cfg.Value.Affinity) == 0
      - set: row.reason
        value: "\"no per-loop listener\""
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: l.Loop == 0 || l.Loop > len(cfg.Value.Affinity)
            - opt:
                do:
                  - set: row.status, row.reason
                    value: "statusMissing, \"setsockopt SO_INCOMING_CPU: \"+err.Error()"
                  - return: row
                init:
                  bind: err
                  eval: setIncomingCPU(l.FD, cfg.Value.Affinity[l.Loop-1])
                  to: setIncomingCPU
                when: err != nil
            - set: row.status, row.reason
              value: statusOn, ""
          key: _
          range: cfg.Listeners
          value: l
      - return: row
  - of: setIncomingCPU
    participants:
      - id: caller
        kind: actor
      - id: setIncomingCPU
        kind: self
      - id: expectOpt
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: setsockoptHook(fd, syscall.SOL_SOCKET, soIncomingCPU, cpu)
          when: err != nil
      - return: expectOpt(fd, syscall.SOL_SOCKET, soIncomingCPU, cpu)
        to: expectOpt
  - of: newTally
    steps:
      - bind: rows
        eval: make([]listenerRow, len(opts))
      - loop:
          do:
            - set: rows[i]
              value: "listenerRow{name: o.name, status: statusUnprobed, reason: \"no TCP listener\"}"
          key: i
          range: opts
          value: o
      - return: "&tally{opts: opts, rows: rows}"
  - of: (*tally).done
    participants:
      - id: caller
        kind: actor
      - id: (*tally).done
        kind: self
      - id: capClassOf
        kind: internal
    steps:
      - opt:
          do:
            - return: t.rows
          when: "!t.anyTCP"
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: o.skip == "" || t.rows[i].status != statusUnprobed
            - set: t.rows[i].reason
              value: o.skip
            - opt:
                do:
                  - set: t.rows[i].status
                    value: statusAvailable
                init:
                  bind: class, _
                  eval: capClassOf(o.name)
                  to: capClassOf
                when: class == classKernel
          key: i
          range: t.opts
          value: o
      - return: t.rows
  - of: prepareListeners
    participants:
      - id: caller
        kind: actor
      - id: prepareListeners
        kind: self
      - id: newTally
        kind: internal
      - id: noDelay
        kind: internal
      - id: t.listener
        kind: internal
    steps:
      - bind: t
        eval: newTally(optionRows(cfg, sw))
        to: newTally
      - loop:
          do:
            - set: fds
              value: append(fds, l.FD)
            - opt:
                do:
                  - eval: noDelay(l.FD, sw)
                    to: noDelay
                  - eval: t.listener(l.FD, sw)
                    to: t.listener
                when: tcpListener(l.FD)
          key: _
          range: cfg.Listeners
          value: l
      - return: fds, t.done()
  - of: listenerRows
    participants:
      - id: caller
        kind: actor
      - id: listenerRows
        kind: self
      - id: prepareListeners
        kind: internal
    steps:
      - set: fds, rows
        to: prepareListeners
        value: prepareListeners(cfg, sw)
      - return: fds, append(rows, shardRow(cfg.Listeners), incomingCPURow(cfg, sw))
  - of: tcpListener
    participants:
      - id: caller
        kind: actor
      - id: tcpListener
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: sa, err
        eval: syscall.Getsockname(fd)
        to: syscall
      - opt:
          do:
            - return: "false"
          when: err != nil
      - typeswitch:
          cases:
            - do:
                - return: "true"
              types: "*syscall.SockaddrInet4, *syscall.SockaddrInet6"
            - default: true
              do:
                - return: "false"
          "on": sa
  - of: ceilUnits
    steps:
      - opt:
          do:
            - return: "0"
          when: d <= 0
      - return: int((d + unit - 1) / unit)
  - of: errOr
    steps:
      - opt:
          do:
            - return: err
          when: err != nil
      - return: def
  - of: expectOpt
    participants:
      - id: caller
        kind: actor
      - id: expectOpt
        kind: self
      - id: syscall
        kind: stdlib
      - id: errOr
        kind: internal
    steps:
      - bind: v, err
        eval: syscall.GetsockoptInt(fd, level, opt)
        to: syscall
      - opt:
          do:
            - return: errOr(err, syscall.EINVAL)
              to: errOr
          when: err != nil || v != want
      - return: nil
  - of: shardRow
    participants:
      - id: caller
        kind: actor
      - id: shardRow
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: row
        eval: "listenerRow{name: corenet.CapabilityReuseportLoops, status: statusUnprobed, reason: \"no per-loop listener\"}"
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: l.Loop == 0
            - bind: v, err
              eval: syscall.GetsockoptInt(l.FD, syscall.SOL_SOCKET, soReusePort)
              to: syscall
            - opt:
                do:
                  - set: row.status, row.reason
                    value: statusMissing, "SO_REUSEPORT not set"
                  - return: row
                when: err != nil || v == 0
            - set: row.status, row.reason
              value: statusOn, ""
          key: _
          range: ls
          value: l
      - return: row
  - of: (*capReport).apply
    participants:
      - id: caller
        kind: actor
      - id: (*capReport).apply
        kind: self
      - id: r.set
        kind: internal
    steps:
      - loop:
          do:
            - eval: r.set(row.name, row.status, row.reason)
              to: r.set
          key: _
          range: rows
          value: row
  - of: refuseSeqpacket
    participants:
      - id: caller
        kind: actor
      - id: refuseSeqpacket
        kind: self
      - id: syscall
        kind: stdlib
      - id: errs
        kind: package
    steps:
      - loop:
          do:
            - bind: sa, err
              eval: syscall.Getsockname(l.FD)
              to: syscall
            - opt:
                do:
                  - continue: true
                init:
                  bind: _, unix
                  eval: sa.(*syscall.SockaddrUnix)
                when: err != nil || !unix
            - opt:
                do:
                  - return: |-
                      errs.Wrap(corenet.LoopOptionUnsupported, errs.WrapParams{},
                      				errs.String("group", cfg.Group), errs.String("network", "unixpacket"))
                    to: errs
                init:
                  bind: typ, err
                  eval: syscall.GetsockoptInt(l.FD, syscall.SOL_SOCKET, syscall.SO_TYPE)
                  to: syscall
                when: err == nil && typ == syscall.SOCK_SEQPACKET
          key: _
          range: cfg.Listeners
          value: l
      - return: nil
  - of: pktinfoSource
    participants:
      - id: caller
        kind: actor
      - id: pktinfoSource
        kind: self
      - id: pktinfo4
        kind: internal
      - id: pktinfo6
        kind: internal
    steps:
      - switch:
          cases:
            - case: level == ipprotoIP && typ == ipPktinfo && len(data) >= inPktinfoBytes
              do:
                - return: pktinfo4(data), true
                  to: pktinfo4
            - case: level == ipprotoIPv6 && typ == ipv6Pktinfo && len(data) >= in6PktinfoBytes
              do:
                - return: pktinfo6(data), true
                  to: pktinfo6
            - default: true
              do:
                - return: src, false
  - of: pktinfo4
    steps:
      - var:
          name: src
          type: replySource
      - bind: spec
        eval: "[ipv4Bytes]byte(data[ipv4Bytes : 2*ipv4Bytes])"
      - opt:
          do:
            - eval: copy(src.addr[:ipv4Bytes], spec[:])
            - set: src.n
              value: ipv4Bytes
          when: spec != [ipv4Bytes]byte{}
      - return: src
  - of: pktinfo6
    participants:
      - id: caller
        kind: actor
      - id: pktinfo6
        kind: self
      - id: netip
        kind: stdlib
    steps:
      - var:
          name: src
          type: replySource
      - bind: a
        eval: netip.AddrFrom16([ipv6Bytes]byte(data[:ipv6Bytes]))
        to: netip
      - opt:
          do:
            - set: src.addr, src.n
              value: a.As16(), ipv6Bytes
          when: "!a.IsMulticast() && !a.IsUnspecified() && a.Unmap() != ipv4Broadcast"
      - return: src
  - of: (*packetLane).remember
    steps:
      - opt:
          do:
            - return: ""
          when: src.n == 0
      - opt:
          do:
            - bind: last
              eval: "&lp.seen[(lp.seenNext+packetSeenMax-1)%packetSeenMax]"
            - opt:
                do:
                  - return: ""
                when: last.from == from && last.src == src
          when: lp.seenLen > 0
      - set: lp.seen[lp.seenNext]
        value: "seenPeer{from: from, src: src}"
      - set: lp.seenNext
        value: (lp.seenNext + 1) % packetSeenMax
      - set: lp.seenLen
        value: min(lp.seenLen+1, packetSeenMax)
  - of: (*packetLane).sourceFor
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).sourceFor
        kind: self
      - id: to.Addr().Unmap
        kind: value
    steps:
      - bind: want
        eval: to.Addr().Unmap()
        to: to.Addr().Unmap
      - loop:
          cond: i <= lp.seenLen
          do:
            - bind: p
              eval: "&lp.seen[(lp.seenNext+packetSeenMax-i)%packetSeenMax]"
            - opt:
                do:
                  - return: p.src
                when: p.from.Port() == to.Port() && p.from.Addr().Unmap() == want
          init: i := 1
          post: i++
      - return: replySource{}
  - of: (*packetLane).forget
    steps:
      - set: lp.seenLen, lp.seenNext
        value: 0, 0
  - of: writePktinfo
    participants:
      - id: caller
        kind: actor
      - id: writePktinfo
        kind: self
      - id: binary.LittleEndian.PutUint64
        kind: value
      - id: binary.LittleEndian.PutUint32
        kind: value
      - id: cmsgSpace
        kind: internal
    steps:
      - switch:
          cases:
            - case: family == afInet && src.n == ipv4Bytes
              do:
                - eval: binary.LittleEndian.PutUint64(c[0:8], uint64(cmsgHdrBytes+inPktinfoBytes))
                  to: binary.LittleEndian.PutUint64
                - eval: binary.LittleEndian.PutUint32(c[8:12], uint32(ipprotoIP))
                  to: binary.LittleEndian.PutUint32
                - eval: binary.LittleEndian.PutUint32(c[12:16], uint32(ipPktinfo))
                  to: binary.LittleEndian.PutUint32
                - eval: copy(c[cmsgHdrBytes+int(ipv4Bytes):], src.addr[:ipv4Bytes])
                - return: cmsgSpace(inPktinfoBytes)
                  to: cmsgSpace
            - case: family == afInet6 && src.n == ipv6Bytes
              do:
                - eval: binary.LittleEndian.PutUint64(c[0:8], uint64(cmsgHdrBytes+in6PktinfoBytes))
                  to: binary.LittleEndian.PutUint64
                - eval: binary.LittleEndian.PutUint32(c[8:12], uint32(ipprotoIPv6))
                  to: binary.LittleEndian.PutUint32
                - eval: binary.LittleEndian.PutUint32(c[12:16], uint32(ipv6Pktinfo))
                  to: binary.LittleEndian.PutUint32
                - eval: copy(c[cmsgHdrBytes:], src.addr[:])
                - return: cmsgSpace(in6PktinfoBytes)
                  to: cmsgSpace
            - default: true
              do:
                - return: "0"
  - of: cmsgSpace
    steps:
      - return: cmsgHdrBytes + (n+cmsgAlign-1)&^(cmsgAlign-1)
  - of: (*packetLane).unpin
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).unpin
        kind: self
      - id: cmsgSpace
        kind: internal
      - id: lp.u.get
        kind: internal
      - id: prepSendmsg
        kind: internal
    steps:
      - bind: r
        eval: "lp.rec[k*packetRecordBytes : (k+1)*packetRecordBytes : (k+1)*packetRecordBytes]"
      - bind: hdr
        eval: (*syscall.Msghdr)(unsafe.Pointer(&r[0]))
      - bind: ctl
        eval: r[recordControlOff:]
      - bind: used
        eval: int(hdr.Controllen)
      - bind: first
        eval: cmsgSpace(int(binary.LittleEndian.Uint64(ctl[0:8])) - cmsgHdrBytes)
        to: cmsgSpace
      - bind: s
        eval: lp.u.get()
        to: lp.u.get
      - opt:
          do:
            - return: "false"
          when: s == nil || first > used
      - eval: copy(ctl, ctl[first:used])
      - set: hdr.Controllen
        value: uint64(used - first)
      - opt:
          do:
            - set: hdr.Control
              value: nil
          when: hdr.Controllen == 0
      - eval: prepSendmsg(s, lp.cfg.FD, unsafe.Pointer(hdr), pudSend|uint64(k))
        to: prepSendmsg
      - set: lp.pinned[k]
        value: "false"
      - return: "true"
  - of: StartPacket
    participants:
      - id: caller
        kind: actor
      - id: StartPacket
        kind: self
      - id: startPacket
        kind: internal
    steps:
      - return: startPacket(cfg, "")
        to: startPacket
  - of: startPacket
    participants:
      - id: caller
        kind: actor
      - id: startPacket
        kind: self
      - id: lp.run
        kind: internal
    steps:
      - bind: lp
        eval: "&packetLane{cfg: *cfg, failStage: failStage, efd: -1, done: make(chan struct{})}"
      - bind: ready
        eval: make(chan error, 1)
      - go: lp.run(ready)
        to: lp.run
      - opt:
          do:
            - eval: <-lp.done
            - return: nil, err
          init:
            bind: err
            eval: <-ready
          when: err != nil
      - return: lp, nil
  - of: (*packetLane).has
    steps:
      - return: lp.flags&f != 0
  - of: (*packetLane).set
    steps:
      - alt:
          - do:
              - op: "|="
                set: lp.flags
                value: f
            when: "on"
          - do:
              - op: "&^="
                set: lp.flags
                value: f
            else: true
  - of: (*packetLane).Handover
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).Handover
        kind: self
      - id: lp.wake
        kind: internal
    steps:
      - opt:
          do:
            - eval: lp.wake()
              to: lp.wake
          when: lp.state.CompareAndSwap(laneServe, laneHandover)
  - of: (*packetLane).Stop
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).Stop
        kind: self
      - id: lp.state.Store
        kind: value
      - id: lp.wake
        kind: internal
    steps:
      - eval: lp.state.Store(laneStop)
        to: lp.state.Store
      - eval: lp.wake()
        to: lp.wake
      - eval: <-lp.done
  - of: (*packetLane).Done
    steps:
      - return: lp.done
  - of: (*packetLane).run
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).run
        kind: self
      - id: runtime
        kind: stdlib
      - id: lp.doneOnce.Do
        kind: value
      - id: lp.release
        kind: internal
      - id: lp.setup
        kind: internal
      - id: lp.serve
        kind: internal
    steps:
      - eval: runtime.LockOSThread()
        to: runtime
      - defer: runtime.UnlockOSThread()
        to: runtime
      - defer: lp.doneOnce.Do(func() { close(lp.done) })
        to: lp.doneOnce.Do
      - defer: lp.release()
        to: lp.release
      - opt:
          do:
            - send:
                chan: ready
                value: |-
                  errs.Wrap(corenet.LoopBackendUnavailable, errs.WrapParams{},
                  			errs.String("group", lp.cfg.Group), errs.String("stage", stage), errs.String("reason", why))
            - return: ""
          init:
            bind: stage, why
            eval: lp.setup()
            to: lp.setup
          when: stage != ""
      - send:
          chan: ready
          value: nil
      - eval: lp.serve()
        to: lp.serve
  - of: (*packetLane).setup
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).setup
        kind: self
      - id: lp.openRing
        kind: internal
      - id: lp.selfTest
        kind: internal
      - id: lp.mapArenas
        kind: internal
      - id: lp.armSocket
        kind: internal
    steps:
      - set: lp.onCQE
        value: lp.complete
      - set: lp.tick
        value: "kernelTimespec{nsec: packetTick}"
      - opt:
          do:
            - return: stage, why
          init:
            bind: stage, why
            eval: lp.openRing()
            to: lp.openRing
          when: stage != ""
      - set: lp.hdr.Namelen
        value: uint32(packetNameRoom)
      - set: lp.hdr.Controllen
        value: uint64(packetCtrlRoom)
      - opt:
          do:
            - return: "\"recvmsg\", why + lp.failStage"
          init:
            bind: why
            eval: lp.selfTest()
            to: lp.selfTest
          when: why != "" || lp.failStage == "recvmsg"
      - opt:
          do:
            - return: "\"arena\", why"
          init:
            bind: why
            eval: lp.mapArenas()
            to: lp.mapArenas
          when: why != ""
      - opt:
          do:
            - return: stage, why
          init:
            bind: stage, why
            eval: lp.armSocket()
            to: lp.armSocket
          when: stage != ""
      - return: "\"\", \"\""
  - of: (*packetLane).openRing
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).openRing
        kind: self
      - id: openURing
        kind: internal
      - id: ring.supports
        kind: internal
      - id: ring.setupBuffers
        kind: internal
    steps:
      - bind: ring, step, errno
        eval: openURing(packetEntries, setupCoopTaskrun|setupSingleIssuer)
        to: openURing
      - opt:
          do:
            - set: ring, step, errno
              to: openURing
              value: openURing(packetEntries, 0)
          when: errno == syscall.EINVAL
      - opt:
          do:
            - return: "\"setup\", step + \": \" + errno.Error()"
          when: errno != 0 || lp.failStage == "setup"
      - set: lp.u
        value: ring
      - bind: ok, perr
        eval: ring.supports(opRecvmsg, opSendmsg, opAsyncCancel, opPollAdd)
        to: ring.supports
      - opt:
          do:
            - return: "\"probe\", \"REGISTER_PROBE: RECVMSG, SENDMSG, ASYNC_CANCEL or POLL_ADD unsupported\""
          when: perr != 0 || !ok || lp.failStage == "probe"
      - bind: size
        eval: uint32(recvmsgOutBytes + packetNameRoom + packetCtrlRoom + max(packetPayloadRoom, lp.cfg.Ceiling+1))
      - opt:
          do:
            - return: "\"buf_ring\", \"IORING_REGISTER_PBUF_RING: \" + errno.Error()"
          init:
            bind: errno
            eval: ring.setupBuffers(packetBufs, size, packetBufs, false)
            to: ring.setupBuffers
          when: errno != 0 || lp.failStage == "buf_ring"
      - return: "\"\", \"\""
  - of: (*packetLane).armSocket
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).armSocket
        kind: self
      - id: socketFamily
        kind: internal
      - id: syscall
        kind: stdlib
      - id: swallowErr
        kind: internal
      - id: lp.armRecv
        kind: internal
      - id: lp.armWake
        kind: internal
      - id: lp.u.submit
        kind: internal
    steps:
      - bind: family, ferr
        eval: socketFamily(lp.cfg.FD)
        to: socketFamily
      - opt:
          do:
            - return: "\"socket\", ferr"
          when: ferr != ""
      - set: lp.family
        value: family
      - bind: efd, _, e
        eval: syscall.RawSyscall(syscall.SYS_EVENTFD2, 0, efdNonblock|efdCloexec, 0)
        to: syscall
      - opt:
          do:
            - return: "\"eventfd\", e.Error()"
          when: e != 0
      - set: lp.efd
        value: int(efd)
      - eval: swallowErr(syscall.SetsockoptInt(lp.cfg.FD, solUDP, udpGRO, 1))
        to: swallowErr
      - eval: lp.armRecv()
        to: lp.armRecv
      - eval: lp.armWake()
        to: lp.armWake
      - eval: lp.u.submit()
        to: lp.u.submit
      - return: "\"\", \"\""
  - of: (*packetLane).mapArenas
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).mapArenas
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: out, err
        eval: |-
          syscall.Mmap(-1, 0, packetOutBytes+packetReplies*packetRecordBytes+recvmsgOutBytes+packetNameRoom+packetCtrlRoom+packetPayloadRoom,
          		syscall.PROT_READ|syscall.PROT_WRITE, syscall.MAP_PRIVATE|syscall.MAP_ANONYMOUS)
        to: syscall
      - opt:
          do:
            - return: "\"mmap: \" + err.Error()"
          when: err != nil
      - set: lp.arena
        value: out
      - set: lp.out
        value: out[:packetOutBytes:packetOutBytes]
      - set: lp.rec
        value: "out[packetOutBytes : packetOutBytes+packetReplies*packetRecordBytes : packetOutBytes+packetReplies*packetRecordBytes]"
      - set: lp.drainBuf
        value: out[packetOutBytes+packetReplies*packetRecordBytes:]
      - set: lp.segs
        value: make([]uint16, packetReplies)
      - set: lp.gso
        value: make([]bool, packetReplies)
      - set: lp.pinned
        value: make([]bool, packetReplies)
      - set: lp.pend
        value: make([]pendingReply, 0, packetReplies)
      - set: lp.recycle
        value: make([]uint16, 0, packetBufs)
      - return: "\"\""
  - of: (*packetLane).selfTest
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).selfTest
        kind: self
      - id: loopbackPair
        kind: internal
      - id: closePair
        kind: internal
      - id: lp.probeOne
        kind: internal
      - id: splitRecvmsgOut
        kind: internal
      - id: lp.u.addBuf
        kind: internal
      - id: lp.u.publishBufs
        kind: internal
      - id: sockaddrPort
        kind: internal
    steps:
      - bind: rx, tx, why
        eval: loopbackPair()
        to: loopbackPair
      - opt:
          do:
            - return: why
          when: why != ""
      - defer: closePair(rx, tx)
        to: closePair
      - bind: got, why
        eval: lp.probeOne(rx, tx)
        to: lp.probeOne
      - opt:
          do:
            - return: why
          when: why != ""
      - opt:
          do:
            - return: "\"multishot RECVMSG: no datagram with a buffer and F_MORE within 200 ms\""
          when: got.userData != pudProbe || got.res <= 0 || got.flags&cqeFBuffer == 0 || got.flags&cqeFMore == 0
      - bind: bid
        eval: uint16(got.flags >> cqeBufferShift)
      - bind: name, _, payload, _
        eval: splitRecvmsgOut(lp.u.buf(bid)[:got.res])
        to: splitRecvmsgOut
      - eval: lp.u.addBuf(bid)
        to: lp.u.addBuf
      - eval: lp.u.publishBufs()
        to: lp.u.publishBufs
      - bind: from
        eval: sockaddrPort(name)
        to: sockaddrPort
      - opt:
          do:
            - return: "\"multishot RECVMSG: the buffer's header, address or payload did not read back\""
          when: string(payload) != "kit" || !from.IsValid() || !from.Addr().Is4()
      - return: "\"\""
  - of: (*packetLane).probeOne
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).probeOne
        kind: self
      - id: prepRecvmsg
        kind: internal
      - id: ring.submit
        kind: internal
      - id: syscall
        kind: stdlib
      - id: ring.wait
        kind: internal
      - id: ring.reap
        kind: internal
      - id: prepCancelUserData
        kind: internal
      - id: lp.awaitFinals
        kind: internal
    steps:
      - bind: ring
        eval: lp.u
      - eval: prepRecvmsg(ring.get(), rx, &lp.hdr, pudProbe)
        to: prepRecvmsg
      - eval: ring.submit()
        to: ring.submit
      - bind: addr, err
        eval: syscall.Getsockname(rx)
        to: syscall
      - opt:
          do:
            - return: "cqe{}, \"getsockname: \" + err.Error()"
          when: err != nil
      - opt:
          do:
            - return: "cqe{}, \"sendto: \" + err.Error()"
          init:
            bind: err
            eval: syscall.Sendto(tx, []byte("kit"), 0, addr)
            to: syscall
          when: err != nil
      - bind: ts
        eval: "kernelTimespec{nsec: packetProbeWait}"
      - eval: ring.wait(&ts, 1)
        to: ring.wait
      - var:
          name: got
          type: cqe
      - eval: ring.reap(1, func(c *cqe) { got = *c })
        to: ring.reap
      - eval: prepCancelUserData(ring.get(), pudProbe, pudCancel)
        to: prepCancelUserData
      - eval: ring.submit()
        to: ring.submit
      - eval: lp.awaitFinals(&ts)
        to: lp.awaitFinals
      - return: got, ""
  - of: (*packetLane).awaitFinals
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).awaitFinals
        kind: self
      - id: lp.u.wait
        kind: internal
      - id: lp.reapCQ
        kind: internal
    steps:
      - bind: finals
        eval: "0"
      - bind: count
        eval:
          closure:
            params: c *cqe
            steps:
              - opt:
                  do:
                    - op: ++
                      set: finals
                  when: c.userData == pudCancel || c.flags&cqeFMore == 0
      - loop:
          cond: finals < 2 && i < probeFinalTries
          do:
            - eval: lp.u.wait(ts, 1)
              to: lp.u.wait
            - eval: lp.reapCQ(count)
              to: lp.reapCQ
          init: i := 0
          post: i++
  - of: loopbackPair
    participants:
      - id: caller
        kind: actor
      - id: loopbackPair
        kind: self
      - id: syscall
        kind: stdlib
      - id: swallowErr
        kind: internal
    steps:
      - bind: rx, err
        eval: syscall.Socket(syscall.AF_INET, syscall.SOCK_DGRAM|syscall.SOCK_NONBLOCK|syscall.SOCK_CLOEXEC, 0)
        to: syscall
      - opt:
          do:
            - return: "-1, -1, \"socket: \" + err.Error()"
          when: err != nil
      - opt:
          do:
            - eval: swallowErr(syscall.Close(rx))
              to: swallowErr
            - return: "-1, -1, \"bind: \" + err.Error()"
          init:
            bind: err
            eval: "syscall.Bind(rx, &syscall.SockaddrInet4{Addr: [4]byte{127, 0, 0, 1}})"
            to: syscall
          when: err != nil
      - set: tx, err
        to: syscall
        value: syscall.Socket(syscall.AF_INET, syscall.SOCK_DGRAM|syscall.SOCK_CLOEXEC, 0)
      - opt:
          do:
            - eval: swallowErr(syscall.Close(rx))
              to: swallowErr
            - return: "-1, -1, \"socket: \" + err.Error()"
          when: err != nil
      - return: rx, tx, ""
  - of: closePair
    participants:
      - id: caller
        kind: actor
      - id: closePair
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - eval: swallowErr(syscall.Close(rx))
        to: swallowErr
      - eval: swallowErr(syscall.Close(tx))
        to: swallowErr
  - of: socketFamily
    participants:
      - id: caller
        kind: actor
      - id: socketFamily
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: sa, err
        eval: syscall.Getsockname(fd)
        to: syscall
      - switch:
          cases:
            - case: err != nil
              do:
                - return: "0, \"getsockname: \" + err.Error()"
            - case: isInet4(sa)
              do:
                - return: afInet, ""
            - case: isInet6(sa)
              do:
                - return: afInet6, ""
            - default: true
              do:
                - return: 0, "not a UDP socket"
  - of: isInet4
    steps:
      - bind: _, ok
        eval: sa.(*syscall.SockaddrInet4)
      - return: ok
  - of: isInet6
    steps:
      - bind: _, ok
        eval: sa.(*syscall.SockaddrInet6)
      - return: ok
  - of: prepRecvmsg
    steps:
      - set: s.opcode
        value: opRecvmsg
      - set: s.fd
        value: int32(fd)
      - set: s.addr
        value: uint64(uintptr(unsafe.Pointer(hdr)))
      - set: s.len
        value: "1"
      - set: s.ioprio
        value: recvMultishot
      - set: s.flags
        value: sqeBufferSelect
      - set: s.bufIndex
        value: bufGroup
      - set: s.userData
        value: ud
  - of: prepSendmsg
    steps:
      - set: s.opcode
        value: opSendmsg
      - set: s.fd
        value: int32(fd)
      - set: s.addr
        value: uint64(uintptr(hdr))
      - set: s.len
        value: "1"
      - set: s.userData
        value: ud
  - of: (*packetLane).armRecv
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).armRecv
        kind: self
      - id: lp.u.get
        kind: internal
      - id: prepRecvmsg
        kind: internal
      - id: lp.set
        kind: internal
    steps:
      - bind: s
        eval: lp.u.get()
        to: lp.u.get
      - opt:
          do:
            - return: ""
          when: s == nil
      - eval: prepRecvmsg(s, lp.cfg.FD, &lp.hdr, pudRecv)
        to: prepRecvmsg
      - eval: lp.set(laneArmed, true)
        to: lp.set
  - of: (*packetLane).armWake
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).armWake
        kind: self
      - id: lp.u.get
        kind: internal
      - id: prepPollMulti
        kind: internal
      - id: lp.set
        kind: internal
    steps:
      - bind: s
        eval: lp.u.get()
        to: lp.u.get
      - opt:
          do:
            - return: ""
          when: s == nil
      - eval: prepPollMulti(s, lp.efd, pudWake)
        to: prepPollMulti
      - eval: lp.set(laneWoke, true)
        to: lp.set
  - of: (*packetLane).wake
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).wake
        kind: self
      - id: syscall
        kind: stdlib
      - id: swallowErr
        kind: internal
    steps:
      - lock:
          mutex: lp.wakeMu
      - opt:
          do:
            - return: ""
          when: lp.efd < 0
      - bind: one
        eval: new(uint64(1))
      - bind: _, err
        eval: syscall.Write(lp.efd, (*[8]byte)(unsafe.Pointer(one))[:])
        to: syscall
      - eval: swallowErr(err)
        to: swallowErr
  - of: (*packetLane).serve
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).serve
        kind: self
      - id: lp.state.Load
        kind: value
      - id: lp.beginHandover
        kind: internal
      - id: lp.finishHandover
        kind: internal
      - id: lp.u.wait
        kind: internal
      - id: lp.batch
        kind: internal
    steps:
      - loop:
          do:
            - bind: st
              eval: lp.state.Load()
              to: lp.state.Load
            - opt:
                do:
                  - return: ""
                when: st == laneStop
            - opt:
                do:
                  - eval: lp.beginHandover()
                    to: lp.beginHandover
                when: st == laneHandover && !lp.has(laneHanding)
            - opt:
                do:
                  - eval: lp.finishHandover()
                    to: lp.finishHandover
                  - return: ""
                when: lp.has(laneHanding) && !lp.has(laneArmed)
            - eval: lp.u.wait(&lp.tick, 1)
              to: lp.u.wait
            - eval: lp.batch()
              to: lp.batch
          forever: true
  - of: (*packetLane).batch
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).batch
        kind: self
      - id: u.flushOverflow
        kind: internal
      - id: lp.reapCQ
        kind: internal
      - id: lp.endBatch
        kind: internal
      - id: lp.armRecv
        kind: internal
      - id: lp.armWake
        kind: internal
      - id: u.submit
        kind: internal
    steps:
      - bind: u
        eval: lp.u
      - opt:
          do:
            - eval: u.flushOverflow()
              to: u.flushOverflow
          when: u.overflowed()
      - loop:
          cond: u.ready() > 0
          do:
            - eval: lp.reapCQ(lp.onCQE)
              to: lp.reapCQ
      - eval: lp.endBatch()
        to: lp.endBatch
      - opt:
          do:
            - eval: lp.armRecv()
              to: lp.armRecv
          when: "!lp.has(laneArmed) && !lp.has(laneHanding)"
      - opt:
          do:
            - eval: lp.armWake()
              to: lp.armWake
          when: "!lp.has(laneWoke)"
      - eval: u.submit()
        to: u.submit
  - of: (*packetLane).endBatch
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).endBatch
        kind: self
      - id: lp.cfg.Handler.OnBatchEnd
        kind: value
      - id: lp.flush
        kind: internal
      - id: lp.forget
        kind: internal
      - id: lp.u.addBuf
        kind: internal
      - id: lp.u.publishBufs
        kind: internal
      - id: lp.publish
        kind: internal
    steps:
      - opt:
          do:
            - set: lp.handed
              value: "0"
            - eval: lp.cfg.Handler.OnBatchEnd(lp)
              to: lp.cfg.Handler.OnBatchEnd
          when: lp.handed > 0
      - eval: lp.flush()
        to: lp.flush
      - eval: lp.forget()
        to: lp.forget
      - loop:
          do:
            - eval: lp.u.addBuf(bid)
              to: lp.u.addBuf
          key: _
          range: lp.recycle
          value: bid
      - set: lp.recycle
        value: lp.recycle[:0]
      - eval: lp.u.publishBufs()
        to: lp.u.publishBufs
      - eval: lp.publish()
        to: lp.publish
  - of: (*packetLane).complete
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).complete
        kind: self
      - id: lp.received
        kind: internal
      - id: lp.sent
        kind: internal
      - id: lp.set
        kind: internal
      - id: syscall
        kind: stdlib
      - id: swallowErr
        kind: internal
    steps:
      - switch:
          cases:
            - case: pudRecv
              do:
                - eval: lp.received(c)
                  to: lp.received
            - case: pudSend
              do:
                - eval: lp.sent(c)
                  to: lp.sent
            - case: pudWake
              do:
                - eval: lp.set(laneWoke, c.flags&cqeFMore != 0)
                  to: lp.set
                - var:
                    name: b
                    type: "[8]byte"
                - bind: _, err
                  eval: syscall.Read(lp.efd, b[:])
                  to: syscall
                - eval: swallowErr(err)
                  to: swallowErr
            - default: true
          "on": c.userData & pudKind
  - of: (*packetLane).received
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).received
        kind: self
      - id: lp.set
        kind: internal
      - id: splitRecvmsgOut
        kind: internal
      - id: lp.deliver
        kind: internal
    steps:
      - opt:
          do:
            - eval: lp.set(laneArmed, false)
              to: lp.set
          when: c.flags&cqeFMore == 0
      - opt:
          do:
            - return: ""
          when: c.res < 0 || c.flags&cqeFBuffer == 0
      - bind: bid
        eval: uint16(c.flags >> cqeBufferShift)
      - set: lp.recycle
        value: append(lp.recycle, bid)
      - bind: name, ctrl, payload, flags
        eval: splitRecvmsgOut(lp.u.buf(bid)[:c.res])
        to: splitRecvmsgOut
      - eval: lp.deliver(name, ctrl, payload, flags)
        to: lp.deliver
  - of: splitRecvmsgOut
    participants:
      - id: caller
        kind: actor
      - id: splitRecvmsgOut
        kind: self
      - id: binary.LittleEndian.Uint32
        kind: value
    steps:
      - opt:
          do:
            - return: nil, nil, nil, msgCtrunc
          when: len(b) < recvmsgOutBytes+packetNameRoom+packetCtrlRoom
      - bind: namelen
        eval: int(binary.LittleEndian.Uint32(b[0:4]))
      - bind: ctrllen
        eval: int(binary.LittleEndian.Uint32(b[4:8]))
      - set: flags
        to: binary.LittleEndian.Uint32
        value: binary.LittleEndian.Uint32(b[12:16])
      - bind: n0
        eval: recvmsgOutBytes
      - bind: c0
        eval: n0 + packetNameRoom
      - bind: p0
        eval: c0 + packetCtrlRoom
      - return: "b[n0 : n0+min(namelen, packetNameRoom)], b[c0 : c0+min(ctrllen, packetCtrlRoom)], b[p0:], flags"
  - of: (*packetLane).deliver
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).deliver
        kind: self
      - id: lp.control
        kind: internal
      - id: sockaddrPort
        kind: internal
      - id: lp.remember
        kind: internal
      - id: lp.one
        kind: internal
    steps:
      - bind: seg
        eval: lp.control(ctrl)
        to: lp.control
      - opt:
          do:
            - op: ++
              set: lp.truncated
            - return: ""
          when: flags&msgCtrunc != 0 || (flags&msgTrunc != 0 && seg > 0)
      - opt:
          do:
            - op: ++
              set: lp.total
            - op: ++
              set: lp.oversized
            - return: ""
          when: flags&msgTrunc != 0
      - bind: from
        eval: sockaddrPort(name)
        to: sockaddrPort
      - eval: lp.remember(from, lp.cur)
        to: lp.remember
      - opt:
          do:
            - eval: lp.one(from, payload)
              to: lp.one
            - return: ""
          when: seg <= 0 || seg >= len(payload)
      - loop:
          cond: off < len(payload)
          do:
            - eval: lp.one(from, payload[off:min(off+seg, len(payload))])
              to: lp.one
          init: off := 0
          post: off += seg
  - of: (*packetLane).one
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).one
        kind: self
      - id: lp.cfg.Handler.OnPacket
        kind: value
    steps:
      - op: ++
        set: lp.total
      - opt:
          do:
            - op: ++
              set: lp.oversized
            - return: ""
          when: len(d) > lp.cfg.Ceiling
      - op: ++
        set: lp.handed
      - eval: lp.cfg.Handler.OnPacket(lp, from, d)
        to: lp.cfg.Handler.OnPacket
  - of: (*packetLane).control
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).control
        kind: self
      - id: lp.cmsg
        kind: internal
    steps:
      - bind: seg
        eval: "0"
      - set: lp.cur
        value: replySource{}
      - loop:
          cond: len(ctrl) >= cmsgHdrBytes
          do:
            - bind: clen
              eval: int(binary.LittleEndian.Uint64(ctrl[0:8]))
            - opt:
                do:
                  - break: true
                when: clen < cmsgHdrBytes || clen > len(ctrl)
            - set: seg
              to: lp.cmsg
              value: lp.cmsg(ctrl[:clen], seg)
            - set: ctrl
              value: ctrl[min((clen+cmsgAlign-1)&^(cmsgAlign-1), len(ctrl)):]
      - return: seg
  - of: (*packetLane).cmsg
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).cmsg
        kind: self
      - id: pktinfoSource
        kind: internal
      - id: binary.LittleEndian.Uint32
        kind: value
    steps:
      - bind: level
        eval: int(int32(binary.LittleEndian.Uint32(m[8:12])))
      - bind: typ
        eval: int(int32(binary.LittleEndian.Uint32(m[12:16])))
      - bind: data
        eval: m[cmsgHdrBytes:]
      - opt:
          do:
            - set: lp.cur
              value: src
            - return: seg
          init:
            bind: src, ok
            eval: pktinfoSource(level, typ, data)
            to: pktinfoSource
          when: ok
      - opt:
          do:
            - return: seg
          when: len(data) < cmsgIntBytes
      - bind: v
        eval: binary.LittleEndian.Uint32(data)
        to: binary.LittleEndian.Uint32
      - switch:
          cases:
            - case: level == solUDP && typ == udpGRO
              do:
                - return: int(int32(v))
            - case: level == syscall.SOL_SOCKET && typ == soRxqOvfl
              do:
                - op: +=
                  set: lp.drops
                  value: uint64(v - lp.lastOvfl)
                - set: lp.lastOvfl
                  value: v
            - default: true
      - return: seg
  - of: sockaddrPort
    participants:
      - id: caller
        kind: actor
      - id: sockaddrPort
        kind: self
      - id: binary.LittleEndian.Uint16
        kind: value
      - id: binary.BigEndian.Uint16
        kind: value
      - id: netip
        kind: stdlib
    steps:
      - opt:
          do:
            - return: netip.AddrPort{}
          when: len(name) < 2
      - bind: family
        eval: binary.LittleEndian.Uint16(name[0:2])
        to: binary.LittleEndian.Uint16
      - switch:
          cases:
            - case: family == afInet && len(name) >= 8
              do:
                - bind: port
                  eval: binary.BigEndian.Uint16(name[2:4])
                  to: binary.BigEndian.Uint16
                - return: netip.AddrPortFrom(netip.AddrFrom4([4]byte(name[4:8])), port)
                  to: netip
            - case: family == afInet6 && len(name) >= 24
              do:
                - bind: port
                  eval: binary.BigEndian.Uint16(name[2:4])
                  to: binary.BigEndian.Uint16
                - return: netip.AddrPortFrom(netip.AddrFrom16([16]byte(name[8:24])), port)
                  to: netip
            - default: true
              do:
                - return: netip.AddrPort{}
  - of: (*packetLane).Reply
    steps:
      - opt:
          do:
            - return: corenet.LoopOutputFull
          when: lp.recNext+len(lp.pend) >= packetReplies || int(lp.outOff)+len(p) > len(lp.out)
      - eval: copy(lp.out[lp.outOff:], p)
      - set: lp.pend
        value: "append(lp.pend, pendingReply{to: to, off: lp.outOff, n: uint32(len(p))})"
      - op: +=
        set: lp.outOff
        value: uint32(len(p))
      - return: nil
  - of: (*packetLane).Loop
    steps:
      - return: lp.cfg.Lane
  - of: (*packetLane).flush
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).flush
        kind: self
      - id: lp.sourceFor
        kind: internal
      - id: lp.runEnd
        kind: internal
      - id: lp.send
        kind: internal
      - id: lp.settle
        kind: internal
    steps:
      - bind: pend
        eval: lp.pend
      - loop:
          do:
            - set: pend[i].src
              to: lp.sourceFor
              value: lp.sourceFor(pend[i].to)
          key: i
          range: pend
      - loop:
          cond: i < len(pend)
          do:
            - bind: j
              eval: lp.runEnd(pend, i)
              to: lp.runEnd
            - eval: lp.send(pend[i:j])
              to: lp.send
            - set: i
              value: j
          init: i := 0
      - set: lp.pend
        value: lp.pend[:0]
      - eval: lp.settle()
        to: lp.settle
  - of: (*packetLane).runEnd
    steps:
      - bind: size
        eval: pend[i].n
      - opt:
          do:
            - return: i + 1
          when: lp.has(laneGSOOff) || size == 0
      - bind: total
        eval: int(size)
      - bind: j
        eval: i + 1
      - loop:
          cond: j < len(pend) && j-i < gsoMaxSegments && extendsRun(pend[i], pend[j-1], pend[j], total)
          do:
            - op: +=
              set: total
              value: int(pend[j].n)
          post: j++
      - return: j
  - of: extendsRun
    steps:
      - return: r.to == first.to && r.src == first.src && r.off == prev.off+prev.n && prev.n == first.n && r.n <= first.n && total+int(r.n) <= gsoMaxBytes
  - of: (*packetLane).send
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).send
        kind: self
      - id: encodeSockaddr
        kind: internal
      - id: lp.u.get
        kind: internal
      - id: lp.writeControl
        kind: internal
      - id: prepSendmsg
        kind: internal
    steps:
      - bind: k
        eval: lp.recNext
      - bind: r
        eval: "lp.rec[k*packetRecordBytes : (k+1)*packetRecordBytes : (k+1)*packetRecordBytes]"
      - eval: clear(r)
      - bind: nameLen
        eval: encodeSockaddr(r[72:104], run[0].to, lp.family)
        to: encodeSockaddr
      - bind: s
        eval: lp.u.get()
        to: lp.u.get
      - opt:
          do:
            - op: +=
              set: lp.failures
              value: uint64(len(run))
            - return: ""
          when: nameLen == 0 || s == nil
      - bind: last
        eval: run[len(run)-1]
      - bind: hdr
        eval: (*syscall.Msghdr)(unsafe.Pointer(&r[0]))
      - bind: iov
        eval: (*syscall.Iovec)(unsafe.Pointer(&r[56]))
      - set: iov.Base
        value: "&lp.out[run[0].off]"
      - set: iov.Len
        value: uint64(last.off + last.n - run[0].off)
      - opt:
          do:
            - set: iov.Base
              value: nil
          when: iov.Len == 0
      - set: hdr.Name
        value: "&r[72]"
      - set: hdr.Namelen
        value: nameLen
      - set: hdr.Iov
        value: iov
      - set: hdr.Iovlen
        value: "1"
      - bind: ctl
        eval: r[recordControlOff:]
      - bind: used, pinned, gso
        eval: lp.writeControl(ctl, run)
        to: lp.writeControl
      - opt:
          do:
            - set: hdr.Control
              value: "&ctl[0]"
            - set: hdr.Controllen
              value: uint64(used)
          when: used > 0
      - eval: prepSendmsg(s, lp.cfg.FD, unsafe.Pointer(hdr), pudSend|uint64(k))
        to: prepSendmsg
      - set: lp.segs[k], lp.gso[k], lp.pinned[k]
        value: uint16(len(run)), gso, pinned
      - op: ++
        set: lp.recNext
      - op: ++
        set: lp.inflight
  - of: (*packetLane).writeControl
    participants:
      - id: caller
        kind: actor
      - id: (*packetLane).writeControl
        kind: self
      - id: writePktinfo
        kind: internal
      - id: binary.LittleEndian.PutUint64
        kind: value
      - id: binary.LittleEndian.PutUint32
        kind: value
      - id: binary.LittleEndian.PutUint16
        kind: value
      - id: lp.gsoSends.Add
        kind: value
    steps:
      - set: used
        to: writePktinfo
        value: writePktinfo(ctl, lp.family, run[0].src)
      - set: pinned
        value: used > 0
      - set: gso
        value: len(run) > 1
      - opt:
          do:
            - bind: c
              eval: "ctl[used : used+int(segmentCmsgBytes)]"
            - eval: binary.LittleEndian.PutUint64(c[0:8], uint64(cmsgHdrBytes+2))
              to: binary.LittleEndian.PutUint64
            - eval: binary.LittleEndian.PutUint32(c[8:12], uint32(solUDP))
              to: binary.LittleEndian.PutUint32
            - eval: binary.LittleEndian.PutUint32(c[12:16], uint32(udpSegment))
              to: binary.LittleEndian.PutUint32
            - eval: binary.LittleEndian.PutUint16(c[16:18], uint16(run[0].n))
              to: binary.LittleEndian.PutUint16
            - op: +=
              set: used
              value: int(segmentCmsgBytes)
