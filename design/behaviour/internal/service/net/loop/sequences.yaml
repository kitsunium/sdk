      - id: wg.Done
        kind: value
      - id: runtime
        kind: stdlib
      - id: syscall
        kind: stdlib
      - id: threadCheck
        kind: internal
      - id: el.setup
        kind: internal
      - id: el.teardown
        kind: internal
      - id: el.wait
        kind: internal
      - id: time
        kind: stdlib
      - id: lp.now
        kind: internal
      - id: el.handle
        kind: internal
      - id: el.control
        kind: internal
      - id: el.r.wheel.advance
        kind: internal
      - id: el.pace
        kind: internal
      - id: lp.h.OnBatchEnd
        kind: value
      - id: lp.endBatch
        kind: internal
      - id: el.closeAll
        kind: internal
    steps:
      - defer: wg.Done()
        to: wg.Done
      - eval: runtime.LockOSThread()
        to: runtime
      - set: el.tid
        to: syscall
        value: syscall.Gettid()
      - set: el.lp.threadOK
        to: threadCheck
        value: threadCheck(el.tid)
      - opt:
          do:
            - eval: el.teardown()
              to: el.teardown
            - send:
                chan: ready
                value: err
            - return: ""
          init:
            bind: err
            eval: el.setup()
            to: el.setup
          when: err != nil
      - send:
          chan: ready
          value: nil
      - bind: lp
        eval: el.lp
      - loop:
          do:
            - bind: "n"
              eval: el.wait()
              to: el.wait
            - bind: started
              eval: time.Now()
              to: time
            - set: lp.tick
              to: lp.now
              value: lp.now()
            - eval: el.handle(n)
              to: el.handle
            - eval: el.control()
              to: el.control
            - eval: el.r.wheel.advance(lp.tick, el.r.expire)
              to: el.r.wheel.advance
            - eval: el.pace()
              to: el.pace
            - eval: lp.h.OnBatchEnd(lp)
              to: lp.h.OnBatchEnd
            - eval: lp.endBatch(started)
              to: lp.endBatch
            - set: el.off
              value: "0"
            - opt:
                do:
                  - break: true
                when: el.stopReq.Load() || (lp.draining && el.r.live == 0 && el.queuesTaken())
          forever: true
      - eval: el.closeAll()
        to: el.closeAll
      - eval: el.teardown()
        to: el.teardown
  - of: (*epollLoop).wait
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).wait
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: timeout
        eval: int(tickEvery / time.Millisecond)
      - opt:
          do:
            - set: timeout
              value: "-1"
          when: el.r.live == 0 && el.armed && !el.lp.draining
      - bind: n, err
        eval: syscall.EpollWait(el.epfd, el.events, timeout)
        to: syscall
      - opt:
          do:
            - return: "0"
          when: err != nil
      - op: +=
        set: el.r.st.completions
        value: uint64(n)
      - return: "n"
  - of: (*epollLoop).handle
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).handle
        kind: self
      - id: el.drainWake
        kind: internal
      - id: el.accept
        kind: internal
      - id: el.conn
        kind: internal
    steps:
      - loop:
          do:
            - bind: ev
              eval: "&el.events[i]"
            - switch:
                cases:
                  - case: ev.Fd == tagWake
                    do:
                      - eval: el.drainWake()
                        to: el.drainWake
                  - case: ev.Fd <= tagListen
                    do:
                      - eval: el.accept(el.lfds[tagListen-ev.Fd])
                        to: el.accept
                  - default: true
                    do:
                      - eval: el.conn(ev.Fd, uint32(ev.Pad), ev.Events)
                        to: el.conn
          key: i
          range: "n"
  - of: (*epollLoop).drainWake
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).drainWake
        kind: self
      - id: syscall
        kind: stdlib
      - id: swallowErr
        kind: internal
      - id: el.lp.post.drain
        kind: internal
    steps:
      - var:
          name: buf
          type: "[8]byte"
      - bind: _, _, errno
        eval: syscall.RawSyscall(syscall.SYS_READ, uintptr(el.evfd), uintptr(unsafe.Pointer(&buf[0])), 8)
        to: syscall
      - eval: swallowErr(errno)
        to: swallowErr
      - opt:
          do:
            - panic: "\"net/loop: Post consumer off its loop's thread\""
          when: el.lp.threadOK != nil && !el.lp.threadOK()
      - eval: el.lp.post.drain(el.lp)
        to: el.lp.post.drain
  - of: (*epollLoop).accept
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).accept
        kind: self
      - id: syscall
        kind: stdlib
      - id: el.admit
        kind: internal
    steps:
      - loop:
          do:
            - bind: nfd, _, err
              eval: syscall.Accept4(lfd, syscall.SOCK_NONBLOCK|syscall.SOCK_CLOEXEC)
              to: syscall
            - opt:
                do:
                  - opt:
                      do:
                        - return: ""
                      when: el.acceptFailed(err)
                  - continue: true
                when: err != nil
            - eval: el.admit(nfd)
              to: el.admit
          range: epollAcceptBurst
  - of: (*epollLoop).acceptFailed
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).acceptFailed
        kind: self
      - id: el.pause
        kind: internal
    steps:
      - switch:
          cases:
            - case: syscall.EAGAIN
              do:
                - return: "true"
            - case: syscall.EMFILE, syscall.ENFILE
              do:
                - eval: el.pause()
                  to: el.pause
                - return: "true"
            - case: syscall.ECONNABORTED, syscall.EINTR
              do:
                - return: "false"
            - default: true
              do:
                - return: "true"
          "on": err
  - of: (*epollLoop).admit
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).admit
        kind: self
      - id: el.reject
        kind: internal
      - id: rg.take
        kind: internal
      - id: el.ctl
        kind: internal
      - id: rg.abandon
        kind: internal
      - id: swallowErr
        kind: internal
      - id: rg.opened
        kind: internal
    steps:
      - bind: lp, rg
        eval: el.lp, el.r
      - opt:
          do:
            - eval: el.reject(nfd)
              to: el.reject
            - return: ""
          init:
            bind: m
            eval: lp.sz.maxConns
          when: m > 0 && lp.grp.live.Load() >= int64(m)
      - bind: slot, ok
        eval: rg.take(int32(nfd))
        to: rg.take
      - opt:
          do:
            - eval: el.reject(nfd)
              to: el.reject
            - return: ""
          when: "!ok"
      - opt:
          do:
            - eval: rg.abandon(slot)
              to: rg.abandon
            - eval: swallowErr(syscall.Close(nfd))
              to: swallowErr
            - return: ""
          init:
            bind: err
            eval: el.ctl(syscall.EPOLL_CTL_ADD, nfd, connEvents, slot, rg.conns[slot].gen)
            to: el.ctl
          when: err != nil
      - set: el.backoff
        value: backoffMin
      - eval: rg.opened(slot)
        to: rg.opened
  - of: (*epollLoop).reject
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).reject
        kind: self
      - id: swallowErr
        kind: internal
      - id: el.lp.grp.rejected.Add
        kind: value
    steps:
      - eval: swallowErr(syscall.Close(nfd))
        to: swallowErr
      - eval: el.lp.grp.rejected.Add(1)
        to: el.lp.grp.rejected.Add
      - set: el.lp.hard
        value: "true"
  - of: (*epollLoop).pause
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).pause
        kind: self
      - id: el.disarmListeners
        kind: internal
    steps:
      - eval: el.disarmListeners()
        to: el.disarmListeners
      - set: el.rearmAt
        value: el.lp.tick + el.backoff
      - set: el.backoff
        value: min(el.backoff*2, backoffMax)
      - set: el.lp.hard
        value: "true"
      - op: ++
        set: el.r.st.pauses
  - of: (*epollLoop).pace
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).pace
        kind: self
      - id: el.armListeners
        kind: internal
      - id: el.r.evict
        kind: internal
    steps:
      - bind: lp
        eval: el.lp
      - opt:
          do:
            - eval: el.armListeners()
              to: el.armListeners
          when: "!el.armed && !lp.draining && lp.tick >= el.rearmAt"
      - opt:
          do:
            - eval: el.r.evict()
              to: el.r.evict
            - opt:
                do:
                  - set: lp.hard
                    value: "false"
                when: el.armed && (lp.sz.maxConns == 0 || lp.grp.live.Load() < int64(lp.sz.maxConns))
          when: lp.hard
  - of: (*epollLoop).conn
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).conn
        kind: self
      - id: el.writable
        kind: internal
      - id: el.readable
        kind: internal
    steps:
      - bind: r
        eval: el.r
      - opt:
          do:
            - return: ""
          when: int(slot) >= len(r.conns) || r.conns[slot].gen != gen
      - opt:
          do:
            - eval: el.writable(slot)
              to: el.writable
          when: events&syscall.EPOLLOUT != 0 && r.conns[slot].state != stDead
      - eval: el.readable(slot, events)
        to: el.readable
  - of: (*epollLoop).writable
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).writable
        kind: self
      - id: el.flush
        kind: internal
      - id: swallowErr
        kind: internal
    steps:
      - bind: r
        eval: el.r
      - op: "&^="
        set: r.conns[slot].flags
        value: fSending
      - eval: el.flush(r, slot)
        to: el.flush
      - bind: c
        eval: "&r.conns[slot]"
      - opt:
          do:
            - eval: swallowErr(el.ctl(syscall.EPOLL_CTL_MOD, int(c.fd), el.outEvents(c), slot, c.gen))
              to: swallowErr
          when: c.state != stDead && c.flags&fSending == 0
  - of: (*epollLoop).readable
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).readable
        kind: self
      - id: el.read
        kind: internal
      - id: r.fail
        kind: internal
    steps:
      - bind: r
        eval: el.r
      - bind: c
        eval: "&r.conns[slot]"
      - opt:
          do:
            - eval: el.read(slot)
              to: el.read
            - return: ""
          when: events&(syscall.EPOLLIN|syscall.EPOLLRDHUP|syscall.EPOLLHUP|syscall.EPOLLERR) != 0 && c.state == stOpen && c.flags&fPeerDone == 0
      - opt:
          do:
            - eval: r.fail(slot, rErrno, int32(syscall.ECONNRESET))
              to: r.fail
          when: events&(syscall.EPOLLHUP|syscall.EPOLLERR) != 0 && (c.state == stOpen || c.state == stClosing)
  - of: (*epollLoop).read
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).read
        kind: self
      - id: el.readBuf
        kind: internal
      - id: syscall
        kind: stdlib
      - id: el.received
        kind: internal
      - id: swallowErr
        kind: internal
      - id: r.markDirty
        kind: internal
      - id: r.fail
        kind: internal
    steps:
      - bind: buf, inSpill, ok
        eval: el.readBuf(slot)
        to: el.readBuf
      - opt:
          do:
            - return: ""
          when: "!ok"
      - bind: r
        eval: el.r
      - bind: c
        eval: "&r.conns[slot]"
      - bind: n, err
        eval: syscall.Read(int(c.fd), buf)
        to: syscall
      - switch:
          cases:
            - case: n > 0
              do:
                - eval: el.received(slot, buf[:n], inSpill)
                  to: el.received
            - case: n == 0 && err == nil
              do:
                - op: "|="
                  set: c.flags
                  value: fPeerDone
                - eval: swallowErr(el.ctl(syscall.EPOLL_CTL_MOD, int(c.fd), el.outEvents(c), slot, c.gen))
                  to: swallowErr
                - eval: r.markDirty(slot)
                  to: r.markDirty
            - case: err == syscall.EAGAIN || err == syscall.EINTR
            - default: true
              do:
                - eval: r.fail(slot, rErrno, errnoOf(err))
                  to: r.fail
  - of: (*epollLoop).readBuf
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).readBuf
        kind: self
      - id: r.spillRoom
        kind: internal
      - id: r.fail
        kind: internal
    steps:
      - bind: r
        eval: el.r
      - opt:
          do:
            - set: buf
              to: r.spillRoom
              value: r.spillRoom(slot, readChunk)
            - opt:
                do:
                  - eval: r.fail(slot, rSpill, 0)
                    to: r.fail
                  - return: nil, true, false
                when: buf == nil
            - return: buf, true, true
          when: r.hasSpill(slot)
      - opt:
          do:
            - return: nil, false, false
          when: len(el.arena)-el.off < minRead
      - return: el.arena[el.off:min(len(el.arena), el.off+readChunk)], false, true
  - of: (*epollLoop).received
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).received
        kind: self
      - id: el.r.deliverSpill
        kind: internal
      - id: el.r.deliver
        kind: internal
    steps:
      - alt:
          - do:
              - eval: el.r.deliverSpill(slot, len(data))
                to: el.r.deliverSpill
            when: inSpill
          - do:
              - op: +=
                set: el.off
                value: len(data)
              - eval: el.r.deliver(slot, data)
                to: el.r.deliver
            else: true
  - of: (*epollLoop).outEvents
    steps:
      - var:
          name: ev
          type: uint32
      - opt:
          do:
            - op: "|="
              set: ev
              value: connEvents
          when: c.state == stOpen && c.flags&fPeerDone == 0
      - opt:
          do:
            - op: "|="
              set: ev
              value: syscall.EPOLLOUT
          when: c.flags&fSending != 0
      - return: ev
  - of: (*epollLoop).flush
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).flush
        kind: self
      - id: lp.slab.data
        kind: internal
      - id: syscall
        kind: stdlib
      - id: lp.slab.free
        kind: internal
      - id: r.sent
        kind: internal
      - id: swallowErr
        kind: internal
      - id: r.fail
        kind: internal
    steps:
      - bind: lp
        eval: el.lp
      - loop:
          do:
            - bind: c
              eval: "&r.conns[slot]"
            - opt:
                do:
                  - return: ""
                when: c.flags&fSending != 0
            - bind: data
              eval: lp.slab.data(c.out)
              to: lp.slab.data
            - opt:
                do:
                  - return: ""
                when: len(data) == 0
            - bind: n, err
              eval: syscall.Write(int(c.fd), data)
              to: syscall
            - switch:
                cases:
                  - case: n > 0
                    do:
                      - op: +=
                        set: c.out.off
                        value: int32(n)
                      - opt:
                          do:
                            - eval: lp.slab.free(c.out)
                              to: lp.slab.free
                            - set: c.out
                              value: "chunkRef{idx: noChunk}"
                          when: c.out.off == c.out.len
                      - eval: r.sent(slot, n)
                        to: r.sent
                  - case: err == syscall.EAGAIN
                    do:
                      - op: "|="
                        set: c.flags
                        value: fSending
                      - eval: swallowErr(el.ctl(syscall.EPOLL_CTL_MOD, int(c.fd), el.outEvents(c), slot, c.gen))
                        to: swallowErr
                      - return: ""
                  - case: err == syscall.EINTR
                  - default: true
                    do:
                      - eval: r.fail(slot, rErrno, errnoOf(err))
                        to: r.fail
                      - return: ""
          forever: true
  - of: (*epollLoop).shutdown
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).shutdown
        kind: self
      - id: swallowErr
        kind: internal
      - id: r.release
        kind: internal
      - id: el.armListeners
        kind: internal
    steps:
      - bind: fd
        eval: int(r.conns[slot].fd)
      - eval: swallowErr(syscall.EpollCtl(el.epfd, syscall.EPOLL_CTL_DEL, fd, nil))
        to: swallowErr
      - eval: swallowErr(syscall.Close(fd))
        to: swallowErr
      - eval: r.release(slot)
        to: r.release
      - opt:
          do:
            - eval: el.armListeners()
              to: el.armListeners
          when: "!el.armed && !el.lp.draining"
  - of: (*epollLoop).unread
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).unread
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - var:
          name: "n"
          type: int32
      - bind: _, _, errno
        eval: syscall.Syscall(syscall.SYS_IOCTL, uintptr(r.conns[slot].fd), siocinq, uintptr(unsafe.Pointer(&n)))
        to: syscall
      - return: errno != 0 || n > 0
  - of: (*epollLoop).control
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).control
        kind: self
      - id: el.disarmListeners
        kind: internal
      - id: el.takeQueues
        kind: internal
      - id: r.markDirty
        kind: internal
    steps:
      - bind: lp, r
        eval: el.lp, el.r
      - opt:
          do:
            - set: lp.draining
              value: "true"
            - set: r.draining
              value: "true"
            - eval: el.disarmListeners()
              to: el.disarmListeners
            - eval: el.takeQueues()
              to: el.takeQueues
          when: el.drainReq.Load() && !lp.draining
      - opt:
          do:
            - loop:
                cond: s != noLink
                do:
                  - bind: c
                    eval: "&r.conns[s]"
                  - bind: nxt
                    eval: c.lruNext
                  - opt:
                      do:
                        - set: c.state, c.reason
                          value: stClosing, rDrain
                        - eval: r.markDirty(s)
                          to: r.markDirty
                      when: r.drainable(c)
                  - set: s
                    value: nxt
                init: s := r.lruHead
          when: lp.draining
  - of: (*epollLoop).takeQueues
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).takeQueues
        kind: self
      - id: el.set.handBack
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - set: el.queueDone[i]
                    value: "true"
                  - eval: el.set.handBack(i)
                    to: el.set.handBack
                when: "!el.queueDone[i] && el.takeQueue(i, fd)"
          key: i
          range: el.lfds
          value: fd
  - of: (*epollLoop).queuesTaken
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).queuesTaken
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - return: "!slices.Contains(el.queueDone, false)"
        to: slices
  - of: (*epollLoop).takeQueue
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).takeQueue
        kind: self
      - id: syscall
        kind: stdlib
      - id: el.admit
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: el.taken[i] >= queueTakeMax
                when: el.taken[i] >= queueTakeMax || el.r.full()
            - bind: nfd, _, err
              eval: syscall.Accept4(lfd, syscall.SOCK_NONBLOCK|syscall.SOCK_CLOEXEC)
              to: syscall
            - opt:
                do:
                  - switch:
                      cases:
                        - case: takeOver
                          do:
                            - return: "true"
                        - case: takeLater
                          do:
                            - return: "false"
                        - case: takeNext
                          do:
                            - continue: true
                      "on": takeAfter(err)
                when: err != nil
            - op: ++
              set: el.taken[i]
            - eval: el.admit(nfd)
              to: el.admit
          range: queueTakeBatch
      - return: "false"
  - of: (*epollLoop).closeAll
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).closeAll
        kind: self
      - id: r.fail
        kind: internal
      - id: r.publish
        kind: internal
    steps:
      - bind: r
        eval: el.r
      - loop:
          cond: r.lruHead != noLink
          do:
            - eval: r.fail(r.lruHead, rDrain, 0)
              to: r.fail
      - eval: r.publish()
        to: r.publish
  - of: (*epollLoop).teardown
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).teardown
        kind: self
      - id: lp.post.close
        kind: internal
      - id: el.disarmListeners
        kind: internal
      - id: el.wakeMu.Lock
        kind: value
      - id: closeFDs
        kind: internal
      - id: el.wakeMu.Unlock
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - bind: lp
        eval: el.lp
      - opt:
          do:
            - eval: lp.post.close()
              to: lp.post.close
          when: lp.post != nil
      - eval: el.disarmListeners()
        to: el.disarmListeners
      - eval: el.wakeMu.Lock()
        to: el.wakeMu.Lock
      - eval: closeFDs([]int{el.epfd, el.evfd})
        to: closeFDs
      - set: el.evClosed
        value: "true"
      - eval: el.wakeMu.Unlock()
        to: el.wakeMu.Unlock
      - opt:
          do:
            - eval: swallowErr(syscall.Munmap(el.arena))
              to: swallowErr
          when: el.arena != nil
      - loop:
          do:
            - eval: swallowErr(syscall.Munmap(m))
              to: swallowErr
          key: _
          range: lp.slab.mapped
          value: m
      - set: lp.slab.mapped
        value: nil
  - of: errnoOf
    steps:
      - opt:
          do:
            - return: int32(e)
          init:
            bind: e, ok
            eval: err.(syscall.Errno)
          when: ok
      - return: int32(syscall.EIO)
  - of: Start
    participants:
      - id: caller
        kind: actor
      - id: Start
        kind: self
      - id: descriptorLimit
        kind: internal
      - id: resolve
        kind: internal
      - id: closeListeners
        kind: internal
      - id: CheckCapabilities
        kind: internal
      - id: startNative
        kind: internal
      - id: fmt
        kind: stdlib
      - id: swallowErr
        kind: internal
    steps:
      - bind: rlimit
        eval: descriptorLimit()
        to: descriptorLimit
      - bind: sz, err
        eval: resolve(cfg.Value, cfg.MaxConns, rlimit)
        to: resolve
      - opt:
          do:
            - eval: closeListeners(cfg.Listeners)
              to: closeListeners
            - return: nil, err
          when: err != nil
      - opt:
          do:
            - eval: closeListeners(cfg.Listeners)
              to: closeListeners
            - return: nil, errs.Wrap(corenet.HandlerMissing, errs.WrapParams{}, errs.String("group", cfg.Group))
          when: cfg.Handler == nil
      - opt:
          do:
            - eval: closeListeners(cfg.Listeners)
              to: closeListeners
            - return: nil, err
          init:
            bind: err
            eval: CheckCapabilities(cfg.Group, cfg.Value)
            to: CheckCapabilities
          when: err != nil
      - opt:
          do:
            - set: sz.loopsSource
              value: cfg.LoopsSource
          when: cfg.LoopsSource != ""
      - opt:
          do:
            - set: sz.tableSize
              value: cfg.tableCap
          when: cfg.tableCap > 0
      - bind: g
        eval: "&Group{name: cfg.Group, sz: sz, grp: &shared{}, procs: runtime.GOMAXPROCS(0)}"
      - opt:
          do:
            - eval: closeListeners(cfg.Listeners)
              to: closeListeners
            - return: nil, err
          init:
            bind: err
            eval: startNative(g, &cfg)
            to: startNative
          when: err != nil
      - bind: w
        eval: cfg.Log
      - opt:
          do:
            - set: w
              value: os.Stderr
          when: w == nil
      - bind: _, werr
        eval: |-
          fmt.Fprintf(w, "net/loop: group=%q backend=%s probe=%s reason=%q loops=%d loops_source=%s rings=%d rings_source=%s table=%d cq_batch=%d spill_cap=%d output_cap=%d rlimit_nofile=%d gomaxprocs=%d\n",
          		g.name, g.backend, g.stage, g.reason, sz.loops, sz.loopsSource, sz.rings, sz.ringsSource, sz.tableSize, sz.cqBatch, sz.spillCap, sz.outputCap, sz.rlimit, g.procs)
        to: fmt
      - eval: swallowErr(werr)
        to: swallowErr
      - return: g, nil
  - of: (*Group).Shutdown
    participants:
      - id: caller
        kind: actor
      - id: (*Group).Shutdown
        kind: self
      - id: g.ctl.drain
        kind: internal
      - id: g.ctl.stop
        kind: internal
      - id: g.ctl.wait
        kind: internal
      - id: errs
        kind: package
    steps:
      - eval: g.ctl.drain()
        to: g.ctl.drain
      - select:
          cases:
            - comm: <-g.ctl.done()
              do:
                - return: nil
            - comm: <-ctx.Done()
              do:
                - eval: g.ctl.stop()
                  to: g.ctl.stop
                - eval: g.ctl.wait()
                  to: g.ctl.wait
                - return: errs.Wrap(corenet.DrainTimeout, errs.WrapParams{}, errs.String("group", g.name))
                  to: errs
  - of: (*Group).Close
    participants:
      - id: caller
        kind: actor
      - id: (*Group).Close
        kind: self
      - id: g.once.Do
        kind: value
    steps:
      - eval: |-
          g.once.Do(func() {
          		g.ctl.stop()
          		g.ctl.wait()
          	})
        to: g.once.Do
      - return: nil
  - of: (*Group).State
    steps:
      - bind: st
        eval: |-
          corenet.LoopStateValue{
          		Group: g.name, Backend: g.backend, ProbeStage: g.stage,
          		Degraded: g.reason != "", DegradedReason: g.reason,
          		Loops: g.sz.loops, LoopsSource: g.sz.loopsSource, Rings: g.sz.rings, RingsSource: g.sz.ringsSource,
          		RLimitNoFile: g.sz.rlimit, GOMAXPROCS: g.procs,
          		BatchP99:     corenet.DurationValue(g.grp.batchP99()),
          		Capabilities: slices.Clone(g.caps.rows),
          	}
      - loop:
          do:
            - loop:
                do:
                  - bind: p
                    eval: r.pub
                  - set: st.RingStates
                    value: |-
                      append(st.RingStates, corenet.LoopRingStateValue{
                      				Loop: lp.index, Ring: r.index, Conns: p.conns.Load(),
                      				Accepted: p.accepted.Load(), Closed: p.closed.Load(),
                      				Batches: p.batches.Load(), Completions: p.completions.Load(),
                      				BufferStarved: p.starved.Load(), EnterRetries: p.retries.Load(),
                      				AcceptPauses: p.pauses.Load(), Evicted: p.evicted.Load(),
                      				WatchdogFires: p.watchdog.Load(), Draining: p.draining.Load(),
                      			})
                key: _
                range: lp.rings
                value: r
          key: _
          range: g.loops
          value: lp
      - return: st
  - of: (*Group).Rejected
    participants:
      - id: caller
        kind: actor
      - id: (*Group).Rejected
        kind: self
      - id: g.grp.rejected.Load
        kind: value
    steps:
      - return: g.grp.rejected.Load()
        to: g.grp.rejected.Load
  - of: (*Group).Live
    participants:
      - id: caller
        kind: actor
      - id: (*Group).Live
        kind: self
      - id: g.grp.live.Load
        kind: value
    steps:
      - return: g.grp.live.Load()
        to: g.grp.live.Load
  - of: newLoop
    participants:
      - id: caller
        kind: actor
      - id: newLoop
        kind: self
      - id: time
        kind: stdlib
      - id: newSlab
        kind: internal
    steps:
      - bind: lp
        eval: |-
          &loop{
          		index: i, sz: g.sz, h: cfg.Handler, grp: g.grp,
          		epoch:    time.Now(),
          		lowWater: g.sz.outputCap / lowWaterDiv,
          	}
      - opt:
          do:
            - set: lp.idle
              value: int64((cfg.IdleTimeout + tickEvery - 1) / tickEvery)
          when: cfg.IdleTimeout > 0
      - opt:
          do:
            - set: lp.evictIdle
              value: int64((d + tickEvery - 1) / tickEvery)
          init:
            bind: d
            eval: time.Duration(cfg.Value.EvictIdle)
            to: time
          when: d > 0
      - set: lp.slab
        to: newSlab
        value: newSlab(max(g.sz.outputCap, g.sz.spillCap), defaultSlabBudget, mapper)
      - set: lp.tick
        value: "1"
      - return: lp
  - of: swallowErr
    steps:
      - opt:
          do:
            - return: ""
          when: err == nil
  - of: startNative
    participants:
      - id: caller
        kind: actor
      - id: startNative
        kind: self
      - id: startEpoll
        kind: internal
      - id: startIOURing
        kind: internal
      - id: errs
        kind: package
    steps:
      - switch:
          cases:
            - case: corenet.LoopBackendAuto
              do:
                - opt:
                    do:
                      - set: g.stage
                        value: "\"epoll\""
                      - return: startEpoll(g, cfg)
                        to: startEpoll
                    when: slices.Contains(cfg.Disabled, corenet.CapabilityURingPbuf)
                - bind: err
                  eval: startIOURing(g, cfg, cfg.hooks)
                  to: startIOURing
                - opt:
                    do:
                      - return: nil
                    when: err == nil
                - set: g.stage
                  value: "\"epoll\""
                - set: g.reason
                  value: "\"io_uring unavailable: \" + err.Error()"
                - return: startEpoll(g, cfg)
                  to: startEpoll
            - case: corenet.LoopBackendIOURing
              do:
                - return: startIOURing(g, cfg, cfg.hooks)
                  to: startIOURing
            - case: corenet.LoopBackendEpoll
              do:
                - set: g.stage
                  value: "\"epoll\""
                - return: startEpoll(g, cfg)
                  to: startEpoll
            - default: true
              do:
                - return: |-
                    errs.Wrap(corenet.LoopBackendUnavailable, errs.WrapParams{},
                    			errs.String("group", cfg.Group), errs.String("backend", cfg.Value.Backend.String()),
                    			errs.String("reason", "not a backend of the leaf"))
                  to: errs
          "on": cfg.Value.Backend
  - of: noDelay
    participants:
      - id: caller
        kind: actor
      - id: noDelay
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: sw.disabled(corenet.CapabilityTCPNoDelay)
      - eval: swallowErr(syscall.SetsockoptInt(fd, syscall.IPPROTO_TCP, syscall.TCP_NODELAY, 1))
        to: swallowErr
  - of: descriptorLimit
    participants:
      - id: caller
        kind: actor
      - id: descriptorLimit
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - var:
          name: lim
          type: syscall.Rlimit
      - opt:
          do:
            - return: "0"
          init:
            bind: err
            eval: syscall.Getrlimit(syscall.RLIMIT_NOFILE, &lim)
            to: syscall
          when: err != nil
      - return: lim.Cur
  - of: mmapAnon
    participants:
      - id: caller
        kind: actor
      - id: mmapAnon
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - return: syscall.Mmap(-1, 0, n, syscall.PROT_READ|syscall.PROT_WRITE, syscall.MAP_PRIVATE|syscall.MAP_ANONYMOUS)
        to: syscall
  - of: closeFDs
    participants:
      - id: caller
        kind: actor
      - id: closeFDs
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - eval: swallowErr(syscall.Close(fd))
                    to: swallowErr
                when: fd >= 0
          key: _
          range: fds
          value: fd
  - of: closeListeners
    participants:
      - id: caller
        kind: actor
      - id: closeListeners
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - loop:
          do:
            - eval: swallowErr(syscall.Close(l.FD))
              to: swallowErr
          key: _
          range: ls
          value: l
  - of: unavailable
    participants:
      - id: caller
        kind: actor
      - id: unavailable
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(corenet.LoopBackendUnavailable, errs.WrapParams{},
          		errs.String("stage", step), errs.String("reason", err.Error()))
        to: errs
  - of: newPostQueue
    steps:
      - return: |-
          &postQueue{
          		ops:  make([]corenet.PostFunc, postQueueCap),
          		args: make([]uintptr, postQueueCap),
          		wake: wake,
          	}
  - of: (*postQueue).post
    participants:
      - id: caller
        kind: actor
      - id: (*postQueue).post
        kind: self
      - id: q.mu.Lock
        kind: value
      - id: q.mu.Unlock
        kind: value
    steps:
      - eval: q.mu.Lock()
        to: q.mu.Lock
      - opt:
          do:
            - eval: q.mu.Unlock()
              to: q.mu.Unlock
            - return: corenet.ServerClosed
          when: q.closed
      - opt:
          do:
            - eval: q.mu.Unlock()
              to: q.mu.Unlock
            - return: corenet.LoopPostQueueFull
          when: q.n == len(q.ops)
      - bind: i
        eval: (q.head + q.n) % len(q.ops)
      - set: q.ops[i], q.args[i]
        value: op, arg
      - op: ++
        set: q.n
      - eval: q.mu.Unlock()
        to: q.mu.Unlock
      - opt:
          do:
            - eval: q.wake()
          when: q.pending.CompareAndSwap(false, true)
      - return: nil
  - of: (*postQueue).drain
    participants:
      - id: caller
        kind: actor
      - id: (*postQueue).drain
        kind: self
      - id: q.pending.Store
        kind: value
      - id: q.mu.Lock
        kind: value
      - id: q.mu.Unlock
        kind: value
    steps:
      - eval: q.pending.Store(false)
        to: q.pending.Store
      - bind: ran
        eval: "0"
      - loop:
          do:
            - eval: q.mu.Lock()
              to: q.mu.Lock
            - opt:
                do:
                  - eval: q.mu.Unlock()
                    to: q.mu.Unlock
                  - return: ran
                when: q.n == 0
            - bind: op, arg
              eval: q.ops[q.head], q.args[q.head]
            - set: q.ops[q.head]
              value: nil
            - set: q.head
              value: (q.head + 1) % len(q.ops)
            - op: "--"
              set: q.n
            - eval: q.mu.Unlock()
              to: q.mu.Unlock
            - eval: op(io, arg)
            - op: ++
              set: ran
          forever: true
  - of: (*postQueue).close
    participants:
      - id: caller
        kind: actor
      - id: (*postQueue).close
        kind: self
      - id: q.mu.Lock
        kind: value
      - id: q.mu.Unlock
        kind: value
    steps:
      - eval: q.mu.Lock()
        to: q.mu.Lock
      - set: q.closed
        value: "true"
      - eval: q.mu.Unlock()
        to: q.mu.Unlock
  - of: resolve
    participants:
      - id: caller
        kind: actor
      - id: resolve
        kind: self
      - id: ResolveLoops
        kind: internal
      - id: ringCount
        kind: internal
    steps:
      - opt:
          do:
            - return: sizing{}, errs.Wrap(corenet.LoopNoDescriptors, errs.WrapParams{})
          when: rlimit == 0
      - bind: table
        eval: min(rlimit, ioringMaxFixedFiles)
      - bind: sz
        eval: |-
          sizing{
          		cqBatch:   orDefault(v.CQBatch, defaultCQBatch),
          		spillCap:  orDefault(v.SpillCap, defaultSpillCap),
          		outputCap: orDefault(v.OutputCap, defaultOutputCap),
          		softConns: max(v.SoftConns, 0),
          		maxConns:  max(maxConns, 0),
          		rlimit:    rlimit,
          		tableSize: int(table),
          	}
      - set: sz.loops, sz.loopsSource
        to: ResolveLoops
        value: ResolveLoops(v.Loops)
      - set: sz.rings, sz.ringsSource
        to: ringCount
        value: ringCount(v.Rings, max(sz.maxConns, sz.softConns), table)
      - return: sz, nil
  - of: ringCount
    steps:
      - opt:
          do:
            - return: explicit, ringsExplicit
          when: explicit > 0
      - opt:
          do:
            - return: 1, ringsSingle
          when: target <= 0
      - bind: "n"
        eval: (uint64(target) + table - 1) / table
      - opt:
          do:
            - return: 1, ringsSingle
          when: n <= 1
      - return: int(n), ringsDerived
  - of: ResolveLoops
    steps:
      - switch:
          cases:
            - case: n == corenet.LoopsAuto
              do:
                - return: max(runtime.GOMAXPROCS(0), 1), loopsAuto
            - case: n > 0
              do:
                - return: n, loopsExplicit
            - default: true
              do:
                - return: 1, loopsSingle
  - of: orDefault
    steps:
      - opt:
          do:
            - return: def
          when: v <= 0
      - return: v
  - of: chunkRef.empty
    steps:
      - return: c.idx == noChunk
  - of: newSlab
    participants:
      - id: caller
        kind: actor
      - id: newSlab
        kind: self
      - id: classOf
        kind: internal
    steps:
      - bind: top
        eval: classOf(maxChunk)
        to: classOf
      - bind: s
        eval: "&slab{budget: budget, mapper: mapper, classes: make([]slabClass, int(top)+1)}"
      - loop:
          do:
            - bind: size
              eval: 1 << (minClassShift + uint(i))
            - set: s.classes[i]
              value: "slabClass{size: size, perArena: max(arenaBytes/size, 1)}"
          key: i
          range: s.classes
      - return: s
  - of: classOf
    steps:
      - opt:
          do:
            - return: "0"
          when: n <= 1<<minClassShift
      - return: uint8(uint(bits.Len(uint(n-1))) - minClassShift)
  - of: (*slab).alloc
    participants:
      - id: caller
        kind: actor
      - id: (*slab).alloc
        kind: self
      - id: classOf
        kind: internal
    steps:
      - bind: cls
        eval: classOf(n)
        to: classOf
      - opt:
          do:
            - return: "chunkRef{idx: noChunk}, false"
          when: int(cls) >= len(s.classes)
      - bind: c
        eval: "&s.classes[cls]"
      - opt:
          do:
            - return: "chunkRef{idx: noChunk}, false"
          when: s.inUse+c.size > s.budget || (len(c.free) == 0 && !s.grow(c))
      - bind: idx
        eval: c.free[len(c.free)-1]
      - set: c.free
        value: c.free[:len(c.free)-1]
      - op: +=
        set: s.inUse
        value: c.size
      - return: "chunkRef{idx: idx, cls: cls}, true"
  - of: (*slab).grow
    steps:
      - bind: mem, err
        eval: s.mapper(c.size * c.perArena)
      - opt:
          do:
            - return: "false"
          when: err != nil
      - set: s.mapped
        value: append(s.mapped, mem)
      - bind: base
        eval: int32(len(c.arenas) * c.perArena)
      - set: c.arenas
        value: append(c.arenas, mem)
      - loop:
          cond: i >= 0
          do:
            - set: c.free
              value: append(c.free, base+i)
          init: i := int32(c.perArena) - 1
          post: i--
      - return: "true"
  - of: (*slab).free
    steps:
      - opt:
          do:
            - return: ""
          when: r.empty()
      - bind: c
        eval: "&s.classes[r.cls]"
      - set: c.free
        value: append(c.free, r.idx)
      - op: "-="
        set: s.inUse
        value: c.size
  - of: (*slab).bytes
    steps:
      - bind: c
        eval: "&s.classes[r.cls]"
      - bind: a
        eval: int(r.idx) / c.perArena
      - bind: o
        eval: (int(r.idx) % c.perArena) * c.size
      - return: "c.arenas[a][o : o+c.size : o+c.size]"
  - of: (*slab).data
    steps:
      - opt:
          do:
            - return: nil
          when: r.empty()
      - return: s.bytes(r)[r.off:r.len]
  - of: (*slab).size
    steps:
      - return: s.classes[r.cls].size
  - of: (*shared).observe
    participants:
      - id: caller
        kind: actor
      - id: (*shared).observe
        kind: self
      - id: bits
        kind: stdlib
      - id: g.hist[min(i, batchBuckets-1)].Add
        kind: value
    steps:
      - bind: i
        eval: bits.Len64(uint64(max(d, 0)))
        to: bits
      - eval: g.hist[min(i, batchBuckets-1)].Add(1)
        to: g.hist[min(i, batchBuckets-1)].Add
  - of: (*shared).batchP99
    participants:
      - id: caller
        kind: actor
      - id: (*shared).batchP99
        kind: self
      - id: g.hist[i].Load
        kind: value
      - id: time
        kind: stdlib
    steps:
      - var:
          name: counts
          type: "[batchBuckets]uint64"
      - var:
          name: total
          type: uint64
      - loop:
          do:
            - set: counts[i]
              to: g.hist[i].Load
              value: g.hist[i].Load()
            - op: +=
              set: total
              value: counts[i]
          key: i
          range: counts
      - opt:
          do:
            - return: "0"
          when: total == 0
      - bind: want
        eval: total - total/100
      - var:
          name: seen
          type: uint64
      - loop:
          do:
            - op: +=
              set: seen
              value: "n"
            - opt:
                do:
                  - return: time.Duration(uint64(1) << uint(i))
                    to: time
                when: seen >= want
          key: i
          range: counts
          value: "n"
      - return: time.Duration(uint64(1) << uint(batchBuckets-1))
        to: time
  - of: (*ring).publish
    participants:
      - id: caller
        kind: actor
      - id: (*ring).publish
        kind: self
      - id: p.conns.Store
        kind: value
      - id: p.accepted.Store
        kind: value
      - id: p.closed.Store
        kind: value
      - id: p.batches.Store
        kind: value
      - id: p.completions.Store
        kind: value
      - id: p.starved.Store
        kind: value
      - id: p.retries.Store
        kind: value
      - id: p.pauses.Store
        kind: value
      - id: p.evicted.Store
        kind: value
      - id: p.watchdog.Store
        kind: value
      - id: p.draining.Store
        kind: value
    steps:
      - bind: p, s
        eval: r.pub, &r.st
      - eval: p.conns.Store(int64(r.live))
        to: p.conns.Store
      - eval: p.accepted.Store(s.accepted)
        to: p.accepted.Store
      - eval: p.closed.Store(s.closed)
        to: p.closed.Store
      - eval: p.batches.Store(s.batches)
        to: p.batches.Store
      - eval: p.completions.Store(s.completions)
        to: p.completions.Store
      - eval: p.starved.Store(s.starved)
        to: p.starved.Store
      - eval: p.retries.Store(s.retries)
        to: p.retries.Store
      - eval: p.pauses.Store(s.pauses)
        to: p.pauses.Store
      - eval: p.evicted.Store(s.evicted)
        to: p.evicted.Store
      - eval: p.watchdog.Store(s.watchdog)
        to: p.watchdog.Store
      - eval: p.draining.Store(r.draining)
        to: p.draining.Store
  - of: uringSetup
    participants:
      - id: caller
        kind: actor
      - id: uringSetup
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: fd, _, errno
        eval: syscall.RawSyscall(sysIOURingSetup, uintptr(entries), uintptr(unsafe.Pointer(p)), 0)
        to: syscall
      - return: int(fd), errno
  - of: uringRegister
    participants:
      - id: caller
        kind: actor
      - id: uringRegister
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: _, _, errno
        eval: syscall.RawSyscall6(sysIOURingRegister, uintptr(fd), op, uintptr(arg), uintptr(n), 0, 0)
        to: syscall
      - return: errno
  - of: uringEnterWait
    participants:
      - id: caller
        kind: actor
      - id: uringEnterWait
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: n, _, errno
        eval: syscall.Syscall6(sysIOURingEnter, uintptr(fd), uintptr(submit), uintptr(minComplete), uintptr(flags), uintptr(arg), argSz)
        to: syscall
      - return: int(n), errno
  - of: uringEnterSubmit
    participants:
      - id: caller
        kind: actor
      - id: uringEnterSubmit
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: n, _, errno
        eval: syscall.RawSyscall6(sysIOURingEnter, uintptr(fd), uintptr(submit), 0, 0, 0, 0)
        to: syscall
      - return: int(n), errno
  - of: uringEnterFlags
    participants:
      - id: caller
        kind: actor
      - id: uringEnterFlags
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: n, _, errno
        eval: syscall.RawSyscall6(sysIOURingEnter, uintptr(fd), uintptr(submit), 0, uintptr(flags), 0, 0)
        to: syscall
      - return: int(n), errno
  - of: fixedFd
    steps:
      - return: int32(index)
  - of: targetIndex
    steps:
      - return: index + 1
  - of: (*uLoop).probe
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).probe
        kind: self
      - id: probeError
        kind: internal
      - id: ul.openDescending
        kind: internal
      - id: probed.close
        kind: internal
      - id: probed.supports
        kind: internal
      - id: ul.probeRingFDs
        kind: internal
      - id: ul.settle
        kind: internal
    steps:
      - opt:
          do:
            - return: probeError("setup", syscall.EPERM)
              to: probeError
          when: ul.hooks.failStage == "setup"
      - bind: probed, found, err
        eval: ul.openDescending()
        to: ul.openDescending
      - opt:
          do:
            - return: err
          when: err != nil
      - defer: probed.close()
        to: probed.close
      - set: ul.stage
        value: "\"setup\""
      - bind: ok, perr
        eval: probed.supports(opAccept, opRecv, opSend, opAsyncCancel, opClose, opPollAdd, opRead, opNop, opShutdown)
        to: probed.supports
      - opt:
          do:
            - return: probeError("register_probe", orErrno(perr, syscall.EOPNOTSUPP))
              to: probeError
          when: perr != 0 || !ok || ul.hooks.failStage == "probe"
      - set: ul.stage
        value: "\"register_probe\""
      - eval: ul.probeRingFDs(probed)
        to: ul.probeRingFDs
      - bind: rewind
        eval: found&setupSQRewind != 0 && ul.rewindSelfTest(probed)
      - eval: ul.settle(found, rewind, probed.params.features)
        to: ul.settle
      - return: nil
  - of: (*uLoop).openDescending
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).openDescending
        kind: self
      - id: ul.probeFlags
        kind: internal
      - id: openURing
        kind: internal
      - id: ul.giveUp
        kind: internal
    steps:
      - bind: flags
        eval: ul.probeFlags()
        to: ul.probeFlags
      - bind: opened, step, errno
        eval: openURing(probeEntries, flags)
        to: openURing
      - loop:
          do:
            - opt:
                do:
                  - break: true
                when: errno != syscall.EINVAL || step != "setup"
            - opt:
                do:
                  - continue: true
                when: flags&d.flag == 0
            - set: flags
              to: ul.giveUp
              value: ul.giveUp(flags, d.flag, d.name, errno)
            - set: opened, step, errno
              to: openURing
              value: openURing(probeEntries, flags)
          key: _
          range: setupDrops
          value: d
      - opt:
          do:
            - return: nil, 0, probeError(step, errno)
          when: errno != 0
      - return: opened, flags, nil
  - of: (*uLoop).probeFlags
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).probeFlags
        kind: self
      - id: ul.rep.set
        kind: internal
    steps:
      - bind: flags
        eval: setupSingleIssuer | setupSubmitAll | setupCoopTaskrun
      - loop:
          do:
            - opt:
                do:
                  - op: "|="
                    set: flags
                    value: d.flag
                when: "!ul.sw.disabled(d.name)"
          key: _
          range: setupDrops[:3]
          value: d
      - opt:
          do:
            - op: "&^="
              set: flags
              value: setupSQRewind
            - eval: ul.rep.set(corenet.CapabilityURingSQRewind, statusAbsent, "needs uring-no-sqarray, switched off")
              to: ul.rep.set
          when: flags&setupNoSQArray == 0 && flags&setupSQRewind != 0
      - opt:
          do:
            - op: "&^="
              set: flags
              value: setupCoopTaskrun
          when: flags&setupDeferTaskrun != 0
      - return: flags
  - of: (*uLoop).giveUp
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).giveUp
        kind: self
      - id: ul.rep.set
        kind: internal
    steps:
      - op: "&^="
        set: flags
        value: flag
      - opt:
          do:
            - op: "|="
              set: flags
              value: setupCoopTaskrun
          when: flag == setupDeferTaskrun
      - opt:
          do:
            - eval: ul.rep.set(name, statusAbsent, probeReason("io_uring_setup", errno))
              to: ul.rep.set
          when: name != ""
      - return: flags
  - of: (*uLoop).probeRingFDs
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).probeRingFDs
        kind: self
      - id: probed.registerRing
        kind: internal
      - id: ul.rep.set
        kind: internal
      - id: probed.unregisterRing
        kind: internal
      - id: ul.rep.found
        kind: internal
      - id: ul.sw.wants
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: ul.sw.disabled(corenet.CapabilityURingRingFDs)
      - bind: errno
        eval: probed.registerRing()
        to: probed.registerRing
      - opt:
          do:
            - eval: ul.rep.set(corenet.CapabilityURingRingFDs, statusAbsent, probeReason("register_ring_fds", errno))
              to: ul.rep.set
            - return: ""
          when: errno != 0
      - eval: probed.unregisterRing()
        to: probed.unregisterRing
      - eval: ul.rep.found(ul.sw, corenet.CapabilityURingRingFDs, true, "")
        to: ul.rep.found
      - set: ul.uses.ringFDs
        to: ul.sw.wants
        value: ul.sw.wants(corenet.CapabilityURingRingFDs)
  - of: (*uLoop).rewindSelfTest
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).rewindSelfTest
        kind: self
      - id: probed.get
        kind: internal
      - id: ul.rep.set
        kind: internal
      - id: probed.enterTarget
        kind: internal
      - id: uringEnterFlags
        kind: internal
      - id: probed.consumed
        kind: internal
      - id: probed.submit
        kind: internal
      - id: time.Now().Add
        kind: value
      - id: probed.wait
        kind: internal
      - id: probed.reap
        kind: internal
    steps:
      - loop:
          do:
            - bind: s
              eval: probed.get()
              to: probed.get
            - opt:
                do:
                  - eval: "ul.rep.set(corenet.CapabilityURingSQRewind, statusAbsent, \"partial submit: no SQE\")"
                    to: ul.rep.set
                  - return: "false"
                when: s == nil
            - set: s.opcode, s.userData
              value: opNop, ud
          key: _
          range: "[]uint64{rewindFirst, rewindSecond}"
          value: ud
      - bind: fd, reg
        eval: probed.enterTarget()
        to: probed.enterTarget
      - bind: got, errno
        eval: uringEnterFlags(fd, 1, reg)
        to: uringEnterFlags
      - opt:
          do:
            - eval: ul.rep.set(corenet.CapabilityURingSQRewind, statusAbsent, probeReason("partial submit", orErrno(errno, syscall.EIO)))
              to: ul.rep.set
            - return: "false"
          when: errno != 0 || got != 1
      - eval: probed.consumed(1)
        to: probed.consumed
      - eval: probed.submit()
        to: probed.submit
      - var:
          name: seen
          type: "[]uint64"
      - bind: deadline
        eval: time.Now().Add(500 * time.Millisecond)
        to: time.Now().Add
      - bind: tick
        eval: "kernelTimespec{nsec: int64(tickEvery)}"
      - loop:
          cond: len(seen) < 2 && time.Now().Before(deadline)
          do:
            - eval: probed.wait(&tick)
              to: probed.wait
            - eval: probed.reap(8, func(c *cqe) { seen = append(seen, c.userData) })
              to: probed.reap
      - opt:
          do:
            - eval: "ul.rep.set(corenet.CapabilityURingSQRewind, statusAbsent, \"partial submit: completions out of contract\")"
              to: ul.rep.set
            - return: "false"
          when: len(seen) != 2 || seen[0] != rewindFirst || seen[1] != rewindSecond
      - return: "true"
  - of: (*uLoop).settle
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).settle
        kind: self
      - id: ul.rep.found
        kind: internal
      - id: layoutFlags
        kind: internal
      - id: sw.wants
        kind: internal
      - id: ul.reportMinTimeout
        kind: internal
    steps:
      - bind: sw
        eval: ul.sw
      - bind: base
        eval: setupBase | found&setupSingleIssuer
      - loop:
          do:
            - opt:
                do:
                  - eval: ul.rep.found(sw, d.name, true, "")
                    to: ul.rep.found
                when: found&d.flag != 0
          key: _
          range: setupDrops[1:3]
          value: d
      - opt:
          do:
            - eval: ul.rep.found(sw, corenet.CapabilityURingSQRewind, true, "")
              to: ul.rep.found
          when: rewind
      - op: "|="
        set: base
        to: layoutFlags
        value: layoutFlags(sw, found, rewind)
      - set: ul.primary, ul.secondary
        value: base, base
      - opt:
          do:
            - set: ul.primary
              value: base&^setupCoopTaskrun | setupDeferTaskrun
          when: found&setupDeferTaskrun != 0 && sw.wants(corenet.CapabilityURingDeferTaskrun)
      - set: ul.uses.multishot
        to: sw.wants
        value: sw.wants(corenet.CapabilityURingMultishotRecv)
      - eval: ul.reportMinTimeout(features)
        to: ul.reportMinTimeout
  - of: layoutFlags
    steps:
      - var:
          name: flags
          type: uint32
      - bind: useRewind
        eval: rewind && sw.wants(corenet.CapabilityURingSQRewind)
      - opt:
          do:
            - op: "|="
              set: flags
              value: setupNoSQArray
          when: found&setupNoSQArray != 0 && (useRewind || sw.wants(corenet.CapabilityURingNoSQArray))
      - opt:
          do:
            - op: "|="
              set: flags
              value: setupSQRewind
          when: useRewind
      - return: flags
  - of: (*uLoop).reportMinTimeout
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).reportMinTimeout
        kind: self
      - id: ul.rep.set
        kind: internal
    steps:
      - bind: status, reason
        eval: statusAbsent, "IORING_FEAT_MIN_TIMEOUT not advertised; "+reasonClassB
      - opt:
          do:
            - set: status, reason
              value: statusAvailable, reasonClassB
          when: features&featMinTimeout != 0
      - eval: ul.rep.set(corenet.CapabilityURingMinTimeout, status, reason)
        to: ul.rep.set
  - of: (*uLoop).reportSelfTest
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).reportSelfTest
        kind: self
      - id: ul.rep.found
        kind: internal
    steps:
      - eval: ul.rep.found(ul.sw, corenet.CapabilityURingPbuf, true, "")
        to: ul.rep.found
      - eval: ul.rep.found(ul.sw, corenet.CapabilityURingMultishotRecv, true, "")
        to: ul.rep.found
      - opt:
          do:
            - return: ""
          when: ul.sw.disabled(corenet.CapabilityURingDirect)
      - bind: reason
        eval: "\"\""
      - opt:
          do:
            - set: reason
              value: "\"release check: the peer saw no end within 200 ms\""
          when: "!direct"
      - eval: ul.rep.found(ul.sw, corenet.CapabilityURingDirect, direct, reason)
        to: ul.rep.found
  - of: (*uLoop).registerRing
    steps:
      - opt:
          do:
            - return: ""
          when: "!ul.uses.ringFDs || ul.registered >= ringFDsMax || u.registerRing() != 0"
      - op: ++
        set: ul.registered
  - of: probeReason
    steps:
      - opt:
          do:
            - return: "\"probe defect: \" + step + \": \" + errno.Error()"
          when: errno == syscall.EEXIST
      - return: "step + \": \" + errno.Error()"
  - of: udPack
    steps:
      - return: op<<56 | uint64(gen&genMask)<<32 | uint64(slot)
  - of: udOp
    steps:
      - return: ud >> 56
  - of: udGen
    steps:
      - return: uint32(ud>>32) & genMask
  - of: udSlot
    steps:
      - return: uint32(ud)
  - of: (*uringRunner).drain
    participants:
      - id: caller
        kind: actor
      - id: (*uringRunner).drain
        kind: self
      - id: ul.drainReq.Store
        kind: value
      - id: ul.wake
        kind: internal
    steps:
      - loop:
          do:
            - eval: ul.drainReq.Store(true)
              to: ul.drainReq.Store
            - eval: ul.wake()
              to: ul.wake
          key: _
          range: ur.loops
          value: ul
  - of: (*uringRunner).stop
    participants:
      - id: caller
        kind: actor
      - id: (*uringRunner).stop
        kind: self
      - id: ul.stopReq.Store
        kind: value
      - id: ul.wake
        kind: internal
    steps:
      - loop:
          do:
            - eval: ul.stopReq.Store(true)
              to: ul.stopReq.Store
            - eval: ul.wake()
              to: ul.wake
          key: _
          range: ur.loops
          value: ul
  - of: (*uringRunner).wait
    steps:
      - eval: <-ur.fin
  - of: (*uringRunner).done
    steps:
      - return: ur.fin
  - of: (*uLoop).wake
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).wake
        kind: self
      - id: syscall
        kind: stdlib
      - id: swallowErr
        kind: internal
    steps:
      - lock:
          mutex: ul.wakeMu
      - opt:
          do:
            - return: ""
          when: ul.evClosed || ul.wakefd < 0
