          do:
            - return: true, true
          when: "!ok"
      - return: true, !plain
  - of: (*selfTestRun).victim
    participants:
      - id: caller
        kind: actor
      - id: (*selfTestRun).victim
        kind: self
      - id: selfTestClient
        kind: internal
      - id: closeFDs
        kind: internal
      - id: st.pump
        kind: internal
      - id: st.u.get
        kind: internal
      - id: prepShutdownFixed
        kind: internal
      - id: prepCancelFixed
        kind: internal
      - id: prepCloseDirect
        kind: internal
      - id: peerSeesEnd
        kind: internal
    steps:
      - bind: cfd, err
        eval: selfTestClient(port, nil)
        to: selfTestClient
      - opt:
          do:
            - return: false, false
          when: err != nil
      - defer: closeFDs([]int{cfd})
        to: closeFDs
      - bind: want
        eval: len(st.accepted) + 1
      - eval: st.pump(func() bool { return len(st.accepted) >= want })
        to: st.pump
      - opt:
          do:
            - return: false, false
          when: len(st.accepted) < want
      - bind: index
