  - of: fillStale
    steps:
      - loop:
          do:
            - set: b[i]
              value: staleFill
          key: i
          range: b
  - of: (*uRing).rearmStarved
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).rearmStarved
