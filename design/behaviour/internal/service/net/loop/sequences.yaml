            - opt:
                do:
                  - return: err
                when: err != nil
            - set: ul.rings
              value: append(ul.rings, rr)
            - set: lp.rings
              value: append(lp.rings, rr.r)
          key: i
          range: rings
      - eval: ul.reportPbufInc()
        to: ul.reportPbufInc
      - eval: ul.probeBundle()
        to: ul.probeBundle
      - eval: ul.probeSendZC()
        to: ul.probeSendZC
      - eval: ul.probeBusyPoll()
        to: ul.probeBusyPoll
      - eval: ul.probeZCRX()
        to: ul.probeZCRX
      - bind: primary
        eval: ul.rings[0]
      - eval: primary.pollFD(ul.wakefd, udWake)
        to: primary.pollFD
      - opt:
          do:
            - eval: primary.pollFD(ul.fanfd, udFan)
              to: primary.pollFD
          when: len(ul.rings) > 1
      - return: nil
  - forward: cmp.Or
    of: orErrno
  - of: (*uLoop).newRing
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).newRing
        kind: self
      - id: openURing
        kind: internal
      - id: ul.registerRing
        kind: internal
      - id: newRing
        kind: internal
      - id: ul.setupBufs
        kind: internal
      - id: u.close
        kind: internal
      - id: ul.registerTable
        kind: internal
      - id: rr.credit
        kind: internal
      - id: ul.indexTables
        kind: internal
      - id: ul.registerFan
        kind: internal
      - id: rr.fillAtStart
        kind: internal
      - id: rr.armAccepts
        kind: internal
    steps:
      - bind: flags
        eval: ul.secondary
      - opt:
          do:
            - set: flags
              value: ul.primary
          when: i == 0
      - opt:
          do:
            - op: "&^="
              set: flags
              value: setupCoopTaskrun
          when: i > 0 && ul.hooks.secondaryPlain
      - bind: u, step, errno
        eval: openURing(uringEntries, flags)
        to: openURing
      - opt:
          do:
            - return: nil, probeError(step, errno)
          when: errno != 0
      - eval: ul.registerRing(u)
        to: ul.registerRing
      - set: u.taken
        value: ul.hooks.taken
      - bind: lp
        eval: ul.lp
      - bind: rr
        eval: |-
          &uRing{
          		ul: ul, u: u, armed: make([]int, len(ul.lfds)),
          		queueDone: doneOutside(ul.owners, lp.index), queueCancel: make([]bool, len(ul.lfds)), taken: make([]int, len(ul.lfds)), seen: make([]uint64, len(ul.lfds)), backoff: backoffMin, sweepOn: sweep, sweepAt: -1,
          	}
      - set: rr.r
        to: newRing
        value: newRing(lp, i, rr)
      - opt:
          do:
            - eval: u.close()
              to: u.close
            - return: nil, probeError("buf_ring", orErrno(errno, syscall.EOPNOTSUPP))
          init:
            bind: errno
            eval: ul.setupBufs(u)
            to: ul.setupBufs
          when: errno != 0 || ul.hooks.failStage == "buf_ring"
      - bind: table
        eval: uint32(lp.sz.tableSize)
      - opt:
          do:
            - eval: u.close()
              to: u.close
            - return: nil, err
          init:
            bind: err
            eval: ul.registerTable(u, table)
            to: ul.registerTable
          when: err != nil
      - eval: rr.credit(0, u.bufProvided)
        to: rr.credit
      - set: rr.slotOf, rr.creds
        to: ul.indexTables
        value: ul.indexTables(table)
      - opt:
          do:
            - eval: u.close()
              to: u.close
            - return: nil, err
          init:
            bind: err
            eval: ul.registerFan(i, u)
            to: ul.registerFan
          when: err != nil
      - eval: rr.fillAtStart()
        to: rr.fillAtStart
      - eval: rr.armAccepts()
        to: rr.armAccepts
      - return: rr, nil
  - of: (*uLoop).setupBufs
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).setupBufs
        kind: self
      - id: ul.bufShape
        kind: internal
      - id: u.setupBuffers
        kind: internal
    steps:
      - bind: bufs, size, first
        eval: ul.bufShape()
        to: ul.bufShape
      - opt:
          do:
            - set: ul.incRefused
              value: syscall.EINVAL
          when: ul.hooks.failStage == "pbuf_inc"
      - bind: inc
        eval: ul.sw.wants(corenet.CapabilityURingPbufInc) && ul.incRefused == 0
      - bind: errno
        eval: u.setupBuffers(bufs, size, first, inc)
        to: u.setupBuffers
      - opt:
          do:
            - set: ul.incRefused
              value: u.incRefused
          when: u.incRefused != 0
      - return: errno
  - of: (*uLoop).reportPbufInc
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).reportPbufInc
        kind: self
      - id: ul.rep.found
        kind: internal
    steps:
      - bind: reason
        eval: "\"\""
      - opt:
          do:
            - set: reason
              value: "\"IOU_PBUF_RING_INC refused: \" + ul.incRefused.Error()"
          when: ul.incRefused != 0
      - eval: ul.rep.found(ul.sw, corenet.CapabilityURingPbufInc, ul.incRefused == 0, reason)
        to: ul.rep.found
  - of: (*uLoop).bufShape
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).bufShape
        kind: self
      - id: bufCountFor
        kind: internal
    steps:
      - opt:
          do:
            - return: ul.hooks.bufs, max(ul.hooks.bufSize, 64), ul.hooks.bufs
          when: ul.hooks.bufs > 0
      - return: bufCountFor(ul.lp.sz.tableSize), defaultBufSize, bufsFirst
        to: bufCountFor
  - of: bufCountFor
    steps:
      - bind: "n"
        eval: defaultBufs
      - loop:
          cond: int(n) < table && n < maxBufs
          do:
            - op: "*="
              set: "n"
              value: "2"
      - return: "n"
  - of: (*uLoop).registerFan
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).registerFan
        kind: self
      - id: uringRegister
        kind: internal
      - id: probeError
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: i == 0 || ul.hooks.fanSilent
      - bind: fd
        eval: new(int32(ul.fanfd))
      - opt:
          do:
            - return: probeError("register_eventfd", errno)
              to: probeError
          init:
            bind: errno
            eval: uringRegister(u.fd, regEventFD, unsafe.Pointer(fd), 1)
            to: uringRegister
          when: errno != 0
      - return: nil
  - of: (*uLoop).registerTable
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).registerTable
        kind: self
      - id: u.registerSparse
        kind: internal
      - id: probeError
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: "!ul.direct && ul.hooks.failStage != \"sparse_files\""
      - bind: errno
        eval: u.registerSparse(n)
        to: u.registerSparse
      - opt:
          do:
            - return: probeError("sparse_files", orErrno(errno, syscall.EOPNOTSUPP))
              to: probeError
          when: errno != 0 || ul.hooks.failStage == "sparse_files"
      - return: nil
  - of: (*uLoop).slotSpace
    steps:
      - opt:
          do:
            - return: int(table)
          when: ul.direct
      - return: int(min(ul.lp.sz.rlimit, maxProcessFDs))
  - of: (*uLoop).onFD
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).onFD
        kind: self
      - id: onProcessFD
        kind: internal
    steps:
      - opt:
          do:
            - eval: onProcessFD(s)
              to: onProcessFD
          when: "!ul.direct"
  - of: (*uRing).pollFD
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).pollFD
        kind: self
      - id: rr.u.get
        kind: internal
      - id: prepPollMulti
        kind: internal
    steps:
      - bind: s
        eval: rr.u.get()
        to: rr.u.get
      - opt:
          do:
            - op: ++
              set: rr.r.st.retries
            - return: ""
          when: s == nil
      - eval: prepPollMulti(s, fd, udPack(op, 0, 0))
        to: prepPollMulti
  - of: (*uRing).armAccepts
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).armAccepts
        kind: self
      - id: rr.acceptRoom
        kind: internal
      - id: rr.u.get
        kind: internal
      - id: prepAccept
        kind: internal
      - id: rr.ul.onFD
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: rr.acceptsNothing()
      - bind: room
        eval: rr.acceptRoom()
        to: rr.acceptRoom
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: "!ownedBy(rr.ul.owners, i, rr.ul.lp.index)"
            - loop:
                cond: rr.armed[i] < acceptDepth && room > 0
                do:
                  - bind: s
                    eval: rr.u.get()
                    to: rr.u.get
                  - opt:
                      do:
                        - op: ++
                          set: rr.r.st.retries
                        - return: ""
                      when: s == nil
                  - eval: prepAccept(s, fd, udPack(udAccept, 0, uint32(i)), false)
                    to: prepAccept
                  - eval: rr.ul.onFD(s)
                    to: rr.ul.onFD
                  - op: ++
                    set: rr.armed[i]
                  - op: "--"
                    set: room
          key: i
          range: rr.ul.lfds
          value: fd
  - of: (*uRing).acceptsNothing
    steps:
      - return: rr.ul.stopping() || rr.paused || rr.fill&fillClosed != 0 || rr.r.draining || rr.ul.lp.draining || (rr.ul.hooks.primaryIdle && rr.r.index == 0)
  - of: (*uRing).passedOver
    steps:
      - return: rr.r.draining || (rr.ul.hooks.primaryIdle && rr.r.index == 0)
  - of: (*uRing).fillAtStart
    steps:
      - opt:
          do:
            - op: "|="
              set: rr.fill
              value: fillFull
          when: rr.passedOver()
      - opt:
          do:
            - op: "|="
              set: rr.fill
              value: fillClosed
          when: "!rr.ul.opens(rr.r.index)"
  - of: (*uRing).fillStep
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).fillStep
        kind: self
      - id: fillMargin
        kind: internal
      - id: rr.ul.opens
        kind: internal
      - id: rr.cancelAccepts
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: rr.ul.lp.draining
      - bind: free
        eval: rr.ul.lp.sz.tableSize - rr.used()
      - bind: margin
        eval: fillMargin(rr.ul.lp.sz.tableSize)
        to: fillMargin
      - switch:
          cases:
            - case: rr.passedOver() || free <= margin
              do:
                - op: "|="
                  set: rr.fill
                  value: fillFull
            - case: free > 2*margin
              do:
                - op: "&^="
                  set: rr.fill
                  value: fillFull
      - bind: open
        eval: rr.ul.opens(rr.r.index)
        to: rr.ul.opens
      - opt:
          do:
            - op: "|="
              set: rr.fill
              value: fillClosed
            - eval: rr.cancelAccepts()
              to: rr.cancelAccepts
          when: "!open && rr.fill&fillClosed == 0"
      - opt:
          do:
            - op: "&^="
              set: rr.fill
              value: fillClosed
          when: open
  - of: fillMargin
    steps:
      - return: max(table/fillShare, 2*max(min(acceptReserve, table/8), 1))
  - of: (*uRing).acceptRoom
    steps:
      - bind: table
        eval: rr.ul.lp.sz.tableSize
      - bind: reserve
        eval: max(min(acceptReserve, table/8), 1)
      - bind: inFlight
        eval: "0"
      - loop:
          do:
            - op: +=
              set: inFlight
              value: "n"
          key: _
          range: rr.armed
          value: "n"
      - return: max(table-rr.used()-reserve-inFlight+1, 0)
  - of: (*uRing).cancelAccept
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).cancelAccept
        kind: self
      - id: rr.u.get
        kind: internal
      - id: prepCancelUserData
        kind: internal
    steps:
      - bind: s
        eval: rr.u.get()
        to: rr.u.get
      - opt:
          do:
            - op: ++
              set: rr.r.st.retries
            - return: "false"
          when: s == nil
      - eval: prepCancelUserData(s, udPack(udAccept, 0, uint32(i)), udPack(udAcceptCancel, 0, uint32(i)))
        to: prepCancelUserData
      - return: "true"
  - of: (*uRing).takeQueues
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).takeQueues
        kind: self
      - id: rr.takeQueue
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - eval: rr.takeQueue(i, fd)
                    to: rr.takeQueue
                when: "!rr.queueDone[i]"
          key: i
          range: rr.ul.lfds
          value: fd
  - of: (*uRing).takeQueue
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).takeQueue
        kind: self
      - id: queued
        kind: internal
      - id: rr.cancelAccept
        kind: internal
      - id: rr.ul.set.handBack
        kind: internal
      - id: rr.armTake
        kind: internal
    steps:
      - bind: q
        eval: "0"
      - opt:
          do:
            - set: q
              to: queued
              value: queued(fd)
          when: rr.take == takeOn && rr.taken[i] < queueTakeMax
      - opt:
          do:
            - opt:
                do:
                  - set: rr.queueCancel[i]
                    to: rr.cancelAccept
                    value: rr.cancelAccept(i)
                when: q == 0 && !rr.queueCancel[i]
            - return: ""
          when: rr.armed[i] > 0
      - set: rr.queueCancel[i]
        value: "false"
      - opt:
          do:
            - set: rr.queueDone[i]
              value: "true"
            - eval: rr.ul.set.handBack(i)
              to: rr.ul.set.handBack
            - return: ""
          when: q == 0
      - bind: "n"
        eval: min(q, acceptDepth, rr.acceptRoom(), queueTakeMax-rr.taken[i])
      - opt:
          do:
            - return: ""
          when: n == 0 || (rr.paused && rr.ul.lp.tick < rr.resumeAt)
      - op: +=
        set: rr.taken[i]
        to: rr.armTake
        value: rr.armTake(i, fd, n)
  - of: (*uRing).armTake
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).armTake
        kind: self
      - id: rr.u.get
        kind: internal
      - id: prepAccept
        kind: internal
      - id: rr.ul.onFD
        kind: internal
    steps:
      - loop:
          do:
            - bind: s
              eval: rr.u.get()
              to: rr.u.get
            - opt:
                do:
                  - op: ++
                    set: rr.r.st.retries
                  - return: k
                when: s == nil
            - eval: prepAccept(s, fd, udPack(udAccept, 0, uint32(i)), false)
              to: prepAccept
            - eval: rr.ul.onFD(s)
              to: rr.ul.onFD
            - op: ++
              set: rr.armed[i]
          key: k
          range: "n"
      - return: "n"
  - of: (*uRing).used
    steps:
      - return: len(rr.r.conns) - len(rr.r.free)
  - of: (*uRing).pace
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).pace
        kind: self
      - id: rr.cancelAccepts
        kind: internal
      - id: rr.r.evict
        kind: internal
      - id: rr.fillStep
        kind: internal
      - id: rr.armAccepts
        kind: internal
    steps:
      - bind: table
        eval: rr.ul.lp.sz.tableSize
      - bind: reserve
        eval: min(acceptReserve, table/8)
      - bind: free
        eval: table - rr.used()
      - opt:
          do:
            - set: rr.paused
              value: "true"
            - op: ++
              set: rr.r.st.pauses
            - eval: rr.cancelAccepts()
              to: rr.cancelAccepts
            - return: ""
          when: "!rr.paused && free < max(reserve, 1)"
      - opt:
          do:
            - set: rr.paused
              value: "false"
          when: rr.paused && free >= max(2*reserve, 1) && rr.ul.lp.tick >= rr.resumeAt
      - opt:
          do:
            - eval: rr.r.evict()
              to: rr.r.evict
          when: rr.ul.lp.hard && !rr.ul.direct
      - eval: rr.fillStep()
        to: rr.fillStep
      - eval: rr.armAccepts()
        to: rr.armAccepts
  - of: (*uLoop).serve
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).serve
        kind: self
      - id: fanTickFor
        kind: internal
      - id: ul.plainWait
        kind: internal
      - id: ul.waitArgs
        kind: internal
      - id: ul.batch
        kind: internal
      - id: ul.closeAll
        kind: internal
    steps:
      - bind: lp
        eval: ul.lp
      - set: ul.fan
        to: fanTickFor
        value: fanTickFor(len(ul.rings))
      - bind: tick
        eval: ul.fan
      - bind: grouped
        eval: "kernelTimespec{nsec: int64(lp.sz.batchWait)}"
      - loop:
          do:
            - set: tick
              to: ul.plainWait
              value: ul.plainWait(ul.fan)
            - bind: ts, want
              eval: ul.waitArgs(&tick, &grouped)
              to: ul.waitArgs
            - eval: ul.batch(ts, want, &tick)
              to: ul.batch
            - opt:
                do:
                  - break: true
                when: ul.stopReq.Load() || (lp.draining && ul.live() == 0 && ul.queuesTaken())
          forever: true
      - eval: ul.closeAll()
        to: ul.closeAll
  - of: (*uLoop).waitArgs
    steps:
      - bind: lp
        eval: ul.lp
      - opt:
          do:
            - return: tick, 1
          when: lp.sz.batchWait <= 0 || lp.draining || !ul.busy()
      - return: grouped, uint32(lp.sz.batchWaitMin)
  - of: (*uLoop).busy
    steps:
      - return: ul.reaped >= batchWaitFrom || (ul.reaped > 0 && 2*ul.spacing <= ul.lp.sz.batchWait)
  - of: (*uLoop).woke
    steps:
      - opt:
          do:
            - return: ""
          when: ul.arrived == 0
      - bind: at
        eval: ul.lp.started
      - op: +=
        set: ul.spacing
        value: ((at-ul.lastArrival)/time.Duration(ul.arrived) - ul.spacing) / spacingWeight
      - set: ul.lastArrival
        value: at
  - of: (*uLoop).batch
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).batch
        kind: self
      - id: rr.u.submit
        kind: internal
      - id: ul.await
        kind: internal
      - id: lp.begin
        kind: internal
      - id: ul.reapRings
        kind: internal
      - id: ul.watchFan
        kind: internal
      - id: ul.woke
        kind: internal
      - id: ul.control
        kind: internal
      - id: lp.shrinkSlab
        kind: internal
      - id: rr.r.wheel.advance
        kind: internal
      - id: rr.pace
        kind: internal
      - id: rr.watchdog
        kind: internal
      - id: rr.sweep
        kind: internal
      - id: rr.closeBackstop
        kind: internal
      - id: lp.h.OnBatchEnd
        kind: value
      - id: lp.endBatch
        kind: internal
      - id: ul.submitLate
        kind: internal
      - id: rr.returnBuffers
        kind: internal
      - id: lp.yield
        kind: internal
    steps:
      - bind: lp
        eval: ul.lp
      - loop:
          do:
            - eval: rr.u.submit()
              to: rr.u.submit
          key: _
          range: ul.rings[1:]
          value: rr
      - bind: plain
        eval: ul.await(ts, want, tick)
        to: ul.await
      - eval: lp.begin()
        to: lp.begin
      - eval: ul.reapRings()
        to: ul.reapRings
      - eval: ul.watchFan(plain)
        to: ul.watchFan
      - eval: ul.woke()
        to: ul.woke
      - eval: ul.control()
        to: ul.control
      - eval: lp.shrinkSlab()
        to: lp.shrinkSlab
      - loop:
          do:
            - eval: rr.r.wheel.advance(lp.tick, rr.r.expire)
              to: rr.r.wheel.advance
            - eval: rr.pace()
              to: rr.pace
            - eval: rr.watchdog()
              to: rr.watchdog
            - eval: rr.sweep()
              to: rr.sweep
            - eval: rr.closeBackstop()
              to: rr.closeBackstop
          key: _
          range: ul.rings
          value: rr
      - eval: lp.h.OnBatchEnd(lp)
        to: lp.h.OnBatchEnd
      - eval: lp.endBatch()
        to: lp.endBatch
      - eval: ul.submitLate()
        to: ul.submitLate
      - loop:
          do:
            - eval: rr.returnBuffers()
              to: rr.returnBuffers
            - set: rr.r.st.retries
              value: rr.u.retries
          key: _
          range: ul.rings
          value: rr
      - eval: lp.yield()
        to: lp.yield
  - of: (*uLoop).await
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).await
        kind: self
      - id: primary.submit
        kind: internal
      - id: primary.wait
        kind: internal
    steps:
      - bind: primary
        eval: ul.rings[0].u
      - opt:
          do:
            - eval: primary.submit()
              to: primary.submit
            - return: "false"
          when: ul.cutAt > 0
      - eval: primary.wait(ts, want)
        to: primary.wait
      - opt:
          do:
            - eval: primary.wait(tick, 1)
              to: primary.wait
            - return: "true"
          when: want > 1 && primary.ready() == 0
      - return: want == 1
  - of: (*uLoop).reapRings
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).reapRings
        kind: self
      - id: rr.reapAll
        kind: internal
    steps:
      - set: ul.reaped, ul.arrived, ul.fanReaped
        value: 0, 0, 0
      - bind: n, start
        eval: len(ul.rings), max(ul.cutAt-1, 0)
      - set: ul.cutAt
        value: "0"
      - loop:
          do:
            - bind: i
              eval: (start + k) % n
            - bind: rr
              eval: ul.rings[i]
            - bind: before
              eval: rr.r.st.completions
            - bind: cut
              eval: rr.reapAll()
              to: rr.reapAll
            - op: +=
              set: ul.reaped
              value: rr.r.st.completions - before
            - opt:
                do:
                  - op: +=
                    set: ul.fanReaped
                    value: rr.r.st.completions - before
                when: i > 0
            - opt:
                do:
                  - op: ++
                    set: rr.r.st.cut
                  - set: ul.cutAt
                    value: i + 1
                  - return: ""
                when: cut
          key: k
          range: "n"
  - of: (*uLoop).submitLate
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).submitLate
        kind: self
      - id: rr.u.submit
        kind: internal
    steps:
      - bind: lp
        eval: ul.lp
      - opt:
          do:
            - return: ""
          when: lp.sz.batchBudget <= 0 || lp.ended-lp.started < lp.sz.batchBudget/2
      - loop:
          do:
            - eval: rr.u.submit()
              to: rr.u.submit
          key: _
          range: ul.rings
          value: rr
  - of: (*uLoop).live
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).live
        kind: self
      - id: rr.used
        kind: internal
    steps:
      - bind: "n"
        eval: "0"
      - loop:
          do:
            - op: +=
              set: "n"
              to: rr.used
              value: rr.used()
          key: _
          range: ul.rings
          value: rr
      - return: "n"
  - of: (*uRing).reapAll
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).reapAll
        kind: self
      - id: reapShape
        kind: internal
      - id: rr.u.reap
        kind: internal
      - id: rr.u.flushOverflow
        kind: internal
    steps:
      - bind: lp
        eval: rr.ul.lp
      - bind: chunk, rounds
        eval: reapShape(&lp.sz)
        to: reapShape
      - loop:
          do:
            - bind: "n"
              eval: rr.u.reap(chunk, rr.handle)
              to: rr.u.reap
            - op: +=
              set: rr.r.st.completions
              value: uint64(n)
            - opt:
                do:
                  - return: rr.u.ready() > 0 || rr.u.overflowed()
                when: n > 0 && lp.overBudget()
            - opt:
                do:
                  - eval: rr.u.flushOverflow()
                    to: rr.u.flushOverflow
                  - continue: true
                when: rr.u.overflowed()
            - opt:
                do:
                  - return: "false"
                when: n == 0
          range: rounds
      - return: "false"
  - of: reapShape
    steps:
      - opt:
          do:
            - return: sz.cqBatch, reapRounds
          when: sz.batchBudget <= 0 || sz.cqBatch <= budgetChunk
      - return: budgetChunk, reapRounds * sz.cqBatch / budgetChunk
  - of: (*uRing).handle
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).handle
        kind: self
      - id: udOp
        kind: internal
      - id: rr.onAccept
        kind: internal
      - id: rr.onConnOp
        kind: internal
      - id: rr.onPeer
        kind: internal
      - id: rr.onWake
        kind: internal
      - id: rr.onFan
        kind: internal
    steps:
      - bind: ud
        eval: c.userData
      - switch:
          cases:
            - case: udAccept
              do:
                - eval: rr.onAccept(int(udSlot(ud)), c)
                  to: rr.onAccept
            - case: udRecv, udSend, udCancel, udClose, udShutdown, udFileIn, udFileOut, udFilePoll
              do:
                - eval: rr.onConnOp(op, int32(udSlot(ud)), udGen(ud), c)
                  to: rr.onConnOp
            - case: udPeer
              do:
                - eval: rr.onPeer(int32(udSlot(ud)), udGen(ud), c)
                  to: rr.onPeer
            - case: udWake
              do:
                - eval: rr.onWake(c)
                  to: rr.onWake
            - case: udFan
              do:
                - eval: rr.onFan(c)
                  to: rr.onFan
            - case: udOrphanClose, udAcceptCancel
          init:
            bind: op
            eval: udOp(ud)
            to: udOp
          "on": op
  - of: (*uRing).onConnOp
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).onConnOp
        kind: self
      - id: rr.onRecv
        kind: internal
      - id: rr.onSend
        kind: internal
      - id: rr.opDone
        kind: internal
      - id: rr.onClose
        kind: internal
      - id: rr.onFileIn
        kind: internal
      - id: rr.onFileOut
        kind: internal
      - id: rr.onFilePoll
        kind: internal
    steps:
      - switch:
          cases:
            - case: udRecv
              do:
                - eval: rr.onRecv(slot, gen, c)
                  to: rr.onRecv
            - case: udSend
              do:
                - eval: rr.onSend(slot, gen, c)
                  to: rr.onSend
            - case: udCancel, udShutdown
              do:
                - eval: rr.opDone(slot, gen)
                  to: rr.opDone
            - case: udClose
              do:
                - eval: rr.onClose(slot, gen)
                  to: rr.onClose
            - case: udFileIn
              do:
                - eval: rr.onFileIn(slot, gen, c)
                  to: rr.onFileIn
            - case: udFileOut
              do:
                - eval: rr.onFileOut(slot, gen, c)
                  to: rr.onFileOut
            - case: udFilePoll
              do:
                - eval: rr.onFilePoll(slot, gen, c)
                  to: rr.onFilePoll
          "on": op
  - of: (*uRing).onAccept
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).onAccept
        kind: self
      - id: rr.armAccepts
        kind: internal
      - id: rr.acceptFailed
        kind: internal
      - id: rr.takeFailed
        kind: internal
      - id: rr.countAccept
        kind: internal
      - id: lp.grp.rejected.Add
        kind: value
      - id: rr.orphanClose
        kind: internal
      - id: r.take
        kind: internal
      - id: rr.openAccepted
        kind: internal
    steps:
      - bind: r, lp
        eval: rr.r, rr.ul.lp
      - set: rr.lastAccept
        value: lp.tick
      - set: rr.stalls
        value: "0"
      - opt:
          do:
            - op: "--"
              set: rr.armed[li]
          when: c.flags&cqeFMore == 0 && li < len(rr.armed) && rr.armed[li] > 0
      - defer: rr.armAccepts()
        to: rr.armAccepts
      - opt:
          do:
            - eval: rr.acceptFailed(c.res)
              to: rr.acceptFailed
            - opt:
                do:
                  - eval: rr.takeFailed(c.res)
                    to: rr.takeFailed
                when: lp.draining
            - return: ""
          when: c.res < 0
      - bind: index
        eval: uint32(c.res)
      - eval: rr.countAccept(li)
        to: rr.countAccept
      - opt:
          do:
            - eval: lp.grp.rejected.Add(1)
              to: lp.grp.rejected.Add
            - eval: rr.orphanClose(index)
              to: rr.orphanClose
            - return: ""
          when: rr.refuses(index)
      - bind: slot, ok
        eval: r.take(int32(index))
        to: r.take
      - opt:
          do:
            - eval: lp.grp.rejected.Add(1)
              to: lp.grp.rejected.Add
            - eval: rr.orphanClose(index)
              to: rr.orphanClose
            - return: ""
          when: "!ok"
      - set: rr.slotOf[index]
        value: slot
      - set: rr.backoff
        value: backoffMin
      - eval: rr.openAccepted(li, index, slot)
        to: rr.openAccepted
  - of: (*uRing).countAccept
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).countAccept
        kind: self
      - id: rr.ul.set.accepted
        kind: internal
    steps:
      - opt:
          do:
            - eval: rr.ul.set.accepted(li)
              to: rr.ul.set.accepted
          when: li < len(rr.ul.lfds)
  - of: (*uRing).acceptFailed
    steps:
      - opt:
          do:
            - set: rr.paused
              value: "true"
            - op: ++
              set: rr.r.st.pauses
            - opt:
                do:
                  - set: rr.resumeAt
                    value: rr.ul.lp.tick + rr.backoff
                  - set: rr.backoff
                    value: min(rr.backoff*2, backoffMax)
                  - set: rr.ul.lp.hard
                    value: "true"
                when: "!rr.ul.direct"
          when: res == -int32(syscall.ENFILE) || res == -int32(syscall.EMFILE)
  - of: (*uRing).takeFailed
    steps:
      - opt:
          do:
            - set: rr.take
              value: takeOff
          when: "!takeWaits(res, rr.ul.lp.grp.live.Load())"
  - of: takeWaits
    steps:
      - switch:
          cases:
            - case: syscall.ENFILE, syscall.EMFILE
              do:
                - return: live > 0
            - case: syscall.ECANCELED, syscall.ECONNABORTED, syscall.EINTR, syscall.EAGAIN, syscall.EPROTO, syscall.ENOPROTOOPT, syscall.EHOSTDOWN, syscall.ENONET, syscall.EHOSTUNREACH, syscall.EOPNOTSUPP, syscall.ENETUNREACH, syscall.ENETDOWN
              do:
                - return: "true"
            - default: true
              do:
                - return: "false"
          "on": syscall.Errno(-res)
  - of: (*uRing).refuses
    steps:
      - bind: lp
        eval: rr.ul.lp
      - return: rr.ul.stopping() || (rr.r.draining && !lp.draining) || (lp.sz.maxConns > 0 && lp.grp.live.Load() >= int64(lp.sz.maxConns)) || int(index) >= len(rr.slotOf)
  - of: (*uRing).orphanClose
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).orphanClose
        kind: self
      - id: closeFDs
        kind: internal
      - id: rr.u.get
        kind: internal
      - id: prepCloseDirect
        kind: internal
    steps:
      - opt:
          do:
            - eval: closeFDs([]int{int(index)})
              to: closeFDs
            - return: ""
          when: "!rr.ul.direct"
      - bind: s
        eval: rr.u.get()
        to: rr.u.get
      - opt:
          do:
            - op: ++
              set: rr.r.st.retries
            - return: ""
          when: s == nil
      - eval: prepCloseDirect(s, index, udPack(udOrphanClose, 0, index))
        to: prepCloseDirect
  - of: (*uRing).armRecv
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).armRecv
        kind: self
      - id: rr.armRecvOn
        kind: internal
    steps:
      - eval: rr.armRecvOn(slot, rr.roomiest(nil))
        to: rr.armRecvOn
  - of: (*uRing).armRecvOn
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).armRecvOn
        kind: self
      - id: rr.u.get
        kind: internal
      - id: rr.r.fail
        kind: internal
      - id: prepRecv
        kind: internal
      - id: singleShot
        kind: internal
      - id: rr.ul.onFD
        kind: internal
      - id: rr.setEpoch
        kind: internal
    steps:
      - bind: c
        eval: "&rr.r.conns[slot]"
      - bind: s
        eval: rr.u.get()
        to: rr.u.get
      - opt:
          do:
            - op: ++
              set: rr.r.st.retries
            - eval: rr.r.fail(slot, rErrno, int32(syscall.EBUSY))
              to: rr.r.fail
            - return: ""
          when: s == nil
      - eval: prepRecv(s, uint32(c.fd), bufGroup+uint16(g), udPack(udRecv, c.gen, uint32(slot)))
        to: prepRecv
      - opt:
          do:
            - eval: singleShot(s)
              to: singleShot
          when: "!rr.ul.uses.multishot"
      - op: "|="
        set: s.ioprio
        value: rr.ul.uses.recvFlags
      - eval: rr.ul.onFD(s)
        to: rr.ul.onFD
      - op: ++
        set: c.ops
      - eval: rr.setEpoch(slot, rr.closes)
        to: rr.setEpoch
      - loop:
          cond: int(slot) >= len(rr.recvGroup)
          do:
            - set: rr.recvGroup
              value: append(rr.recvGroup, 0)
      - set: rr.recvGroup[slot]
        value: uint8(g)
      - op: ++
        set: rr.armedOn[g]
  - of: (*uRing).setEpoch
    steps:
      - opt:
          do:
            - return: ""
          when: "!rr.sweepOn"
      - loop:
          cond: int(slot) >= len(rr.armEpoch)
          do:
            - set: rr.armEpoch
              value: append(rr.armEpoch, noEpoch)
      - set: rr.armEpoch[slot]
        value: epoch
  - of: (*uRing).owns
    steps:
      - return: int(slot) < len(rr.r.conns) && rr.r.conns[slot].gen&genMask == gen
  - of: (*uRing).onRecv
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).onRecv
        kind: self
      - id: rr.takeBuf
        kind: internal
      - id: rr.setEpoch
        kind: internal
      - id: rr.recvBytes
        kind: internal
      - id: rr.recvStarved
        kind: internal
      - id: rr.recvEOF
        kind: internal
      - id: rr.recvCancelled
        kind: internal
      - id: rr.failLive
        kind: internal
      - id: rr.maybeClose
        kind: internal
    steps:
      - bind: more
        eval: c.flags&cqeFMore != 0
      - eval: rr.takeBuf(c)
        to: rr.takeBuf
      - opt:
          do:
            - return: ""
          when: "!rr.owns(slot, gen)"
      - opt:
          do:
            - op: "--"
              set: rr.r.conns[slot].ops
            - eval: rr.setEpoch(slot, noEpoch)
              to: rr.setEpoch
            - op: "--"
              set: rr.armedOn[rr.recvGroup[slot]]
          when: "!more"
      - switch:
          cases:
            - case: c.res > 0 && c.flags&cqeFBuffer != 0
              do:
                - eval: rr.recvBytes(slot, more)
                  to: rr.recvBytes
            - case: c.res == -int32(errnoENOBUFS)
              do:
                - eval: rr.recvStarved(slot)
                  to: rr.recvStarved
            - case: c.res == 0
              do:
                - eval: rr.recvEOF(slot)
                  to: rr.recvEOF
            - case: c.res == -int32(errnoECANCELED)
              do:
                - eval: rr.recvCancelled(slot, more)
                  to: rr.recvCancelled
            - default: true
              do:
                - eval: rr.failLive(slot, -c.res)
                  to: rr.failLive
      - eval: rr.maybeClose(slot)
        to: rr.maybeClose
  - of: (*uRing).takeBuf
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).takeBuf
        kind: self
      - id: rr.u.spans
        kind: internal
      - id: rr.u.release
        kind: internal
    steps:
      - set: rr.segs, rr.segBids
        value: rr.segs[:0], rr.segBids[:0]
      - opt:
          do:
            - return: ""
          when: c.flags&cqeFBuffer == 0
      - var:
          name: keptLast
          type: bool
      - set: rr.segs, rr.segBids, keptLast
        to: rr.u.spans
        value: rr.u.spans(uint16(c.flags>>cqeBufferShift), c.res, c.flags&cqeFBufMore != 0, rr.segs, rr.segBids)
      - loop:
          do:
            - bind: kept
              eval: keptLast && i == len(rr.segBids)-1
            - opt:
                do:
                  - eval: rr.ul.hooks.bufSeen(bid, int(rr.u.bufSize)-cap(rr.segs[i]), len(rr.segs[i]), kept, i == 0, false)
                when: rr.ul.hooks.bufSeen != nil
            - opt:
                do:
                  - eval: rr.u.release(bid)
                    to: rr.u.release
                  - set: rr.recycle
                    value: append(rr.recycle, bid)
                  - op: "--"
                    set: rr.inRing[rr.u.groupOf(bid)]
                when: "!kept"
          key: i
          range: rr.segBids
          value: bid
  - of: (*uRing).recvCancelled
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).recvCancelled
        kind: self
      - id: rr.armRecv
        kind: internal
    steps:
      - opt:
          do:
            - eval: rr.armRecv(slot)
              to: rr.armRecv
          when: "!more && rr.r.conns[slot].state == stOpen"
  - of: (*uRing).recvBytes
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).recvBytes
        kind: self
      - id: rr.r.deliver
        kind: internal
      - id: rr.armRecv
        kind: internal
    steps:
      - op: ++
        set: rr.ul.arrived
      - loop:
          do:
            - opt:
                do:
                  - eval: rr.r.deliver(slot, seg)
                    to: rr.r.deliver
                when: rr.r.conns[slot].state == stOpen
          key: _
          range: rr.segs
          value: seg
      - opt:
          do:
            - eval: rr.armRecv(slot)
              to: rr.armRecv
          when: "!more && rr.r.conns[slot].state == stOpen"
  - of: (*uRing).recvStarved
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).recvStarved
        kind: self
      - id: rr.r.fail
        kind: internal
    steps:
      - op: ++
        set: rr.r.st.starved
      - bind: open
        eval: rr.r.conns[slot].state == stOpen
      - alt:
          - do:
              - set: rr.starved
                value: append(rr.starved, slot)
            when: open && len(rr.starved) < starvedCap
          - do:
              - eval: rr.r.fail(slot, rErrno, int32(errnoENOBUFS))
                to: rr.r.fail
            when: open
  - of: (*uRing).recvEOF
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).recvEOF
        kind: self
      - id: rr.r.markDirty
        kind: internal
    steps:
      - bind: cc
        eval: "&rr.r.conns[slot]"
      - opt:
          do:
            - op: "|="
              set: cc.flags
              value: fPeerDone
            - eval: rr.r.markDirty(slot)
              to: rr.r.markDirty
          when: cc.state == stOpen
  - of: (*uRing).failLive
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).failLive
        kind: self
      - id: rr.r.fail
        kind: internal
    steps:
      - bind: state
        eval: rr.r.conns[slot].state
      - opt:
          do:
            - eval: rr.r.fail(slot, rErrno, errno)
              to: rr.r.fail
          when: state == stOpen || state == stClosing
  - of: (*uRing).onSend
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).onSend
        kind: self
      - id: rr.sendFlight
        kind: internal
      - id: rr.failLive
        kind: internal
      - id: rr.maybeClose
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "!rr.owns(slot, gen)"
      - bind: cc
        eval: "&rr.r.conns[slot]"
      - opt:
          do:
            - return: ""
          when: cc.zc != zcOff && rr.zeroCopyHandled(slot, c)
      - op: "--"
        set: cc.ops
      - switch:
          cases:
            - case: c.res > 0
              do:
                - opt:
                    do:
                      - return: ""
                    when: rr.sendProgress(slot, c.res)
            - case: c.res == -int32(errnoECANCELED)
              do:
                - op: "&^="
                  set: cc.flags
                  value: fSending
                - opt:
                    do:
                      - eval: rr.sendFlight(slot)
                        to: rr.sendFlight
                      - return: ""
                    when: cc.state == stOpen || cc.state == stClosing
            - default: true
              do:
                - op: "&^="
                  set: cc.flags
                  value: fSending
                - eval: rr.failLive(slot, -c.res)
                  to: rr.failLive
      - eval: rr.maybeClose(slot)
        to: rr.maybeClose
  - of: (*uRing).sendProgress
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).sendProgress
        kind: self
      - id: r.wrote
        kind: internal
      - id: rr.sendFlight
        kind: internal
      - id: rr.releaseFlight
        kind: internal
    steps:
      - bind: r
        eval: rr.r
      - bind: cc
        eval: "&r.conns[slot]"
      - op: +=
        set: cc.flight.off
        value: "n"
      - eval: r.wrote(int(n))
        to: r.wrote
      - bind: alive
        eval: cc.state == stOpen || cc.state == stClosing
      - opt:
          do:
            - eval: rr.sendFlight(slot)
              to: rr.sendFlight
            - return: "true"
          when: cc.flight.off < cc.flight.len && alive
      - opt:
          do:
            - return: "true"
          when: cc.zcPend > 0
      - eval: rr.releaseFlight(slot, alive)
        to: rr.releaseFlight
      - return: "false"
  - of: (*uRing).releaseFlight
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).releaseFlight
        kind: self
      - id: rr.ul.lp.slab.free
        kind: internal
      - id: r.sent
        kind: internal
      - id: r.markDirty
        kind: internal
    steps:
      - bind: r
        eval: rr.r
      - bind: cc
        eval: "&r.conns[slot]"
      - bind: "n"
        eval: int(cc.flight.len)
      - eval: rr.ul.lp.slab.free(cc.flight)
        to: rr.ul.lp.slab.free
      - set: cc.flight
        value: "chunkRef{idx: noChunk}"
      - set: cc.zc
        value: zcOff
      - op: "&^="
        set: cc.flags
        value: fSending
      - opt:
          do:
            - eval: r.sent(slot, n)
              to: r.sent
            - eval: r.markDirty(slot)
              to: r.markDirty
          when: alive
  - of: (*uRing).opDone
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).opDone
        kind: self
      - id: rr.maybeClose
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "!rr.owns(slot, gen)"
      - op: "--"
        set: rr.r.conns[slot].ops
      - eval: rr.maybeClose(slot)
        to: rr.maybeClose
  - of: (*uRing).maybeClose
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).maybeClose
        kind: self
      - id: closeFDs
        kind: internal
      - id: rr.onClose
        kind: internal
      - id: rr.u.get
        kind: internal
      - id: prepCloseDirect
        kind: internal
    steps:
      - bind: c
        eval: "&rr.r.conns[slot]"
      - opt:
          do:
            - return: ""
          when: c.state != stDead || c.ops != 0
      - opt:
          do:
            - eval: closeFDs([]int{int(c.fd)})
              to: closeFDs
            - eval: rr.onClose(slot, c.gen&genMask)
              to: rr.onClose
            - return: ""
          when: "!rr.ul.direct"
      - bind: s
        eval: rr.u.get()
        to: rr.u.get
      - opt:
          do:
            - op: ++
              set: rr.r.st.retries
            - return: ""
          when: s == nil
      - eval: prepCloseDirect(s, uint32(c.fd), udPack(udClose, c.gen, uint32(slot)))
        to: prepCloseDirect
      - set: c.ops
        value: "1"
      - set: c.state
        value: stFree
      - op: ++
        set: rr.closes
  - of: (*uRing).onClose
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).onClose
        kind: self
      - id: rr.r.dropFile
        kind: internal
      - id: rr.r.release
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "!rr.owns(slot, gen)"
      - bind: c
        eval: "&rr.r.conns[slot]"
      - bind: index
        eval: c.fd
