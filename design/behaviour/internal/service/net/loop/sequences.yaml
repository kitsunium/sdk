                  to: st.onAccept
            - case: udShutdown, udCancel
              do:
                - op: ++
                  set: st.done
            - case: udClose
              do:
                - set: st.closed
                  value: "true"
            - case: udRecv
              do:
                - eval: st.onRecv(c)
                  to: st.onRecv
          "on": udOp(c.userData)
