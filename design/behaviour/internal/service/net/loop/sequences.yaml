            - eval: slowFanWake()
              to: slowFanWake
          when: rings > 1
      - send:
          chan: ready
          value: nil
      - eval: ul.serve()
        to: ul.serve
      - eval: ul.teardown()
        to: ul.teardown
  - of: (*uLoop).setup
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).setup
        kind: self
      - id: ul.probe
        kind: internal
      - id: ul.selfTest
        kind: internal
      - id: ul.reportSelfTest
        kind: internal
      - id: ul.build
