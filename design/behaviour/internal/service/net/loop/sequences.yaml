      - op: +=
        set: s.mappedBytes
        value: len(mem)
      - bind: a
        eval: int32(len(c.arenas))
      - alt:
          - do:
              - set: a
                value: c.holes[n-1]
              - set: c.holes
                value: c.holes[:n-1]
              - set: c.arenas[a]
                value: mem
            init:
              bind: "n"
              eval: len(c.holes)
            when: n > 0
