        to: batchWaitOf
        value: batchWaitOf(v, sz.cqBatch)
      - set: sz.batchBudget
        value: max(time.Duration(v.BatchBudget), 0)
      - set: sz.sendZCMin
        to: orDefault
        value: orDefault(v.SendZCMin, defaultSendZCMin)
      - set: sz.busyPoll
        to: busyPollOf
        value: busyPollOf(v)
      - set: sz.zcrx
        to: zcrxOf
        value: zcrxOf(v, os.Getpagesize())
      - set: sz.loops, sz.loopsSource
        to: ResolveLoops
        value: ResolveLoops(v.Loops)
