          when: errno != 0
      - eval: ul.registerRing(u)
        to: ul.registerRing
      - bind: lp
        eval: ul.lp
      - bind: rr
        eval: |-
          &uRing{
          		ul: ul, u: u, armed: make([]int, len(ul.lfds)),
          		queueDone: make([]bool, len(ul.lfds)), queueCancel: make([]bool, len(ul.lfds)), taken: make([]int, len(ul.lfds)), backoff: backoffMin, sweepOn: sweep, sweepAt: -1,
          	}
