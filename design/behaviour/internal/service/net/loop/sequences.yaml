      - opt:
          do:
            - return: "\"bundle probe buf_ring: \" + errno.Error()"
          init:
            bind: errno
            eval: u.setupBuffers(bundleProbeBufs, bundleProbeSize, bundleProbeBufs, ul.rings[0].u.bufInc)
            to: u.setupBuffers
          when: errno != 0
      - bind: res, errno
        eval: bundleRecv(u)
        to: bundleRecv
      - switch:
          cases:
            - case: errno != 0
              do:
                - return: "\"recv bundle refused: \" + errno.Error()"
            - case: res < bundleProbeBytes
              do:
                - return: "\"a probe bundle filled one buffer (incremental consumption before 6.15, or a first recv before 7.0)\""
      - return: "\"\""
  - of: bundleRecv
    participants:
      - id: caller
        kind: actor
      - id: bundleRecv
        kind: self
      - id: syscall
        kind: stdlib
      - id: closeFDs
        kind: internal
      - id: u.get
        kind: internal
      - id: u.wait
        kind: internal
      - id: u.reap
        kind: internal
    steps:
      - bind: fds, err
        eval: syscall.Socketpair(syscall.AF_UNIX, syscall.SOCK_STREAM|syscall.SOCK_NONBLOCK|syscall.SOCK_CLOEXEC, 0)
        to: syscall
      - opt:
          do:
            - return: 0, errnoOfErr(err)
          when: err != nil
      - defer: closeFDs(fds[:])
        to: closeFDs
      - opt:
          do:
            - return: 0, errnoOfErr(err)
          init:
            bind: _, err
            eval: syscall.Write(fds[0], make([]byte, bundleProbeBytes))
