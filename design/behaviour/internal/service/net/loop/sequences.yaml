      - loop:
          do:
            - eval: ls.left[i].Store(int32(takers))
              to: ls.left[i].Store
          key: i
          range: ls.left
      - return: ls
  - of: (*listenerSet).handBack
    participants:
      - id: caller
        kind: actor
      - id: (*listenerSet).handBack
        kind: self
      - id: ls.close
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: ls.left[i].Add(-1) != 0
      - eval: ls.close(i)
        to: ls.close
  - of: (*listenerSet).closeRest
    participants:
      - id: caller
        kind: actor
      - id: (*listenerSet).closeRest
