            - set: rr.r.draining
              value: "true"
            - loop:
                do:
                  - opt:
                      do:
                        - set: rr.queueCancel[i]
                          to: rr.cancelAccept
                          value: rr.cancelAccept(i)
                      when: n > 0
                key: i
                range: rr.armed
                value: "n"
          key: _
          range: ul.rings
          value: rr
  - of: (*uLoop).stopping
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).stopping
        kind: self
      - id: ul.stopBy.IsZero
        kind: value
    steps:
      - return: "!ul.stopBy.IsZero()"
        to: ul.stopBy.IsZero
  - of: (*uLoop).closeAll
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).closeAll
        kind: self
      - id: time.Now().Add
        kind: value
      - id: r.fail
        kind: internal
      - id: rr.cancelAccepts
        kind: internal
      - id: rr.u.submit
        kind: internal
      - id: ul.rings[0].u.wait
        kind: internal
      - id: rr.reapAll
        kind: internal
      - id: rr.r.publish
        kind: internal
    steps:
      - set: ul.stopBy
        to: time.Now().Add
        value: time.Now().Add(time.Second)
      - loop:
          do:
            - bind: r
              eval: rr.r
            - loop:
                cond: r.lruHead != noLink
                do:
                  - eval: r.fail(r.lruHead, rDrain, 0)
                    to: r.fail
            - eval: rr.cancelAccepts()
              to: rr.cancelAccepts
            - eval: rr.u.submit()
              to: rr.u.submit
          key: _
          range: ul.rings
          value: rr
      - bind: tick
        eval: "kernelTimespec{nsec: int64(tickEvery)}"
      - loop:
          cond: ul.live() > 0 && time.Now().Before(ul.stopBy)
          do:
            - eval: ul.rings[0].u.wait(&tick, 1)
              to: ul.rings[0].u.wait
            - loop:
                do:
                  - eval: rr.u.submit()
                    to: rr.u.submit
                  - eval: rr.reapAll()
                    to: rr.reapAll
                key: _
                range: ul.rings
                value: rr
      - loop:
          do:
            - eval: rr.r.publish()
              to: rr.r.publish
          key: _
          range: ul.rings
          value: rr
  - of: (*uLoop).teardown
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).teardown
        kind: self
      - id: lp.post.close
        kind: internal
      - id: rr.u.close
        kind: internal
      - id: rr.releaseFiles
        kind: internal
      - id: ul.wakeMu.Lock
        kind: value
      - id: closeFDs
        kind: internal
      - id: ul.wakeMu.Unlock
        kind: value
      - id: lp.slab.release
        kind: internal
    steps:
      - bind: lp
        eval: ul.lp
      - opt:
          do:
            - eval: lp.post.close()
              to: lp.post.close
          when: lp.post != nil
      - loop:
          do:
            - eval: rr.u.close()
              to: rr.u.close
            - eval: rr.releaseFiles()
              to: rr.releaseFiles
          key: _
          range: ul.rings
          value: rr
      - eval: ul.wakeMu.Lock()
        to: ul.wakeMu.Lock
      - eval: closeFDs([]int{ul.wakefd, ul.fanfd})
        to: closeFDs
      - set: ul.evClosed
        value: "true"
      - eval: ul.wakeMu.Unlock()
        to: ul.wakeMu.Unlock
      - eval: lp.slab.release()
        to: lp.slab.release
  - of: (*uRing).beginFile
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).beginFile
        kind: self
      - id: dupCloexec
        kind: internal
      - id: syscall
        kind: stdlib
      - id: closeFDs
        kind: internal
    steps:
      - opt:
          do:
            - return: corenet.LoopFileRefused
          when: rr.ul.features&ulSplice == 0
      - bind: dup, err
        eval: dupCloexec(fd)
        to: dupCloexec
      - opt:
          do:
            - return: corenet.LoopFileRefused
          when: err != nil
      - var:
          name: pipe
          type: "[2]int"
      - opt:
          do:
            - eval: closeFDs([]int{dup})
              to: closeFDs
            - return: corenet.LoopFileRefused
          init:
            bind: err
            eval: syscall.Pipe2(pipe[:], syscall.O_NONBLOCK|syscall.O_CLOEXEC)
            to: syscall
          when: err != nil
      - bind: c
        eval: "&r.conns[slot]"
      - set: c.fileFD, c.pipeR, c.pipeW
        value: int32(dup), int32(pipe[0]), int32(pipe[1])
      - set: c.pipeHeld, c.fileOps, c.fileBits, c.fileErr
        value: 0, 0, 0, 0
      - return: nil
  - of: (*uRing).endFile
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).endFile
        kind: self
      - id: closeFDs
        kind: internal
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - eval: closeFDs([]int{int(c.fileFD), int(c.pipeR), int(c.pipeW)})
        to: closeFDs
      - set: c.fileFD, c.pipeR, c.pipeW
        value: "-1, -1, -1"
      - set: c.pipeHeld, c.fileOps, c.fileBits, c.fileErr
        value: 0, 0, 0, 0
      - set: c.fileOff, c.fileLeft
        value: 0, 0
  - of: (*uRing).releaseFiles
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).releaseFiles
        kind: self
      - id: rr.endFile
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - eval: rr.endFile(rr.r, int32(i))
                    to: rr.endFile
                when: rr.r.conns[i].fileFD >= 0
          key: i
          range: rr.r.conns
  - of: (*uRing).fileStep
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).fileStep
        kind: self
      - id: rr.fileOut
        kind: internal
      - id: rr.u.submit
        kind: internal
      - id: rr.r.fail
        kind: internal
      - id: prepSpliceIn
        kind: internal
      - id: rr.u.get
        kind: internal
      - id: prepSpliceOut
        kind: internal
      - id: rr.ul.onFD
        kind: internal
    steps:
      - bind: c
        eval: "&rr.r.conns[slot]"
      - opt:
          do:
            - eval: rr.fileOut(slot, uint32(c.pipeHeld))
              to: rr.fileOut
            - return: ""
          when: c.pipeHeld > 0
      - opt:
          do:
            - eval: rr.u.submit()
              to: rr.u.submit
            - opt:
                do:
                  - op: ++
                    set: rr.r.st.retries
                  - eval: rr.r.fail(slot, rErrno, int32(syscall.EBUSY))
                    to: rr.r.fail
                  - return: ""
                when: "!rr.u.room(2)"
          when: "!rr.u.room(2)"
      - bind: "n"
        eval: uint32(min(c.fileLeft, fileStepBytes))
      - eval: "prepSpliceIn(rr.u.get(), spliceIn{file: c.fileFD, pipeW: c.pipeW, off: c.fileOff, n: n}, udPack(udFileIn, c.gen, uint32(slot)))"
        to: prepSpliceIn
      - bind: s
        eval: rr.u.get()
        to: rr.u.get
      - eval: prepSpliceOut(s, c.pipeR, uint32(c.fd), n, udPack(udFileOut, c.gen, uint32(slot)))
        to: prepSpliceOut
      - eval: rr.ul.onFD(s)
        to: rr.ul.onFD
      - op: +=
        set: c.ops
        value: "2"
      - set: c.fileOps
        value: "2"
      - op: "|="
        set: c.flags
        value: fSending
  - of: (*uRing).fileOut
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).fileOut
        kind: self
      - id: rr.u.get
        kind: internal
      - id: rr.r.fail
        kind: internal
      - id: prepSpliceOut
        kind: internal
      - id: rr.ul.onFD
        kind: internal
    steps:
      - bind: c
        eval: "&rr.r.conns[slot]"
      - bind: s
        eval: rr.u.get()
        to: rr.u.get
      - opt:
          do:
            - op: ++
              set: rr.r.st.retries
            - eval: rr.r.fail(slot, rErrno, int32(syscall.EBUSY))
              to: rr.r.fail
            - return: ""
          when: s == nil
      - eval: prepSpliceOut(s, c.pipeR, uint32(c.fd), n, udPack(udFileOut, c.gen, uint32(slot)))
        to: prepSpliceOut
      - eval: rr.ul.onFD(s)
        to: rr.ul.onFD
      - op: ++
        set: c.ops
      - set: c.fileOps
        value: "1"
      - op: "|="
        set: c.flags
        value: fSending
  - of: (*uRing).onFileIn
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).onFileIn
        kind: self
      - id: rr.fileAdvance
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "!rr.owns(slot, gen)"
      - bind: cc
        eval: "&rr.r.conns[slot]"
      - op: "--"
        set: cc.ops
      - op: "--"
        set: cc.fileOps
      - switch:
          cases:
            - case: c.res > 0
              do:
                - op: +=
                  set: cc.pipeHeld
                  value: c.res
                - op: +=
                  set: cc.fileOff
                  value: int64(c.res)
                - op: "-="
                  set: cc.fileLeft
                  value: int64(c.res)
            - case: c.res == 0
              do:
                - op: "|="
                  set: cc.fileBits
                  value: ffEOF
            - case: c.res != -int32(errnoECANCELED)
              do:
                - set: cc.fileErr
                  value: "-c.res"
      - eval: rr.fileAdvance(slot)
        to: rr.fileAdvance
  - of: (*uRing).onFileOut
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).onFileOut
        kind: self
      - id: rr.fileAdvance
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "!rr.owns(slot, gen)"
      - bind: cc
        eval: "&rr.r.conns[slot]"
      - op: "--"
        set: cc.ops
      - op: "--"
        set: cc.fileOps
      - switch:
          cases:
            - case: c.res > 0
              do:
                - op: "-="
                  set: cc.pipeHeld
                  value: c.res
                - op: +=
                  set: rr.r.st.bytesOut
                  value: uint64(c.res)
                - set: cc.lastIO
                  value: rr.ul.lp.tick
            - case: c.res == -int32(syscall.EAGAIN)
              do:
                - op: "|="
                  set: cc.fileBits
                  value: ffFull
            - case: c.res == 0, c.res == -int32(errnoECANCELED)
            - default: true
              do:
                - set: cc.fileErr
                  value: "-c.res"
      - eval: rr.fileAdvance(slot)
        to: rr.fileAdvance
  - of: (*uRing).onFilePoll
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).onFilePoll
        kind: self
      - id: rr.fileAdvance
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "!rr.owns(slot, gen)"
      - bind: cc
        eval: "&rr.r.conns[slot]"
      - op: "--"
        set: cc.ops
      - op: "--"
        set: cc.fileOps
      - op: "&^="
        set: cc.fileBits
        value: ffPoll
      - opt:
          do:
            - set: cc.fileErr
              value: "-c.res"
          when: c.res < 0 && c.res != -int32(errnoECANCELED)
      - eval: rr.fileAdvance(slot)
        to: rr.fileAdvance
  - of: (*uRing).fileAdvance
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).fileAdvance
        kind: self
      - id: rr.maybeClose
        kind: internal
      - id: rr.failLive
        kind: internal
      - id: rr.pollOut
        kind: internal
      - id: rr.fileOut
        kind: internal
      - id: rr.r.fail
        kind: internal
      - id: rr.fileStep
        kind: internal
      - id: rr.r.fileDone
        kind: internal
    steps:
      - bind: c
        eval: "&rr.r.conns[slot]"
      - opt:
          do:
            - return: ""
          when: c.fileOps > 0
      - op: "&^="
        set: c.flags
        value: fSending
      - opt:
          do:
            - eval: rr.maybeClose(slot)
              to: rr.maybeClose
            - return: ""
          when: c.state != stOpen && c.state != stClosing
      - switch:
          cases:
            - case: c.fileErr != 0
              do:
                - eval: rr.failLive(slot, c.fileErr)
                  to: rr.failLive
            - case: c.fileBits&ffFull != 0
              do:
                - op: "&^="
                  set: c.fileBits
                  value: ffFull
                - eval: rr.pollOut(slot)
                  to: rr.pollOut
            - case: c.pipeHeld > 0
              do:
                - eval: rr.fileOut(slot, uint32(c.pipeHeld))
                  to: rr.fileOut
            - case: c.fileBits&ffEOF != 0
              do:
                - eval: rr.r.fail(slot, rFile, 0)
                  to: rr.r.fail
            - case: c.fileLeft > 0
              do:
                - eval: rr.fileStep(slot)
                  to: rr.fileStep
            - default: true
              do:
                - eval: rr.r.fileDone(slot)
                  to: rr.r.fileDone
      - eval: rr.maybeClose(slot)
        to: rr.maybeClose
  - of: (*uRing).pollOut
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).pollOut
        kind: self
      - id: rr.u.get
        kind: internal
      - id: rr.r.fail
        kind: internal
      - id: prepPollOut
        kind: internal
      - id: rr.ul.onFD
        kind: internal
    steps:
      - bind: c
        eval: "&rr.r.conns[slot]"
      - bind: s
        eval: rr.u.get()
        to: rr.u.get
      - opt:
          do:
            - op: ++
              set: rr.r.st.retries
            - eval: rr.r.fail(slot, rErrno, int32(syscall.EBUSY))
              to: rr.r.fail
            - return: ""
          when: s == nil
      - eval: prepPollOut(s, uint32(c.fd), udPack(udFilePoll, c.gen, uint32(slot)))
        to: prepPollOut
      - eval: rr.ul.onFD(s)
        to: rr.ul.onFD
      - op: ++
        set: c.ops
      - set: c.fileOps
        value: "1"
      - op: "|="
        set: c.fileBits
        value: ffPoll
      - op: "|="
        set: c.flags
        value: fSending
  - of: prepPeerCred
    participants:
      - id: caller
        kind: actor
      - id: prepPeerCred
        kind: self
      - id: fixedFd
        kind: internal
    steps:
      - set: s.opcode
        value: opURingCmd
      - set: s.fd
        to: fixedFd
        value: fixedFd(index)
      - set: s.flags
        value: sqeFixedFile
      - set: s.off
        value: uint64(sockOpGetsockopt)
      - set: s.addr
        value: uint64(syscall.SOL_SOCKET) | uint64(syscall.SO_PEERCRED)<<32
      - set: s.fileIdx
        value: uint32(ucredLen)
      - set: s.addr3
        value: uint64(uintptr(unsafe.Pointer(cred)))
      - set: s.userData
        value: ud
  - of: prepInstall
    steps:
      - set: s.opcode
        value: opFilesUpdate
      - set: s.fd
        value: "-1"
      - set: s.addr
        value: uint64(uintptr(unsafe.Pointer(fd)))
      - set: s.len
        value: "1"
      - set: s.off
        value: uint64(fileIndexAlloc)
      - set: s.userData
        value: ud
  - of: unixListeners
    participants:
      - id: caller
        kind: actor
      - id: unixListeners
        kind: self
      - id: unixListener
        kind: internal
    steps:
      - bind: out
        eval: make([]bool, len(fds))
      - loop:
          do:
            - set: out[i]
              to: unixListener
              value: "unixListener(fds[i : i+1])"
          key: i
          range: fds
      - return: out
  - of: (*uLoop).peerCmd
    steps:
      - return: ul.direct && ul.peers.cmd && li < len(ul.peers.unix) && ul.peers.unix[li]
  - of: (*uRing).askPeer
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).askPeer
        kind: self
      - id: rr.u.get
        kind: internal
      - id: rr.armRecv
        kind: internal
      - id: rr.r.opened
        kind: internal
      - id: prepPeerCred
        kind: internal
    steps:
      - bind: c
        eval: "&rr.r.conns[slot]"
      - bind: index
        eval: uint32(c.fd)
      - bind: cell
        eval: "&rr.creds[index]"
      - set: "*cell"
        value: peerCell{}
      - bind: s
        eval: rr.u.get()
        to: rr.u.get
      - opt:
          do:
            - op: ++
              set: rr.r.st.retries
            - eval: rr.armRecv(slot)
              to: rr.armRecv
            - eval: rr.r.opened(slot)
              to: rr.r.opened
            - return: ""
          when: s == nil
      - eval: prepPeerCred(s, index, &cell.cred, udPack(udPeer, c.gen, uint32(slot)))
        to: prepPeerCred
      - op: ++
        set: c.ops
      - set: c.state
        value: stPeer
  - of: (*uRing).onPeer
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).onPeer
        kind: self
      - id: rr.maybeClose
        kind: internal
      - id: rr.armRecv
        kind: internal
      - id: rr.r.opened
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "!rr.owns(slot, gen) || rr.r.conns[slot].state != stPeer"
      - bind: cc
        eval: "&rr.r.conns[slot]"
      - op: "--"
        set: cc.ops
      - bind: cell
        eval: "&rr.creds[cc.fd]"
      - set: cell.ok
        value: c.res == ucredLen && cell.cred.Pid > 0
      - opt:
          do:
            - set: cc.state
              value: stDead
            - eval: rr.maybeClose(slot)
              to: rr.maybeClose
            - return: ""
          when: rr.ul.stopping()
      - set: cc.state
        value: stOpen
      - eval: rr.armRecv(slot)
        to: rr.armRecv
      - eval: rr.r.opened(slot)
        to: rr.r.opened
  - of: (*uRing).directPeer
    steps:
      - bind: index
        eval: r.conns[slot].fd
      - opt:
          do:
            - return: corenet.LoopPeerValue{}, false
          when: int(index) >= len(rr.creds) || !rr.creds[index].ok
      - bind: u
        eval: rr.creds[index].cred
      - return: "corenet.LoopPeerValue{UID: u.Uid, GID: u.Gid, PID: uint32(u.Pid), Verified: true}, true"
  - of: (*uLoop).indexTables
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).indexTables
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: slotOf
        eval: slices.Repeat([]int32{-1}, ul.slotSpace(table))
        to: slices
      - opt:
          do:
            - return: slotOf, nil
          when: "!ul.direct || !ul.peers.cmd"
      - return: slotOf, slices.Repeat([]peerCell{{}}, len(slotOf))
  - of: (*uRing).openAccepted
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).openAccepted
        kind: self
      - id: rr.askPeer
        kind: internal
      - id: rr.armRecv
        kind: internal
      - id: rr.r.opened
        kind: internal
    steps:
      - opt:
          do:
            - eval: rr.askPeer(slot)
              to: rr.askPeer
            - return: ""
          when: rr.ul.peerCmd(li)
      - opt:
          do:
            - set: rr.creds[index]
              value: peerCell{}
          when: int(index) < len(rr.creds)
      - eval: rr.armRecv(slot)
        to: rr.armRecv
      - eval: rr.r.opened(slot)
        to: rr.r.opened
  - of: (*uLoop).selfTest
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).selfTest
        kind: self
      - id: unixListeners
        kind: internal
      - id: slices
        kind: stdlib
      - id: selfTestRing
        kind: internal
      - id: rg.close
        kind: internal
      - id: loopbackListener
        kind: internal
      - id: closeFDs
        kind: internal
      - id: rg.get
        kind: internal
      - id: prepAccept
        kind: internal
      - id: onProcessFD
        kind: internal
      - id: rg.submit
        kind: internal
      - id: selfTestClient
        kind: internal
      - id: run.closeAccepted
        kind: internal
      - id: run.exchange
        kind: internal
      - id: run.verdict
        kind: internal
      - id: ul.peerCommand
        kind: internal
      - id: run.releases
        kind: internal
    steps:
      - opt:
          do:
            - return: false, false, probeError("self_test", syscall.EIO)
          when: ul.hooks.failStage == "self_test"
      - set: ul.peers.unix
        to: unixListeners
        value: unixListeners(ul.lfds)
      - bind: unix
        eval: slices.Contains(ul.peers.unix, true)
        to: slices
      - bind: fds
        eval: ul.sw.disabled(corenet.CapabilityURingDirect) || (unix && !ul.sw.wants(corenet.CapabilityURingSockGetsockopt))
      - bind: rg, err
        eval: selfTestRing(flags, !fds)
        to: selfTestRing
      - opt:
          do:
            - return: false, false, err
          when: err != nil
      - defer: rg.close()
        to: rg.close
      - bind: lfd, port, err
        eval: loopbackListener()
        to: loopbackListener
      - opt:
          do:
            - return: false, false, probeError("self_test listen", errnoOfErr(err))
          when: err != nil
      - defer: closeFDs([]int{lfd})
        to: closeFDs
      - bind: s
        eval: rg.get()
        to: rg.get
      - eval: prepAccept(s, lfd, udPack(udAccept, 0, 0), true)
        to: prepAccept
      - opt:
          do:
            - eval: onProcessFD(s)
              to: onProcessFD
          when: fds
      - eval: rg.submit()
        to: rg.submit
      - bind: cfd, err
        eval: selfTestClient(port, selfTestPayload)
        to: selfTestClient
      - opt:
          do:
            - return: false, false, err
          when: err != nil
      - defer: closeFDs([]int{cfd})
        to: closeFDs
      - bind: run
        eval: "&selfTestRun{u: rg, index: -1, mode: selfTestMode{fds: fds, multishot: ul.sw.wants(corenet.CapabilityURingMultishotRecv)}}"
      - defer: run.closeAccepted()
        to: run.closeAccepted
      - eval: run.exchange()
        to: run.exchange
      - opt:
          do:
            - return: false, false, err
          init:
            bind: err
            eval: run.verdict()
            to: run.verdict
          when: err != nil
      - opt:
          do:
            - return: false, false, nil
          when: fds
      - opt:
          do:
            - set: ul.peers.cmd, ul.peers.why
              to: ul.peerCommand
              value: ul.peerCommand(run)
            - opt:
                do:
                  - return: false, false, nil
                when: "!ul.peers.cmd"
          when: unix
      - set: direct, deferred
        to: run.releases
        value: run.releases(port)
      - return: direct, deferred, nil
  - of: (*selfTestRun).releases
    participants:
      - id: caller
        kind: actor
      - id: (*selfTestRun).releases
        kind: self
      - id: st.victim
        kind: internal
    steps:
      - bind: shut, ok
        eval: st.victim(port, true)
        to: st.victim
      - opt:
          do:
            - return: false, false
          when: "!ok || !shut"
      - bind: plain, ok
        eval: st.victim(port, false)
        to: st.victim
      - opt:
          do:
            - return: true, true
          when: "!ok"
      - return: true, !plain
  - of: (*selfTestRun).victim
    participants:
      - id: caller
        kind: actor
      - id: (*selfTestRun).victim
        kind: self
      - id: selfTestClient
        kind: internal
      - id: closeFDs
        kind: internal
      - id: st.pump
        kind: internal
      - id: prepShutdownFixed
        kind: internal
      - id: prepCancelFixed
        kind: internal
      - id: prepCloseDirect
        kind: internal
      - id: peerSeesEnd
        kind: internal
    steps:
      - bind: cfd, err
        eval: selfTestClient(port, nil)
        to: selfTestClient
      - opt:
          do:
            - return: false, false
          when: err != nil
      - defer: closeFDs([]int{cfd})
        to: closeFDs
      - bind: want
        eval: len(st.accepted) + 1
      - eval: st.pump(func() bool { return len(st.accepted) >= want })
        to: st.pump
      - opt:
          do:
            - return: false, false
          when: len(st.accepted) < want
      - bind: index
        eval: uint32(st.accepted[want-1])
      - set: st.done
        value: "0"
      - alt:
          - do:
              - eval: prepShutdownFixed(st.u.get(), index, syscall.SHUT_RDWR, udPack(udShutdown, 0, 0))
                to: prepShutdownFixed
            when: shut
          - do:
              - eval: prepCancelFixed(st.u.get(), index, udPack(udCancel, 0, 0))
                to: prepCancelFixed
            else: true
      - eval: st.pump(func() bool { return st.done >= 2 })
        to: st.pump
      - set: st.closed
        value: "false"
      - eval: prepCloseDirect(st.u.get(), index, udPack(udClose, 0, 0))
        to: prepCloseDirect
      - eval: st.pump(func() bool { return st.closed })
        to: st.pump
      - opt:
          do:
            - return: false, false
          when: "!st.closed"
      - return: peerSeesEnd(cfd), true
        to: peerSeesEnd
  - of: peerSeesEnd
    participants:
      - id: caller
        kind: actor
      - id: peerSeesEnd
        kind: self
      - id: time.Now().Add
        kind: value
      - id: syscall
        kind: stdlib
      - id: time
        kind: stdlib
    steps:
      - var:
          name: buf
          type: "[peerPeekBytes]byte"
      - bind: deadline
        eval: time.Now().Add(200 * time.Millisecond)
        to: time.Now().Add
      - loop:
          cond: time.Now().Before(deadline)
          do:
            - bind: n, _, err
              eval: syscall.Recvfrom(fd, buf[:], syscall.MSG_DONTWAIT)
              to: syscall
            - opt:
                do:
                  - return: "true"
                when: n == 0 && err == nil
            - eval: time.Sleep(5 * time.Millisecond)
              to: time
      - return: "false"
  - of: selfTestRing
    participants:
      - id: caller
        kind: actor
      - id: selfTestRing
        kind: self
      - id: openURing
        kind: internal
      - id: rg.setupBuffers
        kind: internal
      - id: rg.close
        kind: internal
      - id: rg.registerSparse
        kind: internal
    steps:
      - bind: rg, step, errno
        eval: openURing(probeEntries, flags)
        to: openURing
      - opt:
          do:
            - return: nil, probeError("self_test "+step, errno)
          when: errno != 0
      - opt:
          do:
            - eval: rg.close()
              to: rg.close
            - return: nil, probeError("self_test buf_ring", errno)
          init:
            bind: errno
            eval: rg.setupBuffers(8, 4096, 8, false)
            to: rg.setupBuffers
          when: errno != 0
      - opt:
          do:
            - return: rg, nil
          when: "!direct"
      - opt:
          do:
            - eval: rg.close()
              to: rg.close
            - return: nil, probeError("self_test sparse_files", errno)
          init:
            bind: errno
            eval: rg.registerSparse(4)
            to: rg.registerSparse
          when: errno != 0
      - return: rg, nil
  - of: selfTestClient
    participants:
      - id: caller
        kind: actor
      - id: selfTestClient
        kind: self
      - id: syscall
        kind: stdlib
      - id: closeFDs
        kind: internal
    steps:
      - bind: cfd, err
        eval: syscall.Socket(syscall.AF_INET, syscall.SOCK_STREAM|syscall.SOCK_CLOEXEC, 0)
        to: syscall
      - opt:
          do:
            - return: "-1, probeError(\"self_test socket\", errnoOfErr(err))"
          when: err != nil
      - opt:
          do:
            - eval: closeFDs([]int{cfd})
              to: closeFDs
            - return: "-1, probeError(\"self_test connect\", errnoOfErr(err))"
          init:
            bind: err
            eval: "syscall.Connect(cfd, &syscall.SockaddrInet4{Port: port, Addr: [4]byte{127, 0, 0, 1}})"
            to: syscall
          when: err != nil
      - opt:
          do:
            - return: cfd, nil
          when: payload == nil
      - opt:
          do:
            - eval: closeFDs([]int{cfd})
              to: closeFDs
            - return: "-1, probeError(\"self_test write\", errnoOfErr(err))"
          init:
            bind: _, err
            eval: syscall.Write(cfd, payload)
            to: syscall
          when: err != nil
      - return: cfd, nil
  - of: (*selfTestRun).closeAccepted
    participants:
      - id: caller
        kind: actor
      - id: (*selfTestRun).closeAccepted
        kind: self
      - id: closeFDs
        kind: internal
    steps:
      - opt:
          do:
            - eval: closeFDs([]int{int(st.index)})
              to: closeFDs
          when: st.mode.fds && st.index >= 0
  - of: (*selfTestRun).armRecv
    participants:
      - id: caller
        kind: actor
      - id: (*selfTestRun).armRecv
        kind: self
      - id: st.u.get
        kind: internal
      - id: prepRecv
        kind: internal
      - id: singleShot
        kind: internal
      - id: onProcessFD
        kind: internal
    steps:
      - bind: s
        eval: st.u.get()
        to: st.u.get
      - eval: prepRecv(s, uint32(res), bufGroup, udPack(udRecv, 0, slot))
        to: prepRecv
      - opt:
          do:
            - eval: singleShot(s)
              to: singleShot
          when: "!st.mode.multishot"
      - opt:
          do:
            - eval: onProcessFD(s)
              to: onProcessFD
          when: st.mode.fds
  - of: (*selfTestRun).pump
    participants:
      - id: caller
        kind: actor
      - id: (*selfTestRun).pump
        kind: self
      - id: time.Now().Add
        kind: value
      - id: st.u.wait
        kind: internal
      - id: st.u.reap
        kind: internal
    steps:
      - bind: deadline
        eval: time.Now().Add(500 * time.Millisecond)
        to: time.Now().Add
      - bind: tick
        eval: "kernelTimespec{nsec: int64(tickEvery)}"
      - loop:
          cond: "!done() && time.Now().Before(deadline)"
          do:
            - eval: st.u.wait(&tick, 1)
              to: st.u.wait
            - eval: st.u.reap(64, st.onCQE)
              to: st.u.reap
  - of: (*selfTestRun).exchange
    participants:
      - id: caller
        kind: actor
      - id: (*selfTestRun).exchange
        kind: self
      - id: time.Now().Add
        kind: value
      - id: st.u.wait
        kind: internal
      - id: st.u.reap
        kind: internal
    steps:
      - bind: deadline
        eval: time.Now().Add(time.Second)
        to: time.Now().Add
      - bind: tick
        eval: "kernelTimespec{nsec: int64(tickEvery)}"
      - loop:
          cond: "!bytes.Equal(st.got, selfTestPayload) && time.Now().Before(deadline)"
          do:
            - eval: st.u.wait(&tick, 1)
              to: st.u.wait
            - eval: st.u.reap(64, st.onCQE)
              to: st.u.reap
  - of: (*selfTestRun).onCQE
    participants:
      - id: caller
        kind: actor
      - id: (*selfTestRun).onCQE
        kind: self
      - id: st.onAccept
        kind: internal
      - id: st.onRecv
        kind: internal
    steps:
      - switch:
          cases:
            - case: udAccept
              do:
                - eval: st.onAccept(c.res)
                  to: st.onAccept
            - case: udShutdown, udCancel
              do:
                - op: ++
                  set: st.done
            - case: udClose
              do:
                - set: st.closed
                  value: "true"
            - case: udPeer
              do:
                - set: st.peer
                  value: "cmdResult{done: true, res: c.res}"
            - case: udFilesUpdate
              do:
                - set: st.install
                  value: "cmdResult{done: true, res: c.res}"
            - case: udRecv
              do:
                - eval: st.onRecv(c)
                  to: st.onRecv
          "on": udOp(c.userData)
  - of: (*selfTestRun).onRecv
    participants:
      - id: caller
        kind: actor
      - id: (*selfTestRun).onRecv
        kind: self
      - id: st.u.addBuf
        kind: internal
      - id: st.u.publishBufs
        kind: internal
      - id: st.armRecv
        kind: internal
      - id: st.countEnd
        kind: internal
    steps:
      - opt:
          do:
            - set: st.got
              value: append(st.got, st.u.buf(uint16(c.flags >> cqeBufferShift))[:c.res]...)
            - eval: st.u.addBuf(uint16(c.flags >> cqeBufferShift))
              to: st.u.addBuf
            - eval: st.u.publishBufs()
              to: st.u.publishBufs
          when: c.res > 0 && c.flags&cqeFBuffer != 0
      - opt:
          do:
            - eval: st.armRecv(st.index, 0)
              to: st.armRecv
          when: "!st.mode.multishot && c.res > 0 && c.flags&cqeFMore == 0 && udSlot(c.userData) == 0"
      - eval: st.countEnd(c)
        to: st.countEnd
  - of: (*selfTestRun).countEnd
    steps:
      - opt:
          do:
            - op: ++
              set: st.done
          when: udSlot(c.userData) != 0 && c.flags&cqeFMore == 0 && c.res <= 0
  - of: (*selfTestRun).onAccept
    participants:
      - id: caller
        kind: actor
      - id: (*selfTestRun).onAccept
        kind: self
      - id: st.armRecv
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: res < 0
      - alt:
          - do:
              - set: st.index
                value: res
            when: st.index < 0
          - do:
              - set: st.accepted
                value: append(st.accepted, res)
            else: true
      - eval: st.armRecv(res, uint32(len(st.accepted)))
        to: st.armRecv
  - of: (*selfTestRun).verdict
    participants:
      - id: caller
        kind: actor
      - id: (*selfTestRun).verdict
        kind: self
      - id: probeError
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: bytes.Equal(st.got, selfTestPayload)
      - opt:
          do:
            - return: probeError("self_test accept", syscall.ETIMEDOUT)
              to: probeError
          when: st.index < 0
      - return: probeError("self_test recv", syscall.ETIMEDOUT)
        to: probeError
  - of: loopbackListener
    participants:
      - id: caller
        kind: actor
      - id: loopbackListener
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - set: fd, err
        to: syscall
        value: syscall.Socket(syscall.AF_INET, syscall.SOCK_STREAM|syscall.SOCK_NONBLOCK|syscall.SOCK_CLOEXEC, 0)
      - opt:
          do:
            - return: "-1, 0, err"
          when: err != nil
      - opt:
          do:
            - set: _
              to: syscall
              value: syscall.Close(fd)
            - return: "-1, 0, err"
