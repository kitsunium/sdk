    steps:
      - return: u.setup&setupNoSQArray != 0
  - of: (*uring).rewind
    steps:
      - return: u.setup&setupSQRewind != 0
  - of: (*uring).deferred
    steps:
      - return: u.setup&setupDeferTaskrun != 0
  - of: (*uring).room
    steps:
      - opt:
