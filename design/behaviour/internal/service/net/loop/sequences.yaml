          cond: a >= 0 && done < n
          do:
            - opt:
                do:
                  - set: c.dropped[a]
                    value: "true"
                  - op: ++
                    set: done
                when: int(c.freeIn[a]) == c.perArena && c.arenas[a] != nil
          init: a := len(c.arenas) - 1
          post: a--
      - return: done
  - of: (*slab).unmapDropped
    participants:
      - id: caller
        kind: actor
      - id: (*slab).unmapDropped
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: "!d"
            - op: "-="
              set: s.mappedBytes
              value: len(c.arenas[a])
            - opt:
                do:
                  - eval: swallowErr(s.unmap(c.arenas[a]))
                    to: swallowErr
                when: s.unmap != nil
