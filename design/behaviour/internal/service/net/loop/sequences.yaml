    participants:
      - id: caller
        kind: actor
      - id: (*uring).reserve
        kind: self
      - id: u.submit
        kind: internal
    steps:
      - loop:
          cond: "!u.room(n)"
          do:
            - opt:
                do:
                  - return: "false"
                when: i >= enterRetries
            - eval: u.submit()
              to: u.submit
          init: i := 0
          post: i++
      - return: "true"
