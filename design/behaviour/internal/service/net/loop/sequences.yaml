        to: runtime
      - set: ul.tid
        to: syscall
        value: syscall.Gettid()
      - set: ul.lp.threadOK
        to: threadCheck
        value: threadCheck(ul.tid)
      - opt:
          do:
            - eval: ul.teardown()
              to: ul.teardown
            - send:
                chan: ready
                value: err
            - return: ""
          init:
            bind: err
            eval: ul.setup(rings)
            to: ul.setup
          when: err != nil
      - send:
          chan: ready
          value: nil
      - eval: ul.serve()
        to: ul.serve
      - eval: ul.teardown()
        to: ul.teardown
  - of: (*uLoop).setup
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).setup
        kind: self
      - id: ul.probe
        kind: internal
      - id: ul.selfTest
        kind: internal
      - id: ul.reportSelfTest
        kind: internal
      - id: ul.build
        kind: internal
    steps:
      - bind: err
        eval: ul.probe()
        to: ul.probe
      - opt:
          do:
            - return: err
          when: err != nil
      - bind: direct, deferred, err
        eval: ul.selfTest(ul.primary)
        to: ul.selfTest
      - opt:
          do:
            - return: err
          when: err != nil
      - set: ul.direct
        value: direct
      - set: ul.stage
        value: "\"self_test+fds\""
      - opt:
          do:
            - set: ul.stage
              value: "\"self_test+direct\""
          when: direct
      - eval: ul.reportSelfTest(direct)
        to: ul.reportSelfTest
      - return: ul.build(rings, direct && deferred)
        to: ul.build
  - of: (*uLoop).build
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).build
        kind: self
      - id: newPostQueue
        kind: internal
      - id: syscall
        kind: stdlib
      - id: probeError
        kind: internal
      - id: ul.newRing
        kind: internal
      - id: primary.pollFD
        kind: internal
    steps:
      - bind: lp
        eval: ul.lp
      - set: lp.post
        to: newPostQueue
        value: newPostQueue(ul.wake)
      - bind: wfd, _, e1
        eval: syscall.RawSyscall(syscall.SYS_EVENTFD2, 0, efdNonblock|efdCloexec, 0)
        to: syscall
      - bind: ffd, _, e2
        eval: syscall.RawSyscall(syscall.SYS_EVENTFD2, 0, efdNonblock|efdCloexec, 0)
        to: syscall
      - opt:
          do:
            - return: probeError("eventfd", orErrno(e1, e2))
              to: probeError
          when: e1 != 0 || e2 != 0
      - set: ul.wakefd, ul.fanfd
        value: int(wfd), int(ffd)
