      - eval: probed.submit()
        to: probed.submit
      - var:
          name: seen
          type: "[]uint64"
      - bind: deadline
        eval: time.Now().Add(500 * time.Millisecond)
        to: time.Now().Add
      - bind: tick
        eval: "kernelTimespec{nsec: int64(tickEvery)}"
      - loop:
          cond: len(seen) < 2 && time.Now().Before(deadline)
          do:
            - eval: probed.wait(&tick, 1)
              to: probed.wait
            - eval: probed.reap(8, func(c *cqe) { seen = append(seen, c.userData) })
              to: probed.reap
      - opt:
          do:
            - eval: "ul.rep.set(corenet.CapabilityURingSQRewind, statusAbsent, \"partial submit: completions out of contract\")"
              to: ul.rep.set
            - return: "false"
          when: len(seen) != 2 || seen[0] != rewindFirst || seen[1] != rewindSecond
      - return: "true"
  - of: (*uLoop).settle
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).settle
        kind: self
      - id: ul.rep.found
        kind: internal
      - id: layoutFlags
        kind: internal
      - id: sw.wants
        kind: internal
      - id: ul.reportMinTimeout
        kind: internal
    steps:
      - bind: sw
        eval: ul.sw
      - bind: base
        eval: setupBase | found&setupSingleIssuer
      - loop:
          do:
            - opt:
                do:
                  - eval: ul.rep.found(sw, d.name, true, "")
                    to: ul.rep.found
                when: found&d.flag != 0
          key: _
          range: setupDrops[1:3]
          value: d
      - opt:
          do:
            - eval: ul.rep.found(sw, corenet.CapabilityURingSQRewind, true, "")
              to: ul.rep.found
          when: rewind
      - op: "|="
        set: base
        to: layoutFlags
        value: layoutFlags(sw, found, rewind)
      - set: ul.primary, ul.secondary
        value: base, base
      - opt:
          do:
            - set: ul.primary
              value: base&^setupCoopTaskrun | setupDeferTaskrun
          when: found&setupDeferTaskrun != 0 && sw.wants(corenet.CapabilityURingDeferTaskrun)
      - set: ul.uses.multishot
        to: sw.wants
        value: sw.wants(corenet.CapabilityURingMultishotRecv)
      - eval: ul.reportMinTimeout(features)
        to: ul.reportMinTimeout
  - of: layoutFlags
    steps:
      - var:
          name: flags
          type: uint32
      - bind: useRewind
        eval: rewind && sw.wants(corenet.CapabilityURingSQRewind)
      - opt:
          do:
            - op: "|="
              set: flags
              value: setupNoSQArray
          when: found&setupNoSQArray != 0 && (useRewind || sw.wants(corenet.CapabilityURingNoSQArray))
      - opt:
          do:
            - op: "|="
              set: flags
              value: setupSQRewind
          when: useRewind
      - return: flags
  - of: (*uLoop).reportMinTimeout
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).reportMinTimeout
        kind: self
      - id: ul.rep.set
        kind: internal
    steps:
      - bind: status, reason
        eval: statusAbsent, "IORING_FEAT_MIN_TIMEOUT not advertised; "+reasonClassB
      - opt:
          do:
            - set: status, reason
              value: statusAvailable, reasonClassB
          when: features&featMinTimeout != 0
      - eval: ul.rep.set(corenet.CapabilityURingMinTimeout, status, reason)
        to: ul.rep.set
  - of: (*uLoop).reportSelfTest
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).reportSelfTest
        kind: self
      - id: ul.rep.found
        kind: internal
      - id: ul.reportSockCmd
        kind: internal
      - id: ul.rep.set
        kind: internal
    steps:
      - eval: ul.rep.found(ul.sw, corenet.CapabilityURingPbuf, true, "")
        to: ul.rep.found
      - eval: ul.rep.found(ul.sw, corenet.CapabilityURingMultishotRecv, true, "")
        to: ul.rep.found
      - eval: ul.reportSockCmd(direct)
        to: ul.reportSockCmd
      - opt:
          do:
            - return: ""
          when: ul.sw.disabled(corenet.CapabilityURingDirect)
      - opt:
          do:
            - eval: "ul.rep.set(corenet.CapabilityURingDirect, statusUnprobed, \"a Unix listener without uring-sock-getsockopt: LoopPeer asks the process descriptor\")"
              to: ul.rep.set
            - return: ""
          when: slices.Contains(ul.peers.unix, true) && !ul.peers.cmd
      - bind: reason
        eval: "\"\""
      - opt:
          do:
            - set: reason
              value: "\"release check: the peer saw no end within 200 ms\""
          when: "!direct"
      - eval: ul.rep.found(ul.sw, corenet.CapabilityURingDirect, direct, reason)
        to: ul.rep.found
  - of: (*uLoop).registerRing
    steps:
      - opt:
          do:
            - return: ""
          when: "!ul.uses.ringFDs || ul.registered >= ringFDsMax || u.registerRing() != 0"
      - op: ++
        set: ul.registered
  - of: probeReason
    steps:
      - opt:
          do:
            - return: "\"probe defect: \" + step + \": \" + errno.Error()"
          when: errno == syscall.EEXIST
      - return: "step + \": \" + errno.Error()"
  - of: (*uLoop).reportSockCmd
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).reportSockCmd
        kind: self
      - id: ul.rep.set
        kind: internal
    steps:
      - switch:
          cases:
            - case: "!slices.Contains(ul.peers.unix, true)"
              do:
                - eval: ul.rep.set(corenet.CapabilityURingSockGetsockopt, statusUnprobed, "no Unix listener")
                  to: ul.rep.set
            - case: ul.sw.disabled(corenet.CapabilityURingDirect)
              do:
                - eval: "ul.rep.set(corenet.CapabilityURingSockGetsockopt, statusUnprobed, \"uring-direct switched off: LoopPeer asks the process descriptor\")"
                  to: ul.rep.set
            - case: "!ul.peers.cmd"
              do:
                - eval: ul.rep.set(corenet.CapabilityURingSockGetsockopt, statusAbsent, ul.peers.why)
                  to: ul.rep.set
            - case: "!direct"
              do:
                - eval: "ul.rep.set(corenet.CapabilityURingSockGetsockopt, statusAvailable, \"process descriptors: LoopPeer asks the socket\")"
                  to: ul.rep.set
            - default: true
              do:
                - eval: ul.rep.set(corenet.CapabilityURingSockGetsockopt, statusOn, "")
                  to: ul.rep.set
  - of: slowFanWake
    participants:
      - id: caller
        kind: actor
      - id: slowFanWake
        kind: self
      - id: fanWakeOnce.Do
        kind: value
    steps:
      - eval: |-
          fanWakeOnce.Do(func() {
          		fanProbed = probeFanWake(true)
          		secondaryWake.Store(fanProbed)
          	})
        to: fanWakeOnce.Do
      - return: secondaryWakeVerdict() == wakeSlow
  - of: probeFanWake
    participants:
      - id: caller
        kind: actor
      - id: probeFanWake
        kind: self
      - id: runtime
        kind: stdlib
      - id: fanWakeRig
        kind: internal
      - id: fanWakeWait
        kind: internal
    steps:
      - eval: runtime.LockOSThread()
        to: runtime
      - defer: runtime.UnlockOSThread()
        to: runtime
      - bind: rings, fds, ok
        eval: fanWakeRig(register)
        to: fanWakeRig
      - defer: |-
          func() {
          		for _, u := range rings {
          			u.close()
          		}
          		closeFDs(fds)
          	}()
      - opt:
          do:
            - return: wakePrompt
          when: "!ok"
      - bind: wrote
        eval: make(chan time.Time, 1)
      - go: |-
          func() {
          		time.Sleep(fanWakeDelay)
          		at := time.Now()
          		_, err := syscall.Write(fds[2], []byte{1})
          		swallowErr(err)
          		wrote <- at
          	}()
      - bind: woke
        eval: fanWakeWait(rings[0])
        to: fanWakeWait
      - bind: at
        eval: <-wrote
      - opt:
          do:
            - return: wakeSlow
          when: woke.IsZero() || woke.Sub(at) >= fanWakeSlow
      - return: wakePrompt
  - of: fanWakeRig
    participants:
      - id: caller
        kind: actor
      - id: fanWakeRig
        kind: self
      - id: syscall
        kind: stdlib
      - id: openURing
        kind: internal
      - id: prepPollMulti
        kind: internal
      - id: rings[1].submit
        kind: internal
      - id: rings[0].submit
        kind: internal
    steps:
      - bind: efd, _, e
        eval: syscall.RawSyscall(syscall.SYS_EVENTFD2, 0, efdNonblock|efdCloexec, 0)
        to: syscall
      - opt:
          do:
            - return: nil, nil, false
          when: e != 0
      - set: fds
        value: append(fds, int(efd))
      - var:
          name: p
          type: "[2]int"
      - opt:
          do:
            - return: nil, fds, false
          init:
            bind: err
            eval: syscall.Pipe2(p[:], syscall.O_NONBLOCK|syscall.O_CLOEXEC)
            to: syscall
          when: err != nil
      - set: fds
        value: append(fds, p[0], p[1])
      - loop:
          do:
            - bind: u, _, errno
              eval: openURing(probeEntries, setupCoopTaskrun|setupSingleIssuer)
              to: openURing
            - opt:
                do:
                  - set: u, _, errno
                    to: openURing
                    value: openURing(probeEntries, 0)
                when: errno == syscall.EINVAL
            - opt:
                do:
                  - return: rings, fds, false
                when: errno != 0
            - set: rings
              value: append(rings, u)
          range: "2"
      - opt:
          do:
            - return: rings, fds, false
          when: register && uringRegister(rings[1].fd, regEventFD, unsafe.Pointer(new(int32(efd))), 1) != 0
      - bind: sa, sb
        eval: rings[0].get(), rings[1].get()
      - opt:
          do:
            - return: rings, fds, false
          when: sa == nil || sb == nil
      - eval: prepPollMulti(sa, int(efd), fanUDEvent)
        to: prepPollMulti
      - eval: prepPollMulti(sb, p[0], fanUDPipe)
        to: prepPollMulti
      - eval: rings[1].submit()
        to: rings[1].submit
      - eval: rings[0].submit()
        to: rings[0].submit
      - return: rings, fds, true
  - of: fanWakeWait
    participants:
      - id: caller
        kind: actor
      - id: fanWakeWait
        kind: self
      - id: time.Now().Add
        kind: value
      - id: u.wait
        kind: internal
      - id: time
        kind: stdlib
    steps:
      - bind: deadline
        eval: time.Now().Add(fanWakeBound)
        to: time.Now().Add
      - loop:
          cond: left > 0
          do:
            - eval: "u.wait(new(kernelTimespec{nsec: int64(left)}), 1)"
              to: u.wait
            - opt:
                do:
                  - return: time.Now()
                    to: time
                when: fanEventReaped(u)
          init: left := time.Until(deadline)
          post: left = time.Until(deadline)
      - return: time.Time{}
  - of: fanEventReaped
    participants:
      - id: caller
        kind: actor
      - id: fanEventReaped
        kind: self
      - id: u.reap
        kind: internal
    steps:
      - bind: got
        eval: "false"
      - eval: u.reap(int(probeEntries), func(c *cqe) { got = got || c.userData == fanUDEvent })
        to: u.reap
      - return: got
  - of: fanTickFor
    steps:
      - opt:
          do:
            - return: "kernelTimespec{nsec: int64(tickEvery)}"
          when: rings < 2 || !slowFanWake()
      - return: "kernelTimespec{nsec: int64(fanWakeTick)}"
  - of: (*uLoop).watchFan
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).watchFan
        kind: self
      - id: secondaryWake.Store
        kind: value
    steps:
      - bind: lp
        eval: ul.lp
      - opt:
          do:
            - return: ""
          when: len(ul.rings) < 2 || ul.fan.nsec <= int64(fanWakeTick) || !plain || lp.ended == 0 || ul.hooks.fanUnwatched || ul.fanReaped == 0
      - opt:
          do:
            - set: ul.fanMissed
              value: "0"
            - return: ""
          when: lp.started-lp.ended < fanWakeSlow
      - op: ++
        set: ul.fanMissed
      - opt:
          do:
            - return: ""
          when: ul.fanMissed < fanMissedLimit
      - set: ul.fan
        value: "kernelTimespec{nsec: int64(fanWakeTick)}"
      - eval: secondaryWake.Store(wakeSlow)
        to: secondaryWake.Store
  - of: udPack
    steps:
      - return: op<<56 | uint64(gen&genMask)<<32 | uint64(slot)
  - of: udOp
    steps:
      - return: ud >> 56
  - of: udGen
    steps:
      - return: uint32(ud>>32) & genMask
  - of: udSlot
    steps:
      - return: uint32(ud)
  - of: (*uringRunner).drain
    participants:
      - id: caller
        kind: actor
      - id: (*uringRunner).drain
        kind: self
      - id: ul.drainReq.Store
        kind: value
      - id: ul.wake
        kind: internal
    steps:
      - loop:
          do:
            - eval: ul.drainReq.Store(true)
              to: ul.drainReq.Store
            - eval: ul.wake()
              to: ul.wake
          key: _
          range: ur.loops
          value: ul
  - of: (*uringRunner).stop
    participants:
      - id: caller
        kind: actor
      - id: (*uringRunner).stop
        kind: self
      - id: ul.stopReq.Store
        kind: value
      - id: ul.wake
        kind: internal
    steps:
      - loop:
          do:
            - eval: ul.stopReq.Store(true)
              to: ul.stopReq.Store
            - eval: ul.wake()
              to: ul.wake
          key: _
          range: ur.loops
          value: ul
  - of: (*uringRunner).wait
    steps:
      - eval: <-ur.fin
  - of: (*uringRunner).done
    steps:
      - return: ur.fin
  - of: (*uLoop).wake
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).wake
        kind: self
      - id: syscall
        kind: stdlib
      - id: swallowErr
        kind: internal
    steps:
      - lock:
          mutex: ul.wakeMu
      - opt:
          do:
            - return: ""
          when: ul.evClosed || ul.wakefd < 0
      - bind: one
        eval: new(uint64(1))
      - bind: _, _, errno
        eval: syscall.RawSyscall(syscall.SYS_WRITE, uintptr(ul.wakefd), uintptr(unsafe.Pointer(one)), 8)
        to: syscall
      - eval: swallowErr(errno)
        to: swallowErr
  - of: startIOURing
    participants:
      - id: caller
        kind: actor
      - id: startIOURing
        kind: self
      - id: newSwitches
        kind: internal
      - id: probeError
        kind: internal
      - id: listenerRows
        kind: internal
      - id: ownersOf
        kind: internal
      - id: newListenerSet
        kind: internal
      - id: newLoop
        kind: internal
      - id: ul.rep.apply
        kind: internal
      - id: runner.wg.Add
        kind: value
      - id: ul.run
        kind: internal
      - id: runner.stop
        kind: internal
      - id: runner.wait
        kind: internal
      - id: reportAffinity
        kind: internal
    steps:
      - bind: sw
        eval: newSwitches(cfg)
        to: newSwitches
      - opt:
          do:
            - return: probeError("uring-pbuf switched off", syscall.EOPNOTSUPP)
              to: probeError
          when: sw.disabled(corenet.CapabilityURingPbuf)
      - bind: fin
        eval: make(chan struct{})
      - bind: runner
        eval: "&uringRunner{fin: fin}"
      - bind: lfds, rows
        eval: listenerRows(cfg, sw)
        to: listenerRows
      - set: runner.lfds
        value: lfds
      - bind: owners
        eval: ownersOf(cfg.Listeners)
        to: ownersOf
      - set: runner.set
        to: newListenerSet
        value: newListenerSet(runner.lfds, takersOfShards(owners, g.sz.loops, g.sz.rings))
      - bind: ready
        eval: make(chan error, g.sz.loops)
      - loop:
          do:
            - bind: lp
              eval: newLoop(g, *cfg, i, mmapAnon, syscall.Munmap)
              to: newLoop
            - bind: ul
              eval: "&uLoop{lp: lp, lfds: runner.lfds, owners: owners, set: runner.set, hooks: cfg.hooks, wakefd: -1, fanfd: -1, sw: sw, rep: newReport(sw, \"iouring\"), spacing: tickEvery}"
            - eval: ul.rep.apply(rows)
              to: ul.rep.apply
            - set: runner.loops
              value: append(runner.loops, ul)
            - set: g.loops
              value: append(g.loops, lp)
            - eval: runner.wg.Add(1)
              to: runner.wg.Add
            - go: ul.run(&runner.wg, ready, g.sz.rings)
              to: ul.run
          key: i
          range: g.sz.loops
      - var:
          name: first
          type: error
      - loop:
          do:
            - opt:
                do:
                  - set: first
                    value: err
                init:
                  bind: err
                  eval: <-ready
                when: err != nil && first == nil
          range: g.sz.loops
      - set: g.ctl
        value: runner
      - go: |-
          func() {
          		runner.wg.Wait()
          		close(fin)
          	}()
      - opt:
          do:
            - eval: runner.stop()
              to: runner.stop
            - eval: runner.wait()
              to: runner.wait
            - set: g.loops
              value: nil
            - return: first
          when: first != nil
      - go: |-
          func() {
          		<-fin
          		runner.set.closeRest()
          	}()
      - set: g.backend
        value: corenet.LoopBackendIOURing
      - set: g.stage
        value: runner.loops[0].stage
      - set: g.caps
        value: runner.loops[0].rep
      - eval: reportAffinity(&g.caps, g.loops)
        to: reportAffinity
      - return: nil
  - of: probeError
    participants:
      - id: caller
        kind: actor
      - id: probeError
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(corenet.LoopBackendUnavailable, errs.WrapParams{},
          		errs.String("stage", stage), errs.String("reason", errno.Error()))
        to: errs
  - of: (*uLoop).run
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).run
        kind: self
      - id: wg.Done
        kind: value
      - id: runtime
        kind: stdlib
      - id: syscall
        kind: stdlib
      - id: threadCheck
        kind: internal
      - id: ul.lp.pin
        kind: internal
      - id: ul.setup
        kind: internal
      - id: ul.teardown
        kind: internal
      - id: slowFanWake
        kind: internal
      - id: ul.serve
        kind: internal
    steps:
      - defer: wg.Done()
        to: wg.Done
      - eval: runtime.LockOSThread()
        to: runtime
      - set: ul.tid
        to: syscall
        value: syscall.Gettid()
      - set: ul.lp.threadOK
        to: threadCheck
