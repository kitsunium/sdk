      - eval: storeU(&p.closed, &o.closed, s.closed)
        to: storeU
      - eval: storeU(&p.batches, &o.batches, s.batches)
        to: storeU
      - eval: storeU(&p.completions, &o.completions, s.completions)
        to: storeU
      - eval: storeU(&p.starved, &o.starved, s.starved)
        to: storeU
      - eval: storeU(&p.retries, &o.retries, s.retries)
        to: storeU
      - eval: storeU(&p.pauses, &o.pauses, s.pauses)
        to: storeU
      - eval: storeU(&p.evicted, &o.evicted, s.evicted)
