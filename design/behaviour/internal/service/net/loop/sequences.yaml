  - of: (*uLoop).onFD
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).onFD
        kind: self
      - id: onProcessFD
        kind: internal
    steps:
      - opt:
          do:
            - eval: onProcessFD(s)
              to: onProcessFD
          when: "!ul.direct"
  - of: (*uRing).pollFD
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).pollFD
        kind: self
      - id: rr.u.get
        kind: internal
      - id: prepPollMulti
        kind: internal
    steps:
      - bind: s
        eval: rr.u.get()
        to: rr.u.get
      - opt:
          do:
            - op: ++
              set: rr.r.st.retries
            - return: ""
          when: s == nil
      - eval: prepPollMulti(s, fd, udPack(op, 0, 0))
        to: prepPollMulti
  - of: (*uRing).armAccepts
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).armAccepts
        kind: self
      - id: rr.acceptRoom
        kind: internal
      - id: rr.u.get
        kind: internal
      - id: prepAccept
        kind: internal
      - id: rr.ul.onFD
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: rr.acceptsNothing()
      - bind: room
        eval: rr.acceptRoom()
        to: rr.acceptRoom
      - loop:
          do:
            - loop:
                cond: rr.armed[i] < acceptDepth && room > 0
                do:
                  - bind: s
                    eval: rr.u.get()
                    to: rr.u.get
                  - opt:
                      do:
                        - op: ++
                          set: rr.r.st.retries
                        - return: ""
                      when: s == nil
                  - eval: prepAccept(s, fd, udPack(udAccept, 0, uint32(i)), false)
                    to: prepAccept
                  - eval: rr.ul.onFD(s)
                    to: rr.ul.onFD
                  - op: ++
                    set: rr.armed[i]
                  - op: "--"
                    set: room
          key: i
          range: rr.ul.lfds
          value: fd
  - of: (*uRing).acceptsNothing
    steps:
      - return: rr.paused || rr.r.draining || rr.ul.lp.draining || (rr.ul.hooks.primaryIdle && rr.r.index == 0)
  - of: (*uRing).acceptRoom
    steps:
      - bind: table
        eval: rr.ul.lp.sz.tableSize
      - bind: reserve
        eval: max(min(acceptReserve, table/8), 1)
      - bind: inFlight
        eval: "0"
      - loop:
          do:
            - op: +=
              set: inFlight
              value: "n"
          key: _
          range: rr.armed
          value: "n"
      - return: max(table-rr.used()-reserve-inFlight+1, 0)
  - of: (*uRing).cancelAccept
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).cancelAccept
        kind: self
      - id: rr.u.get
        kind: internal
      - id: prepCancelUserData
        kind: internal
    steps:
      - bind: s
        eval: rr.u.get()
        to: rr.u.get
      - opt:
          do:
            - op: ++
              set: rr.r.st.retries
            - return: "false"
          when: s == nil
      - eval: prepCancelUserData(s, udPack(udAccept, 0, uint32(i)), udPack(udAcceptCancel, 0, uint32(i)))
        to: prepCancelUserData
      - return: "true"
  - of: (*uRing).takeQueues
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).takeQueues
        kind: self
      - id: rr.takeQueue
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - eval: rr.takeQueue(i, fd)
                    to: rr.takeQueue
                when: "!rr.queueDone[i]"
          key: i
          range: rr.ul.lfds
          value: fd
  - of: (*uRing).takeQueue
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).takeQueue
        kind: self
      - id: queued
        kind: internal
      - id: rr.cancelAccept
        kind: internal
      - id: rr.ul.set.handBack
        kind: internal
      - id: rr.armTake
        kind: internal
    steps:
      - bind: q
        eval: "0"
      - opt:
          do:
            - set: q
              to: queued
              value: queued(fd)
          when: rr.take == takeOn && rr.taken[i] < queueTakeMax
      - opt:
          do:
            - opt:
                do:
                  - set: rr.queueCancel[i]
                    to: rr.cancelAccept
                    value: rr.cancelAccept(i)
                when: q == 0 && !rr.queueCancel[i]
            - return: ""
          when: rr.armed[i] > 0
      - set: rr.queueCancel[i]
        value: "false"
      - opt:
          do:
            - set: rr.queueDone[i]
              value: "true"
            - eval: rr.ul.set.handBack(i)
              to: rr.ul.set.handBack
            - return: ""
          when: q == 0
      - bind: "n"
        eval: min(q, acceptDepth, rr.acceptRoom(), queueTakeMax-rr.taken[i])
      - opt:
          do:
            - return: ""
          when: n == 0 || (rr.paused && rr.ul.lp.tick < rr.resumeAt)
      - op: +=
        set: rr.taken[i]
        to: rr.armTake
        value: rr.armTake(i, fd, n)
  - of: (*uRing).armTake
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).armTake
        kind: self
      - id: rr.u.get
        kind: internal
      - id: prepAccept
        kind: internal
      - id: rr.ul.onFD
        kind: internal
    steps:
      - loop:
          do:
            - bind: s
              eval: rr.u.get()
              to: rr.u.get
            - opt:
                do:
                  - op: ++
                    set: rr.r.st.retries
                  - return: k
                when: s == nil
            - eval: prepAccept(s, fd, udPack(udAccept, 0, uint32(i)), false)
              to: prepAccept
            - eval: rr.ul.onFD(s)
              to: rr.ul.onFD
            - op: ++
              set: rr.armed[i]
          key: k
          range: "n"
      - return: "n"
  - of: (*uRing).used
    steps:
      - return: len(rr.r.conns) - len(rr.r.free)
  - of: (*uRing).pace
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).pace
        kind: self
      - id: rr.cancelAccepts
        kind: internal
      - id: rr.r.evict
        kind: internal
      - id: rr.armAccepts
        kind: internal
    steps:
      - bind: table
        eval: rr.ul.lp.sz.tableSize
      - bind: reserve
        eval: min(acceptReserve, table/8)
      - bind: free
        eval: table - rr.used()
      - opt:
          do:
            - set: rr.paused
              value: "true"
            - op: ++
              set: rr.r.st.pauses
            - eval: rr.cancelAccepts()
              to: rr.cancelAccepts
            - return: ""
          when: "!rr.paused && free < max(reserve, 1)"
      - opt:
          do:
            - set: rr.paused
              value: "false"
          when: rr.paused && free >= max(2*reserve, 1) && rr.ul.lp.tick >= rr.resumeAt
      - opt:
          do:
            - eval: rr.r.evict()
              to: rr.r.evict
          when: rr.ul.lp.hard && !rr.ul.direct
      - eval: rr.armAccepts()
        to: rr.armAccepts
  - of: (*uLoop).serve
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).serve
        kind: self
      - id: ul.batch
        kind: internal
      - id: ul.closeAll
        kind: internal
    steps:
      - bind: lp
        eval: ul.lp
      - bind: tick
        eval: "kernelTimespec{nsec: int64(tickEvery)}"
      - loop:
          do:
            - eval: ul.batch(&tick)
              to: ul.batch
            - opt:
                do:
                  - break: true
                when: ul.stopReq.Load() || (lp.draining && ul.live() == 0 && ul.queuesTaken())
          forever: true
      - eval: ul.closeAll()
        to: ul.closeAll
  - of: (*uLoop).batch
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).batch
        kind: self
      - id: rr.u.submit
        kind: internal
      - id: ul.rings[0].u.wait
        kind: internal
      - id: time
        kind: stdlib
      - id: lp.now
        kind: internal
      - id: rr.reapAll
        kind: internal
      - id: ul.control
        kind: internal
      - id: rr.r.wheel.advance
        kind: internal
      - id: rr.pace
        kind: internal
      - id: rr.watchdog
        kind: internal
      - id: rr.sweep
        kind: internal
      - id: lp.h.OnBatchEnd
        kind: value
      - id: lp.endBatch
        kind: internal
      - id: rr.returnBuffers
        kind: internal
    steps:
      - bind: lp
        eval: ul.lp
      - loop:
          do:
            - eval: rr.u.submit()
              to: rr.u.submit
          key: _
          range: ul.rings[1:]
          value: rr
      - eval: ul.rings[0].u.wait(tick)
        to: ul.rings[0].u.wait
      - bind: started
        eval: time.Now()
        to: time
      - set: lp.tick
        to: lp.now
        value: lp.now()
      - loop:
          do:
            - eval: rr.reapAll()
              to: rr.reapAll
          key: _
          range: ul.rings
          value: rr
      - eval: ul.control()
        to: ul.control
      - loop:
          do:
            - eval: rr.r.wheel.advance(lp.tick, rr.r.expire)
              to: rr.r.wheel.advance
            - eval: rr.pace()
              to: rr.pace
            - eval: rr.watchdog()
              to: rr.watchdog
            - eval: rr.sweep()
              to: rr.sweep
          key: _
          range: ul.rings
          value: rr
      - eval: lp.h.OnBatchEnd(lp)
        to: lp.h.OnBatchEnd
      - eval: lp.endBatch(started)
        to: lp.endBatch
      - loop:
          do:
            - eval: rr.returnBuffers()
              to: rr.returnBuffers
            - set: rr.r.st.retries
              value: rr.u.retries
          key: _
          range: ul.rings
          value: rr
  - of: (*uLoop).live
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).live
        kind: self
      - id: rr.used
        kind: internal
    steps:
      - bind: "n"
        eval: "0"
      - loop:
          do:
            - op: +=
              set: "n"
              to: rr.used
              value: rr.used()
          key: _
          range: ul.rings
          value: rr
      - return: "n"
  - of: (*uRing).reapAll
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).reapAll
        kind: self
      - id: rr.u.reap
        kind: internal
      - id: rr.u.submit
        kind: internal
    steps:
      - loop:
          do:
            - bind: "n"
              eval: rr.u.reap(rr.ul.lp.sz.cqBatch, rr.handle)
              to: rr.u.reap
            - op: +=
              set: rr.r.st.completions
              value: uint64(n)
            - opt:
                do:
                  - eval: rr.u.submit()
                    to: rr.u.submit
                  - continue: true
                when: rr.u.overflowed()
            - opt:
                do:
                  - return: ""
                when: n == 0
          range: reapRounds
  - of: (*uRing).handle
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).handle
        kind: self
      - id: udOp
        kind: internal
      - id: rr.onAccept
        kind: internal
      - id: rr.onConnOp
        kind: internal
      - id: rr.onWake
        kind: internal
      - id: rr.onFan
        kind: internal
    steps:
      - bind: ud
        eval: c.userData
      - switch:
          cases:
            - case: udAccept
              do:
                - eval: rr.onAccept(int(udSlot(ud)), c)
                  to: rr.onAccept
            - case: udRecv, udSend, udCancel, udClose, udShutdown
              do:
                - eval: rr.onConnOp(op, int32(udSlot(ud)), udGen(ud), c)
                  to: rr.onConnOp
            - case: udWake
              do:
                - eval: rr.onWake(c)
                  to: rr.onWake
            - case: udFan
              do:
                - eval: rr.onFan(c)
                  to: rr.onFan
            - case: udOrphanClose, udAcceptCancel
          init:
            bind: op
            eval: udOp(ud)
            to: udOp
          "on": op
  - of: (*uRing).onConnOp
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).onConnOp
        kind: self
      - id: rr.onRecv
        kind: internal
      - id: rr.onSend
        kind: internal
      - id: rr.opDone
        kind: internal
      - id: rr.onClose
        kind: internal
    steps:
      - switch:
          cases:
            - case: udRecv
              do:
                - eval: rr.onRecv(slot, gen, c)
                  to: rr.onRecv
            - case: udSend
              do:
                - eval: rr.onSend(slot, gen, c)
                  to: rr.onSend
            - case: udCancel, udShutdown
              do:
                - eval: rr.opDone(slot, gen)
                  to: rr.opDone
            - case: udClose
              do:
                - eval: rr.onClose(slot, gen)
                  to: rr.onClose
          "on": op
  - of: (*uRing).onAccept
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).onAccept
        kind: self
      - id: rr.armAccepts
        kind: internal
      - id: rr.acceptFailed
        kind: internal
      - id: lp.grp.rejected.Add
        kind: value
      - id: rr.orphanClose
        kind: internal
      - id: r.take
        kind: internal
      - id: rr.armRecv
        kind: internal
      - id: r.opened
        kind: internal
    steps:
      - bind: r, lp
        eval: rr.r, rr.ul.lp
      - set: rr.lastAccept
        value: lp.tick
      - set: rr.stalls
        value: "0"
      - opt:
          do:
            - op: "--"
              set: rr.armed[li]
          when: c.flags&cqeFMore == 0 && li < len(rr.armed) && rr.armed[li] > 0
      - defer: rr.armAccepts()
        to: rr.armAccepts
      - opt:
          do:
            - eval: rr.acceptFailed(c.res)
              to: rr.acceptFailed
            - return: ""
          when: c.res < 0
      - bind: index
        eval: uint32(c.res)
      - opt:
          do:
            - eval: lp.grp.rejected.Add(1)
              to: lp.grp.rejected.Add
            - eval: rr.orphanClose(index)
              to: rr.orphanClose
            - return: ""
          when: rr.refuses(index)
      - bind: slot, ok
        eval: r.take(int32(index))
        to: r.take
      - opt:
          do:
            - eval: lp.grp.rejected.Add(1)
              to: lp.grp.rejected.Add
            - eval: rr.orphanClose(index)
              to: rr.orphanClose
            - return: ""
          when: "!ok"
      - set: rr.slotOf[index]
        value: slot
      - set: rr.backoff
        value: backoffMin
      - eval: rr.armRecv(slot)
        to: rr.armRecv
      - eval: r.opened(slot)
        to: r.opened
  - of: (*uRing).acceptFailed
    steps:
      - opt:
          do:
            - set: rr.take
              value: takeOff
          when: rr.ul.lp.draining && !takeWaits(res)
      - opt:
          do:
            - set: rr.paused
              value: "true"
            - op: ++
              set: rr.r.st.pauses
            - opt:
                do:
                  - set: rr.resumeAt
                    value: rr.ul.lp.tick + rr.backoff
                  - set: rr.backoff
                    value: min(rr.backoff*2, backoffMax)
                  - set: rr.ul.lp.hard
                    value: "true"
                when: "!rr.ul.direct"
          when: res == -int32(syscall.ENFILE) || res == -int32(syscall.EMFILE)
  - of: takeWaits
    steps:
      - switch:
          cases:
            - case: syscall.ECANCELED, syscall.ECONNABORTED, syscall.EINTR, syscall.EAGAIN, syscall.ENFILE, syscall.EMFILE
              do:
                - return: "true"
            - default: true
              do:
                - return: "false"
          "on": syscall.Errno(-res)
  - of: (*uRing).refuses
    steps:
      - bind: lp
        eval: rr.ul.lp
      - return: (rr.r.draining && !lp.draining) || (lp.sz.maxConns > 0 && lp.grp.live.Load() >= int64(lp.sz.maxConns)) || int(index) >= len(rr.slotOf)
  - of: (*uRing).orphanClose
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).orphanClose
        kind: self
      - id: closeFDs
        kind: internal
      - id: rr.u.get
        kind: internal
      - id: prepCloseDirect
        kind: internal
    steps:
      - opt:
          do:
            - eval: closeFDs([]int{int(index)})
              to: closeFDs
            - return: ""
          when: "!rr.ul.direct"
      - bind: s
        eval: rr.u.get()
        to: rr.u.get
      - opt:
          do:
            - op: ++
              set: rr.r.st.retries
            - return: ""
          when: s == nil
      - eval: prepCloseDirect(s, index, udPack(udOrphanClose, 0, index))
        to: prepCloseDirect
  - of: (*uRing).armRecv
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).armRecv
        kind: self
      - id: rr.u.get
        kind: internal
      - id: rr.r.fail
        kind: internal
      - id: prepRecv
        kind: internal
      - id: singleShot
        kind: internal
      - id: rr.ul.onFD
        kind: internal
      - id: rr.setEpoch
        kind: internal
    steps:
      - bind: c
        eval: "&rr.r.conns[slot]"
      - bind: s
        eval: rr.u.get()
        to: rr.u.get
      - opt:
          do:
            - op: ++
              set: rr.r.st.retries
            - eval: rr.r.fail(slot, rErrno, int32(syscall.EBUSY))
              to: rr.r.fail
            - return: ""
          when: s == nil
      - eval: prepRecv(s, uint32(c.fd), udPack(udRecv, c.gen, uint32(slot)))
        to: prepRecv
      - opt:
          do:
            - eval: singleShot(s)
              to: singleShot
          when: "!rr.ul.uses.multishot"
      - eval: rr.ul.onFD(s)
        to: rr.ul.onFD
      - op: ++
        set: c.ops
      - eval: rr.setEpoch(slot, rr.closes)
        to: rr.setEpoch
  - of: (*uRing).setEpoch
    steps:
      - opt:
          do:
            - return: ""
          when: "!rr.sweepOn"
      - loop:
          cond: int(slot) >= len(rr.armEpoch)
          do:
            - set: rr.armEpoch
              value: append(rr.armEpoch, noEpoch)
      - set: rr.armEpoch[slot]
        value: epoch
  - of: (*uRing).owns
    steps:
      - return: int(slot) < len(rr.r.conns) && rr.r.conns[slot].gen&genMask == gen
  - of: (*uRing).onRecv
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).onRecv
        kind: self
      - id: rr.setEpoch
        kind: internal
      - id: rr.recvBytes
        kind: internal
      - id: rr.recvStarved
        kind: internal
      - id: rr.recvEOF
        kind: internal
      - id: rr.recvCancelled
        kind: internal
      - id: rr.failLive
        kind: internal
      - id: rr.maybeClose
        kind: internal
    steps:
      - bind: more
        eval: c.flags&cqeFMore != 0
      - opt:
          do:
            - set: rr.recycle
              value: append(rr.recycle, uint16(c.flags>>cqeBufferShift))
            - op: "--"
              set: rr.inRing
          when: c.flags&cqeFBuffer != 0
      - opt:
          do:
            - return: ""
          when: "!rr.owns(slot, gen)"
      - opt:
          do:
            - op: "--"
              set: rr.r.conns[slot].ops
            - eval: rr.setEpoch(slot, noEpoch)
              to: rr.setEpoch
          when: "!more"
      - switch:
          cases:
            - case: c.res > 0 && c.flags&cqeFBuffer != 0
              do:
                - eval: rr.recvBytes(slot, uint16(c.flags>>cqeBufferShift), c.res, more)
                  to: rr.recvBytes
            - case: c.res == -int32(errnoENOBUFS)
              do:
                - eval: rr.recvStarved(slot)
                  to: rr.recvStarved
            - case: c.res == 0
              do:
                - eval: rr.recvEOF(slot)
                  to: rr.recvEOF
            - case: c.res == -int32(errnoECANCELED)
              do:
                - eval: rr.recvCancelled(slot, more)
                  to: rr.recvCancelled
            - default: true
              do:
                - eval: rr.failLive(slot, -c.res)
                  to: rr.failLive
      - eval: rr.maybeClose(slot)
        to: rr.maybeClose
  - of: (*uRing).recvCancelled
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).recvCancelled
        kind: self
      - id: rr.armRecv
        kind: internal
    steps:
      - opt:
          do:
            - eval: rr.armRecv(slot)
              to: rr.armRecv
          when: "!more && rr.r.conns[slot].state == stOpen"
  - of: (*uRing).recvBytes
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).recvBytes
        kind: self
      - id: rr.r.deliver
        kind: internal
      - id: rr.armRecv
        kind: internal
    steps:
      - opt:
          do:
            - eval: rr.r.deliver(slot, rr.u.buf(bid)[:n])
              to: rr.r.deliver
          when: rr.r.conns[slot].state == stOpen
      - opt:
          do:
            - eval: rr.armRecv(slot)
              to: rr.armRecv
          when: "!more && rr.r.conns[slot].state == stOpen"
  - of: (*uRing).recvStarved
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).recvStarved
        kind: self
      - id: rr.r.fail
        kind: internal
    steps:
      - op: ++
        set: rr.r.st.starved
      - bind: open
        eval: rr.r.conns[slot].state == stOpen
      - alt:
          - do:
              - set: rr.starved
                value: append(rr.starved, slot)
            when: open && len(rr.starved) < starvedCap
          - do:
              - eval: rr.r.fail(slot, rErrno, int32(errnoENOBUFS))
                to: rr.r.fail
            when: open
  - of: (*uRing).recvEOF
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).recvEOF
        kind: self
      - id: rr.r.markDirty
        kind: internal
    steps:
      - bind: cc
        eval: "&rr.r.conns[slot]"
      - opt:
          do:
            - op: "|="
              set: cc.flags
              value: fPeerDone
            - eval: rr.r.markDirty(slot)
              to: rr.r.markDirty
          when: cc.state == stOpen
  - of: (*uRing).failLive
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).failLive
        kind: self
      - id: rr.r.fail
        kind: internal
    steps:
      - bind: state
        eval: rr.r.conns[slot].state
      - opt:
          do:
            - eval: rr.r.fail(slot, rErrno, errno)
              to: rr.r.fail
          when: state == stOpen || state == stClosing
  - of: (*uRing).onSend
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).onSend
        kind: self
      - id: rr.sendFlight
        kind: internal
      - id: rr.failLive
        kind: internal
      - id: rr.maybeClose
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "!rr.owns(slot, gen)"
      - bind: cc
        eval: "&rr.r.conns[slot]"
      - op: "--"
        set: cc.ops
      - switch:
          cases:
            - case: c.res > 0
              do:
                - opt:
                    do:
                      - return: ""
                    when: rr.sendProgress(slot, c.res)
            - case: c.res == -int32(errnoECANCELED)
              do:
                - op: "&^="
                  set: cc.flags
                  value: fSending
                - opt:
                    do:
                      - eval: rr.sendFlight(slot)
                        to: rr.sendFlight
                      - return: ""
                    when: cc.state == stOpen || cc.state == stClosing
            - default: true
              do:
                - op: "&^="
                  set: cc.flags
                  value: fSending
                - eval: rr.failLive(slot, -c.res)
                  to: rr.failLive
      - eval: rr.maybeClose(slot)
        to: rr.maybeClose
  - of: (*uRing).sendProgress
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).sendProgress
        kind: self
      - id: rr.sendFlight
        kind: internal
      - id: rr.ul.lp.slab.free
        kind: internal
      - id: r.sent
        kind: internal
      - id: r.markDirty
        kind: internal
    steps:
      - bind: r
        eval: rr.r
      - bind: cc
        eval: "&r.conns[slot]"
      - op: +=
        set: cc.flight.off
        value: "n"
      - bind: alive
        eval: cc.state == stOpen || cc.state == stClosing
      - opt:
          do:
            - eval: rr.sendFlight(slot)
              to: rr.sendFlight
            - return: "true"
          when: cc.flight.off < cc.flight.len && alive
      - eval: rr.ul.lp.slab.free(cc.flight)
        to: rr.ul.lp.slab.free
      - set: cc.flight
        value: "chunkRef{idx: noChunk}"
      - op: "&^="
        set: cc.flags
        value: fSending
      - opt:
          do:
            - eval: r.sent(slot, int(n))
              to: r.sent
            - eval: r.markDirty(slot)
              to: r.markDirty
          when: alive
      - return: "false"
  - of: (*uRing).opDone
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).opDone
        kind: self
      - id: rr.maybeClose
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "!rr.owns(slot, gen)"
      - op: "--"
        set: rr.r.conns[slot].ops
      - eval: rr.maybeClose(slot)
        to: rr.maybeClose
  - of: (*uRing).maybeClose
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).maybeClose
        kind: self
      - id: closeFDs
        kind: internal
      - id: rr.onClose
        kind: internal
      - id: rr.u.get
        kind: internal
      - id: prepCloseDirect
        kind: internal
    steps:
      - bind: c
        eval: "&rr.r.conns[slot]"
      - opt:
          do:
            - return: ""
          when: c.state != stDead || c.ops != 0
      - opt:
          do:
            - eval: closeFDs([]int{int(c.fd)})
              to: closeFDs
            - eval: rr.onClose(slot, c.gen&genMask)
              to: rr.onClose
            - return: ""
          when: "!rr.ul.direct"
      - bind: s
        eval: rr.u.get()
        to: rr.u.get
      - opt:
          do:
            - op: ++
              set: rr.r.st.retries
            - return: ""
          when: s == nil
      - eval: prepCloseDirect(s, uint32(c.fd), udPack(udClose, c.gen, uint32(slot)))
        to: prepCloseDirect
      - set: c.ops
        value: "1"
      - set: c.state
        value: stFree
      - op: ++
        set: rr.closes
  - of: (*uRing).onClose
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).onClose
        kind: self
      - id: rr.r.release
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "!rr.owns(slot, gen)"
      - bind: c
        eval: "&rr.r.conns[slot]"
      - bind: index
        eval: c.fd
      - opt:
          do:
            - set: rr.slotOf[index]
              value: "-1"
          when: index >= 0 && int(index) < len(rr.slotOf)
      - eval: rr.r.release(slot)
        to: rr.r.release
  - of: (*uRing).onWake
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).onWake
        kind: self
      - id: syscall
        kind: stdlib
      - id: swallowErr
        kind: internal
      - id: ul.lp.post.drain
        kind: internal
      - id: rr.pollFD
        kind: internal
    steps:
      - bind: ul
        eval: rr.ul
      - var:
          name: buf
          type: "[8]byte"
      - bind: _, _, errno
        eval: syscall.RawSyscall(syscall.SYS_READ, uintptr(ul.wakefd), uintptr(unsafe.Pointer(&buf[0])), 8)
        to: syscall
      - eval: swallowErr(errno)
        to: swallowErr
      - opt:
          do:
            - panic: "\"net/loop: Post consumer off its loop's thread\""
          when: ul.lp.threadOK != nil && !ul.lp.threadOK()
      - eval: ul.lp.post.drain(ul.lp)
        to: ul.lp.post.drain
      - opt:
          do:
            - eval: rr.pollFD(ul.wakefd, udWake)
              to: rr.pollFD
          when: c.flags&cqeFMore == 0
  - of: (*uRing).onFan
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).onFan
        kind: self
      - id: syscall
        kind: stdlib
      - id: swallowErr
        kind: internal
      - id: rr.pollFD
        kind: internal
    steps:
      - var:
          name: buf
          type: "[8]byte"
      - bind: _, _, errno
        eval: syscall.RawSyscall(syscall.SYS_READ, uintptr(rr.ul.fanfd), uintptr(unsafe.Pointer(&buf[0])), 8)
        to: syscall
      - eval: swallowErr(errno)
        to: swallowErr
      - opt:
          do:
            - eval: rr.pollFD(rr.ul.fanfd, udFan)
              to: rr.pollFD
          when: c.flags&cqeFMore == 0
  - of: (*uRing).returnBuffers
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).returnBuffers
        kind: self
      - id: slices
        kind: stdlib
      - id: rr.giveBack
        kind: internal
      - id: rr.rearmStarved
        kind: internal
    steps:
      - opt:
          do:
            - eval: slices.Reverse(rr.recycle)
              to: slices
          when: rr.ul.hooks.shuffle
      - eval: rr.giveBack()
        to: rr.giveBack
      - eval: rr.rearmStarved()
        to: rr.rearmStarved
  - of: (*uRing).giveBack
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).giveBack
        kind: self
      - id: fillStale
        kind: internal
      - id: u.addBuf
        kind: internal
      - id: u.publishBufs
        kind: internal
    steps:
      - bind: u
        eval: rr.u
      - loop:
          do:
            - opt:
                do:
                  - eval: fillStale(u.buf(bid))
                    to: fillStale
                when: rr.ul.hooks.fill
            - eval: u.addBuf(bid)
              to: u.addBuf
          key: _
          range: rr.recycle
          value: bid
      - opt:
          do:
            - eval: u.publishBufs()
              to: u.publishBufs
            - op: +=
              set: rr.inRing
              value: len(rr.recycle)
            - set: rr.recycle
              value: rr.recycle[:0]
          when: len(rr.recycle) > 0
  - of: fillStale
    steps:
      - loop:
          do:
            - set: b[i]
              value: staleFill
          key: i
          range: b
  - of: (*uRing).rearmStarved
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).rearmStarved
        kind: self
      - id: rr.armRecv
        kind: internal
    steps:
      - bind: k
        eval: "0"
      - loop:
          cond: k < len(rr.starved) && k < rr.inRing
          do:
            - bind: slot
              eval: rr.starved[k]
            - op: ++
              set: k
            - opt:
                do:
                  - eval: rr.armRecv(slot)
                    to: rr.armRecv
                when: rr.r.conns[slot].state == stOpen
      - set: rr.starved
        value: rr.starved[:copy(rr.starved, rr.starved[k:])]
  - of: (*uRing).flush
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).flush
        kind: self
      - id: rr.sendFlight
        kind: internal
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - opt:
          do:
            - return: ""
          when: c.flags&fSending != 0 || c.out.empty() || c.out.off == c.out.len
      - set: c.flight, c.out
        value: "c.out, chunkRef{idx: noChunk}"
      - eval: rr.sendFlight(slot)
        to: rr.sendFlight
  - of: (*uRing).sendFlight
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).sendFlight
        kind: self
      - id: rr.u.get
        kind: internal
      - id: rr.r.fail
        kind: internal
      - id: prepSend
        kind: internal
      - id: rr.ul.onFD
        kind: internal
    steps:
      - bind: c
        eval: "&rr.r.conns[slot]"
      - bind: s
        eval: rr.u.get()
        to: rr.u.get
      - opt:
          do:
            - op: ++
              set: rr.r.st.retries
            - eval: rr.r.fail(slot, rErrno, int32(syscall.EBUSY))
              to: rr.r.fail
            - return: ""
          when: s == nil
      - eval: prepSend(s, uint32(c.fd), rr.ul.lp.slab.data(c.flight), udPack(udSend, c.gen, uint32(slot)))
        to: prepSend
      - eval: rr.ul.onFD(s)
        to: rr.ul.onFD
      - op: ++
        set: c.ops
      - op: "|="
        set: c.flags
        value: fSending
  - of: (*uRing).shutdown
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).shutdown
        kind: self
      - id: rr.maybeClose
        kind: internal
      - id: rr.u.get
        kind: internal
      - id: prepShutdownFixed
        kind: internal
      - id: rr.ul.onFD
        kind: internal
      - id: prepCancelFixed
        kind: internal
    steps:
      - bind: c
        eval: "&r.conns[slot]"
      - opt:
          do:
            - op: ++
              set: r.st.retries
            - eval: rr.maybeClose(slot)
              to: rr.maybeClose
            - return: ""
          when: "!rr.u.reserve(2)"
      - bind: s
        eval: rr.u.get()
        to: rr.u.get
      - eval: prepShutdownFixed(s, uint32(c.fd), syscall.SHUT_RDWR, udPack(udShutdown, c.gen, uint32(slot)))
        to: prepShutdownFixed
      - eval: rr.ul.onFD(s)
        to: rr.ul.onFD
      - op: "|="
        set: s.flags
        value: sqeIOHardlink
      - set: s
        to: rr.u.get
        value: rr.u.get()
      - eval: prepCancelFixed(s, uint32(c.fd), udPack(udCancel, c.gen, uint32(slot)))
        to: prepCancelFixed
      - eval: rr.ul.onFD(s)
        to: rr.ul.onFD
      - op: +=
        set: c.ops
        value: "2"
  - of: (*uRing).sweepDue
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).sweepDue
        kind: self
      - id: cmp
        kind: stdlib
    steps:
      - bind: since
        eval: rr.closes - rr.sweptCloses
      - bind: every
        eval: cmp.Or(rr.ul.hooks.sweepEvery, sweepEvery)
        to: cmp
      - bind: enough
        eval: max(sweepCloses, uint64(len(rr.r.conns)/4))
      - return: since >= enough || (since > 0 && tick-rr.lastSweep >= every)
  - of: (*uRing).cancelOld
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).cancelOld
        kind: self
      - id: rr.u.get
        kind: internal
      - id: prepCancelUserData
        kind: internal
    steps:
      - bind: c
        eval: "&rr.r.conns[slot]"
      - opt:
          do:
            - return: "true"
          when: c.state != stOpen || int(slot) >= len(rr.armEpoch) || rr.armEpoch[slot] >= rr.sweepEpoch
      - bind: s
        eval: rr.u.get()
        to: rr.u.get
      - opt:
          do:
            - op: ++
              set: rr.r.st.retries
            - return: "false"
          when: s == nil
      - eval: prepCancelUserData(s, udPack(udRecv, c.gen, uint32(slot)), udPack(udCancel, c.gen, uint32(slot)))
        to: prepCancelUserData
      - op: ++
        set: c.ops
      - set: rr.armEpoch[slot]
        value: noEpoch
      - return: "true"
  - of: (*uRing).unread
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).unread
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "true"
          when: rr.ul.direct
      - var:
          name: "n"
          type: int32
      - bind: _, _, errno
        eval: syscall.Syscall(syscall.SYS_IOCTL, uintptr(r.conns[slot].fd), siocinq, uintptr(unsafe.Pointer(&n)))
        to: syscall
      - return: errno != 0 || n > 0
  - of: (*uRing).watchdog
    participants:
      - id: caller
        kind: actor
      - id: (*uRing).watchdog
        kind: self
      - id: rr.cancelAccepts
        kind: internal
    steps:
      - bind: lp
        eval: rr.ul.lp
      - opt:
          do:
            - return: ""
          when: rr.paused || rr.r.draining || lp.draining || lp.tick-rr.lastAccept < watchdogTicks
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: rr.armed[i] == 0 || listenerQueue(fd) == 0
            - op: ++
              set: rr.r.st.watchdog
            - op: ++
              set: rr.stalls
            - set: rr.lastAccept
              value: lp.tick
            - opt:
                do:
                  - set: rr.r.draining
                    value: "true"
                  - eval: rr.cancelAccepts()
                    to: rr.cancelAccepts
                  - return: ""
                when: rr.stalls > watchdogFires
            - eval: rr.cancelAccepts()
              to: rr.cancelAccepts
            - return: ""
          key: i
          range: rr.ul.lfds
          value: fd
  - of: queued
    participants:
      - id: caller
        kind: actor
      - id: queued
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - var:
          name: info
          type: syscall.TCPInfo
      - bind: "n"
        eval: new(uint32(unsafe.Sizeof(info)))
      - bind: _, _, errno
        eval: |-
          syscall.Syscall6(syscall.SYS_GETSOCKOPT, uintptr(fd), syscall.IPPROTO_TCP, syscall.TCP_INFO,
          		uintptr(unsafe.Pointer(&info)), uintptr(unsafe.Pointer(n)), 0)
        to: syscall
      - opt:
          do:
            - return: int(info.Unacked)
          when: errno == 0
      - opt:
          do:
            - return: acceptDepth
          when: readable(fd)
      - return: "0"
  - of: readable
    participants:
      - id: caller
        kind: actor
      - id: readable
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: pfd
        eval: "pollFd{fd: int32(fd), events: pollIn}"
      - bind: r, _, errno
        eval: syscall.RawSyscall6(syscall.SYS_PPOLL, uintptr(unsafe.Pointer(&pfd)), 1, uintptr(unsafe.Pointer(new(syscall.Timespec{}))), 0, 0, 0)
        to: syscall
      - return: errno == 0 && r == 1 && pfd.revents&pollIn != 0
  - of: listenerQueue
    participants:
      - id: caller
        kind: actor
      - id: listenerQueue
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - var:
          name: info
          type: syscall.TCPInfo
      - bind: "n"
        eval: new(uint32(unsafe.Sizeof(info)))
      - bind: _, _, errno
        eval: |-
          syscall.Syscall6(syscall.SYS_GETSOCKOPT, uintptr(fd), syscall.IPPROTO_TCP, syscall.TCP_INFO,
          		uintptr(unsafe.Pointer(&info)), uintptr(unsafe.Pointer(n)), 0)
        to: syscall
      - opt:
          do:
            - return: "0"
          when: errno != 0
      - return: info.Unacked
  - of: (*uLoop).control
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).control
        kind: self
      - id: ul.startDrain
        kind: internal
      - id: rr.takeQueues
        kind: internal
      - id: r.markDirty
        kind: internal
    steps:
      - bind: lp
        eval: ul.lp
      - opt:
          do:
            - eval: ul.startDrain()
              to: ul.startDrain
          when: ul.drainReq.Load() && !lp.draining
      - opt:
          do:
            - return: ""
          when: "!lp.draining"
      - loop:
          do:
            - eval: rr.takeQueues()
              to: rr.takeQueues
            - bind: r
              eval: rr.r
            - loop:
                cond: s != noLink
                do:
                  - bind: c
                    eval: "&r.conns[s]"
                  - bind: nxt
                    eval: c.lruNext
                  - opt:
                      do:
                        - set: c.state, c.reason
                          value: stClosing, rDrain
                        - eval: r.markDirty(s)
                          to: r.markDirty
                      when: r.drainable(c)
                  - set: s
                    value: nxt
                init: s := r.lruHead
          key: _
          range: ul.rings
          value: rr
  - of: (*uLoop).startDrain
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).startDrain
        kind: self
      - id: rr.cancelAccept
        kind: internal
    steps:
      - set: ul.lp.draining
        value: "true"
      - loop:
          do:
            - opt:
                do:
                  - set: rr.take
                    value: takeOff
                when: rr.r.draining
            - set: rr.r.draining
              value: "true"
            - loop:
                do:
                  - opt:
                      do:
                        - set: rr.queueCancel[i]
                          to: rr.cancelAccept
                          value: rr.cancelAccept(i)
                      when: n > 0
                key: i
                range: rr.armed
                value: "n"
          key: _
          range: ul.rings
          value: rr
  - of: (*uLoop).closeAll
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).closeAll
        kind: self
      - id: r.fail
        kind: internal
      - id: rr.cancelAccepts
        kind: internal
      - id: rr.u.submit
        kind: internal
      - id: time.Now().Add
        kind: value
      - id: ul.rings[0].u.wait
        kind: internal
      - id: rr.reapAll
        kind: internal
      - id: rr.r.publish
        kind: internal
    steps:
      - loop:
          do:
            - bind: r
              eval: rr.r
            - loop:
                cond: r.lruHead != noLink
                do:
                  - eval: r.fail(r.lruHead, rDrain, 0)
                    to: r.fail
            - eval: rr.cancelAccepts()
              to: rr.cancelAccepts
            - eval: rr.u.submit()
              to: rr.u.submit
          key: _
          range: ul.rings
          value: rr
      - bind: deadline
        eval: time.Now().Add(time.Second)
        to: time.Now().Add
      - bind: tick
        eval: "kernelTimespec{nsec: int64(tickEvery)}"
      - loop:
          cond: ul.live() > 0 && time.Now().Before(deadline)
          do:
            - eval: ul.rings[0].u.wait(&tick)
              to: ul.rings[0].u.wait
            - loop:
                do:
                  - eval: rr.u.submit()
                    to: rr.u.submit
                  - eval: rr.reapAll()
                    to: rr.reapAll
                key: _
                range: ul.rings
                value: rr
      - loop:
          do:
            - eval: rr.r.publish()
              to: rr.r.publish
          key: _
          range: ul.rings
          value: rr
  - of: (*uLoop).teardown
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).teardown
        kind: self
      - id: lp.post.close
        kind: internal
      - id: rr.u.close
        kind: internal
      - id: ul.wakeMu.Lock
        kind: value
      - id: closeFDs
        kind: internal
      - id: ul.wakeMu.Unlock
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - bind: lp
        eval: ul.lp
      - opt:
          do:
            - eval: lp.post.close()
              to: lp.post.close
          when: lp.post != nil
      - loop:
          do:
            - eval: rr.u.close()
              to: rr.u.close
          key: _
          range: ul.rings
          value: rr
      - eval: ul.wakeMu.Lock()
        to: ul.wakeMu.Lock
      - eval: closeFDs([]int{ul.wakefd, ul.fanfd})
        to: closeFDs
      - set: ul.evClosed
        value: "true"
      - eval: ul.wakeMu.Unlock()
        to: ul.wakeMu.Unlock
      - loop:
          do:
            - eval: swallowErr(syscall.Munmap(m))
              to: swallowErr
          key: _
          range: lp.slab.mapped
          value: m
      - set: lp.slab.mapped
        value: nil
  - of: (*uLoop).selfTest
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).selfTest
        kind: self
      - id: ul.sw.disabled
        kind: internal
      - id: selfTestRing
        kind: internal
      - id: rg.close
        kind: internal
      - id: loopbackListener
        kind: internal
      - id: closeFDs
        kind: internal
      - id: rg.get
        kind: internal
      - id: prepAccept
        kind: internal
      - id: onProcessFD
        kind: internal
      - id: rg.submit
        kind: internal
      - id: selfTestClient
        kind: internal
