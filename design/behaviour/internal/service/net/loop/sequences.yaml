        eval: a * int32(c.perArena)
      - loop:
          cond: i >= 0
          do:
            - set: c.free
              value: append(c.free, base+i)
          init: i := int32(c.perArena) - 1
          post: i--
      - return: "true"
  - of: (*slab).free
    steps:
      - opt:
          do:
            - return: ""
          when: r.empty()
