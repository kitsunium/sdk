            bind: err
            eval: "syscall.Bind(fd, &syscall.SockaddrInet4{Addr: [4]byte{127, 0, 0, 1}})"
            to: syscall
          when: err != nil
      - opt:
          do:
            - set: _
              to: syscall
              value: syscall.Close(fd)
            - return: "-1, 0, err"
          init:
            bind: err
            eval: syscall.Listen(fd, 8)
            to: syscall
          when: err != nil
      - bind: sa, err
        eval: syscall.Getsockname(fd)
        to: syscall
      - opt:
          do:
            - set: _
              to: syscall
              value: syscall.Close(fd)
            - return: "-1, 0, err"
          when: err != nil
      - bind: in4, ok
        eval: sa.(*syscall.SockaddrInet4)
      - opt:
          do:
            - set: _
              to: syscall
              value: syscall.Close(fd)
            - return: "-1, 0, syscall.EAFNOSUPPORT"
          when: "!ok"
      - return: fd, in4.Port, nil
  - of: (*uLoop).peerCommand
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).peerCommand
        kind: self
      - id: syscall
        kind: stdlib
      - id: closeFDs
        kind: internal
      - id: ul.installProbe
        kind: internal
      - id: st.closeDirect
        kind: internal
      - id: st.u.get
        kind: internal
      - id: prepPeerCred
        kind: internal
      - id: st.pump
        kind: internal
    steps:
      - opt:
          do:
            - return: "false, \"SOCKET_URING_OP_GETSOCKOPT: \" + syscall.EOPNOTSUPP.Error() + \" (before 6.7)\""
          when: ul.hooks.failStage == "sock_getsockopt"
      - bind: pair, err
        eval: syscall.Socketpair(syscall.AF_UNIX, syscall.SOCK_STREAM|syscall.SOCK_CLOEXEC, 0)
        to: syscall
      - opt:
          do:
            - return: "false, \"SOCKET_URING_OP_GETSOCKOPT: no Unix socket pair to probe: \" + err.Error()"
          when: err != nil
      - defer: closeFDs(pair[:])
        to: closeFDs
      - bind: index, why
        eval: ul.installProbe(st, pair[0])
        to: ul.installProbe
      - opt:
          do:
            - return: false, why
          when: why != ""
      - defer: st.closeDirect(index)
        to: st.closeDirect
      - bind: s
        eval: st.u.get()
        to: st.u.get
      - opt:
          do:
            - return: "false, \"SOCKET_URING_OP_GETSOCKOPT: no submission room\""
          when: s == nil
      - set: ul.peers.probe
        value: syscall.Ucred{}
      - eval: prepPeerCred(s, index, &ul.peers.probe, udPack(udPeer, 0, 0))
        to: prepPeerCred
      - eval: st.pump(func() bool { return st.peer.done })
        to: st.pump
      - switch:
          cases:
            - case: "!st.peer.done"
              do:
                - return: "false, \"SOCKET_URING_OP_GETSOCKOPT: no completion within 500 ms\""
            - case: st.peer.res < 0
              do:
                - return: "false, \"SOCKET_URING_OP_GETSOCKOPT on a Unix socket: \" + syscall.Errno(-st.peer.res).Error()"
            - case: st.peer.res != ucredLen
              do:
                - return: "false, \"SOCKET_URING_OP_GETSOCKOPT: an unexpected length\""
            - case: ul.peers.probe.Pid != int32(syscall.Getpid())
              do:
                - return: "false, \"SOCKET_URING_OP_GETSOCKOPT: SO_PEERCRED named pid \" + strconv.Itoa(int(ul.peers.probe.Pid)) + \", not this process\""
      - return: true, ""
  - of: (*uLoop).installProbe
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).installProbe
        kind: self
      - id: st.u.get
        kind: internal
      - id: prepInstall
        kind: internal
      - id: st.pump
        kind: internal
    steps:
      - bind: s
        eval: st.u.get()
        to: st.u.get
      - opt:
          do:
            - return: "0, \"IORING_OP_FILES_UPDATE: no submission room\""
          when: s == nil
      - set: ul.peers.probeFD
        value: int32(fd)
      - eval: prepInstall(s, &ul.peers.probeFD, udPack(udFilesUpdate, 0, 0))
        to: prepInstall
      - eval: st.pump(func() bool { return st.install.done })
        to: st.pump
      - switch:
          cases:
            - case: "!st.install.done"
              do:
                - return: "0, \"IORING_OP_FILES_UPDATE: no completion within 500 ms\""
            - case: st.install.res == 1 && ul.peers.probeFD >= 0
              do:
                - return: uint32(ul.peers.probeFD), ""
            - case: st.install.res < 0
              do:
                - return: "0, \"IORING_OP_FILES_UPDATE: \" + syscall.Errno(-st.install.res).Error()"
      - return: "0, \"IORING_OP_FILES_UPDATE: installed \" + strconv.Itoa(int(st.install.res)) + \" descriptors\""
  - of: (*selfTestRun).closeDirect
    participants:
      - id: caller
        kind: actor
      - id: (*selfTestRun).closeDirect
        kind: self
      - id: st.u.get
        kind: internal
      - id: prepCloseDirect
        kind: internal
      - id: st.pump
        kind: internal
    steps:
      - bind: s
        eval: st.u.get()
        to: st.u.get
      - opt:
          do:
            - return: ""
          when: s == nil
      - set: st.closed
        value: "false"
      - eval: prepCloseDirect(s, index, udPack(udClose, 0, 0))
        to: prepCloseDirect
      - eval: st.pump(func() bool { return st.closed })
        to: st.pump
      - set: st.closed
        value: "false"
  - of: openURing
    participants:
      - id: caller
        kind: actor
      - id: openURing
        kind: self
      - id: uringSetup
        kind: internal
      - id: u.close
        kind: internal
      - id: u.mapRings
        kind: internal
      - id: u.buildViews
        kind: internal
    steps:
      - bind: u
        eval: "&uring{fd: -1, ringIdx: -1}"
      - set: u.params.flags
        value: flags | setupCQSize | setupClamp
      - set: u.params.cqEntries
        value: entries * cqFactor
      - bind: fd, errno
        eval: uringSetup(entries, &u.params)
        to: uringSetup
      - opt:
          do:
            - return: nil, "setup", errno
          when: errno != 0
      - set: u.fd
        value: fd
      - set: u.setup
        value: flags
      - bind: p
        eval: "&u.params"
      - opt:
          do:
            - eval: u.close()
              to: u.close
            - return: nil, "features", syscall.EOPNOTSUPP
          when: p.features&featExtArg == 0 || p.features&featNoDrop == 0 || p.features&featSingleMmap == 0
      - opt:
          do:
            - eval: u.close()
              to: u.close
            - return: nil, step, errno
          init:
            bind: step, errno
            eval: u.mapRings()
            to: u.mapRings
          when: errno != 0
      - eval: u.buildViews()
        to: u.buildViews
      - return: u, "", 0
  - of: (*uring).mapRings
    participants:
      - id: caller
        kind: actor
      - id: (*uring).mapRings
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: p
        eval: "&u.params"
      - bind: sqSize
        eval: uintptr(p.sqOff.array) + uintptr(p.sqEntries)*4
      - bind: cqSize
        eval: uintptr(p.cqOff.cqes) + uintptr(p.cqEntries)*unsafe.Sizeof(cqe{})
      - bind: size
        eval: max(sqSize, cqSize)
      - bind: mem, err
        eval: syscall.Mmap(u.fd, int64(offSQRing), int(size), syscall.PROT_READ|syscall.PROT_WRITE, syscall.MAP_SHARED|syscall.MAP_POPULATE)
        to: syscall
      - opt:
          do:
            - return: "\"mmap rings\", errnoOfErr(err)"
          when: err != nil
      - set: u.ringMem
        value: mem
      - bind: sqeBytes, err
        eval: syscall.Mmap(u.fd, int64(offSQEs), int(uintptr(p.sqEntries)*unsafe.Sizeof(sqe{})), syscall.PROT_READ|syscall.PROT_WRITE, syscall.MAP_SHARED|syscall.MAP_POPULATE)
        to: syscall
      - opt:
          do:
            - return: "\"mmap sqes\", errnoOfErr(err)"
          when: err != nil
      - set: u.sqeMem
        value: sqeBytes
      - return: "\"\", 0"
  - of: (*uring).buildViews
    participants:
      - id: caller
        kind: actor
      - id: (*uring).buildViews
        kind: self
      - id: unsafe
        kind: stdlib
      - id: atomic
        kind: stdlib
    steps:
      - bind: p
        eval: "&u.params"
      - bind: base
        eval: unsafe.Pointer(&u.ringMem[0])
        to: unsafe
      - set: u.sqHead
        value: (*uint32)(unsafe.Add(base, p.sqOff.head))
      - set: u.sqTail
        value: (*uint32)(unsafe.Add(base, p.sqOff.tail))
      - set: u.sqFlags
        value: (*uint32)(unsafe.Add(base, p.sqOff.flags))
      - set: u.sqMask
        value: "*(*uint32)(unsafe.Add(base, p.sqOff.ringMask))"
      - set: u.sqLen
        value: p.sqEntries
      - set: u.cqHead
        value: (*uint32)(unsafe.Add(base, p.cqOff.head))
      - set: u.cqTail
        value: (*uint32)(unsafe.Add(base, p.cqOff.tail))
      - set: u.cqMask
        value: "*(*uint32)(unsafe.Add(base, p.cqOff.ringMask))"
      - set: u.cqLen
        value: p.cqEntries
      - set: u.cqes
        to: unsafe
        value: unsafe.Slice((*cqe)(unsafe.Add(base, p.cqOff.cqes)), p.cqEntries)
      - set: u.sqes
        to: unsafe
        value: unsafe.Slice((*sqe)(unsafe.Pointer(&u.sqeMem[0])), p.sqEntries)
      - opt:
          do:
            - bind: array
              eval: unsafe.Slice((*uint32)(unsafe.Add(base, p.sqOff.array)), p.sqEntries)
              to: unsafe
            - loop:
                do:
                  - set: array[i]
                    value: uint32(i)
                key: i
                range: array
          when: "!u.noArray()"
      - set: u.tail
        to: atomic
        value: atomic.LoadUint32(u.sqTail)
      - set: u.submitted
        value: u.tail
  - of: errnoOfErr
    steps:
      - opt:
