      - id: caller
        kind: actor
      - id: (*slab).shrink
        kind: self
      - id: c.idleArenas
        kind: internal
      - id: s.shrinkClass
        kind: internal
    steps:
      - bind: left
        eval: shrinkPerTick
      - loop:
          do:
            - bind: c
              eval: "&s.classes[i]"
            - opt:
                do:
                  - continue: true
                when: left == 0 || len(c.free) < 2*c.perArena
            - bind: idle
              eval: c.idleArenas()
              to: c.idleArenas
            - opt:
                do:
                  - continue: true
                when: idle < 2
