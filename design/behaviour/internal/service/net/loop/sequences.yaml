            to: rg.setupBuffers
          when: errno != 0
      - opt:
          do:
            - return: rg, nil
          when: "!direct"
      - opt:
          do:
            - eval: rg.close()
              to: rg.close
            - return: nil, probeError("self_test sparse_files", errno)
