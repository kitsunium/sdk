            - opt:
                do:
                  - return: err
                when: err != nil
            - set: ul.rings
              value: append(ul.rings, rr)
            - set: lp.rings
              value: append(lp.rings, rr.r)
          key: i
          range: rings
      - bind: primary
        eval: ul.rings[0]
      - eval: primary.pollFD(ul.wakefd, udWake)
        to: primary.pollFD
      - opt:
          do:
            - eval: primary.pollFD(ul.fanfd, udFan)
              to: primary.pollFD
          when: len(ul.rings) > 1
      - return: nil
  - forward: cmp.Or
    of: orErrno
  - of: (*uLoop).newRing
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).newRing
        kind: self
      - id: openURing
        kind: internal
      - id: ul.registerRing
        kind: internal
      - id: newRing
        kind: internal
      - id: ul.bufShape
        kind: internal
      - id: u.setupBuffers
        kind: internal
      - id: u.close
        kind: internal
      - id: ul.registerTable
        kind: internal
      - id: slices
        kind: stdlib
      - id: ul.registerFan
        kind: internal
      - id: rr.armAccepts
        kind: internal
    steps:
      - bind: flags
        eval: ul.secondary
      - opt:
          do:
            - set: flags
              value: ul.primary
          when: i == 0
      - opt:
          do:
            - op: "&^="
              set: flags
              value: setupCoopTaskrun
          when: i > 0 && ul.hooks.secondaryPlain
      - bind: u, step, errno
