    steps:
      - opt:
          do:
            - return: explicit, slabExplicit
          when: explicit > 0
      - opt:
          do:
            - return: defaultSlabBudget, slabDefault
          when: mem.Allowance <= 0
      - bind: share
        eval: mem.Allowance / (slabAllowanceShare * int64(max(loops, 1)))
      - return: int(max(min(share, int64(defaultSlabBudget)), int64(floor))), slabDerived
  - of: chunkRef.empty
    steps:
      - return: c.idx == noChunk
  - of: newSlab
    participants:
      - id: caller
        kind: actor
      - id: newSlab
        kind: self
      - id: classOf
        kind: internal
    steps:
      - bind: top
        eval: classOf(maxChunk)
        to: classOf
