            - set: g.loops
              value: append(g.loops, lp)
            - eval: runner.wg.Add(1)
              to: runner.wg.Add
            - go: el.run(&runner.wg, ready)
              to: el.run
          key: i
          range: g.sz.loops
      - var:
          name: first
          type: error
      - loop:
          do:
            - opt:
                do:
                  - set: first
                    value: err
                init:
                  bind: err
                  eval: <-ready
                when: err != nil && first == nil
          range: g.sz.loops
      - set: g.ctl
        value: runner
      - go: |-
          func() {
          		runner.wg.Wait()
          		runner.set.closeRest()
          		close(fin)
          	}()
      - opt:
          do:
            - eval: runner.stop()
              to: runner.stop
            - eval: runner.wait()
              to: runner.wait
            - return: first
          when: first != nil
      - set: g.backend
        value: backendEpoll
      - return: nil
  - of: probeExclusive
    participants:
      - id: caller
        kind: actor
      - id: probeExclusive
        kind: self
      - id: syscall
        kind: stdlib
      - id: rep.set
        kind: internal
      - id: closeFDs
        kind: internal
      - id: rep.found
        kind: internal
    steps:
