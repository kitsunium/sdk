      - set: u.sqFlags
        value: (*uint32)(unsafe.Add(base, p.sqOff.flags))
      - set: u.sqMask
        value: "*(*uint32)(unsafe.Add(base, p.sqOff.ringMask))"
      - set: u.sqLen
        value: p.sqEntries
      - set: u.cqHead
        value: (*uint32)(unsafe.Add(base, p.cqOff.head))
      - set: u.cqTail
        value: (*uint32)(unsafe.Add(base, p.cqOff.tail))
      - set: u.cqMask
        value: "*(*uint32)(unsafe.Add(base, p.cqOff.ringMask))"
      - set: u.cqLen
        value: p.cqEntries
      - set: u.cqes
