      - set: s.ioprio
        value: recvBundle
      - set: s.bufIndex
        value: bufGroup
      - eval: "u.wait(new(kernelTimespec{nsec: int64(bundleProbeWait)}), 1)"
        to: u.wait
      - bind: res, got
        eval: int32(0), false
      - eval: u.reap(1, func(c *cqe) { res, got = c.res, true })
        to: u.reap
      - switch:
          cases:
            - case: "!got"
              do:
                - return: 0, syscall.ETIME
            - case: res < 0
              do:
                - return: 0, syscall.Errno(-res)
      - return: int(res), 0
