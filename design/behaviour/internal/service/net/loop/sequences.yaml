      - bind: _, _, errno
        eval: syscall.RawSyscall(syscall.SYS_WRITE, uintptr(ul.wakefd), uintptr(unsafe.Pointer(one)), 8)
        to: syscall
      - eval: swallowErr(errno)
        to: swallowErr
  - of: startIOURing
    participants:
      - id: caller
        kind: actor
      - id: startIOURing
        kind: self
      - id: newSwitches
        kind: internal
      - id: probeError
        kind: internal
      - id: noDelay
        kind: internal
      - id: newListenerSet
        kind: internal
      - id: newLoop
        kind: internal
      - id: runner.wg.Add
        kind: value
      - id: ul.run
        kind: internal
      - id: runner.stop
        kind: internal
      - id: runner.wait
        kind: internal
    steps:
      - bind: sw
        eval: newSwitches(cfg)
        to: newSwitches
      - opt:
          do:
            - return: probeError("uring-pbuf switched off", syscall.EOPNOTSUPP)
              to: probeError
          when: sw.disabled(corenet.CapabilityURingPbuf)
      - bind: fin
        eval: make(chan struct{})
      - bind: runner
        eval: "&uringRunner{fin: fin}"
      - loop:
          do:
            - eval: noDelay(l.FD, sw)
              to: noDelay
            - set: runner.lfds
              value: append(runner.lfds, l.FD)
          key: _
          range: cfg.Listeners
          value: l
      - set: runner.set
        to: newListenerSet
        value: newListenerSet(runner.lfds, g.sz.loops*g.sz.rings)
      - bind: ready
        eval: make(chan error, g.sz.loops)
      - loop:
          do:
            - bind: lp
              eval: newLoop(g, *cfg, i, mmapAnon)
              to: newLoop
            - bind: ul
              eval: "&uLoop{lp: lp, lfds: runner.lfds, set: runner.set, hooks: hooks, wakefd: -1, fanfd: -1, sw: sw, rep: newReport(sw, \"iouring\")}"
            - set: runner.loops
              value: append(runner.loops, ul)
            - set: g.loops
              value: append(g.loops, lp)
            - eval: runner.wg.Add(1)
              to: runner.wg.Add
            - go: ul.run(&runner.wg, ready, g.sz.rings)
              to: ul.run
          key: i
          range: g.sz.loops
      - var:
          name: first
          type: error
      - loop:
          do:
            - opt:
                do:
                  - set: first
                    value: err
                init:
                  bind: err
                  eval: <-ready
                when: err != nil && first == nil
          range: g.sz.loops
      - set: g.ctl
        value: runner
      - go: |-
          func() {
          		runner.wg.Wait()
          		close(fin)
          	}()
      - opt:
          do:
            - eval: runner.stop()
              to: runner.stop
            - eval: runner.wait()
              to: runner.wait
            - set: g.loops
              value: nil
            - return: first
          when: first != nil
      - go: |-
          func() {
          		<-fin
          		runner.set.closeRest()
          	}()
      - set: g.backend
        value: corenet.LoopBackendIOURing
      - set: g.stage
        value: runner.loops[0].stage
      - set: g.caps
        value: runner.loops[0].rep
      - return: nil
  - of: probeError
    participants:
      - id: caller
        kind: actor
      - id: probeError
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(corenet.LoopBackendUnavailable, errs.WrapParams{},
          		errs.String("stage", stage), errs.String("reason", errno.Error()))
        to: errs
  - of: (*uLoop).run
    participants:
      - id: caller
        kind: actor
      - id: (*uLoop).run
        kind: self
      - id: wg.Done
        kind: value
      - id: runtime
        kind: stdlib
      - id: syscall
        kind: stdlib
      - id: threadCheck
        kind: internal
      - id: ul.setup
        kind: internal
      - id: ul.teardown
        kind: internal
      - id: ul.serve
        kind: internal
    steps:
      - defer: wg.Done()
        to: wg.Done
