          do:
            - return: 0, 0
          when: d < 0
      - opt:
          do:
            - set: d
              value: defaultBatchWait
          when: d == 0
      - return: min(d, tickEvery), min(orDefault(v.BatchWaitMin, defaultBatchWaitMin), cqBatch)
