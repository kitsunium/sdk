              do:
                - eval: binary.LittleEndian.PutUint16(b[0:2], afInet6)
                  to: binary.LittleEndian.PutUint16
                - eval: binary.BigEndian.PutUint16(b[2:4], to.Port())
                  to: binary.BigEndian.PutUint16
                - bind: v6
                  eval: a.As16()
                  to: a.As16
                - eval: copy(b[8:24], v6[:])
                - return: sockaddrIn6Bytes
