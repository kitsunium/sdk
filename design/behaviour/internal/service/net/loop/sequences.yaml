      - bind: left
        eval: uint32(rr.ul.bufLeft() / uint64(u.bufSize))
      - opt:
          do:
            - return: ""
          when: want <= 0 || left == 0
      - bind: from
        eval: u.bufProvided
      - bind: "n"
        eval: u.growBufs(min(max(uint32(want), bufsStep), left))
        to: u.growBufs
