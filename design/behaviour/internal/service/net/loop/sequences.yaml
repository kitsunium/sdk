      - opt:
          do:
            - return: unavailable("mmap arena", err)
              to: unavailable
          when: err != nil
      - set: el.arena
        value: arena
      - bind: lp
        eval: el.lp
      - set: lp.post
        to: newPostQueue
        value: newPostQueue(el.wake)
      - set: el.r
        to: newRing
        value: newRing(lp, 0, el)
      - set: lp.rings
        value: "[]*ring{el.r}"
      - eval: el.armListeners()
        to: el.armListeners
      - return: nil
  - of: (*epollLoop).ctl
    participants:
      - id: caller
        kind: actor
      - id: (*epollLoop).ctl
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: ev
        eval: "new(syscall.EpollEvent{Events: events, Fd: tag, Pad: int32(gen)})"
