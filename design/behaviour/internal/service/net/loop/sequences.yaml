                - eval: binary.LittleEndian.PutUint16(b[0:2], afInet)
                  to: binary.LittleEndian.PutUint16
                - eval: binary.BigEndian.PutUint16(b[2:4], to.Port())
                  to: binary.BigEndian.PutUint16
