# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: statusUnauthorized answers a request the authenticating link refused.
    items:
      - name: statusUnauthorized
        type: int
        value: "401"
    name: statusUnauthorized
  - doc: bearerScheme is the authentication scheme Bearer reads, lowercase.
    items:
      - name: bearerScheme
        type: string
        value: "\"bearer\""
    name: bearerScheme
  - doc: traceFieldName is the field Trace reads, in the case every comparison folds to.
    items:
      - name: traceFieldName
        type: string
        value: "\"traceparent\""
    name: traceFieldName
  - grouped: true
    items:
      - doc: statusTooManyRequests answers a request a limiter refused.
        name: statusTooManyRequests
        type: int
        value: "429"
      - doc: routeKeyLen is the width of a number used as a rate key.
        name: routeKeyLen
        type: int
        value: "8"
      - doc: byteBits is how many bits a byte holds.
        name: byteBits
        type: int
        value: "8"
      - doc: |-
          corsOriginField is the field a browser names its page's origin in;
          lowercase, as the codec's comparison folds it.
        name: corsOriginField
        type: string
        value: "\"origin\""
      - doc: corsRequestMethodField asks a preflight's question.
        name: corsRequestMethodField
        type: string
        value: "\"access-control-request-method\""
      - doc: |-
          requestIDFieldName is the field RequestID reads, in the case every
          comparison folds to.
        name: requestIDFieldName
        type: string
        value: "\"x-request-id\""
      - doc: "mintedIDLen is the length of a minted identifier: a 64-bit number in hex."
        name: mintedIDLen
        type: int
        value: "16"
      - doc: lowerHex are a minted identifier's digits.
        name: lowerHex
        type: string
        value: "\"0123456789abcdef\""
      - doc: nibbleBits is how many bits one hexadecimal digit spells.
        name: nibbleBits
        type: int
        value: "4"
      - doc: nibbleMask keeps one digit's bits.
        name: nibbleMask
        type: uint64
        value: "0xf"
      - doc: laneShift places the lane above a request's counter (HTTP1RequestValue.ID).
        name: laneShift
        type: int
        value: "48"
      - doc: counterMask keeps a request's counter below its lane.
        name: counterMask
        type: uint64
        value: 1<<laneShift - 1
    name: statusTooManyRequests
  - grouped: true
    items:
      - doc: rateKeyNone is the zero RateKey, refused.
        name: rateKeyNone
        type: rateKeyKind
        value: iota
      - doc: rateKeySubject keys on HTTP1RequestValue.Auth.
        name: rateKeySubject
      - doc: rateKeyRoute keys on HTTP1RequestValue.Route.
        name: rateKeyRoute
      - doc: rateKeyLane keys on HTTP1RequestValue.Lane.
        name: rateKeyLane
      - doc: rateKeyField keys on a request field.
        name: rateKeyField
    name: rateKeyNone
  - grouped: true
    items:
      - doc: |-
          copyChunk is the largest chunk one worker job reads for the copy path:
          the size a step of the zero-copy path sends too.
        name: copyChunk
        type: int64
        value: 64 << 10
      - doc: |-
          copyMinChunk is the smallest chunk: an output ceiling under it would make
          the copy path write nothing at all.
        name: copyMinChunk
        type: int64
        value: 4 << 10
      - doc: |-
          copyStall is how long a chunk the output refused may wait for OnWritable: a
          client slower than a chunk's worth of drain in this long stops holding the
          file. Every backend reports a failed write as the connection's end (the
          portable writer posts it itself since #982), so the timer bounds a slow
          peer, not a lost event.
        name: copyStall
        type: time.Duration
        value: 10 * time.Second
    name: copyChunk
  - doc: The bits of fileBody.flags.
    grouped: true
    items:
      - doc: bodyActive says a file's body is leaving.
        name: bodyActive
        type: uint8
        value: 1 << iota
      - doc: |-
          bodyNative says the engine owns the file: OnWritable ends it, and no
          reader is held here.
        name: bodyNative
      - doc: bodyClosing says the connection closes after the file.
        name: bodyClosing
      - doc: |-
          bodyBusy says a chunk is out with the worker, the reader the worker's
          until it comes back.
        name: bodyBusy
    name: bodyActive
  - grouped: true
    items:
      - doc: |-
          filesTagBits place a Files link's tag in a job's top bits; the tag sets
          them, and the rest of the job is the link's own entry index.
        name: filesTagBits
        type: uint64
        value: "48"
      - doc: filesEntryMask keeps the entry index below the tag.
        name: filesEntryMask
        type: uint64
        value: 1<<filesTagBits - 1
      - doc: |-
          filesFieldCap bounds a copied Range, If-None-Match or If-Modified-Since:
          a longer value is treated as absent, a validator never matched by a
          fragment of itself and a range never parsed from a truncation.
        name: filesFieldCap
        type: int
        value: "256"
      - doc: |-
          filesIndex is the file a directory is served by, the single-page
          application's shell too, as the static tree's indexName is.
        name: filesIndex
        type: string
        value: "\"index.html\""
      - doc: filesAllow is the Allow of a 405.
        name: filesAllow
        type: string
        value: "\"GET, HEAD\""
      - doc: filesOctet is the type a name says nothing of.
        name: filesOctet
        type: string
        value: "\"application/octet-stream\""
      - doc: httpDate is the layout of Last-Modified and If-Modified-Since.
        name: httpDate
        type: string
        value: "\"Mon, 02 Jan 2006 15:04:05 GMT\""
      - doc: statusPartial answers one Range.
        name: statusPartial
        type: int
        value: "206"
      - doc: statusMoved redirects a directory named without its slash.
        name: statusMoved
        type: int
        value: "301"
      - doc: statusRangeBad answers a Range that cannot be satisfied.
        name: statusRangeBad
        type: int
        value: "416"
      - doc: statusNotAllowed answers a method the tree does not serve.
        name: statusNotAllowed
        type: int
        value: "405"
      - doc: statusNotFound answers a name the tree does not hold.
        name: statusNotFound
        type: int
        value: "404"
      - doc: filesEntries is how many job entries a lane starts with.
        name: filesEntries
        type: int
        value: "8"
      - doc: nibbleLow keeps the low half of a byte.
        name: nibbleLow
        type: byte
        value: "0x0f"
      - doc: hexUpper are the digits an escape is spelled with.
        name: hexUpper
        type: string
        value: "\"0123456789ABCDEF\""
      - doc: |-
          unreservedSet is RFC 3986's unreserved characters beside the letters
          and digits.
        name: unreservedSet
        type: string
        value: "\"-_.~\""
    name: filesTagBits
  - doc: |-
      internalError is the whole answer to a response the writer refused or a
      handler left deferred: a 500 with no body, and the connection closed.
    items:
      - name: internalError
        type: string
        value: "\"HTTP/1.1 500 Internal Server Error\\r\\n\" + internalErrorTail"
    name: internalError
  - doc: internalErrorTail is what follows the status line of that answer.
    items:
      - name: internalErrorTail
        type: string
        value: "\"Content-Length: 0\\r\\nConnection: close\\r\\n\\r\\n\""
    name: internalErrorTail
  - doc: What one turn of OnData decided.
    grouped: true
    items:
      - doc: "stepMore reads on: more of the buffer can be used."
        name: stepMore
        type: stepKind
        value: iota
      - doc: "stepWait stops: the rest waits in the spill for its next bytes."
        name: stepWait
      - doc: "stepClose stops: the connection closes and nothing more is read."
        name: stepClose
    name: stepMore
  - doc: |-
      minBodyBound is the Content-Length bound a spill with no room beside the head
      still leaves: a parser's bound of zero means the default, so the smallest
      bound it can be given is this one, which only a misconfigured SpillCap reaches.
    items:
      - name: minBodyBound
        type: int64
        value: "1"
    name: minBodyBound
  - grouped: true
    items:
      - doc: |-
          statusUnavailable answers a pending request its lane's full queue to the
          worker refused.
        name: statusUnavailable
        type: int
        value: "503"
      - doc: |-
          defaultHoldCap bounds what one connection holds back behind a pending
          answer when the group gave no OutputCap: the loop's own default.
        name: defaultHoldCap
        type: int
        value: 1 << 20
    name: statusUnavailable
  - doc: version is the one version the profile speaks.
    items:
      - name: version
        type: string
        value: "\"HTTP/1.1\""
    name: version
  - grouped: true
    items:
      - doc: "byteValues is how many values a byte takes: the size of a byte table."
        name: byteValues
        type: int
        value: "256"
      - doc: tokenStride is how many name bytes tokenEnd tests per turn.
        name: tokenStride
        type: int
        value: "4"
      - doc: crlfLen is the length of a line's end.
        name: crlfLen
        type: int
        value: "2"
      - doc: decimalBase is the base of a Content-Length.
        name: decimalBase
        type: int64
        value: "10"
      - doc: lastDigit is the largest value of one decimal digit.
        name: lastDigit
        type: byte
        value: "9"
      - doc: asciiCase is the bit that tells a lowercase ASCII letter from its capital.
        name: asciiCase
        type: byte
        value: "0x20"
      - doc: asciiDEL is the one control byte above the space.
        name: asciiDEL
        type: byte
        value: "0x7f"
      - doc: asciiSpace is the first byte that is not a C0 control.
        name: asciiSpace
        type: byte
        value: "0x20"
      - doc: |-
          knownMaxLen is one past the longest name the profile reads,
          transfer-encoding.
        name: knownMaxLen
        type: int
        value: len("transfer-encoding") + 1
      - doc: "protoMajor is what Parse sets Proto to: the profile's one version."
        name: protoMajor
        type: uint8
        value: "1"
    name: byteValues
  - doc: fieldKind names the fields the profile reads; kindOther is every other one.
    grouped: true
    items:
      - doc: kindOther is a field the profile carries without reading.
        name: kindOther
        type: fieldKind
        value: iota
      - doc: kindHost is Host.
        name: kindHost
      - doc: kindExpect is Expect.
        name: kindExpect
      - doc: kindConnection is Connection.
        name: kindConnection
      - doc: kindAuthorization is Authorization.
        name: kindAuthorization
      - doc: kindContentLength is Content-Length.
        name: kindContentLength
      - doc: kindTransferEncoding is Transfer-Encoding.
        name: kindTransferEncoding
    name: kindOther
  - doc: The bucket table's shape.
    grouped: true
    items:
      - doc: bucketShardsLarge is how many shards a large table is split into.
        name: bucketShardsLarge
        type: int
        value: "64"
      - doc: |-
          bucketShardsThreshold is the key count at which a table takes its shards:
          below it the LRU is one list, exact.
        name: bucketShardsThreshold
        type: int
        value: "8192"
      - doc: nanosPerSecond is how many nanoseconds a second holds.
        name: nanosPerSecond
        type: float64
        value: float64(time.Second)
      - doc: fullTable is the fraction of slots an open-addressed index may use.
        name: indexGrowth
        type: int
        value: "2"
      - doc: noEntry marks an empty index slot and the ends of a shard's LRU list.
        name: noEntry
        type: int32
        value: "-1"
    name: bucketShardsLarge
  - grouped: true
    items:
      - doc: "RefusalNone is no refusal: the request was framed, or needs more bytes."
        name: RefusalNone
        type: Refusal
        value: iota
      - doc: |-
          RefusalRequestLine is a request line that does not end right after its
          version.
        name: RefusalRequestLine
      - doc: RefusalMethod is an empty method, or one that is not a token.
        name: RefusalMethod
      - doc: |-
          RefusalTarget is an empty request-target, or one holding a control byte,
          DEL or a byte from 0x80 up.
        name: RefusalTarget
      - doc: RefusalVersion is any version but HTTP/1.1.
        name: RefusalVersion
      - doc: RefusalBareCR is a CR not followed by LF.
        name: RefusalBareCR
      - doc: RefusalBareLF is a LF not preceded by CR.
        name: RefusalBareLF
      - doc: RefusalNUL is a NUL inside a field value or name.
        name: RefusalNUL
      - doc: |-
          RefusalControl is a control byte other than the tab, or DEL, inside a
          field value.
        name: RefusalControl
      - doc: |-
          RefusalObsFold is a field line that starts with a space or a tab: the
          obsolete line folding (RFC 9112 §5.2).
        name: RefusalObsFold
      - doc: |-
          RefusalSpaceBeforeColon is whitespace between a field name and its colon
          (RFC 9112 §5.1).
        name: RefusalSpaceBeforeColon
      - doc: |-
          RefusalName is an empty field name, one that is not a token, or a field
          line with no colon.
        name: RefusalName
      - doc: |-
          RefusalTransferEncoding is any Transfer-Encoding field, chunked or not:
          the profile frames by Content-Length alone, so it carries no chunked body
          and no trailer.
        name: RefusalTransferEncoding
      - doc: |-
          RefusalContentLength is a Content-Length that is empty, not decimal
          digits, or longer than corenet.HTTP1MaxContentLengthDigits.
        name: RefusalContentLength
      - doc: |-
          RefusalContentLengthDuplicated is a second Content-Length field, equal to
          the first or not.
        name: RefusalContentLengthDuplicated
      - doc: RefusalAuthorizationDuplicated is a second Authorization field.
        name: RefusalAuthorizationDuplicated
      - doc: RefusalHostDuplicated is a second Host field.
        name: RefusalHostDuplicated
      - doc: |-
          RefusalExpect is an Expect field: the profile sends no interim response,
          so 100-continue cannot be met (RFC 9110 §10.1.1).
        name: RefusalExpect
      - doc: RefusalHeadTooLarge is a head that does not end within the head bound.
        name: RefusalHeadTooLarge
      - doc: RefusalTooManyFields is a field line past corenet.HTTP1MaxFields.
        name: RefusalTooManyFields
      - doc: RefusalTargetTooLong is a request-target past the target bound.
        name: RefusalTargetTooLong
      - doc: RefusalBodyTooLarge is a Content-Length past the body bound.
        name: RefusalBodyTooLarge
      - doc: "RefusalMethodUnsupported is CONNECT: the profile opens no tunnel."
        name: RefusalMethodUnsupported
      - doc: |-
          RefusalTargetPath is a target whose path holds a dot-segment, an empty
          segment, a backslash, an invalid percent-escape, or an encoded slash, dot,
          backslash or NUL: a path two links of a chain, or a link and a backend,
          could read as two different resources.
        name: RefusalTargetPath
      - doc: |-
          RefusalTargetForm is a target in none of the forms the profile serves:
          origin-form, absolute-form with an http or https scheme, or "*" for OPTIONS.
        name: RefusalTargetForm
      - doc: |-
          RefusalTargetHost is an absolute-form target whose authority carries
          userinfo, is empty, or differs from the Host field, or comes with no Host
          field at all.
        name: RefusalTargetHost
    name: RefusalNone
  - doc: "refusalCount is one past the last Refusal: the length of every table below."
    items:
      - name: refusalCount
        type: int
        value: int(RefusalTargetHost) + 1
    name: refusalCount
  - doc: The status codes a refusal is answered with (RFC 9110 §15).
    grouped: true
    items:
      - doc: statusBadRequest answers every syntax and framing refusal.
        name: statusBadRequest
        type: int
        value: "400"
      - doc: statusContentTooLarge answers a body past its bound.
        name: statusContentTooLarge
        type: int
        value: "413"
      - doc: statusURITooLong answers a target past its bound.
        name: statusURITooLong
        type: int
        value: "414"
      - doc: statusExpectationFailed answers an Expect field.
        name: statusExpectationFailed
        type: int
        value: "417"
      - doc: statusFieldsTooLarge answers a head past its bound.
        name: statusFieldsTooLarge
        type: int
        value: "431"
      - doc: statusNotImplemented answers CONNECT.
        name: statusNotImplemented
        type: int
        value: "501"
    name: statusBadRequest
  - grouped: true
    items:
      - doc: |-
          schemeHTTP and schemeHTTPS are the schemes an absolute-form target may
          name, lowercase: foldIs compares a target's scheme to them whatever its
          case.
        name: schemeHTTP
        type: string
        value: "\"http://\""
      - doc: schemeHTTPS is "https://".
        name: schemeHTTPS
        type: string
        value: "\"https://\""
      - doc: noDigit is hexDigits' value for a byte that is no hexadecimal digit.
        name: noDigit
        type: byte
        value: "0xFF"
      - doc: decimalDigits is how many digits 0-9 are.
        name: decimalDigits
        type: int
        value: "10"
      - doc: hexLetters is how many letters a-f are.
        name: hexLetters
        type: int
        value: "6"
      - doc: "escapeLen is the length of a percent-escape: '%' and two digits."
        name: escapeLen
        type: int
        value: "3"
    name: schemeHTTP
  - doc: The status codes the writer reasons about.
    grouped: true
    items:
      - doc: statusOK is what a zero HTTP1ResponseValue.Status means.
        name: statusOK
        type: int
        value: "200"
      - doc: statusNoContent carries neither a length nor a body.
        name: statusNoContent
        type: int
        value: "204"
      - doc: statusNotModified carries neither a length nor a body.
        name: statusNotModified
        type: int
        value: "304"
      - doc: statusSwitching is the one interim status the profile sends, for Upgrade.
        name: statusSwitching
        type: int
        value: "101"
      - doc: statusInternal answers what the writer refused or a handler left deferred.
        name: statusInternal
        type: int
        value: "500"
      - doc: "statusMin is the lowest status the profile sends: no interim response."
        name: statusMin
        type: int
        value: "200"
      - doc: statusMax is the highest three-digit status.
        name: statusMax
        type: int
        value: "999"
      - doc: statusRegistered is one past the highest code statusLines spells.
        name: statusRegistered
        type: int
        value: "600"
      - doc: decimal is the base a status and a Content-Length are written in.
        name: decimal
        type: int
        value: "10"
    name: statusOK
