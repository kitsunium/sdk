# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: version is the one version the profile speaks.
    items:
      - name: version
        type: string
        value: "\"HTTP/1.1\""
    name: version
  - grouped: true
    items:
      - doc: "byteValues is how many values a byte takes: the size of a byte table."
        name: byteValues
        type: int
        value: "256"
      - doc: tokenStride is how many name bytes tokenEnd tests per turn.
        name: tokenStride
        type: int
        value: "4"
      - doc: crlfLen is the length of a line's end.
        name: crlfLen
        type: int
        value: "2"
      - doc: decimalBase is the base of a Content-Length.
        name: decimalBase
        type: int64
        value: "10"
      - doc: lastDigit is the largest value of one decimal digit.
        name: lastDigit
        type: byte
        value: "9"
      - doc: asciiCase is the bit that tells a lowercase ASCII letter from its capital.
        name: asciiCase
        type: byte
        value: "0x20"
      - doc: asciiDEL is the one control byte above the space.
        name: asciiDEL
        type: byte
        value: "0x7f"
      - doc: asciiSpace is the first byte that is not a C0 control.
        name: asciiSpace
        type: byte
        value: "0x20"
      - doc: |-
          knownMaxLen is one past the longest name the profile reads,
          transfer-encoding.
        name: knownMaxLen
        type: int
        value: len("transfer-encoding") + 1
    name: byteValues
  - doc: fieldKind names the fields the profile reads; kindOther is every other one.
    grouped: true
    items:
      - doc: kindOther is a field the profile carries without reading.
        name: kindOther
        type: fieldKind
        value: iota
      - doc: kindHost is Host.
        name: kindHost
      - doc: kindExpect is Expect.
        name: kindExpect
      - doc: kindConnection is Connection.
        name: kindConnection
      - doc: kindAuthorization is Authorization.
        name: kindAuthorization
      - doc: kindContentLength is Content-Length.
        name: kindContentLength
      - doc: kindTransferEncoding is Transfer-Encoding.
        name: kindTransferEncoding
    name: kindOther
  - grouped: true
    items:
      - doc: "RefusalNone is no refusal: the request was framed, or needs more bytes."
        name: RefusalNone
        type: Refusal
        value: iota
      - doc: |-
          RefusalRequestLine is a request line that does not end right after its
          version.
        name: RefusalRequestLine
      - doc: RefusalMethod is an empty method, or one that is not a token.
        name: RefusalMethod
      - doc: |-
          RefusalTarget is an empty request-target, or one holding a control byte,
          DEL or a byte from 0x80 up.
        name: RefusalTarget
      - doc: RefusalVersion is any version but HTTP/1.1.
        name: RefusalVersion
      - doc: RefusalBareCR is a CR not followed by LF.
        name: RefusalBareCR
      - doc: RefusalBareLF is a LF not preceded by CR.
        name: RefusalBareLF
      - doc: RefusalNUL is a NUL inside a field value or name.
        name: RefusalNUL
      - doc: |-
          RefusalControl is a control byte other than the tab, or DEL, inside a
          field value.
        name: RefusalControl
      - doc: |-
          RefusalObsFold is a field line that starts with a space or a tab: the
          obsolete line folding (RFC 9112 §5.2).
        name: RefusalObsFold
      - doc: |-
          RefusalSpaceBeforeColon is whitespace between a field name and its colon
          (RFC 9112 §5.1).
        name: RefusalSpaceBeforeColon
      - doc: |-
          RefusalName is an empty field name, one that is not a token, or a field
          line with no colon.
        name: RefusalName
      - doc: |-
          RefusalTransferEncoding is any Transfer-Encoding field, chunked or not:
          the profile frames by Content-Length alone, so it carries no chunked body
          and no trailer.
        name: RefusalTransferEncoding
      - doc: |-
          RefusalContentLength is a Content-Length that is empty, not decimal
          digits, or longer than corenet.HTTP1MaxContentLengthDigits.
        name: RefusalContentLength
      - doc: |-
          RefusalContentLengthDuplicated is a second Content-Length field, equal to
          the first or not.
        name: RefusalContentLengthDuplicated
      - doc: RefusalAuthorizationDuplicated is a second Authorization field.
        name: RefusalAuthorizationDuplicated
      - doc: RefusalHostDuplicated is a second Host field.
        name: RefusalHostDuplicated
      - doc: |-
          RefusalExpect is an Expect field: the profile sends no interim response,
          so 100-continue cannot be met (RFC 9110 §10.1.1).
        name: RefusalExpect
      - doc: RefusalHeadTooLarge is a head that does not end within the head bound.
        name: RefusalHeadTooLarge
      - doc: RefusalTooManyFields is a field line past corenet.HTTP1MaxFields.
        name: RefusalTooManyFields
      - doc: RefusalTargetTooLong is a request-target past the target bound.
        name: RefusalTargetTooLong
      - doc: RefusalBodyTooLarge is a Content-Length past the body bound.
        name: RefusalBodyTooLarge
      - doc: "RefusalMethodUnsupported is CONNECT: the profile opens no tunnel."
        name: RefusalMethodUnsupported
    name: RefusalNone
  - doc: "refusalCount is one past the last Refusal: the length of every table below."
    items:
      - name: refusalCount
        type: int
        value: int(RefusalMethodUnsupported) + 1
    name: refusalCount
  - doc: The status codes a refusal is answered with (RFC 9110 §15).
    grouped: true
    items:
      - doc: statusBadRequest answers every syntax and framing refusal.
        name: statusBadRequest
        type: int
        value: "400"
      - doc: statusContentTooLarge answers a body past its bound.
        name: statusContentTooLarge
        type: int
        value: "413"
      - doc: statusURITooLong answers a target past its bound.
        name: statusURITooLong
        type: int
        value: "414"
      - doc: statusExpectationFailed answers an Expect field.
        name: statusExpectationFailed
        type: int
        value: "417"
      - doc: statusFieldsTooLarge answers a head past its bound.
        name: statusFieldsTooLarge
        type: int
        value: "431"
      - doc: statusNotImplemented answers CONNECT.
        name: statusNotImplemented
        type: int
        value: "501"
    name: statusBadRequest
  - doc: The status codes the writer reasons about.
    grouped: true
    items:
      - doc: statusOK is what a zero HTTP1ResponseValue.Status means.
        name: statusOK
        type: int
        value: "200"
      - doc: statusNoContent carries neither a length nor a body.
        name: statusNoContent
        type: int
        value: "204"
      - doc: statusNotModified carries neither a length nor a body.
        name: statusNotModified
        type: int
        value: "304"
      - doc: "statusMin is the lowest status the profile sends: no interim response."
        name: statusMin
        type: int
        value: "200"
      - doc: statusMax is the highest three-digit status.
        name: statusMax
        type: int
        value: "999"
      - doc: statusRegistered is one past the highest code statusLines spells.
        name: statusRegistered
        type: int
        value: "600"
      - doc: decimal is the base a status and a Content-Length are written in.
        name: decimal
        type: int
        value: "10"
    name: statusOK
