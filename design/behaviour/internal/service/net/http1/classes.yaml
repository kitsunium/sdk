      - ranOut
      - Continue
      - Pending
      - reset
      - requestLine
      - method
      - requestTarget
      - tooLong
      - emptyOrLong
      - versionLine
      - versionPrefix
      - versionEnd
      - lineEnd
      - fields
      - lineStart
      - crlfAt
      - field
      - fieldValue
      - valueStopAt
      - crValue
      - trimRight
      - nameEnd
      - crName
      - known
      - kindOf
      - host
      - authorization
      - contentLength
      - hasField
      - hasClose
      - nextToken
      - isListSep
      - tokenEnd
      - foldIs
    name: parse.go
  - decls:
      - bucketShardsLarge
      - KeyedBucketsValue
      - KeyedBuckets
      - bucketShard
      - bucketEntry
      - NewKeyedBuckets
      - (*bucketShard).init
      - (*KeyedBuckets).Allow
      - ceilToInt
      - (*bucketShard).lookup
      - (*bucketShard).touch
      - (*bucketShard).link
      - (*bucketShard).unlink
      - (*bucketShard).evictTail
      - (*bucketShard).moveEntry
      - (*bucketShard).removeIndex
      - (*bucketShard).movable
    name: ratelimit.go
  - decls:
      - RefusalNone
      - refusalCount
      - statusBadRequest
      - refusalNames
      - Refusal
      - Refusal.String
      - Refusal.Status
      - Refusal.Err
    name: refusal.go
  - decls:
      - (*LoopHandler).openStream
      - (*LoopHandler).feedUpgraded
      - (*LoopHandler).announceStreams
      - (*LoopHandler).OnDrain
    name: stream.go
  - decls:
      - schemeHTTP
      - hexDigits
      - hexTable
      - Canonical
      - absoluteForm
      - cutScheme
      - authorityIsHost
      - splitPath
      - checkPath
      - pathByte
      - dotSegment
      - escapeAllowed
      - foldEqualBytes
      - lowerASCII
    name: target.go
  - decls:
      - statusOK
      - statusLines
      - refusalAnswerTable
      - AppendStatusLine
      - AppendField
      - token
      - fieldText
      - owned
      - AppendResponse
      - appendUpgrade
      - refusedBody
      - bodyLength
      - appendLinkFields
      - appendFraming
      - AppendRefusal
      - appendInternalError
      - appendRequestID
      - appendRetryAfter
    name: write.go
functions:
  - doc: newLink finds next's batcher once, never per batch.
    name: newLink
    params: next corenet.HTTP1Handler
    results: link
  - doc: misconfigured wraps HTTP1Misconfigured with the link and what it refused.
    name: misconfigured
    params: linkName, what string
    results: error
  - name: Routes
    params: routes ...RouteValue
    results: corenet.Middleware[corenet.HTTP1Handler], error
  - doc: |-
      checkRoute refuses a route whose ID, method or path breaks a rule, against
      the routes before it.
    name: checkRoute
    params: r RouteValue, before []RouteValue
    results: error
  - doc: |-
      prefixOf reports whether prefix starts path on a segment boundary: path is
      prefix, prefix ends in '/', or path's next byte is '/' — so a prefix route
      never takes a sibling whose name merely starts like it.
    name: prefixOf
    params: prefix, path []byte
    results: bool
  - name: Bearer
    params: v corenet.HTTP1BearerVerifier, exempt ...int
    results: corenet.Middleware[corenet.HTTP1Handler], error
  - doc: |-
      bearerToken returns the token of an "Authorization: Bearer <token>" field,
      and false when there is none.
    name: bearerToken
    params: req *corenet.HTTP1RequestValue
    results: "[]byte, bool"
  - doc: |-
      addHeader gives res the field lines b: b itself when res has none, which
      costs nothing, or a copy after the ones it has.
    name: addHeader
    params: res *corenet.HTTP1ResponseValue, b []byte
  - name: Headers
    params: pairs ...string
    results: corenet.Middleware[corenet.HTTP1Handler], error
  - name: Log
    params: l corenet.HTTP1AccessLogger, opts ...LogOption
    results: corenet.Middleware[corenet.HTTP1Handler], error
  - name: LogAllow
    params: names ...string
    results: LogOption
  - name: LogSlowerThan
    params: d time.Duration
    results: LogOption
  - name: LogSample
    params: n int
    results: LogOption
  - name: LogClock
    params: c clock.Clock
    results: LogOption
  - name: CORS
    params: cfg corenet.CORSValue
    results: corenet.Middleware[corenet.HTTP1Handler], error
  - doc: newLogConfig folds and checks opts.
    name: newLogConfig
    params: opts []LogOption
    results: "*logConfig, error"
  - doc: credential reports whether name is a field Log never records.
    name: credential
    params: name string
    results: bool
  - doc: repeated reports whether name is among before, case-insensitive.
    name: repeated
    params: name string, before []string
    results: bool
  - doc: stageOf names what a record says about the answer res holds.
    name: stageOf
    params: res *corenet.HTTP1ResponseValue
    results: corenet.HTTP1AccessStage
  - doc: |-
      completionStatus is the status a deferred answer leaves with: the 500 the
      adapter writes for one left deferred, or the handler's, zero meaning 200.
    name: completionStatus
    params: res *corenet.HTTP1ResponseValue
    results: int
  - name: Trace
    results: corenet.Middleware[corenet.HTTP1Handler]
  - name: RequestIDMint
    results: RequestIDOption
  - name: RequestID
    params: opts ...RequestIDOption
    results: corenet.Middleware[corenet.HTTP1Handler]
  - doc: |-
      mintRequestID writes req.ID as sixteen lowercase hexadecimal digits into
      req.RequestID, the digits of the value being the only input: no clock, no
      randomness, nothing shared between lanes.
    name: mintRequestID
    params: req *corenet.HTTP1RequestValue
  - name: RateKeySubject
    results: RateKey
  - name: RateKeyRoute
    results: RateKey
  - name: RateKeyLane
    results: RateKey
  - name: RateKeyField
    params: name string
    results: RateKey
  - name: RateExempt
    params: ids ...int
    results: RateOption
  - name: RateClock
    params: c clock.Clock
    results: RateOption
  - name: RateLimit
    params: l corenet.HTTP1Limiter, key RateKey, opts ...RateOption
    results: corenet.Middleware[corenet.HTTP1Handler], error
  - doc: appendBE writes v big-endian into buf and returns it as a slice.
    name: appendBE
    params: buf *[routeKeyLen]byte, v uint64
    results: "[]byte"
  - doc: |-
      findCanceller walks the chain down to the first link that holds job entries.

      IFACE-OPAQUE: an internal capability of a chain link, found by the walk,
      returned as the type it is tested for.
    name: findCanceller
    params: h corenet.HTTP1Handler
    results: jobCanceller
  - doc: |-
      closeFileReader closes r when it can be closed, on every path a file's
      answer ends; closing a nil reader changes nothing.
    name: closeFileReader
    params: r io.ReaderAt
  - doc: |-
      slotCopy returns slot's chunk job, its buffer of the chunk size kept from an
      earlier one.
    name: slotCopy
    params: slot *pendSlot, chunk int64
    results: "*copyJob"
  - doc: |-
      workCopy reads one chunk, on the lane's worker. A connection gone meanwhile
      costs nothing but this read: OnDone gives the slot back.
    name: workCopy
    params: slot *pendSlot
  - doc: |-
      closedFile gives up a file still leaving when its connection closed: a chunk
      out with the worker is dropped at its completion, anything else closes now; a
      native file is the engine's.
    name: closedFile
    params: f *connFlag, st *loopState
  - name: Files
    params: route int, fsys fs.FS, cfg static.Config
    results: corenet.Middleware[corenet.HTTP1Handler], error
  - doc: |-
      filesBase renders the fields every answer of the tree carries: the static
      tree's policies, validated by its constructor, no control character in them.
    name: filesBase
    params: cfg static.Config
    results: "[]byte"
  - doc: filesAllowField is base with the Allow of a 405.
    name: filesAllowField
    params: base []byte
    results: "[]byte"
  - doc: |-
      copyField appends the value of the named field to dst when it is present
      and within the cap, else leaves dst empty.
    name: copyField
    params: dst []byte, req *corenet.HTTP1RequestValue, name string
    results: "[]byte"
  - doc: |-
      appendDecoded appends p, percent-decoded, to dst: the codec has already
      refused every escape of '/', '.', '\' and NUL and every malformed one.
    name: appendDecoded
    params: dst, p []byte
    results: "[]byte"
  - doc: unhex is a hexadecimal digit's value.
    name: unhex
    params: c byte
    results: byte
  - doc: |-
      checkLinks lstats every element of name, without following, and refuses a
      link (in or out of the root: the rule is the same) and anything but a
      regular file or a directory, before any open that would follow or block.
    name: checkLinks
    params: lfs fs.ReadLinkFS, name string
    results: error
  - doc: |-
      sameFile compares two infos of the same name by their sizes, modification
      times and types: enough to catch a file swapped between check and open, the
      os.SameFile identity being refused to a tree that may be embed.FS.
    name: sameFile
    params: a, b fs.FileInfo
    results: bool
  - doc: |-
      filesLookupErr maps a failed lookup: a name the file system refuses is
      absent, as the static tree's own rule has it, anything else the tree's.
    name: filesLookupErr
    params: err error
    results: error
  - doc: |-
      redirectSlash sends a directory named without its slash to the name with
      one, as the static tree does: the Location starts with "./" and is one
      escaped segment, so no directory name reads as another host.
    name: redirectSlash
    params: res *corenet.HTTP1ResponseValue, name string
  - doc: |-
      appendEscaped appends the bytes of s, percent-encoded but for a path
      segment's unreserved characters, as url.PathEscape does for a segment.
    name: appendEscaped
    params: dst []byte, s string
    results: "[]byte"
  - doc: unreservedByte reports a letter, a digit or an unreserved punctuation mark.
    name: unreservedByte
    params: c byte
    results: bool
  - doc: readerOf gives the file as an io.ReaderAt, seekable or sequential.
    name: readerOf
    params: f fs.File
    results: io.ReaderAt, bool
  - doc: |-
      contentTypeOf is the type of name: the pinned ones, then the host's table,
      else the type that promises nothing — nosniff means a browser will not guess.
    name: contentTypeOf
    params: name string
    results: string
  - doc: |-
      pinnedType returns the Content-Type of the extensions a page cannot run
      without, the same on every host — the static tree's table, copied here
      because it is unexported there: a later change should share one table.
    name: pinnedType
    params: extension string
    results: contentType string, pinned bool
  - doc: |-
      appendETag appends the file's weak validator, from what stat says of it:
      its size and modification time, in hexadecimal.
    name: appendETag
    params: dst []byte, info fs.FileInfo
    results: "[]byte"
  - doc: |-
      etagListed reports whether etag is in the comma-separated list, compared
      weakly: a W/ prefix on either side changes nothing.
    name: etagListed
    params: list, etag []byte
    results: bool
  - doc: |-
      parseRange reads one "bytes=first-last", "bytes=first-" or "bytes=-suffix"
      over a file of size bytes and returns the range and its status: 206, 200
      for another unit or several ranges, which a server may ignore (RFC 9110
      §14.2), or 416 for one malformed or past the end.
    name: parseRange
    params: spec []byte, size int64
    results: off, n int64, status int
  - doc: |-
      suffixRange is the last v bytes of a file of size bytes: 416 for a suffix of
      nothing, an empty file, or not a number.
    name: suffixRange
    params: last []byte, size int64
    results: off, n int64, status int
  - doc: fromRange reads "first-" or "first-last" over a file of size bytes.
    name: fromRange
    params: first, last []byte, size int64
    results: off, n int64, status int
  - doc: parseOffset reads a run of decimal digits, refusing one past int64.
    name: parseOffset
    params: b []byte
    results: int64, bool
  - doc: appendContentRange appends a 206's Content-Range field.
    name: appendContentRange
    params: dst []byte, off, n, size int64
    results: "[]byte"
  - doc: |-
      cleanName turns the decoded path under the route into a name of the tree,
      rooted so no ".." survives, made relative as io/fs requires; a name io/fs
      could not hold (invalid UTF-8) is left for the file system to refuse.
    name: cleanName
    params: p string
    results: string
  - doc: closeTreeFile closes an opened file the answer does not keep.
    name: closeTreeFile
    params: f fs.File
  - name: HandleLoop
    params: h corenet.HTTP1Handler, p Parser
    results: "*LoopHandler"
  - doc: newLoopHandler finds h's optional capabilities once, never per batch.
    name: newLoopHandler
    params: h corenet.HTTP1Handler, p Parser
    results: "*LoopHandler"
  - doc: |-
      findStreamer walks a chain of links down to the handler that speaks the
      stream port, so a stream may run behind Routes, Bearer or Log. The chain was
      built once, here it is read once.
    name: findStreamer
    params: h corenet.HTTP1Handler
    results: corenet.HTTP1Streamer
  - doc: |-
      findWorker walks a chain of links down to the handler that takes a pending
      answer's job, so a Files link or a worker sits behind Routes, Bearer or Log.
    name: findWorker
    params: h corenet.HTTP1Handler
    results: corenet.HTTP1Worker
  - doc: |-
      strayFile answers a file set outside a worker's answer: a 500, its reader
      closed, the connection closing. Only a worker's answer may hold one.
    name: strayFile
    params: res *corenet.HTTP1ResponseValue, closing bool
    results: bool
  - doc: |-
      swallowErr intentionally discards a non-actionable error, recording the
      discard so the error audit treats it as deliberate: the adapter has no
      caller to return a refused Close to, and a refused Close means the
      connection is already gone.
    name: swallowErr
    params: err error
  - doc: isHead reports whether method is HEAD.
    name: isHead
    params: method []byte
    results: bool
  - doc: |-
      appendHeld appends res's answer and reports whether the connection closes
      after it: a response left deferred or pending, or one the writer refuses,
      is a 500 that closes it.
    name: appendHeld
    params: dst []byte, stub *corenet.HTTP1RequestValue, res *corenet.HTTP1ResponseValue, closing bool
    results: appended []byte, closes, refused bool
  - doc: "tokenTable builds the tchar table: the alphanumerics and fifteen symbols."
    name: tokenTable
    results: "[byteValues]bool"
  - name: NewParser
    params: l corenet.HTTP1LimitsValue
    results: Parser, error
  - doc: orDefault returns v, or def when v is zero.
    name: orDefault
    params: v, def T
    results: T
    typeParams: T int | int64
  - doc: |-
      ranOut turns a scan's outcome into Parse's refusal: a scan that stopped for
      want of bytes is a refusal only once the head bound has been reached.
    name: ranOut
    params: r Refusal, n, head int
    results: Refusal
  - name: Continue
    params: buf []byte, req *corenet.HTTP1RequestValue
    results: int
  - name: Pending
    params: req *corenet.HTTP1RequestValue, buffered int
    results: int
  - doc: |-
      reset clears what Parse sets, leaving the field array's stale entries past
      NFields, which nothing reads.
    name: reset
    params: req *corenet.HTTP1RequestValue
  - doc: |-
      requestLine reads "method SP target SP HTTP/1.1 CRLF" from the start of
      head and returns the index after it, or 0 when head ends first, or a
      refusal.
    name: requestLine
    params: head []byte, target int, req *corenet.HTTP1RequestValue
    results: int, Refusal
  - doc: method reads the method and its space, and returns the index after them.
    name: method
    params: head []byte, req *corenet.HTTP1RequestValue
    results: int, Refusal
  - doc: |-
      requestTarget reads the target that starts at start, and its space, and
      returns the index after them.
    name: requestTarget
    params: head []byte, start, bound int, req *corenet.HTTP1RequestValue
    results: int, Refusal
  - doc: tooLong returns RefusalTargetTooLong when past is true, RefusalNone else.
    name: tooLong
    params: past bool
    results: Refusal
  - doc: |-
      emptyOrLong names the refusal of a target of n bytes that is either empty
      or past its bound.
    name: emptyOrLong
    params: n int
    results: Refusal
  - doc: |-
      versionLine reads "HTTP/1.1 CRLF" at start and returns the index after it,
      or 0 when head ends first, or a refusal.
    name: versionLine
    params: head []byte, start int
    results: int, Refusal
  - doc: |-
      versionPrefix judges a version line cut short: rest holds fewer bytes than
      the version and its CRLF.
    name: versionPrefix
    params: rest []byte
    results: Refusal
  - doc: |-
      versionEnd judges the bytes after the version: c, and next when have says
      it has arrived.
    name: versionEnd
    params: c, next byte, have bool
    results: Refusal
  - doc: |-
      lineEnd names the refusal for c found where a request-line element should
      go on: a bare CR or LF when it is one, def otherwise.
    name: lineEnd
    params: c byte, def Refusal
    results: Refusal
  - doc: |-
      fields reads the field lines from start up to and including the blank line,
      and returns the index after it, or 0 when head ends first, or a refusal.
    name: fields
    params: head []byte, start int, body int64, req *corenet.HTTP1RequestValue
    results: int, Refusal
  - doc: |-
      lineStart judges the first byte of a line at pos: the blank line (done, and
      the index after it), a refusal, the bytes running out (0), or a field line
      (pos itself).
    name: lineStart
    params: head []byte, pos, nfields int
    results: int, bool, Refusal
  - doc: |-
      crlfAt judges the CR at pos: the index after its LF, 0 while the LF has not
      arrived, or a bare CR.
    name: crlfAt
    params: head []byte, pos int
    results: int, Refusal
  - doc: |-
      field reads one field line at start, records it, and returns the index
      after its CRLF, or 0 when head ends first, or a refusal.
    name: field
    params: head []byte, start int, body int64, req *corenet.HTTP1RequestValue
    results: int, Refusal
  - doc: |-
      fieldValue scans a field value from start: it skips the leading whitespace
      and returns where the value starts and the index of its CR, or a 0 end when
      head ends first, or a refusal.
    name: fieldValue
    params: head []byte, start int
    results: valueStart, valueEnd int, refusal Refusal
  - doc: |-
      valueStopAt judges the control byte that stopped a value scan at pos, the
      byte after it present: RefusalNone for a CRLF, or a refusal named after the
      byte.
    name: valueStopAt
    params: head []byte, pos int
    results: Refusal
  - doc: crValue judges the CR that ends a value at pos, the byte after it present.
    name: crValue
    params: head []byte, pos int
    results: Refusal
  - doc: trimRight returns v without its trailing spaces and tabs.
    name: trimRight
    params: v []byte
    results: "[]byte"
  - doc: |-
      nameEnd names the refusal for a field name of n bytes that stopped at pos
      on something other than its colon. A CR whose LF has not arrived yet gives
      RefusalNone, which the caller reads as "more bytes".
    name: nameEnd
    params: head []byte, pos, n int
    results: Refusal
  - doc: crName judges the CR that ends a field line with no colon.
    name: crName
    params: head []byte, pos int
    results: Refusal
  - doc: |-
      known applies the profile's rules to the fields it reads — Host,
      Authorization, Content-Length, Connection, Expect and Transfer-Encoding —
      and lets every other field through.
    name: known
    params: name, value []byte, body int64, req *corenet.HTTP1RequestValue
    results: Refusal
  - doc: |-
      kindOf returns which known field name is, or kindOther: no two known
      names share a length, so one comparison decides.
    name: kindOf
    params: name []byte
    results: fieldKind
  - doc: host records the Host field, refusing a second one.
    name: host
    params: value []byte, req *corenet.HTTP1RequestValue
    results: Refusal
  - doc: authorization records the Authorization field, refusing a second one.
    name: authorization
    params: value []byte, req *corenet.HTTP1RequestValue
    results: Refusal
  - doc: |-
      contentLength reads a Content-Length value: one to ten decimal digits, no
      sign, no space, no list, at most body, and the first of its name.
    name: contentLength
    params: value []byte, body int64, req *corenet.HTTP1RequestValue
    results: Refusal
  - doc: hasField reports whether req already holds a field named name.
    name: hasField
    params: req *corenet.HTTP1RequestValue, name string
    results: bool
  - doc: |-
      hasClose reports whether a Connection value, a comma list of tokens, holds
      the close token.
    name: hasClose
    params: v []byte
    results: bool
  - doc: |-
      nextToken returns the token of a comma list that starts at or after pos,
      separators skipped, and the index after it.
    name: nextToken
    params: v []byte, pos int
    results: "[]byte, int"
  - doc: isListSep reports whether c separates the tokens of a comma list.
    name: isListSep
    params: c byte
    results: bool
  - doc: tokenEnd returns the length of the run of tchar bytes b starts with.
    name: tokenEnd
    params: b []byte
    results: int
  - doc: |-
      foldIs reports whether b equals lit once A–Z in b are folded to a–z. lit is
      lowercase letters and '-' only, which is what makes OR 0x20 exact: a byte
      ORed with 0x20 equals a lowercase letter only when it is that letter or its
      capital, and equals '-' only when it is '-' or CR, which no caller passes —
      a name is a token, and a Connection value holds no CR.
    name: foldIs
    params: b T, lit string
    results: bool
    typeParams: T ~string | ~[]byte
  - name: NewKeyedBuckets
    params: cfg KeyedBucketsValue
    results: "*KeyedBuckets, error"
  - doc: ceilToInt rounds up a positive count of seconds.
    name: ceilToInt
    params: v float64
    results: int
  - doc: hexTable builds hexDigits.
    name: hexTable
    results: "[byteValues]byte"
  - name: Canonical
    params: req *corenet.HTTP1RequestValue
    results: Refusal
  - doc: |-
      absoluteForm reduces an absolute-form target to its path once its
      authority matched the Host field, A–Z folded (RFC 9112 §3.2.2: a server
      that kept both could route by one and authorise by the other).
    name: absoluteForm
    params: t []byte, req *corenet.HTTP1RequestValue
    results: Refusal
  - doc: |-
      cutScheme returns what follows an http:// or https:// scheme, in any case,
      and false for any other target.
    name: cutScheme
    params: t []byte
    results: "[]byte, bool"
  - doc: |-
      authorityIsHost reports whether an absolute-form authority is non-empty,
      carries no userinfo, and equals the request's Host field, A–Z folded.
    name: authorityIsHost
    params: authority []byte, req *corenet.HTTP1RequestValue
    results: bool
  - doc: splitPath cuts p, which starts with "/", at its query and checks the path.
    name: splitPath
    params: p []byte, req *corenet.HTTP1RequestValue
    results: Refusal
  - doc: |-
      checkPath refuses a path, which starts with "/", holding an empty segment
      but the last, a "." or ".." segment, a backslash, an invalid escape, or an
      escape of '/', '.', '\' or NUL.
    name: checkPath
    params: p []byte
    results: Refusal
  - doc: |-
      pathByte returns how many bytes of p at i one path byte takes — three for
      an escape, one otherwise — or 0 for a backslash or a refused escape.
    name: pathByte
    params: p []byte, i int
    results: int
  - doc: dotSegment reports whether seg is "." or "..".
    name: dotSegment
    params: seg []byte
    results: bool
  - doc: |-
      escapeAllowed reports whether p holds two hexadecimal digits after the '%'
      at i, decoding to a byte other than '/', '.', '\' and NUL.
    name: escapeAllowed
    params: p []byte, i int
    results: bool
  - doc: foldEqualBytes reports whether a and b are equal once A–Z are folded.
    name: foldEqualBytes
    params: a, b []byte
    results: bool
  - doc: lowerASCII maps A–Z onto a–z and every other byte onto itself.
    name: lowerASCII
    params: c byte
    results: byte
  - doc: refusalAnswerTable spells, once, the answer to every refusal.
    name: refusalAnswerTable
    results: "[refusalCount]string"
  - name: AppendStatusLine
    params: dst []byte, status int
    results: "[]byte, error"
  - name: AppendField
    params: dst []byte, name, value string
    results: "[]byte, error"
  - doc: token reports whether s is a non-empty RFC 9110 token.
    name: token
    params: s string
    results: bool
  - doc: fieldText reports whether s holds no control byte but the tab, and no DEL.
    name: fieldText
    params: s string
    results: bool
  - doc: owned reports whether name is a field the codec writes itself.
    name: owned
    params: name string
    results: bool
  - name: AppendResponse
    params: dst []byte, req *corenet.HTTP1RequestValue, res *corenet.HTTP1ResponseValue, closing bool
    results: "[]byte, error"
  - doc: |-
      appendUpgrade appends a 101: the status line and Connection: Upgrade, then the
      protocol's own fields, which the handler wrote into Header.
    name: appendUpgrade
    params: dst []byte, res *corenet.HTTP1ResponseValue
    results: "[]byte, error"
  - doc: |-
      refusedBody reports a response the status or the method cannot carry: a body
      on a 204 or 304, or a Stream of a HEAD or of a 204 or 304.
    name: refusedBody
    params: res *corenet.HTTP1ResponseValue, req *corenet.HTTP1RequestValue, bodiless bool
    results: bool
  - doc: |-
      bodyLength is the answer's Content-Length: the file's when the body is one,
      else the Body's.
    name: bodyLength
    params: res *corenet.HTTP1ResponseValue
    results: int64
  - doc: |-
      appendLinkFields appends what the chain's links left the codec to write: the
      CORS fields, a refusal's delay and the request's identifier, in that order.
    name: appendLinkFields
    params: dst []byte, res *corenet.HTTP1ResponseValue
    results: "[]byte"
  - doc: |-
      appendFraming appends Content-Length unless the status forbids it,
      Connection: close when asked, and the blank line that ends the head.
    name: appendFraming
    params: dst []byte, n int64, bodiless, closing bool
    results: "[]byte"
  - name: AppendRefusal
    params: dst []byte, r Refusal
    results: "[]byte"
  - doc: |-
      appendInternalError appends the whole answer to a response the writer refused
      or a handler left deferred: a 500 with no body, the connection closed, and
      the request's identifier when a link gave it one, so even this answer can be
      joined to its access record.
    name: appendInternalError
    params: dst []byte, res *corenet.HTTP1ResponseValue
    results: "[]byte"
  - doc: appendRequestID appends the X-Request-Id field line of id.
    name: appendRequestID
    params: dst, id []byte
    results: "[]byte"
  - doc: appendRetryAfter appends the Retry-After field line of seconds.
    name: appendRetryAfter
    params: dst []byte, seconds int
    results: "[]byte"
imports:
  atomic: sync/atomic
  bytes: bytes
  clock: github.com/kitsunium/sdk/internal/kernel/clock
  cmp: cmp
  corenet: github.com/kitsunium/sdk/internal/core/net
  coretrace: github.com/kitsunium/sdk/internal/core/observe/trace
  errors: errors
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  fs: io/fs
  io: io
  maphash: hash/maphash
  mime: mime
  path: path
  slices: slices
  static: github.com/kitsunium/sdk/internal/service/net/static
  strconv: strconv
  strings: strings
  swar: github.com/kitsunium/sdk/internal/kernel/swar
  sync: sync
  time: time
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/net/http1
  name: http1
  purpose: "Package http1 is the restricted HTTP/1.1 profile (ADR 0186 §D6): a codec that frames requests out of bytes and appends responses to bytes, doing no I/O, and HandleLoop, the adapter that serves it on a loop group."
types:
  - fields:
      - doc: ID identifies the route, from 1; zero is "no route".
        name: ID
        type: int
      - doc: Method is the method the route takes, empty for any.
        name: Method
        type: string
      - doc: |-
          Path is the canonical path the route matches, from "/": the whole of
          it, or its start when Prefix is set.
        name: Path
        type: string
      - doc: |-
          Prefix makes Path match the start of a request's path, on a segment
          boundary: "/health" matches "/health" and "/health/live", never
          "/healthz"; a Path ending in "/" matches whatever follows it.
        name: Prefix
        type: bool
    kind: struct
    name: RouteValue
  - doc: |-
      route is a RouteValue as the layer matches it: bytes, compared to the
      request's without a conversion.
    fields:
      - doc: id is the route's ID.
        name: id
        type: int
      - doc: method is the route's method, empty for any.
        name: method
        type: "[]byte"
      - doc: path is the canonical path, or its start.
        name: path
        type: "[]byte"
      - doc: prefix makes path match the start of a request's path.
        name: prefix
        type: bool
    kind: struct
    name: route
  - doc: link is what every layer of the chain keeps of the handler it wraps.
    fields:
      - doc: next is the handler the layer wraps.
        name: next
        type: corenet.HTTP1Handler
      - doc: batcher is next as a batcher, nil when it is not one.
        name: batcher
        type: corenet.HTTP1Batcher
    kind: struct
    methods:
      - doc: |-
          wrapped returns the handler the link wraps, so the adapter can reach what a
          chain ends in.
        name: wrapped
        recv: l *link
        results: corenet.HTTP1Handler
      - doc: endBatch ends the next handler's batch when it is a batcher.
        name: endBatch
        params: lane int
        recv: l *link
    name: link
  - fields:
      - name: ""
        role: embedded
        type: link
      - doc: routes are the routes, in the order given.
        name: routes
        type: "[]route"
    kind: struct
    methods:
      - name: ServeHTTP1
        params: req *corenet.HTTP1RequestValue, res *corenet.HTTP1ResponseValue
        recv: l *RouteLayer
      - name: EndBatch
        params: lane int
        recv: l *RouteLayer
    name: RouteLayer
  - fields:
      - name: ""
        role: embedded
        type: link
      - doc: v verifies the token.
        name: v
        type: corenet.HTTP1BearerVerifier
      - doc: exempt are the routes that need no token.
        name: exempt
        type: "[]int"
    kind: struct
    methods:
      - name: ServeHTTP1
        params: req *corenet.HTTP1RequestValue, res *corenet.HTTP1ResponseValue
        recv: l *BearerLayer
      - name: EndBatch
        params: lane int
        recv: l *BearerLayer
      - doc: exempted reports whether route is one of the exemptions.
        name: exempted
        params: route int
        recv: l *BearerLayer
        results: bool
    name: BearerLayer
  - fields:
      - name: ""
        role: embedded
        type: link
      - doc: fields are the field lines every answer carries.
        name: fields
        type: "[]byte"
    kind: struct
    methods:
      - name: ServeHTTP1
        params: req *corenet.HTTP1RequestValue, res *corenet.HTTP1ResponseValue
        recv: l *HeadersLayer
      - name: EndBatch
        params: lane int
        recv: l *HeadersLayer
    name: HeadersLayer
  - fields:
      - doc: apply folds the option into the link's configuration, or refuses it.
        name: apply
        type: func(*logConfig) error
    kind: struct
    name: LogOption
  - fields:
      - name: ""
        role: embedded
        type: link
      - doc: policy is the built cross-origin policy.
        name: policy
        type: "*corenet.CORSPolicy"
    kind: struct
    methods:
      - name: ServeHTTP1
        params: req *corenet.HTTP1RequestValue, res *corenet.HTTP1ResponseValue
        recv: l *CORSLayer
      - name: EndBatch
        params: lane int
        recv: l *CORSLayer
    name: CORSLayer
  - doc: logConfig is every option of a link, checked.
    fields:
      - doc: allow are the field names a record carries, as given; names their bytes.
        name: allow
        type: "[]string"
      - name: names
        type: "[][]byte"
      - doc: slower is the slow threshold, zero when unset.
        name: slower
        type: time.Duration
      - doc: sample keeps one record in sample, zero when unset.
        name: sample
        type: uint64
      - doc: clk is the clock read.
        name: clk
        type: clock.Clock
    kind: struct
    name: logConfig
  - fields:
      - name: ""
        role: embedded
        type: link
      - doc: l receives the records.
        name: l
        type: corenet.HTTP1AccessLogger
      - doc: cfg holds the link's options, read only.
        name: cfg
        type: "*logConfig"
      - doc: lanes holds each lane's batch stamp and deferred records.
        name: lanes
        type: laneTable[logLane]
    kind: struct
    methods:
      - name: ServeHTTP1
        params: req *corenet.HTTP1RequestValue, res *corenet.HTTP1ResponseValue
        recv: l *LogLayer
      - doc: emit hands rec to the logger when the link's filters keep it.
        name: emit
        params: rec *corenet.HTTP1AccessValue
        recv: l *LogLayer
      - doc: |-
          keep reports whether a record passes the link's filters: every slow one, and
          one in n of the rest; with neither filter, every record.
        name: keep
        params: rec *corenet.HTTP1AccessValue
        recv: l *LogLayer
        results: bool
      - name: EndBatch
        params: lane int
        recv: l *LogLayer
      - doc: |-
          finishBatch ends the next handler's batch, then writes the batch's deferred
          answers their completion records and forgets its stamp.
        name: finishBatch
        params: lane int
        recv: l *LogLayer
    name: LogLayer
  - doc: logLane is what the link keeps per lane, between the requests of a batch.
    fields:
      - doc: start is when the batch's first request reached the link.
        name: start
        type: time.Time
      - doc: started says whether start is this batch's.
        name: started
        type: bool
      - doc: deferred are the batch's deferred answers still to complete.
        name: deferred
        type: "[]deferredAccess"
    kind: struct
    name: logLane
  - doc: deferredAccess is a deferred answer's first record, kept for its second.
    fields:
      - doc: "rec is the first record: its slices live until the batch's end."
        name: rec
        type: corenet.HTTP1AccessValue
      - doc: at is when the answer was deferred.
        name: at
        type: time.Time
      - doc: res is the deferred answer, valid until EndBatch returns.
        name: res
        type: "*corenet.HTTP1ResponseValue"
    kind: struct
    name: deferredAccess
  - fields:
      - name: ""
        role: embedded
        type: link
    kind: struct
    methods:
      - name: ServeHTTP1
        params: req *corenet.HTTP1RequestValue, res *corenet.HTTP1ResponseValue
        recv: l *TraceLayer
      - name: EndBatch
        params: lane int
        recv: l *TraceLayer
    name: TraceLayer
  - fields:
      - doc: mint makes the link mint every identifier.
        name: mint
        type: bool
    kind: struct
    name: RequestIDOption
  - fields:
      - name: ""
        role: embedded
        type: link
      - doc: mint makes the layer ignore the client's identifier.
        name: mint
        type: bool
    kind: struct
    methods:
      - name: ServeHTTP1
        params: req *corenet.HTTP1RequestValue, res *corenet.HTTP1ResponseValue
        recv: l *RequestIDLayer
      - doc: |-
          accepted copies the client's identifier into req, and reports whether there
          was one the link may keep.
        name: accepted
        params: req *corenet.HTTP1RequestValue
        recv: l *RequestIDLayer
        results: bool
      - name: EndBatch
        params: lane int
        recv: l *RequestIDLayer
    name: RequestIDLayer
  - doc: rateKeyKind names what a RateKey keys on.
    kind: named
    name: rateKeyKind
    underlying: uint8
  - doc: rateLane is what RateLimit keeps per lane.
    fields:
      - doc: |-
          key is the scratch a route's or a lane's key is written into, in the state
          so its slice costs nothing on the interface call.
        name: key
        type: "[routeKeyLen]byte"
      - doc: now is the clock's reading of this batch, in nanoseconds since the epoch.
        name: now
        type: int64
      - doc: fresh says whether now is this batch's.
        name: fresh
        type: bool
    kind: struct
    name: rateLane
  - fields:
      - doc: kind is the kind of key, zero for none.
        name: kind
        type: rateKeyKind
      - doc: field is the request field RateKeyField names.
        name: field
        type: string
    kind: struct
    name: RateKey
  - fields:
      - doc: apply folds the option into the link's configuration, or refuses it.
        name: apply
        type: func(*rateConfig) error
    kind: struct
    name: RateOption
  - doc: rateConfig is every option of a RateLimit link, checked.
    fields:
      - doc: exempt are the routes never judged.
        name: exempt
        type: "[]int"
      - doc: clk is the clock read once per batch.
        name: clk
        type: clock.Clock
    kind: struct
    name: rateConfig
  - fields:
      - name: ""
        role: embedded
        type: link
      - doc: l decides.
        name: l
        type: corenet.HTTP1Limiter
      - doc: key says what a request is keyed on.
        name: key
        type: RateKey
      - doc: cfg holds the link's options, read only.
        name: cfg
        type: "*rateConfig"
      - doc: "epoch is the link's zero instant: now is a monotonic count from it."
        name: epoch
        type: time.Time
      - doc: lanes holds each lane's batch stamp and scratch.
        name: lanes
        type: laneTable[rateLane]
    kind: struct
    methods:
      - name: ServeHTTP1
        params: req *corenet.HTTP1RequestValue, res *corenet.HTTP1ResponseValue
        recv: l *RateLimitLayer
      - doc: |-
          keyOf returns the bytes req is keyed on: a subject's or a field's own bytes, or
          the lane's scratch for a number.
        name: keyOf
        params: req *corenet.HTTP1RequestValue, lane *rateLane
        recv: l *RateLimitLayer
        results: "[]byte"
      - name: EndBatch
        params: lane int
        recv: l *RateLimitLayer
      - doc: finishRateBatch ends the next handler's batch and forgets the batch's stamp.
        name: finishRateBatch
        params: lane int
        recv: l *RateLimitLayer
    name: RateLimitLayer
  - fields:
      - name: ""
        role: embedded
        type: link
      - doc: route is the route it serves; tag its jobs' top bits.
        name: route
        type: int
      - name: tag
        type: uint64
      - doc: fsys is the tree.
        name: fsys
        type: fs.FS
      - doc: immutable and spa are the static tree's policies.
        name: immutable
        type: func(name string) bool
      - name: spa
        type: bool
      - doc: base holds every answer's fields; allow base and a 405's.
        name: base
        type: "[]byte"
      - name: allow
        type: "[]byte"
      - doc: |-
          nextWorker and nextCanceller are what the handler behind it answers
          jobs with, nil when it does not.
        name: nextWorker
        type: corenet.HTTP1Worker
      - name: nextCanceller
        type: jobCanceller
      - doc: |-
          lanes holds each lane's job table, built on its first request, replaced
          and never written in place under mu; a lane reads it without the lock.
        name: lanes
        type: atomic.Pointer[[]*filesLane]
      - name: mu
        type: sync.Mutex
    kind: struct
    methods:
      - name: ServeHTTP1
        params: req *corenet.HTTP1RequestValue, res *corenet.HTTP1ResponseValue
        recv: l *FilesLayer
      - name: EndBatch
        params: lane int
        recv: l *FilesLayer
      - doc: laneOf returns lane i's table, built on its first request.
        name: laneOf
        params: i int
        recv: l *FilesLayer
        results: "*filesLane"
      - doc: growLane builds lane i's table and publishes a list that holds it.
        name: growLane
        params: i int
        recv: l *FilesLayer
        results: "*filesLane"
      - name: CancelJob
        params: lane int, job uint64
        recv: l *FilesLayer
      - name: WorkHTTP1
        params: lane int, job uint64, res *corenet.HTTP1ResponseValue
        recv: l *FilesLayer
      - doc: |-
          resolve fills res with what j's name is: a file, a directory's index, a
          redirect, or nothing. Every failure says as little as the status can.
        name: resolve
        params: j *fileJob, res *corenet.HTTP1ResponseValue
        recv: l *FilesLayer
      - doc: |-
          resolveFound answers a name that opened: a directory, a regular file, or
          anything else, which is 404.
        name: resolveFound
        params: j *fileJob, res *corenet.HTTP1ResponseValue, name string, h treeFile
        recv: l *FilesLayer
      - doc: |-
          resolveAbsent answers a name that did not open: the shell of a single-page
          application's route, a 404, or the tree's own failure.
        name: resolveAbsent
        params: j *fileJob, res *corenet.HTTP1ResponseValue, name string, h treeFile
        recv: l *FilesLayer
      - doc: |-
          spaRoute reports whether name, naming nothing, is a route of a single-page
          application: a missing asset — anything with an extension — stays a 404.
        name: spaRoute
        params: name string
        recv: l *FilesLayer
        results: bool
      - doc: |-
          openName opens name in the tree, confined: a tree that can name its links
          has every prefix of the name checked first, so a planted link inside the
          root cannot lead anywhere, the final file re-checked against what the open
          returned. A file that is not a regular one or a directory is refused before
          any open, which on a FIFO would block the worker.
        name: openName
        params: name string
        recv: l *FilesLayer
        results: treeFile
      - doc: |-
          resolveDir serves a directory by its index.html: redirecting first to the
          name with a trailing slash, so its page's relative links resolve inside it.
          A directory with no index answers 404, never a listing.
        name: resolveDir
        params: j *fileJob, res *corenet.HTTP1ResponseValue, name string
        recv: l *FilesLayer
      - doc: resolveShell answers the single-page application's shell for a route.
        name: resolveShell
        params: j *fileJob, res *corenet.HTTP1ResponseValue
        recv: l *FilesLayer
      - doc: |-
          fileAnswer writes h's response: the policies, the validators, 304 when they
          match, 206 for one Range, 416 for an impossible one, else the whole file.
        name: fileAnswer
        params: j *fileJob, res *corenet.HTTP1ResponseValue, name string, h treeFile
        recv: l *FilesLayer
      - doc: |-
          appendCommon appends the fields of the answer: Cache-Control, Content-Type,
          Last-Modified, the validator and Accept-Ranges.
        name: appendCommon
        params: dst []byte, name string, info fs.FileInfo, etag []byte
        recv: l *FilesLayer
        results: "[]byte"
    name: FilesLayer
  - doc: |-
      fileBody is a file answer whose body is still leaving: the connection's held
      answers wait behind it. On the native path it is only its flags; on the
      copy path it is the file the worker reads and the chunk the output refused.
    fields:
      - doc: flags holds the bodyActive, bodyNative, bodyClosing and bodyBusy bits.
        name: flags
        type: uint8
      - doc: r reads the file; off is the next byte and left the bytes still to send.
        name: r
        type: io.ReaderAt
      - name: "off"
        type: int64
      - name: left
        type: int64
      - doc: |-
          slot holds a chunk the output refused, waiting for OnWritable; nil when
          none.
        name: slot
        type: "*pendSlot"
    kind: struct
    methods:
      - doc: |-
          active reports whether a file's body is still leaving; a slot that never
          sent a file has none.
        name: active
        recv: b *fileBody
        results: bool
    name: fileBody
  - doc: |-
      fileStart is one file answer about to leave: what startFile, startNative and
      startCopy are passed.
    fields:
      - doc: io and ref are the connection.
        name: io
        type: corenet.LoopIO
      - name: ref
        type: corenet.LoopConnRef
      - doc: st is the lane's state, f the connection's flag.
        name: st
        type: "*loopState"
      - name: f
        type: "*connFlag"
      - doc: out holds the bytes before the file, the head included.
        name: out
        type: "[]byte"
      - doc: file is the body.
        name: file
        type: corenet.HTTP1FileValue
      - doc: closing says the connection closes after the file.
        name: closing
        type: bool
    kind: struct
    name: fileStart
  - doc: |-
      jobCanceller is the internal capability of a link that lends a job an entry
      of its own: told when the job will never run, so the entry goes back.
    kind: named
    name: jobCanceller
    underlying: |-
      interface {
      	// CancelJob gives back the job's entry; the job's bits say whose it is.
      	CancelJob(lane int, job uint64)
      }
  - doc: |-
      fileJob is what a request hands its worker: every byte the request's answer
      needs, copied, since the request does not outlive the batch.
    fields:
      - doc: name is the decoded path under the route, slash whether it ended in "/".
        name: name
        type: "[]byte"
      - name: slash
        type: bool
      - doc: head is whether the method is HEAD.
        name: head
        type: bool
      - doc: |-
          rangeSpec, ifNoneMatch and ifModifiedSince are the fields' values, each
          nil when absent or past filesFieldCap.
        name: rangeSpec
        type: "[]byte"
      - doc: |-
          rangeSpec, ifNoneMatch and ifModifiedSince are the fields' values, each
          nil when absent or past filesFieldCap.
        name: ifNoneMatch
        type: "[]byte"
      - doc: |-
          rangeSpec, ifNoneMatch and ifModifiedSince are the fields' values, each
          nil when absent or past filesFieldCap.
        name: ifModifiedSince
        type: "[]byte"
    kind: struct
    methods:
      - doc: fill copies what the answer needs out of req, whose bytes end with the batch.
        name: fill
        params: req *corenet.HTTP1RequestValue
        recv: j *fileJob
      - doc: |-
          notModified reports whether the client's validators say it holds this
          revision: If-None-Match first, by the weak comparison RFC 9110 §13.1.2
          requires, and only without one If-Modified-Since, at the second a date holds.
        name: notModified
        params: etag []byte, info fs.FileInfo
        recv: j *fileJob
        results: bool
    name: fileJob
  - doc: |-
      filesLane is one lane's job table: entries the lane fills and the worker
      reads, and the free list both sides touch.
    fields:
      - doc: table holds the entries, replaced when it grows.
        name: table
        type: atomic.Pointer[[]*fileJob]
      - doc: mu guards free, the worker returning what the lane takes.
        name: mu
        type: sync.Mutex
      - name: free
        type: "[]uint32"
    kind: struct
    methods:
      - doc: take returns a free job entry, growing the table when none is.
        name: take
        recv: fl *filesLane
        results: uint32, *fileJob
      - doc: put gives entry idx back, on the worker or the lane's thread.
        name: put
        params: idx uint32
        recv: fl *filesLane
      - doc: grow doubles the table, the new entries free; mu held, or the lane new.
        name: grow
        recv: fl *filesLane
    name: filesLane
  - doc: treeFile is an opened name.
    fields:
      - name: file
        type: fs.File
      - name: info
        type: fs.FileInfo
      - name: found
        type: bool
      - name: err
        type: error
    kind: struct
    name: treeFile
  - doc: |-
      sequentialFile is an fs.File read strictly in order as the copy path needs:
      every ReadAt continues where the previous stopped.
    fields:
      - name: f
        type: fs.File
    kind: struct
    methods:
      - doc: "ReadAt implements io.ReaderAt, ignoring off: the copy path reads in order."
        name: ReadAt
        params: p []byte, _ int64
        recv: s *sequentialFile
        results: int, error
      - doc: Close implements io.Closer.
        name: Close
        recv: s *sequentialFile
        results: error
    name: sequentialFile
  - doc: |-
      laneTable finds a link's state of a lane, built the first time the lane
      comes, with no lock on any later call: a lane touches only its own entry, and
      the table of pointers is replaced, never written in place, under mu.
    fields:
      - doc: states holds each lane's state at its index.
        name: states
        type: atomic.Pointer[[]*T]
      - doc: mu serialises the first sight of a lane.
        name: mu
        type: sync.Mutex
    kind: struct
    methods:
      - doc: get returns lane i's state, built on the lane's first call.
        name: get
        params: i int
        recv: t *laneTable[T]
        results: "*T"
      - doc: grow builds lane i's state and publishes a table that holds it.
        name: grow
        params: i int
        recv: t *laneTable[T]
        results: "*T"
    name: laneTable
    typeParams: T any
  - doc: stepKind is what one turn of OnData decided.
    kind: named
    name: stepKind
    underlying: uint8
  - doc: connMode is how a connection's input is ending.
    kind: named
    name: connMode
    underlying: uint8
  - fields:
      - doc: h serves every request.
        name: h
        type: corenet.HTTP1Handler
      - doc: batcher is h as an HTTP1Batcher, nil when it is not one.
        name: batcher
        type: corenet.HTTP1Batcher
      - doc: |-
          worker is h as an HTTP1Worker, nil when it is not one: what a Pending
          answer is offloaded to (R3).
        name: worker
        type: corenet.HTTP1Worker
      - doc: |-
          upgrader is what an Upgrade answer hands the connection's bytes to; nil
          when there is none.
        name: upgrader
        type: corenet.HTTP1Upgrader
      - doc: |-
          streamer is what a Stream answer speaks to: h itself, or the handler a
          chain of links ends in; nil when there is none.
        name: streamer
        type: corenet.HTTP1Streamer
      - doc: canceller gives back a job no worker will run, nil when no link holds one.
        name: canceller
        type: jobCanceller
      - doc: |-
          reader is h as an HTTP1BodyReader, nil when it takes bodies whole; aborter
          is h as an HTTP1BodyAborter.
        name: reader
        type: corenet.HTTP1BodyReader
      - name: aborter
        type: corenet.HTTP1BodyAborter
      - doc: |-
          holdCap bounds what one connection holds back behind a pending answer:
          the group's OutputCap, given at OnOutbound.
        name: holdCap
        type: int
      - doc: p frames every request.
        name: p
        type: Parser
      - doc: |-
          loops holds each loop's state at its LoopIO.Loop index. It is replaced,
          never written in place, under mu; a loop reads it without the lock.
        name: loops
        type: atomic.Pointer[[]*loopState]
      - doc: mu serialises the first sight of a loop.
        name: mu
        type: sync.Mutex
    kind: struct
    methods:
      - doc: |-
          cancelJob gives back the entry of a job that will not run, when a link holds
          one.
        name: cancelJob
        params: lane int, job uint64
        recv: a *LoopHandler
      - doc: |-
          startFile sends s: by the backend's splice or sendfile when it has
          LoopFileWriter and the reader a descriptor, else through the copy path.
        name: startFile
        params: s *fileStart
        recv: a *LoopHandler
      - doc: |-
          startNative queues the head and the file on the engine and reports true, or
          false for a refusal the copy path can still answer. The engine holds its own
          duplicate once WriteFile returned, so the reader closes at once.
        name: startNative
        params: s *fileStart, fw corenet.LoopFileWriter, fd int
        recv: a *LoopHandler
        results: bool
      - doc: |-
          startCopy writes the head and starts the copy path: the file read in chunks
          on the worker, each written through the output's ceiling.
        name: startCopy
        params: s *fileStart
        recv: a *LoopHandler
      - doc: |-
          copyNext sends the next chunk's job to the lane's worker; a queue that is
          full retries at the batch's end.
        name: copyNext
        params: io corenet.LoopIO, ref corenet.LoopConnRef, st *loopState, f *connFlag
        recv: a *LoopHandler
      - doc: |-
          chunk is the copy path's chunk size: at most half of the output ceiling, so
          a chunk fits with its neighbour, bounded both ways.
        name: chunk
        recv: a *LoopHandler
        results: int64
      - doc: |-
          copyDone hands the chunk the worker read to the output, or ends the file: a
          connection gone closes the file, a short read closes the connection, the
          declared length no longer honoured.
        name: copyDone
        params: io corenet.LoopIO, st *loopState, slot *pendSlot
        recv: a *LoopHandler
      - doc: |-
          writeChunk writes the chunk the slot holds; a refused one stays there until
          OnWritable, the output's bound doing the back-pressure.
        name: writeChunk
        params: io corenet.LoopIO, ref corenet.LoopConnRef, st *loopState, f *connFlag
        recv: a *LoopHandler
      - doc: |-
          endCopy closes the copy path's reader and ends the file: failed, the
          connection closes with what it has, the short body showing; else the
          answers behind it go on, or the close the answer asked.
        name: endCopy
        params: io corenet.LoopIO, ref corenet.LoopConnRef, st *loopState, f *connFlag, failed bool
        recv: a *LoopHandler
      - doc: |-
          fileWritable is OnWritable for a connection with a file leaving: a native
          file is done; a copy resumes the chunk the output refused.
        name: fileWritable
        params: io corenet.LoopIO, ref corenet.LoopConnRef, st *loopState, f *connFlag
        recv: a *LoopHandler
      - doc: retryCopies sends again the chunks a full worker queue refused.
        name: retryCopies
        params: io corenet.LoopIO, st *loopState
        recv: a *LoopHandler
      - name: OnOpen
        params: io corenet.LoopIO, ref corenet.LoopConnRef
        recv: a *LoopHandler
      - name: OnData
        params: io corenet.LoopIO, ref corenet.LoopConnRef, buf []byte
        recv: a *LoopHandler
        results: int
      - doc: |-
          step frames, or feeds, at the start of buf, and reports the bytes it took and
          what to do next: a body still arriving takes the bytes before any next
          request, and a request is answered once whole, or read as it arrives when the
          handler takes its body so.
        name: step
        params: c dataCall, buf []byte
        recv: a *LoopHandler
        results: int, stepKind
      - doc: |-
          serve hands the request framed into st.req to the handler and queues its
          answer, and reports whether the connection closes after it.
        name: serve
        params: io corenet.LoopIO, ref corenet.LoopConnRef, st *loopState, loop int
        recv: a *LoopHandler
        results: bool
      - name: OnTimeout
        params: io corenet.LoopIO, ref corenet.LoopConnRef
        recv: a *LoopHandler
      - doc: timeout tells a stream's handler of its deadline, or closes the connection.
        name: timeout
        params: io corenet.LoopIO, ref corenet.LoopConnRef
        recv: a *LoopHandler
      - name: OnWritable
        params: io corenet.LoopIO, ref corenet.LoopConnRef
        recv: a *LoopHandler
      - doc: |-
          writable resumes a file body once its connection has room or its native send
          is over.
        name: writable
        params: io corenet.LoopIO, ref corenet.LoopConnRef
        recv: a *LoopHandler
      - name: OnBatchEnd
        params: io corenet.LoopIO
        recv: a *LoopHandler
      - name: MarkServed
        params: lane int
        recv: a *LoopHandler
      - name: HTTPCounts
        recv: a *LoopHandler
        results: corenet.HTTPCountsValue
      - name: Unwrap
        recv: a *LoopHandler
        results: corenet.HTTP1Handler
      - name: OnStart
        params: lanes int
        recv: a *LoopHandler
      - name: OnClose
        params: io corenet.LoopIO, ref corenet.LoopConnRef, err error
        recv: a *LoopHandler
      - doc: state returns loop i's state, built on the loop's first call.
        name: state
        params: i int
        recv: a *LoopHandler
        results: "*loopState"
      - doc: grow builds loop i's state and publishes a table that holds it.
        name: grow
        params: i int
        recv: a *LoopHandler
        results: "*loopState"
      - name: CheckSpill
        params: spillCap int
        recv: a *LoopHandler
        results: error
      - doc: |-
          openBody moves a request whose body its handler reads as it arrives aside: the
          head is copied out of the buffer, which will not outlive this call, and framed
          again from the copy into the connection's own request value, so req's head
          stays valid across OnData calls. It returns the head's bytes.
        name: openBody
        params: c dataCall, buf []byte
        recv: a *LoopHandler
        results: int
      - doc: |-
          feedBody gives the body's next bytes to the reader, and serves the request
          once they are its last. It reports the bytes taken and what to do next.
        name: feedBody
        params: c dataCall, buf []byte
        recv: a *LoopHandler
        results: int, stepKind
      - doc: |-
          abortBody tells a handler that keeps something between chunks that a closing
          connection's body will not arrive whole.
        name: abortBody
        params: f *connFlag, ref corenet.LoopConnRef
        recv: a *LoopHandler
      - name: Worker
        recv: a *LoopHandler
        results: corenet.LoopWorker
      - name: OnOutbound
        params: v corenet.LoopOutboundValue
        recv: a *LoopHandler
      - name: OnDone
        params: io corenet.LoopIO, job corenet.LoopJobValue
        recv: a *LoopHandler
      - name: Pending
        params: lane int, ref corenet.LoopConnRef
        recv: a *LoopHandler
        results: bool
      - doc: |-
          hold queues an answer behind the connection's pending one, or as one when
          it is pending, and reports whether the connection closes after it. It
          holds every answer of a connection from its first pending one until the
          batch's end that flushes them; a connection whose held answers pass the
          output ceiling is closed.
        name: hold
        params: st *loopState, an *answer
        recv: a *LoopHandler
        results: bool
      - doc: |-
          holdPending sends a pending answer's job to the lane's worker and holds its
          place; a full queue holds a 503 in its place, and Pending with Defer, or
          with no worker, a 500 that closes the connection.
        name: holdPending
        params: st *loopState, an *answer
        recv: a *LoopHandler
      - doc: closed gives up the held answers of ref when the flag is still its own.
        name: closed
        params: io corenet.LoopIO, ref corenet.LoopConnRef, err error
        recv: a *LoopHandler
      - doc: |-
          flushReady writes, for each connection queued, the answers it holds from
          the first up to the first still out, in one Write, then closes it when one
          of them asked to.
        name: flushReady
        params: io corenet.LoopIO, st *loopState
        recv: a *LoopHandler
      - doc: |-
          flushHeld writes f's ready answers, in order, up to a file body, which it
          starts behind them; a file still leaving holds everything behind it.
        name: flushHeld
        params: io corenet.LoopIO, ref corenet.LoopConnRef, st *loopState, f *connFlag
        recv: a *LoopHandler
      - doc: |-
          openStream writes a Stream answer's head into the batch's output and records
          the connection, or answers 500 when the stream cannot be: a misuse of the
          response, or no handler that speaks the stream port. It reports whether the
          connection stops being read, which is always: a stream is the connection's
          last response.
        name: openStream
        params: ref corenet.LoopConnRef, st *loopState, res *corenet.HTTP1ResponseValue
        recv: a *LoopHandler
        results: bool
      - doc: |-
          feedUpgraded hands the bytes after a 101 to the handler, once the 101 has left
          the adapter; bytes that came before the head left wait in the spill for the
          next read, in order, and a client that does not wait for the 101 only delays
          itself.
        name: feedUpgraded
        params: c dataCall, buf []byte
        recv: a *LoopHandler
        results: int, stepKind
      - doc: |-
          announceStreams tells the handler of each stream the batch opened, now that
          the head has been written.
        name: announceStreams
        params: io corenet.LoopIO, st *loopState
        recv: a *LoopHandler
      - name: OnDrain
        params: io corenet.LoopIO, ref corenet.LoopConnRef
        recv: a *LoopHandler
    name: LoopHandler
  - doc: loopState is one loop's state. Only that loop's thread touches it.
    fields:
      - doc: req is the request value every request of the loop is framed into.
        name: req
        type: corenet.HTTP1RequestValue
      - doc: |-
          stub carries the Method and Close a deferred answer is written with,
          once req has moved on to the next request.
        name: stub
        type: corenet.HTTP1RequestValue
      - doc: out holds the batch's answers, written in place as each is taken.
        name: out
        type: "[]byte"
      - doc: |-
          spare is the buffer complete orders a batch with deferred answers into;
          it and out swap, so neither is allocated again.
        name: spare
        type: "[]byte"
      - doc: deferred counts the batch's deferred answers.
        name: deferred
        type: int
      - doc: items are the batch's answers, in the order their requests arrived.
        name: items
        type: "[]item"
      - doc: free are the response values no request holds.
        name: free
        type: "[]*corenet.HTTP1ResponseValue"
      - doc: conns is a flag per connection, by ring and slot.
        name: conns
        type: "[][]connFlag"
      - doc: served counts the requests the batch handed to the handler.
        name: served
        type: int
      - doc: |-
          marked counts the requests an embedding adapter served in the batch
          (MarkServed): the batch ends for them too.
        name: marked
        type: int
      - doc: |-
          requests counts the lane's requests served since Start, added at each
          batch's end, read by HTTPCounts from any goroutine.
        name: requests
        type: atomic.Uint64
      - doc: |-
          opened are the connections whose stream's head this batch wrote: told of
          their stream once it has left the adapter.
        name: opened
        type: "[]corenet.LoopConnRef"
      - doc: |-
          count numbers the lane's requests, from one: HTTP1RequestValue.ID's
          counter.
        name: count
        type: uint64
      - doc: |-
          outbound is the lane's outbound to its worker, nil when nothing
          offloads.
        name: outbound
        type: corenet.LoopOutbound
      - doc: |-
          slots are the pending answers' slots, by index; replaced, never written
          in place, so the worker reads it without a lock.
        name: slots
        type: atomic.Pointer[[]*pendSlot]
      - doc: freeSlots are the indexes of the slots no answer holds.
        name: freeSlots
        type: "[]uint32"
      - doc: ready are the connections whose held answers the batch's end flushes.
        name: ready
        type: "[]corenet.LoopConnRef"
      - doc: |-
          deferHeld are the connections holding a deferred answer behind a
          pending one, completed after EndBatch.
        name: deferHeld
        type: "[]corenet.LoopConnRef"
      - doc: |-
          dropped are the held deferred responses a closed connection gave up
          during the batch, returned to the pool after EndBatch.
        name: dropped
        type: "[]*corenet.HTTP1ResponseValue"
      - doc: held is the scratch a connection's held answers are written from.
        name: held
        type: "[]byte"
      - doc: unavailable is the 503 a pending answer refused by a full queue gets.
        name: unavailable
        type: corenet.HTTP1ResponseValue
      - doc: |-
          copyRetry are the connections whose copied file's next chunk the worker's
          full queue refused: sent again at the batch's end.
        name: copyRetry
        type: "[]corenet.LoopConnRef"
      - doc: readyEpoch numbers the batches' ready lists, from one.
        name: readyEpoch
        type: uint64
      - doc: |-
          headStub and plainStub are the requests a held deferred answer is
          written with: HEAD, or no method.
        name: headStub
        type: corenet.HTTP1RequestValue
      - doc: |-
          headStub and plainStub are the requests a held deferred answer is
          written with: HEAD, or no method.
        name: plainStub
        type: corenet.HTTP1RequestValue
    kind: struct
    methods:
      - doc: |-
          endServed counts the batch's own requests into the lane's total, forgets
          the batch's counts, and reports whether the batch served any request, its
          own or an embedding adapter's.
        name: endServed
        recv: st *loopState
        results: bool
      - doc: |-
          idle reports whether the lane's batch has nothing to end: no answer, no held
          one ready, nothing served beside it.
        name: idle
        recv: st *loopState
        results: bool
      - doc: |-
          complete writes the batch's answers again into spare, in request order,
          each deferred one in its place, and makes spare the batch's out: the
          answers of one connection then lie side by side, and leave in one Write.
          A batch with no deferred answer is already in order and is left as it is.
        name: complete
        recv: st *loopState
      - doc: |-
          flush writes the batch's answers in order, a run of one connection's
          answers that lie side by side in out in one Write, and closes each
          connection whose answer asked to, or whose output refused one.
        name: flush
        params: io corenet.LoopIO
        recv: st *loopState
      - doc: |-
          write writes p on ref, then closes ref when closing or when the write is
          refused. A connection already given up on is skipped.
        name: write
        params: io corenet.LoopIO, ref corenet.LoopConnRef, p []byte, closing bool
        recv: st *loopState
      - doc: take returns a zeroed response value for one request.
        name: take
        recv: st *loopState
        results: "*corenet.HTTP1ResponseValue"
      - doc: |-
          give returns res to the pool. Its slices are dropped at the next take,
          never reused: they are the handler's.
        name: give
        params: res *corenet.HTTP1ResponseValue
        recv: st *loopState
      - doc: |-
          flag returns ref's flag, growing the table on the first sight of its ring
          or its slot. A flag of an older generation reads as nothing set.
        name: flag
        params: ref corenet.LoopConnRef
        recv: st *loopState
        results: "*connFlag"
      - doc: |-
          peek returns ref's flag when it is ref's connection's, nil when the slot
          holds another generation or was never seen: unlike flag, it resets nothing.
        name: peek
        params: ref corenet.LoopConnRef
        recv: st *loopState
        results: "*connFlag"
      - doc: |-
          holdBytes writes res into the connection's buffer and holds it in order; a
          response the writer refuses is a 500 that closes the connection.
        name: holdBytes
        params: an *answer, res *corenet.HTTP1ResponseValue
        recv: st *loopState
      - doc: |-
          stubOf is the request the writer reads for a deferred answer: HEAD, or no
          method; one shared value of each, never written.
        name: stubOf
        params: head bool
        recv: st *loopState
        results: "*corenet.HTTP1RequestValue"
      - doc: |-
          takeSlot returns a free slot and its index, its generation moved on and
          its response zeroed; the table grows by doubling when none is free,
          published anew so the worker never reads a table being written.
        name: takeSlot
        recv: st *loopState
        results: uint32, *pendSlot
      - doc: growSlots doubles the slot table, the new slots free.
        name: growSlots
        recv: st *loopState
      - doc: freeSlot returns slot idx to the free list.
        name: freeSlot
        params: idx uint32
        recv: st *loopState
      - doc: markReady queues ref's connection for the batch's end, once a batch.
        name: markReady
        params: ref corenet.LoopConnRef, f *connFlag
        recv: st *loopState
      - doc: |-
          dropHeld gives up every answer f holds: a pending slot whose job is back is
          freed, one still out is cancelled and freed when it comes back, a deferred
          response is returned to the pool once the batch's EndBatch has returned —
          the batcher holds it until then, and a request taking it first would share
          it with the one given up.
        name: dropHeld
        params: f *connFlag
        recv: st *loopState
      - doc: |-
          completeHeld completes, after EndBatch, the deferred responses held behind
          a pending answer: each becomes bytes in its connection's buffer. The ones a
          closed connection gave up go back to the pool, the batcher done with them.
        name: completeHeld
        recv: st *loopState
      - doc: completeConn writes f's deferred held responses into its buffer.
        name: completeConn
        params: ref corenet.LoopConnRef, f *connFlag
        recv: st *loopState
      - doc: |-
          appendItem appends one ready held answer to out and reports whether the
          connection closes after it; a pending one's slot is freed.
        name: appendItem
        params: out []byte, f *connFlag, it heldItem
        recv: st *loopState
        results: "[]byte, bool, corenet.HTTP1FileValue"
    name: loopState
  - doc: |-
      dataCall is one OnData call's connection, what step and the body's two
      helpers read of it.
    fields:
      - doc: io and ref are the callback's.
        name: io
        type: corenet.LoopIO
      - name: ref
        type: corenet.LoopConnRef
      - doc: st is the lane's state, f the connection's flag, loop the lane.
        name: st
        type: "*loopState"
      - name: f
        type: "*connFlag"
      - name: loop
        type: int
    kind: struct
    name: dataCall
  - doc: item is one answer of a batch.
    fields:
      - doc: ref is the connection it answers on.
        name: ref
        type: corenet.LoopConnRef
      - doc: |-
          res is the deferred response, written at the batch's end; nil once the
          answer is in out.
        name: res
        type: "*corenet.HTTP1ResponseValue"
      - doc: off and end bound the answer in out.
        name: "off"
        type: int
      - doc: off and end bound the answer in out.
        name: end
        type: int
      - doc: head is whether the request was a HEAD, for a deferred answer.
        name: head
        type: bool
      - doc: closing is whether the connection closes after this answer.
        name: closing
        type: bool
    kind: struct
    name: item
  - doc: |-
      connFlag is what the adapter keeps of one connection: its generation, so a
      stale slot reads as a new one, and how it ends.
    fields:
      - doc: gen is the generation of the connection the flag describes.
        name: gen
        type: uint32
      - doc: |-
          mode is how the connection's input ends: read on, closed after the batch's
          answer, or carried by a streamed response. In the last two nothing more is
          read.
        name: mode
        type: connMode
      - doc: |-
          dead is set once a write was refused or the close was asked: nothing
          more is written to it.
        name: dead
        type: bool
      - doc: |-
          upgradePending says the 101 is still in the batch's output: bytes after it
          wait for it to have left.
        name: upgradePending
        type: bool
      - doc: |-
          readyAt is the lane's readyEpoch the connection was last queued in,
          so it is queued once a batch.
        name: readyAt
        type: uint64
      - doc: |-
          file is a file answer whose body is still leaving (native or copy path):
          every later answer waits behind it, in request order. It is allocated by
          the slot's first file answer and kept for the slot's later connections,
          as head and request are: a connection that never sends a file pays a
          pointer, not the body's 48 bytes (the 512 B idle budget of #859).
        name: file
        type: "*fileBody"
      - doc: held are the answers held behind a pending one, in request order (R3).
        name: held
        type: "[]heldItem"
      - doc: buf holds the held answers' bytes.
        name: buf
        type: "[]byte"
      - doc: |-
          bodyLeft is the bytes still to come of a body the handler reads as it
          arrives (#844); zero when none is arriving.
        name: bodyLeft
        type: int64
      - doc: |-
          head holds that request's head, and request the value framed from it:
          both outlive OnData, and both are reused for the slot's next connection.
        name: head
        type: "[]byte"
      - name: request
        type: "*corenet.HTTP1RequestValue"
    kind: struct
    methods:
      - doc: |-
          setFile starts the connection's file body, in the slot's kept one when it
          has one.
        name: setFile
        params: b fileBody
        recv: f *connFlag
      - doc: clearFile ends the connection's file body, the allocation kept.
        name: clearFile
        recv: f *connFlag
      - doc: |-
          holds reports whether an answer of the connection must wait in order behind
          a pending answer or a file still leaving.
        name: holds
        params: res *corenet.HTTP1ResponseValue
        recv: f *connFlag
        results: bool
      - doc: |-
          endInput says nothing more is read from the connection; a stream keeps its
          own, stronger, ending.
        name: endInput
        recv: f *connFlag
      - doc: |-
          reset makes f a new connection's, of generation gen, keeping the backing
          of its held answers and their buffer, so a slot's churn reallocates
          neither.
        name: reset
        params: gen uint32
        recv: f *connFlag
      - doc: |-
          compact drops from f's buffer the bytes of the answers already written, so
          what the ceiling counts is only what f still holds: under an open pipeline
          a pending answer is always at the tail of held, and a buffer that only
          started over once held was empty would grow until it closed the
          connection. The bytes still held move to the front, their bounds with them.
        name: compact
        recv: f *connFlag
    name: connFlag
  - doc: |-
      pendSlot is one pending answer (R3): what the lane keeps of it while the
      worker fills res. The lane's thread writes ref, head and closing before the
      job is sent and reads res once it is back; the worker writes res only, and
      reads cancelled. Slots are never moved, so the worker holds one by pointer.
    fields:
      - doc: idx is the slot's index in the table, fixed.
        name: idx
        type: uint32
      - doc: gen is the slot's generation, moved on at each take.
        name: gen
        type: uint32
      - doc: ref is the connection it answers.
        name: ref
        type: corenet.LoopConnRef
      - doc: res is the answer the worker fills.
        name: res
        type: corenet.HTTP1ResponseValue
      - doc: |-
          stub carries the request's Method — HEAD or none — and whether the
          connection closes after the answer (Close), as the writer reads them.
        name: stub
        type: corenet.HTTP1RequestValue
      - doc: done is set on the lane's thread once the job is back.
        name: done
        type: bool
      - doc: |-
          cancelled is set once the connection closed: the worker skips the work,
          and the answer is dropped.
        name: cancelled
        type: atomic.Bool
      - doc: copy is a file chunk being read for the copy path, nil on an ordinary job.
        name: copy
        type: "*copyJob"
      - doc: job and buf are the slot's chunk job and its read buffer, kept for reuse.
        name: job
        type: copyJob
      - name: buf
        type: "[]byte"
    kind: struct
    name: pendSlot
  - doc: copyJob is what one chunk's job carries to the lane's worker.
    fields:
      - doc: r is the file, off the chunk's offset, buf where it lands.
        name: r
        type: io.ReaderAt
      - name: "off"
        type: int64
      - name: buf
        type: "[]byte"
      - doc: n and err are the worker's answer.
        name: "n"
        type: int
      - name: err
        type: error
    kind: struct
    name: copyJob
  - doc: |-
      heldItem is one answer a connection holds back behind a pending one, in
      request order: a pending slot, a deferred response the batch's end
      completes, or bytes already written into the connection's buffer.
    fields:
      - doc: slot is the pending answer; nil otherwise.
        name: slot
        type: "*pendSlot"
      - doc: res is a deferred response not yet completed; nil otherwise.
        name: res
        type: "*corenet.HTTP1ResponseValue"
      - doc: off and end bound the answer's bytes in the connection's buffer.
        name: "off"
        type: int
      - doc: off and end bound the answer's bytes in the connection's buffer.
        name: end
        type: int
      - doc: |-
          stub carries a deferred request's Method — HEAD or none — for the
          writer, and whether the connection closes after this answer (Close).
        name: stub
        type: "*corenet.HTTP1RequestValue"
      - doc: closing is whether the connection closes after this answer.
        name: closing
        type: bool
    kind: struct
    methods:
      - doc: |-
          ready reports whether the held answer can be written: its bytes are in the
          buffer, or its job is back.
        name: ready
        recv: it heldItem
        results: bool
    name: heldItem
  - doc: |-
      pendingWorker is the corenet.LoopWorker the adapter offloads to: it runs
      the handler's HTTP1Worker on the slot's response.
    fields:
      - doc: a is the adapter.
        name: a
        type: "*LoopHandler"
    kind: struct
    methods:
      - doc: |-
          Work implements corenet.LoopWorker, on the lane's worker goroutine: it
          fills the slot's response unless its connection has closed.
        name: Work
        params: lane int, job corenet.LoopJobValue
        recv: w pendingWorker
    name: pendingWorker
  - doc: |-
      answer is one answer hold queues: the connection, its flag, the response
      and whether the connection closes after it.
    fields:
      - doc: io is the lane's LoopIO.
        name: io
        type: corenet.LoopIO
      - doc: ref is the connection.
        name: ref
        type: corenet.LoopConnRef
      - doc: f is its flag.
        name: f
        type: "*connFlag"
      - doc: res is the handler's response.
        name: res
        type: "*corenet.HTTP1ResponseValue"
      - doc: closing is whether the connection closes after it.
        name: closing
        type: bool
    kind: struct
    name: answer
  - doc: fieldKind is which of the profile's known fields a name is.
    kind: named
    name: fieldKind
    underlying: uint8
  - fields:
      - doc: head bounds the head in bytes; zero selects corenet.HTTP1DefaultHead.
        name: head
        type: int
      - doc: target bounds the request-target in bytes; zero selects corenet.HTTP1DefaultTarget.
        name: target
        type: int
      - doc: body bounds the Content-Length; zero selects corenet.HTTP1DefaultBody.
        name: body
        type: int64
    kind: struct
    methods:
      - name: Limits
        recv: p Parser
        results: corenet.HTTP1LimitsValue
      - name: Parse
        params: buf []byte, req *corenet.HTTP1RequestValue
        recv: p Parser
        results: int, Refusal
    name: Parser
  - fields:
      - doc: Rate is the refill, in tokens per second.
        name: Rate
        type: float64
      - doc: Burst is the most tokens a key holds.
        name: Burst
        type: int
      - doc: Keys is the table's capacity, the most keys it remembers at once.
        name: Keys
        type: int
    kind: struct
    name: KeyedBucketsValue
  - fields:
      - doc: seed makes the keys' hashes unpredictable to a client that chooses them.
        name: seed
        type: maphash.Seed
      - doc: shards are the table's parts; a key's hash picks one.
        name: shards
        type: "[]bucketShard"
      - doc: rate is the refill per nanosecond.
        name: rate
        type: float64
      - doc: burst is a full bucket.
        name: burst
        type: float64
    kind: struct
    methods:
      - name: Allow
        params: key []byte, now int64
        recv: b *KeyedBuckets
        results: ok bool, retryAfter int
    name: KeyedBuckets
  - doc: |-
      bucketShard is one part of the table: a fixed array of entries, an
      open-addressed index into it, and an LRU list through it. Nothing past
      construction allocates.
    fields:
      - doc: mu serialises the lanes that land on this shard.
        name: mu
        type: sync.Mutex
      - doc: entries holds the keys; used of them are in use.
        name: entries
        type: "[]bucketEntry"
      - name: used
        type: int32
      - doc: index maps a key's hash to an entry, by position in entries; noEntry is empty.
        name: index
        type: "[]int32"
      - doc: mask keeps a hash inside index.
        name: mask
        type: uint64
      - doc: head is the most recently used entry, tail the least.
        name: head
        type: int32
      - doc: head is the most recently used entry, tail the least.
        name: tail
        type: int32
    kind: struct
    methods:
      - doc: |-
          init sizes the shard for capacity entries, its index at twice that, a power of
          two.
        name: init
        params: capacity int
        recv: s *bucketShard
      - doc: |-
          lookup returns key's entry, moved to the head of the LRU list, new and full
          when key is unseen, the least recent entry evicted when the shard is full.
        name: lookup
        params: key uint64, burst float64, now int64
        recv: s *bucketShard
        results: "*bucketEntry"
      - doc: touch moves entry id to the head of the LRU list.
        name: touch
        params: id int32
        recv: s *bucketShard
      - doc: link makes id, whose next is the old head, the list's head.
        name: link
        params: id int32
        recv: s *bucketShard
      - doc: unlink removes id from the LRU list.
        name: unlink
        params: id int32
        recv: s *bucketShard
      - doc: |-
          evictTail forgets the least recently used entry, moving the last used entry
          into its place so entries stay dense, and repairs the index by backward shift.
        name: evictTail
        recv: s *bucketShard
      - doc: |-
          moveEntry moves entry from to position to, relinking its neighbours and its
          index slot.
        name: moveEntry
        params: from, to int32
        recv: s *bucketShard
      - doc: |-
          removeIndex deletes key's slot from the open-addressed index by backward
          shifting, so no tombstone ever lengthens a probe.
        name: removeIndex
        params: key uint64
        recv: s *bucketShard
      - doc: |-
          movable reports whether an entry at next whose home slot is home may move into
          the hole at pos: whether home lies at or before the hole, walking the ring from
          next backwards.
        name: movable
        params: home, pos, next uint64
        recv: s *bucketShard
        results: bool
    name: bucketShard
  - doc: bucketEntry is one key's bucket, linked by position in the LRU list.
    fields:
      - doc: "key is the hash of the bucket's key: the key's bytes are never kept."
        name: key
        type: uint64
      - doc: tokens are the tokens the bucket held at last.
        name: tokens
        type: float64
      - doc: last is when the bucket was last refilled.
        name: last
        type: int64
      - doc: prev and next link the LRU list.
        name: prev
        type: int32
      - doc: prev and next link the LRU list.
        name: next
        type: int32
    kind: struct
    name: bucketEntry
  - kind: named
    methods:
      - name: String
        recv: r Refusal
        results: string
      - name: Status
        recv: r Refusal
        results: int
      - name: Err
        recv: r Refusal
        results: error
    name: Refusal
    underlying: uint8
vars:
  - grouped: true
    items:
      - doc: |-
          wwwAuthenticate is the field a 401 from Bearer carries, with no spare
          capacity, so a handler appending to it copies it.
        name: wwwAuthenticate
        value: "slices.Clip([]byte(\"WWW-Authenticate: Bearer\\r\\n\"))"
      - doc: credentialFields are the request fields Log never records, lowercase.
        name: credentialFields
        value: "[...]string{\"authorization\", \"proxy-authorization\", \"cookie\"}"
      - doc: traceLineStart opens the field line Trace writes on an answer.
        name: traceLineStart
        value: "[]byte(\"traceparent: \")"
      - doc: traceLineEnd closes it.
        name: traceLineEnd
        value: "[]byte(\"\\r\\n\")"
    name: wwwAuthenticate
  - grouped: true
    items:
      - doc: methodGet is the other method the tree serves.
        name: methodGet
        value: "[]byte(\"GET\")"
      - doc: wildcardMatch is the value of an If-None-Match that matches any revision.
        name: wildcardMatch
        value: "[]byte(\"*\")"
      - doc: |-
          filesTags numbers the Files links of the process, the top bits of their
          jobs.
        name: filesTags
        type: atomic.Uint64
    name: methodGet
  - doc: The Files link gives its entries back through the adapter.
    items:
      - name: _
        type: jobCanceller
        value: (*FilesLayer)(nil)
    name: _
  - doc: |-
      retryAfter is the field a 503 for a full queue carries: one second, the
      least a client can be told.
    items:
      - name: retryAfter
        value: "[]byte(\"Retry-After: 1\\r\\n\")"
    name: retryAfter
  - grouped: true
    items:
      - doc: tchar holds the RFC 9110 §5.6.2 token characters.
        name: tchar
        value: tokenTable()
      - doc: |-
          targetStop is every byte that ends or breaks a request-target: a space
          or any byte below it, DEL, and the bytes from 0x80 up.
        name: targetStop
        value: swar.NewSet(asciiDEL, asciiDEL, asciiSpace+1, true)
      - doc: |-
          valueStop is every byte a field value scan must look at: the C0
          controls, CR and LF included, and DEL. The tab is among them and is the
          one allowed.
        name: valueStop
        value: swar.NewSet(asciiDEL, asciiDEL, asciiSpace, false)
      - doc: |-
          knownNames holds, at its length, the lowercase name of each field the
          profile reads: no two share a length, so one comparison identifies one.
        name: knownNames
        value: |-
          [knownMaxLen]string{
          		len("host"):              "host",
          		len("expect"):            "expect",
          		len("connection"):        "connection",
          		len("authorization"):     "authorization",
          		len("content-length"):    "content-length",
          		len("transfer-encoding"): "transfer-encoding",
          	}
      - doc: knownKinds is the kind of the name knownNames holds at the same length.
        name: knownKinds
        value: |-
          [knownMaxLen]fieldKind{
          		len("host"):              kindHost,
          		len("expect"):            kindExpect,
          		len("connection"):        kindConnection,
          		len("authorization"):     kindAuthorization,
          		len("content-length"):    kindContentLength,
          		len("transfer-encoding"): kindTransferEncoding,
          	}
      - doc: methodConnect is the one method the profile refuses by name.
        name: methodConnect
        value: "[]byte(\"CONNECT\")"
      - doc: versionBytes is version, for the comparisons with a slice of the input.
        name: versionBytes
        value: "[]byte(version)"
    name: tchar
  - grouped: true
    items:
      - doc: refusalNames are the names String renders, indexed by Refusal.
        name: refusalNames
        value: |-
          [refusalCount]string{
          		RefusalNone:                    "none",
          		RefusalRequestLine:             "request_line",
          		RefusalMethod:                  "method",
          		RefusalTarget:                  "target",
          		RefusalVersion:                 "version",
          		RefusalBareCR:                  "bare_cr",
          		RefusalBareLF:                  "bare_lf",
          		RefusalNUL:                     "nul",
          		RefusalControl:                 "control",
          		RefusalObsFold:                 "obs_fold",
          		RefusalSpaceBeforeColon:        "space_before_colon",
          		RefusalName:                    "name",
          		RefusalTransferEncoding:        "transfer_encoding",
          		RefusalContentLength:           "content_length",
          		RefusalContentLengthDuplicated: "content_length_duplicated",
          		RefusalAuthorizationDuplicated: "authorization_duplicated",
          		RefusalHostDuplicated:          "host_duplicated",
          		RefusalExpect:                  "expect",
          		RefusalHeadTooLarge:            "head_too_large",
          		RefusalTooManyFields:           "too_many_fields",
          		RefusalTargetTooLong:           "target_too_long",
          		RefusalBodyTooLarge:            "body_too_large",
          		RefusalMethodUnsupported:       "method_unsupported",
          		RefusalTargetPath:              "target_path",
          		RefusalTargetForm:              "target_form",
          		RefusalTargetHost:              "target_host",
          	}
      - doc: |-
          refusalStatus is the status each refusal is answered with; RefusalNone's
          is zero.
        name: refusalStatus
        value: |-
          [refusalCount]int{
          		RefusalRequestLine:             statusBadRequest,
          		RefusalMethod:                  statusBadRequest,
          		RefusalTarget:                  statusBadRequest,
          		RefusalVersion:                 statusBadRequest,
          		RefusalBareCR:                  statusBadRequest,
          		RefusalBareLF:                  statusBadRequest,
          		RefusalNUL:                     statusBadRequest,
          		RefusalControl:                 statusBadRequest,
          		RefusalObsFold:                 statusBadRequest,
          		RefusalSpaceBeforeColon:        statusBadRequest,
          		RefusalName:                    statusBadRequest,
          		RefusalTransferEncoding:        statusBadRequest,
          		RefusalContentLength:           statusBadRequest,
          		RefusalContentLengthDuplicated: statusBadRequest,
          		RefusalAuthorizationDuplicated: statusBadRequest,
          		RefusalHostDuplicated:          statusBadRequest,
          		RefusalExpect:                  statusExpectationFailed,
          		RefusalHeadTooLarge:            statusFieldsTooLarge,
          		RefusalTooManyFields:           statusFieldsTooLarge,
          		RefusalTargetTooLong:           statusURITooLong,
          		RefusalBodyTooLarge:            statusContentTooLarge,
          		RefusalMethodUnsupported:       statusNotImplemented,
          		RefusalTargetPath:              statusBadRequest,
          		RefusalTargetForm:              statusBadRequest,
          		RefusalTargetHost:              statusBadRequest,
          	}
      - doc: |-
          refusalErrs is the core/net sentinel each refusal belongs to, grouped by
          the decision a caller makes rather than by the byte that broke.
        name: refusalErrs
        value: |-
          [refusalCount]error{
          		RefusalRequestLine:             corenet.HTTP1RequestMalformed,
          		RefusalMethod:                  corenet.HTTP1RequestMalformed,
          		RefusalTarget:                  corenet.HTTP1RequestMalformed,
          		RefusalVersion:                 corenet.HTTP1RequestMalformed,
          		RefusalBareCR:                  corenet.HTTP1RequestMalformed,
          		RefusalBareLF:                  corenet.HTTP1RequestMalformed,
          		RefusalNUL:                     corenet.HTTP1RequestMalformed,
          		RefusalControl:                 corenet.HTTP1RequestMalformed,
          		RefusalObsFold:                 corenet.HTTP1RequestMalformed,
          		RefusalSpaceBeforeColon:        corenet.HTTP1RequestMalformed,
          		RefusalName:                    corenet.HTTP1RequestMalformed,
          		RefusalTransferEncoding:        corenet.HTTP1TransferEncoding,
          		RefusalContentLength:           corenet.HTTP1ContentLengthInvalid,
          		RefusalContentLengthDuplicated: corenet.HTTP1ContentLengthInvalid,
          		RefusalAuthorizationDuplicated: corenet.HTTP1FieldDuplicated,
          		RefusalHostDuplicated:          corenet.HTTP1FieldDuplicated,
          		RefusalExpect:                  corenet.HTTP1ExpectRefused,
          		RefusalHeadTooLarge:            corenet.HTTP1HeadTooLarge,
          		RefusalTooManyFields:           corenet.HTTP1HeadTooLarge,
          		RefusalTargetTooLong:           corenet.HTTP1TargetTooLong,
          		RefusalBodyTooLarge:            corenet.HTTP1BodyTooLarge,
          		RefusalMethodUnsupported:       corenet.HTTP1MethodUnsupported,
          		RefusalTargetPath:              corenet.HTTP1RequestMalformed,
          		RefusalTargetForm:              corenet.HTTP1RequestMalformed,
          		RefusalTargetHost:              corenet.HTTP1RequestMalformed,
          	}
    name: refusalNames
  - grouped: true
    items:
      - doc: |-
          hexDigits are the values of the hexadecimal digits, by byte; noDigit for
          any other.
        name: hexDigits
        value: hexTable()
      - doc: methodOptions is the one method an asterisk-form target may carry.
        name: methodOptions
        value: "[]byte(\"OPTIONS\")"
      - doc: querySep starts a target's query.
        name: querySep
        value: "[]byte(\"?\")"
    name: hexDigits
  - grouped: true
    items:
      - doc: |-
          statusLines are the status lines of the codes RFC 9110 §15 registers,
          spelled once, indexed by code. An entry left empty is composed on demand.
        name: statusLines
        value: |-
          [statusRegistered]string{
          		200: "HTTP/1.1 200 OK\r\n",
          		201: "HTTP/1.1 201 Created\r\n",
          		202: "HTTP/1.1 202 Accepted\r\n",
          		203: "HTTP/1.1 203 Non-Authoritative Information\r\n",
          		204: "HTTP/1.1 204 No Content\r\n",
          		205: "HTTP/1.1 205 Reset Content\r\n",
          		206: "HTTP/1.1 206 Partial Content\r\n",
          		300: "HTTP/1.1 300 Multiple Choices\r\n",
          		301: "HTTP/1.1 301 Moved Permanently\r\n",
          		302: "HTTP/1.1 302 Found\r\n",
          		303: "HTTP/1.1 303 See Other\r\n",
          		304: "HTTP/1.1 304 Not Modified\r\n",
          		307: "HTTP/1.1 307 Temporary Redirect\r\n",
          		308: "HTTP/1.1 308 Permanent Redirect\r\n",
          		400: "HTTP/1.1 400 Bad Request\r\n",
          		401: "HTTP/1.1 401 Unauthorized\r\n",
          		402: "HTTP/1.1 402 Payment Required\r\n",
          		403: "HTTP/1.1 403 Forbidden\r\n",
          		404: "HTTP/1.1 404 Not Found\r\n",
          		405: "HTTP/1.1 405 Method Not Allowed\r\n",
          		406: "HTTP/1.1 406 Not Acceptable\r\n",
          		407: "HTTP/1.1 407 Proxy Authentication Required\r\n",
          		408: "HTTP/1.1 408 Request Timeout\r\n",
          		409: "HTTP/1.1 409 Conflict\r\n",
          		410: "HTTP/1.1 410 Gone\r\n",
          		411: "HTTP/1.1 411 Length Required\r\n",
          		412: "HTTP/1.1 412 Precondition Failed\r\n",
          		413: "HTTP/1.1 413 Content Too Large\r\n",
          		414: "HTTP/1.1 414 URI Too Long\r\n",
          		415: "HTTP/1.1 415 Unsupported Media Type\r\n",
          		416: "HTTP/1.1 416 Range Not Satisfiable\r\n",
          		417: "HTTP/1.1 417 Expectation Failed\r\n",
          		421: "HTTP/1.1 421 Misdirected Request\r\n",
          		422: "HTTP/1.1 422 Unprocessable Content\r\n",
          		426: "HTTP/1.1 426 Upgrade Required\r\n",
          		428: "HTTP/1.1 428 Precondition Required\r\n",
          		429: "HTTP/1.1 429 Too Many Requests\r\n",
          		431: "HTTP/1.1 431 Request Header Fields Too Large\r\n",
          		500: "HTTP/1.1 500 Internal Server Error\r\n",
          		501: "HTTP/1.1 501 Not Implemented\r\n",
          		502: "HTTP/1.1 502 Bad Gateway\r\n",
          		503: "HTTP/1.1 503 Service Unavailable\r\n",
          		504: "HTTP/1.1 504 Gateway Timeout\r\n",
          		505: "HTTP/1.1 505 HTTP Version Not Supported\r\n",
          	}
      - doc: |-
          refusalAnswers is the whole answer to each refusal, indexed by Refusal:
          its status line, no body, and the connection closed. RefusalNone's slot
          holds the 400, which AppendRefusal also gives a value past the table.
        name: refusalAnswers
        value: refusalAnswerTable()
      - doc: methodHead is the one method whose answer carries no body.
        name: methodHead
        value: "[]byte(\"HEAD\")"
    name: statusLines
