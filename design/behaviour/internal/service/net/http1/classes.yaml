functions:
  - doc: newLink finds next's batcher once, never per batch.
    name: newLink
    params: next corenet.HTTP1Handler
    results: link
  - doc: misconfigured wraps HTTP1Misconfigured with the link and what it refused.
    name: misconfigured
    params: linkName, what string
    results: error
  - name: Routes
    params: routes ...RouteValue
    results: corenet.Middleware[corenet.HTTP1Handler], error
  - doc: |-
      checkRoute refuses a route whose ID, method or path breaks a rule, against
      the routes before it.
    name: checkRoute
    params: r RouteValue, before []RouteValue
    results: error
  - doc: |-
      prefixOf reports whether prefix starts path on a segment boundary: path is
      prefix, prefix ends in '/', or path's next byte is '/' — so a prefix route
      never takes a sibling whose name merely starts like it.
    name: prefixOf
    params: prefix, path []byte
    results: bool
  - name: Bearer
    params: v corenet.HTTP1BearerVerifier, exempt ...int
    results: corenet.Middleware[corenet.HTTP1Handler], error
  - doc: |-
      bearerToken returns the token of an "Authorization: Bearer <token>" field,
      and false when there is none.
    name: bearerToken
    params: req *corenet.HTTP1RequestValue
    results: "[]byte, bool"
  - doc: |-
      addHeader gives res the field lines b: b itself when res has none, which
      costs nothing, or a copy after the ones it has.
    name: addHeader
    params: res *corenet.HTTP1ResponseValue, b []byte
  - name: Headers
    params: pairs ...string
    results: corenet.Middleware[corenet.HTTP1Handler], error
  - name: Log
    params: l corenet.HTTP1AccessLogger, allow ...string
    results: corenet.Middleware[corenet.HTTP1Handler], error
  - doc: credential reports whether name is a field Log never records.
    name: credential
    params: name string
    results: bool
  - doc: repeated reports whether name is among before, case-insensitive.
    name: repeated
    params: name string, before []string
    results: bool
  - name: HandleLoop
    params: h corenet.HTTP1Handler, p Parser
    results: "*LoopHandler"
  - doc: |-
      swallowErr intentionally discards a non-actionable error, recording the
      discard so the error audit treats it as deliberate: the adapter has no
      caller to return a refused Close to, and a refused Close means the
      connection is already gone.
    name: swallowErr
    params: err error
  - doc: "tokenTable builds the tchar table: the alphanumerics and fifteen symbols."
    name: tokenTable
    results: "[byteValues]bool"
  - name: NewParser
    params: l corenet.HTTP1LimitsValue
    results: Parser, error
  - doc: orDefault returns v, or def when v is zero.
    name: orDefault
    params: v, def T
    results: T
    typeParams: T int | int64
  - doc: |-
      ranOut turns a scan's outcome into Parse's refusal: a scan that stopped for
      want of bytes is a refusal only once the head bound has been reached.
    name: ranOut
    params: r Refusal, n, head int
    results: Refusal
  - name: Continue
    params: buf []byte, req *corenet.HTTP1RequestValue
    results: int
  - name: Pending
    params: req *corenet.HTTP1RequestValue, buffered int
    results: int
  - doc: |-
      reset clears what Parse sets, leaving the field array's stale entries past
      NFields, which nothing reads.
    name: reset
    params: req *corenet.HTTP1RequestValue
  - doc: |-
      requestLine reads "method SP target SP HTTP/1.1 CRLF" from the start of
      head and returns the index after it, or 0 when head ends first, or a
      refusal.
    name: requestLine
    params: head []byte, target int, req *corenet.HTTP1RequestValue
    results: int, Refusal
  - doc: method reads the method and its space, and returns the index after them.
    name: method
    params: head []byte, req *corenet.HTTP1RequestValue
    results: int, Refusal
  - doc: |-
      requestTarget reads the target that starts at start, and its space, and
      returns the index after them.
    name: requestTarget
    params: head []byte, start, bound int, req *corenet.HTTP1RequestValue
    results: int, Refusal
  - doc: tooLong returns RefusalTargetTooLong when past is true, RefusalNone else.
    name: tooLong
    params: past bool
    results: Refusal
  - doc: |-
      emptyOrLong names the refusal of a target of n bytes that is either empty
      or past its bound.
    name: emptyOrLong
    params: n int
    results: Refusal
  - doc: |-
      versionLine reads "HTTP/1.1 CRLF" at start and returns the index after it,
      or 0 when head ends first, or a refusal.
    name: versionLine
    params: head []byte, start int
    results: int, Refusal
  - doc: |-
      versionPrefix judges a version line cut short: rest holds fewer bytes than
      the version and its CRLF.
    name: versionPrefix
    params: rest []byte
    results: Refusal
  - doc: |-
      versionEnd judges the bytes after the version: c, and next when have says
      it has arrived.
    name: versionEnd
    params: c, next byte, have bool
    results: Refusal
  - doc: |-
      lineEnd names the refusal for c found where a request-line element should
      go on: a bare CR or LF when it is one, def otherwise.
    name: lineEnd
    params: c byte, def Refusal
    results: Refusal
  - doc: |-
      fields reads the field lines from start up to and including the blank line,
      and returns the index after it, or 0 when head ends first, or a refusal.
    name: fields
    params: head []byte, start int, body int64, req *corenet.HTTP1RequestValue
    results: int, Refusal
  - doc: |-
      lineStart judges the first byte of a line at pos: the blank line (done, and
      the index after it), a refusal, the bytes running out (0), or a field line
      (pos itself).
    name: lineStart
    params: head []byte, pos, nfields int
    results: int, bool, Refusal
  - doc: |-
      crlfAt judges the CR at pos: the index after its LF, 0 while the LF has not
      arrived, or a bare CR.
    name: crlfAt
    params: head []byte, pos int
    results: int, Refusal
  - doc: |-
      field reads one field line at start, records it, and returns the index
      after its CRLF, or 0 when head ends first, or a refusal.
    name: field
    params: head []byte, start int, body int64, req *corenet.HTTP1RequestValue
    results: int, Refusal
  - doc: |-
      fieldValue scans a field value from start: it skips the leading whitespace
      and returns where the value starts and the index of its CR, or a 0 end when
      head ends first, or a refusal.
    name: fieldValue
    params: head []byte, start int
    results: valueStart, valueEnd int, refusal Refusal
  - doc: |-
      valueStopAt judges the control byte that stopped a value scan at pos, the
      byte after it present: RefusalNone for a CRLF, or a refusal named after the
      byte.
    name: valueStopAt
    params: head []byte, pos int
    results: Refusal
  - doc: crValue judges the CR that ends a value at pos, the byte after it present.
    name: crValue
    params: head []byte, pos int
    results: Refusal
  - doc: trimRight returns v without its trailing spaces and tabs.
    name: trimRight
    params: v []byte
    results: "[]byte"
  - doc: |-
      nameEnd names the refusal for a field name of n bytes that stopped at pos
      on something other than its colon. A CR whose LF has not arrived yet gives
      RefusalNone, which the caller reads as "more bytes".
    name: nameEnd
    params: head []byte, pos, n int
    results: Refusal
  - doc: crName judges the CR that ends a field line with no colon.
    name: crName
    params: head []byte, pos int
    results: Refusal
  - doc: |-
      known applies the profile's rules to the fields it reads — Host,
      Authorization, Content-Length, Connection, Expect and Transfer-Encoding —
      and lets every other field through.
    name: known
    params: name, value []byte, body int64, req *corenet.HTTP1RequestValue
    results: Refusal
  - doc: |-
      kindOf returns which known field name is, or kindOther: no two known
      names share a length, so one comparison decides.
    name: kindOf
    params: name []byte
    results: fieldKind
  - doc: host records the Host field, refusing a second one.
    name: host
    params: value []byte, req *corenet.HTTP1RequestValue
    results: Refusal
  - doc: authorization records the Authorization field, refusing a second one.
    name: authorization
    params: value []byte, req *corenet.HTTP1RequestValue
    results: Refusal
  - doc: |-
      contentLength reads a Content-Length value: one to ten decimal digits, no
      sign, no space, no list, at most body, and the first of its name.
    name: contentLength
    params: value []byte, body int64, req *corenet.HTTP1RequestValue
    results: Refusal
  - doc: hasField reports whether req already holds a field named name.
    name: hasField
    params: req *corenet.HTTP1RequestValue, name string
    results: bool
  - doc: |-
      hasClose reports whether a Connection value, a comma list of tokens, holds
      the close token.
    name: hasClose
    params: v []byte
    results: bool
  - doc: |-
      nextToken returns the token of a comma list that starts at or after pos,
      separators skipped, and the index after it.
    name: nextToken
    params: v []byte, pos int
    results: "[]byte, int"
  - doc: isListSep reports whether c separates the tokens of a comma list.
    name: isListSep
    params: c byte
    results: bool
  - doc: tokenEnd returns the length of the run of tchar bytes b starts with.
    name: tokenEnd
    params: b []byte
    results: int
  - doc: |-
      foldIs reports whether b equals lit once A–Z in b are folded to a–z. lit is
      lowercase letters and '-' only, which is what makes OR 0x20 exact: a byte
      ORed with 0x20 equals a lowercase letter only when it is that letter or its
      capital, and equals '-' only when it is '-' or CR, which no caller passes —
      a name is a token, and a Connection value holds no CR.
    name: foldIs
    params: b T, lit string
    results: bool
    typeParams: T ~string | ~[]byte
  - doc: hexTable builds hexDigits.
    name: hexTable
    results: "[byteValues]byte"
  - doc: |-
      canonical computes req.Path and req.Query from req.Target once the head is
      whole, since an absolute-form target is judged against the Host field. It
      refuses a target two readers could resolve to two resources: a dot-segment,
      an empty segment, a backslash, an invalid escape, an encoded slash, dot,
      backslash or NUL (RefusalTargetPath); a form the profile does not serve
      (RefusalTargetForm); an absolute-form authority that is not the Host's
      (RefusalTargetHost). Nothing is decoded and nothing allocates: both slices
      alias the target, never a package value, so a link that writes into
      req.Path writes into this request's bytes only.
    name: canonical
    params: req *corenet.HTTP1RequestValue
    results: Refusal
  - doc: |-
      absoluteForm reduces an absolute-form target to its path once its
      authority matched the Host field, A–Z folded (RFC 9112 §3.2.2: a server
      that kept both could route by one and authorise by the other).
    name: absoluteForm
    params: t []byte, req *corenet.HTTP1RequestValue
    results: Refusal
  - doc: |-
      cutScheme returns what follows an http:// or https:// scheme, in any case,
      and false for any other target.
    name: cutScheme
    params: t []byte
    results: "[]byte, bool"
  - doc: |-
      authorityIsHost reports whether an absolute-form authority is non-empty,
      carries no userinfo, and equals the request's Host field, A–Z folded.
    name: authorityIsHost
    params: authority []byte, req *corenet.HTTP1RequestValue
    results: bool
  - doc: splitPath cuts p, which starts with "/", at its query and checks the path.
    name: splitPath
    params: p []byte, req *corenet.HTTP1RequestValue
    results: Refusal
  - doc: |-
      checkPath refuses a path, which starts with "/", holding an empty segment
      but the last, a "." or ".." segment, a backslash, an invalid escape, or an
      escape of '/', '.', '\' or NUL.
    name: checkPath
    params: p []byte
    results: Refusal
  - doc: |-
      pathByte returns how many bytes of p at i one path byte takes — three for
      an escape, one otherwise — or 0 for a backslash or a refused escape.
    name: pathByte
    params: p []byte, i int
    results: int
  - doc: dotSegment reports whether seg is "." or "..".
    name: dotSegment
    params: seg []byte
    results: bool
  - doc: |-
      escapeAllowed reports whether p holds two hexadecimal digits after the '%'
      at i, decoding to a byte other than '/', '.', '\' and NUL.
    name: escapeAllowed
    params: p []byte, i int
    results: bool
  - doc: foldEqualBytes reports whether a and b are equal once A–Z are folded.
    name: foldEqualBytes
    params: a, b []byte
    results: bool
  - doc: lowerASCII maps A–Z onto a–z and every other byte onto itself.
    name: lowerASCII
    params: c byte
    results: byte
  - doc: refusalAnswerTable spells, once, the answer to every refusal.
    name: refusalAnswerTable
    results: "[refusalCount]string"
  - name: AppendStatusLine
    params: dst []byte, status int
    results: "[]byte, error"
  - name: AppendField
    params: dst []byte, name, value string
    results: "[]byte, error"
  - doc: token reports whether s is a non-empty RFC 9110 token.
    name: token
    params: s string
    results: bool
  - doc: fieldText reports whether s holds no control byte but the tab, and no DEL.
    name: fieldText
    params: s string
    results: bool
  - doc: owned reports whether name is a field the codec writes itself.
    name: owned
    params: name string
    results: bool
  - name: AppendResponse
    params: dst []byte, req *corenet.HTTP1RequestValue, res *corenet.HTTP1ResponseValue, closing bool
    results: "[]byte, error"
  - doc: |-
      appendFraming appends Content-Length unless the status forbids it,
      Connection: close when asked, and the blank line that ends the head.
    name: appendFraming
    params: dst []byte, n int, bodiless, closing bool
    results: "[]byte"
  - name: AppendRefusal
    params: dst []byte, r Refusal
    results: "[]byte"
imports:
  atomic: sync/atomic
  bytes: bytes
  corenet: github.com/kitsunium/sdk/internal/core/net
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  slices: slices
  strconv: strconv
  swar: github.com/kitsunium/sdk/internal/kernel/swar
  sync: sync
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/net/http1
  name: http1
  purpose: "Package http1 is the restricted HTTP/1.1 profile (ADR 0186 §D6): a codec that frames requests out of bytes and appends responses to bytes, doing no I/O, and HandleLoop, the adapter that serves it on a loop group."
types:
  - fields:
      - doc: ID identifies the route, from 1; zero is "no route".
        name: ID
        type: int
      - doc: Method is the method the route takes, empty for any.
        name: Method
        type: string
      - doc: |-
          Path is the canonical path the route matches, from "/": the whole of
          it, or its start when Prefix is set.
        name: Path
        type: string
      - doc: |-
          Prefix makes Path match the start of a request's path, on a segment
          boundary: "/health" matches "/health" and "/health/live", never
          "/healthz"; a Path ending in "/" matches whatever follows it.
        name: Prefix
        type: bool
    kind: struct
    name: RouteValue
  - doc: |-
      route is a RouteValue as the layer matches it: bytes, compared to the
      request's without a conversion.
    fields:
      - doc: id is the route's ID.
        name: id
        type: int
      - doc: method is the route's method, empty for any.
        name: method
        type: "[]byte"
      - doc: path is the canonical path, or its start.
        name: path
        type: "[]byte"
      - doc: prefix makes path match the start of a request's path.
        name: prefix
        type: bool
    kind: struct
    name: route
  - doc: link is what every layer of the chain keeps of the handler it wraps.
    fields:
      - doc: next is the handler the layer wraps.
        name: next
        type: corenet.HTTP1Handler
      - doc: batcher is next as a batcher, nil when it is not one.
        name: batcher
        type: corenet.HTTP1Batcher
    kind: struct
    methods:
      - doc: endBatch ends the next handler's batch when it is a batcher.
        name: endBatch
        params: lane int
        recv: l *link
    name: link
  - fields:
      - name: ""
        role: embedded
        type: link
      - doc: routes are the routes, in the order given.
        name: routes
        type: "[]route"
    kind: struct
    methods:
      - name: ServeHTTP1
        params: req *corenet.HTTP1RequestValue, res *corenet.HTTP1ResponseValue
        recv: l *RouteLayer
      - name: EndBatch
        params: lane int
        recv: l *RouteLayer
    name: RouteLayer
  - fields:
      - name: ""
        role: embedded
        type: link
      - doc: v verifies the token.
        name: v
        type: corenet.HTTP1BearerVerifier
      - doc: exempt are the routes that need no token.
        name: exempt
        type: "[]int"
    kind: struct
    methods:
      - name: ServeHTTP1
        params: req *corenet.HTTP1RequestValue, res *corenet.HTTP1ResponseValue
        recv: l *BearerLayer
      - name: EndBatch
        params: lane int
        recv: l *BearerLayer
      - doc: exempted reports whether route is one of the exemptions.
        name: exempted
        params: route int
        recv: l *BearerLayer
        results: bool
    name: BearerLayer
  - fields:
      - name: ""
        role: embedded
        type: link
      - doc: fields are the field lines every answer carries.
        name: fields
        type: "[]byte"
    kind: struct
    methods:
      - name: ServeHTTP1
        params: req *corenet.HTTP1RequestValue, res *corenet.HTTP1ResponseValue
        recv: l *HeadersLayer
      - name: EndBatch
        params: lane int
        recv: l *HeadersLayer
    name: HeadersLayer
  - fields:
      - name: ""
        role: embedded
        type: link
      - doc: l receives the records.
        name: l
        type: corenet.HTTP1AccessLogger
      - doc: allow are the field names a record carries, as given.
        name: allow
        type: "[]string"
      - doc: names are allow's bytes, a record's field names.
        name: names
        type: "[][]byte"
    kind: struct
    methods:
      - name: ServeHTTP1
        params: req *corenet.HTTP1RequestValue, res *corenet.HTTP1ResponseValue
        recv: l *LogLayer
      - name: EndBatch
        params: lane int
        recv: l *LogLayer
    name: LogLayer
  - fields:
      - doc: h serves every request.
        name: h
        type: corenet.HTTP1Handler
      - doc: batcher is h as an HTTP1Batcher, nil when it is not one.
        name: batcher
        type: corenet.HTTP1Batcher
      - doc: p frames every request.
        name: p
        type: Parser
      - doc: |-
          loops holds each loop's state at its LoopIO.Loop index. It is replaced,
          never written in place, under mu; a loop reads it without the lock.
        name: loops
        type: atomic.Pointer[[]*loopState]
      - doc: mu serialises the first sight of a loop.
        name: mu
        type: sync.Mutex
    kind: struct
    methods:
      - name: OnOpen
        params: io corenet.LoopIO, ref corenet.LoopConnRef
        recv: a *LoopHandler
      - name: OnData
        params: io corenet.LoopIO, ref corenet.LoopConnRef, buf []byte
        recv: a *LoopHandler
        results: int
      - doc: |-
          serve hands the request framed into st.req to the handler and queues its
          answer, and reports whether the connection closes after it.
        name: serve
        params: io corenet.LoopIO, ref corenet.LoopConnRef, st *loopState, loop int
        recv: a *LoopHandler
        results: bool
      - name: OnTimeout
        params: io corenet.LoopIO, ref corenet.LoopConnRef
        recv: "*LoopHandler"
      - name: OnWritable
        params: io corenet.LoopIO, ref corenet.LoopConnRef
        recv: "*LoopHandler"
      - name: OnBatchEnd
        params: io corenet.LoopIO
        recv: a *LoopHandler
      - name: OnStart
        params: lanes int
        recv: a *LoopHandler
      - name: OnClose
        params: io corenet.LoopIO, ref corenet.LoopConnRef, err error
        recv: "*LoopHandler"
      - doc: state returns loop i's state, built on the loop's first call.
        name: state
        params: i int
        recv: a *LoopHandler
        results: "*loopState"
      - doc: grow builds loop i's state and publishes a table that holds it.
        name: grow
        params: i int
        recv: a *LoopHandler
        results: "*loopState"
    name: LoopHandler
  - doc: loopState is one loop's state. Only that loop's thread touches it.
    fields:
      - doc: req is the request value every request of the loop is framed into.
        name: req
        type: corenet.HTTP1RequestValue
      - doc: |-
          stub carries the Method and Close a deferred answer is written with,
          once req has moved on to the next request.
        name: stub
        type: corenet.HTTP1RequestValue
      - doc: out holds the batch's answers, written in place as each is taken.
        name: out
        type: "[]byte"
      - doc: |-
          spare is the buffer complete orders a batch with deferred answers into;
          it and out swap, so neither is allocated again.
        name: spare
        type: "[]byte"
      - doc: deferred counts the batch's deferred answers.
        name: deferred
        type: int
      - doc: items are the batch's answers, in the order their requests arrived.
        name: items
        type: "[]item"
      - doc: free are the response values no request holds.
        name: free
        type: "[]*corenet.HTTP1ResponseValue"
      - doc: conns is a flag per connection, by ring and slot.
        name: conns
        type: "[][]connFlag"
      - doc: served counts the requests the batch handed to the handler.
        name: served
        type: int
    kind: struct
    methods:
      - doc: |-
          complete writes the batch's answers again into spare, in request order,
          each deferred one in its place, and makes spare the batch's out: the
          answers of one connection then lie side by side, and leave in one Write.
          A batch with no deferred answer is already in order and is left as it is.
        name: complete
        recv: st *loopState
      - doc: |-
          flush writes the batch's answers in order, a run of one connection's
          answers that lie side by side in out in one Write, and closes each
          connection whose answer asked to, or whose output refused one.
        name: flush
        params: io corenet.LoopIO
        recv: st *loopState
      - doc: |-
          write writes p on ref, then closes ref when closing or when the write is
          refused. A connection already given up on is skipped.
        name: write
        params: io corenet.LoopIO, ref corenet.LoopConnRef, p []byte, closing bool
        recv: st *loopState
      - doc: take returns a zeroed response value for one request.
        name: take
        recv: st *loopState
        results: "*corenet.HTTP1ResponseValue"
      - doc: |-
          give returns res to the pool. Its slices are dropped at the next take,
          never reused: they are the handler's.
        name: give
        params: res *corenet.HTTP1ResponseValue
        recv: st *loopState
      - doc: |-
          flag returns ref's flag, growing the table on the first sight of its ring
          or its slot. A flag of an older generation reads as nothing set.
        name: flag
        params: ref corenet.LoopConnRef
        recv: st *loopState
        results: "*connFlag"
    name: loopState
  - doc: item is one answer of a batch.
    fields:
      - doc: ref is the connection it answers on.
        name: ref
        type: corenet.LoopConnRef
      - doc: |-
          res is the deferred response, written at the batch's end; nil once the
          answer is in out.
        name: res
        type: "*corenet.HTTP1ResponseValue"
      - doc: off and end bound the answer in out.
        name: "off"
        type: int
      - doc: off and end bound the answer in out.
        name: end
        type: int
      - doc: head is whether the request was a HEAD, for a deferred answer.
        name: head
        type: bool
      - doc: closing is whether the connection closes after this answer.
        name: closing
        type: bool
    kind: struct
    name: item
  - doc: |-
      connFlag is what the adapter keeps of one connection: its generation, so a
      stale slot reads as a new one, and how it ends.
    fields:
      - doc: gen is the generation of the connection the flag describes.
        name: gen
        type: uint32
      - doc: |-
          closing is set once an answer that closes the connection is queued:
          nothing more is read from it.
        name: closing
        type: bool
      - doc: |-
          dead is set once a write was refused or the close was asked: nothing
          more is written to it.
        name: dead
        type: bool
    kind: struct
    name: connFlag
  - doc: fieldKind is which of the profile's known fields a name is.
    kind: named
    name: fieldKind
    underlying: uint8
  - fields:
      - doc: head bounds the head in bytes; zero selects corenet.HTTP1DefaultHead.
        name: head
        type: int
      - doc: target bounds the request-target in bytes; zero selects corenet.HTTP1DefaultTarget.
        name: target
        type: int
      - doc: body bounds the Content-Length; zero selects corenet.HTTP1DefaultBody.
        name: body
        type: int64
    kind: struct
    methods:
      - name: Limits
        recv: p Parser
        results: corenet.HTTP1LimitsValue
      - name: Parse
        params: buf []byte, req *corenet.HTTP1RequestValue
        recv: p Parser
        results: int, Refusal
    name: Parser
  - kind: named
    methods:
      - name: String
        recv: r Refusal
        results: string
      - name: Status
        recv: r Refusal
        results: int
      - name: Err
        recv: r Refusal
        results: error
    name: Refusal
    underlying: uint8
vars:
  - grouped: true
    items:
      - doc: |-
          wwwAuthenticate is the field a 401 from Bearer carries, with no spare
          capacity, so a handler appending to it copies it.
        name: wwwAuthenticate
        value: "slices.Clip([]byte(\"WWW-Authenticate: Bearer\\r\\n\"))"
      - doc: credentialFields are the request fields Log never records, lowercase.
        name: credentialFields
        value: "[...]string{\"authorization\", \"proxy-authorization\", \"cookie\"}"
    name: wwwAuthenticate
  - grouped: true
    items:
      - doc: tchar holds the RFC 9110 §5.6.2 token characters.
        name: tchar
        value: tokenTable()
      - doc: |-
          targetStop is every byte that ends or breaks a request-target: a space
          or any byte below it, DEL, and the bytes from 0x80 up.
        name: targetStop
        value: swar.NewSet(asciiDEL, asciiDEL, asciiSpace+1, true)
      - doc: |-
          valueStop is every byte a field value scan must look at: the C0
          controls, CR and LF included, and DEL. The tab is among them and is the
          one allowed.
        name: valueStop
        value: swar.NewSet(asciiDEL, asciiDEL, asciiSpace, false)
      - doc: |-
          knownNames holds, at its length, the lowercase name of each field the
          profile reads: no two share a length, so one comparison identifies one.
        name: knownNames
        value: |-
          [knownMaxLen]string{
          		len("host"):              "host",
          		len("expect"):            "expect",
          		len("connection"):        "connection",
          		len("authorization"):     "authorization",
          		len("content-length"):    "content-length",
          		len("transfer-encoding"): "transfer-encoding",
          	}
      - doc: knownKinds is the kind of the name knownNames holds at the same length.
        name: knownKinds
        value: |-
          [knownMaxLen]fieldKind{
          		len("host"):              kindHost,
          		len("expect"):            kindExpect,
          		len("connection"):        kindConnection,
          		len("authorization"):     kindAuthorization,
          		len("content-length"):    kindContentLength,
          		len("transfer-encoding"): kindTransferEncoding,
          	}
      - doc: methodConnect is the one method the profile refuses by name.
        name: methodConnect
        value: "[]byte(\"CONNECT\")"
      - doc: versionBytes is version, for the comparisons with a slice of the input.
        name: versionBytes
        value: "[]byte(version)"
    name: tchar
  - grouped: true
    items:
      - doc: refusalNames are the names String renders, indexed by Refusal.
        name: refusalNames
        value: |-
          [refusalCount]string{
          		RefusalNone:                    "none",
          		RefusalRequestLine:             "request_line",
          		RefusalMethod:                  "method",
          		RefusalTarget:                  "target",
          		RefusalVersion:                 "version",
          		RefusalBareCR:                  "bare_cr",
          		RefusalBareLF:                  "bare_lf",
          		RefusalNUL:                     "nul",
          		RefusalControl:                 "control",
          		RefusalObsFold:                 "obs_fold",
          		RefusalSpaceBeforeColon:        "space_before_colon",
          		RefusalName:                    "name",
          		RefusalTransferEncoding:        "transfer_encoding",
          		RefusalContentLength:           "content_length",
          		RefusalContentLengthDuplicated: "content_length_duplicated",
          		RefusalAuthorizationDuplicated: "authorization_duplicated",
          		RefusalHostDuplicated:          "host_duplicated",
          		RefusalExpect:                  "expect",
          		RefusalHeadTooLarge:            "head_too_large",
          		RefusalTooManyFields:           "too_many_fields",
          		RefusalTargetTooLong:           "target_too_long",
          		RefusalBodyTooLarge:            "body_too_large",
          		RefusalMethodUnsupported:       "method_unsupported",
          		RefusalTargetPath:              "target_path",
          		RefusalTargetForm:              "target_form",
          		RefusalTargetHost:              "target_host",
          	}
      - doc: |-
          refusalStatus is the status each refusal is answered with; RefusalNone's
          is zero.
        name: refusalStatus
        value: |-
          [refusalCount]int{
          		RefusalRequestLine:             statusBadRequest,
          		RefusalMethod:                  statusBadRequest,
          		RefusalTarget:                  statusBadRequest,
          		RefusalVersion:                 statusBadRequest,
          		RefusalBareCR:                  statusBadRequest,
          		RefusalBareLF:                  statusBadRequest,
          		RefusalNUL:                     statusBadRequest,
          		RefusalControl:                 statusBadRequest,
          		RefusalObsFold:                 statusBadRequest,
          		RefusalSpaceBeforeColon:        statusBadRequest,
          		RefusalName:                    statusBadRequest,
          		RefusalTransferEncoding:        statusBadRequest,
          		RefusalContentLength:           statusBadRequest,
          		RefusalContentLengthDuplicated: statusBadRequest,
          		RefusalAuthorizationDuplicated: statusBadRequest,
          		RefusalHostDuplicated:          statusBadRequest,
          		RefusalExpect:                  statusExpectationFailed,
          		RefusalHeadTooLarge:            statusFieldsTooLarge,
          		RefusalTooManyFields:           statusFieldsTooLarge,
          		RefusalTargetTooLong:           statusURITooLong,
          		RefusalBodyTooLarge:            statusContentTooLarge,
          		RefusalMethodUnsupported:       statusNotImplemented,
          		RefusalTargetPath:              statusBadRequest,
          		RefusalTargetForm:              statusBadRequest,
          		RefusalTargetHost:              statusBadRequest,
          	}
      - doc: |-
          refusalErrs is the core/net sentinel each refusal belongs to, grouped by
          the decision a caller makes rather than by the byte that broke.
        name: refusalErrs
        value: |-
          [refusalCount]error{
          		RefusalRequestLine:             corenet.HTTP1RequestMalformed,
          		RefusalMethod:                  corenet.HTTP1RequestMalformed,
          		RefusalTarget:                  corenet.HTTP1RequestMalformed,
          		RefusalVersion:                 corenet.HTTP1RequestMalformed,
          		RefusalBareCR:                  corenet.HTTP1RequestMalformed,
          		RefusalBareLF:                  corenet.HTTP1RequestMalformed,
          		RefusalNUL:                     corenet.HTTP1RequestMalformed,
          		RefusalControl:                 corenet.HTTP1RequestMalformed,
          		RefusalObsFold:                 corenet.HTTP1RequestMalformed,
          		RefusalSpaceBeforeColon:        corenet.HTTP1RequestMalformed,
          		RefusalName:                    corenet.HTTP1RequestMalformed,
          		RefusalTransferEncoding:        corenet.HTTP1TransferEncoding,
          		RefusalContentLength:           corenet.HTTP1ContentLengthInvalid,
          		RefusalContentLengthDuplicated: corenet.HTTP1ContentLengthInvalid,
          		RefusalAuthorizationDuplicated: corenet.HTTP1FieldDuplicated,
          		RefusalHostDuplicated:          corenet.HTTP1FieldDuplicated,
          		RefusalExpect:                  corenet.HTTP1ExpectRefused,
          		RefusalHeadTooLarge:            corenet.HTTP1HeadTooLarge,
          		RefusalTooManyFields:           corenet.HTTP1HeadTooLarge,
          		RefusalTargetTooLong:           corenet.HTTP1TargetTooLong,
          		RefusalBodyTooLarge:            corenet.HTTP1BodyTooLarge,
          		RefusalMethodUnsupported:       corenet.HTTP1MethodUnsupported,
          		RefusalTargetPath:              corenet.HTTP1RequestMalformed,
          		RefusalTargetForm:              corenet.HTTP1RequestMalformed,
          		RefusalTargetHost:              corenet.HTTP1RequestMalformed,
          	}
    name: refusalNames
  - grouped: true
    items:
      - doc: |-
          hexDigits are the values of the hexadecimal digits, by byte; noDigit for
          any other.
        name: hexDigits
        value: hexTable()
      - doc: methodOptions is the one method an asterisk-form target may carry.
        name: methodOptions
        value: "[]byte(\"OPTIONS\")"
      - doc: querySep starts a target's query.
        name: querySep
        value: "[]byte(\"?\")"
    name: hexDigits
  - grouped: true
    items:
      - doc: |-
          statusLines are the status lines of the codes RFC 9110 §15 registers,
          spelled once, indexed by code. An entry left empty is composed on demand.
        name: statusLines
        value: |-
          [statusRegistered]string{
          		200: "HTTP/1.1 200 OK\r\n",
          		201: "HTTP/1.1 201 Created\r\n",
          		202: "HTTP/1.1 202 Accepted\r\n",
          		203: "HTTP/1.1 203 Non-Authoritative Information\r\n",
          		204: "HTTP/1.1 204 No Content\r\n",
          		205: "HTTP/1.1 205 Reset Content\r\n",
          		206: "HTTP/1.1 206 Partial Content\r\n",
          		300: "HTTP/1.1 300 Multiple Choices\r\n",
          		301: "HTTP/1.1 301 Moved Permanently\r\n",
          		302: "HTTP/1.1 302 Found\r\n",
          		303: "HTTP/1.1 303 See Other\r\n",
          		304: "HTTP/1.1 304 Not Modified\r\n",
          		307: "HTTP/1.1 307 Temporary Redirect\r\n",
          		308: "HTTP/1.1 308 Permanent Redirect\r\n",
          		400: "HTTP/1.1 400 Bad Request\r\n",
          		401: "HTTP/1.1 401 Unauthorized\r\n",
          		402: "HTTP/1.1 402 Payment Required\r\n",
          		403: "HTTP/1.1 403 Forbidden\r\n",
          		404: "HTTP/1.1 404 Not Found\r\n",
          		405: "HTTP/1.1 405 Method Not Allowed\r\n",
          		406: "HTTP/1.1 406 Not Acceptable\r\n",
          		407: "HTTP/1.1 407 Proxy Authentication Required\r\n",
          		408: "HTTP/1.1 408 Request Timeout\r\n",
          		409: "HTTP/1.1 409 Conflict\r\n",
          		410: "HTTP/1.1 410 Gone\r\n",
          		411: "HTTP/1.1 411 Length Required\r\n",
          		412: "HTTP/1.1 412 Precondition Failed\r\n",
          		413: "HTTP/1.1 413 Content Too Large\r\n",
          		414: "HTTP/1.1 414 URI Too Long\r\n",
          		415: "HTTP/1.1 415 Unsupported Media Type\r\n",
          		416: "HTTP/1.1 416 Range Not Satisfiable\r\n",
          		417: "HTTP/1.1 417 Expectation Failed\r\n",
          		421: "HTTP/1.1 421 Misdirected Request\r\n",
          		422: "HTTP/1.1 422 Unprocessable Content\r\n",
          		426: "HTTP/1.1 426 Upgrade Required\r\n",
          		428: "HTTP/1.1 428 Precondition Required\r\n",
          		429: "HTTP/1.1 429 Too Many Requests\r\n",
          		431: "HTTP/1.1 431 Request Header Fields Too Large\r\n",
          		500: "HTTP/1.1 500 Internal Server Error\r\n",
          		501: "HTTP/1.1 501 Not Implemented\r\n",
          		502: "HTTP/1.1 502 Bad Gateway\r\n",
          		503: "HTTP/1.1 503 Service Unavailable\r\n",
          		504: "HTTP/1.1 504 Gateway Timeout\r\n",
          		505: "HTTP/1.1 505 HTTP Version Not Supported\r\n",
          	}
      - doc: |-
          refusalAnswers is the whole answer to each refusal, indexed by Refusal:
          its status line, no body, and the connection closed. RefusalNone's slot
          holds the 400, which AppendRefusal also gives a value past the table.
        name: refusalAnswers
        value: refusalAnswerTable()
      - doc: methodHead is the one method whose answer carries no body.
        name: methodHead
        value: "[]byte(\"HEAD\")"
    name: statusLines
