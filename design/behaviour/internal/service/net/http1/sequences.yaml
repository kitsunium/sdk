    participants:
      - id: caller
        kind: actor
      - id: (*loopState).complete
        kind: self
      - id: AppendResponse
        kind: internal
      - id: appendInternalError
        kind: internal
      - id: st.give
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: st.deferred == 0
      - bind: out
        eval: st.spare[:0]
      - loop:
          do:
            - bind: it
              eval: "&st.items[i]"
            - bind: "off"
              eval: len(out)
            - opt:
                do:
                  - set: out
                    value: append(out, st.out[it.off:it.end]...)
                  - set: it.off, it.end
                    value: off, len(out)
                  - continue: true
                when: it.res == nil
            - bind: res
              eval: it.res
            - set: st.stub.Method, st.stub.Close
              value: nil, false
            - opt:
                do:
                  - set: st.stub.Method
                    value: methodHead
                when: it.head
            - bind: next, err
              eval: AppendResponse(out, &st.stub, res, it.closing)
              to: AppendResponse
            - opt:
                do:
                  - set: next
                    to: appendInternalError
                    value: appendInternalError(out, res)
                  - set: it.closing
                    value: "true"
                when: res.Defer || err != nil
            - set: it.closing
              value: it.closing || res.Close
            - set: out, it.off, it.end, it.res
              value: next, off, len(next), nil
            - eval: st.give(res)
              to: st.give
          key: i
          range: st.items
      - set: st.spare, st.out, st.deferred
        value: st.out, out, 0
  - of: (*loopState).flush
    participants:
      - id: caller
        kind: actor
      - id: (*loopState).flush
        kind: self
      - id: st.write
        kind: internal
    steps:
      - loop:
          cond: i < len(st.items)
          do:
            - bind: it
              eval: st.items[i]
            - bind: end, closing
              eval: it.end, it.closing
            - bind: j
              eval: i + 1
            - loop:
                cond: j < len(st.items) && !closing && st.items[j].ref == it.ref && st.items[j].off == end
                do:
                  - set: end, closing
                    value: st.items[j].end, st.items[j].closing
                post: j++
            - eval: st.write(io, it.ref, st.out[it.off:end], closing)
              to: st.write
            - set: i
              value: j
