    steps:
      - opt:
          do:
            - return: RefusalHostDuplicated
          when: req.HasHost
      - set: req.HasHost, req.Host
        value: true, value
      - return: RefusalNone
  - of: authorization
    steps:
      - opt:
          do:
            - return: RefusalAuthorizationDuplicated
          when: req.HasAuthorization
      - set: req.HasAuthorization, req.Authorization
        value: true, value
      - return: RefusalNone
  - of: hasClose
    participants:
      - id: caller
        kind: actor
      - id: hasClose
        kind: self
      - id: nextToken
        kind: internal
    steps:
      - opt:
          do:
            - return: "false"
          when: foldIs(v, "keep-alive")
