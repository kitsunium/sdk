          cases:
            - case: c == '\r'
              do:
                - return: crName(head, pos)
                  to: crName
            - case: (c == ' ' || c == '\t') && n > 0
              do:
                - return: RefusalSpaceBeforeColon
            - case: c == '\n'
              do:
                - return: RefusalBareLF
            - case: c == 0
              do:
                - return: RefusalNUL
            - default: true
              do:
                - return: RefusalName
  - of: crName
    steps:
      - opt:
          do:
            - return: RefusalNone
          when: pos+1 == len(head)
      - opt:
          do:
            - return: RefusalName
          when: head[pos+1] == '\n'
      - return: RefusalBareCR
  - of: known
    participants:
      - id: caller
        kind: actor
      - id: known
        kind: self
      - id: host
        kind: internal
      - id: authorization
        kind: internal
      - id: contentLength
        kind: internal
    steps:
      - switch:
          cases:
            - case: kindOther
              do:
                - return: RefusalNone
            - case: kindHost
              do:
                - return: host(value, req)
                  to: host
            - case: kindAuthorization
              do:
                - return: authorization(value, req)
                  to: authorization
            - case: kindContentLength
              do:
                - return: contentLength(value, body, req)
                  to: contentLength
            - case: kindConnection
              do:
                - set: req.Close
                  value: req.Close || hasClose(value)
                - return: RefusalNone
            - case: kindExpect
              do:
                - return: RefusalExpect
            - default: true
              do:
                - return: RefusalTransferEncoding
          "on": kindOf(name)
