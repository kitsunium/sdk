      - id: caller
        kind: actor
      - id: fieldValue
        kind: self
      - id: valueStop.Index
        kind: value
    steps:
      - set: valueStart
        value: start
      - loop:
          cond: valueStart < len(head) && (head[valueStart] == ' ' || head[valueStart] == '\t')
