          cond: pos < len(v)
          do:
            - var:
                name: tok
                type: "[]byte"
            - set: tok, pos
              to: nextToken
              value: nextToken(v, pos)
            - opt:
                do:
                  - return: "true"
                when: foldIs(tok, "close")
          init: pos := 0
      - return: "false"
  - of: nextToken
    steps:
      - bind: start
        eval: pos
      - loop:
          cond: start < len(v) && isListSep(v[start])
          do:
            - op: ++
              set: start
      - bind: end
        eval: start
      - loop:
          cond: end < len(v) && !isListSep(v[end])
          do:
            - op: ++
              set: end
      - return: v[start:end], end
  - of: isListSep
    steps:
      - return: c == ',' || c == ' ' || c == '\t'
  - of: Refusal.String
    steps:
      - opt:
          do:
            - return: "\"unknown\""
          when: int(r) >= refusalCount
      - return: refusalNames[r]
  - of: Refusal.Status
    steps:
      - opt:
          do:
            - return: "0"
          when: int(r) >= refusalCount
      - return: refusalStatus[r]
  - of: Refusal.Err
    steps:
      - opt:
          do:
            - return: nil
          when: int(r) >= refusalCount
      - return: refusalErrs[r]
  - of: hexTable
    steps:
      - var:
          name: t
          type: "[byteValues]byte"
      - loop:
          do:
            - set: t[i]
              value: noDigit
          key: i
          range: t
      - loop:
          do:
            - set: t['0'+i]
              value: byte(i)
          key: i
          range: decimalDigits
      - loop:
          do:
            - set: t['a'+i], t['A'+i]
              value: byte(decimalDigits+i), byte(decimalDigits+i)
          key: i
          range: hexLetters
      - return: t
  - of: canonical
    participants:
      - id: caller
        kind: actor
      - id: canonical
        kind: self
      - id: splitPath
        kind: internal
      - id: absoluteForm
        kind: internal
    steps:
      - bind: t
        eval: req.Target
      - switch:
          cases:
            - case: t[0] == '/'
              do:
                - return: splitPath(t, req)
                  to: splitPath
            - case: len(t) == 1 && t[0] == '*'
              do:
                - opt:
                    do:
                      - return: RefusalTargetForm
                    when: "!bytes.Equal(req.Method, methodOptions)"
                - set: req.Path
                  value: t[:1:1]
                - return: RefusalNone
            - default: true
              do:
                - return: absoluteForm(t, req)
                  to: absoluteForm
  - of: absoluteForm
    participants:
      - id: caller
        kind: actor
      - id: absoluteForm
        kind: self
      - id: cutScheme
        kind: internal
      - id: bytes
        kind: stdlib
      - id: splitPath
        kind: internal
    steps:
      - bind: rest, ok
        eval: cutScheme(t)
        to: cutScheme
      - opt:
          do:
            - return: RefusalTargetForm
          when: "!ok"
      - bind: end
        eval: len(rest)
      - opt:
          do:
            - set: end
              value: i
          init:
            bind: i
            eval: bytes.IndexAny(rest, "/?")
            to: bytes
          when: i >= 0
      - opt:
          do:
            - return: RefusalTargetHost
          when: "!authorityIsHost(rest[:end], req)"
      - bind: tail
        eval: rest[end:]
      - opt:
          do:
            - return: splitPath(tail, req)
              to: splitPath
          when: len(tail) > 0 && tail[0] == '/'
