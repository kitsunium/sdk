            - set: t[c], t[c-'a'+'A']
              value: true, true
          init: c := 'a'
          post: c++
      - loop:
          do:
            - set: t[c]
              value: "true"
          key: _
          range: "[]byte(\"!#$%&'*+-.^_`|~\")"
          value: c
      - return: t
  - of: NewParser
    participants:
      - id: caller
        kind: actor
      - id: NewParser
        kind: self
      - id: orDefault
        kind: internal
    steps:
      - opt:
          do:
            - return: Parser{}, errs.Wrap(corenet.HTTP1Misconfigured, errs.WrapParams{}, errs.String("option", "head"))
          when: l.Head < 0 || l.Head > corenet.HTTP1MaxHead
      - bind: head
        eval: orDefault(l.Head, corenet.HTTP1DefaultHead)
        to: orDefault
      - opt:
          do:
            - return: Parser{}, errs.Wrap(corenet.HTTP1Misconfigured, errs.WrapParams{}, errs.String("option", "target"))
          when: l.Target < 0 || l.Target > head
      - opt:
          do:
            - return: Parser{}, errs.Wrap(corenet.HTTP1Misconfigured, errs.WrapParams{}, errs.String("option", "body"))
          when: l.Body < 0 || l.Body > corenet.HTTP1MaxBody
      - return: |-
          Parser{
          		head:   head,
          		target: orDefault(l.Target, min(corenet.HTTP1DefaultTarget, head)),
          		body:   orDefault(l.Body, corenet.HTTP1DefaultBody),
          	}, nil
