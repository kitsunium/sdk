            - set: t[c]
              value: "true"
          init: c := '0'
          post: c++
      - loop:
          cond: c <= 'z'
          do:
            - set: t[c], t[c-'a'+'A']
              value: true, true
          init: c := 'a'
          post: c++
      - loop:
          do:
            - set: t[c]
              value: "true"
          key: _
          range: "[]byte(\"!#$%&'*+-.^_`|~\")"
          value: c
      - return: t
  - of: NewParser
