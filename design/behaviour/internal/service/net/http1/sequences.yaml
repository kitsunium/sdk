      - switch:
          cases:
            - case: cfg.Rate <= 0
              do:
                - return: nil, misconfigured("NewKeyedBuckets", "rate")
            - case: cfg.Burst <= 0
              do:
                - return: nil, misconfigured("NewKeyedBuckets", "burst")
            - case: cfg.Keys <= 0
              do:
                - return: nil, misconfigured("NewKeyedBuckets", "keys")
