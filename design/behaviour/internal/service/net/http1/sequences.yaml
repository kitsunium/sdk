          cond: len(list) > 0
          do:
            - var:
                name: v
                type: "[]byte"
            - set: v, list, _
              to: bytes
              value: bytes.Cut(list, []byte(","))
            - set: v
              to: bytes
              value: bytes.TrimPrefix(bytes.TrimSpace(v), []byte(`W/`))
