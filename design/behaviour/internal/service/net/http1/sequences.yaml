                - return: "0"
            - case: "'%'"
              do:
                - opt:
                    do:
                      - return: "0"
                    when: "!escapeAllowed(p, i)"
                - return: escapeLen
            - default: true
              do:
                - return: "1"
          "on": p[i]
  - of: dotSegment
    steps:
      - return: (len(seg) == 1 && seg[0] == '.') || (len(seg) == 2 && seg[0] == '.' && seg[1] == '.')
  - of: escapeAllowed
    steps:
      - opt:
          do:
            - return: "false"
          when: i+2 >= len(p)
      - bind: hi, lo
        eval: hexDigits[p[i+1]], hexDigits[p[i+2]]
      - opt:
          do:
            - return: "false"
          when: hi == noDigit || lo == noDigit
      - bind: c
        eval: hi<<4 | lo
      - return: c != '/' && c != '.' && c != '\\' && c != 0
  - of: lowerASCII
    steps:
      - opt:
          do:
            - return: c + 'a' - 'A'
          when: c >= 'A' && c <= 'Z'
      - return: c
  - of: refusalAnswerTable
    steps:
      - var:
          name: t
          type: "[refusalCount]string"
      - loop:
          do:
            - bind: status
              eval: max(refusalStatus[r], statusBadRequest)
            - set: t[r]
              value: "statusLines[status] + \"Content-Length: 0\\r\\nConnection: close\\r\\n\\r\\n\""
          key: r
          range: refusalCount
      - return: t
  - of: AppendStatusLine
    participants:
      - id: caller
        kind: actor
      - id: AppendStatusLine
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - opt:
          do:
            - return: dst, corenet.HTTP1ResponseInvalid
          when: status < statusMin || status > statusMax
      - opt:
          do:
            - return: append(dst, statusLines[status]...), nil
          when: status < statusRegistered && statusLines[status] != ""
      - set: dst
        value: append(dst, "HTTP/1.1 "...)
      - set: dst
        to: strconv
        value: strconv.AppendInt(dst, int64(status), decimal)
      - return: append(dst, " \r\n"...), nil
  - of: AppendField
    steps:
      - opt:
          do:
            - return: dst, corenet.HTTP1ResponseInvalid
          when: "!token(name) || owned(name) || !fieldText(value)"
      - set: dst
        value: append(dst, name...)
      - set: dst
        value: "append(dst, \": \"...)"
      - set: dst
        value: append(dst, value...)
      - return: append(dst, "\r\n"...), nil
  - of: owned
    steps:
      - return: foldIs(name, "content-length") || foldIs(name, "connection") || foldIs(name, "transfer-encoding")
  - of: AppendResponse
    participants:
      - id: caller
        kind: actor
      - id: AppendResponse
        kind: self
      - id: orDefault
        kind: internal
      - id: AppendStatusLine
        kind: internal
      - id: appendFraming
        kind: internal
    steps:
      - bind: status
        eval: orDefault(res.Status, statusOK)
        to: orDefault
      - bind: bodiless
        eval: status == statusNoContent || status == statusNotModified
      - opt:
          do:
            - return: dst, corenet.HTTP1ResponseInvalid
          when: bodiless && len(res.Body) > 0
      - bind: out, err
        eval: AppendStatusLine(dst, status)
        to: AppendStatusLine
      - opt:
          do:
            - return: dst, err
          when: err != nil
      - set: out
        value: append(out, res.Header...)
      - set: out
        to: appendFraming
        value: appendFraming(out, len(res.Body), bodiless, closing || res.Close || req.Close)
      - opt:
          do:
            - return: out, nil
          when: bytes.Equal(req.Method, methodHead)
      - return: append(out, res.Body...), nil
  - of: appendFraming
    participants:
      - id: caller
        kind: actor
      - id: appendFraming
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - opt:
          do:
            - set: dst
              value: "append(dst, \"Content-Length: \"...)"
            - set: dst
              to: strconv
              value: strconv.AppendInt(dst, int64(n), decimal)
            - set: dst
              value: append(dst, "\r\n"...)
          when: "!bodiless"
      - opt:
          do:
            - set: dst
              value: "append(dst, \"Connection: close\\r\\n\"...)"
          when: closing
      - return: append(dst, "\r\n"...)
  - of: AppendRefusal
    steps:
      - opt:
          do:
            - return: append(dst, refusalAnswers[RefusalNone]...)
          when: int(r) >= refusalCount
      - return: append(dst, refusalAnswers[r]...)
