                do:
                  - return: 0, 0, RefusalNone
                when: n < 0
            - op: +=
              set: stop
              value: "n"
            - opt:
                do:
                  - break: true
                when: head[stop] != '\t'
            - op: ++
              set: stop
          forever: true
      - opt:
          do:
            - return: 0, 0, RefusalNone
          when: head[stop] == '\r' && stop+1 == len(head)
      - return: valueStart, stop, valueStopAt(head, stop)
  - of: valueStopAt
    participants:
      - id: caller
        kind: actor
      - id: valueStopAt
        kind: self
      - id: crValue
        kind: internal
    steps:
      - switch:
          cases:
            - case: "'\\r'"
              do:
                - return: crValue(head, pos)
                  to: crValue
            - case: "'\\n'"
              do:
                - return: RefusalBareLF
            - case: "0"
