    participants:
      - id: caller
        kind: actor
      - id: parseRange
        kind: self
      - id: bytes
        kind: stdlib
      - id: suffixRange
        kind: internal
      - id: fromRange
        kind: internal
    steps:
      - bind: after, ok
        eval: bytes.CutPrefix(spec, []byte("bytes="))
        to: bytes
      - opt:
          do:
            - return: 0, size, statusOK
          when: "!ok || bytes.IndexByte(after, ',') >= 0"
      - bind: first, last, dash
        eval: bytes.Cut(after, []byte("-"))
        to: bytes
      - set: first, last
        value: bytes.TrimSpace(first), bytes.TrimSpace(last)
      - opt:
          do:
            - return: 0, 0, statusRangeBad
          when: "!dash || (len(first) == 0 && len(last) == 0)"
      - opt:
          do:
            - return: suffixRange(last, size)
              to: suffixRange
          when: len(first) == 0
      - return: fromRange(first, last, size)
        to: fromRange
  - of: suffixRange
    participants:
      - id: caller
        kind: actor
      - id: suffixRange
        kind: self
      - id: parseOffset
        kind: internal
    steps:
      - bind: v, ok
        eval: parseOffset(last)
        to: parseOffset
      - opt:
          do:
            - return: 0, 0, statusRangeBad
          when: "!ok || v == 0 || size == 0"
      - set: "n"
        value: min(v, size)
      - return: size - n, n, statusPartial
  - of: fromRange
    participants:
      - id: caller
        kind: actor
      - id: fromRange
        kind: self
      - id: parseOffset
        kind: internal
    steps:
      - bind: from, ok
        eval: parseOffset(first)
        to: parseOffset
      - opt:
          do:
            - return: 0, 0, statusRangeBad
          when: "!ok || from >= size"
      - bind: to
        eval: size - 1
      - opt:
          do:
            - bind: v, ok
              eval: parseOffset(last)
              to: parseOffset
            - opt:
                do:
                  - return: 0, 0, statusRangeBad
                when: "!ok || v < from"
            - set: to
              value: min(v, size-1)
          when: len(last) > 0
      - return: from, to - from + 1, statusPartial
