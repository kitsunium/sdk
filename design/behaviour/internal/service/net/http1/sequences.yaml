            - op: "*="
              set: size
              value: indexGrowth
      - set: s.entries
        value: make([]bucketEntry, 0, capacity)[:capacity]
      - set: s.index
        value: make([]int32, 0, size)[:size]
      - set: s.mask
        value: uint64(size - 1)
      - set: s.head, s.tail
        value: noEntry, noEntry
      - loop:
          do:
            - set: s.index[i]
              value: noEntry
          key: i
          range: s.index
