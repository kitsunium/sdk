      - opt:
          do:
            - return: 0, RefusalNone
          when: pos+1 == len(head)
      - opt:
          do:
            - return: 0, RefusalBareCR
          when: head[pos+1] != '\n'
      - return: pos + crlfLen, RefusalNone
  - of: field
    participants:
      - id: caller
        kind: actor
      - id: field
        kind: self
      - id: fieldValue
        kind: internal
      - id: trimRight
        kind: internal
      - id: known
        kind: internal
    steps:
      - bind: colon
        eval: start + tokenEnd(head[start:])
      - opt:
          do:
            - return: 0, RefusalNone
          when: colon == len(head)
      - opt:
          do:
            - return: 0, nameEnd(head, colon, colon-start)
          when: colon == start || head[colon] != ':'
