        eval: len(t) - len(rest) - 1
      - set: req.Path
        value: "t[slash : slash+1 : slash+1]"
      - opt:
          do:
            - set: req.Query
              value: tail[1:]
          when: len(tail) > 0
      - return: RefusalNone
  - of: authorityIsHost
    steps:
      - return: len(authority) > 0 && bytes.IndexByte(authority, '@') < 0 && req.HasHost && foldEqualBytes(authority, req.Host)
  - of: splitPath
    participants:
      - id: caller
        kind: actor
      - id: splitPath
        kind: self
      - id: bytes
        kind: stdlib
      - id: checkPath
        kind: internal
    steps:
      - bind: path, query, found
        eval: bytes.Cut(p, querySep)
        to: bytes
      - opt:
          do:
            - set: req.Query
              value: query
          when: found
      - opt:
          do:
            - return: r
          init:
            bind: r
            eval: checkPath(path)
            to: checkPath
          when: r != RefusalNone
      - set: req.Path
        value: path
      - return: RefusalNone
  - of: checkPath
    participants:
      - id: caller
        kind: actor
      - id: checkPath
        kind: self
      - id: pathByte
        kind: internal
    steps:
      - bind: start
        eval: "1"
      - loop:
          cond: i <= len(p)
          do:
            - opt:
                do:
                  - opt:
                      do:
                        - return: RefusalTargetPath
                      when: (i == start && i < len(p)) || dotSegment(p[start:i])
                  - op: ++
                    set: i
                  - set: start
                    value: i
                  - continue: true
                when: i == len(p) || p[i] == '/'
            - bind: "n"
              eval: pathByte(p, i)
              to: pathByte
            - opt:
                do:
                  - return: RefusalTargetPath
                when: n == 0
            - op: +=
              set: i
              value: "n"
          init: i := 1
      - return: RefusalNone
  - of: pathByte
    steps:
      - switch:
          cases:
            - case: "'\\\\'"
