      - opt:
          do:
            - return: def
          when: v == 0
      - return: v
  - of: Parser.Limits
    steps:
      - return: |-
          corenet.HTTP1LimitsValue{
          		Head:   orDefault(p.head, corenet.HTTP1DefaultHead),
          		Target: orDefault(p.target, corenet.HTTP1DefaultTarget),
          		Body:   orDefault(p.body, corenet.HTTP1DefaultBody),
          	}
  - of: Parser.Parse
    participants:
      - id: caller
        kind: actor
      - id: Parser.Parse
        kind: self
      - id: reset
        kind: internal
      - id: orDefault
        kind: internal
      - id: requestLine
        kind: internal
      - id: fields
        kind: internal
      - id: canonical
        kind: internal
      - id: Continue
        kind: internal
    steps:
      - eval: reset(req)
        to: reset
      - bind: head
        eval: orDefault(p.head, corenet.HTTP1DefaultHead)
        to: orDefault
      - bind: limit
        eval: min(len(buf), head)
      - bind: end, r
        eval: requestLine(buf[:limit], orDefault(p.target, corenet.HTTP1DefaultTarget), req)
        to: requestLine
      - opt:
          do:
            - set: end, r
              to: fields
              value: fields(buf[:limit], end, orDefault(p.body, corenet.HTTP1DefaultBody), req)
          when: r == RefusalNone && end > 0
      - opt:
          do:
            - return: 0, ranOut(r, len(buf), head)
          when: r != RefusalNone || end == 0
      - opt:
          do:
            - return: 0, r
          init:
            bind: r
            eval: canonical(req)
            to: canonical
          when: r != RefusalNone
      - set: req.HeadLen
        value: end
      - set: req.Consumed
        value: end + int(req.ContentLength)
      - return: Continue(buf, req), RefusalNone
        to: Continue
  - of: ranOut
    steps:
      - opt:
          do:
            - return: RefusalHeadTooLarge
          when: r == RefusalNone && n >= head
      - return: r
  - of: Continue
    steps:
      - opt:
          do:
            - return: "0"
          when: req.HeadLen == 0 || len(buf) < req.Consumed
      - set: req.Body
        value: buf[req.HeadLen:req.Consumed]
      - return: req.Consumed
  - of: Pending
    steps:
      - return: max(0, req.Consumed-buffered)
  - of: reset
    participants:
      - id: caller
        kind: actor
      - id: reset
        kind: self
      - id: req.Auth.Reset
        kind: value
    steps:
      - set: req.Method, req.Target, req.Host, req.Authorization, req.Body
        value: nil, nil, nil, nil, nil
      - set: req.Path, req.Query
        value: nil, nil
      - set: req.ContentLength, req.HeadLen, req.Consumed, req.NFields, req.Route
        value: 0, 0, 0, 0, 0
      - set: req.HasHost, req.HasAuthorization, req.Close, req.Authenticated
        value: false, false, false, false
      - eval: req.Auth.Reset()
        to: req.Auth.Reset
  - of: requestLine
    participants:
      - id: caller
        kind: actor
      - id: requestLine
        kind: self
      - id: method
        kind: internal
      - id: requestTarget
        kind: internal
      - id: versionLine
        kind: internal
    steps:
      - bind: end, r
        eval: method(head, req)
        to: method
      - opt:
          do:
            - return: 0, r
          when: r != RefusalNone || end == 0
      - set: end, r
        to: requestTarget
        value: requestTarget(head, end, target, req)
      - opt:
          do:
            - return: 0, r
          when: r != RefusalNone || end == 0
      - return: versionLine(head, end)
        to: versionLine
  - of: method
    participants:
      - id: caller
        kind: actor
      - id: method
        kind: self
      - id: tokenEnd
        kind: internal
    steps:
      - bind: end
        eval: tokenEnd(head)
        to: tokenEnd
      - opt:
          do:
            - return: 0, RefusalNone
          when: end == len(head)
      - opt:
          do:
            - return: 0, RefusalMethod
          when: end == 0
      - opt:
          do:
            - return: 0, lineEnd(head[end], RefusalMethod)
          when: head[end] != ' '
      - opt:
          do:
            - return: 0, RefusalMethodUnsupported
          when: bytes.Equal(head[:end], methodConnect)
      - set: req.Method
        value: head[:end]
      - return: end + 1, RefusalNone
  - of: requestTarget
    participants:
      - id: caller
        kind: actor
      - id: requestTarget
        kind: self
      - id: targetStop.Index
        kind: value
    steps:
      - bind: "n"
        eval: targetStop.Index(head[start:])
        to: targetStop.Index
      - opt:
          do:
            - return: 0, tooLong(len(head)-start > bound)
          when: n < 0
      - opt:
          do:
            - return: 0, emptyOrLong(n)
          when: n == 0 || n > bound
      - bind: end
        eval: start + n
      - opt:
          do:
            - return: 0, lineEnd(head[end], RefusalTarget)
          when: head[end] != ' '
      - set: req.Target
        value: head[start:end]
      - return: end + 1, RefusalNone
  - of: tooLong
    steps:
      - opt:
          do:
            - return: RefusalTargetTooLong
          when: past
      - return: RefusalNone
  - of: emptyOrLong
    steps:
      - opt:
          do:
            - return: RefusalTarget
          when: n == 0
      - return: RefusalTargetTooLong
  - of: versionLine
    participants:
      - id: caller
        kind: actor
      - id: versionLine
        kind: self
      - id: versionEnd
        kind: internal
    steps:
      - bind: avail
        eval: len(head) - start
      - opt:
          do:
            - return: 0, versionPrefix(head[start:])
          when: avail < len(version)+crlfLen
      - opt:
          do:
            - return: 0, RefusalVersion
          when: "!bytes.Equal(head[start:start+len(version)], versionBytes)"
      - bind: end
        eval: start + len(version)
      - opt:
          do:
            - return: 0, r
          init:
            bind: r
            eval: versionEnd(head[end], head[end+1], true)
            to: versionEnd
          when: r != RefusalNone
      - return: end + crlfLen, RefusalNone
  - of: versionPrefix
    participants:
      - id: caller
        kind: actor
      - id: versionPrefix
        kind: self
      - id: versionEnd
        kind: internal
    steps:
      - bind: "n"
        eval: min(len(rest), len(version))
      - opt:
          do:
            - return: RefusalVersion
          when: "!bytes.Equal(rest[:n], versionBytes[:n])"
      - opt:
          do:
            - return: versionEnd(rest[len(version)], 0, false)
              to: versionEnd
          when: len(rest) > len(version)
      - return: RefusalNone
  - of: versionEnd
    steps:
      - switch:
          cases:
            - case: c == '\n'
              do:
                - return: RefusalBareLF
            - case: c != '\r'
              do:
                - return: RefusalRequestLine
            - case: "!have"
              do:
                - return: RefusalNone
            - case: next != '\n'
              do:
                - return: RefusalBareCR
            - default: true
              do:
                - return: RefusalNone
  - of: lineEnd
    steps:
      - switch:
          cases:
            - case: "'\\r'"
              do:
                - return: RefusalBareCR
            - case: "'\\n'"
              do:
                - return: RefusalBareLF
            - default: true
              do:
                - return: def
          "on": c
  - of: fields
    participants:
      - id: caller
        kind: actor
      - id: fields
        kind: self
      - id: lineStart
        kind: internal
      - id: field
        kind: internal
    steps:
      - bind: pos
        eval: start
      - loop:
          do:
            - bind: end, done, r
              eval: lineStart(head, pos, req.NFields)
              to: lineStart
