          	}}
  - of: (*RateLimitLayer).ServeHTTP1
    participants:
      - id: caller
        kind: actor
      - id: (*RateLimitLayer).ServeHTTP1
        kind: self
      - id: l.next.ServeHTTP1
        kind: value
      - id: l.lanes.get
        kind: internal
      - id: l.l.Allow
        kind: value
    steps:
      - opt:
          do:
            - eval: l.next.ServeHTTP1(req, res)
              to: l.next.ServeHTTP1
            - return: ""
          when: slices.Contains(l.cfg.exempt, req.Route)
      - bind: lane
        eval: l.lanes.get(req.Lane)
        to: l.lanes.get
      - opt:
          do:
            - set: lane.now, lane.fresh
              value: l.cfg.clk.Now().Sub(l.epoch).Nanoseconds(), true
          when: "!lane.fresh"
      - bind: ok, after
        eval: l.l.Allow(l.keyOf(req, lane), lane.now)
        to: l.l.Allow
      - opt:
          do:
            - set: res.Status, res.RetryAfter, res.Close
              value: statusTooManyRequests, after, true
            - return: ""
          when: "!ok"
      - eval: l.next.ServeHTTP1(req, res)
        to: l.next.ServeHTTP1
  - of: (*RateLimitLayer).keyOf
    participants:
      - id: caller
        kind: actor
      - id: (*RateLimitLayer).keyOf
        kind: self
      - id: req.Auth.Subject
        kind: value
      - id: req.Field
        kind: value
      - id: appendBE
        kind: internal
    steps:
      - switch:
          cases:
            - case: rateKeySubject
              do:
                - return: req.Auth.Subject()
                  to: req.Auth.Subject
            - case: rateKeyField
              do:
                - bind: v, _
                  eval: req.Field(l.key.field)
                  to: req.Field
                - return: v
            - case: rateKeyRoute
              do:
                - return: appendBE(&lane.key, uint64(req.Route))
                  to: appendBE
            - default: true
              do:
                - return: appendBE(&lane.key, uint64(req.Lane))
                  to: appendBE
          "on": l.key.kind
  - of: appendBE
    steps:
      - loop:
          cond: i >= 0
          do:
            - set: buf[i]
              value: byte(v)
            - op: ">>="
              set: v
              value: byteBits
          init: i := routeKeyLen - 1
          post: i--
      - return: buf[:]
  - of: (*RateLimitLayer).EndBatch
    participants:
      - id: caller
        kind: actor
      - id: (*RateLimitLayer).EndBatch
        kind: self
      - id: l.finishRateBatch
        kind: internal
    steps:
      - eval: l.finishRateBatch(lane)
        to: l.finishRateBatch
  - of: (*RateLimitLayer).finishRateBatch
    participants:
      - id: caller
        kind: actor
      - id: (*RateLimitLayer).finishRateBatch
        kind: self
      - id: l.endBatch
        kind: internal
    steps:
      - eval: l.endBatch(lane)
        to: l.endBatch
      - set: l.lanes.get(lane).fresh
        value: "false"
  - of: (*fileBody).active
    steps:
      - return: b != nil && b.flags&bodyActive != 0
  - of: (*connFlag).setFile
    steps:
      - opt:
          do:
            - set: f.file
              value: "&b"
            - return: ""
          when: f.file == nil
      - set: b.tail
        value: f.file.tail[:0]
      - set: "*f.file"
        value: b
  - of: (*connFlag).clearFile
    steps:
      - opt:
          do:
            - set: "*f.file"
              value: "fileBody{tail: f.file.tail[:0]}"
          when: f.file != nil
  - of: (*connFlag).fileLeft
    participants:
      - id: caller
        kind: actor
      - id: (*connFlag).fileLeft
        kind: self
      - id: f.clearFile
        kind: internal
    steps:
      - eval: f.clearFile()
        to: f.clearFile
      - opt:
          do:
            - set: f.file.flags
              value: bodyAfter
          when: len(f.held) > 0
  - of: (*connFlag).afterFile
    steps:
      - opt:
          do:
            - return: "false"
          when: f.file == nil || f.file.flags&bodyAfter == 0
      - op: "&^="
        set: f.file.flags
        value: bodyAfter
      - return: "true"
  - of: findCanceller
    participants:
      - id: caller
        kind: actor
      - id: findCanceller
        kind: self
      - id: l.wrapped
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: c
                init:
                  bind: c, ok
                  eval: h.(jobCanceller)
                when: ok
            - bind: l, ok
              eval: h.(interface{ wrapped() corenet.HTTP1Handler })
            - opt:
                do:
                  - return: nil
                when: "!ok"
            - set: h
              to: l.wrapped
              value: l.wrapped()
          forever: true
  - of: (*LoopHandler).cancelJob
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).cancelJob
        kind: self
      - id: a.canceller.CancelJob
        kind: internal
    steps:
      - opt:
          do:
            - eval: a.canceller.CancelJob(lane, job)
              to: a.canceller.CancelJob
          when: a.canceller != nil
  - of: closeFileReader
    participants:
      - id: caller
        kind: actor
      - id: closeFileReader
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - opt:
          do:
            - eval: swallowErr(c.Close())
              to: swallowErr
          init:
            bind: c, ok
            eval: r.(io.Closer)
          when: ok
  - of: (*LoopHandler).startFile
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).startFile
        kind: self
      - id: a.startCopy
        kind: internal
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: ""
                init:
                  bind: fd, ok
                  eval: s.file.R.(interface{ Fd() uintptr })
                when: ok && a.startNative(s, fw, int(fd.Fd()))
          init:
            bind: fw, ok
            eval: s.io.(corenet.LoopFileWriter)
          when: ok
      - eval: a.startCopy(s)
        to: a.startCopy
  - of: (*LoopHandler).startNative
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).startNative
        kind: self
      - id: fw.WriteFile
        kind: value
      - id: a.park
        kind: internal
      - id: closeFileReader
        kind: internal
      - id: swallowErr
        kind: internal
      - id: s.st.dropHeld
        kind: internal
      - id: s.f.setFile
        kind: internal
    steps:
      - bind: err
        eval: "fw.WriteFile(s.ref, s.out, corenet.LoopFileSpanValue{FD: fd, Off: s.file.Off, Len: s.file.Len})"
        to: fw.WriteFile
      - opt:
          do:
            - return: "false"
          when: errors.Is(err, corenet.LoopFileRefused)
      - opt:
          do:
            - eval: a.park(s)
              to: a.park
            - return: "true"
          when: s.parkable && errors.Is(err, corenet.LoopOutputFull)
      - eval: closeFileReader(s.file.R)
        to: closeFileReader
      - opt:
          do:
            - set: s.f.dead
              value: "true"
            - eval: swallowErr(s.io.Close(s.ref))
              to: swallowErr
            - eval: s.st.dropHeld(s.f)
              to: s.st.dropHeld
            - return: "true"
          when: err != nil
      - eval: "s.f.setFile(fileBody{flags: bodyActive | bodyNative})"
        to: s.f.setFile
      - opt:
          do:
            - eval: swallowErr(s.io.Close(s.ref))
              to: swallowErr
          when: s.closing
      - return: "true"
  - of: (*LoopHandler).startCopy
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).startCopy
        kind: self
      - id: s.io.Write
        kind: value
      - id: a.park
        kind: internal
      - id: closeFileReader
        kind: internal
      - id: swallowErr
        kind: internal
      - id: s.st.dropHeld
        kind: internal
      - id: s.f.setFile
        kind: internal
      - id: a.copyNext
        kind: internal
    steps:
      - bind: err
        eval: s.io.Write(s.ref, s.out)
        to: s.io.Write
      - opt:
          do:
            - eval: a.park(s)
              to: a.park
            - return: ""
          when: s.parkable && errors.Is(err, corenet.LoopOutputFull)
      - opt:
          do:
            - eval: closeFileReader(s.file.R)
              to: closeFileReader
            - set: s.f.dead
              value: "true"
            - eval: swallowErr(s.io.Close(s.ref))
              to: swallowErr
            - eval: s.st.dropHeld(s.f)
              to: s.st.dropHeld
            - return: ""
          when: err != nil
      - bind: flags
        eval: bodyActive
      - opt:
          do:
            - op: "|="
              set: flags
              value: bodyClosing
          when: s.closing
      - eval: "s.f.setFile(fileBody{flags: flags, r: s.file.R, off: s.file.Off, left: s.file.Len})"
        to: s.f.setFile
      - eval: a.copyNext(s.io, s.ref, s.st, s.f)
        to: a.copyNext
  - of: (*LoopHandler).copyNext
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).copyNext
        kind: self
      - id: a.endCopy
        kind: internal
      - id: st.takeSlot
        kind: internal
      - id: slotCopy
        kind: internal
      - id: st.freeSlot
        kind: internal
    steps:
      - opt:
          do:
            - eval: a.endCopy(io, ref, st, f, true)
              to: a.endCopy
            - return: ""
          when: st.outbound == nil
      - bind: idx, slot
        eval: st.takeSlot()
        to: st.takeSlot
      - set: slot.ref
        value: ref
      - set: slot.copy
        to: slotCopy
        value: slotCopy(slot, a.chunk())
      - set: slot.copy.r, slot.copy.off, slot.copy.n, slot.copy.err
        value: f.file.r, f.file.off, 0, nil
      - set: slot.copy.buf
        value: slot.copy.buf[:min(int64(cap(slot.copy.buf)), f.file.left)]
      - opt:
          do:
            - op: "|="
              set: f.file.flags
              value: bodyBusy
            - return: ""
          when: "st.outbound.Send(io, corenet.LoopJobValue{Ref: ref, Slot: idx, Gen: slot.gen}) == nil"
      - set: slot.copy
        value: nil
      - eval: st.freeSlot(idx)
        to: st.freeSlot
      - set: st.copyRetry
        value: append(st.copyRetry, ref)
  - of: slotCopy
    steps:
      - opt:
          do:
            - set: slot.buf
              value: make([]byte, 0, chunk)
          when: slot.buf == nil
      - set: slot.job.buf
        value: slot.buf[:0]
      - return: "&slot.job"
  - of: (*LoopHandler).chunk
    steps:
      - return: max(copyMinChunk, min(copyChunk, int64(a.holdCap)/2))
  - of: workCopy
    participants:
      - id: caller
        kind: actor
      - id: workCopy
        kind: self
      - id: job.r.ReadAt
        kind: value
    steps:
      - bind: job
        eval: slot.copy
      - opt:
          do:
            - return: ""
          when: len(job.buf) == 0
      - set: job.n, job.err
        to: job.r.ReadAt
        value: job.r.ReadAt(job.buf, job.off)
  - of: (*LoopHandler).copyDone
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).copyDone
        kind: self
      - id: st.peek
        kind: internal
      - id: closeFileReader
        kind: internal
      - id: st.freeSlot
        kind: internal
      - id: a.endCopy
        kind: internal
      - id: a.writeChunk
        kind: internal
    steps:
      - bind: job, ref
        eval: slot.copy, slot.ref
      - bind: f
        eval: st.peek(ref)
        to: st.peek
      - opt:
          do:
            - eval: closeFileReader(job.r)
              to: closeFileReader
            - set: slot.copy
              value: nil
            - eval: st.freeSlot(slot.idx)
              to: st.freeSlot
            - return: ""
          when: slot.cancelled.Load() || f == nil || !f.file.active()
      - op: "&^="
        set: f.file.flags
        value: bodyBusy
      - opt:
          do:
            - set: slot.copy
              value: nil
            - eval: st.freeSlot(slot.idx)
              to: st.freeSlot
            - eval: a.endCopy(io, ref, st, f, true)
              to: a.endCopy
            - return: ""
          when: job.n == 0 && f.file.left > 0
      - set: f.file.slot
        value: slot
      - eval: a.writeChunk(io, ref, st, f)
        to: a.writeChunk
  - of: (*LoopHandler).writeChunk
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).writeChunk
        kind: self
      - id: io.Write
        kind: value
      - id: swallowErr
        kind: internal
      - id: st.freeSlot
        kind: internal
      - id: a.endCopy
        kind: internal
      - id: a.copyNext
        kind: internal
    steps:
      - bind: slot
        eval: f.file.slot
      - bind: job
        eval: slot.copy
      - bind: err
        eval: io.Write(ref, job.buf[:job.n])
        to: io.Write
      - opt:
          do:
            - eval: swallowErr(io.SetDeadline(ref, copyStall))
              to: swallowErr
            - return: ""
          when: errors.Is(err, corenet.LoopOutputFull)
      - eval: swallowErr(io.SetDeadline(ref, 0))
        to: swallowErr
      - set: f.file.slot
        value: nil
      - bind: "n"
        eval: int64(job.n)
      - set: slot.copy
        value: nil
      - eval: st.freeSlot(slot.idx)
        to: st.freeSlot
      - opt:
          do:
            - eval: a.endCopy(io, ref, st, f, true)
              to: a.endCopy
            - return: ""
          when: err != nil
      - op: +=
        set: f.file.off
        value: "n"
      - op: "-="
        set: f.file.left
        value: "n"
      - opt:
          do:
            - eval: a.endCopy(io, ref, st, f, false)
              to: a.endCopy
            - return: ""
          when: f.file.left == 0
      - eval: a.copyNext(io, ref, st, f)
        to: a.copyNext
  - of: (*LoopHandler).endCopy
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).endCopy
        kind: self
      - id: closeFileReader
        kind: internal
      - id: f.fileLeft
        kind: internal
      - id: swallowErr
        kind: internal
      - id: st.dropHeld
        kind: internal
      - id: st.markReady
        kind: internal
    steps:
      - eval: closeFileReader(f.file.r)
        to: closeFileReader
      - bind: closing
        eval: f.file.flags&bodyClosing != 0
      - eval: f.fileLeft()
        to: f.fileLeft
      - opt:
          do:
            - set: f.dead
              value: "true"
            - eval: swallowErr(io.Close(ref))
              to: swallowErr
            - eval: st.dropHeld(f)
              to: st.dropHeld
            - return: ""
          when: failed || closing
      - eval: st.markReady(ref, f)
        to: st.markReady
  - of: (*LoopHandler).fileWritable
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).fileWritable
        kind: self
      - id: f.fileLeft
        kind: internal
      - id: a.flushHeld
        kind: internal
      - id: a.unpark
        kind: internal
      - id: a.writeChunk
        kind: internal
    steps:
      - opt:
          do:
            - eval: f.fileLeft()
              to: f.fileLeft
            - eval: a.flushHeld(io, ref, st, f)
              to: a.flushHeld
            - return: ""
          when: f.file.flags&bodyNative != 0
      - opt:
          do:
            - eval: a.unpark(io, ref, st, f)
              to: a.unpark
            - return: ""
          when: f.file.flags&bodyParked != 0
      - opt:
          do:
            - eval: a.writeChunk(io, ref, st, f)
              to: a.writeChunk
          when: f.file.slot != nil
  - of: (*LoopHandler).retryCopies
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).retryCopies
        kind: self
      - id: st.peek
        kind: internal
      - id: a.copyNext
        kind: internal
    steps:
      - bind: retry
        eval: st.copyRetry
      - set: st.copyRetry
        value: st.copyRetry[len(retry):]
      - loop:
          do:
            - bind: f
              eval: st.peek(ref)
              to: st.peek
            - opt:
                do:
                  - eval: a.copyNext(io, ref, st, f)
                    to: a.copyNext
                when: f != nil && f.file.active() && f.file.flags&(bodyNative|bodyBusy|bodyParked) == 0 && f.file.slot == nil
          key: _
          range: retry
          value: ref
      - opt:
          do:
            - set: st.copyRetry
              value: retry[:0]
          when: len(st.copyRetry) == 0
  - of: closedFile
    participants:
      - id: caller
        kind: actor
      - id: closedFile
        kind: self
      - id: f.clearFile
        kind: internal
      - id: closeFileReader
        kind: internal
      - id: st.freeSlot
        kind: internal
    steps:
      - opt:
          do:
            - eval: f.clearFile()
              to: f.clearFile
            - return: ""
          when: "!f.file.active() || f.file.flags&bodyNative != 0"
      - opt:
          do:
            - eval: closeFileReader(f.file.r)
              to: closeFileReader
            - opt:
                do:
                  - set: s.copy
                    value: nil
                  - eval: st.freeSlot(s.idx)
                    to: st.freeSlot
                init:
                  bind: s
                  eval: f.file.slot
                when: s != nil
          when: f.file.flags&bodyBusy == 0
      - eval: f.clearFile()
        to: f.clearFile
  - of: (*LoopHandler).park
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).park
        kind: self
      - id: s.f.setFile
        kind: internal
      - id: swallowErr
        kind: internal
    steps:
      - bind: flags
        eval: bodyActive | bodyParked
      - opt:
          do:
            - op: "|="
              set: flags
              value: bodyClosing
          when: s.closing
      - eval: "s.f.setFile(fileBody{flags: flags, r: s.file.R, off: s.file.Off, left: s.file.Len})"
        to: s.f.setFile
      - set: s.f.file.tail
        value: append(s.f.file.tail, s.out...)
      - eval: swallowErr(s.io.SetDeadline(s.ref, copyStall))
        to: swallowErr
  - of: (*LoopHandler).unpark
    participants:
      - id: caller
        kind: actor
      - id: (*LoopHandler).unpark
        kind: self
      - id: swallowErr
        kind: internal
      - id: f.clearFile
        kind: internal
      - id: a.startFile
        kind: internal
      - id: io.Write
        kind: value
      - id: f.fileLeft
        kind: internal
      - id: st.markReady
        kind: internal
      - id: st.dropHeld
        kind: internal
    steps:
      - bind: b
        eval: "*f.file"
      - bind: closing
        eval: b.flags&bodyClosing != 0
      - eval: swallowErr(io.SetDeadline(ref, 0))
        to: swallowErr
      - opt:
          do:
            - eval: f.clearFile()
              to: f.clearFile
            - bind: file
              eval: "corenet.HTTP1FileValue{R: b.r, Off: b.off, Len: b.left}"
            - eval: "a.startFile(&fileStart{io: io, ref: ref, st: st, f: f, out: b.tail, file: file, closing: closing, parkable: true})"
              to: a.startFile
            - return: ""
          when: b.r != nil
      - bind: err
        eval: io.Write(ref, b.tail)
        to: io.Write
      - opt:
          do:
            - eval: swallowErr(io.SetDeadline(ref, copyStall))
              to: swallowErr
            - return: ""
          when: errors.Is(err, corenet.LoopOutputFull)
      - eval: f.fileLeft()
        to: f.fileLeft
      - opt:
          do:
            - eval: st.markReady(ref, f)
              to: st.markReady
            - return: ""
          when: err == nil && !closing
      - set: f.dead
        value: "true"
      - eval: swallowErr(io.Close(ref))
        to: swallowErr
      - eval: st.dropHeld(f)
        to: st.dropHeld
  - of: Files
    participants:
      - id: caller
        kind: actor
      - id: Files
        kind: self
      - id: static
        kind: package
    steps:
      - opt:
          do:
            - return: nil, misconfigured("Files", "route")
          when: route <= 0
      - opt:
          do:
            - return: nil, misconfigured("Files", "fsys")
          when: fsys == nil
      - opt:
          do:
            - return: nil, err
          init:
            bind: _, err
            eval: static.NewHandler(fsys, cfg)
            to: static
          when: err != nil
      - bind: tag
        eval: filesTags.Add(1) << filesTagBits
      - return: |-
          func(next corenet.HTTP1Handler) corenet.HTTP1Handler {
          		//: its own tag, the route and the fields every answer carries.
          		return &FilesLayer{
          			link: newLink(next), route: route, fsys: fsys, tag: tag, immutable: cfg.Immutable, spa: cfg.SinglePageApp,
          			base: filesBase(cfg), allow: filesAllowField(filesBase(cfg)),
          			nextWorker: findWorker(next), nextCanceller: findCanceller(next),
          		}
          	}, nil
  - of: filesBase
    participants:
      - id: caller
        kind: actor
      - id: filesBase
        kind: self
      - id: cmp
        kind: stdlib
    steps:
      - bind: csp
        eval: cmp.Or(cfg.ContentSecurityPolicy, static.DefaultContentSecurityPolicy)
        to: cmp
      - bind: ref
        eval: cmp.Or(cfg.ReferrerPolicy, static.DefaultReferrerPolicy)
        to: cmp
      - return: "[]byte(\"Content-Security-Policy: \" + csp + \"\\r\\nX-Content-Type-Options: nosniff\\r\\nReferrer-Policy: \" + ref + \"\\r\\n\")"
  - of: filesAllowField
    steps:
      - return: "append(append(make([]byte, 0, len(base)+32), base...), \"Allow: \"+filesAllow+\"\\r\\n\"...)"
  - of: (*FilesLayer).ServeHTTP1
    participants:
      - id: caller
        kind: actor
      - id: (*FilesLayer).ServeHTTP1
        kind: self
      - id: l.next.ServeHTTP1
        kind: value
      - id: l.laneOf
        kind: internal
      - id: lane.take
        kind: internal
      - id: job.fill
        kind: internal
    steps:
      - opt:
          do:
            - eval: l.next.ServeHTTP1(req, res)
              to: l.next.ServeHTTP1
            - return: ""
          when: req.Route != l.route
      - opt:
          do:
            - set: res.Status, res.Header
              value: statusNotAllowed, l.allow
            - return: ""
          when: "!bytes.Equal(req.Method, methodGet) && !bytes.Equal(req.Method, methodHead)"
      - bind: lane
        eval: l.laneOf(req.Lane)
        to: l.laneOf
      - bind: idx, job
        eval: lane.take()
        to: lane.take
      - eval: job.fill(req)
        to: job.fill
      - set: res.Pending, res.Job
        value: true, l.tag|uint64(idx)
  - of: (*FilesLayer).EndBatch
    participants:
      - id: caller
        kind: actor
      - id: (*FilesLayer).EndBatch
        kind: self
      - id: l.endBatch
        kind: internal
    steps:
      - eval: l.endBatch(lane)
        to: l.endBatch
  - of: (*fileJob).fill
    participants:
      - id: caller
        kind: actor
      - id: (*fileJob).fill
        kind: self
      - id: appendDecoded
        kind: internal
      - id: bytes
        kind: stdlib
      - id: copyField
        kind: internal
      - id: req.Field
        kind: value
    steps:
      - bind: p
        eval: req.Path[min(req.RoutePrefix, len(req.Path)):]
      - set: j.slash
        value: len(p) > 0 && p[len(p)-1] == '/'
      - set: j.name
        to: appendDecoded
        value: appendDecoded(j.name[:0], bytes.Trim(p, "/"))
      - set: j.head
        to: bytes
        value: bytes.Equal(req.Method, methodHead)
      - set: j.rangeSpec
        to: copyField
        value: copyField(j.rangeSpec[:0], req, "range")
      - opt:
          do:
            - set: j.rangeSpec
              value: j.rangeSpec[:0]
          init:
            bind: _, ok
            eval: req.Field("if-range")
            to: req.Field
          when: ok
      - set: j.ifNoneMatch
        to: copyField
        value: copyField(j.ifNoneMatch[:0], req, "if-none-match")
      - set: j.ifModifiedSince
        to: copyField
        value: copyField(j.ifModifiedSince[:0], req, "if-modified-since")
  - of: copyField
    participants:
      - id: caller
        kind: actor
      - id: copyField
        kind: self
      - id: req.Field
        kind: value
    steps:
      - bind: v, ok
        eval: req.Field(name)
        to: req.Field
      - opt:
          do:
            - return: dst
          when: "!ok || len(v) > filesFieldCap"
      - return: append(dst, v...)
  - of: unhex
    steps:
      - switch:
          cases:
            - case: c >= 'a'
              do:
                - return: c - 'a' + 10
            - case: c >= 'A'
              do:
                - return: c - 'A' + 10
            - default: true
              do:
                - return: c - '0'
  - of: (*FilesLayer).laneOf
    participants:
      - id: caller
        kind: actor
      - id: (*FilesLayer).laneOf
        kind: self
      - id: l.lanes.Load
        kind: value
      - id: l.growLane
        kind: internal
    steps:
      - opt:
          do:
            - return: (*p)[i]
          init:
            bind: p
            eval: l.lanes.Load()
            to: l.lanes.Load
          when: p != nil && i < len(*p) && (*p)[i] != nil
      - return: l.growLane(i)
        to: l.growLane
  - of: (*FilesLayer).growLane
    participants:
      - id: caller
        kind: actor
      - id: (*FilesLayer).growLane
        kind: self
      - id: l.lanes.Load
        kind: value
      - id: lane.grow
        kind: internal
      - id: l.lanes.Store
        kind: value
    steps:
      - lock:
          mutex: l.mu
      - var:
          name: cur
          type: "[]*filesLane"
      - opt:
          do:
            - set: cur
              value: "*p"
          init:
            bind: p
            eval: l.lanes.Load()
            to: l.lanes.Load
          when: p != nil
      - opt:
          do:
            - return: cur[i]
          when: i < len(cur) && cur[i] != nil
      - bind: next
        eval: make([]*filesLane, max(len(cur), i+1))
      - eval: copy(next, cur)
      - bind: lane
        eval: "&filesLane{}"
      - eval: lane.grow()
        to: lane.grow
      - set: next[i]
        value: lane
      - eval: l.lanes.Store(&next)
        to: l.lanes.Store
      - return: lane
  - of: (*filesLane).take
    participants:
      - id: caller
        kind: actor
      - id: (*filesLane).take
        kind: self
      - id: fl.mu.Lock
        kind: value
      - id: fl.grow
        kind: internal
      - id: fl.mu.Unlock
        kind: value
    steps:
      - eval: fl.mu.Lock()
        to: fl.mu.Lock
      - opt:
          do:
            - eval: fl.grow()
              to: fl.grow
          when: len(fl.free) == 0
      - bind: idx
        eval: fl.free[len(fl.free)-1]
      - set: fl.free
        value: fl.free[:len(fl.free)-1]
      - eval: fl.mu.Unlock()
        to: fl.mu.Unlock
      - return: idx, (*fl.table.Load())[idx]
  - of: (*filesLane).put
    participants:
      - id: caller
        kind: actor
      - id: (*filesLane).put
        kind: self
      - id: fl.mu.Lock
        kind: value
      - id: fl.mu.Unlock
        kind: value
    steps:
      - eval: fl.mu.Lock()
        to: fl.mu.Lock
      - set: fl.free
        value: append(fl.free, idx)
      - eval: fl.mu.Unlock()
        to: fl.mu.Unlock
  - of: (*filesLane).grow
    participants:
      - id: caller
        kind: actor
      - id: (*filesLane).grow
        kind: self
      - id: fl.table.Load
        kind: value
      - id: fl.table.Store
        kind: value
    steps:
      - var:
          name: cur
          type: "[]*fileJob"
      - opt:
          do:
            - set: cur
              value: "*p"
          init:
            bind: p
            eval: fl.table.Load()
            to: fl.table.Load
          when: p != nil
      - bind: "n"
        eval: len(cur)
      - bind: next
        eval: make([]*fileJob, n, max(2*n, filesEntries))
      - eval: copy(next, cur)
      - loop:
          cond: i < cap(next)
          do:
            - set: next
              value: append(next, &fileJob{})
            - set: fl.free
              value: append(fl.free, uint32(i))
          init: i := n
          post: i++
      - eval: fl.table.Store(&next)
        to: fl.table.Store
  - of: (*FilesLayer).CancelJob
    participants:
      - id: caller
        kind: actor
      - id: (*FilesLayer).CancelJob
        kind: self
      - id: l.nextCanceller.CancelJob
        kind: internal
      - id: l.laneOf(lane).put
        kind: internal
    steps:
      - opt:
          do:
            - opt:
                do:
                  - eval: l.nextCanceller.CancelJob(lane, job)
                    to: l.nextCanceller.CancelJob
                when: l.nextCanceller != nil
            - return: ""
          when: job&^filesEntryMask != l.tag
      - eval: l.laneOf(lane).put(uint32(job & filesEntryMask))
        to: l.laneOf(lane).put
  - of: (*FilesLayer).WorkHTTP1
    participants:
      - id: caller
        kind: actor
      - id: (*FilesLayer).WorkHTTP1
        kind: self
      - id: l.nextWorker.WorkHTTP1
        kind: value
      - id: l.laneOf
        kind: internal
      - id: l.resolve
        kind: internal
      - id: fl.put
        kind: internal
    steps:
      - opt:
          do:
            - alt:
                - do:
                    - eval: l.nextWorker.WorkHTTP1(lane, job, res)
                      to: l.nextWorker.WorkHTTP1
                  when: l.nextWorker != nil
                - do:
                    - set: res.Status
                      value: statusInternal
                  else: true
            - return: ""
          when: job&^filesEntryMask != l.tag
      - bind: idx
        eval: uint32(job & filesEntryMask)
      - bind: fl
        eval: l.laneOf(lane)
        to: l.laneOf
      - bind: j
        eval: (*fl.table.Load())[idx]
      - eval: l.resolve(j, res)
        to: l.resolve
      - eval: fl.put(idx)
        to: fl.put
  - of: (*FilesLayer).resolve
    participants:
      - id: caller
        kind: actor
      - id: (*FilesLayer).resolve
        kind: self
      - id: cleanName
        kind: internal
      - id: l.openName
        kind: internal
      - id: l.resolveFound
        kind: internal
      - id: l.resolveAbsent
        kind: internal
    steps:
      - bind: name
        eval: cleanName(string(j.name))
        to: cleanName
      - set: res.Header
        value: append(res.Header[:0], l.base...)
      - bind: h
        eval: l.openName(name)
        to: l.openName
      - alt:
          - do:
              - eval: l.resolveFound(j, res, name, h)
                to: l.resolveFound
            when: h.found
          - do:
              - eval: l.resolveAbsent(j, res, name, h)
                to: l.resolveAbsent
            else: true
  - of: (*FilesLayer).resolveFound
    participants:
      - id: caller
        kind: actor
      - id: (*FilesLayer).resolveFound
        kind: self
      - id: closeTreeFile
        kind: internal
      - id: l.resolveDir
        kind: internal
      - id: l.fileAnswer
        kind: internal
    steps:
      - switch:
          cases:
            - case: h.info.IsDir()
              do:
                - eval: closeTreeFile(h.file)
                  to: closeTreeFile
                - eval: l.resolveDir(j, res, name)
                  to: l.resolveDir
            - case: h.info.Mode().IsRegular() && !j.slash
              do:
                - eval: l.fileAnswer(j, res, name, h)
                  to: l.fileAnswer
            - default: true
              do:
                - eval: closeTreeFile(h.file)
                  to: closeTreeFile
                - set: res.Status
                  value: statusNotFound
  - of: (*FilesLayer).resolveAbsent
    participants:
      - id: caller
        kind: actor
      - id: (*FilesLayer).resolveAbsent
        kind: self
      - id: l.resolveShell
        kind: internal
    steps:
      - switch:
          cases:
            - case: h.err == fs.ErrNotExist && l.spaRoute(name)
              do:
                - eval: l.resolveShell(j, res)
                  to: l.resolveShell
            - case: h.err == fs.ErrNotExist
              do:
                - set: res.Status
                  value: statusNotFound
            - default: true
              do:
                - set: res.Status
                  value: statusInternal
  - of: (*FilesLayer).spaRoute
    steps:
      - return: l.spa && path.Ext(name) == ""
  - of: (*FilesLayer).openName
    participants:
      - id: caller
        kind: actor
      - id: (*FilesLayer).openName
        kind: self
      - id: checkLinks
        kind: internal
      - id: l.fsys.Open
        kind: value
      - id: f.Stat
        kind: value
      - id: closeTreeFile
        kind: internal
      - id: lfs.Lstat
        kind: value
    steps:
      - bind: lfs, canLink
        eval: l.fsys.(fs.ReadLinkFS)
      - opt:
          do:
            - opt:
                do:
                  - return: "treeFile{err: err}"
                init:
                  bind: err
                  eval: checkLinks(lfs, name)
                  to: checkLinks
                when: err != nil
          when: canLink && name != "."
      - bind: f, err
        eval: l.fsys.Open(name)
        to: l.fsys.Open
      - opt:
          do:
            - return: "treeFile{err: filesLookupErr(err)}"
          when: err != nil
      - bind: info, err
        eval: f.Stat()
        to: f.Stat
      - opt:
          do:
            - eval: closeTreeFile(f)
              to: closeTreeFile
            - return: "treeFile{err: err}"
          when: err != nil
      - opt:
          do:
            - opt:
                do:
                  - eval: closeTreeFile(f)
                    to: closeTreeFile
                  - return: "treeFile{err: fs.ErrNotExist}"
                init:
                  bind: linfo, lerr
                  eval: lfs.Lstat(name)
                  to: lfs.Lstat
                when: lerr != nil || !sameFile(linfo, info)
          when: canLink
      - return: "treeFile{file: f, info: info, found: true}"
  - of: checkLinks
    participants:
      - id: caller
        kind: actor
      - id: checkLinks
        kind: self
      - id: strings
        kind: stdlib
      - id: lfs.Lstat
        kind: value
      - id: filesLookupErr
        kind: internal
    steps:
      - loop:
          do:
            - bind: next
              eval: strings.IndexByte(name[i:], '/')
              to: strings
            - bind: end
              eval: len(name)
            - opt:
                do:
                  - set: end
                    value: i + next
                when: next >= 0
            - bind: info, err
              eval: lfs.Lstat(name[:end])
              to: lfs.Lstat
            - opt:
                do:
                  - return: filesLookupErr(err)
                    to: filesLookupErr
                when: err != nil
            - opt:
                do:
                  - return: fs.ErrNotExist
                when: info.Mode()&fs.ModeSymlink != 0 || (!info.IsDir() && !info.Mode().IsRegular())
            - opt:
                do:
                  - return: nil
                when: next < 0
            - op: +=
              set: i
              value: next + 1
          init: i := 0
  - of: sameFile
    steps:
      - return: a.Size() == b.Size() && a.ModTime().Equal(b.ModTime()) && a.Mode().Type() == b.Mode().Type()
  - of: filesLookupErr
    steps:
      - opt:
          do:
            - return: fs.ErrNotExist
          when: errors.Is(err, fs.ErrNotExist) || errors.Is(err, fs.ErrInvalid)
      - return: err
  - of: (*FilesLayer).resolveDir
    participants:
      - id: caller
        kind: actor
      - id: (*FilesLayer).resolveDir
        kind: self
      - id: l.openName
        kind: internal
      - id: closeTreeFile
        kind: internal
      - id: redirectSlash
        kind: internal
      - id: l.fileAnswer
        kind: internal
    steps:
      - bind: index
        eval: filesIndex
      - opt:
          do:
            - set: index
              value: name + "/" + filesIndex
          when: name != "."
      - bind: h
        eval: l.openName(index)
        to: l.openName
      - switch:
          cases:
            - case: h.found && h.info.Mode().IsRegular()
              do:
                - opt:
                    do:
                      - eval: closeTreeFile(h.file)
                        to: closeTreeFile
                      - eval: redirectSlash(res, name)
                        to: redirectSlash
                      - return: ""
                    when: "!j.slash && name != \".\""
                - eval: l.fileAnswer(j, res, index, h)
                  to: l.fileAnswer
            - case: h.found
              do:
                - eval: closeTreeFile(h.file)
                  to: closeTreeFile
                - set: res.Status
                  value: statusNotFound
            - case: h.err == fs.ErrNotExist
              do:
                - set: res.Status
                  value: statusNotFound
            - default: true
              do:
                - set: res.Status
                  value: statusInternal
  - of: (*FilesLayer).resolveShell
    participants:
      - id: caller
        kind: actor
      - id: (*FilesLayer).resolveShell
        kind: self
      - id: l.openName
        kind: internal
      - id: l.fileAnswer
        kind: internal
      - id: closeTreeFile
        kind: internal
    steps:
      - bind: h
        eval: l.openName(filesIndex)
        to: l.openName
      - switch:
          cases:
            - case: h.found && h.info.Mode().IsRegular()
              do:
                - eval: l.fileAnswer(j, res, filesIndex, h)
                  to: l.fileAnswer
            - case: h.found
              do:
                - eval: closeTreeFile(h.file)
                  to: closeTreeFile
                - set: res.Status
                  value: statusNotFound
            - case: h.err == fs.ErrNotExist
              do:
                - set: res.Status
                  value: statusNotFound
            - default: true
              do:
                - set: res.Status
                  value: statusInternal
  - of: redirectSlash
    participants:
      - id: caller
        kind: actor
      - id: redirectSlash
        kind: self
      - id: appendEscaped
        kind: internal
    steps:
      - set: res.Status
        value: statusMoved
      - set: res.Header
        value: "append(res.Header, \"Location: ./\"...)"
      - set: res.Header
        to: appendEscaped
        value: appendEscaped(res.Header, path.Base(name))
      - set: res.Header
        value: append(res.Header, "/\r\n"...)
  - of: unreservedByte
    steps:
      - bind: lower
        eval: c | 0x20
      - return: (lower >= 'a' && lower <= 'z') || (c >= '0' && c <= '9') || strings.IndexByte(unreservedSet, c) >= 0
  - of: (*FilesLayer).fileAnswer
    participants:
      - id: caller
        kind: actor
      - id: (*FilesLayer).fileAnswer
        kind: self
      - id: appendETag
        kind: internal
      - id: closeTreeFile
        kind: internal
      - id: l.appendCommon
        kind: internal
      - id: readerOf
        kind: internal
      - id: h.info.Size
        kind: value
      - id: parseRange
        kind: internal
      - id: strconv
        kind: stdlib
      - id: appendContentRange
        kind: internal
    steps:
      - bind: etag
        eval: appendETag(make([]byte, 0, 32), h.info)
        to: appendETag
      - opt:
          do:
            - eval: closeTreeFile(h.file)
              to: closeTreeFile
            - set: res.Status
              value: statusNotModified
            - set: res.Header
              to: l.appendCommon
              value: l.appendCommon(res.Header, name, h.info, etag)
            - return: ""
          when: j.notModified(etag, h.info)
      - bind: ra, ranged
        eval: readerOf(h.file)
        to: readerOf
      - bind: size
        eval: h.info.Size()
        to: h.info.Size
      - bind: off, n, status
        eval: int64(0), size, statusOK
      - opt:
          do:
            - set: off, n, status
              to: parseRange
              value: parseRange(j.rangeSpec, size)
          when: len(j.rangeSpec) > 0 && !j.head && ranged
      - opt:
          do:
            - eval: closeTreeFile(h.file)
              to: closeTreeFile
            - set: res.Status
              value: statusRangeBad
            - set: res.Header
              to: l.appendCommon
              value: l.appendCommon(res.Header, name, h.info, etag)
            - set: res.Header
              value: "append(res.Header, \"Content-Range: bytes */\"...)"
            - set: res.Header
              to: strconv
              value: strconv.AppendInt(res.Header, size, 10)
            - set: res.Header
              value: append(res.Header, "\r\n"...)
            - return: ""
          when: status == statusRangeBad
      - set: res.Status
        value: status
      - set: res.Header
        to: l.appendCommon
        value: l.appendCommon(res.Header, name, h.info, etag)
      - opt:
          do:
            - set: res.Header
              to: appendContentRange
              value: appendContentRange(res.Header, off, n, size)
          when: status == statusPartial
      - opt:
          do:
            - eval: closeTreeFile(h.file)
              to: closeTreeFile
            - return: ""
          when: n == 0
      - set: res.File
        value: "corenet.HTTP1FileValue{R: ra, Off: off, Len: n}"
  - of: readerOf
    steps:
      - opt:
          do:
            - return: ra, true
          init:
            bind: ra, ok
            eval: f.(io.ReaderAt)
          when: ok
      - return: "&sequentialFile{f: f}, false"
  - of: (*sequentialFile).ReadAt
    participants:
      - id: caller
        kind: actor
      - id: (*sequentialFile).ReadAt
        kind: self
      - id: s.f.Read
        kind: value
    steps:
      - return: s.f.Read(p)
        to: s.f.Read
  - of: (*sequentialFile).Close
    participants:
      - id: caller
        kind: actor
      - id: (*sequentialFile).Close
        kind: self
      - id: s.f.Close
        kind: value
    steps:
      - return: s.f.Close()
        to: s.f.Close
  - of: (*FilesLayer).appendCommon
    participants:
      - id: caller
        kind: actor
      - id: (*FilesLayer).appendCommon
        kind: self
      - id: info.ModTime().UTC().AppendFormat
        kind: value
    steps:
      - set: dst
        value: "append(dst, \"Cache-Control: \"...)"
      - alt:
          - do:
              - set: dst
                value: append(dst, static.ImmutableCacheControl...)
            when: l.immutable != nil && l.immutable(name)
          - do:
              - set: dst
                value: append(dst, static.RevalidateCacheControl...)
            else: true
      - set: dst
        value: "append(dst, \"\\r\\nContent-Type: \"...)"
      - set: dst
        value: append(dst, contentTypeOf(name)...)
      - set: dst
        value: "append(dst, \"\\r\\nLast-Modified: \"...)"
      - set: dst
        to: info.ModTime().UTC().AppendFormat
        value: info.ModTime().UTC().AppendFormat(dst, httpDate)
      - set: dst
        value: "append(dst, \"\\r\\nETag: \"...)"
      - set: dst
        value: append(dst, etag...)
      - set: dst
        value: "append(dst, \"\\r\\nAccept-Ranges: bytes\\r\\n\"...)"
      - return: dst
  - of: contentTypeOf
    participants:
      - id: caller
        kind: actor
      - id: contentTypeOf
        kind: self
      - id: path
        kind: stdlib
      - id: pinnedType
        kind: internal
      - id: mime
        kind: stdlib
    steps:
      - bind: ext
        eval: path.Ext(name)
        to: path
      - opt:
          do:
            - return: t
          init:
            bind: t, ok
            eval: pinnedType(ext)
            to: pinnedType
          when: ok
      - opt:
          do:
            - return: t
          init:
            bind: t
            eval: mime.TypeByExtension(ext)
            to: mime
          when: t != ""
      - return: filesOctet
  - of: pinnedType
    steps:
      - switch:
          cases:
            - case: "\".html\", \".htm\""
              do:
                - return: "\"text/html; charset=utf-8\", true"
            - case: "\".js\", \".mjs\""
              do:
                - return: "\"text/javascript; charset=utf-8\", true"
            - case: "\".css\""
              do:
                - return: "\"text/css; charset=utf-8\", true"
            - case: "\".json\", \".map\""
              do:
                - return: "\"application/json\", true"
            - case: "\".wasm\""
              do:
                - return: "\"application/wasm\", true"
            - case: "\".svg\""
              do:
                - return: "\"image/svg+xml\", true"
            - case: "\".webmanifest\""
              do:
                - return: "\"application/manifest+json\", true"
            - default: true
              do:
                - return: "\"\", false"
          "on": strings.ToLower(extension)
  - of: appendETag
    participants:
      - id: caller
        kind: actor
      - id: appendETag
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - set: dst
        value: append(dst, `W/"`...)
      - set: dst
        to: strconv
        value: strconv.AppendInt(dst, info.Size(), 16)
      - set: dst
        value: append(dst, '-')
      - set: dst
        to: strconv
        value: strconv.AppendInt(dst, info.ModTime().UnixNano(), 16)
      - set: dst
        value: append(dst, '"')
      - return: dst
  - of: (*fileJob).notModified
    participants:
      - id: caller
        kind: actor
      - id: (*fileJob).notModified
        kind: self
      - id: time
        kind: stdlib
      - id: info.ModTime().Truncate(time.Second).After
        kind: value
    steps:
      - opt:
          do:
            - return: bytes.Equal(j.ifNoneMatch, wildcardMatch) || etagListed(j.ifNoneMatch, etag)
          when: len(j.ifNoneMatch) > 0
      - opt:
          do:
            - return: "false"
          when: len(j.ifModifiedSince) == 0
      - bind: t, err
        eval: time.Parse(httpDate, string(j.ifModifiedSince))
        to: time
      - opt:
          do:
            - return: "false"
          when: err != nil
      - return: "!info.ModTime().Truncate(time.Second).After(t)"
        to: info.ModTime().Truncate(time.Second).After
  - of: etagListed
    participants:
      - id: caller
        kind: actor
      - id: etagListed
        kind: self
      - id: bytes
        kind: stdlib
    steps:
      - set: etag
        to: bytes
        value: bytes.TrimPrefix(etag, []byte(`W/`))
