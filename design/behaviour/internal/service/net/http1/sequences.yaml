        kind: value
    steps:
      - set: valueStart
        value: start
      - loop:
          cond: valueStart < len(head) && (head[valueStart] == ' ' || head[valueStart] == '\t')
          do:
            - op: ++
              set: valueStart
      - bind: stop
        eval: valueStart
      - loop:
          do:
            - bind: "n"
              eval: valueStop.Index(head[stop:])
              to: valueStop.Index
            - opt:
                do:
                  - return: 0, 0, RefusalNone
                when: n < 0
            - op: +=
              set: stop
              value: "n"
            - opt:
                do:
                  - break: true
                when: head[stop] != '\t'
            - op: ++
              set: stop
          forever: true
      - opt:
          do:
            - return: 0, 0, RefusalNone
          when: head[stop] == '\r' && stop+1 == len(head)
      - return: valueStart, stop, valueStopAt(head, stop)
  - of: valueStopAt
    participants:
      - id: caller
        kind: actor
      - id: valueStopAt
        kind: self
      - id: crValue
        kind: internal
    steps:
      - switch:
          cases:
            - case: "'\\r'"
              do:
                - return: crValue(head, pos)
                  to: crValue
            - case: "'\\n'"
              do:
                - return: RefusalBareLF
            - case: "0"
              do:
                - return: RefusalNUL
            - default: true
              do:
                - return: RefusalControl
          "on": head[pos]
  - of: crValue
    steps:
      - opt:
          do:
            - return: RefusalBareCR
          when: head[pos+1] != '\n'
      - return: RefusalNone
  - of: trimRight
    steps:
      - bind: end
        eval: len(v)
      - loop:
          cond: end > 0 && (v[end-1] == ' ' || v[end-1] == '\t')
          do:
            - op: "--"
              set: end
      - return: v[:end]
  - of: nameEnd
    participants:
      - id: caller
        kind: actor
      - id: nameEnd
        kind: self
      - id: crName
        kind: internal
    steps:
      - bind: c
        eval: head[pos]
      - switch:
          cases:
            - case: c == '\r'
              do:
                - return: crName(head, pos)
                  to: crName
            - case: (c == ' ' || c == '\t') && n > 0
              do:
                - return: RefusalSpaceBeforeColon
            - case: c == '\n'
              do:
                - return: RefusalBareLF
            - case: c == 0
              do:
                - return: RefusalNUL
            - default: true
              do:
                - return: RefusalName
  - of: crName
    steps:
      - opt:
          do:
            - return: RefusalNone
          when: pos+1 == len(head)
      - opt:
          do:
            - return: RefusalName
          when: head[pos+1] == '\n'
      - return: RefusalBareCR
  - of: known
    participants:
      - id: caller
        kind: actor
      - id: known
        kind: self
      - id: host
        kind: internal
      - id: authorization
        kind: internal
      - id: contentLength
        kind: internal
    steps:
      - switch:
          cases:
            - case: kindOther
              do:
                - return: RefusalNone
            - case: kindHost
              do:
                - return: host(value, req)
                  to: host
            - case: kindAuthorization
              do:
                - return: authorization(value, req)
                  to: authorization
            - case: kindContentLength
              do:
                - return: contentLength(value, body, req)
                  to: contentLength
            - case: kindConnection
              do:
                - set: req.Close
                  value: req.Close || hasClose(value)
                - return: RefusalNone
            - case: kindExpect
              do:
                - return: RefusalExpect
            - default: true
              do:
                - return: RefusalTransferEncoding
          "on": kindOf(name)
  - of: kindOf
    steps:
      - opt:
          do:
            - return: kindOther
          when: len(name) >= knownMaxLen || knownNames[len(name)] == "" || !foldIs(name, knownNames[len(name)])
      - return: knownKinds[len(name)]
  - of: host
    steps:
      - opt:
          do:
            - return: RefusalHostDuplicated
          when: req.HasHost
      - set: req.HasHost, req.Host
        value: true, value
      - return: RefusalNone
  - of: authorization
    steps:
      - opt:
          do:
            - return: RefusalAuthorizationDuplicated
          when: req.HasAuthorization
      - set: req.HasAuthorization, req.Authorization
        value: true, value
      - return: RefusalNone
  - of: hasClose
    participants:
      - id: caller
        kind: actor
      - id: hasClose
        kind: self
      - id: nextToken
        kind: internal
    steps:
      - opt:
          do:
            - return: "false"
          when: foldIs(v, "keep-alive")
      - loop:
          cond: pos < len(v)
          do:
            - var:
                name: tok
                type: "[]byte"
            - set: tok, pos
              to: nextToken
              value: nextToken(v, pos)
            - opt:
                do:
                  - return: "true"
                when: foldIs(tok, "close")
          init: pos := 0
      - return: "false"
  - of: nextToken
    steps:
      - bind: start
        eval: pos
      - loop:
          cond: start < len(v) && isListSep(v[start])
          do:
            - op: ++
              set: start
      - bind: end
        eval: start
      - loop:
          cond: end < len(v) && !isListSep(v[end])
          do:
            - op: ++
              set: end
      - return: v[start:end], end
  - of: isListSep
    steps:
      - return: c == ',' || c == ' ' || c == '\t'
  - of: Refusal.String
    steps:
      - opt:
          do:
            - return: "\"unknown\""
          when: int(r) >= refusalCount
      - return: refusalNames[r]
  - of: Refusal.Status
    steps:
      - opt:
          do:
            - return: "0"
          when: int(r) >= refusalCount
      - return: refusalStatus[r]
  - of: Refusal.Err
    steps:
      - opt:
          do:
            - return: nil
          when: int(r) >= refusalCount
      - return: refusalErrs[r]
  - of: refusalAnswerTable
    steps:
      - var:
          name: t
          type: "[refusalCount]string"
      - loop:
          do:
            - bind: status
              eval: max(refusalStatus[r], statusBadRequest)
            - set: t[r]
              value: "statusLines[status] + \"Content-Length: 0\\r\\nConnection: close\\r\\n\\r\\n\""
          key: r
          range: refusalCount
      - return: t
  - of: AppendStatusLine
    participants:
      - id: caller
        kind: actor
      - id: AppendStatusLine
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - opt:
          do:
            - return: dst, corenet.HTTP1ResponseInvalid
          when: status < statusMin || status > statusMax
      - opt:
          do:
            - return: append(dst, statusLines[status]...), nil
          when: status < statusRegistered && statusLines[status] != ""
      - set: dst
        value: append(dst, "HTTP/1.1 "...)
      - set: dst
        to: strconv
        value: strconv.AppendInt(dst, int64(status), decimal)
      - return: append(dst, " \r\n"...), nil
  - of: AppendField
    steps:
      - opt:
          do:
            - return: dst, corenet.HTTP1ResponseInvalid
          when: "!token(name) || owned(name) || !fieldText(value)"
      - set: dst
        value: append(dst, name...)
      - set: dst
        value: "append(dst, \": \"...)"
      - set: dst
        value: append(dst, value...)
      - return: append(dst, "\r\n"...), nil
  - of: owned
    steps:
      - return: foldIs(name, "content-length") || foldIs(name, "connection") || foldIs(name, "transfer-encoding")
  - of: AppendResponse
    participants:
      - id: caller
        kind: actor
      - id: AppendResponse
        kind: self
      - id: orDefault
        kind: internal
      - id: AppendStatusLine
        kind: internal
      - id: appendFraming
        kind: internal
    steps:
      - bind: status
        eval: orDefault(res.Status, statusOK)
        to: orDefault
      - bind: bodiless
        eval: status == statusNoContent || status == statusNotModified
      - opt:
          do:
            - return: dst, corenet.HTTP1ResponseInvalid
          when: bodiless && len(res.Body) > 0
      - bind: out, err
        eval: AppendStatusLine(dst, status)
        to: AppendStatusLine
      - opt:
          do:
            - return: dst, err
          when: err != nil
      - set: out
        value: append(out, res.Header...)
      - set: out
        to: appendFraming
        value: appendFraming(out, len(res.Body), bodiless, closing || res.Close || req.Close)
      - opt:
          do:
            - return: out, nil
          when: bytes.Equal(req.Method, methodHead)
      - return: append(out, res.Body...), nil
  - of: appendFraming
    participants:
      - id: caller
        kind: actor
      - id: appendFraming
        kind: self
      - id: strconv
        kind: stdlib
    steps:
      - opt:
          do:
            - set: dst
              value: "append(dst, \"Content-Length: \"...)"
            - set: dst
              to: strconv
              value: strconv.AppendInt(dst, int64(n), decimal)
            - set: dst
              value: append(dst, "\r\n"...)
          when: "!bodiless"
      - opt:
          do:
            - set: dst
              value: "append(dst, \"Connection: close\\r\\n\"...)"
          when: closing
      - return: append(dst, "\r\n"...)
  - of: AppendRefusal
    steps:
      - opt:
          do:
            - return: append(dst, refusalAnswers[RefusalNone]...)
          when: int(r) >= refusalCount
      - return: append(dst, refusalAnswers[r]...)
