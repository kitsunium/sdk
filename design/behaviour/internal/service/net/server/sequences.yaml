            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: s.bindGroup(ctx, group)
                  to: s.bindGroup
                when: err != nil
          key: _
          range: groups
          value: group
      - return: nil
  - of: (*Server).bindGroup
    participants:
      - id: caller
        kind: actor
      - id: (*Server).bindGroup
        kind: self
      - id: s.bindLoopGroup
        kind: internal
      - id: group.resolved
        kind: internal
      - id: newConnLimiter
        kind: internal
      - id: s.adoptStreamSockets
        kind: internal
      - id: s.bindShards
        kind: internal
    steps:
      - opt:
          do:
            - return: s.bindLoopGroup(ctx, group)
              to: s.bindLoopGroup
          when: group.loopHandler != nil
      - bind: handler
        eval: group.resolved()
        to: group.resolved
      - set: group.limiter
        to: newConnLimiter
        value: newConnLimiter(group.limits)
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: s.adoptStreamSockets(group, handler)
            to: s.adoptStreamSockets
          when: err != nil
      - loop:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: s.bindShards(ctx, group, addr, handler)
                  to: s.bindShards
                when: err != nil
          key: _
          range: group.addrs
          value: addr
      - return: nil
  - of: (*Server).adoptStreamSockets
    participants:
      - id: caller
        kind: actor
      - id: (*Server).adoptStreamSockets
        kind: self
      - id: s.adoptStream
        kind: internal
      - id: layered
        kind: internal
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
      - id: s.inFlight.Add
        kind: value
      - id: s.acceptLoop
        kind: internal
    steps:
      - loop:
          do:
            - bind: listeners, err
              eval: s.adoptStream(name)
              to: s.adoptStream
            - opt:
                do:
                  - return: err
                when: err != nil
            - loop:
                do:
                  - bind: ln
                    eval: layered(raw, group.identity, group.tracksCloses())
                    to: layered
                  - bind: addr
                    eval: "corenet.AddressValue{Network: ln.Addr().Network(), Addr: ln.Addr().String()}"
                  - bind: bound
                    eval: "&boundListener{group: group.name, addr: addr, ln: ln}"
                  - eval: s.mu.Lock()
                    to: s.mu.Lock
                  - set: s.listeners
                    value: append(s.listeners, bound)
                  - set: s.states
                    value: |-
                      append(s.states, corenet.ListenerStateValue{
                      				Group:   group.name,
                      				Address: ln.Addr().String(),
                      				Network: addr.Network,
                      				Shards:  1,
                      				Adopted: true,
                      			})
                  - eval: s.mu.Unlock()
                    to: s.mu.Unlock
                  - eval: s.inFlight.Add(1)
                    to: s.inFlight.Add
                  - go: s.acceptLoop(bound, group, handler)
                    to: s.acceptLoop
                key: _
                range: listeners
                value: raw
          key: _
          range: group.adopt
          value: name
      - return: nil
  - of: (*Server).bindShards
    participants:
      - id: caller
        kind: actor
      - id: (*Server).bindShards
        kind: self
      - id: resolveShards
        kind: internal
      - id: listen
        kind: internal
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
      - id: s.inFlight.Add
        kind: value
      - id: s.acceptLoop
        kind: internal
    steps:
      - bind: count, degraded, reason
        eval: resolveShards(group.limits.Shards, addr.Network)
        to: resolveShards
      - bind: opened
        eval: "0"
      - loop:
          do:
            - bind: ln, err
              eval: listen(ctx, addr, group.identity, count > 1, group.tracksCloses())
              to: listen
            - opt:
                do:
                  - return: err
                when: err != nil
            - bind: bound
              eval: "&boundListener{group: group.name, addr: addr, ln: ln}"
            - eval: s.mu.Lock()
              to: s.mu.Lock
            - set: s.listeners
              value: append(s.listeners, bound)
            - opt:
                do:
                  - set: s.states
                    value: |-
                      append(s.states, corenet.ListenerStateValue{
                      				Group:          group.name,
                      				Address:        ln.Addr().String(),
                      				Network:        addr.Network,
                      				Shards:         count,
                      				Degraded:       degraded,
                      				DegradedReason: reason,
                      			})
                when: opened == 0
            - eval: s.mu.Unlock()
              to: s.mu.Unlock
            - op: ++
              set: opened
            - eval: s.inFlight.Add(1)
              to: s.inFlight.Add
            - go: s.acceptLoop(bound, group, handler)
              to: s.acceptLoop
          range: count
      - return: nil
  - of: acceptDelay
    participants:
      - id: caller
        kind: actor
      - id: acceptDelay
        kind: self
      - id: "kbackoff.Value{BaseDelay: 5 * time.Millisecond, MaxDelay: time.Second, Multiplier: 2}.Delay"
        kind: value
    steps:
      - return: "kbackoff.Value{BaseDelay: 5 * time.Millisecond, MaxDelay: time.Second, Multiplier: 2}.Delay(failures)"
        to: "kbackoff.Value{BaseDelay: 5 * time.Millisecond, MaxDelay: time.Second, Multiplier: 2}.Delay"
  - of: (*Server).acceptLoop
    participants:
      - id: caller
        kind: actor
      - id: (*Server).acceptLoop
        kind: self
      - id: s.inFlight.Done
        kind: value
      - id: bound.ln.Accept
        kind: value
      - id: s.acceptBackoffs.Add
        kind: value
      - id: group.admission.Admit
        kind: internal
      - id: swallowErr
        kind: internal
      - id: s.total.Add
        kind: value
      - id: s.active.Add
        kind: value
      - id: s.inFlight.Add
        kind: value
      - id: s.serve
        kind: internal
    steps:
      - defer: s.inFlight.Done()
        to: s.inFlight.Done
      - bind: failures
        eval: "0"
      - loop:
          do:
            - bind: raw, err
              eval: bound.ln.Accept()
              to: bound.ln.Accept
            - opt:
                do:
                  - opt:
                      do:
                        - return: ""
                      when: errors.Is(err, stdnet.ErrClosed)
                  - op: ++
                    set: failures
                  - eval: s.acceptBackoffs.Add(1)
                    to: s.acceptBackoffs.Add
                  - opt:
                      do:
                        - return: ""
                      when: "!s.backOff(bound, acceptDelay(failures))"
                  - continue: true
                when: err != nil
            - set: failures
              value: "0"
            - var:
                name: release
                type: func()
            - opt:
                do:
                  - bind: ok
                    eval: "false"
                  - opt:
                      do:
                        - eval: swallowErr(raw.Close())
                          to: swallowErr
                        - continue: true
                      init:
                        bind: release, ok
                        eval: group.admission.Admit(raw.RemoteAddr())
                        op: =
                        to: group.admission.Admit
                      when: "!ok"
                when: group.admission != nil
            - eval: s.total.Add(1)
              to: s.total.Add
            - eval: s.active.Add(1)
              to: s.active.Add
            - eval: s.inFlight.Add(1)
              to: s.inFlight.Add
            - go: s.serve(raw, group, handler, release)
              to: s.serve
          forever: true
  - of: (*Server).backOff
    participants:
      - id: caller
        kind: actor
      - id: (*Server).backOff
        kind: self
      - id: s.clk.NewTimer
        kind: value
      - id: timer.Stop
        kind: value
    steps:
      - bind: timer
        eval: s.clk.NewTimer(delay)
        to: s.clk.NewTimer
      - defer: timer.Stop()
        to: timer.Stop
      - select:
          cases:
            - comm: <-timer.C()
              do:
                - return: "true"
            - comm: <-bound.closedSignal()
              do:
                - return: "false"
  - of: (*Server).serve
    participants:
      - id: caller
        kind: actor
      - id: (*Server).serve
        kind: self
      - id: s.inFlight.Done
        kind: value
      - id: context
        kind: stdlib
      - id: s.active.Add
        kind: value
      - id: s.acquire
        kind: internal
      - id: s.release
        kind: internal
      - id: recoverHandler
        kind: internal
      - id: swallowErr
        kind: internal
    steps:
      - defer: s.inFlight.Done()
        to: s.inFlight.Done
      - bind: ctx
        eval: s.runCtx
      - opt:
          do:
            - defer: release()
            - set: ctx
              to: context
              value: context.WithValue(ctx, admissionReleaseKey{}, release)
          when: release != nil
      - defer: s.active.Add(-1)
        to: s.active.Add
      - bind: c
        eval: s.acquire(raw, group)
        to: s.acquire
      - defer: s.release(c)
        to: s.release
      - defer: recoverHandler()
        to: recoverHandler
      - eval: swallowErr(s.admit(ctx, group.limiter, c, handler))
        to: swallowErr
  - of: recoverHandler
    steps:
      - eval: recover()
  - of: (*Server).Serve
    participants:
      - id: caller
        kind: actor
      - id: (*Server).Serve
        kind: self
      - id: s.Start
        kind: internal
      - id: context
        kind: stdlib
      - id: s.Shutdown
        kind: internal
      - id: s.stalledGroup
        kind: internal
      - id: errs
        kind: package
      - id: stallError
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: s.Start(ctx)
            to: s.Start
          when: err != nil
      - var:
          name: stalled
          type: bool
      - select:
          cases:
            - comm: <-ctx.Done()
            - comm: <-s.stall.stalled
              do:
                - set: stalled
                  value: "true"
      - bind: drainCtx, cancel
        eval: context.WithTimeout(context.WithoutCancel(ctx), s.drainTimeout)
        to: context
      - defer: cancel()
      - bind: err
        eval: s.Shutdown(drainCtx)
        to: s.Shutdown
      - opt:
          do:
            - return: err
          when: "!stalled"
      - bind: group, _
        eval: s.stalledGroup()
        to: s.stalledGroup
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.LoopGroupStalled, errs.WrapParams{},
                			errs.String("group", group), errs.String("drain", err.Error()))
              to: errs
          when: err != nil
      - return: stallError(group)
        to: stallError
  - of: (*Server).Shutdown
    participants:
      - id: caller
        kind: actor
      - id: (*Server).Shutdown
        kind: self
      - id: s.phase.Store
        kind: value
      - id: s.stopStallWatch
        kind: internal
      - id: s.closeListeners
        kind: internal
      - id: s.shutdownLoops
        kind: internal
      - id: s.shutdownHTTP
        kind: internal
      - id: s.waitIdle
        kind: internal
      - id: s.closeLive
        kind: internal
      - id: s.inFlight.Wait
        kind: value
    steps:
      - opt:
          do:
            - return: nil
          when: corenet.Phase(s.phase.Load()) == corenet.PhaseNew
      - eval: s.phase.Store(uint32(corenet.PhaseDraining))
        to: s.phase.Store
      - eval: s.stopStallWatch()
        to: s.stopStallWatch
      - eval: s.closeListeners()
        to: s.closeListeners
      - bind: loopErr
        eval: s.shutdownLoops(ctx)
        to: s.shutdownLoops
      - eval: s.shutdownHTTP(ctx)
        to: s.shutdownHTTP
      - bind: err
        eval: s.waitIdle(ctx)
        to: s.waitIdle
      - opt:
          do:
            - eval: s.stop()
          when: s.stop != nil
      - opt:
          do:
            - eval: s.closeLive()
              to: s.closeLive
            - eval: s.phase.Store(uint32(corenet.PhaseStopped))
              to: s.phase.Store
            - return: err
          when: err != nil
      - eval: s.inFlight.Wait()
        to: s.inFlight.Wait
      - eval: s.phase.Store(uint32(corenet.PhaseStopped))
        to: s.phase.Store
      - return: loopErr
  - of: (*Server).shutdownHTTP
    participants:
      - id: caller
        kind: actor
      - id: (*Server).shutdownHTTP
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: slices
        kind: stdlib
      - id: s.mu.RUnlock
        kind: value
      - id: group.httpAdapter.shutdown
        kind: internal
    steps:
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: groups
        eval: slices.Clone(s.groups)
        to: slices
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - loop:
          do:
            - opt:
                do:
                  - eval: group.httpAdapter.shutdown(ctx)
                    to: group.httpAdapter.shutdown
                when: group.httpAdapter != nil
          key: _
          range: groups
          value: group
  - of: (*Server).closeHTTP
    participants:
      - id: caller
        kind: actor
      - id: (*Server).closeHTTP
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: slices
        kind: stdlib
      - id: s.mu.RUnlock
        kind: value
      - id: group.httpAdapter.closeNow
        kind: internal
    steps:
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: groups
        eval: slices.Clone(s.groups)
        to: slices
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - loop:
          do:
            - opt:
                do:
                  - eval: group.httpAdapter.closeNow()
                    to: group.httpAdapter.closeNow
                when: group.httpAdapter != nil
          key: _
          range: groups
          value: group
  - of: (*Server).waitIdle
    participants:
      - id: caller
        kind: actor
      - id: (*Server).waitIdle
        kind: self
      - id: time
        kind: stdlib
      - id: ticker.Stop
        kind: value
      - id: errs
        kind: package
    steps:
      - bind: ticker
        eval: time.NewTicker(drainPollInterval)
        to: time
      - defer: ticker.Stop()
        to: ticker.Stop
      - loop:
          do:
            - opt:
                do:
                  - return: nil
                when: s.active.Load() == 0
            - select:
                cases:
                  - comm: <-ctx.Done()
                    do:
                      - return: |-
                          errs.Wrap(corenet.DrainTimeout, errs.WrapParams{},
                          				errs.Int64("active", s.active.Load()))
                        to: errs
                  - comm: <-ticker.C
          forever: true
  - of: (*Server).Close
    participants:
      - id: caller
        kind: actor
      - id: (*Server).Close
        kind: self
      - id: s.stopStallWatch
        kind: internal
      - id: s.closeListeners
        kind: internal
      - id: s.closeLoops
        kind: internal
      - id: s.closeHTTP
        kind: internal
      - id: s.closeLive
        kind: internal
      - id: s.phase.Store
        kind: value
    steps:
      - eval: s.stopStallWatch()
        to: s.stopStallWatch
      - eval: s.closeListeners()
        to: s.closeListeners
      - eval: s.closeLoops()
        to: s.closeLoops
      - eval: s.closeHTTP()
        to: s.closeHTTP
      - opt:
          do:
            - eval: s.stop()
          when: s.stop != nil
      - eval: s.closeLive()
        to: s.closeLive
      - eval: s.phase.Store(uint32(corenet.PhaseStopped))
        to: s.phase.Store
      - return: nil
  - of: (*Server).closeListeners
    participants:
      - id: caller
        kind: actor
      - id: (*Server).closeListeners
        kind: self
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - bind: listeners
        eval: s.listeners
      - set: s.listeners
        value: nil
      - bind: packetConns
        eval: s.packetConns
      - set: s.packetConns
        value: nil
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - loop:
          do:
            - eval: swallowErr(bound.Close())
              to: swallowErr
          key: _
          range: packetConns
          value: bound
      - loop:
          do:
            - eval: swallowErr(bound.Close())
              to: swallowErr
          key: _
          range: listeners
          value: bound
  - of: shardable
    steps:
      - return: strings.HasPrefix(network, "tcp") || strings.HasPrefix(network, "udp")
  - of: resolveShards
    participants:
      - id: caller
        kind: actor
      - id: resolveShards
        kind: self
      - id: shardsFor
        kind: internal
    steps:
      - return: shardsFor(requested, network, reusePortSupported())
        to: shardsFor
  - of: shardsFor
    participants:
      - id: caller
        kind: actor
      - id: shardsFor
        kind: self
      - id: runtime
        kind: stdlib
    steps:
      - opt:
          do:
            - return: 1, false, ""
          when: requested == 1
      - opt:
          do:
            - opt:
                do:
                  - return: 1, true, "SO_REUSEPORT applies to IP sockets only; using a single listener"
                when: requested > 1
            - return: 1, false, ""
          when: "!shardable(network)"
      - opt:
          do:
            - opt:
                do:
                  - return: 1, true, "SO_REUSEPORT unavailable on this platform; using a single listener"
                when: requested > 1
            - return: 1, false, ""
          when: "!reusePort"
      - opt:
          do:
            - return: runtime.GOMAXPROCS(0), false, ""
              to: runtime
          when: requested <= 0
      - return: requested, false, ""
  - of: reusePortControl
    participants:
      - id: caller
        kind: actor
      - id: reusePortControl
        kind: self
      - id: rawConn.Control
        kind: value
    steps:
      - set: _, _
        value: network, address
      - var:
          name: setErr
          type: error
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: |-
              rawConn.Control(func(fd uintptr) {
              		setErr = setReusePort(fd)
              	})
            to: rawConn.Control
          when: err != nil
      - return: setErr
  - of: listen
    participants:
      - id: caller
        kind: actor
      - id: listen
        kind: self
      - id: familyUnavailable
        kind: internal
      - id: cfg.Listen
        kind: value
      - id: layered
        kind: internal
    steps:
      - opt:
          do:
            - return: |-
                nil, errs.Wrap(corenet.UnsupportedNetwork, errs.WrapParams{},
                			errs.String("network", addr.Network))
          init:
            bind: _, ok
            eval: streamNetworks[addr.Network]
          when: "!ok"
      - opt:
          do:
            - return: nil, unavailable
          init:
            bind: unavailable
            eval: familyUnavailable(addr)
            to: familyUnavailable
          when: unavailable != nil
      - opt:
          do:
            - return: |-
                nil, errs.Wrap(corenet.InvalidAddress, errs.WrapParams{},
                			errs.String("address", addr.String()))
          when: strings.TrimSpace(addr.Addr) == ""
      - bind: cfg
        eval: stdnet.ListenConfig{}
      - opt:
          do:
            - set: cfg.Control
              value: reusePortControl
          when: sharded
      - bind: raw, lerr
        eval: cfg.Listen(ctx, addr.Network, addr.Addr)
        to: cfg.Listen
      - opt:
          do:
            - return: |-
                nil, errs.Wrap(corenet.ListenFailed, errs.WrapParams{},
                			errs.String("address", addr.String()), errs.String("cause", lerr.Error()))
          when: lerr != nil
      - return: layered(raw, id, trackCloses), nil
        to: layered
  - of: familyUnavailable
    participants:
      - id: caller
        kind: actor
      - id: familyUnavailable
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: nil
          when: "!platformLacks(addr.Network)"
      - return: |-
          errs.Wrap(coreproc.UnsupportedPlatform, errs.WrapParams{},
          		errs.String("network", addr.Network), errs.String("goos", runtime.GOOS))
        to: errs
  - of: layered
    participants:
      - id: caller
        kind: actor
      - id: layered
        kind: self
      - id: tls
        kind: stdlib
    steps:
      - opt:
          do:
            - set: raw
              value: "&trackedListener{Listener: raw}"
          when: trackCloses
      - opt:
          do:
            - return: raw
          when: id.IsZero()
      - return: tls.NewListener(raw, id.ServerConfig())
        to: tls
  - of: (*boundListener).closedSignal
    participants:
      - id: caller
        kind: actor
      - id: (*boundListener).closedSignal
        kind: self
      - id: b.made.Do
        kind: value
    steps:
      - eval: b.made.Do(func() { b.closed = make(chan struct{}) })
        to: b.made.Do
      - return: b.closed
  - of: (*boundListener).Close
    participants:
      - id: caller
        kind: actor
      - id: (*boundListener).Close
        kind: self
      - id: b.closedSignal
        kind: internal
      - id: b.shut.Do
        kind: value
      - id: b.ln.Close
        kind: value
    steps:
      - eval: b.closedSignal()
        to: b.closedSignal
      - eval: b.shut.Do(func() { close(b.closed) })
        to: b.shut.Do
      - return: b.ln.Close()
        to: b.ln.Close
  - of: (*trackedListener).Accept
    participants:
      - id: caller
        kind: actor
      - id: (*trackedListener).Accept
        kind: self
      - id: l.Listener.Accept
        kind: value
    steps:
      - bind: socket, aerr
        eval: l.Listener.Accept()
        to: l.Listener.Accept
      - opt:
          do:
            - return: nil, aerr
          when: aerr != nil
      - return: "&trackedConn{Conn: socket}, nil"
  - of: startLoopEngine
    participants:
      - id: caller
        kind: actor
      - id: startLoopEngine
        kind: self
      - id: startPortable
        kind: internal
      - id: dupListeners
        kind: internal
      - id: loop
        kind: package
    steps:
      - opt:
          do:
            - return: startPortable(group, lns, "", plan), nil
              to: startPortable
          when: plan.backend == corenet.LoopBackendPortable
      - bind: handoff, err
        eval: dupListeners(lns)
        to: dupListeners
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: value
        eval: group.loop
      - set: value.Backend
        value: plan.backend
      - bind: g, err
        eval: |-
          loop.Start(loop.Config{
          		Group: group.name, Value: value, MaxConns: group.limits.MaxConns,
          		IdleTimeout: loopIdle(group), Handler: group.loopHandler, Listeners: handoff,
          		Disabled: plan.disabled, DisabledBy: plan.disabledBy,
          	})
        to: loop
      - opt:
          do:
            - return: "&nativeEngine{Group: g, noDelay: probeNoDelay(lns, plan)}, nil"
          when: err == nil
      - opt:
          do:
            - return: "startPortable(group, lns, \"native loop backend unavailable: \"+err.Error(), plan), nil"
              to: startPortable
          when: plan.fallback && !errs.HasCode(err, corenet.CodeLoopNoDescriptors)
      - return: nil, err
  - of: (*nativeEngine).State
    participants:
      - id: caller
        kind: actor
      - id: (*nativeEngine).State
        kind: self
      - id: e.Group.State
        kind: value
    steps:
      - bind: st
        eval: e.Group.State()
        to: e.Group.State
      - set: st.Capabilities
        value: append(st.Capabilities, e.noDelay)
      - return: st
  - of: probeNoDelay
    participants:
      - id: caller
        kind: actor
      - id: probeNoDelay
        kind: self
      - id: noDelayOf
        kind: internal
    steps:
      - bind: row
        eval: "corenet.CapabilityValue{Name: corenet.CapabilityTCPNoDelay, Class: classKernel, Status: statusOn}"
      - opt:
          do:
            - set: row.Status, row.Reason
              value: statusDisabled, plan.disabledBy
            - return: row
          when: slices.Contains(plan.disabled, corenet.CapabilityTCPNoDelay)
      - loop:
          do:
            - bind: v, err
              eval: noDelayOf(ln)
              to: noDelayOf
            - opt:
                do:
                  - set: row.Status, row.Reason
                    value: "statusAbsent, \"getsockopt TCP_NODELAY: not set\""
                  - return: row
                when: err != nil || v == 0
          key: _
          range: lns
          value: ln
      - return: row
  - of: noDelayOf
    participants:
      - id: caller
        kind: actor
      - id: noDelayOf
        kind: self
      - id: sc.SyscallConn
        kind: value
      - id: rc.Control
        kind: value
    steps:
      - bind: sc, ok
        eval: ln.(syscall.Conn)
      - opt:
          do:
            - return: 0, syscall.EINVAL
          when: "!ok"
      - bind: rc, err
        eval: sc.SyscallConn()
        to: sc.SyscallConn
      - opt:
          do:
            - return: 0, err
          when: err != nil
      - var:
          name: v
          type: int
      - var:
          name: gerr
          type: error
      - bind: cerr
        eval: rc.Control(func(fd uintptr) { v, gerr = syscall.GetsockoptInt(int(fd), syscall.IPPROTO_TCP, syscall.TCP_NODELAY) })
        to: rc.Control
      - opt:
          do:
            - return: 0, cerr
          when: cerr != nil
      - return: v, gerr
  - of: dupListeners
    participants:
      - id: caller
        kind: actor
      - id: dupListeners
        kind: self
      - id: closeHandoff
        kind: internal
      - id: sc.SyscallConn
        kind: value
      - id: rc.Control
        kind: value
      - id: syscall
        kind: stdlib
      - id: swallowErr
        kind: internal
    steps:
      - bind: out
        eval: make([]loop.Listener, 0, len(lns))
      - loop:
          do:
            - bind: sc, ok
              eval: ln.(syscall.Conn)
            - opt:
                do:
                  - eval: closeHandoff(out)
                    to: closeHandoff
                  - return: nil, errs.Wrap(corenet.ListenFailed, errs.WrapParams{}, errs.String("cause", "listener has no descriptor"))
                when: "!ok"
            - bind: rc, err
              eval: sc.SyscallConn()
              to: sc.SyscallConn
            - opt:
                do:
                  - eval: closeHandoff(out)
                    to: closeHandoff
                  - return: nil, errs.Wrap(corenet.ListenFailed, errs.WrapParams{}, errs.String("cause", err.Error()))
                when: err != nil
            - var:
                name: nfd
                type: int
            - var:
                name: derr
                type: error
            - bind: cerr
              eval: |-
                rc.Control(func(fd uintptr) {
                			r, _, errno := syscall.Syscall(syscall.SYS_FCNTL, fd, syscall.F_DUPFD_CLOEXEC, 0)
                			//: the kernel's answer.
                			if errno != 0 {
                				derr = errno
                				return
                			}
                			nfd = int(r)
                		})
              to: rc.Control
            - opt:
                do:
                  - eval: closeHandoff(out)
                    to: closeHandoff
                  - return: nil, errs.Wrap(corenet.ListenFailed, errs.WrapParams{}, errs.String("cause", "dup failed"))
                when: cerr != nil || derr != nil
            - opt:
                do:
                  - eval: swallowErr(syscall.Close(nfd))
                    to: swallowErr
                  - eval: closeHandoff(out)
                    to: closeHandoff
                  - return: nil, errs.Wrap(corenet.ListenFailed, errs.WrapParams{}, errs.String("cause", err.Error()))
                init:
                  bind: err
                  eval: syscall.SetNonblock(nfd, true)
                  to: syscall
                when: err != nil
            - set: out
              value: "append(out, loop.Listener{FD: nfd})"
          key: _
          range: lns
          value: ln
      - return: out, nil
  - of: closeHandoff
    participants:
      - id: caller
        kind: actor
      - id: closeHandoff
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - loop:
          do:
            - eval: swallowErr(syscall.Close(l.FD))
              to: swallowErr
          key: _
          range: ls
          value: l
  - of: (*StreamGroup).HandleLoop
    steps:
      - opt:
          do:
            - return: g
          when: "!g.claimHandler()"
      - set: g.loopHandler
        value: h
      - return: g
  - of: (*StreamGroup).loopRefusal
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).loopRefusal
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: errs.Wrap(corenet.LoopTLSUnsupported, errs.WrapParams{}, errs.String("group", g.name))
              to: errs
          when: g.kinds.has(corenet.OptionTLS)
      - bind: honours, _
        eval: g.loopHandler.(corenet.LoopOptionHonourer)
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: loopHonours(k) || (honours != nil && k != corenet.OptionMiddleware && honours.Honours(k))
            - return: |-
                errs.Wrap(corenet.LoopOptionUnsupported, errs.WrapParams{},
                			errs.String("group", g.name), errs.String("option", k.String()))
              to: errs
          key: _
          range: g.kinds.list()
          value: k
      - return: nil
  - of: loopHonours
    steps:
      - switch:
          cases:
            - case: corenet.OptionIdleTimeout, corenet.OptionMaxConns, corenet.OptionAdopt, corenet.OptionPlaintext, corenet.OptionName, corenet.OptionEngine
              do:
                - return: "true"
            - default: true
              do:
                - return: "false"
          "on": k
  - of: (*Server).bindLoopGroup
    participants:
      - id: caller
        kind: actor
      - id: (*Server).bindLoopGroup
        kind: self
      - id: s.adoptStream
        kind: internal
      - id: s.registerLoopListeners
        kind: internal
      - id: listen
        kind: internal
      - id: loop
        kind: package
      - id: s.operator.plan
        kind: internal
      - id: startLoopEngine
        kind: internal
      - id: eng.State
        kind: internal
      - id: s.recordFallback
        kind: internal
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
    steps:
      - var:
          name: lns
          type: "[]stdnet.Listener"
      - loop:
          do:
            - bind: adopted, err
              eval: s.adoptStream(name)
              to: s.adoptStream
            - opt:
                do:
                  - return: err
                when: err != nil
            - set: lns
              value: append(lns, adopted...)
            - eval: s.registerLoopListeners(group, adopted, true)
              to: s.registerLoopListeners
          key: _
          range: group.adopt
          value: name
      - loop:
          do:
            - bind: ln, err
              eval: listen(ctx, addr, corenet.IdentityValue{}, false, false)
              to: listen
            - opt:
                do:
                  - return: err
                when: err != nil
            - set: lns
              value: append(lns, ln)
            - eval: s.registerLoopListeners(group, []stdnet.Listener{ln}, false)
              to: s.registerLoopListeners
          key: _
          range: group.addrs
          value: addr
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: loop.CheckCapabilities(group.name, group.loop)
            to: loop
          when: err != nil
      - bind: plan
        eval: s.operator.plan(group.loop.Backend, nativeLoopBackends)
        to: s.operator.plan
      - bind: eng, err
        eval: startLoopEngine(group, lns, plan)
        to: startLoopEngine
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - eval: s.recordFallback(group.name, st.DegradedReason)
              to: s.recordFallback
          init:
            bind: st
            eval: eng.State()
            to: eng.State
          when: st.Degraded
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - set: s.loopEngines
        value: append(s.loopEngines, eng)
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - return: nil
  - of: (*Server).registerLoopListeners
    steps:
      - lock:
          mutex: s.mu
      - loop:
          do:
            - bind: addr
              eval: "corenet.AddressValue{Network: ln.Addr().Network(), Addr: ln.Addr().String()}"
            - set: s.listeners
              value: "append(s.listeners, &boundListener{group: group.name, addr: addr, ln: ln})"
            - set: s.states
              value: |-
                append(s.states, corenet.ListenerStateValue{
                			Group: group.name, Address: ln.Addr().String(), Network: addr.Network, Shards: 1, Adopted: adopted,
                		})
          key: _
          range: lns
          value: ln
  - of: (*Server).loopStates
    participants:
      - id: caller
        kind: actor
      - id: (*Server).loopStates
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: s.mu.RUnlock
        kind: value
    steps:
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: engines
        eval: s.loopEngines
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - var:
          name: out
          type: "[]corenet.LoopStateValue"
      - loop:
          do:
            - set: out
              value: append(out, e.State())
          key: _
          range: engines
          value: e
      - return: out
  - of: (*Server).shutdownLoops
    participants:
      - id: caller
        kind: actor
      - id: (*Server).shutdownLoops
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: s.mu.RUnlock
        kind: value
      - id: e.Shutdown
        kind: internal
    steps:
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: engines
        eval: s.loopEngines
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - var:
          name: first
          type: error
      - loop:
          do:
            - opt:
                do:
                  - set: first
                    value: err
                init:
                  bind: err
                  eval: e.Shutdown(ctx)
                  to: e.Shutdown
                when: err != nil && first == nil
          key: _
          range: engines
          value: e
      - return: first
  - of: (*Server).closeLoops
    participants:
      - id: caller
        kind: actor
      - id: (*Server).closeLoops
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: s.mu.RUnlock
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: engines
        eval: s.loopEngines
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - loop:
          do:
            - eval: swallowErr(e.Close())
              to: swallowErr
          key: _
          range: engines
          value: e
  - of: loopIdle
    participants:
      - id: caller
        kind: actor
      - id: loopIdle
        kind: self
      - id: time
        kind: stdlib
    steps:
      - return: time.Duration(group.timeouts.Idle)
        to: time
  - of: startPortable
    participants:
      - id: caller
        kind: actor
      - id: startPortable
        kind: self
      - id: pl.acceptLoop
        kind: internal
      - id: pl.run
        kind: internal
    steps:
      - bind: v
        eval: group.loop
      - bind: pl
        eval: |-
          &portableLoop{
          		group: group.name, h: group.loopHandler,
          		spillCap: orDefaultInt(v.SpillCap, portableSpillCap),
          		outCap:   orDefaultInt(v.OutputCap, portableOutputCap),
          		soft:     max(v.SoftConns, 0), maxConns: max(group.limits.MaxConns, 0),
          		idle: loopIdle(group), degraded: degraded,
          		events:  make(chan portableEvent, portableEvents),
          		postOps: make([]corenet.PostFunc, portablePostCap), postArgs: make([]uintptr, portablePostCap),
          		wake: make(chan struct{}, 1), done: make(chan struct{}), lns: lns,
          		caps:       append(loop.Unprobed("portable", plan.disabled, plan.disabledBy), portableNoDelay(plan)),
          		noDelayOff: slices.Contains(plan.disabled, corenet.CapabilityTCPNoDelay),
          	}
      - loop:
          do:
            - go: pl.acceptLoop(ln)
              to: pl.acceptLoop
          key: _
          range: lns
          value: ln
      - go: pl.run(pl.done)
        to: pl.run
      - return: "portableEngine{pl: pl}"
  - of: portableNoDelay
    steps:
      - bind: row
        eval: "corenet.CapabilityValue{Name: corenet.CapabilityTCPNoDelay, Class: classKernel, Status: statusOn, Reason: \"the netpoller's default\"}"
      - opt:
          do:
            - set: row.Status, row.Reason
              value: statusDisabled, plan.disabledBy
          when: slices.Contains(plan.disabled, corenet.CapabilityTCPNoDelay)
      - return: row
  - of: orDefaultInt
    steps:
      - opt:
          do:
            - return: def
          when: v <= 0
      - return: v
  - of: (*portableLoop).acceptLoop
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).acceptLoop
        kind: self
      - id: ln.Accept
        kind: value
      - id: time
        kind: stdlib
      - id: pl.rejected.Add
        kind: value
      - id: swallowErr
        kind: internal
      - id: pl.live.Add
        kind: value
    steps:
      - bind: failures
        eval: "0"
      - loop:
          do:
            - bind: c, err
              eval: ln.Accept()
              to: ln.Accept
            - opt:
                do:
                  - opt:
                      do:
                        - return: ""
                      when: errors.Is(err, stdnet.ErrClosed) || pl.stopReq.Load()
                  - op: ++
                    set: failures
                  - eval: time.Sleep(acceptDelay(failures))
                    to: time
                  - continue: true
                when: err != nil
            - set: failures
              value: "0"
            - opt:
                do:
                  - eval: pl.rejected.Add(1)
                    to: pl.rejected.Add
                  - eval: swallowErr(c.Close())
                    to: swallowErr
                  - continue: true
                when: pl.maxConns > 0 && pl.live.Load() >= int64(pl.maxConns) || pl.drainReq.Load()
            - eval: pl.live.Add(1)
              to: pl.live.Add
            - send:
                chan: pl.events
                value: "portableEvent{kind: pevOpen, conn: c}"
          forever: true
  - of: (*portableLoop).run
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).run
        kind: self
      - id: time
        kind: stdlib
      - id: tick.Stop
        kind: value
      - id: pl.handle
        kind: internal
      - id: pl.collect
        kind: internal
      - id: pl.drainPosts
        kind: internal
      - id: pl.timers
        kind: internal
      - id: pl.control
        kind: internal
      - id: pl.h.OnBatchEnd
        kind: value
      - id: pl.endBatch
        kind: internal
      - id: pl.closeAll
        kind: internal
    steps:
      - defer: close(done)
      - bind: tick
        eval: time.NewTicker(portableTick)
        to: time
      - defer: tick.Stop()
        to: tick.Stop
      - loop:
          do:
            - select:
                cases:
                  - comm: ev := <-pl.events
                    do:
                      - eval: pl.handle(&ev)
                        to: pl.handle
                  - comm: <-pl.wake
                  - comm: <-tick.C
            - eval: pl.collect()
              to: pl.collect
            - eval: pl.drainPosts()
              to: pl.drainPosts
            - eval: pl.timers()
              to: pl.timers
            - eval: pl.control()
              to: pl.control
            - eval: pl.h.OnBatchEnd(pl)
              to: pl.h.OnBatchEnd
            - eval: pl.endBatch()
              to: pl.endBatch
            - opt:
                do:
                  - eval: pl.closeAll()
                    to: pl.closeAll
                  - return: ""
                when: pl.stopReq.Load() || (pl.draining && pl.live.Load() == 0)
          forever: true
  - of: (*portableLoop).collect
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).collect
        kind: self
      - id: pl.handle
        kind: internal
    steps:
      - loop:
          do:
            - select:
                cases:
                  - comm: ev := <-pl.events
                    do:
                      - eval: pl.handle(&ev)
                        to: pl.handle
                  - default: true
                    do:
                      - return: ""
          range: portableEvents
  - of: (*portableLoop).handle
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).handle
        kind: self
      - id: pl.open
        kind: internal
      - id: pl.handleData
        kind: internal
      - id: pl.handleEnd
        kind: internal
      - id: pl.handleSent
        kind: internal
    steps:
      - switch:
          cases:
            - case: pevOpen
              do:
                - eval: pl.open(ev.conn)
                  to: pl.open
            - case: pevData
              do:
                - eval: pl.handleData(ev)
                  to: pl.handleData
            - case: pevEnd
              do:
                - eval: pl.handleEnd(ev)
                  to: pl.handleEnd
            - case: pevSent
              do:
                - eval: pl.handleSent(ev)
                  to: pl.handleSent
          "on": ev.kind
  - of: (*portableLoop).handleData
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).handleData
        kind: self
      - id: pl.lookupSlot
        kind: internal
      - id: pl.deliver
        kind: internal
    steps:
      - bind: pc
        eval: pl.lookupSlot(ev.slot, ev.gen)
        to: pl.lookupSlot
      - set: pl.batchAcks
        value: append(pl.batchAcks, pl.conns[ev.slot].ack)
      - opt:
          do:
            - return: ""
          when: pc == nil || !pc.open
      - eval: pl.deliver(ev.slot, pc, ev.data)
        to: pl.deliver
  - of: (*portableLoop).handleEnd
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).handleEnd
        kind: self
      - id: pl.lookupSlot
        kind: internal
      - id: pl.markDirty
        kind: internal
      - id: pl.finish
        kind: internal
    steps:
      - bind: pc
        eval: pl.lookupSlot(ev.slot, ev.gen)
        to: pl.lookupSlot
      - opt:
          do:
            - return: ""
          when: pc == nil || !pc.open
      - opt:
          do:
            - set: pc.peerDone
              value: "true"
            - eval: pl.markDirty(ev.slot)
              to: pl.markDirty
            - return: ""
          when: errors.Is(ev.err, io.EOF) && !pc.reasonSet
      - eval: pl.finish(ev.slot, pc, ev.err)
        to: pl.finish
  - of: (*portableLoop).handleSent
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).handleSent
        kind: self
      - id: pl.lookupSlot
        kind: internal
      - id: time
        kind: stdlib
      - id: pl.markDirty
        kind: internal
      - id: pl.h.OnWritable
        kind: value
    steps:
      - bind: pc
        eval: pl.lookupSlot(ev.slot, ev.gen)
        to: pl.lookupSlot
      - opt:
          do:
            - return: ""
          when: pc == nil || !pc.open
      - set: pc.lastIO
        to: time
        value: time.Now()
      - eval: pl.markDirty(ev.slot)
        to: pl.markDirty
      - opt:
          do:
            - set: pc.wantWrite
              value: "false"
            - eval: "pl.h.OnWritable(pl, corenet.LoopConnRef{Slot: uint32(ev.slot), Gen: pc.gen})"
              to: pl.h.OnWritable
          when: pc.wantWrite && pl.pending(pc) < pl.outCap/4
  - of: (*portableLoop).open
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).open
        kind: self
      - id: swallowErr
        kind: internal
      - id: pl.accepted.Add
        kind: value
      - id: pl.readers.Add
        kind: value
      - id: pl.reader
        kind: internal
      - id: pl.writer
        kind: internal
      - id: pl.h.OnOpen
        kind: value
    steps:
      - opt:
          do:
            - eval: swallowErr(tc.SetNoDelay(false))
              to: swallowErr
          init:
            bind: tc, ok
            eval: c.(*stdnet.TCPConn)
          when: ok && pl.noDelayOff
      - var:
          name: slot
          type: int32
      - alt:
          - do:
              - set: slot
                value: pl.free[n-1]
              - set: pl.free
                value: pl.free[:n-1]
            init:
              bind: "n"
              eval: len(pl.free)
            when: n > 0
          - do:
              - set: slot
                value: int32(len(pl.conns))
              - set: pl.conns
                value: append(pl.conns, &portableConn{})
            else: true
      - bind: prev
        eval: pl.conns[slot]
      - bind: gen
        eval: prev.gen + 1
      - opt:
          do:
            - set: gen
              value: "1"
          when: gen == 0
      - bind: pc
        eval: |-
          &portableConn{
          		conn: c, gen: gen, ack: make(chan struct{}, 1), kick: make(chan struct{}, 1), open: true, lastIO: time.Now(),
          		pressure: pl.soft > 0 && pl.live.Load() > int64(pl.soft),
          	}
      - set: pl.conns[slot]
        value: pc
      - eval: pl.accepted.Add(1)
        to: pl.accepted.Add
      - eval: pl.readers.Add(1)
        to: pl.readers.Add
      - go: pl.reader(slot, pc)
        to: pl.reader
      - go: pl.writer(slot, pc)
        to: pl.writer
      - eval: "pl.h.OnOpen(pl, corenet.LoopConnRef{Slot: uint32(slot), Gen: gen})"
        to: pl.h.OnOpen
  - of: (*portableLoop).reader
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).reader
        kind: self
      - id: pl.readers.Done
        kind: value
      - id: pc.conn.Read
        kind: value
    steps:
      - defer: pl.readers.Done()
        to: pl.readers.Done
      - bind: buf
        eval: make([]byte, portableReadSize)
      - loop:
          do:
            - bind: n, err
              eval: pc.conn.Read(buf)
              to: pc.conn.Read
            - opt:
                do:
                  - send:
                      chan: pl.events
                      value: "portableEvent{kind: pevData, slot: slot, gen: pc.gen, data: buf[:n]}"
                  - eval: <-pc.ack
                when: n > 0
            - opt:
                do:
                  - send:
                      chan: pl.events
                      value: "portableEvent{kind: pevEnd, slot: slot, gen: pc.gen, err: err}"
                  - return: ""
                when: err != nil
          forever: true
  - of: (*portableLoop).writer
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).writer
        kind: self
      - id: pc.mu.Lock
        kind: value
      - id: pc.mu.Unlock
        kind: value
      - id: swallowErr
        kind: internal
      - id: pc.conn.Write
        kind: value
    steps:
      - loop:
          do:
            - loop:
                do:
                  - eval: pc.mu.Lock()
                    to: pc.mu.Lock
                  - bind: out
                    eval: pc.out
                  - set: pc.flight
                    value: len(out)
                  - set: pc.out
                    value: nil
                  - bind: closing
                    eval: pc.closing
                  - eval: pc.mu.Unlock()
                    to: pc.mu.Unlock
                  - opt:
                      do:
                        - opt:
                            do:
                              - eval: swallowErr(pc.conn.Close())
                                to: swallowErr
                              - return: ""
                            when: closing
                        - break: true
                      when: len(out) == 0
                  - bind: _, err
                    eval: pc.conn.Write(out)
                    to: pc.conn.Write
                  - eval: pc.mu.Lock()
                    to: pc.mu.Lock
                  - set: pc.flight
                    value: "0"
                  - eval: pc.mu.Unlock()
                    to: pc.mu.Unlock
                  - opt:
                      do:
                        - eval: swallowErr(pc.conn.Close())
                          to: swallowErr
                        - return: ""
                      when: err != nil
                  - send:
                      chan: pl.events
                      value: "portableEvent{kind: pevSent, slot: slot, gen: pc.gen}"
                forever: true
          range: pc.kick
  - of: (*portableLoop).lookupSlot
    steps:
      - opt:
          do:
            - return: nil
          when: int(slot) >= len(pl.conns) || pl.conns[slot].gen != gen || gen == 0
      - return: pl.conns[slot]
  - of: (*portableLoop).lookup
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).lookup
        kind: self
      - id: pl.lookupSlot
        kind: internal
    steps:
      - bind: pc
        eval: pl.lookupSlot(int32(ref.Slot), ref.Gen)
        to: pl.lookupSlot
      - opt:
          do:
            - return: 0, nil
          when: ref.Ring != 0 || pc == nil || !pc.open || pc.reasonSet
      - return: int32(ref.Slot), pc
  - of: (*portableLoop).deliver
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).deliver
        kind: self
      - id: time
        kind: stdlib
      - id: pl.finish
        kind: internal
      - id: clampUsed
        kind: internal
    steps:
      - set: pc.lastIO
        to: time
        value: time.Now()
      - bind: ref
        eval: "corenet.LoopConnRef{Slot: uint32(slot), Gen: pc.gen}"
      - bind: buf
        eval: data
      - opt:
          do:
            - opt:
                do:
                  - eval: pl.finish(slot, pc, corenet.LoopSpillFull)
                    to: pl.finish
                  - return: ""
                when: len(pc.spill)-pc.spillOff+len(data) > pl.spillCap
            - set: pc.spill
              value: append(pc.spill, data...)
            - set: buf
              value: pc.spill[pc.spillOff:]
          when: len(pc.spill) > pc.spillOff
      - bind: "n"
        eval: clampUsed(pl.h.OnData(pl, ref, buf), len(buf))
        to: clampUsed
      - opt:
          do:
            - return: ""
          when: "!pc.open"
      - alt:
          - do:
              - op: +=
                set: pc.spillOff
                value: "n"
            when: len(pc.spill) > pc.spillOff
          - do:
              - bind: tail
                eval: buf[n:]
              - opt:
                  do:
                    - eval: pl.finish(slot, pc, corenet.LoopSpillFull)
                      to: pl.finish
                    - return: ""
                  when: len(tail) > pl.spillCap
              - set: pc.spill
                value: append(pc.spill[:0:0], tail...)
              - set: pc.spillOff
                value: "0"
            when: n < len(buf)
  - of: clampUsed
    steps:
      - opt:
          do:
            - return: "n"
          when: v < 0 || v > n
      - return: v
  - of: (*portableLoop).pending
    steps:
      - lock:
          mutex: pc.mu
      - return: len(pc.out) + pc.flight
  - of: (*portableLoop).markDirty
    steps:
      - set: pl.dirty
        value: append(pl.dirty, slot)
  - of: (*portableLoop).finish
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).finish
        kind: self
      - id: pl.live.Add
        kind: value
      - id: pl.closed.Add
        kind: value
      - id: pl.h.OnClose
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "!pc.open"
      - set: pc.open
        value: "false"
      - opt:
          do:
            - set: err
              value: nil
          when: errors.Is(err, io.EOF) || errors.Is(err, stdnet.ErrClosed)
      - opt:
          do:
            - set: err
              value: pc.closeErr
          when: pc.reasonSet
      - eval: pl.live.Add(-1)
        to: pl.live.Add
      - eval: pl.closed.Add(1)
        to: pl.closed.Add
      - eval: "pl.h.OnClose(pl, corenet.LoopConnRef{Slot: uint32(slot), Gen: pc.gen}, err)"
        to: pl.h.OnClose
      - eval: swallowErr(pc.conn.Close())
        to: swallowErr
      - eval: close(pc.kick)
      - set: pl.free
        value: append(pl.free, slot)
  - of: (*portableLoop).timers
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).timers
        kind: self
      - id: time
        kind: stdlib
      - id: pl.finish
        kind: internal
      - id: pl.h.OnTimeout
        kind: value
    steps:
      - bind: now
        eval: time.Now()
        to: time
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: "!pc.open"
            - opt:
                do:
                  - set: pc.reasonSet, pc.closeErr
                    value: true, os.ErrDeadlineExceeded
                  - eval: pl.finish(int32(slot), pc, os.ErrDeadlineExceeded)
                    to: pl.finish
                  - continue: true
                when: pl.idle > 0 && now.Sub(pc.lastIO) >= pl.idle && pl.pending(pc) == 0
            - opt:
                do:
                  - set: pc.deadline
                    value: time.Time{}
                  - eval: "pl.h.OnTimeout(pl, corenet.LoopConnRef{Slot: uint32(slot), Gen: pc.gen})"
                    to: pl.h.OnTimeout
                when: "!pc.deadline.IsZero() && !now.Before(pc.deadline)"
          key: slot
          range: pl.conns
          value: pc
  - of: (*portableLoop).control
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).control
        kind: self
      - id: pl.markDirty
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "!pl.drainReq.Load()"
      - set: pl.draining
        value: "true"
      - loop:
          do:
            - opt:
                do:
                  - set: pc.reasonSet, pc.closeErr
                    value: true, corenet.ServerClosed
                  - eval: pl.markDirty(int32(slot))
                    to: pl.markDirty
                when: pc.open && !pc.reasonSet && len(pc.spill) == pc.spillOff
          key: slot
          range: pl.conns
          value: pc
  - of: (*portableLoop).endBatch
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).endBatch
        kind: self
      - id: pl.settle
        kind: internal
      - id: pl.compactSpills
        kind: internal
      - id: pl.batches.Add
        kind: value
    steps:
      - loop:
          do:
            - eval: pl.settle(slot)
              to: pl.settle
          key: _
          range: pl.dirty
          value: slot
      - set: pl.dirty
        value: pl.dirty[:0]
      - loop:
          do:
            - send:
                chan: a
                value: struct{}{}
          key: _
          range: pl.batchAcks
          value: a
      - set: pl.batchAcks
        value: pl.batchAcks[:0]
      - eval: pl.compactSpills()
        to: pl.compactSpills
      - eval: pl.batches.Add(1)
        to: pl.batches.Add
  - of: (*portableLoop).settle
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).settle
        kind: self
      - id: pc.mu.Lock
        kind: value
      - id: pc.mu.Unlock
        kind: value
      - id: pl.finish
        kind: internal
    steps:
      - bind: pc
        eval: pl.conns[slot]
      - opt:
          do:
            - return: ""
          when: "!pc.open"
      - eval: pc.mu.Lock()
        to: pc.mu.Lock
      - bind: empty
        eval: len(pc.out) == 0 && pc.flight == 0
      - opt:
          do:
            - set: pc.closing
              value: "true"
          when: pc.reasonSet || pc.peerDone
      - eval: pc.mu.Unlock()
        to: pc.mu.Unlock
      - opt:
          do:
            - eval: pl.finish(slot, pc, pc.closeErr)
              to: pl.finish
            - return: ""
          when: empty && (pc.reasonSet || pc.peerDone)
      - select:
          cases:
            - comm: pc.kick <- struct{}{}
            - default: true
  - of: (*portableLoop).closeAll
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).closeAll
        kind: self
      - id: pl.finish
        kind: internal
      - id: pl.postMu.Lock
        kind: value
      - id: pl.postMu.Unlock
        kind: value
    steps:
      - loop:
          do:
            - opt:
                do:
                  - set: pc.reasonSet, pc.closeErr
                    value: true, corenet.ServerClosed
                  - eval: pl.finish(int32(slot), pc, corenet.ServerClosed)
                    to: pl.finish
                when: pc.open
          key: slot
          range: pl.conns
          value: pc
      - eval: pl.postMu.Lock()
        to: pl.postMu.Lock
      - set: pl.postShut
        value: "true"
      - eval: pl.postMu.Unlock()
        to: pl.postMu.Unlock
      - loop:
          do:
            - send:
                chan: a
                value: struct{}{}
          key: _
          range: pl.batchAcks
          value: a
      - go: |-
          func() {
          		quiet := time.NewTimer(time.Second)
          		defer quiet.Stop()
          		//: a reader still sending its last event finds nobody; drained here,
          		//: until a second passes with none.
          		for {
          			select {
          			case <-pl.events:
          				quiet.Reset(time.Second)
          			case <-quiet.C:
          				return
          			}
          		}
          	}()
  - of: (*portableLoop).drainPosts
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).drainPosts
        kind: self
      - id: pl.postWait.Store
        kind: value
      - id: pl.postMu.Lock
        kind: value
      - id: pl.postMu.Unlock
        kind: value
    steps:
      - eval: pl.postWait.Store(false)
        to: pl.postWait.Store
      - loop:
          do:
            - eval: pl.postMu.Lock()
              to: pl.postMu.Lock
            - opt:
                do:
                  - eval: pl.postMu.Unlock()
                    to: pl.postMu.Unlock
                  - return: ""
                when: pl.postN == 0
            - bind: op, arg
              eval: pl.postOps[pl.postHead], pl.postArgs[pl.postHead]
            - set: pl.postOps[pl.postHead]
              value: nil
            - set: pl.postHead
              value: (pl.postHead + 1) % len(pl.postOps)
            - op: "--"
              set: pl.postN
            - eval: pl.postMu.Unlock()
              to: pl.postMu.Unlock
            - eval: op(pl, arg)
          forever: true
  - of: (*portableLoop).Write
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).Write
        kind: self
      - id: pl.lookup
        kind: internal
      - id: pc.mu.Lock
        kind: value
      - id: pc.mu.Unlock
        kind: value
      - id: pl.markDirty
        kind: internal
    steps:
      - bind: slot, pc
        eval: pl.lookup(ref)
        to: pl.lookup
      - opt:
          do:
            - return: corenet.LoopStaleRef
          when: pc == nil
      - eval: pc.mu.Lock()
        to: pc.mu.Lock
      - opt:
          do:
            - eval: pc.mu.Unlock()
              to: pc.mu.Unlock
            - set: pc.wantWrite
              value: "true"
            - return: corenet.LoopOutputFull
          when: len(pc.out)+pc.flight+len(p) > pl.outCap
      - set: pc.out
        value: append(pc.out, p...)
      - eval: pc.mu.Unlock()
        to: pc.mu.Unlock
      - eval: pl.markDirty(slot)
        to: pl.markDirty
      - return: nil
  - of: (*portableLoop).Close
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).Close
        kind: self
      - id: pl.lookup
        kind: internal
      - id: pl.markDirty
        kind: internal
    steps:
      - bind: slot, pc
        eval: pl.lookup(ref)
        to: pl.lookup
      - opt:
          do:
            - return: corenet.LoopStaleRef
          when: pc == nil
      - set: pc.reasonSet, pc.closeErr
        value: true, nil
      - eval: pl.markDirty(slot)
        to: pl.markDirty
      - return: nil
  - of: (*portableLoop).SetDeadline
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).SetDeadline
        kind: self
      - id: pl.lookup
        kind: internal
      - id: time.Now().Add
        kind: value
    steps:
      - bind: _, pc
        eval: pl.lookup(ref)
        to: pl.lookup
      - opt:
          do:
            - return: corenet.LoopStaleRef
          when: pc == nil
      - alt:
          - do:
              - set: pc.deadline
                value: time.Time{}
            when: d <= 0
          - do:
              - set: pc.deadline
                to: time.Now().Add
                value: time.Now().Add(d)
            else: true
      - return: nil
  - of: (*portableLoop).Pressure
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).Pressure
        kind: self
      - id: pl.lookup
        kind: internal
    steps:
      - bind: _, pc
        eval: pl.lookup(ref)
        to: pl.lookup
      - return: pc != nil && pc.pressure
  - of: (*portableLoop).Loop
    steps:
      - return: "0"
  - of: (*portableLoop).Post
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).Post
        kind: self
      - id: pl.postMu.Lock
        kind: value
      - id: pl.postMu.Unlock
        kind: value
    steps:
      - eval: pl.postMu.Lock()
        to: pl.postMu.Lock
      - opt:
          do:
            - eval: pl.postMu.Unlock()
              to: pl.postMu.Unlock
            - return: corenet.ServerClosed
          when: pl.postShut
      - opt:
          do:
            - eval: pl.postMu.Unlock()
              to: pl.postMu.Unlock
            - return: corenet.LoopPostQueueFull
          when: pl.postN == len(pl.postOps)
      - bind: i
        eval: (pl.postHead + pl.postN) % len(pl.postOps)
      - set: pl.postOps[i], pl.postArgs[i]
        value: op, arg
      - op: ++
        set: pl.postN
      - eval: pl.postMu.Unlock()
        to: pl.postMu.Unlock
      - opt:
          do:
            - select:
                cases:
                  - comm: pl.wake <- struct{}{}
                  - default: true
          when: pl.postWait.CompareAndSwap(false, true)
      - return: nil
  - of: portableEngine.Shutdown
    participants:
      - id: caller
        kind: actor
      - id: portableEngine.Shutdown
        kind: self
      - id: pl.drainReq.Store
        kind: value
      - id: swallowErr
        kind: internal
      - id: errs
        kind: package
    steps:
      - bind: pl
        eval: e.pl
      - eval: pl.drainReq.Store(true)
        to: pl.drainReq.Store
      - select:
          cases:
            - comm: pl.wake <- struct{}{}
            - default: true
      - select:
          cases:
            - comm: <-pl.done
              do:
                - return: nil
            - comm: <-ctx.Done()
              do:
                - eval: swallowErr(e.Close())
                  to: swallowErr
                - return: errs.Wrap(corenet.DrainTimeout, errs.WrapParams{}, errs.String("group", pl.group))
                  to: errs
  - of: portableEngine.Close
    participants:
      - id: caller
        kind: actor
      - id: portableEngine.Close
        kind: self
      - id: pl.once.Do
        kind: value
    steps:
      - bind: pl
        eval: e.pl
      - eval: |-
          pl.once.Do(func() {
          		pl.stopReq.Store(true)
          		select {
          		case pl.wake <- struct{}{}:
          		default:
          		}
          		<-pl.done
          	})
        to: pl.once.Do
      - return: nil
  - of: portableEngine.State
    steps:
      - bind: pl
        eval: e.pl
      - return: |-
          corenet.LoopStateValue{
          		Group: pl.group, Backend: corenet.LoopBackendPortable, ProbeStage: "portable",
          		Degraded: pl.degraded != "", DegradedReason: pl.degraded,
          		Loops: 1, Rings: 1, RingsSource: "single", GOMAXPROCS: runtime.GOMAXPROCS(0),
          		Capabilities: slices.Clone(pl.caps),
          		RingStates: []corenet.LoopRingStateValue{{
          			Conns: pl.live.Load(), Accepted: pl.accepted.Load(), Closed: pl.closed.Load(),
          			Batches: pl.batches.Load(), Evicted: 0,
          		}},
          	}
  - of: newMultiReader
    participants:
      - id: caller
        kind: actor
      - id: newMultiReader
        kind: self
      - id: sc.SyscallConn
        kind: internal
    steps:
      - bind: raw, rerr
        eval: sc.SyscallConn()
        to: sc.SyscallConn
      - opt:
          do:
            - return: nil, rerr
          when: rerr != nil
      - return: "&multiReader{pc: pc, raw: raw}, nil"
  - of: (*multiReader).wire
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).wire
        kind: self
      - id: setKernelLen
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: r.wired == len(slots)
      - bind: count
        eval: len(slots)
      - set: r.headers
        value: make([]mmsghdr, count)
      - set: r.iovecs
        value: make([]syscall.Iovec, count)
      - set: r.names
        value: make([]syscall.RawSockaddrAny, count)
      - loop:
          do:
            - set: r.iovecs[i].Base
              value: "&slots[i].buf[0]"
            - eval: setKernelLen(&r.iovecs[i].Len, len(slots[i].buf))
              to: setKernelLen
            - set: r.headers[i].hdr.Name
              value: (*byte)(unsafe.Pointer(&r.names[i]))
            - set: r.headers[i].hdr.Namelen
              value: syscall.SizeofSockaddrAny
            - set: r.headers[i].hdr.Iov
              value: "&r.iovecs[i]"
            - eval: setKernelLen(&r.headers[i].hdr.Iovlen, 1)
              to: setKernelLen
          key: i
          range: slots
      - set: r.wired
        value: count
  - of: (*multiReader).readBatch
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).readBatch
        kind: self
      - id: r.wire
        kind: internal
      - id: r.raw.Read
        kind: value
      - id: r.fill
        kind: internal
    steps:
      - eval: r.wire(slots)
        to: r.wire
      - var:
          name: received
          type: int
      - var:
          name: errno
          type: syscall.Errno
      - bind: ctrlErr
        eval: |-
          r.raw.Read(func(fd uintptr) bool {
          		result, _, callErrno := syscall.Syscall6(syscall.SYS_RECVMMSG, fd,
          			uintptr(unsafe.Pointer(&r.headers[0])), uintptr(len(r.headers)),
          			syscall.MSG_WAITFORONE, 0, 0)
          		//: not ready yet — let the netpoller wake us when it is.
          		if callErrno == syscall.EAGAIN {
          			//: not ready — hand control back to the netpoller.
          			return false
          		}
          		received, errno = int(result), callErrno
          		//: the syscall completed, successfully or not.
          		return true
          	})
        to: r.raw.Read
      - opt:
          do:
            - return: 0, ctrlErr
          when: ctrlErr != nil
      - opt:
          do:
            - return: 0, errno
          when: errno != 0
      - eval: r.fill(slots, received)
        to: r.fill
      - return: received, nil
  - of: (*multiReader).fill
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).fill
        kind: self
      - id: sockaddrToAddr
        kind: internal
    steps:
      - loop:
          do:
            - set: slots[i].n
              value: int(r.headers[i].length)
            - set: slots[i].addr
              to: sockaddrToAddr
              value: sockaddrToAddr(&r.names[i])
          key: i
          range: received
  - of: readOperator
    participants:
      - id: caller
        kind: actor
      - id: readOperator
        kind: self
      - id: strings
        kind: stdlib
      - id: env.applyEngine
        kind: internal
      - id: env.applyDisable
        kind: internal
      - id: env.applied
        kind: internal
    steps:
      - bind: env
        eval: "operatorEnv{ceiling: rankIOURing}"
      - var:
          name: raw
          type: "[]string"
      - bind: engine, _
        eval: lookup(corenet.EnvEngine)
      - opt:
          do:
            - set: raw
              value: append(raw, corenet.EnvEngine+"="+engine)
            - eval: env.applyEngine(engine)
              to: env.applyEngine
          init:
            bind: engine
            eval: strings.TrimSpace(engine)
            op: =
            to: strings
          when: engine != ""
      - bind: disable, _
        eval: lookup(corenet.EnvDisable)
      - opt:
          do:
            - set: raw
              value: append(raw, corenet.EnvDisable+"="+disable)
            - eval: env.applyDisable(disable)
              to: env.applyDisable
          init:
            bind: disable
            eval: strings.TrimSpace(disable)
            op: =
            to: strings
          when: disable != ""
      - opt:
          do:
            - return: env
          when: len(raw) == 0
      - set: env.override.Source
        value: sourceEnvironment
      - set: env.override.Raw
        to: strings
        value: strings.Join(raw, " ")
      - set: env.override.Applied
        to: env.applied
        value: env.applied()
      - return: env
  - of: (*operatorEnv).applyEngine
    participants:
      - id: caller
        kind: actor
      - id: (*operatorEnv).applyEngine
        kind: self
      - id: lookupCapability
        kind: internal
      - id: e.unknown
        kind: internal
    steps:
      - bind: entry, ok
        eval: lookupCapability(token)
        to: lookupCapability
      - opt:
          do:
            - eval: e.unknown(corenet.EnvEngine, token)
              to: e.unknown
            - return: ""
          when: "!ok || entry.kernel"
      - set: e.ceiling
        value: min(e.ceiling, entry.rank)
  - of: (*operatorEnv).applyDisable
    participants:
      - id: caller
        kind: actor
      - id: (*operatorEnv).applyDisable
        kind: self
      - id: strings
        kind: stdlib
      - id: lookupCapability
        kind: internal
      - id: e.unknown
        kind: internal
    steps:
      - loop:
          do:
            - bind: token
              eval: strings.TrimSpace(item)
              to: strings
            - opt:
                do:
                  - continue: true
                when: token == ""
            - bind: entry, ok
              eval: lookupCapability(token)
              to: lookupCapability
            - opt:
                do:
                  - eval: e.unknown(corenet.EnvDisable, token)
                    to: e.unknown
                  - continue: true
                when: "!ok || !entry.switchable"
            - opt:
                do:
                  - opt:
                      do:
                        - set: e.kernelOff
                          value: append(e.kernelOff, entry.token)
                        - set: e.override.Disabled
                          value: append(e.override.Disabled, entry.token)
                      when: "!slices.Contains(e.kernelOff, entry.token)"
                  - continue: true
                when: entry.kernel
            - opt:
                do:
                  - set: e.disabled[entry.rank]
                    value: "true"
                  - set: e.override.Disabled
                    value: append(e.override.Disabled, entry.token)
                when: "!e.disabled[entry.rank]"
          key: item
          range: strings.SplitSeq(list, ",")
  - of: (*operatorEnv).unknown
