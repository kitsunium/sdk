      - opt:
          do:
            - return: v4.String()
              to: v4.String
          init:
            bind: v4
            eval: ip.To4()
            to: ip.To4
          when: v4 != nil
      - return: ip.Mask(stdnet.CIDRMask(64, 128)).String() + "/64"
