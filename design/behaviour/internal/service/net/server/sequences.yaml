        kind: internal
    steps:
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: conns
        eval: slices.Clone(s.packetConns)
        to: slices
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - bind: draining
        eval: make([]*boundPacketConn, 0, len(conns))
      - loop:
          do:
            - opt:
                do:
                  - set: draining
                    value: append(draining, bound)
                when: bound.handover()
          key: _
          range: conns
          value: bound
      - bind: wait, cancel
        eval: context.WithTimeout(ctx, handoverBudget)
        to: context
      - defer: cancel()
      - loop:
          do:
            - select:
                cases:
                  - comm: <-bound.done
                  - comm: <-wait.Done()
                    do:
                      - eval: bound.stopGRO()
                        to: bound.stopGRO
          key: _
          range: draining
          value: bound
