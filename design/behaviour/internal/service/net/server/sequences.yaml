      - id: waiter.hijacked.Store
        kind: value
      - id: waiter.release
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: state != http.StateClosed && state != http.StateHijacked
      - eval: a.mu.Lock()
        to: a.mu.Lock
      - bind: waiter, waiting
        eval: a.waiters[raw]
      - opt:
          do:
            - eval: delete(a.waiters, raw)
          when: waiting
      - eval: a.mu.Unlock()
        to: a.mu.Unlock
      - opt:
