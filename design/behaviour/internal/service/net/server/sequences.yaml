  - of: (*Server).readLoop
    participants:
      - id: caller
        kind: actor
      - id: (*Server).readLoop
        kind: self
      - id: s.inFlight.Done
        kind: value
      - id: bound.finish
        kind: internal
      - id: packetSize
        kind: internal
      - id: newSlots
        kind: internal
      - id: held.reset
        kind: internal
      - id: reader.readBatch
        kind: internal
      - id: bound.sink.begin
        kind: internal
      - id: s.dispatch
        kind: internal
      - id: bound.sink.flush
        kind: internal
    steps:
      - defer: s.inFlight.Done()
        to: s.inFlight.Done
      - defer: bound.finish()
        to: bound.finish
      - bind: ceiling
        eval: packetSize(group.limits)
        to: packetSize
      - bind: reader
        eval: bound.source
      - bind: slots
        eval: newSlots(batchSize(group.limits), reader.slotSize(ceiling))
        to: newSlots
      - bind: held
        eval: "&packet{conn: bound.pc, sink: bound.sink, group: group.name}"
      - defer: held.reset()
        to: held.reset
      - loop:
          do:
            - bind: count, err
              eval: reader.readBatch(slots)
              to: reader.readBatch
            - opt:
                do:
                  - opt:
                      do:
                        - return: ""
                      when: errors.Is(err, stdnet.ErrClosed)
                  - continue: true
                when: err != nil
            - eval: bound.sink.begin()
              to: bound.sink.begin
            - eval: s.dispatch(slots[:count], held, handler, ceiling)
              to: s.dispatch
            - eval: bound.sink.flush()
              to: bound.sink.flush
          forever: true
  - of: (*Server).dispatch
    participants:
      - id: caller
        kind: actor
      - id: (*Server).dispatch
        kind: self
      - id: s.datagrams.truncated.Add
        kind: value
      - id: s.serveMessage
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - eval: s.datagrams.truncated.Add(1)
                    to: s.datagrams.truncated.Add
                  - continue: true
                when: slots[i].cut
            - eval: s.serveMessage(&slots[i], held, handler, ceiling)
              to: s.serveMessage
          key: i
          range: slots
      - set: held.data
        value: nil
      - set: held.from
        value: nil
  - of: (*Server).serveMessage
    participants:
      - id: caller
        kind: actor
      - id: (*Server).serveMessage
        kind: self
      - id: slot.segment
        kind: internal
      - id: s.total.Add
        kind: value
      - id: s.oversized.Add
        kind: value
      - id: s.nextID.Add
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - loop:
          do:
            - bind: data, ok
              eval: slot.segment(j)
              to: slot.segment
            - opt:
                do:
                  - return: ""
                when: "!ok"
            - eval: s.total.Add(1)
              to: s.total.Add
            - opt:
                do:
                  - eval: s.oversized.Add(1)
                    to: s.oversized.Add
                  - continue: true
                when: len(data) > ceiling
            - set: held.data
              value: data
            - set: held.from
              value: slot.addr
            - set: held.id
              to: s.nextID.Add
              value: s.nextID.Add(1)
            - eval: swallowErr(s.servePacket(held, handler))
              to: swallowErr
          init: j := 0
          post: j++
  - of: (*Server).servePacket
    participants:
      - id: caller
        kind: actor
      - id: (*Server).servePacket
        kind: self
      - id: recoverHandler
        kind: internal
      - id: handler.ServePacket
        kind: value
    steps:
      - defer: recoverHandler()
        to: recoverHandler
      - return: handler.ServePacket(s.runCtx, p)
        to: handler.ServePacket
  - of: readPlatform
    steps:
      - return: |-
          corenet.PlatformValue{
          		GOOS: runtime.GOOS, GOARCH: runtime.GOARCH,
          		Kernel: kernelRelease(), Go: runtime.Version(),
          	}
  - of: kernelRelease
    participants:
      - id: caller
        kind: actor
      - id: kernelRelease
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - var:
          name: u
          type: syscall.Utsname
      - opt:
          do:
            - return: "\"\""
          init:
            bind: err
            eval: syscall.Uname(&u)
            to: syscall
          when: err != nil
      - bind: buf
        eval: make([]byte, 0, len(u.Release))
      - loop:
          do:
            - opt:
                do:
                  - break: true
                when: c == 0
            - set: buf
              value: append(buf, byte(c))
          key: _
          range: u.Release
          value: c
      - return: string(buf)
  - of: (*Server).acquire
    participants:
      - id: caller
        kind: actor
      - id: (*Server).acquire
        kind: self
      - id: s.connPool.Get
        kind: value
      - id: s.nextID.Add
        kind: value
      - id: s.liveMu.Lock
        kind: value
      - id: s.liveMu.Unlock
        kind: value
      - id: buffer
        kind: package
    steps:
      - bind: c
        eval: s.connPool.Get()
        to: s.connPool.Get
      - set: c.Conn
        value: raw
      - set: c.id
        to: s.nextID.Add
        value: s.nextID.Add(1)
      - set: c.group
        value: group.name
      - set: c.timeouts
        value: group.timeouts
      - eval: s.liveMu.Lock()
        to: s.liveMu.Lock
      - set: s.live[c.id]
        value: raw
      - eval: s.liveMu.Unlock()
        to: s.liveMu.Unlock
      - opt:
          do:
            - set: c.scratch
              to: buffer
              value: buffer.Get()
            - opt:
                do:
                  - set: c.scratch
                    value: new(make([]byte, size))
                when: cap(*c.scratch) < size
            - set: "*c.scratch"
              value: (*c.scratch)[:size]
          init:
            bind: size
            eval: group.limits.ReadBufferSize
          when: size > 0
      - return: c
  - of: (*Server).release
    participants:
      - id: caller
        kind: actor
      - id: (*Server).release
        kind: self
      - id: s.liveMu.Lock
        kind: value
      - id: s.liveMu.Unlock
        kind: value
      - id: swallowErr
        kind: internal
      - id: buffer
        kind: package
      - id: c.reset
        kind: internal
      - id: s.connPool.Put
        kind: value
    steps:
      - eval: s.liveMu.Lock()
        to: s.liveMu.Lock
      - eval: delete(s.live, c.id)
      - eval: s.liveMu.Unlock()
        to: s.liveMu.Unlock
      - opt:
          do:
            - eval: swallowErr(c.closeGracefully())
              to: swallowErr
          when: "!c.hijacked"
      - opt:
          do:
            - eval: buffer.Put(c.scratch)
              to: buffer
          when: c.scratch != nil
      - eval: c.reset()
        to: c.reset
      - eval: s.connPool.Put(c)
        to: s.connPool.Put
  - of: (*Server).closeLive
    participants:
      - id: caller
        kind: actor
      - id: (*Server).closeLive
        kind: self
      - id: s.liveMu.RLock
        kind: value
      - id: slices
        kind: stdlib
      - id: s.liveMu.RUnlock
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - eval: s.liveMu.RLock()
        to: s.liveMu.RLock
      - bind: sockets
        eval: slices.Collect(maps.Values(s.live))
        to: slices
      - eval: s.liveMu.RUnlock()
        to: s.liveMu.RUnlock
      - loop:
          do:
            - eval: swallowErr(socket.Close())
              to: swallowErr
          key: _
          range: sockets
          value: socket
  - of: newQueuedSink
    steps:
      - return: |-
          &queuedSink{
          		pc: pc, counters: counters,
          		arena: make([]byte, replyArena), queue: make([]queuedReply, 0, replyQueue),
          	}
  - of: (*queuedSink).begin
    participants:
      - id: caller
        kind: actor
      - id: (*queuedSink).begin
        kind: self
      - id: w.mu.Lock
        kind: value
      - id: w.mu.Unlock
        kind: value
    steps:
      - eval: w.mu.Lock()
        to: w.mu.Lock
      - set: w.open
        value: "true"
      - eval: w.mu.Unlock()
        to: w.mu.Unlock
  - of: (*queuedSink).reply
    participants:
      - id: caller
        kind: actor
      - id: (*queuedSink).reply
        kind: self
      - id: w.mu.Lock
        kind: value
      - id: w.mu.Unlock
        kind: value
      - id: w.pc.WriteTo
        kind: value
      - id: w.flushLocked
        kind: internal
    steps:
      - eval: w.mu.Lock()
        to: w.mu.Lock
      - opt:
          do:
            - eval: w.mu.Unlock()
              to: w.mu.Unlock
            - return: w.pc.WriteTo(b, to)
              to: w.pc.WriteTo
          when: "!w.open || len(b) > len(w.arena)"
      - opt:
          do:
            - eval: w.flushLocked()
              to: w.flushLocked
          when: len(w.queue) == cap(w.queue) || w.used+len(b) > len(w.arena)
      - set: w.queue
        value: "append(w.queue, queuedReply{off: w.used, size: len(b), to: to})"
      - eval: copy(w.arena[w.used:], b)
      - op: +=
        set: w.used
        value: len(b)
      - eval: w.mu.Unlock()
        to: w.mu.Unlock
      - return: len(b), nil
  - of: (*queuedSink).flush
    participants:
      - id: caller
        kind: actor
      - id: (*queuedSink).flush
        kind: self
      - id: w.mu.Lock
        kind: value
      - id: w.flushLocked
        kind: internal
      - id: w.mu.Unlock
        kind: value
    steps:
      - eval: w.mu.Lock()
        to: w.mu.Lock
      - eval: w.flushLocked()
        to: w.flushLocked
      - set: w.open
        value: "false"
      - eval: w.mu.Unlock()
        to: w.mu.Unlock
  - of: (*queuedSink).flushLocked
    participants:
      - id: caller
        kind: actor
      - id: (*queuedSink).flushLocked
        kind: self
      - id: w.pc.WriteTo
        kind: value
      - id: w.counters.replyFailures.Add
        kind: value
    steps:
      - loop:
          do:
            - bind: r
              eval: "&w.queue[i]"
            - opt:
                do:
                  - eval: w.counters.replyFailures.Add(1)
                    to: w.counters.replyFailures.Add
                init:
                  bind: _, err
                  eval: w.pc.WriteTo(w.arena[r.off:r.off+r.size], r.to)
                  to: w.pc.WriteTo
                when: err != nil
            - set: r.to
              value: nil
          key: i
          range: w.queue
      - set: w.queue
        value: w.queue[:0]
      - set: w.used
        value: "0"
  - of: reusePortSupported
    steps:
      - return: "true"
  - of: setReusePort
    participants:
      - id: caller
        kind: actor
      - id: setReusePort
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - return: syscall.SetsockoptInt(int(fd), syscall.SOL_SOCKET, soReusePort, 1)
        to: syscall
  - of: newPooledConn
    steps:
      - return: "&conn{}"
  - of: New
    participants:
      - id: caller
        kind: actor
      - id: New
        kind: self
      - id: newServer
        kind: internal
    steps:
      - return: newServer(os.LookupEnv, opts...)
        to: newServer
  - of: newServer
    participants:
      - id: caller
        kind: actor
      - id: newServer
        kind: self
      - id: readOperator
        kind: internal
      - id: readPlatform
        kind: internal
      - id: context
        kind: stdlib
      - id: s.phase.Store
        kind: value
    steps:
      - bind: s
        eval: |-
          &Server{
          		byName:       make(map[string]*StreamGroup, expectedGroups),
          		packetByName: make(map[string]*PacketGroup, expectedGroups),
          		live:         make(map[uint64]stdnet.Conn, expectedLiveConns),
          		drainTimeout: defaultDrainTimeout,
          		connPool:     recycler.NewPool(newPooledConn),
          		clk:          clock.System,
          		lookup:       lookup,
          		stall:        stallWatch{stalled: make(chan struct{})},
          	}
      - loop:
          do:
            - eval: opt(s)
          key: _
          range: opts
          value: opt
      - set: s.operator
        to: readOperator
        value: readOperator(s.lookup)
      - set: s.platform
        to: readPlatform
        value: readPlatform()
      - set: s.runCtx
        to: context
        value: context.Background()
      - eval: s.phase.Store(uint32(corenet.PhaseNew))
        to: s.phase.Store
      - return: s
  - of: (*Server).Group
    participants:
      - id: caller
        kind: actor
      - id: (*Server).Group
        kind: self
      - id: group.reconcileName
        kind: internal
      - id: s.recordDeclError
        kind: internal
    steps:
      - bind: group
        eval: "&StreamGroup{name: name}"
      - loop:
          do:
            - eval: opt(group)
          key: _
          range: opts
          value: opt
      - eval: group.reconcileName()
        to: group.reconcileName
      - set: name
        value: group.name
      - lock:
          mutex: s.mu
      - opt:
          do:
            - eval: |-
                s.recordDeclError(errs.Wrap(corenet.GroupDuplicate, errs.WrapParams{},
                			errs.String("group", name)))
              to: s.recordDeclError
            - return: "&StreamGroup{name: name}"
          init:
            bind: _, exists
            eval: s.byName[name]
          when: exists
      - set: s.byName[name]
        value: group
      - set: s.groups
        value: append(s.groups, group)
      - return: group
  - of: (*Server).PacketGroup
    participants:
      - id: caller
        kind: actor
      - id: (*Server).PacketGroup
        kind: self
      - id: shim.reconcileName
        kind: internal
      - id: s.recordDeclError
        kind: internal
      - id: s.judgePacketOptions
        kind: internal
      - id: shim.kinds.has
        kind: internal
    steps:
      - bind: shim
        eval: "&StreamGroup{name: name}"
      - loop:
          do:
            - eval: opt(shim)
          key: _
          range: opts
          value: opt
      - eval: shim.reconcileName()
        to: shim.reconcileName
      - set: name
        value: shim.name
      - lock:
          mutex: s.mu
      - bind: _, streamTaken
        eval: s.byName[name]
      - bind: _, packetTaken
        eval: s.packetByName[name]
      - opt:
          do:
            - eval: |-
                s.recordDeclError(errs.Wrap(corenet.GroupDuplicate, errs.WrapParams{},
                			errs.String("group", name)))
              to: s.recordDeclError
            - return: "&PacketGroup{name: name}"
          when: streamTaken || packetTaken
      - bind: group
        eval: "&PacketGroup{name: name}"
      - eval: s.judgePacketOptions(shim)
        to: s.judgePacketOptions
      - set: group.addrs
        value: shim.addrs
      - set: group.limits
        value: shim.limits
      - set: group.adopt
        value: shim.adopt
      - set: group.batchReplies
        to: shim.kinds.has
        value: shim.kinds.has(corenet.OptionBatchReplies)
      - set: s.packetByName[name]
        value: group
      - set: s.packetGroups
        value: append(s.packetGroups, group)
      - return: group
  - of: (*Server).judgePacketOptions
    participants:
      - id: caller
        kind: actor
      - id: (*Server).judgePacketOptions
        kind: self
      - id: s.recordDeclError
        kind: internal
      - id: shim.engineRefusal
        kind: internal
    steps:
      - opt:
          do:
            - eval: s.recordDeclError(shim.declErr)
              to: s.recordDeclError
          when: shim.declErr != nil
      - opt:
          do:
            - eval: |-
                s.recordDeclError(errs.Wrap(corenet.LoopOptionUnsupported, errs.WrapParams{},
                			errs.String("group", shim.name), errs.String("option", "Loop")))
              to: s.recordDeclError
          when: shim.loopSet
      - opt:
          do:
            - eval: s.recordDeclError(err)
              to: s.recordDeclError
          init:
            bind: err
            eval: shim.engineRefusal()
            to: shim.engineRefusal
          when: err != nil
      - loop:
          do:
            - opt:
                do:
                  - eval: |-
                      s.recordDeclError(errs.Wrap(corenet.PacketOptionUnsupported, errs.WrapParams{},
                      				errs.String("group", shim.name), errs.String("option", k.String())))
                    to: s.recordDeclError
                  - return: ""
                when: "!packetHonours(k)"
          key: _
          range: shim.kinds.list()
          value: k
  - of: packetHonours
    steps:
      - switch:
          cases:
            - case: corenet.OptionMaxPacketSize, corenet.OptionBatchSize, corenet.OptionBatchReplies, corenet.OptionAdopt, corenet.OptionName, corenet.OptionEngine, corenet.OptionPlaintext
              do:
                - return: "true"
            - default: true
              do:
                - return: "false"
          "on": k
  - of: (*Server).recordDeclError
    steps:
      - opt:
          do:
            - set: s.declErr
              value: err
          when: s.declErr == nil
  - of: (*Server).State
    participants:
      - id: caller
        kind: actor
      - id: (*Server).State
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: slices
        kind: stdlib
      - id: s.mu.RUnlock
        kind: value
      - id: s.fallbackMu.Lock
        kind: value
      - id: s.fallbackMu.Unlock
        kind: value
      - id: s.faults
        kind: internal
    steps:
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: listeners
        eval: slices.Clone(s.states)
        to: slices
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - eval: s.fallbackMu.Lock()
        to: s.fallbackMu.Lock
      - bind: fallbacks
        eval: s.fallbacks
      - eval: s.fallbackMu.Unlock()
        to: s.fallbackMu.Unlock
      - bind: override
        eval: s.operator.override
      - set: override.Disabled
        to: slices
        value: slices.Clone(override.Disabled)
      - bind: st
        eval: |-
          corenet.StateValue{
          		Phase:            corenet.Phase(s.phase.Load()),
          		Listeners:        listeners,
          		ActiveConns:      s.active.Load(),
          		TotalConns:       s.total.Load(),
          		RejectedConns:    s.rejected.Load(),
          		OversizedPackets: s.oversized.Load(),
          		AcceptBackoffs:   s.acceptBackoffs.Load(),
          		Datagrams: corenet.DatagramStateValue{
          			TruncatedPackets: s.datagrams.truncated.Load(),
          			GSOOversized:     s.datagrams.gsoOversized.Load(),
          			ReplyFailures:    s.datagrams.replyFailures.Load(),
          		},
          		Loops:     s.loopStates(),
          		Override:  override,
          		Fallbacks: fallbacks,
          		Platform:  s.platform,
          	}
      - set: st.Faults
        to: s.faults
        value: s.faults(st)
      - return: st
  - of: (*Server).recordFallback
    participants:
      - id: caller
        kind: actor
      - id: (*Server).recordFallback
        kind: self
      - id: s.clk.Now
        kind: value
    steps:
      - lock:
          mutex: s.fallbackMu
      - op: ++
        set: s.fallbacks.Count
      - set: s.fallbacks.LastGroup
        value: group
      - set: s.fallbacks.LastReason
        value: reason
      - set: s.fallbacks.LastAt
        to: s.clk.Now
        value: s.clk.Now()
  - of: (*Server).HTTP
    participants:
      - id: caller
        kind: actor
      - id: (*Server).HTTP
        kind: self
      - id: s.simpleGroup
        kind: internal
      - id: g.mountHTTPEntry
        kind: internal
      - id: g.recordErr
        kind: internal
    steps:
      - bind: g
        eval: s.simpleGroup("tcp", addr, opts)
        to: s.simpleGroup
      - opt:
          do:
            - eval: g.recordErr(err)
              to: g.recordErr
          init:
            bind: err
            eval: g.mountHTTPEntry(h)
            to: g.mountHTTPEntry
          when: err != nil
      - return: g
  - of: (*Server).TCP
    participants:
      - id: caller
        kind: actor
      - id: (*Server).TCP
        kind: self
      - id: s.simpleGroup
        kind: internal
      - id: g.mountTCPEntry
        kind: internal
      - id: g.recordErr
        kind: internal
    steps:
      - bind: g
        eval: s.simpleGroup("tcp", addr, opts)
        to: s.simpleGroup
      - opt:
          do:
            - eval: g.recordErr(err)
              to: g.recordErr
          init:
            bind: err
            eval: g.mountTCPEntry(h)
            to: g.mountTCPEntry
          when: err != nil
      - return: g
  - of: (*Server).UDP
    participants:
      - id: caller
        kind: actor
      - id: (*Server).UDP
        kind: self
      - id: s.PacketGroup
        kind: internal
      - id: g.mountUDPEntry
        kind: internal
      - id: s.recordGroupErr
        kind: internal
    steps:
      - bind: g
        eval: s.PacketGroup("", append([]GroupOption{Listen("udp", addr), defaultName("udp+" + addr)}, opts...)...)
        to: s.PacketGroup
      - opt:
          do:
            - eval: s.recordGroupErr(err)
              to: s.recordGroupErr
          init:
            bind: err
            eval: g.mountUDPEntry(h)
            to: g.mountUDPEntry
          when: err != nil
      - return: g
  - of: (*PacketGroup).mountUDPEntry
    participants:
      - id: caller
        kind: actor
      - id: (*PacketGroup).mountUDPEntry
        kind: self
      - id: errs
        kind: package
      - id: unsupported
        kind: internal
      - id: g.Handle
        kind: internal
    steps:
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.HandlerMissing, errs.WrapParams{},
                			errs.String("group", g.name), errs.String("entry", entryUDP))
              to: errs
          when: isNil(h)
      - bind: ph, ok
        eval: h.(corenet.PacketHandler)
      - opt:
          do:
            - return: unsupported(g.name, entryUDP, h)
              to: unsupported
          when: "!ok"
      - eval: g.Handle(ph)
        to: g.Handle
      - return: nil
  - of: (*Server).simpleGroup
    participants:
      - id: caller
        kind: actor
      - id: (*Server).simpleGroup
        kind: self
      - id: s.Group
        kind: internal
    steps:
      - return: s.Group("", append([]GroupOption{Listen(network, addr), defaultName(network + "+" + addr)}, opts...)...)
        to: s.Group
  - of: defaultName
    steps:
      - return:
          closure:
            params: g *StreamGroup
            steps:
              - set: g.name, g.defaultName
                value: name, name
  - of: (*Server).recordGroupErr
    participants:
      - id: caller
        kind: actor
      - id: (*Server).recordGroupErr
        kind: self
      - id: s.recordDeclError
        kind: internal
    steps:
      - lock:
          mutex: s.mu
      - eval: s.recordDeclError(err)
        to: s.recordDeclError
  - of: (*StreamGroup).recordErr
    steps:
      - opt:
          do:
            - set: g.declErr
              value: err
          when: g.declErr == nil
  - of: (*StreamGroup).mountHTTPEntry
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).mountHTTPEntry
        kind: self
      - id: g.missing
        kind: internal
      - id: g.HandleHTTP
        kind: internal
      - id: g.HandleLoop
        kind: internal
      - id: g.pickRefusal
        kind: internal
    steps:
      - opt:
          do:
            - return: g.missing(entryHTTP)
              to: g.missing
          when: isNil(h)
      - bind: std, isStd
        eval: h.(http.Handler)
      - bind: h1, isH1
        eval: h.(corenet.HTTP1Handler)
      - switch:
          cases:
            - case: corenet.EngineGoroutine
              do:
                - eval: g.HandleHTTP(std)
                  to: g.HandleHTTP
            - case: corenet.EngineLoop
              do:
                - eval: g.HandleLoop(http1.HandleLoop(h1, http1.Parser{}))
                  to: g.HandleLoop
            - default: true
              do:
                - return: g.pickRefusal(entryHTTP, h, isStd, isH1)
                  to: g.pickRefusal
          "on": g.pickEngine(isStd, isH1)
      - return: nil
  - of: (*StreamGroup).mountTCPEntry
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).mountTCPEntry
        kind: self
      - id: g.missing
        kind: internal
      - id: errs
        kind: package
      - id: g.Handle
        kind: internal
      - id: g.HandleLoop
        kind: internal
      - id: g.pickRefusal
        kind: internal
    steps:
      - opt:
          do:
            - return: g.missing(entryTCP)
              to: g.missing
          when: isNil(h)
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.HandlerUnsupported, errs.WrapParams{},
                			errs.String("group", g.name), errs.String("entry", entryTCP), errs.String("type", typeName(h)),
                			errs.String("serve", entryHTTP))
              to: errs
          when: isHTTPHandler(h)
      - bind: conn, isConn
        eval: h.(corenet.ConnHandler)
      - bind: lh, isLoop
        eval: h.(corenet.LoopHandler)
      - switch:
          cases:
            - case: corenet.EngineGoroutine
              do:
                - eval: g.Handle(conn)
                  to: g.Handle
            - case: corenet.EngineLoop
              do:
                - eval: g.HandleLoop(lh)
                  to: g.HandleLoop
            - default: true
              do:
                - return: g.pickRefusal(entryTCP, h, isConn, isLoop)
                  to: g.pickRefusal
          "on": g.pickEngine(isConn, isLoop)
      - return: nil
  - of: (*StreamGroup).pickEngine
    steps:
      - bind: e
        eval: corenet.EngineAuto
      - opt:
          do:
            - set: e
              value: g.engine
          when: g.kinds.has(corenet.OptionEngine)
      - opt:
          do:
            - return: corenet.EngineGoroutine
          when: goroutine && fits(e, corenet.EngineGoroutine, loop)
      - opt:
          do:
            - return: corenet.EngineLoop
          when: loop && fits(e, corenet.EngineLoop, goroutine)
      - return: corenet.EngineAuto
  - of: fits
    steps:
      - return: e == want || (e == corenet.EngineAuto && !other)
  - of: (*StreamGroup).pickRefusal
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).pickRefusal
        kind: self
      - id: errs
        kind: package
      - id: unsupported
        kind: internal
    steps:
      - switch:
          cases:
            - case: goroutine && loop && !g.kinds.has(corenet.OptionEngine)
              do:
                - return: |-
                    errs.Wrap(corenet.HandlerAmbiguous, errs.WrapParams{},
                    			errs.String("group", g.name), errs.String("entry", entry), errs.String("type", typeName(h)))
                  to: errs
            - case: goroutine || loop
              do:
                - return: |-
                    errs.Wrap(corenet.EngineUnsupported, errs.WrapParams{},
                    			errs.String("group", g.name), errs.String("engine", g.engine.String()))
                  to: errs
            - default: true
              do:
                - return: unsupported(g.name, entry, h)
                  to: unsupported
  - of: (*StreamGroup).missing
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).missing
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(corenet.HandlerMissing, errs.WrapParams{},
          		errs.String("group", g.name), errs.String("entry", entry))
        to: errs
  - of: unsupported
    participants:
      - id: caller
        kind: actor
      - id: unsupported
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(corenet.HandlerUnsupported, errs.WrapParams{},
          		errs.String("group", group), errs.String("entry", entry), errs.String("type", typeName(h)))
        to: errs
  - of: isHTTPHandler
    steps:
      - bind: _, std
        eval: h.(http.Handler)
      - bind: _, h1
        eval: h.(corenet.HTTP1Handler)
      - return: std || h1
  - of: isNil
    participants:
      - id: caller
        kind: actor
      - id: isNil
        kind: self
      - id: reflect
        kind: stdlib
      - id: v.IsNil
        kind: value
    steps:
      - opt:
          do:
            - return: "true"
          when: h == nil
      - bind: v
        eval: reflect.ValueOf(h)
        to: reflect
      - switch:
          cases:
            - case: reflect.Pointer, reflect.Map, reflect.Func, reflect.Interface, reflect.Slice, reflect.Chan
              do:
                - return: v.IsNil()
                  to: v.IsNil
            - default: true
              do:
                - return: "false"
          "on": v.Kind()
  - of: typeName
    participants:
      - id: caller
        kind: actor
      - id: typeName
        kind: self
      - id: reflect.TypeOf(h).String
        kind: value
    steps:
      - return: reflect.TypeOf(h).String()
        to: reflect.TypeOf(h).String
  - of: (*StreamGroup).servesHTTP
    steps:
      - bind: _, h1
        eval: g.loopHandler.(*http1.LoopHandler)
      - return: g.httpAdapter != nil || h1
  - of: (*StreamGroup).plaintextRefusal
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).plaintextRefusal
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: nil
          when: "!g.servesHTTP() || g.kinds.has(corenet.OptionTLS) || g.kinds.has(corenet.OptionPlaintext)"
      - return: errs.Wrap(corenet.PlaintextRequired, errs.WrapParams{}, errs.String("group", g.name))
        to: errs
  - of: sockaddrToAddr
    participants:
      - id: caller
        kind: actor
      - id: sockaddrToAddr
        kind: self
      - id: inet4Addr
        kind: internal
      - id: inet6Addr
        kind: internal
      - id: unixAddr
        kind: internal
    steps:
      - switch:
          cases:
            - case: syscall.AF_INET
              do:
                - return: inet4Addr(raw)
                  to: inet4Addr
            - case: syscall.AF_INET6
              do:
                - return: inet6Addr(raw)
                  to: inet6Addr
            - case: syscall.AF_UNIX
              do:
                - return: unixAddr(raw)
                  to: unixAddr
            - default: true
              do:
                - return: nil
          "on": raw.Addr.Family
  - of: inet4Addr
    steps:
      - bind: sa
        eval: (*syscall.RawSockaddrInet4)(unsafe.Pointer(raw))
      - bind: ip
        eval: make(stdnet.IP, stdnet.IPv4len)
      - eval: copy(ip, sa.Addr[:])
      - return: "&stdnet.UDPAddr{IP: ip, Port: hostPort(sa.Port)}"
  - of: inet6Addr
    participants:
      - id: caller
        kind: actor
      - id: inet6Addr
        kind: self
      - id: zoneOf
        kind: internal
    steps:
      - bind: sa
        eval: (*syscall.RawSockaddrInet6)(unsafe.Pointer(raw))
      - bind: ip
        eval: make(stdnet.IP, stdnet.IPv6len)
      - eval: copy(ip, sa.Addr[:])
      - bind: zone, _
        eval: zoneOf(sa.Scope_id)
        to: zoneOf
      - return: "&stdnet.UDPAddr{IP: ip, Port: hostPort(sa.Port), Zone: zone}"
  - of: hostPort
    steps:
      - return: int(port>>portByteShift) | int(port&portLowByteMask)<<portByteShift
  - of: zoneOf
    participants:
      - id: caller
        kind: actor
      - id: zoneOf
        kind: self
      - id: stdnet
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "\"\", false"
          when: scope == 0
      - bind: iface, err
        eval: stdnet.InterfaceByIndex(int(scope))
        to: stdnet
      - opt:
          do:
            - return: "\"\", false"
          when: err != nil
      - return: iface.Name, true
  - of: (*Server).startStallWatch
    participants:
      - id: caller
        kind: actor
      - id: (*Server).startStallWatch
        kind: self
      - id: worker
        kind: package
    steps:
      - lock:
          mutex: s.mu
      - opt:
          do:
            - return: ""
          when: len(s.loopEngines) == 0 || s.stall.daemon != nil
      - set: s.stall.daemon
        to: worker
        value: worker.Every(stallPoll, s.checkStalls, worker.WithClock(s.clk))
  - of: (*Server).stopStallWatch
    participants:
      - id: caller
        kind: actor
      - id: (*Server).stopStallWatch
        kind: self
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
      - id: daemon.Stop
        kind: value
    steps:
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - bind: daemon
        eval: s.stall.daemon
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - opt:
          do:
            - return: ""
          when: daemon == nil
      - eval: daemon.Stop()
        to: daemon.Stop
  - of: (*Server).checkStalls
    participants:
      - id: caller
        kind: actor
      - id: (*Server).checkStalls
        kind: self
      - id: s.markStalled
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: corenet.Phase(s.phase.Load()) != corenet.PhaseServing
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: "!groupStalled(st)"
            - eval: s.markStalled(st.Group)
              to: s.markStalled
            - return: ""
          key: _
          range: s.loopStates()
          value: st
  - of: (*Server).markStalled
    participants:
      - id: caller
        kind: actor
      - id: (*Server).markStalled
        kind: self
      - id: s.stall.mu.Lock
        kind: value
      - id: s.clk.Now
        kind: value
      - id: s.stall.mu.Unlock
        kind: value
      - id: s.stall.once.Do
        kind: value
    steps:
      - eval: s.stall.mu.Lock()
        to: s.stall.mu.Lock
      - opt:
          do:
            - set: s.stall.group
              value: group
            - set: s.stall.at
              to: s.clk.Now
              value: s.clk.Now()
          when: s.stall.group == ""
      - eval: s.stall.mu.Unlock()
        to: s.stall.mu.Unlock
      - eval: s.stall.once.Do(func() { close(s.stall.stalled) })
        to: s.stall.once.Do
  - of: (*Server).stalledGroup
    steps:
      - lock:
          mutex: s.stall.mu
      - return: s.stall.group, s.stall.at
  - of: stallError
    participants:
      - id: caller
        kind: actor
      - id: stallError
        kind: self
      - id: errs
        kind: package
    steps:
      - return: errs.Wrap(corenet.LoopGroupStalled, errs.WrapParams{}, errs.String("group", group))
        to: errs
  - of: (*StreamGroup).Name
    steps:
      - return: g.name
  - of: (*StreamGroup).Handle
    steps:
      - opt:
          do:
            - return: g
          when: "!g.claimHandler()"
      - set: g.handler
        value: h
      - return: g
  - of: (*StreamGroup).claimHandler
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).claimHandler
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - set: g.declared
              value: "true"
            - return: "true"
          when: "!g.declared"
      - opt:
          do:
            - set: g.declErr
              to: errs
              value: |-
                errs.Wrap(corenet.HandlerAlreadySet, errs.WrapParams{},
                			errs.String("group", g.name))
          when: g.declErr == nil
      - return: "false"
  - of: (*StreamGroup).HandleFunc
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).HandleFunc
        kind: self
      - id: g.Handle
        kind: internal
    steps:
      - return: g.Handle(f)
        to: g.Handle
  - of: (*StreamGroup).HandleHTTP
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).HandleHTTP
        kind: self
      - id: g.mountHTTP
        kind: internal
    steps:
      - return: g.mountHTTP(h)
        to: g.mountHTTP
  - of: (*StreamGroup).mountHTTP
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).mountHTTP
        kind: self
      - id: newHTTPAdapter
        kind: internal
    steps:
      - opt:
          do:
            - return: g
          when: "!g.claimHandler()"
      - bind: adapter
        eval: newHTTPAdapter(h)
        to: newHTTPAdapter
      - set: g.httpAdapter
        value: adapter
      - set: g.handler
        value: adapter
      - return: g
  - of: (*StreamGroup).tracksCloses
    steps:
      - return: g.httpAdapter != nil && g.limiter != nil
  - of: (*StreamGroup).Use
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).Use
        kind: self
      - id: g.kinds.add
        kind: internal
    steps:
      - set: g.middlewares
        value: append(g.middlewares, middlewares...)
      - eval: g.kinds.add(corenet.OptionMiddleware)
        to: g.kinds.add
      - return: g
  - of: (*StreamGroup).UseLoop
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).UseLoop
        kind: self
      - id: g.kinds.add
        kind: internal
    steps:
      - set: g.loopMiddlewares
        value: append(g.loopMiddlewares, middlewares...)
      - eval: g.kinds.add(corenet.OptionLoopMiddleware)
        to: g.kinds.add
      - return: g
  - of: (*StreamGroup).resolved
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).resolved
        kind: self
      - id: corenet
        kind: package
    steps:
      - opt:
          do:
            - set: g.httpAdapter.timeouts
              value: g.timeouts
            - set: g.httpAdapter.bounds
              value: g.http
          when: g.httpAdapter != nil
      - bind: chained
        eval: corenet.Chain(g.handler, g.middlewares...)
        to: corenet
      - opt:
          do:
            - return: chained
          when: g.identity.IsZero()
      - return: "handshakeHandler{next: chained, timeouts: g.timeouts}"
  - of: newConnLimiter
    steps:
      - opt:
          do:
            - return: nil
          when: limits.MaxConns <= 0
      - return: |-
          &connLimiter{
          		slots:   make(chan struct{}, limits.MaxConns),
          		ceiling: limits.MaxConns,
          	}
  - of: (*connLimiter).tryAcquire
    steps:
      - select:
          cases:
            - comm: l.slots <- struct{}{}
              do:
                - return: "true"
            - default: true
              do:
                - return: "false"
  - of: (*connLimiter).release
    steps:
      - eval: <-l.slots
  - of: (*connLimiter).releaseFor
    participants:
      - id: caller
        kind: actor
      - id: (*connLimiter).releaseFor
        kind: self
      - id: hijackedTracker
        kind: internal
      - id: tracked.holdSlot
        kind: internal
      - id: l.release
        kind: internal
    steps:
      - opt:
          do:
            - eval: tracked.holdSlot(l)
              to: tracked.holdSlot
            - return: ""
          init:
            bind: tracked
            eval: hijackedTracker(c)
            to: hijackedTracker
          when: tracked != nil
      - eval: l.release()
        to: l.release
  - of: markRefused
    steps:
      - opt:
          do:
            - set: pooled.refused
              value: "true"
          init:
            bind: pooled, ok
            eval: c.(*conn)
          when: ok
  - of: (*Server).admit
    participants:
      - id: caller
        kind: actor
      - id: (*Server).admit
        kind: self
      - id: handler.ServeConn
        kind: value
      - id: s.rejected.Add
        kind: value
      - id: markRefused
        kind: internal
      - id: errs
        kind: package
      - id: limiter.releaseFor
        kind: internal
    steps:
      - opt:
          do:
            - return: handler.ServeConn(ctx, c)
              to: handler.ServeConn
          when: limiter == nil
      - opt:
          do:
            - eval: s.rejected.Add(1)
              to: s.rejected.Add
            - eval: markRefused(c)
              to: markRefused
            - return: |-
                errs.Wrap(corenet.ConnLimitReached, errs.WrapParams{},
                			errs.Int("limit", limiter.ceiling))
              to: errs
          when: "!limiter.tryAcquire()"
      - defer: limiter.releaseFor(c)
        to: limiter.releaseFor
      - return: handler.ServeConn(ctx, c)
        to: handler.ServeConn
  - of: swallowErr
    steps:
      - opt:
          do:
            - return: ""
          when: err == nil
  - of: datagramTruncated
    steps:
      - return: "false"
