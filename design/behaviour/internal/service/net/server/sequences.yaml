                    value: "\"socket buffers: \" + err.Error()"
                init:
                  bind: err
                  eval: applyBuffers(sc, spec)
                  to: applyBuffers
                when: err != nil
          when: sc != nil && (spec.receiveBuffer > 0 || spec.sendBuffer > 0)
      - set: receive, send
        to: socketBuffers
        value: socketBuffers(sc)
      - return: receive, send, reason
  - of: applyBuffers
    participants:
      - id: caller
        kind: actor
      - id: applyBuffers
        kind: self
      - id: sc.SyscallConn
        kind: value
      - id: bufferControl
        kind: internal
    steps:
      - bind: raw, err
        eval: sc.SyscallConn()
        to: sc.SyscallConn
      - opt:
          do:
            - return: err
          when: err != nil
      - return: bufferControl(spec, raw)
        to: bufferControl
  - of: (*StreamGroup).valueRefusalBuffers
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).valueRefusalBuffers
        kind: self
      - id: g.valueInvalid
        kind: internal
    steps:
      - opt:
          do:
            - return: g.valueInvalid(corenet.OptionReceiveBuffer)
              to: g.valueInvalid
          when: g.kinds.has(corenet.OptionReceiveBuffer) && g.limits.ReceiveBuffer < 0
      - opt:
          do:
            - return: g.valueInvalid(corenet.OptionSendBuffer)
              to: g.valueInvalid
          when: g.kinds.has(corenet.OptionSendBuffer) && g.limits.SendBuffer < 0
