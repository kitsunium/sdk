      - bind: read, addr, rerr
        eval: r.pc.ReadFrom(slots[0].buf)
        to: r.pc.ReadFrom
      - opt:
          do:
            - set: slots[0].n
              value: len(slots[0].buf)
            - set: slots[0].addr
              value: addr
            - return: 1, nil
          when: rerr != nil && datagramTruncated(rerr)
      - opt:
          do:
            - return: 0, rerr
          when: rerr != nil
      - set: slots[0].n
        value: read
      - set: slots[0].addr
        value: addr
      - return: 1, nil
