      - id: caller
        kind: actor
      - id: shardsFor
        kind: self
      - id: runtime
        kind: stdlib
    steps:
      - opt:
          do:
            - return: 1, false, ""
          when: requested == 1
      - opt:
          do:
            - opt:
                do:
                  - return: 1, true, "SO_REUSEPORT applies to IP sockets only; using a single listener"
                when: requested > 1
            - return: 1, false, ""
          when: "!shardable(network)"
      - opt:
          do:
            - opt:
                do:
                  - return: 1, true, "SO_REUSEPORT unavailable on this platform; using a single listener"
                when: requested > 1
            - return: 1, false, ""
          when: "!reusePort"
      - opt:
          do:
            - return: runtime.GOMAXPROCS(0), false, ""
              to: runtime
          when: requested <= 0
      - return: requested, false, ""
