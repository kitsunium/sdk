      - set: _, _
        value: network, address
      - var:
          name: setErr
          type: error
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: |-
              rawConn.Control(func(fd uintptr) {
              		setErr = setReusePort(fd)
              	})
            to: rawConn.Control
          when: err != nil
      - return: setErr
