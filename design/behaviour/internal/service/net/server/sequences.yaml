            - opt:
                do:
                  - return: nil
                when: s.active.Load() == 0
            - select:
                cases:
                  - comm: <-ctx.Done()
                    do:
                      - return: |-
                          errs.Wrap(corenet.DrainTimeout, errs.WrapParams{},
                          				errs.Int64("active", s.active.Load()))
                        to: errs
                  - comm: <-ticker.C
          forever: true
