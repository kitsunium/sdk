        kind: internal
    steps:
      - bind: bridge, srv, daemon
        eval: a.stop()
        to: a.stop
      - opt:
          do:
            - return: ""
          when: bridge == nil
      - eval: swallowErr(bridge.Close())
        to: swallowErr
      - eval: swallowErr(srv.Shutdown(ctx))
        to: swallowErr
      - select:
