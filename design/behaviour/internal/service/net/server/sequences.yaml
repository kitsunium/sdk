    participants:
      - id: caller
        kind: actor
      - id: (*httpAdapter).ServeConn
        kind: self
      - id: rawSocket
        kind: internal
      - id: a.start.Do
        kind: value
      - id: a.currentBridge
        kind: internal
      - id: a.register
        kind: internal
      - id: a.unregister
        kind: internal
      - id: markHijacked
        kind: internal
    steps:
      - bind: raw
        eval: rawSocket(c)
        to: rawSocket
      - eval: a.start.Do(func() { a.launch(raw) })
        to: a.start.Do
      - bind: bridge
        eval: a.currentBridge()
        to: a.currentBridge
      - opt:
          do:
            - return: corenet.ServerClosed
          when: bridge == nil
      - bind: waiter
        eval: a.register(raw)
        to: a.register
      - defer: a.unregister(raw)
        to: a.unregister
      - opt:
          do:
            - return: corenet.ServerClosed
          when: "!bridge.offer(raw)"
      - select:
          cases:
            - comm: <-waiter.done
            - comm: <-ctx.Done()
      - opt:
          do:
            - eval: markHijacked(c)
              to: markHijacked
          when: waiter.hijacked.Load()
      - return: nil
