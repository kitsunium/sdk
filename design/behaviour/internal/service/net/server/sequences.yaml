      - eval: s.phase.Store(uint32(corenet.PhaseStarting))
        to: s.phase.Store
      - bind: groups
        eval: slices.Clone(s.groups)
        to: slices
      - bind: packetGroups
        eval: slices.Clone(s.packetGroups)
        to: slices
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - bind: runCtx, cancel
        eval: context.WithCancel(context.WithoutCancel(ctx))
        to: context
      - set: s.runCtx
        value: runCtx
      - set: s.stop
        value: cancel
      - opt:
          do:
            - opt:
                do:
                  - return: |-
                      errs.Wrap(corenet.ListenFailed, errs.WrapParams{},
                      				errs.String("cause", err.Error()), errs.String("cleanup", cerr.Error()))
                    to: errs
                init:
                  bind: cerr
                  eval: s.Close()
                  to: s.Close
                when: cerr != nil
            - return: err
          init:
            bind: err
            eval: s.bindEverything(ctx, groups, packetGroups)
            to: s.bindEverything
          when: err != nil
      - eval: s.phase.Store(uint32(corenet.PhaseServing))
        to: s.phase.Store
      - eval: s.startStallWatch()
        to: s.startStallWatch
      - return: nil
  - of: groupDeclErr
    participants:
      - id: caller
        kind: actor
      - id: groupDeclErr
        kind: self
      - id: group.startRefusal
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: group.startRefusal()
                  to: group.startRefusal
                when: err != nil
          key: _
          range: groups
          value: group
      - return: nil
  - of: (*StreamGroup).startRefusal
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).startRefusal
        kind: self
      - id: g.engineRefusal
        kind: internal
      - id: g.plaintextRefusal
        kind: internal
      - id: errs
        kind: package
      - id: shareRefusal
        kind: internal
      - id: g.loopRefusal
        kind: internal
      - id: g.valueRefusal
        kind: internal
      - id: g.protocolsRefusal
        kind: internal
    steps:
      - opt:
          do:
            - return: g.declErr
          when: g.declErr != nil
      - opt:
          do:
            - return: nil
          when: g.loopHandler == nil && g.handler == nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: g.engineRefusal()
            to: g.engineRefusal
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: g.plaintextRefusal()
            to: g.plaintextRefusal
          when: err != nil
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.LoopOptionUnsupported, errs.WrapParams{},
                			errs.String("group", g.name), errs.String("option", corenet.OptionBatchReplies.String()))
              to: errs
          when: g.kinds.has(corenet.OptionBatchReplies)
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: shareRefusal(g, corenet.LoopOptionUnsupported)
            to: shareRefusal
          when: err != nil
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.LoopOptionUnsupported, errs.WrapParams{},
                			errs.String("group", g.name), errs.String("option", corenet.OptionSteer.String()))
              to: errs
          when: g.kinds.has(corenet.OptionSteer)
      - opt:
          do:
            - return: g.loopRefusal()
              to: g.loopRefusal
          when: g.loopHandler != nil
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.LoopOptionUnsupported, errs.WrapParams{},
                			errs.String("group", g.name), errs.String("option", "Loop"))
              to: errs
          when: g.loopSet
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.LoopOptionUnsupported, errs.WrapParams{},
                			errs.String("group", g.name), errs.String("option", corenet.OptionLoopMiddleware.String()))
              to: errs
          when: g.kinds.has(corenet.OptionLoopMiddleware)
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: g.valueRefusal()
            to: g.valueRefusal
          when: err != nil
      - return: g.protocolsRefusal()
        to: g.protocolsRefusal
  - of: (*Server).bindEverything
    participants:
      - id: caller
        kind: actor
      - id: (*Server).bindEverything
        kind: self
      - id: s.bindAll
        kind: internal
      - id: s.bindPacketAll
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: s.bindAll(ctx, groups)
            to: s.bindAll
          when: err != nil
      - return: s.bindPacketAll(ctx, packetGroups)
        to: s.bindPacketAll
  - of: (*Server).bindPacketAll
    participants:
      - id: caller
        kind: actor
      - id: (*Server).bindPacketAll
        kind: self
      - id: errs
        kind: package
      - id: packetLoopRefusal
        kind: internal
      - id: s.bindPacketGroup
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: |-
                      errs.Wrap(corenet.HandlerMissing, errs.WrapParams{},
                      				errs.String("group", group.name))
                    to: errs
                when: group.handler == nil && group.loopHandler == nil
            - opt:
                do:
                  - return: |-
                      errs.Wrap(corenet.InvalidAddress, errs.WrapParams{},
                      				errs.String("group", group.name), errs.String("why", "no listen address"))
                    to: errs
                when: len(group.addrs) == 0 && len(group.adopt) == 0
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: packetLoopRefusal(group)
                  to: packetLoopRefusal
                when: err != nil
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: s.bindPacketGroup(ctx, group)
                  to: s.bindPacketGroup
                when: err != nil
          key: _
          range: groups
          value: group
      - return: nil
  - of: (*Server).bindPacketGroup
    participants:
      - id: caller
        kind: actor
      - id: (*Server).bindPacketGroup
        kind: self
      - id: group.resolved
        kind: internal
      - id: s.adoptPacketSockets
        kind: internal
      - id: s.bindPacketShards
        kind: internal
      - id: s.startPacketLanes
        kind: internal
    steps:
      - var:
          name: handler
          type: corenet.PacketHandler
      - opt:
          do:
            - set: handler
              to: group.resolved
              value: group.resolved()
          when: group.loopHandler == nil
      - set: group.lanes
        value: nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: s.adoptPacketSockets(group, handler)
            to: s.adoptPacketSockets
          when: err != nil
      - loop:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: s.bindPacketShards(ctx, group, addr, handler)
                  to: s.bindPacketShards
                when: err != nil
          key: _
          range: group.addrs
          value: addr
      - opt:
          do:
            - eval: s.startPacketLanes(group)
              to: s.startPacketLanes
          when: group.loopHandler != nil
      - return: nil
  - of: (*Server).bindPacketShards
    participants:
      - id: caller
        kind: actor
      - id: (*Server).bindPacketShards
        kind: self
      - id: resolveShards
        kind: internal
      - id: group.kinds.has
        kind: internal
      - id: probeAddress
        kind: internal
      - id: batchDegradation
        kind: internal
      - id: joinReason
        kind: internal
      - id: listenPacket
        kind: internal
      - id: s.newBoundPacket
        kind: internal
      - id: s.mu.Lock
        kind: value
      - id: pinPort
        kind: internal
      - id: s.mu.Unlock
        kind: value
      - id: s.startReader
        kind: internal
      - id: s.probeSteer
        kind: internal
    steps:
      - bind: count, shardDegraded, shardReason
        eval: 1, false, ""
      - opt:
          do:
            - set: count, shardDegraded, shardReason
              to: resolveShards
              value: resolveShards(group.limits.Shards, addr.Network)
          when: group.kinds.has(corenet.OptionShards)
      - bind: share
        eval: group.kinds.has(corenet.OptionShareAddress)
        to: group.kinds.has
      - bind: spec
        eval: "socketSpec{reuse: reuseOf(count, share), receiveBuffer: group.limits.ReceiveBuffer, sendBuffer: group.limits.SendBuffer}"
      - opt:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: probeAddress(ctx, addr, false)
                  to: probeAddress
                when: err != nil
          when: mustProbe(addr, count, share)
      - bind: degraded, reason
        eval: batchDegradation(group.limits)
        to: batchDegradation
      - set: degraded
        value: degraded || shardDegraded
      - set: reason
        to: joinReason
        value: joinReason(reason, shardReason)
      - bind: bindAddr
        eval: addr
      - bind: sockets
        eval: make([]stdnet.PacketConn, 0, count)
      - loop:
          do:
            - bind: pc, rep, err
              eval: listenPacket(ctx, bindAddr, spec)
              to: listenPacket
            - opt:
                do:
                  - return: err
                when: err != nil
            - set: sockets
              value: append(sockets, pc)
            - bind: bound
              eval: s.newBoundPacket(group, addr, pc)
              to: s.newBoundPacket
            - eval: s.mu.Lock()
              to: s.mu.Lock
            - set: s.packetConns
              value: append(s.packetConns, bound)
            - opt:
                do:
                  - set: s.states
                    value: |-
                      append(s.states, corenet.ListenerStateValue{
                      				Group:          group.name,
                      				Address:        pc.LocalAddr().String(),
                      				Network:        addr.Network,
                      				Shards:         count,
                      				Exclusive:      rep.exclusive,
                      				Shared:         rep.shared,
                      				BindWait:       corenet.DurationValue(rep.wait),
                      				Degraded:       degraded,
                      				DegradedReason: reason,
                      				ReceiveBuffer:  rep.receiveBuffer,
                      				SendBuffer:     rep.sendBuffer,
                      			})
                  - set: bindAddr
                    to: pinPort
                    value: pinPort(addr, pc)
                when: i == 0
            - eval: s.mu.Unlock()
              to: s.mu.Unlock
            - eval: s.startReader(bound, group, handler)
              to: s.startReader
          key: i
          range: count
      - eval: s.probeSteer(group.steer, sockets)
        to: s.probeSteer
      - return: nil
  - of: pinPort
    participants:
      - id: caller
        kind: actor
      - id: pinPort
        kind: self
      - id: withBoundPort
        kind: internal
    steps:
      - return: withBoundPort(addr, pc.LocalAddr())
        to: withBoundPort
  - of: (*Server).adoptPacketSockets
    participants:
      - id: caller
        kind: actor
      - id: (*Server).adoptPacketSockets
        kind: self
      - id: s.adoptPacket
        kind: internal
      - id: batchDegradation
        kind: internal
      - id: s.newBoundPacket
        kind: internal
      - id: adoptedBuffers
        kind: internal
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
      - id: s.startReader
        kind: internal
    steps:
      - loop:
          do:
            - bind: conns, err
              eval: s.adoptPacket(name)
              to: s.adoptPacket
            - opt:
                do:
                  - return: err
                when: err != nil
            - bind: degraded, reason
              eval: batchDegradation(group.limits)
              to: batchDegradation
            - loop:
                do:
                  - bind: addr
                    eval: "corenet.AddressValue{Network: pc.LocalAddr().Network(), Addr: pc.LocalAddr().String()}"
                  - bind: bound
                    eval: s.newBoundPacket(group, addr, pc)
                    to: s.newBoundPacket
                  - bind: rcvbuf, sndbuf, why
                    eval: adoptedBuffers(packetSocket(pc), bufferSpec(group.limits))
                    to: adoptedBuffers
                  - eval: s.mu.Lock()
                    to: s.mu.Lock
                  - set: s.packetConns
                    value: append(s.packetConns, bound)
                  - set: s.states
                    value: |-
                      append(s.states, corenet.ListenerStateValue{
                      				Group:          group.name,
                      				Address:        pc.LocalAddr().String(),
                      				Network:        addr.Network,
                      				Shards:         1,
                      				Adopted:        true,
                      				Exclusive:      exclusiveOf(packetSocket(pc)),
                      				Degraded:       degraded || why != "",
                      				DegradedReason: joinReason(reason, why),
                      				ReceiveBuffer:  rcvbuf,
                      				SendBuffer:     sndbuf,
                      			})
                  - eval: s.mu.Unlock()
                    to: s.mu.Unlock
                  - eval: s.startReader(bound, group, handler)
                    to: s.startReader
                key: _
                range: conns
                value: pc
          key: _
          range: group.adopt
          value: name
      - return: nil
  - of: batchDegradation
    steps:
      - opt:
          do:
            - return: false, ""
          when: batchAvailable() || batchSize(limits) <= 1
      - return: true, "batched datagram read unavailable on this platform; reading one per syscall"
  - of: (*Server).bindAll
    participants:
      - id: caller
        kind: actor
      - id: (*Server).bindAll
        kind: self
      - id: errs
        kind: package
      - id: s.bindGroup
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: |-
                      errs.Wrap(corenet.HandlerMissing, errs.WrapParams{},
                      				errs.String("group", group.name))
                    to: errs
                when: group.handler == nil && group.loopHandler == nil
            - opt:
                do:
                  - return: |-
                      errs.Wrap(corenet.InvalidAddress, errs.WrapParams{},
                      				errs.String("group", group.name), errs.String("why", "no listen address"))
                    to: errs
                when: len(group.addrs) == 0 && len(group.adopt) == 0
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: s.bindGroup(ctx, group)
                  to: s.bindGroup
                when: err != nil
          key: _
          range: groups
          value: group
      - return: nil
  - of: (*Server).bindGroup
    participants:
      - id: caller
        kind: actor
      - id: (*Server).bindGroup
        kind: self
      - id: s.bindLoopGroup
        kind: internal
      - id: s.handshakeLog
        kind: internal
      - id: group.resolved
        kind: internal
      - id: s.errorLog
        kind: internal
      - id: newConnLimiter
        kind: internal
      - id: s.adoptStreamSockets
        kind: internal
      - id: s.bindShards
        kind: internal
    steps:
      - opt:
          do:
            - return: s.bindLoopGroup(ctx, group)
              to: s.bindLoopGroup
          when: group.loopHandler != nil
      - set: group.hsLog
        to: s.handshakeLog
        value: s.handshakeLog(group)
      - bind: handler
        eval: group.resolved()
        to: group.resolved
      - opt:
          do:
            - set: group.httpAdapter.errorLog
              to: s.errorLog
              value: s.errorLog(group.name)
          when: group.httpAdapter != nil
      - set: group.limiter
        to: newConnLimiter
        value: newConnLimiter(group.limits)
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: s.adoptStreamSockets(group, handler)
            to: s.adoptStreamSockets
          when: err != nil
      - loop:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: s.bindShards(ctx, group, addr, handler)
                  to: s.bindShards
                when: err != nil
          key: _
          range: group.addrs
          value: addr
      - return: nil
  - of: (*Server).adoptStreamSockets
    participants:
      - id: caller
        kind: actor
      - id: (*Server).adoptStreamSockets
        kind: self
      - id: s.adoptStream
        kind: internal
      - id: layered
        kind: internal
      - id: adoptedBuffers
        kind: internal
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
      - id: s.inFlight.Add
        kind: value
      - id: s.acceptLoop
        kind: internal
    steps:
      - loop:
          do:
            - bind: listeners, err
              eval: s.adoptStream(name)
              to: s.adoptStream
            - opt:
                do:
                  - return: err
                when: err != nil
            - loop:
                do:
                  - bind: ln
                    eval: layered(raw, group.serverTLS(), group.tracksCloses(), group.proxyPolicy)
                    to: layered
                  - bind: addr
                    eval: "corenet.AddressValue{Network: ln.Addr().Network(), Addr: ln.Addr().String()}"
                  - bind: bound
                    eval: "&boundListener{group: group.name, addr: addr, ln: ln}"
                  - bind: rcvbuf, sndbuf, why
                    eval: adoptedBuffers(listenerSocket(raw), bufferSpec(group.limits))
                    to: adoptedBuffers
                  - eval: s.mu.Lock()
                    to: s.mu.Lock
                  - set: s.listeners
                    value: append(s.listeners, bound)
                  - set: s.states
                    value: |-
                      append(s.states, corenet.ListenerStateValue{
                      				Group:   group.name,
                      				Address: ln.Addr().String(),
                      				Network: addr.Network,
                      				Shards:  1,
                      				Adopted: true,
                      				H2C:     group.servesH2C(),
                      				HTTP2:   group.http2Bounds(),
                      				//: read from the raw socket: TLS hides its descriptor.
                      				Exclusive:      exclusiveOf(listenerSocket(raw)),
                      				Degraded:       why != "",
                      				DegradedReason: why,
                      				MaxBodyBytes:   group.reportedBodyBound(),
                      				ReceiveBuffer:  rcvbuf,
                      				SendBuffer:     sndbuf,
                      			})
                  - eval: s.mu.Unlock()
                    to: s.mu.Unlock
                  - eval: s.inFlight.Add(1)
                    to: s.inFlight.Add
                  - go: s.acceptLoop(bound, group, handler)
                    to: s.acceptLoop
                key: _
                range: listeners
                value: raw
          key: _
          range: group.adopt
          value: name
      - return: nil
  - of: (*Server).bindShards
    participants:
      - id: caller
        kind: actor
      - id: (*Server).bindShards
        kind: self
      - id: resolveShards
        kind: internal
      - id: group.kinds.has
        kind: internal
      - id: probeAddress
        kind: internal
      - id: listen
        kind: internal
      - id: s.mu.Lock
        kind: value
      - id: pinnedAddr
        kind: internal
      - id: s.mu.Unlock
        kind: value
      - id: s.inFlight.Add
        kind: value
      - id: s.acceptLoop
        kind: internal
    steps:
      - bind: count, degraded, reason
        eval: resolveShards(group.limits.Shards, addr.Network)
        to: resolveShards
      - bind: share
        eval: group.kinds.has(corenet.OptionShareAddress)
        to: group.kinds.has
      - opt:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: probeAddress(ctx, addr, true)
                  to: probeAddress
                when: err != nil
          when: mustProbe(addr, count, share)
      - bind: opened
        eval: "0"
      - bind: target
        eval: addr
      - loop:
          do:
            - bind: ln, rep, err
              eval: |-
                listen(ctx, target, group.serverTLS(), socketSpec{
                			reuse: reuseOf(count, share), trackCloses: group.tracksCloses(), attempts: s.rebindAttempts(target), backlog: group.limits.Backlog,
                			receiveBuffer: group.limits.ReceiveBuffer, sendBuffer: group.limits.SendBuffer, proxy: group.proxyPolicy,
                			keepAlive: s.keepAliveOf(group), userTimeout: s.userTimeoutOf(group),
                		})
              to: listen
            - opt:
                do:
                  - return: err
                when: err != nil
            - bind: bound
              eval: "&boundListener{group: group.name, addr: addr, ln: ln}"
            - eval: s.mu.Lock()
              to: s.mu.Lock
            - set: s.listeners
              value: append(s.listeners, bound)
            - opt:
                do:
                  - set: s.states
                    value: |-
                      append(s.states, corenet.ListenerStateValue{
                      				Group:          group.name,
                      				Address:        ln.Addr().String(),
                      				Network:        addr.Network,
                      				Shards:         count,
                      				H2C:            group.servesH2C(),
                      				HTTP2:          group.http2Bounds(),
                      				Exclusive:      rep.exclusive,
                      				Shared:         rep.shared,
                      				BindWait:       corenet.DurationValue(rep.wait),
                      				Degraded:       degraded || rep.backlogReason != "",
                      				DegradedReason: joinReason(reason, rep.backlogReason),
                      				MaxBodyBytes:   group.reportedBodyBound(),
                      				Backlog:        rep.backlog,
                      				ReceiveBuffer:  rep.receiveBuffer,
                      				SendBuffer:     rep.sendBuffer,
                      			})
                  - set: target
                    to: pinnedAddr
                    value: pinnedAddr(addr, ln)
                when: opened == 0
            - eval: s.mu.Unlock()
              to: s.mu.Unlock
            - op: ++
              set: opened
            - eval: s.inFlight.Add(1)
              to: s.inFlight.Add
            - go: s.acceptLoop(bound, group, handler)
              to: s.acceptLoop
          range: count
      - return: nil
  - of: acceptDelay
    participants:
      - id: caller
        kind: actor
      - id: acceptDelay
        kind: self
      - id: "kbackoff.Value{BaseDelay: 5 * time.Millisecond, MaxDelay: time.Second, Multiplier: 2}.Delay"
        kind: value
    steps:
      - return: "kbackoff.Value{BaseDelay: 5 * time.Millisecond, MaxDelay: time.Second, Multiplier: 2}.Delay(failures)"
        to: "kbackoff.Value{BaseDelay: 5 * time.Millisecond, MaxDelay: time.Second, Multiplier: 2}.Delay"
  - of: (*Server).acceptLoop
    participants:
      - id: caller
        kind: actor
      - id: (*Server).acceptLoop
        kind: self
      - id: s.inFlight.Done
        kind: value
      - id: bound.ln.Accept
        kind: value
      - id: s.acceptBackoffs.Add
        kind: value
      - id: group.admission.Admit
        kind: internal
      - id: swallowErr
        kind: internal
      - id: s.total.Add
        kind: value
      - id: s.active.Add
        kind: value
      - id: group.conns.active.Add
        kind: value
      - id: s.inFlight.Add
        kind: value
      - id: s.serve
        kind: internal
    steps:
      - defer: s.inFlight.Done()
        to: s.inFlight.Done
      - bind: failures
        eval: "0"
      - loop:
          do:
            - bind: raw, err
              eval: bound.ln.Accept()
              to: bound.ln.Accept
            - opt:
                do:
                  - opt:
                      do:
                        - return: ""
                      when: errors.Is(err, stdnet.ErrClosed)
                  - op: ++
                    set: failures
                  - eval: s.acceptBackoffs.Add(1)
                    to: s.acceptBackoffs.Add
                  - opt:
                      do:
                        - return: ""
                      when: "!s.backOff(bound, acceptDelay(failures))"
                  - continue: true
                when: err != nil
            - set: failures
              value: "0"
            - var:
                name: release
                type: func()
            - opt:
                do:
                  - bind: ok
                    eval: "false"
                  - opt:
                      do:
                        - eval: swallowErr(raw.Close())
                          to: swallowErr
                        - continue: true
                      init:
                        bind: release, ok
                        eval: group.admission.Admit(raw.RemoteAddr())
                        op: =
                        to: group.admission.Admit
                      when: "!ok"
                when: group.admission != nil && group.proxyPolicy == nil
            - eval: s.total.Add(1)
              to: s.total.Add
            - eval: s.active.Add(1)
              to: s.active.Add
            - eval: group.conns.active.Add(1)
              to: group.conns.active.Add
            - eval: s.inFlight.Add(1)
              to: s.inFlight.Add
            - go: s.serve(raw, group, handler, release)
              to: s.serve
          forever: true
  - of: (*Server).backOff
    participants:
      - id: caller
        kind: actor
      - id: (*Server).backOff
        kind: self
      - id: s.clk.NewTimer
        kind: value
      - id: timer.Stop
        kind: value
    steps:
      - bind: timer
        eval: s.clk.NewTimer(delay)
        to: s.clk.NewTimer
      - defer: timer.Stop()
        to: timer.Stop
      - select:
          cases:
            - comm: <-timer.C()
              do:
                - return: "true"
            - comm: <-bound.closedSignal()
              do:
                - return: "false"
  - of: (*Server).serve
    participants:
      - id: caller
        kind: actor
      - id: (*Server).serve
        kind: self
      - id: s.inFlight.Done
        kind: value
      - id: s.active.Add
        kind: value
      - id: group.conns.active.Add
        kind: value
      - id: s.acquire
        kind: internal
      - id: s.release
        kind: internal
      - id: s.admitProxied
        kind: internal
      - id: s.serveAdmitted
        kind: internal
    steps:
      - defer: s.inFlight.Done()
        to: s.inFlight.Done
      - defer: s.active.Add(-1)
        to: s.active.Add
      - defer: group.conns.active.Add(-1)
        to: group.conns.active.Add
      - bind: c
        eval: s.acquire(raw, group)
        to: s.acquire
      - defer: s.release(c)
        to: s.release
      - opt:
          do:
            - var:
                name: ok
                type: bool
            - opt:
                do:
                  - set: c.refused
                    value: "true"
                  - return: ""
                init:
                  bind: release, ok
                  eval: s.admitProxied(raw, group)
                  op: =
                  to: s.admitProxied
                when: "!ok"
          when: group.proxyPolicy != nil
      - eval: s.serveAdmitted(c, group, handler, release)
        to: s.serveAdmitted
  - of: (*Server).serveAdmitted
    participants:
      - id: caller
        kind: actor
      - id: (*Server).serveAdmitted
        kind: self
      - id: context
        kind: stdlib
      - id: recoverHandler
        kind: internal
      - id: s.admit
        kind: internal
      - id: group.conns.rejected.Add
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - bind: ctx
        eval: s.runCtx
      - opt:
          do:
            - defer: release()
            - set: ctx
              to: context
              value: context.WithValue(ctx, admissionReleaseKey{}, release)
          when: release != nil
      - defer: recoverHandler()
        to: recoverHandler
      - bind: err
        eval: s.admit(ctx, group.limiter, &group.conns.admitted, c, handler)
        to: s.admit
      - opt:
          do:
            - eval: group.conns.rejected.Add(1)
              to: group.conns.rejected.Add
          when: c.refused
      - eval: swallowErr(err)
        to: swallowErr
  - of: recoverHandler
    steps:
      - eval: recover()
  - of: (*Server).Serve
    participants:
      - id: caller
        kind: actor
      - id: (*Server).Serve
        kind: self
      - id: s.Start
        kind: internal
      - id: context
        kind: stdlib
      - id: s.Shutdown
        kind: internal
      - id: s.stalledGroup
        kind: internal
      - id: errs
        kind: package
      - id: stallError
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: s.Start(ctx)
            to: s.Start
          when: err != nil
      - var:
          name: stalled
          type: bool
      - select:
          cases:
            - comm: <-ctx.Done()
            - comm: <-s.stall.stalled
              do:
                - set: stalled
                  value: "true"
      - bind: drainCtx, cancel
        eval: context.WithTimeout(context.WithoutCancel(ctx), max(s.drainGrace, 0)+s.drainTimeout)
        to: context
      - defer: cancel()
      - bind: err
        eval: s.Shutdown(drainCtx)
        to: s.Shutdown
      - opt:
          do:
            - return: err
          when: "!stalled"
      - bind: group, _
        eval: s.stalledGroup()
        to: s.stalledGroup
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.LoopGroupStalled, errs.WrapParams{},
                			errs.String("group", group), errs.String("drain", err.Error()))
              to: errs
          when: err != nil
      - return: stallError(group)
        to: stallError
  - of: (*Server).Shutdown
    participants:
      - id: caller
        kind: actor
      - id: (*Server).Shutdown
        kind: self
      - id: s.phase.Store
        kind: value
      - id: s.stopStallWatch
        kind: internal
      - id: s.waitGrace
        kind: internal
      - id: s.closeStreamListeners
        kind: internal
      - id: s.handoverPackets
        kind: internal
      - id: s.closeListeners
        kind: internal
      - id: s.shutdownLoops
        kind: internal
      - id: s.shutdownHTTP
        kind: internal
      - id: s.waitIdle
        kind: internal
      - id: s.closeLive
        kind: internal
      - id: s.inFlight.Wait
        kind: value
    steps:
      - opt:
          do:
            - return: nil
          when: corenet.Phase(s.phase.Load()) == corenet.PhaseNew
      - bind: stopped
        eval: corenet.Phase(s.phase.Load()) == corenet.PhaseStopped
      - eval: s.phase.Store(uint32(corenet.PhaseDraining))
        to: s.phase.Store
      - eval: s.stopStallWatch()
        to: s.stopStallWatch
      - opt:
          do:
            - eval: s.waitGrace(ctx)
              to: s.waitGrace
          when: "!stopped"
      - eval: s.closeStreamListeners()
        to: s.closeStreamListeners
      - eval: s.handoverPackets(ctx)
        to: s.handoverPackets
      - eval: s.closeListeners()
        to: s.closeListeners
      - bind: loopErr
        eval: s.shutdownLoops(ctx)
        to: s.shutdownLoops
      - eval: s.shutdownHTTP(ctx)
        to: s.shutdownHTTP
      - bind: err
        eval: s.waitIdle(ctx)
        to: s.waitIdle
      - opt:
          do:
            - eval: s.stop()
          when: s.stop != nil
      - opt:
          do:
            - eval: s.closeLive()
              to: s.closeLive
            - eval: s.phase.Store(uint32(corenet.PhaseStopped))
              to: s.phase.Store
            - return: err
          when: err != nil
      - eval: s.inFlight.Wait()
        to: s.inFlight.Wait
      - eval: s.phase.Store(uint32(corenet.PhaseStopped))
        to: s.phase.Store
      - return: loopErr
  - of: (*Server).waitGrace
    participants:
      - id: caller
        kind: actor
      - id: (*Server).waitGrace
        kind: self
      - id: time
        kind: stdlib
      - id: t.Stop
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: s.drainGrace <= 0
      - bind: t
        eval: time.NewTimer(s.drainGrace)
        to: time
      - defer: t.Stop()
        to: t.Stop
      - select:
          cases:
            - comm: <-t.C
            - comm: <-ctx.Done()
  - of: (*Server).shutdownHTTP
    participants:
      - id: caller
        kind: actor
      - id: (*Server).shutdownHTTP
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: slices
        kind: stdlib
      - id: s.mu.RUnlock
        kind: value
      - id: group.httpAdapter.shutdown
        kind: internal
    steps:
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: groups
        eval: slices.Clone(s.groups)
        to: slices
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - loop:
          do:
            - opt:
                do:
                  - eval: group.httpAdapter.shutdown(ctx)
                    to: group.httpAdapter.shutdown
                when: group.httpAdapter != nil
          key: _
          range: groups
          value: group
  - of: (*Server).closeHTTP
    participants:
      - id: caller
        kind: actor
      - id: (*Server).closeHTTP
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: slices
        kind: stdlib
      - id: s.mu.RUnlock
        kind: value
      - id: group.httpAdapter.closeNow
        kind: internal
    steps:
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: groups
        eval: slices.Clone(s.groups)
        to: slices
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - loop:
          do:
            - opt:
                do:
                  - eval: group.httpAdapter.closeNow()
                    to: group.httpAdapter.closeNow
                when: group.httpAdapter != nil
          key: _
          range: groups
          value: group
  - of: (*Server).waitIdle
    participants:
      - id: caller
        kind: actor
      - id: (*Server).waitIdle
        kind: self
      - id: time
        kind: stdlib
      - id: ticker.Stop
        kind: value
      - id: errs
        kind: package
    steps:
      - bind: ticker
        eval: time.NewTicker(drainPollInterval)
        to: time
      - defer: ticker.Stop()
        to: ticker.Stop
      - loop:
          do:
            - opt:
                do:
                  - return: nil
                when: s.active.Load() == 0
            - select:
                cases:
                  - comm: <-ctx.Done()
                    do:
                      - return: |-
                          errs.Wrap(corenet.DrainTimeout, errs.WrapParams{},
                          				errs.Int64("active", s.active.Load()))
                        to: errs
                  - comm: <-ticker.C
          forever: true
  - of: (*Server).Close
    participants:
      - id: caller
        kind: actor
      - id: (*Server).Close
        kind: self
      - id: s.stopStallWatch
        kind: internal
      - id: s.stopGROPackets
        kind: internal
      - id: s.closeListeners
        kind: internal
      - id: s.closeLoops
        kind: internal
      - id: s.closeHTTP
        kind: internal
      - id: s.closeLive
        kind: internal
      - id: s.phase.Store
        kind: value
    steps:
      - eval: s.stopStallWatch()
        to: s.stopStallWatch
      - eval: s.stopGROPackets()
        to: s.stopGROPackets
      - eval: s.closeListeners()
        to: s.closeListeners
      - eval: s.closeLoops()
        to: s.closeLoops
      - eval: s.closeHTTP()
        to: s.closeHTTP
      - opt:
          do:
            - eval: s.stop()
          when: s.stop != nil
      - eval: s.closeLive()
        to: s.closeLive
      - eval: s.phase.Store(uint32(corenet.PhaseStopped))
        to: s.phase.Store
      - return: nil
  - of: (*Server).closeListeners
    participants:
      - id: caller
        kind: actor
      - id: (*Server).closeListeners
        kind: self
      - id: s.closeStreamListeners
        kind: internal
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - eval: s.closeStreamListeners()
        to: s.closeStreamListeners
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - bind: packetConns
        eval: s.packetConns
      - set: s.packetConns
        value: nil
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - loop:
          do:
            - eval: swallowErr(bound.Close())
              to: swallowErr
          key: _
          range: packetConns
          value: bound
  - of: (*Server).closeStreamListeners
    participants:
      - id: caller
        kind: actor
      - id: (*Server).closeStreamListeners
        kind: self
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - bind: listeners
        eval: s.listeners
      - set: s.listeners
        value: nil
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - loop:
          do:
            - eval: swallowErr(bound.Close())
              to: swallowErr
          key: _
          range: listeners
          value: bound
  - of: withBoundPort
    participants:
      - id: caller
        kind: actor
      - id: withBoundPort
        kind: self
      - id: stdnet
        kind: stdlib
    steps:
      - bind: port
        eval: "0"
      - typeswitch:
          bind: a
          cases:
            - do:
                - set: port
                  value: a.Port
              types: "*stdnet.TCPAddr"
            - do:
                - set: port
                  value: a.Port
              types: "*stdnet.UDPAddr"
          "on": local
      - bind: host, _, err
        eval: stdnet.SplitHostPort(addr.Addr)
        to: stdnet
      - opt:
          do:
            - return: addr
          when: port == 0 || err != nil
      - set: addr.Addr
        to: stdnet
        value: stdnet.JoinHostPort(host, strconv.Itoa(port))
      - return: addr
  - of: shardable
    steps:
      - return: strings.HasPrefix(network, "tcp") || strings.HasPrefix(network, "udp")
  - of: resolveShards
    participants:
      - id: caller
        kind: actor
      - id: resolveShards
        kind: self
      - id: shardsFor
        kind: internal
    steps:
      - return: shardsFor(requested, network, reusePortSupported())
        to: shardsFor
  - of: shardsFor
    participants:
      - id: caller
        kind: actor
      - id: shardsFor
        kind: self
      - id: runtime
        kind: stdlib
    steps:
      - opt:
          do:
            - return: 1, false, ""
          when: requested == 1
      - opt:
          do:
            - opt:
                do:
                  - return: 1, true, "SO_REUSEPORT applies to IP sockets only; using a single listener"
                when: requested > 1
            - return: 1, false, ""
          when: "!shardable(network)"
      - opt:
          do:
            - opt:
                do:
                  - return: 1, true, "SO_REUSEPORT unavailable on this platform; using a single listener"
                when: requested > 1
            - return: 1, false, ""
          when: "!reusePort"
      - opt:
          do:
            - return: runtime.GOMAXPROCS(0), false, ""
              to: runtime
          when: requested <= 0
      - return: requested, false, ""
  - of: reusePortControl
    participants:
      - id: caller
        kind: actor
      - id: reusePortControl
        kind: self
      - id: rawConn.Control
        kind: value
    steps:
      - set: _, _
        value: network, address
      - var:
          name: setErr
          type: error
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: |-
              rawConn.Control(func(fd uintptr) {
              		setErr = setReusePort(fd)
              	})
            to: rawConn.Control
          when: err != nil
      - return: setErr
  - of: listen
    participants:
      - id: caller
        kind: actor
      - id: listen
        kind: self
      - id: familyUnavailable
        kind: internal
      - id: applyKeepAlive
        kind: internal
      - id: bindRetrying
        kind: internal
      - id: exclusiveOf
        kind: internal
      - id: applyBacklog
        kind: internal
      - id: socketBuffers
        kind: internal
      - id: layered
        kind: internal
    steps:
      - opt:
          do:
            - return: |-
                nil, rep, errs.Wrap(corenet.UnsupportedNetwork, errs.WrapParams{},
                			errs.String("network", addr.Network))
          init:
            bind: _, ok
            eval: streamNetworks[addr.Network]
          when: "!ok"
      - opt:
          do:
            - return: nil, rep, unavailable
          init:
            bind: unavailable
            eval: familyUnavailable(addr)
            to: familyUnavailable
          when: unavailable != nil
      - opt:
          do:
            - return: |-
                nil, rep, errs.Wrap(corenet.InvalidAddress, errs.WrapParams{},
                			errs.String("address", addr.String()))
          when: strings.TrimSpace(addr.Addr) == ""
      - bind: cfg
        eval: "stdnet.ListenConfig{Control: listenControl(spec.reuse != reuseNone, spec)}"
      - eval: applyKeepAlive(&cfg, spec.keepAlive)
        to: applyKeepAlive
      - bind: raw, wait, lerr
        eval: |-
          bindRetrying(ctx, spec.attempts, addrInUse, func() (stdnet.Listener, error) {
          		//: one attempt.
          		return cfg.Listen(ctx, addr.Network, addr.Addr)
          	})
        to: bindRetrying
      - set: rep.wait
        value: wait
      - opt:
          do:
            - return: nil, rep, bindRefusal(addr, lerr)
          when: lerr != nil
      - set: rep.shared
        value: spec.reuse == reuseShared
      - set: rep.exclusive
        to: exclusiveOf
        value: exclusiveOf(listenerSocket(raw))
      - set: rep.backlog, rep.backlogReason
        to: applyBacklog
        value: applyBacklog(raw, spec.backlog)
      - set: rep.receiveBuffer, rep.sendBuffer
        to: socketBuffers
        value: socketBuffers(listenerSocket(raw))
      - return: layered(raw, cfgTLS, spec.trackCloses, spec.proxy), rep, nil
        to: layered
  - of: familyUnavailable
    participants:
      - id: caller
        kind: actor
      - id: familyUnavailable
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: nil
          when: "!platformLacks(addr.Network)"
      - return: |-
          errs.Wrap(coreproc.UnsupportedPlatform, errs.WrapParams{},
          		errs.String("network", addr.Network), errs.String("goos", runtime.GOOS))
        to: errs
  - of: layered
    participants:
      - id: caller
        kind: actor
      - id: layered
        kind: self
      - id: tls
        kind: stdlib
    steps:
      - opt:
          do:
            - set: raw
              value: "&proxyListener{Listener: raw, policy: proxy}"
          when: proxy != nil
      - opt:
          do:
            - set: raw
              value: "&trackedListener{Listener: raw}"
          when: trackCloses
      - opt:
          do:
            - return: raw
          when: cfgTLS == nil
      - return: tls.NewListener(raw, cfgTLS)
        to: tls
  - of: (*boundListener).closedSignal
    participants:
      - id: caller
        kind: actor
      - id: (*boundListener).closedSignal
        kind: self
      - id: b.made.Do
        kind: value
    steps:
      - eval: b.made.Do(func() { b.closed = make(chan struct{}) })
        to: b.made.Do
      - return: b.closed
  - of: (*boundListener).Close
    participants:
      - id: caller
        kind: actor
      - id: (*boundListener).Close
        kind: self
      - id: b.closedSignal
        kind: internal
      - id: b.shut.Do
        kind: value
      - id: b.ln.Close
        kind: value
    steps:
      - eval: b.closedSignal()
        to: b.closedSignal
      - eval: b.shut.Do(func() { close(b.closed) })
        to: b.shut.Do
      - return: b.ln.Close()
        to: b.ln.Close
  - of: reuseOf
    steps:
      - opt:
          do:
            - return: reuseShared
          when: share
      - opt:
          do:
            - return: reuseShards
          when: count > 1
      - return: reuseNone
  - of: (*trackedListener).Accept
    participants:
      - id: caller
        kind: actor
      - id: (*trackedListener).Accept
        kind: self
      - id: l.Listener.Accept
        kind: value
    steps:
      - bind: socket, aerr
        eval: l.Listener.Accept()
        to: l.Listener.Accept
      - opt:
          do:
            - return: nil, aerr
          when: aerr != nil
      - return: "&trackedConn{Conn: socket}, nil"
  - of: loopLanes
    steps:
      - return: max(v.Loops, 1)
  - of: buildLoopChain
    participants:
      - id: caller
        kind: actor
      - id: buildLoopChain
        kind: self
      - id: wrapLoop
        kind: internal
      - id: sendProbe
        kind: internal
    steps:
      - opt:
          do:
            - return: h, nil
          when: len(mws) == 0
      - bind: chain, ok
        eval: wrapLoop(h, mws)
        to: wrapLoop
      - opt:
          do:
            - return: nil, invalidLayer(group, "Next")
          when: "!ok"
      - bind: probe
        eval: "&loopProbe{}"
      - bind: probed, ok
        eval: wrapLoop(probe, mws)
        to: wrapLoop
      - opt:
          do:
            - return: nil, invalidLayer(group, "Next")
          when: "!ok"
      - eval: sendProbe(probed)
        to: sendProbe
      - loop:
          do:
            - opt:
                do:
                  - return: nil, invalidLayer(group, probeNames[cb])
                when: "!seen"
          key: cb
          range: probe.seen
          value: seen
      - return: chain, nil
  - of: sameHandler
    steps:
      - opt:
          do:
            - return: a == nil && b == nil
          when: a == nil || b == nil
      - bind: ta, tb
        eval: reflect.TypeOf(a), reflect.TypeOf(b)
      - opt:
          do:
            - return: "false"
          when: ta != tb
      - return: "!ta.Comparable() || a == b"
  - of: chainHonours
    participants:
      - id: caller
        kind: actor
      - id: chainHonours
        kind: self
      - id: l.Next
        kind: value
    steps:
      - loop:
          cond: node != nil
          do:
            - opt:
                do:
                  - return: "true"
                init:
                  bind: h, ok
                  eval: node.(corenet.LoopOptionHonourer)
                when: ok && h.Honours(k)
            - bind: l, ok
              eval: node.(corenet.LoopLayered)
            - opt:
                do:
                  - break: true
                when: "!ok"
            - set: node
              to: l.Next
              value: l.Next()
          init: node := chain
      - return: "false"
  - of: invalidLayer
    participants:
      - id: caller
        kind: actor
      - id: invalidLayer
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(corenet.LoopMiddlewareInvalid, errs.WrapParams{},
          		errs.String("group", group), errs.String("callback", callback))
        to: errs
  - of: sendProbe
    participants:
      - id: caller
        kind: actor
      - id: sendProbe
        kind: self
      - id: s.OnStart
        kind: value
      - id: probed.OnOpen
        kind: value
      - id: probed.OnData
        kind: value
      - id: probed.OnTimeout
        kind: value
      - id: probed.OnWritable
        kind: value
      - id: probed.OnBatchEnd
        kind: value
      - id: probed.OnClose
        kind: value
      - id: h.Honours
        kind: value
    steps:
      - bind: io
        eval: probeIO{}
      - var:
          name: ref
          type: corenet.LoopConnRef
      - opt:
          do:
            - eval: s.OnStart(1)
              to: s.OnStart
          init:
            bind: s, ok
            eval: probed.(corenet.LoopStarter)
          when: ok
      - eval: probed.OnOpen(io, ref)
        to: probed.OnOpen
      - eval: probed.OnData(io, ref, nil)
        to: probed.OnData
      - eval: probed.OnTimeout(io, ref)
        to: probed.OnTimeout
      - eval: probed.OnWritable(io, ref)
        to: probed.OnWritable
      - eval: probed.OnBatchEnd(io)
        to: probed.OnBatchEnd
      - eval: probed.OnClose(io, ref, nil)
        to: probed.OnClose
      - opt:
          do:
            - eval: h.Honours(corenet.OptionNone)
              to: h.Honours
          init:
            bind: h, ok
            eval: probed.(corenet.LoopOptionHonourer)
          when: ok
  - of: (*loopProbe).OnStart
    steps:
      - set: p.seen[probeStart]
        value: "true"
  - of: (*loopProbe).OnOpen
    steps:
      - set: p.seen[probeOpen]
        value: "true"
  - of: (*loopProbe).OnData
    steps:
      - set: p.seen[probeData]
        value: "true"
      - return: len(buf)
  - of: (*loopProbe).OnTimeout
    steps:
      - set: p.seen[probeTimeout]
        value: "true"
  - of: (*loopProbe).OnWritable
    steps:
      - set: p.seen[probeWritable]
        value: "true"
  - of: (*loopProbe).OnBatchEnd
    steps:
      - set: p.seen[probeBatchEnd]
        value: "true"
  - of: (*loopProbe).OnClose
    steps:
      - set: p.seen[probeClose]
        value: "true"
  - of: (*loopProbe).Honours
    steps:
      - set: p.seen[probeHonours]
        value: "true"
      - return: "false"
  - of: probeIO.Write
    steps:
      - return: corenet.LoopStaleRef
  - of: probeIO.Close
    steps:
      - return: corenet.LoopStaleRef
  - of: probeIO.SetDeadline
    steps:
      - return: corenet.LoopStaleRef
  - of: probeIO.Pressure
    steps:
      - return: "false"
  - of: probeIO.Post
    steps:
      - return: corenet.ServerClosed
  - of: probeIO.Loop
    steps:
      - return: "0"
  - of: startLoopEngine
    participants:
      - id: caller
        kind: actor
      - id: startLoopEngine
        kind: self
      - id: startNativeEngine
        kind: internal
    steps:
      - opt:
          do:
            - return: |-
                nil, errs.Wrap(coreproc.UnsupportedPlatform, errs.WrapParams{},
                			errs.String("group", group.name), errs.String("backend", group.loop.Backend.String()))
          when: group.loop.Backend == corenet.LoopBackendKqueue
      - return: startNativeEngine(group, lns, plan)
        to: startNativeEngine
  - of: dupHandoff
    participants:
      - id: caller
        kind: actor
      - id: dupHandoff
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: r, _, errno
        eval: syscall.Syscall(syscall.SYS_FCNTL, fd, syscall.F_DUPFD_CLOEXEC, 0)
        to: syscall
      - opt:
          do:
            - return: "-1, errno"
          when: errno != 0
      - return: int(r), nil
  - of: startNativeEngine
    participants:
      - id: caller
        kind: actor
      - id: startNativeEngine
        kind: self
      - id: startPortable
        kind: internal
      - id: dupListeners
        kind: internal
      - id: loop
        kind: package
    steps:
      - opt:
          do:
            - return: startPortable(group, lns, "", plan), nil
              to: startPortable
          when: plan.backend == corenet.LoopBackendPortable
      - bind: handoff, err
        eval: dupListeners(lns)
        to: dupListeners
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - loop:
          do:
            - set: handoff[i].Loop
              value: group.loopOwners[i]
          key: i
          range: min(len(handoff), len(group.loopOwners))
      - bind: value
        eval: group.loop
      - set: value.Backend
        value: plan.backend
      - bind: g, err
        eval: |-
          loop.Start(loop.Config{
          		Group: group.name, Value: value, MaxConns: group.limits.MaxConns,
          		IdleTimeout: loopIdle(group), Handler: group.loopChain, Busy: group.loopBusy, Listeners: handoff,
          		ReadTimeout: group.timeouts.Read.Duration(), KeepAlive: group.timeouts.KeepAlive.Duration(),
          		UserTimeout: resolveUserTimeout(group),
          		Disabled:    plan.disabled, DisabledBy: plan.disabledBy, LoopsSource: group.loopsSource,
          		Memory: loopMemory(),
          	})
        to: loop
      - opt:
          do:
            - return: "&nativeEngine{Group: g, noDelay: probeNoDelay(lns, plan)}, nil"
          when: err == nil
      - opt:
          do:
            - return: "startPortable(group, lns, \"native loop backend unavailable: \"+err.Error(), plan), nil"
              to: startPortable
          when: plan.fallback && !errs.HasCode(err, corenet.CodeLoopNoDescriptors)
      - return: nil, err
  - of: (*nativeEngine).State
    participants:
      - id: caller
        kind: actor
      - id: (*nativeEngine).State
        kind: self
      - id: e.Group.State
        kind: value
    steps:
      - bind: st
        eval: e.Group.State()
        to: e.Group.State
      - set: st.Capabilities
        value: append(st.Capabilities, e.noDelay)
      - return: st
  - of: probeNoDelay
    participants:
      - id: caller
        kind: actor
      - id: probeNoDelay
        kind: self
      - id: noDelayOf
        kind: internal
    steps:
      - bind: row
        eval: "corenet.CapabilityValue{Name: corenet.CapabilityTCPNoDelay, Class: classKernel, Status: statusOn}"
      - opt:
          do:
            - set: row.Status, row.Reason
              value: statusDisabled, plan.disabledBy
            - return: row
          when: slices.Contains(plan.disabled, corenet.CapabilityTCPNoDelay)
      - opt:
          do:
            - set: row.Status, row.Reason
              value: statusUnprobed, unixSocketReason
            - return: row
          when: "!slices.ContainsFunc(lns, isTCPListener)"
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: "!isTCPListener(ln)"
            - bind: v, err
              eval: noDelayOf(ln)
              to: noDelayOf
            - opt:
                do:
                  - set: row.Status, row.Reason
                    value: "statusAbsent, \"getsockopt TCP_NODELAY: not set\""
                  - return: row
                when: err != nil || v == 0
          key: _
          range: lns
          value: ln
      - return: row
  - of: noDelayOf
    participants:
      - id: caller
        kind: actor
      - id: noDelayOf
        kind: self
      - id: sc.SyscallConn
        kind: value
      - id: rc.Control
        kind: value
    steps:
      - bind: sc, ok
        eval: ln.(syscall.Conn)
      - opt:
          do:
            - return: 0, syscall.EINVAL
          when: "!ok"
      - bind: rc, err
        eval: sc.SyscallConn()
        to: sc.SyscallConn
      - opt:
          do:
            - return: 0, err
          when: err != nil
      - var:
          name: v
          type: int
      - var:
          name: gerr
          type: error
      - bind: cerr
        eval: rc.Control(func(fd uintptr) { v, gerr = syscall.GetsockoptInt(int(fd), syscall.IPPROTO_TCP, syscall.TCP_NODELAY) })
        to: rc.Control
      - opt:
          do:
            - return: 0, cerr
          when: cerr != nil
      - return: v, gerr
  - of: dupListeners
    participants:
      - id: caller
        kind: actor
      - id: dupListeners
        kind: self
      - id: closeHandoff
        kind: internal
      - id: sc.SyscallConn
        kind: value
      - id: rc.Control
        kind: value
      - id: syscall
        kind: stdlib
      - id: swallowErr
        kind: internal
    steps:
      - bind: out
        eval: make([]loop.Listener, 0, len(lns))
      - loop:
          do:
            - bind: sc, ok
              eval: ln.(syscall.Conn)
            - opt:
                do:
                  - eval: closeHandoff(out)
                    to: closeHandoff
                  - return: nil, errs.Wrap(corenet.ListenFailed, errs.WrapParams{}, errs.String("cause", "listener has no descriptor"))
                when: "!ok"
            - bind: rc, err
              eval: sc.SyscallConn()
              to: sc.SyscallConn
            - opt:
                do:
                  - eval: closeHandoff(out)
                    to: closeHandoff
                  - return: nil, errs.Wrap(corenet.ListenFailed, errs.WrapParams{}, errs.String("cause", err.Error()))
                when: err != nil
            - var:
                name: nfd
                type: int
            - var:
                name: derr
                type: error
            - bind: cerr
              eval: rc.Control(func(fd uintptr) { nfd, derr = dupHandoff(fd) })
              to: rc.Control
            - opt:
                do:
                  - eval: closeHandoff(out)
                    to: closeHandoff
                  - return: nil, errs.Wrap(corenet.ListenFailed, errs.WrapParams{}, errs.String("cause", "dup failed"))
                when: cerr != nil || derr != nil
            - opt:
                do:
                  - eval: swallowErr(syscall.Close(nfd))
                    to: swallowErr
                  - eval: closeHandoff(out)
                    to: closeHandoff
                  - return: nil, errs.Wrap(corenet.ListenFailed, errs.WrapParams{}, errs.String("cause", err.Error()))
                init:
                  bind: err
                  eval: syscall.SetNonblock(nfd, true)
                  to: syscall
                when: err != nil
            - set: out
              value: "append(out, loop.Listener{FD: nfd})"
          key: _
          range: lns
          value: ln
      - return: out, nil
  - of: closeHandoff
    participants:
      - id: caller
        kind: actor
      - id: closeHandoff
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - loop:
          do:
            - eval: swallowErr(syscall.Close(l.FD))
              to: swallowErr
          key: _
          range: ls
          value: l
  - of: (*StreamGroup).HandleLoop
    steps:
      - opt:
          do:
            - return: g
          when: "!g.claimHandler()"
      - set: g.loopHandler
        value: h
      - return: g
  - of: (*StreamGroup).loopRefusal
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).loopRefusal
        kind: self
      - id: unixpacketRefused
        kind: internal
      - id: g.loopTLSRefusal
        kind: internal
      - id: g.shardsRefusal
        kind: internal
      - id: buildLoopChain
        kind: internal
      - id: errs
        kind: package
      - id: g.codecListRefusal
        kind: internal
      - id: g.spillRefusal
        kind: internal
    steps:
      - opt:
          do:
            - return: unixpacketRefused(g.name)
              to: unixpacketRefused
          when: slices.ContainsFunc(g.addrs, func(a corenet.AddressValue) bool { return a.Network == networkUnixpacket })
      - opt:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: g.loopTLSRefusal()
                  to: g.loopTLSRefusal
                when: err != nil
          when: g.kinds.has(corenet.OptionTLS)
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: g.shardsRefusal()
            to: g.shardsRefusal
          when: err != nil
      - bind: chain, err
        eval: buildLoopChain(g.name, g.loopHandler, g.loopMiddlewares)
        to: buildLoopChain
      - opt:
          do:
            - return: err
          when: err != nil
      - set: g.loopChain
        value: chain
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: g.loopHonoursKind(chain, k)
            - return: |-
                errs.Wrap(corenet.LoopOptionUnsupported, errs.WrapParams{},
                			errs.String("group", g.name), errs.String("option", k.String()))
              to: errs
          key: _
          range: g.kinds.list()
          value: k
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: g.codecListRefusal()
            to: g.codecListRefusal
          when: err != nil
      - return: g.spillRefusal()
        to: g.spillRefusal
  - of: (*StreamGroup).spillRefusal
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).spillRefusal
        kind: self
      - id: checker.CheckSpill
        kind: value
      - id: errs
        kind: package
    steps:
      - bind: checker, ok
        eval: g.loopHandler.(corenet.LoopSpillChecker)
      - opt:
          do:
            - return: nil
          when: "!ok"
      - bind: err
        eval: checker.CheckSpill(orDefaultInt(g.loop.SpillCap, portableSpillCap))
        to: checker.CheckSpill
      - opt:
          do:
            - return: errs.Wrap(err, errs.WrapParams{}, errs.String("group", g.name))
              to: errs
          when: err != nil
      - return: nil
  - of: (*StreamGroup).loopHonoursKind
    steps:
      - return: loopHonours(k) || (g.tlsCodec() && tlsCodecHonours(k)) || (k != corenet.OptionMiddleware && chainHonours(chain, k))
  - of: loopHonours
    steps:
      - switch:
          cases:
            - case: corenet.OptionIdleTimeout, corenet.OptionMaxConns, corenet.OptionAdopt, corenet.OptionPlaintext, corenet.OptionName, corenet.OptionEngine, corenet.OptionLoopMiddleware, corenet.OptionBacklog, corenet.OptionReceiveBuffer, corenet.OptionSendBuffer, corenet.OptionKeepAlive, corenet.OptionUserTimeout, corenet.OptionShards, corenet.OptionShareAddress
              do:
                - return: "true"
            - default: true
              do:
                - return: "false"
          "on": k
  - of: (*Server).bindLoopGroup
    participants:
      - id: caller
        kind: actor
      - id: (*Server).bindLoopGroup
        kind: self
      - id: s.operator.plan
        kind: internal
      - id: resolveLanes
        kind: internal
      - id: s.handshakeLog
        kind: internal
      - id: s.adoptStream
        kind: internal
      - id: s.registerLoopListeners
        kind: internal
      - id: s.bindLoopAddress
        kind: internal
      - id: refuseUnixpacketListeners
        kind: internal
      - id: loop
        kind: package
      - id: s.applyHTTPCodec
        kind: internal
      - id: startLanes
        kind: internal
      - id: startOffloading
        kind: internal
      - id: eng.State
        kind: internal
      - id: s.recordFallback
        kind: internal
      - id: wrapHTTPCodec
        kind: internal
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
    steps:
      - var:
          name: lns
          type: "[]stdnet.Listener"
      - var:
          name: owners
          type: "[]int"
      - bind: plan
        eval: s.operator.plan(group.loopBackend(), nativePoller)
        to: s.operator.plan
      - eval: resolveLanes(group)
        to: resolveLanes
      - set: group.hsLog
        to: s.handshakeLog
        value: s.handshakeLog(group)
      - loop:
          do:
            - bind: adopted, err
              eval: s.adoptStream(name)
              to: s.adoptStream
            - opt:
                do:
                  - return: err
                when: err != nil
            - eval: s.registerLoopListeners(group, adopted, nil, 1)
              to: s.registerLoopListeners
            - set: lns
              value: append(lns, group.loopLayers(adopted)...)
            - set: owners
              value: append(owners, make([]int, len(adopted))...)
          key: _
          range: group.adopt
          value: name
      - loop:
          do:
            - bind: bound, boundOwners, err
              eval: s.bindLoopAddress(ctx, group, addr, plan)
              to: s.bindLoopAddress
            - opt:
                do:
                  - return: err
                when: err != nil
            - set: lns
              value: append(lns, bound...)
            - set: owners
              value: append(owners, boundOwners...)
          key: _
          range: group.addrs
          value: addr
      - set: group.loopOwners
        value: owners
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: refuseUnixpacketListeners(group.name, lns)
            to: refuseUnixpacketListeners
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: loop.CheckCapabilities(group.name, group.loop)
            to: loop
          when: err != nil
      - eval: s.applyHTTPCodec(group)
        to: s.applyHTTPCodec
      - eval: startLanes(group)
        to: startLanes
      - bind: eng, err
        eval: startOffloading(ctx, group, lns, plan)
        to: startOffloading
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - eval: s.recordFallback(group.name, st.DegradedReason)
              to: s.recordFallback
          init:
            bind: st
            eval: eng.State()
            to: eng.State
          when: st.Degraded
      - set: eng
        to: wrapHTTPCodec
        value: wrapHTTPCodec(s, group, eng)
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - set: s.loopEngines
        value: append(s.loopEngines, eng)
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - return: nil
  - of: startLanes
    participants:
      - id: caller
        kind: actor
      - id: startLanes
        kind: self
      - id: resolveLanes
        kind: internal
      - id: st.OnStart
        kind: value
    steps:
      - eval: resolveLanes(group)
        to: resolveLanes
      - opt:
          do:
            - eval: st.OnStart(loopLanes(group.loop))
              to: st.OnStart
          init:
            bind: st, ok
            eval: group.loopChain.(corenet.LoopStarter)
          when: ok
  - of: resolveLanes
    participants:
      - id: caller
        kind: actor
      - id: resolveLanes
        kind: self
      - id: loop
        kind: package
    steps:
      - opt:
          do:
            - set: group.loop.Loops, group.loopsSource
              to: loop
              value: loop.ResolveLoops(group.loop.Loops)
          when: group.loopsSource == ""
  - of: (*Server).registerLoopListeners
    participants:
      - id: caller
        kind: actor
      - id: (*Server).registerLoopListeners
        kind: self
      - id: exclusiveOf
        kind: internal
      - id: adoptedBuffers
        kind: internal
    steps:
      - lock:
          mutex: s.mu
      - loop:
          do:
            - bind: addr
              eval: "corenet.AddressValue{Network: ln.Addr().Network(), Addr: ln.Addr().String()}"
            - set: s.listeners
              value: "append(s.listeners, &boundListener{group: group.name, addr: addr, ln: ln})"
            - opt:
                do:
                  - continue: true
                when: shards == 0
            - bind: row
              eval: |-
                corenet.ListenerStateValue{
                			Group: group.name, Address: ln.Addr().String(), Network: addr.Network, Shards: shards, Adopted: rep == nil, HTTP2: group.http2Bounds(),
                		}
            - alt:
                - do:
                    - set: row.Exclusive, row.BindWait
                      value: rep.exclusive, corenet.DurationValue(rep.wait)
                    - set: row.Shared
                      value: rep.shared
                    - set: row.Backlog
                      value: rep.backlog
                    - set: row.ReceiveBuffer, row.SendBuffer
                      value: rep.receiveBuffer, rep.sendBuffer
                    - set: row.Degraded, row.DegradedReason
                      value: rep.backlogReason != "", rep.backlogReason
                  when: rep != nil
                - do:
                    - set: row.Exclusive
                      to: exclusiveOf
                      value: exclusiveOf(listenerSocket(ln))
                    - var:
                        name: why
                        type: string
                    - set: row.ReceiveBuffer, row.SendBuffer, why
                      to: adoptedBuffers
                      value: adoptedBuffers(listenerSocket(ln), bufferSpec(group.limits))
                    - set: row.Degraded, row.DegradedReason
                      value: why != "", why
                  else: true
            - set: s.states
              value: append(s.states, row)
          key: _
          range: lns
          value: ln
  - of: (*Server).loopStates
    participants:
      - id: caller
        kind: actor
      - id: (*Server).loopStates
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: s.mu.RUnlock
        kind: value
    steps:
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: engines
        eval: s.loopEngines
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - var:
          name: out
          type: "[]corenet.LoopStateValue"
      - loop:
          do:
            - set: out
              value: append(out, e.State())
          key: _
          range: engines
          value: e
      - return: out
  - of: (*Server).shutdownLoops
    participants:
      - id: caller
        kind: actor
      - id: (*Server).shutdownLoops
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: s.mu.RUnlock
        kind: value
      - id: e.Shutdown
        kind: internal
    steps:
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: engines
        eval: s.loopEngines
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - var:
          name: first
          type: error
      - loop:
          do:
            - opt:
                do:
                  - set: first
                    value: err
                init:
                  bind: err
                  eval: e.Shutdown(ctx)
                  to: e.Shutdown
                when: err != nil && first == nil
          key: _
          range: engines
          value: e
      - return: first
  - of: (*Server).closeLoops
    participants:
      - id: caller
        kind: actor
      - id: (*Server).closeLoops
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: s.mu.RUnlock
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: engines
        eval: s.loopEngines
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - loop:
          do:
            - eval: swallowErr(e.Close())
              to: swallowErr
          key: _
          range: engines
          value: e
  - of: loopIdle
    participants:
      - id: caller
        kind: actor
      - id: loopIdle
        kind: self
      - id: time
        kind: stdlib
    steps:
      - return: time.Duration(group.timeouts.Idle)
        to: time
  - of: unixpacketRefused
    participants:
      - id: caller
        kind: actor
      - id: unixpacketRefused
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(corenet.LoopOptionUnsupported, errs.WrapParams{},
          		errs.String("group", group), errs.String("network", networkUnixpacket))
        to: errs
  - of: refuseUnixpacketListeners
    participants:
      - id: caller
        kind: actor
      - id: refuseUnixpacketListeners
        kind: self
      - id: unixpacketRefused
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: unixpacketRefused(group)
                    to: unixpacketRefused
                when: ln.Addr().Network() == networkUnixpacket
          key: _
          range: lns
          value: ln
      - return: nil
  - of: isTCPListener
    participants:
      - id: caller
        kind: actor
      - id: isTCPListener
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - return: strings.HasPrefix(ln.Addr().Network(), "tcp")
        to: strings
  - of: findHTTPCodec
    participants:
      - id: caller
        kind: actor
      - id: findHTTPCodec
        kind: self
      - id: l.Next
        kind: value
    steps:
      - loop:
          cond: h != nil
          do:
            - opt:
                do:
                  - return: c
                init:
                  bind: c, ok
                  eval: h.(corenet.LoopHTTPCodec)
                when: ok
            - bind: l, ok
              eval: h.(corenet.LoopLayered)
            - opt:
                do:
                  - return: nil
                when: "!ok"
            - set: h
              to: l.Next
              value: l.Next()
          init: h := chain
      - return: nil
  - of: (*StreamGroup).codecListRefusal
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).codecListRefusal
        kind: self
      - id: findHTTPCodec
        kind: internal
      - id: codec.SetHTTP
        kind: value
      - id: checkProtocols
        kind: internal
      - id: g.protocolsErr
        kind: internal
    steps:
      - bind: codec
        eval: findHTTPCodec(g.loopChain)
        to: findHTTPCodec
      - opt:
          do:
            - return: nil
          when: codec == nil
      - eval: "codec.SetHTTP(corenet.LoopHTTPValue{Protocols: g.codecServes(), HTTP2: g.http2Limits})"
        to: codec.SetHTTP
      - opt:
          do:
            - return: nil
          when: "!g.kinds.has(corenet.OptionProtocols)"
      - opt:
          do:
            - return: g.protocolsErr(reason)
              to: g.protocolsErr
          init:
            bind: reason
            eval: checkProtocols(g.protos, true)
            to: checkProtocols
          when: reason != ""
      - return: nil
  - of: (*StreamGroup).codecServes
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).codecServes
        kind: self
      - id: g.protocolList
        kind: internal
    steps:
      - opt:
          do:
            - return: g.httpProtos.alpn
          when: g.tlsCodec() && g.httpProtos.alpn != nil
      - return: g.protocolList()
        to: g.protocolList
  - of: (*StreamGroup).protocolList
    steps:
      - opt:
          do:
            - return: nil
          when: "!g.kinds.has(corenet.OptionProtocols)"
      - return: g.protos
  - of: (*Server).applyHTTPCodec
    participants:
      - id: caller
        kind: actor
      - id: (*Server).applyHTTPCodec
        kind: self
      - id: findHTTPCodec
        kind: internal
      - id: codec.SetHTTP
        kind: value
    steps:
      - bind: codec
        eval: findHTTPCodec(group.loopChain)
        to: findHTTPCodec
      - opt:
          do:
            - return: ""
          when: codec == nil
      - eval: "codec.SetHTTP(corenet.LoopHTTPValue{Protocols: group.codecServes(), HTTP2: group.http2Limits, HTTP2Off: s.operator.kernelDisabled(corenet.CapabilityHTTP2Loop)})"
        to: codec.SetHTTP
      - set: group.loopBusy
        value: codec.InFlight
  - of: wrapHTTPCodec
    participants:
      - id: caller
        kind: actor
      - id: wrapHTTPCodec
        kind: self
      - id: findHTTPCodec
        kind: internal
      - id: s.operator.kernelSwitches
        kind: internal
    steps:
      - bind: codec
        eval: findHTTPCodec(group.loopChain)
        to: findHTTPCodec
      - opt:
          do:
            - return: eng
          when: codec == nil
      - bind: row
        eval: "corenet.CapabilityValue{Name: corenet.CapabilityHTTP2Loop, Class: classCode, Status: statusOn}"
      - opt:
          do:
            - set: row.Status
              value: statusDisabled
            - set: _, row.Reason
              to: s.operator.kernelSwitches
              value: s.operator.kernelSwitches()
          when: s.operator.kernelDisabled(corenet.CapabilityHTTP2Loop)
      - return: "&httpCodecEngine{loopEngine: eng, codec: codec, row: row}"
  - of: (*httpCodecEngine).Shutdown
    participants:
      - id: caller
        kind: actor
      - id: (*httpCodecEngine).Shutdown
        kind: self
      - id: e.codec.Draining
        kind: value
      - id: e.loopEngine.Shutdown
        kind: internal
    steps:
      - eval: e.codec.Draining()
        to: e.codec.Draining
      - return: e.loopEngine.Shutdown(ctx)
        to: e.loopEngine.Shutdown
  - of: (*httpCodecEngine).State
    participants:
      - id: caller
        kind: actor
      - id: (*httpCodecEngine).State
        kind: self
      - id: e.loopEngine.State
        kind: internal
    steps:
      - bind: st
        eval: e.loopEngine.State()
        to: e.loopEngine.State
      - set: st.Capabilities
        value: append(st.Capabilities, e.row)
      - return: st
  - of: newJobRing
    steps:
      - bind: size
        eval: 1 << bits.Len(uint(max(n, 1)-1))
      - return: "&jobRing{jobs: make([]corenet.LoopJobValue, size), mask: uint64(size - 1)}"
  - of: (*jobRing).push
    participants:
      - id: caller
        kind: actor
      - id: (*jobRing).push
        kind: self
      - id: r.tail.Load
        kind: value
      - id: r.tail.Store
        kind: value
    steps:
      - bind: t
        eval: r.tail.Load()
        to: r.tail.Load
      - opt:
          do:
            - return: "false"
          when: t-r.head.Load() == uint64(len(r.jobs))
      - set: r.jobs[t&r.mask]
        value: job
      - eval: r.tail.Store(t + 1)
        to: r.tail.Store
      - return: "true"
  - of: (*jobRing).pop
    participants:
      - id: caller
        kind: actor
      - id: (*jobRing).pop
        kind: self
      - id: r.head.Load
        kind: value
      - id: r.head.Store
        kind: value
    steps:
      - bind: h
        eval: r.head.Load()
        to: r.head.Load
      - opt:
          do:
            - return: corenet.LoopJobValue{}, false
          when: h == r.tail.Load()
      - bind: job
        eval: r.jobs[h&r.mask]
      - eval: r.head.Store(h + 1)
        to: r.head.Store
      - return: job, true
  - of: (*outboundLane).Send
    participants:
      - id: caller
        kind: actor
      - id: (*outboundLane).Send
        kind: self
      - id: l.io.Store
        kind: value
      - id: l.refused.Add
        kind: value
    steps:
      - opt:
          do:
            - bind: kept
              eval: io
            - eval: l.io.Store(&kept)
              to: l.io.Store
          when: l.io.Load() == nil
      - opt:
          do:
            - eval: l.refused.Add(1)
              to: l.refused.Add
            - return: corenet.LoopOutboundFull
          when: "!l.jobs.push(job)"
      - select:
          cases:
            - comm: l.wake <- struct{}{}
            - default: true
      - return: nil
  - of: (*outboundLane).run
    participants:
      - id: caller
        kind: actor
      - id: (*outboundLane).run
        kind: self
      - id: done.Done
        kind: value
      - id: l.jobs.pop
        kind: internal
      - id: w.Work
        kind: value
      - id: l.complete
        kind: internal
    steps:
      - defer: done.Done()
        to: done.Done
      - loop:
          cond: "!l.stopped.Load()"
          do:
            - bind: job, ok
              eval: l.jobs.pop()
              to: l.jobs.pop
            - opt:
                do:
                  - eval: <-l.wake
                  - continue: true
                when: "!ok"
            - eval: w.Work(l.lane, job)
              to: w.Work
            - eval: l.complete(job)
              to: l.complete
  - of: (*outboundLane).complete
    participants:
      - id: caller
        kind: actor
      - id: (*outboundLane).complete
        kind: self
      - id: time
        kind: stdlib
      - id: l.io.Load
        kind: value
      - id: (*io).Post
        kind: value
    steps:
      - loop:
          cond: "!l.done.push(job)"
          do:
            - opt:
                do:
                  - return: ""
                when: l.stopped.Load()
            - eval: time.Sleep(postRetry)
              to: time
      - opt:
          do:
            - return: ""
          when: "!l.posted.CompareAndSwap(false, true)"
      - bind: io
        eval: l.io.Load()
        to: l.io.Load
      - loop:
          do:
            - bind: err
              eval: (*io).Post(runCompletions, l.key)
              to: (*io).Post
            - opt:
                do:
                  - return: ""
                when: err == nil || !errors.Is(err, corenet.LoopPostQueueFull)
            - eval: time.Sleep(postRetry)
              to: time
          forever: true
  - of: (*outboundLane).drain
    participants:
      - id: caller
        kind: actor
      - id: (*outboundLane).drain
        kind: self
      - id: l.posted.Store
        kind: value
      - id: l.done.pop
        kind: internal
      - id: l.off.OnDone
        kind: value
    steps:
      - eval: l.posted.Store(false)
        to: l.posted.Store
      - loop:
          do:
            - bind: job, ok
              eval: l.done.pop()
              to: l.done.pop
            - opt:
                do:
                  - return: ""
                when: "!ok"
            - eval: l.off.OnDone(io, job)
              to: l.off.OnDone
          forever: true
  - of: (*laneTable).now
    participants:
      - id: caller
        kind: actor
      - id: (*laneTable).now
        kind: self
      - id: t.lanes.Load
        kind: value
    steps:
      - opt:
          do:
            - return: "*p"
          init:
            bind: p
            eval: t.lanes.Load()
            to: t.lanes.Load
          when: p != nil
      - return: nil
  - of: registerLane
    participants:
      - id: caller
        kind: actor
      - id: registerLane
        kind: self
      - id: lanesWith
        kind: internal
      - id: outboundLanes.lanes.Store
        kind: value
    steps:
      - lock:
          mutex: outboundLanes.mu
      - set: l.key
        value: outboundLanes.next
      - op: ++
        set: outboundLanes.next
      - bind: next
        eval: lanesWith(len(outboundLanes.now()) + 1)
        to: lanesWith
      - set: next[l.key]
        value: l
      - eval: outboundLanes.lanes.Store(&next)
        to: outboundLanes.lanes.Store
  - of: releaseLane
    participants:
      - id: caller
        kind: actor
      - id: releaseLane
        kind: self
      - id: lanesWith
        kind: internal
      - id: outboundLanes.lanes.Store
        kind: value
    steps:
      - lock:
          mutex: outboundLanes.mu
      - bind: next
        eval: lanesWith(len(outboundLanes.now()))
        to: lanesWith
      - eval: delete(next, l.key)
      - eval: outboundLanes.lanes.Store(&next)
        to: outboundLanes.lanes.Store
  - of: lanesWith
    participants:
      - id: caller
        kind: actor
      - id: lanesWith
        kind: self
      - id: maps
        kind: stdlib
    steps:
      - bind: next
        eval: make(map[uintptr]*outboundLane, n)
      - eval: maps.Copy(next, outboundLanes.now())
        to: maps
      - return: next
  - of: runCompletions
    participants:
      - id: caller
        kind: actor
      - id: runCompletions
        kind: self
      - id: l.drain
        kind: internal
    steps:
      - bind: l
        eval: outboundLanes.now()[key]
      - opt:
          do:
            - return: ""
          when: l == nil
      - eval: l.drain(io)
        to: l.drain
  - of: startOutbound
    participants:
      - id: caller
        kind: actor
      - id: startOutbound
        kind: self
      - id: findOffloader
        kind: internal
      - id: orDefaultInt
        kind: internal
      - id: loopLanes
        kind: internal
      - id: registerLane
        kind: internal
      - id: o.workers.Add
        kind: value
      - id: l.run
        kind: internal
      - id: off.OnOutbound
        kind: value
    steps:
      - bind: off, w
        eval: findOffloader(chain)
        to: findOffloader
      - opt:
          do:
            - return: nil
          when: w == nil
      - bind: o
        eval: "&outbound{}"
      - bind: depth
        eval: orDefaultInt(v.Outbound, defaultOutboundDepth)
        to: orDefaultInt
      - bind: "n"
        eval: loopLanes(v)
        to: loopLanes
      - bind: outs
        eval: make([]corenet.LoopOutbound, n)
      - loop:
          do:
            - bind: l
              eval: |-
                &outboundLane{
                			lane: i, jobs: newJobRing(depth), done: newJobRing(depth),
                			wake: make(chan struct{}, 1), refused: &o.refused, off: off,
                		}
            - eval: registerLane(l)
              to: registerLane
            - set: o.lanes
              value: append(o.lanes, l)
            - set: outs[i]
              value: l
            - eval: o.workers.Add(1)
              to: o.workers.Add
            - go: l.run(w, &o.workers)
              to: l.run
          key: i
          range: "n"
      - eval: "off.OnOutbound(corenet.LoopOutboundValue{Lanes: outs, OutputCap: orDefaultInt(v.OutputCap, portableOutputCap)})"
        to: off.OnOutbound
      - set: o.busy
        value: off.Pending
      - return: o
  - of: startOffloading
    participants:
      - id: caller
        kind: actor
      - id: startOffloading
        kind: self
      - id: startOutbound
        kind: internal
      - id: startLoopEngine
        kind: internal
      - id: out.signal
        kind: internal
      - id: out.wait
        kind: internal
    steps:
      - bind: out
        eval: startOutbound(group.loopChain, group.loop)
        to: startOutbound
      - opt:
          do:
            - return: startLoopEngine(group, lns, plan)
              to: startLoopEngine
          when: out == nil
      - set: group.loopBusy
        value: out.busy
      - bind: eng, err
        eval: startLoopEngine(group, lns, plan)
        to: startLoopEngine
      - opt:
          do:
            - eval: out.signal()
              to: out.signal
            - eval: out.wait(ctx)
              to: out.wait
            - return: nil, err
          when: err != nil
      - return: "&offloadedEngine{loopEngine: eng, out: out}, nil"
  - of: findOffloader
    participants:
      - id: caller
        kind: actor
      - id: findOffloader
        kind: self
      - id: off.Worker
        kind: value
      - id: layered.Next
        kind: value
    steps:
      - loop:
          cond: h != nil
          do:
            - opt:
                do:
                  - opt:
                      do:
                        - return: off, w
                      init:
                        bind: w
                        eval: off.Worker()
                        to: off.Worker
                      when: w != nil
                init:
                  bind: off, ok
                  eval: h.(corenet.LoopOffloader)
                when: ok
            - bind: layered, ok
              eval: h.(corenet.LoopLayered)
            - opt:
                do:
                  - return: nil, nil
                when: "!ok"
            - set: h
              to: layered.Next
              value: layered.Next()
      - return: nil, nil
  - of: (*outbound).signal
    participants:
      - id: caller
        kind: actor
      - id: (*outbound).signal
        kind: self
      - id: o.stopOnce.Do
        kind: value
    steps:
      - eval: |-
          o.stopOnce.Do(func() {
          		//: each worker, woken to see it, and its entry released.
          		for _, l := range o.lanes {
          			l.stopped.Store(true)
          			releaseLane(l)
          			select {
          			case l.wake <- struct{}{}:
          			default:
          			}
          		}
          	})
        to: o.stopOnce.Do
  - of: (*outbound).wait
    steps:
      - bind: waited
        eval: make(chan struct{})
      - go: |-
          func() {
          		o.workers.Wait()
          		close(waited)
          	}()
      - select:
          cases:
            - comm: <-waited
            - comm: <-ctx.Done()
  - of: (*offloadedEngine).Shutdown
    participants:
      - id: caller
        kind: actor
      - id: (*offloadedEngine).Shutdown
        kind: self
      - id: e.loopEngine.Shutdown
        kind: internal
      - id: e.out.signal
        kind: internal
      - id: e.out.wait
        kind: internal
    steps:
      - bind: err
        eval: e.loopEngine.Shutdown(ctx)
        to: e.loopEngine.Shutdown
      - eval: e.out.signal()
        to: e.out.signal
      - eval: e.out.wait(ctx)
        to: e.out.wait
      - return: err
  - of: (*offloadedEngine).Close
    participants:
      - id: caller
        kind: actor
      - id: (*offloadedEngine).Close
        kind: self
      - id: e.loopEngine.Close
        kind: internal
      - id: e.out.signal
        kind: internal
    steps:
      - bind: err
        eval: e.loopEngine.Close()
        to: e.loopEngine.Close
      - eval: e.out.signal()
        to: e.out.signal
      - return: err
  - of: (*offloadedEngine).State
    participants:
      - id: caller
        kind: actor
      - id: (*offloadedEngine).State
        kind: self
      - id: e.loopEngine.State
        kind: internal
      - id: e.out.refused.Load
        kind: value
    steps:
      - bind: st
        eval: e.loopEngine.State()
        to: e.loopEngine.State
      - set: st.OutboundRefused
        to: e.out.refused.Load
        value: e.out.refused.Load()
      - return: st
  - of: (*portableGroup).live
    participants:
      - id: caller
        kind: actor
      - id: (*portableGroup).live
        kind: self
      - id: pl.live.Load
        kind: value
    steps:
      - var:
          name: "n"
          type: int64
      - loop:
          do:
            - op: +=
              set: "n"
              to: pl.live.Load
              value: pl.live.Load()
          key: _
          range: g.lanes
          value: pl
      - return: "n"
  - of: startPortable
    participants:
      - id: caller
        kind: actor
      - id: startPortable
        kind: self
      - id: loop
        kind: package
      - id: group.handshakeBound
        kind: internal
      - id: ownListeners
        kind: internal
      - id: g.accepting.Add
        kind: value
      - id: g.acceptLoop
        kind: internal
      - id: pl.run
        kind: internal
    steps:
      - bind: v
        eval: group.loop
      - bind: src
        eval: group.loopsSource
      - opt:
          do:
            - set: v.Loops, src
              to: loop
              value: loop.ResolveLoops(v.Loops)
          when: src == ""
      - bind: g
        eval: |-
          &portableGroup{
          		group: group.name, soft: max(v.SoftConns, 0), maxConns: max(group.limits.MaxConns, 0),
          		degraded: degraded, loopsSource: src, procs: runtime.GOMAXPROCS(0),
          		caps:       append(loop.Unprobed("portable", plan.disabled, plan.disabledBy), portableNoDelay(lns, plan)),
          		noDelayOff: slices.Contains(plan.disabled, corenet.CapabilityTCPNoDelay),
          		keepAlive:  portableKeepAlive(group, plan),
          	}
      - opt:
          do:
            - set: g.handshake
              to: group.handshakeBound
              value: group.handshakeBound()
            - set: g.hsLog
              value: group.hsLog
          when: group.tlsCodec()
      - loop:
          do:
            - set: g.lanes
              value: |-
                append(g.lanes, &portableLoop{
                			g: g, lane: i, h: group.loopChain, busy: group.loopBusy,
                			spillCap: orDefaultInt(v.SpillCap, portableSpillCap),
                			outCap:   orDefaultInt(v.OutputCap, portableOutputCap),
                			idle:     loopIdle(group),
                			events:   make(chan portableEvent, portableEvents),
                			postOps:  make([]corenet.PostFunc, portablePostCap), postArgs: make([]uintptr, portablePostCap),
                			wake: make(chan struct{}, 1), done: make(chan struct{}),
                		})
          key: i
          range: loopLanes(v)
      - set: g.lns, g.owned
        to: ownListeners
        value: ownListeners(lns)
      - loop:
          do:
            - eval: g.accepting.Add(1)
              to: g.accepting.Add
            - go: g.acceptLoop(ln)
              to: g.acceptLoop
          key: _
          range: g.lns
          value: ln
      - loop:
          do:
            - go: pl.run(pl.done)
              to: pl.run
          key: _
          range: g.lanes
          value: pl
      - return: "portableEngine{g: g}"
  - of: portableNoDelay
    steps:
      - bind: row
        eval: "corenet.CapabilityValue{Name: corenet.CapabilityTCPNoDelay, Class: classKernel, Status: statusOn, Reason: \"the netpoller's default\"}"
      - opt:
          do:
            - set: row.Status, row.Reason
              value: statusDisabled, plan.disabledBy
            - return: row
          when: slices.Contains(plan.disabled, corenet.CapabilityTCPNoDelay)
      - opt:
          do:
            - set: row.Status, row.Reason
              value: statusUnprobed, unixSocketReason
          when: "!slices.ContainsFunc(lns, isTCPListener)"
      - return: row
  - of: orDefaultInt
    steps:
      - opt:
          do:
            - return: def
          when: v <= 0
      - return: v
  - of: (*portableGroup).acceptLoop
    participants:
      - id: caller
        kind: actor
      - id: (*portableGroup).acceptLoop
        kind: self
      - id: g.accepting.Add
        kind: value
      - id: ln.Accept
        kind: value
      - id: time
        kind: stdlib
      - id: g.admit
        kind: internal
    steps:
      - defer: g.accepting.Add(-1)
        to: g.accepting.Add
      - bind: failures
        eval: "0"
      - loop:
          do:
            - bind: c, err
              eval: ln.Accept()
              to: ln.Accept
            - opt:
                do:
                  - opt:
                      do:
                        - return: ""
                      when: errors.Is(err, stdnet.ErrClosed) || g.stopReq.Load()
                  - op: ++
                    set: failures
                  - eval: time.Sleep(acceptDelay(failures))
                    to: time
                  - continue: true
                when: err != nil
            - set: failures
              value: "0"
            - eval: g.admit(c)
              to: g.admit
          forever: true
  - of: (*portableGroup).admit
    participants:
      - id: caller
        kind: actor
      - id: (*portableGroup).admit
        kind: self
      - id: g.rejected.Add
        kind: value
      - id: swallowErr
        kind: internal
      - id: g.dispatch
        kind: internal
    steps:
      - opt:
          do:
            - eval: g.rejected.Add(1)
              to: g.rejected.Add
            - eval: swallowErr(c.Close())
              to: swallowErr
            - return: ""
          when: g.maxConns > 0 && g.live() >= int64(g.maxConns)
      - eval: g.dispatch(c)
        to: g.dispatch
  - of: (*portableGroup).takeQueues
    participants:
      - id: caller
        kind: actor
      - id: (*portableGroup).takeQueues
        kind: self
      - id: time
        kind: stdlib
      - id: tick.Stop
        kind: value
      - id: g.takeRound
        kind: internal
      - id: g.giveUp
        kind: internal
    steps:
      - bind: takes
        eval: make([]portableTake, len(g.owned))
      - bind: tick
        eval: time.NewTicker(portableTick)
        to: time
      - defer: tick.Stop()
        to: tick.Stop
      - loop:
          do:
            - bind: blocked
              eval: g.takeRound(takes)
              to: g.takeRound
            - opt:
                do:
                  - return: ""
                when: "!blocked"
            - opt:
                do:
                  - eval: g.giveUp(takes)
                    to: g.giveUp
                  - return: ""
                when: g.live() == 0 || ctx.Err() != nil
            - select:
                cases:
                  - comm: <-ctx.Done()
                  - comm: <-tick.C
          forever: true
  - of: (*portableGroup).takeRound
    participants:
      - id: caller
        kind: actor
      - id: (*portableGroup).takeRound
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - bind: blocked
        eval: "false"
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: takes[i].done
            - opt:
                do:
                  - set: blocked
                    value: "true"
                  - continue: true
                when: takeQueue(ln, g.admit, &takes[i])
            - set: takes[i].done
              value: "true"
            - eval: swallowErr(ln.Close())
              to: swallowErr
          key: i
          range: g.owned
          value: ln
      - return: blocked
  - of: (*portableGroup).giveUp
    participants:
      - id: caller
        kind: actor
      - id: (*portableGroup).giveUp
        kind: self
      - id: closeRaw
        kind: internal
      - id: swallowErr
        kind: internal
    steps:
      - loop:
          do:
            - eval: closeRaw(takes[i].held)
              to: closeRaw
            - set: takes[i].held
              value: nil
            - opt:
                do:
                  - eval: swallowErr(ln.Close())
                    to: swallowErr
                when: "!takes[i].done"
          key: i
          range: g.owned
          value: ln
  - of: (*portableGroup).closeOwned
    participants:
      - id: caller
        kind: actor
      - id: (*portableGroup).closeOwned
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - loop:
          do:
            - eval: swallowErr(ln.Close())
              to: swallowErr
          key: _
          range: g.owned
          value: ln
  - of: (*portableGroup).dispatch
    participants:
      - id: caller
        kind: actor
      - id: (*portableGroup).dispatch
        kind: self
      - id: pl.live.Add
        kind: value
      - id: pl.negotiating.Add
        kind: value
      - id: pl.negotiate
        kind: internal
      - id: swallowErr
        kind: internal
    steps:
      - bind: pl
        eval: g.lanes[(g.turn.Add(1)-1)%uint64(len(g.lanes))]
      - eval: pl.live.Add(1)
        to: pl.live.Add
      - opt:
          do:
            - eval: pl.negotiating.Add(1)
              to: pl.negotiating.Add
            - go: pl.negotiate(c, g.handshake)
              to: pl.negotiate
            - return: ""
          when: g.handshake > 0
      - select:
          cases:
            - comm: "pl.events <- portableEvent{kind: pevOpen, conn: c}"
            - comm: <-pl.done
              do:
                - eval: pl.live.Add(-1)
                  to: pl.live.Add
                - eval: swallowErr(c.Close())
                  to: swallowErr
  - of: (*portableLoop).negotiate
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).negotiate
        kind: self
      - id: pl.negotiating.Add
        kind: value
      - id: pl.live.Add
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - defer: pl.negotiating.Add(-1)
        to: pl.negotiating.Add
      - opt:
          do:
            - eval: pl.live.Add(-1)
              to: pl.live.Add
            - return: ""
          when: "!handshake(c, d, pl.g.hsLog)"
      - select:
          cases:
            - comm: "pl.events <- portableEvent{kind: pevOpen, conn: c}"
            - comm: <-pl.done
              do:
                - eval: pl.live.Add(-1)
                  to: pl.live.Add
                - eval: swallowErr(c.Close())
                  to: swallowErr
  - of: (*portableLoop).run
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).run
        kind: self
      - id: time
        kind: stdlib
      - id: tick.Stop
        kind: value
      - id: pl.handle
        kind: internal
      - id: pl.batch
        kind: internal
      - id: pl.closeAll
        kind: internal
    steps:
      - defer: close(done)
      - bind: tick
        eval: time.NewTicker(portableTick)
        to: time
      - defer: tick.Stop()
        to: tick.Stop
      - loop:
          do:
            - select:
                cases:
                  - comm: ev := <-pl.events
                    do:
                      - eval: pl.handle(&ev)
                        to: pl.handle
                  - comm: <-pl.wake
                  - comm: <-tick.C
            - eval: pl.batch()
              to: pl.batch
            - opt:
                do:
                  - eval: pl.closeAll()
                    to: pl.closeAll
                  - return: ""
                when: pl.finished()
          forever: true
  - of: (*portableLoop).finished
    steps:
      - opt:
          do:
            - return: "true"
          when: pl.g.stopReq.Load()
      - return: pl.draining && pl.g.accepting.Load() == 0 && pl.live.Load() == 0
  - of: (*portableLoop).batch
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).batch
        kind: self
      - id: pl.collect
        kind: internal
      - id: pl.drainPosts
        kind: internal
      - id: time
        kind: stdlib
      - id: pl.timers
        kind: internal
      - id: pl.control
        kind: internal
      - id: pl.h.OnBatchEnd
        kind: value
      - id: pl.endBatch
        kind: internal
    steps:
      - eval: pl.collect()
        to: pl.collect
      - eval: pl.drainPosts()
        to: pl.drainPosts
      - opt:
          do:
            - eval: pl.timers(now)
              to: pl.timers
          init:
            bind: now
            eval: time.Now()
            to: time
          when: "!now.Before(pl.timersAt)"
      - eval: pl.control()
        to: pl.control
      - eval: pl.h.OnBatchEnd(pl)
        to: pl.h.OnBatchEnd
      - eval: pl.endBatch()
        to: pl.endBatch
  - of: (*portableLoop).collect
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).collect
        kind: self
      - id: pl.handle
        kind: internal
    steps:
      - loop:
          do:
            - select:
                cases:
                  - comm: ev := <-pl.events
                    do:
                      - eval: pl.handle(&ev)
                        to: pl.handle
                  - default: true
                    do:
                      - return: ""
          range: portableEvents
  - of: (*portableLoop).handle
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).handle
        kind: self
      - id: pl.open
        kind: internal
      - id: pl.handleData
        kind: internal
      - id: pl.handleEnd
        kind: internal
      - id: pl.handleSent
        kind: internal
    steps:
      - switch:
          cases:
            - case: pevOpen
              do:
                - eval: pl.open(ev.conn)
                  to: pl.open
            - case: pevData
              do:
                - eval: pl.handleData(ev)
                  to: pl.handleData
            - case: pevEnd
              do:
                - eval: pl.handleEnd(ev)
                  to: pl.handleEnd
            - case: pevSent
              do:
                - eval: pl.handleSent(ev)
                  to: pl.handleSent
          "on": ev.kind
  - of: (*portableLoop).handleData
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).handleData
        kind: self
      - id: pl.lookupSlot
        kind: internal
      - id: pl.deliver
        kind: internal
    steps:
      - bind: pc
        eval: pl.lookupSlot(ev.slot, ev.gen)
        to: pl.lookupSlot
      - set: pl.batchAcks
        value: append(pl.batchAcks, pl.conns[ev.slot].ack)
      - opt:
          do:
            - return: ""
          when: pc == nil || !pc.open || pc.lingering.Load()
      - eval: pl.deliver(ev.slot, pc, ev.data)
        to: pl.deliver
  - of: (*portableLoop).handleEnd
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).handleEnd
        kind: self
      - id: pl.lookupSlot
        kind: internal
      - id: pl.markDirty
        kind: internal
      - id: pl.finish
        kind: internal
    steps:
      - bind: pc
        eval: pl.lookupSlot(ev.slot, ev.gen)
        to: pl.lookupSlot
      - opt:
          do:
            - return: ""
          when: pc == nil || !pc.open
      - opt:
          do:
            - set: pc.peerDone
              value: "true"
            - eval: pl.markDirty(ev.slot)
              to: pl.markDirty
            - return: ""
          when: errors.Is(ev.err, io.EOF) && !pc.reasonSet
      - eval: pl.finish(ev.slot, pc, ev.err)
        to: pl.finish
  - of: (*portableLoop).handleSent
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).handleSent
        kind: self
      - id: pl.lookupSlot
        kind: internal
      - id: time
        kind: stdlib
      - id: pl.markDirty
        kind: internal
      - id: pl.h.OnWritable
        kind: value
    steps:
      - bind: pc
        eval: pl.lookupSlot(ev.slot, ev.gen)
        to: pl.lookupSlot
      - opt:
          do:
            - return: ""
          when: pc == nil || !pc.open
      - set: pc.lastIO
        to: time
        value: time.Now()
      - eval: pl.markDirty(ev.slot)
        to: pl.markDirty
      - opt:
          do:
            - set: pc.wantWrite
              value: "false"
            - eval: "pl.h.OnWritable(pl, corenet.LoopConnRef{Slot: uint32(ev.slot), Gen: pc.gen})"
              to: pl.h.OnWritable
          when: pc.wantWrite && pl.pending(pc) < pl.outCap/4
  - of: (*portableLoop).open
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).open
        kind: self
      - id: swallowErr
        kind: internal
      - id: applyAcceptedKeepAlive
        kind: internal
      - id: pl.accepted.Add
        kind: value
      - id: pl.readers.Add
        kind: value
      - id: pl.reader
        kind: internal
      - id: pl.writer
        kind: internal
      - id: pl.h.OnOpen
        kind: value
    steps:
      - opt:
          do:
            - eval: swallowErr(tc.SetNoDelay(false))
              to: swallowErr
          init:
            bind: tc, ok
            eval: c.(*stdnet.TCPConn)
          when: ok && pl.g.noDelayOff
      - opt:
          do:
            - eval: applyAcceptedKeepAlive(tc, pl.g.keepAlive)
              to: applyAcceptedKeepAlive
          init:
            bind: tc, ok
            eval: c.(*stdnet.TCPConn)
          when: ok
      - var:
          name: slot
          type: int32
      - alt:
          - do:
              - set: slot
                value: pl.free[n-1]
              - set: pl.free
                value: pl.free[:n-1]
            init:
              bind: "n"
              eval: len(pl.free)
            when: n > 0
          - do:
              - set: slot
                value: int32(len(pl.conns))
              - set: pl.conns
                value: append(pl.conns, &portableConn{})
            else: true
      - bind: prev
        eval: pl.conns[slot]
      - bind: gen
        eval: prev.gen + 1
      - opt:
          do:
            - set: gen
              value: "1"
          when: gen == 0
      - bind: pc
        eval: |-
          &portableConn{
          		conn: c, gen: gen, ack: make(chan struct{}, 1), kick: make(chan struct{}, 1), open: true, lastIO: time.Now(),
          		pressure: pl.g.soft > 0 && pl.g.live() > int64(pl.g.soft),
          		peer:     portablePeer(c),
          	}
      - set: pl.conns[slot]
        value: pc
      - eval: pl.accepted.Add(1)
        to: pl.accepted.Add
      - eval: pl.readers.Add(1)
        to: pl.readers.Add
      - go: pl.reader(slot, pc)
        to: pl.reader
      - go: pl.writer(slot, pc)
        to: pl.writer
      - eval: "pl.h.OnOpen(pl, corenet.LoopConnRef{Slot: uint32(slot), Gen: gen})"
        to: pl.h.OnOpen
  - of: (*portableLoop).reader
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).reader
        kind: self
      - id: pl.readers.Done
        kind: value
      - id: pc.conn.Read
        kind: value
      - id: fillMark
        kind: internal
    steps:
      - defer: pl.readers.Done()
        to: pl.readers.Done
      - bind: buf
        eval: make([]byte, portableReadSize)
      - loop:
          do:
            - bind: n, err
              eval: pc.conn.Read(buf)
              to: pc.conn.Read
            - opt:
                do:
                  - send:
                      chan: pl.events
                      value: "portableEvent{kind: pevData, slot: slot, gen: pc.gen, data: buf[:n]}"
                  - eval: <-pc.ack
                  - opt:
                      do:
                        - eval: fillMark(buf[:n])
                          to: fillMark
                      when: markRecycled.Load()
                when: n > 0
            - opt:
                do:
                  - send:
                      chan: pl.events
                      value: "portableEvent{kind: pevEnd, slot: slot, gen: pc.gen, err: err}"
                  - return: ""
                when: err != nil
          forever: true
  - of: (*portableLoop).writer
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).writer
        kind: self
      - id: pl.dropOutput
        kind: internal
      - id: pc.mu.Lock
        kind: value
      - id: pc.mu.Unlock
        kind: value
      - id: swallowErr
        kind: internal
      - id: pc.conn.Write
        kind: value
      - id: pl.bytesOut.Add
        kind: value
      - id: pl.pendingOutput.Add
        kind: value
    steps:
      - defer: pl.dropOutput(pc)
        to: pl.dropOutput
      - loop:
          do:
            - loop:
                do:
                  - eval: pc.mu.Lock()
                    to: pc.mu.Lock
                  - bind: out
                    eval: pc.out
                  - set: pc.flight
                    value: len(out)
                  - set: pc.out
                    value: nil
                  - bind: closing, linger
                    eval: pc.closing, pc.linger
                  - eval: pc.mu.Unlock()
                    to: pc.mu.Unlock
                  - opt:
                      do:
                        - opt:
                            do:
                              - opt:
                                  do:
                                    - return: ""
                                  when: linger && lingerClose(pc)
                              - eval: swallowErr(pc.conn.Close())
                                to: swallowErr
                              - return: ""
                            when: closing
                        - break: true
                      when: len(out) == 0
                  - bind: n, err
                    eval: pc.conn.Write(out)
                    to: pc.conn.Write
                  - eval: pc.mu.Lock()
                    to: pc.mu.Lock
                  - set: pc.flight
                    value: "0"
                  - eval: pc.mu.Unlock()
                    to: pc.mu.Unlock
                  - eval: pl.bytesOut.Add(uint64(n))
                    to: pl.bytesOut.Add
                  - eval: pl.pendingOutput.Add(-int64(len(out)))
                    to: pl.pendingOutput.Add
                  - opt:
                      do:
                        - eval: swallowErr(pc.conn.Close())
                          to: swallowErr
                        - send:
                            chan: pl.events
                            value: "portableEvent{kind: pevEnd, slot: slot, gen: pc.gen, err: err}"
                        - return: ""
                      when: err != nil
                  - send:
                      chan: pl.events
                      value: "portableEvent{kind: pevSent, slot: slot, gen: pc.gen}"
                forever: true
          range: pc.kick
  - of: lingerClose
    participants:
      - id: caller
        kind: actor
      - id: lingerClose
        kind: self
      - id: pc.lingering.Store
        kind: value
    steps:
      - bind: cw, ok
        eval: pc.conn.(interface{ CloseWrite() error })
      - opt:
          do:
            - return: "false"
          when: "!ok"
      - eval: pc.lingering.Store(true)
        to: pc.lingering.Store
      - return: cw.CloseWrite() == nil && pc.conn.SetReadDeadline(time.Now().Add(portableLinger)) == nil
  - of: (*portableLoop).dropOutput
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).dropOutput
        kind: self
      - id: pc.mu.Lock
        kind: value
      - id: pc.mu.Unlock
        kind: value
      - id: pl.pendingOutput.Add
        kind: value
    steps:
      - eval: pc.mu.Lock()
        to: pc.mu.Lock
      - bind: left
        eval: len(pc.out)
      - set: pc.out
        value: nil
      - eval: pc.mu.Unlock()
        to: pc.mu.Unlock
      - eval: pl.pendingOutput.Add(-int64(left))
        to: pl.pendingOutput.Add
  - of: (*portableLoop).lookupSlot
    steps:
      - opt:
          do:
            - return: nil
          when: int(slot) >= len(pl.conns) || pl.conns[slot].gen != gen || gen == 0
      - return: pl.conns[slot]
  - of: (*portableLoop).lookup
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).lookup
        kind: self
      - id: pl.lookupSlot
        kind: internal
    steps:
      - bind: pc
        eval: pl.lookupSlot(int32(ref.Slot), ref.Gen)
        to: pl.lookupSlot
      - opt:
          do:
            - return: 0, nil
          when: ref.Ring != 0 || pc == nil || !pc.open || pc.reasonSet
      - return: int32(ref.Slot), pc
  - of: (*portableConn).heard
    steps:
      - set: pc.lastIO
        value: now
      - opt:
          do:
            - set: pc.heardAt
              value: now
          when: pc.heardAt.IsZero()
  - of: (*portableLoop).deliver
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).deliver
        kind: self
      - id: pl.bytesIn.Add
        kind: value
      - id: pc.heard
        kind: internal
      - id: pl.spillClosed.Add
        kind: value
      - id: pl.finish
        kind: internal
      - id: clampUsed
        kind: internal
    steps:
      - eval: pl.bytesIn.Add(uint64(len(data)))
        to: pl.bytesIn.Add
      - eval: pc.heard(time.Now())
        to: pc.heard
      - bind: ref
        eval: "corenet.LoopConnRef{Slot: uint32(slot), Gen: pc.gen}"
      - bind: buf
        eval: data
      - opt:
          do:
            - opt:
                do:
                  - eval: pl.spillClosed.Add(1)
                    to: pl.spillClosed.Add
                  - eval: pl.finish(slot, pc, corenet.LoopSpillFull)
                    to: pl.finish
                  - return: ""
                when: len(pc.spill)-pc.spillOff+len(data) > pl.spillCap
            - set: pc.spill
              value: append(pc.spill, data...)
            - set: buf
              value: pc.spill[pc.spillOff:]
          when: len(pc.spill) > pc.spillOff
      - bind: "n"
        eval: clampUsed(pl.h.OnData(pl, ref, buf), len(buf))
        to: clampUsed
      - opt:
          do:
            - return: ""
          when: "!pc.open"
      - alt:
          - do:
              - op: +=
                set: pc.spillOff
                value: "n"
              - opt:
                  do:
                    - set: pc.compact
                      value: "true"
                    - set: pl.compact
                      value: append(pl.compact, slot)
                  when: n > 0 && !pc.compact
            when: len(pc.spill) > pc.spillOff
          - do:
              - bind: tail
                eval: buf[n:]
              - opt:
                  do:
                    - eval: pl.spillClosed.Add(1)
                      to: pl.spillClosed.Add
                    - eval: pl.finish(slot, pc, corenet.LoopSpillFull)
                      to: pl.finish
                    - return: ""
                  when: len(tail) > pl.spillCap
              - set: pc.spill
                value: append(pc.spill[:0:0], tail...)
              - set: pc.spillOff
                value: "0"
            when: n < len(buf)
  - of: clampUsed
    steps:
      - opt:
          do:
            - return: "n"
          when: v < 0 || v > n
      - return: v
  - of: (*portableLoop).pending
    steps:
      - lock:
          mutex: pc.mu
      - return: len(pc.out) + pc.flight
  - of: (*portableLoop).markDirty
    steps:
      - set: pl.dirty
        value: append(pl.dirty, slot)
  - of: (*portableLoop).finish
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).finish
        kind: self
      - id: pl.live.Add
        kind: value
      - id: pl.closed.Add
        kind: value
      - id: pl.h.OnClose
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "!pc.open"
      - set: pc.open
        value: "false"
      - opt:
          do:
            - set: err
              value: nil
          when: errors.Is(err, io.EOF) || errors.Is(err, stdnet.ErrClosed)
      - opt:
          do:
            - set: err
              value: pc.closeErr
          when: pc.reasonSet
      - eval: pl.live.Add(-1)
        to: pl.live.Add
      - eval: pl.closed.Add(1)
        to: pl.closed.Add
      - eval: "pl.h.OnClose(pl, corenet.LoopConnRef{Slot: uint32(slot), Gen: pc.gen}, err)"
        to: pl.h.OnClose
      - eval: swallowErr(pc.conn.Close())
        to: swallowErr
      - eval: close(pc.kick)
      - set: pl.free
        value: append(pl.free, slot)
  - of: (*portableLoop).timers
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).timers
        kind: self
      - id: now.Add
        kind: value
      - id: pl.timer
        kind: internal
    steps:
      - set: pl.timersAt
        to: now.Add
        value: now.Add(portableTick)
      - loop:
          do:
            - opt:
                do:
                  - eval: pl.timer(int32(slot), pc, now)
                    to: pl.timer
                when: pc.open
          key: slot
          range: pl.conns
          value: pc
  - of: (*portableLoop).timer
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).timer
        kind: self
      - id: pl.idleClosed.Add
        kind: value
      - id: pl.finish
        kind: internal
      - id: pl.timeouts.Add
        kind: value
      - id: pl.h.OnTimeout
        kind: value
    steps:
      - opt:
          do:
            - set: pc.reasonSet, pc.closeErr
              value: true, os.ErrDeadlineExceeded
            - eval: pl.idleClosed.Add(1)
              to: pl.idleClosed.Add
            - eval: pl.finish(slot, pc, os.ErrDeadlineExceeded)
              to: pl.finish
            - return: ""
          when: pl.idle > 0 && now.Sub(pc.lastIO) >= pl.idle && pl.pending(pc) == 0
      - opt:
          do:
            - set: pc.deadline
              value: time.Time{}
            - eval: pl.timeouts.Add(1)
              to: pl.timeouts.Add
            - eval: "pl.h.OnTimeout(pl, corenet.LoopConnRef{Slot: uint32(slot), Gen: pc.gen})"
              to: pl.h.OnTimeout
          when: "!pc.deadline.IsZero() && !now.Before(pc.deadline)"
      - opt:
          do:
            - set: pl.timersAt
              value: pc.deadline
          when: "!pc.deadline.IsZero() && pc.deadline.Before(pl.timersAt)"
  - of: (*portableLoop).control
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).control
        kind: self
      - id: pl.closeSettled
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "!pl.g.drainReq.Load()"
      - set: pl.draining
        value: "true"
      - eval: pl.closeSettled()
        to: pl.closeSettled
  - of: (*portableLoop).closeSettled
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).closeSettled
        kind: self
      - id: time
        kind: stdlib
      - id: d.OnDrain
        kind: value
      - id: pl.markDirty
        kind: internal
    steps:
      - bind: now
        eval: time.Now()
        to: time
      - loop:
          do:
            - opt:
                do:
                  - opt:
                      do:
                        - set: pc.drained
                          value: "true"
                        - eval: "d.OnDrain(pl, corenet.LoopConnRef{Slot: uint32(slot), Gen: pc.gen})"
                          to: d.OnDrain
                        - continue: true
                      init:
                        bind: d, ok
                        eval: pl.h.(corenet.LoopDrainer)
                      when: ok && !pc.drained
                  - set: pc.reasonSet, pc.closeErr
                    value: true, corenet.ServerClosed
                  - eval: pl.markDirty(int32(slot))
                    to: pl.markDirty
                when: pl.drainable(int32(slot), pc, now)
          key: slot
          range: pl.conns
          value: pc
  - of: (*portableLoop).drainable
    steps:
      - return: |-
          pc.open && !pc.reasonSet && len(pc.spill) == pc.spillOff &&
          		(!pc.heardAt.IsZero() || now.Sub(pc.lastIO) >= portableQuiet) &&
          		(pl.busy == nil || !pl.busy(pl.lane, corenet.LoopConnRef{Slot: uint32(slot), Gen: pc.gen}))
  - of: (*portableLoop).endBatch
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).endBatch
        kind: self
      - id: pl.settle
        kind: internal
      - id: pl.compactListed
        kind: internal
      - id: pl.batches.Add
        kind: value
    steps:
      - loop:
          do:
            - eval: pl.settle(slot)
              to: pl.settle
          key: _
          range: pl.dirty
          value: slot
      - set: pl.dirty
        value: pl.dirty[:0]
      - loop:
          do:
            - send:
                chan: a
                value: struct{}{}
          key: _
          range: pl.batchAcks
          value: a
      - set: pl.batchAcks
        value: pl.batchAcks[:0]
      - eval: pl.compactListed()
        to: pl.compactListed
      - eval: pl.batches.Add(1)
        to: pl.batches.Add
  - of: (*portableLoop).settle
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).settle
        kind: self
      - id: pl.finish
        kind: internal
    steps:
      - bind: pc
        eval: pl.conns[slot]
      - opt:
          do:
            - return: ""
          when: "!pc.open"
      - opt:
          do:
            - eval: pl.finish(slot, pc, pc.closeErr)
              to: pl.finish
            - return: ""
          when: markClosing(pc)
      - select:
          cases:
            - comm: pc.kick <- struct{}{}
            - default: true
  - of: markClosing
    steps:
      - lock:
          mutex: pc.mu
      - bind: closing
        eval: pc.reasonSet || pc.peerDone
      - opt:
          do:
            - set: pc.closing
              value: "true"
            - set: pc.linger
              value: pc.reasonSet && pc.closeErr == nil && !pc.peerDone
          when: closing
      - return: closing && !pc.linger && len(pc.out) == 0 && pc.flight == 0
  - of: (*portableLoop).closeAll
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).closeAll
        kind: self
      - id: pl.finish
        kind: internal
      - id: pl.postMu.Lock
        kind: value
      - id: pl.postMu.Unlock
        kind: value
    steps:
      - loop:
          do:
            - opt:
                do:
                  - set: pc.reasonSet, pc.closeErr
                    value: true, corenet.ServerClosed
                  - eval: pl.finish(int32(slot), pc, corenet.ServerClosed)
                    to: pl.finish
                when: pc.open
          key: slot
          range: pl.conns
          value: pc
      - eval: pl.postMu.Lock()
        to: pl.postMu.Lock
      - set: pl.postShut
        value: "true"
      - eval: pl.postMu.Unlock()
        to: pl.postMu.Unlock
      - loop:
          do:
            - send:
                chan: a
                value: struct{}{}
          key: _
          range: pl.batchAcks
          value: a
      - go: |-
          func() {
          		quiet := time.NewTimer(time.Second)
          		defer quiet.Stop()
          		//: a reader still sending its last event finds nobody; drained here,
          		//: until a second passes with none and no handshake still running —
          		//: one that completes hands its connection over to this loop alone.
          		for {
          			select {
          			case ev := <-pl.events:
          				pl.discard(&ev)
          				quiet.Reset(time.Second)
          			case <-quiet.C:
          				//: a handshake still running may yet hand one over.
          				if pl.negotiating.Load() > 0 {
          					quiet.Reset(time.Second)
          					continue
          				}
          				//: nobody left to send: what the last ones left, then out.
          				pl.discardBuffered()
          				return
          			}
          		}
          	}()
  - of: (*portableLoop).discard
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).discard
        kind: self
      - id: pl.live.Add
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - opt:
          do:
            - eval: pl.live.Add(-1)
              to: pl.live.Add
            - eval: swallowErr(ev.conn.Close())
              to: swallowErr
          when: ev.kind == pevOpen
  - of: (*portableLoop).discardBuffered
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).discardBuffered
        kind: self
      - id: pl.discard
        kind: internal
    steps:
      - loop:
          do:
            - select:
                cases:
                  - comm: ev := <-pl.events
                    do:
                      - eval: pl.discard(&ev)
                        to: pl.discard
                  - default: true
                    do:
                      - return: ""
          forever: true
  - of: (*portableLoop).drainPosts
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).drainPosts
        kind: self
      - id: pl.postWait.Store
        kind: value
      - id: pl.postMu.Lock
        kind: value
      - id: pl.postMu.Unlock
        kind: value
    steps:
      - eval: pl.postWait.Store(false)
        to: pl.postWait.Store
      - loop:
          do:
            - eval: pl.postMu.Lock()
              to: pl.postMu.Lock
            - opt:
                do:
                  - eval: pl.postMu.Unlock()
                    to: pl.postMu.Unlock
                  - return: ""
                when: pl.postN == 0
            - bind: op, arg
              eval: pl.postOps[pl.postHead], pl.postArgs[pl.postHead]
            - set: pl.postOps[pl.postHead]
              value: nil
            - set: pl.postHead
              value: (pl.postHead + 1) % len(pl.postOps)
            - op: "--"
              set: pl.postN
            - eval: pl.postMu.Unlock()
              to: pl.postMu.Unlock
            - eval: op(pl, arg)
          forever: true
  - of: (*portableLoop).Write
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).Write
        kind: self
      - id: pl.lookup
        kind: internal
      - id: pc.mu.Lock
        kind: value
      - id: pc.mu.Unlock
        kind: value
      - id: pl.outputRefused.Add
        kind: value
      - id: pl.pendingOutput.Add
        kind: value
      - id: pl.markDirty
        kind: internal
    steps:
      - bind: slot, pc
        eval: pl.lookup(ref)
        to: pl.lookup
      - opt:
          do:
            - return: corenet.LoopStaleRef
          when: pc == nil
      - eval: pc.mu.Lock()
        to: pc.mu.Lock
      - opt:
          do:
            - eval: pc.mu.Unlock()
              to: pc.mu.Unlock
            - set: pc.wantWrite
              value: "true"
            - eval: pl.outputRefused.Add(1)
              to: pl.outputRefused.Add
            - return: corenet.LoopOutputFull
          when: len(pc.out)+pc.flight+len(p) > pl.outCap
      - set: pc.out
        value: append(pc.out, p...)
      - eval: pl.pendingOutput.Add(int64(len(p)))
        to: pl.pendingOutput.Add
      - eval: pc.mu.Unlock()
        to: pc.mu.Unlock
      - eval: pl.markDirty(slot)
        to: pl.markDirty
      - return: nil
  - of: (*portableLoop).Close
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).Close
        kind: self
      - id: pl.lookup
        kind: internal
      - id: pl.markDirty
        kind: internal
    steps:
      - bind: slot, pc
        eval: pl.lookup(ref)
        to: pl.lookup
      - opt:
          do:
            - return: corenet.LoopStaleRef
          when: pc == nil
      - set: pc.reasonSet, pc.closeErr
        value: true, nil
      - eval: pl.markDirty(slot)
        to: pl.markDirty
      - return: nil
  - of: (*portableLoop).SetDeadline
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).SetDeadline
        kind: self
      - id: pl.lookup
        kind: internal
      - id: time.Now().Add
        kind: value
    steps:
      - bind: _, pc
        eval: pl.lookup(ref)
        to: pl.lookup
      - opt:
          do:
            - return: corenet.LoopStaleRef
          when: pc == nil
      - alt:
          - do:
              - set: pc.deadline
                value: time.Time{}
            when: d <= 0
          - do:
              - set: pc.deadline
                to: time.Now().Add
                value: time.Now().Add(d)
              - opt:
                  do:
                    - set: pl.timersAt
                      value: pc.deadline
                  when: pc.deadline.Before(pl.timersAt)
            else: true
      - return: nil
  - of: (*portableLoop).Pressure
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).Pressure
        kind: self
      - id: pl.lookup
        kind: internal
    steps:
      - bind: _, pc
        eval: pl.lookup(ref)
        to: pl.lookup
      - return: pc != nil && pc.pressure
  - of: (*portableLoop).Peer
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).Peer
        kind: self
      - id: pl.lookup
        kind: internal
    steps:
      - bind: _, pc
        eval: pl.lookup(ref)
        to: pl.lookup
      - opt:
          do:
            - return: corenet.LoopPeerValue{}, false
          when: pc == nil || !pc.peer.Verified
      - return: pc.peer, true
  - of: (*portableLoop).Loop
    steps:
      - return: pl.lane
  - of: (*portableLoop).Post
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).Post
        kind: self
      - id: pl.postMu.Lock
        kind: value
      - id: pl.postMu.Unlock
        kind: value
    steps:
      - eval: pl.postMu.Lock()
        to: pl.postMu.Lock
      - opt:
          do:
            - eval: pl.postMu.Unlock()
              to: pl.postMu.Unlock
            - return: corenet.ServerClosed
          when: pl.postShut
      - opt:
          do:
            - eval: pl.postMu.Unlock()
              to: pl.postMu.Unlock
            - return: corenet.LoopPostQueueFull
          when: pl.postN == len(pl.postOps)
      - bind: i
        eval: (pl.postHead + pl.postN) % len(pl.postOps)
      - set: pl.postOps[i], pl.postArgs[i]
        value: op, arg
      - op: ++
        set: pl.postN
      - eval: pl.postMu.Unlock()
        to: pl.postMu.Unlock
      - opt:
          do:
            - select:
                cases:
                  - comm: pl.wake <- struct{}{}
                  - default: true
          when: pl.postWait.CompareAndSwap(false, true)
      - return: nil
  - of: (*portableGroup).wakeAll
    steps:
      - loop:
          do:
            - select:
                cases:
                  - comm: pl.wake <- struct{}{}
                  - default: true
          key: _
          range: g.lanes
          value: pl
  - of: portableEngine.Shutdown
    participants:
      - id: caller
        kind: actor
      - id: portableEngine.Shutdown
        kind: self
      - id: g.drainReq.Store
        kind: value
      - id: g.wakeAll
        kind: internal
      - id: g.takeQueues
        kind: internal
      - id: swallowErr
        kind: internal
      - id: errs
        kind: package
    steps:
      - bind: g
        eval: e.g
      - eval: g.drainReq.Store(true)
        to: g.drainReq.Store
      - eval: g.wakeAll()
        to: g.wakeAll
      - eval: g.takeQueues(ctx)
        to: g.takeQueues
      - loop:
          do:
            - select:
                cases:
                  - comm: <-pl.done
                  - comm: <-ctx.Done()
                    do:
                      - eval: swallowErr(e.Close())
                        to: swallowErr
                      - return: errs.Wrap(corenet.DrainTimeout, errs.WrapParams{}, errs.String("group", g.group))
                        to: errs
          key: _
          range: g.lanes
          value: pl
      - return: nil
  - of: portableEngine.Close
    participants:
      - id: caller
        kind: actor
      - id: portableEngine.Close
        kind: self
      - id: g.once.Do
        kind: value
    steps:
      - bind: g
        eval: e.g
      - eval: |-
          g.once.Do(func() {
          		g.stopReq.Store(true)
          		g.closeOwned()
          		g.wakeAll()
          		//: every lane's goroutine returned.
          		for _, pl := range g.lanes {
          			<-pl.done
          		}
          	})
        to: g.once.Do
      - return: nil
  - of: portableEngine.State
    steps:
      - bind: g
        eval: e.g
      - bind: rings
        eval: make([]corenet.LoopRingStateValue, 0, len(g.lanes))
      - loop:
          do:
            - set: rings
              value: |-
                append(rings, corenet.LoopRingStateValue{
                			Conns: pl.live.Load(), Accepted: pl.accepted.Load(), Closed: pl.closed.Load(),
                			Batches: pl.batches.Load(), Evicted: 0,
                			BytesIn: pl.bytesIn.Load(), BytesOut: pl.bytesOut.Load(),
                			OutputRefused: pl.outputRefused.Load(), SpillClosed: pl.spillClosed.Load(),
                			Timeouts: pl.timeouts.Load(), IdleClosed: pl.idleClosed.Load(),
                			PendingOutput: pl.pendingOutput.Load(),
                		})
          key: _
          range: g.lanes
          value: pl
      - return: |-
          corenet.LoopStateValue{
          		Group: g.group, Backend: corenet.LoopBackendPortable, ProbeStage: "portable",
          		Degraded: g.degraded != "", DegradedReason: g.degraded,
          		Loops: len(g.lanes), LoopsSource: g.loopsSource, Rings: 1, RingsSource: "single", GOMAXPROCS: g.procs,
          		Capabilities: slices.Clone(g.caps),
          		RingStates:   rings,
          	}
  - of: fillMark
    steps:
      - loop:
          do:
            - set: b[i]
              value: recycledMark
          key: i
          range: b
  - of: acceptCloexec
    participants:
      - id: caller
        kind: actor
      - id: acceptCloexec
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: nfd, _, err
        eval: syscall.Accept4(fd, syscall.SOCK_CLOEXEC)
        to: syscall
      - return: nfd, err
  - of: portablePeer
    participants:
      - id: caller
        kind: actor
      - id: portablePeer
        kind: self
      - id: uc.SyscallConn
        kind: value
      - id: rc.Control
        kind: value
    steps:
      - bind: uc, ok
        eval: c.(*stdnet.UnixConn)
      - opt:
          do:
            - return: corenet.LoopPeerValue{}
          when: "!ok"
      - bind: rc, err
        eval: uc.SyscallConn()
        to: uc.SyscallConn
      - opt:
          do:
            - return: corenet.LoopPeerValue{}
          when: err != nil
      - var:
          name: cred
          type: "*syscall.Ucred"
      - var:
          name: gerr
          type: error
      - bind: cerr
        eval: |-
          rc.Control(func(fd uintptr) {
          		cred, gerr = syscall.GetsockoptUcred(int(fd), syscall.SOL_SOCKET, syscall.SO_PEERCRED)
          	})
        to: rc.Control
      - opt:
          do:
            - return: corenet.LoopPeerValue{}
          when: cerr != nil || gerr != nil || cred.Pid <= 0
      - return: "corenet.LoopPeerValue{UID: cred.Uid, GID: cred.Gid, PID: uint32(cred.Pid), Verified: true}"
  - of: ownListeners
    participants:
      - id: caller
        kind: actor
      - id: ownListeners
        kind: self
      - id: dupListener
        kind: internal
    steps:
      - loop:
          do:
            - bind: dup, err
              eval: dupListener(ln)
              to: dupListener
            - opt:
                do:
                  - set: all
                    value: append(all, ln)
                  - continue: true
                when: err != nil
            - set: all
              value: append(all, dup)
            - set: owned
              value: append(owned, dup)
          key: _
          range: lns
          value: ln
      - return: all, owned
  - of: dupListener
    participants:
      - id: caller
        kind: actor
      - id: dupListener
        kind: self
      - id: f.File
        kind: internal
      - id: stdnet
        kind: stdlib
    steps:
      - bind: f, ok
        eval: ln.(filer)
      - opt:
          do:
            - return: nil, syscall.EINVAL
          when: "!ok"
      - bind: file, err
        eval: f.File()
        to: f.File
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - defer: func() { swallowErr(file.Close()) }()
      - return: stdnet.FileListener(file)
        to: stdnet
  - of: takeQueue
    participants:
      - id: caller
        kind: actor
      - id: takeQueue
        kind: self
      - id: sc.SyscallConn
        kind: value
      - id: acceptRaw
        kind: internal
    steps:
      - opt:
          do:
            - return: "true"
          when: wrapHeld(take, admit)
      - bind: sc, ok
        eval: ln.(syscall.Conn)
      - opt:
          do:
            - return: "false"
          when: "!ok"
      - bind: rc, err
        eval: sc.SyscallConn()
        to: sc.SyscallConn
      - opt:
          do:
            - return: "false"
          when: err != nil
      - loop:
          do:
            - bind: nfd, aerr
              eval: acceptRaw(rc)
              to: acceptRaw
            - switch:
                cases:
                  - case: aerr != nil && acceptRetries(aerr)
                    do:
                      - continue: true
                  - case: aerr == syscall.EMFILE || aerr == syscall.ENFILE
                    do:
                      - return: "true"
                  - case: aerr != nil
                    do:
                      - return: "false"
            - set: take.held
              value: append(take.held, os.NewFile(uintptr(nfd), ""))
            - opt:
                do:
                  - return: "true"
                when: wrapHeld(take, admit)
          range: portableTakeMax
      - return: "false"
  - of: wrapHeld
    participants:
      - id: caller
        kind: actor
      - id: wrapHeld
        kind: self
      - id: stdnet
        kind: stdlib
      - id: swallowErr
        kind: internal
    steps:
      - loop:
          cond: len(take.held) > 0
          do:
            - bind: f
              eval: take.held[0]
            - bind: c, err
              eval: stdnet.FileConn(f)
              to: stdnet
            - opt:
                do:
                  - return: "true"
                when: errors.Is(err, syscall.EMFILE) || errors.Is(err, syscall.ENFILE)
            - set: take.held
              value: take.held[1:]
            - eval: swallowErr(f.Close())
              to: swallowErr
            - opt:
                do:
                  - continue: true
                when: err != nil
            - eval: admit(c)
      - return: "false"
  - of: closeRaw
    participants:
      - id: caller
        kind: actor
      - id: closeRaw
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - loop:
          do:
            - eval: swallowErr(f.Close())
              to: swallowErr
          key: _
          range: held
          value: f
  - of: acceptRetries
    steps:
      - switch:
          cases:
            - case: syscall.ECONNABORTED, syscall.EINTR, syscall.EPROTO, syscall.ENETDOWN, syscall.ENOPROTOOPT, syscall.EHOSTDOWN, syscall.EHOSTUNREACH, syscall.EOPNOTSUPP, syscall.ENETUNREACH
              do:
                - return: "true"
            - default: true
              do:
                - return: "false"
          "on": err
  - of: acceptRaw
    participants:
      - id: caller
        kind: actor
      - id: acceptRaw
        kind: self
      - id: rc.Control
        kind: value
    steps:
      - bind: nfd
        eval: "-1"
      - var:
          name: aerr
          type: error
      - bind: cerr
        eval: rc.Control(func(fd uintptr) { nfd, aerr = acceptCloexec(int(fd)) })
        to: rc.Control
      - opt:
          do:
            - return: "-1, cerr"
          when: cerr != nil
      - return: nfd, aerr
  - of: (*StreamGroup).shardsRefusal
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).shardsRefusal
        kind: self
      - id: errs
        kind: package
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil
          when: "!g.kinds.has(corenet.OptionShards)"
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.LoopOptionUnsupported, errs.WrapParams{},
                			errs.String("group", g.name), errs.String("option", corenet.OptionShards.String()),
                			errs.Int("shards", g.limits.Shards))
              to: errs
          when: g.limits.Shards != 0
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.LoopOptionUnsupported, errs.WrapParams{},
                			errs.String("group", g.name), errs.String("option", corenet.OptionShards.String()),
                			errs.String("network", g.addrs[i].Network))
              to: errs
          init:
            bind: i
            eval: slices.IndexFunc(g.addrs, func(a corenet.AddressValue) bool { return !shardable(a.Network) })
            to: slices
          when: i >= 0
      - return: nil
  - of: loopShardCount
    steps:
      - opt:
          do:
            - return: "1"
          when: |-
            !group.kinds.has(corenet.OptionShards) || plan.backend == corenet.LoopBackendPortable ||
            		slices.Contains(plan.disabled, corenet.CapabilityReuseportLoops)
      - return: max(group.loop.Loops, 1)
  - of: (*Server).bindLoopAddress
    participants:
      - id: caller
        kind: actor
      - id: (*Server).bindLoopAddress
        kind: self
      - id: loopShardCount
        kind: internal
      - id: group.kinds.has
        kind: internal
      - id: probeAddress
        kind: internal
      - id: listen
        kind: internal
      - id: pinnedAddr
        kind: internal
      - id: s.registerLoopListeners
        kind: internal
    steps:
      - bind: count
        eval: loopShardCount(group, plan)
        to: loopShardCount
      - bind: share
        eval: group.kinds.has(corenet.OptionShareAddress)
        to: group.kinds.has
      - opt:
          do:
            - opt:
                do:
                  - return: nil, nil, err
                init:
                  bind: err
                  eval: probeAddress(ctx, addr, true)
                  to: probeAddress
                when: err != nil
          when: mustProbe(addr, count, share)
      - bind: target
        eval: addr
      - bind: lns
        eval: make([]stdnet.Listener, 0, count)
      - bind: owners
        eval: make([]int, 0, count)
      - loop:
          do:
            - bind: ln, rep, err
              eval: |-
                listen(ctx, target, nil, socketSpec{
                			reuse: reuseOf(count, share), attempts: s.rebindAttempts(target), backlog: group.limits.Backlog,
                			receiveBuffer: group.limits.ReceiveBuffer, sendBuffer: group.limits.SendBuffer,
                			keepAlive: s.keepAliveOf(group), userTimeout: s.userTimeoutOf(group),
                		})
              to: listen
            - opt:
                do:
                  - return: nil, nil, err
                when: err != nil
            - bind: shards
              eval: "0"
            - opt:
                do:
                  - set: shards
                    value: count
                  - set: target
                    to: pinnedAddr
                    value: pinnedAddr(addr, ln)
                when: i == 0
            - eval: s.registerLoopListeners(group, []stdnet.Listener{ln}, &rep, shards)
              to: s.registerLoopListeners
            - set: lns
              value: append(lns, group.loopLayers([]stdnet.Listener{ln})...)
            - bind: owner
              eval: "0"
            - opt:
                do:
                  - set: owner
                    value: i + 1
                when: count > 1
            - set: owners
              value: append(owners, owner)
          key: i
          range: count
      - return: lns, owners, nil
  - of: pinnedAddr
    participants:
      - id: caller
        kind: actor
      - id: pinnedAddr
        kind: self
      - id: withBoundPort
        kind: internal
    steps:
      - return: withBoundPort(addr, ln.Addr())
        to: withBoundPort
  - of: (*StreamGroup).tlsCodec
    steps:
      - bind: _, codec
        eval: g.loopHandler.(codecUnwrapper)
      - return: codec && g.kinds.has(corenet.OptionTLS)
  - of: (*StreamGroup).loopTLSRefusal
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).loopTLSRefusal
        kind: self
      - id: errs
        kind: package
      - id: g.tlsCodecRefusal
        kind: internal
    steps:
      - opt:
          do:
            - return: errs.Wrap(corenet.LoopTLSUnsupported, errs.WrapParams{}, errs.String("group", g.name))
              to: errs
          when: "!g.tlsCodec()"
      - return: g.tlsCodecRefusal()
        to: g.tlsCodecRefusal
  - of: (*StreamGroup).tlsCodecRefusal
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).tlsCodecRefusal
        kind: self
      - id: g.tlsErr
        kind: internal
      - id: g.codecProtocols
        kind: internal
      - id: g.protocolsErr
        kind: internal
      - id: offered
        kind: internal
    steps:
      - switch:
          cases:
            - case: g.identity.IsZero()
              do:
                - return: g.tlsErr("TLS")
                  to: g.tlsErr
            - case: g.loopSet && g.loop.Backend != corenet.LoopBackendAuto && g.loop.Backend != corenet.LoopBackendPortable
              do:
                - return: g.tlsErr("Loop")
                  to: g.tlsErr
            - case: g.kinds.has(corenet.OptionLoopMiddleware)
              do:
                - return: g.tlsErr(corenet.OptionLoopMiddleware.String())
                  to: g.tlsErr
            - default: true
              do:
                - opt:
                    do:
                      - return: g.protocolsErr(reason)
                        to: g.protocolsErr
                    init:
                      bind: reason
                      eval: g.codecProtocols()
                      to: g.codecProtocols
                    when: reason != ""
                - bind: alpn, reason
                  eval: offered(g.identity.ServerConfig().NextProtos, g.codecVersions())
                  to: offered
                - opt:
                    do:
                      - return: g.protocolsErr(reason)
                        to: g.protocolsErr
                    when: reason != ""
                - set: g.httpProtos.alpn
                  value: alpn
                - return: nil
  - of: (*StreamGroup).multiVersion
    steps:
      - bind: _, ok
        eval: g.loopHandler.(corenet.LoopHTTPCodec)
      - return: ok
  - of: (*StreamGroup).codecVersions
    steps:
      - opt:
          do:
            - return: g.protos
          when: g.kinds.has(corenet.OptionProtocols)
      - opt:
          do:
            - return: alpnBoth
          when: g.multiVersion()
      - return: alpnHTTP1
  - of: (*StreamGroup).codecProtocols
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).codecProtocols
        kind: self
      - id: checkProtocols
        kind: internal
    steps:
      - opt:
          do:
            - return: "\"\""
          when: "!g.kinds.has(corenet.OptionProtocols)"
      - opt:
          do:
            - return: reason
          init:
            bind: reason
            eval: checkProtocols(g.protos, true)
            to: checkProtocols
          when: reason != ""
      - opt:
          do:
            - return: protoH2
          when: "!g.multiVersion() && slices.Contains(g.protos, protoH2)"
      - return: "\"\""
  - of: (*StreamGroup).tlsErr
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).tlsErr
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(corenet.LoopTLSUnsupported, errs.WrapParams{},
          		errs.String("group", g.name), errs.String("option", option))
        to: errs
  - of: (*StreamGroup).loopLayers
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).loopLayers
        kind: self
      - id: tls
        kind: stdlib
    steps:
      - opt:
          do:
            - return: lns
          when: "!g.tlsCodec()"
      - bind: out
        eval: make([]stdnet.Listener, len(lns))
      - loop:
          do:
            - set: out[i]
              to: tls
              value: tls.NewListener(ln, tlsFloor(g.codecTLS()))
          key: i
          range: lns
          value: ln
      - return: out
  - of: (*StreamGroup).loopBackend
    steps:
      - opt:
          do:
            - return: corenet.LoopBackendPortable
          when: g.tlsCodec()
      - return: g.loop.Backend
  - of: tlsCodecHonours
    steps:
      - return: k == corenet.OptionTLS || k == corenet.OptionHandshakeTimeout || k == corenet.OptionProtocols
  - of: (*StreamGroup).codecTLS
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).codecTLS
        kind: self
      - id: g.identity.ServerConfig
        kind: value
    steps:
      - bind: cfg
        eval: g.identity.ServerConfig()
        to: g.identity.ServerConfig
      - set: cfg.NextProtos
        value: g.httpProtos.alpn
      - return: cfg
  - of: tlsFloor
    steps:
      - opt:
          do:
            - set: cfg.MinVersion
              value: tls.VersionTLS12
          when: cfg.MinVersion < tls.VersionTLS12
      - return: cfg
  - of: (*StreamGroup).handshakeBound
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).handshakeBound
        kind: self
      - id: g.timeouts.Handshake.Duration
        kind: value
    steps:
      - opt:
          do:
            - return: d
          init:
            bind: d
            eval: g.timeouts.Handshake.Duration()
            to: g.timeouts.Handshake.Duration
          when: d > 0
      - return: defaultHandshakeTimeout
  - of: handshake
    participants:
      - id: caller
        kind: actor
      - id: handshake
        kind: self
      - id: context
        kind: stdlib
      - id: tc.HandshakeContext
        kind: value
      - id: log.handshakeFailed
        kind: internal
      - id: swallowErr
        kind: internal
    steps:
      - bind: tc, ok
        eval: c.(*tls.Conn)
      - opt:
          do:
            - return: "true"
          when: "!ok"
      - bind: ctx, cancel
        eval: context.WithTimeout(context.Background(), d)
        to: context
      - defer: cancel()
      - opt:
          do:
            - eval: log.handshakeFailed(context.Background(), c.RemoteAddr(), err)
              to: log.handshakeFailed
            - eval: swallowErr(c.Close())
              to: swallowErr
            - return: "false"
          init:
            bind: err
            eval: tc.HandshakeContext(ctx)
            to: tc.HandshakeContext
          when: err != nil
      - return: "true"
  - of: metricInstruments
    participants:
      - id: caller
        kind: actor
      - id: metricInstruments
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - return: slices.Concat(serverInstruments(), groupInstruments(), loopInstruments())
        to: slices
  - of: serverInstruments
    steps:
      - bind: scalar
        eval:
          closure:
            params: read func(corenet.StateValue) int64
            results: func(*metricsSnapshot, func(int64, ...coreotel.AttrValue))
            steps:
              - return:
                  closure:
                    params: snap *metricsSnapshot, report func(int64, ...coreotel.AttrValue)
                    steps:
                      - eval: report(read(snap.state))
      - return: |-
          []metricInstrument{
          		{
          			name: MetricAcceptBackoffs, unit: unitBackoff, kind: metricCounter,
          			ints: scalar(func(s corenet.StateValue) int64 { return int64(s.AcceptBackoffs) }),
          		},
          		{
          			name: MetricDatagramsTruncated, unit: unitDatagram, kind: metricCounter,
          			ints: scalar(func(s corenet.StateValue) int64 { return int64(s.Datagrams.TruncatedPackets) }),
          		},
          		{
          			name: MetricGSOOversized, unit: unitDatagram, kind: metricCounter,
          			ints: scalar(func(s corenet.StateValue) int64 { return int64(s.Datagrams.GSOOversized) }),
          		},
          		{
          			name: MetricReplyFailures, unit: unitDatagram, kind: metricCounter,
          			ints: scalar(func(s corenet.StateValue) int64 { return int64(s.Datagrams.ReplyFailures) }),
          		},
          		{
          			name: MetricSuppressedLogs, unit: unitLine, kind: metricCounter,
          			ints: scalar(func(s corenet.StateValue) int64 { return int64(s.SuppressedLogs) }),
          		},
          		{
          			name: MetricDegraded, unit: unitState, kind: metricGauge,
          			ints: scalar(func(s corenet.StateValue) int64 { return boolInt(s.Degraded()) }),
          		},
          	}
  - of: groupInstruments
    steps:
      - bind: perGroup
        eval:
          closure:
            params: read func(groupConns) int64
            results: func(*metricsSnapshot, func(int64, ...coreotel.AttrValue))
            steps:
              - return:
                  closure:
                    params: snap *metricsSnapshot, report func(int64, ...coreotel.AttrValue)
                    steps:
                      - loop:
                          do:
                            - eval: report(read(g), coreotel.String("group", g.name))
                          key: _
                          range: snap.groups
                          value: g
      - return: |-
          []metricInstrument{
          		{name: MetricConnsActive, unit: unitConn, kind: metricGauge, ints: perGroup(func(g groupConns) int64 { return g.active })},
          		{name: MetricConnsTotal, unit: unitConn, kind: metricCounter, ints: perGroup(func(g groupConns) int64 { return int64(g.admitted) })},
          		{name: MetricConnsRejected, unit: unitConn, kind: metricCounter, ints: perGroup(func(g groupConns) int64 { return int64(g.rejected) })},
          	}
  - of: loopInstruments
    steps:
      - bind: perRing
        eval:
          closure:
            params: read func(corenet.LoopRingStateValue) uint64
            results: func(*metricsSnapshot, func(int64, ...coreotel.AttrValue))
            steps:
              - return:
                  closure:
                    params: snap *metricsSnapshot, report func(int64, ...coreotel.AttrValue)
                    steps:
                      - loop:
                          do:
                            - loop:
                                do:
                                  - eval: |-
                                      report(int64(read(ring)), coreotel.String("group", lp.Group),
                                      						coreotel.Int64("loop", int64(ring.Loop)), coreotel.Int64("ring", int64(ring.Ring)))
                                key: _
                                range: lp.RingStates
                                value: ring
                          key: _
                          range: snap.state.Loops
                          value: lp
      - bind: perLoopGroup
        eval:
          closure:
            params: read func(corenet.LoopStateValue) int64
            results: func(*metricsSnapshot, func(int64, ...coreotel.AttrValue))
            steps:
              - return:
                  closure:
                    params: snap *metricsSnapshot, report func(int64, ...coreotel.AttrValue)
                    steps:
                      - loop:
                          do:
                            - eval: report(read(lp), coreotel.String("group", lp.Group))
                          key: _
                          range: snap.state.Loops
                          value: lp
      - return: |-
          []metricInstrument{
          		{
          			name: MetricLoopBatches, unit: unitBatch, kind: metricCounter,
          			ints: perRing(func(r corenet.LoopRingStateValue) uint64 { return r.Batches }),
          		},
          		{
          			name: MetricLoopCompletions, unit: unitCompletion, kind: metricCounter,
          			ints: perRing(func(r corenet.LoopRingStateValue) uint64 { return r.Completions }),
          		},
          		{
          			name: MetricLoopBufferStarved, unit: unitRecv, kind: metricCounter,
          			ints: perRing(func(r corenet.LoopRingStateValue) uint64 { return r.BufferStarved }),
          		},
          		{
          			name: MetricLoopBatchesCut, unit: unitBatch, kind: metricCounter,
          			ints: perRing(func(r corenet.LoopRingStateValue) uint64 { return r.BatchesCut }),
          		},
          		{
          			name: MetricLoopRingsDrained, unit: unitRing, kind: metricGauge,
          			ints: perLoopGroup(func(lp corenet.LoopStateValue) int64 { return ringsDraining(lp) }),
          		},
          		{
          			name: MetricLoopOutboundRefused, unit: unitAnswer, kind: metricCounter,
          			ints: perLoopGroup(func(lp corenet.LoopStateValue) int64 { return int64(lp.OutboundRefused) }),
          		},
          		{
          			name: MetricLoopBatchP99, unit: unitSecond, kind: metricFloatGauge,
          			floats: func(snap *metricsSnapshot, report func(float64, ...coreotel.AttrValue)) {
          				for _, lp := range snap.state.Loops {
          					report(lp.BatchP99.Duration().Seconds(), coreotel.String("group", lp.Group))
          				}
          			},
          		},
          	}
  - of: ringsDraining
    participants:
      - id: caller
        kind: actor
      - id: ringsDraining
        kind: self
      - id: boolInt
        kind: internal
    steps:
      - var:
          name: "n"
          type: int64
      - loop:
          do:
            - op: +=
              set: "n"
              to: boolInt
              value: boolInt(ring.Draining)
          key: _
          range: lp.RingStates
          value: ring
      - return: "n"
  - of: boolInt
    steps:
      - opt:
          do:
            - return: "1"
          when: b
      - return: "0"
  - of: (*metricsReader).observe
    steps:
      - lock:
          mutex: r.mu
      - opt:
          do:
            - set: r.snap
              value: "metricsSnapshot{state: r.s.State(), groups: r.s.groupConnections()}"
          when: r.served == 0
      - set: r.served
        value: (r.served + 1) % r.callbacks
      - eval: read(&r.snap)
  - of: (*metricsReader).with
    steps:
      - opt:
          do:
            - return: r.attrs
          when: len(attrs) == 0
      - return: append(append(make([]coreotel.AttrValue, 0, len(r.attrs)+len(attrs)), r.attrs...), attrs...)
  - of: (*Server).RegisterMetrics
    participants:
      - id: caller
        kind: actor
      - id: (*Server).RegisterMetrics
        kind: self
      - id: errs
        kind: package
      - id: metricInstruments
        kind: internal
      - id: registerInstrument
        kind: internal
      - id: units.Unit
        kind: value
    steps:
      - opt:
          do:
            - return: errs.Wrap(corenet.MetricsRefused, errs.WrapParams{}, errs.String("why", "no meter"))
              to: errs
          when: m == nil
      - opt:
          do:
            - return: errs.Wrap(corenet.MetricsRefused, errs.WrapParams{}, errs.String("why", "already registered"))
              to: errs
          when: "!s.claimMeter(m)"
      - bind: instruments
        eval: metricInstruments()
        to: metricInstruments
      - bind: reader
        eval: "&metricsReader{s: s, attrs: slices.Clone(attrs), callbacks: len(instruments)}"
      - bind: units, _
        eval: m.(coremetrics.UnitDescriber)
      - loop:
          do:
            - eval: registerInstrument(m, reader, inst)
              to: registerInstrument
            - opt:
                do:
                  - eval: units.Unit(inst.name, inst.unit)
                    to: units.Unit
                when: units != nil
          key: _
          range: instruments
          value: inst
      - return: nil
  - of: registerInstrument
    participants:
      - id: caller
        kind: actor
      - id: registerInstrument
        kind: self
      - id: m.ObservableGauge
        kind: value
      - id: m.ObservableUpDownCounter
        kind: value
      - id: m.ObservableCounter
        kind: value
    steps:
      - switch:
          cases:
            - case: metricFloatGauge
              do:
                - eval: |-
                    m.ObservableGauge(inst.name, func(observe coremetrics.ObserveFloat64) {
                    			reader.observe(func(snap *metricsSnapshot) {
                    				inst.floats(snap, func(v float64, attrs ...coreotel.AttrValue) { observe(v, reader.with(attrs)...) })
                    			})
                    		})
                  to: m.ObservableGauge
            - case: metricGauge
              do:
                - eval: |-
                    m.ObservableUpDownCounter(inst.name, func(observe coremetrics.ObserveInt64) {
                    			reader.observe(func(snap *metricsSnapshot) {
                    				inst.ints(snap, func(v int64, attrs ...coreotel.AttrValue) { observe(v, reader.with(attrs)...) })
                    			})
                    		})
                  to: m.ObservableUpDownCounter
            - default: true
              do:
                - eval: |-
                    m.ObservableCounter(inst.name, func(observe coremetrics.ObserveInt64) {
                    			reader.observe(func(snap *metricsSnapshot) {
                    				inst.ints(snap, func(v int64, attrs ...coreotel.AttrValue) { observe(v, reader.with(attrs)...) })
                    			})
                    		})
                  to: m.ObservableCounter
          "on": inst.kind
  - of: (*Server).claimMeter
    steps:
      - lock:
          mutex: s.metricsMu
      - opt:
          do:
            - return: "true"
          when: "!reflect.TypeOf(m).Comparable()"
      - opt:
          do:
            - return: "false"
          when: slices.Contains(s.meters, m)
      - set: s.meters
        value: append(s.meters, m)
      - return: "true"
  - of: newMultiReader
    participants:
      - id: caller
        kind: actor
      - id: newMultiReader
        kind: self
      - id: sc.SyscallConn
        kind: internal
    steps:
      - bind: raw, rerr
        eval: sc.SyscallConn()
        to: sc.SyscallConn
      - opt:
          do:
            - return: nil, rerr
          when: rerr != nil
      - return: "&multiReader{pc: pc, raw: raw}, nil"
  - of: (*multiReader).enableGRO
    steps:
      - set: r.gro
        value: r.setGRO(true) == nil
      - return: r.gro
  - of: (*multiReader).enableRxqOvfl
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).enableRxqOvfl
        kind: self
      - id: r.raw.Control
        kind: value
      - id: cmp
        kind: stdlib
    steps:
      - var:
          name: serr
          type: error
      - bind: cerr
        eval: |-
          r.raw.Control(func(fd uintptr) {
          		serr = syscall.SetsockoptInt(int(fd), syscall.SOL_SOCKET, soRxqOvfl, 1)
          	})
        to: r.raw.Control
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: cmp.Or(cerr, serr)
            to: cmp
          when: err != nil
      - set: r.rxq, r.drops
        value: true, drops
      - return: nil
  - of: (*multiReader).setGRO
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).setGRO
        kind: self
      - id: r.raw.Control
        kind: value
      - id: cmp
        kind: stdlib
    steps:
      - bind: value
        eval: "0"
      - opt:
          do:
            - set: value
              value: "1"
          when: "on"
      - var:
          name: serr
          type: error
      - bind: cerr
        eval: |-
          r.raw.Control(func(fd uintptr) {
          		serr = syscall.SetsockoptInt(int(fd), syscall.IPPROTO_UDP, udpGRO, value)
          	})
        to: r.raw.Control
      - return: cmp.Or(cerr, serr)
        to: cmp
  - of: (*multiReader).handover
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).handover
        kind: self
      - id: r.handing.Store
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - opt:
          do:
            - return: "false"
          when: "!r.gro"
      - eval: r.handing.Store(true)
        to: r.handing.Store
      - eval: swallowErr(r.pc.SetReadDeadline(time.Unix(1, 0)))
        to: swallowErr
      - return: "true"
  - of: (*multiReader).stopGRO
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).stopGRO
        kind: self
      - id: r.switchGROOff
        kind: internal
    steps:
      - opt:
          do:
            - eval: r.switchGROOff()
              to: r.switchGROOff
          when: r.gro
  - of: (*multiReader).switchGROOff
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).switchGROOff
        kind: self
      - id: r.stopping.Store
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - eval: r.stopping.Store(true)
        to: r.stopping.Store
      - eval: swallowErr(r.setGRO(false))
        to: swallowErr
  - of: (*multiReader).slotSize
    steps:
      - opt:
          do:
            - return: ceiling
          when: "!r.gro"
      - return: max(ceiling, groMessageSize)
  - of: (*multiReader).wire
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).wire
        kind: self
      - id: r.neededControl
        kind: internal
      - id: setKernelLen
        kind: internal
      - id: r.bind
        kind: internal
      - id: r.prepare
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: r.wired == len(slots)
      - bind: count
        eval: len(slots)
      - opt:
          do:
            - set: r.controlSpace
              to: r.neededControl
              value: r.neededControl()
          when: r.controlSpace <= 0
      - set: r.headers
        value: make([]mmsghdr, count)
      - set: r.iovecs
        value: make([]syscall.Iovec, count)
      - set: r.names
        value: make([]syscall.RawSockaddrAny, count)
      - set: r.oob
        value: make([]byte, count*r.controlSpace)
      - loop:
          do:
            - set: r.iovecs[i].Base
              value: "&slots[i].buf[0]"
            - eval: setKernelLen(&r.iovecs[i].Len, len(slots[i].buf))
              to: setKernelLen
            - set: r.headers[i].hdr.Name
              value: (*byte)(unsafe.Pointer(&r.names[i]))
            - set: r.headers[i].hdr.Iov
              value: "&r.iovecs[i]"
            - eval: setKernelLen(&r.headers[i].hdr.Iovlen, 1)
              to: setKernelLen
            - opt:
                do:
                  - set: r.headers[i].hdr.Control
                    value: "&r.oob[i*r.controlSpace]"
                when: r.controlSpace > 0
          key: i
          range: slots
      - eval: r.bind()
        to: r.bind
      - set: r.wired
        value: count
      - eval: r.prepare()
        to: r.prepare
  - of: (*multiReader).neededControl
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).neededControl
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - opt:
          do:
            - return: groControlSpace
          when: r.gro
      - bind: space
        eval: "0"
      - opt:
          do:
            - op: +=
              set: space
              to: syscall
              value: syscall.CmsgSpace(rxqBytes)
          when: r.rxq
      - opt:
          do:
            - op: +=
              set: space
              to: syscall
              value: syscall.CmsgSpace(in6PktinfoBytes)
          when: r.dstFamily != 0
      - return: space
  - of: (*multiReader).bind
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).bind
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - opt:
          do:
            - return: ""
          when: r.recv != nil
      - set: r.recv
        value:
          closure:
            params: fd uintptr
            results: bool
            steps:
              - bind: result, _, callErrno
                eval: |-
                  syscall.Syscall6(syscall.SYS_RECVMMSG, fd,
                  			uintptr(unsafe.Pointer(&r.headers[0])), uintptr(len(r.headers)),
                  			syscall.MSG_WAITFORONE, 0, 0)
                to: syscall
              - opt:
                  do:
                    - return: "false"
                  when: callErrno == syscall.EAGAIN
              - set: r.received, r.errno
                value: int(result), callErrno
              - return: "true"
      - set: r.drainOnce
        value:
          closure:
            params: fd uintptr
            steps:
              - bind: result, _, callErrno
                eval: |-
                  syscall.Syscall6(syscall.SYS_RECVMMSG, fd,
                  			uintptr(unsafe.Pointer(&r.headers[0])), uintptr(len(r.headers)),
                  			syscall.MSG_DONTWAIT, 0, 0)
                to: syscall
              - set: r.received, r.errno
                value: int(result), callErrno
  - of: (*multiReader).prepare
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).prepare
        kind: self
      - id: setKernelLen
        kind: internal
    steps:
      - loop:
          do:
            - set: r.headers[i].hdr.Namelen
              value: syscall.SizeofSockaddrAny
            - eval: setKernelLen(&r.headers[i].hdr.Controllen, r.controlSpace)
              to: setKernelLen
            - set: r.headers[i].hdr.Flags
              value: "0"
          key: i
          range: r.headers
  - of: (*multiReader).readBatch
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).readBatch
        kind: self
      - id: r.wire
        kind: internal
      - id: r.drain
        kind: internal
      - id: r.prepare
        kind: internal
      - id: r.raw.Read
        kind: value
      - id: r.fill
        kind: internal
    steps:
      - eval: r.wire(slots)
        to: r.wire
      - opt:
          do:
            - return: r.drain(slots)
              to: r.drain
          when: r.handing.Load()
      - eval: r.prepare()
        to: r.prepare
      - set: r.received, r.errno
        value: 0, 0
      - bind: ctrlErr
        eval: r.raw.Read(r.recv)
        to: r.raw.Read
      - bind: received, errno
        eval: r.received, r.errno
      - opt:
          do:
            - return: r.drain(slots)
              to: r.drain
          when: ctrlErr != nil && r.handing.Load() && errors.Is(ctrlErr, os.ErrDeadlineExceeded)
      - opt:
          do:
            - return: 0, ctrlErr
          when: ctrlErr != nil
      - opt:
          do:
            - return: 0, errno
          when: errno != 0
      - opt:
          do:
            - return: 0, stdnet.ErrClosed
          when: r.stopping.Load()
      - eval: r.fill(slots, received)
        to: r.fill
      - return: received, nil
  - of: (*multiReader).drain
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).drain
        kind: self
      - id: r.prepare
        kind: internal
      - id: r.raw.Control
        kind: value
      - id: swallowErr
        kind: internal
      - id: r.fill
        kind: internal
    steps:
      - eval: r.prepare()
        to: r.prepare
      - set: r.received, r.errno
        value: 0, 0
      - bind: ctrlErr
        eval: r.raw.Control(r.drainOnce)
        to: r.raw.Control
      - bind: received, errno
        eval: r.received, r.errno
      - opt:
          do:
            - return: 0, ctrlErr
          when: ctrlErr != nil
      - opt:
          do:
            - eval: swallowErr(r.setGRO(false))
              to: swallowErr
            - return: 0, stdnet.ErrClosed
          when: errno == syscall.EAGAIN
      - opt:
          do:
            - return: 0, errno
          when: errno != 0
      - opt:
          do:
            - return: 0, stdnet.ErrClosed
          when: r.stopping.Load()
      - eval: r.fill(slots, received)
        to: r.fill
      - return: received, nil
  - of: (*multiReader).fill
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).fill
        kind: self
      - id: r.readControl
        kind: internal
      - id: sockaddrToAddr
        kind: internal
    steps:
      - loop:
          do:
            - bind: hdr
              eval: "&r.headers[i].hdr"
            - bind: slot
              eval: "&slots[i]"
            - set: slot.n
              value: int(r.headers[i].length)
            - set: slot.seg
              value: "0"
            - set: slot.local
              value: localAddress{}
            - opt:
                do:
                  - eval: r.readControl(i, slot)
                    to: r.readControl
                when: r.controlSpace > 0
            - set: slot.cut
              value: r.gro && slot.seg == 0 && hdr.Flags&syscall.MSG_CTRUNC != 0
            - opt:
                do:
                  - set: slot.addr
                    value: nil
                  - continue: true
                when: slot.cut
            - set: slot.cut
              value: hdr.Flags&syscall.MSG_TRUNC != 0 && (r.gro || slot.seg > 0)
            - set: slot.addr
              to: sockaddrToAddr
              value: sockaddrToAddr(&r.names[i])
          key: i
          range: received
  - of: (*multiReader).readControl
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).readControl
        kind: self
      - id: groSegment
        kind: internal
      - id: r.countDrops
        kind: internal
      - id: pktinfoOf
        kind: internal
    steps:
      - bind: used
        eval: min(int(r.headers[i].hdr.Controllen), r.controlSpace)
      - bind: control
        eval: "r.oob[i*r.controlSpace : i*r.controlSpace+used]"
      - set: slot.seg
        to: groSegment
        value: groSegment(control)
      - opt:
          do:
            - eval: r.countDrops(control)
              to: r.countDrops
          when: r.rxq
      - opt:
          do:
            - set: slot.local
              to: pktinfoOf
              value: pktinfoOf(control, r.dstFamily)
          when: r.dstFamily != 0
  - of: (*multiReader).countDrops
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).countDrops
        kind: self
      - id: rxqOverflow
        kind: internal
      - id: r.drops.Add
        kind: value
    steps:
      - bind: count, ok
        eval: rxqOverflow(control)
        to: rxqOverflow
      - opt:
          do:
            - return: ""
          when: "!ok"
      - eval: r.drops.Add(uint64(count - r.lastOvfl))
        to: r.drops.Add
      - set: r.lastOvfl
        value: count
  - of: rxqOverflow
    participants:
      - id: caller
        kind: actor
      - id: rxqOverflow
        kind: self
      - id: controlMessage
        kind: internal
    steps:
      - bind: payload
        eval: controlMessage(control, syscall.SOL_SOCKET, soRxqOvfl, rxqBytes)
        to: controlMessage
      - opt:
          do:
            - return: 0, false
          when: payload == nil
      - return: "*(*uint32)(unsafe.Pointer(&payload[0])), true"
  - of: controlMessage
    participants:
      - id: caller
        kind: actor
      - id: controlMessage
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: header
        eval: syscall.CmsgLen(0)
        to: syscall
      - loop:
          cond: off+header <= len(control)
          do:
            - bind: cmsg
              eval: (*syscall.Cmsghdr)(unsafe.Pointer(&control[off]))
            - bind: length
              eval: int(cmsg.Len)
            - opt:
                do:
                  - return: nil
                when: length < header || off+length > len(control)
            - opt:
                do:
                  - return: "control[off+header : off+length]"
                when: cmsg.Level == level && cmsg.Type == typ && length >= header+size
            - op: +=
              set: "off"
              to: syscall
              value: syscall.CmsgSpace(length - header)
          init: off := 0
      - return: nil
  - of: groSegment
    participants:
      - id: caller
        kind: actor
      - id: groSegment
        kind: self
      - id: controlMessage
        kind: internal
    steps:
      - bind: payload
        eval: controlMessage(control, syscall.IPPROTO_UDP, udpGRO, groSegmentBytes)
        to: controlMessage
      - opt:
          do:
            - return: "0"
          when: payload == nil
      - return: int(*(*int32)(unsafe.Pointer(&payload[0])))
  - of: gsoSegments
    steps:
      - bind: header
        eval: ipv4HeaderBytes
      - opt:
          do:
            - set: header
              value: ipv6HeaderBytes
          when: family == syscall.AF_INET6
      - opt:
          do:
            - return: "1"
          when: size <= 0
      - return: min(udpMaxSegments, (ipMaxLength-header-udpHeaderBytes)/size)
  - of: maxSegment
    steps:
      - opt:
          do:
            - return: ethernetMTU - ipv6HeaderBytes - udpHeaderBytes
          when: family == syscall.AF_INET6
      - return: ethernetMTU - ipv4HeaderBytes - udpHeaderBytes
  - of: (*pendingReply).addr
    steps:
      - opt:
          do:
            - bind: sa4
              eval: (*syscall.RawSockaddrInet4)(unsafe.Pointer(&e.name))
            - return: "&stdnet.UDPAddr{IP: stdnet.IPv4(sa4.Addr[0], sa4.Addr[1], sa4.Addr[2], sa4.Addr[3]), Port: hostPort(sa4.Port)}"
          when: e.name.Family == syscall.AF_INET
      - bind: ip
        eval: make(stdnet.IP, stdnet.IPv6len)
      - eval: copy(ip, e.name.Addr[:])
      - return: "&stdnet.UDPAddr{IP: ip, Port: hostPort(e.name.Port)}"
  - of: newMultiWriter
    participants:
      - id: caller
        kind: actor
      - id: newMultiWriter
        kind: self
      - id: sc.SyscallConn
        kind: internal
      - id: raw.Control
        kind: value
      - id: w.gso.Store
        kind: value
    steps:
      - bind: raw, rerr
        eval: sc.SyscallConn()
        to: sc.SyscallConn
      - opt:
          do:
            - return: nil, rerr
          when: rerr != nil
      - var:
          name: family
          type: int
      - var:
          name: gso
          type: bool
      - var:
          name: serr
          type: error
      - bind: cerr
        eval: |-
          raw.Control(func(fd uintptr) {
          		sa, err := syscall.Getsockname(int(fd))
          		serr = err
          		//: the family decides the sockaddr every reply is written with.
          		switch sa.(type) {
          		//: IPv4.
          		case *syscall.SockaddrInet4:
          			family = syscall.AF_INET
          		//: IPv6, IPv4-mapped peers included.
          		case *syscall.SockaddrInet6:
          			family = syscall.AF_INET6
          		}
          		_, gerr := syscall.GetsockoptInt(int(fd), syscall.IPPROTO_UDP, udpSegment)
          		gso = gerr == nil
          	})
        to: raw.Control
      - opt:
          do:
            - return: nil, cmp.Or(cerr, serr)
          when: cerr != nil || serr != nil
      - opt:
          do:
            - return: nil, syscall.EAFNOSUPPORT
          when: family == 0
      - bind: w
        eval: |-
          &multiWriter{
          		pc: pc, raw: raw, family: family, counters: counters, onGSOOff: onGSOOff, send: sendmmsg,
          		arena: make([]byte, replyArena), queue: make([]pendingReply, 0, replyQueue),
          		headers: make([]mmsghdr, replyQueue), iovecs: make([]syscall.Iovec, replyQueue),
          		spans: make([]replySpan, replyQueue), controlSpace: syscall.CmsgSpace(segmentSizeBytes) + syscall.CmsgSpace(in6PktinfoBytes),
          	}
      - set: w.oob
        value: make([]byte, replyQueue*w.controlSpace)
      - eval: w.gso.Store(gso)
        to: w.gso.Store
      - set: w.write
        value:
          closure:
            params: fd uintptr
            results: bool
            steps:
              - set: w.sent, w.sendErrno
                value: w.send(fd, w.headers[w.from:w.to])
              - return: w.sendErrno != syscall.EAGAIN
      - return: w, nil
  - of: sendmmsg
    participants:
      - id: caller
        kind: actor
      - id: sendmmsg
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: result, _, callErrno
        eval: |-
          syscall.Syscall6(sysSendmmsg, fd,
          		uintptr(unsafe.Pointer(&headers[0])), uintptr(len(headers)), 0, 0, 0)
        to: syscall
      - opt:
          do:
            - return: 0, callErrno
          when: callErrno != 0
      - return: int(result), 0
  - of: (*multiWriter).begin
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).begin
        kind: self
      - id: w.mu.Lock
        kind: value
      - id: w.mu.Unlock
        kind: value
    steps:
      - eval: w.mu.Lock()
        to: w.mu.Lock
      - set: w.open
        value: "true"
      - eval: w.mu.Unlock()
        to: w.mu.Unlock
  - of: (*multiWriter).reply
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).reply
        kind: self
      - id: w.replyFrom
        kind: internal
    steps:
      - return: w.replyFrom(b, to, localAddress{})
        to: w.replyFrom
  - of: (*multiWriter).replyFrom
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).replyFrom
        kind: self
      - id: w.mu.Lock
        kind: value
      - id: w.mu.Unlock
        kind: value
      - id: w.writeNow
        kind: internal
      - id: w.flushLocked
        kind: internal
    steps:
      - eval: w.mu.Lock()
        to: w.mu.Lock
      - var:
          name: entry
          type: pendingReply
      - opt:
          do:
            - eval: w.mu.Unlock()
              to: w.mu.Unlock
            - return: w.writeNow(b, to, source)
              to: w.writeNow
          when: "!w.open || len(b) > len(w.arena) || !w.encode(to, &entry)"
      - set: entry.source
        value: source
      - opt:
          do:
            - eval: w.flushLocked()
              to: w.flushLocked
          when: len(w.queue) == cap(w.queue) || w.used+len(b) > len(w.arena)
      - set: entry.off, entry.size
        value: w.used, len(b)
      - eval: copy(w.arena[w.used:], b)
      - op: +=
        set: w.used
        value: len(b)
      - set: w.queue
        value: append(w.queue, entry)
      - eval: w.mu.Unlock()
        to: w.mu.Unlock
      - return: len(b), nil
  - of: (*multiWriter).encode
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).encode
        kind: self
      - id: encodeSockaddr
        kind: internal
    steps:
      - return: encodeSockaddr(w.family, to, &entry.name, &entry.namelen)
        to: encodeSockaddr
  - of: encodeSockaddr
    participants:
      - id: caller
        kind: actor
      - id: encodeSockaddr
        kind: self
      - id: udp.IP.To16
        kind: value
      - id: udp.IP.To4
        kind: value
    steps:
      - bind: udp, ok
        eval: to.(*stdnet.UDPAddr)
      - opt:
          do:
            - return: "false"
          when: "!ok || udp == nil || udp.Zone != \"\""
      - bind: port
        eval: (*[2]byte)(unsafe.Pointer(&name.Port))
      - set: port[0], port[1]
        value: byte(udp.Port>>portByteShift), byte(udp.Port)
      - opt:
          do:
            - bind: ip
              eval: udp.IP.To16()
              to: udp.IP.To16
            - opt:
                do:
                  - return: "false"
                when: ip == nil
            - set: name.Family
              value: syscall.AF_INET6
            - eval: copy(name.Addr[:], ip)
            - set: "*namelen"
              value: syscall.SizeofSockaddrInet6
            - return: "true"
          when: family == syscall.AF_INET6
      - bind: ip
        eval: udp.IP.To4()
        to: udp.IP.To4
      - opt:
          do:
            - return: "false"
          when: ip == nil
      - bind: sa4
        eval: (*syscall.RawSockaddrInet4)(unsafe.Pointer(name))
      - set: sa4.Family
        value: syscall.AF_INET
      - eval: copy(sa4.Addr[:], ip)
      - set: "*namelen"
        value: syscall.SizeofSockaddrInet4
      - return: "true"
  - of: (*multiWriter).flush
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).flush
        kind: self
      - id: w.mu.Lock
        kind: value
      - id: w.flushLocked
        kind: internal
      - id: w.mu.Unlock
        kind: value
    steps:
      - eval: w.mu.Lock()
        to: w.mu.Lock
      - eval: w.flushLocked()
        to: w.flushLocked
      - set: w.open
        value: "false"
      - eval: w.mu.Unlock()
        to: w.mu.Unlock
  - of: (*multiWriter).flushLocked
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).flushLocked
        kind: self
      - id: w.writeEach
        kind: internal
      - id: w.sendAll
        kind: internal
    steps:
      - opt:
          do:
            - eval: w.writeEach(0, len(w.queue))
              to: w.writeEach
          when: w.noMmsg
      - loop:
          cond: start < len(w.queue) && !w.noMmsg
          do:
            - set: start
              to: w.sendAll
              value: w.sendAll(w.build(start))
          init: start := 0
      - set: w.queue
        value: w.queue[:0]
      - set: w.used
        value: "0"
      - set: w.plainUntil
        value: "0"
  - of: (*multiWriter).build
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).build
        kind: self
      - id: w.gso.Load
        kind: value
      - id: maxSegment
        kind: internal
      - id: w.runFrom
        kind: internal
      - id: w.layout
        kind: internal
    steps:
      - bind: gso
        eval: w.gso.Load()
        to: w.gso.Load
      - bind: limitSize
        eval: maxSegment(w.family)
        to: maxSegment
      - opt:
          do:
            - set: limitSize
              value: min(limitSize, w.segmentCeiling)
          when: w.segmentCeiling > 0
      - bind: messages
        eval: "0"
      - loop:
          cond: e < len(w.queue)
          do:
            - bind: first
              eval: "&w.queue[e]"
            - bind: run
              eval: "1"
            - opt:
                do:
                  - set: run
                    to: w.runFrom
                    value: w.runFrom(e)
                when: gso && e >= w.plainUntil && first.size > 0 && first.size <= limitSize
            - bind: last
              eval: "&w.queue[e+run-1]"
            - eval: w.layout(messages, e, run, last.off+last.size-first.off)
              to: w.layout
            - op: +=
              set: e
              value: run
          init: e := start
          post: messages++
      - return: messages
  - of: (*pendingReply).joins
    steps:
      - return: next.name == e.name && next.namelen == e.namelen && next.source == e.source && next.size <= e.size && next.size != 0
  - of: (*multiWriter).runFrom
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).runFrom
        kind: self
      - id: gsoSegments
        kind: internal
    steps:
      - bind: first
        eval: "&w.queue[e]"
      - bind: limit
        eval: gsoSegments(w.family, first.size)
        to: gsoSegments
      - bind: run
        eval: "1"
      - loop:
          cond: run < limit && e+run < len(w.queue)
          do:
            - bind: next
              eval: "&w.queue[e+run]"
            - opt:
                do:
                  - break: true
                when: "!first.joins(next)"
            - op: ++
              set: run
            - opt:
                do:
                  - break: true
                when: next.size < first.size
      - return: run
  - of: (*multiWriter).layout
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).layout
        kind: self
      - id: setKernelLen
        kind: internal
      - id: w.writeControl
        kind: internal
    steps:
      - bind: entry
        eval: "&w.queue[first]"
      - bind: hdr
        eval: "&w.headers[m].hdr"
      - set: hdr.Name
        value: (*byte)(unsafe.Pointer(&entry.name))
      - set: hdr.Namelen
        value: entry.namelen
      - set: w.iovecs[m].Base
        value: "&w.arena[min(entry.off, len(w.arena)-1)]"
      - eval: setKernelLen(&w.iovecs[m].Len, total)
        to: setKernelLen
      - set: hdr.Iov
        value: "&w.iovecs[m]"
      - eval: setKernelLen(&hdr.Iovlen, 1)
        to: setKernelLen
      - set: hdr.Flags
        value: "0"
      - set: w.spans[m]
        value: "replySpan{first: first, count: count}"
      - bind: control
        eval: "w.oob[m*w.controlSpace : (m+1)*w.controlSpace]"
      - bind: used
        eval: w.writeControl(control, entry, count)
        to: w.writeControl
      - opt:
          do:
            - set: hdr.Control
              value: nil
            - eval: setKernelLen(&hdr.Controllen, 0)
              to: setKernelLen
            - return: ""
          when: used == 0
      - set: hdr.Control
        value: "&control[0]"
      - eval: setKernelLen(&hdr.Controllen, used)
        to: setKernelLen
  - of: (*multiWriter).writeControl
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).writeControl
        kind: self
      - id: cmsg.SetLen
        kind: value
      - id: syscall
        kind: stdlib
      - id: writePktinfo
        kind: internal
    steps:
      - bind: used
        eval: "0"
      - opt:
          do:
            - bind: cmsg
              eval: (*syscall.Cmsghdr)(unsafe.Pointer(&control[0]))
            - set: cmsg.Level
              value: syscall.IPPROTO_UDP
            - set: cmsg.Type
              value: udpSegment
            - eval: cmsg.SetLen(syscall.CmsgLen(segmentSizeBytes))
              to: cmsg.SetLen
            - set: "*(*uint16)(unsafe.Pointer(&control[syscall.CmsgLen(0)]))"
              value: uint16(entry.size)
            - set: used
              to: syscall
              value: syscall.CmsgSpace(segmentSizeBytes)
          when: count > 1
      - opt:
          do:
            - op: +=
              set: used
              to: writePktinfo
              value: writePktinfo(control[used:], w.family, entry.source)
          when: entry.source.sourceLen != 0
      - return: used
  - of: (*multiWriter).sendAll
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).sendAll
        kind: self
      - id: w.sendFrom
        kind: internal
      - id: w.fail
        kind: internal
      - id: w.left
        kind: internal
      - id: w.refused
        kind: internal
    steps:
      - loop:
          cond: k < messages
          do:
            - bind: sent, err
              eval: w.sendFrom(k, messages)
              to: w.sendFrom
            - bind: errno, refused
              eval: err.(syscall.Errno)
            - opt:
                do:
                  - eval: w.fail(k, messages)
                    to: w.fail
                  - return: len(w.queue)
                when: err != nil && !refused
            - opt:
                do:
                  - eval: w.left(k, k+sent)
                    to: w.left
                  - op: +=
                    set: k
                    value: sent
                  - continue: true
                when: err == nil && sent > 0
            - opt:
                do:
                  - return: resume
                init:
                  bind: resume, again
                  eval: w.refused(k, messages, errno)
                  to: w.refused
                when: again
            - op: ++
              set: k
          init: k := 0
      - return: len(w.queue)
  - of: (*multiWriter).refused
