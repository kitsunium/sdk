    participants:
      - id: caller
        kind: actor
      - id: (*httpAdapter).register
        kind: self
      - id: a.mu.Lock
        kind: value
      - id: a.mu.Unlock
        kind: value
    steps:
      - bind: waiter
        eval: "&connWaiter{done: make(chan struct{})}"
      - eval: a.mu.Lock()
        to: a.mu.Lock
      - set: a.waiters[raw]
        value: waiter
      - eval: a.mu.Unlock()
        to: a.mu.Unlock
      - return: waiter
  - of: (*httpAdapter).unregister
    participants:
      - id: caller
        kind: actor
      - id: (*httpAdapter).unregister
        kind: self
      - id: a.mu.Lock
        kind: value
      - id: a.mu.Unlock
        kind: value
    steps:
      - eval: a.mu.Lock()
        to: a.mu.Lock
