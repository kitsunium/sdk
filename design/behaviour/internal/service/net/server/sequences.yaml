      - id: caller
        kind: actor
      - id: (*httpAdapter).onConnState
        kind: self
      - id: a.mu.Lock
        kind: value
      - id: a.mu.Unlock
        kind: value
      - id: waiter.hijacked.Store
        kind: value
      - id: waiter.release
        kind: internal
