      - id: caller
        kind: actor
      - id: bufferControl
        kind: self
      - id: rawConn.Control
        kind: value
    steps:
      - opt:
          do:
            - return: nil
          when: spec.receiveBuffer <= 0 && spec.sendBuffer <= 0
      - var:
          name: setErr
          type: error
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: rawConn.Control(func(fd uintptr) { setErr = setBuffers(fd, spec.receiveBuffer, spec.sendBuffer) })
            to: rawConn.Control
          when: err != nil
      - return: setErr
  - of: socketBuffers
    participants:
      - id: caller
        kind: actor
      - id: socketBuffers
        kind: self
      - id: sc.SyscallConn
        kind: value
      - id: raw.Control
        kind: value
    steps:
      - opt:
