          loop.Start(loop.Config{
          		Group: group.name, Value: value, MaxConns: group.limits.MaxConns,
          		IdleTimeout: loopIdle(group), Handler: group.loopChain, Busy: group.loopBusy, Listeners: handoff,
          		Disabled: plan.disabled, DisabledBy: plan.disabledBy,
          	})
        to: loop
      - opt:
          do:
            - return: "&nativeEngine{Group: g, noDelay: probeNoDelay(lns, plan)}, nil"
          when: err == nil
      - opt:
          do:
            - return: "startPortable(group, lns, \"native loop backend unavailable: \"+err.Error(), plan), nil"
              to: startPortable
          when: plan.fallback && !errs.HasCode(err, corenet.CodeLoopNoDescriptors)
      - return: nil, err
  - of: (*nativeEngine).State
    participants:
      - id: caller
        kind: actor
      - id: (*nativeEngine).State
        kind: self
      - id: e.Group.State
        kind: value
    steps:
      - bind: st
        eval: e.Group.State()
        to: e.Group.State
      - set: st.Capabilities
        value: append(st.Capabilities, e.noDelay)
      - return: st
  - of: probeNoDelay
    participants:
      - id: caller
        kind: actor
      - id: probeNoDelay
        kind: self
      - id: noDelayOf
        kind: internal
    steps:
      - bind: row
        eval: "corenet.CapabilityValue{Name: corenet.CapabilityTCPNoDelay, Class: classKernel, Status: statusOn}"
      - opt:
          do:
            - set: row.Status, row.Reason
              value: statusDisabled, plan.disabledBy
            - return: row
          when: slices.Contains(plan.disabled, corenet.CapabilityTCPNoDelay)
      - loop:
          do:
            - bind: v, err
              eval: noDelayOf(ln)
              to: noDelayOf
            - opt:
                do:
                  - set: row.Status, row.Reason
                    value: "statusAbsent, \"getsockopt TCP_NODELAY: not set\""
                  - return: row
                when: err != nil || v == 0
          key: _
          range: lns
          value: ln
      - return: row
  - of: noDelayOf
    participants:
      - id: caller
        kind: actor
      - id: noDelayOf
        kind: self
      - id: sc.SyscallConn
        kind: value
      - id: rc.Control
        kind: value
    steps:
      - bind: sc, ok
        eval: ln.(syscall.Conn)
      - opt:
          do:
            - return: 0, syscall.EINVAL
          when: "!ok"
      - bind: rc, err
        eval: sc.SyscallConn()
        to: sc.SyscallConn
      - opt:
          do:
            - return: 0, err
          when: err != nil
      - var:
          name: v
          type: int
      - var:
          name: gerr
          type: error
      - bind: cerr
        eval: rc.Control(func(fd uintptr) { v, gerr = syscall.GetsockoptInt(int(fd), syscall.IPPROTO_TCP, syscall.TCP_NODELAY) })
        to: rc.Control
      - opt:
          do:
            - return: 0, cerr
          when: cerr != nil
      - return: v, gerr
  - of: dupListeners
    participants:
      - id: caller
        kind: actor
      - id: dupListeners
        kind: self
      - id: closeHandoff
        kind: internal
      - id: sc.SyscallConn
        kind: value
      - id: rc.Control
        kind: value
      - id: syscall
        kind: stdlib
      - id: swallowErr
        kind: internal
    steps:
      - bind: out
        eval: make([]loop.Listener, 0, len(lns))
      - loop:
          do:
            - bind: sc, ok
              eval: ln.(syscall.Conn)
            - opt:
                do:
                  - eval: closeHandoff(out)
                    to: closeHandoff
                  - return: nil, errs.Wrap(corenet.ListenFailed, errs.WrapParams{}, errs.String("cause", "listener has no descriptor"))
                when: "!ok"
            - bind: rc, err
              eval: sc.SyscallConn()
              to: sc.SyscallConn
            - opt:
                do:
                  - eval: closeHandoff(out)
                    to: closeHandoff
                  - return: nil, errs.Wrap(corenet.ListenFailed, errs.WrapParams{}, errs.String("cause", err.Error()))
                when: err != nil
            - var:
                name: nfd
                type: int
            - var:
                name: derr
                type: error
            - bind: cerr
              eval: |-
                rc.Control(func(fd uintptr) {
                			r, _, errno := syscall.Syscall(syscall.SYS_FCNTL, fd, syscall.F_DUPFD_CLOEXEC, 0)
                			//: the kernel's answer.
                			if errno != 0 {
                				derr = errno
                				return
                			}
                			nfd = int(r)
                		})
              to: rc.Control
            - opt:
                do:
                  - eval: closeHandoff(out)
                    to: closeHandoff
                  - return: nil, errs.Wrap(corenet.ListenFailed, errs.WrapParams{}, errs.String("cause", "dup failed"))
                when: cerr != nil || derr != nil
            - opt:
                do:
                  - eval: swallowErr(syscall.Close(nfd))
                    to: swallowErr
                  - eval: closeHandoff(out)
                    to: closeHandoff
                  - return: nil, errs.Wrap(corenet.ListenFailed, errs.WrapParams{}, errs.String("cause", err.Error()))
                init:
                  bind: err
                  eval: syscall.SetNonblock(nfd, true)
                  to: syscall
                when: err != nil
            - set: out
              value: "append(out, loop.Listener{FD: nfd})"
          key: _
          range: lns
          value: ln
      - return: out, nil
  - of: closeHandoff
    participants:
      - id: caller
        kind: actor
      - id: closeHandoff
        kind: self
      - id: swallowErr
        kind: internal
    steps:
      - loop:
          do:
            - eval: swallowErr(syscall.Close(l.FD))
              to: swallowErr
          key: _
          range: ls
          value: l
  - of: (*StreamGroup).HandleLoop
    steps:
      - opt:
          do:
            - return: g
          when: "!g.claimHandler()"
      - set: g.loopHandler
        value: h
      - return: g
  - of: (*StreamGroup).loopRefusal
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).loopRefusal
        kind: self
      - id: g.loopTLSRefusal
        kind: internal
      - id: buildLoopChain
        kind: internal
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: g.loopTLSRefusal()
                  to: g.loopTLSRefusal
                when: err != nil
          when: g.kinds.has(corenet.OptionTLS)
      - bind: chain, err
        eval: buildLoopChain(g.name, g.loopHandler, g.loopMiddlewares)
        to: buildLoopChain
      - opt:
          do:
            - return: err
          when: err != nil
      - set: g.loopChain
        value: chain
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: g.loopHonoursKind(chain, k)
            - return: |-
                errs.Wrap(corenet.LoopOptionUnsupported, errs.WrapParams{},
                			errs.String("group", g.name), errs.String("option", k.String()))
              to: errs
          key: _
          range: g.kinds.list()
          value: k
      - return: nil
  - of: (*StreamGroup).loopHonoursKind
    steps:
      - return: loopHonours(k) || (g.tlsCodec() && tlsCodecHonours(k)) || (k != corenet.OptionMiddleware && chainHonours(chain, k))
  - of: loopHonours
    steps:
      - switch:
          cases:
            - case: corenet.OptionIdleTimeout, corenet.OptionMaxConns, corenet.OptionAdopt, corenet.OptionPlaintext, corenet.OptionName, corenet.OptionEngine, corenet.OptionLoopMiddleware
              do:
                - return: "true"
            - default: true
              do:
                - return: "false"
          "on": k
  - of: (*Server).bindLoopGroup
    participants:
      - id: caller
        kind: actor
      - id: (*Server).bindLoopGroup
        kind: self
      - id: s.adoptStream
        kind: internal
      - id: s.registerLoopListeners
        kind: internal
      - id: listen
        kind: internal
      - id: loop
        kind: package
      - id: s.operator.plan
        kind: internal
      - id: st.OnStart
        kind: value
      - id: startOffloading
        kind: internal
      - id: eng.State
        kind: internal
      - id: s.recordFallback
        kind: internal
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
    steps:
      - var:
          name: lns
          type: "[]stdnet.Listener"
      - loop:
          do:
            - bind: adopted, err
              eval: s.adoptStream(name)
              to: s.adoptStream
            - opt:
                do:
                  - return: err
                when: err != nil
            - eval: s.registerLoopListeners(group, adopted, nil)
              to: s.registerLoopListeners
            - set: lns
              value: append(lns, group.loopLayers(adopted)...)
          key: _
          range: group.adopt
          value: name
      - loop:
          do:
            - bind: ln, rep, err
              eval: listen(ctx, addr, corenet.IdentityValue{}, false, false, s.rebindAttempts(addr))
              to: listen
            - opt:
                do:
                  - return: err
                when: err != nil
            - eval: s.registerLoopListeners(group, []stdnet.Listener{ln}, &rep)
              to: s.registerLoopListeners
            - set: lns
              value: append(lns, group.loopLayers([]stdnet.Listener{ln})...)
          key: _
          range: group.addrs
          value: addr
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: loop.CheckCapabilities(group.name, group.loop)
            to: loop
          when: err != nil
      - bind: plan
        eval: s.operator.plan(group.loopBackend(), nativeLoopBackends)
        to: s.operator.plan
      - opt:
          do:
            - eval: st.OnStart(loopLanes(group.loop))
              to: st.OnStart
          init:
            bind: st, ok
            eval: group.loopChain.(corenet.LoopStarter)
          when: ok
      - bind: eng, err
        eval: startOffloading(ctx, group, lns, plan)
        to: startOffloading
      - opt:
          do:
            - return: err
          when: err != nil
      - opt:
          do:
            - eval: s.recordFallback(group.name, st.DegradedReason)
              to: s.recordFallback
          init:
            bind: st
            eval: eng.State()
            to: eng.State
          when: st.Degraded
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - set: s.loopEngines
        value: append(s.loopEngines, eng)
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - return: nil
  - of: (*Server).registerLoopListeners
    participants:
      - id: caller
        kind: actor
      - id: (*Server).registerLoopListeners
        kind: self
      - id: exclusiveOf
        kind: internal
    steps:
      - lock:
          mutex: s.mu
      - loop:
          do:
            - bind: addr
              eval: "corenet.AddressValue{Network: ln.Addr().Network(), Addr: ln.Addr().String()}"
            - set: s.listeners
              value: "append(s.listeners, &boundListener{group: group.name, addr: addr, ln: ln})"
            - bind: row
              eval: |-
                corenet.ListenerStateValue{
                			Group: group.name, Address: ln.Addr().String(), Network: addr.Network, Shards: 1, Adopted: rep == nil,
                		}
            - alt:
                - do:
                    - set: row.Exclusive, row.BindWait
                      value: rep.exclusive, corenet.DurationValue(rep.wait)
                  when: rep != nil
                - do:
                    - set: row.Exclusive
                      to: exclusiveOf
                      value: exclusiveOf(listenerSocket(ln))
                  else: true
            - set: s.states
              value: append(s.states, row)
          key: _
          range: lns
          value: ln
  - of: (*Server).loopStates
    participants:
      - id: caller
        kind: actor
      - id: (*Server).loopStates
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: s.mu.RUnlock
        kind: value
    steps:
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: engines
        eval: s.loopEngines
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - var:
          name: out
          type: "[]corenet.LoopStateValue"
      - loop:
          do:
            - set: out
              value: append(out, e.State())
          key: _
          range: engines
          value: e
      - return: out
  - of: (*Server).shutdownLoops
    participants:
      - id: caller
        kind: actor
      - id: (*Server).shutdownLoops
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: s.mu.RUnlock
        kind: value
      - id: e.Shutdown
        kind: internal
    steps:
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: engines
        eval: s.loopEngines
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - var:
          name: first
          type: error
      - loop:
          do:
            - opt:
                do:
                  - set: first
                    value: err
                init:
                  bind: err
                  eval: e.Shutdown(ctx)
                  to: e.Shutdown
                when: err != nil && first == nil
          key: _
          range: engines
          value: e
      - return: first
  - of: (*Server).closeLoops
    participants:
      - id: caller
        kind: actor
      - id: (*Server).closeLoops
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: s.mu.RUnlock
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: engines
        eval: s.loopEngines
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - loop:
          do:
            - eval: swallowErr(e.Close())
              to: swallowErr
          key: _
          range: engines
          value: e
  - of: loopIdle
    participants:
      - id: caller
        kind: actor
      - id: loopIdle
        kind: self
      - id: time
        kind: stdlib
    steps:
      - return: time.Duration(group.timeouts.Idle)
        to: time
  - of: newJobRing
    steps:
      - bind: size
        eval: 1 << bits.Len(uint(max(n, 1)-1))
      - return: "&jobRing{jobs: make([]corenet.LoopJobValue, size), mask: uint64(size - 1)}"
  - of: (*jobRing).push
    participants:
      - id: caller
        kind: actor
      - id: (*jobRing).push
        kind: self
      - id: r.tail.Load
        kind: value
      - id: r.tail.Store
        kind: value
    steps:
      - bind: t
        eval: r.tail.Load()
        to: r.tail.Load
      - opt:
          do:
            - return: "false"
          when: t-r.head.Load() == uint64(len(r.jobs))
      - set: r.jobs[t&r.mask]
        value: job
      - eval: r.tail.Store(t + 1)
        to: r.tail.Store
      - return: "true"
  - of: (*jobRing).pop
    participants:
      - id: caller
        kind: actor
      - id: (*jobRing).pop
        kind: self
      - id: r.head.Load
        kind: value
      - id: r.head.Store
        kind: value
    steps:
      - bind: h
        eval: r.head.Load()
        to: r.head.Load
      - opt:
          do:
            - return: corenet.LoopJobValue{}, false
          when: h == r.tail.Load()
      - bind: job
        eval: r.jobs[h&r.mask]
      - eval: r.head.Store(h + 1)
        to: r.head.Store
      - return: job, true
  - of: (*outboundLane).Send
    participants:
      - id: caller
        kind: actor
      - id: (*outboundLane).Send
        kind: self
      - id: l.io.Store
        kind: value
      - id: l.refused.Add
        kind: value
    steps:
      - opt:
          do:
            - bind: kept
              eval: io
            - eval: l.io.Store(&kept)
              to: l.io.Store
          when: l.io.Load() == nil
      - opt:
          do:
            - eval: l.refused.Add(1)
              to: l.refused.Add
            - return: corenet.LoopOutboundFull
          when: "!l.jobs.push(job)"
      - select:
          cases:
            - comm: l.wake <- struct{}{}
            - default: true
      - return: nil
  - of: (*outboundLane).run
    participants:
      - id: caller
        kind: actor
      - id: (*outboundLane).run
        kind: self
      - id: done.Done
        kind: value
      - id: l.jobs.pop
        kind: internal
      - id: w.Work
        kind: value
      - id: l.complete
        kind: internal
    steps:
      - defer: done.Done()
        to: done.Done
      - loop:
          cond: "!l.stopped.Load()"
          do:
            - bind: job, ok
              eval: l.jobs.pop()
              to: l.jobs.pop
            - opt:
                do:
                  - eval: <-l.wake
                  - continue: true
                when: "!ok"
            - eval: w.Work(l.lane, job)
              to: w.Work
            - eval: l.complete(job)
              to: l.complete
  - of: (*outboundLane).complete
    participants:
      - id: caller
        kind: actor
      - id: (*outboundLane).complete
        kind: self
      - id: time
        kind: stdlib
      - id: l.io.Load
        kind: value
      - id: (*io).Post
        kind: value
    steps:
      - loop:
          cond: "!l.done.push(job)"
          do:
            - opt:
                do:
                  - return: ""
                when: l.stopped.Load()
            - eval: time.Sleep(postRetry)
              to: time
      - opt:
          do:
            - return: ""
          when: "!l.posted.CompareAndSwap(false, true)"
      - bind: io
        eval: l.io.Load()
        to: l.io.Load
      - loop:
          do:
            - bind: err
              eval: (*io).Post(runCompletions, l.key)
              to: (*io).Post
            - opt:
                do:
                  - return: ""
                when: err == nil || !errors.Is(err, corenet.LoopPostQueueFull)
            - eval: time.Sleep(postRetry)
              to: time
          forever: true
  - of: (*outboundLane).drain
    participants:
      - id: caller
        kind: actor
      - id: (*outboundLane).drain
        kind: self
      - id: l.posted.Store
        kind: value
      - id: l.done.pop
        kind: internal
      - id: l.off.OnDone
        kind: value
    steps:
      - eval: l.posted.Store(false)
        to: l.posted.Store
      - loop:
          do:
            - bind: job, ok
              eval: l.done.pop()
              to: l.done.pop
            - opt:
                do:
                  - return: ""
                when: "!ok"
            - eval: l.off.OnDone(io, job)
              to: l.off.OnDone
          forever: true
  - of: (*laneTable).now
    participants:
      - id: caller
        kind: actor
      - id: (*laneTable).now
        kind: self
      - id: t.lanes.Load
        kind: value
    steps:
      - opt:
          do:
            - return: "*p"
          init:
            bind: p
            eval: t.lanes.Load()
            to: t.lanes.Load
          when: p != nil
      - return: nil
  - of: registerLane
    participants:
      - id: caller
        kind: actor
      - id: registerLane
        kind: self
      - id: lanesWith
        kind: internal
      - id: outboundLanes.lanes.Store
        kind: value
    steps:
      - lock:
          mutex: outboundLanes.mu
      - set: l.key
        value: outboundLanes.next
      - op: ++
        set: outboundLanes.next
      - bind: next
        eval: lanesWith(len(outboundLanes.now()) + 1)
        to: lanesWith
      - set: next[l.key]
        value: l
      - eval: outboundLanes.lanes.Store(&next)
        to: outboundLanes.lanes.Store
  - of: releaseLane
    participants:
      - id: caller
        kind: actor
      - id: releaseLane
        kind: self
      - id: lanesWith
        kind: internal
      - id: outboundLanes.lanes.Store
        kind: value
    steps:
      - lock:
          mutex: outboundLanes.mu
      - bind: next
        eval: lanesWith(len(outboundLanes.now()))
        to: lanesWith
      - eval: delete(next, l.key)
      - eval: outboundLanes.lanes.Store(&next)
        to: outboundLanes.lanes.Store
  - of: lanesWith
    participants:
      - id: caller
        kind: actor
      - id: lanesWith
        kind: self
      - id: maps
        kind: stdlib
    steps:
      - bind: next
        eval: make(map[uintptr]*outboundLane, n)
      - eval: maps.Copy(next, outboundLanes.now())
        to: maps
      - return: next
  - of: runCompletions
    participants:
      - id: caller
        kind: actor
      - id: runCompletions
        kind: self
      - id: l.drain
        kind: internal
    steps:
      - bind: l
        eval: outboundLanes.now()[key]
      - opt:
          do:
            - return: ""
          when: l == nil
      - eval: l.drain(io)
        to: l.drain
  - of: startOutbound
    participants:
      - id: caller
        kind: actor
      - id: startOutbound
        kind: self
      - id: findOffloader
        kind: internal
      - id: orDefaultInt
        kind: internal
      - id: loopLanes
        kind: internal
      - id: registerLane
        kind: internal
      - id: o.workers.Add
        kind: value
      - id: l.run
        kind: internal
      - id: off.OnOutbound
        kind: value
    steps:
      - bind: off, w
        eval: findOffloader(chain)
        to: findOffloader
      - opt:
          do:
            - return: nil
          when: w == nil
      - bind: o
        eval: "&outbound{}"
      - bind: depth
        eval: orDefaultInt(v.Outbound, defaultOutboundDepth)
        to: orDefaultInt
      - bind: "n"
        eval: loopLanes(v)
        to: loopLanes
      - bind: outs
        eval: make([]corenet.LoopOutbound, n)
      - loop:
          do:
            - bind: l
              eval: |-
                &outboundLane{
                			lane: i, jobs: newJobRing(depth), done: newJobRing(depth),
                			wake: make(chan struct{}, 1), refused: &o.refused, off: off,
                		}
            - eval: registerLane(l)
              to: registerLane
            - set: o.lanes
              value: append(o.lanes, l)
            - set: outs[i]
              value: l
            - eval: o.workers.Add(1)
              to: o.workers.Add
            - go: l.run(w, &o.workers)
              to: l.run
          key: i
          range: "n"
      - eval: "off.OnOutbound(corenet.LoopOutboundValue{Lanes: outs, OutputCap: orDefaultInt(v.OutputCap, portableOutputCap)})"
        to: off.OnOutbound
      - set: o.busy
        value: off.Pending
      - return: o
  - of: startOffloading
    participants:
      - id: caller
        kind: actor
      - id: startOffloading
        kind: self
      - id: startOutbound
        kind: internal
      - id: startLoopEngine
        kind: internal
      - id: out.signal
        kind: internal
      - id: out.wait
        kind: internal
    steps:
      - bind: out
        eval: startOutbound(group.loopChain, group.loop)
        to: startOutbound
      - opt:
          do:
            - return: startLoopEngine(group, lns, plan)
              to: startLoopEngine
          when: out == nil
      - set: group.loopBusy
        value: out.busy
      - bind: eng, err
        eval: startLoopEngine(group, lns, plan)
        to: startLoopEngine
      - opt:
          do:
            - eval: out.signal()
              to: out.signal
            - eval: out.wait(ctx)
              to: out.wait
            - return: nil, err
          when: err != nil
      - return: "&offloadedEngine{loopEngine: eng, out: out}, nil"
  - of: findOffloader
    participants:
      - id: caller
        kind: actor
      - id: findOffloader
        kind: self
      - id: off.Worker
        kind: value
      - id: layered.Next
        kind: value
    steps:
      - loop:
          cond: h != nil
          do:
            - opt:
                do:
                  - opt:
                      do:
                        - return: off, w
                      init:
                        bind: w
                        eval: off.Worker()
                        to: off.Worker
                      when: w != nil
                init:
                  bind: off, ok
                  eval: h.(corenet.LoopOffloader)
                when: ok
            - bind: layered, ok
              eval: h.(corenet.LoopLayered)
            - opt:
                do:
                  - return: nil, nil
                when: "!ok"
            - set: h
              to: layered.Next
              value: layered.Next()
      - return: nil, nil
  - of: (*outbound).signal
    participants:
      - id: caller
        kind: actor
      - id: (*outbound).signal
        kind: self
      - id: o.stopOnce.Do
        kind: value
    steps:
      - eval: |-
          o.stopOnce.Do(func() {
          		//: each worker, woken to see it, and its entry released.
          		for _, l := range o.lanes {
          			l.stopped.Store(true)
          			releaseLane(l)
          			select {
          			case l.wake <- struct{}{}:
          			default:
          			}
          		}
          	})
        to: o.stopOnce.Do
  - of: (*outbound).wait
    steps:
      - bind: waited
        eval: make(chan struct{})
      - go: |-
          func() {
          		o.workers.Wait()
          		close(waited)
          	}()
      - select:
          cases:
            - comm: <-waited
            - comm: <-ctx.Done()
  - of: (*offloadedEngine).Shutdown
    participants:
      - id: caller
        kind: actor
      - id: (*offloadedEngine).Shutdown
        kind: self
      - id: e.loopEngine.Shutdown
        kind: internal
      - id: e.out.signal
        kind: internal
      - id: e.out.wait
        kind: internal
    steps:
      - bind: err
        eval: e.loopEngine.Shutdown(ctx)
        to: e.loopEngine.Shutdown
      - eval: e.out.signal()
        to: e.out.signal
      - eval: e.out.wait(ctx)
        to: e.out.wait
      - return: err
  - of: (*offloadedEngine).Close
    participants:
      - id: caller
        kind: actor
      - id: (*offloadedEngine).Close
        kind: self
      - id: e.loopEngine.Close
        kind: internal
      - id: e.out.signal
        kind: internal
    steps:
      - bind: err
        eval: e.loopEngine.Close()
        to: e.loopEngine.Close
      - eval: e.out.signal()
        to: e.out.signal
      - return: err
  - of: (*offloadedEngine).State
    participants:
      - id: caller
        kind: actor
      - id: (*offloadedEngine).State
        kind: self
      - id: e.loopEngine.State
        kind: internal
      - id: e.out.refused.Load
        kind: value
    steps:
      - bind: st
        eval: e.loopEngine.State()
        to: e.loopEngine.State
      - set: st.OutboundRefused
        to: e.out.refused.Load
        value: e.out.refused.Load()
      - return: st
  - of: (*portableGroup).live
    participants:
      - id: caller
        kind: actor
      - id: (*portableGroup).live
        kind: self
      - id: pl.live.Load
        kind: value
    steps:
      - var:
          name: "n"
          type: int64
      - loop:
          do:
            - op: +=
              set: "n"
              to: pl.live.Load
              value: pl.live.Load()
          key: _
          range: g.lanes
          value: pl
      - return: "n"
  - of: startPortable
    participants:
      - id: caller
        kind: actor
      - id: startPortable
        kind: self
      - id: group.handshakeBound
        kind: internal
      - id: g.acceptLoop
        kind: internal
      - id: pl.run
        kind: internal
    steps:
      - bind: v
        eval: group.loop
      - bind: g
        eval: |-
          &portableGroup{
          		group: group.name, soft: max(v.SoftConns, 0), maxConns: max(group.limits.MaxConns, 0),
          		degraded: degraded, lns: lns,
          		caps:       append(loop.Unprobed("portable", plan.disabled, plan.disabledBy), portableNoDelay(plan)),
          		noDelayOff: slices.Contains(plan.disabled, corenet.CapabilityTCPNoDelay),
          	}
      - opt:
          do:
            - set: g.handshake
              to: group.handshakeBound
              value: group.handshakeBound()
          when: group.tlsCodec()
      - loop:
          do:
            - set: g.lanes
              value: |-
                append(g.lanes, &portableLoop{
                			g: g, lane: i, h: group.loopChain, busy: group.loopBusy,
                			spillCap: orDefaultInt(v.SpillCap, portableSpillCap),
                			outCap:   orDefaultInt(v.OutputCap, portableOutputCap),
                			idle:     loopIdle(group),
                			events:   make(chan portableEvent, portableEvents),
                			postOps:  make([]corenet.PostFunc, portablePostCap), postArgs: make([]uintptr, portablePostCap),
                			wake: make(chan struct{}, 1), done: make(chan struct{}),
                		})
          key: i
          range: loopLanes(v)
      - loop:
          do:
            - go: g.acceptLoop(ln)
              to: g.acceptLoop
          key: _
          range: lns
          value: ln
      - loop:
          do:
            - go: pl.run(pl.done)
              to: pl.run
          key: _
          range: g.lanes
          value: pl
      - return: "portableEngine{g: g}"
  - of: portableNoDelay
    steps:
      - bind: row
        eval: "corenet.CapabilityValue{Name: corenet.CapabilityTCPNoDelay, Class: classKernel, Status: statusOn, Reason: \"the netpoller's default\"}"
      - opt:
          do:
            - set: row.Status, row.Reason
              value: statusDisabled, plan.disabledBy
          when: slices.Contains(plan.disabled, corenet.CapabilityTCPNoDelay)
      - return: row
  - of: orDefaultInt
    steps:
      - opt:
          do:
            - return: def
          when: v <= 0
      - return: v
  - of: (*portableGroup).acceptLoop
    participants:
      - id: caller
        kind: actor
      - id: (*portableGroup).acceptLoop
        kind: self
      - id: ln.Accept
        kind: value
      - id: time
        kind: stdlib
      - id: g.rejected.Add
        kind: value
      - id: swallowErr
        kind: internal
      - id: g.dispatch
        kind: internal
    steps:
      - bind: failures
        eval: "0"
      - loop:
          do:
            - bind: c, err
              eval: ln.Accept()
              to: ln.Accept
            - opt:
                do:
                  - opt:
                      do:
                        - return: ""
                      when: errors.Is(err, stdnet.ErrClosed) || g.stopReq.Load()
                  - op: ++
                    set: failures
                  - eval: time.Sleep(acceptDelay(failures))
                    to: time
                  - continue: true
                when: err != nil
            - set: failures
              value: "0"
            - opt:
                do:
                  - eval: g.rejected.Add(1)
                    to: g.rejected.Add
                  - eval: swallowErr(c.Close())
                    to: swallowErr
                  - continue: true
                when: g.maxConns > 0 && g.live() >= int64(g.maxConns) || g.drainReq.Load()
            - eval: g.dispatch(c)
              to: g.dispatch
          forever: true
  - of: (*portableGroup).dispatch
    participants:
      - id: caller
        kind: actor
      - id: (*portableGroup).dispatch
        kind: self
      - id: pl.live.Add
        kind: value
      - id: pl.negotiate
        kind: internal
    steps:
      - bind: pl
        eval: g.lanes[(g.turn.Add(1)-1)%uint64(len(g.lanes))]
      - eval: pl.live.Add(1)
        to: pl.live.Add
      - opt:
          do:
            - go: pl.negotiate(c, g.handshake)
              to: pl.negotiate
            - return: ""
          when: g.handshake > 0
      - send:
          chan: pl.events
          value: "portableEvent{kind: pevOpen, conn: c}"
  - of: (*portableLoop).negotiate
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).negotiate
        kind: self
      - id: pl.live.Add
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - opt:
          do:
            - eval: pl.live.Add(-1)
              to: pl.live.Add
            - return: ""
          when: "!handshake(c, d)"
      - select:
          cases:
            - comm: "pl.events <- portableEvent{kind: pevOpen, conn: c}"
            - comm: <-pl.done
              do:
                - eval: pl.live.Add(-1)
                  to: pl.live.Add
                - eval: swallowErr(c.Close())
                  to: swallowErr
  - of: (*portableLoop).run
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).run
        kind: self
      - id: time
        kind: stdlib
      - id: tick.Stop
        kind: value
      - id: pl.handle
        kind: internal
      - id: pl.collect
        kind: internal
      - id: pl.drainPosts
        kind: internal
      - id: pl.timers
        kind: internal
      - id: pl.control
        kind: internal
      - id: pl.h.OnBatchEnd
        kind: value
      - id: pl.endBatch
        kind: internal
      - id: pl.closeAll
        kind: internal
    steps:
      - defer: close(done)
      - bind: tick
        eval: time.NewTicker(portableTick)
        to: time
      - defer: tick.Stop()
        to: tick.Stop
      - loop:
          do:
            - select:
                cases:
                  - comm: ev := <-pl.events
                    do:
                      - eval: pl.handle(&ev)
                        to: pl.handle
                  - comm: <-pl.wake
                  - comm: <-tick.C
            - eval: pl.collect()
              to: pl.collect
            - eval: pl.drainPosts()
              to: pl.drainPosts
            - eval: pl.timers()
              to: pl.timers
            - eval: pl.control()
              to: pl.control
            - eval: pl.h.OnBatchEnd(pl)
              to: pl.h.OnBatchEnd
            - eval: pl.endBatch()
              to: pl.endBatch
            - opt:
                do:
                  - eval: pl.closeAll()
                    to: pl.closeAll
                  - return: ""
                when: pl.g.stopReq.Load() || (pl.draining && pl.live.Load() == 0)
          forever: true
  - of: (*portableLoop).collect
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).collect
        kind: self
      - id: pl.handle
        kind: internal
    steps:
      - loop:
          do:
            - select:
                cases:
                  - comm: ev := <-pl.events
                    do:
                      - eval: pl.handle(&ev)
                        to: pl.handle
                  - default: true
                    do:
                      - return: ""
          range: portableEvents
  - of: (*portableLoop).handle
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).handle
        kind: self
      - id: pl.open
        kind: internal
      - id: pl.handleData
        kind: internal
      - id: pl.handleEnd
        kind: internal
      - id: pl.handleSent
        kind: internal
    steps:
      - switch:
          cases:
            - case: pevOpen
              do:
                - eval: pl.open(ev.conn)
                  to: pl.open
            - case: pevData
              do:
                - eval: pl.handleData(ev)
                  to: pl.handleData
            - case: pevEnd
              do:
                - eval: pl.handleEnd(ev)
                  to: pl.handleEnd
            - case: pevSent
              do:
                - eval: pl.handleSent(ev)
                  to: pl.handleSent
          "on": ev.kind
  - of: (*portableLoop).handleData
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).handleData
        kind: self
      - id: pl.lookupSlot
        kind: internal
      - id: pl.deliver
        kind: internal
    steps:
      - bind: pc
        eval: pl.lookupSlot(ev.slot, ev.gen)
        to: pl.lookupSlot
      - set: pl.batchAcks
        value: append(pl.batchAcks, pl.conns[ev.slot].ack)
      - opt:
          do:
            - return: ""
          when: pc == nil || !pc.open
      - eval: pl.deliver(ev.slot, pc, ev.data)
        to: pl.deliver
  - of: (*portableLoop).handleEnd
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).handleEnd
        kind: self
      - id: pl.lookupSlot
        kind: internal
      - id: pl.markDirty
        kind: internal
      - id: pl.finish
        kind: internal
    steps:
      - bind: pc
        eval: pl.lookupSlot(ev.slot, ev.gen)
        to: pl.lookupSlot
      - opt:
          do:
            - return: ""
          when: pc == nil || !pc.open
      - opt:
          do:
            - set: pc.peerDone
              value: "true"
            - eval: pl.markDirty(ev.slot)
              to: pl.markDirty
            - return: ""
          when: errors.Is(ev.err, io.EOF) && !pc.reasonSet
      - eval: pl.finish(ev.slot, pc, ev.err)
        to: pl.finish
  - of: (*portableLoop).handleSent
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).handleSent
        kind: self
      - id: pl.lookupSlot
        kind: internal
      - id: time
        kind: stdlib
      - id: pl.markDirty
        kind: internal
      - id: pl.h.OnWritable
        kind: value
    steps:
      - bind: pc
        eval: pl.lookupSlot(ev.slot, ev.gen)
        to: pl.lookupSlot
      - opt:
          do:
            - return: ""
          when: pc == nil || !pc.open
      - set: pc.lastIO
        to: time
        value: time.Now()
      - eval: pl.markDirty(ev.slot)
        to: pl.markDirty
      - opt:
          do:
            - set: pc.wantWrite
              value: "false"
            - eval: "pl.h.OnWritable(pl, corenet.LoopConnRef{Slot: uint32(ev.slot), Gen: pc.gen})"
              to: pl.h.OnWritable
          when: pc.wantWrite && pl.pending(pc) < pl.outCap/4
  - of: (*portableLoop).open
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).open
        kind: self
      - id: swallowErr
        kind: internal
      - id: pl.accepted.Add
        kind: value
      - id: pl.readers.Add
        kind: value
      - id: pl.reader
        kind: internal
      - id: pl.writer
        kind: internal
      - id: pl.h.OnOpen
        kind: value
    steps:
      - opt:
          do:
            - eval: swallowErr(tc.SetNoDelay(false))
              to: swallowErr
          init:
            bind: tc, ok
            eval: c.(*stdnet.TCPConn)
          when: ok && pl.g.noDelayOff
      - var:
          name: slot
          type: int32
      - alt:
          - do:
              - set: slot
                value: pl.free[n-1]
              - set: pl.free
                value: pl.free[:n-1]
            init:
              bind: "n"
              eval: len(pl.free)
            when: n > 0
          - do:
              - set: slot
                value: int32(len(pl.conns))
              - set: pl.conns
                value: append(pl.conns, &portableConn{})
            else: true
      - bind: prev
        eval: pl.conns[slot]
      - bind: gen
        eval: prev.gen + 1
      - opt:
          do:
            - set: gen
              value: "1"
          when: gen == 0
      - bind: pc
        eval: |-
          &portableConn{
          		conn: c, gen: gen, ack: make(chan struct{}, 1), kick: make(chan struct{}, 1), open: true, lastIO: time.Now(),
          		pressure: pl.g.soft > 0 && pl.g.live() > int64(pl.g.soft),
          	}
      - set: pl.conns[slot]
        value: pc
      - eval: pl.accepted.Add(1)
        to: pl.accepted.Add
      - eval: pl.readers.Add(1)
        to: pl.readers.Add
      - go: pl.reader(slot, pc)
        to: pl.reader
      - go: pl.writer(slot, pc)
        to: pl.writer
      - eval: "pl.h.OnOpen(pl, corenet.LoopConnRef{Slot: uint32(slot), Gen: gen})"
        to: pl.h.OnOpen
  - of: (*portableLoop).reader
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).reader
        kind: self
      - id: pl.readers.Done
        kind: value
      - id: pc.conn.Read
        kind: value
      - id: fillMark
        kind: internal
    steps:
      - defer: pl.readers.Done()
        to: pl.readers.Done
      - bind: buf
        eval: make([]byte, portableReadSize)
      - loop:
          do:
            - bind: n, err
              eval: pc.conn.Read(buf)
              to: pc.conn.Read
            - opt:
                do:
                  - send:
                      chan: pl.events
                      value: "portableEvent{kind: pevData, slot: slot, gen: pc.gen, data: buf[:n]}"
                  - eval: <-pc.ack
                  - opt:
                      do:
                        - eval: fillMark(buf[:n])
                          to: fillMark
                      when: markRecycled.Load()
                when: n > 0
            - opt:
                do:
                  - send:
                      chan: pl.events
                      value: "portableEvent{kind: pevEnd, slot: slot, gen: pc.gen, err: err}"
                  - return: ""
                when: err != nil
          forever: true
  - of: (*portableLoop).writer
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).writer
        kind: self
      - id: pc.mu.Lock
        kind: value
      - id: pc.mu.Unlock
        kind: value
      - id: swallowErr
        kind: internal
      - id: pc.conn.Write
        kind: value
    steps:
      - loop:
          do:
            - loop:
                do:
                  - eval: pc.mu.Lock()
                    to: pc.mu.Lock
                  - bind: out
                    eval: pc.out
                  - set: pc.flight
                    value: len(out)
                  - set: pc.out
                    value: nil
                  - bind: closing
                    eval: pc.closing
                  - eval: pc.mu.Unlock()
                    to: pc.mu.Unlock
                  - opt:
                      do:
                        - opt:
                            do:
                              - eval: swallowErr(pc.conn.Close())
                                to: swallowErr
                              - return: ""
                            when: closing
                        - break: true
                      when: len(out) == 0
                  - bind: _, err
                    eval: pc.conn.Write(out)
                    to: pc.conn.Write
                  - eval: pc.mu.Lock()
                    to: pc.mu.Lock
                  - set: pc.flight
                    value: "0"
                  - eval: pc.mu.Unlock()
                    to: pc.mu.Unlock
                  - opt:
                      do:
                        - eval: swallowErr(pc.conn.Close())
                          to: swallowErr
                        - return: ""
                      when: err != nil
                  - send:
                      chan: pl.events
                      value: "portableEvent{kind: pevSent, slot: slot, gen: pc.gen}"
                forever: true
          range: pc.kick
  - of: (*portableLoop).lookupSlot
    steps:
      - opt:
          do:
            - return: nil
          when: int(slot) >= len(pl.conns) || pl.conns[slot].gen != gen || gen == 0
      - return: pl.conns[slot]
  - of: (*portableLoop).lookup
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).lookup
        kind: self
      - id: pl.lookupSlot
        kind: internal
    steps:
      - bind: pc
        eval: pl.lookupSlot(int32(ref.Slot), ref.Gen)
        to: pl.lookupSlot
      - opt:
          do:
            - return: 0, nil
          when: ref.Ring != 0 || pc == nil || !pc.open || pc.reasonSet
      - return: int32(ref.Slot), pc
  - of: (*portableLoop).deliver
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).deliver
        kind: self
      - id: time
        kind: stdlib
      - id: pl.finish
        kind: internal
      - id: clampUsed
        kind: internal
    steps:
      - set: pc.lastIO
        to: time
        value: time.Now()
      - bind: ref
        eval: "corenet.LoopConnRef{Slot: uint32(slot), Gen: pc.gen}"
      - bind: buf
        eval: data
      - opt:
          do:
            - opt:
                do:
                  - eval: pl.finish(slot, pc, corenet.LoopSpillFull)
                    to: pl.finish
                  - return: ""
                when: len(pc.spill)-pc.spillOff+len(data) > pl.spillCap
            - set: pc.spill
              value: append(pc.spill, data...)
            - set: buf
              value: pc.spill[pc.spillOff:]
          when: len(pc.spill) > pc.spillOff
      - bind: "n"
        eval: clampUsed(pl.h.OnData(pl, ref, buf), len(buf))
        to: clampUsed
      - opt:
          do:
            - return: ""
          when: "!pc.open"
      - alt:
          - do:
              - op: +=
                set: pc.spillOff
                value: "n"
            when: len(pc.spill) > pc.spillOff
          - do:
              - bind: tail
                eval: buf[n:]
              - opt:
                  do:
                    - eval: pl.finish(slot, pc, corenet.LoopSpillFull)
                      to: pl.finish
                    - return: ""
                  when: len(tail) > pl.spillCap
              - set: pc.spill
                value: append(pc.spill[:0:0], tail...)
              - set: pc.spillOff
                value: "0"
            when: n < len(buf)
  - of: clampUsed
    steps:
      - opt:
          do:
            - return: "n"
          when: v < 0 || v > n
      - return: v
  - of: (*portableLoop).pending
    steps:
      - lock:
          mutex: pc.mu
      - return: len(pc.out) + pc.flight
  - of: (*portableLoop).markDirty
    steps:
      - set: pl.dirty
        value: append(pl.dirty, slot)
  - of: (*portableLoop).finish
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).finish
        kind: self
      - id: pl.live.Add
        kind: value
      - id: pl.closed.Add
        kind: value
      - id: pl.h.OnClose
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "!pc.open"
      - set: pc.open
        value: "false"
      - opt:
          do:
            - set: err
              value: nil
          when: errors.Is(err, io.EOF) || errors.Is(err, stdnet.ErrClosed)
      - opt:
          do:
            - set: err
              value: pc.closeErr
          when: pc.reasonSet
      - eval: pl.live.Add(-1)
        to: pl.live.Add
      - eval: pl.closed.Add(1)
        to: pl.closed.Add
      - eval: "pl.h.OnClose(pl, corenet.LoopConnRef{Slot: uint32(slot), Gen: pc.gen}, err)"
        to: pl.h.OnClose
      - eval: swallowErr(pc.conn.Close())
        to: swallowErr
      - eval: close(pc.kick)
      - set: pl.free
        value: append(pl.free, slot)
  - of: (*portableLoop).timers
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).timers
        kind: self
      - id: time
        kind: stdlib
      - id: pl.finish
        kind: internal
      - id: pl.h.OnTimeout
        kind: value
    steps:
      - bind: now
        eval: time.Now()
        to: time
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: "!pc.open"
            - opt:
                do:
                  - set: pc.reasonSet, pc.closeErr
                    value: true, os.ErrDeadlineExceeded
                  - eval: pl.finish(int32(slot), pc, os.ErrDeadlineExceeded)
                    to: pl.finish
                  - continue: true
                when: pl.idle > 0 && now.Sub(pc.lastIO) >= pl.idle && pl.pending(pc) == 0
            - opt:
                do:
                  - set: pc.deadline
                    value: time.Time{}
                  - eval: "pl.h.OnTimeout(pl, corenet.LoopConnRef{Slot: uint32(slot), Gen: pc.gen})"
                    to: pl.h.OnTimeout
                when: "!pc.deadline.IsZero() && !now.Before(pc.deadline)"
          key: slot
          range: pl.conns
          value: pc
  - of: (*portableLoop).control
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).control
        kind: self
      - id: pl.closeSettled
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: "!pl.g.drainReq.Load()"
      - set: pl.draining
        value: "true"
      - eval: pl.closeSettled()
        to: pl.closeSettled
  - of: (*portableLoop).closeSettled
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).closeSettled
        kind: self
      - id: pl.markDirty
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - set: pc.reasonSet, pc.closeErr
                    value: true, corenet.ServerClosed
                  - eval: pl.markDirty(int32(slot))
                    to: pl.markDirty
                when: |-
                  pc.open && !pc.reasonSet && len(pc.spill) == pc.spillOff &&
                  			(pl.busy == nil || !pl.busy(pl.lane, corenet.LoopConnRef{Slot: uint32(slot), Gen: pc.gen}))
          key: slot
          range: pl.conns
          value: pc
  - of: (*portableLoop).endBatch
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).endBatch
        kind: self
      - id: pl.settle
        kind: internal
      - id: pl.compactSpills
        kind: internal
      - id: pl.batches.Add
        kind: value
    steps:
      - loop:
          do:
            - eval: pl.settle(slot)
              to: pl.settle
          key: _
          range: pl.dirty
          value: slot
      - set: pl.dirty
        value: pl.dirty[:0]
      - loop:
          do:
            - send:
                chan: a
                value: struct{}{}
          key: _
          range: pl.batchAcks
          value: a
      - set: pl.batchAcks
        value: pl.batchAcks[:0]
      - eval: pl.compactSpills()
        to: pl.compactSpills
      - eval: pl.batches.Add(1)
        to: pl.batches.Add
  - of: (*portableLoop).settle
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).settle
        kind: self
      - id: pc.mu.Lock
        kind: value
      - id: pc.mu.Unlock
        kind: value
      - id: pl.finish
        kind: internal
    steps:
      - bind: pc
        eval: pl.conns[slot]
      - opt:
          do:
            - return: ""
          when: "!pc.open"
      - eval: pc.mu.Lock()
        to: pc.mu.Lock
      - bind: empty
        eval: len(pc.out) == 0 && pc.flight == 0
      - opt:
          do:
            - set: pc.closing
              value: "true"
          when: pc.reasonSet || pc.peerDone
      - eval: pc.mu.Unlock()
        to: pc.mu.Unlock
      - opt:
          do:
            - eval: pl.finish(slot, pc, pc.closeErr)
              to: pl.finish
            - return: ""
          when: empty && (pc.reasonSet || pc.peerDone)
      - select:
          cases:
            - comm: pc.kick <- struct{}{}
            - default: true
  - of: (*portableLoop).closeAll
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).closeAll
        kind: self
      - id: pl.finish
        kind: internal
      - id: pl.postMu.Lock
        kind: value
      - id: pl.postMu.Unlock
        kind: value
    steps:
      - loop:
          do:
            - opt:
                do:
                  - set: pc.reasonSet, pc.closeErr
                    value: true, corenet.ServerClosed
                  - eval: pl.finish(int32(slot), pc, corenet.ServerClosed)
                    to: pl.finish
                when: pc.open
          key: slot
          range: pl.conns
          value: pc
      - eval: pl.postMu.Lock()
        to: pl.postMu.Lock
      - set: pl.postShut
        value: "true"
      - eval: pl.postMu.Unlock()
        to: pl.postMu.Unlock
      - loop:
          do:
            - send:
                chan: a
                value: struct{}{}
          key: _
          range: pl.batchAcks
          value: a
      - go: |-
          func() {
          		quiet := time.NewTimer(time.Second)
          		defer quiet.Stop()
          		//: a reader still sending its last event finds nobody; drained here,
          		//: until a second passes with none.
          		for {
          			select {
          			case <-pl.events:
          				quiet.Reset(time.Second)
          			case <-quiet.C:
          				return
          			}
          		}
          	}()
  - of: (*portableLoop).drainPosts
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).drainPosts
        kind: self
      - id: pl.postWait.Store
        kind: value
      - id: pl.postMu.Lock
        kind: value
      - id: pl.postMu.Unlock
        kind: value
    steps:
      - eval: pl.postWait.Store(false)
        to: pl.postWait.Store
      - loop:
          do:
            - eval: pl.postMu.Lock()
              to: pl.postMu.Lock
            - opt:
                do:
                  - eval: pl.postMu.Unlock()
                    to: pl.postMu.Unlock
                  - return: ""
                when: pl.postN == 0
            - bind: op, arg
              eval: pl.postOps[pl.postHead], pl.postArgs[pl.postHead]
            - set: pl.postOps[pl.postHead]
              value: nil
            - set: pl.postHead
              value: (pl.postHead + 1) % len(pl.postOps)
            - op: "--"
              set: pl.postN
            - eval: pl.postMu.Unlock()
              to: pl.postMu.Unlock
            - eval: op(pl, arg)
          forever: true
  - of: (*portableLoop).Write
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).Write
        kind: self
      - id: pl.lookup
        kind: internal
      - id: pc.mu.Lock
        kind: value
      - id: pc.mu.Unlock
        kind: value
      - id: pl.markDirty
        kind: internal
    steps:
      - bind: slot, pc
        eval: pl.lookup(ref)
        to: pl.lookup
      - opt:
          do:
            - return: corenet.LoopStaleRef
          when: pc == nil
      - eval: pc.mu.Lock()
        to: pc.mu.Lock
      - opt:
          do:
            - eval: pc.mu.Unlock()
              to: pc.mu.Unlock
            - set: pc.wantWrite
              value: "true"
            - return: corenet.LoopOutputFull
          when: len(pc.out)+pc.flight+len(p) > pl.outCap
      - set: pc.out
        value: append(pc.out, p...)
      - eval: pc.mu.Unlock()
        to: pc.mu.Unlock
      - eval: pl.markDirty(slot)
        to: pl.markDirty
      - return: nil
  - of: (*portableLoop).Close
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).Close
        kind: self
      - id: pl.lookup
        kind: internal
      - id: pl.markDirty
        kind: internal
    steps:
      - bind: slot, pc
        eval: pl.lookup(ref)
        to: pl.lookup
      - opt:
          do:
            - return: corenet.LoopStaleRef
          when: pc == nil
      - set: pc.reasonSet, pc.closeErr
        value: true, nil
      - eval: pl.markDirty(slot)
        to: pl.markDirty
      - return: nil
  - of: (*portableLoop).SetDeadline
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).SetDeadline
        kind: self
      - id: pl.lookup
        kind: internal
      - id: time.Now().Add
        kind: value
    steps:
      - bind: _, pc
        eval: pl.lookup(ref)
        to: pl.lookup
      - opt:
          do:
            - return: corenet.LoopStaleRef
          when: pc == nil
      - alt:
          - do:
              - set: pc.deadline
                value: time.Time{}
            when: d <= 0
          - do:
              - set: pc.deadline
                to: time.Now().Add
                value: time.Now().Add(d)
            else: true
      - return: nil
  - of: (*portableLoop).Pressure
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).Pressure
        kind: self
      - id: pl.lookup
        kind: internal
    steps:
      - bind: _, pc
        eval: pl.lookup(ref)
        to: pl.lookup
      - return: pc != nil && pc.pressure
  - of: (*portableLoop).Loop
    steps:
      - return: pl.lane
  - of: (*portableLoop).Post
    participants:
      - id: caller
        kind: actor
      - id: (*portableLoop).Post
        kind: self
      - id: pl.postMu.Lock
        kind: value
      - id: pl.postMu.Unlock
        kind: value
    steps:
      - eval: pl.postMu.Lock()
        to: pl.postMu.Lock
      - opt:
          do:
            - eval: pl.postMu.Unlock()
              to: pl.postMu.Unlock
            - return: corenet.ServerClosed
          when: pl.postShut
      - opt:
          do:
            - eval: pl.postMu.Unlock()
              to: pl.postMu.Unlock
            - return: corenet.LoopPostQueueFull
          when: pl.postN == len(pl.postOps)
      - bind: i
        eval: (pl.postHead + pl.postN) % len(pl.postOps)
      - set: pl.postOps[i], pl.postArgs[i]
        value: op, arg
      - op: ++
        set: pl.postN
      - eval: pl.postMu.Unlock()
        to: pl.postMu.Unlock
      - opt:
          do:
            - select:
                cases:
                  - comm: pl.wake <- struct{}{}
                  - default: true
          when: pl.postWait.CompareAndSwap(false, true)
      - return: nil
  - of: (*portableGroup).wakeAll
    steps:
      - loop:
          do:
            - select:
                cases:
                  - comm: pl.wake <- struct{}{}
                  - default: true
          key: _
          range: g.lanes
          value: pl
  - of: portableEngine.Shutdown
    participants:
      - id: caller
        kind: actor
      - id: portableEngine.Shutdown
        kind: self
      - id: g.drainReq.Store
        kind: value
      - id: g.wakeAll
        kind: internal
      - id: swallowErr
        kind: internal
      - id: errs
        kind: package
    steps:
      - bind: g
        eval: e.g
      - eval: g.drainReq.Store(true)
        to: g.drainReq.Store
      - eval: g.wakeAll()
        to: g.wakeAll
      - loop:
          do:
            - select:
                cases:
                  - comm: <-pl.done
                  - comm: <-ctx.Done()
                    do:
                      - eval: swallowErr(e.Close())
                        to: swallowErr
                      - return: errs.Wrap(corenet.DrainTimeout, errs.WrapParams{}, errs.String("group", g.group))
                        to: errs
          key: _
          range: g.lanes
          value: pl
      - return: nil
  - of: portableEngine.Close
    participants:
      - id: caller
        kind: actor
      - id: portableEngine.Close
        kind: self
      - id: g.once.Do
        kind: value
    steps:
      - bind: g
        eval: e.g
      - eval: |-
          g.once.Do(func() {
          		g.stopReq.Store(true)
          		g.wakeAll()
          		//: every lane's goroutine returned.
          		for _, pl := range g.lanes {
          			<-pl.done
          		}
          	})
        to: g.once.Do
      - return: nil
  - of: portableEngine.State
    steps:
      - bind: g
        eval: e.g
      - bind: rings
        eval: make([]corenet.LoopRingStateValue, 0, len(g.lanes))
      - loop:
          do:
            - set: rings
              value: |-
                append(rings, corenet.LoopRingStateValue{
                			Conns: pl.live.Load(), Accepted: pl.accepted.Load(), Closed: pl.closed.Load(),
                			Batches: pl.batches.Load(), Evicted: 0,
                		})
          key: _
          range: g.lanes
          value: pl
      - return: |-
          corenet.LoopStateValue{
          		Group: g.group, Backend: corenet.LoopBackendPortable, ProbeStage: "portable",
          		Degraded: g.degraded != "", DegradedReason: g.degraded,
          		Loops: len(g.lanes), Rings: 1, RingsSource: "single", GOMAXPROCS: runtime.GOMAXPROCS(0),
          		Capabilities: slices.Clone(g.caps),
          		RingStates:   rings,
          	}
  - of: fillMark
    steps:
      - loop:
          do:
            - set: b[i]
              value: recycledMark
          key: i
          range: b
  - of: (*StreamGroup).tlsCodec
    steps:
      - bind: _, codec
        eval: g.loopHandler.(codecUnwrapper)
      - return: codec && g.kinds.has(corenet.OptionTLS)
  - of: (*StreamGroup).loopTLSRefusal
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).loopTLSRefusal
        kind: self
      - id: errs
        kind: package
      - id: g.tlsCodecRefusal
        kind: internal
    steps:
      - opt:
          do:
            - return: errs.Wrap(corenet.LoopTLSUnsupported, errs.WrapParams{}, errs.String("group", g.name))
              to: errs
          when: "!g.tlsCodec()"
      - return: g.tlsCodecRefusal()
        to: g.tlsCodecRefusal
  - of: (*StreamGroup).tlsCodecRefusal
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).tlsCodecRefusal
        kind: self
      - id: g.tlsErr
        kind: internal
    steps:
      - switch:
          cases:
            - case: g.identity.IsZero()
              do:
                - return: g.tlsErr("TLS")
                  to: g.tlsErr
            - case: g.loopSet && g.loop.Backend != corenet.LoopBackendAuto && g.loop.Backend != corenet.LoopBackendPortable
              do:
                - return: g.tlsErr("Loop")
                  to: g.tlsErr
            - case: g.kinds.has(corenet.OptionLoopMiddleware)
              do:
                - return: g.tlsErr(corenet.OptionLoopMiddleware.String())
                  to: g.tlsErr
            - default: true
              do:
                - return: nil
  - of: (*StreamGroup).tlsErr
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).tlsErr
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(corenet.LoopTLSUnsupported, errs.WrapParams{},
          		errs.String("group", g.name), errs.String("option", option))
        to: errs
  - of: (*StreamGroup).loopLayers
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).loopLayers
        kind: self
      - id: tls
        kind: stdlib
    steps:
      - opt:
          do:
            - return: lns
          when: "!g.tlsCodec()"
      - bind: out
        eval: make([]stdnet.Listener, len(lns))
      - loop:
          do:
            - set: out[i]
              to: tls
              value: tls.NewListener(ln, g.codecTLS())
          key: i
          range: lns
          value: ln
      - return: out
  - of: (*StreamGroup).loopBackend
    steps:
      - opt:
          do:
            - return: corenet.LoopBackendPortable
          when: g.tlsCodec()
      - return: g.loop.Backend
  - of: tlsCodecHonours
    steps:
      - return: k == corenet.OptionTLS || k == corenet.OptionHandshakeTimeout
  - of: (*StreamGroup).codecTLS
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).codecTLS
        kind: self
      - id: g.identity.ServerConfig
        kind: value
    steps:
      - bind: cfg
        eval: g.identity.ServerConfig()
        to: g.identity.ServerConfig
      - set: cfg.NextProtos
        value: alpnHTTP1
      - return: cfg
  - of: (*StreamGroup).handshakeBound
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).handshakeBound
        kind: self
      - id: g.timeouts.Handshake.Duration
        kind: value
    steps:
      - opt:
          do:
            - return: d
          init:
            bind: d
            eval: g.timeouts.Handshake.Duration()
            to: g.timeouts.Handshake.Duration
          when: d > 0
      - return: defaultHandshakeTimeout
  - of: handshake
    participants:
      - id: caller
        kind: actor
      - id: handshake
        kind: self
      - id: context
        kind: stdlib
      - id: tc.HandshakeContext
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - bind: tc, ok
        eval: c.(*tls.Conn)
      - opt:
          do:
            - return: "true"
          when: "!ok"
      - bind: ctx, cancel
        eval: context.WithTimeout(context.Background(), d)
        to: context
      - defer: cancel()
      - opt:
          do:
            - eval: swallowErr(c.Close())
              to: swallowErr
            - return: "false"
          init:
            bind: err
            eval: tc.HandshakeContext(ctx)
            to: tc.HandshakeContext
          when: err != nil
      - return: "true"
  - of: newMultiReader
    participants:
      - id: caller
        kind: actor
      - id: newMultiReader
        kind: self
      - id: sc.SyscallConn
        kind: internal
    steps:
      - bind: raw, rerr
        eval: sc.SyscallConn()
        to: sc.SyscallConn
      - opt:
          do:
            - return: nil, rerr
          when: rerr != nil
      - return: "&multiReader{pc: pc, raw: raw}, nil"
  - of: (*multiReader).enableGRO
    steps:
      - set: r.gro
        value: r.setGRO(true) == nil
      - return: r.gro
  - of: (*multiReader).setGRO
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).setGRO
        kind: self
      - id: r.raw.Control
        kind: value
      - id: cmp
        kind: stdlib
    steps:
      - bind: value
        eval: "0"
      - opt:
          do:
            - set: value
              value: "1"
          when: "on"
      - var:
          name: serr
          type: error
      - bind: cerr
        eval: |-
          r.raw.Control(func(fd uintptr) {
          		serr = syscall.SetsockoptInt(int(fd), syscall.IPPROTO_UDP, udpGRO, value)
          	})
        to: r.raw.Control
      - return: cmp.Or(cerr, serr)
        to: cmp
  - of: (*multiReader).handover
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).handover
        kind: self
      - id: r.handing.Store
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - opt:
          do:
            - return: "false"
          when: "!r.gro"
      - eval: r.handing.Store(true)
        to: r.handing.Store
      - eval: swallowErr(r.pc.SetReadDeadline(time.Unix(1, 0)))
        to: swallowErr
      - return: "true"
  - of: (*multiReader).stopGRO
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).stopGRO
        kind: self
      - id: r.switchGROOff
        kind: internal
    steps:
      - opt:
          do:
            - eval: r.switchGROOff()
              to: r.switchGROOff
          when: r.gro
  - of: (*multiReader).switchGROOff
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).switchGROOff
        kind: self
      - id: r.stopping.Store
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - eval: r.stopping.Store(true)
        to: r.stopping.Store
      - eval: swallowErr(r.setGRO(false))
        to: swallowErr
  - of: (*multiReader).slotSize
    steps:
      - opt:
          do:
            - return: ceiling
          when: "!r.gro"
      - return: max(ceiling, groMessageSize)
  - of: (*multiReader).wire
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).wire
        kind: self
      - id: setKernelLen
        kind: internal
      - id: r.bind
        kind: internal
      - id: r.prepare
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: r.wired == len(slots)
      - bind: count
        eval: len(slots)
      - opt:
          do:
            - set: r.controlSpace
              value: groControlSpace
          when: r.controlSpace <= 0 && r.gro
      - set: r.headers
        value: make([]mmsghdr, count)
      - set: r.iovecs
        value: make([]syscall.Iovec, count)
      - set: r.names
        value: make([]syscall.RawSockaddrAny, count)
      - set: r.oob
        value: make([]byte, count*r.controlSpace)
      - loop:
          do:
            - set: r.iovecs[i].Base
              value: "&slots[i].buf[0]"
            - eval: setKernelLen(&r.iovecs[i].Len, len(slots[i].buf))
              to: setKernelLen
            - set: r.headers[i].hdr.Name
              value: (*byte)(unsafe.Pointer(&r.names[i]))
            - set: r.headers[i].hdr.Iov
              value: "&r.iovecs[i]"
            - eval: setKernelLen(&r.headers[i].hdr.Iovlen, 1)
              to: setKernelLen
            - opt:
                do:
                  - set: r.headers[i].hdr.Control
                    value: "&r.oob[i*r.controlSpace]"
                when: r.controlSpace > 0
          key: i
          range: slots
      - eval: r.bind()
        to: r.bind
      - set: r.wired
        value: count
      - eval: r.prepare()
        to: r.prepare
  - of: (*multiReader).bind
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).bind
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - opt:
          do:
            - return: ""
          when: r.recv != nil
      - set: r.recv
        value:
          closure:
            params: fd uintptr
            results: bool
            steps:
              - bind: result, _, callErrno
                eval: |-
                  syscall.Syscall6(syscall.SYS_RECVMMSG, fd,
                  			uintptr(unsafe.Pointer(&r.headers[0])), uintptr(len(r.headers)),
                  			syscall.MSG_WAITFORONE, 0, 0)
                to: syscall
              - opt:
                  do:
                    - return: "false"
                  when: callErrno == syscall.EAGAIN
              - set: r.received, r.errno
                value: int(result), callErrno
              - return: "true"
      - set: r.drainOnce
        value:
          closure:
            params: fd uintptr
            steps:
              - bind: result, _, callErrno
                eval: |-
                  syscall.Syscall6(syscall.SYS_RECVMMSG, fd,
                  			uintptr(unsafe.Pointer(&r.headers[0])), uintptr(len(r.headers)),
                  			syscall.MSG_DONTWAIT, 0, 0)
                to: syscall
              - set: r.received, r.errno
                value: int(result), callErrno
  - of: (*multiReader).prepare
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).prepare
        kind: self
      - id: setKernelLen
        kind: internal
    steps:
      - loop:
          do:
            - set: r.headers[i].hdr.Namelen
              value: syscall.SizeofSockaddrAny
            - eval: setKernelLen(&r.headers[i].hdr.Controllen, r.controlSpace)
              to: setKernelLen
            - set: r.headers[i].hdr.Flags
              value: "0"
          key: i
          range: r.headers
  - of: (*multiReader).readBatch
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).readBatch
        kind: self
      - id: r.wire
        kind: internal
      - id: r.drain
        kind: internal
      - id: r.prepare
        kind: internal
      - id: r.raw.Read
        kind: value
      - id: r.fill
        kind: internal
    steps:
      - eval: r.wire(slots)
        to: r.wire
      - opt:
          do:
            - return: r.drain(slots)
              to: r.drain
          when: r.handing.Load()
      - eval: r.prepare()
        to: r.prepare
      - set: r.received, r.errno
        value: 0, 0
      - bind: ctrlErr
        eval: r.raw.Read(r.recv)
        to: r.raw.Read
      - bind: received, errno
        eval: r.received, r.errno
      - opt:
          do:
            - return: r.drain(slots)
              to: r.drain
          when: ctrlErr != nil && r.handing.Load() && errors.Is(ctrlErr, os.ErrDeadlineExceeded)
      - opt:
          do:
            - return: 0, ctrlErr
          when: ctrlErr != nil
      - opt:
          do:
            - return: 0, errno
          when: errno != 0
      - opt:
          do:
            - return: 0, stdnet.ErrClosed
          when: r.stopping.Load()
      - eval: r.fill(slots, received)
        to: r.fill
      - return: received, nil
  - of: (*multiReader).drain
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).drain
        kind: self
      - id: r.prepare
        kind: internal
      - id: r.raw.Control
        kind: value
      - id: swallowErr
        kind: internal
      - id: r.fill
        kind: internal
    steps:
      - eval: r.prepare()
        to: r.prepare
      - set: r.received, r.errno
        value: 0, 0
      - bind: ctrlErr
        eval: r.raw.Control(r.drainOnce)
        to: r.raw.Control
      - bind: received, errno
        eval: r.received, r.errno
      - opt:
          do:
            - return: 0, ctrlErr
          when: ctrlErr != nil
      - opt:
          do:
            - eval: swallowErr(r.setGRO(false))
              to: swallowErr
            - return: 0, stdnet.ErrClosed
          when: errno == syscall.EAGAIN
      - opt:
          do:
            - return: 0, errno
          when: errno != 0
      - opt:
          do:
            - return: 0, stdnet.ErrClosed
          when: r.stopping.Load()
      - eval: r.fill(slots, received)
        to: r.fill
      - return: received, nil
  - of: (*multiReader).fill
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).fill
        kind: self
      - id: groSegment
        kind: internal
      - id: sockaddrToAddr
        kind: internal
    steps:
      - loop:
          do:
            - bind: hdr
              eval: "&r.headers[i].hdr"
            - bind: slot
              eval: "&slots[i]"
            - set: slot.n
              value: int(r.headers[i].length)
            - set: slot.seg
              value: "0"
            - opt:
                do:
                  - bind: used
                    eval: min(int(hdr.Controllen), r.controlSpace)
                  - set: slot.seg
                    to: groSegment
                    value: "groSegment(r.oob[i*r.controlSpace : i*r.controlSpace+used])"
                when: r.controlSpace > 0
            - set: slot.cut
              value: r.gro && slot.seg == 0 && hdr.Flags&syscall.MSG_CTRUNC != 0
            - opt:
                do:
                  - set: slot.addr
                    value: nil
                  - continue: true
                when: slot.cut
            - set: slot.cut
              value: hdr.Flags&syscall.MSG_TRUNC != 0 && (r.gro || slot.seg > 0)
            - set: slot.addr
              to: sockaddrToAddr
              value: sockaddrToAddr(&r.names[i])
          key: i
          range: received
  - of: groSegment
    participants:
      - id: caller
        kind: actor
      - id: groSegment
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: header
        eval: syscall.CmsgLen(0)
        to: syscall
      - loop:
          cond: off+header <= len(control)
          do:
            - bind: cmsg
              eval: (*syscall.Cmsghdr)(unsafe.Pointer(&control[off]))
            - bind: length
              eval: int(cmsg.Len)
            - opt:
                do:
                  - return: "0"
                when: length < header || off+length > len(control)
            - opt:
                do:
                  - return: int(*(*int32)(unsafe.Pointer(&control[off+header])))
                when: cmsg.Level == syscall.IPPROTO_UDP && cmsg.Type == udpGRO && length >= header+groSegmentBytes
            - op: +=
              set: "off"
              to: syscall
              value: syscall.CmsgSpace(length - header)
          init: off := 0
      - return: "0"
  - of: gsoSegments
    steps:
      - bind: header
        eval: ipv4HeaderBytes
      - opt:
          do:
            - set: header
              value: ipv6HeaderBytes
          when: family == syscall.AF_INET6
      - opt:
          do:
            - return: "1"
          when: size <= 0
      - return: min(udpMaxSegments, (ipMaxLength-header-udpHeaderBytes)/size)
  - of: maxSegment
    steps:
      - opt:
          do:
            - return: ethernetMTU - ipv6HeaderBytes - udpHeaderBytes
          when: family == syscall.AF_INET6
      - return: ethernetMTU - ipv4HeaderBytes - udpHeaderBytes
  - of: (*pendingReply).addr
    steps:
      - opt:
          do:
            - bind: sa4
              eval: (*syscall.RawSockaddrInet4)(unsafe.Pointer(&e.name))
            - return: "&stdnet.UDPAddr{IP: stdnet.IPv4(sa4.Addr[0], sa4.Addr[1], sa4.Addr[2], sa4.Addr[3]), Port: hostPort(sa4.Port)}"
          when: e.name.Family == syscall.AF_INET
      - bind: ip
        eval: make(stdnet.IP, stdnet.IPv6len)
      - eval: copy(ip, e.name.Addr[:])
      - return: "&stdnet.UDPAddr{IP: ip, Port: hostPort(e.name.Port)}"
  - of: newMultiWriter
    participants:
      - id: caller
        kind: actor
      - id: newMultiWriter
        kind: self
      - id: sc.SyscallConn
        kind: internal
      - id: raw.Control
        kind: value
      - id: w.gso.Store
        kind: value
    steps:
      - bind: raw, rerr
        eval: sc.SyscallConn()
        to: sc.SyscallConn
      - opt:
          do:
            - return: nil, rerr
          when: rerr != nil
      - var:
          name: family
          type: int
      - var:
          name: gso
          type: bool
      - var:
          name: serr
          type: error
      - bind: cerr
        eval: |-
          raw.Control(func(fd uintptr) {
          		sa, err := syscall.Getsockname(int(fd))
          		serr = err
          		//: the family decides the sockaddr every reply is written with.
          		switch sa.(type) {
          		//: IPv4.
          		case *syscall.SockaddrInet4:
          			family = syscall.AF_INET
          		//: IPv6, IPv4-mapped peers included.
          		case *syscall.SockaddrInet6:
          			family = syscall.AF_INET6
          		}
          		_, gerr := syscall.GetsockoptInt(int(fd), syscall.IPPROTO_UDP, udpSegment)
          		gso = gerr == nil
          	})
        to: raw.Control
      - opt:
          do:
            - return: nil, cmp.Or(cerr, serr)
          when: cerr != nil || serr != nil
      - opt:
          do:
            - return: nil, syscall.EAFNOSUPPORT
          when: family == 0
      - bind: w
        eval: |-
          &multiWriter{
          		pc: pc, raw: raw, family: family, counters: counters, onGSOOff: onGSOOff, send: sendmmsg,
          		arena: make([]byte, replyArena), queue: make([]pendingReply, 0, replyQueue),
          		headers: make([]mmsghdr, replyQueue), iovecs: make([]syscall.Iovec, replyQueue),
          		spans: make([]replySpan, replyQueue), controlSpace: syscall.CmsgSpace(segmentSizeBytes),
          	}
      - set: w.oob
        value: make([]byte, replyQueue*w.controlSpace)
      - eval: w.gso.Store(gso)
        to: w.gso.Store
      - set: w.write
        value:
          closure:
            params: fd uintptr
            results: bool
            steps:
              - set: w.sent, w.sendErrno
                value: w.send(fd, w.headers[w.from:w.to])
              - return: w.sendErrno != syscall.EAGAIN
      - return: w, nil
  - of: sendmmsg
    participants:
      - id: caller
        kind: actor
      - id: sendmmsg
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: result, _, callErrno
        eval: |-
          syscall.Syscall6(sysSendmmsg, fd,
          		uintptr(unsafe.Pointer(&headers[0])), uintptr(len(headers)), 0, 0, 0)
        to: syscall
      - opt:
          do:
            - return: 0, callErrno
          when: callErrno != 0
      - return: int(result), 0
  - of: (*multiWriter).begin
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).begin
        kind: self
      - id: w.mu.Lock
        kind: value
      - id: w.mu.Unlock
        kind: value
    steps:
      - eval: w.mu.Lock()
        to: w.mu.Lock
      - set: w.open
        value: "true"
      - eval: w.mu.Unlock()
        to: w.mu.Unlock
  - of: (*multiWriter).reply
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).reply
        kind: self
      - id: w.mu.Lock
        kind: value
      - id: w.mu.Unlock
        kind: value
      - id: w.pc.WriteTo
        kind: value
      - id: w.flushLocked
        kind: internal
    steps:
      - eval: w.mu.Lock()
        to: w.mu.Lock
      - var:
          name: entry
          type: pendingReply
      - opt:
          do:
            - eval: w.mu.Unlock()
              to: w.mu.Unlock
            - return: w.pc.WriteTo(b, to)
              to: w.pc.WriteTo
          when: "!w.open || len(b) > len(w.arena) || !w.encode(to, &entry)"
      - opt:
          do:
            - eval: w.flushLocked()
              to: w.flushLocked
          when: len(w.queue) == cap(w.queue) || w.used+len(b) > len(w.arena)
      - set: entry.off, entry.size
        value: w.used, len(b)
      - eval: copy(w.arena[w.used:], b)
      - op: +=
        set: w.used
        value: len(b)
      - set: w.queue
        value: append(w.queue, entry)
      - eval: w.mu.Unlock()
        to: w.mu.Unlock
      - return: len(b), nil
  - of: (*multiWriter).encode
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).encode
        kind: self
      - id: udp.IP.To16
        kind: value
      - id: udp.IP.To4
        kind: value
    steps:
      - bind: udp, ok
        eval: to.(*stdnet.UDPAddr)
      - opt:
          do:
            - return: "false"
          when: "!ok || udp == nil || udp.Zone != \"\""
      - bind: port
        eval: (*[2]byte)(unsafe.Pointer(&entry.name.Port))
      - set: port[0], port[1]
        value: byte(udp.Port>>portByteShift), byte(udp.Port)
      - opt:
          do:
            - bind: ip
              eval: udp.IP.To16()
              to: udp.IP.To16
            - opt:
                do:
                  - return: "false"
                when: ip == nil
            - set: entry.name.Family
              value: syscall.AF_INET6
            - eval: copy(entry.name.Addr[:], ip)
            - set: entry.namelen
              value: syscall.SizeofSockaddrInet6
            - return: "true"
          when: w.family == syscall.AF_INET6
      - bind: ip
        eval: udp.IP.To4()
        to: udp.IP.To4
      - opt:
          do:
            - return: "false"
          when: ip == nil
      - bind: sa4
        eval: (*syscall.RawSockaddrInet4)(unsafe.Pointer(&entry.name))
      - set: sa4.Family
        value: syscall.AF_INET
      - eval: copy(sa4.Addr[:], ip)
      - set: entry.namelen
        value: syscall.SizeofSockaddrInet4
      - return: "true"
  - of: (*multiWriter).flush
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).flush
        kind: self
      - id: w.mu.Lock
        kind: value
      - id: w.flushLocked
        kind: internal
      - id: w.mu.Unlock
        kind: value
    steps:
      - eval: w.mu.Lock()
        to: w.mu.Lock
      - eval: w.flushLocked()
        to: w.flushLocked
      - set: w.open
        value: "false"
      - eval: w.mu.Unlock()
        to: w.mu.Unlock
  - of: (*multiWriter).flushLocked
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).flushLocked
        kind: self
      - id: w.writeEach
        kind: internal
      - id: w.sendAll
        kind: internal
    steps:
      - opt:
          do:
            - eval: w.writeEach(0, len(w.queue))
              to: w.writeEach
          when: w.noMmsg
      - loop:
          cond: start < len(w.queue) && !w.noMmsg
          do:
            - set: start
              to: w.sendAll
              value: w.sendAll(w.build(start))
          init: start := 0
      - set: w.queue
        value: w.queue[:0]
      - set: w.used
        value: "0"
      - set: w.plainUntil
        value: "0"
  - of: (*multiWriter).build
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).build
        kind: self
      - id: w.gso.Load
        kind: value
      - id: maxSegment
        kind: internal
      - id: w.runFrom
        kind: internal
      - id: w.layout
        kind: internal
    steps:
      - bind: gso
        eval: w.gso.Load()
        to: w.gso.Load
      - bind: limitSize
        eval: maxSegment(w.family)
        to: maxSegment
      - opt:
          do:
            - set: limitSize
              value: min(limitSize, w.segmentCeiling)
          when: w.segmentCeiling > 0
      - bind: messages
        eval: "0"
      - loop:
          cond: e < len(w.queue)
          do:
            - bind: first
              eval: "&w.queue[e]"
            - bind: run
              eval: "1"
            - opt:
                do:
                  - set: run
                    to: w.runFrom
                    value: w.runFrom(e)
                when: gso && e >= w.plainUntil && first.size > 0 && first.size <= limitSize
            - bind: last
              eval: "&w.queue[e+run-1]"
            - eval: w.layout(messages, e, run, last.off+last.size-first.off)
              to: w.layout
            - op: +=
              set: e
              value: run
          init: e := start
          post: messages++
      - return: messages
  - of: (*multiWriter).runFrom
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).runFrom
        kind: self
      - id: gsoSegments
        kind: internal
    steps:
      - bind: first
        eval: "&w.queue[e]"
      - bind: limit
        eval: gsoSegments(w.family, first.size)
        to: gsoSegments
      - bind: run
        eval: "1"
      - loop:
          cond: run < limit && e+run < len(w.queue)
          do:
            - bind: next
              eval: "&w.queue[e+run]"
            - opt:
                do:
                  - break: true
                when: next.name != first.name || next.namelen != first.namelen || next.size > first.size || next.size == 0
            - op: ++
              set: run
            - opt:
                do:
                  - break: true
                when: next.size < first.size
      - return: run
  - of: (*multiWriter).layout
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).layout
        kind: self
      - id: setKernelLen
        kind: internal
      - id: cmsg.SetLen
        kind: value
    steps:
      - bind: entry
        eval: "&w.queue[first]"
      - bind: hdr
        eval: "&w.headers[m].hdr"
      - set: hdr.Name
        value: (*byte)(unsafe.Pointer(&entry.name))
      - set: hdr.Namelen
        value: entry.namelen
      - set: w.iovecs[m].Base
        value: "&w.arena[min(entry.off, len(w.arena)-1)]"
      - eval: setKernelLen(&w.iovecs[m].Len, total)
        to: setKernelLen
      - set: hdr.Iov
        value: "&w.iovecs[m]"
      - eval: setKernelLen(&hdr.Iovlen, 1)
        to: setKernelLen
      - set: hdr.Flags
        value: "0"
      - set: w.spans[m]
        value: "replySpan{first: first, count: count}"
      - opt:
          do:
            - set: hdr.Control
              value: nil
            - eval: setKernelLen(&hdr.Controllen, 0)
              to: setKernelLen
            - return: ""
          when: count == 1
      - bind: control
        eval: "w.oob[m*w.controlSpace : (m+1)*w.controlSpace]"
      - bind: cmsg
        eval: (*syscall.Cmsghdr)(unsafe.Pointer(&control[0]))
      - set: cmsg.Level
        value: syscall.IPPROTO_UDP
      - set: cmsg.Type
        value: udpSegment
      - eval: cmsg.SetLen(syscall.CmsgLen(segmentSizeBytes))
        to: cmsg.SetLen
      - set: "*(*uint16)(unsafe.Pointer(&control[syscall.CmsgLen(0)]))"
        value: uint16(entry.size)
      - set: hdr.Control
        value: "&control[0]"
      - eval: setKernelLen(&hdr.Controllen, w.controlSpace)
        to: setKernelLen
  - of: (*multiWriter).sendAll
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).sendAll
        kind: self
      - id: w.sendFrom
        kind: internal
      - id: w.fail
        kind: internal
      - id: w.left
        kind: internal
      - id: w.refused
        kind: internal
    steps:
      - loop:
          cond: k < messages
          do:
            - bind: sent, err
              eval: w.sendFrom(k, messages)
              to: w.sendFrom
            - bind: errno, refused
              eval: err.(syscall.Errno)
            - opt:
                do:
                  - eval: w.fail(k, messages)
                    to: w.fail
                  - return: len(w.queue)
                when: err != nil && !refused
            - opt:
                do:
                  - eval: w.left(k, k+sent)
                    to: w.left
                  - op: +=
                    set: k
                    value: sent
                  - continue: true
                when: err == nil && sent > 0
            - opt:
                do:
                  - return: resume
                init:
                  bind: resume, again
                  eval: w.refused(k, messages, errno)
                  to: w.refused
                when: again
            - op: ++
              set: k
          init: k := 0
      - return: len(w.queue)
  - of: (*multiWriter).refused
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).refused
        kind: self
      - id: w.unavailable
        kind: internal
      - id: w.gsoRefused
        kind: internal
      - id: w.counters.replyFailures.Add
        kind: value
    steps:
      - bind: span
        eval: w.spans[k]
      - switch:
          cases:
            - case: errno == syscall.ENOSYS || errno == syscall.EPERM
              do:
                - eval: w.unavailable(k, messages)
                  to: w.unavailable
                - return: len(w.queue), true
            - case: span.count > 1
              do:
                - return: w.gsoRefused(span, errno)
                  to: w.gsoRefused
            - default: true
              do:
                - eval: w.counters.replyFailures.Add(uint64(span.count))
                  to: w.counters.replyFailures.Add
                - return: 0, false
  - of: (*multiWriter).gsoRefused
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).gsoRefused
        kind: self
      - id: w.disableGSO
        kind: internal
      - id: w.counters.gsoOversized.Add
        kind: value
      - id: w.counters.replyFailures.Add
        kind: value
    steps:
      - switch:
          cases:
            - case: syscall.EIO
              do:
                - eval: w.disableGSO()
                  to: w.disableGSO
                - return: span.first, true
            - case: syscall.EINVAL
              do:
                - set: w.plainUntil
                  value: span.first + span.count
                - set: w.segmentCeiling
                  value: w.queue[span.first].size - 1
                - op: ++
                  set: w.invalidRun
                - opt:
                    do:
                      - eval: w.disableGSO()
                        to: w.disableGSO
                    when: w.invalidRun >= gsoInvalidLimit
                - return: span.first, true
            - case: syscall.EMSGSIZE
              do:
                - eval: w.counters.gsoOversized.Add(1)
                  to: w.counters.gsoOversized.Add
                - eval: w.counters.replyFailures.Add(uint64(span.count))
                  to: w.counters.replyFailures.Add
            - default: true
              do:
                - eval: w.counters.replyFailures.Add(uint64(span.count))
                  to: w.counters.replyFailures.Add
          "on": errno
      - return: 0, false
  - of: (*multiWriter).sendFrom
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).sendFrom
        kind: self
      - id: w.raw.Write
        kind: value
    steps:
      - set: w.from, w.to, w.sent, w.sendErrno
        value: k, messages, 0, 0
      - bind: cerr
        eval: w.raw.Write(w.write)
        to: w.raw.Write
      - opt:
          do:
            - return: 0, cerr
          when: cerr != nil
      - opt:
          do:
            - return: 0, w.sendErrno
          when: w.sendErrno != 0
      - return: w.sent, nil
  - of: (*multiWriter).unavailable
    steps:
      - bind: first
        eval: w.spans[k].first
      - bind: last
        eval: w.spans[messages-1].first + w.spans[messages-1].count
      - opt:
          do:
            - set: w.noMmsg
              value: "true"
          when: w.writeEach(first, last) > 0
  - of: (*multiWriter).writeEach
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).writeEach
        kind: self
      - id: w.pc.WriteTo
        kind: value
      - id: w.counters.replyFailures.Add
        kind: value
    steps:
      - bind: left
        eval: "0"
      - loop:
          cond: i < last
          do:
            - bind: entry
              eval: "&w.queue[i]"
            - opt:
                do:
                  - eval: w.counters.replyFailures.Add(1)
                    to: w.counters.replyFailures.Add
                  - continue: true
                init:
                  bind: _, err
                  eval: w.pc.WriteTo(w.arena[entry.off:entry.off+entry.size], entry.addr())
                  to: w.pc.WriteTo
                when: err != nil
            - op: ++
              set: left
          init: i := first
          post: i++
      - return: left
  - of: (*multiWriter).fail
    participants:
      - id: caller
        kind: actor
      - id: (*multiWriter).fail
        kind: self
      - id: w.counters.replyFailures.Add
        kind: value
    steps:
      - loop:
          cond: k < messages
          do:
            - eval: w.counters.replyFailures.Add(uint64(w.spans[k].count))
              to: w.counters.replyFailures.Add
          post: k++
  - of: (*multiWriter).disableGSO
    steps:
      - opt:
          do:
            - eval: w.onGSOOff()
          when: w.gso.Swap(false) && w.onGSOOff != nil
  - of: readOperator
    participants:
      - id: caller
        kind: actor
      - id: readOperator
        kind: self
      - id: strings
        kind: stdlib
      - id: env.applyEngine
        kind: internal
      - id: env.applyDisable
        kind: internal
      - id: env.applied
        kind: internal
    steps:
      - bind: env
        eval: "operatorEnv{ceiling: rankIOURing}"
      - var:
          name: raw
          type: "[]string"
      - bind: engine, _
        eval: lookup(corenet.EnvEngine)
      - opt:
          do:
            - set: raw
              value: append(raw, corenet.EnvEngine+"="+engine)
            - eval: env.applyEngine(engine)
              to: env.applyEngine
          init:
            bind: engine
            eval: strings.TrimSpace(engine)
            op: =
            to: strings
          when: engine != ""
      - bind: disable, _
        eval: lookup(corenet.EnvDisable)
      - opt:
          do:
            - set: raw
              value: append(raw, corenet.EnvDisable+"="+disable)
            - eval: env.applyDisable(disable)
              to: env.applyDisable
          init:
            bind: disable
            eval: strings.TrimSpace(disable)
            op: =
            to: strings
          when: disable != ""
      - opt:
          do:
            - return: env
          when: len(raw) == 0
      - set: env.override.Source
        value: sourceEnvironment
      - set: env.override.Raw
        to: strings
        value: strings.Join(raw, " ")
      - set: env.override.Applied
        to: env.applied
        value: env.applied()
      - return: env
  - of: (*operatorEnv).applyEngine
    participants:
      - id: caller
        kind: actor
      - id: (*operatorEnv).applyEngine
        kind: self
      - id: lookupCapability
        kind: internal
      - id: e.unknown
        kind: internal
    steps:
      - bind: entry, ok
        eval: lookupCapability(token)
        to: lookupCapability
      - opt:
          do:
            - eval: e.unknown(corenet.EnvEngine, token)
              to: e.unknown
            - return: ""
          when: "!ok || entry.kernel"
      - set: e.ceiling
        value: min(e.ceiling, entry.rank)
  - of: (*operatorEnv).applyDisable
    participants:
      - id: caller
        kind: actor
      - id: (*operatorEnv).applyDisable
        kind: self
      - id: strings
        kind: stdlib
      - id: lookupCapability
        kind: internal
      - id: e.unknown
        kind: internal
    steps:
      - loop:
          do:
            - bind: token
              eval: strings.TrimSpace(item)
              to: strings
            - opt:
                do:
                  - continue: true
                when: token == ""
            - bind: entry, ok
              eval: lookupCapability(token)
              to: lookupCapability
            - opt:
                do:
                  - eval: e.unknown(corenet.EnvDisable, token)
                    to: e.unknown
                  - continue: true
                when: "!ok || !entry.switchable"
            - opt:
                do:
                  - opt:
                      do:
                        - set: e.kernelOff
                          value: append(e.kernelOff, entry.token)
                        - set: e.override.Disabled
                          value: append(e.override.Disabled, entry.token)
                      when: "!slices.Contains(e.kernelOff, entry.token)"
                  - continue: true
                when: entry.kernel
            - opt:
                do:
                  - set: e.disabled[entry.rank]
                    value: "true"
                  - set: e.override.Disabled
                    value: append(e.override.Disabled, entry.token)
                when: "!e.disabled[entry.rank]"
          key: item
          range: strings.SplitSeq(list, ",")
  - of: (*operatorEnv).unknown
    steps:
      - set: e.ceiling
        value: min(e.ceiling, rankPortable)
      - set: e.noOptional
        value: "true"
      - set: e.faults
        value: |-
          append(e.faults, corenet.FaultValue{
          		Source: faultEnvironment,
          		Reason: variable + ": unknown token " + strconv.Quote(token) + ": engines capped at portable",
          	})
  - of: (*operatorEnv).allows
    steps:
      - opt:
          do:
            - return: "false"
          when: r == rankIOURing && e.kernelDisabled(corenet.CapabilityURingPbuf)
      - return: r <= e.ceiling && !e.disabled[r]
  - of: (*operatorEnv).kernelDisabled
    steps:
      - return: e.noOptional || slices.Contains(e.kernelOff, c)
  - of: (*operatorEnv).kernelSwitches
    steps:
      - opt:
          do:
            - var:
                name: all
                type: "[]corenet.Capability"
            - loop:
                do:
                  - opt:
                      do:
                        - set: all
                          value: append(all, entry.token)
                      when: entry.kernel
                key: _
                range: capabilityRegistry
                value: entry
            - return: all, unknownDisables
          when: e.noOptional
      - return: e.kernelOff, corenet.EnvDisable
  - of: (*operatorEnv).plan
    participants:
      - id: caller
        kind: actor
      - id: (*operatorEnv).plan
        kind: self
      - id: e.backendPlan
        kind: internal
      - id: e.kernelSwitches
        kind: internal
    steps:
      - bind: p
        eval: e.backendPlan(code, native)
        to: e.backendPlan
      - set: p.disabled, p.disabledBy
        to: e.kernelSwitches
        value: e.kernelSwitches()
      - return: p
  - of: (*operatorEnv).backendPlan
    participants:
      - id: caller
        kind: actor
      - id: (*operatorEnv).backendPlan
        kind: self
      - id: e.allows
        kind: internal
    steps:
      - opt:
          do:
            - return: "loopPlan{backend: corenet.LoopBackendPortable}"
          when: "!native || code == corenet.LoopBackendPortable"
      - bind: iouring
        eval: code != corenet.LoopBackendEpoll && e.allows(rankIOURing)
      - bind: epoll
        eval: e.allows(rankEpoll)
        to: e.allows
      - bind: auto
        eval: code == corenet.LoopBackendAuto
      - switch:
          cases:
            - case: auto && iouring && epoll
              do:
                - return: "loopPlan{backend: corenet.LoopBackendAuto, fallback: true}"
            - case: iouring
              do:
                - return: "loopPlan{backend: corenet.LoopBackendIOURing, fallback: auto}"
            - case: epoll
              do:
                - return: "loopPlan{backend: corenet.LoopBackendEpoll, fallback: auto}"
            - default: true
              do:
                - return: "loopPlan{backend: corenet.LoopBackendPortable}"
  - of: (*optionSet).add
    steps:
      - op: "|="
        set: "*s"
        value: 1 << k
  - of: (*optionSet).has
    steps:
      - return: "*s&(1<<k) != 0"
  - of: (*optionSet).list
    steps:
      - bind: out
        eval: make([]corenet.OptionKind, 0, bits.OnesCount64(uint64(*s)))
      - loop:
          cond: rest != 0
          do:
            - set: out
              value: append(out, corenet.OptionKind(bits.TrailingZeros64(rest)))
          init: rest := uint64(*s)
          post: rest &= rest - 1
      - return: out
  - of: WithDrainTimeout
    steps:
      - return:
          closure:
            params: s *Server
            steps:
              - set: s.drainTimeout
                value: d
  - of: Loop
    steps:
      - return:
          closure:
            params: g *StreamGroup
            steps:
              - set: g.loop
                value: v
              - set: g.loopSet
                value: "true"
  - of: Listen
    steps:
      - return:
          closure:
            params: g *StreamGroup
            steps:
              - set: g.addrs
                value: "append(g.addrs, corenet.AddressValue{Network: network, Addr: addr})"
  - of: TLS
    participants:
      - id: caller
        kind: actor
      - id: TLS
        kind: self
      - id: g.kinds.add
        kind: internal
    steps:
      - return:
          closure:
            params: g *StreamGroup
            steps:
              - set: g.identity
                value: id
              - eval: g.kinds.add(corenet.OptionTLS)
                to: g.kinds.add
  - of: ReadTimeout
    participants:
      - id: caller
        kind: actor
      - id: ReadTimeout
        kind: self
      - id: corenet
        kind: package
      - id: g.kinds.add
        kind: internal
    steps:
      - return:
          closure:
            params: g *StreamGroup
            steps:
              - set: g.timeouts.Read
                to: corenet
                value: corenet.DurationValue(d)
              - eval: g.kinds.add(corenet.OptionReadTimeout)
                to: g.kinds.add
  - of: WriteTimeout
    participants:
      - id: caller
        kind: actor
      - id: WriteTimeout
        kind: self
      - id: corenet
        kind: package
      - id: g.kinds.add
        kind: internal
    steps:
      - return:
          closure:
            params: g *StreamGroup
            steps:
              - set: g.timeouts.Write
                to: corenet
                value: corenet.DurationValue(d)
              - eval: g.kinds.add(corenet.OptionWriteTimeout)
                to: g.kinds.add
  - of: IdleTimeout
    participants:
      - id: caller
        kind: actor
      - id: IdleTimeout
        kind: self
      - id: corenet
        kind: package
      - id: g.kinds.add
        kind: internal
    steps:
      - return:
          closure:
            params: g *StreamGroup
            steps:
              - set: g.timeouts.Idle
                to: corenet
                value: corenet.DurationValue(d)
              - eval: g.kinds.add(corenet.OptionIdleTimeout)
                to: g.kinds.add
  - of: ReadHeaderTimeout
    participants:
      - id: caller
        kind: actor
      - id: ReadHeaderTimeout
        kind: self
      - id: g.kinds.add
        kind: internal
    steps:
      - return:
          closure:
