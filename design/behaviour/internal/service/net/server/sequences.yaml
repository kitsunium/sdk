          cases:
            - case: corenet.PhaseServing
            - case: corenet.PhaseNew, corenet.PhaseStarting
              do:
                - return: errs.Wrap(corenet.NotStarted, errs.WrapParams{}, errs.String("phase", st.Phase.String()))
