      - bind: k
        eval: admissionKey(remote)
        to: admissionKey
      - eval: a.mu.Lock()
        to: a.mu.Lock
      - bind: limit
        eval: a.cfg.PerAddress
      - opt:
          do:
            - set: limit
              value: a.cfg.Reserved
          when: a.reserved[k]
      - opt:
          do:
            - eval: a.mu.Unlock()
              to: a.mu.Unlock
            - eval: a.refused.Add(1)
              to: a.refused.Add
            - return: func() {}, false
          when: a.pending[k] >= limit
      - op: ++
        set: a.pending[k]
      - eval: a.mu.Unlock()
        to: a.mu.Unlock
      - var:
          name: once
          type: sync.Once
