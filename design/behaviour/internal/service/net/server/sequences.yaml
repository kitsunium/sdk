        kind: value
      - id: bound.ln.Accept
        kind: value
      - id: s.acceptBackoffs.Add
        kind: value
      - id: group.admission.Admit
        kind: internal
      - id: swallowErr
        kind: internal
      - id: s.total.Add
        kind: value
      - id: s.active.Add
