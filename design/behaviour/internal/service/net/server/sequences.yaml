        to: g.valueRefusalBuffers
  - of: (*StreamGroup).valueRefusalProxy
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).valueRefusalProxy
        kind: self
      - id: parseProxyPolicy
        kind: internal
      - id: g.valueInvalid
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: "!g.kinds.has(corenet.OptionProxyProtocol)"
      - bind: policy, ok
        eval: parseProxyPolicy(g.proxyProtocol)
        to: parseProxyPolicy
      - opt:
          do:
            - return: g.valueInvalid(corenet.OptionProxyProtocol)
              to: g.valueInvalid
          when: "!ok"
      - loop:
          do:
            - opt:
                do:
                  - return: g.valueInvalid(corenet.OptionProxyProtocol)
                    to: g.valueInvalid
                when: "!strings.HasPrefix(addr.Network, \"tcp\")"
