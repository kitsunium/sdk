      - id: p.sink.reply
        kind: internal
      - id: p.conn.WriteTo
        kind: value
    steps:
      - opt:
          do:
            - return: 0, stdnet.ErrClosed
          when: p.conn == nil
      - opt:
          do:
            - return: p.sink.replyFrom(b, p.from, p.local)
              to: p.sink.replyFrom
          when: p.sink != nil && p.local.sourceLen != 0
      - opt:
          do:
            - return: p.sink.reply(b, p.from)
              to: p.sink.reply
          when: p.sink != nil
