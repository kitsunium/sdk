      - set: p.port
        value: "0"
  - of: (*Server).newBoundPacket
    participants:
      - id: caller
        kind: actor
      - id: (*Server).newBoundPacket
        kind: self
      - id: newDatagramSource
        kind: internal
      - id: s.probeKernelDrops
        kind: internal
      - id: s.probeDestination
        kind: internal
    steps:
      - bind: name
        eval: group.name
      - bind: source
        eval: newDatagramSource(pc, true)
        to: newDatagramSource
      - eval: s.probeKernelDrops(source)
        to: s.probeKernelDrops
      - bind: pinned
        eval: s.probeDestination(source, pc)
        to: s.probeDestination
      - return: |-
          &boundPacketConn{
          		group: name, addr: addr, pc: pc,
          		source: source,
          		sink:   newDatagramSink(pc, group.batchReplies || group.loopHandler != nil, pinned, &s.datagrams, func() { s.recordGSOOff(name) }),
          		done:   make(chan struct{}),
          	}
  - of: (*Server).handoverPackets
    participants:
      - id: caller
        kind: actor
      - id: (*Server).handoverPackets
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: slices
        kind: stdlib
      - id: s.mu.RUnlock
        kind: value
      - id: context
        kind: stdlib
      - id: bound.stopGRO
        kind: internal
    steps:
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: conns
        eval: slices.Clone(s.packetConns)
        to: slices
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - bind: draining
        eval: make([]*boundPacketConn, 0, len(conns))
      - loop:
          do:
            - opt:
                do:
                  - set: draining
                    value: append(draining, bound)
                when: bound.handover()
          key: _
          range: conns
          value: bound
      - bind: wait, cancel
        eval: context.WithTimeout(ctx, handoverBudget)
        to: context
      - defer: cancel()
      - loop:
          do:
            - select:
                cases:
                  - comm: <-bound.done
                  - comm: <-wait.Done()
                    do:
                      - eval: bound.stopGRO()
                        to: bound.stopGRO
          key: _
          range: draining
          value: bound
  - of: (*Server).recordGSOOff
    steps:
      - lock:
          mutex: s.gsoMu
      - opt:
          do:
            - set: s.gsoOff
              value: append(s.gsoOff, group)
          when: "!slices.Contains(s.gsoOff, group)"
  - of: (*Server).gsoFaults
    steps:
      - lock:
          mutex: s.gsoMu
      - var:
          name: out
          type: "[]corenet.FaultValue"
      - loop:
          do:
            - set: out
              value: |-
                append(out, corenet.FaultValue{
                			Source: faultGSO, Group: group,
                			Reason: "UDP GSO refused by the device (EIO: no checksum offload); replies leave one datagram a message",
                		})
          key: _
          range: s.gsoOff
          value: group
      - return: out
  - of: (*Server).stopGROPackets
    participants:
      - id: caller
        kind: actor
      - id: (*Server).stopGROPackets
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: slices
        kind: stdlib
      - id: s.mu.RUnlock
        kind: value
      - id: bound.stopGRO
        kind: internal
    steps:
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: conns
        eval: slices.Clone(s.packetConns)
        to: slices
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - loop:
          do:
            - eval: bound.stopGRO()
              to: bound.stopGRO
          key: _
          range: conns
          value: bound
  - of: (*PacketGroup).Name
    steps:
      - return: g.name
  - of: (*PacketGroup).Handle
    steps:
      - set: g.handler
        value: h
      - return: g
  - of: (*PacketGroup).HandleFunc
    participants:
      - id: caller
        kind: actor
      - id: (*PacketGroup).HandleFunc
        kind: self
      - id: g.Handle
        kind: internal
    steps:
      - return: g.Handle(f)
        to: g.Handle
  - of: (*PacketGroup).HandleLoop
    steps:
      - set: g.loopHandler
        value: h
      - return: g
  - of: (*PacketGroup).Use
    steps:
      - set: g.middlewares
        value: append(g.middlewares, middlewares...)
      - return: g
  - of: (*PacketGroup).resolved
    participants:
      - id: caller
        kind: actor
      - id: (*PacketGroup).resolved
        kind: self
      - id: corenet
        kind: package
    steps:
      - return: corenet.Chain(g.handler, g.middlewares...)
        to: corenet
  - of: packetLoopRefusal
    participants:
      - id: caller
        kind: actor
      - id: packetLoopRefusal
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: nil
          when: group.loopHandler == nil
      - opt:
          do:
            - return: errs.Wrap(corenet.HandlerAlreadySet, errs.WrapParams{}, errs.String("group", group.name))
              to: errs
          when: group.handler != nil
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.LoopOptionUnsupported, errs.WrapParams{},
                			errs.String("group", group.name), errs.String("option", corenet.OptionMiddleware.String()))
              to: errs
          when: len(group.middlewares) > 0
      - loop:
          do:
            - opt:
                do:
                  - return: |-
                      errs.Wrap(corenet.LoopOptionUnsupported, errs.WrapParams{},
                      				errs.String("group", group.name), errs.String("network", networkUnixgram))
                    to: errs
                when: addr.Network == networkUnixgram
          key: _
          range: group.addrs
          value: addr
      - return: nil
  - of: (*Server).startReader
    participants:
      - id: caller
        kind: actor
      - id: (*Server).startReader
        kind: self
      - id: s.inFlight.Add
        kind: value
      - id: s.readLoop
        kind: internal
    steps:
      - opt:
          do:
            - set: bound.laneIndex
              value: len(group.lanes)
            - set: group.lanes
              value: append(group.lanes, bound)
            - return: ""
          when: group.loopHandler != nil
      - eval: s.inFlight.Add(1)
        to: s.inFlight.Add
      - go: s.readLoop(bound, group, handler)
        to: s.readLoop
  - of: (*Server).startPacketLanes
    participants:
      - id: caller
        kind: actor
      - id: (*Server).startPacketLanes
        kind: self
      - id: st.OnStart
        kind: value
      - id: s.laneAllowed
        kind: internal
      - id: s.inFlight.Add
        kind: value
      - id: s.readLoop
        kind: internal
    steps:
      - opt:
          do:
            - eval: st.OnStart(len(group.lanes))
              to: st.OnStart
          init:
            bind: st, ok
            eval: group.loopHandler.(corenet.LoopStarter)
          when: ok
      - bind: try
        eval: s.laneAllowed()
        to: s.laneAllowed
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: try && s.startURingLane(bound, group)
            - eval: s.inFlight.Add(1)
              to: s.inFlight.Add
            - go: s.readLoop(bound, group, nil)
              to: s.readLoop
          key: _
          range: group.lanes
          value: bound
  - of: (*Server).startURingLane
    participants:
      - id: caller
        kind: actor
      - id: (*Server).startURingLane
        kind: self
      - id: laneReason
        kind: internal
      - id: s.inFlight.Add
        kind: value
      - id: s.awaitLane
        kind: internal
    steps:
      - bind: lane, err
        eval: s.startLane(s, bound, group)
      - lock:
          mutex: s.lanes.mu
      - op: ++
        set: s.lanes.tried
      - opt:
          do:
            - opt:
                do:
                  - set: s.lanes.why, s.lanes.platform
                    to: laneReason
                    value: laneReason(err)
                when: s.lanes.why == ""
            - return: "false"
          when: err != nil
      - op: ++
        set: s.lanes.on
      - set: bound.lane
        value: lane
      - eval: s.inFlight.Add(1)
        to: s.inFlight.Add
      - go: s.awaitLane(bound, lane)
        to: s.awaitLane
      - return: "true"
  - of: (*Server).awaitLane
    participants:
      - id: caller
        kind: actor
      - id: (*Server).awaitLane
        kind: self
      - id: s.inFlight.Done
        kind: value
      - id: lane.Done
        kind: value
      - id: bound.finish
        kind: internal
    steps:
      - defer: s.inFlight.Done()
        to: s.inFlight.Done
      - eval: <-lane.Done()
        to: lane.Done
      - eval: bound.finish()
        to: bound.finish
  - of: (*Server).laneAllowed
    participants:
      - id: caller
        kind: actor
      - id: (*Server).laneAllowed
        kind: self
      - id: s.lanes.mu.Lock
        kind: value
      - id: s.lanes.mu.Unlock
        kind: value
    steps:
      - opt:
          do:
            - eval: s.lanes.mu.Lock()
              to: s.lanes.mu.Lock
            - set: s.lanes.disabled
              value: "true"
            - eval: s.lanes.mu.Unlock()
              to: s.lanes.mu.Unlock
            - return: "false"
          when: s.operator.kernelDisabled(corenet.CapabilityURingRecvmsg) || !s.operator.allows(corenet.CapabilityIOURing)
      - return: "true"
  - of: laneReason
    participants:
      - id: caller
        kind: actor
      - id: laneReason
        kind: self
      - id: err.Error
        kind: value
      - id: f.StringValue
        kind: value
    steps:
      - bind: e, ok
        eval: errors.AsType[*errs.Error](err)
      - opt:
          do:
            - return: err.Error(), false
              to: err.Error
          when: "!ok"
      - leaf: a var of several names, or of no type
        stmt: var stage, reason string
      - loop:
          do:
            - switch:
                cases:
                  - case: "\"stage\""
                    do:
                      - set: stage
                        to: f.StringValue
                        value: f.StringValue()
                  - case: "\"reason\""
                    do:
                      - set: reason
                        to: f.StringValue
                        value: f.StringValue()
                "on": f.Key()
          key: _
          range: e.Fields()
          value: f
      - return: "stage + \": \" + reason, stage == \"arch\""
  - of: (*Server).laneCapability
    participants:
      - id: caller
        kind: actor
      - id: (*Server).laneCapability
        kind: self
      - id: s.operator.kernelSwitches
        kind: internal
    steps:
      - bind: row
        eval: "corenet.CapabilityValue{Name: corenet.CapabilityURingRecvmsg, Class: classKernel}"
      - lock:
          mutex: s.lanes.mu
      - switch:
          cases:
            - case: s.lanes.disabled
              do:
                - set: _, row.Reason
                  to: s.operator.kernelSwitches
                  value: s.operator.kernelSwitches()
                - set: row.Status
                  value: statusDisabled
            - case: s.lanes.tried == 0
              do:
                - return: nil
            - case: s.lanes.on == s.lanes.tried
              do:
                - set: row.Status
                  value: statusOn
            - case: s.lanes.platform
              do:
                - set: row.Status, row.Reason
                  value: statusUnprobed, s.lanes.why
            - default: true
              do:
                - set: row.Status, row.Reason
                  value: statusAbsent, s.lanes.why
      - return: "[]corenet.CapabilityValue{row}"
  - of: startPacketLane
    participants:
      - id: caller
        kind: actor
      - id: startPacketLane
        kind: self
      - id: dupPacketFD
        kind: internal
      - id: loop
        kind: package
    steps:
      - bind: fd, err
        eval: dupPacketFD(bound)
        to: dupPacketFD
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - bind: name
        eval: group.name
      - bind: lane, err
        eval: |-
          loop.StartPacket(&loop.PacketConfig{
          		Group: name, FD: fd, Lane: bound.laneIndex, Ceiling: packetSize(group.limits), Handler: group.loopHandler,
          		Counters: loop.PacketCountersValue{
          			Total: &s.total, Oversized: &s.oversized, Truncated: &s.datagrams.truncated,
          			ReplyFailures: &s.datagrams.replyFailures, GSOOversized: &s.datagrams.gsoOversized, KernelDrops: &s.datagrams.kernelDrops,
          		},
          		OnGSOOff: func() { s.recordGSOOff(name) },
          	})
        to: loop
      - opt:
          do:
            - return: nil, err
          when: err != nil
      - return: lane, nil
  - of: dupPacketFD
    participants:
      - id: caller
        kind: actor
      - id: dupPacketFD
        kind: self
      - id: packetSocket
        kind: internal
      - id: sc.SyscallConn
        kind: value
      - id: raw.Control
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - bind: sc
        eval: packetSocket(bound.pc)
        to: packetSocket
      - opt:
          do:
            - return: "-1, dupRefused(syscall.EBADF)"
          when: sc == nil
      - bind: raw, err
        eval: sc.SyscallConn()
        to: sc.SyscallConn
      - opt:
          do:
            - return: "-1, dupRefused(err)"
          when: err != nil
      - bind: fd
        eval: "-1"
      - var:
          name: derr
          type: error
      - bind: cerr
        eval: |-
          raw.Control(func(s uintptr) {
          		r, _, e := syscall.Syscall(syscall.SYS_FCNTL, s, syscall.F_DUPFD_CLOEXEC, 0)
          		//: refused.
          		if e != 0 {
          			derr = e
          			return
          		}
          		fd = int(r)
          		derr = syscall.SetNonblock(fd, true)
          	})
        to: raw.Control
      - opt:
          do:
            - opt:
                do:
                  - eval: swallowErr(syscall.Close(fd))
                    to: swallowErr
                when: fd >= 0
            - return: "-1, dupRefused(errors.Join(cerr, derr))"
          when: cerr != nil || derr != nil
      - return: fd, nil
  - of: dupRefused
    participants:
      - id: caller
        kind: actor
      - id: dupRefused
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(corenet.LoopBackendUnavailable, errs.WrapParams{},
          		errs.String("stage", "dup"), errs.String("reason", cause.Error()))
        to: errs
  - of: listenPacket
    participants:
      - id: caller
        kind: actor
      - id: listenPacket
        kind: self
      - id: familyUnavailable
        kind: internal
      - id: bindRetrying
        kind: internal
      - id: exclusiveOf
        kind: internal
      - id: socketBuffers
        kind: internal
    steps:
      - opt:
          do:
            - return: |-
                nil, rep, errs.Wrap(corenet.UnsupportedNetwork, errs.WrapParams{},
                			errs.String("network", addr.Network))
          init:
            bind: _, ok
            eval: packetNetworks[addr.Network]
          when: "!ok"
      - opt:
          do:
            - return: nil, rep, unavailable
          init:
            bind: unavailable
            eval: familyUnavailable(addr)
            to: familyUnavailable
          when: unavailable != nil
      - opt:
          do:
            - return: |-
                nil, rep, errs.Wrap(corenet.InvalidAddress, errs.WrapParams{},
                			errs.String("address", addr.String()))
          when: strings.TrimSpace(addr.Addr) == ""
      - bind: cfg
        eval: "stdnet.ListenConfig{Control: listenControl(spec.reuse != reuseNone, spec)}"
      - bind: bound, wait, lerr
        eval: |-
          bindRetrying(ctx, 1, addrInUse, func() (stdnet.PacketConn, error) {
          		//: one attempt.
          		return cfg.ListenPacket(ctx, addr.Network, addr.Addr)
          	})
        to: bindRetrying
      - set: rep.wait
        value: wait
      - opt:
          do:
            - return: nil, rep, bindRefusal(addr, lerr)
          when: lerr != nil
      - set: rep.shared
        value: spec.reuse == reuseShared
      - set: rep.exclusive
        to: exclusiveOf
        value: exclusiveOf(packetSocket(bound))
      - set: rep.receiveBuffer, rep.sendBuffer
        to: socketBuffers
        value: socketBuffers(packetSocket(bound))
      - return: bound, rep, nil
  - of: (*boundPacketConn).finish
    participants:
      - id: caller
        kind: actor
      - id: (*boundPacketConn).finish
        kind: self
      - id: b.doneOnce.Do
        kind: value
    steps:
      - eval: b.doneOnce.Do(func() { close(b.done) })
        to: b.doneOnce.Do
  - of: (*boundPacketConn).handover
    participants:
      - id: caller
        kind: actor
      - id: (*boundPacketConn).handover
        kind: self
      - id: b.lane.Handover
        kind: value
      - id: h.handover
        kind: internal
    steps:
      - opt:
          do:
            - eval: b.lane.Handover()
              to: b.lane.Handover
            - return: "true"
          when: b.lane != nil
      - bind: h, ok
        eval: b.source.(handoverSource)
      - opt:
          do:
            - return: "false"
          when: "!ok"
      - return: h.handover()
        to: h.handover
  - of: (*boundPacketConn).stopGRO
    participants:
      - id: caller
        kind: actor
      - id: (*boundPacketConn).stopGRO
        kind: self
      - id: b.lane.Stop
        kind: value
      - id: h.stopGRO
        kind: internal
    steps:
      - opt:
          do:
            - eval: b.lane.Stop()
              to: b.lane.Stop
          when: b.lane != nil
      - opt:
          do:
            - eval: h.stopGRO()
              to: h.stopGRO
          init:
            bind: h, ok
            eval: b.source.(handoverSource)
          when: ok
  - of: (*boundPacketConn).Close
    participants:
      - id: caller
        kind: actor
      - id: (*boundPacketConn).Close
        kind: self
      - id: b.lane.Stop
        kind: value
      - id: b.pc.Close
        kind: value
    steps:
      - opt:
          do:
            - eval: b.lane.Stop()
              to: b.lane.Stop
          when: b.lane != nil
      - return: b.pc.Close()
        to: b.pc.Close
  - of: packetSize
    steps:
      - opt:
          do:
            - return: defaultMaxPacketSize
          when: limits.MaxPacketSize <= 0
      - return: limits.MaxPacketSize
  - of: batchSize
    steps:
      - opt:
          do:
            - return: defaultBatchSize
          when: limits.BatchSize <= 0
      - return: limits.BatchSize
  - of: (*Server).readLoop
    participants:
      - id: caller
        kind: actor
      - id: (*Server).readLoop
        kind: self
      - id: s.inFlight.Done
        kind: value
      - id: bound.finish
        kind: internal
      - id: packetSize
        kind: internal
      - id: newSlots
        kind: internal
      - id: held.reset
        kind: internal
      - id: reader.readBatch
        kind: internal
      - id: bound.sink.begin
        kind: internal
      - id: s.dispatch
        kind: internal
      - id: s.dispatchLoop
        kind: internal
      - id: bound.sink.flush
        kind: internal
    steps:
      - defer: s.inFlight.Done()
        to: s.inFlight.Done
      - defer: bound.finish()
        to: bound.finish
      - bind: ceiling
        eval: packetSize(group.limits)
        to: packetSize
      - bind: reader
        eval: bound.source
      - bind: slots
        eval: newSlots(batchSize(group.limits), reader.slotSize(ceiling))
        to: newSlots
      - bind: held
        eval: "&packet{conn: bound.pc, sink: bound.sink, group: group.name, port: boundPort(bound.pc)}"
      - bind: lane
        eval: "&packetLoopLane{sink: bound.sink, lane: bound.laneIndex}"
      - defer: held.reset()
        to: held.reset
      - loop:
          do:
            - bind: count, err
              eval: reader.readBatch(slots)
              to: reader.readBatch
            - opt:
                do:
                  - opt:
                      do:
                        - return: ""
                      when: errors.Is(err, stdnet.ErrClosed)
                  - continue: true
                when: err != nil
            - eval: bound.sink.begin()
              to: bound.sink.begin
            - alt:
                - do:
                    - eval: s.dispatch(slots[:count], held, handler, ceiling)
                      to: s.dispatch
                  when: handler != nil
                - do:
                    - eval: s.dispatchLoop(slots[:count], lane, group.loopHandler, ceiling)
                      to: s.dispatchLoop
                  else: true
            - eval: bound.sink.flush()
              to: bound.sink.flush
          forever: true
  - of: (*Server).dispatch
    participants:
      - id: caller
        kind: actor
      - id: (*Server).dispatch
        kind: self
      - id: s.datagrams.truncated.Add
        kind: value
      - id: s.serveMessage
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - eval: s.datagrams.truncated.Add(1)
                    to: s.datagrams.truncated.Add
                  - continue: true
                when: slots[i].cut
            - eval: s.serveMessage(&slots[i], held, handler, ceiling)
              to: s.serveMessage
          key: i
          range: slots
      - set: held.data
        value: nil
      - set: held.from
        value: nil
      - set: held.local
        value: localAddress{}
  - of: (*Server).serveMessage
    participants:
      - id: caller
        kind: actor
      - id: (*Server).serveMessage
        kind: self
      - id: slot.segment
        kind: internal
      - id: s.total.Add
        kind: value
      - id: s.oversized.Add
        kind: value
      - id: s.nextID.Add
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - loop:
          do:
            - bind: data, ok
              eval: slot.segment(j)
              to: slot.segment
            - opt:
                do:
                  - return: ""
                when: "!ok"
            - eval: s.total.Add(1)
              to: s.total.Add
            - opt:
                do:
                  - eval: s.oversized.Add(1)
                    to: s.oversized.Add
                  - continue: true
                when: len(data) > ceiling
            - set: held.data
              value: data
            - set: held.from
              value: slot.addr
            - set: held.local
              value: slot.local
            - set: held.id
              to: s.nextID.Add
              value: s.nextID.Add(1)
            - eval: swallowErr(s.servePacket(held, handler))
              to: swallowErr
          init: j := 0
          post: j++
  - of: (*Server).servePacket
    participants:
      - id: caller
        kind: actor
      - id: (*Server).servePacket
        kind: self
      - id: recoverHandler
        kind: internal
      - id: handler.ServePacket
        kind: value
    steps:
      - defer: recoverHandler()
        to: recoverHandler
      - return: handler.ServePacket(s.runCtx, p)
        to: handler.ServePacket
  - of: boundPort
    steps:
      - bind: udp, ok
        eval: pc.LocalAddr().(*stdnet.UDPAddr)
      - opt:
          do:
            - return: "0"
          when: "!ok"
      - return: udp.Port
  - of: (*packetLoopLane).Reply
    participants:
      - id: caller
        kind: actor
      - id: (*packetLoopLane).Reply
        kind: self
      - id: stdnet
        kind: stdlib
      - id: l.sourceFor
        kind: internal
      - id: l.sink.replyFrom
        kind: internal
      - id: l.sink.reply
        kind: internal
    steps:
      - bind: addr
        eval: stdnet.UDPAddrFromAddrPort(to)
        to: stdnet
      - opt:
          do:
            - bind: _, err
              eval: l.sink.replyFrom(p, addr, local)
              to: l.sink.replyFrom
            - return: err
          init:
            bind: local
            eval: l.sourceFor(to)
            to: l.sourceFor
          when: local.sourceLen != 0
      - bind: _, err
        eval: l.sink.reply(p, addr)
        to: l.sink.reply
      - return: err
  - of: (*packetLoopLane).sourceFor
    participants:
      - id: caller
        kind: actor
      - id: (*packetLoopLane).sourceFor
        kind: self
      - id: to.Addr().Unmap
        kind: value
      - id: addrPortOf
        kind: internal
    steps:
      - bind: want
        eval: to.Addr().Unmap()
        to: to.Addr().Unmap
      - loop:
          cond: i >= 0
          do:
            - bind: d
              eval: "&l.batch[i]"
            - opt:
                do:
                  - continue: true
                when: d.cut || d.local.sourceLen == 0
            - bind: from
              eval: addrPortOf(d.addr)
              to: addrPortOf
            - opt:
                do:
                  - return: d.local
                when: from.Port() == to.Port() && from.Addr().Unmap() == want
          init: i := len(l.batch) - 1
          post: i--
      - return: localAddress{}
  - of: (*packetLoopLane).Loop
    steps:
      - return: l.lane
  - of: (*Server).dispatchLoop
    participants:
      - id: caller
        kind: actor
      - id: (*Server).dispatchLoop
        kind: self
      - id: s.datagrams.truncated.Add
        kind: value
      - id: addrPortOf
        kind: internal
      - id: slots[i].segment
        kind: internal
      - id: s.total.Add
        kind: value
      - id: s.oversized.Add
        kind: value
      - id: servePacketLoop
        kind: internal
      - id: endPacketLoop
        kind: internal
    steps:
      - set: l.batch
        value: slots
      - defer: func() { l.batch = nil }()
      - loop:
          do:
            - opt:
                do:
                  - eval: s.datagrams.truncated.Add(1)
                    to: s.datagrams.truncated.Add
                  - continue: true
                when: slots[i].cut
            - bind: from
              eval: addrPortOf(slots[i].addr)
              to: addrPortOf
            - loop:
                do:
                  - bind: data, ok
                    eval: slots[i].segment(j)
                    to: slots[i].segment
                  - opt:
                      do:
                        - break: true
                      when: "!ok"
                  - eval: s.total.Add(1)
                    to: s.total.Add
                  - opt:
                      do:
                        - eval: s.oversized.Add(1)
                          to: s.oversized.Add
                        - continue: true
                      when: len(data) > ceiling
                  - set: l.handed
                    value: "true"
                  - eval: servePacketLoop(h, l, from, data)
                    to: servePacketLoop
                init: j := 0
                post: j++
          key: i
          range: slots
      - opt:
          do:
            - set: l.handed
              value: "false"
            - eval: endPacketLoop(h, l)
              to: endPacketLoop
          when: l.handed
  - of: servePacketLoop
    participants:
      - id: caller
        kind: actor
      - id: servePacketLoop
        kind: self
      - id: recoverHandler
        kind: internal
      - id: h.OnPacket
        kind: value
    steps:
      - defer: recoverHandler()
        to: recoverHandler
      - eval: h.OnPacket(l, from, data)
        to: h.OnPacket
  - of: endPacketLoop
    participants:
      - id: caller
        kind: actor
      - id: endPacketLoop
        kind: self
      - id: recoverHandler
        kind: internal
      - id: h.OnBatchEnd
        kind: value
    steps:
      - defer: recoverHandler()
        to: recoverHandler
      - eval: h.OnBatchEnd(l)
        to: h.OnBatchEnd
  - of: addrPortOf
    participants:
      - id: caller
        kind: actor
      - id: addrPortOf
        kind: self
      - id: udp.AddrPort
        kind: value
    steps:
      - bind: udp, ok
        eval: a.(*stdnet.UDPAddr)
      - opt:
          do:
            - return: netip.AddrPort{}
          when: "!ok || udp == nil"
      - return: udp.AddrPort()
        to: udp.AddrPort
  - of: enableDestination
    participants:
      - id: caller
        kind: actor
      - id: enableDestination
        kind: self
      - id: reader.enablePktinfo
        kind: internal
    steps:
      - bind: udp, ok
        eval: pc.LocalAddr().(*stdnet.UDPAddr)
      - opt:
          do:
            - return: false, false, ""
          when: "!ok || udp.IP == nil || !udp.IP.IsUnspecified()"
      - bind: reader, isBatched
        eval: source.(*multiReader)
      - opt:
          do:
            - return: true, false, destinationUnavailable
          when: "!isBatched"
      - opt:
          do:
            - return: "true, false, \"setsockopt IP_PKTINFO: \" + err.Error()"
          init:
            bind: err
            eval: reader.enablePktinfo(udp)
            to: reader.enablePktinfo
          when: err != nil
      - return: true, true, ""
  - of: (*multiReader).enablePktinfo
    participants:
      - id: caller
        kind: actor
      - id: (*multiReader).enablePktinfo
        kind: self
      - id: r.raw.Control
        kind: value
      - id: cmp
        kind: stdlib
    steps:
      - bind: family, level, option
        eval: syscall.AF_INET, syscall.IPPROTO_IP, syscall.IP_PKTINFO
      - opt:
          do:
            - set: family, level, option
              value: syscall.AF_INET6, syscall.IPPROTO_IPV6, syscall.IPV6_RECVPKTINFO
          when: bound.IP.To4() == nil
      - var:
          name: serr
          type: error
      - bind: cerr
        eval: |-
          r.raw.Control(func(fd uintptr) {
          		serr = syscall.SetsockoptInt(int(fd), level, option, 1)
          	})
        to: r.raw.Control
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: cmp.Or(cerr, serr)
            to: cmp
          when: err != nil
      - set: r.dstFamily
        value: family
      - return: nil
  - of: pktinfoOf
    participants:
      - id: caller
        kind: actor
      - id: pktinfoOf
        kind: self
      - id: controlMessage
        kind: internal
      - id: localOf4
        kind: internal
      - id: localOf6
        kind: internal
    steps:
      - opt:
          do:
            - bind: payload
              eval: controlMessage(control, syscall.IPPROTO_IP, syscall.IP_PKTINFO, inPktinfoBytes)
              to: controlMessage
            - opt:
                do:
                  - return: localAddress{}
                when: payload == nil
            - return: localOf4((*syscall.Inet4Pktinfo)(unsafe.Pointer(&payload[0])))
              to: localOf4
          when: family == syscall.AF_INET
      - bind: payload
        eval: controlMessage(control, syscall.IPPROTO_IPV6, syscall.IPV6_PKTINFO, in6PktinfoBytes)
        to: controlMessage
      - opt:
          do:
            - return: localAddress{}
          when: payload == nil
      - return: localOf6((*syscall.Inet6Pktinfo)(unsafe.Pointer(&payload[0])))
        to: localOf6
  - of: localOf4
    steps:
      - var:
          name: local
          type: localAddress
      - set: local.toLen
        value: stdnet.IPv4len
      - eval: copy(local.to[:], info.Addr[:])
      - opt:
          do:
            - set: local.sourceLen
              value: stdnet.IPv4len
            - eval: copy(local.source[:], info.Spec_dst[:])
          when: info.Spec_dst != [stdnet.IPv4len]byte{}
      - return: local
  - of: localOf6
    participants:
      - id: caller
        kind: actor
      - id: localOf6
        kind: self
      - id: stdnet
        kind: stdlib
    steps:
      - var:
          name: local
          type: localAddress
      - set: local.toLen
        value: stdnet.IPv6len
      - set: local.to
        value: info.Addr
      - bind: ip
        eval: stdnet.IP(local.to[:])
        to: stdnet
      - opt:
          do:
            - set: local.sourceLen
              value: stdnet.IPv6len
            - set: local.source
              value: info.Addr
          when: "!ip.IsMulticast() && !ip.IsUnspecified() && !ip.Equal(stdnet.IPv4bcast)"
      - return: local
  - of: writePktinfo
    participants:
      - id: caller
        kind: actor
      - id: writePktinfo
        kind: self
      - id: syscall
        kind: stdlib
      - id: cmsg.SetLen
        kind: value
    steps:
      - bind: cmsg
        eval: (*syscall.Cmsghdr)(unsafe.Pointer(&control[0]))
      - bind: data
        eval: syscall.CmsgLen(0)
        to: syscall
      - opt:
          do:
            - set: cmsg.Level
              value: syscall.IPPROTO_IPV6
            - set: cmsg.Type
              value: syscall.IPV6_PKTINFO
            - eval: cmsg.SetLen(syscall.CmsgLen(in6PktinfoBytes))
              to: cmsg.SetLen
            - bind: info
              eval: (*syscall.Inet6Pktinfo)(unsafe.Pointer(&control[data]))
            - set: info.Addr
              value: source.source
            - set: info.Ifindex
              value: "0"
            - return: syscall.CmsgSpace(in6PktinfoBytes)
              to: syscall
          when: family == syscall.AF_INET6
      - set: cmsg.Level
        value: syscall.IPPROTO_IP
      - set: cmsg.Type
        value: syscall.IP_PKTINFO
      - eval: cmsg.SetLen(syscall.CmsgLen(inPktinfoBytes))
        to: cmsg.SetLen
      - bind: info
        eval: (*syscall.Inet4Pktinfo)(unsafe.Pointer(&control[data]))
      - set: info.Ifindex
        value: "0"
      - eval: copy(info.Spec_dst[:], source.source[:stdnet.IPv4len])
      - set: info.Addr
        value: "[stdnet.IPv4len]byte{}"
      - return: syscall.CmsgSpace(inPktinfoBytes)
        to: syscall
  - of: newPinWriter
    participants:
      - id: caller
        kind: actor
      - id: newPinWriter
        kind: self
      - id: sc.SyscallConn
        kind: internal
      - id: socketFamily
        kind: internal
      - id: sendmmsg
        kind: internal
    steps:
      - bind: raw, err
        eval: sc.SyscallConn()
        to: sc.SyscallConn
      - opt:
          do:
            - return: nil
          when: err != nil
      - bind: family
        eval: socketFamily(raw)
        to: socketFamily
      - opt:
          do:
            - return: nil
          when: family != syscall.AF_INET && family != syscall.AF_INET6
      - bind: w
        eval: "&pinWriter{pc: pc, raw: raw, family: family}"
      - set: w.write
        value:
          closure:
            params: fd uintptr
            results: bool
            steps:
              - var:
                  name: sent
                  type: int
              - set: sent, w.errno
                to: sendmmsg
                value: sendmmsg(fd, w.headers[:1])
              - set: w.sent
                value: "0"
              - opt:
                  do:
                    - set: w.sent
                      value: int(w.headers[0].length)
                  when: sent == 1
              - return: w.errno != syscall.EAGAIN
      - return: w
  - of: socketFamily
    participants:
      - id: caller
        kind: actor
      - id: socketFamily
        kind: self
      - id: raw.Control
        kind: value
    steps:
      - bind: family
        eval: "0"
      - bind: cerr
        eval: |-
          raw.Control(func(fd uintptr) {
          		sa, err := syscall.Getsockname(int(fd))
          		//: the family or nothing.
          		if err != nil {
          			return
          		}
          		switch sa.(type) {
          		//: IPv4.
          		case *syscall.SockaddrInet4:
          			family = syscall.AF_INET
          		//: IPv6, IPv4-mapped peers included.
          		case *syscall.SockaddrInet6:
          			family = syscall.AF_INET6
          		}
          	})
        to: raw.Control
      - opt:
          do:
            - return: "0"
          when: cerr != nil
      - return: family
  - of: (*pinWriter).send
    participants:
      - id: caller
        kind: actor
      - id: (*pinWriter).send
        kind: self
      - id: w.pc.WriteTo
        kind: value
      - id: w.layout
        kind: internal
      - id: w.raw.Write
        kind: value
    steps:
      - lock:
          mutex: w.mu
      - opt:
          do:
            - return: w.pc.WriteTo(b, to)
              to: w.pc.WriteTo
          when: "!encodeSockaddr(w.family, to, &w.name, &w.namelen)"
      - eval: w.layout(b, source)
        to: w.layout
      - set: w.sent, w.errno
        value: 0, 0
      - bind: cerr
        eval: w.raw.Write(w.write)
        to: w.raw.Write
      - set: w.iov.Base
        value: nil
      - opt:
          do:
            - return: 0, cerr
          when: cerr != nil
      - opt:
          do:
            - return: w.pc.WriteTo(b, to)
              to: w.pc.WriteTo
          when: w.errno == syscall.EINVAL
      - opt:
          do:
            - return: 0, w.errno
          when: w.errno != 0
      - return: w.sent, nil
  - of: (*pinWriter).layout
    participants:
      - id: caller
        kind: actor
      - id: (*pinWriter).layout
        kind: self
      - id: writePktinfo
        kind: internal
      - id: setKernelLen
        kind: internal
    steps:
      - bind: used
        eval: writePktinfo(w.oob[:], w.family, source)
        to: writePktinfo
      - var:
          name: empty
          type: byte
      - bind: base
        eval: "&empty"
      - opt:
          do:
            - set: base
              value: "&b[0]"
          when: len(b) > 0
      - set: w.iov.Base
        value: base
      - eval: setKernelLen(&w.iov.Len, len(b))
        to: setKernelLen
      - bind: hdr
        eval: "&w.headers[0].hdr"
      - set: hdr.Name
        value: (*byte)(unsafe.Pointer(&w.name))
      - set: hdr.Namelen
        value: w.namelen
      - set: hdr.Iov
        value: "&w.iov"
      - set: hdr.Control
        value: "&w.oob[0]"
      - set: hdr.Flags
        value: "0"
      - eval: setKernelLen(&hdr.Iovlen, 1)
        to: setKernelLen
      - eval: setKernelLen(&hdr.Controllen, used)
        to: setKernelLen
  - of: readPlatform
    steps:
      - return: |-
          corenet.PlatformValue{
          		GOOS: runtime.GOOS, GOARCH: runtime.GOARCH,
          		Kernel: kernelRelease(), Go: runtime.Version(),
          	}
  - of: kernelRelease
    participants:
      - id: caller
        kind: actor
      - id: kernelRelease
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - var:
          name: u
          type: syscall.Utsname
      - opt:
          do:
            - return: "\"\""
          init:
            bind: err
            eval: syscall.Uname(&u)
            to: syscall
          when: err != nil
      - bind: buf
        eval: make([]byte, 0, len(u.Release))
      - loop:
          do:
            - opt:
                do:
                  - break: true
                when: c == 0
            - set: buf
              value: append(buf, byte(c))
          key: _
          range: u.Release
          value: c
      - return: string(buf)
  - of: (*Server).acquire
    participants:
      - id: caller
        kind: actor
      - id: (*Server).acquire
        kind: self
      - id: s.connPool.Get
        kind: value
      - id: s.nextID.Add
        kind: value
      - id: s.liveMu.Lock
        kind: value
      - id: s.liveMu.Unlock
        kind: value
      - id: buffer
        kind: package
    steps:
      - bind: c
        eval: s.connPool.Get()
        to: s.connPool.Get
      - set: c.Conn
        value: raw
      - set: c.id
        to: s.nextID.Add
        value: s.nextID.Add(1)
      - set: c.group
        value: group.name
      - set: c.timeouts
        value: group.timeouts
      - eval: s.liveMu.Lock()
        to: s.liveMu.Lock
      - set: s.live[c.id]
        value: raw
      - eval: s.liveMu.Unlock()
        to: s.liveMu.Unlock
      - opt:
          do:
            - set: c.scratch
              to: buffer
              value: buffer.GetSize(size)
            - set: "*c.scratch"
              value: (*c.scratch)[:size]
          init:
            bind: size
            eval: group.limits.ReadBufferSize
          when: size > 0
      - return: c
  - of: (*Server).release
    participants:
      - id: caller
        kind: actor
      - id: (*Server).release
        kind: self
      - id: s.liveMu.Lock
        kind: value
      - id: s.liveMu.Unlock
        kind: value
      - id: swallowErr
        kind: internal
      - id: buffer
        kind: package
      - id: c.reset
        kind: internal
      - id: s.connPool.Put
        kind: value
    steps:
      - eval: s.liveMu.Lock()
        to: s.liveMu.Lock
      - eval: delete(s.live, c.id)
      - eval: s.liveMu.Unlock()
        to: s.liveMu.Unlock
      - opt:
          do:
            - eval: swallowErr(c.closeGracefully())
              to: swallowErr
          when: "!c.hijacked"
      - opt:
          do:
            - eval: buffer.Put(c.scratch)
              to: buffer
          when: c.scratch != nil
      - eval: c.reset()
        to: c.reset
      - eval: s.connPool.Put(c)
        to: s.connPool.Put
  - of: (*Server).closeLive
    participants:
      - id: caller
        kind: actor
      - id: (*Server).closeLive
        kind: self
      - id: s.liveMu.RLock
        kind: value
      - id: slices
        kind: stdlib
      - id: s.liveMu.RUnlock
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - eval: s.liveMu.RLock()
        to: s.liveMu.RLock
      - bind: sockets
        eval: slices.Collect(maps.Values(s.live))
        to: slices
      - eval: s.liveMu.RUnlock()
        to: s.liveMu.RUnlock
      - loop:
          do:
            - eval: swallowErr(socket.Close())
              to: swallowErr
          key: _
          range: sockets
          value: socket
  - of: parseProxyPolicy
    participants:
      - id: caller
        kind: actor
      - id: parseProxyPolicy
        kind: self
      - id: netip
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil, false
          when: len(v.Trusted) == 0 || v.Timeout.Duration() < 0
      - bind: p
        eval: "&proxyPolicy{timeout: v.Timeout.Duration()}"
      - loop:
          do:
            - bind: prefix, err
              eval: netip.ParsePrefix(cidr)
              to: netip
            - opt:
                do:
                  - return: nil, false
                when: err != nil
            - set: p.trusted
              value: append(p.trusted, prefix.Masked())
          key: _
          range: v.Trusted
          value: cidr
      - opt:
          do:
            - set: p.timeout
              value: defaultProxyTimeout
          when: p.timeout == 0
      - return: p, true
  - of: (*proxyPolicy).trusts
    participants:
      - id: caller
        kind: actor
      - id: (*proxyPolicy).trusts
        kind: self
      - id: netip
        kind: stdlib
      - id: ip.Unmap
        kind: value
    steps:
      - bind: tcp, ok
        eval: addr.(*stdnet.TCPAddr)
      - opt:
          do:
            - return: "false"
          when: "!ok"
      - bind: ip, ok
        eval: netip.AddrFromSlice(tcp.IP)
        to: netip
      - opt:
          do:
            - return: "false"
          when: "!ok"
      - set: ip
        to: ip.Unmap
        value: ip.Unmap()
      - loop:
          do:
            - opt:
                do:
                  - return: "true"
                when: prefix.Contains(ip)
          key: _
          range: p.trusted
          value: prefix
      - return: "false"
  - of: (*proxyListener).Accept
    participants:
      - id: caller
        kind: actor
      - id: (*proxyListener).Accept
        kind: self
      - id: l.Listener.Accept
        kind: value
      - id: l.policy.refused.Add
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - loop:
          do:
            - bind: socket, aerr
              eval: l.Listener.Accept()
              to: l.Listener.Accept
            - opt:
                do:
                  - return: nil, aerr
                when: aerr != nil
            - opt:
                do:
                  - eval: l.policy.refused.Add(1)
                    to: l.policy.refused.Add
                  - eval: swallowErr(socket.Close())
                    to: swallowErr
                  - continue: true
                when: "!l.policy.trusts(socket.RemoteAddr())"
            - return: "&proxyConn{Conn: socket, policy: l.policy}, nil"
          forever: true
  - of: (*announcedClient).store
    steps:
      - eval: copy(a.ip[:], ip)
      - set: a.addr.IP
        value: a.ip[:len(ip)]
      - set: a.addr.Port
        value: int(port)
      - set: a.set
        value: "true"
  - of: (*proxyConn).RemoteAddr
    participants:
      - id: caller
        kind: actor
      - id: (*proxyConn).RemoteAddr
        kind: self
      - id: p.Conn.RemoteAddr
        kind: value
    steps:
      - opt:
          do:
            - return: p.Conn.RemoteAddr()
              to: p.Conn.RemoteAddr
          when: "!p.announced.set"
      - return: "&p.announced.addr"
  - of: (*proxyConn).CloseWrite
    participants:
      - id: caller
        kind: actor
      - id: (*proxyConn).CloseWrite
        kind: self
      - id: half.CloseWrite
        kind: internal
    steps:
      - bind: half, ok
        eval: p.Conn.(interface{ CloseWrite() error })
      - opt:
          do:
            - return: nil
          when: "!ok"
      - return: half.CloseWrite()
        to: half.CloseWrite
  - of: (*proxyConn).ReadFrom
    participants:
      - id: caller
        kind: actor
      - id: (*proxyConn).ReadFrom
        kind: self
      - id: readerFrom.ReadFrom
        kind: value
      - id: io
        kind: stdlib
    steps:
      - opt:
          do:
            - return: readerFrom.ReadFrom(r)
              to: readerFrom.ReadFrom
          init:
            bind: readerFrom, ok
            eval: p.Conn.(io.ReaderFrom)
          when: ok
      - return: io.Copy(p.Conn, r)
        to: io
  - of: (*proxyConn).WriteTo
    participants:
      - id: caller
        kind: actor
      - id: (*proxyConn).WriteTo
        kind: self
      - id: writerTo.WriteTo
        kind: value
      - id: io
        kind: stdlib
    steps:
      - opt:
          do:
            - return: writerTo.WriteTo(w)
              to: writerTo.WriteTo
          init:
            bind: writerTo, ok
            eval: p.Conn.(io.WriterTo)
          when: ok
      - return: io.Copy(w, p.Conn)
        to: io
  - of: (*proxyConn).Unwrap
    steps:
      - return: p.Conn
  - of: (*proxyConn).establish
    participants:
      - id: caller
        kind: actor
      - id: (*proxyConn).establish
        kind: self
      - id: p.armDeadline
        kind: internal
      - id: buffer
        kind: package
      - id: readProxyHeader
        kind: internal
      - id: swallowErr
        kind: internal
    steps:
      - bind: stop
        eval: p.armDeadline(clk, p.policy.timeout)
        to: p.armDeadline
      - bind: scratch
        eval: buffer.GetSize(proxyBufferBytes)
        to: buffer
      - defer: buffer.Put(scratch)
        to: buffer
      - bind: buf
        eval: (*scratch)[:proxyBufferBytes]
      - bind: err
        eval: readProxyHeader(p.Conn, buf, &p.announced)
        to: readProxyHeader
      - eval: stop()
      - eval: swallowErr(p.SetReadDeadline(time.Time{}))
        to: swallowErr
      - return: err
  - of: (*proxyConn).armDeadline
    participants:
      - id: caller
        kind: actor
      - id: (*proxyConn).armDeadline
        kind: self
      - id: clk.NewTimer
        kind: value
      - id: ended.Go
        kind: value
      - id: timer.Stop
        kind: value
      - id: ended.Wait
        kind: value
    steps:
      - bind: timer
        eval: clk.NewTimer(budget)
        to: clk.NewTimer
      - bind: done
        eval: make(chan struct{})
      - var:
          name: ended
          type: sync.WaitGroup
      - eval: |-
          ended.Go(func() {
          		//: whichever comes first: the header, or the budget.
          		select {
          		//: refused: the blocked read returns at once.
          		case <-timer.C():
          			swallowErr(p.SetReadDeadline(time.Unix(1, 0)))
          		//: read in time.
          		case <-done:
          		}
          	})
        to: ended.Go
      - return:
          closure:
            steps:
              - eval: timer.Stop()
                to: timer.Stop
              - eval: close(done)
              - eval: ended.Wait()
                to: ended.Wait
  - of: proxyRefusal
    participants:
      - id: caller
        kind: actor
      - id: proxyRefusal
        kind: self
      - id: errs
        kind: package
    steps:
      - return: errs.Wrap(corenet.ProxyHeaderInvalid, errs.WrapParams{}, errs.String("why", why))
        to: errs
  - of: readProxyHeader
    participants:
      - id: caller
        kind: actor
      - id: readProxyHeader
        kind: self
      - id: io
        kind: stdlib
      - id: proxyRefusal
        kind: internal
      - id: readProxyV2
        kind: internal
      - id: readProxyV1
        kind: internal
    steps:
      - opt:
          do:
            - return: proxyRefusal("read")
              to: proxyRefusal
          init:
            bind: _, err
            eval: io.ReadFull(socket, buf[:1])
            to: io
          when: err != nil
      - switch:
          cases:
            - case: proxyV2Signature[0]
              do:
                - return: readProxyV2(socket, buf, out)
                  to: readProxyV2
            - case: "'P'"
              do:
                - return: readProxyV1(socket, buf, out)
                  to: readProxyV1
            - default: true
              do:
                - return: proxyRefusal("no header")
                  to: proxyRefusal
          "on": buf[0]
  - of: readProxyV2
    participants:
      - id: caller
        kind: actor
      - id: readProxyV2
        kind: self
      - id: io
        kind: stdlib
      - id: proxyRefusal
        kind: internal
      - id: parseProxyV2
        kind: internal
    steps:
      - opt:
          do:
            - return: proxyRefusal("truncated header")
              to: proxyRefusal
          init:
            bind: _, err
            eval: io.ReadFull(socket, buf[1:proxyV2FixedBytes])
            to: io
          when: err != nil
      - opt:
          do:
            - return: proxyRefusal("bad signature")
              to: proxyRefusal
          when: "!bytes.Equal(buf[:len(proxyV2Signature)], proxyV2Signature[:])"
      - bind: verCmd, family
        eval: buf[12], buf[13]
      - bind: length
        eval: int(binary.BigEndian.Uint16(buf[14:16]))
      - opt:
          do:
            - return: proxyRefusal("header too long")
              to: proxyRefusal
          when: length > proxyV2MaxPayload
      - bind: payload
        eval: "buf[proxyV2FixedBytes : proxyV2FixedBytes+length]"
      - opt:
          do:
            - return: proxyRefusal("truncated payload")
              to: proxyRefusal
          init:
            bind: _, err
            eval: io.ReadFull(socket, payload)
            to: io
          when: err != nil
      - return: parseProxyV2(verCmd, family, payload, out)
        to: parseProxyV2
  - of: parseProxyV2
    participants:
      - id: caller
        kind: actor
      - id: parseProxyV2
        kind: self
      - id: proxyRefusal
        kind: internal
      - id: announceV2
        kind: internal
    steps:
      - bind: version, command
        eval: verCmd>>4, verCmd&0x0f
      - opt:
          do:
            - return: proxyRefusal("unknown version or command")
              to: proxyRefusal
          when: version != proxyV2Version || (command != proxyV2Local && command != proxyV2Proxy)
      - opt:
          do:
            - return: nil
          when: command == proxyV2Local
      - switch:
          cases:
            - case: proxyV2Unspec
              do:
                - return: nil
            - case: proxyV2TCP4
              do:
                - return: announceV2(payload, stdnet.IPv4len, proxyV2TCP4Bytes, out)
                  to: announceV2
            - case: proxyV2TCP6
              do:
                - return: announceV2(payload, stdnet.IPv6len, proxyV2TCP6Bytes, out)
                  to: announceV2
            - default: true
              do:
                - return: proxyRefusal("unsupported family")
                  to: proxyRefusal
          "on": family
  - of: announceV2
    participants:
      - id: caller
        kind: actor
      - id: announceV2
        kind: self
      - id: proxyRefusal
        kind: internal
      - id: out.store
        kind: internal
    steps:
      - opt:
          do:
            - return: proxyRefusal("short address")
              to: proxyRefusal
          when: len(payload) < want
      - eval: out.store(payload[:ipLen], binary.BigEndian.Uint16(payload[2*ipLen:2*ipLen+2]))
        to: out.store
      - return: nil
  - of: readProxyV1
    participants:
      - id: caller
        kind: actor
      - id: readProxyV1
        kind: self
      - id: proxyRefusal
        kind: internal
      - id: io
        kind: stdlib
      - id: parseProxyV1
        kind: internal
    steps:
      - bind: "n"
        eval: "1"
      - loop:
          cond: buf[n-1] != '\n'
          do:
            - opt:
                do:
                  - return: proxyRefusal("header too long")
                    to: proxyRefusal
                when: n >= proxyV1MaxBytes
            - opt:
                do:
                  - return: proxyRefusal("truncated header")
                    to: proxyRefusal
                init:
                  bind: _, err
                  eval: io.ReadFull(socket, buf[n:n+1])
                  to: io
                when: err != nil
            - op: ++
              set: "n"
      - opt:
          do:
            - return: proxyRefusal("bad terminator")
              to: proxyRefusal
          when: n < 2 || buf[n-2] != '\r'
      - return: parseProxyV1(string(buf[:n-2]), out)
        to: parseProxyV1
  - of: parseProxyV1
    participants:
      - id: caller
        kind: actor
      - id: parseProxyV1
        kind: self
      - id: strings
        kind: stdlib
      - id: proxyRefusal
        kind: internal
      - id: netip
        kind: stdlib
      - id: strconv
        kind: stdlib
      - id: ip.AsSlice
        kind: value
      - id: out.store
        kind: internal
    steps:
      - bind: fields
        eval: strings.Split(line, " ")
        to: strings
      - opt:
          do:
            - return: proxyRefusal("bad line")
              to: proxyRefusal
          when: len(fields) < 2 || fields[0] != "PROXY"
      - opt:
          do:
            - return: nil
          when: fields[1] == "UNKNOWN"
      - opt:
          do:
            - return: proxyRefusal("bad line")
              to: proxyRefusal
          when: len(fields) != 6 || (fields[1] != "TCP4" && fields[1] != "TCP6")
      - bind: ip, err
        eval: netip.ParseAddr(fields[2])
        to: netip
      - opt:
          do:
            - return: proxyRefusal("bad address")
              to: proxyRefusal
          when: err != nil || ip.Is4() != (fields[1] == "TCP4")
      - bind: port, perr
        eval: strconv.ParseUint(fields[4], 10, 16)
        to: strconv
      - opt:
          do:
            - return: proxyRefusal("bad port")
              to: proxyRefusal
          when: perr != nil || strconv.FormatUint(port, 10) != fields[4]
      - bind: raw
        eval: ip.AsSlice()
        to: ip.AsSlice
      - eval: out.store(raw, uint16(port))
        to: out.store
      - return: nil
  - of: proxySocket
    participants:
      - id: caller
        kind: actor
      - id: proxySocket
        kind: self
      - id: layer.NetConn
        kind: internal
    steps:
      - bind: socket
        eval: raw
      - loop:
          do:
            - typeswitch:
                bind: layer
                cases:
                  - do:
                      - set: socket
                        to: layer.NetConn
                        value: layer.NetConn()
                    types: interface{ NetConn() stdnet.Conn }
                  - do:
                      - set: socket
                        value: layer.Conn
                    types: "*trackedConn"
                  - do:
                      - return: layer
                    types: "*proxyConn"
                  - default: true
                    do:
                      - return: nil
                "on": socket
          forever: true
  - of: (*Server).admitProxied
    participants:
      - id: caller
        kind: actor
      - id: (*Server).admitProxied
        kind: self
      - id: proxySocket
        kind: internal
      - id: socket.establish
        kind: internal
      - id: group.proxyPolicy.refused.Add
        kind: value
      - id: group.admission.Admit
        kind: internal
    steps:
      - bind: socket
        eval: proxySocket(raw)
        to: proxySocket
      - opt:
          do:
            - return: nil, true
          when: socket == nil
      - opt:
          do:
            - eval: group.proxyPolicy.refused.Add(1)
              to: group.proxyPolicy.refused.Add
            - return: nil, false
          init:
            bind: err
            eval: socket.establish(s.clk)
            to: socket.establish
          when: err != nil
      - opt:
          do:
            - return: nil, true
          when: group.admission == nil
      - return: group.admission.Admit(socket.RemoteAddr())
        to: group.admission.Admit
  - of: RateKeyRemoteAddr
    steps:
      - return: "HTTPRateKeyValue{kind: httpRateKeyRemote}"
  - of: RateKeyHeader
    steps:
      - return: "HTTPRateKeyValue{kind: httpRateKeyHeader, header: http.CanonicalHeaderKey(name)}"
  - of: RateLimit
    participants:
      - id: caller
        kind: actor
      - id: RateLimit
        kind: self
      - id: clock.System.Now
        kind: value
    steps:
      - opt:
          do:
            - return: nil, rateMisconfigured("limiter")
          when: l == nil
      - opt:
          do:
            - return: nil, rateMisconfigured("key")
          when: key.kind == httpRateKeyNone || (key.kind == httpRateKeyHeader && key.header == "")
      - bind: epoch
        eval: clock.System.Now()
        to: clock.System.Now
      - return: |-
          func(next http.Handler) http.Handler {
          		//: read per request here: net/http has no batch to share a stamp over.
          		return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
          			now := clock.System.Now().Sub(epoch).Nanoseconds()
          			ok, after := l.Allow(rateKeyOf(r, key), now)
          			//: over budget: refused, and no handler runs.
          			if !ok {
          				w.Header().Set("Retry-After", strconv.Itoa(after))
          				w.Header().Set("Connection", "close")
          				w.WriteHeader(http.StatusTooManyRequests)
          				//: refused.
          				return
          			}
          			next.ServeHTTP(w, r)
          		})
          	}, nil
  - of: rateKeyOf
    participants:
      - id: caller
        kind: actor
      - id: rateKeyOf
        kind: self
      - id: stdnet
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "[]byte(r.Header.Get(key.header))"
          when: key.kind == httpRateKeyHeader
      - bind: host, _, err
        eval: stdnet.SplitHostPort(r.RemoteAddr)
        to: stdnet
      - opt:
          do:
            - return: "[]byte(r.RemoteAddr)"
          when: err != nil
      - return: "[]byte(host)"
  - of: rateMisconfigured
    participants:
      - id: caller
        kind: actor
      - id: rateMisconfigured
        kind: self
      - id: errs
        kind: package
    steps:
      - return: errs.Wrap(corenet.HTTP1Misconfigured, errs.WrapParams{}, errs.String("link", "RateLimit"), errs.String("option", what))
        to: errs
  - of: newQueuedSink
    steps:
      - return: |-
          &queuedSink{
          		pc: pc, counters: counters,
          		arena: make([]byte, replyArena), queue: make([]queuedReply, 0, replyQueue),
          	}
  - of: (*queuedSink).begin
    participants:
      - id: caller
        kind: actor
      - id: (*queuedSink).begin
        kind: self
      - id: w.mu.Lock
        kind: value
      - id: w.mu.Unlock
        kind: value
    steps:
      - eval: w.mu.Lock()
        to: w.mu.Lock
      - set: w.open
        value: "true"
      - eval: w.mu.Unlock()
        to: w.mu.Unlock
  - of: (*queuedSink).reply
    participants:
      - id: caller
        kind: actor
      - id: (*queuedSink).reply
        kind: self
      - id: w.mu.Lock
        kind: value
      - id: w.mu.Unlock
        kind: value
      - id: w.pc.WriteTo
        kind: value
      - id: w.flushLocked
        kind: internal
    steps:
      - eval: w.mu.Lock()
        to: w.mu.Lock
      - opt:
          do:
            - eval: w.mu.Unlock()
              to: w.mu.Unlock
            - return: w.pc.WriteTo(b, to)
              to: w.pc.WriteTo
          when: "!w.open || len(b) > len(w.arena)"
      - opt:
          do:
            - eval: w.flushLocked()
              to: w.flushLocked
          when: len(w.queue) == cap(w.queue) || w.used+len(b) > len(w.arena)
      - set: w.queue
        value: "append(w.queue, queuedReply{off: w.used, size: len(b), to: to})"
      - eval: copy(w.arena[w.used:], b)
      - op: +=
        set: w.used
        value: len(b)
      - eval: w.mu.Unlock()
        to: w.mu.Unlock
      - return: len(b), nil
  - of: (*queuedSink).replyFrom
    participants:
      - id: caller
        kind: actor
      - id: (*queuedSink).replyFrom
        kind: self
      - id: w.reply
        kind: internal
    steps:
      - return: w.reply(b, to)
        to: w.reply
  - of: (*queuedSink).flush
    participants:
      - id: caller
        kind: actor
      - id: (*queuedSink).flush
        kind: self
      - id: w.mu.Lock
        kind: value
      - id: w.flushLocked
        kind: internal
      - id: w.mu.Unlock
        kind: value
    steps:
      - eval: w.mu.Lock()
        to: w.mu.Lock
      - eval: w.flushLocked()
        to: w.flushLocked
      - set: w.open
        value: "false"
      - eval: w.mu.Unlock()
        to: w.mu.Unlock
  - of: (*queuedSink).flushLocked
    participants:
      - id: caller
        kind: actor
      - id: (*queuedSink).flushLocked
        kind: self
      - id: w.pc.WriteTo
        kind: value
      - id: w.counters.replyFailures.Add
        kind: value
    steps:
      - loop:
          do:
            - bind: r
              eval: "&w.queue[i]"
            - opt:
                do:
                  - eval: w.counters.replyFailures.Add(1)
                    to: w.counters.replyFailures.Add
                init:
                  bind: _, err
                  eval: w.pc.WriteTo(w.arena[r.off:r.off+r.size], r.to)
                  to: w.pc.WriteTo
                when: err != nil
            - set: r.to
              value: nil
          key: i
          range: w.queue
      - set: w.queue
        value: w.queue[:0]
      - set: w.used
        value: "0"
  - of: reusePortSupported
    steps:
      - return: "true"
  - of: setReusePort
    participants:
      - id: caller
        kind: actor
      - id: setReusePort
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - return: syscall.SetsockoptInt(int(fd), syscall.SOL_SOCKET, soReusePort, 1)
        to: syscall
  - of: (*Server).probeKernelDrops
    participants:
      - id: caller
        kind: actor
      - id: (*Server).probeKernelDrops
        kind: self
      - id: enableKernelDrops
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: s.operator.kernelDisabled(corenet.CapabilityUDPRxqOvfl)
      - bind: on, why
        eval: enableKernelDrops(source, &s.datagrams.kernelDrops)
        to: enableKernelDrops
      - lock:
          mutex: s.rxq.mu
      - op: ++
        set: s.rxq.tried
      - opt:
          do:
            - op: ++
              set: s.rxq.on
            - return: ""
          when: "on"
      - opt:
          do:
            - set: s.rxq.why
              value: why
          when: s.rxq.why == ""
  - of: (*Server).datagramCapabilities
    participants:
      - id: caller
        kind: actor
      - id: (*Server).datagramCapabilities
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - return: slices.Concat(s.rxqCapability(), s.pktinfoCapability(), s.steerCapability(), s.laneCapability())
        to: slices
  - of: (*Server).rxqCapability
    participants:
      - id: caller
        kind: actor
      - id: (*Server).rxqCapability
        kind: self
      - id: s.operator.kernelSwitches
        kind: internal
    steps:
      - bind: row
        eval: "corenet.CapabilityValue{Name: corenet.CapabilityUDPRxqOvfl, Class: classKernel}"
      - opt:
          do:
            - set: _, row.Reason
              to: s.operator.kernelSwitches
              value: s.operator.kernelSwitches()
            - set: row.Status
              value: statusDisabled
            - return: "[]corenet.CapabilityValue{row}"
          when: s.operator.kernelDisabled(corenet.CapabilityUDPRxqOvfl)
      - lock:
          mutex: s.rxq.mu
      - switch:
          cases:
            - case: s.rxq.tried == 0
              do:
                - return: nil
            - case: s.rxq.on > 0
              do:
                - set: row.Status
                  value: statusOn
            - default: true
              do:
                - set: row.Status, row.Reason
                  value: statusAbsent, s.rxq.why
      - return: "[]corenet.CapabilityValue{row}"
  - of: (*Server).probeDestination
    participants:
      - id: caller
        kind: actor
      - id: (*Server).probeDestination
        kind: self
      - id: enableDestination
        kind: internal
    steps:
      - opt:
          do:
            - return: "false"
          when: s.operator.kernelDisabled(corenet.CapabilityUDPPktinfo)
      - bind: asked, on, why
        eval: enableDestination(source, pc)
        to: enableDestination
      - opt:
          do:
            - return: "false"
          when: "!asked"
      - lock:
          mutex: s.dst.mu
      - op: ++
        set: s.dst.asked
      - opt:
          do:
            - op: ++
              set: s.dst.on
            - return: "true"
          when: "on"
      - opt:
          do:
            - set: s.dst.why
              value: why
          when: s.dst.why == ""
      - return: "false"
  - of: (*Server).pktinfoCapability
    participants:
      - id: caller
        kind: actor
      - id: (*Server).pktinfoCapability
        kind: self
      - id: s.operator.kernelSwitches
        kind: internal
    steps:
      - bind: row
        eval: "corenet.CapabilityValue{Name: corenet.CapabilityUDPPktinfo, Class: classKernel}"
      - opt:
          do:
            - set: _, row.Reason
              to: s.operator.kernelSwitches
              value: s.operator.kernelSwitches()
            - set: row.Status
              value: statusDisabled
            - return: "[]corenet.CapabilityValue{row}"
          when: s.operator.kernelDisabled(corenet.CapabilityUDPPktinfo)
      - lock:
          mutex: s.dst.mu
      - switch:
          cases:
            - case: s.dst.asked == 0
              do:
                - return: nil
            - case: s.dst.on > 0
              do:
                - set: row.Status
                  value: statusOn
            - case: s.dst.why == destinationUnavailable
              do:
                - set: row.Status, row.Reason
                  value: statusUnprobed, s.dst.why
            - default: true
              do:
                - set: row.Status, row.Reason
                  value: statusAbsent, s.dst.why
      - return: "[]corenet.CapabilityValue{row}"
  - of: enableKernelDrops
    participants:
      - id: caller
        kind: actor
      - id: enableKernelDrops
        kind: self
      - id: reader.enableRxqOvfl
        kind: internal
    steps:
      - bind: reader, ok
        eval: source.(*multiReader)
      - opt:
          do:
            - return: false, "the socket is read one datagram a call"
          when: "!ok"
      - opt:
          do:
            - return: "false, \"setsockopt SO_RXQ_OVFL: \" + err.Error()"
          init:
            bind: err
            eval: reader.enableRxqOvfl(drops)
            to: reader.enableRxqOvfl
          when: err != nil
      - return: true, ""
  - of: newPooledConn
    steps:
      - return: "&conn{}"
  - of: New
    participants:
      - id: caller
        kind: actor
      - id: New
        kind: self
      - id: newServer
        kind: internal
    steps:
      - return: newServer(os.LookupEnv, opts...)
        to: newServer
  - of: newServer
    participants:
      - id: caller
        kind: actor
      - id: newServer
        kind: self
      - id: readOperator
        kind: internal
      - id: readPlatform
        kind: internal
      - id: context
        kind: stdlib
      - id: s.phase.Store
        kind: value
    steps:
      - bind: s
        eval: |-
          &Server{
          		byName:       make(map[string]*StreamGroup, expectedGroups),
          		packetByName: make(map[string]*PacketGroup, expectedGroups),
          		live:         make(map[uint64]stdnet.Conn, expectedLiveConns),
          		drainTimeout: defaultDrainTimeout,
          		connPool:     recycler.NewPool(newPooledConn),
          		clk:          clock.System,
          		lookup:       lookup,
          		stall:        stallWatch{stalled: make(chan struct{})},
          	}
      - loop:
          do:
            - eval: opt(s)
          key: _
          range: opts
          value: opt
      - set: s.operator
        to: readOperator
        value: readOperator(s.lookup)
      - set: s.startLane
        value: startPacketLane
      - set: s.platform
        to: readPlatform
        value: readPlatform()
      - set: s.runCtx
        to: context
        value: context.Background()
      - eval: s.phase.Store(uint32(corenet.PhaseNew))
        to: s.phase.Store
      - return: s
  - of: (*Server).Group
    participants:
      - id: caller
        kind: actor
      - id: (*Server).Group
        kind: self
      - id: group.reconcileName
        kind: internal
      - id: s.recordDeclError
        kind: internal
    steps:
      - bind: group
        eval: "&StreamGroup{name: name}"
      - loop:
          do:
            - eval: opt(group)
          key: _
          range: opts
          value: opt
      - eval: group.reconcileName()
        to: group.reconcileName
      - set: name
        value: group.name
      - lock:
          mutex: s.mu
      - opt:
          do:
            - eval: |-
                s.recordDeclError(errs.Wrap(corenet.GroupDuplicate, errs.WrapParams{},
                			errs.String("group", name)))
              to: s.recordDeclError
            - return: "&StreamGroup{name: name}"
          init:
            bind: _, exists
            eval: s.byName[name]
          when: exists
      - set: s.byName[name]
        value: group
      - set: s.groups
        value: append(s.groups, group)
      - return: group
  - of: (*Server).PacketGroup
    participants:
      - id: caller
        kind: actor
      - id: (*Server).PacketGroup
        kind: self
      - id: shim.reconcileName
        kind: internal
      - id: s.recordDeclError
        kind: internal
      - id: s.judgePacketOptions
        kind: internal
      - id: shim.kinds.has
        kind: internal
    steps:
      - bind: shim
        eval: "&StreamGroup{name: name}"
      - loop:
          do:
            - eval: opt(shim)
          key: _
          range: opts
          value: opt
      - eval: shim.reconcileName()
        to: shim.reconcileName
      - set: name
        value: shim.name
      - lock:
          mutex: s.mu
      - bind: _, streamTaken
        eval: s.byName[name]
      - bind: _, packetTaken
        eval: s.packetByName[name]
      - opt:
          do:
            - eval: |-
                s.recordDeclError(errs.Wrap(corenet.GroupDuplicate, errs.WrapParams{},
                			errs.String("group", name)))
              to: s.recordDeclError
            - return: "&PacketGroup{name: name}"
          when: streamTaken || packetTaken
      - bind: group
        eval: "&PacketGroup{name: name}"
      - eval: s.judgePacketOptions(shim)
        to: s.judgePacketOptions
      - set: group.addrs
        value: shim.addrs
      - set: group.limits
        value: shim.limits
      - set: group.adopt
        value: shim.adopt
      - set: group.batchReplies
        to: shim.kinds.has
        value: shim.kinds.has(corenet.OptionBatchReplies)
      - set: group.kinds
        value: shim.kinds
      - set: group.steer
        value: shim.steer
      - set: s.packetByName[name]
        value: group
      - set: s.packetGroups
        value: append(s.packetGroups, group)
      - return: group
  - of: (*Server).judgePacketOptions
    participants:
      - id: caller
        kind: actor
      - id: (*Server).judgePacketOptions
        kind: self
      - id: s.recordDeclError
        kind: internal
      - id: shim.engineRefusal
        kind: internal
      - id: shim.protocolsRefusal
        kind: internal
      - id: packetReuseRefusal
        kind: internal
    steps:
      - opt:
          do:
            - eval: s.recordDeclError(shim.declErr)
              to: s.recordDeclError
          when: shim.declErr != nil
      - opt:
          do:
            - eval: |-
                s.recordDeclError(errs.Wrap(corenet.LoopOptionUnsupported, errs.WrapParams{},
                			errs.String("group", shim.name), errs.String("option", "Loop")))
              to: s.recordDeclError
          when: shim.loopSet
      - opt:
          do:
            - eval: s.recordDeclError(err)
              to: s.recordDeclError
          init:
            bind: err
            eval: shim.engineRefusal()
            to: shim.engineRefusal
          when: err != nil
      - opt:
          do:
            - eval: s.recordDeclError(err)
              to: s.recordDeclError
          init:
            bind: err
            eval: shim.protocolsRefusal()
            to: shim.protocolsRefusal
          when: err != nil
      - opt:
          do:
            - eval: s.recordDeclError(err)
              to: s.recordDeclError
          init:
            bind: err
            eval: packetReuseRefusal(shim)
            to: packetReuseRefusal
          when: err != nil
      - loop:
          do:
            - opt:
                do:
                  - eval: |-
                      s.recordDeclError(errs.Wrap(corenet.PacketOptionUnsupported, errs.WrapParams{},
                      				errs.String("group", shim.name), errs.String("option", k.String())))
                    to: s.recordDeclError
                  - return: ""
                when: "!packetHonours(k)"
          key: _
          range: shim.kinds.list()
          value: k
  - of: packetHonours
    steps:
      - switch:
          cases:
            - case: corenet.OptionMaxPacketSize, corenet.OptionBatchSize, corenet.OptionBatchReplies, corenet.OptionAdopt, corenet.OptionName, corenet.OptionEngine, corenet.OptionPlaintext, corenet.OptionReceiveBuffer, corenet.OptionSendBuffer, corenet.OptionShards, corenet.OptionSteer, corenet.OptionShareAddress
              do:
                - return: "true"
            - default: true
              do:
                - return: "false"
          "on": k
  - of: (*Server).foldProxyRefused
    participants:
      - id: caller
        kind: actor
      - id: (*Server).foldProxyRefused
        kind: self
      - id: group.proxyPolicy.refused.Load
        kind: value
    steps:
      - loop:
          do:
            - bind: group, ok
              eval: s.byName[listeners[i].Group]
            - opt:
                do:
                  - continue: true
                when: "!ok || group.proxyPolicy == nil"
            - set: listeners[i].ProxyRefused
              to: group.proxyPolicy.refused.Load
              value: group.proxyPolicy.refused.Load()
          key: i
          range: listeners
  - of: (*Server).recordDeclError
    steps:
      - opt:
          do:
            - set: s.declErr
              value: err
          when: s.declErr == nil
  - of: (*Server).State
    participants:
      - id: caller
        kind: actor
      - id: (*Server).State
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: slices
        kind: stdlib
      - id: s.foldProxyRefused
        kind: internal
      - id: s.foldHTTPCounts
        kind: internal
      - id: s.mu.RUnlock
        kind: value
      - id: s.fallbackMu.Lock
        kind: value
      - id: s.fallbackMu.Unlock
        kind: value
      - id: s.faults
        kind: internal
    steps:
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: listeners
        eval: slices.Clone(s.states)
        to: slices
      - eval: s.foldProxyRefused(listeners)
        to: s.foldProxyRefused
      - eval: s.foldHTTPCounts(listeners)
        to: s.foldHTTPCounts
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - eval: s.fallbackMu.Lock()
        to: s.fallbackMu.Lock
      - bind: fallbacks
        eval: s.fallbacks
      - eval: s.fallbackMu.Unlock()
        to: s.fallbackMu.Unlock
      - bind: override
        eval: s.operator.override
      - set: override.Disabled
        to: slices
        value: slices.Clone(override.Disabled)
      - bind: st
        eval: |-
          corenet.StateValue{
          		Phase:            corenet.Phase(s.phase.Load()),
          		Listeners:        listeners,
          		ActiveConns:      s.active.Load(),
          		TotalConns:       s.total.Load(),
          		RejectedConns:    s.rejected.Load(),
          		OversizedPackets: s.oversized.Load(),
          		AcceptBackoffs:   s.acceptBackoffs.Load(),
          		SuppressedLogs:   s.errBudget.suppressed.Load(),
          		Datagrams: corenet.DatagramStateValue{
          			TruncatedPackets: s.datagrams.truncated.Load(),
          			GSOOversized:     s.datagrams.gsoOversized.Load(),
          			ReplyFailures:    s.datagrams.replyFailures.Load(),
          			KernelDrops:      s.datagrams.kernelDrops.Load(),
          			Capabilities:     s.datagramCapabilities(),
          		},
          		Loops:     s.loopStates(),
          		Override:  override,
          		Fallbacks: fallbacks,
          		Platform:  s.platform,
          	}
      - set: st.Faults
        to: s.faults
        value: s.faults(st)
      - return: st
  - of: (*Server).recordFallback
    participants:
      - id: caller
        kind: actor
      - id: (*Server).recordFallback
        kind: self
      - id: s.clk.Now
        kind: value
    steps:
      - lock:
          mutex: s.fallbackMu
      - op: ++
        set: s.fallbacks.Count
      - set: s.fallbacks.LastGroup
        value: group
      - set: s.fallbacks.LastReason
        value: reason
      - set: s.fallbacks.LastAt
        to: s.clk.Now
        value: s.clk.Now()
  - of: shareRefusal
    participants:
      - id: caller
        kind: actor
      - id: shareRefusal
        kind: self
      - id: shareRefusalFor
        kind: internal
    steps:
      - return: shareRefusalFor(group, familyRefusal, reusePortSupported())
        to: shareRefusalFor
  - of: packetReuseRefusal
    participants:
      - id: caller
        kind: actor
      - id: packetReuseRefusal
        kind: self
      - id: unixgramShardsRefusal
        kind: internal
      - id: shareRefusal
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: unixgramShardsRefusal(shim)
            to: unixgramShardsRefusal
          when: err != nil
      - return: shareRefusal(shim, corenet.PacketOptionUnsupported)
        to: shareRefusal
  - of: shareRefusalFor
    participants:
      - id: caller
        kind: actor
      - id: shareRefusalFor
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: nil
          when: "!group.kinds.has(corenet.OptionShareAddress)"
      - opt:
          do:
            - return: |-
                errs.Wrap(coreproc.UnsupportedPlatform, errs.WrapParams{},
                			errs.String("group", group.name), errs.String("option", corenet.OptionShareAddress.String()),
                			errs.String("goos", runtime.GOOS))
              to: errs
          when: "!reusePort"
      - loop:
          do:
            - opt:
                do:
                  - return: |-
                      errs.Wrap(familyRefusal, errs.WrapParams{},
                      				errs.String("group", group.name), errs.String("option", corenet.OptionShareAddress.String()),
                      				errs.String("network", addr.Network))
                    to: errs
                when: "!shardable(addr.Network)"
          key: _
          range: group.addrs
          value: addr
      - return: nil
  - of: mustProbe
    participants:
      - id: caller
        kind: actor
      - id: mustProbe
        kind: self
      - id: stdnet
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "false"
          when: count <= 1 || share
      - bind: _, port, err
        eval: stdnet.SplitHostPort(addr.Addr)
        to: stdnet
      - opt:
          do:
            - return: "false"
          when: err != nil || port == "0"
      - return: "true"
  - of: probeAddress
    participants:
      - id: caller
        kind: actor
      - id: probeAddress
        kind: self
      - id: cfg.Listen
        kind: value
      - id: cfg.ListenPacket
        kind: value
      - id: bindRefusal
        kind: internal
      - id: sock.Close
        kind: value
      - id: errs
        kind: package
    steps:
      - var:
          name: cfg
          type: stdnet.ListenConfig
      - var:
          name: sock
          type: io.Closer
      - var:
          name: err
          type: error
      - alt:
          - do:
              - set: sock, err
                to: cfg.Listen
                value: cfg.Listen(ctx, addr.Network, addr.Addr)
            when: stream
          - do:
              - set: sock, err
                to: cfg.ListenPacket
                value: cfg.ListenPacket(ctx, addr.Network, addr.Addr)
            else: true
      - opt:
          do:
            - return: bindRefusal(addr, err)
              to: bindRefusal
          when: err != nil
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.ListenFailed, errs.WrapParams{},
                			errs.String("address", addr.String()), errs.String("cause", cerr.Error()))
              to: errs
          init:
            bind: cerr
            eval: sock.Close()
            to: sock.Close
          when: cerr != nil
      - return: nil
  - of: bindRefusal
    participants:
      - id: caller
        kind: actor
      - id: bindRefusal
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.AddressInUse, errs.WrapParams{},
                			errs.String("address", addr.String()), errs.String("cause", cause.Error()))
              to: errs
          when: bindConflict(cause)
      - return: |-
          errs.Wrap(corenet.ListenFailed, errs.WrapParams{},
          		errs.String("address", addr.String()), errs.String("cause", cause.Error()))
        to: errs
  - of: (*Server).HTTP
    participants:
      - id: caller
        kind: actor
      - id: (*Server).HTTP
        kind: self
      - id: s.simpleGroup
        kind: internal
      - id: g.mountHTTPEntry
        kind: internal
      - id: g.recordErr
        kind: internal
    steps:
      - bind: g
        eval: s.simpleGroup("tcp", addr, opts)
        to: s.simpleGroup
      - opt:
          do:
            - eval: g.recordErr(err)
              to: g.recordErr
          init:
            bind: err
            eval: g.mountHTTPEntry(h)
            to: g.mountHTTPEntry
          when: err != nil
      - return: g
  - of: (*Server).TCP
    participants:
      - id: caller
        kind: actor
      - id: (*Server).TCP
        kind: self
      - id: s.simpleGroup
        kind: internal
      - id: g.mountTCPEntry
        kind: internal
      - id: g.recordErr
        kind: internal
    steps:
      - bind: g
        eval: s.simpleGroup("tcp", addr, opts)
        to: s.simpleGroup
      - opt:
          do:
            - eval: g.recordErr(err)
              to: g.recordErr
          init:
            bind: err
            eval: g.mountTCPEntry(h)
            to: g.mountTCPEntry
          when: err != nil
      - return: g
  - of: (*Server).UDP
    participants:
      - id: caller
        kind: actor
      - id: (*Server).UDP
        kind: self
      - id: s.PacketGroup
        kind: internal
      - id: g.mountUDPEntry
        kind: internal
      - id: s.recordGroupErr
        kind: internal
    steps:
      - bind: g
        eval: s.PacketGroup("", append([]GroupOption{Listen("udp", addr), defaultName("udp+" + addr)}, opts...)...)
        to: s.PacketGroup
      - opt:
          do:
            - eval: s.recordGroupErr(err)
              to: s.recordGroupErr
          init:
            bind: err
            eval: g.mountUDPEntry(h)
            to: g.mountUDPEntry
          when: err != nil
      - return: g
  - of: (*PacketGroup).mountUDPEntry
    participants:
      - id: caller
        kind: actor
      - id: (*PacketGroup).mountUDPEntry
        kind: self
      - id: errs
        kind: package
      - id: unsupported
        kind: internal
      - id: g.Handle
        kind: internal
    steps:
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.HandlerMissing, errs.WrapParams{},
                			errs.String("group", g.name), errs.String("entry", entryUDP))
              to: errs
          when: isNil(h)
      - bind: ph, ok
        eval: h.(corenet.PacketHandler)
      - opt:
          do:
            - return: unsupported(g.name, entryUDP, h)
              to: unsupported
          when: "!ok"
      - eval: g.Handle(ph)
        to: g.Handle
      - return: nil
  - of: (*Server).simpleGroup
    participants:
      - id: caller
        kind: actor
      - id: (*Server).simpleGroup
        kind: self
      - id: s.Group
        kind: internal
    steps:
      - return: s.Group("", append([]GroupOption{Listen(network, addr), defaultName(network + "+" + addr)}, opts...)...)
        to: s.Group
  - of: defaultName
    steps:
      - return:
          closure:
            params: g *StreamGroup
            steps:
              - set: g.name, g.defaultName
                value: name, name
  - of: (*Server).recordGroupErr
    participants:
      - id: caller
        kind: actor
      - id: (*Server).recordGroupErr
        kind: self
      - id: s.recordDeclError
        kind: internal
    steps:
      - lock:
          mutex: s.mu
      - eval: s.recordDeclError(err)
        to: s.recordDeclError
  - of: (*StreamGroup).recordErr
    steps:
      - opt:
          do:
            - set: g.declErr
              value: err
          when: g.declErr == nil
  - of: (*StreamGroup).mountHTTPEntry
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).mountHTTPEntry
        kind: self
      - id: g.missing
        kind: internal
      - id: g.HandleHTTP
        kind: internal
      - id: g.HandleLoop
        kind: internal
      - id: g.pickRefusal
        kind: internal
    steps:
      - opt:
          do:
            - return: g.missing(entryHTTP)
              to: g.missing
          when: isNil(h)
      - bind: std, isStd
        eval: h.(http.Handler)
      - bind: h1, isH1
        eval: h.(corenet.HTTP1Handler)
      - switch:
          cases:
            - case: corenet.EngineGoroutine
              do:
                - eval: g.HandleHTTP(std)
                  to: g.HandleHTTP
            - case: corenet.EngineLoop
              do:
                - eval: g.HandleLoop(http1.HandleLoop(h1, http1.Parser{}))
                  to: g.HandleLoop
            - default: true
              do:
                - return: g.pickRefusal(entryHTTP, h, isStd, isH1)
                  to: g.pickRefusal
          "on": g.pickEngine(isStd, isH1)
      - return: nil
  - of: (*StreamGroup).mountTCPEntry
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).mountTCPEntry
        kind: self
      - id: g.missing
        kind: internal
      - id: errs
        kind: package
      - id: g.Handle
        kind: internal
      - id: g.HandleLoop
        kind: internal
      - id: g.pickRefusal
        kind: internal
    steps:
      - opt:
          do:
            - return: g.missing(entryTCP)
              to: g.missing
          when: isNil(h)
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.HandlerUnsupported, errs.WrapParams{},
                			errs.String("group", g.name), errs.String("entry", entryTCP), errs.String("type", typeName(h)),
                			errs.String("serve", entryHTTP))
              to: errs
          when: isHTTPHandler(h)
      - bind: conn, isConn
        eval: h.(corenet.ConnHandler)
      - bind: lh, isLoop
        eval: h.(corenet.LoopHandler)
      - switch:
          cases:
            - case: corenet.EngineGoroutine
              do:
                - eval: g.Handle(conn)
                  to: g.Handle
            - case: corenet.EngineLoop
              do:
                - eval: g.HandleLoop(lh)
                  to: g.HandleLoop
            - default: true
              do:
                - return: g.pickRefusal(entryTCP, h, isConn, isLoop)
                  to: g.pickRefusal
          "on": g.pickEngine(isConn, isLoop)
      - return: nil
  - of: (*StreamGroup).pickEngine
    steps:
      - bind: e
        eval: corenet.EngineAuto
      - opt:
          do:
            - set: e
              value: g.engine
          when: g.kinds.has(corenet.OptionEngine)
      - opt:
          do:
            - return: corenet.EngineGoroutine
          when: goroutine && fits(e, corenet.EngineGoroutine, loop)
      - opt:
          do:
            - return: corenet.EngineLoop
          when: loop && fits(e, corenet.EngineLoop, goroutine)
      - return: corenet.EngineAuto
  - of: fits
    steps:
      - return: e == want || (e == corenet.EngineAuto && !other)
  - of: (*StreamGroup).pickRefusal
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).pickRefusal
        kind: self
      - id: errs
        kind: package
      - id: unsupported
        kind: internal
    steps:
      - switch:
          cases:
            - case: goroutine && loop && !g.kinds.has(corenet.OptionEngine)
              do:
                - return: |-
                    errs.Wrap(corenet.HandlerAmbiguous, errs.WrapParams{},
                    			errs.String("group", g.name), errs.String("entry", entry), errs.String("type", typeName(h)))
                  to: errs
            - case: goroutine || loop
              do:
                - return: |-
                    errs.Wrap(corenet.EngineUnsupported, errs.WrapParams{},
                    			errs.String("group", g.name), errs.String("engine", g.engine.String()))
                  to: errs
            - default: true
              do:
                - return: unsupported(g.name, entry, h)
                  to: unsupported
  - of: (*StreamGroup).missing
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).missing
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(corenet.HandlerMissing, errs.WrapParams{},
          		errs.String("group", g.name), errs.String("entry", entry))
        to: errs
  - of: unsupported
    participants:
      - id: caller
        kind: actor
      - id: unsupported
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(corenet.HandlerUnsupported, errs.WrapParams{},
          		errs.String("group", group), errs.String("entry", entry), errs.String("type", typeName(h)))
        to: errs
  - of: isHTTPHandler
    steps:
      - bind: _, std
        eval: h.(http.Handler)
      - bind: _, h1
        eval: h.(corenet.HTTP1Handler)
      - return: std || h1
  - of: isNil
    participants:
      - id: caller
        kind: actor
      - id: isNil
        kind: self
      - id: reflect
        kind: stdlib
      - id: v.IsNil
        kind: value
    steps:
      - opt:
          do:
            - return: "true"
          when: h == nil
      - bind: v
        eval: reflect.ValueOf(h)
        to: reflect
      - switch:
          cases:
            - case: reflect.Pointer, reflect.Map, reflect.Func, reflect.Interface, reflect.Slice, reflect.Chan
              do:
                - return: v.IsNil()
                  to: v.IsNil
            - default: true
              do:
                - return: "false"
          "on": v.Kind()
  - of: typeName
    participants:
      - id: caller
        kind: actor
      - id: typeName
        kind: self
      - id: reflect.TypeOf(h).String
        kind: value
    steps:
      - return: reflect.TypeOf(h).String()
        to: reflect.TypeOf(h).String
  - of: (*StreamGroup).servesHTTP
    steps:
      - bind: _, h1
        eval: g.loopHandler.(*http1.LoopHandler)
      - return: g.httpAdapter != nil || h1
  - of: (*StreamGroup).plaintextRefusal
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).plaintextRefusal
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: nil
          when: "!g.servesHTTP() || g.kinds.has(corenet.OptionTLS) || g.kinds.has(corenet.OptionPlaintext)"
      - return: errs.Wrap(corenet.PlaintextRequired, errs.WrapParams{}, errs.String("group", g.name))
        to: errs
  - of: sockaddrToAddr
    participants:
      - id: caller
        kind: actor
      - id: sockaddrToAddr
        kind: self
      - id: inet4Addr
        kind: internal
      - id: inet6Addr
        kind: internal
      - id: unixAddr
        kind: internal
    steps:
      - switch:
          cases:
            - case: syscall.AF_INET
              do:
                - return: inet4Addr(raw)
                  to: inet4Addr
            - case: syscall.AF_INET6
              do:
                - return: inet6Addr(raw)
                  to: inet6Addr
            - case: syscall.AF_UNIX
              do:
                - return: unixAddr(raw)
                  to: unixAddr
            - default: true
              do:
                - return: nil
          "on": raw.Addr.Family
  - of: inet4Addr
    steps:
      - bind: sa
        eval: (*syscall.RawSockaddrInet4)(unsafe.Pointer(raw))
      - bind: ip
        eval: make(stdnet.IP, stdnet.IPv4len)
      - eval: copy(ip, sa.Addr[:])
      - return: "&stdnet.UDPAddr{IP: ip, Port: hostPort(sa.Port)}"
  - of: inet6Addr
    participants:
      - id: caller
        kind: actor
      - id: inet6Addr
        kind: self
      - id: zoneOf
        kind: internal
    steps:
      - bind: sa
        eval: (*syscall.RawSockaddrInet6)(unsafe.Pointer(raw))
      - bind: ip
        eval: make(stdnet.IP, stdnet.IPv6len)
      - eval: copy(ip, sa.Addr[:])
      - bind: zone, _
        eval: zoneOf(sa.Scope_id)
        to: zoneOf
      - return: "&stdnet.UDPAddr{IP: ip, Port: hostPort(sa.Port), Zone: zone}"
  - of: hostPort
    steps:
      - return: int(port>>portByteShift) | int(port&portLowByteMask)<<portByteShift
  - of: zoneOf
    participants:
      - id: caller
        kind: actor
      - id: zoneOf
        kind: self
      - id: stdnet
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "\"\", false"
          when: scope == 0
      - bind: iface, err
        eval: stdnet.InterfaceByIndex(int(scope))
        to: stdnet
      - opt:
          do:
            - return: "\"\", false"
          when: err != nil
      - return: iface.Name, true
  - of: hostSomaxconn
    participants:
      - id: caller
        kind: actor
      - id: hostSomaxconn
        kind: self
      - id: os
        kind: stdlib
      - id: strconv
        kind: stdlib
    steps:
      - bind: raw, err
        eval: os.ReadFile("/proc/sys/net/core/somaxconn")
        to: os
      - opt:
          do:
            - return: "0"
          when: err != nil
      - bind: n, err
        eval: strconv.Atoi(strings.TrimSpace(string(raw)))
        to: strconv
      - opt:
          do:
            - return: "0"
          when: err != nil || n < 0
      - return: "n"
  - of: (*Server).startStallWatch
    participants:
      - id: caller
        kind: actor
      - id: (*Server).startStallWatch
        kind: self
      - id: worker
        kind: package
    steps:
      - lock:
          mutex: s.mu
      - opt:
          do:
            - return: ""
          when: len(s.loopEngines) == 0 || s.stall.daemon != nil
      - set: s.stall.daemon
        to: worker
        value: worker.Every(stallPoll, s.checkStalls, worker.WithClock(s.clk))
  - of: (*Server).stopStallWatch
    participants:
      - id: caller
        kind: actor
      - id: (*Server).stopStallWatch
        kind: self
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
      - id: daemon.Stop
        kind: value
    steps:
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - bind: daemon
        eval: s.stall.daemon
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - opt:
          do:
            - return: ""
          when: daemon == nil
      - eval: daemon.Stop()
        to: daemon.Stop
  - of: (*Server).checkStalls
    participants:
      - id: caller
        kind: actor
      - id: (*Server).checkStalls
        kind: self
      - id: s.markStalled
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: corenet.Phase(s.phase.Load()) != corenet.PhaseServing
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: "!groupStalled(st)"
            - eval: s.markStalled(st.Group)
              to: s.markStalled
            - return: ""
          key: _
          range: s.loopStates()
          value: st
  - of: (*Server).markStalled
    participants:
      - id: caller
        kind: actor
      - id: (*Server).markStalled
        kind: self
      - id: s.stall.mu.Lock
        kind: value
      - id: s.clk.Now
        kind: value
      - id: s.stall.mu.Unlock
        kind: value
      - id: s.stall.once.Do
        kind: value
    steps:
      - eval: s.stall.mu.Lock()
        to: s.stall.mu.Lock
      - opt:
          do:
            - set: s.stall.group
              value: group
            - set: s.stall.at
              to: s.clk.Now
              value: s.clk.Now()
          when: s.stall.group == ""
      - eval: s.stall.mu.Unlock()
        to: s.stall.mu.Unlock
      - eval: s.stall.once.Do(func() { close(s.stall.stalled) })
        to: s.stall.once.Do
  - of: (*Server).stalledGroup
    steps:
      - lock:
          mutex: s.stall.mu
      - return: s.stall.group, s.stall.at
  - of: stallError
    participants:
      - id: caller
        kind: actor
      - id: stallError
        kind: self
      - id: errs
        kind: package
    steps:
      - return: errs.Wrap(corenet.LoopGroupStalled, errs.WrapParams{}, errs.String("group", group))
        to: errs
  - of: unixgramShardsRefusal
    participants:
      - id: caller
        kind: actor
      - id: unixgramShardsRefusal
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: nil
          when: "!shim.kinds.has(corenet.OptionShards) || shim.limits.Shards <= 1"
      - loop:
          do:
            - opt:
                do:
                  - return: |-
                      errs.Wrap(corenet.PacketOptionUnsupported, errs.WrapParams{},
                      				errs.String("group", shim.name), errs.String("option", corenet.OptionShards.String()))
                    to: errs
                when: "!shardable(addr.Network)"
          key: _
          range: shim.addrs
          value: addr
      - return: nil
  - of: (*Server).probeSteer
    participants:
      - id: caller
        kind: actor
      - id: (*Server).probeSteer
        kind: self
      - id: attachSteer
        kind: internal
      - id: err.Error
        kind: value
    steps:
      - opt:
          do:
            - return: ""
          when: steer != corenet.SteerCPU || s.operator.kernelDisabled(corenet.CapabilityReuseportCBPF)
      - lock:
          mutex: s.steer.mu
      - op: ++
        set: s.steer.asked
      - bind: err
        eval: attachSteer(sockets)
        to: attachSteer
      - opt:
          do:
            - op: ++
              set: s.steer.on
            - return: ""
          when: err == nil
      - opt:
          do:
            - set: s.steer.why
              to: err.Error
              value: err.Error()
          when: s.steer.why == ""
  - of: (*Server).steerCapability
    participants:
      - id: caller
        kind: actor
      - id: (*Server).steerCapability
        kind: self
      - id: s.operator.kernelSwitches
        kind: internal
    steps:
      - bind: row
        eval: "corenet.CapabilityValue{Name: corenet.CapabilityReuseportCBPF, Class: classCode}"
      - opt:
          do:
            - set: _, row.Reason
              to: s.operator.kernelSwitches
              value: s.operator.kernelSwitches()
            - set: row.Status
              value: statusDisabled
            - return: "[]corenet.CapabilityValue{row}"
          when: s.operator.kernelDisabled(corenet.CapabilityReuseportCBPF)
      - lock:
          mutex: s.steer.mu
      - switch:
          cases:
            - case: s.steer.asked == 0
              do:
                - return: nil
            - case: s.steer.on > 0
              do:
                - set: row.Status
                  value: statusOn
            - default: true
              do:
                - set: row.Status, row.Reason
                  value: statusAbsent, s.steer.why
      - return: "[]corenet.CapabilityValue{row}"
  - of: attachSteer
    participants:
      - id: caller
        kind: actor
      - id: attachSteer
        kind: self
      - id: cpuModProgram
        kind: internal
      - id: packetSocket(sockets[0]).SyscallConn
        kind: value
      - id: raw.Control
        kind: value
      - id: cmp
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil
          when: len(sockets) <= 1
      - bind: program
        eval: cpuModProgram(uint32(len(sockets)))
        to: cpuModProgram
      - bind: raw, err
        eval: packetSocket(sockets[0]).SyscallConn()
        to: packetSocket(sockets[0]).SyscallConn
      - opt:
          do:
            - return: err
          when: err != nil
      - var:
          name: attachErr
          type: error
      - bind: cerr
        eval: |-
          raw.Control(func(fd uintptr) {
          		attachErr = steerAttach(int(fd), program)
          	})
        to: raw.Control
      - return: cmp.Or(cerr, attachErr)
        to: cmp
  - of: cpuModProgram
    steps:
      - bind: offset
        eval: skfAdOff + skfAdCPU
      - return: |-
          []sockFilter{
          		{code: bpfLdWAbs, k: uint32(offset)},
          		{code: bpfAluModK, k: n},
          		{code: bpfRetA},
          	}
  - of: (*StreamGroup).Name
    steps:
      - return: g.name
  - of: (*StreamGroup).Handle
    steps:
      - opt:
          do:
            - return: g
          when: "!g.claimHandler()"
      - set: g.handler
        value: h
      - return: g
  - of: (*StreamGroup).claimHandler
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).claimHandler
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - set: g.declared
              value: "true"
            - return: "true"
          when: "!g.declared"
      - opt:
          do:
            - set: g.declErr
              to: errs
              value: |-
                errs.Wrap(corenet.HandlerAlreadySet, errs.WrapParams{},
                			errs.String("group", g.name))
          when: g.declErr == nil
      - return: "false"
  - of: (*StreamGroup).HandleFunc
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).HandleFunc
        kind: self
      - id: g.Handle
        kind: internal
    steps:
      - return: g.Handle(f)
        to: g.Handle
  - of: (*StreamGroup).HandleHTTP
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).HandleHTTP
        kind: self
      - id: g.mountHTTP
        kind: internal
    steps:
      - return: g.mountHTTP(h)
        to: g.mountHTTP
  - of: (*StreamGroup).mountHTTP
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).mountHTTP
        kind: self
      - id: newHTTPAdapter
        kind: internal
    steps:
      - opt:
          do:
            - return: g
          when: "!g.claimHandler()"
      - bind: adapter
        eval: newHTTPAdapter(h)
        to: newHTTPAdapter
      - set: g.httpAdapter
        value: adapter
      - set: g.handler
        value: adapter
      - return: g
  - of: (*StreamGroup).tracksCloses
    steps:
      - return: g.httpAdapter != nil && g.limiter != nil
  - of: (*StreamGroup).Use
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).Use
        kind: self
      - id: g.kinds.add
        kind: internal
    steps:
      - set: g.middlewares
        value: append(g.middlewares, middlewares...)
      - eval: g.kinds.add(corenet.OptionMiddleware)
        to: g.kinds.add
      - return: g
  - of: (*StreamGroup).UseLoop
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).UseLoop
        kind: self
      - id: g.kinds.add
        kind: internal
    steps:
      - set: g.loopMiddlewares
        value: append(g.loopMiddlewares, middlewares...)
      - eval: g.kinds.add(corenet.OptionLoopMiddleware)
        to: g.kinds.add
      - return: g
  - of: (*StreamGroup).resolved
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).resolved
        kind: self
      - id: g.effectiveHTTP2
        kind: internal
      - id: corenet
        kind: package
    steps:
      - opt:
          do:
            - set: g.httpAdapter.timeouts
              value: g.timeouts
            - set: g.httpAdapter.bounds
              value: g.http
            - set: g.httpAdapter.protocols
              value: "&g.httpProtos.accepted"
            - set: g.httpAdapter.http2
              to: g.effectiveHTTP2
              value: g.effectiveHTTP2()
          when: g.httpAdapter != nil
      - bind: chained
        eval: corenet.Chain(g.handler, g.middlewares...)
        to: corenet
      - opt:
          do:
            - return: chained
          when: g.identity.IsZero()
      - return: "&handshakeHandler{next: chained, timeouts: g.timeouts, log: g.hsLog}"
  - of: newConnLimiter
    steps:
      - opt:
          do:
            - return: nil
          when: limits.MaxConns <= 0
      - return: |-
          &connLimiter{
          		slots:   make(chan struct{}, limits.MaxConns),
          		ceiling: limits.MaxConns,
          	}
  - of: (*connLimiter).tryAcquire
    steps:
      - select:
          cases:
            - comm: l.slots <- struct{}{}
              do:
                - return: "true"
            - default: true
              do:
                - return: "false"
  - of: (*connLimiter).release
    steps:
      - eval: <-l.slots
  - of: (*connLimiter).releaseFor
    participants:
      - id: caller
        kind: actor
      - id: (*connLimiter).releaseFor
        kind: self
      - id: hijackedTracker
        kind: internal
      - id: tracked.holdSlot
        kind: internal
      - id: l.release
        kind: internal
    steps:
      - opt:
          do:
            - eval: tracked.holdSlot(l)
              to: tracked.holdSlot
            - return: ""
          init:
            bind: tracked
            eval: hijackedTracker(c)
            to: hijackedTracker
          when: tracked != nil
      - eval: l.release()
        to: l.release
  - of: markRefused
    steps:
      - opt:
          do:
            - set: pooled.refused
              value: "true"
          init:
            bind: pooled, ok
            eval: c.(*conn)
          when: ok
  - of: (*Server).admit
    participants:
      - id: caller
        kind: actor
      - id: (*Server).admit
        kind: self
      - id: admitted.Add
        kind: value
      - id: handler.ServeConn
        kind: value
      - id: s.rejected.Add
        kind: value
      - id: markRefused
        kind: internal
      - id: errs
        kind: package
      - id: limiter.releaseFor
        kind: internal
    steps:
      - opt:
          do:
            - eval: admitted.Add(1)
              to: admitted.Add
            - return: handler.ServeConn(ctx, c)
              to: handler.ServeConn
          when: limiter == nil
      - opt:
          do:
            - eval: s.rejected.Add(1)
              to: s.rejected.Add
            - eval: markRefused(c)
              to: markRefused
            - return: |-
                errs.Wrap(corenet.ConnLimitReached, errs.WrapParams{},
                			errs.Int("limit", limiter.ceiling))
              to: errs
          when: "!limiter.tryAcquire()"
      - eval: admitted.Add(1)
        to: admitted.Add
      - defer: limiter.releaseFor(c)
        to: limiter.releaseFor
      - return: handler.ServeConn(ctx, c)
        to: handler.ServeConn
  - of: Protocols
    participants:
      - id: caller
        kind: actor
      - id: Protocols
        kind: self
      - id: slices
        kind: stdlib
      - id: g.kinds.add
        kind: internal
    steps:
      - bind: kept
        eval: slices.Clone(protos)
        to: slices
      - return:
          closure:
            params: g *StreamGroup
            steps:
              - set: g.protos
                value: kept
              - eval: g.kinds.add(corenet.OptionProtocols)
                to: g.kinds.add
  - of: (*StreamGroup).protocolsRefusal
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).protocolsRefusal
        kind: self
      - id: g.http2Refusal
        kind: internal
      - id: g.kinds.has
        kind: internal
      - id: g.protocolsErr
        kind: internal
      - id: g.identity.IsZero
        kind: value
      - id: checkProtocols
        kind: internal
      - id: g.computeProtocols
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: g.http2Refusal()
            to: g.http2Refusal
          when: err != nil
      - bind: set
        eval: g.kinds.has(corenet.OptionProtocols)
        to: g.kinds.has
      - opt:
          do:
            - opt:
                do:
                  - return: g.protocolsErr("handler")
                    to: g.protocolsErr
                when: set
            - return: nil
          when: g.httpAdapter == nil
      - bind: tlsOn
        eval: "!g.identity.IsZero()"
        to: g.identity.IsZero
      - bind: protos
        eval: g.protos
      - opt:
          do:
            - set: protos
              value: "[]string{protoHTTP1}"
            - opt:
                do:
                  - set: protos
                    value: "[]string{protoH2, protoHTTP1}"
                when: tlsOn
          when: "!set"
      - opt:
          do:
            - return: g.protocolsErr(reason)
              to: g.protocolsErr
          init:
            bind: reason
            eval: checkProtocols(protos, tlsOn || g.kinds.has(corenet.OptionPlaintext))
            to: checkProtocols
          when: reason != ""
      - return: g.computeProtocols(protos, tlsOn)
        to: g.computeProtocols
  - of: (*StreamGroup).computeProtocols
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).computeProtocols
        kind: self
      - id: p.accepted.SetHTTP1
        kind: value
      - id: p.accepted.SetHTTP2
        kind: value
      - id: p.accepted.SetUnencryptedHTTP2
        kind: value
      - id: offered
        kind: internal
      - id: g.protocolsErr
        kind: internal
    steps:
      - var:
          name: p
          type: httpProtocols
      - eval: p.accepted.SetHTTP1(slices.Contains(protos, protoHTTP1))
        to: p.accepted.SetHTTP1
      - eval: p.accepted.SetHTTP2(slices.Contains(protos, protoH2))
        to: p.accepted.SetHTTP2
      - eval: p.accepted.SetUnencryptedHTTP2(!tlsOn && slices.Contains(protos, protoH2))
        to: p.accepted.SetUnencryptedHTTP2
      - opt:
          do:
            - bind: alpn, reason
              eval: offered(g.identity.ServerConfig().NextProtos, protos)
              to: offered
            - opt:
                do:
                  - return: g.protocolsErr(reason)
                    to: g.protocolsErr
                when: reason != ""
            - set: p.alpn
              value: alpn
          when: tlsOn
      - set: g.httpProtos
        value: p
      - return: nil
  - of: HTTP2
    participants:
      - id: caller
        kind: actor
      - id: HTTP2
        kind: self
      - id: g.kinds.add
        kind: internal
    steps:
      - return:
          closure:
            params: g *StreamGroup
            steps:
              - set: g.http2Limits
                value: v
              - eval: g.kinds.add(corenet.OptionHTTP2)
                to: g.kinds.add
  - of: (*StreamGroup).http2Refusal
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).http2Refusal
        kind: self
      - id: g.protocolsErr
        kind: internal
      - id: g.http2Limits.Resolve
        kind: value
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: nil
          when: "!g.kinds.has(corenet.OptionHTTP2)"
      - opt:
          do:
            - return: g.protocolsErr("handler")
              to: g.protocolsErr
          when: g.httpAdapter == nil && g.loopHandler == nil && g.handler != nil
      - bind: _, err
        eval: g.http2Limits.Resolve()
        to: g.http2Limits.Resolve
      - opt:
          do:
            - return: errs.Wrap(err, errs.WrapParams{}, errs.String("group", g.name))
              to: errs
          when: err != nil
      - return: nil
  - of: (*StreamGroup).effectiveHTTP2
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).effectiveHTTP2
        kind: self
      - id: g.http2Limits.Resolve
        kind: value
    steps:
      - bind: l, err
        eval: g.http2Limits.Resolve()
        to: g.http2Limits.Resolve
      - opt:
          do:
            - return: |-
                corehttp2.LimitsValue{
                			MaxStreams: corehttp2.DefaultMaxStreams, ReceivePerStream: corehttp2.DefaultReceivePerStream,
                			ReceivePerConn: 4 * corehttp2.DefaultReceivePerStream, MaxFrame: corehttp2.DefaultMaxFrame,
                			HeaderTable: corehttp2.DefaultHeaderTable, MaxHeaderList: corehttp2.DefaultMaxHeaderList,
                		}
          when: err != nil
      - return: l
  - of: (*StreamGroup).http2Bounds
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).http2Bounds
        kind: self
      - id: g.http2Limits.Resolve
        kind: value
    steps:
      - opt:
          do:
            - return: nil
          when: g.httpAdapter == nil && findHTTPCodec(g.loopChain) == nil
      - bind: l, err
        eval: g.http2Limits.Resolve()
        to: g.http2Limits.Resolve
      - opt:
          do:
            - return: nil
          when: err != nil
      - return: "&l"
  - of: (*StreamGroup).servesH2C
    steps:
      - return: g.httpAdapter != nil && g.identity.IsZero() && g.httpProtos.accepted.UnencryptedHTTP2()
  - of: offered
    participants:
      - id: caller
        kind: actor
      - id: offered
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - return: slices.Clone(protos), ""
              to: slices
          when: len(next) == 0
      - bind: alpn
        eval: make([]string, 0, len(next))
      - loop:
          do:
            - opt:
                do:
                  - return: nil, "NextProtos " + n
                when: (n == protoHTTP1 || n == protoH2) && !slices.Contains(protos, n)
            - opt:
                do:
                  - set: alpn
                    value: append(alpn, n)
                when: slices.Contains(protos, n)
          key: _
          range: next
          value: "n"
      - opt:
          do:
            - return: nil, "NextProtos"
          when: len(alpn) == 0
      - return: alpn, ""
  - of: (*StreamGroup).protocolsErr
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).protocolsErr
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(corenet.ProtocolsRefused, errs.WrapParams{},
          		errs.String("group", g.name), errs.String("reason", reason))
        to: errs
  - of: (*StreamGroup).serverTLS
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).serverTLS
        kind: self
      - id: g.identity.ServerConfig
        kind: value
      - id: slices
        kind: stdlib
      - id: tlsFloor
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: g.identity.IsZero()
      - bind: cfg
        eval: g.identity.ServerConfig()
        to: g.identity.ServerConfig
      - opt:
          do:
            - set: cfg.NextProtos
              to: slices
              value: slices.Clone(g.httpProtos.alpn)
          when: g.httpAdapter != nil
      - return: tlsFloor(cfg)
        to: tlsFloor
  - of: http2Config
    steps:
      - return: |-
          &http.HTTP2Config{
          		MaxConcurrentStreams:          l.MaxStreams,
          		MaxReadFrameSize:              l.MaxFrame,
          		MaxDecoderHeaderTableSize:     l.HeaderTable,
          		MaxEncoderHeaderTableSize:     l.HeaderTable,
          		MaxReceiveBufferPerStream:     l.ReceivePerStream,
          		MaxReceiveBufferPerConnection: l.ReceivePerConn,
          		WriteByteTimeout:              write.Duration(),
          		SendPingTimeout:               silence,
          		PingTimeout:                   silence,
          		//: every error net/http's HTTP/2 counts reaches State (#966).
          		CountError: count,
          	}
  - of: h2Silence
    participants:
      - id: caller
        kind: actor
      - id: h2Silence
        kind: self
      - id: b.headerTimeout
        kind: internal
      - id: t.Idle.Duration
        kind: value
    steps:
      - opt:
          do:
            - return: d
          init:
            bind: d
            eval: b.headerTimeout(t.Read.Duration())
            to: b.headerTimeout
          when: d > 0
      - return: t.Idle.Duration()
        to: t.Idle.Duration
  - of: swallowErr
    steps:
      - opt:
          do:
            - return: ""
          when: err == nil
  - of: datagramTruncated
    steps:
      - return: "false"
