    participants:
      - id: caller
        kind: actor
      - id: (*httpAdapter).launch
        kind: self
      - id: newChanListener
        kind: internal
      - id: a.timeouts.Read.Duration
        kind: value
      - id: worker
        kind: package
    steps:
      - lock:
          mutex: a.mu
      - opt:
          do:
            - return: ""
          when: a.stopped
