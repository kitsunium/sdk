          closure:
            params: network, address string, rawConn syscall.RawConn
            results: error
            steps:
              - opt:
                  do:
                    - opt:
                        do:
                          - return: err
                        init:
                          bind: err
                          eval: reusePortControl(network, address, rawConn)
                          to: reusePortControl
                        when: err != nil
                  when: sharded
              - opt:
                  do:
                    - return: nil
                  when: "!exclusiveApplies(network, address)"
              - var:
