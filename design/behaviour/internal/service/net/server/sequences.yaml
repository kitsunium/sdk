        to: a.mu.Lock
      - bind: waiter, waiting
        eval: a.waiters[raw]
      - opt:
          do:
            - eval: delete(a.waiters, raw)
          when: waiting
      - eval: a.mu.Unlock()
        to: a.mu.Unlock
      - opt:
          do:
            - return: ""
          when: "!waiting"
