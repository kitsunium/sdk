        kind: internal
    steps:
      - bind: group
        eval: "&StreamGroup{name: name}"
      - loop:
          do:
            - eval: opt(group)
          key: _
          range: opts
          value: opt
      - eval: group.reconcileName()
        to: group.reconcileName
      - set: name
        value: group.name
      - lock:
          mutex: s.mu
      - opt:
          do:
            - eval: |-
                s.recordDeclError(errs.Wrap(corenet.GroupDuplicate, errs.WrapParams{},
                			errs.String("group", name)))
              to: s.recordDeclError
            - return: "&StreamGroup{name: name}"
          init:
            bind: _, exists
            eval: s.byName[name]
          when: exists
      - set: s.byName[name]
        value: group
      - set: s.groups
        value: append(s.groups, group)
      - return: group
  - of: (*Server).PacketGroup
    participants:
      - id: caller
        kind: actor
      - id: (*Server).PacketGroup
        kind: self
      - id: shim.reconcileName
        kind: internal
      - id: s.recordDeclError
        kind: internal
      - id: s.judgePacketOptions
        kind: internal
    steps:
      - bind: shim
        eval: "&StreamGroup{name: name}"
      - loop:
          do:
            - eval: opt(shim)
          key: _
          range: opts
          value: opt
      - eval: shim.reconcileName()
        to: shim.reconcileName
      - set: name
        value: shim.name
      - lock:
          mutex: s.mu
      - bind: _, streamTaken
        eval: s.byName[name]
      - bind: _, packetTaken
        eval: s.packetByName[name]
      - opt:
          do:
            - eval: |-
                s.recordDeclError(errs.Wrap(corenet.GroupDuplicate, errs.WrapParams{},
                			errs.String("group", name)))
              to: s.recordDeclError
            - return: "&PacketGroup{name: name}"
          when: streamTaken || packetTaken
      - bind: group
        eval: "&PacketGroup{name: name}"
      - eval: s.judgePacketOptions(shim)
        to: s.judgePacketOptions
      - set: group.addrs
        value: shim.addrs
      - set: group.limits
        value: shim.limits
      - set: group.adopt
        value: shim.adopt
      - set: s.packetByName[name]
        value: group
      - set: s.packetGroups
        value: append(s.packetGroups, group)
      - return: group
  - of: (*Server).judgePacketOptions
    participants:
      - id: caller
        kind: actor
      - id: (*Server).judgePacketOptions
        kind: self
      - id: s.recordDeclError
        kind: internal
      - id: shim.engineRefusal
        kind: internal
    steps:
      - opt:
          do:
            - eval: s.recordDeclError(shim.declErr)
              to: s.recordDeclError
          when: shim.declErr != nil
      - opt:
          do:
            - eval: |-
                s.recordDeclError(errs.Wrap(corenet.LoopOptionUnsupported, errs.WrapParams{},
                			errs.String("group", shim.name), errs.String("option", "Loop")))
              to: s.recordDeclError
          when: shim.loopSet
      - opt:
          do:
            - eval: s.recordDeclError(err)
              to: s.recordDeclError
          init:
            bind: err
            eval: shim.engineRefusal()
            to: shim.engineRefusal
          when: err != nil
  - of: (*Server).recordDeclError
    steps:
      - opt:
          do:
            - set: s.declErr
              value: err
          when: s.declErr == nil
  - of: (*Server).State
    participants:
      - id: caller
        kind: actor
      - id: (*Server).State
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: slices
        kind: stdlib
      - id: s.mu.RUnlock
        kind: value
      - id: s.fallbackMu.Lock
        kind: value
      - id: s.fallbackMu.Unlock
        kind: value
      - id: s.faults
        kind: internal
    steps:
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: listeners
        eval: slices.Clone(s.states)
        to: slices
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - eval: s.fallbackMu.Lock()
        to: s.fallbackMu.Lock
      - bind: fallbacks
        eval: s.fallbacks
      - eval: s.fallbackMu.Unlock()
        to: s.fallbackMu.Unlock
      - bind: override
        eval: s.operator.override
      - set: override.Disabled
        to: slices
        value: slices.Clone(override.Disabled)
      - bind: st
        eval: |-
          corenet.StateValue{
          		Phase:            corenet.Phase(s.phase.Load()),
          		Listeners:        listeners,
          		ActiveConns:      s.active.Load(),
          		TotalConns:       s.total.Load(),
          		RejectedConns:    s.rejected.Load(),
          		OversizedPackets: s.oversized.Load(),
          		AcceptBackoffs:   s.acceptBackoffs.Load(),
          		Loops:            s.loopStates(),
          		Override:         override,
          		Fallbacks:        fallbacks,
          		Platform:         s.platform,
          	}
      - set: st.Faults
        to: s.faults
        value: s.faults(st)
      - return: st
  - of: (*Server).recordFallback
    participants:
      - id: caller
        kind: actor
      - id: (*Server).recordFallback
        kind: self
      - id: s.clk.Now
        kind: value
    steps:
      - lock:
          mutex: s.fallbackMu
      - op: ++
        set: s.fallbacks.Count
      - set: s.fallbacks.LastGroup
        value: group
      - set: s.fallbacks.LastReason
        value: reason
      - set: s.fallbacks.LastAt
        to: s.clk.Now
        value: s.clk.Now()
  - of: sockaddrToAddr
    participants:
      - id: caller
        kind: actor
      - id: sockaddrToAddr
        kind: self
      - id: inet4Addr
        kind: internal
      - id: inet6Addr
        kind: internal
      - id: unixAddr
        kind: internal
    steps:
      - switch:
          cases:
            - case: syscall.AF_INET
              do:
                - return: inet4Addr(raw)
                  to: inet4Addr
            - case: syscall.AF_INET6
              do:
                - return: inet6Addr(raw)
                  to: inet6Addr
            - case: syscall.AF_UNIX
              do:
                - return: unixAddr(raw)
                  to: unixAddr
            - default: true
              do:
                - return: nil
          "on": raw.Addr.Family
  - of: inet4Addr
    steps:
      - bind: sa
        eval: (*syscall.RawSockaddrInet4)(unsafe.Pointer(raw))
      - bind: ip
        eval: make(stdnet.IP, stdnet.IPv4len)
      - eval: copy(ip, sa.Addr[:])
      - return: "&stdnet.UDPAddr{IP: ip, Port: hostPort(sa.Port)}"
  - of: inet6Addr
    participants:
      - id: caller
        kind: actor
      - id: inet6Addr
        kind: self
      - id: zoneOf
        kind: internal
    steps:
      - bind: sa
        eval: (*syscall.RawSockaddrInet6)(unsafe.Pointer(raw))
      - bind: ip
        eval: make(stdnet.IP, stdnet.IPv6len)
      - eval: copy(ip, sa.Addr[:])
      - bind: zone, _
        eval: zoneOf(sa.Scope_id)
        to: zoneOf
      - return: "&stdnet.UDPAddr{IP: ip, Port: hostPort(sa.Port), Zone: zone}"
  - of: hostPort
    steps:
      - return: int(port>>portByteShift) | int(port&portLowByteMask)<<portByteShift
  - of: zoneOf
    participants:
      - id: caller
        kind: actor
      - id: zoneOf
        kind: self
      - id: stdnet
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "\"\", false"
          when: scope == 0
      - bind: iface, err
        eval: stdnet.InterfaceByIndex(int(scope))
        to: stdnet
      - opt:
          do:
            - return: "\"\", false"
          when: err != nil
      - return: iface.Name, true
  - of: (*Server).startStallWatch
    participants:
      - id: caller
        kind: actor
      - id: (*Server).startStallWatch
        kind: self
      - id: worker
        kind: package
    steps:
      - lock:
          mutex: s.mu
      - opt:
          do:
            - return: ""
          when: len(s.loopEngines) == 0 || s.stall.daemon != nil
      - set: s.stall.daemon
        to: worker
        value: worker.Every(stallPoll, s.checkStalls, worker.WithClock(s.clk))
  - of: (*Server).stopStallWatch
    participants:
      - id: caller
        kind: actor
      - id: (*Server).stopStallWatch
        kind: self
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
      - id: daemon.Stop
        kind: value
    steps:
      - eval: s.mu.Lock()
        to: s.mu.Lock
      - bind: daemon
        eval: s.stall.daemon
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - opt:
          do:
            - return: ""
          when: daemon == nil
      - eval: daemon.Stop()
        to: daemon.Stop
  - of: (*Server).checkStalls
    participants:
      - id: caller
        kind: actor
      - id: (*Server).checkStalls
        kind: self
      - id: s.markStalled
        kind: internal
    steps:
      - opt:
          do:
            - return: ""
          when: corenet.Phase(s.phase.Load()) != corenet.PhaseServing
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: "!groupStalled(st)"
            - eval: s.markStalled(st.Group)
              to: s.markStalled
            - return: ""
          key: _
          range: s.loopStates()
          value: st
  - of: (*Server).markStalled
    participants:
      - id: caller
        kind: actor
      - id: (*Server).markStalled
        kind: self
      - id: s.stall.mu.Lock
        kind: value
      - id: s.clk.Now
        kind: value
      - id: s.stall.mu.Unlock
        kind: value
      - id: s.stall.once.Do
        kind: value
    steps:
      - eval: s.stall.mu.Lock()
        to: s.stall.mu.Lock
      - opt:
          do:
            - set: s.stall.group
              value: group
            - set: s.stall.at
              to: s.clk.Now
              value: s.clk.Now()
          when: s.stall.group == ""
      - eval: s.stall.mu.Unlock()
        to: s.stall.mu.Unlock
      - eval: s.stall.once.Do(func() { close(s.stall.stalled) })
        to: s.stall.once.Do
  - of: (*Server).stalledGroup
    steps:
      - lock:
          mutex: s.stall.mu
      - return: s.stall.group, s.stall.at
  - of: stallError
    participants:
      - id: caller
        kind: actor
      - id: stallError
        kind: self
      - id: errs
        kind: package
    steps:
      - return: errs.Wrap(corenet.LoopGroupStalled, errs.WrapParams{}, errs.String("group", group))
        to: errs
  - of: (*StreamGroup).Name
    steps:
      - return: g.name
  - of: (*StreamGroup).Handle
    steps:
      - opt:
          do:
            - return: g
          when: "!g.claimHandler()"
      - set: g.handler
        value: h
      - return: g
  - of: (*StreamGroup).claimHandler
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).claimHandler
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - set: g.declared
              value: "true"
            - return: "true"
          when: "!g.declared"
      - opt:
          do:
            - set: g.declErr
              to: errs
              value: |-
                errs.Wrap(corenet.HandlerAlreadySet, errs.WrapParams{},
                			errs.String("group", g.name))
          when: g.declErr == nil
      - return: "false"
  - of: (*StreamGroup).HandleFunc
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).HandleFunc
        kind: self
      - id: g.Handle
        kind: internal
    steps:
      - return: g.Handle(f)
        to: g.Handle
  - of: (*StreamGroup).HandleHTTP
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).HandleHTTP
        kind: self
      - id: g.mountHTTP
        kind: internal
    steps:
      - return: g.mountHTTP(h)
        to: g.mountHTTP
  - of: (*StreamGroup).mountHTTP
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).mountHTTP
        kind: self
      - id: newHTTPAdapter
        kind: internal
    steps:
      - opt:
          do:
            - return: g
          when: "!g.claimHandler()"
      - bind: adapter
        eval: newHTTPAdapter(h)
        to: newHTTPAdapter
      - set: g.httpAdapter
        value: adapter
      - set: g.handler
        value: adapter
      - return: g
  - of: (*StreamGroup).tracksCloses
    steps:
      - return: g.httpAdapter != nil && g.limiter != nil
  - of: (*StreamGroup).Use
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).Use
        kind: self
      - id: g.kinds.add
        kind: internal
    steps:
      - set: g.middlewares
        value: append(g.middlewares, middlewares...)
      - eval: g.kinds.add(corenet.OptionMiddleware)
        to: g.kinds.add
      - return: g
  - of: (*StreamGroup).resolved
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).resolved
        kind: self
      - id: corenet
        kind: package
    steps:
      - opt:
          do:
            - set: g.httpAdapter.timeouts
              value: g.timeouts
            - set: g.httpAdapter.bounds
              value: g.http
          when: g.httpAdapter != nil
      - bind: chained
        eval: corenet.Chain(g.handler, g.middlewares...)
        to: corenet
      - opt:
          do:
            - return: chained
          when: g.identity.IsZero()
      - return: "handshakeHandler{next: chained, timeouts: g.timeouts}"
  - of: newConnLimiter
    steps:
      - opt:
          do:
            - return: nil
          when: limits.MaxConns <= 0
      - return: |-
          &connLimiter{
          		slots:   make(chan struct{}, limits.MaxConns),
          		ceiling: limits.MaxConns,
          	}
  - of: (*connLimiter).tryAcquire
    steps:
      - select:
          cases:
            - comm: l.slots <- struct{}{}
              do:
                - return: "true"
            - default: true
              do:
                - return: "false"
  - of: (*connLimiter).release
    steps:
      - eval: <-l.slots
  - of: (*connLimiter).releaseFor
    participants:
      - id: caller
        kind: actor
      - id: (*connLimiter).releaseFor
        kind: self
      - id: hijackedTracker
        kind: internal
      - id: tracked.holdSlot
        kind: internal
      - id: l.release
        kind: internal
    steps:
      - opt:
          do:
            - eval: tracked.holdSlot(l)
              to: tracked.holdSlot
            - return: ""
          init:
            bind: tracked
            eval: hijackedTracker(c)
            to: hijackedTracker
          when: tracked != nil
      - eval: l.release()
        to: l.release
  - of: (*Server).admit
    participants:
      - id: caller
        kind: actor
      - id: (*Server).admit
        kind: self
      - id: handler.ServeConn
        kind: value
      - id: s.rejected.Add
        kind: value
      - id: errs
        kind: package
      - id: limiter.releaseFor
        kind: internal
    steps:
      - opt:
          do:
            - return: handler.ServeConn(ctx, c)
              to: handler.ServeConn
          when: limiter == nil
      - opt:
          do:
            - eval: s.rejected.Add(1)
              to: s.rejected.Add
            - return: |-
                errs.Wrap(corenet.ConnLimitReached, errs.WrapParams{},
                			errs.Int("limit", limiter.ceiling))
              to: errs
          when: "!limiter.tryAcquire()"
      - defer: limiter.releaseFor(c)
        to: limiter.releaseFor
      - return: handler.ServeConn(ctx, c)
        to: handler.ServeConn
  - of: swallowErr
    steps:
      - opt:
          do:
            - return: ""
          when: err == nil
  - of: datagramTruncated
    steps:
      - return: "false"
