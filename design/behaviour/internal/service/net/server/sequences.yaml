          cases:
            - do:
                - set: ip
                  value: t.IP
              types: "*stdnet.TCPAddr"
            - do:
                - set: ip
                  value: t.IP
              types: "*stdnet.UDPAddr"
            - default: true
              do:
                - return: a.String()
                  to: a.String
          "on": a
