          		//: cut off a peer whose every read was inside the bound (#454).
          		//: every request is counted by its version first (#966).
          		Handler:   versionCounter{next: perReadBody(limitBody(a.handler, a.bounds.bodyBytes()), read), counts: &a.counts},
          		ConnState: a.onConnState,
          		//: net/http applies the write bound per response. Left at zero — as it
          		//: was — net/http bounds nothing at all.
          		WriteTimeout: a.timeouts.Write.Duration(),
          		//: a connection waiting for its next request is bounded by the idle
          		//: budget; with none, net/http fell back to ReadTimeout, and the read
          		//: budget keeps that place now that ReadTimeout is no longer set.
          		IdleTimeout: idleOrRead(a.timeouts.Idle.Duration(), read),
          		//: the header phase is the one a slowloris stalls, and net/http only
          		//: bounds it separately; its own option wins, and falling back to the
          		//: read budget means a group that set only that one is still defended
          		//: without having to know the phase exists.
          		ReadHeaderTimeout: a.bounds.headerTimeout(read),
          		//: zero is net/http's own default (1 MiB); a caller's cap replaces it.
          		MaxHeaderBytes: a.bounds.headerBytes(),
          		//: what net/http reports from its own goroutines goes to the server's
          		//: logger, under its cap, never to the process's standard logger.
          		ErrorLog: a.errorLog,
          		//: the versions the group serves, from the same list as its ALPN, and
          		//: HTTP/2's bounds set rather than left to the standard library's.
          		//: TLSConfig stays unset: the listener's is the one that negotiates.
          		Protocols: a.protocols,
          		HTTP2:     http2Config(a.timeouts.Write, h2Silence(a.bounds, a.timeouts), a.http2, a.counts.countError),
          		//: every request on this listener derives from a context carrying the
          		//: drain signal, which is the only way a handler holding a connection
          		//: open indefinitely can learn that the server is shutting down. A
          		//: request context would have to be CANCELLED to say it, and cancelling
          		//: one asks a handler to abandon a response the drain exists to let it
          		//: finish.
          		BaseContext: func(stdnet.Listener) context.Context {
          			//: the same channel for every request the group serves.
          			return corenet.WithDrainSignal(context.Background(), a.draining)
          		},
          	}
      - set: a.bridge
        value: bridge
      - set: a.server
        value: srv
      - set: a.daemon
        to: worker
        value: |-
          worker.Start(func(_ <-chan struct{}) {
          		//: Serve always returns a non-nil error; ErrClosed on our drain path is
          		//: the expected one and carries nothing worth reporting.
          		swallowErr(srv.Serve(bridge))
          	})
