      - id: caller
        kind: actor
      - id: (*Server).backOff
        kind: self
      - id: s.clk.NewTimer
        kind: value
      - id: timer.Stop
        kind: value
    steps:
      - bind: timer
        eval: s.clk.NewTimer(delay)
        to: s.clk.NewTimer
      - defer: timer.Stop()
        to: timer.Stop
      - select:
          cases:
            - comm: <-timer.C()
              do:
                - return: "true"
            - comm: <-bound.closedSignal()
              do:
                - return: "false"
  - of: (*Server).serve
    participants:
      - id: caller
        kind: actor
      - id: (*Server).serve
        kind: self
      - id: s.inFlight.Done
        kind: value
      - id: context
        kind: stdlib
      - id: s.active.Add
        kind: value
      - id: s.acquire
        kind: internal
      - id: s.release
        kind: internal
      - id: recoverHandler
        kind: internal
      - id: swallowErr
        kind: internal
    steps:
      - defer: s.inFlight.Done()
        to: s.inFlight.Done
      - bind: ctx
        eval: s.runCtx
      - opt:
          do:
            - defer: release()
            - set: ctx
              to: context
              value: context.WithValue(ctx, admissionReleaseKey{}, release)
          when: release != nil
      - defer: s.active.Add(-1)
        to: s.active.Add
      - bind: c
        eval: s.acquire(raw, group)
        to: s.acquire
      - defer: s.release(c)
        to: s.release
      - defer: recoverHandler()
        to: recoverHandler
      - eval: swallowErr(s.admit(ctx, group.limiter, c, handler))
        to: swallowErr
  - of: recoverHandler
    steps:
      - eval: recover()
  - of: (*Server).Serve
    participants:
      - id: caller
        kind: actor
      - id: (*Server).Serve
        kind: self
      - id: s.Start
        kind: internal
      - id: ctx.Done
        kind: value
      - id: context
        kind: stdlib
      - id: s.Shutdown
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: s.Start(ctx)
            to: s.Start
          when: err != nil
      - eval: <-ctx.Done()
        to: ctx.Done
      - bind: drainCtx, cancel
        eval: context.WithTimeout(context.WithoutCancel(ctx), s.drainTimeout)
        to: context
      - defer: cancel()
      - return: s.Shutdown(drainCtx)
        to: s.Shutdown
  - of: (*Server).Shutdown
