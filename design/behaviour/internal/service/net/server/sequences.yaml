    participants:
      - id: caller
        kind: actor
      - id: (*httpAdapter).unregister
        kind: self
      - id: a.mu.Lock
        kind: value
      - id: a.mu.Unlock
        kind: value
    steps:
      - eval: a.mu.Lock()
        to: a.mu.Lock
      - eval: delete(a.waiters, raw)
      - eval: a.mu.Unlock()
        to: a.mu.Unlock
