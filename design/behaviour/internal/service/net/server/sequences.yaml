    steps:
      - return: "false"
  - of: probeIO.Post
    steps:
      - return: corenet.ServerClosed
  - of: probeIO.Loop
    steps:
      - return: "0"
  - of: startLoopEngine
    participants:
      - id: caller
        kind: actor
      - id: startLoopEngine
        kind: self
