      - eval: probed.OnTimeout(io, ref)
        to: probed.OnTimeout
      - eval: probed.OnWritable(io, ref)
        to: probed.OnWritable
      - eval: probed.OnBatchEnd(io)
        to: probed.OnBatchEnd
      - eval: probed.OnClose(io, ref, nil)
        to: probed.OnClose
