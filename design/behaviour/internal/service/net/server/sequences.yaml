        to: context
      - set: s.runCtx
        value: runCtx
      - set: s.stop
        value: cancel
      - opt:
          do:
            - opt:
                do:
                  - return: |-
                      errs.Wrap(corenet.ListenFailed, errs.WrapParams{},
