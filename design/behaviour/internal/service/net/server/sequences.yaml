                  - eval: s.acceptBackoffs.Add(1)
                    to: s.acceptBackoffs.Add
                  - opt:
                      do:
                        - return: ""
                      when: "!s.backOff(bound, acceptDelay(failures))"
                  - continue: true
                when: err != nil
            - set: failures
              value: "0"
            - var:
                name: release
                type: func()
            - opt:
                do:
                  - bind: ok
                    eval: "false"
                  - opt:
                      do:
                        - eval: swallowErr(raw.Close())
                          to: swallowErr
                        - continue: true
                      init:
                        bind: release, ok
                        eval: group.admission.Admit(raw.RemoteAddr())
                        op: =
                        to: group.admission.Admit
                      when: "!ok"
                when: group.admission != nil
            - eval: s.total.Add(1)
              to: s.total.Add
            - eval: s.active.Add(1)
              to: s.active.Add
            - eval: s.inFlight.Add(1)
              to: s.inFlight.Add
            - go: s.serve(raw, group, handler, release)
              to: s.serve
          forever: true
