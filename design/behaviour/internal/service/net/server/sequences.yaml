      - id: (*Server).dispatch
        kind: self
      - id: s.total.Add
        kind: value
      - id: s.oversized.Add
        kind: value
      - id: slots[i].payload
        kind: internal
      - id: s.nextID.Add
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - loop:
          do:
            - eval: s.total.Add(1)
              to: s.total.Add
            - opt:
                do:
                  - eval: s.oversized.Add(1)
                    to: s.oversized.Add
                  - continue: true
                when: slots[i].n > ceiling
            - set: held.data
              to: slots[i].payload
              value: slots[i].payload()
            - set: held.from
              value: slots[i].addr
            - set: held.id
              to: s.nextID.Add
              value: s.nextID.Add(1)
            - eval: swallowErr(s.servePacket(held, handler))
              to: swallowErr
          key: i
          range: slots
      - set: held.data
        value: nil
      - set: held.from
        value: nil
  - of: (*Server).servePacket
    participants:
      - id: caller
        kind: actor
      - id: (*Server).servePacket
        kind: self
      - id: recoverHandler
        kind: internal
      - id: handler.ServePacket
        kind: value
    steps:
      - defer: recoverHandler()
        to: recoverHandler
      - return: handler.ServePacket(s.runCtx, p)
        to: handler.ServePacket
  - of: (*Server).acquire
    participants:
      - id: caller
        kind: actor
      - id: (*Server).acquire
        kind: self
      - id: s.connPool.Get
        kind: value
      - id: s.nextID.Add
        kind: value
      - id: s.liveMu.Lock
        kind: value
      - id: s.liveMu.Unlock
        kind: value
      - id: buffer
        kind: package
    steps:
      - bind: c
        eval: s.connPool.Get()
        to: s.connPool.Get
      - set: c.Conn
        value: raw
      - set: c.id
        to: s.nextID.Add
        value: s.nextID.Add(1)
      - set: c.group
        value: group.name
      - set: c.timeouts
        value: group.timeouts
      - eval: s.liveMu.Lock()
        to: s.liveMu.Lock
      - set: s.live[c.id]
        value: raw
      - eval: s.liveMu.Unlock()
        to: s.liveMu.Unlock
      - opt:
          do:
            - set: c.scratch
              to: buffer
              value: buffer.Get()
            - opt:
                do:
                  - set: c.scratch
                    value: new(make([]byte, size))
                when: cap(*c.scratch) < size
            - set: "*c.scratch"
              value: (*c.scratch)[:size]
          init:
            bind: size
            eval: group.limits.ReadBufferSize
          when: size > 0
      - return: c
  - of: (*Server).release
    participants:
      - id: caller
        kind: actor
      - id: (*Server).release
        kind: self
      - id: s.liveMu.Lock
        kind: value
      - id: s.liveMu.Unlock
        kind: value
      - id: swallowErr
        kind: internal
      - id: buffer
        kind: package
      - id: c.reset
        kind: internal
      - id: s.connPool.Put
        kind: value
    steps:
      - eval: s.liveMu.Lock()
        to: s.liveMu.Lock
      - eval: delete(s.live, c.id)
      - eval: s.liveMu.Unlock()
        to: s.liveMu.Unlock
      - opt:
          do:
            - eval: swallowErr(c.Close())
              to: swallowErr
          when: "!c.hijacked"
      - opt:
          do:
            - eval: buffer.Put(c.scratch)
              to: buffer
          when: c.scratch != nil
      - eval: c.reset()
        to: c.reset
      - eval: s.connPool.Put(c)
        to: s.connPool.Put
  - of: (*Server).closeLive
    participants:
      - id: caller
        kind: actor
      - id: (*Server).closeLive
        kind: self
      - id: s.liveMu.RLock
        kind: value
      - id: slices
        kind: stdlib
      - id: s.liveMu.RUnlock
        kind: value
      - id: swallowErr
        kind: internal
    steps:
      - eval: s.liveMu.RLock()
        to: s.liveMu.RLock
      - bind: sockets
        eval: slices.Collect(maps.Values(s.live))
        to: slices
      - eval: s.liveMu.RUnlock()
        to: s.liveMu.RUnlock
      - loop:
          do:
            - eval: swallowErr(socket.Close())
              to: swallowErr
          key: _
          range: sockets
          value: socket
  - of: reusePortSupported
    steps:
      - return: "true"
  - of: setReusePort
    participants:
      - id: caller
        kind: actor
      - id: setReusePort
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - return: syscall.SetsockoptInt(int(fd), syscall.SOL_SOCKET, soReusePort, 1)
        to: syscall
  - of: newPooledConn
    steps:
      - return: "&conn{}"
  - of: New
    participants:
      - id: caller
        kind: actor
      - id: New
        kind: self
      - id: context
        kind: stdlib
      - id: s.phase.Store
        kind: value
    steps:
      - bind: s
        eval: |-
          &Server{
          		byName:       make(map[string]*StreamGroup, expectedGroups),
          		packetByName: make(map[string]*PacketGroup, expectedGroups),
          		live:         make(map[uint64]stdnet.Conn, expectedLiveConns),
          		drainTimeout: defaultDrainTimeout,
          		connPool:     recycler.NewPool(newPooledConn),
          		clk:          clock.System,
          	}
      - loop:
          do:
            - eval: opt(s)
          key: _
          range: opts
          value: opt
      - set: s.runCtx
        to: context
        value: context.Background()
      - eval: s.phase.Store(uint32(corenet.PhaseNew))
        to: s.phase.Store
      - return: s
  - of: (*Server).Group
    participants:
      - id: caller
        kind: actor
      - id: (*Server).Group
        kind: self
      - id: s.recordDeclError
        kind: internal
    steps:
      - lock:
          mutex: s.mu
      - opt:
          do:
            - eval: |-
                s.recordDeclError(errs.Wrap(corenet.GroupDuplicate, errs.WrapParams{},
                			errs.String("group", name)))
              to: s.recordDeclError
            - return: "&StreamGroup{name: name}"
          init:
            bind: _, exists
            eval: s.byName[name]
          when: exists
      - bind: group
        eval: "&StreamGroup{name: name}"
      - loop:
          do:
            - eval: opt(group)
          key: _
          range: opts
          value: opt
      - set: s.byName[name]
        value: group
      - set: s.groups
        value: append(s.groups, group)
      - return: group
  - of: (*Server).PacketGroup
    participants:
      - id: caller
        kind: actor
      - id: (*Server).PacketGroup
        kind: self
      - id: s.recordDeclError
        kind: internal
    steps:
      - lock:
          mutex: s.mu
      - bind: _, streamTaken
        eval: s.byName[name]
      - bind: _, packetTaken
        eval: s.packetByName[name]
      - opt:
          do:
            - eval: |-
                s.recordDeclError(errs.Wrap(corenet.GroupDuplicate, errs.WrapParams{},
                			errs.String("group", name)))
              to: s.recordDeclError
            - return: "&PacketGroup{name: name}"
          when: streamTaken || packetTaken
      - bind: group
        eval: "&PacketGroup{name: name}"
      - bind: shim
        eval: "&StreamGroup{}"
      - loop:
          do:
            - eval: opt(shim)
          key: _
          range: opts
          value: opt
      - set: group.addrs
        value: shim.addrs
      - set: group.limits
        value: shim.limits
      - set: group.adopt
        value: shim.adopt
      - set: s.packetByName[name]
        value: group
      - set: s.packetGroups
        value: append(s.packetGroups, group)
      - return: group
  - of: (*Server).recordDeclError
    steps:
      - opt:
          do:
            - set: s.declErr
              value: err
          when: s.declErr == nil
  - of: (*Server).State
    participants:
      - id: caller
        kind: actor
      - id: (*Server).State
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: slices
        kind: stdlib
      - id: s.mu.RUnlock
        kind: value
    steps:
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: listeners
        eval: slices.Clone(s.states)
        to: slices
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - return: |-
          corenet.StateValue{
          		Phase:            corenet.Phase(s.phase.Load()),
          		Listeners:        listeners,
          		ActiveConns:      s.active.Load(),
          		TotalConns:       s.total.Load(),
          		RejectedConns:    s.rejected.Load(),
          		OversizedPackets: s.oversized.Load(),
          		AcceptBackoffs:   s.acceptBackoffs.Load(),
          	}
  - of: sockaddrToAddr
    participants:
      - id: caller
        kind: actor
      - id: sockaddrToAddr
        kind: self
      - id: inet4Addr
        kind: internal
      - id: inet6Addr
        kind: internal
      - id: unixAddr
        kind: internal
    steps:
      - switch:
          cases:
            - case: syscall.AF_INET
              do:
                - return: inet4Addr(raw)
                  to: inet4Addr
            - case: syscall.AF_INET6
              do:
                - return: inet6Addr(raw)
                  to: inet6Addr
            - case: syscall.AF_UNIX
              do:
                - return: unixAddr(raw)
                  to: unixAddr
            - default: true
              do:
                - return: nil
          "on": raw.Addr.Family
  - of: inet4Addr
    steps:
      - bind: sa
        eval: (*syscall.RawSockaddrInet4)(unsafe.Pointer(raw))
      - bind: ip
        eval: make(stdnet.IP, stdnet.IPv4len)
      - eval: copy(ip, sa.Addr[:])
      - return: "&stdnet.UDPAddr{IP: ip, Port: hostPort(sa.Port)}"
  - of: inet6Addr
    participants:
      - id: caller
        kind: actor
      - id: inet6Addr
        kind: self
      - id: zoneOf
        kind: internal
    steps:
      - bind: sa
        eval: (*syscall.RawSockaddrInet6)(unsafe.Pointer(raw))
      - bind: ip
        eval: make(stdnet.IP, stdnet.IPv6len)
      - eval: copy(ip, sa.Addr[:])
      - bind: zone, _
        eval: zoneOf(sa.Scope_id)
        to: zoneOf
      - return: "&stdnet.UDPAddr{IP: ip, Port: hostPort(sa.Port), Zone: zone}"
  - of: hostPort
    steps:
      - return: int(port>>portByteShift) | int(port&portLowByteMask)<<portByteShift
  - of: zoneOf
    participants:
      - id: caller
        kind: actor
      - id: zoneOf
        kind: self
      - id: stdnet
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "\"\", false"
          when: scope == 0
      - bind: iface, err
        eval: stdnet.InterfaceByIndex(int(scope))
        to: stdnet
      - opt:
          do:
            - return: "\"\", false"
          when: err != nil
      - return: iface.Name, true
  - of: (*StreamGroup).Name
    steps:
      - return: g.name
  - of: (*StreamGroup).Handle
    steps:
      - set: g.handler
        value: h
      - return: g
  - of: (*StreamGroup).HandleFunc
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).HandleFunc
        kind: self
      - id: g.Handle
        kind: internal
    steps:
      - return: g.Handle(f)
        to: g.Handle
  - of: (*StreamGroup).HandleHTTP
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).HandleHTTP
        kind: self
      - id: newHTTPAdapter
        kind: internal
      - id: g.Handle
        kind: internal
    steps:
      - bind: adapter
        eval: newHTTPAdapter(h)
        to: newHTTPAdapter
      - set: g.httpAdapter
        value: adapter
      - return: g.Handle(adapter)
        to: g.Handle
  - of: (*StreamGroup).tracksCloses
    steps:
      - return: g.httpAdapter != nil && g.limiter != nil
  - of: (*StreamGroup).Use
    steps:
      - set: g.middlewares
        value: append(g.middlewares, middlewares...)
      - return: g
  - of: (*StreamGroup).resolved
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).resolved
        kind: self
      - id: corenet
        kind: package
    steps:
      - opt:
          do:
            - set: g.httpAdapter.timeouts
              value: g.timeouts
            - set: g.httpAdapter.bounds
              value: g.http
          when: g.httpAdapter != nil
      - bind: chained
        eval: corenet.Chain(g.handler, g.middlewares...)
        to: corenet
      - opt:
          do:
            - return: chained
          when: g.identity.IsZero()
      - return: "handshakeHandler{next: chained, timeouts: g.timeouts}"
  - of: newConnLimiter
    steps:
      - opt:
          do:
            - return: nil
          when: limits.MaxConns <= 0
      - return: |-
          &connLimiter{
          		slots:   make(chan struct{}, limits.MaxConns),
          		ceiling: limits.MaxConns,
          	}
  - of: (*connLimiter).tryAcquire
    steps:
      - select:
          cases:
            - comm: l.slots <- struct{}{}
              do:
                - return: "true"
            - default: true
              do:
                - return: "false"
  - of: (*connLimiter).release
    steps:
      - eval: <-l.slots
  - of: (*connLimiter).releaseFor
    participants:
      - id: caller
        kind: actor
      - id: (*connLimiter).releaseFor
        kind: self
      - id: hijackedTracker
        kind: internal
      - id: tracked.holdSlot
        kind: internal
      - id: l.release
        kind: internal
    steps:
      - opt:
          do:
            - eval: tracked.holdSlot(l)
              to: tracked.holdSlot
            - return: ""
          init:
            bind: tracked
            eval: hijackedTracker(c)
            to: hijackedTracker
          when: tracked != nil
      - eval: l.release()
        to: l.release
  - of: (*Server).admit
    participants:
      - id: caller
        kind: actor
      - id: (*Server).admit
        kind: self
      - id: handler.ServeConn
        kind: value
      - id: s.rejected.Add
        kind: value
      - id: errs
        kind: package
      - id: limiter.releaseFor
        kind: internal
    steps:
      - opt:
          do:
            - return: handler.ServeConn(ctx, c)
              to: handler.ServeConn
          when: limiter == nil
      - opt:
          do:
            - eval: s.rejected.Add(1)
              to: s.rejected.Add
            - return: |-
                errs.Wrap(corenet.ConnLimitReached, errs.WrapParams{},
                			errs.Int("limit", limiter.ceiling))
              to: errs
          when: "!limiter.tryAcquire()"
      - defer: limiter.releaseFor(c)
        to: limiter.releaseFor
      - return: handler.ServeConn(ctx, c)
        to: handler.ServeConn
  - of: swallowErr
    steps:
      - opt:
          do:
            - return: ""
          when: err == nil
  - of: datagramTruncated
    steps:
      - return: "false"
