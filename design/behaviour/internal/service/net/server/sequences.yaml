      - opt:
          do:
            - return: nil
          when: l.toLen == 0
      - bind: ip
        eval: make(stdnet.IP, l.toLen)
      - eval: copy(ip, l.to[:l.toLen])
      - return: "&stdnet.UDPAddr{IP: ip, Port: port}"
  - of: (*datagram).payload
    steps:
      - return: d.buf[:d.n]
  - of: (*datagram).segment
    participants:
      - id: caller
        kind: actor
      - id: (*datagram).segment
        kind: self
      - id: d.payload
        kind: internal
    steps:
      - opt:
          do:
            - return: d.payload(), i == 0
              to: d.payload
          when: d.seg <= 0 || d.seg >= d.n
      - bind: "off"
        eval: i * d.seg
      - opt:
          do:
            - return: nil, false
          when: off >= d.n
      - return: d.buf[off:min(off+d.seg, d.n)], true
  - of: (*datagram).count
    steps:
      - opt:
          do:
            - return: "1"
          when: d.seg <= 0 || d.seg >= d.n
      - return: (d.n + d.seg - 1) / d.seg
  - of: newSlots
    steps:
      - bind: slots
        eval: make([]datagram, count)
      - loop:
          do:
            - set: slots[i].buf
              value: make([]byte, size+1)
          key: i
          range: slots
      - return: slots
  - of: (*portableReader).readBatch
    participants:
      - id: caller
        kind: actor
      - id: (*portableReader).readBatch
        kind: self
      - id: r.pc.ReadFrom
        kind: value
