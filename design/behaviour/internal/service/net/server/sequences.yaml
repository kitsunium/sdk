  - of: setBuffers
    participants:
      - id: caller
        kind: actor
      - id: setBuffers
        kind: self
      - id: bufferRefusal
        kind: internal
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: bufferRefusal(syscall.SetsockoptInt(int(fd), syscall.SOL_SOCKET, syscall.SO_RCVBUF, receive))
                  to: bufferRefusal
                when: err != nil
          when: receive > 0
      - opt:
          do:
            - return: bufferRefusal(syscall.SetsockoptInt(int(fd), syscall.SOL_SOCKET, syscall.SO_SNDBUF, send))
              to: bufferRefusal
          when: send > 0
      - return: nil
  - of: bufferRefusal
    steps:
      - opt:
          do:
            - return: nil
          when: errors.Is(err, syscall.ENOBUFS)
      - return: err
  - of: readBuffers
    participants:
      - id: caller
        kind: actor
      - id: readBuffers
        kind: self
      - id: bufferOption
        kind: internal
    steps:
      - return: bufferOption(fd, syscall.SO_RCVBUF), bufferOption(fd, syscall.SO_SNDBUF)
        to: bufferOption
  - of: bufferOption
    participants:
      - id: caller
        kind: actor
      - id: bufferOption
        kind: self
      - id: syscall
        kind: stdlib
    steps:
      - bind: value, err
        eval: syscall.GetsockoptInt(int(fd), syscall.SOL_SOCKET, option)
        to: syscall
      - opt:
          do:
            - return: "0"
          when: err != nil
      - return: value
  - of: Compress
    participants:
      - id: caller
        kind: actor
      - id: Compress
        kind: self
      - id: newCompressSettings
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, errs.Wrap(corenet.CompressInvalid, errs.WrapParams{}, errs.String("option", "level"))
          when: v.Level != 0 && v.Level != gzip.DefaultCompression && (v.Level < gzipMinLevel || v.Level > gzipMaxLevel)
      - opt:
          do:
            - return: nil, errs.Wrap(corenet.CompressInvalid, errs.WrapParams{}, errs.String("option", "min_bytes"))
          when: v.MinBytes < 0
      - bind: settings
        eval: newCompressSettings(v)
        to: newCompressSettings
      - return: |-
          func(next http.Handler) http.Handler {
          		//: one per wrapped handler.
          		return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
          			settings.serve(next, w, r)
          		})
          	}, nil
  - of: newCompressSettings
    steps:
      - bind: c
        eval: "&compressSettings{level: v.Level, minBytes: v.MinBytes}"
      - opt:
          do:
            - set: c.level
              value: gzip.DefaultCompression
          when: c.level == 0
      - opt:
          do:
            - set: c.minBytes
              value: defaultCompressMinBytes
          when: c.minBytes == 0
      - bind: source
        eval: v.Types
      - opt:
          do:
            - set: source
              value: compressDefaults
          when: len(source) == 0
      - set: c.types
        value: make([]string, 0, len(source))
      - loop:
          do:
            - set: c.types
              value: append(c.types, strings.ToLower(strings.TrimSpace(t)))
          key: _
          range: source
          value: t
      - return: c
  - of: (*compressSettings).serve
    participants:
      - id: caller
        kind: actor
      - id: (*compressSettings).serve
        kind: self
      - id: next.ServeHTTP
        kind: value
    steps:
      - opt:
          do:
            - eval: next.ServeHTTP(w, r)
              to: next.ServeHTTP
            - return: ""
          when: r.Method == http.MethodHead || !corenet.AcceptsEncoding(r.Header.Get("Accept-Encoding"), "gzip")
      - bind: writer
        eval: "&compressWriter{settings: c, inner: w}"
      - bind: completed
        eval: "false"
      - defer: |-
          func() {
          		//: a panic is net/http's to report; the partial stream is not closed.
          		writer.finish(completed)
          	}()
      - eval: next.ServeHTTP(writer, r)
        to: next.ServeHTTP
      - set: completed
        value: "true"
  - of: (*compressWriter).Header
    participants:
      - id: caller
        kind: actor
      - id: (*compressWriter).Header
        kind: self
      - id: w.inner.Header
        kind: value
    steps:
      - return: w.inner.Header()
        to: w.inner.Header
  - of: (*compressWriter).WriteHeader
    participants:
      - id: caller
        kind: actor
      - id: (*compressWriter).WriteHeader
        kind: self
      - id: w.inner.WriteHeader
        kind: value
    steps:
      - opt:
          do:
            - eval: w.inner.WriteHeader(status)
              to: w.inner.WriteHeader
            - return: ""
          when: status >= http.StatusContinue && status < http.StatusOK
      - opt:
          do:
            - set: w.status
              value: status
