        to: slices
      - eval: s.mu.Unlock()
        to: s.mu.Unlock
      - bind: runCtx, cancel
        eval: context.WithCancel(context.WithoutCancel(ctx))
        to: context
      - set: s.runCtx
        value: runCtx
      - set: s.stop
        value: cancel
