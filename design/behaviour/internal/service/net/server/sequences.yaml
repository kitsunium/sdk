                  bind: cerr
                  eval: s.Close()
                  to: s.Close
                when: cerr != nil
            - return: err
          init:
            bind: err
            eval: s.bindEverything(ctx, groups, packetGroups)
            to: s.bindEverything
          when: err != nil
      - eval: s.phase.Store(uint32(corenet.PhaseServing))
        to: s.phase.Store
      - eval: s.startStallWatch()
        to: s.startStallWatch
      - return: nil
  - of: groupDeclErr
    participants:
      - id: caller
        kind: actor
      - id: groupDeclErr
        kind: self
      - id: group.startRefusal
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: group.startRefusal()
                  to: group.startRefusal
                when: err != nil
          key: _
          range: groups
          value: group
      - return: nil
  - of: (*StreamGroup).startRefusal
    participants:
      - id: caller
        kind: actor
      - id: (*StreamGroup).startRefusal
        kind: self
      - id: g.engineRefusal
        kind: internal
      - id: g.plaintextRefusal
        kind: internal
      - id: errs
        kind: package
      - id: g.loopRefusal
        kind: internal
    steps:
      - opt:
          do:
            - return: g.declErr
          when: g.declErr != nil
      - opt:
          do:
            - return: nil
          when: g.loopHandler == nil && g.handler == nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: g.engineRefusal()
            to: g.engineRefusal
          when: err != nil
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: g.plaintextRefusal()
            to: g.plaintextRefusal
          when: err != nil
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.LoopOptionUnsupported, errs.WrapParams{},
                			errs.String("group", g.name), errs.String("option", corenet.OptionBatchReplies.String()))
              to: errs
          when: g.kinds.has(corenet.OptionBatchReplies)
      - opt:
          do:
            - return: g.loopRefusal()
              to: g.loopRefusal
          when: g.loopHandler != nil
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.LoopOptionUnsupported, errs.WrapParams{},
                			errs.String("group", g.name), errs.String("option", "Loop"))
              to: errs
          when: g.loopSet
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.LoopOptionUnsupported, errs.WrapParams{},
                			errs.String("group", g.name), errs.String("option", corenet.OptionLoopMiddleware.String()))
              to: errs
          when: g.kinds.has(corenet.OptionLoopMiddleware)
      - return: nil
  - of: (*Server).bindEverything
    participants:
      - id: caller
        kind: actor
      - id: (*Server).bindEverything
        kind: self
      - id: s.bindAll
        kind: internal
      - id: s.bindPacketAll
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: s.bindAll(ctx, groups)
            to: s.bindAll
          when: err != nil
      - return: s.bindPacketAll(ctx, packetGroups)
        to: s.bindPacketAll
  - of: (*Server).bindPacketAll
    participants:
      - id: caller
        kind: actor
      - id: (*Server).bindPacketAll
        kind: self
      - id: errs
        kind: package
      - id: s.bindPacketGroup
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: |-
                      errs.Wrap(corenet.HandlerMissing, errs.WrapParams{},
                      				errs.String("group", group.name))
                    to: errs
                when: group.handler == nil
            - opt:
                do:
                  - return: |-
                      errs.Wrap(corenet.InvalidAddress, errs.WrapParams{},
                      				errs.String("group", group.name), errs.String("why", "no listen address"))
                    to: errs
                when: len(group.addrs) == 0
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: s.bindPacketGroup(ctx, group)
                  to: s.bindPacketGroup
                when: err != nil
          key: _
          range: groups
          value: group
      - return: nil
  - of: (*Server).bindPacketGroup
    participants:
      - id: caller
        kind: actor
      - id: (*Server).bindPacketGroup
        kind: self
      - id: group.resolved
        kind: internal
      - id: s.adoptPacketSockets
        kind: internal
      - id: listenPacket
        kind: internal
      - id: s.newBoundPacket
        kind: internal
      - id: batchDegradation
        kind: internal
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
      - id: s.inFlight.Add
        kind: value
      - id: s.readLoop
        kind: internal
    steps:
      - bind: handler
        eval: group.resolved()
        to: group.resolved
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: s.adoptPacketSockets(group, handler)
            to: s.adoptPacketSockets
          when: err != nil
      - loop:
          do:
            - bind: pc, rep, err
              eval: listenPacket(ctx, addr)
              to: listenPacket
            - opt:
                do:
                  - return: err
                when: err != nil
            - bind: bound
              eval: s.newBoundPacket(group, addr, pc)
              to: s.newBoundPacket
            - bind: degraded, reason
              eval: batchDegradation(group.limits)
              to: batchDegradation
            - eval: s.mu.Lock()
              to: s.mu.Lock
            - set: s.packetConns
              value: append(s.packetConns, bound)
            - set: s.states
              value: |-
                append(s.states, corenet.ListenerStateValue{
                			Group:          group.name,
                			Address:        pc.LocalAddr().String(),
                			Network:        addr.Network,
                			Shards:         1,
                			Exclusive:      rep.exclusive,
                			BindWait:       corenet.DurationValue(rep.wait),
                			Degraded:       degraded,
                			DegradedReason: reason,
                		})
            - eval: s.mu.Unlock()
              to: s.mu.Unlock
            - eval: s.inFlight.Add(1)
              to: s.inFlight.Add
            - go: s.readLoop(bound, group, handler)
              to: s.readLoop
          key: _
          range: group.addrs
          value: addr
      - return: nil
  - of: (*Server).adoptPacketSockets
    participants:
      - id: caller
        kind: actor
      - id: (*Server).adoptPacketSockets
        kind: self
      - id: s.adoptPacket
        kind: internal
      - id: batchDegradation
        kind: internal
      - id: s.newBoundPacket
        kind: internal
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
      - id: s.inFlight.Add
        kind: value
      - id: s.readLoop
        kind: internal
    steps:
      - loop:
          do:
            - bind: conns, err
              eval: s.adoptPacket(name)
              to: s.adoptPacket
            - opt:
                do:
                  - return: err
                when: err != nil
            - bind: degraded, reason
              eval: batchDegradation(group.limits)
              to: batchDegradation
            - loop:
                do:
                  - bind: addr
                    eval: "corenet.AddressValue{Network: pc.LocalAddr().Network(), Addr: pc.LocalAddr().String()}"
                  - bind: bound
                    eval: s.newBoundPacket(group, addr, pc)
                    to: s.newBoundPacket
                  - eval: s.mu.Lock()
                    to: s.mu.Lock
                  - set: s.packetConns
                    value: append(s.packetConns, bound)
                  - set: s.states
                    value: |-
                      append(s.states, corenet.ListenerStateValue{
                      				Group:          group.name,
                      				Address:        pc.LocalAddr().String(),
                      				Network:        addr.Network,
                      				Shards:         1,
                      				Adopted:        true,
                      				Exclusive:      exclusiveOf(packetSocket(pc)),
                      				Degraded:       degraded,
                      				DegradedReason: reason,
                      			})
                  - eval: s.mu.Unlock()
                    to: s.mu.Unlock
                  - eval: s.inFlight.Add(1)
                    to: s.inFlight.Add
                  - go: s.readLoop(bound, group, handler)
                    to: s.readLoop
                key: _
                range: conns
                value: pc
          key: _
          range: group.adopt
          value: name
      - return: nil
  - of: batchDegradation
    steps:
      - opt:
          do:
            - return: false, ""
          when: batchAvailable() || batchSize(limits) <= 1
      - return: true, "batched datagram read unavailable on this platform; reading one per syscall"
  - of: (*Server).bindAll
    participants:
      - id: caller
        kind: actor
      - id: (*Server).bindAll
        kind: self
      - id: errs
        kind: package
      - id: s.bindGroup
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: |-
                      errs.Wrap(corenet.HandlerMissing, errs.WrapParams{},
                      				errs.String("group", group.name))
                    to: errs
                when: group.handler == nil && group.loopHandler == nil
            - opt:
                do:
                  - return: |-
                      errs.Wrap(corenet.InvalidAddress, errs.WrapParams{},
                      				errs.String("group", group.name), errs.String("why", "no listen address"))
                    to: errs
                when: len(group.addrs) == 0 && len(group.adopt) == 0
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: s.bindGroup(ctx, group)
                  to: s.bindGroup
                when: err != nil
          key: _
          range: groups
          value: group
      - return: nil
  - of: (*Server).bindGroup
    participants:
      - id: caller
        kind: actor
      - id: (*Server).bindGroup
        kind: self
      - id: s.bindLoopGroup
        kind: internal
      - id: group.resolved
        kind: internal
      - id: newConnLimiter
        kind: internal
      - id: s.adoptStreamSockets
        kind: internal
      - id: s.bindShards
        kind: internal
    steps:
      - opt:
          do:
            - return: s.bindLoopGroup(ctx, group)
              to: s.bindLoopGroup
          when: group.loopHandler != nil
      - bind: handler
        eval: group.resolved()
        to: group.resolved
      - set: group.limiter
        to: newConnLimiter
        value: newConnLimiter(group.limits)
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: s.adoptStreamSockets(group, handler)
            to: s.adoptStreamSockets
          when: err != nil
      - loop:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: s.bindShards(ctx, group, addr, handler)
                  to: s.bindShards
                when: err != nil
          key: _
          range: group.addrs
          value: addr
      - return: nil
  - of: (*Server).adoptStreamSockets
    participants:
      - id: caller
        kind: actor
      - id: (*Server).adoptStreamSockets
        kind: self
      - id: s.adoptStream
        kind: internal
      - id: layered
        kind: internal
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
      - id: s.inFlight.Add
        kind: value
      - id: s.acceptLoop
        kind: internal
    steps:
      - loop:
          do:
            - bind: listeners, err
              eval: s.adoptStream(name)
              to: s.adoptStream
            - opt:
                do:
                  - return: err
                when: err != nil
            - loop:
                do:
                  - bind: ln
                    eval: layered(raw, group.identity, group.tracksCloses())
                    to: layered
                  - bind: addr
                    eval: "corenet.AddressValue{Network: ln.Addr().Network(), Addr: ln.Addr().String()}"
                  - bind: bound
                    eval: "&boundListener{group: group.name, addr: addr, ln: ln}"
                  - eval: s.mu.Lock()
                    to: s.mu.Lock
                  - set: s.listeners
                    value: append(s.listeners, bound)
                  - set: s.states
                    value: |-
                      append(s.states, corenet.ListenerStateValue{
                      				Group:   group.name,
                      				Address: ln.Addr().String(),
                      				Network: addr.Network,
                      				Shards:  1,
                      				Adopted: true,
                      				//: read from the raw socket: TLS hides its descriptor.
                      				Exclusive: exclusiveOf(listenerSocket(raw)),
                      			})
                  - eval: s.mu.Unlock()
                    to: s.mu.Unlock
                  - eval: s.inFlight.Add(1)
                    to: s.inFlight.Add
                  - go: s.acceptLoop(bound, group, handler)
                    to: s.acceptLoop
                key: _
                range: listeners
                value: raw
          key: _
          range: group.adopt
          value: name
      - return: nil
  - of: (*Server).bindShards
    participants:
      - id: caller
        kind: actor
      - id: (*Server).bindShards
        kind: self
      - id: resolveShards
        kind: internal
      - id: listen
        kind: internal
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
      - id: s.inFlight.Add
        kind: value
      - id: s.acceptLoop
        kind: internal
    steps:
      - bind: count, degraded, reason
        eval: resolveShards(group.limits.Shards, addr.Network)
        to: resolveShards
      - bind: opened
        eval: "0"
      - loop:
          do:
            - bind: ln, rep, err
              eval: listen(ctx, addr, group.identity, count > 1, group.tracksCloses(), s.rebindAttempts(addr))
              to: listen
            - opt:
                do:
                  - return: err
                when: err != nil
            - bind: bound
              eval: "&boundListener{group: group.name, addr: addr, ln: ln}"
            - eval: s.mu.Lock()
              to: s.mu.Lock
            - set: s.listeners
              value: append(s.listeners, bound)
            - opt:
                do:
                  - set: s.states
                    value: |-
                      append(s.states, corenet.ListenerStateValue{
                      				Group:          group.name,
                      				Address:        ln.Addr().String(),
                      				Network:        addr.Network,
                      				Shards:         count,
                      				Exclusive:      rep.exclusive,
                      				BindWait:       corenet.DurationValue(rep.wait),
                      				Degraded:       degraded,
                      				DegradedReason: reason,
                      			})
                when: opened == 0
            - eval: s.mu.Unlock()
              to: s.mu.Unlock
            - op: ++
              set: opened
            - eval: s.inFlight.Add(1)
              to: s.inFlight.Add
            - go: s.acceptLoop(bound, group, handler)
              to: s.acceptLoop
          range: count
      - return: nil
  - of: acceptDelay
    participants:
      - id: caller
        kind: actor
      - id: acceptDelay
        kind: self
      - id: "kbackoff.Value{BaseDelay: 5 * time.Millisecond, MaxDelay: time.Second, Multiplier: 2}.Delay"
        kind: value
    steps:
      - return: "kbackoff.Value{BaseDelay: 5 * time.Millisecond, MaxDelay: time.Second, Multiplier: 2}.Delay(failures)"
        to: "kbackoff.Value{BaseDelay: 5 * time.Millisecond, MaxDelay: time.Second, Multiplier: 2}.Delay"
  - of: (*Server).acceptLoop
    participants:
      - id: caller
        kind: actor
      - id: (*Server).acceptLoop
        kind: self
      - id: s.inFlight.Done
        kind: value
      - id: bound.ln.Accept
        kind: value
      - id: s.acceptBackoffs.Add
        kind: value
      - id: group.admission.Admit
        kind: internal
      - id: swallowErr
        kind: internal
      - id: s.total.Add
        kind: value
      - id: s.active.Add
        kind: value
      - id: s.inFlight.Add
        kind: value
      - id: s.serve
        kind: internal
    steps:
      - defer: s.inFlight.Done()
        to: s.inFlight.Done
      - bind: failures
        eval: "0"
      - loop:
          do:
            - bind: raw, err
              eval: bound.ln.Accept()
              to: bound.ln.Accept
            - opt:
                do:
                  - opt:
                      do:
                        - return: ""
                      when: errors.Is(err, stdnet.ErrClosed)
                  - op: ++
                    set: failures
                  - eval: s.acceptBackoffs.Add(1)
                    to: s.acceptBackoffs.Add
                  - opt:
                      do:
                        - return: ""
                      when: "!s.backOff(bound, acceptDelay(failures))"
                  - continue: true
                when: err != nil
            - set: failures
              value: "0"
            - var:
                name: release
                type: func()
            - opt:
                do:
                  - bind: ok
                    eval: "false"
                  - opt:
                      do:
                        - eval: swallowErr(raw.Close())
                          to: swallowErr
                        - continue: true
                      init:
                        bind: release, ok
                        eval: group.admission.Admit(raw.RemoteAddr())
                        op: =
                        to: group.admission.Admit
                      when: "!ok"
                when: group.admission != nil
            - eval: s.total.Add(1)
              to: s.total.Add
            - eval: s.active.Add(1)
              to: s.active.Add
            - eval: s.inFlight.Add(1)
              to: s.inFlight.Add
            - go: s.serve(raw, group, handler, release)
              to: s.serve
          forever: true
  - of: (*Server).backOff
    participants:
      - id: caller
        kind: actor
      - id: (*Server).backOff
        kind: self
      - id: s.clk.NewTimer
        kind: value
      - id: timer.Stop
        kind: value
    steps:
      - bind: timer
        eval: s.clk.NewTimer(delay)
        to: s.clk.NewTimer
      - defer: timer.Stop()
        to: timer.Stop
      - select:
          cases:
            - comm: <-timer.C()
              do:
                - return: "true"
            - comm: <-bound.closedSignal()
              do:
                - return: "false"
  - of: (*Server).serve
    participants:
      - id: caller
        kind: actor
      - id: (*Server).serve
        kind: self
      - id: s.inFlight.Done
        kind: value
      - id: context
        kind: stdlib
      - id: s.active.Add
        kind: value
      - id: s.acquire
        kind: internal
      - id: s.release
        kind: internal
      - id: recoverHandler
        kind: internal
      - id: swallowErr
        kind: internal
    steps:
      - defer: s.inFlight.Done()
        to: s.inFlight.Done
      - bind: ctx
        eval: s.runCtx
      - opt:
          do:
            - defer: release()
            - set: ctx
              to: context
              value: context.WithValue(ctx, admissionReleaseKey{}, release)
          when: release != nil
      - defer: s.active.Add(-1)
        to: s.active.Add
      - bind: c
        eval: s.acquire(raw, group)
        to: s.acquire
      - defer: s.release(c)
        to: s.release
      - defer: recoverHandler()
        to: recoverHandler
      - eval: swallowErr(s.admit(ctx, group.limiter, c, handler))
        to: swallowErr
  - of: recoverHandler
    steps:
      - eval: recover()
  - of: (*Server).Serve
    participants:
      - id: caller
        kind: actor
      - id: (*Server).Serve
        kind: self
      - id: s.Start
        kind: internal
      - id: context
        kind: stdlib
      - id: s.Shutdown
        kind: internal
      - id: s.stalledGroup
        kind: internal
      - id: errs
        kind: package
      - id: stallError
        kind: internal
    steps:
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: s.Start(ctx)
            to: s.Start
          when: err != nil
      - var:
          name: stalled
          type: bool
      - select:
          cases:
            - comm: <-ctx.Done()
            - comm: <-s.stall.stalled
              do:
                - set: stalled
                  value: "true"
      - bind: drainCtx, cancel
        eval: context.WithTimeout(context.WithoutCancel(ctx), s.drainTimeout)
        to: context
      - defer: cancel()
      - bind: err
        eval: s.Shutdown(drainCtx)
        to: s.Shutdown
      - opt:
          do:
            - return: err
          when: "!stalled"
      - bind: group, _
        eval: s.stalledGroup()
        to: s.stalledGroup
      - opt:
          do:
            - return: |-
                errs.Wrap(corenet.LoopGroupStalled, errs.WrapParams{},
                			errs.String("group", group), errs.String("drain", err.Error()))
              to: errs
          when: err != nil
      - return: stallError(group)
        to: stallError
  - of: (*Server).Shutdown
    participants:
      - id: caller
        kind: actor
      - id: (*Server).Shutdown
        kind: self
      - id: s.phase.Store
        kind: value
      - id: s.stopStallWatch
        kind: internal
      - id: s.closeStreamListeners
        kind: internal
      - id: s.handoverPackets
        kind: internal
      - id: s.closeListeners
        kind: internal
      - id: s.shutdownLoops
        kind: internal
      - id: s.shutdownHTTP
        kind: internal
      - id: s.waitIdle
        kind: internal
      - id: s.closeLive
        kind: internal
      - id: s.inFlight.Wait
        kind: value
    steps:
      - opt:
          do:
            - return: nil
          when: corenet.Phase(s.phase.Load()) == corenet.PhaseNew
      - eval: s.phase.Store(uint32(corenet.PhaseDraining))
        to: s.phase.Store
      - eval: s.stopStallWatch()
        to: s.stopStallWatch
      - eval: s.closeStreamListeners()
        to: s.closeStreamListeners
      - eval: s.handoverPackets(ctx)
        to: s.handoverPackets
      - eval: s.closeListeners()
        to: s.closeListeners
      - bind: loopErr
        eval: s.shutdownLoops(ctx)
        to: s.shutdownLoops
      - eval: s.shutdownHTTP(ctx)
        to: s.shutdownHTTP
      - bind: err
        eval: s.waitIdle(ctx)
        to: s.waitIdle
      - opt:
          do:
            - eval: s.stop()
          when: s.stop != nil
      - opt:
          do:
            - eval: s.closeLive()
              to: s.closeLive
            - eval: s.phase.Store(uint32(corenet.PhaseStopped))
              to: s.phase.Store
            - return: err
          when: err != nil
      - eval: s.inFlight.Wait()
        to: s.inFlight.Wait
      - eval: s.phase.Store(uint32(corenet.PhaseStopped))
        to: s.phase.Store
      - return: loopErr
  - of: (*Server).shutdownHTTP
    participants:
      - id: caller
        kind: actor
      - id: (*Server).shutdownHTTP
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: slices
        kind: stdlib
      - id: s.mu.RUnlock
        kind: value
      - id: group.httpAdapter.shutdown
        kind: internal
    steps:
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: groups
        eval: slices.Clone(s.groups)
        to: slices
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - loop:
          do:
            - opt:
                do:
                  - eval: group.httpAdapter.shutdown(ctx)
                    to: group.httpAdapter.shutdown
                when: group.httpAdapter != nil
          key: _
          range: groups
          value: group
  - of: (*Server).closeHTTP
    participants:
      - id: caller
        kind: actor
      - id: (*Server).closeHTTP
        kind: self
      - id: s.mu.RLock
        kind: value
      - id: slices
        kind: stdlib
      - id: s.mu.RUnlock
        kind: value
      - id: group.httpAdapter.closeNow
        kind: internal
    steps:
      - eval: s.mu.RLock()
        to: s.mu.RLock
      - bind: groups
        eval: slices.Clone(s.groups)
        to: slices
      - eval: s.mu.RUnlock()
        to: s.mu.RUnlock
      - loop:
          do:
            - opt:
                do:
                  - eval: group.httpAdapter.closeNow()
                    to: group.httpAdapter.closeNow
                when: group.httpAdapter != nil
          key: _
          range: groups
          value: group
  - of: (*Server).waitIdle
    participants:
      - id: caller
        kind: actor
      - id: (*Server).waitIdle
        kind: self
      - id: time
        kind: stdlib
      - id: ticker.Stop
        kind: value
      - id: errs
        kind: package
