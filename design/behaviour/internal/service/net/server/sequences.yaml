      - bind: raw, err
        eval: sc.SyscallConn()
        to: sc.SyscallConn
      - opt:
          do:
            - return: "false"
          when: err != nil
      - var:
          name: set
          type: bool
      - opt:
          do:
            - return: "false"
          init:
            bind: cerr
            eval: |-
              raw.Control(func(fd uintptr) {
              		v, gerr := exclusiveAddrOf(fd)
