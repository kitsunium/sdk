            - return: 0, 0
          when: sc == nil
      - bind: raw, err
        eval: sc.SyscallConn()
        to: sc.SyscallConn
      - opt:
          do:
            - return: 0, 0
          when: err != nil
      - opt:
          do:
            - return: 0, 0
          init:
            bind: cerr
            eval: raw.Control(func(fd uintptr) { receive, send = readBuffers(fd) })
            to: raw.Control
          when: cerr != nil
      - return: receive, send
  - of: bufferSpec
    steps:
      - return: "socketSpec{receiveBuffer: limits.ReceiveBuffer, sendBuffer: limits.SendBuffer}"
  - of: adoptedBuffers
    participants:
      - id: caller
        kind: actor
      - id: adoptedBuffers
        kind: self
      - id: applyBuffers
        kind: internal
