                range: conns
                value: pc
          key: _
          range: group.adopt
          value: name
      - return: nil
  - of: batchDegradation
    steps:
      - opt:
          do:
            - return: false, ""
          when: batchAvailable() || batchSize(limits) <= 1
      - return: true, "batched datagram read unavailable on this platform; reading one per syscall"
