      - id: caller
        kind: actor
      - id: (*Server).Shutdown
        kind: self
      - id: s.phase.Store
        kind: value
      - id: s.closeListeners
        kind: internal
      - id: s.shutdownHTTP
        kind: internal
      - id: s.waitIdle
        kind: internal
      - id: s.closeLive
        kind: internal
      - id: s.inFlight.Wait
        kind: value
    steps:
      - opt:
          do:
            - return: nil
          when: corenet.Phase(s.phase.Load()) == corenet.PhaseNew
      - eval: s.phase.Store(uint32(corenet.PhaseDraining))
        to: s.phase.Store
      - eval: s.closeListeners()
        to: s.closeListeners
      - eval: s.shutdownHTTP(ctx)
        to: s.shutdownHTTP
      - bind: err
        eval: s.waitIdle(ctx)
        to: s.waitIdle
      - opt:
          do:
            - eval: s.stop()
          when: s.stop != nil
      - opt:
          do:
            - eval: s.closeLive()
              to: s.closeLive
            - eval: s.phase.Store(uint32(corenet.PhaseStopped))
              to: s.phase.Store
            - return: err
          when: err != nil
      - eval: s.inFlight.Wait()
        to: s.inFlight.Wait
      - eval: s.phase.Store(uint32(corenet.PhaseStopped))
        to: s.phase.Store
      - return: nil
  - of: (*Server).shutdownHTTP
