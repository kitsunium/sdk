      - id: caller
        kind: actor
      - id: (*Server).bindPacketGroup
        kind: self
      - id: group.resolved
        kind: internal
      - id: s.adoptPacketSockets
        kind: internal
      - id: listenPacket
        kind: internal
      - id: batchDegradation
        kind: internal
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
      - id: s.inFlight.Add
        kind: value
      - id: s.readLoop
        kind: internal
    steps:
      - bind: handler
        eval: group.resolved()
        to: group.resolved
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: s.adoptPacketSockets(group, handler)
            to: s.adoptPacketSockets
