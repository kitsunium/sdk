        kind: internal
      - id: setBacklog
        kind: internal
      - id: hostSomaxconn
        kind: internal
    steps:
      - opt:
          do:
            - return: defaultBacklog(), ""
              to: defaultBacklog
          when: requested <= 0
      - opt:
          do:
            - return: defaultBacklog(), "the listen backlog could not be set on this socket (" + why + "); the host's applies"
              to: defaultBacklog
          init:
            bind: why
            eval: setBacklog(ln, requested)
            to: setBacklog
          when: why != ""
      - bind: host
        eval: hostSomaxconn()
        to: hostSomaxconn
      - opt:
          do:
            - return: host, "Backlog " + strconv.Itoa(requested) + " is above the host's somaxconn " + strconv.Itoa(host) + "; the kernel clamps it to " + strconv.Itoa(host)
          when: host > 0 && requested > host
      - return: requested, ""
  - of: joinReason
    steps:
      - opt:
          do:
            - return: reason + more
          when: more == "" || reason == ""
      - return: reason + "; " + more
  - of: setBacklog
    participants:
      - id: caller
        kind: actor
      - id: setBacklog
        kind: self
      - id: sc.SyscallConn
