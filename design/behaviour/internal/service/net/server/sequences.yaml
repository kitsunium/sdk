        kind: self
      - id: s.mu.Lock
        kind: value
      - id: s.mu.Unlock
        kind: value
      - id: errs
        kind: package
      - id: groupDeclErr
        kind: internal
      - id: s.phase.Store
        kind: value
      - id: slices
        kind: stdlib
      - id: context
