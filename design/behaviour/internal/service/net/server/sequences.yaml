  - of: listenPacket
    participants:
      - id: caller
        kind: actor
      - id: listenPacket
        kind: self
      - id: familyUnavailable
        kind: internal
      - id: bindRetrying
        kind: internal
      - id: exclusiveOf
        kind: internal
    steps:
      - opt:
          do:
            - return: |-
                nil, rep, errs.Wrap(corenet.UnsupportedNetwork, errs.WrapParams{},
                			errs.String("network", addr.Network))
          init:
            bind: _, ok
            eval: packetNetworks[addr.Network]
          when: "!ok"
      - opt:
          do:
            - return: nil, rep, unavailable
          init:
            bind: unavailable
            eval: familyUnavailable(addr)
            to: familyUnavailable
          when: unavailable != nil
      - opt:
          do:
            - return: |-
                nil, rep, errs.Wrap(corenet.InvalidAddress, errs.WrapParams{},
                			errs.String("address", addr.String()))
          when: strings.TrimSpace(addr.Addr) == ""
      - bind: cfg
        eval: "stdnet.ListenConfig{Control: listenControl(false)}"
      - bind: bound, wait, lerr
        eval: |-
          bindRetrying(ctx, 1, addrInUse, func() (stdnet.PacketConn, error) {
          		//: one attempt.
          		return cfg.ListenPacket(ctx, addr.Network, addr.Addr)
          	})
        to: bindRetrying
      - set: rep.wait
        value: wait
      - opt:
          do:
            - return: |-
                nil, rep, errs.Wrap(corenet.ListenFailed, errs.WrapParams{},
                			errs.String("address", addr.String()), errs.String("cause", lerr.Error()))
          when: lerr != nil
      - set: rep.exclusive
        to: exclusiveOf
        value: exclusiveOf(packetSocket(bound))
      - return: bound, rep, nil
