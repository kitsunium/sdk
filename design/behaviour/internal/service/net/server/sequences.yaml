              to: batchDegradation
            - loop:
                do:
                  - bind: addr
                    eval: "corenet.AddressValue{Network: pc.LocalAddr().Network(), Addr: pc.LocalAddr().String()}"
                  - bind: bound
                    eval: "&boundPacketConn{group: group.name, addr: addr, pc: pc}"
