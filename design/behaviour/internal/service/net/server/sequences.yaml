          do:
            - bind: v, err
              eval: bind()
            - opt:
                do:
                  - var:
                      name: wait
                      type: time.Duration
                  - opt:
                      do:
                        - set: wait
                          to: time
                          value: time.Since(start)
                      when: attempt > 1
                  - return: v, wait, err
                when: err == nil || attempt >= attempts || !inUse(err)
            - bind: timer
              eval: time.NewTimer(rebindDelay(attempt))
              to: time
            - select:
                cases:
                  - comm: <-timer.C
                  - comm: <-ctx.Done()
                    do:
                      - eval: timer.Stop()
                        to: timer.Stop
                      - return: v, time.Since(start), err
          init: attempt := 1
          post: attempt++
