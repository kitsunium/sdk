    participants:
      - id: caller
        kind: actor
      - id: (*httpAdapter).shutdown
        kind: self
      - id: a.stop
        kind: internal
      - id: swallowErr
        kind: internal
    steps:
      - bind: bridge, srv, daemon
        eval: a.stop()
        to: a.stop
      - opt:
          do:
            - return: ""
          when: bridge == nil
      - eval: swallowErr(bridge.Close())
        to: swallowErr
      - eval: swallowErr(srv.Shutdown(ctx))
        to: swallowErr
      - select:
          cases:
            - comm: <-daemon.Done()
            - comm: <-ctx.Done()
