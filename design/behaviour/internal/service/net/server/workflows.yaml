workflows:
  - of: wrapLoop
    steps:
      - bind: chain
        eval: h
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: mw == nil
            - bind: layer
              eval: mw(chain)
            - bind: l, ok
              eval: layer.(corenet.LoopLayered)
            - opt:
                do:
                  - return: nil, false
                when: "!ok || !sameHandler(l.Next(), chain)"
            - set: chain
              value: layer
          key: _
          range: slices.Backward(mws)
          value: mw
      - return: chain, true
  - of: (*portableLoop).compactSpills
    steps:
      - loop:
          do:
            - opt:
                do:
                  - set: pc.spill
                    value: append(pc.spill[:0], pc.spill[pc.spillOff:]...)
                  - set: pc.spillOff
                    value: "0"
                when: pc.open && pc.spillOff > 0
          key: _
          range: pl.conns
          value: pc
  - of: (*multiWriter).left
    steps:
      - loop:
          cond: k < end
          do:
            - opt:
                do:
                  - set: w.invalidRun
                    value: "0"
                  - return: ""
                when: w.spans[k].count > 1
          post: k++
  - of: (*operatorEnv).applied
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: entry.token
                when: "!entry.kernel && e.allows(entry.rank)"
          key: _
          range: capabilityRegistry
          value: entry
      - return: corenet.CapabilityGoroutine
  - of: lookupCapability
    steps:
      - loop:
          do:
            - opt:
                do:
                  - return: entry, true
                when: string(entry.token) == token
          key: _
          range: capabilityRegistry
          value: entry
      - return: capabilityEntry{}, false
  - of: unixAddr
    steps:
      - bind: sa
        eval: (*syscall.RawSockaddrUnix)(unsafe.Pointer(raw))
      - opt:
          do:
            - return: "&stdnet.UnixAddr{Net: \"unixgram\"}"
          when: sa.Path[0] == 0
      - bind: buf
        eval: make([]byte, 0, len(sa.Path))
      - loop:
          do:
            - opt:
                do:
                  - break: true
                when: c == 0
            - set: buf
              value: append(buf, byte(c))
          key: _
          range: sa.Path
          value: c
      - return: "&stdnet.UnixAddr{Name: string(buf), Net: \"unixgram\"}"
  - of: groupStalled
    steps:
      - opt:
          do:
            - return: "false"
          when: len(st.RingStates) == 0
      - loop:
          do:
            - opt:
                do:
                  - return: "false"
                when: "!r.Draining"
          key: _
          range: st.RingStates
          value: r
      - return: "true"
  - of: (*Server).faults
    steps:
      - bind: out
        eval: make([]corenet.FaultValue, 0, len(s.operator.faults))
      - set: out
        value: append(out, s.operator.faults...)
      - loop:
          do:
            - opt:
                do:
                  - set: out
                    value: "append(out, corenet.FaultValue{Source: faultListener, Group: l.Group, Reason: l.DegradedReason})"
                when: l.Degraded
          key: _
          range: st.Listeners
          value: l
      - set: out
        value: append(out, s.gsoFaults()...)
      - bind: serving
        eval: st.Phase == corenet.PhaseServing
      - loop:
          do:
            - opt:
                do:
                  - set: out
                    value: "append(out, corenet.FaultValue{Source: faultLoop, Group: lp.Group, Reason: lp.DegradedReason})"
                when: lp.Degraded
            - opt:
                do:
                  - set: out
                    value: append(out, ringFaults(lp)...)
                when: serving
            - loop:
                do:
                  - opt:
                      do:
                        - set: out
                          value: "append(out, corenet.FaultValue{Source: faultCapability, Group: lp.Group, Reason: string(c.Name) + \": \" + c.Reason})"
                      when: c.Status == statusMissing
                key: _
                range: lp.Capabilities
                value: c
          key: _
          range: st.Loops
          value: lp
