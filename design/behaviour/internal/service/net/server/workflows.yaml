  - of: ringFaults
    steps:
      - opt:
          do:
            - return: |-
                []corenet.FaultValue{{
                			Source: faultStall, Group: lp.Group,
                			Reason: "every ring drained by its watchdog: the group accepts nothing; " + runbook,
                		}}
          when: groupStalled(lp)
      - var:
          name: out
          type: "[]corenet.FaultValue"
      - loop:
          do:
            - opt:
                do:
                  - set: out
                    value: |-
                      append(out, corenet.FaultValue{
                      				Source: faultRing, Group: lp.Group,
                      				Reason: "loop " + strconv.Itoa(r.Loop) + " ring " + strconv.Itoa(r.Ring) + " drained by its watchdog; " + runbook,
                      			})
                when: r.Draining
          key: _
          range: lp.RingStates
          value: r
      - return: out
  - of: checkProtocols
    steps:
      - opt:
          do:
            - return: "\"empty\""
          when: len(protos) == 0
      - loop:
          do:
            - opt:
                do:
                  - return: "\"empty identifier\""
                when: p == ""
            - opt:
                do:
                  - return: p
                when: (p != protoHTTP1 && p != protoH2) || slices.Contains(protos[:i], p)
