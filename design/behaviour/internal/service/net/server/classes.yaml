# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - grouped: true
    items:
      - doc: |-
          defaultPerAddress is the pre-handshake budget of one address (ADR
          0174): a handful of concurrent handshakes, small enough that one
          address cannot occupy the listener with connections that never finish.
        name: defaultPerAddress
        type: int
        value: "4"
      - doc: |-
          defaultReserved is twice the ordinary budget, so a declared address
          keeps headroom while a flood from elsewhere spends its own.
        name: defaultReserved
        type: int
        value: "8"
    name: defaultPerAddress
  - grouped: true
    items:
      - doc: |-
          replyQueue is how many replies one batch may queue before they are sent
          early to make room.
        name: replyQueue
        type: int
        value: "128"
      - doc: |-
          replyArena is the room the queued replies' bytes share, copied out of the
          handler's buffer so it may reuse it as soon as Reply returns.
        name: replyArena
        type: int
        value: 256 << 10
    name: replyQueue
  - doc: |-
      defaultHandshakeTimeout bounds the TLS negotiation when a group sets none.

      It has a default where Read, Write and Idle deliberately do not, because the
      handshake is the one phase a peer can stall before the application sees
      anything at all: no handler has run, no request exists, and nothing else in
      the stack has a reason to time it out. tls.NewListener does not handshake in
      Accept — the negotiation happens on the connection's own goroutine, which is
      the right design — so without a bound here a peer that opens a socket and
      says nothing pins a goroutine, an in-flight token, a live-socket registry
      entry and a slot under the group's connection ceiling, for free and forever.
    items:
      - name: defaultHandshakeTimeout
        type: time.Duration
        value: 10 * time.Second
    name: defaultHandshakeTimeout
  - doc: healthCheckName names the server's readiness and liveness checks.
    items:
      - name: healthCheckName
        type: string
        value: "\"net/server\""
    name: healthCheckName
  - doc: drainPollInterval is how often the drain re-checks the in-flight count.
    items:
      - name: drainPollInterval
        type: time.Duration
        value: 10 * time.Millisecond
    name: drainPollInterval
  - doc: |-
      The eight callbacks a loop middleware's layer forwards, in the order the
      probe sends them.
    grouped: true
    items:
      - name: probeStart
        type: int
        value: iota
      - name: probeOpen
      - name: probeData
      - name: probeTimeout
      - name: probeWritable
      - name: probeBatchEnd
      - name: probeClose
      - name: probeHonours
      - name: probeCallbacks
    name: probeStart
  - doc: nativeLoopBackends is true where the leaf's io_uring and epoll exist.
    items:
      - name: nativeLoopBackends
        type: bool
        value: "true"
    name: nativeLoopBackends
  - grouped: true
    items:
      - doc: |-
          portableReadSize is one connection's read buffer on the portable
          backend.
        name: portableReadSize
        type: int
        value: 16 << 10
      - doc: portableTick is the portable backend's timer resolution.
        name: portableTick
        type: time.Duration
        value: 10 * time.Millisecond
      - doc: portableEvents bounds the events one batch takes.
        name: portableEvents
        type: int
        value: "512"
      - doc: portablePostCap is the portable backend's post queue.
        name: portablePostCap
        type: int
        value: "4096"
      - doc: |-
          portableSpillCap is LoopValue.SpillCap's default, as the native
          backends have it.
        name: portableSpillCap
        type: int
        value: 64 << 10
      - doc: |-
          portableOutputCap is LoopValue.OutputCap's default, as the native
          backends have it.
        name: portableOutputCap
        type: int
        value: 1 << 20
      - doc: |-
          recycledMark is the byte a released buffer is filled with under
          markRecycled.
        name: recycledMark
        type: byte
        value: "0xAA"
    name: portableReadSize
  - doc: The kinds of a portable event.
    grouped: true
    items:
      - name: pevOpen
        type: uint8
        value: iota
      - name: pevData
      - name: pevEnd
      - name: pevSent
    name: pevOpen
  - grouped: true
    items:
      - doc: |-
          udpGRO is UDP_GRO, the socket option that lets the kernel hand a reader
          several datagrams of one flow as one message, and the type of the control
          message carrying their size (include/uapi/linux/udp.h; Linux 5.0). The
          standard library's syscall package does not define it.
        name: udpGRO
        value: "104"
      - doc: |-
          groMessageSize is the largest message a GRO read can return: a coalesced
          message is bounded by the 16-bit IP length it would be sent with, so a
          slot this large never cuts one (MSG_TRUNC) for want of room.
        name: groMessageSize
        type: int
        value: "65535"
      - doc: |-
          groSegmentBytes is the size of the UDP_GRO control message's payload: the
          segment size, a C int.
        name: groSegmentBytes
        type: int
        value: "4"
      - doc: |-
          groControlSpace is the control room a GRO read gives each message: the
          UDP_GRO message's 24 bytes and room beside it for those a caller may have
          asked of the socket itself — IP_PKTINFO (32), IPV6_PKTINFO (40), a
          timestamp (32 to 64) —, so a foreign control message never cuts the one
          the reader needs (MSG_CTRUNC). 64 slots of it are 16 KiB.
        name: groControlSpace
        type: int
        value: "256"
    name: udpGRO
  - doc: |-
      mmsghdrAlign is the alignment C gives struct mmsghdr, which it inherits from
      struct msghdr — the widest member decides, and msghdr holds the pointers.
    items:
      - name: mmsghdrAlign
        type: uintptr
        value: unsafe.Alignof(syscall.Msghdr{})
    name: mmsghdrAlign
  - doc: |-
      mmsghdrStride is the distance the kernel advances between array elements:
      struct msghdr, then the uint32 length, rounded up to mmsghdrAlign.
    items:
      - name: mmsghdrStride
        type: uintptr
        value: |-
          (unsafe.Sizeof(syscall.Msghdr{}) +
          	unsafe.Sizeof(uint32(0)) + mmsghdrAlign - 1) / mmsghdrAlign * mmsghdrAlign
    name: mmsghdrStride
  - grouped: true
    items:
      - doc: |-
          udpSegment is UDP_SEGMENT: as a socket option it answers whether the
          kernel has UDP GSO (Linux 4.18), and as a control message on one send it
          cuts the send into datagrams of its value (include/uapi/linux/udp.h). The
          standard library's syscall package does not define it.
        name: udpSegment
        value: "103"
      - doc: |-
          udpMaxSegments is the most datagrams one GSO send may carry: the kernel's
          UDP_MAX_SEGMENTS since 4.18, the floor every kernel the SDK runs on keeps.
        name: udpMaxSegments
        type: int
        value: "64"
      - doc: udpHeaderBytes is the UDP header every datagram carries.
        name: udpHeaderBytes
        type: int
        value: "8"
      - doc: ipv4HeaderBytes is IPv4's header, without options.
        name: ipv4HeaderBytes
        type: int
        value: "20"
      - doc: ipv6HeaderBytes is IPv6's fixed header, without extension headers.
        name: ipv6HeaderBytes
        type: int
        value: "40"
      - doc: |-
          ipMaxLength is the 16-bit IP length a GSO send is built as before the
          device cuts it: its header, the UDP header and every segment fit in it,
          or the kernel refuses the send with EMSGSIZE.
        name: ipMaxLength
        type: int
        value: "65535"
      - doc: |-
          ethernetMTU bounds the segment a reply is coalesced at: a segment past the
          path's MTU is refused (EINVAL), where the same reply sent alone would be
          fragmented, so a larger reply leaves alone. A path with a smaller MTU
          refuses the send, and its replies are sent again one by one.
        name: ethernetMTU
        type: int
        value: "1500"
      - doc: "segmentSizeBytes is UDP_SEGMENT's control payload: a C uint16."
        name: segmentSizeBytes
        type: int
        value: "2"
      - doc: |-
          gsoInvalidLimit is how many GSO sends in a row the kernel may refuse with
          EINVAL before GSO is switched off for the socket: a refusal that no
          smaller segment cures — SO_NO_CHECK, a device that takes no GSO — would
          otherwise cost one failed sendmmsg a batch for the socket's life.
        name: gsoInvalidLimit
        type: int
        value: "4"
    name: udpSegment
  - doc: |-
      The ranks of the lattice iouring > epoll > portable > goroutine (ADR 0188
      §D1). A rank is compared, never shown: State spells the capability.
    grouped: true
    items:
      - doc: rankGoroutine is the goroutine engine, the bottom.
        name: rankGoroutine
        type: int
        value: iota + 1
      - doc: rankPortable is the portable loop backend, the loop family's floor.
        name: rankPortable
      - doc: rankEpoll is epoll.
        name: rankEpoll
      - doc: rankIOURing is io_uring, the top.
        name: rankIOURing
    name: rankGoroutine
  - doc: |-
      rankKernel is a kernel capability's rank: below every engine, never a
      ceiling, never compared with one.
    items:
      - name: rankKernel
        type: int
        value: "0"
    name: rankKernel
  - doc: The words State uses for the environment.
    grouped: true
    items:
      - doc: sourceEnvironment is OverrideValue.Source when a variable is set.
        name: sourceEnvironment
        type: string
        value: "\"environment\""
      - doc: faultEnvironment is FaultValue.Source for an unknown token.
        name: faultEnvironment
        type: string
        value: "\"environment\""
      - doc: |-
          unknownDisables is CapabilityValue.Reason for every optional capability
          an unknown token switched off (R5: no optional capability).
        name: unknownDisables
        type: string
        value: "\"unknown token: no optional capability\""
    name: sourceEnvironment
  - grouped: true
    items:
      - doc: |-
          faultGSO is the Source of a fault naming a group a socket of which sends
          without GSO (ADR 0192).
        name: faultGSO
        type: string
        value: "\"gso\""
      - doc: |-
          handoverBudget bounds the wait for the handover's drains, inside Shutdown's
          own budget: a socket that keeps receiving faster than one batch a read never
          reaches EAGAIN, and the stream and loop drains after it share the same
          context (ADR 0192 §D4).
        name: handoverBudget
        type: time.Duration
        value: 250 * time.Millisecond
    name: faultGSO
  - grouped: true
    items:
      - doc: |-
          defaultMaxPacketSize is the largest datagram accepted when a group sets
          no ceiling. It comfortably exceeds a typical MTU while staying far below
          the 64 KiB theoretical maximum, so a misconfigured peer cannot make the
          server allocate a large buffer per socket.
        name: defaultMaxPacketSize
        type: int
        value: "8192"
      - doc: defaultBatchSize is how many datagrams one read attempts to collect.
        name: defaultBatchSize
        type: int
        value: "16"
    name: defaultMaxPacketSize
  - doc: |-
      soReusePort is SO_REUSEPORT.

      It is absent from the Go standard library's syscall package, so the value is
      hand-defined and cited here — the discipline ADR 0018 established for ABI
      constants, adopted because golang.org/x/sys is banned SDK-wide. Linux defines
      it in include/asm-generic/socket.h as 15.
    items:
      - name: soReusePort
        type: int
        value: "0xf"
    name: soReusePort
  - doc: |-
      sysSendmmsg is sendmmsg(2)'s number on linux/amd64
      (arch/x86/entry/syscalls/syscall_64.tbl), which the standard library's
      syscall package does not define on this architecture.
    items:
      - name: sysSendmmsg
        type: uintptr
        value: "307"
    name: sysSendmmsg
  - grouped: true
    items:
      - doc: defaultDrainTimeout bounds Shutdown when the caller sets no budget.
        name: defaultDrainTimeout
        type: time.Duration
        value: 15 * time.Second
      - doc: |-
          expectedGroups pre-sizes the group table. Servers declare a handful of
          groups, not hundreds; the hint avoids a rehash on the common shapes.
        name: expectedGroups
        type: int
        value: "8"
      - doc: |-
          expectedLiveConns pre-sizes the live-socket registry so a burst of
          accepts does not rehash it on the accept path.
        name: expectedLiveConns
        type: int
        value: "256"
    name: defaultDrainTimeout
  - grouped: true
    items:
      - doc: |-
          entryHTTP, entryTCP and entryUDP name the simple API's entries in an
          error's "entry" field.
        name: entryHTTP
        type: string
        value: "\"HTTP\""
      - doc: entryTCP is Server.TCP.
        name: entryTCP
        type: string
        value: "\"TCP\""
      - doc: entryUDP is Server.UDP.
        name: entryUDP
        type: string
        value: "\"UDP\""
    name: entryHTTP
  - grouped: true
    items:
      - doc: |-
          portByteShift converts the network-byte-order port the kernel reports
          into host order. sockaddr_in stores it big-endian regardless of platform.
        name: portByteShift
        type: uint16
        value: "8"
      - doc: portLowByteMask isolates the low octet during that conversion.
        name: portLowByteMask
        type: uint16
        value: "0xFF"
    name: portByteShift
  - grouped: true
    items:
      - doc: |-
          loopStallGrace is how long a loop group may stay stalled — every ring of
          it drained by its watchdog — before the server's liveness check fails
          (ADR 0188, R1). Serve returns at once; the grace is for a process that
          keeps running without Serve, so an orchestrator restarts it.
        name: loopStallGrace
        type: time.Duration
        value: 30 * time.Second
      - doc: stallPoll is how often the loop groups' rings are read for a stall.
        name: stallPoll
        type: time.Duration
        value: time.Second
      - doc: runbook is what a fault about a drained ring tells the operator to set.
        name: runbook
        type: string
        value: "\"set \" + corenet.EnvDisable + \"=\" + string(corenet.CapabilityIOURing) + \" before restarting\""
    name: loopStallGrace
  - doc: The words FaultValue.Source takes for what the server reports itself.
    grouped: true
    items:
      - doc: faultListener is a degraded listener.
        name: faultListener
        type: string
        value: "\"listener\""
      - doc: faultLoop is a loop group on a lower backend than it asked for.
        name: faultLoop
        type: string
        value: "\"loop\""
      - doc: faultRing is one ring drained while others still accept.
        name: faultRing
        type: string
        value: "\"ring\""
      - doc: faultStall is a loop group every ring of which is drained.
        name: faultStall
        type: string
        value: "\"stall\""
      - doc: |-
          faultCapability is a class A-code capability the code opted into and
          the kernel lacks (ADR 0189).
        name: faultCapability
        type: string
        value: "\"capability\""
    name: faultListener
  - doc: |-
      The words CapabilityValue takes for what server reports itself: its socket
      probe, and the status that is a fault (ADR 0189).
    grouped: true
    items:
      - doc: classKernel is class A-kernel.
        name: classKernel
        type: string
        value: "\"a-kernel\""
      - doc: statusOn, statusAbsent and statusDisabled are the rows server writes.
        name: statusOn
        type: string
        value: "\"on\""
      - name: statusAbsent
        type: string
        value: "\"absent\""
      - name: statusDisabled
        type: string
        value: "\"disabled\""
      - doc: statusMissing is an opt-in the kernel lacks.
        name: statusMissing
        type: string
        value: "\"missing\""
    name: classKernel
