package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/net/server
  name: server
  purpose: Package server — adoption of listeners inherited from a supervisor.
types:
  - fields:
      - doc: |-
          PerAddress caps the connections one IPv4 address, or one IPv6 /64, may
          hold before their handshake completes. Default 4.
        name: PerAddress
        type: int
      - doc: |-
          Reserved is the budget of the addresses declared with SetReserved.
          Default 8.
        name: Reserved
        type: int
    kind: struct
    name: AdmissionConfig
  - fields:
      - name: cfg
        type: AdmissionConfig
      - name: mu
        type: sync.Mutex
      - name: pending
        type: map[string]int
      - name: reserved
        type: map[string]bool
      - name: refused
        type: atomic.Int64
    kind: struct
    methods:
      - name: Admit
        params: remote stdnet.Addr
        recv: a *Admission
        results: release func(), ok bool
      - name: SetReserved
        params: addrs []string
        recv: a *Admission
      - name: Refused
        recv: a *Admission
        results: int64
    name: Admission
  - doc: |-
      admissionReleaseKey carries a connection's admission release to the
      handshake handler, which gives the slot back once the peer authenticated.
    kind: struct
    name: admissionReleaseKey
  - doc: |-
      datagram is one slot in a read batch: a reusable buffer plus what the last
      read put in it. Slots are allocated once per read loop and reused for the
      life of the socket, which is what keeps datagram serving allocation-free.

      One slot is one message of the kernel, and with UDP GRO a message is several
      datagrams of one sender laid end to end: seg is then their size, every one
      but the last exactly seg bytes long, and the read loop hands each to the
      handler as its own Packet (ADR 0192).
    fields:
      - doc: buf is the slot's reusable payload buffer.
        name: buf
        type: "[]byte"
      - doc: n is how many bytes the last read placed in buf.
        name: "n"
        type: int
      - doc: |-
          seg is the size of each datagram of a coalesced message, as the UDP_GRO
          control message reported it; zero when the message is one datagram.
        name: seg
        type: int
      - doc: |-
          cut marks a message the kernel cut short — its payload past the buffer
          on a coalesced read (MSG_TRUNC) or its control data past the room left
          for it (MSG_CTRUNC): what survives cannot be split into whole datagrams,
          so the read loop drops it and counts it in State.
        name: cut
        type: bool
      - doc: addr is the sender of the last read.
        name: addr
        type: stdnet.Addr
    kind: struct
    methods:
      - doc: payload returns the bytes of the last read.
        name: payload
        recv: d *datagram
        results: "[]byte"
      - doc: |-
          segment returns the i-th datagram of the slot's message and whether there is
          one: the whole payload once for a message of one datagram, then seg-sized
          pieces with a shorter last one for a coalesced message.
        name: segment
        params: i int
        recv: d *datagram
        results: piece []byte, ok bool
      - doc: count returns how many datagrams the slot's message carries.
        name: count
        recv: d *datagram
        results: int
    name: datagram
  - doc: |-
      datagramSource collects one or more datagrams per call.

      The interface exists so the read loop is written once against "give me up to
      N datagrams", and the platform decides how many syscalls that costs. On Linux
      it is one recvmmsg; elsewhere it is a ReadFrom per datagram. The loop above it
      does not change either way — which is why the type is named for the role it
      plays rather than for its single method.

      IFACE-PLUGIN: implementations are selected by build tag and stay unexported.
    kind: named
    name: datagramSource
    underlying: |-
      interface {
      	// readBatch fills slots and returns how many were filled. It returns at
      	// least one datagram or an error.
      	readBatch(slots []datagram) (n int, err error)
      	// slotSize is the size newSlots is given for a group whose ceiling is
      	// ceiling: the ceiling itself, or a whole coalesced message when the
      	// source reads UDP GRO.
      	slotSize(ceiling int) int
      }
  - doc: |-
      datagramSink sends the replies a read batch's handlers make.

      By default every reply is a WriteTo, one datagram a call, its error the
      caller's (portableSink). Under BatchReplies the replies made while a batch is
      served are queued and leave together when it ends: on Linux one sendmmsg,
      consecutive replies to one peer of one size as one UDP GSO message
      (multiWriter); elsewhere, and on a socket sendmmsg cannot address, one WriteTo
      each (queuedSink) — darwin sends one datagram a call (ADR 0192).

      IFACE-PLUGIN: implementations are selected by build tag and stay unexported.
    kind: named
    name: datagramSink
    underlying: |-
      interface {
      	// begin opens a batch: replies made until flush may be queued.
      	begin()
      	// reply sends b to to, or queues it until flush while a batch is open.
      	reply(b []byte, to stdnet.Addr) (n int, err error)
      	// flush sends what the batch queued and closes it.
      	flush()
      }
  - doc: |-
      datagramCounters are what the batched datagram paths drop, reported in
      State's Datagrams. One set per server, shared by every socket's reader and
      sink.
    fields:
      - doc: |-
          truncated counts messages dropped for MSG_TRUNC on a coalesced read or
          MSG_CTRUNC on any.
        name: truncated
        type: atomic.Uint64
      - doc: gsoOversized counts GSO messages the kernel refused with EMSGSIZE.
        name: gsoOversized
        type: atomic.Uint64
      - doc: replyFailures counts queued replies that did not leave.
        name: replyFailures
        type: atomic.Uint64
    kind: struct
    name: datagramCounters
  - doc: |-
      portableReader reads one datagram per syscall using the standard library.

      It is the floor every platform has, and the fallback whenever the batched
      path is unavailable. Correctness is identical; only the syscall count differs,
      which is exactly what the benchmarks measure.
    fields:
      - doc: pc is the socket being read.
        name: pc
        type: stdnet.PacketConn
    kind: struct
    methods:
      - doc: |-
          readBatch implements datagramSource by reading a single datagram.

          It deliberately does not loop to fill the batch: a second ReadFrom would block
          until another datagram arrived, turning a low-traffic socket into a stalled
          one. Batching is only a win when the kernel already has the datagrams queued,
          which is precisely what recvmmsg reports and ReadFrom cannot.
        name: readBatch
        params: slots []datagram
        recv: r *portableReader
        results: n int, err error
      - doc: "slotSize implements datagramSource: one datagram a read, so the ceiling."
        name: slotSize
        params: ceiling int
        recv: r *portableReader
        results: int
    name: portableReader
  - doc: |-
      portableSink sends every reply at once, one datagram a call: the floor
      every platform has, and darwin's answer (ADR 0192).
    fields:
      - doc: pc is the socket replies leave through.
        name: pc
        type: stdnet.PacketConn
    kind: struct
    methods:
      - doc: "begin implements datagramSink: there is no queue to open."
        name: begin
        recv: portableSink
      - doc: reply implements datagramSink with one WriteTo.
        name: reply
        params: b []byte, to stdnet.Addr
        recv: w portableSink
        results: n int, err error
      - doc: "flush implements datagramSink: nothing was queued."
        name: flush
        recv: portableSink
    name: portableSink
  - doc: |-
      conn is the domain's view of one accepted connection.

      It embeds stdnet.Conn so every call the domain does not bound reaches the
      socket directly. Read and Write are overridden because the group's deadlines
      are documented as per-OPERATION bounds: installed once at accept time they
      would be a budget for the connection's whole life, which is a different and
      much weaker promise — a peer that sends one byte per second stays inside a
      lifetime budget for as long as the budget lasts, and outside a per-read one
      immediately.
    fields:
      - name: ""
        role: embedded
        type: stdnet.Conn
      - doc: id is the monotonic identifier assigned at accept time.
        name: id
        type: uint64
      - doc: group names the listener group that accepted this connection.
        name: group
        type: string
      - doc: scratch is the pooled read buffer handed out by Buffer.
        name: scratch
        type: "*[]byte"
      - doc: timeouts are the group's per-phase bounds, refreshed per operation.
        name: timeouts
        type: corenet.TimeoutsValue
      - doc: |-
          hijacked records that the socket's ownership has left the engine — a
          handler took the response over and now speaks its own protocol on it
          (WebSocket, or any other upgrade).

          It is deliberately NOT called "adopted": in this package that word
          already means a listener inherited from a supervisor (adopt.go), and the
          two would be impossible to tell apart in a stack trace.

          It exists because the engine closes every connection it serves on the way
          out, which is exactly right until the moment a handler takes the socket
          over: net/http reports StateHijacked immediately, the engine's ServeConn
          returns, and the deferred close then severed a connection the handler was
          still using. Written and read on the connection's own serve goroutine, so
          it needs no synchronisation of its own.
        name: hijacked
        type: bool
    kind: struct
    methods:
      - doc: Read implements net.Conn, bounding this read before it starts.
        name: Read
        params: p []byte
        recv: c *conn
        results: n int, err error
      - doc: Write implements net.Conn, bounding this write before it starts.
        name: Write
        params: p []byte
        recv: c *conn
        results: n int, err error
      - doc: boundRead installs the deadline for the read about to start.
        name: boundRead
        recv: c *conn
      - doc: boundWrite installs the deadline for the write about to start.
        name: boundWrite
        recv: c *conn
      - doc: ID implements corenet.Conn.
        name: ID
        recv: c *conn
        results: uint64
      - doc: Group implements corenet.Conn.
        name: Group
        recv: c *conn
        results: string
      - doc: Buffer implements corenet.Conn.
        name: Buffer
        recv: c *conn
        results: "[]byte"
      - doc: |-
          Close closes the underlying socket, tolerating a wrapper the pool has already
          reset.

          net/http can close a connection after the engine has reclaimed its wrapper —
          on a drain, where the adapter releases the waiter without waiting for
          net/http to finish. Embedding net.Conn would make that a nil dereference, so
          the guard is what keeps a late close from panicking a serving goroutine.
        name: Close
        recv: c *conn
        results: error
      - doc: |-
          reset clears the connection so the pool can hand it out again. It is the
          recycler's reset hook, and it must drop every reference or a pooled entry
          would pin a closed socket for as long as the pool lives.
        name: reset
        recv: c *conn
    name: conn
  - doc: |-
      trackedConn is an accepted socket that reports its own Close, so a ceilinged
      group keeps counting a connection a handler has taken over.

      Once a handler hijacks a response the engine neither closes the socket nor
      waits for it (ADR 0047 §D9), and ServeConn returns at the hijack — so the
      slot a ceiling holds for the length of ServeConn was given back while the
      connection stayed open. The one event left that says such a connection is
      over is somebody closing it, and this type is where that event is heard.

      It sits BELOW TLS — tls.NewListener wraps it — so net/http still receives
      the concrete *tls.Conn it type-asserts on, and Request.TLS is populated as
      before. On a plaintext listener net/http receives this type itself, which
      is why it forwards the two optional interfaces net/http looks for on a raw
      connection instead of hiding them: CloseWrite, for the graceful half-close
      before a server-side close, and ReadFrom, for the sendfile/splice path. A
      hijacking handler on such a group is handed this type too, never the
      *net.TCPConn underneath it.

      Only a group that serves HTTP under a ceiling builds one — nothing else can
      hijack, and nothing without a ceiling has a slot to hold — so every other
      group's sockets reach the engine unwrapped and cost nothing extra.
    fields:
      - name: ""
        role: embedded
        type: stdnet.Conn
      - doc: |-
          mu guards closed and slot: a hijacking handler closes the socket on its
          own goroutine while the engine hands the slot over on the serve one.
        name: mu
        type: sync.Mutex
      - doc: closed records that Close has run.
        name: closed
        type: bool
      - doc: |-
          slot is the ceiling whose slot this socket holds, nil while it holds
          none — which is always, except after a hijack.
        name: slot
        type: "*connLimiter"
    kind: struct
    methods:
      - doc: |-
          Close closes the socket, then returns the slot it holds, if any.

          The socket closes FIRST, so for an instant the ceiling can count one socket
          that is already gone, but never admit a new one while this one is still
          open.
        name: Close
        recv: t *trackedConn
        results: error
      - doc: |-
          holdSlot hands a ceiling's slot to this socket, to be returned by its Close.

          A socket that is already closed returns it at once: a handler can hijack
          and close before the engine has finished with the connection, and nothing
          would ever close it again to return the slot.
        name: holdSlot
        params: slot *connLimiter
        recv: t *trackedConn
      - doc: |-
          CloseWrite shuts the socket's write half, forwarded so net/http's graceful
          half-close before a server-side close still reaches a plaintext socket.
        name: CloseWrite
        recv: t *trackedConn
        results: error
      - doc: |-
          ReadFrom copies r to the socket through the socket's own ReadFrom when it
          has one, which is what keeps sendfile and splice on net/http's file-serving
          path for a plaintext socket.
        name: ReadFrom
        params: r io.Reader
        recv: t *trackedConn
        results: n int64, err error
    name: trackedConn
  - doc: |-
      connWaiter is what a ServeConn blocks on while net/http drives a connection.

      It carries the hijack flag alongside the completion channel because the two
      answer one question together: net/http reports a finished connection and a
      hijacked one through the same terminal hook, and the engine must treat them
      oppositely — close the first, let go of the second.
    fields:
      - doc: |-
          done is closed once net/http is finished with the connection, whether it
          closed it or a handler took it over.
        name: done
        type: chan struct{}
      - doc: |-
          hijacked records that a handler took the socket over. It is atomic
          because ServeConn can wake on the drain instead of on done, and would
          then read this while net/http's goroutine is still writing it.
        name: hijacked
        type: atomic.Bool
      - doc: |-
          doneOnce guards close(done). The waiter is deleted from the map under the
          adapter's lock before it is released, which already makes the close
          single; the guard is explicit so the invariant is local to the close
          rather than inferred from a delete three lines away.
        name: doneOnce
        type: sync.Once
    kind: struct
    methods:
      - doc: release wakes the ServeConn waiting on this connection, exactly once.
        name: release
        recv: w *connWaiter
    name: connWaiter
  - doc: |-
      handshakeHandler completes the TLS negotiation under its own bound before
      handing the connection to the group's handler.

      It is applied once per group rather than per connection, and only to groups
      that actually carry a TLS identity, so a plaintext group pays nothing at all.
      It sits INSIDE the connection ceiling on purpose: negotiating first would let
      a flood of connections each pay for a full handshake before the ceiling had a
      chance to refuse them, which is the opposite of what the ceiling is for.
    fields:
      - doc: next is the group's own handler chain.
        name: next
        type: corenet.ConnHandler
      - doc: timeouts carries the group's handshake bound.
        name: timeouts
        type: corenet.TimeoutsValue
    kind: struct
    methods:
      - doc: ServeConn implements corenet.ConnHandler.
        name: ServeConn
        params: ctx context.Context, c corenet.Conn
        recv: h handshakeHandler
        results: error
    name: handshakeHandler
  - doc: |-
      httpAdapter serves connections through an http.Server mounted on our listener.

      This is the shape ADR 0029 D3 commits to: our unified listener, our limits,
      our TLS identity and our drain, with net/http doing the protocol. net/http
      handles HTTP/1.1 and HTTP/2 and has a decade of hardening behind it; replacing
      it would be a regression in correctness and security for no gain in
      throughput.

      Completion is tracked through http.Server's ConnState hook rather than by
      wrapping the connection. Wrapping was the obvious design and it is wrong twice
      over: it puts the pooled wrapper in two goroutines at once, and it hides the
      concrete *tls.Conn that net/http type-asserts on to populate Request.TLS — so
      every request on an HTTPS listener would arrive looking like plaintext.
    fields:
      - doc: handler is the application's http.Handler.
        name: handler
        type: http.Handler
      - doc: |-
          timeouts are the group's per-phase bounds, set at Start and handed to
          http.Server so net/http refreshes them per REQUEST. The engine's own
          per-operation deadlines cannot do it here: net/http is given the concrete
          socket, not the pooled wrapper that carries them, because it type-asserts
          on *tls.Conn to populate Request.TLS.
        name: timeouts
        type: corenet.TimeoutsValue
      - doc: |-
          bounds are the HTTP-only options — the header phase's own deadline and
          the header size cap — set at Start with the timeouts above.
        name: bounds
        type: httpBounds
      - doc: start guarantees the serving goroutine is launched at most once.
        name: start
        type: sync.Once
      - doc: |-
          mu guards waiters AND the lifecycle fields below. They are written by the
          first connection's goroutine and read by whichever goroutine shuts the
          server down, so an unguarded read is a genuine race, not a formality.
        name: mu
        type: sync.RWMutex
      - doc: waiters maps a handed-over connection to the ServeConn blocked on it.
        name: waiters
        type: map[stdnet.Conn]*connWaiter
      - doc: bridge feeds accepted connections to http.Server.
        name: bridge
        type: "*chanListener"
      - doc: server is the net/http instance driving the protocol.
        name: server
        type: "*http.Server"
      - doc: |-
          daemon owns the goroutine running http.Server.Serve. Using the kernel's
          own loop primitive rather than a bare "go" keeps the goroutine's owner
          and its termination explicit, and gives shutdown a channel to wait on.
        name: daemon
        type: "*worker.LoopDaemon"
      - doc: |-
          stopped records that the adapter has been shut down. A connection that
          reaches launch afterwards must not start a server: the engine does not
          track this goroutine in its WaitGroup, so nothing else would ever end it.
        name: stopped
        type: bool
      - doc: |-
          draining is closed the moment shutdown begins, and reaches every handler
          through the request context (corenet.DrainSignal).

          It exists because http.Server.Shutdown waits for in-flight requests and a
          request that never ends never becomes idle: an event stream or a long
          poll held the drain open for its entire budget, every time, and was then
          killed by having its socket severed — the least graceful ending available.
          Cancelling the request context instead would tell EVERY handler to
          abandon its half-written response, which is the opposite of draining;
          this signal is additive, and a handler that ignores it behaves as before.
        name: draining
        type: chan struct{}
      - doc: |-
          drainOnce guards close(draining). The stopped flag above already makes
          the close single, but the guard is explicit so the invariant is local to
          the close rather than inferred from a flag three lines away.
        name: drainOnce
        type: sync.Once
    kind: struct
    methods:
      - doc: |-
          ServeConn implements corenet.ConnHandler.

          Goroutine lifecycle: the first connection starts one goroutine running
          http.Server.Serve over the bridge listener. It lives for the group's lifetime
          and exits when the bridge closes, which Accept reports as net.ErrClosed — the
          termination http.Server expects.
        name: ServeConn
        params: ctx context.Context, c corenet.Conn
        recv: a *httpAdapter
        results: error
      - doc: register creates the completion state for a handed-over connection.
        name: register
        params: raw stdnet.Conn
        recv: a *httpAdapter
        results: "*connWaiter"
      - doc: unregister drops the completion channel once ServeConn is done with it.
        name: unregister
        params: raw stdnet.Conn
        recv: a *httpAdapter
      - doc: onConnState releases the ServeConn waiting on a finished connection.
        name: onConnState
        params: raw stdnet.Conn, state http.ConnState
        recv: a *httpAdapter
      - doc: |-
          launch starts the net/http serving goroutine for this adapter.

          Goroutine lifecycle: exactly one is started, on the first connection, and it
          is owned by the adapter. It terminates when shutdown closes the bridge, which
          makes Accept report net.ErrClosed — the termination http.Server expects. It
          is not tracked by the engine's WaitGroup on purpose: it must outlive the
          individual ServeConn calls it serves, and shutdown is what ends it.
        name: launch
        params: raw stdnet.Conn
        recv: a *httpAdapter
      - doc: |-
          shutdown stops the embedded http.Server gracefully, releasing its keep-alive
          goroutines, and waits for the serving goroutine within the caller's budget.
        name: shutdown
        params: ctx context.Context
        recv: a *httpAdapter
      - doc: |-
          closeNow stops the embedded http.Server immediately, without a drain.

          It is Close's counterpart to shutdown: Close severs live sockets rather than
          waiting for them, so the embedded server is closed the same way instead of
          being left to finish. Without this, Close ended every listener the engine
          knew about and left the http.Server running on its bridge — a goroutine, an
          http.Server and its keep-alive machinery outliving the server that owned
          them, on every Close of an HTTP group.
        name: closeNow
        recv: a *httpAdapter
      - doc: |-
          stop marks the adapter shut down and snapshots what has to be stopped.

          Marking and reading happen together under the lock so a launch racing this
          call either happens entirely before it — and is therefore in the snapshot —
          or sees stopped and refuses. The lock is released before anything is closed
          or waited on, because onConnState takes it too and http.Server fires that
          hook from inside Shutdown.
        name: stop
        recv: a *httpAdapter
        results: bridge *chanListener, srv *http.Server, daemon *worker.LoopDaemon
      - doc: currentBridge reports the bridge listener the adapter launched, if any.
        name: currentBridge
        recv: a *httpAdapter
        results: "*chanListener"
    name: httpAdapter
  - doc: |-
      httpBounds are the options that mean something only to the net/http
      adapter: the header phase's own deadline and the header size cap. Their zero
      value is "not set", and each keeps the behaviour the group had before the
      option existed.
    fields:
      - doc: |-
          readHeaderTimeout bounds the request line and the header fields; zero or
          negative falls back to the group's read timeout.
        name: readHeaderTimeout
        type: time.Duration
      - doc: |-
          maxHeaderBytes caps the request line and the header fields; zero or
          negative leaves net/http's default.
        name: maxHeaderBytes
        type: int
    kind: struct
    methods:
      - doc: |-
          headerTimeout resolves the header phase's deadline: the option when it was
          set, the read timeout otherwise — which is what the adapter applied before
          the option existed.
        name: headerTimeout
        params: read time.Duration
        recv: b httpBounds
        results: time.Duration
      - doc: |-
          headerBytes resolves the header cap handed to http.Server, where zero means
          net/http's own default.
        name: headerBytes
        recv: b httpBounds
        results: int
    name: httpBounds
  - doc: |-
      chanListener is a net.Listener fed by our accept path.

      net/http can only be driven through Serve(net.Listener); there is no public
      per-connection entry point. Rather than reimplement HTTP — which would mean
      owning request smuggling, HTTP/2 flow control, HPACK and the whole CVE stream
      to lose, not gain, throughput — the adapter hands http.Server a listener whose
      Accept pops from a channel our own accept loop fills. The cost is one channel
      hand-off per CONNECTION, not per request, which is noise next to a TCP
      handshake, and the benchmarks measure it rather than assuming it.
    fields:
      - doc: conns carries accepted connections to http.Server.
        name: conns
        type: chan stdnet.Conn
      - doc: addr is reported to http.Server as the listen address.
        name: addr
        type: stdnet.Addr
      - doc: closed is shut to unblock Accept when the group drains.
        name: closed
        type: chan struct{}
      - doc: once makes Close idempotent, since http.Server also closes its listener.
        name: once
        type: sync.Once
    kind: struct
    methods:
      - doc: Accept implements net.Listener.
        name: Accept
        recv: l *chanListener
        results: conn stdnet.Conn, err error
      - doc: Close implements net.Listener.
        name: Close
        recv: l *chanListener
        results: error
      - doc: Addr implements net.Listener.
        name: Addr
        recv: l *chanListener
        results: stdnet.Addr
      - doc: offer hands a connection to http.Server, or reports that the bridge is closed.
        name: offer
        params: c stdnet.Conn
        recv: l *chanListener
        results: bool
    name: chanListener
  - doc: readDeadlineHandler installs a deadlineBody on each request with a body.
    fields:
      - doc: next is the application's handler.
        name: next
        type: http.Handler
      - doc: read is the bound of one read of the body.
        name: read
        type: time.Duration
    kind: struct
    methods:
      - doc: ServeHTTP implements http.Handler.
        name: ServeHTTP
        params: w http.ResponseWriter, r *http.Request
        recv: h readDeadlineHandler
    name: readDeadlineHandler
  - doc: deadlineBody bounds each read of a request body on its own.
    fields:
      - doc: inner is net/http's body.
        name: inner
        type: io.ReadCloser
      - doc: rc sets the connection's (or, on HTTP/2, the stream's) read deadline.
        name: rc
        type: "*http.ResponseController"
      - doc: read is the bound of one read.
        name: read
        type: time.Duration
      - doc: ended records that the body returned its last read.
        name: ended
        type: bool
    kind: struct
    methods:
      - doc: Read implements io.Reader.
        name: Read
        params: p []byte
        recv: b *deadlineBody
        results: n int, err error
      - doc: Close implements io.Closer.
        name: Close
        recv: b *deadlineBody
        results: error
    name: deadlineBody
  - doc: boundListener pairs a live listener with the group that owns it.
    fields:
      - doc: group is the owning group's name.
        name: group
        type: string
      - doc: addr is the address as requested.
        name: addr
        type: corenet.AddressValue
      - doc: ln is the live listener.
        name: ln
        type: stdnet.Listener
      - doc: made creates closed on first use, so a zero boundListener works.
        name: made
        type: sync.Once
      - doc: shut closes closed exactly once, whoever closes the listener first.
        name: shut
        type: sync.Once
      - doc: |-
          closed is closed when the listener is: it ends an accept loop's backoff,
          which is not blocked in Accept and so would not see the closure.
        name: closed
        type: chan struct{}
    kind: struct
    methods:
      - doc: closedSignal returns the channel closed when the listener is.
        name: closedSignal
        recv: b *boundListener
        results: <-chan struct{}
      - doc: Close releases the listener, and tells an accept loop waiting out a backoff.
        name: Close
        recv: b *boundListener
        results: error
    name: boundListener
  - doc: |-
      trackedListener wraps every socket it accepts in a trackedConn.

      It is the only place the wrapping can happen for a TLS group: by the time
      the accept loop sees a connection, tls.NewListener has already wrapped it in
      a *tls.Conn, so the tracker has to be handed out BELOW that layer — by the
      listener TLS is built on. See trackedConn for why a group needs it at all.
    fields:
      - name: ""
        role: embedded
        type: stdnet.Listener
    kind: struct
    methods:
      - doc: Accept implements net.Listener.
        name: Accept
        recv: l *trackedListener
        results: conn stdnet.Conn, err error
    name: trackedListener
  - doc: |-
      loopProbe is the handler a probe chain wraps: it records each callback that
      reaches it.
    fields:
      - doc: seen holds, by callback, whether it arrived.
        name: seen
        type: "[probeCallbacks]bool"
    kind: struct
    methods:
      - doc: OnStart implements corenet.LoopStarter.
        name: OnStart
        params: _ int
        recv: p *loopProbe
      - doc: OnOpen implements corenet.LoopHandler.
        name: OnOpen
        params: _ corenet.LoopIO, _ corenet.LoopConnRef
        recv: p *loopProbe
      - doc: OnData implements corenet.LoopHandler.
        name: OnData
        params: _ corenet.LoopIO, _ corenet.LoopConnRef, buf []byte
        recv: p *loopProbe
        results: int
      - doc: OnTimeout implements corenet.LoopHandler.
        name: OnTimeout
        params: _ corenet.LoopIO, _ corenet.LoopConnRef
        recv: p *loopProbe
      - doc: OnWritable implements corenet.LoopHandler.
        name: OnWritable
        params: _ corenet.LoopIO, _ corenet.LoopConnRef
        recv: p *loopProbe
      - doc: OnBatchEnd implements corenet.LoopHandler.
        name: OnBatchEnd
        params: _ corenet.LoopIO
        recv: p *loopProbe
      - doc: OnClose implements corenet.LoopHandler.
        name: OnClose
        params: _ corenet.LoopIO, _ corenet.LoopConnRef, _ error
        recv: p *loopProbe
      - doc: "Honours implements corenet.LoopOptionHonourer: the probe honours nothing."
        name: Honours
        params: _ corenet.OptionKind
        recv: p *loopProbe
        results: bool
    name: loopProbe
  - doc: |-
      probeIO is the LoopIO of the probe: every connection is stale, the queue is
      closed, and it is lane 0.
    kind: struct
    methods:
      - doc: Write implements corenet.LoopIO.
        name: Write
        params: _ corenet.LoopConnRef, _ []byte
        recv: probeIO
        results: error
      - doc: Close implements corenet.LoopIO.
        name: Close
        params: _ corenet.LoopConnRef
        recv: probeIO
        results: error
      - doc: SetDeadline implements corenet.LoopIO.
        name: SetDeadline
        params: _ corenet.LoopConnRef, _ time.Duration
        recv: probeIO
        results: error
      - doc: Pressure implements corenet.LoopIO.
        name: Pressure
        params: _ corenet.LoopConnRef
        recv: probeIO
        results: bool
      - doc: Post implements corenet.LoopIO.
        name: Post
        params: _ corenet.PostFunc, _ uintptr
        recv: probeIO
        results: error
      - doc: Loop implements corenet.LoopIO.
        name: Loop
        recv: probeIO
        results: int
    name: probeIO
  - doc: |-
      nativeEngine is the leaf's group with server's socket probe merged into
      its capability report (ADR 0189).
    fields:
      - name: ""
        role: embedded
        type: "*loop.Group"
      - doc: noDelay is the tcp-nodelay row.
        name: noDelay
        type: corenet.CapabilityValue
    kind: struct
    methods:
      - doc: "State implements loopEngine: the leaf's report, then server's row."
        name: State
        recv: e *nativeEngine
        results: corenet.LoopStateValue
    name: nativeEngine
  - doc: |-
      loopEngine is a running loop group, whatever its backend: the leaf's native
      loops or the portable backend below.
    kind: named
    name: loopEngine
    underlying: |-
      interface {
      	// Shutdown stops accepting and drains until ctx is done.
      	Shutdown(ctx context.Context) error
      	// Close closes everything now.
      	Close() error
      	// State reports the group.
      	State() corenet.LoopStateValue
      }
  - doc: portableEvent is what a connection's goroutines tell the handler goroutine.
    fields:
      - name: kind
        type: uint8
      - name: slot
        type: int32
      - name: gen
        type: uint32
      - name: conn
        type: stdnet.Conn
      - name: data
        type: "[]byte"
      - name: err
        type: error
    kind: struct
    name: portableEvent
  - doc: |-
      portableConn is one connection on the portable backend. Its reader and
      writer goroutines touch only conn, mu's fields and the channels; everything
      else is the handler goroutine's.
    fields:
      - name: conn
        type: stdnet.Conn
      - name: gen
        type: uint32
      - doc: ack lets the reader reuse its buffer once the batch that holds it ended.
        name: ack
        type: chan struct{}
      - doc: kick wakes the writer.
        name: kick
        type: chan struct{}
      - doc: mu guards out, flight and closing, shared with the writer.
        name: mu
        type: sync.Mutex
      - name: out
        type: "[]byte"
      - name: flight
        type: int
      - name: closing
        type: bool
      - doc: The handler goroutine's own state.
        name: open
        type: bool
      - name: spill
        type: "[]byte"
      - name: spillOff
        type: int
      - name: lastIO
        type: time.Time
      - name: deadline
        type: time.Time
      - name: pressure
        type: bool
      - name: wantWrite
        type: bool
      - name: peerDone
        type: bool
      - name: closeErr
        type: error
      - name: reasonSet
        type: bool
    kind: struct
    name: portableConn
  - doc: |-
      portableGroup is the portable backend (ADR 0186 §D3, §D7): the default
      engine's accept path and a goroutine pair per connection on the netpoller,
      spread over LoopValue.Loops lanes, every callback of one lane serialised
      onto that lane's handler goroutine, so the LoopHandler contract holds
      unchanged: one goroutine calls a lane, buf valid until its OnBatchEnd.
      The acceptors hand connections to the lanes in turn.
    fields:
      - name: group
        type: string
      - name: soft
        type: int
      - name: maxConns
        type: int
      - name: degraded
        type: string
      - doc: |-
          caps is the group's capability report: every row unprobed, or
          disabled; noDelayOff is tcp-nodelay switched off, so each accepted
          connection has the netpoller's TCP_NODELAY cleared (ADR 0189).
        name: caps
        type: "[]corenet.CapabilityValue"
      - name: noDelayOff
        type: bool
      - name: lanes
        type: "[]*portableLoop"
      - name: lns
        type: "[]stdnet.Listener"
      - doc: |-
          handshake bounds a TLS connection's negotiation, which runs before the
          lane sees it; zero for a plaintext group (ADR 0198).
        name: handshake
        type: time.Duration
      - doc: turn is the lane the next accepted connection goes to, modulo the count.
        name: turn
        type: atomic.Uint64
      - name: drainReq
        type: atomic.Bool
      - name: stopReq
        type: atomic.Bool
      - name: rejected
        type: atomic.Uint64
      - name: once
        type: sync.Once
    kind: struct
    methods:
      - doc: live is how many connections the group's lanes serve together.
        name: live
        recv: g *portableGroup
        results: int64
      - doc: acceptLoop hands each accepted connection to a lane, in turn.
        name: acceptLoop
        params: ln stdnet.Listener
        recv: g *portableGroup
      - doc: |-
          dispatch hands c to the next lane, in turn; a TLS connection is negotiated
          first, off the acceptor, so the lane sees it only once it is cleartext.

          Goroutine lifecycle: for a TLS group, one negotiate goroutine per
          connection, which returns once the handshake ends and the connection is
          handed to its lane or closed.
        name: dispatch
        params: c stdnet.Conn
        recv: g *portableGroup
      - doc: wakeAll rouses every lane's handler goroutine.
        name: wakeAll
        recv: g *portableGroup
    name: portableGroup
  - doc: |-
      portableLoop is one lane of the portable backend: its handler goroutine,
      its connections, its post queue and its LoopIO.
    fields:
      - name: g
        type: "*portableGroup"
      - name: lane
        type: int
      - name: h
        type: corenet.LoopHandler
      - name: spillCap
        type: int
      - name: outCap
        type: int
      - name: idle
        type: time.Duration
      - name: events
        type: chan portableEvent
      - doc: post is the queue of posted operations; wake rouses the handler.
        name: postMu
        type: sync.Mutex
      - name: postOps
        type: "[]corenet.PostFunc"
      - name: postArgs
        type: "[]uintptr"
      - name: postHead
        type: int
      - name: postN
        type: int
      - name: postWait
        type: atomic.Bool
      - name: postShut
        type: bool
      - name: wake
        type: chan struct{}
      - name: conns
        type: "[]*portableConn"
      - name: free
        type: "[]int32"
      - name: live
        type: atomic.Int64
      - name: draining
        type: bool
      - name: done
        type: chan struct{}
      - name: accepted
        type: atomic.Uint64
      - name: closed
        type: atomic.Uint64
      - name: batches
        type: atomic.Uint64
      - name: readers
        type: sync.WaitGroup
      - doc: batchAcks are the readers waiting on the current batch.
        name: batchAcks
        type: "[]chan struct{}"
      - name: dirty
        type: "[]int32"
    kind: struct
    methods:
      - doc: |-
          negotiate completes c's TLS handshake within d, then hands c to the lane;
          a failed or stalled one closes it, and the lane never sees it.

          Goroutine lifecycle: one per accepted TLS connection, started by
          acceptLoop; it returns once the handshake ends and the connection is handed
          over, or the lane has stopped, which closes the connection instead.
        name: negotiate
        params: c stdnet.Conn, d time.Duration
        recv: pl *portableLoop
      - doc: |-
          run is the handler goroutine: one batch per iteration. It is the one
          goroutine that closes done, as it returns.
        name: run
        params: done chan<- struct{}
        recv: pl *portableLoop
      - doc: collect takes the events already queued, up to a batch.
        name: collect
        recv: pl *portableLoop
      - doc: handle serves one event.
        name: handle
        params: ev *portableEvent
        recv: pl *portableLoop
      - doc: |-
          handleData delivers a reader's bytes, and holds its buffer until the batch
          ends.
        name: handleData
        params: ev *portableEvent
        recv: pl *portableLoop
      - doc: handleEnd serves the end of a connection's reader or writer.
        name: handleEnd
        params: ev *portableEvent
        recv: pl *portableLoop
      - doc: |-
          handleSent records a flight the writer sent, and fires OnWritable when a
          producer waits and the output fell under a quarter of its cap.
        name: handleSent
        params: ev *portableEvent
        recv: pl *portableLoop
      - doc: |-
          open takes a slot for c and starts its reader and writer.

          Goroutine lifecycle: it launches the connection's reader, which returns at
          the end of input or a read failure, and its writer, which returns once kick
          is closed by finish, the connection closing with its output sent, or a
          write failure.
        name: open
        params: c stdnet.Conn
        recv: pl *portableLoop
      - doc: reader reads pc into one buffer, reused once the handler's batch ended.
        name: reader
        params: slot int32, pc *portableConn
        recv: pl *portableLoop
      - doc: writer sends pc's output, one flight at a time.
        name: writer
        params: slot int32, pc *portableConn
        recv: pl *portableLoop
      - doc: lookupSlot returns slot's connection when gen is still its generation.
        name: lookupSlot
        params: slot int32, gen uint32
        recv: pl *portableLoop
        results: "*portableConn"
      - doc: lookup resolves a reference to an open connection.
        name: lookup
        params: ref corenet.LoopConnRef
        recv: pl *portableLoop
        results: int32, *portableConn
      - doc: deliver hands data to the handler behind any spill.
        name: deliver
        params: slot int32, pc *portableConn, data []byte
        recv: pl *portableLoop
      - doc: pending is how many output bytes pc holds.
        name: pending
        params: pc *portableConn
        recv: pl *portableLoop
        results: int
      - doc: markDirty lists slot for the end of the batch.
        name: markDirty
        params: slot int32
        recv: pl *portableLoop
      - doc: |-
          finish calls OnClose and closes the connection; the slot is free at once,
          its generation moved on, so nothing of it is reachable any more.
        name: finish
        params: slot int32, pc *portableConn, err error
        recv: pl *portableLoop
      - doc: timers fires deadlines and closes idle connections.
        name: timers
        recv: pl *portableLoop
      - doc: control applies the drain.
        name: control
        recv: pl *portableLoop
      - doc: |-
          endBatch flushes the dirty connections, settles the closes, releases the
          batch's buffers and compacts the spills.
        name: endBatch
        recv: pl *portableLoop
      - doc: |-
          settle finishes a dirty connection that is closing with nothing left to
          send, and otherwise kicks its writer.
        name: settle
        params: slot int32
        recv: pl *portableLoop
      - doc: |-
          compactSpills moves every spill's consumed head out, now that no
          handed-out buffer survives.
        name: compactSpills
        recv: pl *portableLoop
      - doc: |-
          closeAll closes every connection as the backend stops.

          Goroutine lifecycle: it launches one drainer that takes the last events a
          reader may still send, and returns after one second with none.
        name: closeAll
        recv: pl *portableLoop
      - doc: drainPosts runs the posted operations.
        name: drainPosts
        recv: pl *portableLoop
      - doc: Write implements corenet.LoopIO.
        name: Write
        params: ref corenet.LoopConnRef, p []byte
        recv: pl *portableLoop
        results: error
      - doc: Close implements corenet.LoopIO.
        name: Close
        params: ref corenet.LoopConnRef
        recv: pl *portableLoop
        results: error
      - doc: SetDeadline implements corenet.LoopIO.
        name: SetDeadline
        params: ref corenet.LoopConnRef, d time.Duration
        recv: pl *portableLoop
        results: error
      - doc: Pressure implements corenet.LoopIO.
        name: Pressure
        params: ref corenet.LoopConnRef
        recv: pl *portableLoop
        results: bool
      - doc: "Loop implements corenet.LoopIO: the lane's index."
        name: Loop
        recv: pl *portableLoop
        results: int
      - doc: Post implements corenet.LoopIO.
        name: Post
        params: op corenet.PostFunc, arg uintptr
        recv: pl *portableLoop
        results: error
    name: portableLoop
  - doc: |-
      portableEngine is the portable backend as server drives it: the lifecycle
      half, apart from the LoopIO each lane's handler is called with, whose
      Close names a connection.
    fields:
      - name: g
        type: "*portableGroup"
    kind: struct
    methods:
      - doc: Shutdown implements loopEngine.
        name: Shutdown
        params: ctx context.Context
        recv: e portableEngine
        results: error
      - doc: Close implements loopEngine.
        name: Close
        recv: e portableEngine
        results: error
      - doc: State implements loopEngine.
        name: State
        recv: e portableEngine
        results: corenet.LoopStateValue
    name: portableEngine
  - doc: |-
      codecUnwrapper is what the http1 adapter exposes (http1.LoopHandler.Unwrap):
      the HTTP1Handler it serves, so a loop group knows its handler speaks the
      codec and may take TLS on the portable backend.
    kind: named
    name: codecUnwrapper
    underlying: |-
      interface {
      	// Unwrap returns the HTTP1Handler the adapter serves.
      	Unwrap() corenet.HTTP1Handler
      }
  - doc: |-
      multiReader reads several datagrams per syscall using recvmmsg(2).

      It reuses one message array for the life of the socket: the iovecs, name and
      control buffers are wired to the slot buffers once, so a read costs no
      allocation at all — which is the entire reason for the batched path. The
      kernel writes back the lengths it used into the same headers, so every
      capacity is restored before each call (prepare), never only at wiring.
    fields:
      - doc: pc is the socket, kept for the fallback path and for addresses.
        name: pc
        type: stdnet.PacketConn
      - doc: raw exposes the descriptor under the runtime's netpoller.
        name: raw
        type: syscall.RawConn
      - doc: headers is the reusable mmsghdr array handed to the kernel.
        name: headers
        type: "[]mmsghdr"
      - doc: iovecs points each header at its slot's buffer.
        name: iovecs
        type: "[]syscall.Iovec"
      - doc: names receives each datagram's sender address.
        name: names
        type: "[]syscall.RawSockaddrAny"
      - doc: oob receives each message's control data, controlSpace bytes a slot.
        name: oob
        type: "[]byte"
      - doc: |-
          controlSpace is the room one message's control data has: groControlSpace
          under GRO, the one case a read asks for a control message, and none
          without it — a control message the caller asked of the socket is then
          not read, and its MSG_CTRUNC means nothing to the reader.
        name: controlSpace
        type: int
      - doc: wired records the slot count the arrays were built for.
        name: wired
        type: int
      - doc: |-
          gro records that UDP_GRO was switched on at construction, so slots must
          hold a whole coalesced message.
        name: gro
        type: bool
      - doc: |-
          handing is set by handover: the next reads drain what the socket holds
          without waiting, then end the loop.
        name: handing
        type: atomic.Bool
      - doc: |-
          stopping is set by stopGRO before it switches GRO off: a read that
          returns from then on may hold a coalesced message without its segment
          size, so it is dropped and the loop ended — the socket is being closed.
        name: stopping
        type: atomic.Bool
      - doc: |-
          received and errno are what the last recvmmsg returned. They are fields,
          and recv and drainOnce the functions the descriptor runs, bound once at
          wiring, so a read moves nothing to the heap.
        name: received
        type: int
      - name: errno
        type: syscall.Errno
      - name: recv
        type: func(fd uintptr) bool
      - name: drainOnce
        type: func(fd uintptr)
    kind: struct
    methods:
      - doc: |-
          enableGRO switches UDP_GRO on and reports whether the kernel took it: a
          socket that is not UDP, or a kernel before 5.0, refuses, and the reader then
          reads one datagram a message as before. It runs before the first read, so the
          slots are sized for what it decided.
        name: enableGRO
        recv: r *multiReader
        results: bool
      - doc: setGRO sets UDP_GRO on the socket.
        name: setGRO
        params: on bool
        recv: r *multiReader
        results: error
      - doc: |-
          handover prepares the socket for whoever reads it after this loop — a
          successor that inherits it, which may not split coalesced messages: the loop
          drains what the socket holds without waiting, GRO still on, until EAGAIN,
          then switches GRO off and ends (ADR 0192). The order is the kernel's:
          udp_recvmsg writes the UDP_GRO control message only while the option is on,
          so a message coalesced before GRO went off and read after it would arrive
          without its segment size, one datagram the length of all of them. It reports
          whether a drain was started; a reader that never had GRO on has nothing to
          hand over.
        name: handover
        recv: r *multiReader
        results: bool
      - doc: |-
          stopGRO switches GRO off without a drain: Close's, which waits for nothing,
          so a successor at least finds nothing coalesced from here on.
        name: stopGRO
        recv: r *multiReader
      - doc: |-
          switchGROOff marks the reader stopping, then switches GRO off: in that
          order, so no read completing during the switch is split wrongly.
        name: switchGROOff
        recv: r *multiReader
      - doc: |-
          slotSize implements datagramSource: a whole coalesced message under GRO, the
          ceiling otherwise. Under GRO a socket's read batch therefore holds BatchSize
          slots of 64 KiB: 1 MiB at the default 16, 64 MiB at a BatchSize of 1024,
          allocated once for the socket's life (ADR 0192 §D2).
        name: slotSize
        params: ceiling int
        recv: r *multiReader
        results: int
      - doc: |-
          wire points the message array at the caller's slots. It runs once per slot
          count, not once per read.
        name: wire
        params: slots []datagram
        recv: r *multiReader
      - doc: |-
          bind builds, once, the functions the descriptor runs: recvmmsg parked on the
          netpoller, and the drain's, which never waits. They write into the reader's
          fields, so neither moves a variable to the heap on each read.
        name: bind
        recv: r *multiReader
      - doc: |-
          prepare restores every header's capacities before a call: the kernel wrote
          back into Namelen and Controllen the lengths the last message used, and a
          message that carried no control data left Controllen at zero, so the next
          coalesced message would find no room for its segment size (MSG_CTRUNC) and
          be dropped.
        name: prepare
        recv: r *multiReader
      - doc: readBatch implements datagramSource using one recvmmsg call.
        name: readBatch
        params: slots []datagram
        recv: r *multiReader
        results: n int, err error
      - doc: |-
          drain reads what the socket holds without waiting. EAGAIN means the queue is
          empty: the socket is handed over, and the loop is told so as a closed socket
          is, net.ErrClosed, which ends it.
        name: drain
        params: slots []datagram
        recv: r *multiReader
        results: n int, err error
      - doc: |-
          fill copies the per-message results back into the caller's slots: the length,
          the sender, the segment size a coalesced message carries, and whether the
          kernel cut the message (msg_flags).

          Without GRO the reader asks for no control data and reads none: a control
          message the caller asked of the socket — IP_PKTINFO, a timestamp — finds no
          room and the kernel sets MSG_CTRUNC, which costs this reader nothing, so it
          never cuts a message. Under GRO a message is cut for MSG_CTRUNC only when the
          UDP_GRO message itself did not survive: its segment size may then be lost.
        name: fill
        params: slots []datagram, received int
        recv: r *multiReader
    name: multiReader
  - doc: |-
      mmsghdr mirrors struct mmsghdr from <sys/socket.h>:

      	struct mmsghdr {
      	    struct msghdr msg_hdr;
      	    unsigned int  msg_len;
      	};

      golang.org/x/net would supply this type, but it transitively imports
      golang.org/x/sys, banned SDK-wide (ADR 0016 / ADR 0018), so the layout is
      declared and cited here — the same discipline the proc domain already uses
      for its ABI constants.

      There is deliberately no explicit padding field. C rounds the struct up to
      the alignment of struct msghdr, which pads the trailing uint32 out on 64-bit
      and leaves it flush on 32-bit, where the alignment is only as wide as the
      field itself. Go applies that same trailing-padding rule to this declaration,
      so writing the padding out by hand is right on one class of architecture and
      four bytes too long on the other — and recvmmsg strides the array by the
      KERNEL's stride, which would land every element past the first at the wrong
      offset, inside a struct whose pointers the kernel also reads.
    fields:
      - name: hdr
        type: syscall.Msghdr
      - name: length
        type: uint32
    kind: struct
    name: mmsghdr
  - doc: |-
      pendingReply is one queued reply: where its bytes sit in the arena and the
      peer it goes to.
    fields:
      - doc: off and size place the reply's bytes in the arena.
        name: "off"
        type: int
      - doc: off and size place the reply's bytes in the arena.
        name: size
        type: int
      - doc: |-
          name is the peer's sockaddr, sockaddr_in or sockaddr_in6, zeroed past
          its length so two replies to one peer compare equal.
        name: name
        type: syscall.RawSockaddrInet6
      - doc: namelen is the length of name the kernel reads.
        name: namelen
        type: uint32
    kind: struct
    methods:
      - doc: |-
          addr is the peer e was queued for, as WriteTo takes it: the fallback of a
          socket whose sendmmsg is refused, off the batched path.
        name: addr
        recv: e *pendingReply
        results: stdnet.Addr
    name: pendingReply
  - doc: |-
      replySpan is one message of a send: count consecutive queued replies from
      first, one GSO send when count is more than one.
    fields:
      - doc: first is the index of the span's first reply in the queue.
        name: first
        type: int
      - doc: count is how many replies it carries.
        name: count
        type: int
    kind: struct
    name: replySpan
  - doc: |-
      multiWriter sends the replies of one read batch with sendmmsg(2), every run of
      consecutive replies to one peer of one size — the last may be shorter — as
      one UDP GSO message (ADR 0192).

      Its queue, arena and message arrays are allocated once, at construction, so
      a reply costs no allocation once the loop is running. A mutex guards them: a
      handler that kept its Packet may reply from another goroutine, and such a
      reply, outside any batch, is written at once.
    fields:
      - doc: pc is the socket, written directly outside a batch.
        name: pc
        type: stdnet.PacketConn
      - doc: raw exposes the descriptor under the runtime's netpoller.
        name: raw
        type: syscall.RawConn
      - doc: |-
          family is the socket's, AF_INET or AF_INET6: it decides the sockaddr a
          reply is addressed with and the headers a GSO send is sized for.
        name: family
        type: int
      - doc: counters is where failed replies and refused GSO sends are counted.
        name: counters
        type: "*datagramCounters"
      - doc: onGSOOff is called once GSO is switched off on this socket.
        name: onGSOOff
        type: func()
      - doc: send is sendmmsg; a test swaps it to answer what a device would.
        name: send
        type: func(fd uintptr, headers []mmsghdr) (sent int, errno syscall.Errno)
      - doc: |-
          gso is on until the device refuses a GSO send for want of checksum
          offload (EIO), and stays off for the socket's life.
        name: gso
        type: atomic.Bool
      - doc: mu guards everything below.
        name: mu
        type: sync.Mutex
      - doc: open is true between begin and flush, while replies are queued.
        name: open
        type: bool
      - doc: arena holds the queued replies' bytes, used of it so far.
        name: arena
        type: "[]byte"
      - name: used
        type: int
      - doc: queue is the replies queued in this batch.
        name: queue
        type: "[]pendingReply"
      - doc: |-
          headers, iovecs, oob and spans describe one send's messages, indexed in
          lockstep.
        name: headers
        type: "[]mmsghdr"
      - name: iovecs
        type: "[]syscall.Iovec"
      - name: oob
        type: "[]byte"
      - name: spans
        type: "[]replySpan"
      - doc: controlSpace is CMSG_SPACE of the UDP_SEGMENT size, one message's room.
        name: controlSpace
        type: int
      - doc: |-
          plainUntil is the queue index below which replies leave one by one:
          those of a span a path with a smaller MTU refused (EINVAL).
        name: plainUntil
        type: int
      - doc: |-
          segmentCeiling, when not zero, is the largest segment a GSO send may
          carry on this socket from now on: one below the smallest the kernel
          refused with EINVAL, so a path with a smaller MTU costs one refused
          send, not one a batch. It only falls, for the socket's life.
        name: segmentCeiling
        type: int
      - doc: |-
          invalidRun counts the GSO sends refused with EINVAL since the last GSO
          send that left; at gsoInvalidLimit, GSO is switched off.
        name: invalidRun
        type: int
      - doc: |-
          noMmsg is set once sendmmsg itself is refused — ENOSYS or EPERM, under
          a seccomp filter that allows sendto — while a WriteTo of the same reply
          leaves: every batch then leaves one WriteTo a reply.
        name: noMmsg
        type: bool
      - doc: |-
          sent, sendErrno, from and to are one sendmmsg's arguments and results,
          and write the function the descriptor runs, bound once at construction,
          so a send moves nothing to the heap.
        name: sent
        type: int
      - name: sendErrno
        type: syscall.Errno
      - name: from
        type: int
      - name: to
        type: int
      - name: write
        type: func(fd uintptr) bool
    kind: struct
    methods:
      - doc: "begin implements datagramSink: replies are queued from here."
        name: begin
        recv: w *multiWriter
      - doc: |-
          reply implements datagramSink. Inside a batch it copies b into the arena and
          reports it sent; flush sends it, and a failure there is counted in State,
          since the handler has returned. Outside one, or for a peer this sink cannot
          address, it is one WriteTo.
        name: reply
        params: b []byte, to stdnet.Addr
        recv: w *multiWriter
        results: n int, err error
      - doc: |-
          encode writes to's sockaddr for this socket's family into entry, and reports
          whether it could: a UDP address of the socket's family, or an IPv4 one on an
          IPv6 socket, as a mapped address; a zoned IPv6 peer is left to WriteTo, which
          resolves its zone.
        name: encode
        params: to stdnet.Addr, entry *pendingReply
        recv: w *multiWriter
        results: bool
      - doc: "flush implements datagramSink: it sends what the batch queued and closes it."
        name: flush
        recv: w *multiWriter
      - doc: flushLocked sends the queue and empties it. mu is held.
        name: flushLocked
        recv: w *multiWriter
      - doc: |-
          build lays the queue from start out as messages, as many as it takes, and
          returns their count: each run of consecutive replies to one peer, of one size
          with possibly a shorter last, at most gsoSegments of them and no larger than
          maxSegment, is one GSO message; any other reply is a message alone.
        name: build
        params: start int
        recv: w *multiWriter
        results: int
      - doc: runFrom returns how many replies from e one GSO message carries.
        name: runFrom
        params: e int
        recv: w *multiWriter
        results: int
      - doc: |-
          layout writes message m: count replies from first, total bytes long, one
          iovec over their contiguous bytes, and UDP_SEGMENT when there are several.
        name: layout
        params: m, first, count, total int
        recv: w *multiWriter
      - doc: |-
          sendAll sends messages [0, messages) built from the queue, resuming from the
          count each sendmmsg returns, and returns the queue index the next build
          starts from: the queue's end once everything left or was counted, or the
          first reply of a span to send again without GSO.
        name: sendAll
        params: messages int
        recv: w *multiWriter
        results: int
      - doc: |-
          refused judges message k's refusal with errno, messages laid out, and
          reports whether the queue is to be rebuilt from resume.
        name: refused
        params: k, messages int, errno syscall.Errno
        recv: w *multiWriter
        results: resume int, again bool
      - doc: |-
          gsoRefused judges a GSO send's refusal with errno, and reports whether the
          queue is to be rebuilt from resume.
        name: gsoRefused
        params: span replySpan, errno syscall.Errno
        recv: w *multiWriter
        results: resume int, again bool
      - doc: |-
          sendFrom runs one sendmmsg from message k, parked on the netpoller while the
          socket's send buffer is full: how many messages the kernel took, or the
          errno of the first it refused, or the socket's failure.
        name: sendFrom
        params: k, messages int
        recv: w *multiWriter
        results: sent int, err error
      - doc: |-
          left notes that messages [k, end) left: a GSO send among them proves GSO
          works on this socket, and ends a run of EINVAL refusals.
        name: left
        params: k, end int
        recv: w *multiWriter
      - doc: |-
          unavailable serves messages [k, messages) after sendmmsg itself was refused,
          one WriteTo a reply. A reply that leaves so proves the refusal was the
          syscall's — a seccomp filter that allows sendto, not sendmmsg — and every
          later batch then leaves the same way; one that fails too, a firewall's
          EPERM for instance, is counted, and sendmmsg is tried again next batch.
        name: unavailable
        params: k, messages int
        recv: w *multiWriter
      - doc: |-
          writeEach writes queued replies [first, last) one WriteTo each, counts each
          that fails, and returns how many left.
        name: writeEach
        params: first, last int
        recv: w *multiWriter
        results: int
      - doc: fail counts the replies of messages [k, messages) as failed.
        name: fail
        params: k, messages int
        recv: w *multiWriter
      - doc: disableGSO switches GSO off for the socket's life and reports it once.
        name: disableGSO
        recv: w *multiWriter
    name: multiWriter
  - doc: |-
      capabilityEntry is one row of the registry: a token, its rank, and whether
      KITSUNIUM_NET_DISABLE may switch it off.
    fields:
      - doc: token is the capability, as the variables spell it.
        name: token
        type: corenet.Capability
      - doc: rank is its place in the lattice.
        name: rank
        type: int
      - doc: switchable is true for an engine an operator may switch off; a floor is not.
        name: switchable
        type: bool
      - doc: |-
          kernel is true for an optional kernel capability (ADR 0189), which
          KITSUNIUM_NET_DISABLE switches off and KITSUNIUM_NET_ENGINE never names.
        name: kernel
        type: bool
    kind: struct
    name: capabilityEntry
  - doc: |-
      operatorEnv is what KITSUNIUM_NET_ENGINE and KITSUNIUM_NET_DISABLE say, read
      once by New, before any group is declared and so before any probe.
    fields:
      - doc: override is what State reports.
        name: override
        type: corenet.OverrideValue
      - doc: faults are the tokens the registry does not know.
        name: faults
        type: "[]corenet.FaultValue"
      - doc: ceiling is the highest rank the environment allows.
        name: ceiling
        type: int
      - doc: disabled holds the ranks KITSUNIUM_NET_DISABLE switched off.
        name: disabled
        type: "[rankIOURing + 1]bool"
      - doc: |-
          kernelOff are the kernel capabilities it switched off; noOptional is
          set by an unknown token, which switches every one off (R5).
        name: kernelOff
        type: "[]corenet.Capability"
      - name: noOptional
        type: bool
    kind: struct
    methods:
      - doc: |-
          applyEngine caps the lattice at the named engine; an unknown one caps it at
          portable and is reported.
        name: applyEngine
        params: token string
        recv: e *operatorEnv
      - doc: |-
          applyDisable switches off each listed engine; a token outside the registry,
          or a floor, which nothing switches off, caps the lattice at portable and is
          reported.
        name: applyDisable
        params: list string
        recv: e *operatorEnv
      - doc: |-
          unknown records a token the registry does not know and caps the lattice at
          portable, with no optional capability (R5).
        name: unknown
        params: variable, token string
        recv: e *operatorEnv
      - doc: applied is the highest engine the environment allows, Disabled skipped.
        name: applied
        recv: e *operatorEnv
        results: corenet.Capability
      - doc: |-
          allows reports whether the environment lets a group run on the engine of
          rank r.
        name: allows
        params: r int
        recv: e *operatorEnv
        results: bool
      - doc: |-
          kernelDisabled reports whether the environment switched kernel capability c
          off, by name or by an unknown token.
        name: kernelDisabled
        params: c corenet.Capability
        recv: e *operatorEnv
        results: bool
      - doc: |-
          kernelSwitches is what a loop group is told is off, and how State says it:
          every kernel capability under an unknown token, the listed ones otherwise.
        name: kernelSwitches
        recv: e *operatorEnv
        results: "[]corenet.Capability, string"
      - doc: |-
          plan is min(code, environment) for a loop group whose code asked for code,
          on a platform with the native backends when native is true (ADR 0187 §D8):
          the highest backend at or below the code's that the environment allows. A
          backend the environment rules out is never probed: epoll and portable never
          reach io_uring_setup. Off Linux every loop group is portable, whatever the
          environment says, an explicit native backend having been refused already.
        name: plan
        params: code corenet.LoopBackend, native bool
        recv: e *operatorEnv
        results: loopPlan
      - doc: backendPlan is plan's backend half.
        name: backendPlan
        params: code corenet.LoopBackend, native bool
        recv: e *operatorEnv
        results: loopPlan
    name: operatorEnv
  - doc: |-
      loopPlan is the backend a loop group starts on once the environment is
      applied, and whether a native failure may still fall back to portable.
    fields:
      - doc: backend is what the leaf is asked for, or LoopBackendPortable.
        name: backend
        type: corenet.LoopBackend
      - doc: |-
          fallback is true when the code asked for auto: a native failure then
          falls back to portable, reported, rather than refusing Start.
        name: fallback
        type: bool
      - doc: |-
          disabled are the kernel capabilities the environment switched off,
          disabledBy how State says it (ADR 0189).
        name: disabled
        type: "[]corenet.Capability"
      - name: disabledBy
        type: string
    kind: struct
    name: loopPlan
  - doc: |-
      optionSet is the set of option kinds a group was given (ADR 0187), one bit
      per corenet.OptionKind. The kind is an iota, not a bit: the set does the
      shifting, so a kind added at the end of the block shifts no published value.
      A refusal reads the set, so an option given with its zero value — a
      ReadTimeout(0) — counts as given, which a guess from non-zero fields missed.
    kind: named
    methods:
      - doc: |-
          add records that an option of kind k was given. A kind past the set's width
          cannot be recorded; Test_optionSet_width keeps every kind within it.
        name: add
        params: k corenet.OptionKind
        recv: s *optionSet
      - doc: has reports whether an option of kind k was given.
        name: has
        params: k corenet.OptionKind
        recv: s *optionSet
        results: bool
      - doc: |-
          list returns the kinds given, in the constant block's order, so the first
          refusal reported is reproducible.
        name: list
        recv: s *optionSet
        results: "[]corenet.OptionKind"
    name: optionSet
    underlying: uint64
  - kind: named
    name: Option
    underlying: func(*Server)
  - kind: named
    name: GroupOption
    underlying: func(*StreamGroup)
  - doc: |-
      packet is the domain's view of one received datagram.

      Its payload points into the read buffer that produced it, which is what makes
      batched reading allocation-free — and is why the port documents that Data is
      valid only until ServePacket returns.
    fields:
      - doc: data is the payload, a subslice of the owning read buffer.
        name: data
        type: "[]byte"
      - doc: from is the sender's address.
        name: from
        type: stdnet.Addr
      - doc: conn is the socket the datagram arrived on, used by Reply.
        name: conn
        type: stdnet.PacketConn
      - doc: |-
          sink sends Reply's datagram: queued with the batch's other replies while
          the batch is served, at once otherwise (ADR 0192). Nil on a packet built
          without a read loop, which writes to conn.
        name: sink
        type: datagramSink
      - doc: id is the monotonic identifier assigned at read time.
        name: id
        type: uint64
      - doc: group names the listener group that received it.
        name: group
        type: string
    kind: struct
    methods:
      - doc: Data implements corenet.Packet.
        name: Data
        recv: p *packet
        results: "[]byte"
      - doc: From implements corenet.Packet.
        name: From
        recv: p *packet
        results: stdnet.Addr
      - doc: |-
          To implements corenet.Packet. A packet whose read loop has ended has no
          socket left to ask, and answers nil.
        name: To
        recv: p *packet
        results: stdnet.Addr
      - doc: ID implements corenet.Packet.
        name: ID
        recv: p *packet
        results: uint64
      - doc: Group implements corenet.Packet.
        name: Group
        recv: p *packet
        results: string
      - doc: |-
          Reply implements corenet.Packet.

          It exists so the overwhelmingly common case — answer the sender — needs no
          reference to the underlying socket, which the handler has no other way to
          reach and should not have to thread through itself.

          The port bounds only Data to the handler's call, so a handler may keep the
          Packet and reply later. Once the read loop has ended and reset it, the reply
          is net.ErrClosed — what writing to the closed socket would have answered —
          rather than a nil dereference.

          A reply made while its batch is served is queued and leaves with the batch's
          other replies (datagramSink): its n and err report the queueing, and a send
          that fails afterwards is counted in State's Datagrams.
        name: Reply
        params: b []byte
        recv: p *packet
        results: n int, err error
      - doc: |-
          reset clears the datagram when its read loop ends. It must drop every
          reference: a handler that kept the Packet past its call would otherwise pin
          the closed socket and the last read buffer for as long as it holds it.
        name: reset
        recv: p *packet
    name: packet
  - fields:
      - doc: name identifies the group in logs, metrics and State.
        name: name
        type: string
      - doc: addrs are the addresses to bind.
        name: addrs
        type: "[]corenet.AddressValue"
      - doc: handler serves each received datagram.
        name: handler
        type: corenet.PacketHandler
      - doc: middlewares decorate the handler, outermost first.
        name: middlewares
        type: "[]corenet.Middleware[corenet.PacketHandler]"
      - doc: limits bounds what the group may consume.
        name: limits
        type: corenet.LimitsValue
      - doc: adopt names inherited sockets to take over instead of binding.
        name: adopt
        type: "[]string"
      - doc: |-
          batchReplies queues the replies of a read batch and sends them when it
          ends (BatchReplies, ADR 0192).
        name: batchReplies
        type: bool
    kind: struct
    methods:
      - name: Name
        recv: g *PacketGroup
        results: string
      - name: Handle
        params: h corenet.PacketHandler
        recv: g *PacketGroup
        results: "*PacketGroup"
      - name: HandleFunc
        params: f corenet.PacketHandlerFunc
        recv: g *PacketGroup
        results: "*PacketGroup"
      - name: Use
        params: middlewares ...corenet.Middleware[corenet.PacketHandler]
        recv: g *PacketGroup
        results: "*PacketGroup"
      - doc: resolved returns the handler with the group's middlewares applied.
        name: resolved
        recv: g *PacketGroup
        results: corenet.PacketHandler
      - doc: |-
          mountUDPEntry serves h as UDP's entry: a PacketHandler, the one type a
          datagram engine serves.
        name: mountUDPEntry
        params: h any
        recv: g *PacketGroup
        results: error
    name: PacketGroup
  - doc: boundPacketConn pairs a live datagram socket with the group that owns it.
    fields:
      - doc: group is the owning group's name.
        name: group
        type: string
      - doc: addr is the address as requested.
        name: addr
        type: corenet.AddressValue
      - doc: pc is the live socket.
        name: pc
        type: stdnet.PacketConn
      - doc: |-
          source reads it, sink sends its replies; both are built with it, before
          its read loop starts.
        name: source
        type: datagramSource
      - name: sink
        type: datagramSink
      - doc: |-
          done is closed when its read loop has ended, which a handover waits on;
          doneOnce guards the close.
        name: done
        type: chan struct{}
      - name: doneOnce
        type: sync.Once
    kind: struct
    methods:
      - doc: "finish closes done, once: the read loop has ended."
        name: finish
        recv: b *boundPacketConn
      - doc: |-
          handover prepares the socket for whoever reads it next and reports whether
          its read loop is draining: wait on done before closing it.
        name: handover
        recv: b *boundPacketConn
        results: bool
      - doc: stopGRO switches GRO off on the socket, without a drain.
        name: stopGRO
        recv: b *boundPacketConn
      - doc: Close releases the socket, which is what ends its read loop.
        name: Close
        recv: b *boundPacketConn
        results: error
    name: boundPacketConn
  - doc: |-
      handoverSource is the part of a source that hands its socket over: a drain
      to EAGAIN with GRO on, then GRO off, which ends the read loop (ADR 0192).
    kind: named
    name: handoverSource
    underlying: |-
      interface {
      	// handover starts it and reports whether there is a drain to wait for.
      	handover() bool
      	// stopGRO switches GRO off without a drain.
      	stopGRO()
      }
  - doc: |-
      rawConnProvider is the part of *net.UDPConn the batched reader needs: access
      to the raw descriptor under the runtime's netpoller.

      Declaring the contract rather than asserting the concrete *net.UDPConn keeps
      a wrapper or a test double able to opt in, and keeps the fallback honest for
      anything that cannot.
    kind: named
    name: rawConnProvider
    underlying: |-
      interface {
      	SyscallConn() (syscall.RawConn, error)
      }
  - doc: |-
      queuedReply is one reply queuedSink holds: where its bytes sit in the arena
      and the peer it goes to.
    fields:
      - doc: off and size place the reply's bytes in the arena.
        name: "off"
        type: int
      - doc: off and size place the reply's bytes in the arena.
        name: size
        type: int
      - doc: to is the peer.
        name: to
        type: stdnet.Addr
    kind: struct
    name: queuedReply
  - doc: |-
      queuedSink is BatchReplies where sendmmsg is not: the batch's replies are
      queued and leave at its end, one WriteTo each (ADR 0192). The option's
      contract — a reply reported sent when queued, a failure counted — is the
      same on every platform; only the syscall count differs.

      Its queue and arena are allocated once, at construction; a mutex guards
      them, since a handler that kept its Packet may reply from another goroutine.
    fields:
      - doc: pc is the socket replies leave through.
        name: pc
        type: stdnet.PacketConn
      - doc: counters is where failed replies are counted.
        name: counters
        type: "*datagramCounters"
      - doc: mu guards everything below.
        name: mu
        type: sync.Mutex
      - doc: open is true between begin and flush, while replies are queued.
        name: open
        type: bool
      - doc: arena holds the queued replies' bytes, used of it so far.
        name: arena
        type: "[]byte"
      - name: used
        type: int
      - doc: queue is the replies queued in this batch.
        name: queue
        type: "[]queuedReply"
    kind: struct
    methods:
      - doc: "begin implements datagramSink: replies are queued from here."
        name: begin
        recv: w *queuedSink
      - doc: |-
          reply implements datagramSink: queued inside a batch, at once outside one or
          when it is larger than the arena.
        name: reply
        params: b []byte, to stdnet.Addr
        recv: w *queuedSink
        results: n int, err error
      - doc: "flush implements datagramSink: it sends what the batch queued and closes it."
        name: flush
        recv: w *queuedSink
      - doc: flushLocked sends the queue, one WriteTo a reply, and empties it. mu is held.
        name: flushLocked
        recv: w *queuedSink
    name: queuedSink
  - doc: "lookupFunc reads one environment variable: os.LookupEnv, or a test's map."
    kind: named
    name: lookupFunc
    underlying: func(key string) (string, bool)
  - fields:
      - doc: mu guards the declaration-time fields below.
        name: mu
        type: sync.RWMutex
      - doc: groups preserves declaration order so listeners bind predictably.
        name: groups
        type: "[]*StreamGroup"
      - doc: packetGroups preserves declaration order for the datagram side.
        name: packetGroups
        type: "[]*PacketGroup"
      - doc: packetByName rejects a duplicate datagram group name.
        name: packetByName
        type: map[string]*PacketGroup
      - doc: packetConns are the live bound datagram sockets.
        name: packetConns
        type: "[]*boundPacketConn"
      - doc: byName rejects a duplicate group name at declaration time.
        name: byName
        type: map[string]*StreamGroup
      - doc: declErr is the first declaration error, surfaced by Start.
        name: declErr
        type: error
      - doc: listeners are the live bound listeners.
        name: listeners
        type: "[]*boundListener"
      - doc: loopEngines are the running loop groups (ADR 0186).
        name: loopEngines
        type: "[]loopEngine"
      - doc: states mirrors listeners for reporting, including any degradation.
        name: states
        type: "[]corenet.ListenerStateValue"
      - doc: drainTimeout bounds Shutdown.
        name: drainTimeout
        type: time.Duration
      - doc: phase is the lifecycle phase, read without the mutex by State.
        name: phase
        type: atomic.Uint32
      - doc: inFlight tracks connections being served, for the drain.
        name: inFlight
        type: sync.WaitGroup
      - doc: active, total, rejected and oversized feed State.
        name: active
        type: atomic.Int64
      - name: total
        type: atomic.Uint64
      - name: rejected
        type: atomic.Uint64
      - doc: |-
          oversized counts datagrams dropped for passing their group's ceiling. A
          read loop has nobody to hand an error to, so this counter is how the drop
          is reported instead of hidden.
        name: oversized
        type: atomic.Uint64
      - doc: datagrams counts what the batched datagram paths drop (ADR 0192).
        name: datagrams
        type: datagramCounters
      - doc: gsoMu guards gsoOff.
        name: gsoMu
        type: sync.Mutex
      - doc: |-
          gsoOff names, once each, the groups a socket of which the device refused
          GSO for: a fault State lists for as long as the server lives.
        name: gsoOff
        type: "[]string"
      - doc: |-
          acceptBackoffs counts the waits accept loops took after a failed Accept —
          descriptor exhaustion, typically — so a server that is failing to accept
          says so in State instead of spinning a core per listener.
        name: acceptBackoffs
        type: atomic.Uint64
      - doc: "clk is the engine's clock: what an accept loop's backoff waits on."
        name: clk
        type: clock.Timed
      - doc: |-
          connPool recycles the per-connection struct so a steady-state accept
          loop allocates nothing per connection.
        name: connPool
        type: "*recycler.Pool[*conn]"
      - doc: nextID assigns each connection its correlation identifier.
        name: nextID
        type: atomic.Uint64
      - doc: liveMu guards live.
        name: liveMu
        type: sync.RWMutex
      - doc: |-
          live tracks the sockets currently being served, so an expired drain
          budget can sever them. Without this registry a stuck handler would make
          Shutdown block forever, which is precisely what a budget exists to
          prevent.
        name: live
        type: map[uint64]stdnet.Conn
      - doc: inheritOnce reads the supervisor's socket table at most once per server.
        name: inheritOnce
        type: sync.Once
      - doc: |-
          inherited is that table, held for the server's lifetime so no wrapper is
          ever collected and no finaliser closes a descriptor still to be adopted.
        name: inherited
        type: map[string][]*os.File
      - doc: inheritErr is the failure to read it, reported to every adoption.
        name: inheritErr
        type: error
      - doc: stop cancels every in-flight handler when the server shuts down.
        name: stop
        type: context.CancelFunc
      - doc: |-
          runCtx is handed to every handler. It deliberately outlives the caller's
          start context so cancelling that context does not tear handlers down
          before the drain has had its budget.
        name: runCtx
        type: context.Context
      - doc: lookup reads the operator's variables; os.LookupEnv unless a test says.
        name: lookup
        type: lookupFunc
      - doc: operator is what they said, read once by New, before any probe.
        name: operator
        type: operatorEnv
      - doc: platform is what State names the server runs on, read once by New.
        name: platform
        type: corenet.PlatformValue
      - doc: fallbackMu guards fallbacks.
        name: fallbackMu
        type: sync.Mutex
      - doc: fallbacks counts the engine fallbacks and keeps the last one.
        name: fallbacks
        type: corenet.FallbacksValue
      - doc: stall watches the loop groups for one every ring of which is drained.
        name: stall
        type: stallWatch
    kind: struct
    methods:
      - doc: |-
          adoptedSockets recovers the inherited sockets published under one name.

          Socket activation is what makes a zero-downtime restart possible: the
          supervisor keeps the bound socket across the exec, so no connection is lost
          and no bind races. The engine therefore adopts rather than binds when a group
          names an inherited socket.

          unsetEnv is false: the group may name several sockets, and clearing the
          environment on the first lookup would make every later one come back empty.
          The caller clears it once, after startup, if it spawns children of its own.
        name: adoptedSockets
        params: name string
        recv: s *Server
        results: files []*os.File, err error
      - doc: adoptStream turns inherited descriptors into stream listeners.
        name: adoptStream
        params: name string
        recv: s *Server
        results: listeners []stdnet.Listener, err error
      - doc: |-
          adoptPacket turns inherited descriptors into datagram sockets.

          sdlisten.Listeners only wraps stream sockets, so the datagram side goes
          through the raw descriptors — the consequence this domain recorded when ADR
          0029 was written, and the reason adoption is implemented here rather than by
          widening another domain's surface.
        name: adoptPacket
        params: name string
        recv: s *Server
        results: conns []stdnet.PacketConn, err error
      - name: RegisterHealth
        params: h corehealth.Health
        recv: s *Server
        results: error
      - doc: readiness is the readiness check, built from State.
        name: readiness
        params: _ context.Context
        recv: s *Server
        results: error
      - doc: |-
          liveness is the liveness check: it fails once a loop group has stayed
          stalled for loopStallGrace (R1). A ring whose receive never completes is
          not watched: only the accept watchdog drains a ring.
        name: liveness
        recv: s *Server
        results: error
      - name: Start
        params: ctx context.Context
        recv: s *Server
        results: error
      - doc: |-
          bindEverything binds both natures, streams first so a mixed server's ports
          come up in declaration order.
        name: bindEverything
        params: ctx context.Context, groups []*StreamGroup, packetGroups []*PacketGroup
        recv: s *Server
        results: error
      - doc: bindPacketAll binds every datagram group, starting a read loop per socket.
        name: bindPacketAll
        params: ctx context.Context, groups []*PacketGroup
        recv: s *Server
        results: error
      - doc: |-
          bindPacketGroup binds one datagram group and starts its read loops.

          Goroutine lifecycle: it starts exactly one readLoop per address. Each is
          owned by the Server, holds an inFlight token released on exit, and terminates
          when Close or Shutdown closes its socket.
        name: bindPacketGroup
        params: ctx context.Context, group *PacketGroup
        recv: s *Server
        results: error
      - doc: |-
          adoptPacketSockets takes over the group's inherited datagram sockets.

          Goroutine lifecycle: one readLoop per adopted socket, owned by the Server
          exactly as a bound one is.
        name: adoptPacketSockets
        params: group *PacketGroup, handler corenet.PacketHandler
        recv: s *Server
        results: error
      - doc: bindAll binds every group, starting an accept loop per listener.
        name: bindAll
        params: ctx context.Context, groups []*StreamGroup
        recv: s *Server
        results: error
      - doc: bindGroup binds one group's addresses and starts their accept loops.
        name: bindGroup
        params: ctx context.Context, group *StreamGroup
        recv: s *Server
        results: error
      - doc: |-
          adoptStreamSockets takes over the group's inherited stream listeners.

          Goroutine lifecycle: one acceptLoop per adopted listener, owned by the Server
          exactly as a bound one is — adoption changes where the socket came from, not
          how it is served.
        name: adoptStreamSockets
        params: group *StreamGroup, handler corenet.ConnHandler
        recv: s *Server
        results: error
      - doc: |-
          bindShards opens one address's listeners and starts an accept loop per shard.

          Several listeners on one address is the whole point of SO_REUSEPORT: the
          kernel load-balances incoming connections across them, so N accept loops
          never contend on a single accept queue. Where the option is unavailable the
          count collapses to one and State reports why.

          Goroutine lifecycle: it starts exactly one acceptLoop per shard. Each is
          owned by the Server, holds an inFlight token released on exit, and terminates
          when Close or Shutdown closes its listener — the only signal that reliably
          interrupts a blocking Accept.
        name: bindShards
        params: ctx context.Context, group *StreamGroup, addr corenet.AddressValue, handler corenet.ConnHandler
        recv: s *Server
        results: error
      - doc: |-
          acceptLoop accepts connections until its listener is closed.

          An Accept that fails for any reason but the listener closing — the process
          out of descriptors, typically, with a connection still queued — is retried
          after a backoff on the engine's clock, never at once: retrying at once spins
          a core for as long as the condition lasts, one per listener. The backoff
          starts over at the next accepted connection, and a listener closed during
          one ends the loop without waiting it out (ADR 0130).

          Goroutine lifecycle: one per listener, started by bindGroup and owned by the
          Server. It exits when Close or Shutdown closes the listener; its inFlight
          token is released on exit. It starts one serve goroutine per accepted
          connection, each of which takes its own token.
        name: acceptLoop
        params: bound *boundListener, group *StreamGroup, handler corenet.ConnHandler
        recv: s *Server
      - doc: |-
          backOff waits delay on the engine's clock, or until the listener closes; it
          reports whether the loop should accept again.
        name: backOff
        params: bound *boundListener, delay time.Duration
        recv: s *Server
        results: bool
      - doc: |-
          serve runs the handler for one connection.

          Goroutine lifecycle: one per accepted connection, started by acceptLoop and
          owned by the Server. It always closes the connection, releases its pooled
          state and its inFlight token, so a handler that returns early or panics
          cannot leak either.
        name: serve
        params: raw stdnet.Conn, group *StreamGroup, handler corenet.ConnHandler, release func()
        recv: s *Server
      - name: Serve
        params: ctx context.Context
        recv: s *Server
        results: error
      - name: Shutdown
        params: ctx context.Context
        recv: s *Server
        results: error
      - doc: shutdownHTTP stops every group's embedded http.Server, if it has one.
        name: shutdownHTTP
        params: ctx context.Context
        recv: s *Server
      - doc: |-
          closeHTTP stops every group's embedded http.Server immediately, matching
          Close's contract rather than Shutdown's.
        name: closeHTTP
        recv: s *Server
      - doc: waitIdle blocks until no connection is in flight or ctx expires.
        name: waitIdle
        params: ctx context.Context
        recv: s *Server
        results: error
      - name: Close
        recv: s *Server
        results: error
      - doc: |-
          closeListeners closes and forgets every bound listener.

          A close error is not surfaced: during shutdown the only realistic cause is a
          listener already closed by a concurrent Close, and reporting that would turn
          a benign race into a spurious failure.
        name: closeListeners
        recv: s *Server
      - doc: |-
          closeStreamListeners closes and forgets every bound stream listener, which
          ends the accept loops.
        name: closeStreamListeners
        recv: s *Server
      - doc: |-
          bindLoopGroup binds or adopts a loop group's listeners, registers them as
          the server's like any other, and starts the group's engine on them.
        name: bindLoopGroup
        params: ctx context.Context, group *StreamGroup
        recv: s *Server
        results: error
      - doc: |-
          registerLoopListeners records a loop group's listeners, so Close and
          Shutdown close them and State reports them, as for every group.
        name: registerLoopListeners
        params: group *StreamGroup, lns []stdnet.Listener, adopted bool
        recv: s *Server
      - doc: loopStates reports every loop group.
        name: loopStates
        recv: s *Server
        results: "[]corenet.LoopStateValue"
      - doc: shutdownLoops drains every loop group within ctx.
        name: shutdownLoops
        params: ctx context.Context
        recv: s *Server
        results: error
      - doc: closeLoops closes every loop group now.
        name: closeLoops
        recv: s *Server
      - doc: |-
          newBoundPacket pairs a live datagram socket with its group, its source — the
          batched reader with UDP GRO on where the platform has it — and its sink:
          replies at once, or per batch under BatchReplies.
        name: newBoundPacket
        params: group *PacketGroup, addr corenet.AddressValue, pc stdnet.PacketConn
        recv: s *Server
        results: "*boundPacketConn"
      - doc: |-
          handoverPackets hands every datagram socket over before it is closed, and
          waits, within handoverBudget and ctx, for each read loop's drain to end:
          what the socket queued coalesced is served here, then GRO goes off, so
          nothing coalesced is left to a successor that may not split it (ADR 0192).
          A drain still running when the budget ends has GRO switched off at once, and
          the close that follows cuts it.
        name: handoverPackets
        params: ctx context.Context
        recv: s *Server
      - doc: recordGSOOff names group among those sending without GSO, once.
        name: recordGSOOff
        params: group string
        recv: s *Server
      - doc: gsoFaults is one fault per group a socket of which sends without GSO.
        name: gsoFaults
        recv: s *Server
        results: "[]corenet.FaultValue"
      - doc: |-
          stopGROPackets switches GRO off on every datagram socket, without a drain:
          Close's, which waits for nothing.
        name: stopGROPackets
        recv: s *Server
      - doc: |-
          readLoop serves datagrams until its socket is closed.

          Goroutine lifecycle: one per datagram socket, started by bindPacketGroup and
          owned by the Server. It exits when Close or Shutdown closes the socket — the
          only signal that reliably interrupts a blocking read — and releases its
          inFlight token on exit.

          Handlers run inline on this goroutine rather than being dispatched to a pool.
          A datagram handler is expected to be short, and a hand-off would cost a
          channel send plus an allocation per packet, undoing the very batching this
          path exists for. A handler that must block should copy the payload and hand
          it to its own worker.
        name: readLoop
        params: bound *boundPacketConn, group *PacketGroup, handler corenet.PacketHandler
        recv: s *Server
      - doc: |-
          dispatch serves every datagram in a filled batch, dropping any past the
          group's ceiling, and each coalesced message as the datagrams it carries.

          An oversized datagram is NOT handed on. The kernel has already discarded its
          tail, so what remains is a prefix that reads exactly like a complete message:
          the handler has no way to tell it was cut, and a partial payload accepted as
          whole is a correctness bug rather than a capacity one. It is dropped and
          counted in State instead — the same answer the accept path gives a connection
          past its ceiling, because there is nobody above a read loop to return an
          error to and the counter is therefore the report. A message the kernel cut
          (datagram.cut) is dropped and counted the same way, in Datagrams.
        name: dispatch
        params: slots []datagram, held *packet, handler corenet.PacketHandler, ceiling int
        recv: s *Server
      - doc: serveMessage serves each datagram of one message, one Packet each.
        name: serveMessage
        params: slot *datagram, held *packet, handler corenet.PacketHandler, ceiling int
        recv: s *Server
      - doc: servePacket runs the handler for one datagram, containing any panic.
        name: servePacket
        params: p *packet, handler corenet.PacketHandler
        recv: s *Server
        results: error
      - doc: |-
          acquire takes a pooled connection wrapper and fills it for this socket.

          Pooling the wrapper — and the scratch buffer with it — is what keeps a
          steady-state accept loop from allocating per connection. The cost of getting
          it wrong is a wrapper that outlives its socket, which is why release drops
          every reference it holds.
        name: acquire
        params: raw stdnet.Conn, group *StreamGroup
        recv: s *Server
        results: "*conn"
      - doc: |-
          release returns the wrapper to the pool, closing the socket unless a handler
          has taken it over.

          The close error is not surfaced: this runs on a deferred path with no caller
          to report to, and by this point the handler has already finished, so a
          failing close cannot change the outcome it produced.
        name: release
        params: c *conn
        recv: s *Server
      - doc: |-
          closeLive severs every socket still being served.

          It is the teeth behind the drain budget: cancelling the context asks a
          handler to stop, but a handler blocked in Read will not notice until its
          socket closes underneath it. Close errors are ignored because a socket the
          handler already closed is the expected case, not a fault.
        name: closeLive
        recv: s *Server
      - name: Group
        params: name string, opts ...GroupOption
        recv: s *Server
        results: "*StreamGroup"
      - name: PacketGroup
        params: name string, opts ...GroupOption
        recv: s *Server
        results: "*PacketGroup"
      - doc: |-
          judgePacketOptions records the first option a datagram group cannot honour
          (ADR 0186 §D1, ADR 0187), for Start to report: a Name that contradicts the
          declared one, Loop, which has no datagram engine, and Plaintext with TLS or
          an Engine other than the goroutine one. The caller holds s.mu.
        name: judgePacketOptions
        params: shim *StreamGroup
        recv: s *Server
      - doc: recordDeclError keeps the first declaration error. The caller holds s.mu.
        name: recordDeclError
        params: err error
        recv: s *Server
      - name: State
        recv: s *Server
        results: corenet.StateValue
      - doc: |-
          recordFallback counts a group started on a lower engine than its code asked
          for, because the better one failed, and keeps it as the last (ADR 0188).
        name: recordFallback
        params: group, reason string
        recv: s *Server
      - name: HTTP
        params: addr string, h any, opts ...GroupOption
        recv: s *Server
        results: "*StreamGroup"
      - name: TCP
        params: addr string, h any, opts ...GroupOption
        recv: s *Server
        results: "*StreamGroup"
      - name: UDP
        params: addr string, h any, opts ...GroupOption
        recv: s *Server
        results: "*PacketGroup"
      - doc: |-
          simpleGroup declares the stream group of a simple-API entry: listening on
          network addr, named network+"+"+addr unless Name names it.
        name: simpleGroup
        params: network, addr string, opts []GroupOption
        recv: s *Server
        results: "*StreamGroup"
      - doc: recordGroupErr records err as the server's declaration error.
        name: recordGroupErr
        params: err error
        recv: s *Server
      - doc: |-
          startStallWatch ticks the watcher on the engine's clock while the server
          has loop groups. Shutdown and Close stop it.
        name: startStallWatch
        recv: s *Server
      - doc: stopStallWatch stops the watcher, if it runs, and joins it.
        name: stopStallWatch
        recv: s *Server
      - doc: |-
          checkStalls reads every loop group while the server serves, and records the
          first one stalled: Serve returns LoopGroupStalled, and liveness fails once
          loopStallGrace has passed. A drain stops every ring on purpose, so nothing
          is read outside PhaseServing.
        name: checkStalls
        recv: s *Server
      - doc: |-
          markStalled records group as stalled, once: the first stall is the one
          Serve returns and the grace counts from.
        name: markStalled
        params: group string
        recv: s *Server
      - doc: stalledGroup is the first loop group seen stalled and when; empty while none.
        name: stalledGroup
        recv: s *Server
        results: string, time.Time
      - doc: |-
          faults lists what st says the server runs without: the environment's unknown
          tokens, the degraded listeners and loop groups, and, while serving, each
          drained ring and each stalled group (ADR 0188).
        name: faults
        params: st corenet.StateValue
        recv: s *Server
        results: "[]corenet.FaultValue"
      - doc: |-
          admit runs the handler under the group's ceiling, translating a rejection
          into the domain's own sentinel.

          A connection turned away here has already been accepted by the kernel, so it
          is answered by closing it immediately rather than by letting the accept queue
          overflow silently — a refusal the peer can observe beats a timeout it cannot
          distinguish from a hang.
        name: admit
        params: ctx context.Context, limiter *connLimiter, c corenet.Conn, handler corenet.ConnHandler
        recv: s *Server
        results: error
    name: Server
  - doc: |-
      stallWatch is the state of the stall watcher: the first group seen stalled
      and when, and the channel Serve selects on.
    fields:
      - doc: mu guards group and at.
        name: mu
        type: sync.Mutex
      - doc: group is the first loop group seen stalled; empty while none is.
        name: group
        type: string
      - doc: at is when it was first seen.
        name: at
        type: time.Time
      - doc: once closes stalled once.
        name: once
        type: sync.Once
      - doc: stalled is closed when a group is first seen stalled.
        name: stalled
        type: chan struct{}
      - doc: daemon ticks the watcher while the server serves; nil without loop groups.
        name: daemon
        type: "*worker.LoopDaemon"
    kind: struct
    name: stallWatch
  - fields:
      - doc: name identifies the group in logs, metrics and State.
        name: name
        type: string
      - doc: addrs are the addresses to bind.
        name: addrs
        type: "[]corenet.AddressValue"
      - doc: handler serves each accepted connection.
        name: handler
        type: corenet.ConnHandler
      - doc: middlewares decorate the handler, outermost first.
        name: middlewares
        type: "[]corenet.Middleware[corenet.ConnHandler]"
      - doc: identity turns the group's listeners into TLS or mTLS listeners.
        name: identity
        type: corenet.IdentityValue
      - doc: limits bounds what the group may consume.
        name: limits
        type: corenet.LimitsValue
      - doc: timeouts bounds each phase of a connection.
        name: timeouts
        type: corenet.TimeoutsValue
      - doc: |-
          httpAdapter is set when the group serves an http.Handler, so the engine
          can shut the embedded http.Server down with the rest of the group.
        name: httpAdapter
        type: "*httpAdapter"
      - doc: |-
          http holds the bounds only an HTTP group has: the header phase's own
          deadline and the header size cap. They live here rather than in
          core/net's Timeouts and Limits, which describe every protocol a group
          can serve, and "a request header" is not a word in most of them.
        name: http
        type: httpBounds
      - doc: limiter caps concurrent connections; nil when the group has no ceiling.
        name: limiter
        type: "*connLimiter"
      - doc: adopt names inherited sockets to take over instead of binding.
        name: adopt
        type: "[]string"
      - doc: |-
          admission counts connections against their address before their
          handshake; nil when the group has none (ADR 0174).
        name: admission
        type: "*Admission"
      - doc: |-
          declErr is the group's first declaration error — a second handler,
          HandlerAlreadySet — surfaced by Start like the server's own (ADR 0186
          §D1). The group records it because a handler is declared on the group,
          after Group has returned and released the server's lock.
        name: declErr
        type: error
      - doc: |-
          defaultName is the simple API's default name, which a Name option
          replaces; empty for a group declared by Group.
        name: defaultName
        type: string
      - doc: |-
          declared records that a handler was declared, even a nil one, so a
          second declaration is caught whatever the first one passed.
        name: declared
        type: bool
      - doc: |-
          loop is the Loop option's value; loopSet records that the option was
          given, a zero value included, so Start can refuse it on a group whose
          handler is not a loop handler (ADR 0186 §D1).
        name: loop
        type: corenet.LoopValue
      - name: loopSet
        type: bool
      - doc: |-
          loopHandler is the group's loop handler, set by HandleLoop; a group
          with one is served by the loop engine (ADR 0186 §D1).
        name: loopHandler
        type: corenet.LoopHandler
      - doc: loopMiddlewares decorate the loop handler, outermost first (UseLoop).
        name: loopMiddlewares
        type: "[]corenet.Middleware[corenet.LoopHandler]"
      - doc: |-
          loopChain is loopHandler wrapped in loopMiddlewares, built and checked
          once at Start; the loop engine serves it.
        name: loopChain
        type: corenet.LoopHandler
      - doc: |-
          kinds is the set of option kinds the group was given, a zero value
          included, so a refusal reads what was posed rather than guessing from a
          non-zero field (ADR 0187).
        name: kinds
        type: optionSet
      - doc: |-
          engine is the Engine option's value; it is read only when kinds holds
          OptionEngine.
        name: engine
        type: corenet.EngineValue
      - doc: |-
          optName is the Name option's value; it is read only when kinds holds
          OptionName.
        name: optName
        type: string
    kind: struct
    methods:
      - doc: |-
          reconcileName applies the Name option to the name the group was declared
          with (ADR 0187): an empty declared name takes it, an equal one keeps it,
          and an empty Name or a different one records GroupNameConflict, which Start
          reports. The group keeps its declared name then.
        name: reconcileName
        recv: g *StreamGroup
      - doc: |-
          engineRefusal judges, at Start, the options that constrain the group's
          engine against each other and against its handler (ADR 0187): Plaintext
          with TLS is refused with PlaintextWithTLS, and an Engine the handler's type
          or the Loop option contradicts, or a value outside the block, with
          EngineUnsupported. It never picks the other engine instead (R6).
        name: engineRefusal
        recv: g *StreamGroup
        results: error
      - doc: |-
          startRefusal is one group's judgement at Start: its first declaration
          error, then the options that constrain its engine (ADR 0187), then the
          options a loop group cannot honour or Loop on a goroutine group (ADR 0186
          §D1). A group with no handler is left to bindAll, whose HandlerMissing wins
          over an option's refusal because it explains it.
        name: startRefusal
        recv: g *StreamGroup
        results: error
      - name: HandleLoop
        params: h corenet.LoopHandler
        recv: g *StreamGroup
        results: "*StreamGroup"
      - doc: |-
          loopRefusal judges a loop group's options at Start, once its handler is
          known: TLS is never served (LoopTLSUnsupported), Use never applies, and
          every other option given — a zero value included — is refused unless the
          loop engine or the handler honours it (LoopOptionUnsupported, naming it).
          It reads the set of kinds the group was given, never a guess from non-zero
          fields (ADR 0187).
        name: loopRefusal
        recv: g *StreamGroup
        results: error
      - doc: |-
          loopHonoursKind reports whether the loop group applies the option of kind
          k: the engine, the TLS codec's path, or the chain — Use never, whatever it
          claims.
        name: loopHonoursKind
        params: chain corenet.LoopHandler, k corenet.OptionKind
        recv: g *StreamGroup
        results: bool
      - doc: |-
          tlsCodec reports whether the group is the http1 codec given TLS (ADR 0187
          §D5, ADR 0198): crypto/tls handshakes on its own goroutine, then the
          cleartext goes through the codec on the portable backend's lanes.
        name: tlsCodec
        recv: g *StreamGroup
        results: bool
      - doc: |-
          loopTLSRefusal judges a loop group given TLS: a raw loop handler is
          refused with LoopTLSUnsupported, as ever; the codec, by tlsCodecRefusal.
        name: loopTLSRefusal
        recv: g *StreamGroup
        results: error
      - doc: |-
          tlsCodecRefusal judges a TLS codec group (R6): an identity that names
          nothing, an explicit native backend — TLS runs on the portable backend
          alone — and a loop middleware are refused with LoopTLSUnsupported, the
          option named; nothing is served without TLS or elsewhere instead.
        name: tlsCodecRefusal
        recv: g *StreamGroup
        results: error
      - doc: tlsErr is LoopTLSUnsupported naming the group and option.
        name: tlsErr
        params: option string
        recv: g *StreamGroup
        results: error
      - doc: |-
          loopLayers wraps a TLS codec group's listeners in TLS, offering HTTP/1.1
          alone; any other loop group's are returned as they are.
        name: loopLayers
        params: lns []stdnet.Listener
        recv: g *StreamGroup
        results: "[]stdnet.Listener"
      - doc: |-
          loopBackend is the backend the group's code asks for: the portable one for
          a TLS codec group, the only one with TLS; the Loop option's otherwise.
        name: loopBackend
        recv: g *StreamGroup
        results: corenet.LoopBackend
      - doc: |-
          codecTLS is the configuration of a TLS codec group's listeners: the
          identity's, offering HTTP/1.1 alone, a fresh value each call.
        name: codecTLS
        recv: g *StreamGroup
        results: "*tls.Config"
      - doc: handshakeBound is the group's HandshakeTimeout, or the domain's default.
        name: handshakeBound
        recv: g *StreamGroup
        results: time.Duration
      - doc: recordErr records err as the group's declaration error, the first kept.
        name: recordErr
        params: err error
        recv: g *StreamGroup
      - doc: |-
          mountHTTPEntry serves h as HTTP's entry: net/http for an http.Handler, the
          http1 codec on the loop for an HTTP1Handler, Engine choosing for a
          handler that is both.
        name: mountHTTPEntry
        params: h any
        recv: g *StreamGroup
        results: error
      - doc: |-
          mountTCPEntry serves h as TCP's entry: a goroutine per connection for a
          ConnHandler, the loop for a LoopHandler.
        name: mountTCPEntry
        params: h any
        recv: g *StreamGroup
        results: error
      - doc: |-
          pickEngine chooses the engine a handler that is a goroutine one, a loop
          one or both runs on: the one it is, or Engine's for both; EngineAuto when
          none fits.
        name: pickEngine
        params: goroutine, loop bool
        recv: g *StreamGroup
        results: corenet.EngineValue
      - doc: |-
          pickRefusal says why pickEngine found no engine: both kinds and no Engine
          (HandlerAmbiguous), an Engine the handler cannot run on — whatever kinds it
          is (EngineUnsupported) — or a type the entry does not serve.
        name: pickRefusal
        params: entry string, h any, goroutine, loop bool
        recv: g *StreamGroup
        results: error
      - doc: missing is HandlerMissing for a nil handler given to entry.
        name: missing
        params: entry string
        recv: g *StreamGroup
        results: error
      - doc: |-
          servesHTTP reports whether the group speaks HTTP: net/http's adapter, or
          the http1 codec as its loop handler.
        name: servesHTTP
        recv: g *StreamGroup
        results: bool
      - doc: |-
          plaintextRefusal is ADR 0187 §D7: an HTTP group given no TLS must say
          Plaintext.
        name: plaintextRefusal
        recv: g *StreamGroup
        results: error
      - name: Name
        recv: g *StreamGroup
        results: string
      - name: Handle
        params: h corenet.ConnHandler
        recv: g *StreamGroup
        results: "*StreamGroup"
      - doc: |-
          claimHandler reports whether the group may take its handler now, and
          records HandlerAlreadySet when it already has one. It is the one check every
          declaration takes, so Handle, HandleFunc and HandleHTTP cannot disagree on
          what a second declaration means.
        name: claimHandler
        recv: g *StreamGroup
        results: bool
      - name: HandleFunc
        params: f corenet.ConnHandlerFunc
        recv: g *StreamGroup
        results: "*StreamGroup"
      - name: HandleHTTP
        params: h http.Handler
        recv: g *StreamGroup
        results: "*StreamGroup"
      - doc: |-
          mountHTTP installs the net/http adapter as the group's handler, unless the
          group already has one.
        name: mountHTTP
        params: h http.Handler
        recv: g *StreamGroup
        results: "*StreamGroup"
      - doc: |-
          tracksCloses reports whether the group's sockets must report their own
          Close: a handler can take one over — the group serves HTTP — while a ceiling
          still has to count it. It is read at bind time, after the limiter is built.
        name: tracksCloses
        recv: g *StreamGroup
        results: bool
      - name: Use
        params: middlewares ...corenet.Middleware[corenet.ConnHandler]
        recv: g *StreamGroup
        results: "*StreamGroup"
      - name: UseLoop
        params: middlewares ...corenet.Middleware[corenet.LoopHandler]
        recv: g *StreamGroup
        results: "*StreamGroup"
      - doc: resolved returns the handler with the group's middlewares applied.
        name: resolved
        recv: g *StreamGroup
        results: corenet.ConnHandler
    name: StreamGroup
  - doc: |-
      connLimiter caps how many connections a group holds at once.

      It is a reject-mode channel semaphore: a free slot admits, a full one
      refuses at once, nothing queues. That is exactly the resilience bulkhead's
      shape, and the ceiling used to BE a bulkhead — until hijacking showed what a
      Runner cannot express. A Runner holds its slot for exactly one call, and a
      connection a handler takes over outlives the call that admitted it: every
      upgraded WebSocket gave its slot back the moment it upgraded, so MaxConns
      bounded nothing an upgrade reached. The slot is therefore held explicitly
      here — returned when the handler returns, or handed to the socket itself
      when the handler took the socket over, and returned by its Close.
    fields:
      - doc: slots is the semaphore; its capacity is the ceiling.
        name: slots
        type: chan struct{}
      - doc: ceiling is the configured maximum, reported in the refusal.
        name: ceiling
        type: int
    kind: struct
    methods:
      - doc: tryAcquire claims a slot without waiting, reporting whether one was free.
        name: tryAcquire
        recv: l *connLimiter
        results: bool
      - doc: release returns one claimed slot.
        name: release
        recv: l *connLimiter
      - doc: |-
          releaseFor settles the slot c was admitted with once its handler is done:
          returned now, or — when a handler took c's socket over — handed to the
          socket, whose Close returns it.

          A hijacked connection stops being the engine's to close or to wait for (ADR
          0047 §D9), but it is still a connection, and MaxConns counts connections.
          Its Close is the only event left that says it is over.
        name: releaseFor
        params: c corenet.Conn
        recv: l *connLimiter
    name: connLimiter
vars:
  - grouped: true
    items:
      - doc: |-
          The portable reader is the floor every platform falls back to, so it
          must satisfy the seam on every platform, not only where the batched path
          exists.
        name: _
        type: datagramSource
        value: (*portableReader)(nil)
      - doc: The portable sink is the floor replies fall back to on every platform.
        name: _
        type: datagramSink
        value: portableSink{}
      - doc: The queued sink is BatchReplies' floor on every platform.
        name: _
        type: datagramSink
        value: (*queuedSink)(nil)
      - doc: A bound socket forwards the handover to its source.
        name: _
        type: handoverSource
        value: (*boundPacketConn)(nil)
    name: _
  - doc: |-
      The pooled connection wrapper must still satisfy the port it is handed to
      handlers as; a drift here is silent until a handler calls the missing method.
    items:
      - name: _
        type: corenet.Conn
        value: (*conn)(nil)
    name: _#2
  - grouped: true
    items:
      - doc: |-
          The batched reader must satisfy the seam the read loop is written
          against; a drift here would be silent until the first datagram arrived.
        name: _
        type: datagramSource
        value: (*multiReader)(nil)
      - doc: It hands its socket over too (ADR 0192 §D4).
        name: _
        type: handoverSource
        value: (*multiReader)(nil)
      - doc: The batched sink must satisfy the seam replies are written against.
        name: _
        type: datagramSink
        value: (*multiWriter)(nil)
    name: _#3
  - doc: streamNetworks are the socket families the stream engine serves.
    items:
      - name: streamNetworks
        value: |-
          map[string]struct{}{
          	"tcp": {}, "tcp4": {}, "tcp6": {}, "unix": {}, "unixpacket": {},
          }
    name: streamNetworks
  - doc: probeNames names each callback in LoopMiddlewareInvalid's "callback" field.
    items:
      - name: probeNames
        value: |-
          [probeCallbacks]string{
          	probeStart: "OnStart", probeOpen: "OnOpen", probeData: "OnData", probeTimeout: "OnTimeout",
          	probeWritable: "OnWritable", probeBatchEnd: "OnBatchEnd", probeClose: "OnClose", probeHonours: "Honours",
          }
    name: probeNames
  - doc: |-
      markRecycled, set by a test, fills each read buffer the batch released
      with recycledMark before it is read into again.
    items:
      - name: markRecycled
        type: atomic.Bool
    name: markRecycled
  - doc: |-
      alpnHTTP1 is the one protocol the http1 codec's TLS path offers: the
      profile is HTTP/1.1 only (ADR 0187 §D5).
    items:
      - name: alpnHTTP1
        value: "[]string{\"http/1.1\"}"
    name: alpnHTTP1
  - doc: |-
      capabilityRegistry is design/net.yaml's registry, top first.
      TestCapabilityRegistry_matchesTheDesign holds it to the design's two blocks.
    items:
      - name: capabilityRegistry
        value: |-
          [...]capabilityEntry{
          	{token: corenet.CapabilityIOURing, rank: rankIOURing, switchable: true},
          	{token: corenet.CapabilityEpoll, rank: rankEpoll, switchable: true},
          	{token: corenet.CapabilityPortable, rank: rankPortable, switchable: false},
          	{token: corenet.CapabilityGoroutine, rank: rankGoroutine, switchable: false},
          	{token: corenet.CapabilityURingMultishotRecv, rank: rankKernel, switchable: true, kernel: true},
          	{token: corenet.CapabilityURingPbuf, rank: rankKernel, switchable: true, kernel: true},
          	{token: corenet.CapabilityURingDirect, rank: rankKernel, switchable: true, kernel: true},
          	{token: corenet.CapabilityEpollExclusive, rank: rankKernel, switchable: true, kernel: true},
          	{token: corenet.CapabilityTCPNoDelay, rank: rankKernel, switchable: true, kernel: true},
          	{token: corenet.CapabilityURingDeferTaskrun, rank: rankKernel, switchable: true, kernel: true},
          	{token: corenet.CapabilityURingNoSQArray, rank: rankKernel, switchable: true, kernel: true},
          	{token: corenet.CapabilityURingRingFDs, rank: rankKernel, switchable: true, kernel: true},
          	{token: corenet.CapabilityURingSQRewind, rank: rankKernel, switchable: true, kernel: true},
          	{token: corenet.CapabilityURingSendZC, rank: rankKernel, switchable: true, kernel: true},
          	{token: corenet.CapabilityURingBundle, rank: rankKernel, switchable: true, kernel: true},
          	{token: corenet.CapabilityURingPbufInc, rank: rankKernel, switchable: true, kernel: true},
          	{token: corenet.CapabilityBusyPoll, rank: rankKernel, switchable: true, kernel: true},
          	{token: corenet.CapabilityURingZCRX, rank: rankKernel, switchable: true, kernel: true},
          	{token: corenet.CapabilityReuseportCBPF, rank: rankKernel, switchable: true, kernel: true},
          	{token: corenet.CapabilityTCPDeferAccept, rank: rankKernel, switchable: true, kernel: true},
          	{token: corenet.CapabilityURingMinTimeout, rank: rankKernel, switchable: true, kernel: true},
          }
    name: capabilityRegistry
  - doc: packetNetworks are the datagram families the engine serves.
    items:
