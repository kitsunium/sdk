functions:
  - name: NewAdmission
    params: cfg AdmissionConfig
    results: "*Admission"
  - doc: |-
      admissionKey is the budget a remote address counts against: the IPv4
      address, or the IPv6 /64.
    name: admissionKey
    params: a stdnet.Addr
    results: string
  - doc: |-
      admissionKeyOf folds an IP to its budget key: an IPv4 address stands for
      itself, while an IPv6 address is widened to its /64 because one host is
      routinely handed the whole prefix and could otherwise rotate past the
      per-address budget.
    name: admissionKeyOf
    params: ip stdnet.IP
    results: string
  - name: PreHandshake
    params: a *Admission
    results: GroupOption
  - doc: releaseAdmission gives a connection's admission slot back, if it has one.
    name: releaseAdmission
    params: ctx context.Context
  - doc: |-
      closeFiles releases descriptors an adoption did not turn into a socket.

      A partial adoption used to abandon them — the failing descriptor, every one
      after it, and every socket already built from the ones before. Nothing else
      reclaims those: the listeners never reached the Server's registry, so the
      Close on Start's error path had nothing to close.
    name: closeFiles
    params: files []*os.File
  - doc: |-
      listenersFromFiles turns adopted descriptors into stream listeners, releasing
      every one of them if any fails.
    name: listenersFromFiles
    params: name string, files []*os.File
    results: listeners []stdnet.Listener, err error
  - doc: closeListeners releases stream listeners built before an adoption failed.
    name: closeListeners
    params: listeners []stdnet.Listener
  - doc: closePacketConns releases datagram sockets built before an adoption failed.
    name: closePacketConns
    params: conns []stdnet.PacketConn
  - doc: |-
      packetConnsFromFiles turns adopted descriptors into datagram sockets,
      releasing every one of them if any fails.
    name: packetConnsFromFiles
    params: name string, files []*os.File
    results: conns []stdnet.PacketConn, err error
  - doc: |-
      newSlots allocates a read batch sized for the group.

      Each buffer is ONE BYTE past the group's ceiling, and that probe byte is what
      makes an oversized datagram detectable at all. The kernel copies as much as
      the buffer holds and discards the remainder, so a buffer sized exactly at the
      ceiling cannot tell a datagram that just fits from one that was cut down to
      fit — both report the same length. Reading one byte further makes the two
      distinguishable, which is the same reason the outbound body ceiling reads one
      byte past its own limit.
    name: newSlots
    params: count, size int
    results: "[]datagram"
  - doc: tighterBudget returns the smaller of two budgets, treating zero as unbounded.
    name: tighterBudget
    params: a, b time.Duration
    results: time.Duration
  - doc: |-
      hijackedTracker returns the tracker under c's socket when a handler has
      taken that socket over, or nil — when nothing was hijacked, or the group
      does not track closes.
    name: hijackedTracker
    params: c corenet.Conn
    results: "*trackedConn"
  - doc: |-
      newDatagramSource returns the batched reader when the socket exposes a raw
      descriptor, and the portable one otherwise. With gro, the batched reader
      switches UDP_GRO on, which only it can read: it alone parses the segment size
      out of each message and splits it (ADR 0192).

      The type assertion is the honest guard: recvmmsg needs a real file
      descriptor, and a caller can legitimately hand us a PacketConn that has none
      — a test double, or a wrapper. Falling back keeps such a socket working
      instead of failing at the first read.
    name: newDatagramSource
    params: pc stdnet.PacketConn, gro bool
    results: datagramSource
  - doc: |-
      newDatagramSink returns the sink a socket's replies leave through: at once,
      one WriteTo each, unless batched — BatchReplies —, then per batch: the
      sendmmsg and GSO sink when the socket is UDP and exposes a raw descriptor, the
      queued one otherwise. onGSOOff is called once the device refuses GSO for the
      socket.
    name: newDatagramSink
    params: pc stdnet.PacketConn, batched bool, counters *datagramCounters, onGSOOff func()
    results: datagramSink
  - doc: |-
      batchAvailable reports whether the platform can read several datagrams per
      syscall. It feeds the degradation reported by State.
    name: batchAvailable
    results: bool
  - doc: |-
      platformLacks reports whether this platform has no socket for a family the
      engine serves everywhere else. Off Windows the answer is left to the kernel:
      a family it refuses fails the bind and says why, as it always has.
    name: platformLacks
    params: _ string
    results: bool
  - doc: boundHandshake negotiates TLS under a deadline and then clears it.
    name: boundHandshake
    params: ctx context.Context, c corenet.Conn, timeouts corenet.TimeoutsValue
    results: error
  - doc: handshakeBudget returns how long the negotiation may take.
    name: handshakeBudget
    params: timeouts corenet.TimeoutsValue
    results: time.Duration
  - doc: |-
      readinessOf is ready for a server serving with no stalled loop group: not
      before Start has bound everything, not once the drain began, and not while a
      loop group accepts nothing. A degraded server is ready: it serves.
    name: readinessOf
    params: st corenet.StateValue
    results: error
  - doc: newHTTPAdapter wraps an http.Handler as a ConnHandler.
    name: newHTTPAdapter
    params: h http.Handler
    results: "*httpAdapter"
  - doc: |-
      markHijacked records that a pooled connection is no longer the engine's to
      close.

      A hijacked socket has left the HTTP lifecycle entirely: net/http stops
      tracking it, and the handler that took it over speaks its own protocol on it
      for as long as it likes. The engine must therefore stop closing it on the way
      out, exactly as net/http stops closing and waiting for it — see
      http.Server.Shutdown's own documented carve-out for WebSockets.

      It stops being the engine's to close, not the ceiling's to count: under
      MaxConns the flag set here is what makes admit hand the connection's slot to
      the socket, which returns it when it closes (see trackedConn).
    name: markHijacked
    params: c corenet.Conn
  - doc: |-
      rawSocket returns the underlying socket behind a pooled connection.

      net/http must receive the concrete connection — a *tls.Conn on an HTTPS
      listener — because it type-asserts on it to populate Request.TLS. Handing it
      our pooled wrapper would make every HTTPS request look like plaintext.
    name: rawSocket
    params: c corenet.Conn
    results: stdnet.Conn
  - doc: |-
      idleOrRead resolves http.Server.IdleTimeout: the idle budget when it was
      set, the read budget otherwise — the fallback net/http applied itself while
      the adapter still set ReadTimeout.
    name: idleOrRead
    params: idle, read time.Duration
    results: time.Duration
  - doc: newChanListener builds a bridge listener for the given address.
    name: newChanListener
    params: addr stdnet.Addr
    results: "*chanListener"
  - doc: |-
      perReadBody gives every request body a deadline per read: the group's
      ReadTimeout, refreshed before each read, as the stream path's own conn
      refreshes it.

      http.Server.ReadTimeout — which the adapter used to set from the same
      option — is a budget for the WHOLE request, headers and body together: a
      peer sending a 20-byte body two bytes every 100 ms, every read well inside
      a 500 ms bound, was cut off after the eighth byte (#454), against the
      TimeoutsValue contract ("every field is a PER-OPERATION bound, refreshed
      each time"). The header phase keeps its own bound, http.Server's
      ReadHeaderTimeout, which falls back to the read budget; the body is bounded
      here, read by read; and the time a handler spends between two reads is its
      own, as it is on a stream connection.

      A zero read budget leaves the body unbounded, as before, and installs
      nothing.
    name: perReadBody
    params: next http.Handler, read time.Duration
    results: http.Handler
  - doc: |-
      setKernelLen assigns n to a kernel length field.

      The length fields of syscall.Iovec and syscall.Msghdr are sized after the
      C `size_t`, so their Go type follows the word size: uint64 on 64-bit Linux
      (amd64, arm64, riscv64, …) and uint32 on 32-bit (386, arm, mips, …). A
      literal conversion therefore compiles on one class of architecture and fails
      on the other — the cross-build for linux/386 and linux/arm caught exactly
      that.

      The type parameter is inferred from the field being written, so one call
      site is correct on every architecture without a build tag per word size and
      without golang.org/x/sys, which ADR 0016 and ADR 0018 ban.

      The caller passes an int that the kernel will treat as a size. Values here
      are buffer lengths and small counts, both far below the 32-bit ceiling, so
      the conversion cannot truncate in practice; the ceiling is asserted in the
      tests rather than left to trust.
    name: setKernelLen
    params: dst *T, n int
    typeParams: T ~uint32 | ~uint64
  - doc: |-
      groupDeclErr returns the first declaration error recorded on a group, or the
      first option a group cannot honour, in declaration order, or nil when every
      group was declared cleanly. It runs before anything is bound.
    name: groupDeclErr
    params: groups []*StreamGroup
    results: error
  - doc: |-
      batchDegradation reports whether batched reading was asked for and is
      unavailable, and why. A silent fallback is indistinguishable from a working
      one, so it is surfaced through State rather than logged once at startup.
    name: batchDegradation
    params: limits corenet.LimitsValue
    results: degraded bool, reason string
  - doc: |-
      acceptDelay returns the wait after the failures-th consecutive failed Accept:
      5 ms, doubling, held at 1 s — the curve net/http's Serve uses, drawn from the
      SDK's one published backoff (ADR 0103).
    name: acceptDelay
    params: failures int
    results: time.Duration
  - doc: |-
      recoverHandler swallows a handler panic so it cannot unwind past the
      connection that caused it.
    name: recoverHandler
  - doc: |-
      shardable reports whether an address can carry several listeners.

      A Unix socket cannot: SO_REUSEPORT is an IP-socket option, and a second bind
      on the same path fails outright. Sharding a Unix listener is therefore not a
      degradation to report but a request that never made sense.
    name: shardable
    params: network string
    results: bool
  - doc: |-
      resolveShards returns how many listeners to open on one address, and why it
      may differ from what the caller asked for.

      Zero means "auto": one listener per core where the platform can shard, which
      is the point at which accept contention stops being the bottleneck. A count
      above one on a platform or family that cannot shard degrades to a single
      listener — reported, never silent.
    name: resolveShards
    params: requested int, network string
    results: count int, degraded bool, reason string
  - doc: |-
      shardsFor is resolveShards with the platform's SO_REUSEPORT answer passed
      in, so the branch only Windows takes in production is exercised by the
      suite on every OS — it is where the self-contradicting report lived, and a
      branch one platform alone reaches is a branch one lane alone can check.
    name: shardsFor
    params: requested int, network string, reusePort bool
    results: count int, degraded bool, reason string
  - doc: |-
      reusePortControl enables SO_REUSEPORT before the socket is bound.

      The option MUST be set before bind, which is precisely what net.ListenConfig's
      Control hook exists for; setting it afterwards has no effect.
      The network and address parameters are part of net.ListenConfig.Control's
      signature. They are read only to keep the intent explicit: the option applies
      identically whatever address is about to be bound, so neither is consulted.
    name: reusePortControl
    params: network, address string, rawConn syscall.RawConn
    results: error
  - doc: |-
      listen binds one address, wrapping it in TLS when the group carries an
      identity. TLS is applied here rather than inside the accept loop so the
      handshake is driven by the connection's own goroutine, which is what keeps a
      slow or hostile peer from stalling the accept path for everyone else.

      trackCloses hands out sockets that report their own Close (see trackedConn),
      for a group whose ceiling must keep counting a connection a handler took
      over.
    name: listen
    params: ctx context.Context, addr corenet.AddressValue, id corenet.IdentityValue, sharded, trackCloses bool
    results: ln stdnet.Listener, err error
  - doc: |-
      familyUnavailable refuses a family the engine serves but this platform has
      no socket for, before the OS is asked — or returns nil.

      The refusal is the SDK's uniform UNSUPPORTED_PLATFORM (ADR 0018 §(a)), not
      LISTEN_FAILED: a failed bind is something an operator can fix — a port in
      use, a permission, a path — and no address would ever make this one bind.
      The family and the platform travel as fields, so the log line says which.
    name: familyUnavailable
    params: addr corenet.AddressValue
    results: error
  - doc: |-
      layered puts a group's layers over a raw stream listener: the close tracker
      when the group has a ceiling to keep counting, then TLS when it carries an
      identity. It is the ONE place that decides them, for a socket this process
      bound and for one a supervisor handed over alike.

      The adopted path used to add the tracker and never TLS, so a group with an
      identity served an inherited socket in plaintext and reported no error —
      the supervisor passes a raw socket, and TLS is this process's layer to add.
    name: layered
    params: raw stdnet.Listener, id corenet.IdentityValue, trackCloses bool
    results: stdnet.Listener
  - doc: |-
      loopLanes is how many lanes a loop group runs on every backend: Loops,
      zero meaning one (R8).
    name: loopLanes
    params: v corenet.LoopValue
    results: int
  - doc: |-
      buildLoopChain wraps h in mws, outermost first, once at Start, and checks
      the chain twice: every layer is a corenet.LoopLayered whose Next is the
      handler it was given, and every callback sent through the same middlewares
      built over a probe reaches the probe. Either failure is
      LoopMiddlewareInvalid, naming the group and the callback — "Next" for the
      first check. With no middleware the chain is h.
    name: buildLoopChain
    params: group string, h corenet.LoopHandler, mws []corenet.Middleware[corenet.LoopHandler]
    results: corenet.LoopHandler, error
  - doc: |-
      wrapLoop applies mws to h, outermost first, and reports whether every
      layer is a corenet.LoopLayered whose Next is what it wrapped.
    name: wrapLoop
    params: h corenet.LoopHandler, mws []corenet.Middleware[corenet.LoopHandler]
    results: corenet.LoopHandler, bool
  - doc: |-
      sameHandler reports whether a and b are the same handler. Two values of a
      type that cannot be compared are taken as the same, rather than compared
      into a panic.
    name: sameHandler
    params: a, b corenet.LoopHandler
    results: bool
  - doc: |-
      chainHonours reports whether a layer of chain, or its handler, honours the
      option of kind k: the chain merges what each of them honours.
    name: chainHonours
    params: chain corenet.LoopHandler, k corenet.OptionKind
    results: bool
  - doc: invalidLayer is LoopMiddlewareInvalid naming the group and the callback.
    name: invalidLayer
    params: group, callback string
    results: error
  - doc: |-
      sendProbe sends each of the eight callbacks through probed once, with a
      LoopIO that refuses everything and the zero reference, which no
      connection holds.
    name: sendProbe
    params: probed corenet.LoopHandler
  - doc: |-
      startLoopEngine starts a loop group on Linux on the backend plan names —
      min(code, environment), ADR 0188 —: the leaf's native backends, handed
      duplicated descriptors of the listeners server bound (ADR 0186 §D3), or the
      portable backend when the plan says so or, when the code asked for auto, when
      no native backend starts — reported, never silent. A backend the plan rules
      out is never probed.

      IFACE-OPAQUE: which engine runs is decided here at Start — the leaf's
      *loop.Group or the portable backend — and server only drives the lifecycle
      half both share, so the caller holds the interface and never the type.
    name: startLoopEngine
    params: group *StreamGroup, lns []stdnet.Listener, plan loopPlan
    results: loopEngine, error
  - doc: |-
      probeNoDelay reads TCP_NODELAY back from every listener the leaf set it on,
      whose accepted sockets inherit it: on when all carry it, absent with the
      first refusal otherwise, disabled when the operator switched it off.
    name: probeNoDelay
    params: lns []stdnet.Listener, plan loopPlan
    results: corenet.CapabilityValue
  - doc: noDelayOf reads TCP_NODELAY from ln's socket.
    name: noDelayOf
    params: ln stdnet.Listener
    results: int, error
  - doc: |-
      dupListeners duplicates each listener's descriptor, close-on-exec and
      non-blocking: the one hand-off type the leaf takes.
    name: dupListeners
    params: lns []stdnet.Listener
    results: "[]loop.Listener, error"
  - doc: closeHandoff closes descriptors duplicated before a failure.
    name: closeHandoff
    params: ls []loop.Listener
  - doc: |-
      loopHonours reports the options the loop engine honours itself (ADR 0186
      §D4, ADR 0187): IdleTimeout, MaxConns and Adopt, and Plaintext, Name and
      Engine, which every engine honours. Listen and Loop are not options a loop
      judges; the drain is the server's.
    name: loopHonours
    params: k corenet.OptionKind
    results: bool
  - doc: loopIdle is the group's IdleTimeout as the loop takes it.
    name: loopIdle
    params: group *StreamGroup
    results: time.Duration
  - doc: |-
      startPortable starts the portable backend on lns, with one lane per loop
      of the group's LoopValue (zero meaning one). degraded names why a Linux
      auto group fell back to it, empty otherwise.

      Goroutine lifecycle: it launches one acceptor per listener, which returns
      once server closes that listener or the backend stops, and one handler
      goroutine per lane, which returns once the backend stopped or its lane
      drained to its last connection, closing the lane's done as it does.
    name: startPortable
    params: group *StreamGroup, lns []stdnet.Listener, degraded string, plan loopPlan
    results: portableEngine
  - doc: |-
      portableNoDelay is the portable backend's tcp-nodelay row: the netpoller
      sets TCP_NODELAY on every connection it accepts, cleared once the operator
      switched it off.
    name: portableNoDelay
    params: plan loopPlan
    results: corenet.CapabilityValue
  - doc: orDefaultInt returns v, or def when v is zero or less.
    name: orDefaultInt
    params: v, def int
    results: int
  - doc: clampUsed treats an OnData return outside 0 to n as n.
    name: clampUsed
    params: v, n int
    results: int
  - doc: fillMark fills b with recycledMark.
    name: fillMark
    params: b []byte
  - doc: |-
      tlsCodecHonours reports the kinds a TLS codec group honours beyond the
      loop's own: TLS and its handshake bound.
    name: tlsCodecHonours
    params: k corenet.OptionKind
    results: bool
  - doc: |-
      handshake negotiates c, a TLS connection, within d, and reports whether it
      completed: a failed or stalled negotiation closes c.
    name: handshake
    params: c stdnet.Conn, d time.Duration
    results: bool
  - doc: newMultiReader builds a batched reader over pc.
    name: newMultiReader
    params: pc stdnet.PacketConn, sc rawConnProvider
    results: reader *multiReader, err error
  - doc: |-
      groSegment returns the segment size a UDP_GRO control message reports in
      control, or zero when it carries none: the message is then one datagram.
    name: groSegment
    params: control []byte
    results: int
  - doc: |-
      gsoSegments is how many datagrams of size bytes one GSO send of a socket of
      family may carry: the kernel's udpMaxSegments, and the 16-bit IP length the
      send is built as — 54 of the L3 load's datagrams on IPv4 and on IPv6.
    name: gsoSegments
    params: family, size int
    results: int
  - doc: |-
      maxSegment is the largest datagram a socket of family coalesces: one that
      fits an Ethernet frame with its headers.
    name: maxSegment
    params: family int
    results: int
  - doc: |-
      newMultiWriter builds a batched sink over pc. It fails on a socket that is
      neither IPv4 nor IPv6 UDP — a Unix datagram socket has no GSO, and its peer
      no sockaddr this sink writes —, which the caller serves with portableSink.
    name: newMultiWriter
    params: pc stdnet.PacketConn, sc rawConnProvider, counters *datagramCounters, onGSOOff func()
    results: "*multiWriter, error"
  - doc: |-
      sendmmsg is the sendmmsg(2) the sink drives: how many of headers left, or the
      errno of the first that did not.
    name: sendmmsg
    params: fd uintptr, headers []mmsghdr
    results: sent int, errno syscall.Errno
  - doc: |-
      readOperator reads both variables through lookup and applies R5 (ADR 0187
      §D8): an empty value is unset, an unknown token caps the engine at portable,
      and nothing the environment says raises a group above its code's choice.
    name: readOperator
    params: lookup lookupFunc
    results: operatorEnv
  - doc: lookupCapability finds a token in the registry, exactly as spelled.
    name: lookupCapability
    params: token string
    results: capabilityEntry, bool
  - name: WithDrainTimeout
    params: d time.Duration
    results: Option
  - name: Loop
    params: v corenet.LoopValue
    results: GroupOption
  - name: Listen
    params: network, addr string
    results: GroupOption
  - name: TLS
    params: id corenet.IdentityValue
    results: GroupOption
  - name: ReadTimeout
    params: d time.Duration
    results: GroupOption
  - name: WriteTimeout
    params: d time.Duration
    results: GroupOption
  - name: IdleTimeout
    params: d time.Duration
    results: GroupOption
  - name: ReadHeaderTimeout
    params: d time.Duration
    results: GroupOption
  - name: MaxHeaderBytes
    params: n int
    results: GroupOption
  - name: HandshakeTimeout
    params: d time.Duration
    results: GroupOption
  - name: ReadBufferSize
    params: n int
    results: GroupOption
  - name: MaxPacketSize
    params: n int
    results: GroupOption
  - name: BatchSize
    params: n int
    results: GroupOption
  - name: BatchReplies
    results: GroupOption
  - name: Shards
    params: n int
    results: GroupOption
  - name: MaxConns
    params: n int
    results: GroupOption
  - name: Adopt
    params: names ...string
    results: GroupOption
  - name: Plaintext
    results: GroupOption
  - name: Name
    params: name string
    results: GroupOption
  - name: Engine
    params: e corenet.EngineValue
    results: GroupOption
  - doc: listenPacket binds one datagram socket.
    name: listenPacket
    params: ctx context.Context, addr corenet.AddressValue
    results: pc stdnet.PacketConn, err error
  - doc: packetSize returns the group's datagram ceiling.
    name: packetSize
    params: limits corenet.LimitsValue
    results: int
  - doc: batchSize returns how many datagrams one read should attempt to collect.
    name: batchSize
    params: limits corenet.LimitsValue
    results: int
  - doc: |-
      readPlatform names what the server runs on: the GOOS, the GOARCH, the
      kernel's release as the platform reports it (kernelRelease, per GOOS) and
      the toolchain. It is read once, by New.
    name: readPlatform
    results: corenet.PlatformValue
  - doc: |-
      kernelRelease is uname(2)'s release, "6.8.0-45-generic" say; empty when the
      call fails.
    name: kernelRelease
    results: string
  - doc: newQueuedSink builds a queued sink over pc.
    name: newQueuedSink
    params: pc stdnet.PacketConn, counters *datagramCounters
    results: "*queuedSink"
  - doc: |-
      reusePortSupported reports whether this platform can bind several listeners
      to one address.
    name: reusePortSupported
    results: bool
  - doc: setReusePort enables SO_REUSEPORT on a socket about to be bound.
    name: setReusePort
    params: fd uintptr
    results: error
  - doc: newPooledConn mints an empty connection wrapper for the recycler.
    name: newPooledConn
    results: "*conn"
  - name: New
    params: opts ...Option
    results: "*Server"
  - doc: |-
      newServer builds a server whose operator's variables are read through
      lookup: os.LookupEnv for New, a map for a test.
    name: newServer
    params: lookup lookupFunc, opts ...Option
    results: "*Server"
  - doc: |-
      packetHonours reports whether a datagram group applies the option of kind
      k: its ceilings, its batched replies (ADR 0192), adoption, and the three
      every engine honours. Engine and Plaintext are judged by engineRefusal.
    name: packetHonours
    params: k corenet.OptionKind
    results: bool
  - doc: |-
      defaultName names a group declared with no name, unless a later Name
      option names it: it is a declaration's own, recording no kind.
    name: defaultName
    params: name string
    results: GroupOption
  - doc: |-
      fits reports whether engine want may serve a handler under Engine e: e
      names it, or e is auto and the handler runs on no other.
    name: fits
    params: e, want corenet.EngineValue, other bool
    results: bool
  - doc: unsupported is HandlerUnsupported for a type entry serves on no engine.
    name: unsupported
    params: group, entry string, h any
    results: error
  - doc: isHTTPHandler reports whether h is a handler HTTP serves.
    name: isHTTPHandler
    params: h any
    results: bool
  - doc: |-
      isNil reports whether h is nil, or a typed nil a method call would
      dereference.
    name: isNil
    params: h any
    results: bool
  - doc: typeName is h's dynamic type, for an error field.
    name: typeName
    params: h any
    results: string
  - doc: |-
      sockaddrToAddr converts a kernel sockaddr into a net.Addr.

      recvmmsg reports the sender as a raw sockaddr, so the batched path has to do
      what ReadFrom does internally. Only the families the datagram engine binds are
      decoded; anything else yields nil rather than a wrong address, because a
      handler replying to a misdecoded address is worse than one that sees none.
    name: sockaddrToAddr
    params: raw *syscall.RawSockaddrAny
    results: stdnet.Addr
  - doc: inet4Addr decodes an IPv4 sockaddr.
    name: inet4Addr
    params: raw *syscall.RawSockaddrAny
    results: stdnet.Addr
  - doc: inet6Addr decodes an IPv6 sockaddr.
    name: inet6Addr
    params: raw *syscall.RawSockaddrAny
    results: stdnet.Addr
  - doc: unixAddr decodes a Unix-domain sockaddr.
    name: unixAddr
    params: raw *syscall.RawSockaddrAny
    results: stdnet.Addr
  - doc: hostPort converts a network-byte-order port to host order.
    name: hostPort
    params: port uint16
    results: int
  - doc: |-
      zoneOf resolves an IPv6 scope identifier to an interface name.

      It reports whether a zone was found rather than leaning on the empty string,
      because "no zone" and "an index we could not resolve" are different facts even
      though both end up as an empty net.UDPAddr.Zone.
    name: zoneOf
    params: scope uint32
    results: zone string, ok bool
  - doc: |-
      groupStalled reports whether every ring of a loop group is drained: a
      native backend whose watchdog gave up on each of its rings. The portable
      backend has no ring and never stalls.
    name: groupStalled
    params: st corenet.LoopStateValue
    results: bool
  - doc: stallError is LoopGroupStalled naming group.
    name: stallError
    params: group string
    results: error
  - doc: |-
      ringFaults is one fault per drained ring of lp, or one stall fault when every
      ring is drained (R1).
    name: ringFaults
    params: lp corenet.LoopStateValue
    results: "[]corenet.FaultValue"
  - doc: newConnLimiter returns the group's ceiling, or nil when it has none.
    name: newConnLimiter
    params: limits corenet.LimitsValue
    results: "*connLimiter"
  - doc: |-
      swallowErr intentionally discards a non-actionable error, recording the
      discard so the error audit treats it as deliberate rather than dropped.

      It is used on three paths where there is genuinely nothing to report:
      closing a socket whose handler has already finished, closing a listener
      during shutdown that a concurrent Close may already have closed, and setting
      a deadline on a connection that is already gone — in which case the handler's
      first read reports the real problem far more usefully.
    name: swallowErr
    params: err error
  - doc: |-
      datagramTruncated reports whether a read failed because the datagram did not
      fit the buffer it was read into. Off Windows no read fails for that reason:
      recvfrom truncates and returns the length it copied, and the probe byte past
      the ceiling is what tells dispatch the datagram was oversized.
    name: datagramTruncated
    params: _ error
    results: bool
imports:
  atomic: sync/atomic
  bits: math/bits
  buffer: github.com/kitsunium/sdk/internal/kernel/concur/buffer
  clock: github.com/kitsunium/sdk/internal/kernel/clock
  cmp: cmp
  context: context
  corehealth: github.com/kitsunium/sdk/internal/core/app/health
  corenet: github.com/kitsunium/sdk/internal/core/net
  coreproc: github.com/kitsunium/sdk/internal/core/proc
  errors: errors
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  http: net/http
  http1: github.com/kitsunium/sdk/internal/service/net/http1
  io: io
  kbackoff: github.com/kitsunium/sdk/internal/kernel/backoff
  loop: github.com/kitsunium/sdk/internal/service/net/loop
  maps: maps
  os: os
  recycler: github.com/kitsunium/sdk/internal/kernel/concur/recycler
  reflect: reflect
  runtime: runtime
  sdlisten: github.com/kitsunium/sdk/internal/service/proc/systemd/listen
  slices: slices
  stdnet: net
  strconv: strconv
