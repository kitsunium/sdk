functions:
  - doc: |-
      resolveBounds maps every zero bound to its default and refuses one outside
      its documented range.
    name: resolveBounds
    params: cfg VerifierConfig
    results: bounds boundsValue, err error
  - doc: |-
      resolveBound maps zero to fallback and refuses anything outside [low, high],
      naming knob in the refusal.
    name: resolveBound
    params: configured, fallback, low, high int, knob string
    results: value int, err error
  - doc: |-
      readClaims holds raw to every rule a claims object answers to, and indexes
      it into idx. It is the ONE refusal set: Verify, every format and
      VerifyInto go through it, so no path accepts what another refuses.

      The refusals happen in cost order, cheapest first, and in the legacy
      reader's order, so a token refused for two reasons is refused for the same
      one: text that is not UTF-8, nesting depth (two linear scans), then one
      strict RFC 8259 pass that refuses malformed text, a duplicate or escaped
      member name, and a member count past the cap; then the registered claims,
      then the private names.

      UTF-8 is checked because a reader that repairs invalid bytes — encoding/json
      replaces each with U+FFFD — would verify "a\xff" and "a\xfe" from a careless
      or hostile issuer as one subject. RFC 8259 §8.1 makes JSON exchanged between
      systems UTF-8, and RFC 8725 §3.7 asks the reader to hold the writer to it.
    name: readClaims
    params: raw []byte, maxDepth int, shape claimShape, idx *objectIndex
    results: reg registeredValue, err error
  - doc: |-
      readRegistered locates and judges the seven registered claims.

      A registered claim present as JSON null is no value of its type, and a
      lenient reader would decode it as one anyway — "" for iss, sub and jti, an
      audience of [""] for aud, the Unix epoch for exp, nbf and iat — so a signed
      token could say "null" and be read as absent, empty or 1970.
    name: readRegistered
    params: raw []byte, idx *objectIndex, shape claimShape
    results: reg registeredValue, err error
  - doc: readInstants decodes exp, nbf and iat onto reg.
    name: readInstants
    params: raw []byte, idx *objectIndex, reg registeredValue, shape claimShape
    results: registeredValue, error
  - doc: |-
      readInstant decodes the registered time claim at member index at under
      shape, treating absence (at < 0) as the zero Time.
    name: readInstant
    params: raw []byte, idx *objectIndex, at int, name string, shape claimShape
    results: instant time.Time, err error
  - doc: |-
      decodeTimeIn is shape.decodeTime, dispatched over the closed set of shapes.

      The switch is the point: a call through the interface makes its argument
      escape, which would move the claims a VerifyInto decodes on its stack onto
      the heap — one allocation per token. A concrete call keeps them where they
      are.
    name: decodeTimeIn
    params: shape claimShape, raw []byte
    results: time.Time, error
  - doc: |-
      checkAudienceIn is shape.checkAudience, dispatched as decodeTimeIn is and
      for the same reason.
    name: checkAudienceIn
    params: shape claimShape, raw []byte
    results: error
  - doc: |-
      locateRegistered maps each registered slot to its member index, -1 when
      the claim is absent. Names are unique, so each slot is set at most once.
    name: locateRegistered
    params: raw []byte, idx *objectIndex
    results: at [registeredSlots]int
  - doc: registeredSlot returns the slot of a registered name, or -1.
    name: registeredSlot
    params: name []byte
    results: int
  - doc: |-
      checkPrivateMembers holds the private members to the rules
      ClaimsValue.WithPrivateRaw enforces — no empty name, at most
      MaxPrivateClaims of them — in member order.
    name: checkPrivateMembers
    params: raw []byte, idx *objectIndex
    results: error
  - doc: |-
      decodeClaims turns a raw claims object into a ClaimsValue under shape: the
      one refusal set of readClaims, then the value, built from the index.
    name: decodeClaims
    params: raw []byte, maxDepth int, shape claimShape
    results: claims coretoken.ClaimsValue, err error
  - doc: |-
      attachPrivate copies every non-registered member onto base as a raw private
      claim, in member order — the core value stores them keyed, and PrivateNames
      sorts on the way out. The bytes are the value exactly as the issuer signed it.
    name: attachPrivate
    params: base coretoken.ClaimsValue, raw []byte, idx *objectIndex
    results: claims coretoken.ClaimsValue, err error
  - doc: memberValue returns the value of member at, nil when absent.
    name: memberValue
    params: raw []byte, idx *objectIndex, at int
    results: "[]byte"
  - doc: memberText decodes the string member at, "" when absent.
    name: memberText
    params: raw []byte, idx *objectIndex, at int
    results: string
  - doc: |-
      encodeClaims renders claims under shape. The member map marshals with sorted
      keys, so the same claim set always produces the same bytes — which is what
      makes an issued token reproducible in a test.

      Every string it writes must be valid UTF-8, and a claim set carrying one that
      is not is refused rather than minted: see checkClaimText for why nothing
      further down the line would refuse it instead.
    name: encodeClaims
    params: claims coretoken.ClaimsValue, shape claimShape
    results: raw []byte, err error
  - doc: |-
      checkClaimText refuses a claim set whose registered string claims are not
      valid UTF-8.

      JSON text is UTF-8 (RFC 8259 §8.1, RFC 8725 §3.7), and on the ISSUE path
      nothing else would say so. quoteJSONString passes every byte at or above 0x20
      through by design, and a reader that does not refuse the result repairs it
      instead: encoding/json — this package's own verifier included — decodes each
      invalid byte to U+FFFD, so a "sub" of "a\xff" and one of "a\xfe" are minted
      as two tokens and verified as ONE subject. A strict JOSE reader elsewhere
      rejects both. Nothing is repaired here either: which bytes the caller meant
      is not something this package can know.
    name: checkClaimText
    params: claims coretoken.ClaimsValue, audience []string
    results: error
  - doc: |-
      putPrivate stores every private claim as the exact bytes it arrived as,
      refusing one whose name or bytes are not valid UTF-8.

      Both halves need the check, and for opposite reasons: json.Marshal REWRITES a
      map key that is not UTF-8 — each bad byte becomes U+FFFD, so two names the
      caller kept apart would be minted as one — while it passes a RawMessage's
      bytes through untouched, so a bad value would reach the wire as written.
    name: putPrivate
    params: members map[string]json.RawMessage, claims coretoken.ClaimsValue
    results: error
  - doc: |-
      textNotUTF8 returns the IssueFailed verdict for a claim whose text JSON
      cannot carry. claim is a fixed description — never a value, never a name the
      caller chose.
    name: textNotUTF8
    params: claim string
    results: error
  - doc: putString stores a registered string claim unless it is empty.
    name: putString
    params: members map[string]json.RawMessage, name, value string
  - doc: putTime stores a registered time claim unless it is the zero Time.
    name: putTime
    params: members map[string]json.RawMessage, name string, instant time.Time, shape claimShape
  - doc: |-
      malformed returns the Malformed verdict carrying a structural detail.

      It deliberately does NOT attach the stdlib parse error as a cause, which is
      the opposite of this repository's usual wrapping habit. The habit exists so
      `errors.Is(err, originalCause)` keeps working — but here the "original
      cause" was produced by parsing ATTACKER-CONTROLLED bytes, and stdlib parse
      errors quote what they choked on: time.ParseError echoes the timestamp,
      json.SyntaxError gives an offset into the payload, base64.CorruptInputError
      a position in the token. Keeping any of them reachable would put token
      content one errors.Unwrap away from every log line that walks a chain.

      The second effect is that the verdict keeps the sentinel's own HTTP status
      and exit code: Wrap's origin-wins path inherits both, while the
      stdlib-cause path would silently fall back to 500 / EX_SOFTWARE.

      detail is a fixed string chosen at the call site — never a value out of the
      token.
    name: malformed
    params: detail string
    results: error
  - doc: |-
      splitCompact splits tok on '.' into at most maxSegments parts.

      It refuses a token longer than maxLen BEFORE scanning, so the scan itself is
      bounded by a number the caller configured rather than one the attacker sent,
      and it refuses a token with more than maxSegments parts the moment the extra
      separator is seen rather than after counting them all.
    name: splitCompact
    params: tok string, maxLen int
    results: seg segmentsValue, err error
  - doc: |-
      decodeSegment decodes one unpadded base64url segment, refusing anything
      whose decoded form would exceed maxLen before allocating the buffer.
    name: decodeSegment
    params: segment string, maxLen int
    results: raw []byte, err error
  - doc: |-
      splitCompactBytes is splitCompact over a token held as bytes — the form a
      caller verifying straight out of a receive buffer has. It refuses exactly
      what splitCompact refuses, in the same order, and its parts are views of
      tok: the split allocates nothing.
    name: splitCompactBytes
    params: tok []byte, maxLen int
    results: seg segmentsBytes, err error
  - doc: |-
      decodeSegmentInto is decodeSegment into the caller's buffer: the same
      bounds and the same strict alphabet, refused in the same order. dst is used
      when the decoded segment fits it, so a caller handing a stack array decodes
      without allocating; a larger segment — still inside maxLen — gets a buffer
      of its own.
    name: decodeSegmentInto
    params: dst, segment []byte, maxLen int
    results: raw []byte, err error
  - doc: |-
      checkJSONDepth refuses raw when its bracket nesting exceeds maxDepth.

      It runs BEFORE the scanner descends a level, because the cheapest place to
      refuse a payload of ten thousand open brackets is a linear scan with one
      integer of state — not a reader that has already recursed ten thousand
      times. It also fixes which verdict a too-deep payload gets: TooDeep, before
      anything the scan would refuse later in the bytes.
      The scan is string-aware so a '{' inside a claim value is data, not depth.
    name: checkJSONDepth
    params: raw []byte, maxDepth int
    results: error
  - doc: |-
      preAuthEncode implements PASETO's PAE (pre-authentication encoding): the
      piece count as LE64, then each piece's length as LE64 followed by the piece.

      It is what makes a PASETO signature cover the version header and the footer
      as well as the payload, and it is injective — no two different piece lists
      encode to the same bytes — which is what stops a byte moving from the
      payload into the footer without changing the signature.
    name: preAuthEncode
    params: pieces ...[]byte
    results: "[]byte"
  - doc: |-
      appendLE64 appends n as eight little-endian bytes with the most significant
      bit cleared, as PASETO's LE64 specifies.
    name: appendLE64
    params: dst []byte, n uint64
    results: "[]byte"
  - doc: newHS256Verifier returns the HS256 verifier around binding and policy.
    name: newHS256Verifier
    params: binding hs256Binding, policy policyValue
    results: "*hs256Verifier"
  - doc: audienceContains reports whether an "aud" checkAudience accepted names want.
    name: audienceContains
    params: raw []byte, want string
    results: bool
  - doc: |-
      storeClaims copies an accepted claims object into dst: the registered
      claims decoded, and each private claim dst declares — decoded when it is a
      string, marked wrong-typed otherwise. Nothing is truncated: a claim that
      does not fit is ClaimsBufOverflow.
    name: storeClaims
    params: raw []byte, idx *objectIndex, reg *registeredValue, dst *coretoken.ClaimsBuf
    results: error
  - doc: storeText decodes lit through buf into dst's text claim.
    name: storeText
    params: dst *coretoken.ClaimsBuf, claim coretoken.TextClaim, buf, lit []byte
    results: error
  - doc: storeInstants copies the three registered instants into dst.
    name: storeInstants
    params: reg *registeredValue, dst *coretoken.ClaimsBuf
  - doc: storeAudience copies each "aud" member into dst.
    name: storeAudience
    params: raw, buf []byte, dst *coretoken.ClaimsBuf
    results: error
  - doc: storeMember decodes one audience member through buf and appends it.
    name: storeMember
    params: lit, buf []byte, dst *coretoken.ClaimsBuf
    results: error
  - doc: storePrivate copies each private member dst declares.
    name: storePrivate
    params: raw []byte, idx *objectIndex, buf []byte, dst *coretoken.ClaimsBuf
    results: error
  - doc: |-
      numericInteger reads raw, a number the scanner validated, when it is an
      integer of at most maxIntegerDigits digits; ok is false otherwise, and the
      caller takes the general path.
    name: numericInteger
    params: raw []byte
    results: value int64, ok bool
  - doc: numericDateOutOfRange returns the verdict for a NumericDate past the bound.
    name: numericDateOutOfRange
    results: error
  - doc: |-
      scanObject validates raw as exactly one JSON object and indexes its
      top-level members into idx.

      It is the one reader every claims object and every JOSE header goes through,
      so the refusal set is one set. A top-level member name carrying a backslash
      is refused with Malformed: an escape is a second spelling of a name, and
      "\u0065xp" read as "exp" is how a duplicate slips past a check made on the
      spelling. A repeated top-level name is refused with DuplicateMember the
      moment it is read (RFC 8725 §2.6). Past the member cap, the object is still
      read to its end, so malformed text is still Malformed, and is then refused
      with TooLarge; duplicates are not looked for past the cap, which is what
      bounds the cost of a hostile payload.
    name: scanObject
    params: raw []byte, maxDepth int, idx *objectIndex
    results: error
  - doc: |-
      escapeLen validates the escape at the start of esc and returns its length.
      A high surrogate must be followed at once by an escaped low one; a lone
      surrogate of either half is refused, where encoding/json would have
      replaced it with U+FFFD — two spellings of one string.
    name: escapeLen
    params: esc []byte
    results: n int, err error
  - doc: hexUnit reads the \uXXXX escape at the start of esc.
    name: hexUnit
    params: esc []byte
    results: unit rune, ok bool
  - doc: hexValue reads one hex digit, in either case.
    name: hexValue
    params: c byte
    results: digit rune, ok bool
  - doc: isDigit reports whether c is a decimal digit.
    name: isDigit
    params: c byte
    results: bool
  - doc: |-
      appendJSONString appends the decoded content of lit, a string literal the
      scanner already validated, quotes included.
    name: appendJSONString
    params: dst, lit []byte
    results: "[]byte"
  - doc: decodeEscape decodes the validated escape at the start of esc.
    name: decodeEscape
    params: esc []byte
    results: r rune, n int
  - doc: |-
      jsonStringEqual reports whether the validated string literal lit decodes to
      want, without decoding it anywhere: it compares as it reads, so a literal of
      any length is compared without a buffer and without an allocation. It is
      not constant-time; the strings it compares are a configured issuer or
      audience, never a secret.
    name: jsonStringEqual
    params: lit []byte, want string
    results: bool
  - doc: newArrayStrings starts a walk over the validated array arr.
    name: newArrayStrings
    params: arr []byte
    results: arrayStrings
  - doc: |-
      decodeText returns the decoded content of the validated string literal lit
      as a string. A literal without an escape is converted once; one with
      escapes is decoded into a stack buffer first.
    name: decodeText
    params: lit []byte
    results: string
  - doc: |-
      decodeTextInto decodes the validated string literal lit into dst, and
      reports how many octets it wrote. ok is false when the decoded text does not
      fit dst — which is never written past, never truncated into, and never
      grown.
    name: decodeTextInto
    params: dst, lit []byte
    results: n int, ok bool
  - doc: |-
      quoteJSONString renders s as a JSON string literal.

      Every value it renders today comes from the SDK's own configuration or from
      a claim this package already decoded — never straight off the wire. It
      escapes anyway, because a string concatenated into JSON is exactly the shape
      that stops being safe the day somebody makes one of its inputs dynamic.
    name: quoteJSONString
    params: s string
    results: string
  - doc: quoteJSONStrings renders values as a JSON array of string literals.
    name: quoteJSONStrings
    params: values []string
    results: string
  - doc: writeJSONStringByte appends one byte of string content in escaped form.
    name: writeJSONStringByte
    params: builder *strings.Builder, char byte
  - doc: hexDigit renders one nibble as a lowercase hex digit.
    name: hexDigit
    params: nibble byte
    results: byte
  - name: NewVerifierFromJWK
    params: key jwk.KeyValue, cfg VerifierConfig
    results: verifier coretoken.Verifier, err error
  - name: NewSetVerifier
    params: set jwk.Set, cfg VerifierConfig
    results: verifier coretoken.Verifier, err error
  - doc: |-
      selectable reports whether index holds at least one member a token could be
      verified against: indexed under a kid, and bound to an algorithm this package
      implements.

      It asks only whether such a member EXISTS. An unusable member stays in the
      index, and keeps counting against MaxKeyCandidates, whatever this returns —
      that is indexByKid's rule, and this function only reads the index it built.
    name: selectable
    params: index map[string][]boundKeyValue
    results: bool
  - doc: indexedCount reports how many members index holds across every kid.
    name: indexedCount
    params: index map[string][]boundKeyValue
    results: int
  - doc: |-
      unverifiableSet is the PolicyMisconfigured refusal for a JWK Set that no
      token could ever verify against.

      It is built from the sentinel's own code, reason, public message and exit
      code — so errors.Is and errs.HasCode both still match PolicyMisconfigured —
      rather than by wrapping the sentinel, because origin-wins would inherit the
      sentinel's generic Private, and the one thing worth telling an operator here
      is specific: a key published without a kid is a single key, and
      NewVerifierFromJWK is the constructor that verifies with one.
    name: unverifiableSet
    params: members, withKid int
    results: error
  - doc: |-
      indexByKid groups set's members by kid, deriving each member's binding once.

      A member the SDK verifies nothing with is INDEXED ANYWAY, as an unusable
      entry. Dropping it would silently widen MaxKeyCandidates: the bound counts
      the keys published under one kid, so a set whose kid names six keys — three
      of them P-384 — must still be refused as ambiguous rather than quietly
      resolved down to three. (Not RSA: a set carrying an RSA member never exists,
      because jwk.ParseSet refuses the whole document.) The per-token loop skips an unusable entry exactly
      as it used to skip a bind failure.
    name: indexByKid
    params: set jwk.Set
    results: map[string][]boundKeyValue
  - doc: bindJWK maps a JWK onto the verifying binding its own type and curve imply.
    name: bindJWK
    params: key jwk.KeyValue
    results: binding verifyingKey, err error
  - doc: bindOctJWK binds a symmetric JWK to HS256.
    name: bindOctJWK
    params: key jwk.KeyValue
    results: binding verifyingKey, err error
  - doc: bindECJWK binds a P-256 JWK to ES256.
    name: bindECJWK
    params: key jwk.KeyValue
    results: binding verifyingKey, err error
  - doc: bindOKPJWK binds an Ed25519 JWK to EdDSA.
    name: bindOKPJWK
    params: key jwk.KeyValue
    results: binding verifyingKey, err error
  - doc: |-
      checkJWKUsage honours the key's own advisory members: "use", "key_ops" and
      "alg". They are the publisher's statement about their key, and a relying
      party that ignores them is choosing to know less than it was told.
    name: checkJWKUsage
    params: key jwk.KeyValue
    results: error
  - doc: |-
      impliedAlg reports the JOSE algorithm name a key's type and curve imply.
      The second result is false when this package implements none for it, which
      is a different statement from "the empty algorithm" and keeps the caller
      from comparing a publisher's "alg" against nothing at all.
    name: impliedAlg
    params: key jwk.KeyValue
    results: alg string, known bool
  - doc: |-
      readJOSEHeader reads a decoded JOSE header object, under the same rules as a
      claims object: UTF-8, a depth bound, and the one strict scan that refuses
      malformed text and a duplicate or escaped member name (RFC 8725 §2.6).

      The view is returned by value: a view written through a pointer would make
      raw escape, and a VerifyInto decodes raw on its stack.
    name: readJOSEHeader
    params: raw []byte
    results: view headerView, err error
  - doc: |-
      headerMember returns the literal of the string member name, nil when it is
      absent or null — which a header has always read as absent — and Malformed
      when it is present as anything else.
    name: headerMember
    params: raw []byte, idx *objectIndex, name string
    results: lit []byte, err error
  - doc: |-
      parseJOSEHeader reads a decoded JOSE header object into the string form the
      set verifier selects a key with.
    name: parseJOSEHeader
    params: raw []byte
    results: header headerValue, err error
  - doc: |-
      headerText decodes a header member's literal, "" when it was absent or
      null. The spellings nearly every header carries come back as constants.
    name: headerText
    params: lit []byte
    results: string
  - doc: |-
      literalEqual reports whether a header member's literal decodes to want; an
      absent or null member decodes to "".
    name: literalEqual
    params: lit []byte, want string
    results: bool
  - doc: |-
      literalIsNone reports whether a header member's literal decodes to "none"
      in any capitalisation, folded as strings.EqualFold folds. No letter of
      "none" has a case partner outside ASCII, so every spelling of it decodes to
      four octets, and a longer literal is not one.
    name: literalIsNone
    params: lit []byte
    results: bool
  - doc: |-
      refuseUnsecured refuses an unsecured token — "alg": "none", in any case — by
      name. It needs no key, so a verifier that selects among several runs it
      before selecting, and the verdict never depends on which keys it holds.
    name: refuseUnsecured
    params: header headerValue
    results: error
  - doc: newJWSIssuer validates cfg and pre-renders the header.
    name: newJWSIssuer
    params: bound signingKey, cfg IssuerConfig
    results: issuer coretoken.Issuer, err error
  - doc: |-
      renderJOSEHeader builds the fixed header this issuer stamps on every token.

      It is rendered by hand rather than marshalled from a map: the members are
      known, the values are escaped, and a map marshal would re-encode identical
      bytes on every mint while sorting "alg" after "kid".
    name: renderJOSEHeader
    params: alg coretoken.Algorithm, cfg IssuerConfig
    results: string
  - doc: parseHeaderSegment decodes and reads the first segment of a compact token.
    name: parseHeaderSegment
    params: segment string
    results: header headerValue, err error
  - doc: newJWSVerifier validates cfg and returns the bound verifier.
    name: newJWSVerifier
    params: bound verifyingKey, cfg VerifierConfig
    results: verifier coretoken.Verifier, err error
  - name: NewHS256Issuer
    params: secret corecrypto.Key, cfg IssuerConfig
    results: issuer coretoken.Issuer, err error
  - name: NewES256Issuer
    params: priv *ecdsa.PrivateKey, cfg IssuerConfig
    results: issuer coretoken.Issuer, err error
  - name: NewEdDSAIssuer
    params: priv ed25519.PrivateKey, cfg IssuerConfig
    results: issuer coretoken.Issuer, err error
  - name: NewHS256Verifier
    params: secret corecrypto.Key, cfg VerifierConfig
    results: verifier coretoken.Verifier, err error
  - name: NewES256Verifier
    params: pub *ecdsa.PublicKey, cfg VerifierConfig
    results: verifier coretoken.Verifier, err error
  - name: NewEdDSAVerifier
    params: pub ed25519.PublicKey, cfg VerifierConfig
    results: verifier coretoken.Verifier, err error
  - doc: |-
      keyUnsuitable returns the KeyUnsuitable verdict carrying a fixed detail.

      It wraps the SENTINEL rather than the underlying cause, and that is not a
      stylistic choice: several of these causes are themselves *errs.Error values
      out of internal/service/crypto/key/jwk, and Wrap's origin-wins rule would make
      the RESULT carry the jwk package's code (0.3.42.*) instead of this domain's
      KeyUnsuitable. A caller routing on the code would then be reading a verdict
      about a key format where they asked about a token.

      detail is a fixed string chosen at the call site — never key material.
    name: keyUnsuitable
    params: detail string
    results: error
  - doc: |-
      bindSecret validates a symmetric key and returns the HS256 binding.

      core/crypto.Key is fixed at 256 bits, so a short passphrase cannot become
      one — which covers the LENGTH half of RFC 8725 §3.5. The ENTROPY half is not
      something this package can measure: derive the key (pkg/v1/crypto/kdf) rather than
      typing one.
    name: bindSecret
    params: secret corecrypto.Key
    results: binding hs256Binding, err error
  - doc: |-
      bindP256Public validates an ECDSA public key for ES256.

      The point is validated, not just measured: ECDH() rejects an off-curve point
      and the identity, and using an off-curve point is a documented route to key
      recovery (RFC 8725 §3.4).
    name: bindP256Public
    params: pub *ecdsa.PublicKey
    results: binding es256Verifying, err error
  - doc: |-
      bindP256Private validates an ECDSA private key for ES256: its curve, its
      public point, its scalar, and that the scalar and the point are one key.

      The last two are checked here because nothing later would. crypto/ecdsa
      reads D only when it signs — as of go1.27 it dereferences it on the first
      Sign, so a nil scalar passes construction and panics inside Issue — and it
      signs with D without ever comparing D·G to (X, Y). A struct whose halves came
      from two different keys therefore mints tokens that the key's own public
      half, the one the verifier is handed, refuses: every token, until someone
      notices that the issuer was wrong from the start.
    name: bindP256Private
    params: priv *ecdsa.PrivateKey
    results: binding es256Signing, err error
  - doc: bindEd25519Public validates an Ed25519 public key for alg.
    name: bindEd25519Public
    params: pub ed25519.PublicKey, alg coretoken.Algorithm
    results: binding ed25519Verifying, err error
  - doc: bindEd25519Private validates an Ed25519 private key for alg.
    name: bindEd25519Private
    params: priv ed25519.PrivateKey, alg coretoken.Algorithm
    results: binding ed25519Signing, err error
  - name: NewPasetoV4Issuer
    params: priv ed25519.PrivateKey, cfg PasetoIssuerConfig
    results: issuer coretoken.Issuer, err error
  - name: NewPasetoV4Verifier
    params: pub ed25519.PublicKey, cfg PasetoVerifierConfig
    results: verifier coretoken.Verifier, err error
  - doc: |-
      checkFooterLen refuses a configured footer longer than maxFooterLen, the
      bound the verifier applies to a token's decoded footer.

      It is the SAME constant on purpose, compared the same way: the issuer and
      the verifier must agree on it exactly, because a footer one byte past the
      verifier's bound is not a slightly large footer — it is a token nothing in
      this package will accept.
    name: checkFooterLen
    params: footer []byte
    results: error
  - doc: |-
      checkPasetoScheme refuses every version+purpose except v4.public, telling a
      recognisable PASETO apart from a string that merely has dots in it.
    name: checkPasetoScheme
    params: version, purpose string
    results: error
  - doc: |-
      newPolicy validates cfg and resolves every default, or returns
      PolicyMisconfigured naming the offending knob.
    name: newPolicy
    params: cfg VerifierConfig
    results: policy policyValue, err error
  - doc: |-
      nonUTF8VerifierKnob names the first VerifierConfig string a token is compared
      against that is not valid UTF-8, or returns "" when every one of them is.
    name: nonUTF8VerifierKnob
    params: cfg VerifierConfig
    results: string
  - doc: misconfigured returns the PolicyMisconfigured verdict naming one knob.
    name: misconfigured
    params: knob string
    results: error
  - doc: resolveClock substitutes the system clock for a nil one.
    name: resolveClock
    params: configured clock.Clock
    results: clock.Clock
  - doc: |-
      validateIssuerConfig refuses an IssuerConfig that cannot be honoured, before
      it becomes an issuer whose every call fails (ADR 0031).
    name: validateIssuerConfig
    params: cfg IssuerConfig
    results: error
  - doc: |-
      nonUTF8Knob names the first IssuerConfig string that is not valid UTF-8, or
      returns "" when every one of them is.
    name: nonUTF8Knob
    params: cfg IssuerConfig
    results: string
  - doc: |-
      stampIssuedClaims applies an issuer's configured defaults to claims on the
      way out: "iss" when the claims carry none, "iat" always, and "exp" derived
      from the configured lifetime when the claims carry no expiry of their own.

      It refuses to mint a token with no expiry unless the issuer was built with
      AllowMissingExpiry, which is the same rule the verifier applies, stated once
      on each side so neither can drift into being the lenient one.
    name: stampIssuedClaims
    params: claims coretoken.ClaimsValue, cfg IssuerConfig, source clock.Clock
    results: stamped coretoken.ClaimsValue, err error
imports:
  base64: encoding/base64
  big: math/big
  binary: encoding/binary
  bytes: bytes
  clock: github.com/kitsunium/sdk/internal/kernel/clock
  corecrypto: github.com/kitsunium/sdk/internal/core/crypto
  coretoken: github.com/kitsunium/sdk/internal/core/security/token
  ecdsa: crypto/ecdsa
  ed25519: crypto/ed25519
  ed25519sig: github.com/kitsunium/sdk/internal/service/crypto/sign/ed25519sig
  elliptic: crypto/elliptic
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  hmacsha2: github.com/kitsunium/sdk/internal/service/crypto/mac/hmacsha2
  json: encoding/json
  jwk: github.com/kitsunium/sdk/internal/service/crypto/key/jwk
  math: math
  rand: crypto/rand
  sha256: crypto/sha256
  slices: slices
  strconv: strconv
  strings: strings
  subtle: crypto/subtle
  time: time
  utf16: unicode/utf16
  utf8: unicode/utf8
  x509: crypto/x509
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/security/token
  name: token
  purpose: Package token — one JWK Set member, with its binding already derived.
types:
  - doc: |-
      boundKeyValue is one JWK Set member with its verifying binding already
      derived, plus whether that derivation succeeded.
    fields:
      - doc: |-
          binding is the verifying key this member implies. It is meaningful only
          when usable is true.
        name: binding
        type: verifyingKey
      - doc: |-
          usable reports whether bindJWK accepted this member.

          It is a BOOLEAN and not a nil check on binding, and that is load-bearing:
          bindJWK's refusals do not all arrive as a nil interface. bindECJWK ends
          in `return bindP256Public(public)`, whose first result is the VALUE type
          es256Verifying, so a refusal there reaches this struct as a NON-nil
          verifyingKey wrapping a zero es256Verifying — whose verify would
          dereference a nil *ecdsa.PublicKey. bindOctJWK and bindOKPJWK have the
          same shape through hs256Binding and ed25519Verifying.

          Those three inner refusals are unreachable today, because jwk validates
          length, curve and point before any of them can fire — this field is
          defence against an edit that makes one reachable, not a fix for a panic
          anything can currently produce. TestABindRefusalIsNotANilInterface pins
          the shape so the claim stays checkable.
        name: usable
        type: bool
    kind: struct
    name: boundKeyValue
  - doc: |-
      boundsValue groups the size and depth limits a policy applies, so resolving
      them stays one call rather than three near-identical error checks inside
      newPolicy — which is what kept that function readable when the third bound
      arrived.
    fields:
      - doc: tokenLen is the resolved maximum token-string length.
        name: tokenLen
        type: int
      - doc: claimDepth is the resolved maximum claims JSON nesting.
        name: claimDepth
        type: int
      - doc: |-
          keyCandidates is the resolved maximum number of keys a set verifier
          will try for one kid.
        name: keyCandidates
        type: int
    kind: struct
    name: boundsValue
  - doc: |-
      claimShape is the per-format encoding of the claim values whose spelling the
      two formats disagree about. Every decode method reads a value the scanner
      already validated as JSON.
    kind: named
    name: claimShape
    underlying: |-
      interface {
      	// decodeTime reads one registered time claim.
      	decodeTime(raw []byte) (time.Time, error)
      	// encodeTime renders one registered time claim.
      	encodeTime(instant time.Time) json.RawMessage
      	// checkAudience refuses an "aud" value the format cannot carry, without
      	// building anything.
      	checkAudience(raw []byte) error
      	// decodeAudience reads an "aud" value checkAudience accepted into its
      	// general slice form; nil raw is no audience.
      	decodeAudience(raw []byte) ([]string, error)
      	// encodeAudience renders "aud", or nil to omit the member entirely.
      	encodeAudience(audience []string) (json.RawMessage, error)
      }
  - doc: |-
      registeredValue is what one claims object says through its registered
      claims: where each one sits in the object index, and the three instants,
      decoded once.
    fields:
      - doc: at is each slot's member index, -1 when the claim is absent.
        name: at
        type: "[registeredSlots]int"
      - doc: expiry / notBefore / issuedAt are the decoded instants, zero when absent.
        name: expiry
        type: time.Time
      - doc: expiry / notBefore / issuedAt are the decoded instants, zero when absent.
        name: notBefore
        type: time.Time
      - doc: expiry / notBefore / issuedAt are the decoded instants, zero when absent.
        name: issuedAt
        type: time.Time
    kind: struct
    methods:
      - doc: instant returns the decoded instant of a time slot.
        name: instant
        params: slot int
        recv: r *registeredValue
        results: instant time.Time
    name: registeredValue
  - doc: |-
      depthScan is the state a linear nesting scan needs: how deep it currently
      is, and whether it is inside a JSON string (where a brace is data, not
      structure) and past a backslash (where the next byte is escaped).

      It is split out of checkJSONDepth so the "inside a string" rules live in one
      place: the escape handling is exactly where a hand-rolled scanner gets it
      wrong, and a `\"` read as a closing quote would make the rest of the payload
      look like structure.
    fields:
      - doc: depth is the current bracket nesting level.
        name: depth
        type: int
      - doc: inString reports whether the scan is inside a JSON string literal.
        name: inString
        type: bool
      - doc: escaped reports whether the previous byte was an unconsumed backslash.
        name: escaped
        type: bool
    kind: struct
    methods:
      - doc: consumeStringByte advances the scan by one byte of string content.
        name: consumeStringByte
        params: char byte
        recv: s *depthScan
      - doc: consumeStructuralByte advances the scan by one byte outside a string.
        name: consumeStructuralByte
        params: char byte
        recv: s *depthScan
    name: depthScan
  - doc: |-
      ed25519Signing is Ed25519 signing. It carries its algorithm as a field
      because the same primitive backs two of them — JOSE "EdDSA" and PASETO
      v4.public — over DIFFERENT signing inputs. Reporting which one it is keeps a
      v4.public key from silently satisfying a JWS EdDSA binding.
    fields:
      - doc: key is the 64-octet stdlib private key.
        name: key
        type: ed25519.PrivateKey
      - doc: alg is AlgorithmEdDSA or AlgorithmPasetoV4Public.
        name: alg
        type: coretoken.Algorithm
    kind: struct
    methods:
      - doc: algorithm reports the bound algorithm.
        name: algorithm
        recv: b ed25519Signing
        results: coretoken.Algorithm
      - doc: sign returns the 64-octet Ed25519 signature over input.
        name: sign
        params: input []byte
        recv: b ed25519Signing
        results: sig []byte, err error
    name: ed25519Signing
  - doc: |-
      ed25519Verifying is Ed25519 verification, algorithm-tagged like its signing
      counterpart: the same keypair backs JOSE EdDSA and PASETO v4.public over
      different signing inputs, and the tag is what stops one satisfying the other.
    fields:
      - doc: key is the 32-octet stdlib public key.
        name: key
        type: ed25519.PublicKey
      - doc: alg is AlgorithmEdDSA or AlgorithmPasetoV4Public.
        name: alg
        type: coretoken.Algorithm
    kind: struct
    methods:
      - doc: algorithm reports the bound algorithm.
        name: algorithm
        recv: b ed25519Verifying
        results: coretoken.Algorithm
      - doc: verify reports whether sig authenticates input under the bound public key.
        name: verify
        params: input, sig []byte
        recv: b ed25519Verifying
        results: bool
    name: ed25519Verifying
  - doc: |-
      segmentsValue is a fixed-capacity view over a compact token's dot-separated
      parts. It is an ARRAY, not a slice, and that is the whole point.

      CVE-2025-30204 was a strings.Split on the token before any length check: an
      input of a few megabytes of "." made the split allocate a slice header per
      separator, so a request the size of a photo became hundreds of megabytes of
      garbage. Here the bound is checked first, the count cannot exceed
      maxSegments, and the parts are sub-slices of the caller's string — the split
      allocates nothing at all.
    fields:
      - doc: part holds up to maxSegments views into the original token string.
        name: part
        type: "[maxSegments]string"
      - doc: count is how many entries of part are populated.
        name: count
        type: int
    kind: struct
    name: segmentsValue
  - doc: segmentsBytes is segmentsValue over a token held as bytes.
    fields:
      - doc: part holds up to maxSegments views into the original token.
        name: part
        type: "[maxSegments][]byte"
      - doc: count is how many entries of part are populated.
        name: count
        type: int
    kind: struct
    name: segmentsBytes
  - doc: es256Signing is ECDSA P-256 signing with the RFC 7518 §3.4 R||S encoding.
    fields:
      - doc: key is the private key; its curve and point are checked at construction.
        name: key
        type: "*ecdsa.PrivateKey"
    kind: struct
    methods:
      - doc: algorithm reports ES256.
        name: algorithm
        recv: es256Signing
        results: coretoken.Algorithm
      - doc: |-
          sign hashes input with SHA-256 and emits the fixed-width R||S signature.

          This is the one algorithm here that does NOT go through the SDK's registered
          signer: service/crypto/sign/ecdsasig speaks ASN.1/DER, which is the right shape
          for X.509 and the wrong shape for JOSE. Transcoding DER to R||S would mean
          re-parsing an attacker-supplied structure on the verify path, so the JOSE
          encoding is produced directly from crypto/ecdsa instead — one primitive, one
          encoding, no converter to get wrong.
        name: sign
        params: input []byte
        recv: b es256Signing
        results: sig []byte, err error
    name: es256Signing
  - doc: es256Verifying is ECDSA P-256 verification over the R||S encoding.
    fields:
      - doc: key is the public key; its curve and point are checked at construction.
        name: key
        type: "*ecdsa.PublicKey"
    kind: struct
    methods:
      - doc: algorithm reports ES256.
        name: algorithm
        recv: es256Verifying
        results: coretoken.Algorithm
      - doc: verify reports whether sig is a valid ES256 signature over input.
        name: verify
        params: input, sig []byte
        recv: b es256Verifying
        results: bool
    name: es256Verifying
  - doc: |-
      hs256Binding is HMAC-SHA-256 over a 256-bit shared secret. It is the only
      binding that is BOTH halves, because a symmetric key that can verify can
      also mint — which is the property a caller should have to notice.
    fields:
      - doc: |-
          secret is the redacting core key type. It is a struct with an
          unexported field, so an *ecdsa.PublicKey cannot become one by
          conversion — that is the compile-time half of the confusion defence.
        name: secret
        type: corecrypto.Key
    kind: struct
    methods:
      - doc: algorithm reports HS256.
        name: algorithm
        recv: hs256Binding
        results: coretoken.Algorithm
      - doc: sign returns the HMAC-SHA-256 tag over input.
        name: sign
        params: input []byte
        recv: b hs256Binding
        results: sig []byte, err error
      - doc: verify recomputes the tag and compares it in constant time.
        name: verify
        params: input, sig []byte
        recv: b hs256Binding
        results: bool
    name: hs256Binding
  - doc: |-
      hs256Verifier is the JWS verifier bound to HMAC-SHA-256, and the one
      verifier that also implements coretoken.VerifierInto. Its own state is
      immutable like every verifier's; the mutable MAC state lives in the
      VerifyScratch each caller thread owns.
    fields:
      - doc: jwsVerifier is the binding and the policy, and Verify.
        name: ""
        role: embedded
        type: jwsVerifier
      - doc: secret is the key NewScratch keys each scratch's MAC with.
        name: secret
        type: hs256Binding
      - doc: |-
          owner is this verifier's scratch token: a pointer no caller can reach,
          so a scratch can only claim this verifier by being made by it.
        name: owner
        type: "*scratchOwner"
    kind: struct
    methods:
      - doc: |-
          NewScratch returns a fresh scratch bound to this verifier, its MAC keyed
          and primed. Make one per thread, once, and reuse it.
        name: NewScratch
        recv: v *hs256Verifier
        results: "*coretoken.VerifyScratch"
      - doc: |-
          VerifyInto authenticates token with the scratch s and stores its claims in
          dst, which it overwrites on entry. It refuses what Verify refuses, in the
          same order, and then a claim past dst's capacity.

          dst is reset before the scratch is entered, so even a busy or foreign
          scratch leaves no previous request's claims behind, and reset again on any
          refusal.
        name: VerifyInto
        params: s *coretoken.VerifyScratch, token []byte, dst *coretoken.ClaimsBuf
        recv: v *hs256Verifier
        results: error
      - doc: |-
          verifyInto is VerifyInto once the scratch is held: structure, alg, MAC,
          then the claims.
        name: verifyInto
        params: s *coretoken.VerifyScratch, token []byte, dst *coretoken.ClaimsBuf
        recv: v *hs256Verifier
        results: error
      - doc: |-
          authenticate decodes the signature, judges the header, checks the MAC and,
          only then, reads the claims.
        name: authenticate
        params: s *coretoken.VerifyScratch, token []byte, seg *segmentsBytes, view *headerView, dst *coretoken.ClaimsBuf
        recv: v *hs256Verifier
        results: error
    name: hs256Verifier
  - doc: |-
      scratchOwner is the identity a VerifyScratch is bound to. It has a size, so
      two of them are never one address.
    fields:
      - doc: mark is never read; it keeps the type from being zero-sized.
        name: mark
        type: byte
    kind: struct
    name: scratchOwner
  - fields:
      - doc: Issuer, when non-empty, is stamped as "iss" on claims that carry none.
        name: Issuer
        type: string
      - doc: |-
          Type overrides the JWS "typ" header. Empty means "JWT" (RFC 7519 §5.1).
          Set it to an explicit media type such as "at+jwt" when this issuer mints
          more than one kind of token (RFC 8725 §3.11 / §3.12).
        name: Type
        type: string
      - doc: |-
          KeyID, when non-empty, is stamped as the JWS "kid" header — the value a
          recipient's key-set verifier selects on. An issuer that publishes a JWK
          Set needs one; an issuer whose verifier holds a single key does not.
        name: KeyID
        type: string
      - doc: |-
          Lifetime, when positive, is stamped as "exp" = now + Lifetime on claims
          that carry no expiry of their own. Zero means the claims must bring one.
        name: Lifetime
        type: time.Duration
      - doc: |-
          AllowMissingExpiry permits minting a token with no "exp" at all. The
          zero value is false, so the dangerous shape is the one you have to ask
          for by name: a bearer token that never expires is a password with worse
          rotation (ADR 0030).
        name: AllowMissingExpiry
        type: bool
      - doc: |-
          Clock is the time source for "iat" and the derived "exp". Nil means
          clock.System. It is a clock.Clock — the frozen read-only half of the
          time port (ADR 0039) — because issuing stamps instants and never waits.
        name: Clock
        type: clock.Clock
    kind: struct
    name: IssuerConfig
  - doc: |-
      joseShape is the JWT/JOSE claim encoding: NumericDate seconds
      (RFC 7519 §2), and an "aud" that is either one string or an array of them
      (RFC 7519 §4.1.3).
    kind: struct
    methods:
      - doc: |-
          decodeTime reads a NumericDate. It accepts a fractional value because the
          RFC defines one, and keeps it to nanosecond resolution.

          An integer of up to maxIntegerDigits digits — every real exp, nbf and iat —
          is read exactly, without strconv and without an allocation; anything else
          goes through strconv.ParseFloat, once the scanner has held it to the RFC
          8259 grammar, which ParseFloat alone is not ("0x1p3", "Inf", "1_0").
        name: decodeTime
        params: raw []byte
        recv: joseShape
        results: instant time.Time, err error
      - doc: encodeTime renders a NumericDate as whole seconds.
        name: encodeTime
        params: instant time.Time
        recv: joseShape
        results: json.RawMessage
      - doc: |-
          checkAudience accepts the one-string and the array-of-strings forms, and
          nothing else — a null member of the array included, which a lenient reader
          decodes as "".
        name: checkAudience
        params: raw []byte
        recv: joseShape
        results: error
      - doc: |-
          decodeAudience reads an "aud" checkAudience accepted. An empty array decodes
          to no audience at all.
        name: decodeAudience
        params: raw []byte
        recv: joseShape
        results: audience []string, err error
      - doc: |-
          encodeAudience renders one audience as a string and several as an array,
          which is the shape RFC 7519 §4.1.3 recommends for the single case.
        name: encodeAudience
        params: audience []string
        recv: joseShape
        results: raw json.RawMessage, err error
    name: joseShape
  - doc: |-
      valueKind is the JSON type of one scanned value. The zero value is no
      value at all, which no successful scan reports.
    kind: named
    name: valueKind
    underlying: uint8
  - doc: |-
      memberSpan locates one top-level member of a scanned object inside the
      scanned bytes: the name without its quotes, and the value as written.
    fields:
      - doc: nameStart / nameEnd delimit the name, quotes excluded.
        name: nameStart
        type: int32
      - doc: nameStart / nameEnd delimit the name, quotes excluded.
        name: nameEnd
        type: int32
      - doc: valueStart / valueEnd delimit the value, whitespace excluded.
        name: valueStart
        type: int32
      - doc: valueStart / valueEnd delimit the value, whitespace excluded.
        name: valueEnd
        type: int32
      - doc: kind is the value's JSON type.
        name: kind
        type: valueKind
    kind: struct
    name: memberSpan
  - doc: |-
      objectIndex is the top-level members of one scanned object, in order. It is
      an ARRAY, sized by the member cap, so indexing allocates nothing; total
      keeps counting past the cap so the refusal can name it.
    fields:
      - doc: member holds the first count members.
        name: member
        type: "[maxIndexedMembers]memberSpan"
      - doc: count is how many entries of member are populated.
        name: count
        type: int
      - doc: total is how many members the object carries, indexed or not.
        name: total
        type: int
    kind: struct
    methods:
      - doc: name returns the bytes of member i's name inside raw.
        name: name
        params: raw []byte, i int
        recv: x *objectIndex
        results: "[]byte"
      - doc: value returns the bytes of member i's value inside raw.
        name: value
        params: raw []byte, i int
        recv: x *objectIndex
        results: "[]byte"
      - doc: lookup returns the index of the member called name, or -1.
        name: lookup
        params: raw []byte, name string
        recv: x *objectIndex
        results: int
      - doc: hasName reports whether an indexed member is already called name.
        name: hasName
        params: raw []byte, name []byte
        recv: x *objectIndex
        results: bool
    name: objectIndex
  - doc: |-
      jsonScan is a strict RFC 8259 reader over one byte slice, with one integer
      of position. It decodes nothing and allocates nothing: it validates, and
      reports where things are.
    fields:
      - doc: raw is the text being scanned.
        name: raw
        type: "[]byte"
      - doc: pos is the offset of the next unread byte.
        name: pos
        type: int
      - doc: |-
          maxDepth bounds nesting; the depth pre-pass already enforced it, and
          this is the scanner's own guard against a pre-pass it does not trust.
        name: maxDepth
        type: int
    kind: struct
    methods:
      - doc: |-
          topMembers reads the top-level members after the opening brace, through
          the closing one.
        name: topMembers
        params: idx *objectIndex
        recv: s *jsonScan
        results: error
      - doc: topMember reads one top-level member and indexes it.
        name: topMember
        params: idx *objectIndex
        recv: s *jsonScan
        results: error
      - doc: value reads one value at depth and reports its kind.
        name: value
        params: depth int
        recv: s *jsonScan
        results: kind valueKind, err error
      - doc: |-
          container reads a nested object or array whose opening byte is at pos,
          through closer. Names inside it are read as strings: escapes and repeats
          are the top level's concern, as they were for the legacy reader.
        name: container
        params: depth int, closer byte
        recv: s *jsonScan
        results: error
      - doc: element reads one array element, or one object member when member is set.
        name: element
        params: depth int, member bool
        recv: s *jsonScan
        results: error
      - doc: |-
          str reads a string literal whose opening quote is at pos, through its
          closing quote, and reports whether it carried an escape. It refuses an
          unescaped control byte, an unknown escape, and a lone surrogate.
        name: str
        recv: s *jsonScan
        results: escaped bool, err error
      - doc: |-
          number reads a number in the RFC 8259 §6 grammar: an optional minus, an
          integer part without a leading zero, an optional fraction and exponent,
          each with at least one digit. strconv would accept more — "0x1p3", "Inf",
          "1_0" — which is why nothing reaches it unchecked.

          A number whose magnitude a float64 cannot hold is refused too, wherever it
          sits: the legacy reader walked every token with encoding/json, which reads
          each number as a float64 and refused "1e400" at any depth. Underflow is not
          refused — strconv rounds it to zero without an error, as encoding/json did.
        name: number
        recv: s *jsonScan
        results: error
      - doc: |-
          exponent reads an optional exponent and returns its value, saturated far
          past any float64's range so a thousand-digit exponent cannot overflow it.
        name: exponent
        recv: s *jsonScan
        results: value int, err error
      - doc: |-
          checkMagnitude refuses a number whose magnitude is past the largest
          float64. The number is d.ddd × 10^order with 1 ≤ d.ddd < 10: an order up to
          307 always fits, one from 309 never does, and only order 308 is close
          enough to need strconv's own verdict.
        name: checkMagnitude
        params: start, intStart, intDigits int, frac []byte, exponent int
        recv: s *jsonScan
        results: error
      - doc: digits consumes a run of decimal digits and reports whether there was one.
        name: digits
        recv: s *jsonScan
        results: bool
      - doc: literal consumes word, or refuses.
        name: literal
        params: word string
        recv: s *jsonScan
        results: error
      - doc: skipSpace consumes the four whitespace bytes of RFC 8259 §2.
        name: skipSpace
        recv: s *jsonScan
      - doc: peek returns the next byte, or 0 at the end.
        name: peek
        recv: s *jsonScan
        results: byte
      - doc: consume advances past c when it is the next byte.
        name: consume
        params: c byte
        recv: s *jsonScan
        results: bool
    name: jsonScan
  - doc: |-
      arrayStrings walks the elements of a validated JSON array, each of which
      must be a string. It allocates nothing: each call to next reports a view of
      the next element's literal, quotes included.
    fields:
      - doc: s reads the array's bytes.
        name: s
        type: jsonScan
    kind: struct
    methods:
      - doc: |-
          next returns the next element's literal. ok is false at the end of the
          array; err is Malformed for an element that is not a string — a null
          included, where the legacy reader decoded one as "".
        name: next
        recv: a *arrayStrings
        results: lit []byte, ok bool, err error
    name: arrayStrings
  - doc: setVerifier authenticates JWS compact tokens against a JWK Set.
    fields:
      - doc: |-
          byKid holds the set's members grouped by their "kid", in document order,
          each with its binding already derived. Members carrying no kid are
          absent: a lookup by id never means "match the keys that have no id",
          which is jwk.Set.AllByKid's own rule preserved here.
        name: byKid
        type: map[string][]boundKeyValue
      - doc: policy is the validated verification policy.
        name: policy
        type: policyValue
    kind: struct
    methods:
      - doc: Verify selects candidate keys by kid and authenticates against them.
        name: Verify
        params: token string
        recv: v *setVerifier
        results: claims coretoken.ClaimsValue, err error
      - doc: |-
          tryCandidates verifies parts against each candidate in order and decodes
          the claims under the first that accepts the header and verifies the
          signature.
        name: tryCandidates
        params: parts jwsPartsValue, candidates []boundKeyValue
        recv: v *setVerifier
        results: claims coretoken.ClaimsValue, err error
      - doc: candidates resolves the keys to try for kid, refusing both ends.
        name: candidates
        params: kid string
        recv: v *setVerifier
        results: keys []boundKeyValue, err error
    name: setVerifier
  - doc: |-
      headerValue is the subset of the JOSE header this package acts on. Every
      other member is IGNORED on the way in (RFC 7515 allows unknown parameters)
      and not carried on the way out — re-emitting a parameter we never understood
      would be vouching for it.
    fields:
      - doc: |-
          alg is the "alg" member, verbatim. It is COMPARED against the binding
          and never used to look anything up.
        name: alg
        type: string
      - doc: typ is the "typ" member, empty when absent.
        name: typ
        type: string
      - doc: |-
          kid is the "kid" member, empty when absent. A hint chosen by whoever
          published the key — never proof of anything.
        name: kid
        type: string
      - doc: critical reports whether a "crit" member was present.
        name: critical
        type: bool
    kind: struct
    name: headerValue
  - doc: |-
      headerView is a JOSE header as the scanner read it: each member this
      package acts on as its string literal inside the decoded header, nil when
      absent or null. It decodes nothing, so reading it allocates nothing.
    fields:
      - doc: alg / typ / kid are the members' literals, quotes included.
        name: alg
        type: "[]byte"
      - doc: alg / typ / kid are the members' literals, quotes included.
        name: typ
        type: "[]byte"
      - doc: alg / typ / kid are the members' literals, quotes included.
        name: kid
        type: "[]byte"
      - doc: critical reports whether a "crit" member was present.
        name: critical
        type: bool
    kind: struct
    name: headerView
  - doc: headerFacts is what the header judgement needs, whichever reader produced it.
    fields:
      - doc: "unsecured: alg is \"none\" in some capitalisation."
        name: unsecured
        type: bool
      - doc: "algEmpty: alg is absent, null or \"\"."
        name: algEmpty
        type: bool
      - doc: "algBound: alg names the bound algorithm exactly."
        name: algBound
        type: bool
      - doc: "critical: a \"crit\" member was present."
        name: critical
        type: bool
      - doc: "typeOK: no type is required, or typ is exactly the required one."
        name: typeOK
        type: bool
    kind: struct
    name: headerFacts
  - doc: jwsIssuer mints JWS compact tokens under one algorithm-bound key.
    fields:
      - doc: bound is the signing key; its algorithm is fixed at construction.
        name: bound
        type: signingKey
      - doc: |-
          header is the pre-rendered, pre-encoded JOSE header. It is built once
          because it never varies: the algorithm cannot change without a new
          issuer, which is the same reason there is no algorithm parameter.
        name: header
        type: string
      - doc: cfg carries the stamping policy (iss, lifetime, typ, kid).
        name: cfg
        type: IssuerConfig
      - doc: timeSource is the resolved clock, never nil.
        name: timeSource
        type: clock.Clock
    kind: struct
    methods:
      - doc: Issue renders claims as a JWS compact token.
        name: Issue
        params: claims coretoken.ClaimsValue
        recv: i *jwsIssuer
        results: token string, err error
    name: jwsIssuer
  - doc: |-
      jwsPartsValue is a parsed, NOT YET AUTHENTICATED compact token. Nothing in
      it may be trusted; it exists so the parse happens once even when several
      candidate keys are tried.
    fields:
      - doc: header is the parsed JOSE header.
        name: header
        type: headerValue
      - doc: payload is the still-encoded claims segment.
        name: payload
        type: string
      - doc: |-
          input is the signing input: the header and payload segments, still
          base64url-encoded, joined by their separator (RFC 7515 §5.1).
        name: input
        type: "[]byte"
      - doc: signature is the decoded signature octets.
        name: signature
        type: "[]byte"
    kind: struct
    name: jwsPartsValue
  - doc: jwsVerifier authenticates JWS compact tokens under one algorithm-bound key.
    fields:
      - doc: |-
          bound is the verification key; its algorithm is fixed at construction
          and is the only algorithm this verifier will ever accept.
        name: bound
        type: verifyingKey
      - doc: policy is the validated verification policy.
        name: policy
        type: policyValue
    kind: struct
    methods:
      - doc: |-
          Verify authenticates token and returns its claims.

          The order is the contract: parse, compare the algorithm against the binding,
          verify the signature, and only then decode and judge the claims. A caller
          never receives — or logs — a claim out of a token that did not authenticate.
        name: Verify
        params: token string
        recv: v *jwsVerifier
        results: claims coretoken.ClaimsValue, err error
    name: jwsVerifier
  - doc: "signingKey is the private half of a binding: one algorithm, one key."
    kind: named
    name: signingKey
    underlying: |-
      interface {
      	// algorithm reports what this key signs as.
      	algorithm() coretoken.Algorithm
      	// sign produces a detached signature over input.
      	sign(input []byte) (sig []byte, err error)
      }
  - doc: "verifyingKey is the public half of a binding: one algorithm, one key."
    kind: named
    name: verifyingKey
    underlying: |-
      interface {
      	// algorithm reports what this key verifies.
      	algorithm() coretoken.Algorithm
      	// verify reports whether sig authenticates input. It returns a bool and
      	// not an error: "this signature is wrong" is an answer, not a fault.
      	verify(input, sig []byte) bool
      }
  - doc: pasetoIssuer mints v4.public tokens.
    fields:
      - doc: bound is the Ed25519 signing key, tagged AlgorithmPasetoV4Public.
        name: bound
        type: signingKey
      - doc: "cfg is the PASETO policy: footer and implicit assertion included."
        name: cfg
        type: PasetoIssuerConfig
      - doc: issuing is the shared claim-stamping projection of cfg.
        name: issuing
        type: IssuerConfig
      - doc: |-
          timeSource is the resolved clock, never nil. It is a clock.Clock — the
          frozen read-only half of the time port (ADR 0039) — because issuing
          stamps instants and never waits for one.
        name: timeSource
        type: clock.Clock
    kind: struct
    methods:
      - doc: Issue renders claims as a v4.public token.
        name: Issue
        params: claims coretoken.ClaimsValue
        recv: i *pasetoIssuer
        results: token string, err error
    name: pasetoIssuer
  - fields:
      - doc: Issuer, when non-empty, is stamped as "iss" on claims that carry none.
        name: Issuer
        type: string
      - doc: |-
          Footer is the optional, AUTHENTICATED but unencrypted footer. It is
          covered by the signature through the pre-authentication encoding, and it
          is where a key identifier belongs in this format.
        name: Footer
        type: "[]byte"
      - doc: |-
          ImplicitAssertion is v4's optional out-of-band context: it is covered by
          the signature but never transmitted, so a token only verifies for a
          recipient who already knows it. Both sides must configure the same value.
        name: ImplicitAssertion
        type: "[]byte"
      - doc: |-
          Lifetime, when positive, is stamped as "exp" = now + Lifetime on claims
          that carry no expiry of their own. Zero means the claims must bring one.
        name: Lifetime
        type: time.Duration
      - doc: |-
          AllowMissingExpiry permits minting a token with no "exp" at all. The
          zero value is false, so the dangerous shape is the one you have to ask
          for by name (ADR 0030).
        name: AllowMissingExpiry
        type: bool
      - doc: |-
          Clock is the time source for "iat" and the derived "exp". Nil means
          clock.System.
        name: Clock
        type: clock.Clock
    kind: struct
    methods:
      - doc: |-
          issuing projects the PASETO config onto the shared issuing policy, so the
          claim-stamping rules are written once and cannot drift between the formats.
        name: issuing
        recv: c PasetoIssuerConfig
        results: IssuerConfig
    name: PasetoIssuerConfig
  - doc: |-
      pasetoShape is the PASETO claim encoding: RFC 3339 timestamps and a single
      string audience. PASETO's registered claims are typed, and its "aud" is a
      string — there is no array form to accept.
    kind: struct
    methods:
      - doc: decodeTime reads an RFC 3339 timestamp.
        name: decodeTime
        params: raw []byte
        recv: pasetoShape
        results: instant time.Time, err error
      - doc: encodeTime renders an RFC 3339 timestamp in UTC.
        name: encodeTime
        params: instant time.Time
        recv: pasetoShape
        results: json.RawMessage
      - doc: checkAudience accepts a single string only.
        name: checkAudience
        params: raw []byte
        recv: pasetoShape
        results: error
      - doc: decodeAudience reads an "aud" checkAudience accepted.
        name: decodeAudience
        params: raw []byte
        recv: pasetoShape
        results: audience []string, err error
      - doc: |-
          encodeAudience refuses to render more than one audience: PASETO has no array
          form, and silently emitting only the first would mint a token whose audience
          check passes for a recipient the caller did not intend to include.
        name: encodeAudience
        params: audience []string
        recv: pasetoShape
        results: raw json.RawMessage, err error
    name: pasetoShape
  - doc: pasetoVerifier authenticates v4.public tokens.
    fields:
      - doc: bound is the Ed25519 verification key, tagged AlgorithmPasetoV4Public.
        name: bound
        type: verifyingKey
      - doc: policy is the validated verification policy.
        name: policy
        type: policyValue
      - doc: cfg carries the expected footer and implicit assertion.
        name: cfg
        type: PasetoVerifierConfig
    kind: struct
    methods:
      - doc: |-
          Verify authenticates token and returns its claims, in the same order the JWS
          verifier uses: parse, check the scheme, verify the signature, and only then
          decode and judge the claims.
        name: Verify
        params: token string
        recv: v *pasetoVerifier
        results: claims coretoken.ClaimsValue, err error
      - doc: decodeAuthenticated turns an authenticated PASETO payload into claims.
        name: decodeAuthenticated
        params: message []byte
        recv: v *pasetoVerifier
        results: claims coretoken.ClaimsValue, err error
      - doc: |-
          split decodes a v4.public token into its payload+signature body and footer,
          refusing any other version or purpose by name.
        name: split
        params: token string
        recv: v *pasetoVerifier
        results: payload, footer []byte, err error
    name: pasetoVerifier
  - fields:
      - doc: Issuer, when non-empty, must equal the token's "iss" (RFC 8725 §3.8).
        name: Issuer
        type: string
      - doc: |-
          Audience, when non-empty, must equal the token's "aud". PASETO's
          audience is a single string, so there is no list to search.
        name: Audience
        type: string
      - doc: |-
          Footer is the footer this verifier expects, compared in constant time.
          Empty means the token must carry NO footer.

          The Verifier port returns claims, not a footer, so an unconstrained
          footer would be data this package authenticated and then dropped on the
          floor. Refusing is the only answer that does not quietly lose it.
        name: Footer
        type: "[]byte"
      - doc: ImplicitAssertion must equal the value the issuer signed with.
        name: ImplicitAssertion
        type: "[]byte"
      - doc: |-
          Leeway is the clock-skew allowance applied to "exp" and "nbf". It must
          be in [0, MaxLeeway].
        name: Leeway
        type: time.Duration
      - doc: |-
          MaxLifetime, when positive, refuses an authenticated token whose exp-iat
          span exceeds it. It requires "iat".
        name: MaxLifetime
        type: time.Duration
      - doc: MaxTokenLen bounds the token string. Zero means DefaultMaxTokenLen.
        name: MaxTokenLen
        type: int
      - doc: |-
          MaxClaimDepth bounds the claims' JSON nesting. Zero means
          DefaultMaxClaimDepth.
        name: MaxClaimDepth
        type: int
      - doc: AllowMissingExpiry accepts a token with no "exp".
        name: AllowMissingExpiry
        type: bool
      - doc: |-
          Clock is the time source for the temporal claims. Nil means
          clock.System; a clock.ManualClock makes an expiry test deterministic.
        name: Clock
        type: clock.Clock
    kind: struct
    methods:
      - doc: |-
          verifying projects the PASETO config onto the shared verification policy, so
          the temporal and identity rules are written once for both formats.
        name: verifying
        recv: c PasetoVerifierConfig
        results: VerifierConfig
    name: PasetoVerifierConfig
  - doc: |-
      policyValue is a VerifierConfig with every knob validated and every default
      resolved. It exists so a misconfiguration is a constructor error rather than
      a surprise on the first request (ADR 0031).
    fields:
      - doc: issuer / audience / requireType are the configured expectations.
        name: issuer
        type: string
      - doc: issuer / audience / requireType are the configured expectations.
        name: audience
        type: string
      - doc: issuer / audience / requireType are the configured expectations.
        name: requireType
        type: string
      - doc: leeway is the validated skew allowance.
        name: leeway
        type: time.Duration
      - doc: maxLifetime is the validated exp-iat cap, zero when unchecked.
        name: maxLifetime
        type: time.Duration
      - doc: maxTokenLen / maxClaimDepth / maxKeyCandidates are the resolved bounds.
        name: maxTokenLen
        type: int
      - doc: maxTokenLen / maxClaimDepth / maxKeyCandidates are the resolved bounds.
        name: maxClaimDepth
        type: int
      - doc: maxTokenLen / maxClaimDepth / maxKeyCandidates are the resolved bounds.
        name: maxKeyCandidates
        type: int
      - doc: allowMissingExpiry mirrors the config knob.
        name: allowMissingExpiry
        type: bool
      - doc: timeSource is the resolved clock, never nil.
        name: timeSource
        type: clock.Clock
    kind: struct
    methods:
      - doc: |-
          judgeInto holds an AUTHENTICATED claims object to the one refusal set, then
          to the policy, then stores it in dst: the caller's claims come last, so an
          overflow never hides a policy verdict.
        name: judgeInto
        params: raw []byte, dst *coretoken.ClaimsBuf
        recv: p policyValue
        results: error
      - doc: |-
          checkHeader enforces the algorithm binding and the typing policy.

          This is the algorithm-confusion gate. It COMPARES the header against the
          algorithm the verifier was constructed with; it never uses the header to
          choose a key, an algorithm or a branch. It runs before any key material
          reaches any primitive.
        name: checkHeader
        params: header headerValue, bound coretoken.Algorithm
        recv: p policyValue
        results: error
      - doc: |-
          checkHeaderView is checkHeader over a header the scanner read, compared
          literal against expectation without decoding anything.
        name: checkHeaderView
        params: view *headerView, bound coretoken.Algorithm
        recv: p policyValue
        results: error
      - doc: |-
          judgeHeader returns the first verdict facts earn, in the one order every
          path applies.
        name: judgeHeader
        params: facts headerFacts, bound coretoken.Algorithm
        recv: p policyValue
        results: error
      - doc: |-
          decodeAndValidate turns an AUTHENTICATED payload segment into claims and
          applies the policy. It is only ever called after a signature has verified.
        name: decodeAndValidate
        params: payload string, shape claimShape
        recv: p policyValue
        results: claims coretoken.ClaimsValue, err error
      - doc: parseJWS splits, decodes and reads a compact token without consulting a key.
        name: parseJWS
        params: tok string
        recv: p policyValue
        results: parts jwsPartsValue, err error
      - doc: |-
          validateClaims applies the policy's temporal and identity checks to an
          already-authenticated claim set, returning the first verdict that refuses it.
        name: validateClaims
        params: claims coretoken.ClaimsValue
        recv: p policyValue
        results: error
      - doc: |-
          judgeClaims returns the first verdict facts earn.

          The order is cheapest-and-most-common first: a token is far more often
          expired than addressed to the wrong service.
        name: judgeClaims
        params: facts claimFacts
        recv: p policyValue
        results: error
      - doc: |-
          checkExpiry enforces the exp claim and the profile's requirement that one be
          present.

          RFC 7519 §4.1.4 makes "exp" OPTIONAL, which means a conforming token can be
          valid forever. A bearer token that never expires is a password with no
          rotation story, so the default here inverts the RFC's optionality — and the
          opt-out is a named field rather than a silent absence.
        name: checkExpiry
        params: exp, now time.Time
        recv: p policyValue
        results: error
      - doc: |-
          checkLifetime enforces MaxLifetime over the exp-iat span.

          It requires "iat". A token with an expiry but no issue time has a validity
          window this recipient cannot measure, and "I could not measure it" is not a
          reason to accept it — the whole point of the cap is to refuse a credential
          that outlives the recipient's tolerance for one it cannot revoke.
        name: checkLifetime
        params: exp, iat time.Time
        recv: p policyValue
        results: error
    name: policyValue
  - doc: |-
      claimFacts is what the policy judges, whichever reader produced it: the
      three instants, and whether the issuer and the audience matched what the
      recipient configured.
    fields:
      - doc: |-
          expiry / notBefore / issuedAt are the registered instants, zero when
          absent.
        name: expiry
        type: time.Time
      - doc: |-
          expiry / notBefore / issuedAt are the registered instants, zero when
          absent.
        name: notBefore
        type: time.Time
      - doc: |-
          expiry / notBefore / issuedAt are the registered instants, zero when
          absent.
        name: issuedAt
        type: time.Time
      - doc: "issuerOK: no issuer is configured, or \"iss\" equals it."
        name: issuerOK
        type: bool
      - doc: "audienceOK: no audience is configured, or \"aud\" contains it."
        name: audienceOK
        type: bool
    kind: struct
    name: claimFacts
  - fields:
      - doc: Issuer, when non-empty, must equal the token's "iss" (RFC 8725 §3.8).
        name: Issuer
        type: string
      - doc: |-
          Audience, when non-empty, must appear in the token's "aud"
          (RFC 8725 §3.9). A correctly signed token minted for another API is not
          a valid token here.
        name: Audience
        type: string
      - doc: |-
          RequireType, when non-empty, must equal the JWS "typ" header. It is the
          mechanism RFC 8725 §3.12 asks for: two kinds of token from one issuer
          need validation rules that reject each other's tokens.
        name: RequireType
        type: string
      - doc: |-
          Leeway is the clock-skew allowance applied to "exp" and "nbf". It must
          be in [0, MaxLeeway].
        name: Leeway
        type: time.Duration
      - doc: |-
          MaxLifetime, when positive, refuses an authenticated token whose
          exp-iat span exceeds it. It requires "iat": a lifetime that cannot be
          computed is not a lifetime this recipient has accepted.
        name: MaxLifetime
        type: time.Duration
      - doc: |-
          MaxTokenLen bounds the token string. Zero means DefaultMaxTokenLen; a
          value outside [MinTokenLen, MaxTokenLenCeiling] is refused.
        name: MaxTokenLen
        type: int
      - doc: |-
          MaxClaimDepth bounds the claims' JSON nesting. Zero means
          DefaultMaxClaimDepth; a value outside [1, MaxClaimDepthCeiling] is
          refused.
        name: MaxClaimDepth
        type: int
      - doc: |-
          MaxKeyCandidates bounds how many keys a set verifier tries for one kid.
          Zero means DefaultMaxKeyCandidates. Ignored by single-key verifiers.
        name: MaxKeyCandidates
        type: int
      - doc: |-
          AllowMissingExpiry accepts a token with no "exp". The zero value is
          false, so the profile that RFC 7519 §4.1.4 leaves optional is required
          here unless the caller opts out by name.
        name: AllowMissingExpiry
        type: bool
      - doc: |-
          Clock is the time source for the temporal claims. Nil means
          clock.System; a clock.ManualClock makes an expiry test deterministic
          without sleeping.
        name: Clock
        type: clock.Clock
    kind: struct
    name: VerifierConfig
vars:
  - doc: registeredNames spells each slot.
    items:
      - name: registeredNames
        value: |-
          [registeredSlots]string{
          	coretoken.ClaimIssuer, coretoken.ClaimSubject, coretoken.ClaimAudience,
          	coretoken.ClaimExpiry, coretoken.ClaimNotBefore, coretoken.ClaimIssuedAt,
          	coretoken.ClaimID,
          }
    name: registeredNames
  - doc: |-
      b64 is the ONLY base64 alphabet this package accepts: unpadded base64url
      (RFC 7515 §2), in Strict mode.

      Strict matters. Without it, Go accepts a final quantum whose unused bits are
      non-zero, so two different strings decode to the same octets — and a token is
      a string somebody may have already keyed a cache, a replay table or a
      revocation list on. One encoding, one spelling.
    items:
      - name: b64
        value: base64.RawURLEncoding.Strict()
    name: b64
  - doc: |-
      p256HalfOrder is n/2 for P-256. An ECDSA signature (r, s) verifies exactly
      as (r, n−s) does, so the signer writes the low-S form (s at most n/2): a
      token THIS SDK signs has one spelling. The verifier accepts both forms —
      RFC 7518 §3.4 does not require low S, and most producers, crypto/ecdsa
      included, emit a high s about half the time, so refusing it would refuse
      valid tokens from every external issuer. A token string is therefore not a
      key for a revocation or replay list; jti, or the claims, are.
    items:
      - name: p256HalfOrder
        value: new(big.Int).Rsh(elliptic.P256().Params().N, 1)
    name: p256HalfOrder
  - doc: |-
      pasetoVersions is the closed set of versions the PASETO specification
      defines. It is hoisted so recognising one allocates nothing per token.
    items:
      - name: pasetoVersions
        value: "[]string{\"v1\", \"v2\", \"v3\", \"v4\"}"
    name: pasetoVersions
  - doc: |-
      Compile-time assertions that every implementation satisfies the contract it
      claims — the build fails before any test runs if an interface and one of its
      implementations drift apart. Collecting them makes the set greppable: every
      type that must satisfy a port is named here, so a port that quietly lost an
      implementation is one diff away from being visible. hs256Binding is asserted
      against BOTH halves on purpose — HMAC is symmetric, so a verifier can also
      mint, and that is the property a caller should have to notice.
    grouped: true
    items:
      - name: _
        type: signingKey
        value: hs256Binding{}
      - name: _
        type: verifyingKey
        value: hs256Binding{}
      - name: _
        type: signingKey
        value: es256Signing{}
      - name: _
        type: verifyingKey
        value: es256Verifying{}
      - name: _
        type: signingKey
        value: ed25519Signing{}
      - name: _
        type: verifyingKey
        value: ed25519Verifying{}
      - name: _
        type: claimShape
        value: joseShape{}
      - name: _
        type: claimShape
        value: pasetoShape{}
      - name: _
        type: coretoken.Issuer
        value: (*jwsIssuer)(nil)
      - name: _
        type: coretoken.Issuer
        value: (*pasetoIssuer)(nil)
      - name: _
        type: coretoken.Verifier
        value: (*jwsVerifier)(nil)
      - name: _
        type: coretoken.Verifier
        value: (*pasetoVerifier)(nil)
      - name: _
        type: coretoken.Verifier
        value: (*setVerifier)(nil)
      - name: _
        type: coretoken.Verifier
        value: (*hs256Verifier)(nil)
      - name: _
        type: coretoken.VerifierInto
        value: (*hs256Verifier)(nil)
    name: _
