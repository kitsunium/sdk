# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      maxClaimMembers is the largest member count a claims object may carry: the
      seven registered names plus the private-claim cap the core value enforces.
    items:
      - name: maxClaimMembers
        type: int
        value: 7 + coretoken.MaxPrivateClaims
    name: maxClaimMembers
  - grouped: true
    items:
      - doc: |-
          maxSegments is the largest dot-separated part count any format here
          uses: PASETO with a footer. JWS compact uses three.
        name: maxSegments
        type: int
        value: "4"
      - doc: le64Width is the octet width of PASETO's LE64 length prefix.
        name: le64Width
        type: int
        value: "8"
      - doc: |-
          le64SignMask clears the most significant bit, as PASETO's LE64 requires,
          so the encoding stays unambiguous where integers are signed.
        name: le64SignMask
        type: uint64
        value: "0x7FFF_FFFF_FFFF_FFFF"
    name: maxSegments
  - doc: |-
      exitConfigFault matches sysexits EX_CONFIG (78), the exit code core/security/token's
      KeyUnsuitable / PolicyMisconfigured / IssueFailed sentinels carry. It is
      restated here so a stdlib cause wrapped through WrapParams — the one path
      that cannot inherit an exit override — lands on the same number its sibling
      sentinel would have produced.
    items:
      - name: exitConfigFault
        type: int
        value: "78"
    name: exitConfigFault
  - doc: |-
      maxNumericDate bounds a JWT NumericDate, in seconds since the epoch. It is
      roughly the year 5138 — far past any legitimate expiry, and far short of the
      values that make time.Unix overflow into a negative instant. A bound is
      needed because "exp": 1e300 is valid JSON, and an implementation that lets
      it through has a token that is not expired for reasons of floating point.
    items:
      - name: maxNumericDate
        type: float64
        value: "1e11"
    name: maxNumericDate
  - grouped: true
    items:
      - doc: |-
          firstPrintable is the lowest byte JSON may carry unescaped in a string;
          everything below it needs the \u00XX form (RFC 8259 §7).
        name: firstPrintable
        type: byte
        value: "0x20"
      - doc: lowNibbleMask selects the low four bits of a byte.
        name: lowNibbleMask
        type: byte
        value: "0x0F"
      - doc: nibbleBits is how far to shift a byte to reach its high nibble.
        name: nibbleBits
        type: byte
        value: "4"
      - doc: |-
          decimalDigits is the number of decimal digits, i.e. where hex letters
          start when rendering a nibble.
        name: decimalDigits
        type: byte
        value: "10"
      - doc: |-
          quoteOverhead is the two delimiting quotes a JSON string literal adds
          around its content.
        name: quoteOverhead
        type: int
        value: "2"
    name: firstPrintable
  - grouped: true
    items:
      - doc: |-
          jwsSegments is the segment count of a JWS Compact Serialization:
          header, payload, signature.
        name: jwsSegments
        type: int
        value: "3"
      - doc: headerSegment indexes the JOSE header segment.
        name: headerSegment
        type: int
        value: "0"
      - doc: payloadSegment indexes the claims segment.
        name: payloadSegment
        type: int
        value: "1"
      - doc: signatureSegment indexes the signature segment.
        name: signatureSegment
        type: int
        value: "2"
      - doc: |-
          maxSignatureLen bounds a decoded signature. The widest algorithm here
          produces 64 octets; the slack costs nothing and the bound is what stops
          a megabyte "signature" from being decoded before it is rejected.
        name: maxSignatureLen
        type: int
        value: "256"
      - doc: |-
          maxHeaderDepth bounds the JOSE header's JSON nesting. A header is a flat
          object of scalars plus at most the "crit" array.
        name: maxHeaderDepth
        type: int
        value: "4"
      - doc: |-
          defaultType is the "typ" an issuer stamps when the config names none
          (RFC 7519 §5.1).
        name: defaultType
        type: string
        value: "\"JWT\""
      - doc: |-
          algNone is the unsecured algorithm of RFC 7519 §6, matched
          case-insensitively so "None" and "NONE" get the verdict they deserve
          rather than the generic mismatch.
        name: algNone
        type: string
        value: "\"none\""
    name: jwsSegments
  - grouped: true
    items:
      - doc: |-
          p256CoordLen is the fixed octet width of a P-256 field element.
          RFC 7518 §3.4 requires each half of an ES256 signature to be exactly
          this wide, left-padded — a "compact" 31-octet R is a different number,
          not a tidier one.
        name: p256CoordLen
        type: int
        value: "32"
      - doc: "p256SigLen is the total ES256 signature width: R||S, both fixed."
        name: p256SigLen
        type: int
        value: 2 * p256CoordLen
    name: p256CoordLen
  - grouped: true
    items:
      - doc: |-
          pasetoV4PublicHeader is the version+purpose prefix, INCLUDING the
          trailing separator, exactly as it is fed to the pre-authentication
          encoding. Signing the header is what stops a v4.public token from being
          replayed as any other version or purpose.
        name: pasetoV4PublicHeader
        type: string
        value: "\"v4.public.\""
      - doc: |-
          pasetoMinSegments is a v4.public token with no footer: "v4", "public",
          payload.
        name: pasetoMinSegments
        type: int
        value: "3"
      - doc: pasetoMaxSegments adds the optional footer.
        name: pasetoMaxSegments
        type: int
        value: "4"
      - doc: pasetoVersionSegment indexes the version part ("v4").
        name: pasetoVersionSegment
        type: int
        value: "0"
      - doc: pasetoPurposeSegment indexes the purpose part ("public").
        name: pasetoPurposeSegment
        type: int
        value: "1"
      - doc: pasetoBodySegment indexes the payload+signature part.
        name: pasetoBodySegment
        type: int
        value: "2"
      - doc: pasetoFooterSegment indexes the optional footer part.
        name: pasetoFooterSegment
        type: int
        value: "3"
      - doc: pasetoSigLen is the Ed25519 signature width appended to the payload.
        name: pasetoSigLen
        type: int
        value: ed25519.SignatureSize
      - doc: |-
          maxFooterLen bounds a decoded footer. A footer carries a key id or a
          small hint; it is not a second payload. Every verifier here refuses a
          longer one as TooLarge before looking at its signature, so both
          constructors refuse to be CONFIGURED with one (see checkFooterLen).
        name: maxFooterLen
        type: int
        value: 1 << 10
    name: pasetoV4PublicHeader
  - grouped: true
    items:
      - doc: |-
          DefaultMaxTokenLen is the token-string bound applied when a config
          leaves MaxTokenLen at zero. 8 KiB comfortably holds an OIDC ID token
          with a certificate thumbprint; it does not hold an attack.
        name: DefaultMaxTokenLen
        type: int
        value: 8 << 10
      - doc: |-
          MinTokenLen is the floor a configured MaxTokenLen may not go below. A
          bound smaller than this would reject every real token, which is a
          configuration mistake worth naming rather than a policy.
        name: MinTokenLen
        type: int
        value: "64"
      - doc: |-
          MaxTokenLenCeiling is the ceiling a configured MaxTokenLen may not
          exceed. There is no legitimate multi-megabyte bearer token, and the
          ceiling is what keeps "configurable" from meaning "unbounded".
        name: MaxTokenLenCeiling
        type: int
        value: 1 << 20
      - doc: |-
          DefaultMaxClaimDepth is the JSON nesting bound applied when a config
          leaves MaxClaimDepth at zero.
        name: DefaultMaxClaimDepth
        type: int
        value: "16"
      - doc: |-
          MaxClaimDepthCeiling is the ceiling a configured MaxClaimDepth may not
          exceed.
        name: MaxClaimDepthCeiling
        type: int
        value: "64"
      - doc: |-
          DefaultMaxKeyCandidates is how many keys a set verifier will try for one
          "kid" when the config leaves MaxKeyCandidates at zero. A rotation window
          holds two; four leaves room for a slow rollover without turning a
          published JWK Set into a signature-verification multiplier.
        name: DefaultMaxKeyCandidates
        type: int
        value: "4"
      - doc: |-
          MaxKeyCandidatesCeiling caps MaxKeyCandidates. Trying keys IS signature
          verification, the expensive half of this package; a publisher who can
          name the candidate count can name the cost.
        name: MaxKeyCandidatesCeiling
        type: int
        value: "16"
      - doc: |-
          maxHeaderLen bounds the DECODED JOSE header. A header carries an alg, a
          typ and a kid; anything larger is not a header this package will read.
        name: maxHeaderLen
        type: int
        value: 4 << 10
      - doc: decimalBase is the radix every integer this package renders uses.
        name: decimalBase
        type: int
        value: "10"
    name: DefaultMaxTokenLen
  - doc: |-
      MaxLeeway is the largest clock-skew allowance a verifier accepts.

      Leeway exists because two hosts disagree about the time by seconds. A leeway
      measured in hours is not skew tolerance, it is an expiry claim that has been
      quietly disabled — so the constructor refuses it rather than honouring a
      value whose effect the caller almost certainly did not intend (ADR 0031).
    items:
      - name: MaxLeeway
        type: time.Duration
        value: 5 * time.Minute
    name: MaxLeeway
