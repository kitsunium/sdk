      - switch:
          cases:
            - case: "'\"'"
              do:
                - set: s.inString
                  value: "true"
            - case: "'{', '['"
              do:
                - op: ++
                  set: s.depth
            - case: "'}', ']'"
              do:
                - op: "--"
                  set: s.depth
          "on": char
