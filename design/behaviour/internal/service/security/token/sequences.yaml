      - id: caller
        kind: actor
      - id: quoteJSONStrings
        kind: self
      - id: builder.WriteByte
        kind: value
      - id: builder.WriteString
        kind: value
      - id: builder.String
        kind: value
    steps:
      - var:
          name: builder
          type: strings.Builder
      - eval: builder.WriteByte('[')
        to: builder.WriteByte
      - loop:
          do:
            - opt:
                do:
                  - eval: builder.WriteByte(',')
                    to: builder.WriteByte
                when: i > 0
            - eval: builder.WriteString(quoteJSONString(value))
              to: builder.WriteString
          key: i
          range: values
          value: value
      - eval: builder.WriteByte(']')
        to: builder.WriteByte
      - return: builder.String()
        to: builder.String
  - of: writeJSONStringByte
    participants:
      - id: caller
        kind: actor
      - id: writeJSONStringByte
        kind: self
      - id: builder.WriteByte
        kind: value
      - id: builder.WriteString
        kind: value
