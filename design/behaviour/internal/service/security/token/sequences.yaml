    steps:
      - opt:
          do:
            - return: "'0' + nibble"
          when: nibble < decimalDigits
      - return: "'a' + nibble - decimalDigits"
  - of: NewVerifierFromJWK
    participants:
      - id: caller
        kind: actor
      - id: NewVerifierFromJWK
        kind: self
      - id: bindJWK
        kind: internal
      - id: newJWSVerifier
        kind: internal
    steps:
      - bind: binding, berr
        eval: bindJWK(key)
        to: bindJWK
      - opt:
          do:
            - return: nil, berr
          when: berr != nil
      - return: newJWSVerifier(binding, cfg)
        to: newJWSVerifier
  - of: NewSetVerifier
    participants:
      - id: caller
        kind: actor
      - id: NewSetVerifier
        kind: self
      - id: newPolicy
        kind: internal
      - id: indexByKid
        kind: internal
    steps:
      - bind: policy, perr
        eval: newPolicy(cfg)
        to: newPolicy
      - opt:
          do:
            - return: nil, perr
          when: perr != nil
      - opt:
          do:
            - return: |-
                nil, errs.Wrap(coretoken.PolicyMisconfigured, errs.WrapParams{},
                			errs.String("knob", "empty JWK Set"))
          when: set.Len() == 0
      - bind: index
        eval: indexByKid(set)
        to: indexByKid
      - opt:
          do:
            - return: nil, unverifiableSet(set.Len(), indexedCount(index))
          when: "!selectable(index)"
      - return: "&setVerifier{byKid: index, policy: policy}, nil"
  - of: indexedCount
    steps:
      - bind: count
        eval: "0"
      - loop:
          do:
            - op: +=
              set: count
              value: len(group)
          key: _
          range: index
          value: group
      - return: count
  - of: unverifiableSet
    participants:
      - id: caller
        kind: actor
      - id: unverifiableSet
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(nil, errs.WrapParams{
          		Code:     coretoken.PolicyMisconfigured.Code(),
          		Reason:   coretoken.PolicyMisconfigured.Reason(),
          		Public:   coretoken.PolicyMisconfigured.Public(),
          		Private:  "service/security/token: no JWK Set member has both a kid and a key this package verifies with; a key published without a kid is verified with NewVerifierFromJWK",
          		ExitCode: coretoken.PolicyMisconfigured.ExitCode(),
          	}, errs.String("knob", "JWK Set"), errs.Int("members", members), errs.Int("members_with_kid", withKid))
        to: errs
  - of: indexByKid
    participants:
      - id: caller
        kind: actor
      - id: indexByKid
        kind: self
      - id: key.Kid
        kind: value
      - id: bindJWK
        kind: internal
    steps:
      - bind: index
        eval: make(map[string][]boundKeyValue, len(set.Keys()))
      - loop:
          do:
            - bind: kid
              eval: key.Kid()
              to: key.Kid
            - opt:
                do:
                  - continue: true
                when: kid == ""
            - bind: binding, berr
              eval: bindJWK(key)
              to: bindJWK
            - set: index[kid]
              value: "append(index[kid], boundKeyValue{binding: binding, usable: berr == nil})"
          key: _
          range: set.Keys()
          value: key
      - return: index
  - of: (*setVerifier).Verify
    participants:
      - id: caller
        kind: actor
      - id: (*setVerifier).Verify
        kind: self
      - id: v.policy.parseJWS
        kind: internal
      - id: refuseUnsecured
        kind: internal
      - id: v.candidates
        kind: internal
      - id: v.tryCandidates
        kind: internal
    steps:
      - bind: parts, perr
        eval: v.policy.parseJWS(token)
        to: v.policy.parseJWS
      - opt:
          do:
            - return: coretoken.ClaimsValue{}, perr
          when: perr != nil
      - opt:
          do:
            - return: coretoken.ClaimsValue{}, uerr
          init:
            bind: uerr
            eval: refuseUnsecured(parts.header)
            to: refuseUnsecured
          when: uerr != nil
      - bind: candidates, cerr
        eval: v.candidates(parts.header.kid)
        to: v.candidates
      - opt:
          do:
            - return: coretoken.ClaimsValue{}, cerr
          when: cerr != nil
      - return: v.tryCandidates(parts, candidates)
        to: v.tryCandidates
  - of: (*setVerifier).tryCandidates
    participants:
      - id: caller
        kind: actor
      - id: (*setVerifier).tryCandidates
        kind: self
      - id: v.policy.checkHeader
        kind: internal
      - id: v.policy.decodeAndValidate
        kind: internal
    steps:
      - var:
          name: headerErr
          type: error
      - bind: headerPassed
        eval: "false"
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: "!candidate.usable"
            - opt:
                do:
                  - opt:
                      do:
                        - set: headerErr
                          value: herr
                      when: headerErr == nil
                  - continue: true
                init:
                  bind: herr
                  eval: v.policy.checkHeader(parts.header, candidate.binding.algorithm())
                  to: v.policy.checkHeader
                when: herr != nil
            - set: headerPassed
              value: "true"
            - opt:
                do:
                  - return: v.policy.decodeAndValidate(parts.payload, joseShape{})
                    to: v.policy.decodeAndValidate
                when: candidate.binding.verify(parts.input, parts.signature)
          key: _
          range: candidates
          value: candidate
      - opt:
          do:
            - return: coretoken.ClaimsValue{}, headerErr
          when: "!headerPassed && headerErr != nil"
      - return: coretoken.ClaimsValue{}, coretoken.SignatureInvalid
  - of: (*setVerifier).candidates
    steps:
      - opt:
          do:
            - return: nil, coretoken.KeyIDMissing
          when: kid == ""
      - bind: matches
        eval: v.byKid[kid]
      - opt:
          do:
            - return: nil, coretoken.KeyNotFound
          when: len(matches) == 0
      - opt:
          do:
            - return: |-
                nil, errs.Wrap(coretoken.KeyIDAmbiguous, errs.WrapParams{},
                			errs.Int("limit", v.policy.maxKeyCandidates))
          when: len(matches) > v.policy.maxKeyCandidates
      - return: matches, nil
  - of: bindJWK
    participants:
      - id: caller
        kind: actor
      - id: bindJWK
        kind: self
      - id: checkJWKUsage
        kind: internal
      - id: bindOctJWK
        kind: internal
      - id: bindECJWK
        kind: internal
      - id: bindOKPJWK
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, uerr
          init:
            bind: uerr
            eval: checkJWKUsage(key)
            to: checkJWKUsage
          when: uerr != nil
      - switch:
          cases:
            - case: key.Kty() == jwk.TypeOct
              do:
                - return: bindOctJWK(key)
                  to: bindOctJWK
            - case: key.Kty() == jwk.TypeEC && key.Crv() == jwk.CurveP256
              do:
                - return: bindECJWK(key)
                  to: bindECJWK
            - case: key.Kty() == jwk.TypeOKP && key.Crv() == jwk.CurveEd25519
              do:
                - return: bindOKPJWK(key)
                  to: bindOKPJWK
            - default: true
              do:
                - return: nil, keyUnsuitable("no token algorithm for this kty/crv")
  - of: bindOctJWK
    participants:
      - id: caller
        kind: actor
      - id: bindOctJWK
        kind: self
      - id: key.Secret
        kind: value
      - id: bindSecret
        kind: internal
    steps:
      - bind: secret, serr
        eval: key.Secret()
        to: key.Secret
      - opt:
          do:
            - return: nil, keyUnsuitable("oct JWK is not a 256-bit symmetric key")
          when: serr != nil
      - return: bindSecret(secret)
        to: bindSecret
  - of: bindECJWK
    participants:
      - id: caller
        kind: actor
      - id: bindECJWK
        kind: self
      - id: key.ECDSAPublic
        kind: value
      - id: x509
        kind: stdlib
      - id: bindP256Public
        kind: internal
    steps:
      - bind: der, derr
        eval: key.ECDSAPublic()
        to: key.ECDSAPublic
      - opt:
          do:
            - return: nil, keyUnsuitable("EC JWK does not render a PKIX public key")
          when: derr != nil
      - bind: parsed, perr
        eval: x509.ParsePKIXPublicKey(der)
        to: x509
      - opt:
          do:
            - return: nil, keyUnsuitable("PKIX round-trip of an EC JWK failed")
          when: perr != nil
      - bind: public, isECDSA
        eval: parsed.(*ecdsa.PublicKey)
      - opt:
          do:
            - return: nil, keyUnsuitable("EC JWK did not decode to an ECDSA public key")
          when: "!isECDSA"
      - return: bindP256Public(public)
        to: bindP256Public
  - of: bindOKPJWK
    participants:
      - id: caller
        kind: actor
      - id: bindOKPJWK
        kind: self
      - id: key.Ed25519Public
        kind: value
      - id: bindEd25519Public
        kind: internal
    steps:
      - bind: public, perr
        eval: key.Ed25519Public()
        to: key.Ed25519Public
      - opt:
          do:
            - return: nil, keyUnsuitable("OKP JWK does not render an Ed25519 public key")
          when: perr != nil
      - return: bindEd25519Public(public, coretoken.AlgorithmEdDSA)
        to: bindEd25519Public
  - of: checkJWKUsage
    participants:
      - id: caller
        kind: actor
      - id: checkJWKUsage
        kind: self
      - id: key.Use
        kind: value
      - id: keyUnsuitable
        kind: internal
      - id: key.KeyOps
        kind: value
      - id: impliedAlg
        kind: internal
      - id: key.Alg
        kind: value
    steps:
      - opt:
          do:
            - return: keyUnsuitable("JWK use is not sig")
              to: keyUnsuitable
          init:
            bind: use
            eval: key.Use()
            to: key.Use
          when: use != "" && use != "sig"
      - opt:
          do:
            - return: keyUnsuitable("JWK key_ops does not include verify")
              to: keyUnsuitable
          init:
            bind: ops
            eval: key.KeyOps()
            to: key.KeyOps
          when: len(ops) != 0 && !slices.Contains(ops, "verify")
      - bind: implied, known
        eval: impliedAlg(key)
        to: impliedAlg
      - opt:
          do:
            - return: keyUnsuitable("JWK alg contradicts its kty/crv")
              to: keyUnsuitable
          init:
            bind: alg
            eval: key.Alg()
            to: key.Alg
          when: alg != "" && (!known || alg != implied)
      - return: nil
  - of: impliedAlg
    participants:
      - id: caller
        kind: actor
      - id: impliedAlg
        kind: self
      - id: coretoken.AlgorithmHS256.String
        kind: value
      - id: coretoken.AlgorithmES256.String
        kind: value
      - id: coretoken.AlgorithmEdDSA.String
        kind: value
    steps:
      - switch:
          cases:
            - case: key.Kty() == jwk.TypeOct
              do:
                - return: coretoken.AlgorithmHS256.String(), true
                  to: coretoken.AlgorithmHS256.String
            - case: key.Kty() == jwk.TypeEC && key.Crv() == jwk.CurveP256
              do:
                - return: coretoken.AlgorithmES256.String(), true
                  to: coretoken.AlgorithmES256.String
            - case: key.Kty() == jwk.TypeOKP && key.Crv() == jwk.CurveEd25519
              do:
                - return: coretoken.AlgorithmEdDSA.String(), true
                  to: coretoken.AlgorithmEdDSA.String
            - default: true
              do:
                - return: "\"\", false"
  - of: readJOSEHeader
    participants:
      - id: caller
        kind: actor
      - id: readJOSEHeader
        kind: self
      - id: checkJSONDepth
        kind: internal
      - id: scanObject
        kind: internal
      - id: headerMember
        kind: internal
    steps:
      - opt:
          do:
            - return: headerView{}, malformed("JOSE header is not UTF-8")
          when: "!utf8.Valid(raw)"
      - opt:
          do:
            - return: headerView{}, derr
          init:
            bind: derr
            eval: checkJSONDepth(raw, maxHeaderDepth)
            to: checkJSONDepth
          when: derr != nil
      - var:
          name: idx
          type: objectIndex
      - opt:
          do:
            - return: headerView{}, serr
          init:
            bind: serr
            eval: scanObject(raw, maxHeaderDepth, &idx)
            to: scanObject
          when: serr != nil
      - var:
          name: merr
          type: error
      - opt:
          do:
            - return: headerView{}, merr
          init:
            bind: view.alg, merr
            eval: headerMember(raw, &idx, "alg")
            op: =
            to: headerMember
          when: merr != nil
      - opt:
          do:
            - return: headerView{}, merr
          init:
            bind: view.typ, merr
            eval: headerMember(raw, &idx, "typ")
            op: =
            to: headerMember
          when: merr != nil
      - opt:
          do:
            - return: headerView{}, merr
          init:
            bind: view.kid, merr
            eval: headerMember(raw, &idx, "kid")
            op: =
            to: headerMember
          when: merr != nil
      - set: view.critical
        value: idx.lookup(raw, "crit") >= 0
      - return: view, nil
  - of: headerMember
    participants:
      - id: caller
        kind: actor
      - id: headerMember
        kind: self
      - id: idx.lookup
        kind: internal
      - id: idx.value
        kind: internal
    steps:
      - bind: at
        eval: idx.lookup(raw, name)
        to: idx.lookup
      - opt:
          do:
            - return: nil, nil
          when: at < 0 || idx.member[at].kind == kindNull
      - opt:
          do:
            - return: nil, malformed("registered claim " + name + " is not a string")
          when: idx.member[at].kind != kindString
      - return: idx.value(raw, at), nil
        to: idx.value
  - of: parseJOSEHeader
    participants:
      - id: caller
        kind: actor
      - id: parseJOSEHeader
        kind: self
      - id: readJOSEHeader
        kind: internal
    steps:
      - bind: view, rerr
        eval: readJOSEHeader(raw)
        to: readJOSEHeader
      - opt:
          do:
            - return: headerValue{}, rerr
          when: rerr != nil
      - return: |-
          headerValue{
          		alg: headerText(view.alg), typ: headerText(view.typ),
          		kid: headerText(view.kid), critical: view.critical,
          	}, nil
  - of: headerText
    participants:
      - id: caller
        kind: actor
      - id: headerText
        kind: self
      - id: decodeText
        kind: internal
    steps:
      - var:
          name: text
          type: string
      - opt:
          do:
            - return: text
          when: lit == nil
      - bind: body
        eval: "lit[1 : len(lit)-1]"
      - loop:
          do:
            - opt:
                do:
                  - return: known
                when: bytes.Equal(body, []byte(known))
          key: _
          range: "[...]string{\"HS256\", \"ES256\", \"EdDSA\", defaultType}"
          value: known
      - return: decodeText(lit)
        to: decodeText
  - of: policyValue.checkHeader
    participants:
      - id: caller
        kind: actor
      - id: policyValue.checkHeader
        kind: self
      - id: p.judgeHeader
        kind: internal
    steps:
      - return: |-
          p.judgeHeader(factIf(strings.EqualFold(header.alg, algNone), factUnsecured)|
          		factIf(header.alg == "", factAlgEmpty)|
          		factIf(header.alg == bound.String(), factAlgBound)|
          		factIf(header.critical, factCritical)|
          		factIf(p.requireType == "" || header.typ == p.requireType, factTypeOK), bound)
        to: p.judgeHeader
  - of: policyValue.checkHeaderView
    participants:
      - id: caller
        kind: actor
      - id: policyValue.checkHeaderView
        kind: self
      - id: p.judgeHeader
        kind: internal
    steps:
      - return: |-
          p.judgeHeader(factIf(literalIsNone(view.alg), factUnsecured)|
          		factIf(literalEqual(view.alg, ""), factAlgEmpty)|
          		factIf(literalEqual(view.alg, bound.String()), factAlgBound)|
          		factIf(view.critical, factCritical)|
          		factIf(p.requireType == "" || literalEqual(view.typ, p.requireType), factTypeOK), bound)
        to: p.judgeHeader
  - of: factIf
    steps:
      - opt:
          do:
            - return: "0"
          when: "!held"
      - return: fact
  - of: headerFacts.has
    steps:
      - return: h&fact == fact
  - of: policyValue.judgeHeader
    participants:
      - id: caller
        kind: actor
      - id: policyValue.judgeHeader
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: coretoken.AlgorithmNone
          when: facts.has(factUnsecured)
      - opt:
          do:
            - return: coretoken.Malformed
          when: facts.has(factAlgEmpty)
      - opt:
          do:
            - return: |-
                errs.Wrap(coretoken.AlgorithmMismatch, errs.WrapParams{},
                			errs.String("expected", bound.String()))
              to: errs
          when: "!facts.has(factAlgBound)"
      - opt:
          do:
            - return: coretoken.HeaderUnsupported
          when: facts.has(factCritical)
      - opt:
          do:
            - return: |-
                errs.Wrap(coretoken.HeaderUnsupported, errs.WrapParams{},
                			errs.String("expected_typ", p.requireType))
              to: errs
          when: "!facts.has(factTypeOK)"
      - return: nil
  - of: literalEqual
    participants:
      - id: caller
        kind: actor
      - id: literalEqual
        kind: self
      - id: jsonStringEqual
        kind: internal
    steps:
      - opt:
          do:
            - return: want == ""
          when: lit == nil
      - return: jsonStringEqual(lit, want)
        to: jsonStringEqual
  - of: literalIsNone
    participants:
      - id: caller
        kind: actor
      - id: literalIsNone
        kind: self
      - id: decodeTextInto
        kind: internal
    steps:
      - opt:
          do:
            - return: "false"
          when: lit == nil || len(lit) > 2+4*unicodeEscapeLen
      - var:
          name: buf
          type: "[4 * unicodeEscapeLen]byte"
      - bind: n, ok
        eval: decodeTextInto(buf[:], lit)
        to: decodeTextInto
      - return: ok && n == len(algNone) && bytes.EqualFold(buf[:n], []byte(algNone))
  - of: policyValue.decodeAndValidate
    participants:
      - id: caller
        kind: actor
      - id: policyValue.decodeAndValidate
        kind: self
      - id: decodeSegment
        kind: internal
      - id: decodeClaims
        kind: internal
      - id: p.validateClaims
        kind: internal
    steps:
      - bind: raw, derr
        eval: decodeSegment(payload, p.maxTokenLen)
        to: decodeSegment
      - opt:
          do:
            - return: coretoken.ClaimsValue{}, derr
          when: derr != nil
      - bind: decoded, cerr
        eval: decodeClaims(raw, p.maxClaimDepth, shape)
        to: decodeClaims
      - opt:
          do:
            - return: coretoken.ClaimsValue{}, cerr
          when: cerr != nil
      - opt:
          do:
            - return: coretoken.ClaimsValue{}, verr
          init:
            bind: verr
            eval: p.validateClaims(decoded)
            to: p.validateClaims
          when: verr != nil
      - return: decoded, nil
  - of: refuseUnsecured
    steps:
      - opt:
          do:
            - return: coretoken.AlgorithmNone
          when: strings.EqualFold(header.alg, algNone)
      - return: nil
  - of: newJWSIssuer
    participants:
      - id: caller
        kind: actor
      - id: newJWSIssuer
        kind: self
      - id: validateIssuerConfig
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, verr
          init:
            bind: verr
            eval: validateIssuerConfig(cfg)
            to: validateIssuerConfig
          when: verr != nil
      - return: |-
          &jwsIssuer{
          		bound: bound, cfg: cfg, timeSource: resolveClock(cfg.Clock),
          		header: b64.EncodeToString([]byte(renderJOSEHeader(bound.algorithm(), cfg))),
          	}, nil
  - of: renderJOSEHeader
    participants:
      - id: caller
        kind: actor
      - id: renderJOSEHeader
        kind: self
      - id: builder.WriteString
        kind: value
      - id: builder.WriteByte
        kind: value
      - id: builder.String
        kind: value
    steps:
      - bind: typ
        eval: cfg.Type
      - opt:
          do:
            - set: typ
              value: defaultType
          when: typ == ""
      - var:
          name: builder
          type: strings.Builder
      - eval: builder.WriteString(`{"alg":`)
        to: builder.WriteString
      - eval: builder.WriteString(quoteJSONString(alg.String()))
        to: builder.WriteString
      - opt:
          do:
            - eval: builder.WriteString(`,"kid":`)
              to: builder.WriteString
            - eval: builder.WriteString(quoteJSONString(cfg.KeyID))
              to: builder.WriteString
          when: cfg.KeyID != ""
      - eval: builder.WriteString(`,"typ":`)
        to: builder.WriteString
      - eval: builder.WriteString(quoteJSONString(typ))
        to: builder.WriteString
      - eval: builder.WriteByte('}')
        to: builder.WriteByte
      - return: builder.String()
        to: builder.String
  - of: (*jwsIssuer).Issue
    participants:
      - id: caller
        kind: actor
      - id: (*jwsIssuer).Issue
        kind: self
      - id: stampIssuedClaims
        kind: internal
      - id: encodeClaims
        kind: internal
      - id: i.bound.sign
        kind: internal
    steps:
      - bind: stamped, serr
        eval: stampIssuedClaims(claims, i.cfg, i.timeSource)
        to: stampIssuedClaims
      - opt:
          do:
            - return: "\"\", serr"
          when: serr != nil
      - bind: payload, cerr
        eval: encodeClaims(stamped, joseShape{})
        to: encodeClaims
      - opt:
          do:
            - return: "\"\", cerr"
          when: cerr != nil
      - bind: input
        eval: i.header + "." + b64.EncodeToString(payload)
      - bind: signature, gerr
        eval: i.bound.sign([]byte(input))
        to: i.bound.sign
      - opt:
          do:
            - return: "\"\", gerr"
          when: gerr != nil
      - return: input + "." + b64.EncodeToString(signature), nil
  - of: policyValue.parseJWS
    participants:
      - id: caller
        kind: actor
      - id: policyValue.parseJWS
        kind: self
      - id: splitCompact
        kind: internal
      - id: parseHeaderSegment
        kind: internal
      - id: decodeSegment
        kind: internal
    steps:
      - bind: seg, serr
        eval: splitCompact(tok, p.maxTokenLen)
        to: splitCompact
      - opt:
          do:
            - return: jwsPartsValue{}, serr
          when: serr != nil
      - opt:
          do:
            - return: jwsPartsValue{}, coretoken.Malformed
          when: seg.count != jwsSegments
      - bind: header, herr
        eval: parseHeaderSegment(seg.part[headerSegment])
        to: parseHeaderSegment
      - opt:
          do:
            - return: jwsPartsValue{}, herr
          when: herr != nil
      - bind: signature, gerr
        eval: decodeSegment(seg.part[signatureSegment], maxSignatureLen)
        to: decodeSegment
      - opt:
          do:
            - return: jwsPartsValue{}, gerr
          when: gerr != nil
      - bind: inputLen
        eval: len(seg.part[headerSegment]) + 1 + len(seg.part[payloadSegment])
      - return: |-
          jwsPartsValue{
          		header: header, payload: seg.part[payloadSegment],
          		input: []byte(tok[:inputLen]), signature: signature,
          	}, nil
  - of: parseHeaderSegment
    participants:
      - id: caller
        kind: actor
      - id: parseHeaderSegment
        kind: self
      - id: decodeSegment
        kind: internal
      - id: parseJOSEHeader
        kind: internal
    steps:
      - bind: raw, derr
        eval: decodeSegment(segment, maxHeaderLen)
        to: decodeSegment
      - opt:
          do:
            - return: headerValue{}, derr
          when: derr != nil
      - return: parseJOSEHeader(raw)
        to: parseJOSEHeader
  - of: newJWSVerifier
    participants:
      - id: caller
        kind: actor
      - id: newJWSVerifier
        kind: self
      - id: newPolicy
        kind: internal
      - id: newHS256Verifier
        kind: internal
    steps:
      - bind: policy, perr
        eval: newPolicy(cfg)
        to: newPolicy
      - opt:
          do:
            - return: nil, perr
          when: perr != nil
      - opt:
          do:
            - return: newHS256Verifier(secret, policy), nil
              to: newHS256Verifier
          init:
            bind: secret, symmetric
            eval: bound.(hs256Binding)
          when: symmetric
      - return: "&jwsVerifier{bound: bound, policy: policy}, nil"
