                  - op: ++
                    set: seg.count
                  - return: seg, nil
                when: idx < 0
            - opt:
                do:
                  - return: segmentsValue{}, coretoken.Malformed
                when: seg.count == maxSegments-1
            - set: seg.part[seg.count]
