        set: s.pos
      - eval: s.skipSpace()
        to: s.skipSpace
      - opt:
          do:
            - return: nil
          when: s.consume(closer)
      - loop:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: s.element(depth, closer == '}')
                  to: s.element
                when: err != nil
            - eval: s.skipSpace()
              to: s.skipSpace
            - opt:
                do:
                  - eval: s.skipSpace()
                    to: s.skipSpace
                  - continue: true
                when: s.consume(',')
            - opt:
                do:
                  - return: nil
                when: s.consume(closer)
