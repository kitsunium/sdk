    steps:
      - opt:
          do:
            - return: "false"
          when: s.peek() != c || s.pos >= len(s.raw)
      - op: ++
        set: s.pos
      - return: "true"
  - of: isDigit
    steps:
      - return: c >= '0' && c <= '9'
