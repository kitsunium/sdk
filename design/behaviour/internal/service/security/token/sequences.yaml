    steps:
      - opt:
          do:
            - set: s.escaped
              value: "false"
            - return: ""
          when: s.escaped
      - opt:
          do:
            - set: s.escaped
              value: "true"
            - return: ""
          when: char == '\\'
      - opt:
          do:
            - set: s.inString
              value: "false"
          when: char == '"'
  - of: (*depthScan).consumeStructuralByte
