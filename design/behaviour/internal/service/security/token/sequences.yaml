      - opt:
          do:
            - return: verr
          when: verr != nil
      - opt:
          do:
            - set: idx.member[idx.count]
              value: |-
                memberSpan{
                			nameStart: int32(nameStart), nameEnd: int32(nameStart + len(name)),
                			valueStart: int32(valueStart), valueEnd: int32(s.pos), kind: kind,
                		}
