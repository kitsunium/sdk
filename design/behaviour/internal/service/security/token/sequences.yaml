      - return: newJWSVerifier(binding, cfg)
        to: newJWSVerifier
  - of: NewEdDSAVerifier
    participants:
      - id: caller
        kind: actor
      - id: NewEdDSAVerifier
        kind: self
      - id: bindEd25519Public
        kind: internal
      - id: newJWSVerifier
        kind: internal
    steps:
      - bind: binding, berr
        eval: bindEd25519Public(pub, coretoken.AlgorithmEdDSA)
        to: bindEd25519Public
      - opt:
          do:
            - return: nil, berr
          when: berr != nil
      - return: newJWSVerifier(binding, cfg)
        to: newJWSVerifier
  - of: keyUnsuitable
    participants:
      - id: caller
        kind: actor
      - id: keyUnsuitable
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(coretoken.KeyUnsuitable, errs.WrapParams{},
          		errs.String("detail", detail))
        to: errs
  - of: bindSecret
    steps:
      - opt:
          do:
            - return: hs256Binding{}, keyUnsuitable("HS256 needs a 256-bit crypto.Key")
          when: len(secret.Bytes()) != corecrypto.KeyLen
      - return: "hs256Binding{secret: secret}, nil"
  - of: bindP256Public
    participants:
      - id: caller
        kind: actor
      - id: bindP256Public
        kind: self
      - id: pub.ECDH
        kind: value
    steps:
      - opt:
          do:
            - return: es256Verifying{}, keyUnsuitable("ES256 needs a P-256 public key")
          when: pub == nil || pub.Curve != elliptic.P256()
      - opt:
          do:
            - return: es256Verifying{}, keyUnsuitable("P-256 public key is not a valid curve point")
          init:
            bind: _, cerr
            eval: pub.ECDH()
            to: pub.ECDH
          when: cerr != nil
      - return: "es256Verifying{key: pub}, nil"
  - of: bindP256Private
    participants:
      - id: caller
        kind: actor
      - id: bindP256Private
        kind: self
      - id: priv.PublicKey.ECDH
        kind: value
      - id: priv.ECDH
        kind: value
    steps:
      - opt:
          do:
            - return: es256Signing{}, keyUnsuitable("ES256 needs a P-256 private key")
          when: priv == nil || priv.Curve != elliptic.P256()
      - bind: public, cerr
        eval: priv.PublicKey.ECDH()
        to: priv.PublicKey.ECDH
      - opt:
          do:
            - return: es256Signing{}, keyUnsuitable("P-256 private key's public half is not a valid curve point")
          when: cerr != nil
      - opt:
          do:
            - return: es256Signing{}, keyUnsuitable("P-256 private key has no positive scalar")
          when: priv.D == nil || priv.D.Sign() <= 0
      - bind: derived, derr
        eval: priv.ECDH()
        to: priv.ECDH
      - opt:
          do:
            - return: es256Signing{}, keyUnsuitable("P-256 private scalar is out of range")
          when: derr != nil
      - opt:
          do:
            - return: es256Signing{}, keyUnsuitable("P-256 private scalar does not match its public point")
          when: "!derived.PublicKey().Equal(public)"
      - return: "es256Signing{key: priv}, nil"
  - of: bindEd25519Public
    steps:
      - opt:
          do:
            - return: ed25519Verifying{}, keyUnsuitable("Ed25519 needs a 32-octet public key")
          when: len(pub) != ed25519.PublicKeySize
      - return: "ed25519Verifying{key: pub, alg: alg}, nil"
  - of: bindEd25519Private
    steps:
      - opt:
          do:
            - return: ed25519Signing{}, keyUnsuitable("Ed25519 needs a 64-octet private key")
          when: len(priv) != ed25519.PrivateKeySize
      - return: "ed25519Signing{key: priv, alg: alg}, nil"
  - of: NewPasetoV4Issuer
    participants:
      - id: caller
        kind: actor
      - id: NewPasetoV4Issuer
        kind: self
      - id: bindEd25519Private
        kind: internal
      - id: cfg.issuing
        kind: internal
      - id: validateIssuerConfig
        kind: internal
      - id: checkFooterLen
        kind: internal
    steps:
      - bind: binding, berr
        eval: bindEd25519Private(priv, coretoken.AlgorithmPasetoV4Public)
        to: bindEd25519Private
      - opt:
          do:
            - return: nil, berr
          when: berr != nil
      - bind: issuing
        eval: cfg.issuing()
        to: cfg.issuing
      - opt:
          do:
            - return: nil, verr
          init:
            bind: verr
            eval: validateIssuerConfig(issuing)
            to: validateIssuerConfig
          when: verr != nil
      - opt:
          do:
            - return: nil, ferr
          init:
            bind: ferr
            eval: checkFooterLen(cfg.Footer)
            to: checkFooterLen
          when: ferr != nil
      - return: |-
          &pasetoIssuer{
          		bound: binding, cfg: cfg, issuing: issuing,
          		timeSource: resolveClock(cfg.Clock),
          	}, nil
  - of: NewPasetoV4Verifier
    participants:
      - id: caller
        kind: actor
      - id: NewPasetoV4Verifier
        kind: self
      - id: bindEd25519Public
        kind: internal
      - id: newPolicy
        kind: internal
      - id: checkFooterLen
        kind: internal
    steps:
      - bind: binding, berr
        eval: bindEd25519Public(pub, coretoken.AlgorithmPasetoV4Public)
        to: bindEd25519Public
      - opt:
          do:
            - return: nil, berr
          when: berr != nil
      - bind: policy, perr
        eval: newPolicy(cfg.verifying())
        to: newPolicy
      - opt:
          do:
            - return: nil, perr
          when: perr != nil
      - opt:
          do:
            - return: nil, ferr
          init:
            bind: ferr
            eval: checkFooterLen(cfg.Footer)
            to: checkFooterLen
          when: ferr != nil
      - return: "&pasetoVerifier{bound: binding, policy: policy, cfg: cfg}, nil"
  - of: checkFooterLen
    participants:
      - id: caller
        kind: actor
      - id: checkFooterLen
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: |-
                errs.Wrap(coretoken.PolicyMisconfigured, errs.WrapParams{},
                			errs.String("knob", "Footer"), errs.Int("limit", maxFooterLen))
              to: errs
          when: len(footer) > maxFooterLen
      - return: nil
  - of: checkPasetoScheme
    participants:
      - id: caller
        kind: actor
      - id: checkPasetoScheme
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: nil
          when: version == "v4" && purpose == "public"
      - opt:
          do:
            - return: |-
                errs.Wrap(coretoken.SchemeUnsupported, errs.WrapParams{},
                			errs.String("scheme", version+"."+purpose))
              to: errs
          when: slices.Contains(pasetoVersions, version) && (purpose == "public" || purpose == "local")
      - return: coretoken.Malformed
  - of: (*pasetoIssuer).Issue
    participants:
      - id: caller
        kind: actor
      - id: (*pasetoIssuer).Issue
        kind: self
      - id: stampIssuedClaims
        kind: internal
      - id: encodeClaims
        kind: internal
      - id: i.bound.sign
        kind: internal
      - id: b64.EncodeToString
        kind: value
    steps:
      - bind: stamped, serr
        eval: stampIssuedClaims(claims, i.issuing, i.timeSource)
        to: stampIssuedClaims
      - opt:
          do:
            - return: "\"\", serr"
          when: serr != nil
      - bind: payload, cerr
        eval: encodeClaims(stamped, pasetoShape{})
        to: encodeClaims
      - opt:
          do:
            - return: "\"\", cerr"
          when: cerr != nil
      - bind: signature, gerr
        eval: |-
          i.bound.sign(preAuthEncode(
          		[]byte(pasetoV4PublicHeader), payload, i.cfg.Footer, i.cfg.ImplicitAssertion))
        to: i.bound.sign
      - opt:
          do:
            - return: "\"\", gerr"
          when: gerr != nil
      - bind: body
        eval: b64.EncodeToString(append(payload, signature...))
        to: b64.EncodeToString
      - opt:
          do:
            - return: pasetoV4PublicHeader + body, nil
          when: len(i.cfg.Footer) == 0
      - return: pasetoV4PublicHeader + body + "." + b64.EncodeToString(i.cfg.Footer), nil
  - of: PasetoIssuerConfig.issuing
    steps:
      - return: |-
          IssuerConfig{
          		Issuer:             c.Issuer,
          		Lifetime:           c.Lifetime,
          		AllowMissingExpiry: c.AllowMissingExpiry,
          		Clock:              c.Clock,
          	}
  - of: pasetoShape.decodeTime
    participants:
      - id: caller
        kind: actor
      - id: pasetoShape.decodeTime
        kind: self
      - id: time
        kind: stdlib
      - id: parsed.UTC
        kind: value
    steps:
      - opt:
          do:
            - return: time.Time{}, malformed("PASETO time claim is not a JSON string")
          when: raw[0] != '"'
      - bind: parsed, perr
        eval: time.Parse(time.RFC3339, decodeText(raw))
        to: time
      - opt:
          do:
            - return: time.Time{}, malformed("PASETO time claim is not RFC 3339")
          when: perr != nil
      - return: parsed.UTC(), nil
        to: parsed.UTC
  - of: pasetoShape.encodeTime
    participants:
      - id: caller
        kind: actor
      - id: pasetoShape.encodeTime
        kind: self
      - id: json
        kind: stdlib
    steps:
      - return: json.RawMessage(quoteJSONString(instant.UTC().Format(time.RFC3339)))
        to: json
  - of: pasetoShape.checkAudience
    participants:
      - id: caller
        kind: actor
      - id: pasetoShape.checkAudience
        kind: self
      - id: malformed
        kind: internal
    steps:
      - opt:
          do:
            - return: malformed("PASETO aud is not a string")
              to: malformed
          when: raw[0] != '"'
      - return: nil
  - of: pasetoShape.decodeAudience
    steps:
      - opt:
          do:
            - return: nil, nil
          when: len(raw) == 0
      - return: "[]string{decodeText(raw)}, nil"
  - of: pasetoShape.encodeAudience
    participants:
      - id: caller
        kind: actor
      - id: pasetoShape.encodeAudience
        kind: self
      - id: json
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil, nil
          when: len(audience) == 0
      - opt:
          do:
            - return: |-
                nil, errs.Wrap(coretoken.IssueFailed, errs.WrapParams{},
                			errs.String("claim", "PASETO aud accepts exactly one value"))
          when: len(audience) > 1
      - return: json.RawMessage(quoteJSONString(audience[0])), nil
        to: json
  - of: (*pasetoVerifier).Verify
    participants:
      - id: caller
        kind: actor
      - id: (*pasetoVerifier).Verify
        kind: self
      - id: v.split
        kind: internal
      - id: v.decodeAuthenticated
        kind: internal
    steps:
      - bind: payload, footer, perr
        eval: v.split(token)
        to: v.split
      - opt:
          do:
            - return: coretoken.ClaimsValue{}, perr
          when: perr != nil
      - opt:
          do:
            - return: coretoken.ClaimsValue{}, coretoken.FooterMismatch
          when: subtle.ConstantTimeCompare(footer, v.cfg.Footer) != 1
      - opt:
          do:
            - return: coretoken.ClaimsValue{}, coretoken.Malformed
          when: len(payload) < pasetoSigLen
      - bind: message, signature
        eval: payload[:len(payload)-pasetoSigLen], payload[len(payload)-pasetoSigLen:]
      - opt:
          do:
            - return: coretoken.ClaimsValue{}, coretoken.SignatureInvalid
          when: |-
            !v.bound.verify(preAuthEncode(
            		[]byte(pasetoV4PublicHeader), message, footer, v.cfg.ImplicitAssertion), signature)
      - return: v.decodeAuthenticated(message)
        to: v.decodeAuthenticated
  - of: (*pasetoVerifier).decodeAuthenticated
    participants:
      - id: caller
        kind: actor
      - id: (*pasetoVerifier).decodeAuthenticated
        kind: self
      - id: decodeClaims
        kind: internal
      - id: v.policy.validateClaims
        kind: internal
    steps:
      - bind: decoded, cerr
        eval: decodeClaims(message, v.policy.maxClaimDepth, pasetoShape{})
        to: decodeClaims
      - opt:
          do:
            - return: coretoken.ClaimsValue{}, cerr
          when: cerr != nil
      - opt:
          do:
            - return: coretoken.ClaimsValue{}, verr
          init:
            bind: verr
            eval: v.policy.validateClaims(decoded)
            to: v.policy.validateClaims
          when: verr != nil
      - return: decoded, nil
  - of: (*pasetoVerifier).split
    participants:
      - id: caller
        kind: actor
      - id: (*pasetoVerifier).split
        kind: self
      - id: splitCompact
        kind: internal
      - id: checkPasetoScheme
        kind: internal
      - id: decodeSegment
        kind: internal
    steps:
      - bind: seg, serr
        eval: splitCompact(token, v.policy.maxTokenLen)
        to: splitCompact
      - opt:
          do:
            - return: nil, nil, serr
          when: serr != nil
      - opt:
          do:
            - return: nil, nil, coretoken.Malformed
          when: seg.count < pasetoMinSegments || seg.count > pasetoMaxSegments
      - opt:
          do:
            - return: nil, nil, cerr
          init:
            bind: cerr
            eval: checkPasetoScheme(seg.part[pasetoVersionSegment], seg.part[pasetoPurposeSegment])
            to: checkPasetoScheme
          when: cerr != nil
      - bind: body, berr
        eval: decodeSegment(seg.part[pasetoBodySegment], v.policy.maxTokenLen)
        to: decodeSegment
      - opt:
          do:
            - return: nil, nil, berr
          when: berr != nil
      - opt:
          do:
            - return: body, nil, nil
          when: seg.count == pasetoMinSegments
      - opt:
          do:
            - return: nil, nil, coretoken.Malformed
          when: seg.part[pasetoFooterSegment] == ""
      - bind: decodedFooter, ferr
        eval: decodeSegment(seg.part[pasetoFooterSegment], maxFooterLen)
        to: decodeSegment
      - opt:
          do:
            - return: nil, nil, ferr
          when: ferr != nil
      - return: body, decodedFooter, nil
  - of: PasetoVerifierConfig.verifying
    steps:
      - return: |-
          VerifierConfig{
          		Issuer:             c.Issuer,
          		Audience:           c.Audience,
          		Leeway:             c.Leeway,
          		MaxLifetime:        c.MaxLifetime,
          		MaxTokenLen:        c.MaxTokenLen,
          		MaxClaimDepth:      c.MaxClaimDepth,
          		AllowMissingExpiry: c.AllowMissingExpiry,
          		Clock:              c.Clock,
          	}
  - of: newPolicy
    participants:
      - id: caller
        kind: actor
      - id: newPolicy
        kind: self
      - id: nonUTF8VerifierKnob
        kind: internal
      - id: resolveBounds
        kind: internal
    steps:
      - opt:
          do:
            - return: policyValue{}, misconfigured("Leeway")
          when: cfg.Leeway < 0 || cfg.Leeway > MaxLeeway
      - opt:
          do:
            - return: policyValue{}, misconfigured("MaxLifetime")
          when: cfg.MaxLifetime < 0
      - opt:
          do:
            - return: |-
                policyValue{}, errs.Wrap(coretoken.PolicyMisconfigured, errs.WrapParams{},
                			errs.String("knob", knob), errs.String("problem", "not valid UTF-8"))
          init:
            bind: knob
            eval: nonUTF8VerifierKnob(cfg)
            to: nonUTF8VerifierKnob
          when: knob != ""
      - bind: bounds, berr
        eval: resolveBounds(cfg)
        to: resolveBounds
      - opt:
          do:
            - return: policyValue{}, berr
          when: berr != nil
      - return: |-
          policyValue{
          		issuer: cfg.Issuer, audience: cfg.Audience, requireType: cfg.RequireType,
          		leeway: cfg.Leeway, maxLifetime: cfg.MaxLifetime,
          		maxTokenLen: bounds.tokenLen, maxClaimDepth: bounds.claimDepth,
          		maxKeyCandidates:   bounds.keyCandidates,
          		allowMissingExpiry: cfg.AllowMissingExpiry,
          		timeSource:         resolveClock(cfg.Clock),
          	}, nil
  - of: misconfigured
    participants:
      - id: caller
        kind: actor
      - id: misconfigured
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(coretoken.PolicyMisconfigured, errs.WrapParams{},
          		errs.String("knob", knob))
        to: errs
  - of: resolveClock
    steps:
      - opt:
          do:
            - return: clock.System
          when: configured == nil
      - return: configured
  - of: validateIssuerConfig
    participants:
      - id: caller
        kind: actor
      - id: validateIssuerConfig
        kind: self
      - id: errs
        kind: package
      - id: nonUTF8Knob
        kind: internal
    steps:
      - opt:
          do:
            - return: |-
                errs.Wrap(coretoken.PolicyMisconfigured, errs.WrapParams{},
                			errs.String("knob", "Lifetime"))
              to: errs
          when: cfg.Lifetime < 0
      - opt:
          do:
            - return: |-
                errs.Wrap(coretoken.PolicyMisconfigured, errs.WrapParams{},
                			errs.String("knob", knob), errs.String("problem", "not valid UTF-8"))
              to: errs
          init:
            bind: knob
            eval: nonUTF8Knob(cfg)
            to: nonUTF8Knob
          when: knob != ""
      - return: nil
  - of: policyValue.validateClaims
    participants:
      - id: caller
        kind: actor
      - id: policyValue.validateClaims
        kind: self
      - id: p.judgeClaims
        kind: internal
    steps:
      - return: |-
          p.judgeClaims(claimFacts{
          		expiry: claims.Expiry(), notBefore: claims.NotBefore(), issuedAt: claims.IssuedAt(),
          		issuerOK: p.issuer == "" || claims.Issuer() == p.issuer,
          		//: Audience clones, so it is only called when there is one to match.
          		audienceOK: p.audience == "" || slices.Contains(claims.Audience(), p.audience),
          	})
        to: p.judgeClaims
  - of: policyValue.judgeClaims
    participants:
      - id: caller
        kind: actor
      - id: policyValue.judgeClaims
        kind: self
      - id: p.timeSource.Now
        kind: value
      - id: p.checkExpiry
        kind: internal
      - id: p.checkLifetime
        kind: internal
    steps:
      - bind: now
        eval: p.timeSource.Now()
        to: p.timeSource.Now
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: p.checkExpiry(facts.expiry, now)
            to: p.checkExpiry
          when: err != nil
      - opt:
          do:
            - return: coretoken.NotYetValid
          when: "!facts.notBefore.IsZero() && now.Before(facts.notBefore.Add(-p.leeway))"
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: p.checkLifetime(facts.expiry, facts.issuedAt)
            to: p.checkLifetime
          when: err != nil
      - opt:
          do:
            - return: coretoken.IssuerMismatch
          when: "!facts.issuerOK"
      - opt:
          do:
            - return: coretoken.AudienceMismatch
          when: "!facts.audienceOK"
      - return: nil
  - of: policyValue.checkExpiry
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: nil
                when: p.allowMissingExpiry
            - return: coretoken.ExpiryRequired
          when: exp.IsZero()
      - opt:
          do:
            - return: coretoken.Expired
          when: now.After(exp.Add(p.leeway))
      - return: nil
  - of: policyValue.checkLifetime
    participants:
      - id: caller
        kind: actor
      - id: policyValue.checkLifetime
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: nil
          when: p.maxLifetime <= 0
      - opt:
          do:
            - return: |-
                errs.Wrap(coretoken.LifetimeTooLong, errs.WrapParams{},
                			errs.String("reason", "exp or iat absent"))
              to: errs
          when: exp.IsZero() || iat.IsZero()
      - opt:
          do:
            - return: coretoken.LifetimeTooLong
          when: exp.Sub(iat) > p.maxLifetime
      - return: nil
  - of: stampIssuedClaims
    participants:
      - id: caller
        kind: actor
      - id: stampIssuedClaims
        kind: self
      - id: source.Now
        kind: value
      - id: claims.WithIssuer
        kind: value
      - id: claims.WithIssuedAt
        kind: value
      - id: claims.WithExpiry
        kind: value
    steps:
      - bind: now
        eval: source.Now()
        to: source.Now
      - opt:
          do:
            - set: claims
              to: claims.WithIssuer
              value: claims.WithIssuer(cfg.Issuer)
          when: claims.Issuer() == "" && cfg.Issuer != ""
      - opt:
          do:
            - set: claims
              to: claims.WithIssuedAt
              value: claims.WithIssuedAt(now.Truncate(time.Second))
          when: claims.IssuedAt().IsZero()
      - opt:
          do:
            - return: claims, nil
          when: "!claims.Expiry().IsZero()"
      - opt:
          do:
            - return: claims.WithExpiry(now.Add(cfg.Lifetime).Truncate(time.Second)), nil
              to: claims.WithExpiry
          when: cfg.Lifetime > 0
      - opt:
          do:
            - return: claims, nil
          when: cfg.AllowMissingExpiry
      - return: coretoken.ClaimsValue{}, coretoken.ExpiryRequired
