          forever: true
  - of: (*jsonScan).topMember
    participants:
      - id: caller
        kind: actor
      - id: (*jsonScan).topMember
        kind: self
      - id: s.skipSpace
        kind: internal
      - id: s.str
        kind: internal
      - id: s.value
        kind: internal
    steps:
      - eval: s.skipSpace()
        to: s.skipSpace
      - opt:
          do:
            - return: coretoken.Malformed
          when: s.peek() != '"'
      - bind: nameStart
        eval: s.pos + 1
      - bind: escaped, serr
        eval: s.str()
