        eval: "false"
      - opt:
          do:
            - set: negative
              to: s.consume
              value: s.consume('-')
          when: "!s.consume('+')"
      - bind: start
        eval: s.pos
      - opt:
          do:
            - return: 0, coretoken.Malformed
