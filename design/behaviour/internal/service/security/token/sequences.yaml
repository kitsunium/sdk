  - of: checkJSONDepth
    participants:
      - id: caller
        kind: actor
      - id: checkJSONDepth
        kind: self
      - id: scan.consumeStringByte
        kind: internal
      - id: scan.consumeStructuralByte
        kind: internal
      - id: errs
        kind: package
    steps:
      - bind: scan
        eval: depthScan{}
      - loop:
          do:
            - opt:
                do:
                  - eval: scan.consumeStringByte(char)
                    to: scan.consumeStringByte
                  - continue: true
                when: scan.inString
            - eval: scan.consumeStructuralByte(char)
              to: scan.consumeStructuralByte
            - opt:
                do:
                  - return: |-
                      errs.Wrap(coretoken.TooDeep, errs.WrapParams{},
                      				errs.Int("limit", maxDepth))
                    to: errs
                when: scan.depth > maxDepth
          key: _
          range: raw
          value: char
      - return: nil
  - of: preAuthEncode
    participants:
      - id: caller
        kind: actor
      - id: preAuthEncode
        kind: self
      - id: appendLE64
        kind: internal
    steps:
      - bind: total
        eval: le64Width
      - loop:
          do:
            - op: +=
              set: total
              value: le64Width + len(piece)
          key: _
          range: pieces
          value: piece
      - bind: out
        eval: make([]byte, 0, total)
      - set: out
        to: appendLE64
        value: appendLE64(out, uint64(len(pieces)))
      - loop:
          do:
            - set: out
              to: appendLE64
              value: appendLE64(out, uint64(len(piece)))
            - set: out
              value: append(out, piece...)
          key: _
          range: pieces
          value: piece
      - return: out
  - of: appendLE64
    participants:
      - id: caller
        kind: actor
      - id: appendLE64
        kind: self
      - id: binary.LittleEndian.PutUint64
        kind: value
    steps:
      - var:
          name: buf
          type: "[le64Width]byte"
      - eval: binary.LittleEndian.PutUint64(buf[:], n&le64SignMask)
        to: binary.LittleEndian.PutUint64
      - return: append(dst, buf[:]...)
  - of: es256Signing.algorithm
    steps:
      - return: coretoken.AlgorithmES256
  - of: es256Signing.sign
    participants:
      - id: caller
        kind: actor
      - id: es256Signing.sign
        kind: self
      - id: sha256
        kind: stdlib
      - id: ecdsa
        kind: stdlib
      - id: s.Sub
        kind: value
      - id: r.FillBytes
        kind: value
      - id: s.FillBytes
        kind: value
    steps:
      - bind: digest
        eval: sha256.Sum256(input)
        to: sha256
      - bind: r, s, serr
        eval: ecdsa.Sign(rand.Reader, b.key, digest[:])
        to: ecdsa
      - opt:
          do:
            - return: |-
                nil, errs.Wrap(serr, errs.WrapParams{
                			Code:     coretoken.CodeIssueFailed,
                			Reason:   "ISSUE_FAILED",
                			Public:   "The token could not be issued",
                			Private:  "service/security/token: ecdsa.Sign failed on the P-256 signing key",
                			ExitCode: exitConfigFault,
                		})
          when: serr != nil
      - opt:
          do:
            - eval: s.Sub(b.key.Params().N, s)
              to: s.Sub
          when: s.Cmp(p256HalfOrder) > 0
      - var:
          name: fixed
          type: "[p256SigLen]byte"
      - eval: r.FillBytes(fixed[:p256CoordLen])
        to: r.FillBytes
      - eval: s.FillBytes(fixed[p256CoordLen:])
        to: s.FillBytes
      - return: fixed[:], nil
  - of: es256Verifying.algorithm
    steps:
      - return: coretoken.AlgorithmES256
  - of: es256Verifying.verify
    participants:
      - id: caller
        kind: actor
      - id: es256Verifying.verify
        kind: self
      - id: sha256
        kind: stdlib
      - id: new(big.Int).SetBytes
        kind: value
      - id: ecdsa
        kind: stdlib
    steps:
      - opt:
          do:
            - return: "false"
          when: len(sig) != p256SigLen
      - bind: digest
        eval: sha256.Sum256(input)
        to: sha256
      - bind: r
        eval: new(big.Int).SetBytes(sig[:p256CoordLen])
        to: new(big.Int).SetBytes
      - bind: s
        eval: new(big.Int).SetBytes(sig[p256CoordLen:])
        to: new(big.Int).SetBytes
      - return: ecdsa.Verify(b.key, digest[:], r, s)
        to: ecdsa
  - of: hs256Binding.algorithm
    steps:
      - return: coretoken.AlgorithmHS256
  - of: hs256Binding.sign
    participants:
      - id: caller
        kind: actor
      - id: hs256Binding.sign
        kind: self
      - id: hmacsha2.MAC.Tag
        kind: value
    steps:
      - return: hmacsha2.MAC.Tag(b.secret, input), nil
        to: hmacsha2.MAC.Tag
  - of: hs256Binding.verify
    participants:
      - id: caller
        kind: actor
      - id: hs256Binding.verify
        kind: self
      - id: hmacsha2.MAC.Verify
        kind: value
    steps:
      - return: hmacsha2.MAC.Verify(b.secret, input, sig)
        to: hmacsha2.MAC.Verify
  - of: newHS256Verifier
    steps:
      - bind: v
        eval: "&hs256Verifier{secret: binding, owner: coretoken.NewScratchOwner()}"
      - set: v.bound, v.policy
        value: binding, policy
      - return: v
  - of: (*hs256Verifier).NewScratch
    participants:
      - id: caller
        kind: actor
      - id: (*hs256Verifier).NewScratch
        kind: self
      - id: coretoken
        kind: package
    steps:
      - return: coretoken.NewVerifyScratch(v.owner, hmacsha2.MAC.New(v.secret.secret))
        to: coretoken
  - of: (*hs256Verifier).VerifyInto
    participants:
      - id: caller
        kind: actor
      - id: (*hs256Verifier).VerifyInto
        kind: self
      - id: errs
        kind: package
      - id: dst.Reset
        kind: value
      - id: s.Enter
        kind: value
      - id: s.Leave
        kind: value
      - id: v.verifyInto
        kind: internal
    steps:
      - opt:
          do:
            - return: |-
                errs.Wrap(coretoken.PolicyMisconfigured, errs.WrapParams{},
                			errs.String("knob", "ClaimsBuf"))
              to: errs
          when: dst == nil
      - eval: dst.Reset()
        to: dst.Reset
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: s.Enter(v.owner)
            to: s.Enter
          when: err != nil
      - defer: s.Leave()
        to: s.Leave
      - bind: err
        eval: v.verifyInto(s, token, dst)
        to: v.verifyInto
      - opt:
          do:
            - eval: dst.Reset()
              to: dst.Reset
          when: err != nil
      - return: err
  - of: (*hs256Verifier).verifyInto
    participants:
      - id: caller
        kind: actor
      - id: (*hs256Verifier).verifyInto
        kind: self
      - id: splitCompactBytes
        kind: internal
      - id: decodeSegmentInto
        kind: internal
      - id: readJOSEHeader
        kind: internal
      - id: v.authenticate
        kind: internal
    steps:
      - bind: seg, serr
        eval: splitCompactBytes(token, v.policy.maxTokenLen)
        to: splitCompactBytes
      - opt:
          do:
            - return: serr
          when: serr != nil
      - opt:
          do:
            - return: coretoken.Malformed
          when: seg.count != jwsSegments
      - var:
          name: headerBuf
          type: "[headerStackLen]byte"
      - bind: header, herr
        eval: decodeSegmentInto(headerBuf[:], seg.part[headerSegment], maxHeaderLen)
        to: decodeSegmentInto
      - opt:
          do:
            - return: herr
          when: herr != nil
      - bind: view, err
        eval: readJOSEHeader(header)
        to: readJOSEHeader
      - opt:
          do:
            - return: err
          when: err != nil
      - return: v.authenticate(s, token, &seg, &view, dst)
        to: v.authenticate
  - of: (*hs256Verifier).authenticate
    participants:
      - id: caller
        kind: actor
      - id: (*hs256Verifier).authenticate
        kind: self
      - id: decodeSegmentInto
        kind: internal
      - id: v.policy.checkHeaderView
        kind: internal
      - id: s.MACEqual
        kind: value
      - id: v.policy.judgeInto
        kind: internal
    steps:
      - var:
          name: sigBuf
          type: "[maxSignatureLen]byte"
      - bind: signature, gerr
        eval: decodeSegmentInto(sigBuf[:], seg.part[signatureSegment], maxSignatureLen)
        to: decodeSegmentInto
      - opt:
          do:
            - return: gerr
          when: gerr != nil
      - opt:
          do:
            - eval: clear(sigBuf[:])
            - return: herr
          init:
            bind: herr
            eval: v.policy.checkHeaderView(view, coretoken.AlgorithmHS256)
            to: v.policy.checkHeaderView
          when: herr != nil
      - bind: inputLen
        eval: len(seg.part[headerSegment]) + 1 + len(seg.part[payloadSegment])
      - bind: authentic
        eval: s.MACEqual(token[:inputLen], signature)
        to: s.MACEqual
      - eval: clear(sigBuf[:])
      - opt:
          do:
            - return: coretoken.SignatureInvalid
          when: "!authentic"
      - var:
          name: payloadBuf
          type: "[payloadStackLen]byte"
      - bind: raw, derr
        eval: decodeSegmentInto(payloadBuf[:], seg.part[payloadSegment], v.policy.maxTokenLen)
        to: decodeSegmentInto
      - opt:
          do:
            - return: derr
          when: derr != nil
      - bind: err
        eval: v.policy.judgeInto(raw, dst)
        to: v.policy.judgeInto
      - eval: clear(raw)
      - return: err
  - of: policyValue.judgeInto
    participants:
      - id: caller
        kind: actor
      - id: policyValue.judgeInto
        kind: self
      - id: readClaims
        kind: internal
      - id: p.judgeClaims
        kind: internal
      - id: storeClaims
        kind: internal
    steps:
      - var:
          name: idx
          type: objectIndex
      - bind: reg, rerr
        eval: readClaims(raw, p.maxClaimDepth, joseShape{}, &idx)
        to: readClaims
      - opt:
          do:
            - return: rerr
          when: rerr != nil
      - opt:
          do:
            - return: jerr
          init:
            bind: jerr
            eval: |-
              p.judgeClaims(claimFacts{
              		expiry: reg.expiry, notBefore: reg.notBefore, issuedAt: reg.issuedAt,
              		issuerOK:   p.issuer == "" || literalEqual(memberValue(raw, &idx, reg.at[slotIssuer]), p.issuer),
              		audienceOK: p.audience == "" || audienceContains(memberValue(raw, &idx, reg.at[slotAudience]), p.audience),
              	})
            to: p.judgeClaims
          when: jerr != nil
      - return: storeClaims(raw, &idx, &reg, dst)
        to: storeClaims
  - of: audienceContains
    participants:
      - id: caller
        kind: actor
      - id: audienceContains
        kind: self
      - id: jsonStringEqual
        kind: internal
      - id: newArrayStrings
        kind: internal
      - id: walk.next
        kind: internal
    steps:
      - opt:
          do:
            - return: "false"
          when: raw == nil
      - opt:
          do:
            - return: jsonStringEqual(raw, want)
              to: jsonStringEqual
          when: raw[0] == '"'
      - bind: walk
        eval: newArrayStrings(raw)
        to: newArrayStrings
      - loop:
          do:
            - bind: lit, more, err
              eval: walk.next()
              to: walk.next
            - opt:
                do:
                  - return: "false"
                when: err != nil || !more
            - opt:
                do:
                  - return: "true"
                when: jsonStringEqual(lit, want)
          forever: true
  - of: storeClaims
    participants:
      - id: caller
        kind: actor
      - id: storeClaims
        kind: self
      - id: storeText
        kind: internal
      - id: storeInstants
        kind: internal
      - id: storeAudience
        kind: internal
      - id: storePrivate
        kind: internal
    steps:
      - var:
          name: text
          type: "[coretoken.ClaimsBufTextCap]byte"
      - loop:
          do:
            - opt:
                do:
                  - opt:
                      do:
                        - return: err
                      init:
                        bind: err
                        eval: storeText(dst, field.claim, text[:], idx.value(raw, at))
                        to: storeText
                      when: err != nil
                init:
                  bind: at
                  eval: reg.at[field.slot]
                when: at >= 0
          key: _
          range: |-
            [...]struct {
            		slot  int
            		claim coretoken.TextClaim
            	}{{slotIssuer, coretoken.TextIssuer}, {slotSubject, coretoken.TextSubject}, {slotID, coretoken.TextID}}
          value: field
      - eval: storeInstants(reg, dst)
        to: storeInstants
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: storeAudience(memberValue(raw, idx, reg.at[slotAudience]), text[:], dst)
            to: storeAudience
          when: err != nil
      - return: storePrivate(raw, idx, text[:], dst)
        to: storePrivate
  - of: storeText
    participants:
      - id: caller
        kind: actor
      - id: storeText
        kind: self
      - id: decodeTextInto
        kind: internal
      - id: dst.SetText
        kind: value
    steps:
      - bind: n, ok
        eval: decodeTextInto(buf, lit)
        to: decodeTextInto
      - opt:
          do:
            - return: coretoken.ClaimsBufOverflow
          when: "!ok"
      - return: dst.SetText(claim, buf[:n])
        to: dst.SetText
  - of: storeInstants
    participants:
      - id: caller
        kind: actor
      - id: storeInstants
        kind: self
      - id: reg.instant
        kind: internal
      - id: dst.SetUnix
        kind: value
    steps:
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: reg.at[field.slot] < 0
            - bind: instant
              eval: reg.instant(field.slot)
              to: reg.instant
            - eval: dst.SetUnix(field.claim, instant.Unix(), int32(instant.Nanosecond()))
              to: dst.SetUnix
          key: _
          range: |-
            [...]struct {
            		slot  int
            		claim coretoken.TimeClaim
            	}{{slotExpiry, coretoken.TimeExpiry}, {slotNotBefore, coretoken.TimeNotBefore}, {slotIssuedAt, coretoken.TimeIssuedAt}}
          value: field
  - of: storeAudience
    participants:
      - id: caller
        kind: actor
      - id: storeAudience
        kind: self
      - id: storeMember
        kind: internal
      - id: newArrayStrings
        kind: internal
      - id: walk.next
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: raw == nil
      - opt:
          do:
            - return: storeMember(raw, buf, dst)
              to: storeMember
          when: raw[0] == '"'
      - bind: walk
        eval: newArrayStrings(raw)
        to: newArrayStrings
      - loop:
          do:
            - bind: lit, more, err
              eval: walk.next()
              to: walk.next
            - opt:
                do:
                  - return: err
                when: err != nil || !more
            - opt:
                do:
                  - return: serr
                init:
                  bind: serr
                  eval: storeMember(lit, buf, dst)
                  to: storeMember
                when: serr != nil
          forever: true
  - of: storeMember
    participants:
      - id: caller
        kind: actor
      - id: storeMember
        kind: self
      - id: decodeTextInto
        kind: internal
      - id: dst.AppendAudience
        kind: value
    steps:
      - bind: n, ok
        eval: decodeTextInto(buf, lit)
        to: decodeTextInto
      - opt:
          do:
            - return: coretoken.ClaimsBufOverflow
          when: "!ok"
      - return: dst.AppendAudience(buf[:n])
        to: dst.AppendAudience
  - of: storePrivate
    participants:
      - id: caller
        kind: actor
      - id: storePrivate
        kind: self
      - id: dst.PrivateIndex
        kind: value
      - id: dst.MarkPrivate
        kind: value
      - id: decodeTextInto
        kind: internal
      - id: dst.SetPrivate
        kind: value
    steps:
      - opt:
          do:
            - return: nil
          when: dst.Declared() == 0
      - loop:
          do:
            - bind: slot
              eval: dst.PrivateIndex(idx.name(raw, i))
              to: dst.PrivateIndex
            - opt:
                do:
                  - continue: true
                when: slot < 0
            - opt:
                do:
                  - eval: dst.MarkPrivate(slot, coretoken.ClaimWrongType)
                    to: dst.MarkPrivate
                  - continue: true
                when: idx.member[i].kind != kindString
            - bind: n, ok
              eval: decodeTextInto(buf, idx.value(raw, i))
              to: decodeTextInto
            - opt:
                do:
                  - return: coretoken.ClaimsBufOverflow
                when: "!ok"
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: dst.SetPrivate(slot, buf[:n])
                  to: dst.SetPrivate
                when: err != nil
          key: i
          range: idx.count
      - return: nil
  - of: (*registeredValue).instant
    steps:
      - switch:
          cases:
            - case: slotExpiry
              do:
                - return: r.expiry
            - case: slotNotBefore
              do:
                - return: r.notBefore
            - default: true
              do:
                - return: r.issuedAt
          "on": slot
  - of: joseShape.decodeTime
    participants:
      - id: caller
        kind: actor
      - id: joseShape.decodeTime
        kind: self
      - id: numericInteger
        kind: internal
      - id: time.Unix(whole, 0).UTC
        kind: value
      - id: strconv
        kind: stdlib
      - id: math
        kind: stdlib
      - id: time.Unix(int64(whole), int64(frac*float64(time.Second))).UTC
        kind: value
    steps:
      - opt:
          do:
            - return: time.Time{}, malformed("NumericDate claim is not a JSON number")
          when: len(raw) == 0 || (raw[0] != '-' && !isDigit(raw[0]))
      - opt:
          do:
            - opt:
                do:
                  - return: time.Time{}, numericDateOutOfRange()
                when: math.Abs(float64(whole)) > maxNumericDate
            - return: time.Unix(whole, 0).UTC(), nil
              to: time.Unix(whole, 0).UTC
          init:
            bind: whole, ok
            eval: numericInteger(raw)
            to: numericInteger
          when: ok
      - bind: seconds, perr
        eval: strconv.ParseFloat(string(raw), 64)
        to: strconv
      - opt:
          do:
            - return: time.Time{}, malformed("NumericDate claim is not a JSON number")
          when: perr != nil
      - opt:
          do:
            - return: time.Time{}, numericDateOutOfRange()
          when: math.IsNaN(seconds) || math.IsInf(seconds, 0) || math.Abs(seconds) > maxNumericDate
      - bind: whole, frac
        eval: math.Modf(seconds)
        to: math
      - return: time.Unix(int64(whole), int64(frac*float64(time.Second))).UTC(), nil
        to: time.Unix(int64(whole), int64(frac*float64(time.Second))).UTC
  - of: numericDateOutOfRange
    participants:
      - id: caller
        kind: actor
      - id: numericDateOutOfRange
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(coretoken.Malformed, errs.WrapParams{},
          		errs.String("claim", "NumericDate out of range"))
        to: errs
  - of: joseShape.encodeTime
    participants:
      - id: caller
        kind: actor
      - id: joseShape.encodeTime
        kind: self
      - id: json
        kind: stdlib
    steps:
      - return: json.RawMessage(strconv.FormatInt(instant.Unix(), decimalBase))
        to: json
  - of: joseShape.checkAudience
    participants:
      - id: caller
        kind: actor
      - id: joseShape.checkAudience
        kind: self
      - id: newArrayStrings
        kind: internal
      - id: walk.next
        kind: internal
      - id: malformed
        kind: internal
    steps:
      - switch:
          cases:
            - case: "'\"'"
              do:
                - return: nil
            - case: "'['"
              do:
                - bind: walk
                  eval: newArrayStrings(raw)
                  to: newArrayStrings
                - loop:
                    do:
                      - bind: _, more, err
                        eval: walk.next()
                        to: walk.next
                      - opt:
                          do:
                            - return: err
                          when: err != nil
                      - opt:
                          do:
                            - return: nil
                          when: "!more"
                    forever: true
            - default: true
              do:
                - return: malformed("aud is neither a string nor an array of strings")
                  to: malformed
          "on": raw[0]
  - of: joseShape.decodeAudience
    participants:
      - id: caller
        kind: actor
      - id: joseShape.decodeAudience
        kind: self
      - id: newArrayStrings
        kind: internal
      - id: walk.next
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, nil
          when: len(raw) == 0
      - opt:
          do:
            - return: "[]string{decodeText(raw)}, nil"
          when: raw[0] == '"'
      - set: audience
        value: make([]string, 0, coretoken.ClaimsBufAudienceCap)
      - bind: walk
        eval: newArrayStrings(raw)
        to: newArrayStrings
      - loop:
          do:
            - bind: lit, more, werr
              eval: walk.next()
              to: walk.next
            - opt:
                do:
                  - return: nil, werr
                when: werr != nil
            - opt:
                do:
                  - return: audience, nil
                when: "!more"
            - set: audience
              value: append(audience, decodeText(lit))
          forever: true
  - of: joseShape.encodeAudience
    participants:
      - id: caller
        kind: actor
      - id: joseShape.encodeAudience
        kind: self
      - id: json
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil, nil
          when: len(audience) == 0
      - opt:
          do:
            - return: json.RawMessage(quoteJSONString(audience[0])), nil
              to: json
          when: len(audience) == 1
      - return: json.RawMessage(quoteJSONStrings(audience)), nil
        to: json
  - of: (*objectIndex).name
    steps:
      - bind: m
        eval: x.member[i]
      - return: raw[m.nameStart:m.nameEnd]
  - of: (*objectIndex).value
    steps:
      - bind: m
        eval: x.member[i]
      - return: raw[m.valueStart:m.valueEnd]
  - of: scanObject
    participants:
      - id: caller
        kind: actor
      - id: scanObject
        kind: self
      - id: s.skipSpace
        kind: internal
      - id: s.topMembers
        kind: internal
      - id: errs
        kind: package
    steps:
      - bind: s
        eval: "jsonScan{raw: raw, maxDepth: maxDepth}"
      - set: idx.count, idx.total
        value: 0, 0
      - eval: s.skipSpace()
        to: s.skipSpace
      - opt:
          do:
            - return: coretoken.Malformed
          when: "!s.consume('{')"
      - opt:
          do:
            - return: err
          init:
            bind: err
            eval: s.topMembers(idx)
            to: s.topMembers
          when: err != nil
      - eval: s.skipSpace()
        to: s.skipSpace
      - opt:
          do:
            - return: coretoken.Malformed
          when: s.pos != len(s.raw)
      - opt:
          do:
            - return: |-
                errs.Wrap(coretoken.TooLarge, errs.WrapParams{},
                			errs.Int("limit", maxIndexedMembers))
              to: errs
          when: idx.total > maxIndexedMembers
      - return: nil
  - of: (*jsonScan).topMembers
    participants:
      - id: caller
        kind: actor
      - id: (*jsonScan).topMembers
        kind: self
      - id: s.skipSpace
        kind: internal
      - id: s.topMember
        kind: internal
    steps:
      - eval: s.skipSpace()
        to: s.skipSpace
      - opt:
          do:
            - return: nil
          when: s.consume('}')
      - loop:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: s.topMember(idx)
                  to: s.topMember
                when: err != nil
            - eval: s.skipSpace()
              to: s.skipSpace
            - opt:
                do:
                  - continue: true
                when: s.consume(',')
            - opt:
                do:
                  - return: nil
                when: s.consume('}')
