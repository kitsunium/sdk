                - return: kindTrue, s.literal("true")
            - case: "'f'"
              do:
                - return: kindFalse, s.literal("false")
            - case: "'n'"
              do:
                - return: kindNull, s.literal("null")
            - default: true
              do:
                - return: 0, coretoken.Malformed
          "on": c
