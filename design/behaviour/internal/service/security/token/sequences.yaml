          do:
            - return: serr
          when: serr != nil
      - opt:
          do:
            - return: coretoken.Malformed
          when: escaped
      - bind: name
        eval: "s.raw[nameStart : s.pos-1]"
      - opt:
          do:
            - return: coretoken.DuplicateMember
