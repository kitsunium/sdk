  - of: NewES256Verifier
    participants:
      - id: caller
        kind: actor
      - id: NewES256Verifier
        kind: self
      - id: bindP256Public
        kind: internal
      - id: newJWSVerifier
        kind: internal
    steps:
      - bind: binding, berr
        eval: bindP256Public(pub)
        to: bindP256Public
      - opt:
          do:
            - return: nil, berr
