      - bind: binding, berr
        eval: bindJWK(key)
        to: bindJWK
      - opt:
          do:
            - return: nil, berr
          when: berr != nil
      - return: newJWSVerifier(binding, cfg)
        to: newJWSVerifier
  - of: NewSetVerifier
    participants:
      - id: caller
        kind: actor
      - id: NewSetVerifier
        kind: self
      - id: newPolicy
        kind: internal
      - id: indexByKid
        kind: internal
    steps:
      - bind: policy, perr
        eval: newPolicy(cfg)
        to: newPolicy
      - opt:
          do:
            - return: nil, perr
          when: perr != nil
