                  - return: coretoken.Malformed
                init:
                  bind: serr
                  eval: skipValue(dec)
                  to: skipValue
                when: serr != nil
      - return: nil
  - of: skipValue
    participants:
      - id: caller
        kind: actor
      - id: skipValue
        kind: self
      - id: dec.Token
        kind: value
    steps:
      - bind: depth
        eval: "0"
      - loop:
          do:
            - bind: tok, terr
              eval: dec.Token()
              to: dec.Token
            - opt:
                do:
                  - return: terr
                when: terr != nil
            - bind: delim, isDelim
              eval: tok.(json.Delim)
            - opt:
                do:
                  - opt:
                      do:
                        - return: nil
                      when: depth == 0
                  - continue: true
                when: "!isDelim"
            - switch:
                cases:
                  - case: "'{', '['"
                    do:
                      - op: ++
                        set: depth
                  - default: true
                    do:
                      - op: "--"
                        set: depth
                      - opt:
                          do:
                            - return: nil
                          when: depth == 0
                "on": delim
          forever: true
  - of: preAuthEncode
    participants:
      - id: caller
        kind: actor
      - id: preAuthEncode
        kind: self
      - id: appendLE64
        kind: internal
    steps:
      - bind: total
        eval: le64Width
      - loop:
          do:
            - op: +=
              set: total
              value: le64Width + len(piece)
          key: _
          range: pieces
          value: piece
      - bind: out
        eval: make([]byte, 0, total)
      - set: out
        to: appendLE64
        value: appendLE64(out, uint64(len(pieces)))
      - loop:
          do:
            - set: out
              to: appendLE64
              value: appendLE64(out, uint64(len(piece)))
            - set: out
              value: append(out, piece...)
          key: _
          range: pieces
          value: piece
      - return: out
