    participants:
      - id: caller
        kind: actor
      - id: joseShape.encodeTime
        kind: self
      - id: json
        kind: stdlib
    steps:
      - return: json.RawMessage(strconv.FormatInt(instant.Unix(), decimalBase))
        to: json
  - of: joseShape.decodeAudience
    steps:
      - opt:
          do:
            - return: nil, nil
          when: len(raw) == 0
      - var:
          name: single
          type: string
      - opt:
          do:
            - return: "[]string{single}, nil"
          when: json.Unmarshal(raw, &single) == nil
      - var:
          name: many
          type: "[]string"
      - opt:
          do:
            - return: nil, malformed("aud is neither a string nor an array of strings")
          when: json.Unmarshal(raw, &many) != nil
      - return: many, nil
  - of: joseShape.encodeAudience
    participants:
      - id: caller
        kind: actor
      - id: joseShape.encodeAudience
        kind: self
      - id: json
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil, nil
          when: len(audience) == 0
      - opt:
          do:
            - return: json.RawMessage(quoteJSONString(audience[0])), nil
              to: json
          when: len(audience) == 1
      - return: json.RawMessage(quoteJSONStrings(audience)), nil
        to: json
  - of: quoteJSONString
    participants:
      - id: caller
        kind: actor
      - id: quoteJSONString
        kind: self
      - id: builder.Grow
        kind: value
      - id: builder.WriteByte
        kind: value
      - id: writeJSONStringByte
        kind: internal
      - id: builder.String
        kind: value
    steps:
      - var:
          name: builder
          type: strings.Builder
      - eval: builder.Grow(len(s) + quoteOverhead)
        to: builder.Grow
      - eval: builder.WriteByte('"')
        to: builder.WriteByte
      - loop:
          do:
            - eval: writeJSONStringByte(&builder, s[i])
              to: writeJSONStringByte
          key: i
          range: len(s)
      - eval: builder.WriteByte('"')
        to: builder.WriteByte
      - return: builder.String()
        to: builder.String
  - of: quoteJSONStrings
    participants:
      - id: caller
        kind: actor
      - id: quoteJSONStrings
        kind: self
      - id: builder.WriteByte
        kind: value
      - id: builder.WriteString
        kind: value
      - id: builder.String
        kind: value
    steps:
      - var:
          name: builder
          type: strings.Builder
      - eval: builder.WriteByte('[')
        to: builder.WriteByte
      - loop:
          do:
            - opt:
                do:
                  - eval: builder.WriteByte(',')
                    to: builder.WriteByte
                when: i > 0
            - eval: builder.WriteString(quoteJSONString(value))
              to: builder.WriteString
          key: i
          range: values
          value: value
      - eval: builder.WriteByte(']')
        to: builder.WriteByte
      - return: builder.String()
        to: builder.String
  - of: writeJSONStringByte
    participants:
      - id: caller
        kind: actor
      - id: writeJSONStringByte
        kind: self
      - id: builder.WriteByte
        kind: value
      - id: builder.WriteString
        kind: value
    steps:
      - switch:
          cases:
            - case: char == '"' || char == '\\'
              do:
                - eval: builder.WriteByte('\\')
                  to: builder.WriteByte
                - eval: builder.WriteByte(char)
                  to: builder.WriteByte
            - case: char < firstPrintable
              do:
                - eval: builder.WriteString(`\u00`)
                  to: builder.WriteString
                - eval: builder.WriteByte(hexDigit(char >> nibbleBits))
                  to: builder.WriteByte
                - eval: builder.WriteByte(hexDigit(char & lowNibbleMask))
                  to: builder.WriteByte
            - default: true
              do:
                - eval: builder.WriteByte(char)
                  to: builder.WriteByte
