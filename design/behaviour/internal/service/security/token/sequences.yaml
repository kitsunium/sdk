        to: errs
  - of: indexByKid
    participants:
      - id: caller
        kind: actor
      - id: indexByKid
        kind: self
      - id: key.Kid
        kind: value
      - id: bindJWK
        kind: internal
    steps:
      - bind: index
        eval: make(map[string][]boundKeyValue, len(set.Keys()))
      - loop:
          do:
            - bind: kid
              eval: key.Kid()
              to: key.Kid
            - opt:
                do:
                  - continue: true
                when: kid == ""
            - bind: binding, berr
              eval: bindJWK(key)
              to: bindJWK
            - set: index[kid]
              value: "append(index[kid], boundKeyValue{binding: binding, usable: berr == nil})"
          key: _
          range: set.Keys()
          value: key
