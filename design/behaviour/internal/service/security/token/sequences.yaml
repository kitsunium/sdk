    participants:
      - id: caller
        kind: actor
      - id: escapeLen
        kind: self
      - id: hexUnit
        kind: internal
    steps:
      - opt:
          do:
            - return: 0, coretoken.Malformed
          when: len(esc) < 2
      - switch:
          cases:
            - case: "'\"', '\\\\', '/', 'b', 'f', 'n', 'r', 't'"
              do:
                - return: 2, nil
            - case: "'u'"
            - default: true
              do:
                - return: 0, coretoken.Malformed
          "on": esc[1]
      - bind: unit, ok
        eval: hexUnit(esc)
        to: hexUnit
      - opt:
          do:
            - return: 0, coretoken.Malformed
          when: "!ok || isLowSurrogate(unit)"
