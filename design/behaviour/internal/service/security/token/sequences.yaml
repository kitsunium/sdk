                - return: rune(c-'a') + hexLetterOffset, true
            - case: c >= 'A' && c <= 'F'
              do:
                - return: rune(c-'A') + hexLetterOffset, true
            - default: true
              do:
                - return: 0, false
  - of: (*jsonScan).number
    participants:
      - id: caller
        kind: actor
      - id: (*jsonScan).number
        kind: self
      - id: s.consume
        kind: internal
      - id: s.exponent
        kind: internal
      - id: s.checkMagnitude
        kind: internal
