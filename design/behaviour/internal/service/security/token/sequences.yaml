    participants:
      - id: caller
        kind: actor
      - id: (*jsonScan).element
        kind: self
      - id: s.str
        kind: internal
      - id: s.skipSpace
        kind: internal
      - id: s.value
        kind: internal
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: coretoken.Malformed
                when: s.peek() != '"'
            - opt:
                do:
                  - return: err
                init:
                  bind: _, err
                  eval: s.str()
                  to: s.str
                when: err != nil
            - eval: s.skipSpace()
              to: s.skipSpace
            - opt:
                do:
                  - return: coretoken.Malformed
                when: "!s.consume(':')"
            - eval: s.skipSpace()
              to: s.skipSpace
          when: member
      - bind: _, err
        eval: s.value(depth + 1)
        to: s.value
      - return: err
