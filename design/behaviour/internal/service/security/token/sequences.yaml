      - var:
          name: headerErr
          type: error
      - bind: headerPassed
        eval: "false"
      - loop:
          do:
            - opt:
                do:
                  - continue: true
                when: "!candidate.usable"
            - opt:
                do:
                  - opt:
                      do:
                        - set: headerErr
                          value: herr
                      when: headerErr == nil
                  - continue: true
                init:
                  bind: herr
                  eval: v.policy.checkHeader(parts.header, candidate.binding.algorithm())
