# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      floatFormat and floatBits render a float attribute the way strconv's
      shortest round-trip form does.
    grouped: true
    items:
      - name: floatFormat
        type: byte
        value: "'g'"
      - name: floatBits
        type: int
        value: "64"
      - name: floatShort
        type: int
        value: "-1"
      - name: decimal
        type: int
        value: "10"
    name: floatFormat
  - doc: Byte costs the bound accounts for.
    grouped: true
    items:
      - doc: |-
          minValueBytes is the smallest value a cut can still write where a value
          is owed: the Ellipsis as a JSON string, `"…"`.
        name: minValueBytes
        type: int
        value: len(`"` + coreredact.Ellipsis + `"`)
      - doc: quoteBytes is the two quotation marks around a string.
        name: quoteBytes
        type: int
        value: "2"
      - doc: |-
          separatorBytes is a comma between members or elements, or the colon
          after a member name.
        name: separatorBytes
        type: int
        value: "1"
    name: minValueBytes
  - doc: quotedPlaceholder is the Placeholder as a JSON string.
    items:
      - name: quotedPlaceholder
        type: string
        value: "`\"` + coreredact.Placeholder + `\"`"
    name: quotedPlaceholder
  - doc: truncatedValue is what a value that cannot fit becomes.
    items:
      - name: truncatedValue
        type: string
        value: "`\"` + coreredact.Ellipsis + `\"`"
    name: truncatedValue
  - doc: fieldOffset carries where the reader refused a document.
    items:
      - name: fieldOffset
        type: string
        value: "\"offset\""
    name: fieldOffset
  - doc: hexDigits spells the four digits of a \uXXXX escape.
    items:
      - name: hexDigits
        type: string
        value: "\"0123456789abcdef\""
    name: hexDigits
  - doc: |-
      lineSeparator and paragraphSeparator are legal inside a JSON string and end
      a line in JavaScript, so a document shown in a page is escaped for them.
    grouped: true
    items:
      - name: lineSeparator
        type: rune
        value: "0x2028"
      - name: paragraphSeparator
        type: rune
        value: "0x2029"
    name: lineSeparator
  - doc: defaultTag is the struct tag key read when Config.Tag is empty.
    items:
      - name: defaultTag
        type: string
        value: "\"redact\""
    name: defaultTag
  - doc: secretOption is the tag option that declares a field secret.
    items:
      - name: secretOption
        type: string
        value: "\"secret\""
    name: secretOption
