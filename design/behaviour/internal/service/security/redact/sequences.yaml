      - opt:
          do:
            - return: nil
          when: p == nil
      - opt:
          do:
            - opt:
                do:
                  - return: nil
                when: index >= len(p.elements)
            - return: p.elements[index]
          when: p.elements != nil
      - return: p.items
  - of: (*Redactor).planOf
    participants:
      - id: caller
        kind: actor
      - id: (*Redactor).planOf
        kind: self
      - id: r.plans.Load
        kind: value
      - id: r.build
        kind: internal
      - id: r.plans.LoadOrStore
        kind: value
    steps:
      - opt:
          do:
            - return: nil
          when: t == nil
      - opt:
          do:
            - opt:
                do:
                  - return: known
                init:
                  bind: known, isPlan
                  eval: cached.(*plan)
                when: isPlan
          init:
            bind: cached, found
            eval: r.plans.Load(t)
            to: r.plans.Load
          when: found
      - bind: built
        eval: r.build(t, map[reflect.Type]*plan{})
        to: r.build
      - bind: stored, _
        eval: r.plans.LoadOrStore(t, built)
        to: r.plans.LoadOrStore
      - opt:
          do:
            - return: kept
          init:
            bind: kept, isPlan
            eval: stored.(*plan)
          when: isPlan
      - return: built
  - of: (*Redactor).build
    participants:
      - id: caller
        kind: actor
      - id: (*Redactor).build
        kind: self
      - id: t.Elem
        kind: value
      - id: r.fields
        kind: internal
      - id: r.below
        kind: internal
    steps:
      - loop:
          cond: t.Kind() == reflect.Pointer
          do:
            - set: t
              to: t.Elem
              value: t.Elem()
      - opt:
          do:
            - return: nil
          when: writesOwnJSON(t)
      - switch:
          cases:
            - case: reflect.Struct
              do:
                - opt:
                    do:
                      - return: building
                    init:
                      bind: building, found
                      eval: seen[t]
                    when: found
                - bind: built
                  eval: "&plan{members: map[string]*plan{}, paths: map[string][]int{}}"
                - set: seen[t]
                  value: built
                - eval: r.fields(built, t, seen)
                  to: r.fields
                - return: built
            - case: reflect.Slice, reflect.Array
              do:
                - opt:
                    do:
                      - return: nil
                    when: t.Elem().Kind() == reflect.Uint8
                - return: r.below(t.Elem(), seen)
                  to: r.below
            - case: reflect.Map
              do:
                - return: r.below(t.Elem(), seen)
                  to: r.below
            - case: reflect.Interface
              do:
                - return: dynamicPlan
            - default: true
              do:
                - return: nil
          "on": t.Kind()
  - of: (*Redactor).opensAt
    participants:
      - id: caller
        kind: actor
      - id: (*Redactor).opensAt
        kind: self
      - id: r.opens.Load
        kind: value
      - id: isOpen
        kind: internal
      - id: r.opens.Store
        kind: value
    steps:
      - opt:
          do:
            - opt:
                do:
                  - return: open
                init:
                  bind: open, isBool
                  eval: cached.(bool)
                when: isBool
          init:
            bind: cached, found
            eval: r.opens.Load(t)
            to: r.opens.Load
          when: found
      - bind: open
        eval: isOpen(declared, map[*plan]bool{})
        to: isOpen
      - eval: r.opens.Store(t, open)
        to: r.opens.Store
      - return: open
  - of: isOpen
    participants:
      - id: caller
        kind: actor
      - id: isOpen
        kind: self
    steps:
      - opt:
          do:
            - return: "false"
          when: p == nil || seen[p]
      - set: seen[p]
        value: "true"
      - opt:
          do:
            - return: "true"
          when: p.dynamic
      - loop:
          do:
            - opt:
                do:
                  - return: "true"
                when: isOpen(member, seen)
          key: _
          range: p.members
          value: member
      - return: isOpen(p.items, seen)
        to: isOpen
  - of: (*Redactor).resolve
    participants:
      - id: caller
        kind: actor
      - id: (*Redactor).resolve
        kind: self
      - id: r.resolveHeld
        kind: internal
      - id: rv.Elem
        kind: value
      - id: r.resolveStruct
        kind: internal
      - id: r.resolveElements
        kind: internal
      - id: r.resolveEntries
        kind: internal
    steps:
      - opt:
          do:
            - return: p
          when: p == nil || p.secret
      - opt:
          do:
            - return: r.resolveHeld(rv)
              to: r.resolveHeld
          when: p.dynamic
      - loop:
          cond: rv.Kind() == reflect.Pointer || rv.Kind() == reflect.Interface
          do:
            - opt:
                do:
                  - return: p
                when: rv.IsNil()
            - set: rv
              to: rv.Elem
              value: rv.Elem()
      - switch:
          cases:
            - case: reflect.Struct
              do:
                - return: r.resolveStruct(p, rv)
                  to: r.resolveStruct
            - case: reflect.Slice, reflect.Array
              do:
                - return: r.resolveElements(p, rv)
                  to: r.resolveElements
            - case: reflect.Map
              do:
                - return: r.resolveEntries(p, rv)
                  to: r.resolveEntries
            - default: true
              do:
                - return: p
          "on": rv.Kind()
  - of: (*Redactor).resolveHeld
    participants:
      - id: caller
        kind: actor
      - id: (*Redactor).resolveHeld
        kind: self
      - id: rv.Elem
        kind: value
      - id: r.resolve
        kind: internal
    steps:
      - opt:
          do:
            - return: nil
          when: rv.Kind() != reflect.Interface || rv.IsNil()
      - bind: held
        eval: rv.Elem()
        to: rv.Elem
      - return: r.resolve(r.planOf(held.Type()), held)
        to: r.resolve
  - of: (*Redactor).resolveElements
    participants:
      - id: caller
        kind: actor
      - id: (*Redactor).resolveElements
        kind: self
      - id: r.resolve
        kind: internal
    steps:
      - bind: resolved
        eval: "&plan{elements: make([]*plan, rv.Len())}"
      - loop:
          do:
            - set: resolved.elements[index]
              to: r.resolve
              value: r.resolve(p.items, rv.Index(index))
          key: index
          range: rv.Len()
      - return: resolved
  - of: (*Redactor).resolveEntries
    participants:
      - id: caller
        kind: actor
      - id: (*Redactor).resolveEntries
        kind: self
      - id: rv.MapRange
        kind: value
      - id: mapKeyName
        kind: internal
      - id: r.resolve
        kind: internal
    steps:
      - bind: resolved
        eval: "&plan{members: map[string]*plan{}}"
      - bind: entries
        eval: rv.MapRange()
        to: rv.MapRange
      - loop:
          cond: entries.Next()
          do:
            - bind: name, named
              eval: mapKeyName(entries.Key())
              to: mapKeyName
            - opt:
                do:
                  - continue: true
                when: "!named"
            - opt:
                do:
                  - set: resolved.members[name]
                    value: member
                init:
                  bind: member
                  eval: r.resolve(p.items, entries.Value())
                  to: r.resolve
                when: member != nil
      - return: resolved
  - of: (*Redactor).resolveStruct
    participants:
      - id: caller
        kind: actor
      - id: (*Redactor).resolveStruct
        kind: self
      - id: rv.FieldByIndexErr
        kind: value
      - id: r.resolve
        kind: internal
    steps:
      - bind: resolved
        eval: "&plan{members: map[string]*plan{}}"
      - loop:
          do:
            - bind: field, unreachable
              eval: rv.FieldByIndexErr(p.paths[name])
              to: rv.FieldByIndexErr
            - opt:
                do:
                  - continue: true
                when: unreachable != nil
            - opt:
                do:
                  - set: resolved.members[name]
                    value: inner
                init:
                  bind: inner
                  eval: r.resolve(member, field)
                  to: r.resolve
                when: inner != nil
          key: name
          range: p.members
          value: member
      - return: resolved
  - of: mapKeyName
    participants:
      - id: caller
        kind: actor
      - id: mapKeyName
        kind: self
      - id: key.String
        kind: value
      - id: marshaler.MarshalText
        kind: value
      - id: strconv
        kind: stdlib
    steps:
      - opt:
          do:
            - return: key.String(), true
              to: key.String
          when: key.Kind() == reflect.String
      - opt:
          do:
            - bind: text, textErr
              eval: marshaler.MarshalText()
              to: marshaler.MarshalText
            - opt:
                do:
                  - return: "\"\", false"
                when: textErr != nil
            - return: string(text), true
          init:
            bind: marshaler, isText
            eval: reflect.TypeAssert[encoding.TextMarshaler](key)
          when: isText
      - switch:
          cases:
            - case: reflect.Int, reflect.Int8, reflect.Int16, reflect.Int32, reflect.Int64
              do:
                - return: strconv.FormatInt(key.Int(), 10), true
                  to: strconv
            - case: reflect.Uint, reflect.Uint8, reflect.Uint16, reflect.Uint32, reflect.Uint64, reflect.Uintptr
              do:
                - return: strconv.FormatUint(key.Uint(), 10), true
                  to: strconv
            - default: true
              do:
                - return: "\"\", false"
          "on": key.Kind()
  - of: (*Redactor).below
    participants:
      - id: caller
        kind: actor
      - id: (*Redactor).below
        kind: self
      - id: r.build
        kind: internal
    steps:
      - opt:
          do:
            - return: "&plan{items: inner}"
          init:
            bind: inner
            eval: r.build(element, seen)
            to: r.build
          when: inner != nil
      - return: nil
  - of: (*Redactor).fields
    participants:
      - id: caller
        kind: actor
      - id: (*Redactor).fields
        kind: self
      - id: r.memberPlan
        kind: internal
    steps:
      - loop:
          do:
            - opt:
                do:
                  - set: p.members[written.name]
                    value: member
                  - set: p.paths[written.name]
                    value: written.index
                init:
                  bind: member
                  eval: r.memberPlan(written.field, seen)
                  to: r.memberPlan
                when: member != nil
          key: _
          range: writtenFields(t)
          value: written
  - of: (*Redactor).memberPlan
    participants:
      - id: caller
        kind: actor
      - id: (*Redactor).memberPlan
        kind: self
      - id: r.build
        kind: internal
    steps:
      - opt:
          do:
            - return: "&plan{secret: true}"
          when: r.declared(field)
      - return: r.build(field.Type, seen)
        to: r.build
  - of: DefaultWords
    participants:
      - id: caller
        kind: actor
      - id: DefaultWords
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - return: slices.Clone(defaultWords)
        to: slices
  - of: NewRedactor
    participants:
      - id: caller
        kind: actor
      - id: NewRedactor
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - bind: words
        eval: cfg.Words
      - opt:
          do:
            - set: words
              value: defaultWords
          when: len(words) == 0
      - bind: lowered
        eval: make([]string, 0, len(words))
      - loop:
          do:
            - opt:
                do:
                  - set: lowered
                    value: append(lowered, word)
                init:
                  bind: word
                  eval: strings.ToLower(strings.TrimSpace(word))
                  op: =
                  to: strings
                when: word != ""
          key: _
          range: words
          value: word
      - bind: tag
        eval: cfg.Tag
      - opt:
          do:
            - set: tag
              value: defaultTag
          when: tag == ""
      - return: "&Redactor{field: cfg.Field, error: cfg.Error, tag: tag, words: lowered}"
  - of: (*Redactor).Name
    participants:
      - id: caller
        kind: actor
      - id: (*Redactor).Name
        kind: self
      - id: strings
        kind: stdlib
    steps:
      - bind: lowered
        eval: strings.ToLower(name)
        to: strings
      - loop:
          do:
            - opt:
                do:
                  - return: "true"
                when: strings.Contains(lowered, word)
          key: _
          range: r.words
          value: word
      - return: "false"
  - of: bound
    steps:
      - return: max(maxBytes, coreredact.MinBytes)
  - of: (*Redactor).Text
    participants:
      - id: caller
        kind: actor
      - id: (*Redactor).Text
        kind: self
      - id: clip
        kind: internal
    steps:
      - return: clip(r.scrub(s), bound(maxBytes))
        to: clip
  - of: (*Redactor).scrub
    participants:
      - id: caller
        kind: actor
      - id: (*Redactor).scrub
        kind: self
      - id: credentials().ReplaceAllString
        kind: value
    steps:
      - opt:
          do:
            - return: s
          when: "!strings.Contains(s, \"://\") || !strings.Contains(s, \"@\")"
      - return: credentials().ReplaceAllString(s, "${1}"+coreredact.Placeholder+"@")
        to: credentials().ReplaceAllString
  - of: clip
    steps:
      - opt:
          do:
            - return: s
          when: len(s) <= limit
      - bind: cut
        eval: limit - len(coreredact.Ellipsis)
      - loop:
          cond: cut > 0 && !utf8.RuneStart(s[cut])
          do:
            - op: "--"
              set: cut
      - return: s[:cut] + coreredact.Ellipsis
