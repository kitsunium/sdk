# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      fileSuffix marks the variable naming a FILE whose content is the secret —
      the convention the official container images and Kubernetes manifests use,
      so that the value itself never sits in the environment where /proc, `docker
      inspect` and every child process can read it.
    items:
      - name: fileSuffix
        type: string
        value: "\"_FILE\""
    name: fileSuffix
  - doc: |-
      maxEnvFileBytes bounds what a _FILE secret may hold. A secret is a password,
      a token, a key or a certificate — kilobytes at most. A file larger than this
      is almost certainly a wrong path (a binary, a log, a directory's worth of
      data), and reading it whole into memory to find out would be the failure.
    items:
      - name: maxEnvFileBytes
        type: int64
        value: 64 << 10
    name: maxEnvFileBytes
  - doc: prefixSeparator joins a prefix to the variable part of a name.
    items:
      - name: prefixSeparator
        type: string
        value: "\"_\""
    name: prefixSeparator
  - doc: |-
      lockPrefix namespaces the lock names this store takes, one per secret, so a
      locker shared with other code cannot collide with them.
    items:
      - name: lockPrefix
        type: string
        value: "\"kitsunium/secret/\""
    name: lockPrefix
  - doc: |-
      storeDirMode is the mode the store's directory is CREATED with. An existing
      directory is checked, never changed: silently narrowing a mode an operator
      chose would hide the finding from them.
    items:
      - name: storeDirMode
        type: fs.FileMode
        value: "0o700"
    name: storeDirMode
  - doc: recordMode is the mode every record is published with.
    items:
      - name: recordMode
        type: fs.FileMode
        value: "0o600"
    name: recordMode
  - doc: |-
      otherAccountBits are the group and world permission bits. A store directory
      carrying any of them lets another account list — or worse — the secrets.
    items:
      - name: otherAccountBits
        type: fs.FileMode
        value: "0o077"
    name: otherAccountBits
  - doc: |-
      recordFormat is the one record format this build writes and reads. A record
      carrying another is refused rather than guessed at.
    items:
      - name: recordFormat
        type: int
        value: "1"
    name: recordFormat
  - doc: |-
      recordSuffix names a record file: "<name>.secret". Nothing else the
      directory holds — the lock files, a publication's temporary — ends with it.
    items:
      - name: recordSuffix
        type: string
        value: "\".secret\""
    name: recordSuffix
  - doc: |-
      recordAADPrefix is the associated data every sealed record binds, followed
      by the secret's name: a record copied under another name, or a box sealed
      by another program under the same key, does not open.
    items:
      - name: recordAADPrefix
        type: string
        value: "\"kitsunium/secret file record v1\\x00\""
    name: recordAADPrefix
  - doc: |-
      sealAlgorithm is the AEAD a record is sealed with: the SDK's default, which
      the blank import in keyring.go activates.
    items:
      - name: sealAlgorithm
        type: corecrypto.Algorithm
        value: "\"aes-256-gcm\""
    name: sealAlgorithm
  - doc: |-
      platformNative reports that this GOOS has every mechanic the file store
      needs. NewFile reads it before touching the disk.
    items:
      - name: platformNative
        type: bool
        value: "true"
    name: platformNative
  - doc: |-
      keyDirMode is the mode the key file's directory is created with when it has
      to be made. An existing directory is left as it is.
    items:
      - name: keyDirMode
        type: fs.FileMode
        value: "0o700"
    name: keyDirMode
  - doc: |-
      keyTempPattern names the temporary a new key is written to before it is
      published by a hard link. It starts with a dot, so it never lists as a name
      anyone chose.
    items:
      - name: keyTempPattern
        type: string
        value: "\".keyfile-*.tmp\""
    name: keyTempPattern
  - doc: |-
      boxFormat is the first byte of every box and every signature a Keyring
      makes. A future format gets another byte, and this one keeps opening.
    items:
      - name: boxFormat
        type: byte
        value: "0x01"
    name: boxFormat
  - doc: |-
      versionBytes is the width of the version number a box carries, big-endian.
      Four bytes is four billion rotations; one fixed width is one spelling per
      box, which a variable-length integer would not be.
    items:
      - name: versionBytes
        type: int
        value: "4"
    name: versionBytes
  - doc: |-
      headerLen is the format byte plus the version: what Open reads before it
      knows which key to use.
    items:
      - name: headerLen
        type: int
        value: 1 + versionBytes
    name: headerLen
  - doc: macAlgorithm signs; kdfAlgorithm separates one version into two keys.
    grouped: true
    items:
      - doc: macAlgorithm is HMAC-SHA256, the detached-MAC default.
        name: macAlgorithm
        type: corecrypto.Algorithm
        value: "\"hmac-sha256\""
      - doc: kdfAlgorithm is HKDF-SHA256, the key-separation default.
        name: kdfAlgorithm
        type: corecrypto.Algorithm
        value: "\"hkdf-sha256\""
    name: macAlgorithm
  - doc: |-
      sealLabel and signLabel are the HKDF context labels that make a version's
      sealing key and signing key two independent keys. Using one 32-byte value
      both as an AES key and as an HMAC key is the cross-primitive reuse key
      separation exists to prevent, and the derivation costs a microsecond.

      wrapLabel is the third purpose (ADR 0142): the AEAD key a version wraps
      subject data keys under. A box Seal makes is sealed under another key, so
      no value a caller seals directly under a root can ever unwrap as a data
      key, whatever associated data it was given.
    grouped: true
    items:
      - doc: sealLabel derives the AEAD key.
        name: sealLabel
        type: string
        value: "\"kitsunium/secret keyring seal v1\""
      - doc: signLabel derives the MAC key.
        name: signLabel
        type: string
        value: "\"kitsunium/secret keyring sign v1\""
      - doc: wrapLabel derives the AEAD key subject data keys are wrapped under.
        name: wrapLabel
        type: string
        value: "\"kitsunium/secret keyring wrap v1\""
    name: sealLabel
  - doc: |-
      bindingPrefix opens the bytes every box's associated data and every
      signature's message are bound to: the keyring's name, NUL-terminated (NUL is
      not in the name alphabet), then the version. A box sealed under keyring "a"
      therefore does not open under keyring "b" even if the two held the same
      bytes, and a box's version cannot be edited in its header.
    items:
      - name: bindingPrefix
        type: string
        value: "\"kitsunium/secret keyring v1\\x00\""
    name: bindingPrefix
  - doc: |-
      initialSecrets is the map's starting capacity: a service holds a handful of
      secrets, not thousands, so this avoids the first growth steps and no more.
    items:
      - name: initialSecrets
        type: int
        value: "8"
    name: initialSecrets
  - doc: |-
      minKeep is the fewest versions a rotation may keep: the new one and the one
      it replaced. Keeping one would retire the previous key at the instant of the
      rotation, so every box sealed a moment before it would stop opening — the
      outage a rotation policy exists to avoid.
    items:
      - name: minKeep
        type: int
        value: "2"
    name: minKeep
  - doc: |-
      minRandomBytes is the shortest secret [Random] generates: 128 bits. Anything
      shorter is guessable in a way no caller asking for a secret means.
    items:
      - name: minRandomBytes
        type: int
        value: "16"
    name: minRandomBytes
  - doc: rotateLockPrefix namespaces the lock a rotator takes when it is given one.
    items:
      - name: rotateLockPrefix
        type: string
        value: "\"kitsunium/secret-rotate/\""
    name: rotateLockPrefix
  - doc: |-
      subjectBoxFormat is the first byte of every subject box. A future layout
      gets another byte, and this one keeps opening.
    items:
      - name: subjectBoxFormat
        type: byte
        value: "0x01"
    name: subjectBoxFormat
  - doc: |-
      keyIDLen is the width of the key identifier a subject box carries: 64 bits
      derived from the data key, enough that two keys of one subject — the one an
      erasure destroyed and the one made after — never share it by accident.
    items:
      - name: keyIDLen
        type: int
        value: "8"
    name: keyIDLen
  - doc: |-
      subjectHeaderMin is the header of the shortest subject: the format byte,
      the subject's length byte, one byte of subject, and the key identifier.
    items:
      - name: subjectHeaderMin
        type: int
        value: 2 + 1 + keyIDLen
    name: subjectHeaderMin
  - doc: |-
      bindPartPrefix is the width of the big-endian length that precedes each
      binding part, the keytree's injective encoding: ("ab", "c") and ("a", "bc")
      are two different bindings.
    items:
      - name: bindPartPrefix
        type: int
        value: "4"
    name: bindPartPrefix
  - doc: |-
      The domain strings that open every piece of associated data this file
      builds. Each ends in NUL, which neither a subject nor a keyring name can
      contain, so no binding of one kind can be spelled as a binding of another.
    grouped: true
    items:
      - doc: subjectBoxDomain opens a subject box's associated data.
        name: subjectBoxDomain
        type: string
        value: "\"kitsunium/secret subject box v1\\x00\""
      - doc: wrapDomain opens the associated data a data key is wrapped with.
        name: wrapDomain
        type: string
        value: "\"kitsunium/secret subject key v1\\x00\""
    name: subjectBoxDomain
  - doc: |-
      createAttempts bounds how many times a Seal re-reads a subject whose key a
      concurrent writer created — or created and destroyed — under it. Two reads
      settle every ordinary race; a third failure means keys are being created and
      destroyed in a loop, and the store is reported rather than raced forever.
    items:
      - name: createAttempts
        type: int
        value: "3"
    name: createAttempts
  - doc: |-
      The HKDF labels that turn one data key into its AEAD key and its
      identifier. Each is followed by NUL and the subject, so the two derived
      values are independent of each other and bound to the subject.
    grouped: true
    items:
      - doc: subjectSealLabel derives the AEAD key a subject's boxes are sealed with.
        name: subjectSealLabel
        type: string
        value: "\"kitsunium/secret subject seal v1\\x00\""
      - doc: subjectIDLabel derives the identifier every such box carries.
        name: subjectIDLabel
        type: string
        value: "\"kitsunium/secret subject id v1\\x00\""
    name: subjectSealLabel
  - doc: The four outcomes, counted by RewrapValue.
    grouped: true
    items:
      - doc: "outcomeCurrent: already under the newest version."
        name: outcomeCurrent
        type: rewrapOutcome
        value: iota
      - doc: "outcomeRewrapped: moved to the newest version."
        name: outcomeRewrapped
      - doc: "outcomeSkipped: destroyed or changed meanwhile."
        name: outcomeSkipped
      - doc: "outcomeUnreadable: did not unwrap."
        name: outcomeUnreadable
      - doc: "outcomeMoved: moved from the former root to the newest version."
        name: outcomeMoved
    name: outcomeCurrent
  - doc: |-
      exitTempFail matches sysexits EX_TEMPFAIL (75), the exit status of core
      StoreUnavailable: a subject-key store that failed may answer the next
      attempt, and a verdict built around a plain store error carries it too.
    items:
      - name: exitTempFail
        type: int
        value: "75"
    name: exitTempFail
