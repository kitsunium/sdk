functions:
  - name: NewEnv
    params: cfg EnvConfig
    results: store coresecret.Store, err error
  - doc: normalisePrefix validates a configured prefix and appends its separator.
    name: normalisePrefix
    params: prefix string
    results: normalised string, err error
  - doc: |-
      isVariableName reports whether name is spelled the way a POSIX shell exports
      a variable, in upper case: letters, digits and '_', not starting with a
      digit.
    name: isVariableName
    params: name string
    results: bool
  - doc: |-
      readSecretFile reads a _FILE secret: bounded, one trailing line ending
      removed, empty refused. Created is the file's modification time — the one
      timestamp the environment store can honestly report.
    name: readSecretFile
    params: name, fileVariable, path string
    results: current coresecret.VersionValue, err error
  - doc: |-
      readBounded reads at most maxEnvFileBytes+1 bytes of path — one more than
      allowed, so an oversized file is detected without being read whole.
    name: readBounded
    params: path string
    results: content []byte, modified time.Time, err error
  - doc: |-
      trimLineEnding removes ONE trailing "\n" or "\r\n". Only one: a secret that
      genuinely ends in a newline written by `printf 'x\n\n'` keeps the other.
    name: trimLineEnding
    params: content []byte
    results: "[]byte"
  - name: NewFile
    params: cfg FileConfig
    results: store coresecret.Store, err error
  - doc: |-
      rootCloser returns the io.Closer vfs.NewOS documents its filesystem to be,
      or a closer that does nothing for a filesystem that holds nothing.
    name: rootCloser
    params: root corevfs.FullFS
    results: io.Closer
  - doc: closeRoot releases a root on a construction path that is abandoning it.
    name: closeRoot
    params: root corevfs.FullFS
    results: error
  - doc: |-
      checkHeldRoot re-checks the directory the store HOLDS, through its handle,
      and proves the path still names it.

      prepareDir judged a PATH; vfs.NewOS then opened the path again, and the lock
      domain resolves it on every acquisition. Anyone able to swap the path
      between those resolutions — a writable parent — could hand the store a
      directory nobody checked, or split its records from its locks. So the mode
      is judged again on the opened handle, which cannot be swapped, and the path
      must still resolve to that same directory, so the locker's lock files land
      beside the records they serialise. What remains open is a swap AFTER
      construction, which is the lock domain's own exposure: its chain audit
      refuses an indirection at a parent any account can write (ADR 0083).
    name: checkHeldRoot
    params: root fs.FS, dir string
    results: error
  - doc: |-
      prepareDir creates dir 0700 when it is absent and checks it when it is not.
      The check is the point: an existing directory another account can read is
      refused, never narrowed.
    name: prepareDir
    params: dir string
    results: error
  - doc: recordPath is the path of name's record inside the store's root.
    name: recordPath
    params: name string
    results: string
  - doc: recordAAD is the associated data a sealed record of name binds.
    name: recordAAD
    params: name string
    results: "[]byte"
  - doc: |-
      encodeRecord renders a newest-first history as the bytes to publish, sealed
      when key is set. The plaintext is cleared once it has been sealed, so the
      only copy of the document in memory is the one that is about to be written.
    name: encodeRecord
    params: name string, versions []coresecret.VersionValue, key corecrypto.Key, sealed bool
    results: encoded []byte, err error
  - doc: |-
      decodeRecord reads the bytes of name's record back into a newest-first
      history, opening them first when the store is sealed. Every failure is
      RecordUnreadable, and none of them repeats the decoder's message: that
      message can quote the document, and the document is the secret.
    name: decodeRecord
    params: name string, data []byte, key corecrypto.Key, sealed bool
    results: versions []coresecret.VersionValue, err error
  - doc: |-
      historyOf converts a decoded record into VersionValues, refusing a history
      this store could not have written: empty, an empty value, a non-positive
      number, or numbers that do not strictly decrease.
    name: historyOf
    params: name string, record fileRecord
    results: versions []coresecret.VersionValue, err error
  - doc: unreadable is the RecordUnreadable verdict for name, with the clause.
    name: unreadable
    params: name, problem string
    results: error
  - doc: |-
      clearRecord overwrites every secret the decoded or encoded document holds.
      The Values handed out are copies, so this only erases the transient buffers
      the JSON round trip created.
    name: clearRecord
    params: record fileRecord
  - name: KeyFile
    params: path string
    results: key corecrypto.Key, err error
  - doc: |-
      readKeyFile reads an existing key file, reporting absent when there is none.
      The checks run on the OPENED file, so the file judged is the file read.
    name: readKeyFile
    params: path string
    results: key corecrypto.Key, absent bool, err error
  - doc: keyFromOpenFile judges and reads an opened key file.
    name: keyFromOpenFile
    params: file statter
    results: key corecrypto.Key, err error
  - doc: |-
      createKeyFile publishes a fresh key at path unless another caller published
      one first, and returns whichever key the file then holds.
    name: createKeyFile
    params: path string
    results: key corecrypto.Key, err error
  - doc: |-
      publishKey writes raw to a flushed temporary beside path and hard-links it
      to path, which the kernel refuses when path exists. It reports false, and
      no error, when another caller's file was there first.
    name: publishKey
    params: dir, path string, raw []byte
    results: published bool, err error
  - doc: writeAndSync writes raw and flushes it to the device.
    name: writeAndSync
    params: temp syncer, raw []byte
    results: error
  - doc: |-
      syncDir flushes a directory's entries, so a name just linked into it
      survives a power loss.
    name: syncDir
    params: dir string
    results: err error
  - doc: |-
      keyFileUnavailable is the retryable verdict for one key-file operation. The
      cause travels as a field only for the operation's name: an *os.PathError
      message carries the path, which is not repeated.
    name: keyFileUnavailable
    params: operation string, cause error
    results: error
  - name: NewKeyring
    params: store coresecret.Store, name string
    results: keyring *Keyring, err error
  - doc: header is the format byte and the version, big-endian.
    name: header
    params: version int
    results: "[]byte"
  - doc: |-
      parseHeader splits a box or a signature into its version and the rest,
      reporting false for anything this build did not make.
    name: parseHeader
    params: data []byte
    results: version int, rest []byte, parsed bool
  - doc: |-
      verdictOr keeps a store's retryable verdict and replaces every other failure
      with the non-oracle one: "the store is down" and "this box is not ours" call
      for different responses, and only the first is safe to tell apart.
    name: verdictOr
    params: err error, oracleSafe *errs.Error
    results: error
  - name: NewMemory
    params: cfg MemoryConfig
    results: coresecret.Store
  - name: Random
    params: n int
    results: func() (coresecret.Value, error)
  - name: NewRotator
    params: cfg RotatorConfig
    results: rotator *Rotator, err error
  - doc: refuseSetting is the InvalidConfig verdict for one setting.
    name: refuseSetting
    params: setting, problem string
    results: error
  - name: SubjectOf
    params: box []byte
    results: subject string, err error
  - doc: |-
      subjectHeader lays out a box's header:

      	0x01 | len(subject), one byte | subject | key identifier, 8 bytes

      The subject is length-prefixed and the identifier fixed-width, so a header
      reads one way only.
    name: subjectHeader
    params: subject string, id [keyIDLen]byte
    results: "[]byte"
  - doc: |-
      parseSubjectBox splits box, reporting false for anything this build did not
      make: an unknown format, a length that overruns, a subject outside the
      grammar, or no AEAD box after the header.
    name: parseSubjectBox
    params: box []byte
    results: parsed subjectBox, ok bool
  - doc: |-
      subjectAAD is the associated data of a subject box: the domain string, the
      whole header — so neither the subject nor the key identifier can be edited —
      then each binding part, length-prefixed.
    name: subjectAAD
    params: header []byte, bind []string
    results: "[]byte"
  - doc: |-
      wrapAAD is the associated data a subject's data key is wrapped with under
      the root keyring's wrap key — the keyring prefixes its own name and version
      to it — so a wrapped key filed under another subject does not unwrap.
    name: wrapAAD
    params: subject string
    results: "[]byte"
  - doc: |-
      newKeyCache returns a cache of at most size opened keys, each kept for ttl.
      A size of zero caches nothing: every lookup misses and every offer wipes.
    name: newKeyCache
    params: size int, ttl time.Duration, clk clock.Clock
    results: "*keyCache"
  - name: NewSubjectKeys
    params: cfg SubjectKeysConfig
    results: keys *SubjectKeys, err error
  - doc: |-
      deriveOpened derives from a data key the AEAD key its boxes are sealed with
      and the identifier they carry, by HKDF-SHA256 under two labels, both bound
      to the subject. The data key is never used as a cipher key itself.
    name: deriveOpened
    params: subject string, dek []byte
    results: opened *openedKey, err error
  - doc: |-
      sameID compares two key identifiers in constant time. An identifier is not
      secret, but a comparison that leaks the length of a shared prefix has no
      reason to exist in a package that compares keys.
    name: sameID
    params: held, named [keyIDLen]byte
    results: bool
  - doc: keyDestroyed is the KeyDestroyed verdict for one subject.
    name: keyDestroyed
    params: subject string
    results: error
  - doc: keyUnreadable is the SubjectKeyUnreadable verdict for one subject.
    name: keyUnreadable
    params: subject string
    results: error
  - name: NewMemorySubjectKeyStore
    results: coresecret.SubjectKeyStore
  - doc: |-
      openedUnder reports the root version entry's key is wrapped under, and
      whether it opens there as one data key. The key is cleared at once: the
      question is where it lives, not what it is.
    name: openedUnder
    params: view *rootView, entry coresecret.SubjectKeyValue
    results: version int, opens bool
  - doc: |-
      unwrapIn opens entry's wrapped key under the view and returns the data key,
      which the caller clears. It reports false for everything the load path
      would refuse as unreadable: a subject outside the grammar, a version the
      view does not hold, a wrapper altered or sealed for another purpose, and a
      plaintext that is not one key long.
    name: unwrapIn
    params: view *rootView, entry coresecret.SubjectKeyValue
    results: dek []byte, opened bool
  - doc: |-
      checkPut refuses a Put every store must refuse, before any backend work: a
      malformed name, and an empty secret — empty reports the value's IsZero, so
      the check never holds the secret itself.
    name: checkPut
    params: name string, empty bool
    results: error
  - doc: |-
      checkPrune refuses a Prune every store must refuse: a malformed name, and a
      keep that would delete the secret.
    name: checkPrune
    params: name string, keep int
    results: error
  - doc: notFound is the NotFound verdict for one secret.
    name: notFound
    params: name string
    results: error
  - doc: |-
      nextVersion is the number a new version of a secret takes: one past the
      highest ever kept, or 1 for a secret with no version.

      It reads the HIGHEST number rather than counting the versions, because a
      prune removes versions without renumbering the rest — counting would hand a
      pruned number back out, and a reused number would open an old box with a new
      key.
    name: nextVersion
    params: versions []coresecret.VersionValue
    results: int
  - doc: pruned returns the newest keep versions of a newest-first history.
    name: pruned
    params: versions []coresecret.VersionValue, keep int
    results: "[]coresecret.VersionValue"
  - doc: |-
      storeFailure is the verdict for an error a SubjectKeyStore method returned:
      the retryable core StoreUnavailable, naming the operation and — when the
      call was about one — the subject.

      It wraps the store's error rather than the sentinel, as the state-machine
      engine does with its own caller's store: a store error that is itself an SDK
      error keeps its code — origin wins — and gains StoreUnavailable in its trail,
      and a plain error stays reachable through errors.Is. A caller's store is the
      caller's code, so its message is the caller's to keep free of secrets; the
      engine adds only a valid subject, which is a reference and never a value.
    name: storeFailure
    params: cause error, operation, subject string
    results: error
  - doc: |-
      wrapAs returns the given sentinel as the error origin — its code, reason and
      public message win — with the cause's message and any extra fields attached
      as log-only metadata.

      Wrapping the sentinel rather than the cause is what keeps this domain's
      verdict intact: errs.Wrap is origin-wins, so an *errs.Error cause passed
      first would hijack the code. Callers pass a cause only when its message is
      known not to carry a secret — an I/O error, a lock error — never a decoder's
      message.
    name: wrapAs
    params: sentinel *errs.Error, cause error, fields ...errs.FieldValue
    results: error
imports:
  binary: encoding/binary
  bytes: bytes
  clock: github.com/kitsunium/sdk/internal/kernel/clock
  context: context
  corecrypto: github.com/kitsunium/sdk/internal/core/crypto
  corelock: github.com/kitsunium/sdk/internal/core/app/lock
  coreproc: github.com/kitsunium/sdk/internal/core/proc
  coresecret: github.com/kitsunium/sdk/internal/core/security/secret
  corevfs: github.com/kitsunium/sdk/internal/core/data/vfs
  errors: errors
  errs: github.com/kitsunium/sdk/internal/kernel/errs
  filepath: path/filepath
  fs: io/fs
  io: io
  iter: iter
  json: encoding/json
  kcache: github.com/kitsunium/sdk/internal/kernel/collections/cache
  maps: maps
  math: math
  os: os
  rand: crypto/rand
  slices: slices
  strings: strings
  subtle: crypto/subtle
  svclock: github.com/kitsunium/sdk/internal/service/app/lock
  svcvfs: github.com/kitsunium/sdk/internal/service/data/vfs
  sync: sync
  time: time
package:
  docFile: doc.go
  importPath: github.com/kitsunium/sdk/internal/service/security/secret
  name: secret
  purpose: Package secret — the read-only store over the process environment, with the NAME_FILE convention Docker and Kubernetes secrets use.
types:
  - fields:
      - doc: |-
          Prefix namespaces every variable: with "APP", the secret "smtp-url" is
          read from APP_SMTP_URL, or from the file APP_SMTP_URL_FILE names. The
          separating underscore belongs to the store, and a trailing one on Prefix
          is absorbed, so "APP" and "APP_" name the same namespace.

          Empty is allowed and means no namespace: "smtp-url" reads SMTP_URL. It
          is a legitimate choice — DATABASE_URL is a convention of its own — and
          Names then lists the whole environment, mapped to names, which is noise
          but never a value.

          A non-empty prefix must be uppercase ASCII letters, digits and '_', and
          must not start with a digit or consist of underscores alone: anything
          else is not a variable name a shell can export.
        name: Prefix
        type: string
    kind: struct
    name: EnvConfig
  - doc: envStore reads secrets from the process environment and never writes.
    fields:
      - doc: "prefix is the normalised namespace: \"\" or \"NAME_\"."
        name: prefix
        type: string
    kind: struct
    methods:
      - doc: |-
          variableFor maps a valid secret name to the variable that carries it:
          upper-cased, '-' turned into '_', behind the prefix. The mapping is
          one-to-one because '_' is not in the name alphabet.
        name: variableFor
        params: name string
        recv: e envStore
        results: string
      - doc: resolve validates name and returns the variable that carries it.
        name: resolve
        params: name string
        recv: e envStore
        results: variable string, err error
      - doc: |-
          Get reads name from its variable or from the file its _FILE form names.

          The context is unused and named so: reading the environment does not block,
          and the one file read is bounded by maxEnvFileBytes.
        name: Get
        params: _ context.Context, name string
        recv: e envStore
        results: current coresecret.VersionValue, err error
      - doc: Versions returns the single version the environment carries.
        name: Versions
        params: ctx context.Context, name string
        recv: e envStore
        results: versions []coresecret.VersionValue, err error
      - doc: |-
          Put is refused: the environment is read-only to the process it configures.
          Nothing about the arguments could make a write to it meaningful, so none of
          them is inspected — and the value is never touched.
        name: Put
        params: _ context.Context, _ string, _ coresecret.Value
        recv: e envStore
        results: created coresecret.VersionValue, err error
      - doc: |-
          Prune is refused: the environment keeps exactly one version and the process
          cannot remove it.
        name: Prune
        params: _ context.Context, _ string, _ int
        recv: e envStore
        results: error
      - doc: |-
          Names lists every secret name the environment supplies under the prefix, in
          either form, sorted. A variable that does not map back to a valid name —
          lowercase letters in it, a character outside the grammar — is not a secret
          this store could Get, and is not listed.
        name: Names
        params: _ context.Context
        recv: e envStore
        results: names []string, err error
      - doc: |-
          nameOf maps one environ entry back to the secret name it supplies, reporting
          false for an entry this store would never read — including an EMPTY one,
          which Get treats as unset, so that Names never lists a secret Get cannot
          return.
        name: nameOf
        params: entry string
        recv: e envStore
        results: name string, ok bool
    name: envStore
  - doc: |-
      fileStore keeps each secret's history in one record under a directory it
      owns. It holds the directory open for its lifetime and implements io.Closer
      as an ADR 0039 sibling of the Store port.
    fields:
      - doc: "root is the directory, confined: every path resolves inside it."
        name: root
        type: corevfs.FullFS
      - doc: closer releases root's descriptor.
        name: closer
        type: io.Closer
      - doc: |-
          locker serialises writers of one secret, across goroutines AND
          processes, because a Put is a read-modify-write of the record.
        name: locker
        type: corelock.Locker
      - doc: key seals records when sealed is set.
        name: key
        type: corecrypto.Key
      - doc: sealed records whether a key was configured.
        name: sealed
        type: bool
      - doc: clk stamps Created.
        name: clk
        type: clock.Clock
    kind: struct
    methods:
      - doc: Get returns the newest version of name.
        name: Get
        params: ctx context.Context, name string
        recv: s *fileStore
        results: current coresecret.VersionValue, err error
      - doc: |-
          Versions returns every kept version of name, newest first. It takes no lock:
          a record is replaced by one rename, so a read sees one whole history.

          The context is honoured only before the read begins: reading one small file
          is not a wait worth cancelling halfway.
        name: Versions
        params: ctx context.Context, name string
        recv: s *fileStore
        results: versions []coresecret.VersionValue, err error
      - doc: Put stores value as the next version of name, under name's writer lock.
        name: Put
        params: ctx context.Context, name string, value coresecret.Value
        recv: s *fileStore
        results: created coresecret.VersionValue, err error
      - doc: Prune keeps only the newest keep versions of name, under name's writer lock.
        name: Prune
        params: ctx context.Context, name string, keep int
        recv: s *fileStore
        results: error
      - doc: |-
          Names lists every secret with a record, sorted. The lock files and a
          publication's temporary share the directory and are not records.
        name: Names
        params: ctx context.Context
        recv: s *fileStore
        results: names []string, err error
      - doc: Close releases the directory handle. Every call after it fails.
        name: Close
        recv: s *fileStore
        results: error
      - doc: "readHistory reads and decodes name's record: NotFound when there is none."
        name: readHistory
        params: name string
        recv: s *fileStore
        results: versions []coresecret.VersionValue, err error
      - doc: publish writes name's whole newest-first history as one atomic replacement.
        name: publish
        params: name string, history []coresecret.VersionValue
        recv: s *fileStore
        results: error
      - doc: |-
          withWriter runs work with name's writer lock held, releasing it whatever
          work returns. A cancelled context while waiting returns the context's own
          error; any other lock failure is StoreUnavailable.
        name: withWriter
        params: ctx context.Context, name string, work func() error
        recv: s *fileStore
        results: error
    name: fileStore
  - doc: nopCloser closes nothing, for a root that holds no descriptor.
    kind: struct
    methods:
      - doc: Close does nothing and succeeds.
        name: Close
        recv: nopCloser
        results: error
    name: nopCloser
  - fields:
      - doc: |-
          Dir is the directory the store owns: one record per secret, published
          atomically, 0600, plus the lock files that serialise writers. It is
          created 0700 if absent, and REFUSED if it exists with any group or world
          permission bit — a secret directory another account can read is the
          whole compromise, and the store does not chmod it behind the operator's
          back.
        name: Dir
        type: string
      - doc: |-
          Key, when set, SEALS every record with AES-256-GCM before it touches
          the disk, bound to the secret's name so a record copied under another
          name does not open. Nothing readable is written then — not the values,
          not the version numbers, not the timestamps; only the file names, which
          are the secret names.

          The zero Key means no encryption at rest, which is a legitimate choice
          on a volume that is already encrypted, and it is the choice a caller
          makes by leaving the field empty. A store opened with a Key refuses a
          record written without one, and the other way round, with
          RecordUnreadable — never by guessing which it was.
        name: Key
        type: corecrypto.Key
      - doc: |-
          Clock stamps each version's Created and paces the wait for another
          process's lock. nil means clock.System.
        name: Clock
        type: clock.Timed
    kind: struct
    methods:
      - doc: |-
          validate refuses a configuration no store could honour, before anything
          touches the disk.
        name: validate
        recv: c FileConfig
        results: error
      - doc: clockOrSystem resolves the configured time source.
        name: clockOrSystem
        recv: c FileConfig
        results: clock.Timed
    name: FileConfig
  - doc: |-
      fileRecord is one secret's whole history, as written to disk. One document
      per secret is what makes a Put or a Prune ONE atomic publication: a reader
      sees the history before or after, never a version without its neighbours.
    fields:
      - doc: Format is recordFormat.
        name: Format
        type: int
      - doc: |-
          Name is the secret's name, checked against the file it was read from,
          so a record renamed on disk is refused even when it is not sealed.
        name: Name
        type: string
      - doc: Versions is the kept history, newest first.
        name: Versions
        type: "[]fileVersion"
    kind: struct
    name: fileRecord
  - doc: fileVersion is one version as written to disk.
    fields:
      - doc: Version is the version's number.
        name: Version
        type: int
      - doc: Created is the store's stamp, in UTC.
        name: Created
        type: time.Time
      - doc: |-
          Value is the secret's bytes, base64 in the JSON document. The document
          is written 0600 and, when the store has a key, never in the clear.
        name: Value
        type: "[]byte"
    kind: struct
    name: fileVersion
  - doc: |-
      statter is the part of an opened file a key read needs: its description,
      and its bytes.
    kind: named
    name: statter
    underlying: |-
      interface {
      	io.Reader
      	// Stat describes the opened file, so the file judged is the file read.
      	Stat() (fs.FileInfo, error)
      }
  - doc: |-
      syncer is the part of a fresh temporary a key write needs: its bytes, and
      their flush.
    kind: named
    name: syncer
    underlying: |-
      interface {
      	io.Writer
      	// Sync flushes what was written to the device.
      	Sync() error
      }
  - fields:
      - doc: store holds the versions.
        name: store
        type: coresecret.Store
      - doc: name is the secret whose versions are the keys.
        name: name
        type: string
    kind: struct
    methods:
      - name: Seal
        params: ctx context.Context, plaintext, aad []byte
        recv: k *Keyring
        results: box []byte, err error
      - doc: |-
          sealAs is Seal under the AEAD key derived for label: sealLabel for Seal,
          wrapLabel for a subject data key. The box layout is the same; the key is not.
        name: sealAs
        params: ctx context.Context, label string, plaintext, aad []byte
        recv: k *Keyring
        results: box []byte, err error
      - doc: |-
          sealUnder seals plaintext with key — the AEAD key of version — into a box
          whose header names version. Seal and a root view share it, so a box has one
          layout whichever of them made it.
        name: sealUnder
        params: key corecrypto.Key, version int, plaintext, aad []byte
        recv: k *Keyring
        results: box []byte, err error
      - name: Open
        params: ctx context.Context, box, aad []byte
        recv: k *Keyring
        results: plaintext []byte, err error
      - doc: |-
          openAs is Open under the AEAD key derived for label, the counterpart of
          sealAs: a box sealed for one purpose does not open for another.
        name: openAs
        params: ctx context.Context, label string, box, aad []byte
        recv: k *Keyring
        results: plaintext []byte, err error
      - name: Sign
        params: ctx context.Context, message []byte
        recv: k *Keyring
        results: signature []byte, err error
      - name: Verify
        params: ctx context.Context, message, signature []byte
        recv: k *Keyring
        results: error
      - doc: keyFor finds the KEPT version numbered version and derives its subkey.
        name: keyFor
        params: ctx context.Context, version int, label string
        recv: k *Keyring
        results: key corecrypto.Key, err error
      - doc: subkey derives the purpose-bound key of one version.
        name: subkey
        params: version coresecret.VersionValue, label string
        recv: k *Keyring
        results: key corecrypto.Key, err error
      - doc: |-
          binding is the associated data (for a box) or the signed bytes (for a
          signature): the keyring's name, the version, then the caller's bytes.
        name: binding
        params: version int, tail []byte
        recv: k *Keyring
        results: "[]byte"
      - doc: |-
          view reads the keyring's versions once and derives their keys for label —
          wrapLabel, for a re-wrap. It returns core/security/secret.NotFound while the root has
          no version, the store's verdict when it cannot be read, and
          [coresecret.KeyMaterialInvalid] when the newest version cannot seal.
        name: view
        params: ctx context.Context, label string
        recv: k *Keyring
        results: view *rootView, err error
    name: Keyring
  - doc: |-
      rootView is ONE reading of a keyring's versions, with every usable
      version's key for one purpose derived once. Seal and Open read the store and
      derive a key on every call, which is right for a call and wasteful for a
      pass over a million wrapped keys: a re-wrap reads the root once and wraps
      every key under the newest version it saw.

      A version that is not usable as a key — not one crypto.Key long — is left
      out: what it wrapped does not open, and the pass counts it. The newest
      version must be usable, since everything the view seals goes under it.

      A view holds key material, so its owner closes it, and it is not safe for
      concurrent use: one pass, one goroutine.
    fields:
      - doc: keyring supplies the binding every box is sealed with.
        name: keyring
        type: "*Keyring"
      - doc: newest is the version the view seals under.
        name: newest
        type: int
      - doc: keys maps a usable version to its key for the view's purpose.
        name: keys
        type: map[int]corecrypto.Key
    kind: struct
    methods:
      - doc: |-
          seal seals plaintext under the newest version, exactly as sealAs would
          have for the view's purpose.
        name: seal
        params: plaintext, aad []byte
        recv: v *rootView
        results: box []byte, err error
      - doc: |-
          open opens a box any usable kept version sealed, exactly as openAs would
          have for the view's purpose. Every failure is the one [coresecret.SealInvalid]: the
          view has read the store already, so there is no "retry" to tell apart.
        name: open
        params: box, aad []byte
        recv: v *rootView
        results: plaintext []byte, err error
      - doc: close zeroizes every key the view derived. The view is unusable after.
        name: close
        recv: v *rootView
    name: rootView
  - fields:
      - doc: |-
          Clock stamps each version's Created. nil means clock.System; a test
          driving a Rotator passes the same ManualClock to both, so the store's
          stamps and the rotator's "now" are one timeline.
        name: Clock
        type: clock.Clock
    kind: struct
    name: MemoryConfig
  - doc: |-
      memoryStore keeps every version in one map guarded by an RWMutex. It dies
      with the process, which is the whole of its contract: it is the store for a
      test, a development run, or a secret that is regenerated on every start and
      never needs to outlive it.
    fields:
      - doc: |-
          mu guards secrets. Reads take the read lock; Put and Prune the write
          lock, so a Put's read-then-append is one step.
        name: mu
        type: sync.RWMutex
      - doc: secrets maps a name to its kept versions, newest first.
        name: secrets
        type: map[string][]coresecret.VersionValue
      - doc: clk stamps Created.
        name: clk
        type: clock.Clock
    kind: struct
    methods:
      - doc: |-
          Get returns the newest version of name.

          The context is unused and named so: this store never blocks and never
          performs I/O, so there is nothing a cancellation could interrupt, and
          honouring it would mean inventing a failure the store cannot have.
        name: Get
        params: _ context.Context, name string
        recv: m *memoryStore
        results: current coresecret.VersionValue, err error
      - doc: Versions returns every kept version of name, newest first.
        name: Versions
        params: _ context.Context, name string
        recv: m *memoryStore
        results: versions []coresecret.VersionValue, err error
      - doc: Put stores value as the next version of name.
        name: Put
        params: _ context.Context, name string, value coresecret.Value
        recv: m *memoryStore
        results: created coresecret.VersionValue, err error
      - doc: Prune keeps only the newest keep versions of name.
        name: Prune
        params: _ context.Context, name string, keep int
        recv: m *memoryStore
        results: error
      - doc: Names lists every name holding a version, sorted.
        name: Names
        params: _ context.Context
        recv: m *memoryStore
        results: names []string, err error
    name: memoryStore
  - fields:
      - doc: |-
          Every is the rotation interval, measured from the current version's
          Created. It must be positive.
        name: Every
        type: time.Duration
      - doc: |-
          Keep is how many versions a rotation leaves, the new one included. It
          must be at least 2, so the version a rotation replaces still opens what
          it sealed; set it to cover the longest-lived box or signature in
          flight, divided by Every, plus one.
        name: Keep
        type: int
      - doc: |-
          Generate makes a new version. [Random] is the generator for keys and
          tokens. An error or an empty value aborts the rotation with
          [coresecret.GenerateFailed]; nothing is stored and nothing is pruned.
        name: Generate
        type: func() (coresecret.Value, error)
    kind: struct
    name: PolicySpec
  - fields:
      - doc: |-
          Store holds the secret. Required. A read-only store is accepted and
          every write it refuses surfaces as core/security/secret.ReadOnly.
        name: Store
        type: coresecret.Store
      - doc: Name is the secret to rotate. Required.
        name: Name
        type: string
      - doc: Policy is the schedule, the retention and the generator. Required.
        name: Policy
        type: PolicySpec
      - doc: |-
          Clock decides when a rotation is due and paces Run. nil means
          clock.System. A test drives the rotator with a clock.ManualClock — the
          same one its store stamps Created with, so both read one timeline.
        name: Clock
        type: clock.Timed
      - doc: |-
          Locker, when set, serialises rotations of this secret ACROSS PROCESSES:
          Ensure, Rotate and RotateIfDue take its lock, re-read the current
          version, and only then decide. Without it, two replicas sharing a file
          store can both find a rotation due and both perform it — nothing breaks,
          since both versions are kept keys, but a rotation is wasted and Keep
          counts it. One process needs no Locker: the rotator serialises its own
          calls.
        name: Locker
        type: corelock.Locker
      - doc: |-
          OnRotate, when set, is told of every rotation this rotator performs,
          with the version it created. It runs on the rotating goroutine after
          the version is stored, the old ones pruned and every lock released, so
          it may call back into the rotator. Ensure creating the first version is
          not a rotation and does not call it.
        name: OnRotate
        type: func(rotated coresecret.VersionValue)
      - doc: |-
          InUse, when set, reports the OLDEST version something still needs — for
          the root of a SubjectKeys, the oldest version a data key is still
          wrapped under: [SubjectKeys.OldestRoot] — or 0 when nothing does. A
          rotation then prunes no version at or above it, whatever Policy.Keep
          says: Keep becomes a floor, and the store holds more versions until the
          dependants move on (SubjectKeys.Rewrap). It is asked after the new
          version is stored and before the prune. Its error is returned as it is
          and nothing is pruned — the rotation happened, and the next one prunes
          again — because a version pruned while still needed destroys whatever
          depends on it, and no later call can bring it back.
        name: InUse
        type: func(ctx context.Context) (oldest int, err error)
    kind: struct
    methods:
      - doc: validate refuses a configuration no rotator could honour.
        name: validate
        recv: c RotatorConfig
        results: error
    name: RotatorConfig
  - fields:
      - doc: store holds the secret.
        name: store
        type: coresecret.Store
      - doc: name is the secret.
        name: name
        type: string
      - doc: policy is validated.
        name: policy
        type: PolicySpec
      - doc: clk decides and waits.
        name: clk
        type: clock.Timed
      - doc: locker is nil unless cross-process serialisation was asked for.
        name: locker
        type: corelock.Locker
      - doc: onRotate is nil unless a caller wants to be told.
        name: onRotate
        type: func(rotated coresecret.VersionValue)
      - doc: inUse is nil unless something depends on versions a prune could take.
        name: inUse
        type: func(ctx context.Context) (oldest int, err error)
      - doc: |-
          mu serialises this rotator's own decisions, so two goroutines of one
          process cannot both rotate one due secret.
        name: mu
        type: sync.Mutex
    kind: struct
    methods:
      - name: Ensure
        params: ctx context.Context
        recv: r *Rotator
        results: current coresecret.VersionValue, err error
      - name: Due
        params: ctx context.Context
        recv: r *Rotator
        results: due time.Time, err error
      - name: RotateIfDue
        params: ctx context.Context
        recv: r *Rotator
        results: current coresecret.VersionValue, rotated bool, err error
      - name: Rotate
        params: ctx context.Context
        recv: r *Rotator
        results: created coresecret.VersionValue, err error
      - name: Run
        params: ctx context.Context
        recv: r *Rotator
        results: error
      - doc: |-
          sleepUntil waits on the rotator's clock until due, reporting false when ctx
          ended first. A due instant already past — the store's clock and the
          rotator's disagree — waits one whole interval rather than spinning.
        name: sleepUntil
        params: ctx context.Context, due time.Time
        recv: r *Rotator
        results: bool
      - doc: |-
          currentOrFirst returns the current version, creating version 1 when there is
          none. The caller holds the rotator's lock.
        name: currentOrFirst
        params: ctx context.Context
        recv: r *Rotator
        results: current coresecret.VersionValue, err error
      - doc: |-
          rotateLocked generates, stores and prunes. The caller holds the rotator's
          lock. A version returned with an error was stored, and only the prune
          failed.
        name: rotateLocked
        params: ctx context.Context
        recv: r *Rotator
        results: created coresecret.VersionValue, err error
      - doc: |-
          keepFor is how many versions the prune after a rotation to newest keeps:
          the policy's Keep, or more when InUse reports an older version still
          needed, so that version and every newer one survive.
        name: keepFor
        params: ctx context.Context, newest int
        recv: r *Rotator
        results: keep int, err error
      - doc: generate runs the policy's generator and refuses an empty result.
        name: generate
        recv: r *Rotator
        results: value coresecret.Value, err error
      - doc: |-
          serialised runs work under the rotator's lock, and under the Locker's when
          one was configured, releasing both whatever work returns.
        name: serialised
        params: ctx context.Context, work func() error
        recv: r *Rotator
        results: error
      - doc: notify tells the caller's callback of a rotation, if there is one.
        name: notify
        params: rotated coresecret.VersionValue
        recv: r *Rotator
    name: Rotator
  - doc: subjectBox is a subject box split at its header.
    fields:
      - doc: subject is the reference the box was sealed for.
        name: subject
        type: string
      - doc: id is the identifier of the data key that sealed it.
        name: id
        type: "[keyIDLen]byte"
      - doc: header is every byte before the AEAD box, bound as associated data.
        name: header
        type: "[]byte"
      - doc: sealed is the AEAD box.
        name: sealed
        type: "[]byte"
    kind: struct
    name: subjectBox
  - doc: |-
      openedKey is one subject's data key, opened: the AEAD key derived from it
      and its identifier. The data key itself is cleared as soon as both are
      derived, so the opened key is all that stays in memory.

      It may be shared by every call that finds it in the cache, so it hands out
      COPIES under its mutex and is wiped under the same mutex: a call never holds
      bytes an eviction or a destruction clears beneath it, which is how a box
      would otherwise come to be sealed under a zeroed key.
    fields:
      - doc: mu orders take against wipe.
        name: mu
        type: sync.Mutex
      - doc: seal is the derived AEAD key; nil once wiped.
        name: seal
        type: "[]byte"
      - doc: id identifies the data key in every box it seals.
        name: id
        type: "[keyIDLen]byte"
    kind: struct
    methods:
      - doc: |-
          take returns a copy of the AEAD key, which the caller zeroizes, and the
          identifier. It reports false once the key was wiped — evicted or destroyed
          between the lookup and this call — and the caller then reads the store.
        name: take
        recv: o *openedKey
        results: key corecrypto.Key, id [keyIDLen]byte, live bool
      - doc: wipe clears the AEAD key in place. It is idempotent.
        name: wipe
        recv: o *openedKey
    name: openedKey
  - doc: |-
      keyCache keeps opened keys for a bounded time, least recently used evicted
      first, and wipes each one it lets go.

      A destruction must reach the cache, and it has one race to beat: a fill that
      read the store BEFORE the destruction deleted the key, and offers what it
      opened AFTER the destruction cleared the cache. The epoch closes it. A fill
      reads the epoch before it reads the store; a destruction deletes the key from
      the store first and only then advances the epoch, under the mutex offer takes
      to compare it; so an offer that crossed a destruction finds a different
      epoch and caches nothing. The key it opened is still used once, by the call
      that opened it, which began before the destruction ended.
    fields:
      - doc: mu orders offer against forget, and guards epoch.
        name: mu
        type: sync.Mutex
      - doc: epoch advances at every destruction.
        name: epoch
        type: uint64
      - doc: entries holds the opened keys; nil when the cache is disabled.
        name: entries
        type: "*kcache.Cache[string, *openedKey]"
    kind: struct
    methods:
      - doc: fetch returns the opened key cached for subject, if any is live.
        name: fetch
        params: subject string
        recv: c *keyCache
        results: opened *openedKey, found bool
      - doc: current returns the epoch a fill must present to offer what it opens.
        name: current
        recv: c *keyCache
        results: uint64
      - doc: |-
          offer caches opened under subject, unless a destruction happened since the
          fill read epoch, or a concurrent fill cached subject first; either way the
          key not kept is wiped.
        name: offer
        params: subject string, epoch uint64, opened *openedKey
        recv: c *keyCache
      - doc: |-
          forget drops and wipes whatever is cached for subject, and advances the
          epoch so that no fill already under way caches it again.
        name: forget
        params: subject string
        recv: c *keyCache
    name: keyCache
  - fields:
      - doc: |-
          Root wraps every data key: a Keyring over the root secret. Its newest
          version wraps each new key and every kept version unwraps, so a
          rotation breaks nothing; [SubjectKeys.Rewrap] moves every key to the
          newest version, and RotatorConfig.InUse keeps a version from being
          pruned while a key is still wrapped under it. Required.
        name: Root
        type: "*Keyring"
      - doc: |-
          Former is the root this one replaces — a root secret renamed, whose
          name every key it wrapped is bound to —, or nil. A key wrapped under it
          still unwraps, under any version it keeps, so nothing it wrapped stops
          opening; no key is ever wrapped under it, and [SubjectKeys.Rewrap]
          moves every key it wrapped to Root's newest version. Nothing here
          rotates, prunes or deletes it: retiring it is the caller's, once a
          pass finds no key under it (RewrapValue.FromFormer, then zero).
        name: Former
        type: "*Keyring"
      - doc: Store keeps the wrapped keys, one per subject. Required.
        name: Store
        type: coresecret.SubjectKeyStore
      - doc: |-
          CacheSize is how many opened keys this process keeps, the least
          recently used evicted first. Zero keeps none: every Seal and Open
          reads the store and unwraps. Negative is refused.
        name: CacheSize
        type: int
      - doc: |-
          CacheTTL is how long an opened key stays cached. It is required with a
          cache and refused without one, because it is a promise about erasure: a
          key another PROCESS destroyed keeps opening — and sealing — here for up
          to CacheTTL. A key destroyed through this value leaves its cache at once.
        name: CacheTTL
        type: time.Duration
      - doc: Clock times the cache. nil means clock.System.
        name: Clock
        type: clock.Clock
    kind: struct
    methods:
      - doc: validate refuses a configuration no engine could honour.
        name: validate
        recv: c SubjectKeysConfig
        results: error
    name: SubjectKeysConfig
  - fields:
      - doc: root wraps and unwraps every data key.
        name: root
        type: "*Keyring"
      - doc: former unwraps what the root it replaces wrapped; nil when none.
        name: former
        type: "*Keyring"
      - doc: store keeps them.
        name: store
        type: coresecret.SubjectKeyStore
      - doc: cache keeps opened keys for a bounded time.
        name: cache
        type: "*keyCache"
    kind: struct
    methods:
      - name: Seal
        params: ctx context.Context, subject string, plaintext []byte, bind ...string
        recv: s *SubjectKeys
        results: box []byte, err error
      - name: Open
        params: ctx context.Context, box []byte, bind ...string
        recv: s *SubjectKeys
        results: plaintext []byte, err error
      - name: Destroy
        params: ctx context.Context, subject string
        recv: s *SubjectKeys
        results: destroyed bool, err error
      - doc: |-
          acquire returns a copy of subject's AEAD key, which the caller zeroizes, the
          key's identifier, and whether it came from the cache. It reads the store on
          a miss, creating the key when create is set and subject holds none.
        name: acquire
        params: ctx context.Context, subject string, create bool
        recv: s *SubjectKeys
        results: key corecrypto.Key, id [keyIDLen]byte, cached bool, err error
      - doc: |-
          load reads subject's key from the store and opens it, creating it first
          when create is set and none is filed.
        name: load
        params: ctx context.Context, subject string, create bool
        recv: s *SubjectKeys
        results: opened *openedKey, err error
      - doc: |-
          create makes a data key for subject, wraps it under the root's newest
          version, and files it if no key is filed yet. It reports inserted == false,
          with no key, when another writer filed one first.
        name: create
        params: ctx context.Context, subject string
        recv: s *SubjectKeys
        results: opened *openedKey, inserted bool, err error
      - doc: |-
          settle moves a key just filed to the root's newest version when the root
          rotated while the key was being made, and reports whether the key filed is
          still this one.

          A rotation's InUse scan sees every key FILED when it runs. A key made
          between the wrap and the insert is not filed yet, so a rotation that scanned
          in that window, after another that retired nothing, may prune the version
          the key was wrapped under — and the insert would file a key nothing opens.
          Every rotation stores its new version before it scans, so reading the newest
          version once, after the insert, sees every rotation that could have missed
          the key; one that stores its version later scans later, and sees the key.
          The data key is still in hand, so a stale wrap is replaced, never lost.
        name: settle
        params: ctx context.Context, subject string, dek, wrapped []byte
        recv: s *SubjectKeys
        results: settled bool, err error
      - doc: |-
          unwrap opens a wrapped key under the root keyring, else under the root it
          replaces.
        name: unwrap
        params: ctx context.Context, subject string, wrapped []byte
        recv: s *SubjectKeys
        results: opened *openedKey, err error
      - name: Rewrap
        params: ctx context.Context
        recv: s *SubjectKeys
        results: report RewrapValue, err error
      - doc: |-
          formerView reads the former root once, for a pass: nil when there is none,
          or when it keeps no version — a root renamed before anything was wrapped
          under it.
        name: formerView
        params: ctx context.Context
        recv: s *SubjectKeys
        results: view *rootView, err error
      - doc: |-
          rewrapOne moves one key to the root's newest version: from an older one,
          or from the former root.
        name: rewrapOne
        params: ctx context.Context, views rewrapViews, entry coresecret.SubjectKeyValue
        recv: s *SubjectKeys
        results: outcome rewrapOutcome, err error
      - name: OldestRoot
        params: ctx context.Context
        recv: s *SubjectKeys
        results: version int, err error
    name: SubjectKeys
  - doc: |-
      memorySubjectKeys keeps every wrapped key in one map guarded by an RWMutex.
      It dies with the process, which is its whole contract: the store for a test
      or a development run, where the data the keys protect dies with the process
      too. A deployment that persists sealed data persists its keys, or the next
      start opens nothing.
    fields:
      - doc: |-
          mu guards keys. Insert, Replace and Delete take the write lock, so each
          compare and its write are one step.
        name: mu
        type: sync.RWMutex
      - doc: keys maps a subject to its wrapped key; every slice is the store's own.
        name: keys
        type: map[string][]byte
    kind: struct
    methods:
      - doc: |-
          Get returns the wrapped key filed under subject.

          The context is unused and named so: this store never blocks and never
          performs I/O, so there is nothing a cancellation could interrupt.
        name: Get
        params: _ context.Context, subject string
        recv: m *memorySubjectKeys
        results: wrapped []byte, found bool, err error
      - doc: Insert files wrapped under subject when nothing is filed there.
        name: Insert
        params: _ context.Context, subject string, wrapped []byte
        recv: m *memorySubjectKeys
        results: inserted bool, err error
      - doc: Replace files next under subject while subject still holds current.
        name: Replace
        params: _ context.Context, subject string, current, next []byte
        recv: m *memorySubjectKeys
        results: replaced bool, err error
      - doc: |-
          Delete removes the key filed under subject. The map drops its only
          reference; the bytes are left to the collector, as everything this process
          held is.
        name: Delete
        params: _ context.Context, subject string
        recv: m *memorySubjectKeys
        results: deleted bool, err error
      - doc: |-
          All yields every filed key, sorted by subject, from a copy taken under the
          read lock — no lock is held while the caller runs, so it may Replace or
          Delete between two keys. A key filed after the copy is not yielded.
        name: All
        params: _ context.Context
        recv: m *memorySubjectKeys
        results: iter.Seq2[coresecret.SubjectKeyValue, error]
      - doc: snapshot copies every filed key, sorted by subject.
        name: snapshot
        recv: m *memorySubjectKeys
        results: "[]coresecret.SubjectKeyValue"
    name: memorySubjectKeys
  - fields:
      - doc: "Root is the root version the pass wrapped under: the newest it read."
        name: Root
        type: int
      - doc: |-
          Current counts the keys already wrapped under Root, each opened to
          prove it, and the keys a later rotation already wrapped under a newer
          version, which the next pass checks.
        name: Current
        type: int
      - doc: Rewrapped counts the keys the pass moved to Root.
        name: Rewrapped
        type: int
      - doc: |-
          FromFormer counts, among Rewrapped, the keys the pass moved from the
          root SubjectKeysConfig.Former names. A pass that returns no error and
          counts none left no key under it but one filed while it ran — the
          next pass moves those.
        name: FromFormer
        type: int
      - doc: |-
          Skipped counts the keys destroyed, or re-wrapped by another writer,
          while the pass ran. They are left as they are: a re-wrap never brings
          back a destroyed key.
        name: Skipped
        type: int
      - doc: |-
          Unreadable counts the keys that did not unwrap as one data key —
          wrapped under a version no longer kept, under another root secret or
          for another purpose, altered, or not one key long — and the entries
          whose subject is outside the grammar. They are left as they are, and
          the pass returns [coresecret.SubjectKeyUnreadable].
        name: Unreadable
        type: int
    kind: struct
    methods:
      - doc: count adds one outcome to the report.
        name: count
        params: outcome rewrapOutcome
        recv: r *RewrapValue
    name: RewrapValue
  - doc: rewrapOutcome is what the pass did with one key.
    kind: named
    name: rewrapOutcome
    underlying: uint8
  - doc: |-
      rewrapViews are the readings one pass works with: the root's, and the
      former root's, nil when there is none.
    fields:
      - name: root
        type: "*rootView"
      - name: former
        type: "*rootView"
    kind: struct
    name: rewrapViews
vars:
  - grouped: true
    items:
      - doc: crlf is the line ending a Windows editor writes.
        name: crlf
        value: "[]byte(\"\\r\\n\")"
      - doc: newline is the line ending `echo` writes.
        name: newline
        value: "[]byte(\"\\n\")"
    name: crlf
