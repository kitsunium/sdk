            - return: wrapAs(coresecret.InvalidConfig, nil, errs.String("setting", "Dir"), errs.String("problem", "cannot be inspected"))
              to: wrapAs
          when: statErr != nil
      - opt:
          do:
            - return: wrapAs(coresecret.InvalidConfig, nil, errs.String("setting", "Dir"), errs.String("problem", "not a directory"))
              to: wrapAs
          when: "!info.IsDir()"
      - opt:
          do:
            - return: |-
                wrapAs(coresecret.InvalidConfig, nil, errs.String("setting", "Dir"),
                			errs.String("problem", "accessible to other accounts; chmod 700 it"))
              to: wrapAs
          when: info.Mode().Perm()&otherAccountBits != 0
      - return: nil
  - of: recordPath
    steps:
      - return: name + recordSuffix
  - of: recordAAD
    steps:
      - return: "[]byte(recordAADPrefix + name)"
  - of: encodeRecord
    participants:
      - id: caller
        kind: actor
      - id: encodeRecord
        kind: self
      - id: json
        kind: stdlib
      - id: clearRecord
        kind: internal
      - id: corecrypto
        kind: package
    steps:
      - bind: record
        eval: "fileRecord{Format: recordFormat, Name: name, Versions: make([]fileVersion, 0, len(versions))}"
      - loop:
          do:
            - set: record.Versions
              value: |-
                append(record.Versions, fileVersion{
                			Version: version.Version,
                			Created: version.Created.UTC(),
                			Value:   version.Value.Reveal(),
                		})
          key: _
          range: versions
          value: version
      - bind: document, marshalErr
        eval: json.Marshal(record)
        to: json
      - eval: clearRecord(record)
        to: clearRecord
      - opt:
          do:
            - return: |-
                nil, errs.Wrap(coresecret.StoreUnavailable, errs.WrapParams{},
                			errs.String("secret", name), errs.String("operation", "encode"))
          when: marshalErr != nil
      - opt:
          do:
            - return: document, nil
          when: "!sealed"
      - bind: box, sealErr
        eval: corecrypto.Seal(sealAlgorithm, key, document, recordAAD(name))
        to: corecrypto
      - eval: clear(document)
      - opt:
          do:
            - return: nil, wrapAs(coresecret.StoreUnavailable, sealErr, errs.String("secret", name), errs.String("operation", "seal"))
          when: sealErr != nil
      - return: box, nil
  - of: decodeRecord
    participants:
      - id: caller
        kind: actor
      - id: decodeRecord
        kind: self
      - id: corecrypto
        kind: package
      - id: clearRecord
        kind: internal
      - id: historyOf
        kind: internal
    steps:
      - bind: document
        eval: data
      - opt:
          do:
            - bind: opened, openErr
              eval: corecrypto.Open(key, data, recordAAD(name))
              to: corecrypto
            - opt:
                do:
                  - return: nil, unreadable(name, "the record does not open under this store's key")
                when: openErr != nil
            - set: document
              value: opened
            - defer: clear(opened)
          when: sealed
      - var:
          name: record
          type: fileRecord
      - opt:
          do:
            - return: nil, unreadable(name, "the record is not a document this store wrote")
          when: json.Unmarshal(document, &record) != nil
      - defer: clearRecord(record)
        to: clearRecord
      - opt:
          do:
            - return: nil, unreadable(name, "the record's format or name does not match its file")
          when: record.Format != recordFormat || record.Name != name
      - return: historyOf(name, record)
        to: historyOf
  - of: unreadable
    participants:
      - id: caller
        kind: actor
      - id: unreadable
        kind: self
      - id: wrapAs
        kind: internal
    steps:
      - return: wrapAs(coresecret.RecordUnreadable, nil, errs.String("secret", name), errs.String("problem", problem))
        to: wrapAs
  - of: clearRecord
    steps:
      - loop:
          do:
            - eval: clear(version.Value)
          key: _
          range: record.Versions
          value: version
  - of: KeyFile
    participants:
      - id: caller
        kind: actor
      - id: KeyFile
        kind: self
      - id: readKeyFile
        kind: internal
      - id: createKeyFile
        kind: internal
    steps:
      - opt:
          do:
            - return: corecrypto.Key{}, refuseSetting("KeyFile", "empty path")
          when: path == ""
      - opt:
          do:
            - return: corecrypto.Key{}, coreproc.UnsupportedPlatform
          when: "!platformNative"
      - bind: key, absent, readErr
        eval: readKeyFile(path)
        to: readKeyFile
      - opt:
          do:
            - return: key, readErr
          when: "!absent"
      - return: createKeyFile(path)
        to: createKeyFile
  - of: readKeyFile
    participants:
      - id: caller
        kind: actor
      - id: readKeyFile
        kind: self
      - id: os
        kind: stdlib
      - id: keyFromOpenFile
        kind: internal
    steps:
      - bind: file, openErr
        eval: os.Open(path)
        to: os
      - opt:
          do:
            - opt:
                do:
                  - return: corecrypto.Key{}, true, nil
                when: errors.Is(openErr, fs.ErrNotExist)
            - return: corecrypto.Key{}, false, keyFileUnavailable("open", openErr)
          when: openErr != nil
      - defer: |-
          func() {
          		//: only the first failure is the caller's.
          		if closeErr := file.Close(); closeErr != nil && err == nil {
          			key, err = corecrypto.Key{}, keyFileUnavailable("close", closeErr)
          		}
          	}()
      - set: key, err
        to: keyFromOpenFile
        value: keyFromOpenFile(file)
      - return: key, false, err
  - of: keyFromOpenFile
    participants:
      - id: caller
        kind: actor
      - id: keyFromOpenFile
        kind: self
      - id: file.Stat
        kind: internal
      - id: io
        kind: stdlib
      - id: corecrypto
        kind: package
    steps:
      - bind: info, statErr
        eval: file.Stat()
        to: file.Stat
      - opt:
          do:
            - return: corecrypto.Key{}, keyFileUnavailable("stat", statErr)
          when: statErr != nil
      - opt:
          do:
            - return: corecrypto.Key{}, wrapAs(coresecret.KeyFileInvalid, nil, errs.String("problem", "not a regular file"))
          when: "!info.Mode().IsRegular()"
      - opt:
          do:
            - return: corecrypto.Key{}, refuseSetting("KeyFile", "accessible to other accounts; chmod 600 it")
          when: info.Mode().Perm()&otherAccountBits != 0
      - bind: content, readErr
        eval: io.ReadAll(io.LimitReader(file, int64(corecrypto.KeyLen)+1))
        to: io
      - defer: clear(content)
      - opt:
          do:
            - return: corecrypto.Key{}, keyFileUnavailable("read", readErr)
          when: readErr != nil
      - opt:
          do:
            - return: |-
                corecrypto.Key{}, wrapAs(coresecret.KeyFileInvalid, nil,
                			errs.String("problem", "not exactly one key of raw bytes"), errs.Int("length", len(content)))
          when: len(content) != corecrypto.KeyLen
      - return: corecrypto.NewKey(content)
        to: corecrypto
  - of: createKeyFile
    participants:
      - id: caller
        kind: actor
      - id: createKeyFile
        kind: self
      - id: filepath
        kind: stdlib
      - id: os
        kind: stdlib
      - id: rand
        kind: stdlib
      - id: publishKey
        kind: internal
      - id: readKeyFile
        kind: internal
      - id: corecrypto
        kind: package
    steps:
      - bind: dir
        eval: filepath.Dir(path)
        to: filepath
      - opt:
          do:
            - return: corecrypto.Key{}, keyFileUnavailable("mkdir", mkErr)
          init:
            bind: mkErr
            eval: os.MkdirAll(dir, keyDirMode)
            to: os
          when: mkErr != nil
      - bind: raw
        eval: make([]byte, corecrypto.KeyLen)
      - defer: clear(raw)
      - opt:
          do:
            - return: corecrypto.Key{}, wrapAs(coresecret.GenerateFailed, randErr)
          init:
            bind: _, randErr
            eval: rand.Read(raw)
            to: rand
          when: randErr != nil
      - bind: published, publishErr
        eval: publishKey(dir, path, raw)
        to: publishKey
      - opt:
          do:
            - return: corecrypto.Key{}, publishErr
          when: publishErr != nil
      - opt:
          do:
            - bind: theirs, absent, readErr
              eval: readKeyFile(path)
              to: readKeyFile
            - opt:
                do:
                  - return: corecrypto.Key{}, keyFileUnavailable("read", fs.ErrNotExist)
                when: absent
            - return: theirs, readErr
          when: "!published"
      - return: corecrypto.NewKey(raw)
        to: corecrypto
  - of: publishKey
    participants:
      - id: caller
        kind: actor
      - id: publishKey
        kind: self
      - id: os
        kind: stdlib
      - id: writeAndSync
        kind: internal
    steps:
      - bind: temp, createErr
        eval: os.CreateTemp(dir, keyTempPattern)
        to: os
      - opt:
          do:
            - return: false, keyFileUnavailable("create", createErr)
          when: createErr != nil
      - defer: |-
          func() {
          		cleanupErr := errors.Join(temp.Close(), os.Remove(temp.Name()))
          		//: only the first failure is the caller's.
          		if cleanupErr != nil && err == nil {
          			published, err = false, keyFileUnavailable("cleanup", cleanupErr)
          		}
          	}()
      - opt:
          do:
            - return: false, writeErr
          init:
            bind: writeErr
            eval: writeAndSync(temp, raw)
            to: writeAndSync
          when: writeErr != nil
      - bind: linkErr
        eval: os.Link(temp.Name(), path)
        to: os
      - opt:
          do:
            - return: false, nil
          when: errors.Is(linkErr, fs.ErrExist)
      - opt:
          do:
            - return: false, keyFileUnavailable("link", linkErr)
          when: linkErr != nil
      - return: true, syncDir(dir)
  - of: writeAndSync
    participants:
      - id: caller
        kind: actor
      - id: writeAndSync
        kind: self
      - id: temp.Write
        kind: value
      - id: keyFileUnavailable
        kind: internal
      - id: temp.Sync
        kind: internal
    steps:
      - opt:
          do:
            - return: keyFileUnavailable("write", writeErr)
              to: keyFileUnavailable
          init:
            bind: _, writeErr
            eval: temp.Write(raw)
            to: temp.Write
          when: writeErr != nil
      - opt:
          do:
            - return: keyFileUnavailable("sync", syncErr)
              to: keyFileUnavailable
          init:
            bind: syncErr
            eval: temp.Sync()
            to: temp.Sync
          when: syncErr != nil
      - return: nil
  - of: syncDir
    participants:
      - id: caller
        kind: actor
      - id: syncDir
        kind: self
      - id: os
        kind: stdlib
      - id: keyFileUnavailable
        kind: internal
      - id: handle.Sync
        kind: value
    steps:
      - bind: handle, openErr
        eval: os.Open(dir)
        to: os
      - opt:
          do:
            - return: keyFileUnavailable("sync", openErr)
              to: keyFileUnavailable
          when: openErr != nil
      - defer: |-
          func() {
          		//: only the first failure is the caller's.
          		if closeErr := handle.Close(); closeErr != nil && err == nil {
          			err = keyFileUnavailable("sync", closeErr)
          		}
          	}()
      - opt:
          do:
            - return: keyFileUnavailable("sync", syncErr)
              to: keyFileUnavailable
          init:
            bind: syncErr
            eval: handle.Sync()
            to: handle.Sync
          when: syncErr != nil
      - return: nil
  - of: keyFileUnavailable
    participants:
      - id: caller
        kind: actor
      - id: keyFileUnavailable
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(coresecret.StoreUnavailable, errs.WrapParams{},
          		errs.String("store", "keyfile"), errs.String("operation", operation),
          		errs.Bool("not_exist", errors.Is(cause, fs.ErrNotExist)),
          		errs.Bool("permission", errors.Is(cause, fs.ErrPermission)))
        to: errs
  - of: NewKeyring
    participants:
      - id: caller
        kind: actor
      - id: NewKeyring
        kind: self
      - id: coresecret
        kind: package
    steps:
      - opt:
          do:
            - return: nil, wrapAs(coresecret.InvalidConfig, nil, errs.String("setting", "Store"), errs.String("problem", "nil"))
          when: store == nil
      - opt:
          do:
            - return: nil, nameErr
          init:
            bind: nameErr
            eval: coresecret.ValidateName(name)
            to: coresecret
          when: nameErr != nil
      - return: "&Keyring{store: store, name: name}, nil"
  - of: (*Keyring).Seal
    participants:
      - id: caller
        kind: actor
      - id: (*Keyring).Seal
        kind: self
      - id: k.sealAs
        kind: internal
    steps:
      - return: k.sealAs(ctx, sealLabel, plaintext, aad)
        to: k.sealAs
  - of: (*Keyring).sealAs
    participants:
      - id: caller
        kind: actor
      - id: (*Keyring).sealAs
        kind: self
      - id: k.store.Get
        kind: value
      - id: k.subkey
        kind: internal
      - id: key.Zeroize
        kind: value
      - id: k.sealUnder
        kind: internal
    steps:
      - bind: current, getErr
        eval: k.store.Get(ctx, k.name)
        to: k.store.Get
      - opt:
          do:
            - return: nil, getErr
          when: getErr != nil
      - bind: key, keyErr
        eval: k.subkey(current, label)
        to: k.subkey
      - opt:
          do:
            - return: nil, keyErr
          when: keyErr != nil
      - defer: key.Zeroize()
        to: key.Zeroize
      - return: k.sealUnder(key, current.Version, plaintext, aad)
        to: k.sealUnder
  - of: (*Keyring).sealUnder
    participants:
      - id: caller
        kind: actor
      - id: (*Keyring).sealUnder
        kind: self
      - id: corecrypto
        kind: package
    steps:
      - bind: sealed, sealErr
        eval: corecrypto.Seal(sealAlgorithm, key, plaintext, k.binding(version, aad))
        to: corecrypto
      - opt:
          do:
            - return: nil, sealErr
          when: sealErr != nil
      - return: append(header(version), sealed...), nil
  - of: (*Keyring).Open
    participants:
      - id: caller
        kind: actor
      - id: (*Keyring).Open
        kind: self
      - id: k.openAs
        kind: internal
    steps:
      - return: k.openAs(ctx, sealLabel, box, aad)
        to: k.openAs
  - of: (*Keyring).openAs
    participants:
      - id: caller
        kind: actor
      - id: (*Keyring).openAs
        kind: self
      - id: parseHeader
        kind: internal
      - id: k.keyFor
        kind: internal
      - id: key.Zeroize
        kind: value
      - id: corecrypto
        kind: package
    steps:
      - bind: version, sealed, parsed
        eval: parseHeader(box)
        to: parseHeader
      - opt:
          do:
            - return: nil, coresecret.SealInvalid
          when: "!parsed"
      - bind: key, keyErr
        eval: k.keyFor(ctx, version, label)
        to: k.keyFor
      - opt:
          do:
            - return: nil, verdictOr(keyErr, coresecret.SealInvalid)
          when: keyErr != nil
      - defer: key.Zeroize()
        to: key.Zeroize
      - bind: plaintext, openErr
        eval: corecrypto.Open(key, sealed, k.binding(version, aad))
        to: corecrypto
      - opt:
          do:
            - return: nil, coresecret.SealInvalid
          when: openErr != nil
      - return: plaintext, nil
  - of: (*Keyring).Sign
    participants:
      - id: caller
        kind: actor
      - id: (*Keyring).Sign
        kind: self
      - id: k.store.Get
        kind: value
      - id: k.subkey
        kind: internal
      - id: key.Zeroize
        kind: value
      - id: corecrypto
        kind: package
    steps:
      - bind: current, getErr
        eval: k.store.Get(ctx, k.name)
        to: k.store.Get
      - opt:
          do:
            - return: nil, getErr
          when: getErr != nil
      - bind: key, keyErr
        eval: k.subkey(current, signLabel)
        to: k.subkey
      - opt:
          do:
            - return: nil, keyErr
          when: keyErr != nil
      - defer: key.Zeroize()
        to: key.Zeroize
      - bind: tag, tagErr
        eval: corecrypto.MACTag(macAlgorithm, key, k.binding(current.Version, message))
        to: corecrypto
      - opt:
          do:
            - return: nil, tagErr
          when: tagErr != nil
      - return: append(header(current.Version), tag...), nil
  - of: (*Keyring).Verify
    participants:
      - id: caller
        kind: actor
      - id: (*Keyring).Verify
        kind: self
      - id: parseHeader
        kind: internal
      - id: k.keyFor
        kind: internal
      - id: verdictOr
        kind: internal
      - id: key.Zeroize
        kind: value
      - id: corecrypto
        kind: package
    steps:
      - bind: version, tag, parsed
        eval: parseHeader(signature)
        to: parseHeader
      - opt:
          do:
            - return: coresecret.SignatureInvalid
          when: "!parsed"
      - bind: key, keyErr
        eval: k.keyFor(ctx, version, signLabel)
        to: k.keyFor
      - opt:
          do:
            - return: verdictOr(keyErr, coresecret.SignatureInvalid)
              to: verdictOr
          when: keyErr != nil
      - defer: key.Zeroize()
        to: key.Zeroize
      - bind: valid, verifyErr
        eval: corecrypto.MACVerify(macAlgorithm, key, k.binding(version, message), tag)
        to: corecrypto
      - opt:
          do:
            - return: coresecret.SignatureInvalid
          when: verifyErr != nil || !valid
      - return: nil
  - of: (*Keyring).keyFor
    participants:
      - id: caller
        kind: actor
      - id: (*Keyring).keyFor
        kind: self
      - id: k.store.Versions
        kind: value
      - id: k.subkey
        kind: internal
    steps:
      - bind: versions, readErr
        eval: k.store.Versions(ctx, k.name)
        to: k.store.Versions
      - opt:
          do:
            - return: corecrypto.Key{}, readErr
          when: readErr != nil
      - loop:
          do:
            - opt:
                do:
                  - return: k.subkey(candidate, label)
                    to: k.subkey
                when: candidate.Version == version
          key: _
          range: versions
          value: candidate
      - return: corecrypto.Key{}, notFound(k.name)
  - of: (*Keyring).subkey
    participants:
      - id: caller
        kind: actor
      - id: (*Keyring).subkey
        kind: self
      - id: version.Value.Reveal
        kind: value
      - id: corecrypto
        kind: package
    steps:
      - opt:
          do:
            - return: |-
                corecrypto.Key{}, wrapAs(coresecret.KeyMaterialInvalid, nil,
                			errs.String("secret", k.name), errs.Int("version", version.Version))
          when: version.Value.Len() != corecrypto.KeyLen || version.Version < 1 || uint64(version.Version) > math.MaxUint32
      - bind: material
        eval: version.Value.Reveal()
        to: version.Value.Reveal
      - defer: clear(material)
      - bind: derived, deriveErr
        eval: corecrypto.Subkey(kdfAlgorithm, material, nil, label, corecrypto.KeyLen)
        to: corecrypto
      - opt:
          do:
            - return: corecrypto.Key{}, deriveErr
          when: deriveErr != nil
      - defer: clear(derived)
      - return: corecrypto.NewKey(derived)
        to: corecrypto
  - of: (*Keyring).binding
    participants:
      - id: caller
        kind: actor
      - id: (*Keyring).binding
        kind: self
      - id: binary.BigEndian.AppendUint32
        kind: value
    steps:
      - bind: bound
        eval: make([]byte, 0, len(bindingPrefix)+len(k.name)+1+versionBytes+len(tail))
      - set: bound
        value: append(bound, bindingPrefix...)
      - set: bound
        value: append(bound, k.name...)
      - set: bound
        value: append(bound, 0)
      - set: bound
        to: binary.BigEndian.AppendUint32
        value: binary.BigEndian.AppendUint32(bound, uint32(version))
      - return: append(bound, tail...)
  - of: header
    participants:
      - id: caller
        kind: actor
      - id: header
        kind: self
      - id: binary.BigEndian.AppendUint32
        kind: value
    steps:
      - bind: out
        eval: make([]byte, 0, headerLen)
      - set: out
        value: append(out, boxFormat)
      - return: binary.BigEndian.AppendUint32(out, uint32(version))
        to: binary.BigEndian.AppendUint32
  - of: parseHeader
    steps:
      - opt:
          do:
            - return: 0, nil, false
          when: len(data) <= headerLen || data[0] != boxFormat
      - set: version
        value: int(binary.BigEndian.Uint32(data[1:headerLen]))
      - opt:
          do:
            - return: 0, nil, false
          when: version < 1
      - return: version, data[headerLen:], true
  - of: verdictOr
    steps:
      - opt:
          do:
            - return: err
          when: errs.HasCode(err, coresecret.CodeStoreUnavailable)
      - return: oracleSafe
  - of: (*Keyring).view
    participants:
      - id: caller
        kind: actor
      - id: (*Keyring).view
        kind: self
      - id: k.store.Versions
        kind: value
      - id: k.subkey
        kind: internal
      - id: view.close
        kind: internal
    steps:
      - bind: versions, readErr
        eval: k.store.Versions(ctx, k.name)
        to: k.store.Versions
      - opt:
          do:
            - return: nil, readErr
          when: readErr != nil
      - set: view
        value: "&rootView{keyring: k, newest: versions[0].Version, keys: make(map[int]corecrypto.Key, len(versions))}"
      - loop:
          do:
            - bind: key, keyErr
              eval: k.subkey(version, label)
              to: k.subkey
            - opt:
                do:
                  - opt:
                      do:
                        - eval: view.close()
                          to: view.close
                        - return: nil, keyErr
                      when: version.Version == view.newest
                  - continue: true
                when: keyErr != nil
            - set: view.keys[version.Version]
              value: key
          key: _
          range: versions
          value: version
      - return: view, nil
  - of: (*rootView).seal
    participants:
      - id: caller
        kind: actor
      - id: (*rootView).seal
        kind: self
      - id: v.keyring.sealUnder
        kind: internal
    steps:
      - return: v.keyring.sealUnder(v.keys[v.newest], v.newest, plaintext, aad)
        to: v.keyring.sealUnder
  - of: (*rootView).open
    participants:
      - id: caller
        kind: actor
      - id: (*rootView).open
        kind: self
      - id: parseHeader
        kind: internal
      - id: corecrypto
        kind: package
    steps:
      - bind: version, sealed, parsed
        eval: parseHeader(box)
        to: parseHeader
      - opt:
          do:
            - return: nil, coresecret.SealInvalid
          when: "!parsed"
      - bind: key, kept
        eval: v.keys[version]
      - opt:
          do:
            - return: nil, coresecret.SealInvalid
          when: "!kept"
      - bind: plaintext, openErr
        eval: corecrypto.Open(key, sealed, v.keyring.binding(version, aad))
        to: corecrypto
      - opt:
          do:
            - return: nil, coresecret.SealInvalid
          when: openErr != nil
      - return: plaintext, nil
  - of: (*rootView).close
    participants:
      - id: caller
        kind: actor
      - id: (*rootView).close
        kind: self
      - id: key.Zeroize
        kind: value
    steps:
      - loop:
          do:
            - eval: key.Zeroize()
              to: key.Zeroize
            - eval: delete(v.keys, version)
          key: version
          range: v.keys
          value: key
  - of: NewMemory
    steps:
      - bind: clk
        eval: cfg.Clock
      - opt:
          do:
            - set: clk
              value: clock.System
          when: clk == nil
      - return: "&memoryStore{secrets: make(map[string][]coresecret.VersionValue, initialSecrets), clk: clk}"
  - of: (*memoryStore).Get
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).Get
        kind: self
      - id: coresecret
        kind: package
    steps:
      - opt:
          do:
            - return: coresecret.VersionValue{}, nameErr
          init:
            bind: nameErr
            eval: coresecret.ValidateName(name)
            to: coresecret
          when: nameErr != nil
      - lock:
          mutex: m.mu
          read: true
      - bind: versions
        eval: m.secrets[name]
      - opt:
          do:
            - return: coresecret.VersionValue{}, notFound(name)
          when: len(versions) == 0
      - return: versions[0], nil
  - of: (*memoryStore).Versions
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).Versions
        kind: self
      - id: coresecret
        kind: package
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil, nameErr
          init:
            bind: nameErr
            eval: coresecret.ValidateName(name)
            to: coresecret
          when: nameErr != nil
      - lock:
          mutex: m.mu
          read: true
      - bind: kept
        eval: m.secrets[name]
      - opt:
          do:
            - return: nil, notFound(name)
          when: len(kept) == 0
      - return: slices.Clone(kept), nil
        to: slices
  - of: (*memoryStore).Put
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).Put
        kind: self
      - id: checkPut
        kind: internal
    steps:
      - opt:
          do:
            - return: coresecret.VersionValue{}, putErr
          init:
            bind: putErr
            eval: checkPut(name, value.IsZero())
            to: checkPut
          when: putErr != nil
      - lock:
          mutex: m.mu
      - bind: kept
        eval: m.secrets[name]
      - set: created
        value: |-
          coresecret.VersionValue{
          		Name:    name,
          		Version: nextVersion(kept),
          		Value:   value,
          		Created: m.clk.Now(),
          	}
      - set: m.secrets[name]
        value: append([]coresecret.VersionValue{created}, kept...)
      - return: created, nil
  - of: (*memoryStore).Prune
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).Prune
        kind: self
      - id: checkPrune
        kind: internal
      - id: notFound
        kind: internal
      - id: pruned
        kind: internal
    steps:
      - opt:
          do:
            - return: pruneErr
          init:
            bind: pruneErr
            eval: checkPrune(name, keep)
            to: checkPrune
          when: pruneErr != nil
      - lock:
          mutex: m.mu
      - bind: kept
        eval: m.secrets[name]
      - opt:
          do:
            - return: notFound(name)
              to: notFound
          when: len(kept) == 0
      - set: m.secrets[name]
        to: pruned
        value: pruned(kept, keep)
      - return: nil
  - of: (*memoryStore).PruneBelow
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).PruneBelow
        kind: self
      - id: checkPruneBelow
        kind: internal
      - id: notFound
        kind: internal
      - id: prunedBelow
        kind: internal
    steps:
      - opt:
          do:
            - return: pruneErr
          init:
            bind: pruneErr
            eval: checkPruneBelow(name)
            to: checkPruneBelow
          when: pruneErr != nil
      - lock:
          mutex: m.mu
      - bind: kept
        eval: m.secrets[name]
      - opt:
          do:
            - return: notFound(name)
              to: notFound
          when: len(kept) == 0
      - set: m.secrets[name], _
        to: prunedBelow
        value: prunedBelow(kept, floor)
      - return: nil
  - of: (*memoryStore).Names
    participants:
      - id: caller
        kind: actor
      - id: (*memoryStore).Names
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - lock:
          mutex: m.mu
          read: true
      - return: slices.Sorted(maps.Keys(m.secrets)), nil
        to: slices
  - of: Random
    participants:
      - id: caller
        kind: actor
      - id: Random
        kind: self
      - id: rand
        kind: stdlib
      - id: coresecret
        kind: package
    steps:
      - return:
          closure:
            results: coresecret.Value, error
            steps:
              - opt:
                  do:
                    - return: |-
                        coresecret.Value{}, wrapAs(coresecret.InvalidConfig, nil,
                        				errs.String("setting", "Random"), errs.Int("bytes", n), errs.Int("minimum", minRandomBytes))
                  when: n < minRandomBytes
              - bind: raw
                eval: make([]byte, n)
              - defer: clear(raw)
              - opt:
                  do:
                    - return: coresecret.Value{}, wrapAs(coresecret.GenerateFailed, readErr)
                  init:
                    bind: _, readErr
                    eval: rand.Read(raw)
                    to: rand
                  when: readErr != nil
              - return: coresecret.NewValue(raw), nil
                to: coresecret
  - of: NewRotator
    participants:
      - id: caller
        kind: actor
      - id: NewRotator
        kind: self
      - id: cfg.validate
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, invalid
          init:
            bind: invalid
            eval: cfg.validate()
            to: cfg.validate
          when: invalid != nil
      - bind: clk
        eval: cfg.Clock
      - opt:
          do:
            - set: clk
              value: clock.System
          when: clk == nil
      - return: |-
          &Rotator{
          		store:    cfg.Store,
          		name:     cfg.Name,
          		policy:   cfg.Policy,
          		clk:      clk,
          		locker:   cfg.Locker,
          		onRotate: cfg.OnRotate,
          		inUse:    cfg.InUse,
          	}, nil
  - of: RotatorConfig.validate
    participants:
      - id: caller
        kind: actor
      - id: RotatorConfig.validate
        kind: self
      - id: refuseSetting
        kind: internal
      - id: coresecret
        kind: package
    steps:
      - opt:
          do:
            - return: refuseSetting("Store", "nil")
              to: refuseSetting
          when: c.Store == nil
      - opt:
          do:
            - return: nameErr
          init:
            bind: nameErr
            eval: coresecret.ValidateName(c.Name)
            to: coresecret
          when: nameErr != nil
      - opt:
          do:
            - return: refuseSetting("Policy.Every", "must be positive")
              to: refuseSetting
          when: c.Policy.Every <= 0
      - opt:
          do:
            - return: refuseSetting("Policy.Keep", "must be at least 2")
              to: refuseSetting
          when: c.Policy.Keep < minKeep
      - opt:
          do:
            - return: refuseSetting("Policy.Generate", "nil")
              to: refuseSetting
          when: c.Policy.Generate == nil
      - return: nil
  - of: refuseSetting
    participants:
      - id: caller
        kind: actor
      - id: refuseSetting
        kind: self
      - id: wrapAs
        kind: internal
    steps:
      - return: wrapAs(coresecret.InvalidConfig, nil, errs.String("setting", setting), errs.String("problem", problem))
        to: wrapAs
  - of: (*Rotator).Ensure
    participants:
      - id: caller
        kind: actor
      - id: (*Rotator).Ensure
        kind: self
      - id: r.serialised
        kind: internal
    steps:
      - bind: serialErr
        eval: |-
          r.serialised(ctx, func() error {
          		found, findErr := r.currentOrFirst(ctx)
          		current = found
          		//: the store's verdict, or the version found or created.
          		return findErr
          	})
        to: r.serialised
      - opt:
          do:
            - return: coresecret.VersionValue{}, serialErr
          when: serialErr != nil
      - return: current, nil
  - of: (*Rotator).Due
    participants:
      - id: caller
        kind: actor
      - id: (*Rotator).Due
        kind: self
      - id: r.store.Get
        kind: value
      - id: current.Created.Add
        kind: value
    steps:
      - bind: current, getErr
        eval: r.store.Get(ctx, r.name)
        to: r.store.Get
      - opt:
          do:
            - return: time.Time{}, getErr
          when: getErr != nil
      - return: current.Created.Add(r.policy.Every), nil
        to: current.Created.Add
  - of: (*Rotator).RotateIfDue
    participants:
      - id: caller
        kind: actor
      - id: (*Rotator).RotateIfDue
        kind: self
      - id: r.serialised
        kind: internal
      - id: r.notify
        kind: internal
    steps:
      - bind: serialErr
        eval: |-
          r.serialised(ctx, func() error {
          		found, findErr := r.currentOrFirst(ctx)
          		//: the store's verdict.
          		if findErr != nil {
          			//: nothing decided.
          			return findErr
          		}
          		current = found
          		//: not due yet — including a version Ensure just created.
          		if r.clk.Now().Before(found.Created.Add(r.policy.Every)) {
          			//: nothing to do.
          			return nil
          		}
          		created, rotateErr := r.rotateLocked(ctx)
          		//: a version was stored, even if the prune after it failed.
          		if !created.Value.IsZero() {
          			current, rotated = created, true
          		}
          		//: the rotation's verdict.
          		return rotateErr
          	})
        to: r.serialised
      - opt:
          do:
            - eval: r.notify(current)
              to: r.notify
          when: rotated
      - return: current, rotated, serialErr
  - of: (*Rotator).Rotate
    participants:
      - id: caller
        kind: actor
      - id: (*Rotator).Rotate
        kind: self
      - id: r.serialised
        kind: internal
      - id: r.notify
        kind: internal
    steps:
      - bind: serialErr
        eval: |-
          r.serialised(ctx, func() error {
          		stored, rotateErr := r.rotateLocked(ctx)
          		created = stored
          		//: the rotation's verdict.
          		return rotateErr
          	})
        to: r.serialised
      - opt:
          do:
            - eval: r.notify(created)
              to: r.notify
          when: "!created.Value.IsZero()"
      - return: created, serialErr
  - of: (*Rotator).Run
    participants:
      - id: caller
        kind: actor
      - id: (*Rotator).Run
        kind: self
      - id: r.RotateIfDue
        kind: internal
    steps:
      - loop:
          do:
            - bind: current, _, stepErr
              eval: r.RotateIfDue(ctx)
              to: r.RotateIfDue
            - opt:
                do:
                  - opt:
                      do:
                        - return: nil
                      when: ctx.Err() != nil
                  - return: stepErr
                when: stepErr != nil
            - opt:
                do:
                  - return: nil
                when: "!r.sleepUntil(ctx, current.Created.Add(r.policy.Every))"
          forever: true
  - of: (*Rotator).sleepUntil
    participants:
      - id: caller
        kind: actor
      - id: (*Rotator).sleepUntil
        kind: self
      - id: due.Sub
        kind: value
      - id: r.clk.NewTimer
        kind: value
      - id: timer.Stop
        kind: value
    steps:
      - bind: wait
        eval: due.Sub(r.clk.Now())
        to: due.Sub
      - opt:
          do:
            - set: wait
              value: r.policy.Every
          when: wait <= 0
      - bind: timer
        eval: r.clk.NewTimer(wait)
        to: r.clk.NewTimer
      - defer: timer.Stop()
        to: timer.Stop
      - select:
          cases:
            - comm: <-ctx.Done()
              do:
                - return: "false"
            - comm: <-timer.C()
              do:
                - return: "true"
  - of: (*Rotator).currentOrFirst
    participants:
      - id: caller
        kind: actor
      - id: (*Rotator).currentOrFirst
        kind: self
      - id: r.store.Get
        kind: value
      - id: r.generate
        kind: internal
      - id: r.store.Put
        kind: value
    steps:
      - bind: current, getErr
        eval: r.store.Get(ctx, r.name)
        to: r.store.Get
      - opt:
          do:
            - return: current, getErr
          when: getErr == nil || !errs.HasCode(getErr, coresecret.CodeNotFound)
      - bind: value, genErr
        eval: r.generate()
        to: r.generate
      - opt:
          do:
            - return: coresecret.VersionValue{}, genErr
          when: genErr != nil
      - return: r.store.Put(ctx, r.name, value)
        to: r.store.Put
  - of: (*Rotator).rotateLocked
    participants:
      - id: caller
        kind: actor
      - id: (*Rotator).rotateLocked
        kind: self
      - id: r.generate
        kind: internal
      - id: r.store.Put
        kind: value
      - id: r.floorFor
        kind: internal
    steps:
      - bind: value, genErr
        eval: r.generate()
        to: r.generate
      - opt:
          do:
            - return: coresecret.VersionValue{}, genErr
          when: genErr != nil
      - bind: created, putErr
        eval: r.store.Put(ctx, r.name, value)
        to: r.store.Put
      - opt:
          do:
            - return: coresecret.VersionValue{}, putErr
          when: putErr != nil
      - bind: floor, floorErr
        eval: r.floorFor(ctx, created.Version)
        to: r.floorFor
      - opt:
          do:
            - return: created, floorErr
          when: floorErr != nil
      - return: created, r.pruneBelow(ctx, floor)
  - of: (*Rotator).floorFor
    steps:
      - set: floor
        value: newest - r.policy.Keep + 1
      - opt:
          do:
            - return: floor, nil
          when: r.inUse == nil
      - bind: oldest, inUseErr
        eval: r.inUse(ctx)
      - opt:
          do:
            - return: 0, inUseErr
          when: inUseErr != nil
      - opt:
          do:
            - return: floor, nil
          when: oldest < 1 || oldest > newest
      - return: min(floor, oldest), nil
  - of: (*Rotator).pruneBelow
    participants:
      - id: caller
        kind: actor
      - id: (*Rotator).pruneBelow
        kind: self
      - id: byFloor.PruneBelow
        kind: value
      - id: r.store.Versions
        kind: value
      - id: r.store.Prune
        kind: value
    steps:
      - opt:
          do:
            - return: nil
          when: floor <= 1
      - opt:
          do:
            - return: byFloor.PruneBelow(ctx, r.name, floor)
              to: byFloor.PruneBelow
          init:
            bind: byFloor, ok
            eval: r.store.(coresecret.FloorPruner)
          when: ok
      - bind: versions, readErr
        eval: r.store.Versions(ctx, r.name)
        to: r.store.Versions
      - opt:
          do:
            - return: readErr
          when: readErr != nil
      - bind: keep
        eval: "0"
      - loop:
          do:
            - opt:
                do:
                  - break: true
                when: version.Version < floor
            - op: ++
              set: keep
          key: _
          range: versions
          value: version
      - return: r.store.Prune(ctx, r.name, max(keep, 1))
        to: r.store.Prune
  - of: (*Rotator).generate
    participants:
      - id: caller
        kind: actor
      - id: (*Rotator).generate
        kind: self
      - id: errs
        kind: package
    steps:
      - bind: value, genErr
        eval: r.policy.Generate()
      - opt:
          do:
            - opt:
                do:
                  - return: coresecret.Value{}, genErr
                init:
                  bind: _, typed
                  eval: errs.CodeOf(genErr)
                  to: errs
                when: typed
            - return: coresecret.Value{}, wrapAs(coresecret.GenerateFailed, genErr, errs.String("secret", r.name))
          when: genErr != nil
      - opt:
          do:
            - return: coresecret.Value{}, wrapAs(coresecret.GenerateFailed, nil, errs.String("secret", r.name), errs.String("problem", "empty"))
          when: value.IsZero()
      - return: value, nil
  - of: (*Rotator).serialised
    participants:
      - id: caller
        kind: actor
      - id: (*Rotator).serialised
        kind: self
      - id: r.locker.Acquire
        kind: value
      - id: ctx.Err
        kind: value
      - id: wrapAs
        kind: internal
      - id: lease.Release
        kind: value
      - id: errors
        kind: stdlib
    steps:
      - lock:
          mutex: r.mu
      - opt:
          do:
            - return: work()
          when: r.locker == nil
      - bind: lease, acquireErr
        eval: r.locker.Acquire(ctx, rotateLockPrefix+r.name)
        to: r.locker.Acquire
      - opt:
          do:
            - opt:
                do:
                  - return: ctxErr
                init:
                  bind: ctxErr
                  eval: ctx.Err()
                  to: ctx.Err
                when: ctxErr != nil
            - return: wrapAs(coresecret.StoreUnavailable, acquireErr, errs.String("secret", r.name), errs.String("operation", "lock"))
              to: wrapAs
          when: acquireErr != nil
      - bind: workErr
        eval: work()
      - bind: releaseErr
        eval: lease.Release(context.WithoutCancel(ctx))
        to: lease.Release
      - opt:
          do:
            - return: |-
                errors.Join(workErr, wrapAs(coresecret.StoreUnavailable, releaseErr,
                			errs.String("secret", r.name), errs.String("operation", "unlock")))
              to: errors
          when: releaseErr != nil
      - return: workErr
  - of: (*Rotator).notify
    steps:
      - opt:
          do:
            - return: ""
          when: r.onRotate == nil
      - eval: r.onRotate(rotated)
  - of: SubjectOf
    participants:
      - id: caller
        kind: actor
      - id: SubjectOf
        kind: self
      - id: parseSubjectBox
        kind: internal
    steps:
      - bind: parsed, ok
        eval: parseSubjectBox(box)
        to: parseSubjectBox
      - opt:
          do:
            - return: "\"\", coresecret.SealInvalid"
          when: "!ok"
      - return: parsed.subject, nil
  - of: subjectHeader
    steps:
      - bind: out
        eval: make([]byte, 0, subjectHeaderMin-1+len(subject))
      - set: out
        value: append(out, subjectBoxFormat, byte(len(subject)))
      - set: out
        value: append(out, subject...)
      - return: append(out, id[:]...)
  - of: parseSubjectBox
    steps:
      - opt:
          do:
            - return: subjectBox{}, false
          when: len(box) < subjectHeaderMin || box[0] != subjectBoxFormat
      - bind: length
        eval: int(box[1])
      - bind: end
        eval: 2 + length + keyIDLen
      - opt:
          do:
            - return: subjectBox{}, false
          when: length == 0 || length > coresecret.MaxSubjectLen || len(box) <= end
      - bind: subject
        eval: "string(box[2 : 2+length])"
      - opt:
          do:
            - return: subjectBox{}, false
          when: coresecret.ValidateSubject(subject) != nil
      - set: parsed
        value: "subjectBox{subject: subject, header: box[:end], sealed: box[end:]}"
      - eval: copy(parsed.id[:], box[2+length:end])
      - return: parsed, true
  - of: subjectAAD
    participants:
      - id: caller
        kind: actor
      - id: subjectAAD
        kind: self
      - id: binary.BigEndian.AppendUint32
        kind: value
    steps:
      - bind: size
        eval: len(subjectBoxDomain) + len(header)
      - loop:
          do:
            - op: +=
              set: size
              value: bindPartPrefix + len(part)
          key: _
          range: bind
          value: part
      - bind: out
        eval: make([]byte, 0, size)
      - set: out
        value: append(out, subjectBoxDomain...)
      - set: out
        value: append(out, header...)
      - loop:
          do:
            - set: out
              to: binary.BigEndian.AppendUint32
              value: binary.BigEndian.AppendUint32(out, uint32(len(part)))
            - set: out
              value: append(out, part...)
          key: _
          range: bind
          value: part
      - return: out
  - of: wrapAAD
    steps:
      - bind: out
        eval: make([]byte, 0, len(wrapDomain)+len(subject))
      - set: out
        value: append(out, wrapDomain...)
      - return: append(out, subject...)
  - of: (*openedKey).take
    participants:
      - id: caller
        kind: actor
      - id: (*openedKey).take
        kind: self
      - id: corecrypto
        kind: package
    steps:
      - lock:
          mutex: o.mu
      - opt:
          do:
            - return: corecrypto.Key{}, id, false
          when: o.seal == nil
      - bind: key, keyErr
        eval: corecrypto.NewKey(o.seal)
        to: corecrypto
      - opt:
          do:
            - return: corecrypto.Key{}, id, false
          when: keyErr != nil
      - return: key, o.id, true
  - of: (*openedKey).wipe
    steps:
      - lock:
          mutex: o.mu
      - eval: clear(o.seal)
      - set: o.seal
        value: nil
  - of: newKeyCache
    steps:
      - opt:
          do:
            - return: "&keyCache{}"
          when: size == 0
      - return: |-
          &keyCache{entries: kcache.NewCache(kcache.Config[string, *openedKey]{
          		MaxEntries: size,
          		DefaultTTL: ttl,
          		Clock:      clk,
          		OnEvict:    func(_ string, opened *openedKey) { opened.wipe() },
          	})}
  - of: (*keyCache).fetch
    participants:
      - id: caller
        kind: actor
      - id: (*keyCache).fetch
        kind: self
      - id: c.entries.Fetch
        kind: value
    steps:
      - opt:
          do:
            - return: nil, false
          when: c.entries == nil
      - return: c.entries.Fetch(subject)
        to: c.entries.Fetch
  - of: (*keyCache).current
    steps:
      - lock:
          mutex: c.mu
      - return: c.epoch
  - of: (*keyCache).offer
    participants:
      - id: caller
        kind: actor
      - id: (*keyCache).offer
        kind: self
      - id: opened.wipe
        kind: internal
      - id: c.entries.Fetch
        kind: value
      - id: c.entries.Set
        kind: value
    steps:
      - lock:
          mutex: c.mu
      - opt:
          do:
            - eval: opened.wipe()
              to: opened.wipe
            - return: ""
          when: c.entries == nil || c.epoch != epoch
      - opt:
          do:
            - eval: opened.wipe()
              to: opened.wipe
            - return: ""
          init:
            bind: _, present
            eval: c.entries.Fetch(subject)
            to: c.entries.Fetch
          when: present
      - eval: c.entries.Set(subject, opened)
        to: c.entries.Set
  - of: (*keyCache).forget
    participants:
      - id: caller
        kind: actor
      - id: (*keyCache).forget
        kind: self
      - id: c.entries.Fetch
        kind: value
      - id: c.entries.Delete
        kind: value
      - id: opened.wipe
        kind: internal
    steps:
      - lock:
          mutex: c.mu
      - op: ++
        set: c.epoch
      - opt:
          do:
            - return: ""
          when: c.entries == nil
      - bind: opened, present
        eval: c.entries.Fetch(subject)
        to: c.entries.Fetch
      - opt:
          do:
            - return: ""
          when: "!present"
      - eval: c.entries.Delete(subject)
        to: c.entries.Delete
      - eval: opened.wipe()
        to: opened.wipe
  - of: NewSubjectKeys
    participants:
      - id: caller
        kind: actor
      - id: NewSubjectKeys
        kind: self
      - id: cfg.validate
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, invalid
          init:
            bind: invalid
            eval: cfg.validate()
            to: cfg.validate
          when: invalid != nil
      - bind: clk
        eval: cfg.Clock
      - opt:
          do:
            - set: clk
              value: clock.System
          when: clk == nil
      - return: |-
          &SubjectKeys{
          		root:   cfg.Root,
          		former: cfg.Former,
          		store:  cfg.Store,
          		cache:  newKeyCache(cfg.CacheSize, cfg.CacheTTL, clk),
          	}, nil
  - of: SubjectKeysConfig.validate
    participants:
      - id: caller
        kind: actor
      - id: SubjectKeysConfig.validate
        kind: self
      - id: refuseSetting
        kind: internal
    steps:
      - opt:
          do:
            - return: refuseSetting("Root", "nil")
              to: refuseSetting
          when: c.Root == nil
      - opt:
          do:
            - return: refuseSetting("Store", "nil")
              to: refuseSetting
          when: c.Store == nil
      - opt:
          do:
            - return: refuseSetting("CacheSize", "must not be negative")
              to: refuseSetting
          when: c.CacheSize < 0
      - opt:
          do:
            - return: refuseSetting("CacheTTL", "must be positive with a cache")
              to: refuseSetting
          when: c.CacheSize > 0 && c.CacheTTL <= 0
      - opt:
          do:
            - return: refuseSetting("CacheTTL", "set without a CacheSize")
              to: refuseSetting
          when: c.CacheSize == 0 && c.CacheTTL != 0
      - opt:
          do:
            - return: refuseSetting("Former", "the root itself")
              to: refuseSetting
          when: c.Former != nil && c.Former == c.Root
      - return: nil
  - of: (*SubjectKeys).Seal
    participants:
      - id: caller
        kind: actor
      - id: (*SubjectKeys).Seal
        kind: self
      - id: coresecret
        kind: package
      - id: s.acquire
        kind: internal
      - id: key.Zeroize
        kind: value
      - id: subjectHeader
        kind: internal
      - id: corecrypto
        kind: package
    steps:
      - opt:
          do:
            - return: nil, subjectErr
          init:
            bind: subjectErr
            eval: coresecret.ValidateSubject(subject)
            to: coresecret
          when: subjectErr != nil
      - bind: key, id, _, acquireErr
        eval: s.acquire(ctx, subject, true)
        to: s.acquire
      - opt:
          do:
            - return: nil, acquireErr
          when: acquireErr != nil
      - defer: key.Zeroize()
        to: key.Zeroize
      - bind: header
        eval: subjectHeader(subject, id)
        to: subjectHeader
      - bind: sealed, sealErr
        eval: corecrypto.Seal(sealAlgorithm, key, plaintext, subjectAAD(header, bind))
        to: corecrypto
      - opt:
          do:
            - return: nil, sealErr
          when: sealErr != nil
      - return: append(header, sealed...), nil
  - of: (*SubjectKeys).Open
    participants:
      - id: caller
        kind: actor
      - id: (*SubjectKeys).Open
        kind: self
      - id: parseSubjectBox
        kind: internal
      - id: s.acquire
        kind: internal
      - id: key.Zeroize
        kind: value
      - id: s.cache.forget
        kind: internal
      - id: corecrypto
        kind: package
    steps:
      - bind: parsed, ok
        eval: parseSubjectBox(box)
        to: parseSubjectBox
      - opt:
          do:
            - return: nil, coresecret.SealInvalid
          when: "!ok"
      - bind: key, id, cached, acquireErr
        eval: s.acquire(ctx, parsed.subject, false)
        to: s.acquire
      - opt:
          do:
            - return: nil, acquireErr
          when: acquireErr != nil
      - opt:
          do:
            - eval: key.Zeroize()
              to: key.Zeroize
            - eval: s.cache.forget(parsed.subject)
              to: s.cache.forget
            - set: key, id, _, acquireErr
              to: s.acquire
              value: s.acquire(ctx, parsed.subject, false)
            - opt:
                do:
                  - return: nil, acquireErr
                when: acquireErr != nil
          when: "!sameID(id, parsed.id) && cached"
      - defer: key.Zeroize()
        to: key.Zeroize
      - opt:
          do:
            - return: nil, keyDestroyed(parsed.subject)
          when: "!sameID(id, parsed.id)"
      - bind: plaintext, openErr
        eval: corecrypto.Open(key, parsed.sealed, subjectAAD(parsed.header, bind))
        to: corecrypto
      - opt:
          do:
            - return: nil, coresecret.SealInvalid
          when: openErr != nil
      - return: plaintext, nil
  - of: (*SubjectKeys).Destroy
    participants:
      - id: caller
        kind: actor
      - id: (*SubjectKeys).Destroy
        kind: self
      - id: coresecret
        kind: package
      - id: s.store.Delete
        kind: value
      - id: s.cache.forget
        kind: internal
    steps:
      - opt:
          do:
            - return: false, subjectErr
          init:
            bind: subjectErr
            eval: coresecret.ValidateSubject(subject)
            to: coresecret
          when: subjectErr != nil
      - bind: deleted, deleteErr
        eval: s.store.Delete(ctx, subject)
        to: s.store.Delete
      - eval: s.cache.forget(subject)
        to: s.cache.forget
      - opt:
          do:
            - return: false, storeFailure(deleteErr, "delete", subject)
          when: deleteErr != nil
      - return: deleted, nil
  - of: (*SubjectKeys).acquire
    participants:
      - id: caller
        kind: actor
      - id: (*SubjectKeys).acquire
        kind: self
      - id: s.cache.fetch
        kind: internal
      - id: hit.take
        kind: internal
      - id: s.cache.current
        kind: internal
      - id: s.load
        kind: internal
      - id: opened.take
        kind: internal
      - id: s.cache.offer
        kind: internal
    steps:
      - opt:
          do:
            - bind: key, id, live
              eval: hit.take()
              to: hit.take
            - opt:
                do:
                  - return: key, id, true, nil
                when: live
          init:
            bind: hit, found
            eval: s.cache.fetch(subject)
            to: s.cache.fetch
          when: found
      - bind: epoch
        eval: s.cache.current()
        to: s.cache.current
      - bind: opened, loadErr
        eval: s.load(ctx, subject, create)
        to: s.load
      - opt:
          do:
            - return: corecrypto.Key{}, id, false, loadErr
          when: loadErr != nil
      - bind: key, id, live
        eval: opened.take()
        to: opened.take
      - eval: s.cache.offer(subject, epoch, opened)
        to: s.cache.offer
      - opt:
          do:
            - return: corecrypto.Key{}, id, false, keyUnreadable(subject)
          when: "!live"
      - return: key, id, false, nil
  - of: (*SubjectKeys).load
    participants:
      - id: caller
        kind: actor
      - id: (*SubjectKeys).load
        kind: self
      - id: s.store.Get
        kind: value
      - id: s.unwrap
        kind: internal
      - id: s.create
        kind: internal
    steps:
      - loop:
          do:
            - bind: wrapped, found, getErr
              eval: s.store.Get(ctx, subject)
              to: s.store.Get
            - opt:
                do:
                  - return: nil, storeFailure(getErr, "get", subject)
                when: getErr != nil
            - opt:
                do:
                  - return: s.unwrap(ctx, subject, wrapped)
                    to: s.unwrap
                when: found
            - opt:
                do:
                  - return: nil, keyDestroyed(subject)
                when: "!create"
            - bind: made, inserted, createErr
              eval: s.create(ctx, subject)
              to: s.create
            - opt:
                do:
                  - return: nil, createErr
                when: createErr != nil
            - opt:
                do:
                  - return: made, nil
                when: inserted
          range: createAttempts
      - return: |-
          nil, errs.Wrap(coresecret.StoreUnavailable, errs.WrapParams{},
          		errs.String("operation", "insert"), errs.String("subject", subject),
          		errs.String("problem", "the subject's key was created and destroyed concurrently"))
  - of: (*SubjectKeys).create
    participants:
      - id: caller
        kind: actor
      - id: (*SubjectKeys).create
        kind: self
      - id: rand
        kind: stdlib
      - id: s.root.sealAs
        kind: internal
      - id: s.store.Insert
        kind: value
      - id: s.settle
        kind: internal
      - id: deriveOpened
        kind: internal
    steps:
      - bind: dek
        eval: make([]byte, corecrypto.KeyLen)
      - defer: clear(dek)
      - opt:
          do:
            - return: nil, false, wrapAs(coresecret.GenerateFailed, readErr, errs.String("subject", subject))
          init:
            bind: _, readErr
            eval: rand.Read(dek)
            to: rand
          when: readErr != nil
      - bind: wrapped, wrapErr
        eval: s.root.sealAs(ctx, wrapLabel, dek, wrapAAD(subject))
        to: s.root.sealAs
      - opt:
          do:
            - return: nil, false, wrapErr
          when: wrapErr != nil
      - bind: filed, insertErr
        eval: s.store.Insert(ctx, subject, wrapped)
        to: s.store.Insert
      - opt:
          do:
            - return: nil, false, storeFailure(insertErr, "insert", subject)
          when: insertErr != nil
      - opt:
          do:
            - return: nil, false, nil
          when: "!filed"
      - bind: settled, settleErr
        eval: s.settle(ctx, subject, dek, wrapped)
        to: s.settle
      - opt:
          do:
            - return: nil, false, settleErr
          when: settleErr != nil
      - opt:
          do:
            - return: nil, false, nil
          when: "!settled"
      - set: opened, err
        to: deriveOpened
        value: deriveOpened(subject, dek)
      - return: opened, err == nil, err
  - of: (*SubjectKeys).settle
    participants:
      - id: caller
        kind: actor
      - id: (*SubjectKeys).settle
        kind: self
      - id: parseHeader
        kind: internal
      - id: s.root.store.Get
        kind: value
      - id: s.root.sealAs
        kind: internal
      - id: s.store.Replace
        kind: value
    steps:
      - bind: version, _, _
        eval: parseHeader(wrapped)
        to: parseHeader
      - bind: newest, getErr
        eval: s.root.store.Get(ctx, s.root.name)
        to: s.root.store.Get
      - opt:
          do:
            - return: false, getErr
          when: getErr != nil
      - opt:
          do:
            - return: true, nil
          when: newest.Version == version
      - bind: rewrapped, wrapErr
        eval: s.root.sealAs(ctx, wrapLabel, dek, wrapAAD(subject))
        to: s.root.sealAs
      - opt:
          do:
            - return: false, wrapErr
          when: wrapErr != nil
      - bind: replaced, replaceErr
        eval: s.store.Replace(ctx, subject, wrapped, rewrapped)
        to: s.store.Replace
      - opt:
          do:
            - return: false, storeFailure(replaceErr, "replace", subject)
          when: replaceErr != nil
      - return: replaced, nil
  - of: (*SubjectKeys).unwrap
    participants:
      - id: caller
        kind: actor
      - id: (*SubjectKeys).unwrap
        kind: self
      - id: s.root.openAs
        kind: internal
      - id: s.former.openAs
        kind: internal
      - id: deriveOpened
        kind: internal
    steps:
      - bind: dek, openErr
        eval: s.root.openAs(ctx, wrapLabel, wrapped, wrapAAD(subject))
        to: s.root.openAs
      - opt:
          do:
            - set: dek, openErr
              to: s.former.openAs
              value: s.former.openAs(ctx, wrapLabel, wrapped, wrapAAD(subject))
          when: openErr != nil && s.former != nil && !errs.HasCode(openErr, coresecret.CodeStoreUnavailable)
      - opt:
          do:
            - opt:
                do:
                  - return: nil, openErr
                when: errs.HasCode(openErr, coresecret.CodeStoreUnavailable)
            - return: nil, keyUnreadable(subject)
          when: openErr != nil
      - defer: clear(dek)
      - opt:
          do:
            - return: nil, keyUnreadable(subject)
          when: len(dek) != corecrypto.KeyLen
      - return: deriveOpened(subject, dek)
        to: deriveOpened
  - of: deriveOpened
    participants:
      - id: caller
        kind: actor
      - id: deriveOpened
        kind: self
      - id: corecrypto
        kind: package
    steps:
      - bind: seal, sealErr
        eval: corecrypto.Subkey(kdfAlgorithm, dek, nil, subjectSealLabel+subject, corecrypto.KeyLen)
        to: corecrypto
      - opt:
          do:
            - return: nil, sealErr
          when: sealErr != nil
      - bind: id, idErr
        eval: corecrypto.Subkey(kdfAlgorithm, dek, nil, subjectIDLabel+subject, corecrypto.KeyLen)
        to: corecrypto
      - opt:
          do:
            - eval: clear(seal)
            - return: nil, idErr
          when: idErr != nil
      - defer: clear(id)
      - set: opened
        value: "&openedKey{seal: seal}"
      - eval: copy(opened.id[:], id)
      - return: opened, nil
  - of: sameID
    steps:
      - return: subtle.ConstantTimeCompare(held[:], named[:]) == 1
  - of: keyDestroyed
    participants:
      - id: caller
        kind: actor
      - id: keyDestroyed
        kind: self
      - id: errs
        kind: package
    steps:
      - return: errs.Wrap(coresecret.KeyDestroyed, errs.WrapParams{}, errs.String("subject", subject))
        to: errs
  - of: keyUnreadable
    participants:
      - id: caller
        kind: actor
      - id: keyUnreadable
        kind: self
      - id: errs
        kind: package
    steps:
      - return: errs.Wrap(coresecret.SubjectKeyUnreadable, errs.WrapParams{}, errs.String("subject", subject))
        to: errs
  - of: NewMemorySubjectKeyStore
    steps:
      - return: "&memorySubjectKeys{keys: make(map[string][]byte, initialSecrets)}"
  - of: (*memorySubjectKeys).Get
    participants:
      - id: caller
        kind: actor
      - id: (*memorySubjectKeys).Get
        kind: self
      - id: coresecret
        kind: package
      - id: bytes
        kind: stdlib
    steps:
      - opt:
          do:
            - return: nil, false, subjectErr
          init:
            bind: subjectErr
            eval: coresecret.ValidateSubject(subject)
            to: coresecret
          when: subjectErr != nil
      - lock:
          mutex: m.mu
          read: true
      - bind: held, found
        eval: m.keys[subject]
      - return: bytes.Clone(held), found, nil
        to: bytes
  - of: (*memorySubjectKeys).Insert
    participants:
      - id: caller
        kind: actor
      - id: (*memorySubjectKeys).Insert
        kind: self
      - id: coresecret
        kind: package
      - id: bytes
        kind: stdlib
    steps:
      - opt:
          do:
            - return: false, subjectErr
          init:
            bind: subjectErr
            eval: coresecret.ValidateSubject(subject)
            to: coresecret
          when: subjectErr != nil
      - lock:
          mutex: m.mu
      - opt:
          do:
            - return: false, nil
          init:
            bind: _, taken
            eval: m.keys[subject]
          when: taken
      - set: m.keys[subject]
        to: bytes
        value: bytes.Clone(wrapped)
      - return: true, nil
  - of: (*memorySubjectKeys).Replace
    participants:
      - id: caller
        kind: actor
      - id: (*memorySubjectKeys).Replace
        kind: self
      - id: coresecret
        kind: package
      - id: bytes
        kind: stdlib
    steps:
      - opt:
          do:
            - return: false, subjectErr
          init:
            bind: subjectErr
            eval: coresecret.ValidateSubject(subject)
            to: coresecret
          when: subjectErr != nil
      - lock:
          mutex: m.mu
      - bind: held, found
        eval: m.keys[subject]
      - opt:
          do:
            - return: false, nil
          when: "!found || !bytes.Equal(held, current)"
      - set: m.keys[subject]
        to: bytes
        value: bytes.Clone(next)
      - return: true, nil
  - of: (*memorySubjectKeys).Delete
    participants:
      - id: caller
        kind: actor
      - id: (*memorySubjectKeys).Delete
        kind: self
      - id: coresecret
        kind: package
    steps:
      - opt:
          do:
            - return: false, subjectErr
          init:
            bind: subjectErr
            eval: coresecret.ValidateSubject(subject)
            to: coresecret
          when: subjectErr != nil
      - lock:
          mutex: m.mu
      - bind: held, found
        eval: m.keys[subject]
      - opt:
          do:
            - return: false, nil
          when: "!found"
      - eval: clear(held)
      - eval: delete(m.keys, subject)
      - return: true, nil
  - of: (*memorySubjectKeys).All
    steps:
      - return:
          closure:
            params: yield func(coresecret.SubjectKeyValue, error) bool
            steps:
              - loop:
                  do:
                    - opt:
                        do:
                          - return: ""
                        when: "!yield(entry, nil)"
                  key: _
                  range: m.snapshot()
                  value: entry
  - of: (*memorySubjectKeys).snapshot
    participants:
      - id: caller
        kind: actor
      - id: (*memorySubjectKeys).snapshot
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - lock:
          mutex: m.mu
          read: true
      - bind: subjects
        eval: slices.Sorted(maps.Keys(m.keys))
        to: slices
      - bind: entries
        eval: make([]coresecret.SubjectKeyValue, 0, len(subjects))
      - loop:
          do:
            - set: entries
              value: "append(entries, coresecret.SubjectKeyValue{Subject: subject, Wrapped: bytes.Clone(m.keys[subject])})"
          key: _
          range: subjects
          value: subject
      - return: entries
  - of: (*SubjectKeys).Rewrap
    participants:
      - id: caller
        kind: actor
      - id: (*SubjectKeys).Rewrap
        kind: self
      - id: s.root.view
        kind: internal
      - id: view.close
        kind: internal
      - id: s.formerView
        kind: internal
      - id: former.close
        kind: internal
      - id: ctx.Err
        kind: value
      - id: s.rewrapOne
        kind: internal
      - id: report.count
        kind: internal
    steps:
      - bind: view, viewErr
        eval: s.root.view(ctx, wrapLabel)
        to: s.root.view
      - opt:
          do:
            - return: RewrapValue{}, viewErr
          when: viewErr != nil
      - defer: view.close()
        to: view.close
      - set: report.Root
        value: view.newest
      - bind: former, formerErr
        eval: s.formerView(ctx)
        to: s.formerView
      - opt:
          do:
            - return: report, formerErr
          when: formerErr != nil
      - opt:
          do:
            - defer: former.close()
              to: former.close
          when: former != nil
      - loop:
          do:
            - opt:
                do:
                  - return: report, storeFailure(allErr, "all", "")
                when: allErr != nil
            - opt:
                do:
                  - return: report, ctxErr
                init:
                  bind: ctxErr
                  eval: ctx.Err()
                  to: ctx.Err
                when: ctxErr != nil
            - bind: outcome, stepErr
              eval: "s.rewrapOne(ctx, rewrapViews{root: view, former: former}, entry)"
              to: s.rewrapOne
            - opt:
                do:
                  - return: report, stepErr
                when: stepErr != nil
            - eval: report.count(outcome)
              to: report.count
          key: entry
          range: s.store.All(ctx)
          value: allErr
      - opt:
          do:
            - return: |-
                report, errs.Wrap(coresecret.SubjectKeyUnreadable, errs.WrapParams{},
                			errs.Int("unreadable", report.Unreadable), errs.Int("root", report.Root))
          when: report.Unreadable > 0
      - return: report, nil
  - of: (*SubjectKeys).formerView
    participants:
      - id: caller
        kind: actor
      - id: (*SubjectKeys).formerView
        kind: self
      - id: s.former.view
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, nil
          when: s.former == nil
      - set: view, err
        to: s.former.view
        value: s.former.view(ctx, wrapLabel)
      - opt:
          do:
            - return: nil, nil
          when: errs.HasCode(err, coresecret.CodeNotFound)
      - return: view, err
  - of: (*SubjectKeys).rewrapOne
    participants:
      - id: caller
        kind: actor
      - id: (*SubjectKeys).rewrapOne
        kind: self
      - id: parseHeader
        kind: internal
      - id: unwrapIn
        kind: internal
      - id: view.seal
        kind: internal
      - id: s.store.Replace
        kind: value
    steps:
      - bind: view
        eval: views.root
      - bind: version, _, parsed
        eval: parseHeader(entry.Wrapped)
        to: parseHeader
      - bind: newer
        eval: parsed && version > view.newest && coresecret.ValidateSubject(entry.Subject) == nil
      - opt:
          do:
            - return: outcomeCurrent, nil
          when: newer && views.former == nil
      - bind: dek, opened
        eval: unwrapIn(view, entry)
        to: unwrapIn
      - bind: moved
        eval: "false"
      - opt:
          do:
            - set: dek, opened
              to: unwrapIn
              value: unwrapIn(views.former, entry)
            - set: moved
              value: opened
          when: "!opened && views.former != nil"
      - opt:
          do:
            - return: outcomeCurrent, nil
          when: "!opened && newer"
      - opt:
          do:
            - return: outcomeUnreadable, nil
          when: "!opened"
      - defer: clear(dek)
      - opt:
          do:
            - return: outcomeCurrent, nil
          when: version == view.newest && !moved
      - bind: next, sealErr
        eval: view.seal(dek, wrapAAD(entry.Subject))
        to: view.seal
      - opt:
          do:
            - return: outcomeUnreadable, sealErr
          when: sealErr != nil
      - bind: replaced, replaceErr
        eval: s.store.Replace(ctx, entry.Subject, entry.Wrapped, next)
        to: s.store.Replace
      - opt:
          do:
            - return: outcomeUnreadable, storeFailure(replaceErr, "replace", entry.Subject)
          when: replaceErr != nil
      - opt:
          do:
            - return: outcomeSkipped, nil
          when: "!replaced"
      - opt:
          do:
            - return: outcomeMoved, nil
          when: moved
      - return: outcomeRewrapped, nil
  - of: (*RewrapValue).count
    steps:
      - switch:
          cases:
            - case: outcomeCurrent
              do:
                - op: ++
                  set: r.Current
            - case: outcomeRewrapped
              do:
                - op: ++
                  set: r.Rewrapped
            - case: outcomeSkipped
              do:
                - op: ++
                  set: r.Skipped
            - case: outcomeUnreadable
              do:
                - op: ++
                  set: r.Unreadable
            - case: outcomeMoved
              do:
                - op: ++
                  set: r.Rewrapped
                - op: ++
                  set: r.FromFormer
          "on": outcome
  - of: (*SubjectKeys).OldestRoot
    participants:
      - id: caller
        kind: actor
      - id: (*SubjectKeys).OldestRoot
        kind: self
      - id: ctx.Err
        kind: value
      - id: s.root.view
        kind: internal
      - id: view.close
        kind: internal
      - id: openedUnder
        kind: internal
    steps:
      - opt:
          do:
            - return: 0, ctxErr
          init:
            bind: ctxErr
            eval: ctx.Err()
            to: ctx.Err
          when: ctxErr != nil
      - bind: view, viewErr
        eval: s.root.view(ctx, wrapLabel)
        to: s.root.view
      - opt:
          do:
            - return: 0, viewErr
          when: viewErr != nil
      - defer: view.close()
        to: view.close
      - bind: oldest
        eval: "0"
      - loop:
          do:
            - opt:
                do:
                  - return: 0, storeFailure(allErr, "all", "")
                when: allErr != nil
            - opt:
                do:
                  - return: 0, ctxErr
                init:
                  bind: ctxErr
                  eval: ctx.Err()
                  to: ctx.Err
                when: ctxErr != nil
            - bind: wrappedUnder, opens
              eval: openedUnder(view, entry)
              to: openedUnder
            - opt:
                do:
                  - continue: true
                when: "!opens"
            - opt:
                do:
                  - set: oldest
                    value: wrappedUnder
                when: oldest == 0 || wrappedUnder < oldest
          key: entry
          range: s.store.All(ctx)
          value: allErr
      - return: oldest, nil
  - of: openedUnder
    participants:
      - id: caller
        kind: actor
      - id: openedUnder
        kind: self
      - id: parseHeader
        kind: internal
      - id: unwrapIn
        kind: internal
    steps:
      - set: version, _, _
        to: parseHeader
        value: parseHeader(entry.Wrapped)
      - bind: dek, opened
        eval: unwrapIn(view, entry)
        to: unwrapIn
      - eval: clear(dek)
      - return: version, opened
  - of: unwrapIn
    participants:
      - id: caller
        kind: actor
      - id: unwrapIn
        kind: self
      - id: view.open
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, false
          when: coresecret.ValidateSubject(entry.Subject) != nil
      - bind: dek, openErr
        eval: view.open(entry.Wrapped, wrapAAD(entry.Subject))
        to: view.open
      - opt:
          do:
            - return: nil, false
          when: openErr != nil
      - opt:
          do:
            - eval: clear(dek)
            - return: nil, false
          when: len(dek) != corecrypto.KeyLen
      - return: dek, true
  - of: checkPut
    participants:
      - id: caller
        kind: actor
      - id: checkPut
        kind: self
      - id: coresecret
        kind: package
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: nameErr
          init:
            bind: nameErr
            eval: coresecret.ValidateName(name)
            to: coresecret
          when: nameErr != nil
      - opt:
          do:
            - return: errs.Wrap(coresecret.EmptyValue, errs.WrapParams{}, errs.String("secret", name))
              to: errs
          when: empty
      - return: nil
  - of: checkPrune
    participants:
      - id: caller
        kind: actor
      - id: checkPrune
        kind: self
      - id: coresecret
        kind: package
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: nameErr
          init:
            bind: nameErr
            eval: coresecret.ValidateName(name)
            to: coresecret
          when: nameErr != nil
      - opt:
          do:
            - return: |-
                errs.Wrap(coresecret.InvalidKeep, errs.WrapParams{},
                			errs.String("secret", name), errs.Int("keep", keep))
              to: errs
          when: keep < 1
      - return: nil
  - of: notFound
    participants:
      - id: caller
        kind: actor
      - id: notFound
        kind: self
      - id: errs
        kind: package
    steps:
      - return: errs.Wrap(coresecret.NotFound, errs.WrapParams{}, errs.String("secret", name))
        to: errs
  - of: nextVersion
    steps:
      - opt:
          do:
            - return: "1"
          when: len(versions) == 0
      - return: versions[0].Version + 1
  - of: prunedBelow
    participants:
      - id: caller
        kind: actor
      - id: prunedBelow
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - bind: keep
        eval: "1"
      - loop:
          cond: keep < len(versions) && versions[keep].Version >= floor
          do:
            - op: ++
              set: keep
      - return: slices.Clone(versions[:keep]), keep < len(versions)
        to: slices
  - forward: coresecret.ValidateName
    of: checkPruneBelow
  - of: pruned
    participants:
      - id: caller
        kind: actor
      - id: pruned
        kind: self
      - id: slices
        kind: stdlib
    steps:
      - opt:
          do:
            - return: slices.Clone(versions)
              to: slices
          when: len(versions) <= keep
      - return: slices.Clone(versions[:keep])
        to: slices
  - of: storeFailure
    participants:
      - id: caller
        kind: actor
      - id: storeFailure
        kind: self
      - id: errs
        kind: package
    steps:
      - bind: fields
        eval: "[]errs.FieldValue{errs.String(\"operation\", operation)}"
      - opt:
          do:
            - set: fields
              value: append(fields, errs.String("subject", subject))
          when: subject != ""
      - return: |-
          errs.Wrap(cause, errs.WrapParams{
          		Code:     coresecret.CodeStoreUnavailable,
          		Reason:   "STORE_UNAVAILABLE",
          		Public:   coresecret.StoreUnavailable.Public(),
          		Private:  coresecret.StoreUnavailable.Private(),
          		ExitCode: exitTempFail,
          	}, fields...)
        to: errs
  - of: wrapAs
    participants:
      - id: caller
        kind: actor
      - id: wrapAs
        kind: self
      - id: errs
        kind: package
    steps:
      - opt:
          do:
            - return: errs.Wrap(sentinel, errs.WrapParams{}, fields...)
              to: errs
          when: cause == nil
      - return: errs.Wrap(sentinel, errs.WrapParams{}, append(fields, errs.String("cause", cause.Error()))...)
        to: errs
