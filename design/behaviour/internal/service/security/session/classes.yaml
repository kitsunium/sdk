# Derived from the code by kit design derive. DO NOT EDIT.
apiVersion: design/behaviour/v1
constants:
  - doc: |-
      kindIndirection names what was found at a component of Dir.

      It is deliberately not "symlink": a component is judged through
      fs.FileMode, which maps a Unix symbolic link, a Windows symbolic link and a
      Windows junction onto the same bit, so naming one of the three would be a
      guess. The target field says where it goes, which is what an operator needs.
    items:
      - name: kindIndirection
        type: string
        value: "\"indirection\""
    name: kindIndirection
  - doc: |-
      recordVersion is the first byte of every encoded record. A future framing
      change bumps it and decode refuses the old one as RecordCorrupt rather than
      guessing which layout it is looking at.
    items:
      - name: recordVersion
        type: byte
        value: "0x01"
    name: recordVersion
  - doc: versionLen is the width of that version byte.
    items:
      - name: versionLen
        type: int
        value: "1"
    name: versionLen
  - doc: lenPrefix is the width of the length prefix in front of every string.
    items:
      - name: lenPrefix
        type: int
        value: "4"
    name: lenPrefix
  - doc: |-
      timeLen is the width of one instant, stored as a big-endian int64 of Unix
      nanoseconds.
    items:
      - name: timeLen
        type: int
        value: "8"
    name: timeLen
  - doc: |-
      timeFields is how many instants a record carries: createdAt, lastSeen and
      absoluteExpiry. The idle deadline is deliberately NOT stored — it is derived
      from lastSeen and the store's current IdleTimeout, so changing the timeout in
      configuration reaches the sessions that already exist.
    items:
      - name: timeFields
        type: int
        value: "3"
    name: timeFields
  - doc: |-
      stringFields is how many length-prefixed strings the header carries: the
      digest and the subject.
    items:
      - name: stringFields
        type: int
        value: "2"
    name: stringFields
  - doc: pairStrings is how many length-prefixed strings one data entry costs.
    items:
      - name: pairStrings
        type: int
        value: "2"
    name: pairStrings
  - doc: |-
      maxDataEntries caps a session's key count. A session store is not a
      database: it is per-user state on the request path, and an unbounded payload
      there is a memory-exhaustion vector with a very cheap trigger. The cap is
      enforced on the way IN (Save refuses) and again on the way OUT, before the
      map is allocated — a bound is checked before the work it funds.
    items:
      - name: maxDataEntries
        type: int
        value: "256"
    name: maxDataEntries
  - doc: maxStringLen caps any single key or value at 4 KiB, on the same reasoning.
    items:
      - name: maxStringLen
        type: int
        value: "4096"
    name: maxStringLen
  - doc: |-
      DefaultPoll is the interval between store-wide lock attempts when
      [FileConfig.Poll] is unset.

      25 ms is internal/service/app/lock's own default, for the same syscall and the
      same contention, and the two are deliberately the same number: a caller
      reading both should not have to wonder which lock they are looking at. It is
      short enough that an uncontended handler never notices it and long enough
      that a contended one is not a spin.
    items:
      - name: DefaultPoll
        type: time.Duration
        value: 25 * time.Millisecond
    name: DefaultPoll
  - doc: kindSymlink names an indirection found at a name in the store directory.
    items:
      - name: kindSymlink
        type: string
        value: "\"symlink\""
    name: kindSymlink
  - doc: |-
      kindNotRegular names an entry that is neither a regular file nor a link — a
      directory, a FIFO, a socket. Opening one is either pointless or, for a FIFO,
      a wait that would hold the store-wide lock.
    items:
      - name: kindNotRegular
        type: string
        value: "\"not-regular\""
    name: kindNotRegular
  - doc: |-
      kindReplaced names a name that, once compared with the handle its open
      produced, did not lead to the file that handle holds.
    items:
      - name: kindReplaced
        type: string
        value: "\"replaced\""
    name: kindReplaced
  - doc: |-
      dirMode is the only mode a session directory may have: owner-only. Anything
      with a group or world bit is refused rather than repaired, because repairing
      it would hide the fact that the records were exposed until now.
    items:
      - name: dirMode
        type: fs.FileMode
        value: "0o700"
    name: dirMode
  - doc: |-
      fileMode is the only mode a session record may have. It is asserted after
      creation, not merely requested — see [fileStore.publish].
    items:
      - name: fileMode
        type: fs.FileMode
        value: "0o600"
    name: fileMode
  - doc: |-
      recordSuffix names a record file. The stem is ID.Digest(), never the
      identifier: a directory listing is not a secret, and on many systems neither
      is a filename in a backup, an audit log or a crash report.
    items:
      - name: recordSuffix
        type: string
        value: "\".session\""
    name: recordSuffix
  - doc: lockName is the store-wide lock file, created once and never removed.
    items:
      - name: lockName
        type: string
        value: "\".lock\""
    name: lockName
  - doc: |-
      tempPrefix starts the name of the temporary file a record is written to
      before it is renamed into place. It carries no record suffix, so a sweep
      never mistakes one for a session — and it lives in the SAME directory,
      because rename(2) is only atomic within one filesystem.
    items:
      - name: tempPrefix
        type: string
        value: "\".tmp-\""
    name: tempPrefix
  - doc: |-
      digestLen is the character length of a hex SHA-256 — the only shape a record
      filename may have.
    items:
      - name: digestLen
        type: int
        value: "64"
    name: digestLen
  - doc: |-
      sealAlgorithm is the AEAD every record is sealed under. It is named here
      rather than configured: the choice of cipher for the SDK's own at-rest
      framing is not the caller's decision, and a configurable one would be a
      downgrade knob.
    items:
      - name: sealAlgorithm
        type: corecrypto.Algorithm
        value: "\"aes-256-gcm\""
    name: sealAlgorithm
  - doc: recordAAD prefixes the additional authenticated data of every record seal.
    items:
      - name: recordAAD
        type: string
        value: "\"kitsunium/sdk/session/record/v1|\""
    name: recordAAD
  - doc: |-
      kindHeldReplaced names the one PathRedirected shape that involves no link:
      Dir stopped naming the directory the store had just opened.
    items:
      - name: kindHeldReplaced
        type: string
        value: "\"replaced\""
    name: kindHeldReplaced
  - doc: |-
      platformNative reports that this GOOS has both mechanics natively. The file
      store's constructor reads it and refuses on the platforms where it is false,
      rather than building a store that would silently provide neither.

      It is narrower than internal/kernel/fs/flock.Native, which is also true on
      Windows: the lock exists there, the owner-only permissions do not.
      TestTheStoreIsBuiltOnlyWhereTheKernelCanLock pins that the store's set never
      grows past the lock's.
    items:
      - name: platformNative
        type: bool
        value: "true"
    name: platformNative
  - doc: |-
      worldWritable is the permission bit that lets any account create an entry in
      a directory.
    items:
      - name: worldWritable
        type: fs.FileMode
        value: "0o002"
    name: worldWritable
  - doc: |-
      initialRecords is the map's starting capacity. It is a hint, not a bound: a
      memory store holds as many sessions as its process has live users, which
      nothing here can know. Sixty-four is one page's worth of buckets — enough to
      carry a small service without a rehash, cheap enough to be wrong.
    items:
      - name: initialRecords
        type: int
        value: "64"
    name: initialRecords
  - doc: |-
      cookieAAD prefixes the additional authenticated data of every sealed
      identifier. The caller's purpose is appended to it, so a value minted for one
      purpose does not open under another even though both use the same key.
    items:
      - name: cookieAAD
        type: string
        value: "\"kitsunium/sdk/session/cookie/v1|\""
    name: cookieAAD
