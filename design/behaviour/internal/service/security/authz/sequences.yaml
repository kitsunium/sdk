          do:
            - return: coreauthz.AttrValue{}, attrFault(coreauthz.AttributeMissing, key, want, coreauthz.KindInvalid)
          when: "!ok"
      - opt:
          do:
            - return: coreauthz.AttrValue{}, attrFault(coreauthz.AttributeKindMismatch, key, want, found.Kind())
          when: found.Kind() != want
      - return: found, nil
  - of: NewRBAC
    participants:
      - id: caller
        kind: actor
      - id: NewRBAC
        kind: self
      - id: validateRBAC
        kind: internal
      - id: indexGrants
        kind: internal
    steps:
      - opt:
          do:
            - return: nil, err
          init:
            bind: err
            eval: validateRBAC(cfg)
            to: validateRBAC
          when: err != nil
      - bind: holders
        eval: indexGrants(cfg.Grants)
        to: indexGrants
      - bind: rolesAttr
        eval: cfg.RolesAttr
      - return: |-
          func(_ context.Context, request coreauthz.RequestValue) (decision coreauthz.Decision, err error) {
          		//: evaluation needs no context: the table is in memory and does no I/O.
          		return evaluateRBAC(holders, rolesAttr, request)
          	}, nil
  - of: evaluateRBAC
    participants:
      - id: caller
        kind: actor
      - id: evaluateRBAC
        kind: self
      - id: request.Attr
        kind: value
      - id: attr.Contains
        kind: value
    steps:
      - bind: attr, ok
        eval: request.Attr(rolesAttr)
        to: request.Attr
      - opt:
          do:
            - return: coreauthz.Deny, attrFault(coreauthz.AttributeMissing, rolesAttr, coreauthz.KindStrings, coreauthz.KindInvalid)
          when: "!ok"
      - opt:
          do:
            - return: coreauthz.Deny, attrFault(coreauthz.AttributeKindMismatch, rolesAttr, coreauthz.KindStrings, attr.Kind())
          when: attr.Kind() != coreauthz.KindStrings
      - bind: roles
        eval: "holders[PermissionValue{Action: request.Action(), Resource: request.Resource()}]"
      - loop:
          do:
            - opt:
                do:
                  - return: coreauthz.Allow, nil
                init:
                  bind: held, _
                  eval: attr.Contains(role)
                  to: attr.Contains
                when: held
          key: _
          range: roles
          value: role
      - return: coreauthz.Abstain, nil
  - of: attrFault
    participants:
      - id: caller
        kind: actor
      - id: attrFault
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(sentinel, errs.WrapParams{},
          		errs.String("attribute", key),
          		errs.String("want_kind", kindName(want)),
          		errs.String("got_kind", kindName(got)))
        to: errs
  - of: indexGrants
    steps:
      - bind: holders
        eval: make(map[PermissionValue][]string, len(grants))
      - loop:
          do:
            - loop:
                do:
                  - set: holders[permission]
                    value: append(holders[permission], grant.Role)
                key: _
                range: grant.Permissions
                value: permission
          key: _
          range: grants
          value: grant
      - return: holders
  - of: validateRBAC
    participants:
      - id: caller
        kind: actor
      - id: validateRBAC
        kind: self
      - id: grantFault
        kind: internal
      - id: validateGrant
        kind: internal
    steps:
      - opt:
          do:
            - return: grantFault("RolesAttr is empty", -1, "")
              to: grantFault
          when: cfg.RolesAttr == ""
      - opt:
          do:
            - return: grantFault("Grants is empty", -1, "")
              to: grantFault
          when: len(cfg.Grants) == 0
      - loop:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: validateGrant(index, grant)
                  to: validateGrant
                when: err != nil
          key: index
          range: cfg.Grants
          value: grant
      - return: nil
  - of: validateGrant
    participants:
      - id: caller
        kind: actor
      - id: validateGrant
        kind: self
      - id: grantFault
        kind: internal
    steps:
      - opt:
          do:
            - return: grantFault("Role is empty", index, "")
              to: grantFault
          when: grant.Role == ""
      - opt:
          do:
            - return: grantFault("Permissions is empty", index, grant.Role)
              to: grantFault
          when: len(grant.Permissions) == 0
      - loop:
          do:
            - opt:
                do:
                  - return: grantFault("permission has an empty Action or Resource", index, grant.Role)
                    to: grantFault
                when: permission.Action == "" || permission.Resource == ""
          key: _
          range: grant.Permissions
          value: permission
      - return: nil
  - of: validateRules
    participants:
      - id: caller
        kind: actor
      - id: validateRules
        kind: self
      - id: ruleFault
        kind: internal
      - id: validateRule
        kind: internal
    steps:
      - opt:
          do:
            - return: ruleFault("no rules", -1, "")
              to: ruleFault
          when: len(rules) == 0
      - loop:
          do:
            - opt:
                do:
                  - return: err
                init:
                  bind: err
                  eval: validateRule(index, rule)
                  to: validateRule
                when: err != nil
          key: index
          range: rules
          value: rule
      - return: nil
  - of: validateRule
    participants:
      - id: caller
        kind: actor
      - id: validateRule
        kind: self
      - id: ruleFault
        kind: internal
    steps:
      - opt:
          do:
            - return: ruleFault("Name is empty", index, "")
              to: ruleFault
          when: rule.Name == ""
      - opt:
          do:
            - return: ruleFault("Action or Resource is empty", index, rule.Name)
              to: ruleFault
          when: rule.Action == "" || rule.Resource == ""
      - opt:
          do:
            - return: ruleFault("When is nil", index, rule.Name)
              to: ruleFault
          when: rule.When == nil
      - opt:
          do:
            - return: ruleFault("Effect is not Allow or Deny, got "+rule.Effect.String(), index, rule.Name)
              to: ruleFault
          when: rule.Effect != coreauthz.Allow && rule.Effect != coreauthz.Deny
      - return: nil
  - of: grantFault
    participants:
      - id: caller
        kind: actor
      - id: grantFault
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(coreauthz.GrantInvalid, errs.WrapParams{},
          		errs.String("detail", detail),
          		errs.Int("grant_index", index),
          		errs.String("role", role))
        to: errs
  - of: ruleFault
    participants:
      - id: caller
        kind: actor
      - id: ruleFault
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(coreauthz.RuleInvalid, errs.WrapParams{},
          		errs.String("detail", detail),
          		errs.Int("rule_index", index),
          		errs.String("rule", name))
        to: errs
  - of: conditionFault
    participants:
      - id: caller
        kind: actor
      - id: conditionFault
        kind: self
      - id: errs
        kind: package
    steps:
      - return: |-
          errs.Wrap(coreauthz.ConditionInvalid, errs.WrapParams{},
          		errs.String("detail", detail),
          		errs.String("attribute", attribute))
        to: errs
  - of: kindName
    steps:
      - switch:
          cases:
            - case: coreauthz.KindString
              do:
                - return: "\"string\""
            - case: coreauthz.KindInt64
              do:
                - return: "\"int64\""
            - case: coreauthz.KindBool
              do:
                - return: "\"bool\""
            - case: coreauthz.KindStrings
              do:
                - return: "\"strings\""
            - case: coreauthz.KindInvalid
              do:
                - return: "\"absent\""
            - default: true
              do:
                - return: "\"unknown\""
          "on": kind
