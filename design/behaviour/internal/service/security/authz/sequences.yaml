  - of: Must
    steps:
      - opt:
          do:
            - panic: err
          when: err != nil
      - return: policy
  - of: MustCondition
    steps:
      - opt:
          do:
            - panic: err
          when: err != nil
      - return: condition
  - of: Not
    steps:
      - opt:
          do:
            - return: "nil, conditionFault(\"Not: condition is nil\", \"\")"
          when: inner == nil
