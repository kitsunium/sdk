          			//: false alongside the error, so a caller reading only the bool
          			//: still fails closed.
          			return false, innerErr
          		}
          		//: a real answer inverts.
          		return !innerHolds, nil
          	}, nil
  - of: AllOf
    participants:
      - id: caller
        kind: actor
      - id: AllOf
