apiVersion: kit.kitsunium/design/v2
domain: crypto
packages:
  - codes:
      - const:
          - doc: |-
              CodeDuplicateRegistration identifies an init-time collision on a scheme
              registry; two distinct schemes tried to claim the same Algorithm or wire id.
              Surfaced via panic at boot through the DuplicateRegistration sentinel.
            name: CodeDuplicateRegistration
            note: "range: 0.2.4.0 - 0.2.4.255"
            value: "0x00_02_04_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownAlgorithm identifies a Seal/SealAs call naming an Algorithm that no
              imported package has registered.
            name: CodeUnknownAlgorithm
            value: "0x00_02_04_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidKey identifies a NewKey call whose input was not exactly KeyLen
              bytes, or a cipher that rejected the key material.
            name: CodeInvalidKey
            value: "0x00_02_04_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeDecryptionFailed identifies any Open failure — bad authentication tag,
              malformed framing, unknown wire id, or wrong key. It is deliberately
              undifferentiated so Open cannot become a padding/format oracle.
            name: CodeDecryptionFailed
            value: "0x00_02_04_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeEntropyFailed identifies a crypto/rand failure while generating a nonce in
              Seal — a host entropy fault, not a caller error.
            name: CodeEntropyFailed
            value: "0x00_02_04_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownHashAlgorithm identifies a Sum/SumHex call naming a hash Algorithm
              that no imported package has registered.
            name: CodeUnknownHashAlgorithm
            value: "0x00_02_04_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownSignatureAlgorithm identifies a Sign/Verify/GenerateKey call naming
              an Algorithm that no imported signature package has registered.
            name: CodeUnknownSignatureAlgorithm
            value: "0x00_02_04_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeSigningFailed identifies a Sign call whose private key was not well-formed
              for the scheme (e.g. the wrong length) — a caller data error, not a fault.
            name: CodeSigningFailed
            value: "0x00_02_04_08"
        type: errs.Code
      - const:
          - doc: |-
              CodeKeyGenerationFailed identifies a crypto/rand failure while generating a
              signing keypair in GenerateKey — a host entropy fault, not a caller error.
            name: CodeKeyGenerationFailed
            value: "0x00_02_04_09"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownKDFAlgorithm identifies a Subkey call naming a key-derivation
              Algorithm that no imported package has registered.
            name: CodeUnknownKDFAlgorithm
            value: "0x00_02_04_0A"
        type: errs.Code
      - const:
          - doc: |-
              CodeDerivationFailed identifies a Subkey call whose requested length exceeds
              the scheme's maximum output — a caller data error, not a fault.
            name: CodeDerivationFailed
            value: "0x00_02_04_0B"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownPasswordAlgorithm identifies a HashPassword/VerifyPassword call
              whose Algorithm (or PHC id segment) no imported package has registered.
            name: CodeUnknownPasswordAlgorithm
            value: "0x00_02_04_0C"
        type: errs.Code
      - const:
          - doc: |-
              CodePasswordHashFailed identifies a crypto/rand failure while generating a
              password salt in HashPassword — a host entropy fault, not a caller error.
            name: CodePasswordHashFailed
            value: "0x00_02_04_0D"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidPasswordHash identifies a stored PHC string that cannot be parsed
              during VerifyPassword — server-side data corruption, not a password mismatch.
            name: CodeInvalidPasswordHash
            value: "0x00_02_04_0E"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownMACAlgorithm identifies a MACTag/MACVerify call naming a MAC
              Algorithm that no imported package has registered.
            name: CodeUnknownMACAlgorithm
            value: "0x00_02_04_0F"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownAgreementAlgorithm identifies a GenerateAgreementKey/AgreementShared
              call naming a key-agreement Algorithm that no imported package has registered.
            name: CodeUnknownAgreementAlgorithm
            value: "0x00_02_04_10"
        type: errs.Code
      - const:
          - doc: |-
              CodeAgreementFailed identifies an AgreementShared call whose scheme rejected
              the inputs (e.g. a low-order peer point) — wrapped, never leaking key bytes.
            name: CodeAgreementFailed
            value: "0x00_02_04_11"
        type: errs.Code
      - const:
          - doc: |-
              CodeStreamTruncated identifies a streaming Open that hit EOF before the
              final-flag chunk — the stream was cut short, not legitimately ended.
            name: CodeStreamTruncated
            value: "0x00_02_04_12"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidKeyEnvelope identifies a structurally invalid key-envelope string
              passed to UnwrapKey — a corrupt $kenv$ frame, NOT a wrong-passphrase oracle.
            name: CodeInvalidKeyEnvelope
            value: "0x00_02_04_13"
        type: errs.Code
      - const:
          - doc: |-
              CodeDigestMismatch identifies a VerifyingReader whose computed digest did not
              match the expected hex at EOF. The digest is public, so the mismatch is
              non-oracle — it surfaces only on the terminal read, never mid-stream.
            name: CodeDigestMismatch
            value: "0x00_02_04_14"
        type: errs.Code
    constants:
      - doc: |-
          KeyLen is the required symmetric key length in bytes (256-bit). Both shipped
          AEADs — AES-256-GCM and XChaCha20-Poly1305 — take a 32-byte key, so a single
          fixed length keeps the surface tiny and the validation total.
        name: KeyLen
        type: int
        value: "32"
      - doc: |-
          Version is the box wire-format version, the first byte of every sealed box
          ([Version][id][nonce][ciphertext||tag]). It is frozen post-v1.0.0; a future
          framing change bumps it and Open rejects an unknown version as
          DecryptionFailed. Concrete AEADs embed it via this constant.
        name: Version
        type: byte
        value: "0x01"
    doc: |-
      Package crypto — the AEAD port implemented by each concrete algorithm.

      Package crypto — the Agreement port: DH-style key agreement.

      Package crypto — the process-wide Agreement registry + GenerateAgreementKey / AgreementShared dispatch.

      Package crypto declares the authenticated-encryption port: the AEAD
      contract, the redacting Key value type, and the process-wide registry that
      maps an Algorithm (and its 1-byte wire id) to a registered AEAD. It is the
      peer of internal/core/data/codec — the registry resolves an Algorithm to an AEAD
      exactly as codec resolves a Format to a Codec.

      No algorithm bodies and no vendor types live here; concrete AEADs live under
      internal/service/crypto/<algo>/ (stdlib AES-GCM today) and third-party/
      x-crypto/* (XChaCha20-Poly1305 tomorrow) and self-register via a package-level
      var initialiser when imported — no init().

      Package crypto — range 0.2.4.* (ADR 0013 core/crypto block).

      Package crypto — the key-derivation port implemented by each KDF scheme.

      Package crypto — the process-wide Deriver registry + Subkey dispatch.

      Package crypto — declares the sentinels returned by the AEAD facade. Each
      var's name equals its errs.Define Reason in SCREAMING_SNAKE form.
      DuplicateRegistration is never returned: every registrar panics at boot with
      conflictText of it (see registry_generic.go and registry.go).

      Package crypto — the process-wide Hasher registry + Sum / SumHex dispatch.

      Package crypto — the Hasher port: fingerprint / content-addressing hashing.

      Package crypto — the opaque, redacting symmetric Key value type.

      Package crypto — the MAC port: keyed, detached message authentication.

      Package crypto — the process-wide MAC registry + MACTag / MACVerify dispatch.

      Package crypto — the password-hashing port implemented by each scheme.

      Package crypto — the process-wide PasswordHasher registry + HashPassword / VerifyPassword / NeedsRehash dispatch.

      Package crypto — holds the process-wide AEAD registry. Service- and
      third-party-level scheme packages register themselves via package-level var
      initialisers when imported (no init()), mirroring core/data/codec.

      Package crypto — the registrar every scheme registry shares (AEAD, Hasher,
      Signer, MAC, Deriver, Agreement, PasswordHasher, StreamSealer). The table
      under each one is the kernel's (kernel/plugin.Registry, ADR 0159); what this
      file adds is the crypto domain's refusal — the code, the reason and the
      fields a conflict panics with — written once instead of once per capability.

      Package crypto — the Seal / Open dispatch over the AEAD registry.

      Package crypto — the digital-signature port implemented by each scheme.

      Package crypto — the process-wide Signer registry + GenerateKey / Sign / Verify dispatch.

      Package crypto — the StreamSealer port: chunked authenticated encryption.

      Package crypto — the process-wide StreamSealer registry + SealStream / OpenStream dispatch.
    functions:
      - doc: |-
          RegisterAgreement inserts a under a.Algorithm() and returns it so callers can
          bind the singleton to a typed package-level variable. Panics on a nil scheme
          or when a distinct scheme already claims the same Algorithm.

          IFACE-PLUGIN: the registry hands plug-in Agreement instances back to callers
          so each scheme keeps its concrete type unexported; the contract is the
          Agreement interface itself.

          "Nil" here means UNUSABLE, not only an untyped nil: a typed nil pointer and a
          plug-in whose type is not comparable both satisfy the port and neither can
          serve one call (see internal/kernel/plugin).
        in:
          - name: a
            type: Agreement
        name: RegisterAgreement
        out:
          - type: Agreement
      - doc: |-
          LookupAgreement returns the Agreement scheme registered under name.

          IFACE-PLUGIN: the registry stores plug-in Agreement instances behind the
          Agreement interface — concrete types are intentionally unexported per scheme.
        in:
          - name: name
            type: Algorithm
        name: LookupAgreement
        out:
          - name: a
            type: Agreement
          - name: ok
            type: bool
      - doc: AvailableAgreements returns the sorted list of registered agreement Algorithms.
        name: AvailableAgreements
        out:
          - type: "[]Algorithm"
      - doc: |-
          GenerateAgreementKey draws a fresh keypair from the Agreement scheme
          registered as name. A name with no registered scheme returns
          UnknownAgreementAlgorithm; an entropy fault from the scheme propagates
          unchanged so callers see the original cause.
        in:
          - name: name
            type: Algorithm
        name: GenerateAgreementKey
        out:
          - name: pub
          - name: priv
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          AgreementShared derives the raw shared secret with the Agreement scheme
          registered as name. The result MUST be passed through a KDF before use as a
          key. A name with no registered scheme returns UnknownAgreementAlgorithm; a
          scheme Shared fault is wrapped into AgreementFailed, leaking no key bytes.
        in:
          - name: name
            type: Algorithm
          - name: priv
          - name: peerPub
            type: "[]byte"
        name: AgreementShared
        out:
          - name: secret
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          RegisterDeriver inserts d under d.Algorithm() and returns it so callers can
          bind the singleton to a typed package-level variable like
          `var Deriver = crypto.RegisterDeriver(hkdfSHA256{})`. Panics on a nil deriver
          or when a distinct deriver already claims the same Algorithm.

          IFACE-PLUGIN: the registry hands plug-in Deriver instances back to callers so
          each scheme keeps its concrete type unexported; the stable contract is the
          Deriver interface itself.

          "Nil" here means UNUSABLE, not only an untyped nil: a typed nil pointer and a
          plug-in whose type is not comparable both satisfy the port and neither can
          serve one call (see internal/kernel/plugin).
        in:
          - name: d
            type: Deriver
        name: RegisterDeriver
        out:
          - type: Deriver
      - doc: |-
          LookupDeriver returns the Deriver registered under name.

          IFACE-PLUGIN: the registry stores plug-in Deriver instances behind the Deriver
          interface — concrete types are intentionally unexported per scheme.
        in:
          - name: name
            type: Algorithm
        name: LookupDeriver
        out:
          - name: d
            type: Deriver
          - name: ok
            type: bool
      - doc: AvailableDerivers returns the sorted list of registered KDF Algorithms.
        name: AvailableDerivers
        out:
          - type: "[]Algorithm"
      - doc: |-
          Subkey derives a length-byte subkey from secret (with optional salt and the
          context label info) using the Deriver registered as name. A name with no
          registered deriver returns UnknownKDFAlgorithm (blank-import the scheme's
          package to register it); an over-long length returns DerivationFailed.
        in:
          - name: name
            type: Algorithm
          - name: secret
          - name: salt
            type: "[]byte"
          - name: info
            type: string
          - name: length
            type: int
        name: Subkey
        out:
          - name: subkey
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          RegisterHasher inserts h under h.Algorithm() and returns it so callers can
          bind the singleton to a typed package-level variable like
          `var Hasher = crypto.RegisterHasher(sha256Hasher{})`. Panics on a nil hasher
          or when a distinct hasher already claims the same Algorithm.

          IFACE-PLUGIN: the registry hands plug-in Hasher instances back to callers so
          each scheme keeps its concrete type unexported; the stable contract is the
          Hasher interface itself.

          "Nil" here means UNUSABLE, not only an untyped nil: a typed nil pointer and a
          plug-in whose type is not comparable both satisfy the port and neither can
          serve one call (see internal/kernel/plugin).
        in:
          - name: h
            type: Hasher
        name: RegisterHasher
        out:
          - type: Hasher
      - doc: |-
          LookupHasher returns the Hasher registered under name.

          IFACE-PLUGIN: the registry stores plug-in Hasher instances behind the Hasher
          interface — concrete types are intentionally unexported per scheme.
        in:
          - name: name
            type: Algorithm
        name: LookupHasher
        out:
          - name: h
            type: Hasher
          - name: ok
            type: bool
      - doc: AvailableHashers returns the sorted list of registered hash Algorithms.
        name: AvailableHashers
        out:
          - type: "[]Algorithm"
      - doc: |-
          Sum returns the digest of data under the Hasher registered as name. A name
          with no registered hasher returns UnknownHashAlgorithm (blank-import the
          scheme's package to register it).
        in:
          - name: name
            type: Algorithm
          - name: data
            type: "[]byte"
        name: Sum
        out:
          - name: digest
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          NewHash returns a fresh streaming hash.Hash for the Hasher registered as
          name (for io.Copy over large inputs). A name with no registered hasher
          returns UnknownHashAlgorithm.
        in:
          - name: name
            type: Algorithm
        name: NewHash
        out:
          - name: h
            type: hash.Hash
          - name: err
            type: error
      - doc: |-
          SumHex is Sum rendered as canonical lowercase hex — the frozen string form
          for content IDs and cache keys.
        in:
          - name: name
            type: Algorithm
          - name: data
            type: "[]byte"
        name: SumHex
        out:
          - name: digest
            type: string
          - name: err
            type: error
      - doc: |-
          NewKey builds a Key from raw, which MUST be exactly KeyLen (32) bytes. A wrong
          length returns InvalidKey rather than silently truncating or padding; the
          bytes are copied so a later mutation of raw cannot affect the Key.
        in:
          - name: raw
            type: "[]byte"
        name: NewKey
        out:
          - name: key
            type: Key
          - name: err
            type: error
      - doc: |-
          RegisterMAC inserts m under m.Algorithm() and returns it so callers can bind
          the singleton to a typed package-level variable. Panics on a nil MAC or when
          a distinct MAC already claims the same Algorithm.

          IFACE-PLUGIN: the registry hands plug-in MAC instances back to callers so each
          scheme keeps its concrete type unexported; the contract is the MAC interface.

          "Nil" here means UNUSABLE, not only an untyped nil: a typed nil pointer and a
          plug-in whose type is not comparable both satisfy the port and neither can
          serve one call (see internal/kernel/plugin).
        in:
          - name: m
            type: MAC
        name: RegisterMAC
        out:
          - type: MAC
      - doc: |-
          LookupMAC returns the MAC registered under name.

          IFACE-PLUGIN: the registry stores plug-in MAC instances behind the MAC
          interface — concrete types are intentionally unexported per scheme.
        in:
          - name: name
            type: Algorithm
        name: LookupMAC
        out:
          - name: m
            type: MAC
          - name: ok
            type: bool
      - doc: AvailableMACs returns the sorted list of registered MAC Algorithms.
        name: AvailableMACs
        out:
          - type: "[]Algorithm"
      - doc: |-
          MACTag returns the authentication tag over message under key for the MAC
          registered as name. It is named MACTag (not Tag) so the dispatch verb never
          collides with the signer/verifier surface. A name with no registered MAC
          returns UnknownMACAlgorithm (blank-import the scheme's package to register it).
        in:
          - name: name
            type: Algorithm
          - name: key
            type: Key
          - name: message
            type: "[]byte"
        name: MACTag
        out:
          - name: tag
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          MACVerify reports whether tag authenticates message under key for the MAC
          registered as name, using the scheme's constant-time comparison. A name with
          no registered MAC returns (false, UnknownMACAlgorithm) so a miss is never
          mistaken for a bad-tag false.
        in:
          - name: name
            type: Algorithm
          - name: key
            type: Key
          - name: message
          - name: tag
            type: "[]byte"
        name: MACVerify
        out:
          - name: ok
            type: bool
          - name: err
            type: error
      - doc: |-
          RegisterPasswordHasher inserts p under p.Algorithm() and returns it so callers
          can bind the singleton to a typed package-level variable. Panics on a nil
          hasher or when a distinct hasher already claims the same Algorithm.

          IFACE-PLUGIN: the registry hands plug-in PasswordHasher instances back to
          callers so each scheme keeps its concrete type unexported; the contract is the
          PasswordHasher interface itself.

          "Nil" here means UNUSABLE, not only an untyped nil: a typed nil pointer and a
          plug-in whose type is not comparable both satisfy the port and neither can
          serve one call (see internal/kernel/plugin).
        in:
          - name: p
            type: PasswordHasher
        name: RegisterPasswordHasher
        out:
          - type: PasswordHasher
      - doc: |-
          LookupPasswordHasher returns the PasswordHasher registered under name.

          IFACE-PLUGIN: the registry stores plug-in PasswordHasher instances behind the
          PasswordHasher interface — concrete types are intentionally unexported per scheme.
        in:
          - name: name
            type: Algorithm
        name: LookupPasswordHasher
        out:
          - name: p
            type: PasswordHasher
          - name: ok
            type: bool
      - doc: |-
          AvailablePasswordHashers returns the sorted list of registered password
          Algorithms.
        name: AvailablePasswordHashers
        out:
          - type: "[]Algorithm"
      - doc: |-
          HashPassword returns a PHC-string hash of password using the PasswordHasher
          registered as name. A name with no registered hasher returns
          UnknownPasswordAlgorithm (blank-import the scheme's package to register it).
        in:
          - name: name
            type: Algorithm
          - name: password
            type: "[]byte"
        name: HashPassword
        out:
          - name: phc
            type: string
          - name: err
            type: error
      - doc: |-
          VerifyPassword reports whether password matches the stored PHC hash. The
          scheme is read from phc's id segment — no algorithm argument is needed. A
          malformed phc or unregistered scheme returns an error; a genuine mismatch is
          (false, nil).
        in:
          - name: password
            type: "[]byte"
          - name: phc
            type: string
        name: VerifyPassword
        out:
          - name: ok
            type: bool
          - name: err
            type: error
      - doc: |-
          NeedsRehash reports whether the stored PHC hash was produced with cost
          parameters weaker than its scheme's current policy, so a caller can re-hash on
          a successful login. A malformed or unknown-scheme phc reports false.
        in:
          - name: phc
            type: string
        name: NeedsRehash
        out:
          - type: bool
      - doc: |-
          Register inserts a into the registry under a.Algorithm() + a.ID() and returns
          it so callers can bind the singleton to a typed package-level variable like
          `var AEAD = crypto.Register(aesGCM{})`. Panics on a nil scheme or when a
          distinct scheme already claims the same Algorithm or wire id.

          IFACE-PLUGIN: the registry hands plug-in AEAD instances back to callers so
          each scheme keeps its concrete type unexported; the stable contract is the
          AEAD interface itself.

          "Nil" here means UNUSABLE, not only an untyped nil: a typed nil pointer and a
          plug-in whose type is not comparable both satisfy the port and neither can
          serve one call (see internal/kernel/plugin).
        in:
          - name: a
            type: AEAD
        name: Register
        out:
          - type: AEAD
      - doc: |-
          Lookup returns the AEAD registered under name.

          IFACE-PLUGIN: the registry stores plug-in scheme instances behind the AEAD
          interface — concrete types are intentionally unexported per scheme.
        in:
          - name: name
            type: Algorithm
        name: Lookup
        out:
          - name: a
            type: AEAD
          - name: ok
            type: bool
      - doc: |-
          Available returns the sorted list of registered Algorithms, or nil before
          any Register.
        name: Available
        out:
          - type: "[]Algorithm"
      - doc: |-
          Seal encrypts plaintext under the AEAD registered as name, binding aad, and
          returns the self-framed box. A name with no registered scheme returns
          UnknownAlgorithm (blank-import the scheme's package to register it).
        in:
          - name: name
            type: Algorithm
          - name: key
            type: Key
          - name: plaintext
          - name: aad
            type: "[]byte"
        name: Seal
        out:
          - name: box
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          Open decrypts a box produced by Seal, verifying aad, and returns the
          plaintext. The scheme is resolved from the box's 1-byte id header — the
          caller never names it. Any failure (short box, unknown id, bad tag, wrong
          key) returns the single non-oracle DecryptionFailed.
        in:
          - name: key
            type: Key
          - name: box
          - name: aad
            type: "[]byte"
        name: Open
        out:
          - name: plaintext
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          RegisterSigner inserts s under s.Algorithm() and returns it so callers can
          bind the singleton to a typed package-level variable. Panics on a nil signer
          or when a distinct signer already claims the same Algorithm.

          IFACE-PLUGIN: the registry hands plug-in Signer instances back to callers so
          each scheme keeps its concrete type unexported; the contract is the Signer
          interface itself.

          "Nil" here means UNUSABLE, not only an untyped nil: a typed nil pointer and a
          plug-in whose type is not comparable both satisfy the port and neither can
          serve one call (see internal/kernel/plugin).
        in:
          - name: s
            type: Signer
        name: RegisterSigner
        out:
          - type: Signer
      - doc: |-
          LookupSigner returns the Signer registered under name.

          IFACE-PLUGIN: the registry stores plug-in Signer instances behind the Signer
          interface — concrete types are intentionally unexported per scheme.
        in:
          - name: name
            type: Algorithm
        name: LookupSigner
        out:
          - name: s
            type: Signer
          - name: ok
            type: bool
      - doc: AvailableSigners returns the sorted list of registered signature Algorithms.
        name: AvailableSigners
        out:
          - type: "[]Algorithm"
      - doc: |-
          GenerateKey draws a fresh keypair for the Signer registered as name. A name
          with no registered signer returns UnknownSignatureAlgorithm (blank-import the
          scheme's package to register it).
        in:
          - name: name
            type: Algorithm
        name: GenerateKey
        out:
          - name: pub
          - name: priv
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          Sign produces a detached signature over message using priv under the Signer
          registered as name. A name with no registered signer returns
          UnknownSignatureAlgorithm; a malformed priv returns SigningFailed.
        in:
          - name: name
            type: Algorithm
          - name: priv
          - name: message
            type: "[]byte"
        name: Sign
        out:
          - name: sig
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          Verify reports whether sig is a valid signature for message under pub for the
          Signer registered as name. An unregistered name returns
          (false, UnknownSignatureAlgorithm); an invalid signature is (false, nil) so
          Verify never becomes an oracle on WHY a check failed.
        in:
          - name: name
            type: Algorithm
          - name: pub
          - name: message
          - name: sig
            type: "[]byte"
        name: Verify
        out:
          - name: ok
            type: bool
          - name: err
            type: error
      - doc: |-
          RegisterStreamSealer inserts s under s.Algorithm() and returns it so callers
          can bind the singleton to a typed package-level variable. Panics on a nil
          sealer or when a distinct sealer already claims the same Algorithm.

          IFACE-PLUGIN: the registry hands plug-in StreamSealer instances back to
          callers so each scheme keeps its concrete type unexported; the contract is the
          StreamSealer interface itself.

          "Nil" here means UNUSABLE, not only an untyped nil: a typed nil pointer and a
          plug-in whose type is not comparable both satisfy the port and neither can
          serve one call (see internal/kernel/plugin).
        in:
          - name: s
            type: StreamSealer
        name: RegisterStreamSealer
        out:
          - type: StreamSealer
      - doc: |-
          LookupStreamSealer returns the StreamSealer registered under name.

          IFACE-PLUGIN: the registry stores plug-in StreamSealer instances behind the
          StreamSealer interface — concrete types are intentionally unexported per scheme.
        in:
          - name: name
            type: Algorithm
        name: LookupStreamSealer
        out:
          - name: s
            type: StreamSealer
          - name: ok
            type: bool
      - doc: |-
          AvailableStreamSealers returns the sorted list of registered streaming-AEAD
          Algorithms.
        name: AvailableStreamSealers
        out:
          - type: "[]Algorithm"
      - doc: |-
          SealStream wraps dst so writes are sealed under key with aad by the
          StreamSealer registered as name. Streaming extends the AEAD domain, so a name
          with no registered sealer returns the shared UnknownAlgorithm sentinel; a
          scheme construction fault propagates unchanged.
        in:
          - name: name
            type: Algorithm
          - name: key
            type: Key
          - name: dst
            type: io.Writer
          - name: aad
            type: "[]byte"
        name: SealStream
        out:
          - name: sealed
            type: io.WriteCloser
          - name: err
            type: error
      - doc: |-
          OpenStream wraps src so reads are opened under key with aad by the
          StreamSealer registered as name. A name with no registered sealer returns the
          shared UnknownAlgorithm sentinel; a truncated stream surfaces later as
          StreamTruncated from the returned reader.
        in:
          - name: name
            type: Algorithm
          - name: key
            type: Key
          - name: src
            type: io.Reader
          - name: aad
            type: "[]byte"
        name: OpenStream
        out:
          - name: opened
            type: io.Reader
          - name: err
            type: error
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/crypto
    ports:
      - doc: |-
          AEAD is an authenticated-encryption-with-associated-data scheme. Each
          implementation owns its complete self-describing wire framing
          ([Version][id][nonce][ciphertext||tag]) so the registry can dispatch Open by
          reading the 1-byte id, and so the nonce — generated from crypto/rand inside
          Seal — never reaches a caller. Implementations MUST be safe for concurrent
          use and MUST return the shared non-oracle DecryptionFailed for every Open
          failure (bad tag, bad header, wrong key) so they cannot become an oracle.

          IFACE-PLUGIN: the registry hands plug-in AEAD instances back to callers behind
          this interface; concrete scheme types stay unexported in their own packages.
        methods:
          - doc: Algorithm reports the canonical key under which this scheme registers.
            name: Algorithm
            out:
              - type: Algorithm
          - doc: |-
              ID reports the 1-byte wire identifier embedded in the box header so Open
              can resolve the scheme without the caller naming it.
            name: ID
            out:
              - type: byte
          - doc: |-
              Seal encrypts plaintext, binding aad, and returns the self-framed box
              (Version + id + random nonce + ciphertext||tag).
            in:
              - name: key
                type: Key
              - name: plaintext
              - name: aad
                type: "[]byte"
            name: Seal
            out:
              - name: box
                type: "[]byte"
              - name: err
                type: error
          - doc: |-
              Open reverses Seal: it validates the framing, decrypts, and verifies aad,
              returning the plaintext or the non-oracle DecryptionFailed.
            in:
              - name: key
                type: Key
              - name: box
              - name: aad
                type: "[]byte"
            name: Open
            out:
              - name: plaintext
                type: "[]byte"
              - name: err
                type: error
        name: AEAD
      - doc: |-
          Agreement is a key-agreement scheme (Diffie-Hellman style): it produces an
          ephemeral keypair and derives a shared secret from a local private key and a
          peer public key. The raw Shared output is low-level key material and MUST be
          run through a KDF (a Deriver) before use as a key — the pkg/v1 facade never
          hands the raw secret back to generic callers. Implementations self-register
          via RegisterAgreement.

          IFACE-PLUGIN: the registry hands plug-in Agreement instances back behind this
          interface; concrete scheme types stay unexported in their own packages.
        methods:
          - doc: Algorithm reports the canonical key under which this scheme registers.
            name: Algorithm
            out:
              - type: Algorithm
          - doc: |-
              GenerateKey draws a fresh public/private keypair from the scheme's
              entropy source.
            name: GenerateKey
            out:
              - name: pub
              - name: priv
                type: "[]byte"
              - name: err
                type: error
          - doc: |-
              Shared derives the raw shared secret from priv and peerPub. The result
              MUST be passed through a KDF before any use as a key.
            in:
              - name: priv
              - name: peerPub
                type: "[]byte"
            name: Shared
            out:
              - name: secret
                type: "[]byte"
              - name: err
                type: error
        name: Agreement
      - doc: |-
          Deriver is a key-derivation function for KEY SEPARATION: it expands one
          high-entropy secret into independent, purpose-bound subkeys. It is NOT a
          password hash — the input must already be a strong key (an AEAD Key, an HKDF
          PRK, a Diffie-Hellman shared secret), never a human password. Password
          stretching (argon2id) is a separate, deliberately slow port.

          salt is optional domain randomness (nil is allowed); info is a context label
          that binds each subkey to its purpose ("aead-key", "mac-key", …) so two
          derivations from the same secret never collide. Implementations MUST be safe
          for concurrent use.

          IFACE-PLUGIN: the registry hands plug-in Deriver instances back to callers
          behind this interface; concrete scheme types stay unexported in their own
          packages.
        methods:
          - doc: Algorithm reports the canonical key under which this scheme registers.
            name: Algorithm
            out:
              - type: Algorithm
          - doc: |-
              Derive expands secret (with optional salt and the context label info) into
              a length-byte subkey, or DerivationFailed when length exceeds the scheme's
              maximum output.
            in:
              - name: secret
              - name: salt
                type: "[]byte"
              - name: info
                type: string
              - name: length
                type: int
            name: Derive
            out:
              - name: subkey
                type: "[]byte"
              - name: err
                type: error
        name: Deriver
      - doc: |-
          Hasher is a fingerprint / content-addressing hash scheme producing a
          non-keyed digest of arbitrary bytes (content IDs, cache keys, dedup keys).

          It is explicitly NOT authentication: no Hasher is a MAC, none takes a key,
          and a digest is public — never branch on a secret-dependent comparison of
          one. Keyed/authenticated integrity belongs to the AEAD and (future) signature
          ports. Implementations self-register via RegisterHasher.

          IFACE-PLUGIN: the registry hands plug-in Hasher instances back behind this
          interface; concrete scheme types stay unexported in their own packages.
        methods:
          - doc: Algorithm reports the canonical key under which this hasher registers.
            name: Algorithm
            out:
              - type: Algorithm
          - doc: New returns a fresh hash.Hash for streaming (io.Copy) or one-shot use.
            name: New
            out:
              - type: hash.Hash
        name: Hasher
      - doc: |-
          MAC is a detached message-authentication-code scheme: it binds a secret Key
          to a message and yields an authentication tag. Unlike a Hasher digest, a MAC
          tag IS secret-comparison-sensitive — callers MUST route equality through
          Verify (constant-time), never `==` or bytes.Equal, which is the exact inverse
          of the Hasher rule. Implementations self-register via RegisterMAC.

          IFACE-PLUGIN: the registry hands plug-in MAC instances back behind this
          interface; concrete scheme types stay unexported in their own packages.
        methods:
          - doc: Algorithm reports the canonical key under which this MAC registers.
            name: Algorithm
            out:
              - type: Algorithm
          - doc: Tag returns the authentication tag over message under key.
            in:
              - name: key
                type: Key
              - name: message
                type: "[]byte"
            name: Tag
            out:
              - type: "[]byte"
          - doc: |-
              Verify reports whether tag authenticates message under key, using a
              constant-time comparison so it never becomes a timing oracle.
            in:
              - name: key
                type: Key
              - name: message
              - name: tag
                type: "[]byte"
            name: Verify
            out:
              - type: bool
          - doc: |-
              New returns a fresh streaming hash.Hash keyed by key, paralleling
              Hasher.New, for incremental tagging over large inputs.
            in:
              - name: key
                type: Key
            name: New
            out:
              - type: hash.Hash
        name: MAC
      - doc: |-
          PasswordHasher stretches a human password into a slow, salted, self-describing
          PHC-string hash for storage. UNLIKE the Deriver (key separation) and Hasher
          (fingerprints) ports, this one is DELIBERATELY SLOW and salted: it is the only
          crypto surface meant to consume a low-entropy human secret.

          The returned hash is a PHC string (`$id$params$salt$digest`) that embeds the
          scheme id and its cost parameters, so Verify needs no side-channel: the stored
          string fully describes how to check it. Implementations MUST compare digests
          in constant time and MUST be safe for concurrent use.

          IFACE-PLUGIN: the registry hands plug-in PasswordHasher instances back to
          callers behind this interface; concrete scheme types stay unexported.
        methods:
          - doc: |-
              Algorithm reports the canonical key under which this scheme registers; it
              is also the PHC id segment (the first `$`-delimited field).
            name: Algorithm
            out:
              - type: Algorithm
          - doc: |-
              Hash returns a PHC-string hash of password with a fresh random salt and
              the scheme's current cost parameters, or PasswordHashFailed on an entropy
              fault.
            in:
              - name: password
                type: "[]byte"
            name: Hash
            out:
              - name: phc
                type: string
              - name: err
                type: error
          - doc: |-
              Verify reports whether password matches the stored PHC hash, comparing in
              constant time. A malformed phc returns InvalidPasswordHash; a genuine
              mismatch is (false, nil) so Verify is not an oracle on WHY it failed.
            in:
              - name: password
                type: "[]byte"
              - name: phc
                type: string
            name: Verify
            out:
              - name: ok
                type: bool
              - name: err
                type: error
          - doc: |-
              NeedsRehash reports whether phc was produced with cost parameters weaker
              than this scheme's current policy, so callers can transparently re-hash on
              a successful login. A malformed phc reports false (Verify surfaces the error).
            in:
              - name: phc
                type: string
            name: NeedsRehash
            out:
              - name: stale
                type: bool
        name: PasswordHasher
      - doc: |-
          Signer is a detached digital-signature scheme over a public/private keypair.
          Keys and signatures are scheme-specific byte slices (their lengths are fixed
          per scheme); the registry dispatches on the Algorithm name. Implementations
          MUST be safe for concurrent use, MUST NOT panic on a malformed key (return
          SigningFailed instead), and Verify MUST run in constant time with respect to
          the signature so it cannot become a timing oracle.

          Unlike the AEAD port, a signature scheme has no hidden nonce and no wire
          framing: the caller holds the keypair and chooses what bytes to sign. The
          private key is secret material — treat it like Key.Bytes(): never log it.

          IFACE-PLUGIN: the registry hands plug-in Signer instances back to callers
          behind this interface; concrete scheme types stay unexported in their own
          packages.
        methods:
          - doc: Algorithm reports the canonical key under which this scheme registers.
            name: Algorithm
            out:
              - type: Algorithm
          - doc: |-
              GenerateKey draws a fresh keypair from crypto/rand, returning the public
              and private key bytes (or KeyGenerationFailed on a host entropy fault).
            name: GenerateKey
            out:
              - name: pub
              - name: priv
                type: "[]byte"
              - name: err
                type: error
          - doc: |-
              Sign produces a detached signature over message using priv, or
              SigningFailed when priv is not a well-formed private key for this scheme.
            in:
              - name: priv
              - name: message
                type: "[]byte"
            name: Sign
            out:
              - name: sig
                type: "[]byte"
              - name: err
                type: error
          - doc: |-
              Verify reports whether sig is a valid signature for message under pub. A
              malformed key or signature is reported as false, never as a panic.
            in:
              - name: pub
              - name: message
              - name: sig
                type: "[]byte"
            name: Verify
            out:
              - name: ok
                type: bool
        name: Signer
      - doc: |-
          StreamSealer is a streaming authenticated-encryption scheme: it seals and
          opens an io.Writer / io.Reader pair in fixed-size chunks under a Key and
          associated data, extending the whole-buffer AEAD domain to arbitrarily large
          payloads. The Reader honours the hold-back contract: it MUST NOT surface a
          chunk's plaintext downstream before that chunk authenticates, and a stream cut
          short surfaces as StreamTruncated rather than as accepted plaintext (the
          final chunk carries a flag that a truncated stream never reaches).
          Implementations self-register via RegisterStreamSealer.

          IFACE-PLUGIN: the registry hands plug-in StreamSealer instances back behind
          this interface; concrete scheme types stay unexported in their own packages.
        methods:
          - doc: Algorithm reports the canonical key under which this scheme registers.
            name: Algorithm
            out:
              - type: Algorithm
          - doc: |-
              Writer wraps dst so writes are sealed under key with aad; Close writes
              the final authenticated chunk.
            in:
              - name: key
                type: Key
              - name: dst
                type: io.Writer
              - name: aad
                type: "[]byte"
            name: Writer
            out:
              - type: io.WriteCloser
              - type: error
          - doc: |-
              Reader wraps src so reads are opened under key with aad; a truncated
              stream surfaces as StreamTruncated from the returned reader.
            in:
              - name: key
                type: Key
              - name: src
                type: io.Reader
              - name: aad
                type: "[]byte"
            name: Reader
            out:
              - type: io.Reader
              - type: error
        name: StreamSealer
    sentinels:
      - var:
          - code: CodeUnknownAlgorithm
            doc: |-
              UnknownAlgorithm is returned by Seal/SealAs when no AEAD is registered
              under the requested Algorithm — typically a missing blank-import.
            name: UnknownAlgorithm
            private: "core/crypto.Seal: algorithm absent from registry; blank-import the scheme's package to register it"
            public: No AEAD is registered under that algorithm
            reason: UNKNOWN_ALGORITHM
          - code: CodeInvalidKey
            doc: |-
              InvalidKey is returned by NewKey when the supplied material is not
              exactly KeyLen bytes (or by an AEAD when the cipher rejects the key).
            name: InvalidKey
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/crypto.NewKey: key must be exactly KeyLen bytes"
            public: Encryption key has the wrong length
            reason: INVALID_KEY
          - code: CodeDecryptionFailed
            doc: |-
              DecryptionFailed is the single non-oracle error returned by Open for any
              failure — bad tag, malformed framing, unknown wire id, or wrong key.
            name: DecryptionFailed
            options:
              - errs.WithHTTPStatus(httpBadRequest)
              - errs.WithExitCode(exitDataErr)
            private: "core/crypto.Open: authentication, framing, or key check failed (cause withheld to avoid an oracle)"
            public: Decryption failed
            reason: DECRYPTION_FAILED
          - code: CodeEntropyFailed
            doc: |-
              EntropyFailed wraps a crypto/rand failure while generating a Seal nonce;
              it signals a host entropy fault rather than a caller error.
            name: EntropyFailed
            private: "core/crypto.Seal: crypto/rand.Read failed while generating a nonce"
            public: Could not gather entropy for encryption
            reason: ENTROPY_FAILED
          - code: CodeUnknownHashAlgorithm
            doc: |-
              UnknownHashAlgorithm is returned by Sum/SumHex when no Hasher is
              registered under the requested Algorithm — typically a missing blank-import.
            name: UnknownHashAlgorithm
            private: "core/crypto.Sum: hash algorithm absent from registry; blank-import the hasher's package to register it"
            public: No hasher is registered under that algorithm
            reason: UNKNOWN_HASH_ALGORITHM
          - code: CodeUnknownSignatureAlgorithm
            doc: |-
              UnknownSignatureAlgorithm is returned by Sign/Verify/GenerateKey when no
              Signer is registered under the requested Algorithm — usually a missing
              blank-import of the scheme's package.
            name: UnknownSignatureAlgorithm
            private: "core/crypto.Sign: signature algorithm absent from registry; blank-import the signer's package to register it"
            public: No signer is registered under that algorithm
            reason: UNKNOWN_SIGNATURE_ALGORITHM
          - code: CodeSigningFailed
            doc: |-
              SigningFailed is returned by Sign when the supplied private key is not
              well-formed for the scheme (e.g. the wrong length).
            name: SigningFailed
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/crypto.Sign: private key is not valid for the scheme (wrong length or encoding)"
            public: Signing key is malformed
            reason: SIGNING_FAILED
          - code: CodeKeyGenerationFailed
            doc: |-
              KeyGenerationFailed wraps a crypto/rand failure while generating a signing
              keypair; it signals a host entropy fault rather than a caller error.
            name: KeyGenerationFailed
            private: "core/crypto.GenerateKey: crypto/rand failed while generating a signing keypair"
            public: Could not gather entropy for key generation
            reason: KEY_GENERATION_FAILED
          - code: CodeUnknownKDFAlgorithm
            doc: |-
              UnknownKDFAlgorithm is returned by Subkey when no Deriver is registered
              under the requested Algorithm — usually a missing blank-import.
            name: UnknownKDFAlgorithm
            private: "core/crypto.Subkey: KDF algorithm absent from registry; blank-import the deriver's package to register it"
            public: No key-derivation function is registered under that algorithm
            reason: UNKNOWN_KDF_ALGORITHM
          - code: CodeDerivationFailed
            doc: |-
              DerivationFailed is returned by Subkey when the requested length exceeds
              the scheme's maximum output (e.g. HKDF's 255*HashLen ceiling).
            name: DerivationFailed
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/crypto.Subkey: requested length exceeds the scheme's maximum output"
            public: Requested derived-key length is too large
            reason: DERIVATION_FAILED
          - code: CodeUnknownPasswordAlgorithm
            doc: |-
              UnknownPasswordAlgorithm is returned by HashPassword/VerifyPassword when no
              PasswordHasher is registered under the requested Algorithm or PHC id —
              usually a missing blank-import.
            name: UnknownPasswordAlgorithm
            private: "core/crypto.VerifyPassword: password scheme absent from registry; blank-import the hasher's package to register it"
            public: No password hasher is registered under that algorithm
            reason: UNKNOWN_PASSWORD_ALGORITHM
          - code: CodePasswordHashFailed
            doc: |-
              PasswordHashFailed wraps a crypto/rand failure while generating a password
              salt; it signals a host entropy fault rather than a caller error.
            name: PasswordHashFailed
            private: "core/crypto.HashPassword: crypto/rand failed while generating a salt"
            public: Could not gather entropy for password hashing
            reason: PASSWORD_HASH_FAILED
          - code: CodeInvalidPasswordHash
            doc: |-
              InvalidPasswordHash is returned by VerifyPassword when the stored PHC
              string cannot be parsed — server-side data corruption, never a mismatch.
            name: InvalidPasswordHash
            private: "core/crypto.VerifyPassword: stored PHC string is not well-formed for its scheme"
            public: Stored password hash is malformed
            reason: INVALID_PASSWORD_HASH
          - code: CodeUnknownMACAlgorithm
            doc: |-
              UnknownMACAlgorithm is returned by MACTag/MACVerify when no MAC is
              registered under the requested Algorithm — typically a missing blank-import.
            name: UnknownMACAlgorithm
            private: "core/crypto.MACTag: MAC algorithm absent from registry; blank-import the scheme's package to register it"
            public: No MAC is registered under that algorithm
            reason: UNKNOWN_MAC_ALGORITHM
          - code: CodeUnknownAgreementAlgorithm
            doc: |-
              UnknownAgreementAlgorithm is returned by GenerateAgreementKey/AgreementShared
              when no Agreement scheme is registered under the requested Algorithm.
            name: UnknownAgreementAlgorithm
            private: "core/crypto.AgreementShared: agreement algorithm absent from registry; blank-import the scheme's package to register it"
            public: No key-agreement scheme is registered under that algorithm
            reason: UNKNOWN_AGREEMENT_ALGORITHM
          - code: CodeAgreementFailed
            doc: |-
              AgreementFailed wraps an AgreementShared fault where the scheme rejected the
              inputs (e.g. a low-order peer point); it never leaks key bytes.
            name: AgreementFailed
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/crypto.AgreementShared: the scheme rejected the inputs (cause withheld of key bytes)"
            public: Key agreement failed to derive a shared secret
            reason: AGREEMENT_FAILED
          - code: CodeStreamTruncated
            doc: |-
              StreamTruncated is returned by a streaming Open reader when the stream ends
              before its final-flag chunk — a truncated or tampered stream, not a clean EOF.
            name: StreamTruncated
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/crypto.OpenStream: reader hit EOF before decrypting the final-flag chunk"
            public: The authenticated stream was truncated before its final chunk
            reason: STREAM_TRUNCATED
          - code: CodeInvalidKeyEnvelope
            doc: |-
              InvalidKeyEnvelope is returned by UnwrapKey when the supplied $kenv$ string
              is structurally invalid (bad field count, magic, version, kdf/aead id, or
              base64). It signals corruption only — a wrong passphrase surfaces the
              non-oracle DecryptionFailed instead, so this is no key/password oracle.
            name: InvalidKeyEnvelope
            options:
              - errs.WithExitCode(exitDataErr)
            private: "service/crypto/key/keyenvelope.UnwrapKey: $kenv$ string is not well-formed"
            public: Key envelope is malformed
            reason: INVALID_KEY_ENVELOPE
          - code: CodeDigestMismatch
            doc: |-
              DigestMismatch is returned by a VerifyingReader on its final (EOF) read when
              the computed digest does not match the expected value. The digest is public,
              so the comparison is non-oracle and surfaces only at the terminal read.
            name: DigestMismatch
            options:
              - errs.WithExitCode(exitDataErr)
            private: "service/crypto/hash/stdhash.VerifyingReader: computed digest differs from the expected hex at EOF"
            public: Stream digest does not match the expected value
            reason: DIGEST_MISMATCH
          - code: CodeDuplicateRegistration
            doc: |-
              DuplicateRegistration is the conflict every registrar refuses at boot: a
              distinct scheme already holds the Algorithm — or, for an AEAD, the wire
              id — a second one claims. The registrar panics with conflictText of it,
              so the panic carries the dotted-quad header AND the key that collided.
            name: DuplicateRegistration
            private: "core/crypto: a distinct scheme already holds this Algorithm, or this AEAD wire id"
            public: A scheme is already registered under that algorithm or wire id
            reason: DUPLICATE_REGISTRATION
    types:
      - decl: true
        doc: |-
          Algorithm is the typed key under which an AEAD registers (e.g.
          "aes-256-gcm"). The zero value Algorithm("") is reserved invalid, mirroring
          codec.Format.
        methods:
          - doc: String implements fmt.Stringer and returns the raw identifier.
            name: String
            out:
              - type: string
            recv: value
          - doc: Known reports whether a has been registered in the AEAD registry.
            name: Known
            out:
              - type: bool
            recv: value
        name: Algorithm
        underlying: string
      - decl: true
        doc: |-
          Key is an opaque, redacting 256-bit symmetric key. Its String / GoString
          output is always "<redacted>" so an accidental %v / %s / %#v never leaks the
          secret; Bytes hands a fresh copy to the cipher and is the only way out. All
          copies of a Key share one backing array, so Zeroize on any copy clears the
          secret everywhere — call it when you are done with the key.
        methods:
          - doc: |-
              Bytes returns a fresh copy of the raw key material for handoff to a cipher.
              Callers MUST NOT log the result; the redaction only covers String / GoString.
              A zero-value Key returns nil.
            name: Bytes
            out:
              - type: "[]byte"
            recv: value
          - doc: |-
              Zeroize overwrites the key material with zeros. Because copies share one
              backing array, this clears the secret for every copy of the Key.
            name: Zeroize
            recv: value
          - doc: |-
              String implements fmt.Stringer and always redacts so the key never reaches a
              log line through %v / %s.
            name: String
            out:
              - type: string
            recv: value
          - doc: |-
              GoString implements fmt.GoStringer so %#v stays redacted too — fmt bypasses
              String for Go-syntax formatting and would otherwise dump the raw slice.
            name: GoString
            out:
              - type: string
            recv: value
        name: Key
        struct:
          fields:
            - doc: |-
                raw holds the symmetric key bytes behind a slice so a value-receiver
                Zeroize can clear the shared backing array; NewKey is the only producer.
              name: raw
              type: "[]byte"
  - doc: |-
      Package aesgcm registers the "aes-256-gcm" AEAD scheme (ADR 0013). Importing
      the package (typically a blank import via pkg/v1/crypto) self-registers the
      scheme so crypto.Seal / crypto.Open resolve. It is stdlib-only
      (crypto/aes + crypto/cipher + crypto/rand), so it pulls zero non-stdlib deps
      and keeps pkg/v1/crypto consumers dep-light.
    imports:
      corecrypto: github.com/kitsunium/sdk/internal/core/crypto
    path: github.com/kitsunium/sdk/internal/service/crypto/aead/aesgcm
    variables:
      - doc: |-
          AEAD is the registered AES-256-GCM scheme singleton (no init(); package-level
          var initialiser, mirroring the codec convention).
        name: AEAD
        type: corecrypto.AEAD
  - doc: |-
      Package streamaead (reader.go) — the streaming-AEAD read path: header verify,
      chunk-by-chunk decrypt with hold-back, and one-byte EOF look-ahead.

      Package streamaead registers the "aes-256-gcm-stream" streaming-AEAD scheme
      (ADR 0014 §D2). Importing the package (typically a blank import via
      pkg/v1/crypto) self-registers the scheme so crypto.SealStream /
      crypto.OpenStream resolve. It is stdlib-only (crypto/aes + crypto/cipher +
      crypto/hkdf + crypto/sha256 + crypto/rand), so it pulls zero non-stdlib deps
      and keeps pkg/v1/crypto consumers dep-light.

      # Frozen wire format (stream version 0x02, disjoint from the box's 0x01)

      	header : [1B stream-ver=0x02][1B algID=0x01][16B random salt]
      	key    : streamKey = HKDF-SHA256(ikm=key.Bytes(), salt=salt,
      	                                 info="kitsunium/stream-aead/v1") -> 32B
      	chunks : fixed 64 KiB plaintext per chunk (final chunk 0..64 KiB)
      	         nonce_i (12B) = counter_i (11B big-endian) || flag (1B)
      	                         flag = 0x01 on the final chunk, else 0x00
      	         wire_i = AES-256-GCM-Seal(streamKey, nonce_i, plaintext_i, aad)
      	                = ct_i || tag(16)

      This is the STREAM construction (Hoang-Reyhanitabar-Rogaway, as used by age):
      the random per-stream salt makes the deterministic counter nonce safe even
      when one Key encrypts many streams, and the final-chunk flag in the nonce
      provides truncation resistance — a truncated stream fails authentication
      because the Reader reaches EOF without ever decrypting a flag=0x01 chunk.

      This is a BESPOKE, SDK-owned frame — not age/libsodium interop. The header,
      the info string, and the KAT vectors are all SDK-owned and frozen.

      Package streamaead (writer.go) — the streaming-AEAD write path: lazy header
      emit, fixed-size chunk buffering, and per-chunk seal on overflow / Close.
    imports:
      corecrypto: github.com/kitsunium/sdk/internal/core/crypto
    path: github.com/kitsunium/sdk/internal/service/crypto/aead/streamaead
    variables:
      - doc: |-
          StreamSealer is the registered streaming AES-256-GCM scheme singleton (no
          init(); package-level var initialiser, mirroring the codec/AEAD convention).
        name: StreamSealer
        type: corecrypto.StreamSealer
  - doc: |-
      Package x25519 registers the "x25519" key-agreement scheme (ADR 0014).
      Importing the package (typically a blank import via pkg/v1/crypto/agree) self-registers
      the scheme so crypto.GenerateAgreementKey / crypto.AgreementShared resolve. It
      is stdlib-only (crypto/ecdh + crypto/rand), so it pulls zero non-stdlib deps
      and keeps pkg/v1/crypto/agree consumers dep-light.

      X25519 (RFC 7748) is the modern Diffie-Hellman default: a 32-byte public key,
      a 32-byte private key, and a 32-byte shared secret. crypto/ecdh rejects
      low-order peer points, so a malformed or attacker-chosen peer key surfaces as
      a typed error rather than a degenerate secret.

      Key-hygiene contract: the priv returned by GenerateKey and the secret returned
      by Shared are RAW key material. The caller (the pkg/v1/crypto/agree facade) MUST run
      the secret through a KDF before use and Zeroize both when done — this scheme
      never logs or retains either.
    imports:
      corecrypto: github.com/kitsunium/sdk/internal/core/crypto
    path: github.com/kitsunium/sdk/internal/service/crypto/agree/x25519
    variables:
      - doc: |-
          Agreement is the registered X25519 scheme singleton (no init(); package-level
          var initialiser, mirroring the codec/AEAD convention).
        name: Agreement
        type: corecrypto.Agreement
  - doc: |-
      Package stdhash — CRC-32C (Castagnoli) scheme registration (see stdhash.go).

      Package stdhash — DigestWriter streaming content-address ergonomics (see the
      package doc in stdhash.go).

      Package stdhash — FNV-1a 64-bit scheme registration (see package doc in stdhash.go).

      Package stdhash — SHA-256 scheme registration (see package doc in stdhash.go).

      Package stdhash — SHA3-256 scheme registration (see package doc in stdhash.go).

      Package stdhash — SHA-512 scheme registration (see package doc in stdhash.go).

      Package stdhash registers the stdlib fingerprint/content-addressing hashers
      (ADR 0013): sha256, sha512, sha3-256, crc32c, fnv1a-64. Blank-importing the
      package self-registers them so crypto.Sum / crypto.SumHex / crypto.NewHash
      resolve. It is stdlib-only (crypto/sha256, crypto/sha512, crypto/sha3,
      hash/crc32, hash/fnv), so it pulls zero non-stdlib deps and keeps
      pkg/v1/crypto/hash consumers dep-light.

      These are NOT authentication: none is keyed, and a digest is public. Keyed
      integrity belongs to the AEAD / signature ports.

      Each scheme lives in its own file (one comparable empty-struct Hasher per
      file, per KTN-STRUCT-ONEFILE) and self-registers via a package-level var —
      no init(), mirroring the codec/AEAD convention.

      Package stdhash — VerifyingReader streaming content-address ergonomics (see
      the package doc in stdhash.go).
    functions:
      - doc: |-
          NewDigestWriter returns a DigestWriter that tees writes into dst while hashing
          them under the Hasher registered as a. An unregistered algorithm returns
          UnknownHashAlgorithm (blank-import the scheme's package to register it).
        in:
          - name: a
            type: corecrypto.Algorithm
          - name: dst
            type: io.Writer
        name: NewDigestWriter
        out:
          - name: writer
            type: "*DigestWriter"
          - name: err
            type: error
      - doc: |-
          NewVerifyingReader returns a VerifyingReader over src that hashes the stream
          under the Hasher registered as a and compares the result to wantHex at EOF. An
          unregistered algorithm returns UnknownHashAlgorithm (blank-import the scheme's
          package to register it).
        in:
          - name: a
            type: corecrypto.Algorithm
          - name: src
            type: io.Reader
          - name: wantHex
            type: string
        name: NewVerifyingReader
        out:
          - name: reader
            type: "*VerifyingReader"
          - name: err
            type: error
    imports:
      corecrypto: github.com/kitsunium/sdk/internal/core/crypto
    path: github.com/kitsunium/sdk/internal/service/crypto/hash/stdhash
    types:
      - doc: |-
          DigestWriter tees every Write into both an underlying io.Writer and a running
          hash, so a caller can stream bytes to a destination and read the digest of
          everything written so far without a second pass. The digest is public (a
          content ID / cache key) — it is NOT authentication.
        methods:
          - doc: |-
              Write forwards p to the underlying writer and folds the same bytes into the
              running hash, returning the count the destination accepted.
            in:
              - name: p
                type: "[]byte"
            name: Write
            out:
              - name: "n"
                type: int
              - name: err
                type: error
            recv: pointer
          - doc: |-
              Sum returns the digest of every byte written so far. Calling it does not reset
              the hash, so subsequent Writes keep extending the same digest.
            name: Sum
            out:
              - type: "[]byte"
            recv: pointer
          - doc: |-
              SumHex returns Sum rendered as canonical lowercase hex — the frozen string
              form for content IDs and cache keys.
            name: SumHex
            out:
              - type: string
            recv: pointer
        name: DigestWriter
        struct:
          unexported: true
      - doc: |-
          VerifyingReader wraps a source reader and folds every byte read into a running
          hash. The digest is compared against the expected hex ONLY on the terminal
          read (the one returning io.EOF): on a match it surfaces io.EOF unchanged; on a
          mismatch it returns DigestMismatch instead. The check never fires mid-stream,
          so a partial read can never leak the verification outcome, and the digest is
          public so the comparison is non-oracle.
        methods:
          - doc: |-
              Read proxies the wrapped reader, hashing the bytes it yields. Only when the
              underlying read reports io.EOF does it verify the accumulated digest: a
              mismatch becomes DigestMismatch, a match passes io.EOF through unchanged.
            in:
              - name: p
                type: "[]byte"
            name: Read
            out:
              - name: "n"
                type: int
              - name: err
                type: error
            recv: pointer
        name: VerifyingReader
        struct:
          unexported: true
  - doc: |-
      Package hkdfsha256 registers the "hkdf-sha256" key-derivation scheme
      (ADR 0013). Importing the package (typically a blank import via pkg/v1/crypto/kdf)
      self-registers the scheme so crypto.Subkey resolves. It is stdlib-only
      (crypto/hkdf + crypto/sha256), so it pulls zero non-stdlib deps and keeps
      pkg/v1/crypto/kdf consumers dep-light.

      HKDF (RFC 5869) is for KEY SEPARATION — expanding one strong secret into
      independent, purpose-bound subkeys — NOT for stretching passwords. Feed it a
      high-entropy secret; argon2id handles human passwords under its own port.
    imports:
      corecrypto: github.com/kitsunium/sdk/internal/core/crypto
    path: github.com/kitsunium/sdk/internal/service/crypto/kdf/hkdfsha256
    variables:
      - doc: |-
          Deriver is the registered HKDF-SHA256 scheme singleton (no init();
          package-level var initialiser, mirroring the codec/AEAD convention).
        name: Deriver
        type: corecrypto.Deriver
  - doc: |-
      Package keytree implements path-addressed hierarchical key derivation.

      A KeyTree is an immutable node over a shared master Key. Each Child appends
      a path segment; DeriveKey re-derives a 32-byte AEAD Key from the master with
      the full canonical path as the HKDF info. The path encoding is injective —
      each segment is length-prefixed — so Child("a/b").Child("c") can never
      collide with Child("a").Child("b/c"). The root owns the master Zeroize
      lifetime: zeroizing the master invalidates every derived node. This package
      is a pure composition over the registered HKDF Deriver and mints no codes;
      derivation failures forward the core DerivationFailed sentinel.
    functions:
      - doc: NewKeyTree returns the root KeyTree for master, deriving children under algo.
        in:
          - name: algo
            type: corecrypto.Algorithm
          - name: master
            type: corecrypto.Key
        name: NewKeyTree
        out:
          - type: KeyTree
    imports:
      corecrypto: github.com/kitsunium/sdk/internal/core/crypto
    path: github.com/kitsunium/sdk/internal/service/crypto/kdf/keytree
    types:
      - doc: |-
          KeyTree is an immutable node in a path-addressed key-derivation tree. It
          holds the derivation algorithm, a shared master Key, and the accumulated
          path; Child returns a new node and never mutates the receiver.
        methods:
          - doc: Child returns a new KeyTree one segment deeper; the receiver is unchanged.
            in:
              - name: segment
                type: string
            name: Child
            out:
              - type: KeyTree
            recv: value
          - doc: |-
              DeriveKey re-derives a 32-byte AEAD Key from the master at this node's path.
              An unregistered algo yields UnknownKDFAlgorithm; an over-long request yields
              DerivationFailed — both forwarded verbatim from the core dispatcher.
            name: DeriveKey
            out:
              - name: key
                type: corecrypto.Key
              - name: err
                type: error
            recv: value
        name: KeyTree
        struct:
          unexported: true
  - doc: |-
      Package keyenvelope wraps a symmetric DEK at rest under a passphrase.

      A wrapped key is rendered in the frozen PHC-style grammar

      	$kenv$v=1$kdf=<id>$<b64salt>$aead=<id>$<b64box>

      where <b64salt> and <b64box> use base64.RawStdEncoding (PHC convention).
      The KEK is derived from the passphrase with PBKDF2-SHA256 (600000
      iterations, pinned by the kdf id — there is no iterations field) and the
      DEK is sealed under AES-256-GCM with the envelope header as AAD, binding
      the framing so a tampered header fails the AEAD open. The package mints no
      error codes of its own: structural faults map to the core
      InvalidKeyEnvelope sentinel and a wrong passphrase forwards the core
      DecryptionFailed sentinel verbatim (no key/password oracle beyond
      structural validity).
    functions:
      - doc: |-
          WrapKey seals dek under a KEK derived from passphrase, returning the frozen
          envelope string and an err that is non-nil on entropy or seal failure. The
          caller-owned dek is never zeroized; the transient KEK is wiped on every path.
        in:
          - name: passphrase
            type: "[]byte"
          - name: dek
            type: corecrypto.Key
        name: WrapKey
        out:
          - name: envelope
            type: string
          - name: err
            type: error
      - doc: |-
          UnwrapKey parses envelope and opens the DEK using a KEK derived from
          passphrase, returning the recovered dek and an err. A structurally invalid
          envelope yields InvalidKeyEnvelope in err; a wrong passphrase forwards the
          core DecryptionFailed sentinel.
        in:
          - name: passphrase
            type: "[]byte"
          - name: envelope
            type: string
        name: UnwrapKey
        out:
          - name: dek
            type: corecrypto.Key
          - name: err
            type: error
    imports:
      corecrypto: github.com/kitsunium/sdk/internal/core/crypto
    path: github.com/kitsunium/sdk/internal/service/crypto/key/keyenvelope
  - doc: |-
      Package hmacsha2 registers the "hmac-sha256" MAC scheme (ADR 0014).
      Importing the package (typically a blank import via pkg/v1/crypto/mac) self-registers
      the scheme so crypto.MACTag / crypto.MACVerify resolve. It is stdlib-only
      (crypto/hmac + crypto/sha256), so it pulls zero non-stdlib deps and keeps
      pkg/v1/crypto/mac consumers dep-light.

      HMAC-SHA256 (RFC 2104) is the modern default for detached keyed
      authentication. A tag IS secret-comparison-sensitive: Verify routes through
      hmac.Equal (constant-time), never a plain ==/bytes.Equal, the exact inverse of
      the unkeyed Hasher rule.
    imports:
      corecrypto: github.com/kitsunium/sdk/internal/core/crypto
    path: github.com/kitsunium/sdk/internal/service/crypto/mac/hmacsha2
    variables:
      - doc: |-
          MAC is the registered HMAC-SHA256 scheme singleton (no init(); package-level
          var initialiser, mirroring the codec/AEAD convention).
        name: MAC
        type: corecrypto.MAC
  - doc: |-
      Package commonpw holds the ten thousand most common passwords, and says
      whether a password is one of them (ADR 0143 §D10). Public facade:
      pkg/v1/crypto/password, IsCommon.

      # What the list is, and where it comes from

      The list is xato-net-10-million-passwords-10000.txt from SecLists
      (https://github.com/danielmiessler/SecLists, Passwords/Common-Credentials),
      embedded byte for byte as it stood at commit
      2e3e92569043d24297ca6c35070078e5cf41651e, SHA-256
      c63d5e4ccc31344d662583cc39ca4bd5bd20517ff1d24501f0c4e0c22d9b722a: the
      10 000 passwords that occur most often in the ten million credentials Mark
      Burnett released into the public domain in 2015, most frequent first.

      SecLists is distributed under the MIT licence, Copyright (c) 2018 Daniel
      Miessler; its text is LICENSE.SecLists, beside the list, and travels with it
      in the module. The SDK's own licence is MIT too.

      # Why this list

      NIST SP 800-63B-4 requires a verifier to compare a new password against a
      blocklist of commonly used ones, and OWASP ASVS 5.0 (6.2.4) asks for at least
      the top 3 000. Ten thousand covers that with room, at 76 KB in the binary.
      Its provenance is known end to end, which a list merged from breaches of
      unknown origin does not offer.

      # How a password is compared

      Case-insensitively: a password and every entry are compared lower-cased as
      strings.ToLower lower-cases them, so PASSWORD and Password are refused with
      password — a guessing attacker tries case variants first, and refusing them
      costs a person nothing. Nothing else is normalised: no trimming, no
      substitution of look-alike characters. The list is sorted once, at the first
      question, and each question is a binary search that lower-cases the password
      as it compares it: no copy of the password is made, as a string or
      otherwise, and it is neither kept nor logged.

      One line of the file is empty: the empty password is among the ten thousand
      most used. It is not an entry here — refusing it is a length rule's job, and
      IsCommon answers false for it — so the list holds 9 999 passwords, 9 916
      once the case variants of one another are one.

      A policy that requires fifteen characters, NIST's minimum for a password
      used alone, has little left to refuse here — two entries are that long — so
      the list matters most beside a shorter minimum, such as the eight NIST allows
      with a second factor.
    functions:
      - doc: |-
          IsCommon reports whether password, lower-cased, is one of the list's
          entries, lower-cased. An empty password is not one of them: refusing it is
          a length rule's job.
        in:
          - name: password
            type: "[]byte"
        name: IsCommon
        out:
          - type: bool
      - doc: |-
          Len returns how many distinct passwords the list holds once lower-cased:
          its 9 999 passwords, less the case variants of one another — 9 916.
        name: Len
        out:
          - type: int
    path: github.com/kitsunium/sdk/internal/service/crypto/password/commonpw
  - doc: |-
      Package pbkdf2pw registers the "pbkdf2-sha256" password-hashing scheme
      (ADR 0013). Importing the package (typically a blank import via
      pkg/v1/crypto/password) self-registers the scheme so crypto.HashPassword /
      crypto.VerifyPassword resolve. It is stdlib-only (crypto/pbkdf2 + crypto/sha256
      + crypto/rand + crypto/subtle, all Go 1.26), so it pulls zero non-stdlib deps
      and is the default that keeps pkg/v1/crypto/password consumers dep-light.

      PBKDF2 is the stdlib password stretcher. argon2id (memory-hard, the OWASP
      first choice) lives under third-party/x-crypto as an opt-in scheme — import
      it explicitly when you can afford the x/crypto dependency. PBKDF2-SHA256 at
      600 000 iterations is the OWASP-recommended fallback where argon2 is absent.

      Stored hashes use the PHC string format:

      	$pbkdf2-sha256$i=600000$<b64-salt>$<b64-digest>
    imports:
      corecrypto: github.com/kitsunium/sdk/internal/core/crypto
    path: github.com/kitsunium/sdk/internal/service/crypto/password/pbkdf2pw
    variables:
      - doc: |-
          PasswordHasher is the registered PBKDF2-SHA256 scheme singleton (no init();
          package-level var initialiser, mirroring the codec/AEAD convention).
        name: PasswordHasher
        type: corecrypto.PasswordHasher
  - doc: |-
      Package ecdsasig registers the "ecdsa-p256" signature scheme (ADR 0013).
      Importing the package (typically a blank import via pkg/v1/crypto/sign) self-registers
      the scheme so crypto.Sign / crypto.Verify / crypto.GenerateKey resolve. It is
      stdlib-only (crypto/ecdsa + crypto/elliptic + crypto/sha256 + crypto/x509 +
      crypto/rand), so it pulls zero non-stdlib deps and keeps pkg/v1/crypto/sign dep-light.

      ECDSA over NIST P-256 with SHA-256 digests and ASN.1/DER signatures — the
      interoperable choice for JWTs, X.509, and other ecosystems that expect ECDSA.
      Ed25519 (ed25519sig) is the modern default when interop is not required.

      Keys are DER-marshalled: the public key is PKIX (SubjectPublicKeyInfo) and the
      private key is SEC1 (the x509.MarshalECPrivateKey form).
    imports:
      corecrypto: github.com/kitsunium/sdk/internal/core/crypto
    path: github.com/kitsunium/sdk/internal/service/crypto/sign/ecdsasig
    variables:
      - doc: |-
          Signer is the registered ECDSA P-256 scheme singleton (no init();
          package-level var initialiser, mirroring the codec/AEAD convention).
        name: Signer
        type: corecrypto.Signer
  - doc: |-
      Package ed25519sig registers the "ed25519" signature scheme (ADR 0013).
      Importing the package (typically a blank import via pkg/v1/crypto/sign) self-registers
      the scheme so crypto.Sign / crypto.Verify / crypto.GenerateKey resolve. It is
      stdlib-only (crypto/ed25519 + crypto/rand), so it pulls zero non-stdlib deps
      and keeps pkg/v1/crypto/sign consumers dep-light.

      Ed25519 is the modern default: small fixed-size keys and signatures, fast
      verification, and no parameter choices to misconfigure. ECDSA lands later
      under its own scheme package.
    imports:
      corecrypto: github.com/kitsunium/sdk/internal/core/crypto
    path: github.com/kitsunium/sdk/internal/service/crypto/sign/ed25519sig
    variables:
      - doc: |-
          Signer is the registered Ed25519 scheme singleton (no init(); package-level
          var initialiser, mirroring the codec/AEAD convention).
        name: Signer
        type: corecrypto.Signer
  - constants:
      - doc: "AESGCM is the default algorithm: AES-256-GCM. Active out of the box."
        name: AESGCM
        type: Algorithm
        value: "\"aes-256-gcm\""
      - doc: |-
          XChaCha20Poly1305 is the 192-bit-nonce AEAD, preferred for high-volume
          random-nonce workloads. Pass it to SealAs after a blank import of
          third-party/x-crypto/xchacha (which alone pulls golang.org/x/crypto):

          	import _ "github.com/kitsunium/sdk/third-party/x-crypto/xchacha"
          	box, _ := crypto.SealAs(crypto.XChaCha20Poly1305, k, pt, aad)
        name: XChaCha20Poly1305
        type: Algorithm
        value: "\"xchacha20poly1305\""
    doc: |-
      Package crypto is the authenticated-encryption facade: Seal and Open with a
      hidden nonce.

      One key, two verbs. [Seal] encrypts a byte slice into a self-describing box;
      [Open] turns the box back into plaintext. The nonce is generated, embedded,
      and stripped for you — there is no nonce parameter to misuse, and the secure
      path is the only path.

      	k, _   := crypto.NewKey(key32)            // exactly 32 bytes, copied + redacting
      	box, _ := crypto.Seal(k, []byte("hi"), nil) // nonce generated + hidden inside box
      	pt, _  := crypto.Open(k, box, nil)          // []byte("hi")

      # Hard to misuse, by design

        - The nonce never appears in the API. [Seal] draws it from crypto/rand and
          embeds it; [Open] strips it. Nonce reuse is structurally impossible.
        - [NewKey] rejects any input that is not exactly [KeyLen] (32) bytes with
          InvalidKey — never silent truncation — and copies the bytes defensively.
        - [Key] redacts: its %v / %s / %#v output is always "<redacted>", and key
          material never reaches an error's public or private message.
        - [Open] returns one undifferentiated error for every failure (bad tag,
          tampered framing, wrong key), so it cannot be used as an oracle.

      # Associated data (aad)

      The optional aad argument is authenticated but NOT encrypted: it is bound into
      the tag so Open fails if it differs, but it is not stored in the box. Use it
      to tie a ciphertext to its context (a record id, a table name, a format tag)
      so a box cannot be replayed into a different context. Pass nil when unused.

      # Algorithms

      The default is AES-256-GCM (stdlib, hardware-accelerated, FIPS-track) and is
      active out of the box — importing this package activates it with zero
      non-stdlib dependencies. [SealAs] selects a specific [Algorithm]; additional
      schemes (e.g. XChaCha20-Poly1305) activate via their own blank import.

      # Wire format

      A box is [1-byte version][1-byte algorithm-id][nonce][ciphertext || tag]. The
      version and per-algorithm id are frozen post-v1.0.0, so a box sealed today
      opens tomorrow. Open reads the id to pick the algorithm — the caller never
      names it.

      # Streaming large payloads

      [Seal] is whole-buffer: it holds the full plaintext and box in memory. For
      payloads too large to buffer, [SealStream] / [OpenStream] wrap an io.Writer /
      io.Reader and process the data in fixed 64 KiB authenticated chunks under a
      disjoint, frozen wire format (stream version 0x02). The chunked construction
      (a random per-stream salt + a counter nonce + a final-chunk flag) is
      truncation-resistant and never surfaces a chunk's plaintext before it
      authenticates. The streaming frame is bespoke and SDK-owned (not age/libsodium
      interop) and stays stdlib-only, so it preserves the dep-light invariant.
    facade:
      - const:
          - doc: KeyLen is the required symmetric key length in bytes (256-bit).
            name: KeyLen
            reexport: corecrypto.KeyLen
            type: int
            typed: true
            value: "32"
      - alias:
          - doc: |-
              Key is an opaque, redacting 256-bit symmetric key. Build one with NewKey; its
              String output is always "<redacted>".
            name: Key
            target: corecrypto.Key
      - func:
          doc: |-
            NewKey builds a Key from raw, which must be exactly KeyLen (32) bytes. A wrong
            length returns InvalidKey; the bytes are copied defensively.
          forward: corecrypto.NewKey
          in:
            - name: raw
              type: "[]byte"
          name: NewKey
          out:
            - name: key
              type: Key
            - name: err
              type: error
      - func:
          doc: |-
            Open decrypts a box produced by Seal/SealAs under k, verifying aad, and
            returns the plaintext. The algorithm is read from the box — the caller never
            names it. Any failure returns the single non-oracle DecryptionFailed.
          forward: corecrypto.Open
          in:
            - name: k
              type: Key
            - name: box
            - name: aad
              type: "[]byte"
          name: Open
          out:
            - name: plaintext
              type: "[]byte"
            - name: err
              type: error
      - func:
          doc: |-
            WrapKey seals the data key dek at rest under passphrase, returning the frozen
            "$kenv$" envelope string. The KEK is stretched from passphrase with
            PBKDF2-SHA256 and the dek is sealed under AES-256-GCM; the envelope header is
            bound as AAD so tampering is detected on UnwrapKey.
          forward: keyenvelope.WrapKey
          in:
            - name: passphrase
              type: "[]byte"
            - name: dek
              type: Key
          name: WrapKey
          out:
            - name: envelope
              type: string
            - name: err
              type: error
      - func:
          doc: |-
            UnwrapKey recovers the data key sealed in envelope under passphrase. A
            structurally invalid envelope returns InvalidKeyEnvelope; a wrong passphrase
            returns the non-oracle DecryptionFailed.
          forward: keyenvelope.UnwrapKey
          in:
            - name: passphrase
              type: "[]byte"
            - name: envelope
              type: string
          name: UnwrapKey
          out:
            - name: dek
              type: Key
            - name: err
              type: error
    functions:
      - doc: |-
          Seal encrypts plaintext under k using the default algorithm (AES-256-GCM),
          binding aad, and returns a self-describing box. The nonce is generated and
          embedded for you. Pass nil aad when unused.
        in:
          - name: k
            type: Key
          - name: plaintext
          - name: aad
            type: "[]byte"
        name: Seal
        out:
          - name: box
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          SealAs is Seal with an explicit algorithm — e.g. a scheme activated by its own
          blank import. An unregistered algorithm returns UnknownAlgorithm.
        in:
          - name: a
            type: Algorithm
          - name: k
            type: Key
          - name: plaintext
          - name: aad
            type: "[]byte"
        name: SealAs
        out:
          - name: box
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          SealStream wraps dst so writes are sealed under k with aad in fixed 64 KiB
          authenticated chunks. The returned io.WriteCloser buffers and seals chunks as
          they fill; Close writes the final authenticated chunk and MUST be called to
          produce a valid stream. Pass nil aad when unused.
        in:
          - name: dst
            type: io.Writer
          - name: k
            type: Key
          - name: aad
            type: "[]byte"
        name: SealStream
        out:
          - name: sealed
            type: io.WriteCloser
          - name: err
            type: error
      - doc: |-
          OpenStream wraps src so reads are opened under k with aad, decrypting the
          chunked stream produced by SealStream. The returned io.Reader never surfaces a
          chunk's plaintext before it authenticates, returns EOF only after the final
          chunk verifies, and surfaces a truncated stream as StreamTruncated. Pass nil
          aad when unused.
        in:
          - name: src
            type: io.Reader
          - name: k
            type: Key
          - name: aad
            type: "[]byte"
        name: OpenStream
        out:
          - name: opened
            type: io.Reader
          - name: err
            type: error
    imports:
      corecrypto: github.com/kitsunium/sdk/internal/core/crypto
      keyenvelope: github.com/kitsunium/sdk/internal/service/crypto/key/keyenvelope
    path: github.com/kitsunium/sdk/pkg/v1/crypto
    types:
      - doc: |-
          Algorithm is the stable identifier of an AEAD scheme. Use it with SealAs. It
          is a defined type distinct from the other crypto-family Algorithm types (hash,
          mac, sign, …), so the compiler rejects feeding a hash or signature constant
          into an AEAD call (V104) — the seven registries are separate keyspaces, and
          the type system now enforces that separation the way typed Format/Level
          discipline does elsewhere.
        name: Algorithm
        underlying: corecrypto.Algorithm
  - constants:
      - doc: X25519 is Diffie-Hellman over Curve25519 (RFC 7748) — the modern default.
        name: X25519
        type: Algorithm
        value: "\"x25519\""
    doc: |-
      Package agree is the key-agreement facade: establish a shared symmetric key
      between two parties from their keypairs.

      Each party generates a keypair, exchanges public keys, and derives the SAME
      [Key] — without ever transmitting the key itself:

      	pubA, privA, _ := agree.GenerateKey(agree.X25519)
      	pubB, privB, _ := agree.GenerateKey(agree.X25519)
      	keyA, _ := agree.SharedKey(agree.X25519, privA, pubB, "app-v1")
      	keyB, _ := agree.SharedKey(agree.X25519, privB, pubA, "app-v1")
      	// keyA and keyB are identical and ready for crypto.Seal.

      # The raw Diffie-Hellman secret is never handed back

      A raw DH secret is biased key material, unsafe to use directly. [SharedKey]
      runs it through HKDF-SHA256 (bound to the info label) and returns a redacting
      [Key] — the raw secret never leaves the SDK. The info label provides domain
      separation: two applications sharing one keypair derive independent keys.

      # Key hygiene

      The priv from [GenerateKey] is secret material: hold it like a password, never
      log it, and zero it when done. The returned [Key] redacts in logs; call its
      Zeroize when finished.

      # Algorithms

      Importing this package activates X25519 (and the HKDF-SHA256 it derives
      through) with zero non-stdlib deps:

        - [X25519] — Diffie-Hellman over Curve25519 (RFC 7748); rejects low-order
          peer points.

      # Stable algorithm strings

      The [Algorithm] constants are frozen post-v1.0.0.
    facade:
      - const:
          - doc: |-
              KeyLen is the required symmetric key length in bytes (256-bit) — the length of
              the Key SharedKey returns and that [NewKey] enforces.
            name: KeyLen
            reexport: corecrypto.KeyLen
            type: int
            typed: true
            value: "32"
      - alias:
          - doc: |-
              Key is an opaque, redacting 256-bit symmetric key — the same key type the AEAD
              surface uses. SharedKey returns one; its String output is "<redacted>".
            name: Key
            target: corecrypto.Key
      - func:
          doc: |-
            NewKey builds a Key from raw, which must be exactly KeyLen (32) bytes. A wrong
            length returns InvalidKey; the bytes are copied defensively. Use it to
            round-trip a SharedKey-shaped value without importing an unrelated facade.
          forward: corecrypto.NewKey
          in:
            - name: raw
              type: "[]byte"
          name: NewKey
          out:
            - name: key
              type: Key
            - name: err
              type: error
    functions:
      - doc: |-
          GenerateKey draws a fresh keypair for the named scheme, returning the raw
          public and private key bytes. An unregistered algorithm returns
          UnknownAgreementAlgorithm; treat priv as a secret and zero it when done.
        in:
          - name: a
            type: Algorithm
        name: GenerateKey
        out:
          - name: pub
          - name: priv
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          SharedKey derives a redacting 32-byte symmetric Key from priv and peerPub for
          the named scheme, binding info as HKDF domain separation. The raw DH secret is
          HKDF'd and never returned. An unregistered scheme returns
          UnknownAgreementAlgorithm; a low-order/garbage peerPub returns AgreementFailed.
        in:
          - name: a
            type: Algorithm
          - name: priv
          - name: peerPub
            type: "[]byte"
          - name: info
            type: string
        name: SharedKey
        out:
          - name: key
            type: Key
          - name: err
            type: error
    imports:
      corecrypto: github.com/kitsunium/sdk/internal/core/crypto
    path: github.com/kitsunium/sdk/pkg/v1/crypto/agree
    types:
      - doc: |-
          Algorithm is the stable identifier of a key-agreement scheme. It is a defined
          type distinct from the other crypto-family Algorithm types (hash, mac, sign,
          …), so the compiler rejects feeding a hash or signature constant into an
          agreement call (V104) — the seven registries are separate keyspaces, and the
          type system now enforces that separation the way typed Format/Level discipline
          does elsewhere.
        name: Algorithm
        underlying: corecrypto.Algorithm
  - constants:
      - doc: "SHA256 is SHA-256: a 256-bit cryptographic digest for content addressing."
        name: SHA256
        type: Algorithm
        value: "\"sha256\""
      - doc: "SHA512 is SHA-512: a 512-bit cryptographic digest."
        name: SHA512
        type: Algorithm
        value: "\"sha512\""
      - doc: "SHA3256 is SHA3-256: the Keccak-family 256-bit cryptographic digest."
        name: SHA3256
        type: Algorithm
        value: "\"sha3-256\""
      - doc: "CRC32C is CRC-32C (Castagnoli): a fast NON-cryptographic checksum."
        name: CRC32C
        type: Algorithm
        value: "\"crc32c\""
      - doc: "FNV1a64 is FNV-1a 64-bit: a fast NON-cryptographic fingerprint."
        name: FNV1a64
        type: Algorithm
        value: "\"fnv1a-64\""
    doc: |-
      Package hash is the fingerprint / content-addressing hashing facade.

      One verb, many algorithms. [Sum] and [SumHex] hash arbitrary bytes to a
      digest; [New] returns a streaming [hash.Hash] for io.Copy over large inputs.

      	id, _ := hash.SumHex(hash.SHA256, payload)   // "9f86d0…" content id
      	ck    := hash.SumHex(hash.CRC32C, payload)   // fast cache key

      # NOT authentication

      This package is for content IDs, cache keys, and dedup keys — NOT message
      authentication, password storage, or signatures. No hasher is keyed, and a
      digest is public. The package deliberately offers no secret-comparison
      equality helper: never branch on a secret-dependent comparison of a digest.
      Keyed integrity lives in the crypto AEAD and signature surfaces (constant-time
      by construction there).

      # Streaming content addressing

      [NewDigestWriter] tees writes into a destination while computing the digest of
      everything written; [NewVerifyingReader] verifies a stream against an expected
      hex digest, failing only on the final (EOF) read with DigestMismatch. This is
      public-digest, non-oracle verification — a content-ID check on public data, not
      a secret-comparison oracle — so it does not contradict the NOT-authentication
      rule above.

      # Algorithms

      Importing this package activates all of them with zero non-stdlib deps:

        - [SHA256], [SHA512], [SHA3256] — cryptographic-strength digests for
          content addressing and integrity (collision-resistant).
        - [CRC32C], [FNV1a64] — fast NON-cryptographic checksums/fingerprints for
          cache keys and in-memory dedup; do NOT use them where collision
          resistance matters.

      # Stable algorithm strings

      The [Algorithm] constants are frozen post-v1.0.0 — a SumHex value computed
      today stays reproducible.
    facade:
      - alias:
          - doc: |-
              DigestWriter tees writes into both a destination io.Writer and a running hash,
              exposing the digest of everything written so far. See [NewDigestWriter].
            name: DigestWriter
            target: stdhash.DigestWriter
      - alias:
          - doc: |-
              VerifyingReader wraps a source reader and verifies its digest against an
              expected value on the final (EOF) read. See [NewVerifyingReader].
            name: VerifyingReader
            target: stdhash.VerifyingReader
    functions:
      - doc: |-
          Sum returns the digest of data under the named algorithm. An unregistered
          algorithm returns UnknownHashAlgorithm.
        in:
          - name: a
            type: Algorithm
          - name: data
            type: "[]byte"
        name: Sum
        out:
          - name: digest
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          SumHex returns Sum as canonical lowercase hex — the frozen string form for
          content IDs and cache keys.
        in:
          - name: a
            type: Algorithm
          - name: data
            type: "[]byte"
        name: SumHex
        out:
          - name: digest
            type: string
          - name: err
            type: error
      - doc: |-
          New returns a fresh streaming hash.Hash for the named algorithm, for io.Copy
          over large inputs. An unregistered algorithm returns UnknownHashAlgorithm.
        in:
          - name: a
            type: Algorithm
        name: New
        out:
          - name: h
            type: hash.Hash
          - name: err
            type: error
      - doc: |-
          NewDigestWriter returns a DigestWriter that tees writes into dst while hashing
          them under the named algorithm, so the content-address digest of everything
          written is available via Sum/SumHex. An unregistered algorithm returns
          UnknownHashAlgorithm.
        in:
          - name: a
            type: Algorithm
          - name: dst
            type: io.Writer
        name: NewDigestWriter
        out:
          - name: writer
            type: "*DigestWriter"
          - name: err
            type: error
      - doc: |-
          NewVerifyingReader returns a VerifyingReader over src that hashes the stream
          under the named algorithm and verifies it against wantHex on the final (EOF)
          read — a public-digest, non-oracle, EOF-typed check that never fails
          mid-stream. An unregistered algorithm returns UnknownHashAlgorithm; a digest
          mismatch surfaces as DigestMismatch only at EOF.
        in:
          - name: a
            type: Algorithm
          - name: src
            type: io.Reader
          - name: wantHex
            type: string
        name: NewVerifyingReader
        out:
          - name: reader
            type: "*VerifyingReader"
          - name: err
            type: error
    imports:
      corecrypto: github.com/kitsunium/sdk/internal/core/crypto
      stdhash: github.com/kitsunium/sdk/internal/service/crypto/hash/stdhash
    path: github.com/kitsunium/sdk/pkg/v1/crypto/hash
    types:
      - doc: |-
          Algorithm is the stable identifier of a hash scheme. It is a defined type
          distinct from the other crypto-family Algorithm types (mac, sign, kdf, …), so
          the compiler rejects feeding a MAC or signature constant into a hash call
          (V104) — the seven registries are separate keyspaces, and the type system now
          enforces that separation the way typed Format/Level discipline does elsewhere.
        name: Algorithm
        underlying: corecrypto.Algorithm
  - constants:
      - doc: |-
          HKDFSHA256 is HKDF (RFC 5869) over SHA-256 — extract-and-expand for key
          separation from a strong secret.
        name: HKDFSHA256
        type: Algorithm
        value: "\"hkdf-sha256\""
    doc: |-
      Package kdf is the key-derivation facade for KEY SEPARATION.

      Expand one strong secret into independent, purpose-bound subkeys:

      	enc, _ := kdf.Subkey(kdf.HKDFSHA256, master, salt, "aead-key", 32)
      	mac, _ := kdf.Subkey(kdf.HKDFSHA256, master, salt, "mac-key", 32)

      The info label binds each subkey to its purpose, so the two derivations above
      are cryptographically independent even though they share master and salt.

      # Hierarchical derivation

      [NewKeyTree] returns a [KeyTree] — an immutable, path-addressed node over a
      shared master key. Child appends a path segment; DeriveKey re-derives a
      32-byte key from the master with the full canonical path as the HKDF info.
      The path encoding is injective, so distinct paths never collide:

      	t := kdf.NewKeyTree(kdf.HKDFSHA256, master)
      	dbKey, _ := t.Child("svc").Child("db").DeriveKey()

      # NOT for passwords

      HKDF assumes a HIGH-ENTROPY input — an AEAD key, a Diffie-Hellman shared
      secret, an HKDF pseudorandom key. It does NOT stretch human passwords: it is
      fast by design, so a weak password stays weak. Password hashing/stretching
      (argon2id) is a separate, deliberately slow surface.

      # Algorithms

      Importing this package activates HKDF-SHA256 with zero non-stdlib deps:

        - [HKDFSHA256] — HMAC-based extract-and-expand (RFC 5869) over SHA-256.

      # Stable algorithm strings

      The [Algorithm] constants are frozen post-v1.0.0 — a subkey derived today
      stays reproducible.
    facade:
      - const:
          - doc: |-
              KeyLen is the required symmetric key length in bytes (256-bit) — the length
              [NewKey] enforces.
            name: KeyLen
            reexport: corecrypto.KeyLen
            type: int
            typed: true
            value: "32"
      - alias:
          - doc: |-
              Key is an opaque, redacting 256-bit symmetric key — the master a KeyTree
              derives from and the type DeriveKey returns. Build one with [NewKey].
            name: Key
            target: corecrypto.Key
      - func:
          doc: |-
            NewKey builds a Key from raw, which must be exactly KeyLen (32) bytes. A wrong
            length returns InvalidKey; the bytes are copied defensively. Use it to build
            the master a KeyTree derives from without importing an unrelated facade.
          forward: corecrypto.NewKey
          in:
            - name: raw
              type: "[]byte"
          name: NewKey
          out:
            - name: key
              type: Key
            - name: err
              type: error
      - alias:
          - doc: |-
              KeyTree is the path-addressed hierarchical key-derivation node, re-exported
              from the service layer. Build one with NewKeyTree; Child descends a path and
              DeriveKey yields a 32-byte key at the current node.
            name: KeyTree
            target: keytree.KeyTree
    functions:
      - doc: |-
          Subkey derives a length-byte subkey from secret using the named scheme. salt
          is optional domain randomness (nil is allowed); info is a context label that
          binds the subkey to its purpose. An unregistered algorithm returns
          UnknownKDFAlgorithm; an over-long length returns DerivationFailed.
        in:
          - name: a
            type: Algorithm
          - name: secret
          - name: salt
            type: "[]byte"
          - name: info
            type: string
          - name: length
            type: int
        name: Subkey
        out:
          - name: subkey
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          NewKeyTree returns the root KeyTree for master, deriving children under algo.
          The master Key is shared by reference across children — the root owns its
          Zeroize lifetime, so zeroizing master invalidates every derived node.
        in:
          - name: algo
            type: Algorithm
          - name: master
            type: Key
        name: NewKeyTree
        out:
          - type: KeyTree
    imports:
      corecrypto: github.com/kitsunium/sdk/internal/core/crypto
      keytree: github.com/kitsunium/sdk/internal/service/crypto/kdf/keytree
    path: github.com/kitsunium/sdk/pkg/v1/crypto/kdf
    types:
      - doc: |-
          Algorithm is the stable identifier of a key-derivation scheme. It is a defined
          type distinct from the other crypto-family Algorithm types (hash, mac, sign,
          …), so the compiler rejects feeding a hash or MAC constant into a KDF call
          (V104) — the seven registries are separate keyspaces, and the type system now
          enforces that separation the way typed Format/Level discipline does elsewhere.
        name: Algorithm
        underlying: corecrypto.Algorithm
  - constants:
      - doc: HMACSHA256 is HMAC (RFC 2104) over SHA-256 — the detached-MAC default.
        name: HMACSHA256
        type: Algorithm
        value: "\"hmac-sha256\""
    doc: |-
      Package mac is the detached message-authentication facade.

      Tag bytes with a secret key, verify the tag with the same key. One key, two
      verbs:

      	tag    := mac.Tag(mac.HMACSHA256, key, message)
      	ok, _  := mac.Verify(mac.HMACSHA256, key, message, tag)   // true

      # A MAC tag is secret — compare with Verify, never ==

      Unlike an unkeyed hash digest (a public fingerprint), a MAC tag is
      secret-comparison-sensitive: comparing it with == or bytes.Equal leaks timing
      about how many bytes matched. Always route equality through [Verify], which
      uses a constant-time comparison. This is the exact inverse of the hash rule.

      # MAC vs signature vs AEAD

      Use a MAC for detached integrity + authenticity under a SHARED secret (both
      parties hold the key). Use a signature
      ([github.com/kitsunium/sdk/pkg/v1/crypto/sign]) for authenticity under a PUBLIC key
      anyone can verify, and the AEAD surface
      ([github.com/kitsunium/sdk/pkg/v1/crypto]) for confidentiality + integrity.

      # Algorithms

      Importing this package activates HMAC-SHA256 with zero non-stdlib deps:

        - [HMACSHA256] — HMAC (RFC 2104) over SHA-256; a 32-byte tag.

      # Stable algorithm strings

      The [Algorithm] constants are frozen post-v1.0.0 — a tag produced today stays
      verifiable.
    facade:
      - const:
          - doc: |-
              KeyLen is the required symmetric key length in bytes (256-bit) — the length
              [NewKey] enforces.
            name: KeyLen
            reexport: corecrypto.KeyLen
            type: int
            typed: true
            value: "32"
      - alias:
          - doc: |-
              Key is an opaque, redacting 256-bit symmetric key — the same key type used by
              the AEAD surface. Build one with [NewKey]; its String output is "<redacted>".
            name: Key
            target: corecrypto.Key
      - func:
          doc: |-
            NewKey builds a Key from raw, which must be exactly KeyLen (32) bytes. A wrong
            length returns InvalidKey; the bytes are copied defensively.
          forward: corecrypto.NewKey
          in:
            - name: raw
              type: "[]byte"
          name: NewKey
          out:
            - name: key
              type: Key
            - name: err
              type: error
    functions:
      - doc: |-
          Tag returns the authentication tag over message under key for the named
          scheme. An unregistered algorithm returns UnknownMACAlgorithm; a registered
          scheme cannot fail (the redacting Key pins the length).
        in:
          - name: a
            type: Algorithm
          - name: key
            type: Key
          - name: message
            type: "[]byte"
        name: Tag
        out:
          - name: tag
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          Verify reports whether tag authenticates message under key for the named
          scheme, using a constant-time comparison. An unregistered algorithm returns
          (false, UnknownMACAlgorithm); a bad tag is (false, nil).
        in:
          - name: a
            type: Algorithm
          - name: key
            type: Key
          - name: message
          - name: tag
            type: "[]byte"
        name: Verify
        out:
          - name: ok
            type: bool
          - name: err
            type: error
    imports:
      corecrypto: github.com/kitsunium/sdk/internal/core/crypto
    path: github.com/kitsunium/sdk/pkg/v1/crypto/mac
    types:
      - doc: |-
          Algorithm is the stable identifier of a MAC scheme. It is a defined type
          distinct from the other crypto-family Algorithm types (hash, sign, kdf, …), so
          the compiler rejects feeding a hash or signature constant into a MAC call
          (V104) — the seven registries are separate keyspaces, and the type system now
          enforces that separation the way typed Format/Level discipline does elsewhere.
        name: Algorithm
        underlying: corecrypto.Algorithm
  - constants:
      - doc: PBKDF2SHA256 is PBKDF2-SHA256 — the stdlib password stretcher (RFC 8018).
        name: PBKDF2SHA256
        type: Algorithm
        value: "\"pbkdf2-sha256\""
    doc: |-
      Package password is the password-storage facade: slow, salted, self-describing
      hashes with transparent upgrade-on-verify.

      	phc, _   := password.Hash(password.PBKDF2SHA256, []byte(pw))   // store phc
      	ok, _    := password.Verify([]byte(pw), phc)                   // login check
      	if ok && password.NeedsRehash(phc) {                           // policy grew?
      	    phc, _ = password.Hash(password.PBKDF2SHA256, []byte(pw))  // re-store
      	}

      [Verify] and [NeedsRehash] read the scheme from the stored PHC string, so no
      algorithm argument is needed — the hash fully describes how to check it.

      # This is the ONLY surface for human passwords

      Password hashing is deliberately SLOW and salted. Never run a raw [hash.Sum]
      or [kdf.Subkey] over a password — those are fast and assume high entropy. This
      facade is the one place a low-entropy human secret belongs. [Verify] compares
      in constant time; a mismatch is (false, nil), never an error.

      # Algorithms

      Importing this package activates PBKDF2-SHA256 with zero non-stdlib deps:

        - [PBKDF2SHA256] — PBKDF2-SHA256 at 600 000 iterations (OWASP fallback).

      argon2id (memory-hard, the OWASP first choice) is an opt-in scheme under
      third-party/x-crypto — blank-import it when you can take the x/crypto dep, then
      hash with its Algorithm; Verify still works on either scheme's stored hashes.

      # Common passwords

      [IsCommon] reports whether a password is one of the ten thousand most common
      ones, compared case-insensitively — the blocklist NIST SP 800-63B-4 requires
      a verifier to check a new password against, past the top 3 000 OWASP ASVS
      5.0 (6.2.4) asks for:

      	if password.IsCommon([]byte(pw)) {
      	    return errTooCommon // before hashing anything
      	}

      The list is SecLists' xato-net-10-million-passwords-10000.txt, MIT-licensed,
      Copyright (c) 2018 Daniel Miessler — the passwords that occur most often in
      the ten million credentials Mark Burnett released into the public domain in
      2015 — embedded byte for byte at a pinned commit (ADR 0143 §D10;
      internal/service/crypto/password/commonpw names the commit, the digest and the
      licence). The empty password is left to a length rule. Nearly every entry is
      shorter than fifteen characters, so the check matters most beside a shorter
      minimum.

      # Stable algorithm strings

      The [Algorithm] constants are frozen post-v1.0.0; the PHC id segment equals
      the Algorithm, so stored hashes stay verifiable across releases.
    facade:
      - func:
          doc: |-
            Verify reports whether password matches the stored PHC hash, comparing in
            constant time. The scheme is read from phc. A malformed phc or unregistered
            scheme returns an error; a genuine mismatch is (false, nil).
          forward: corecrypto.VerifyPassword
          in:
            - name: password
              type: "[]byte"
            - name: phc
              type: string
          name: Verify
          out:
            - name: ok
              type: bool
            - name: err
              type: error
      - func:
          doc: |-
            IsCommon reports whether password is one of the ten thousand most common
            passwords, compared case-insensitively — PASSWORD as password. The empty
            password is not: refusing it is a length rule's job.
          forward: commonpw.IsCommon
          in:
            - name: password
              type: "[]byte"
          name: IsCommon
          out:
            - type: bool
      - func:
          doc: |-
            NeedsRehash reports whether the stored PHC hash was produced with cost
            parameters weaker than its scheme's current policy — call it after a
            successful Verify to transparently upgrade the stored hash.
          forward: corecrypto.NeedsRehash
          in:
            - name: phc
              type: string
          name: NeedsRehash
          out:
            - type: bool
    functions:
      - doc: |-
          Hash returns a PHC-string hash of password using the named scheme, with a
          fresh random salt and the scheme's current cost parameters. An unregistered
          algorithm returns UnknownPasswordAlgorithm. Store the returned string as-is.
        in:
          - name: a
            type: Algorithm
          - name: password
            type: "[]byte"
        name: Hash
        out:
          - name: phc
            type: string
          - name: err
            type: error
    imports:
      commonpw: github.com/kitsunium/sdk/internal/service/crypto/password/commonpw
      corecrypto: github.com/kitsunium/sdk/internal/core/crypto
    path: github.com/kitsunium/sdk/pkg/v1/crypto/password
    types:
      - doc: |-
          Algorithm is the stable identifier of a password-hashing scheme; it is also
          the PHC id segment of hashes that scheme produces. It is a defined type
          distinct from the other crypto-family Algorithm types (hash, mac, kdf, …), so
          the compiler rejects feeding a hash or KDF constant into a password call
          (V104) — the seven registries are separate keyspaces, and the type system now
          enforces that separation the way typed Format/Level discipline does elsewhere.
        name: Algorithm
        underlying: corecrypto.Algorithm
  - constants:
      - doc: |-
          Ed25519 is the EdDSA signature scheme over Curve25519 (RFC 8032): a 256-bit
          public key, fast constant-time verification, and no parameter choices.
        name: Ed25519
        type: Algorithm
        value: "\"ed25519\""
      - doc: |-
          ECDSAP256 is ECDSA over NIST P-256 with SHA-256 and ASN.1/DER signatures — the
          interoperable choice for JWT/X.509 ecosystems. Keys are DER-marshalled.
        name: ECDSAP256
        type: Algorithm
        value: "\"ecdsa-p256\""
    doc: |-
      Package sign is the detached digital-signature facade.

      Generate a keypair, sign bytes with the private key, verify with the public
      key. One verb-set, pluggable schemes:

      	pub, priv, _ := sign.GenerateKey(sign.Ed25519)
      	sig, _       := sign.Sign(sign.Ed25519, priv, message)
      	ok, _        := sign.Verify(sign.Ed25519, pub, message, sig)   // true

      # Keys are raw bytes — the private key is secret

      Keys and signatures are scheme-specific byte slices (Ed25519: 32-byte public,
      64-byte private, 64-byte signature). The private key is secret material: hold
      it like a password, never log it, and zero it when done. [Verify] runs in
      constant time with respect to the signature, so a failed check never leaks
      timing about WHERE it failed.

      # Signatures vs AEAD vs hashing

      Use signatures for authenticity + non-repudiation under a public key anyone
      can verify. Use the AEAD surface ([github.com/kitsunium/sdk/pkg/v1/crypto])
      for confidentiality with a shared secret, and the hash surface
      ([github.com/kitsunium/sdk/pkg/v1/crypto/hash]) for unkeyed public fingerprints.

      # Algorithms

      Importing this package activates both schemes with zero non-stdlib deps:

        - [Ed25519] — the modern default: small fixed-size keys, fast verification,
          nothing to misconfigure.
        - [ECDSAP256] — ECDSA over NIST P-256 with SHA-256 + ASN.1/DER signatures;
          the interoperable choice for JWT/X.509 ecosystems. Keys are DER-marshalled
          (PKIX public, SEC1 private).

      # Stable algorithm strings

      The [Algorithm] constants are frozen post-v1.0.0 — a signature produced today
      stays verifiable.
    functions:
      - doc: |-
          GenerateKey draws a fresh keypair for the named scheme, returning the public
          and private key bytes. An unregistered algorithm returns
          UnknownSignatureAlgorithm; treat priv as a secret.
        in:
          - name: a
            type: Algorithm
        name: GenerateKey
        out:
          - name: pub
          - name: priv
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          Sign returns a detached signature over message using priv under the named
          scheme. An unregistered algorithm returns UnknownSignatureAlgorithm; a
          malformed priv returns SigningFailed.
        in:
          - name: a
            type: Algorithm
          - name: priv
          - name: message
            type: "[]byte"
        name: Sign
        out:
          - name: sig
            type: "[]byte"
          - name: err
            type: error
      - doc: |-
          Verify reports whether sig is a valid signature for message under pub for the
          named scheme. An unregistered algorithm returns
          (false, UnknownSignatureAlgorithm); an invalid signature is (false, nil).
        in:
          - name: a
            type: Algorithm
          - name: pub
          - name: message
          - name: sig
            type: "[]byte"
        name: Verify
        out:
          - name: ok
            type: bool
          - name: err
            type: error
    imports:
      corecrypto: github.com/kitsunium/sdk/internal/core/crypto
    path: github.com/kitsunium/sdk/pkg/v1/crypto/sign
    types:
      - doc: |-
          Algorithm is the stable identifier of a signature scheme. It is a defined type
          distinct from the other crypto-family Algorithm types (hash, mac, kdf, …), so
          the compiler rejects feeding a hash or MAC constant into a signature call
          (V104) — the seven registries are separate keyspaces, and the type system now
          enforces that separation the way typed Format/Level discipline does elsewhere.
        name: Algorithm
        underlying: corecrypto.Algorithm
