apiVersion: kit.kitsunium/design/v2
domain: crypto
packages:
  - codes:
      - const:
          - doc: |-
              CodeDuplicateRegistration identifies an init-time collision on a scheme
              registry; two distinct schemes tried to claim the same Algorithm or wire id.
              Surfaced via panic at boot through the DuplicateRegistration sentinel.
            name: CodeDuplicateRegistration
            note: "range: 0.2.4.0 - 0.2.4.255"
            value: "0x00_02_04_01"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownAlgorithm identifies a Seal/SealAs call naming an Algorithm that no
              imported package has registered.
            name: CodeUnknownAlgorithm
            value: "0x00_02_04_02"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidKey identifies a NewKey call whose input was not exactly KeyLen
              bytes, or a cipher that rejected the key material.
            name: CodeInvalidKey
            value: "0x00_02_04_03"
        type: errs.Code
      - const:
          - doc: |-
              CodeDecryptionFailed identifies any Open failure — bad authentication tag,
              malformed framing, unknown wire id, or wrong key. It is deliberately
              undifferentiated so Open cannot become a padding/format oracle.
            name: CodeDecryptionFailed
            value: "0x00_02_04_04"
        type: errs.Code
      - const:
          - doc: |-
              CodeEntropyFailed identifies a crypto/rand failure while generating a nonce in
              Seal — a host entropy fault, not a caller error.
            name: CodeEntropyFailed
            value: "0x00_02_04_05"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownHashAlgorithm identifies a Sum/SumHex call naming a hash Algorithm
              that no imported package has registered.
            name: CodeUnknownHashAlgorithm
            value: "0x00_02_04_06"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownSignatureAlgorithm identifies a Sign/Verify/GenerateKey call naming
              an Algorithm that no imported signature package has registered.
            name: CodeUnknownSignatureAlgorithm
            value: "0x00_02_04_07"
        type: errs.Code
      - const:
          - doc: |-
              CodeSigningFailed identifies a Sign call whose private key was not well-formed
              for the scheme (e.g. the wrong length) — a caller data error, not a fault.
            name: CodeSigningFailed
            value: "0x00_02_04_08"
        type: errs.Code
      - const:
          - doc: |-
              CodeKeyGenerationFailed identifies a crypto/rand failure while generating a
              signing keypair in GenerateKey — a host entropy fault, not a caller error.
            name: CodeKeyGenerationFailed
            value: "0x00_02_04_09"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownKDFAlgorithm identifies a Subkey call naming a key-derivation
              Algorithm that no imported package has registered.
            name: CodeUnknownKDFAlgorithm
            value: "0x00_02_04_0A"
        type: errs.Code
      - const:
          - doc: |-
              CodeDerivationFailed identifies a Subkey call whose requested length exceeds
              the scheme's maximum output — a caller data error, not a fault.
            name: CodeDerivationFailed
            value: "0x00_02_04_0B"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownPasswordAlgorithm identifies a HashPassword/VerifyPassword call
              whose Algorithm (or PHC id segment) no imported package has registered.
            name: CodeUnknownPasswordAlgorithm
            value: "0x00_02_04_0C"
        type: errs.Code
      - const:
          - doc: |-
              CodePasswordHashFailed identifies a crypto/rand failure while generating a
              password salt in HashPassword — a host entropy fault, not a caller error.
            name: CodePasswordHashFailed
            value: "0x00_02_04_0D"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidPasswordHash identifies a stored PHC string that cannot be parsed
              during VerifyPassword — server-side data corruption, not a password mismatch.
            name: CodeInvalidPasswordHash
            value: "0x00_02_04_0E"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownMACAlgorithm identifies a MACTag/MACVerify call naming a MAC
              Algorithm that no imported package has registered.
            name: CodeUnknownMACAlgorithm
            value: "0x00_02_04_0F"
        type: errs.Code
      - const:
          - doc: |-
              CodeUnknownAgreementAlgorithm identifies a GenerateAgreementKey/AgreementShared
              call naming a key-agreement Algorithm that no imported package has registered.
            name: CodeUnknownAgreementAlgorithm
            value: "0x00_02_04_10"
        type: errs.Code
      - const:
          - doc: |-
              CodeAgreementFailed identifies an AgreementShared call whose scheme rejected
              the inputs (e.g. a low-order peer point) — wrapped, never leaking key bytes.
            name: CodeAgreementFailed
            value: "0x00_02_04_11"
        type: errs.Code
      - const:
          - doc: |-
              CodeStreamTruncated identifies a streaming Open that hit EOF before the
              final-flag chunk — the stream was cut short, not legitimately ended.
            name: CodeStreamTruncated
            value: "0x00_02_04_12"
        type: errs.Code
      - const:
          - doc: |-
              CodeInvalidKeyEnvelope identifies a structurally invalid key-envelope string
              passed to UnwrapKey — a corrupt $kenv$ frame, NOT a wrong-passphrase oracle.
            name: CodeInvalidKeyEnvelope
            value: "0x00_02_04_13"
        type: errs.Code
      - const:
          - doc: |-
              CodeDigestMismatch identifies a VerifyingReader whose computed digest did not
              match the expected hex at EOF. The digest is public, so the mismatch is
              non-oracle — it surfaces only on the terminal read, never mid-stream.
            name: CodeDigestMismatch
            value: "0x00_02_04_14"
        type: errs.Code
    constants:
      - name: KeyLen
        type: int
        value: "32"
      - name: Version
        type: byte
        value: "0x01"
    functions:
      - in:
          - name: a
            type: Agreement
        name: RegisterAgreement
        out:
          - type: Agreement
      - in:
          - name: name
            type: Algorithm
        name: LookupAgreement
        out:
          - name: a
            type: Agreement
          - name: ok
            type: bool
      - name: AvailableAgreements
        out:
          - type: "[]Algorithm"
      - in:
          - name: name
            type: Algorithm
        name: GenerateAgreementKey
        out:
          - name: pub
          - name: priv
            type: "[]byte"
          - name: err
            type: error
      - in:
          - name: name
            type: Algorithm
          - name: priv
          - name: peerPub
            type: "[]byte"
        name: AgreementShared
        out:
          - name: secret
            type: "[]byte"
          - name: err
            type: error
      - in:
          - name: d
            type: Deriver
        name: RegisterDeriver
        out:
          - type: Deriver
      - in:
          - name: name
            type: Algorithm
        name: LookupDeriver
        out:
          - name: d
            type: Deriver
          - name: ok
            type: bool
      - name: AvailableDerivers
        out:
          - type: "[]Algorithm"
      - in:
          - name: name
            type: Algorithm
          - name: secret
          - name: salt
            type: "[]byte"
          - name: info
            type: string
          - name: length
            type: int
        name: Subkey
        out:
          - name: subkey
            type: "[]byte"
          - name: err
            type: error
      - in:
          - name: h
            type: Hasher
        name: RegisterHasher
        out:
          - type: Hasher
      - in:
          - name: name
            type: Algorithm
        name: LookupHasher
        out:
          - name: h
            type: Hasher
          - name: ok
            type: bool
      - name: AvailableHashers
        out:
          - type: "[]Algorithm"
      - in:
          - name: name
            type: Algorithm
          - name: data
            type: "[]byte"
        name: Sum
        out:
          - name: digest
            type: "[]byte"
          - name: err
            type: error
      - in:
          - name: name
            type: Algorithm
        name: NewHash
        out:
          - name: h
            type: hash.Hash
          - name: err
            type: error
      - in:
          - name: name
            type: Algorithm
          - name: data
            type: "[]byte"
        name: SumHex
        out:
          - name: digest
            type: string
          - name: err
            type: error
      - in:
          - name: raw
            type: "[]byte"
        name: NewKey
        out:
          - name: key
            type: Key
          - name: err
            type: error
      - in:
          - name: m
            type: MAC
        name: RegisterMAC
        out:
          - type: MAC
      - in:
          - name: name
            type: Algorithm
        name: LookupMAC
        out:
          - name: m
            type: MAC
          - name: ok
            type: bool
      - name: AvailableMACs
        out:
          - type: "[]Algorithm"
      - in:
          - name: name
            type: Algorithm
          - name: key
            type: Key
          - name: message
            type: "[]byte"
        name: MACTag
        out:
          - name: tag
            type: "[]byte"
          - name: err
            type: error
      - in:
          - name: name
            type: Algorithm
          - name: key
            type: Key
          - name: message
          - name: tag
            type: "[]byte"
        name: MACVerify
        out:
          - name: ok
            type: bool
          - name: err
            type: error
      - in:
          - name: p
            type: PasswordHasher
        name: RegisterPasswordHasher
        out:
          - type: PasswordHasher
      - in:
          - name: name
            type: Algorithm
        name: LookupPasswordHasher
        out:
          - name: p
            type: PasswordHasher
          - name: ok
            type: bool
      - name: AvailablePasswordHashers
        out:
          - type: "[]Algorithm"
      - in:
          - name: name
            type: Algorithm
          - name: password
            type: "[]byte"
        name: HashPassword
        out:
          - name: phc
            type: string
          - name: err
            type: error
      - in:
          - name: password
            type: "[]byte"
          - name: phc
            type: string
        name: VerifyPassword
        out:
          - name: ok
            type: bool
          - name: err
            type: error
      - in:
          - name: phc
            type: string
        name: NeedsRehash
        out:
          - type: bool
      - in:
          - name: a
            type: AEAD
        name: Register
        out:
          - type: AEAD
      - in:
          - name: name
            type: Algorithm
        name: Lookup
        out:
          - name: a
            type: AEAD
          - name: ok
            type: bool
      - name: Available
        out:
          - type: "[]Algorithm"
      - in:
          - name: name
            type: Algorithm
          - name: key
            type: Key
          - name: plaintext
          - name: aad
            type: "[]byte"
        name: Seal
        out:
          - name: box
            type: "[]byte"
          - name: err
            type: error
      - in:
          - name: key
            type: Key
          - name: box
          - name: aad
            type: "[]byte"
        name: Open
        out:
          - name: plaintext
            type: "[]byte"
          - name: err
            type: error
      - in:
          - name: s
            type: Signer
        name: RegisterSigner
        out:
          - type: Signer
      - in:
          - name: name
            type: Algorithm
        name: LookupSigner
        out:
          - name: s
            type: Signer
          - name: ok
            type: bool
      - name: AvailableSigners
        out:
          - type: "[]Algorithm"
      - in:
          - name: name
            type: Algorithm
        name: GenerateKey
        out:
          - name: pub
          - name: priv
            type: "[]byte"
          - name: err
            type: error
      - in:
          - name: name
            type: Algorithm
          - name: priv
          - name: message
            type: "[]byte"
        name: Sign
        out:
          - name: sig
            type: "[]byte"
          - name: err
            type: error
      - in:
          - name: name
            type: Algorithm
          - name: pub
          - name: message
          - name: sig
            type: "[]byte"
        name: Verify
        out:
          - name: ok
            type: bool
          - name: err
            type: error
      - in:
          - name: s
            type: StreamSealer
        name: RegisterStreamSealer
        out:
          - type: StreamSealer
      - in:
          - name: name
            type: Algorithm
        name: LookupStreamSealer
        out:
          - name: s
            type: StreamSealer
          - name: ok
            type: bool
      - name: AvailableStreamSealers
        out:
          - type: "[]Algorithm"
      - in:
          - name: name
            type: Algorithm
          - name: key
            type: Key
          - name: dst
            type: io.Writer
          - name: aad
            type: "[]byte"
        name: SealStream
        out:
          - name: sealed
            type: io.WriteCloser
          - name: err
            type: error
      - in:
          - name: name
            type: Algorithm
          - name: key
            type: Key
          - name: src
            type: io.Reader
          - name: aad
            type: "[]byte"
        name: OpenStream
        out:
          - name: opened
            type: io.Reader
          - name: err
            type: error
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/crypto
    ports:
      - doc: |-
          AEAD is an authenticated-encryption-with-associated-data scheme. Each
          implementation owns its complete self-describing wire framing
          ([Version][id][nonce][ciphertext||tag]) so the registry can dispatch Open by
          reading the 1-byte id, and so the nonce — generated from crypto/rand inside
          Seal — never reaches a caller. Implementations MUST be safe for concurrent
          use and MUST return the shared non-oracle DecryptionFailed for every Open
          failure (bad tag, bad header, wrong key) so they cannot become an oracle.

          IFACE-PLUGIN: the registry hands plug-in AEAD instances back to callers behind
          this interface; concrete scheme types stay unexported in their own packages.
        methods:
          - doc: Algorithm reports the canonical key under which this scheme registers.
            name: Algorithm
            out:
              - type: Algorithm
          - doc: |-
              ID reports the 1-byte wire identifier embedded in the box header so Open
              can resolve the scheme without the caller naming it.
            name: ID
            out:
              - type: byte
          - doc: |-
              Seal encrypts plaintext, binding aad, and returns the self-framed box
              (Version + id + random nonce + ciphertext||tag).
            in:
              - name: key
                type: Key
              - name: plaintext
              - name: aad
                type: "[]byte"
            name: Seal
            out:
              - name: box
                type: "[]byte"
              - name: err
                type: error
          - doc: |-
              Open reverses Seal: it validates the framing, decrypts, and verifies aad,
              returning the plaintext or the non-oracle DecryptionFailed.
            in:
              - name: key
                type: Key
              - name: box
              - name: aad
                type: "[]byte"
            name: Open
            out:
              - name: plaintext
                type: "[]byte"
              - name: err
                type: error
        name: AEAD
      - doc: |-
          Agreement is a key-agreement scheme (Diffie-Hellman style): it produces an
          ephemeral keypair and derives a shared secret from a local private key and a
          peer public key. The raw Shared output is low-level key material and MUST be
          run through a KDF (a Deriver) before use as a key — the pkg/v1 facade never
          hands the raw secret back to generic callers. Implementations self-register
          via RegisterAgreement.

          IFACE-PLUGIN: the registry hands plug-in Agreement instances back behind this
          interface; concrete scheme types stay unexported in their own packages.
        methods:
          - doc: Algorithm reports the canonical key under which this scheme registers.
            name: Algorithm
            out:
              - type: Algorithm
          - doc: |-
              GenerateKey draws a fresh public/private keypair from the scheme's
              entropy source.
            name: GenerateKey
            out:
              - name: pub
              - name: priv
                type: "[]byte"
              - name: err
                type: error
          - doc: |-
              Shared derives the raw shared secret from priv and peerPub. The result
              MUST be passed through a KDF before any use as a key.
            in:
              - name: priv
              - name: peerPub
                type: "[]byte"
            name: Shared
            out:
              - name: secret
                type: "[]byte"
              - name: err
                type: error
        name: Agreement
      - doc: |-
          Deriver is a key-derivation function for KEY SEPARATION: it expands one
          high-entropy secret into independent, purpose-bound subkeys. It is NOT a
          password hash — the input must already be a strong key (an AEAD Key, an HKDF
          PRK, a Diffie-Hellman shared secret), never a human password. Password
          stretching (argon2id) is a separate, deliberately slow port.

          salt is optional domain randomness (nil is allowed); info is a context label
          that binds each subkey to its purpose ("aead-key", "mac-key", …) so two
          derivations from the same secret never collide. Implementations MUST be safe
          for concurrent use.

          IFACE-PLUGIN: the registry hands plug-in Deriver instances back to callers
          behind this interface; concrete scheme types stay unexported in their own
          packages.
        methods:
          - doc: Algorithm reports the canonical key under which this scheme registers.
            name: Algorithm
            out:
              - type: Algorithm
          - doc: |-
              Derive expands secret (with optional salt and the context label info) into
              a length-byte subkey, or DerivationFailed when length exceeds the scheme's
              maximum output.
            in:
              - name: secret
              - name: salt
                type: "[]byte"
              - name: info
                type: string
              - name: length
                type: int
            name: Derive
            out:
              - name: subkey
                type: "[]byte"
              - name: err
                type: error
        name: Deriver
      - doc: |-
          Hasher is a fingerprint / content-addressing hash scheme producing a
          non-keyed digest of arbitrary bytes (content IDs, cache keys, dedup keys).

          It is explicitly NOT authentication: no Hasher is a MAC, none takes a key,
          and a digest is public — never branch on a secret-dependent comparison of
          one. Keyed/authenticated integrity belongs to the AEAD and (future) signature
          ports. Implementations self-register via RegisterHasher.

          IFACE-PLUGIN: the registry hands plug-in Hasher instances back behind this
          interface; concrete scheme types stay unexported in their own packages.
        methods:
          - doc: Algorithm reports the canonical key under which this hasher registers.
            name: Algorithm
            out:
              - type: Algorithm
          - doc: New returns a fresh hash.Hash for streaming (io.Copy) or one-shot use.
            name: New
            out:
              - type: hash.Hash
        name: Hasher
      - doc: |-
          MAC is a detached message-authentication-code scheme: it binds a secret Key
          to a message and yields an authentication tag. Unlike a Hasher digest, a MAC
          tag IS secret-comparison-sensitive — callers MUST route equality through
          Verify (constant-time), never `==` or bytes.Equal, which is the exact inverse
          of the Hasher rule. Implementations self-register via RegisterMAC.

          IFACE-PLUGIN: the registry hands plug-in MAC instances back behind this
          interface; concrete scheme types stay unexported in their own packages.
        methods:
          - doc: Algorithm reports the canonical key under which this MAC registers.
            name: Algorithm
            out:
              - type: Algorithm
          - doc: Tag returns the authentication tag over message under key.
            in:
              - name: key
                type: Key
              - name: message
                type: "[]byte"
            name: Tag
            out:
              - type: "[]byte"
          - doc: |-
              Verify reports whether tag authenticates message under key, using a
              constant-time comparison so it never becomes a timing oracle.
            in:
              - name: key
                type: Key
              - name: message
              - name: tag
                type: "[]byte"
            name: Verify
            out:
              - type: bool
          - doc: |-
              New returns a fresh streaming hash.Hash keyed by key, paralleling
              Hasher.New, for incremental tagging over large inputs.
            in:
              - name: key
                type: Key
            name: New
            out:
              - type: hash.Hash
        name: MAC
      - doc: |-
          PasswordHasher stretches a human password into a slow, salted, self-describing
          PHC-string hash for storage. UNLIKE the Deriver (key separation) and Hasher
          (fingerprints) ports, this one is DELIBERATELY SLOW and salted: it is the only
          crypto surface meant to consume a low-entropy human secret.

          The returned hash is a PHC string (`$id$params$salt$digest`) that embeds the
          scheme id and its cost parameters, so Verify needs no side-channel: the stored
          string fully describes how to check it. Implementations MUST compare digests
          in constant time and MUST be safe for concurrent use.

          IFACE-PLUGIN: the registry hands plug-in PasswordHasher instances back to
          callers behind this interface; concrete scheme types stay unexported.
        methods:
          - doc: |-
              Algorithm reports the canonical key under which this scheme registers; it
              is also the PHC id segment (the first `$`-delimited field).
            name: Algorithm
            out:
              - type: Algorithm
          - doc: |-
              Hash returns a PHC-string hash of password with a fresh random salt and
              the scheme's current cost parameters, or PasswordHashFailed on an entropy
              fault.
            in:
              - name: password
                type: "[]byte"
            name: Hash
            out:
              - name: phc
                type: string
              - name: err
                type: error
          - doc: |-
              Verify reports whether password matches the stored PHC hash, comparing in
              constant time. A malformed phc returns InvalidPasswordHash; a genuine
              mismatch is (false, nil) so Verify is not an oracle on WHY it failed.
            in:
              - name: password
                type: "[]byte"
              - name: phc
                type: string
            name: Verify
            out:
              - name: ok
                type: bool
              - name: err
                type: error
          - doc: |-
              NeedsRehash reports whether phc was produced with cost parameters weaker
              than this scheme's current policy, so callers can transparently re-hash on
              a successful login. A malformed phc reports false (Verify surfaces the error).
            in:
              - name: phc
                type: string
            name: NeedsRehash
            out:
              - name: stale
                type: bool
        name: PasswordHasher
      - doc: |-
          Signer is a detached digital-signature scheme over a public/private keypair.
          Keys and signatures are scheme-specific byte slices (their lengths are fixed
          per scheme); the registry dispatches on the Algorithm name. Implementations
          MUST be safe for concurrent use, MUST NOT panic on a malformed key (return
          SigningFailed instead), and Verify MUST run in constant time with respect to
          the signature so it cannot become a timing oracle.

          Unlike the AEAD port, a signature scheme has no hidden nonce and no wire
          framing: the caller holds the keypair and chooses what bytes to sign. The
          private key is secret material — treat it like Key.Bytes(): never log it.

          IFACE-PLUGIN: the registry hands plug-in Signer instances back to callers
          behind this interface; concrete scheme types stay unexported in their own
          packages.
        methods:
          - doc: Algorithm reports the canonical key under which this scheme registers.
            name: Algorithm
            out:
              - type: Algorithm
          - doc: |-
              GenerateKey draws a fresh keypair from crypto/rand, returning the public
              and private key bytes (or KeyGenerationFailed on a host entropy fault).
            name: GenerateKey
            out:
              - name: pub
              - name: priv
                type: "[]byte"
              - name: err
                type: error
          - doc: |-
              Sign produces a detached signature over message using priv, or
              SigningFailed when priv is not a well-formed private key for this scheme.
            in:
              - name: priv
              - name: message
                type: "[]byte"
            name: Sign
            out:
              - name: sig
                type: "[]byte"
              - name: err
                type: error
          - doc: |-
              Verify reports whether sig is a valid signature for message under pub. A
              malformed key or signature is reported as false, never as a panic.
            in:
              - name: pub
              - name: message
              - name: sig
                type: "[]byte"
            name: Verify
            out:
              - name: ok
                type: bool
        name: Signer
      - doc: |-
          StreamSealer is a streaming authenticated-encryption scheme: it seals and
          opens an io.Writer / io.Reader pair in fixed-size chunks under a Key and
          associated data, extending the whole-buffer AEAD domain to arbitrarily large
          payloads. The Reader honours the hold-back contract: it MUST NOT surface a
          chunk's plaintext downstream before that chunk authenticates, and a stream cut
          short surfaces as StreamTruncated rather than as accepted plaintext (the
          final chunk carries a flag that a truncated stream never reaches).
          Implementations self-register via RegisterStreamSealer.

          IFACE-PLUGIN: the registry hands plug-in StreamSealer instances back behind
          this interface; concrete scheme types stay unexported in their own packages.
        methods:
          - doc: Algorithm reports the canonical key under which this scheme registers.
            name: Algorithm
            out:
              - type: Algorithm
          - doc: |-
              Writer wraps dst so writes are sealed under key with aad; Close writes
              the final authenticated chunk.
            in:
              - name: key
                type: Key
              - name: dst
                type: io.Writer
              - name: aad
                type: "[]byte"
            name: Writer
            out:
              - type: io.WriteCloser
              - type: error
          - doc: |-
              Reader wraps src so reads are opened under key with aad; a truncated
              stream surfaces as StreamTruncated from the returned reader.
            in:
              - name: key
                type: Key
              - name: src
                type: io.Reader
              - name: aad
                type: "[]byte"
            name: Reader
            out:
              - type: io.Reader
              - type: error
        name: StreamSealer
    sentinels:
      - var:
          - code: CodeUnknownAlgorithm
            doc: |-
              UnknownAlgorithm is returned by Seal/SealAs when no AEAD is registered
              under the requested Algorithm — typically a missing blank-import.
            name: UnknownAlgorithm
            private: "core/crypto.Seal: algorithm absent from registry; blank-import the scheme's package to register it"
            public: No AEAD is registered under that algorithm
            reason: UNKNOWN_ALGORITHM
          - code: CodeInvalidKey
            doc: |-
              InvalidKey is returned by NewKey when the supplied material is not
              exactly KeyLen bytes (or by an AEAD when the cipher rejects the key).
            name: InvalidKey
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/crypto.NewKey: key must be exactly KeyLen bytes"
            public: Encryption key has the wrong length
            reason: INVALID_KEY
          - code: CodeDecryptionFailed
            doc: |-
              DecryptionFailed is the single non-oracle error returned by Open for any
              failure — bad tag, malformed framing, unknown wire id, or wrong key.
            name: DecryptionFailed
            options:
              - errs.WithHTTPStatus(httpBadRequest)
              - errs.WithExitCode(exitDataErr)
            private: "core/crypto.Open: authentication, framing, or key check failed (cause withheld to avoid an oracle)"
            public: Decryption failed
            reason: DECRYPTION_FAILED
          - code: CodeEntropyFailed
            doc: |-
              EntropyFailed wraps a crypto/rand failure while generating a Seal nonce;
              it signals a host entropy fault rather than a caller error.
            name: EntropyFailed
            private: "core/crypto.Seal: crypto/rand.Read failed while generating a nonce"
            public: Could not gather entropy for encryption
            reason: ENTROPY_FAILED
          - code: CodeUnknownHashAlgorithm
            doc: |-
              UnknownHashAlgorithm is returned by Sum/SumHex when no Hasher is
              registered under the requested Algorithm — typically a missing blank-import.
            name: UnknownHashAlgorithm
            private: "core/crypto.Sum: hash algorithm absent from registry; blank-import the hasher's package to register it"
            public: No hasher is registered under that algorithm
            reason: UNKNOWN_HASH_ALGORITHM
          - code: CodeUnknownSignatureAlgorithm
            doc: |-
              UnknownSignatureAlgorithm is returned by Sign/Verify/GenerateKey when no
              Signer is registered under the requested Algorithm — usually a missing
              blank-import of the scheme's package.
            name: UnknownSignatureAlgorithm
            private: "core/crypto.Sign: signature algorithm absent from registry; blank-import the signer's package to register it"
            public: No signer is registered under that algorithm
            reason: UNKNOWN_SIGNATURE_ALGORITHM
          - code: CodeSigningFailed
            doc: |-
              SigningFailed is returned by Sign when the supplied private key is not
              well-formed for the scheme (e.g. the wrong length).
            name: SigningFailed
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/crypto.Sign: private key is not valid for the scheme (wrong length or encoding)"
            public: Signing key is malformed
            reason: SIGNING_FAILED
          - code: CodeKeyGenerationFailed
            doc: |-
              KeyGenerationFailed wraps a crypto/rand failure while generating a signing
              keypair; it signals a host entropy fault rather than a caller error.
            name: KeyGenerationFailed
            private: "core/crypto.GenerateKey: crypto/rand failed while generating a signing keypair"
            public: Could not gather entropy for key generation
            reason: KEY_GENERATION_FAILED
          - code: CodeUnknownKDFAlgorithm
            doc: |-
              UnknownKDFAlgorithm is returned by Subkey when no Deriver is registered
              under the requested Algorithm — usually a missing blank-import.
            name: UnknownKDFAlgorithm
            private: "core/crypto.Subkey: KDF algorithm absent from registry; blank-import the deriver's package to register it"
            public: No key-derivation function is registered under that algorithm
            reason: UNKNOWN_KDF_ALGORITHM
          - code: CodeDerivationFailed
            doc: |-
              DerivationFailed is returned by Subkey when the requested length exceeds
              the scheme's maximum output (e.g. HKDF's 255*HashLen ceiling).
            name: DerivationFailed
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/crypto.Subkey: requested length exceeds the scheme's maximum output"
            public: Requested derived-key length is too large
            reason: DERIVATION_FAILED
          - code: CodeUnknownPasswordAlgorithm
            doc: |-
              UnknownPasswordAlgorithm is returned by HashPassword/VerifyPassword when no
              PasswordHasher is registered under the requested Algorithm or PHC id —
              usually a missing blank-import.
            name: UnknownPasswordAlgorithm
            private: "core/crypto.VerifyPassword: password scheme absent from registry; blank-import the hasher's package to register it"
            public: No password hasher is registered under that algorithm
            reason: UNKNOWN_PASSWORD_ALGORITHM
          - code: CodePasswordHashFailed
            doc: |-
              PasswordHashFailed wraps a crypto/rand failure while generating a password
              salt; it signals a host entropy fault rather than a caller error.
            name: PasswordHashFailed
            private: "core/crypto.HashPassword: crypto/rand failed while generating a salt"
            public: Could not gather entropy for password hashing
            reason: PASSWORD_HASH_FAILED
          - code: CodeInvalidPasswordHash
            doc: |-
              InvalidPasswordHash is returned by VerifyPassword when the stored PHC
              string cannot be parsed — server-side data corruption, never a mismatch.
            name: InvalidPasswordHash
            private: "core/crypto.VerifyPassword: stored PHC string is not well-formed for its scheme"
            public: Stored password hash is malformed
            reason: INVALID_PASSWORD_HASH
          - code: CodeUnknownMACAlgorithm
            doc: |-
              UnknownMACAlgorithm is returned by MACTag/MACVerify when no MAC is
              registered under the requested Algorithm — typically a missing blank-import.
            name: UnknownMACAlgorithm
            private: "core/crypto.MACTag: MAC algorithm absent from registry; blank-import the scheme's package to register it"
            public: No MAC is registered under that algorithm
            reason: UNKNOWN_MAC_ALGORITHM
          - code: CodeUnknownAgreementAlgorithm
            doc: |-
              UnknownAgreementAlgorithm is returned by GenerateAgreementKey/AgreementShared
              when no Agreement scheme is registered under the requested Algorithm.
            name: UnknownAgreementAlgorithm
            private: "core/crypto.AgreementShared: agreement algorithm absent from registry; blank-import the scheme's package to register it"
            public: No key-agreement scheme is registered under that algorithm
            reason: UNKNOWN_AGREEMENT_ALGORITHM
          - code: CodeAgreementFailed
            doc: |-
              AgreementFailed wraps an AgreementShared fault where the scheme rejected the
              inputs (e.g. a low-order peer point); it never leaks key bytes.
            name: AgreementFailed
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/crypto.AgreementShared: the scheme rejected the inputs (cause withheld of key bytes)"
            public: Key agreement failed to derive a shared secret
            reason: AGREEMENT_FAILED
          - code: CodeStreamTruncated
            doc: |-
              StreamTruncated is returned by a streaming Open reader when the stream ends
              before its final-flag chunk — a truncated or tampered stream, not a clean EOF.
            name: StreamTruncated
            options:
              - errs.WithExitCode(exitDataErr)
            private: "core/crypto.OpenStream: reader hit EOF before decrypting the final-flag chunk"
            public: The authenticated stream was truncated before its final chunk
            reason: STREAM_TRUNCATED
          - code: CodeInvalidKeyEnvelope
            doc: |-
              InvalidKeyEnvelope is returned by UnwrapKey when the supplied $kenv$ string
              is structurally invalid (bad field count, magic, version, kdf/aead id, or
              base64). It signals corruption only — a wrong passphrase surfaces the
              non-oracle DecryptionFailed instead, so this is no key/password oracle.
            name: InvalidKeyEnvelope
            options:
              - errs.WithExitCode(exitDataErr)
            private: "service/crypto/key/keyenvelope.UnwrapKey: $kenv$ string is not well-formed"
            public: Key envelope is malformed
            reason: INVALID_KEY_ENVELOPE
          - code: CodeDigestMismatch
            doc: |-
              DigestMismatch is returned by a VerifyingReader on its final (EOF) read when
              the computed digest does not match the expected value. The digest is public,
              so the comparison is non-oracle and surfaces only at the terminal read.
            name: DigestMismatch
            options:
              - errs.WithExitCode(exitDataErr)
            private: "service/crypto/hash/stdhash.VerifyingReader: computed digest differs from the expected hex at EOF"
            public: Stream digest does not match the expected value
            reason: DIGEST_MISMATCH
          - code: CodeDuplicateRegistration
            doc: |-
              DuplicateRegistration is the conflict every registrar refuses at boot: a
              distinct scheme already holds the Algorithm — or, for an AEAD, the wire
              id — a second one claims. The registrar panics with conflictText of it,
              so the panic carries the dotted-quad header AND the key that collided.
            name: DuplicateRegistration
            private: "core/crypto: a distinct scheme already holds this Algorithm, or this AEAD wire id"
            public: A scheme is already registered under that algorithm or wire id
            reason: DUPLICATE_REGISTRATION
