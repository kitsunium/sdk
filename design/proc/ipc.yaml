apiVersion: kit.kitsunium/design/v2
domain: proc/ipc
packages:
  - constants:
      - name: CodeMisconfigured
        type: errs.Code
        value: "0x00_03_5B_01"
      - name: CodeDirectoryUnsafe
        type: errs.Code
        value: "0x00_03_5B_02"
      - name: CodeInUse
        type: errs.Code
        value: "0x00_03_5B_03"
      - name: CodeListenFailed
        type: errs.Code
        value: "0x00_03_5B_04"
      - name: CodePeerRefused
        type: errs.Code
        value: "0x00_03_5B_05"
      - name: CodeDialFailed
        type: errs.Code
        value: "0x00_03_5B_06"
      - name: CodeEndpointForeign
        type: errs.Code
        value: "0x00_03_5B_07"
      - name: CodeClosed
        type: errs.Code
        value: "0x00_03_5B_08"
      - name: CodePathUnsafe
        type: errs.Code
        value: "0x00_03_5B_09"
    imports:
      errs: github.com/kitsunium/sdk/internal/kernel/errs
    path: github.com/kitsunium/sdk/internal/core/proc/ipc
    ports:
      - doc: |-
          Listener is the accepting end of a private socket: it hands out the
          connections of admitted peers only, and closes and counts the others.

          It is frozen at these five methods (ADR 0039): a method added to a
          published interface breaks every double a caller wrote, so a capability
          that comes later is a sibling interface a Listener may also implement.
        methods:
          - doc: |-
              Accept returns the next connection of an admitted peer. A peer the
              kernel names and the configuration does not admit is closed at once,
              counted by Refused, and never returned. After Close it returns the
              CLOSED sentinel.
            name: Accept
            out:
              - type: "*Conn"
              - type: error
          - doc: Addr is the endpoint's address.
            name: Addr
            out:
              - type: net.Addr
          - doc: Close stops accepting and releases the endpoint.
            name: Close
            out:
              - type: error
          - doc: |-
              Path is the endpoint's configured path — the socket file, or the path
              a Windows pipe's name is derived from.
            name: Path
            out:
              - type: string
          - doc: |-
              Refused is how many connections Accept closed because their peer was
              not admitted.
            name: Refused
            out:
              - type: int64
        name: Listener
      - doc: |-
          Dialer is the connecting end of a private socket: it reaches the listener
          its configuration names and refuses — before a byte is sent — an endpoint
          it cannot trust. It is frozen at one method (ADR 0039).
        methods:
          - doc: |-
              Dial connects within ctx. Peer names the listener where the kernel
              does; a listener of an account that is not admitted is refused.
            in:
              - name: ctx
                type: context.Context
            name: Dial
            out:
              - type: "*Conn"
              - type: error
        name: Dialer
    types:
      - name: PeerValue
        struct:
          fields:
            - name: UID
            - name: GID
              type: int
            - name: PID
              type: int
            - name: SID
              type: string
            - name: Verified
              type: bool
      - name: Conn
        struct:
          fields:
            - embedded: true
              type: net.Conn
            - name: Peer
              type: PeerValue
    variables:
      - name: Misconfigured
        type: "*errs.Error"
      - name: DirectoryUnsafe
        type: "*errs.Error"
      - name: InUse
        type: "*errs.Error"
      - name: ListenFailed
        type: "*errs.Error"
      - name: PeerRefused
        type: "*errs.Error"
      - name: DialFailed
        type: "*errs.Error"
      - name: EndpointForeign
        type: "*errs.Error"
      - name: Closed
        type: "*errs.Error"
      - name: PathUnsafe
        type: "*errs.Error"
  - functions:
      - in:
          - name: cfg
            type: "*Config"
        name: NewListener
        out:
          - type: "*Listener"
          - type: error
      - in:
          - name: cfg
            type: "*Config"
        name: NewDialer
        out:
          - type: "*Dialer"
          - type: error
      - in:
          - name: ctx
            type: context.Context
          - name: cfg
            type: "*Config"
        name: Dial
        out:
          - type: "*coreipc.Conn"
          - type: error
      - in:
          - name: app
            type: string
        name: RuntimeDir
        out:
          - type: string
    imports:
      coreipc: github.com/kitsunium/sdk/internal/core/proc/ipc
    path: github.com/kitsunium/sdk/internal/service/proc/ipc
    types:
      - name: Config
        struct:
          fields:
            - name: Path
              type: string
            - name: AllowUIDs
            - name: AllowGIDs
              type: "[]int"
      - methods:
          - name: Accept
            out:
              - type: "*coreipc.Conn"
              - type: error
            recv: pointer
          - name: Refused
            out:
              - type: int64
            recv: pointer
          - name: Addr
            out:
              - type: net.Addr
            recv: pointer
          - name: Path
            out:
              - type: string
            recv: pointer
          - name: Close
            out:
              - type: error
            recv: pointer
        name: Listener
        struct:
          unexported: true
      - methods:
          - in:
              - name: ctx
                type: context.Context
            name: Dial
            out:
              - type: "*coreipc.Conn"
              - type: error
            recv: pointer
        name: Dialer
        struct:
          unexported: true
  - aliases:
      - name: Config
        target: svcipc.Config
      - name: Peer
        target: coreipc.PeerValue
      - name: Conn
        target: coreipc.Conn
      - name: Listener
        target: coreipc.Listener
      - name: Dialer
        target: coreipc.Dialer
    constants:
      - name: CodeMisconfigured
        type: errs.Code
        value: "0x00_03_5B_01"
      - name: CodeDirectoryUnsafe
        type: errs.Code
        value: "0x00_03_5B_02"
      - name: CodeInUse
        type: errs.Code
        value: "0x00_03_5B_03"
      - name: CodeListenFailed
        type: errs.Code
        value: "0x00_03_5B_04"
      - name: CodePeerRefused
        type: errs.Code
        value: "0x00_03_5B_05"
      - name: CodeDialFailed
        type: errs.Code
        value: "0x00_03_5B_06"
      - name: CodeEndpointForeign
        type: errs.Code
        value: "0x00_03_5B_07"
      - name: CodeClosed
        type: errs.Code
        value: "0x00_03_5B_08"
      - name: CodePathUnsafe
        type: errs.Code
        value: "0x00_03_5B_09"
    functions:
      - in:
          - name: cfg
            type: Config
        name: Listen
        out:
          - type: Listener
          - type: error
      - in:
          - name: cfg
            type: Config
        name: NewDialer
        out:
          - type: Dialer
          - type: error
      - in:
          - name: ctx
            type: context.Context
          - name: cfg
            type: Config
        name: Dial
        out:
          - type: "*Conn"
          - type: error
      - in:
          - name: app
            type: string
        name: RuntimeDir
        out:
          - type: string
    imports:
      coreipc: github.com/kitsunium/sdk/internal/core/proc/ipc
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svcipc: github.com/kitsunium/sdk/internal/service/proc/ipc
    path: github.com/kitsunium/sdk/pkg/v1/proc/ipc
