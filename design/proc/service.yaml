            type: Sub
            typed: true
            value: "1"
      - const:
          - doc: SubStartPre runs ExecStartPre=.
            name: SubStartPre
            reexport: coresvc.SubStartPre
            type: Sub
            typed: true
            value: "2"
      - const:
          - doc: SubStart runs ExecStart= until the unit is up.
            name: SubStart
            reexport: coresvc.SubStart
            type: Sub
            typed: true
            value: "3"
      - const:
          - doc: SubStartPost runs ExecStartPost=.
            name: SubStartPost
            reexport: coresvc.SubStartPost
            type: Sub
            typed: true
            value: "4"
