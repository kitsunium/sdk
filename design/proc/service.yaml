            typed: true
            value: "5"
      - const:
          - doc: SubExited is up without a process (RemainAfterExit=).
            name: SubExited
            reexport: coresvc.SubExited
            type: Sub
            typed: true
            value: "6"
      - const:
          - doc: SubReload runs ExecReload=.
            name: SubReload
            reexport: coresvc.SubReload
            type: Sub
            typed: true
            value: "7"
      - const:
          - doc: SubReloadSignal waits for RELOADING=1 after ReloadSignal=.
            name: SubReloadSignal
            reexport: coresvc.SubReloadSignal
            type: Sub
            typed: true
            value: "8"
      - const:
          - doc: SubReloadNotify waits for READY=1 after RELOADING=1.
            name: SubReloadNotify
            reexport: coresvc.SubReloadNotify
            type: Sub
            typed: true
            value: "9"
      - const:
          - doc: SubReloadPost runs ExecReloadPost=.
            name: SubReloadPost
            reexport: coresvc.SubReloadPost
            type: Sub
            typed: true
            value: "10"
      - const:
          - doc: SubStop runs ExecStop=.
            name: SubStop
            reexport: coresvc.SubStop
            type: Sub
            typed: true
            value: "11"
      - const:
          - doc: SubStopWatchdog waits after WatchdogSignal=.
            name: SubStopWatchdog
            reexport: coresvc.SubStopWatchdog
            type: Sub
            typed: true
            value: "12"
      - const:
          - doc: SubStopSigterm waits after KillSignal=.
