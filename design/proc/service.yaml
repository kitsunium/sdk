            reexport: coresvc.RestartAlways
            type: Restart
            typed: true
            value: "6"
      - const:
          - doc: |-
              RestartModeNormal publishes the failed (or inactive) state, then auto-
              restart.
            name: RestartModeNormal
            reexport: coresvc.RestartModeNormal
            type: RestartMode
            typed: true
            value: "0"
      - const:
          - doc: RestartModeDirect goes to auto-restart without publishing the failure.
