            type: Sub
            typed: true
            value: "13"
      - const:
          - doc: SubStopSigkill waits after FinalKillSignal=.
            name: SubStopSigkill
            reexport: coresvc.SubStopSigkill
            type: Sub
            typed: true
            value: "14"
      - const:
          - doc: SubStopPost runs ExecStopPost=.
            name: SubStopPost
            reexport: coresvc.SubStopPost
            type: Sub
            typed: true
            value: "15"
      - const:
          - doc: |-
              SubFinalWatchdog waits after WatchdogSignal= sent to what ExecStopPost=
              left.
            name: SubFinalWatchdog
            reexport: coresvc.SubFinalWatchdog
            type: Sub
            typed: true
            value: "16"
      - const:
          - doc: SubFinalSigterm waits after KillSignal= sent to what ExecStopPost= left.
            name: SubFinalSigterm
            reexport: coresvc.SubFinalSigterm
            type: Sub
            typed: true
            value: "17"
      - const:
          - doc: |-
              SubFinalSigkill waits after FinalKillSignal= sent to what ExecStopPost=
              left.
            name: SubFinalSigkill
            reexport: coresvc.SubFinalSigkill
            type: Sub
            typed: true
            value: "18"
      - const:
          - doc: SubFailed is failed.
            name: SubFailed
            reexport: coresvc.SubFailed
            type: Sub
            typed: true
            value: "19"
      - const:
          - doc: SubAutoRestart waits out the restart delay.
            name: SubAutoRestart
            reexport: coresvc.SubAutoRestart
            type: Sub
            typed: true
            value: "20"
      - const:
          - doc: |-
              SubRunningRevalidating is a Type=dbus unit up without its BusName= owned,
              given two seconds to own it again before it stops.
            name: SubRunningRevalidating
            reexport: coresvc.SubRunningRevalidating
            type: Sub
            typed: true
            value: "21"
      - const:
          - doc: ResultSuccess is a clean end.
            name: ResultSuccess
            reexport: coresvc.ResultSuccess
            type: Result
            typed: true
            value: "0"
      - const:
          - doc: ResultResources is a command that could not be spawned.
            name: ResultResources
            reexport: coresvc.ResultResources
            type: Result
            typed: true
            value: "1"
      - const:
          - doc: ResultProtocol is a notify unit whose main process ended before READY=1.
            name: ResultProtocol
            reexport: coresvc.ResultProtocol
            type: Result
            typed: true
            value: "2"
      - const:
          - doc: ResultTimeout is a start, stop, reload or runtime limit that expired.
            name: ResultTimeout
            reexport: coresvc.ResultTimeout
            type: Result
            typed: true
            value: "3"
      - const:
          - doc: ResultExitCode is an unclean exit code.
            name: ResultExitCode
            reexport: coresvc.ResultExitCode
            type: Result
            typed: true
            value: "4"
      - const:
          - doc: ResultSignal is an unclean signal.
            name: ResultSignal
            reexport: coresvc.ResultSignal
            type: Result
            typed: true
            value: "5"
      - const:
          - doc: ResultCoreDump is an unclean signal that dumped core.
            name: ResultCoreDump
            reexport: coresvc.ResultCoreDump
            type: Result
            typed: true
            value: "6"
      - const:
          - doc: ResultWatchdog is a missed keep-alive, WATCHDOG=trigger, or Fail.
            name: ResultWatchdog
            reexport: coresvc.ResultWatchdog
            type: Result
            typed: true
            value: "7"
      - const:
          - doc: ResultStartLimitHit is a start the limiter refused.
            name: ResultStartLimitHit
            reexport: coresvc.ResultStartLimitHit
            type: Result
            typed: true
            value: "8"
      - const:
          - doc: ResultOOMKill is an OOM kill in the unit's cgroup (S0g).
            name: ResultOOMKill
            reexport: coresvc.ResultOOMKill
            type: Result
            typed: true
            value: "9"
      - const:
          - doc: ResultExecCondition is an ExecCondition= that said skip.
            name: ResultExecCondition
            reexport: coresvc.ResultExecCondition
            type: Result
            typed: true
            value: "10"
      - const:
          - doc: |-
              FlagArgv0 is "@": the second word is argv[0]; with FlagShell, the shell is
              a login shell.
            name: FlagArgv0
            reexport: coresvc.FlagArgv0
            type: CommandFlags
            typed: true
            value: "1"
      - const:
          - doc: "FlagIgnoreFailure is \"-\": a failure is recorded and read as a success."
            name: FlagIgnoreFailure
            reexport: coresvc.FlagIgnoreFailure
            type: CommandFlags
            typed: true
            value: "2"
      - const:
          - doc: "FlagNoEnvExpand is \":\": $VAR and ${VAR} are not expanded."
            name: FlagNoEnvExpand
            reexport: coresvc.FlagNoEnvExpand
            type: CommandFlags
            typed: true
            value: "4"
      - const:
          - doc: |-
              FlagFullPrivileges is "+": the command runs without the unit's credentials
              and confinement, on Config.AllowPrivilegedControl only.
            name: FlagFullPrivileges
            reexport: coresvc.FlagFullPrivileges
            type: CommandFlags
            typed: true
            value: "8"
      - const:
          - doc: |-
              FlagNoCredentials is "!": the command runs without User=, Group= and
              SupplementaryGroups=, on Config.AllowPrivilegedControl only.
            name: FlagNoCredentials
            reexport: coresvc.FlagNoCredentials
            type: CommandFlags
            typed: true
            value: "16"
      - const:
          - doc: |-
              FlagShell is "|": the command runs through the shell's -c, or is the shell
              alone.
            name: FlagShell
            reexport: coresvc.FlagShell
            type: CommandFlags
            typed: true
            value: "32"
      - const:
          - name: CodeConfigInvalid
            reexport: coresvc.CodeConfigInvalid
            type: errs.Code
            typed: true
            value: "0x00_03_69_01"
          - name: CodeDirectiveUnsupported
            reexport: coresvc.CodeDirectiveUnsupported
            type: errs.Code
            typed: true
            value: "0x00_03_69_02"
          - name: CodeCommandInvalid
            reexport: coresvc.CodeCommandInvalid
            type: errs.Code
            typed: true
            value: "0x00_03_69_03"
          - name: CodeStartFailed
            reexport: coresvc.CodeStartFailed
            type: errs.Code
            typed: true
            value: "0x00_03_69_04"
          - name: CodeStartLimitHit
            reexport: coresvc.CodeStartLimitHit
            type: errs.Code
            typed: true
            value: "0x00_03_69_05"
          - name: CodeReloadFailed
            reexport: coresvc.CodeReloadFailed
            type: errs.Code
            typed: true
            value: "0x00_03_69_06"
          - name: CodeReloadUnsupported
            reexport: coresvc.CodeReloadUnsupported
            type: errs.Code
            typed: true
            value: "0x00_03_69_07"
          - name: CodeJobCanceled
            reexport: coresvc.CodeJobCanceled
            type: errs.Code
            typed: true
            value: "0x00_03_69_08"
          - name: CodeUnitClosed
            reexport: coresvc.CodeUnitClosed
            type: errs.Code
            typed: true
            value: "0x00_03_69_09"
          - name: CodePrivilegeRefused
            reexport: coresvc.CodePrivilegeRefused
            type: errs.Code
            typed: true
            value: "0x00_03_69_0A"
          - name: CodeExitUnknown
            reexport: coresvc.CodeExitUnknown
            type: errs.Code
            typed: true
            value: "0x00_03_69_0B"
          - name: CodeHandoverInvalid
            reexport: coresvc.CodeHandoverInvalid
            type: errs.Code
            typed: true
            value: "0x00_03_69_0C"
          - name: CodeHandoverMismatch
            reexport: coresvc.CodeHandoverMismatch
            type: errs.Code
            typed: true
            value: "0x00_03_69_0D"
          - name: CodeReexecFailed
            reexport: coresvc.CodeReexecFailed
            type: errs.Code
            typed: true
            value: "0x00_03_69_0E"
        doc: |-
          The codes, for errs.HasCode: a refused configuration (CONFIG_INVALID,
          DIRECTIVE_UNSUPPORTED, PRIVILEGE_REFUSED, COMMAND_INVALID) is the caller's to
          fix, a job's outcome (START_FAILED, START_LIMIT_HIT, RELOAD_FAILED,
          RELOAD_UNSUPPORTED, JOB_CANCELED, UNIT_CLOSED) is the unit's, and
          EXIT_UNKNOWN is an adopted process's end.
      - alias:
          - doc: |-
              Config is one service unit: systemd.service(5)'s directives as typed
              values, the template its commands are spawned from, and the ports — the
              engine's configuration (ADR 0214 §9).
            name: Config
            target: svc.Config
          - doc: |-
              Unit is one service unit, driven by one actor over a pure reducer (ADR
              0214 §3).
            name: Unit
            target: svc.Unit
          - doc: |-
              Handover is what an outgoing image hands the incoming one (S0h): Freeze,
              Reexec, TakeHandover, Resume.
            name: Handover
            target: svc.HandoverState
          - doc: Spawner starts the processes of a unit; proc/exec's Start by default.
            name: Spawner
            target: coresvc.Spawner
          - doc: "Attacher adopts a process the engine did not start: MAINPID=, PIDFile=."
            name: Attacher
            target: coresvc.Attacher
          - doc: |-
              CgroupKill is the unit's control group: who belongs to it, and every
              process of it signalled at once.
            name: CgroupKill
            target: coresvc.CgroupKill
          - doc: |-
              CgroupMembers is the sibling of CgroupKill a control group that lists its
              processes offers: a Type=forking unit guesses its main process among them.
            name: CgroupMembers
            target: coresvc.CgroupMembers
          - doc: |-
              CgroupUnit is the sibling of CgroupKill a unit's control group offers
              when it runs the cgroup modes — KillMode=control-group and mixed,
              ExitType=cgroup, Delegate=, OOMPolicy=; proc/cgroup's Linux group is one.
            name: CgroupUnit
            target: coresvc.CgroupUnit
          - doc: "StoredFD is one descriptor of a unit's store, as Unit.FDStore lists it."
            name: StoredFD
            target: coresvc.StoredFDValue
          - doc: NotifySource is where a unit's sd_notify messages come from.
            name: NotifySource
            target: coresvc.NotifySource
          - doc: |-
              BusWatcher follows who owns a Type=dbus unit's BusName=; pkg/v1/proc/dbus's
              Conn is one.
            name: BusWatcher
            target: coresvc.BusWatcher
          - doc: |-
              Clock is what every wait of a unit runs on: pkg/v1/clock's System and
              ManualClock are clocks here.
            name: Clock
            target: coresvc.Clock
          - doc: Type is Type=.
            name: Type
            target: coresvc.Type
          - doc: Restart is Restart=.
            name: Restart
            target: coresvc.Restart
          - doc: RestartMode is RestartMode=.
            name: RestartMode
            target: coresvc.RestartMode
          - doc: KillMode is KillMode=; its zero is control-group with a CgroupUnit.
            name: KillMode
            target: coresvc.KillMode
          - doc: ExitType is ExitType=.
            name: ExitType
            target: coresvc.ExitType
          - doc: NotifyAccess is NotifyAccess=.
            name: NotifyAccess
            target: coresvc.NotifyAccess
          - doc: TimeoutMode is TimeoutStartFailureMode= or TimeoutStopFailureMode=.
            name: TimeoutMode
            target: coresvc.TimeoutMode
          - doc: OOMPolicy is OOMPolicy=.
            name: OOMPolicy
            target: coresvc.OOMPolicy
          - doc: Preserve is FileDescriptorStorePreserve=.
            name: Preserve
            target: coresvc.Preserve
          - doc: Toggle is a boolean directive whose default is yes.
            name: Toggle
            target: coresvc.Toggle
          - doc: ProtectSystem is ProtectSystem=.
            name: ProtectSystem
            target: coresvc.ProtectSystem
          - doc: PrivateTmp is PrivateTmp=.
            name: PrivateTmp
            target: coresvc.PrivateTmp
          - doc: BindPath is one entry of BindPaths= or BindReadOnlyPaths=.
            name: BindPath
            target: coresvc.BindPathValue
          - doc: TemporaryFileSystem is one entry of TemporaryFileSystem=.
            name: TemporaryFileSystem
            target: coresvc.TemporaryFileSystemValue
          - doc: SystemCallFilter is SystemCallFilter=, an allow-list or a deny-list.
            name: SystemCallFilter
            target: coresvc.SystemCallFilterValue
          - doc: State is where a unit stands.
            name: State
            target: coresvc.State
          - doc: "Sub is the step a unit is at: systemd's SubState."
            name: Sub
            target: coresvc.Sub
          - doc: "Result is why a run of a unit ended: systemd's Result=."
            name: Result
            target: coresvc.Result
          - doc: CommandFlags are the prefixes of one Exec*= command.
            name: CommandFlags
            target: coresvc.CommandFlags
          - doc: Command is one Exec*= command, its prefixes parsed.
            name: Command
            target: coresvc.CommandValue
          - doc: |-
              ExitStatusSet is SuccessExitStatus=, RestartPreventExitStatus= or
              RestartForceExitStatus=.
            name: ExitStatusSet
            target: coresvc.ExitStatusValue
          - doc: Notification is one sd_notify message as a NotifySource hands it over.
            name: Notification
            target: coresvc.NotifyValue
          - doc: "Snapshot is a unit at one instant: what Unit.State returns."
            name: Snapshot
            target: coresvc.StateValue
          - doc: Event is one published change of a unit.
            name: Event
            target: coresvc.EventValue
      - func:
          doc: NewUnit checks cfg and starts an inactive unit; Start starts it.
          forward: svc.NewUnit
          in:
            - name: cfg
              type: "*Config"
          name: NewUnit
          out:
            - type: "*Unit"
            - type: error
      - func:
          doc: |-
            SpawnInstance makes and starts the unit of one accepted connection
            (Accept=yes): a copy of template named instance, conn handed to its
            ExecStart= at fd 3 and closed at its end; the unit is returned with
            Start's error once it was made.
          forward: svc.SpawnInstance
          in:
            - name: ctx
              type: context.Context
            - name: template
              type: "*Config"
            - name: instance
              type: string
            - name: conn
              type: "*os.File"
          name: SpawnInstance
          out:
            - type: "*Unit"
            - type: error
      - func:
          doc: |-
            Freeze hands units over (S0h): each unit's actor ends without stopping
            a process, its state and descriptors kept in the hand-over.
          forward: svc.Freeze
          in:
            - name: ctx
              type: context.Context
            - name: units
              type: "[]*Unit"
          name: Freeze
          out:
            - type: "*Handover"
            - type: error
      - func:
          doc: |-
            Resume makes the unit cfg names from the state h holds for it: its
            processes held again, its timers, watches and store as they were.
          forward: svc.Resume
          in:
            - name: cfg
              type: "*Config"
            - name: h
              type: "*Handover"
          name: Resume
          out:
            - type: "*Unit"
            - type: error
      - func:
          doc: OpenImage opens the program a re-exec runs, O_PATH and close-on-exec.
          forward: svc.OpenImage
          in:
            - name: path
              type: string
          name: OpenImage
          out:
            - type: "*os.File"
            - type: error
      - func:
          doc: |-
            Reexec executes image again in this process, handing it h; it returns
            only when the kernel refused (REEXEC_FAILED).
          forward: svc.Reexec
          in:
            - name: h
              type: "*Handover"
            - name: argv
              type: "[]string"
            - name: image
              type: "*os.File"
            - name: env
              type: "[]string"
          name: Reexec
          out:
            - type: error
      - func:
          doc: |-
            TakeHandover reads the hand-over the outgoing image left this one; a
            refused one leaves no descriptor open and no child unsupervised.
          forward: svc.TakeHandover
          in:
            - name: ctx
              type: context.Context
            - name: grace
              type: time.Duration
          name: TakeHandover
          out:
            - type: "*Handover"
            - type: error
      - func:
          doc: |-
            ParseCommand reads one Exec*= command from its words, its prefixes
            "@-:+!|" parsed.
          forward: coresvc.ParseCommand
          in:
            - name: words
              type: "[]string"
          name: ParseCommand
          out:
            - type: Command
            - type: error
      - func:
          doc: |-
            ListenNotify opens an sd_notify socket for one unit; off Linux and
            FreeBSD it is UNSUPPORTED_PLATFORM.
          forward: svc.ListenNotify
          name: ListenNotify
          out:
            - type: NotifySource
            - type: error
      - func:
          doc: |-
            NewAttacher is the Attacher over proc/process's Attach and AttachPIDFile, a
            PID file nobody vouches for bounded by scope; on Linux, darwin and the
            BSDs.
          forward: svc.NewAttacher
          in:
            - name: scope
              type: AttachScope
          name: NewAttacher
          out:
            - type: Attacher
      - alias:
          - doc: |-
              AttachScope bounds the process an untrustworthy PID file may name: a cgroup
              v2 subtree and the users it may run as. It is the same type as
              proc/process's AttachScope, an alias of the core port's AttachValue.
            name: AttachScope
            target: coreproc.AttachValue
    imports:
      coreproc: github.com/kitsunium/sdk/internal/core/proc
      coresvc: github.com/kitsunium/sdk/internal/core/proc/service
      errs: github.com/kitsunium/sdk/internal/kernel/errs
      svc: github.com/kitsunium/sdk/internal/service/proc/service
    path: github.com/kitsunium/sdk/pkg/v1/proc/service
