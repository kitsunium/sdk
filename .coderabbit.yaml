language: en-US
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: false

  path_filters:
    - "!**/MODULE.bazel.lock"
    - "!**/go.sum"
    - "!**/*.pb.go"
    - "!.bazel-cache/**"
    - "!bazel-*/**"

  path_instructions:
    - path: "internal/kernel/**"
      instructions: |
        Kernel layer: MUST be stdlib-only AND generic (no domain vocabulary).
        See internal/kernel/CLAUDE.md. Flag any non-stdlib import or domain-
        specific naming (User, Request, Log, …) in this tree.
    - path: "internal/core/**"
      instructions: |
        Core layer: domain interfaces + value types. May import stdlib,
        internal/kernel and other internal/core packages; a lateral import
        is not a layer violation (core/trace builds on core/metrics, ADR 0051).
        Must NOT import internal/service, pkg/* or the repository's
        third-party/ tree — the direction scripts/check-layer-deps.sh asserts
        (ADR 0068).
    - path: "internal/service/**"
      instructions: |
        Service layer: concrete implementations. May import stdlib,
        internal/kernel, internal/core, other internal/service packages (a
        lateral import is permitted, not tolerated: internal/CLAUDE.md
        §Dependency direction, ADR 0054 §D7) and the vetted modules
        internal/service/go.mod requires (the codec libraries,
        golang.org/x/mod). Must NOT import pkg/* or the repository's
        third-party/ tree (ADR 0068).
    - path: "pkg/v1/**"
      instructions: |
        Public stable v1 API. Frozen post-v1.0.0. Type aliases onto
        internal/* are allowed (ADR 0074). The error model is constructable
        here: pkg/v1/errs.New / Wrap are the public, runtime-validated
        constructors (ADR 0019); only errs.Define stays internal
        (pkg/CLAUDE.md "No constructors for internal types — except the error
        model"). Flag any new exported identifier without godoc.
    - path: "**/*_test.go"
      instructions: |
        Tests are table-driven, with the case body in a runCase closure
        declared INSIDE the test function (runCase := func(t *testing.T,
        c tc) { … }) so ktn-linter's static analyser sees direct calls. It is
        not a package-level helper, and none exists (internal/CLAUDE.md
        §Conventions). Each subtest must call t.Parallel() when the parent
        does. Production errors flow through errs.Define / errs.Wrap; tests
        may use t.Fatal / t.Errorf directly.
    - path: "docs/adr/**"
      instructions: |
        ADRs are authoritative for the decisions they cover. If an ADR and
        CLAUDE.md disagree, prefer the ADR and flag the CLAUDE.md mismatch.

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

chat:
  auto_reply: true
