# ── pkg/v1/data/codec (#910) ────────────────────────────────────────────────
# The promoted form's allocations, four fewer than the base's: a `delta` rule, head minus base.
# The form codec's own package is a path too, so a change to it runs the suite.
suite codec-promote normal pkg/v1/data/codec ee1f48ba23cb193b13a91222a027326d91093811 ^BenchmarkMarshalPromoted$ 200000x 4 1 ubuntu-latest - pkg/v1/data/codec/,internal/service/data/codec/form/
rule 910-form-small-allocs  codec-promote delta allocs/op BenchmarkMarshalPromoted/form/small-4  - <= -4 #910 report
rule 910-form-record-allocs codec-promote delta allocs/op BenchmarkMarshalPromoted/form/record-4 - <= -4 #910 report

# ── third-party/transform (#892) ────────────────────────────────────────────
# The stream against the block form at 4 MiB, both rows of the head: the base has no stream form.
suite tstream normal third-party/transform ee1f48ba23cb193b13a91222a027326d91093811 ^Benchmark(Stream|StreamFloor)$ 300x 4 1 ubuntu-latest - third-party/transform/,internal/core/data/transform/
# Where an s2 stream spends: the CRC, the two copies, the decode, the block row's allocation.
step0 tstream cpu ^BenchmarkStream$/^random$/^s2$/^decompress$

rule 892-zstd-json-compress     tstream ratio ns/op BenchmarkStream/json/zstd-fastest/compress/stream-4     BenchmarkStream/json/zstd-fastest/compress/block-4     <= 1.10 #892 report
