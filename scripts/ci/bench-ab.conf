# bench-ab.conf — the suites .github/workflows/bench-ab.yml measures, base
# against head, and the threshold of every row an issue of the performance lot
# names, read by scripts/ci/bench-ab-conf.sh and judged by
# scripts/ci/bench-ab-verdict.sh. One record a line, fields separated by blanks,
# `-` for an empty field, a line opening with `#` a comment.
#
# A threshold is the one its issue's acceptance wrote, never amended here but
# under the owner's rule of 2026-11-14: when no design that keeps a package's
# contract reaches it, it becomes the high bound of the 95 % interval the best
# design measured on the runner, rounded up to the hundredth, with its trail in
# the package's BENCH.md (#1034). A row that does not hold yet stays `report`
# (judged, written, never failing the job) and turns `gate` in the pull request
# that makes it hold — the shape of tools/netgate's inactive rows.
# bench-ab.bats pins every threshold below.
#
# suite NAME MODE DIR BASE PATTERN BENCHTIME CPU MINCPUS RUNNER ENV PATHS
#   MODE      normal (a pull request's run, a dispatch's default) or scale (the
#             large rows, on dispatch only)
#   DIR       the package directory under internal/, pkg/v1/ or third-party/,
#             run from there as `go test` runs it, built in the nearest module
#             above it (GOWORK=off): a vendor module under third-party/ builds
#             with the replace directives of its own go.mod
#   BASE      the commit the issues cite (all were audited at ee1f48ba2,
#             2026-11-02); a dispatch's `base` input replaces it
#   PATTERN   the -test.bench expression; CPU the -test.cpu list, which names
#             the rows (`-4`, `-8`, none at 1)
#   MINCPUS   the CPUs a rule of the suite needs to be judged at all: fewer,
#             and its rows are measured and reported `unjudged`
#   ENV       one NAME=VALUE the binaries run with
#   PATHS     the path prefixes whose change runs the suite on a pull request
#
# rule ID SUITE KIND METRIC ROW ROW2 OP THRESHOLD ISSUE MODE
#   KIND      ab     — ROW's head over ROW's base, round by round
#             delta  — ROW's head minus ROW's base, round by round, in the
#                      metric's own unit (head-base: -4 allocs/op is four
#                      fewer); a row the base lacks leaves the rule `missing`
#             ratio  — ROW over ROW2, both the head's, round by round
#             diff   — ROW minus ROW2, both the head's, round by round
#             value  — ROW, the head's
#             cross  — ROW's head over ROW2's BASE, round by round: a row the
#                      head alone carries (an internal benchmark, a floor
#                      row) judged against a different row of the base
#   The rule holds when the bound of the 95 % interval of those per-round
#   values — the high one for <=, the low one for >= — meets THRESHOLD. A row
#   the binary it is read from does not carry — a benchmark whose pull request
#   has not landed — leaves the rule `missing`, never passing.
#
# step0 SUITE PROFILES PATTERN
#   the profiles step 0 records for the suite, beside -gcflags=-m=2 and perf
#   stat (scripts/ci/bench-ab-step0.sh): PROFILES any of mutex, block, cpu,
#   comma-separated; PATTERN the -test.bench expression they run over, `-` for
#   the suite's own. One record a suite at most.

# ── internal/kernel/collections/cache ───────────────────────────────────────
suite kcache        normal internal/kernel/collections/cache ee1f48ba23cb193b13a91222a027326d91093811 ^Benchmark(Set_NewKey|Fetch_Hit|Fetch_HitWithTTL|Fetch_Hit_S3FIFO|Fetch_Hit_TinyLFU)$ 10000000x 4 1 ubuntu-latest - internal/kernel/collections/cache/
# #834's protocol: 100 million accesses a cell, drawn on the fly from a PCG of
# fixed seed after a warm-up of twice the capacity — the two cells the rules
# read, under the three policies. A hit ratio on a fixed trace is the same on
# every run (W-TinyLFU's sketch seed aside, drawn per process), so the rounds
# repeat it; the cells' ns/op is one access.
suite kcache-policy normal internal/kernel/collections/cache ee1f48ba23cb193b13a91222a027326d91093811 ^BenchmarkHitRatio$/^(lru|s3fifo|tinylfu)$/^(zipf-s1.0|scan)$/^cap10%$ 100000000x 4 1 ubuntu-latest - internal/kernel/collections/cache/
# #808 wants 8 dedicated cores: ubuntu-latest has 4 vCPU, so the -8 rows run
# oversubscribed and their rule reads `unjudged` until a dispatch names a
# runner of 8 CPUs or more (`runner` input).
suite kcache-par    normal internal/kernel/collections/cache ee1f48ba23cb193b13a91222a027326d91093811 ^Benchmark(Fetch_Hit|Striped_Fetch_Hit|Fetch_Parallel|Striped_Fetch_Parallel)$ 10000000x 1,2,4,8 8 ubuntu-latest - internal/kernel/collections/cache/
suite kcache-scale  scale  internal/kernel/collections/cache ee1f48ba23cb193b13a91222a027326d91093811 ^Benchmark.*_([0-9]+M|Scale)$ 10000000x 4 1 ubuntu-latest - -

rule 1038-set-newkey       kcache        ab   ns/op  BenchmarkSet_NewKey-4                     -                                   <= 1.05 #1038 report
rule 1038-fetch-hit        kcache        ab   ns/op  BenchmarkFetch_Hit-4                      -                                   <= 1.05 #1038 report
rule 1038-fetch-hit-ttl    kcache        ab   ns/op  BenchmarkFetch_HitWithTTL-4               -                                   <= 1.05 #1038 report
# +15 ns, a difference in ns/op.
rule 834-fetch-hit-s3fifo  kcache        diff ns/op  BenchmarkFetch_Hit_S3FIFO-4               BenchmarkFetch_Hit-4                <= 15   #834  report
# Points of hit ratio: hit/op is a share, so 5 points is 0.05. S3-FIFO's two
# rows hold since the pull request that set its shares (2026-11-15: +0.0512 and
# +0.1095 on the development VM, the same trace on every machine): they gate.
rule 834-zipf-s1.0-cap10   kcache-policy diff hit/op BenchmarkHitRatio/s3fifo/zipf-s1.0/cap10%-4 BenchmarkHitRatio/lru/zipf-s1.0/cap10%-4 >= 0.05 #834 gate
rule 834-scan-cap10        kcache-policy diff hit/op BenchmarkHitRatio/s3fifo/scan/cap10%-4 BenchmarkHitRatio/lru/scan/cap10%-4 >= 0.10 #834 gate
# W-TinyLFU, the issue's "then", held to the same three bounds (the owner's rule
# of 2026-11-14, point 3). Its sketch's seed is drawn per process, so its hit
# ratio moves a little from round to round (+0.0501 to +0.0509 and +0.1022 to
# +0.1044 over seven seeds on the development VM): report.
rule 834-fetch-hit-tinylfu kcache        diff ns/op  BenchmarkFetch_Hit_TinyLFU-4              BenchmarkFetch_Hit-4                <= 15   #834  report
rule 834-tinylfu-zipf-s1.0-cap10 kcache-policy diff hit/op BenchmarkHitRatio/tinylfu/zipf-s1.0/cap10%-4 BenchmarkHitRatio/lru/zipf-s1.0/cap10%-4 >= 0.05 #834 report
rule 834-tinylfu-scan-cap10      kcache-policy diff hit/op BenchmarkHitRatio/tinylfu/scan/cap10%-4 BenchmarkHitRatio/lru/scan/cap10%-4 >= 0.10 #834 report
# Its single-threaded Fetch_Hit: Cache's, at -cpu=1 (the owner's reading, ~2 × 64 ns).
rule 808-striped-parallel  kcache-par    ratio ns/op BenchmarkStriped_Fetch_Parallel-8         BenchmarkFetch_Hit                  <= 2    #808  report

# ── internal/service/data/cache ─────────────────────────────────────────────
suite dcache        normal internal/service/data/cache ee1f48ba23cb193b13a91222a027326d91093811 ^Benchmark(Fetch_Hit|Load_Hit)$ 10000000x 4 1 ubuntu-latest - internal/kernel/collections/cache/,internal/service/data/cache/
suite dcache-par    normal internal/service/data/cache ee1f48ba23cb193b13a91222a027326d91093811 ^Benchmark(Fetch_Hit|Fetch_Parallel)$ 10000000x 1,8 8 ubuntu-latest - internal/kernel/collections/cache/,internal/service/data/cache/
suite dcache-tag    normal internal/service/data/cache ee1f48ba23cb193b13a91222a027326d91093811 ^BenchmarkInvalidateTag_In100k$ 20000x 4 1 ubuntu-latest - internal/kernel/collections/cache/,internal/service/data/cache/
# FetchMany_16's ns/op is sixteen keys: 40 % of Fetch_Hit per key is 16 × 0.40 (#840).
# The base has no FetchMany: its rows are the head's alone, and the ratio reads the head.
suite dcache-bulk   normal internal/service/data/cache ee1f48ba23cb193b13a91222a027326d91093811 ^Benchmark(Fetch_Hit|FetchMany_16)$ 2000000x 4 1 ubuntu-latest - internal/core/data/cache/,internal/kernel/collections/cache/,internal/service/data/cache/
suite dcache-scale  scale  internal/service/data/cache ee1f48ba23cb193b13a91222a027326d91093811 ^Benchmark.*_([0-9]+M|Scale)$ 10000000x 4 1 ubuntu-latest - -

rule 1059-fetch-hit        dcache        ab    ns/op     BenchmarkFetch_Hit-4                  -                  <= 1.10 #1059 report
# The owner holds Load_Hit to the same bound (the issue's reopening).
rule 1059-load-hit         dcache        ab    ns/op     BenchmarkLoad_Hit-4                   -                  <= 1.10 #1059 report
rule 1059-fetch-hit-allocs dcache        value allocs/op BenchmarkFetch_Hit-4                  -                  <= 0    #1059 report
# The million-key rows of the scale suite (BenchmarkFetch_Hit_1M, BenchmarkLoad_Hit_1M).
rule 1059-fetch-hit-1m     dcache-scale  ab    ns/op     BenchmarkFetch_Hit_1M-4               -                  <= 1.10 #1059 report
rule 1059-load-hit-1m      dcache-scale  ab    ns/op     BenchmarkLoad_Hit_1M-4                -                  <= 1.10 #1059 report
# "Shards 8" is the store's Stripes: 8.
rule 808-shards8-parallel  dcache-par    ratio ns/op     BenchmarkFetch_Parallel/stripes=8-8   BenchmarkFetch_Hit <= 2    #808  report
# The unsharded figure: the base's store, which had no stripes.
rule 808-invalidate-100k   dcache-tag    ab    ns/op     BenchmarkInvalidateTag_In100k-4       -                  <= 1.3  #808  report
# Per key: sixteen keys' ns/op over one Fetch_Hit, 16 × 0.40.
rule 840-fetchmany16-per-key dcache-bulk ratio ns/op     BenchmarkFetchMany_16-4               BenchmarkFetch_Hit-4 <= 6.4 #840  report
# At scale: sixteen keys out of a million-entry store (BenchmarkFetchMany_16_1M, BenchmarkFetch_Hit_1M).
rule 840-fetchmany16-1m    dcache-scale  ratio ns/op     BenchmarkFetchMany_16_1M-4            BenchmarkFetch_Hit_1M-4 <= 6.4 #840 report

# ── internal/service/data/queue ─────────────────────────────────────────────
suite queue         normal internal/service/data/queue ee1f48ba23cb193b13a91222a027326d91093811 ^BenchmarkReceive(Backlog|Batch)$/^file$/^(depth10|depth1000|batch1)$ 2000x 4 1 ubuntu-latest - internal/service/data/queue/
# A backlog of a million messages, written without a flush by
# FillReadyForTest (scale_bench_test.go); a dispatch with mode=scale.
# The batch's publication lands in vfs (os_publish.go), so vfs's changes run the suite too (#827).
# PublishMany is not in the base: its row is the head's, and the ratio reads the head.
suite queue-publish normal internal/service/data/queue ee1f48ba23cb193b13a91222a027326d91093811 ^BenchmarkPublish(Many)?$/^file$/^(64|16)$ 4000x 4 1 ubuntu-latest - internal/service/data/queue/,internal/service/data/vfs/
suite queue-scale   scale  internal/service/data/queue ee1f48ba23cb193b13a91222a027326d91093811 ^BenchmarkReceiveBacklog_Scale$ 20x 4 1 ubuntu-latest KITSUNIUM_BENCH_SCALE=10000,100000,1000000 -

rule 811-depth-ns          queue         ratio ns/op     BenchmarkReceiveBacklog/file/depth1000-4 BenchmarkReceiveBacklog/file/depth10-4 <= 2   #811 report
rule 811-depth-allocs      queue         ratio allocs/op BenchmarkReceiveBacklog/file/depth1000-4 BenchmarkReceiveBacklog/file/depth10-4 <= 2   #811 report
rule 811-batch1-allocs     queue         value allocs/op BenchmarkReceiveBatch/file/batch1-4      -                                      <= 200 #811 report
# The curve at scale stays flat: the issue's own factor 2, read between ten thousand and a million.
rule 811-scale-ns          queue-scale   ratio ns/op     BenchmarkReceiveBacklog_Scale/file/depth1000000-4 BenchmarkReceiveBacklog_Scale/file/depth10000-4 <= 2 #811 report
# #827: PublishMany/16's ns/op is sixteen messages — 55 % of Publish per message is 16 × 0.55.
rule 827-publishmany16-per-msg queue-publish ratio ns/op BenchmarkPublishMany/file/16-4 BenchmarkPublish/file/64-4 <= 8.8 #827 report

# ── internal/service/observe/logger ─────────────────────────────────────────
suite logger        normal internal/service/observe/logger ee1f48ba23cb193b13a91222a027326d91093811 ^BenchmarkEmit_Bound$ 2000000x 4 1 ubuntu-latest - internal/service/observe/logger/

rule 1016-text-8bound      logger        ratio ns/op BenchmarkEmit_Bound/text/8Bound-4  BenchmarkEmit_Bound/text/0Bound-4 <= 1.10 #1016 report
rule 1016-text-32bound     logger        ratio ns/op BenchmarkEmit_Bound/text/32Bound-4 BenchmarkEmit_Bound/text/0Bound-4 <= 1.10 #1016 report
rule 1016-json-8bound      logger        ratio ns/op BenchmarkEmit_Bound/json/8Bound-4  BenchmarkEmit_Bound/json/0Bound-4 <= 1.10 #1016 report
rule 1016-json-32bound     logger        ratio ns/op BenchmarkEmit_Bound/json/32Bound-4 BenchmarkEmit_Bound/json/0Bound-4 <= 1.10 #1016 report
# "allocs/op is 0 on the three static rows" — the 32-bound ones, the row a copy of the bound set grew with.
rule 1016-text-32bound-allocs logger value allocs/op BenchmarkEmit_Bound/text/32Bound-4 - <= 0 #1016 report
rule 1016-json-32bound-allocs logger value allocs/op BenchmarkEmit_Bound/json/32Bound-4 - <= 0 #1016 report

# ── internal/kernel/concur/singleflight (#1035) ─────────────────────────────
# Step 1 alone is BenchmarkDo_DistinctKeysParallel_OneShard (one shard, an internal
# benchmark the base cannot compile), judged against the BASE's DistinctKeysParallel:
# a `cross` rule. OwnCtx (a context a goroutine) is information, no rule reads it.
suite sflight   normal internal/kernel/concur/singleflight ee1f48ba23cb193b13a91222a027326d91093811 ^BenchmarkDo_(Uncontended|SharedKeyParallel|DistinctKeysParallel|DistinctKeysParallel_OneShard|DistinctKeysParallelOwnCtx)$ 1000000x 4 4 ubuntu-latest - internal/kernel/concur/singleflight/
# The committed row is -8: judged on a runner of 8 CPUs or more (`runner` input), unjudged on ubuntu-latest.
suite sflight-8 normal internal/kernel/concur/singleflight ee1f48ba23cb193b13a91222a027326d91093811 ^BenchmarkDo_(Uncontended|DistinctKeysParallel|DistinctKeysParallel_OneShard)$ 1000000x 8 8 ubuntu-latest - internal/kernel/concur/singleflight/
# The group's lock, the shared context's channel and the scheduler, told apart (#1035's step 0).
step0 sflight   mutex,block,cpu ^BenchmarkDo_DistinctKeysParallel(_OneShard)?$
step0 sflight-8 mutex,block,cpu ^BenchmarkDo_DistinctKeysParallel(_OneShard)?$

rule 1035-step2-vs-uncontended   sflight   ratio ns/op      BenchmarkDo_DistinctKeysParallel-4 BenchmarkDo_Uncontended-4 <= 1 #1035 report
rule 1035-step1-oneshard         sflight   cross ns/op      BenchmarkDo_DistinctKeysParallel_OneShard-4 BenchmarkDo_DistinctKeysParallel-4 <= 0.80 #1035 report
rule 1035-uncontended-allocs     sflight   value allocs/op  BenchmarkDo_Uncontended-4 - <= 6 #1035 report
# "Unchanged within noise", read as ±10 % of the base — a reading to confirm with the owner, not an amendment.
rule 1035-shared-fnruns-high     sflight   ab    fn-runs/op BenchmarkDo_SharedKeyParallel-4 - <= 1.10 #1035 report
rule 1035-shared-fnruns-low      sflight   ab    fn-runs/op BenchmarkDo_SharedKeyParallel-4 - >= 0.90 #1035 report
rule 1035-step2-vs-uncontended-8 sflight-8 ratio ns/op      BenchmarkDo_DistinctKeysParallel-8 BenchmarkDo_Uncontended-8 <= 1 #1035 report
rule 1035-step1-oneshard-8       sflight-8 cross ns/op      BenchmarkDo_DistinctKeysParallel_OneShard-8 BenchmarkDo_DistinctKeysParallel-8 <= 0.80 #1035 report

# ── internal/kernel/collections/ring (#1034) ────────────────────────────────
# Two suites: a two-level -test.bench expression (X$/^size1024$) on a benchmark with no
# sub-benchmark runs it once, to discover them, and reports nothing.
# The head's bench file does not compile on the base (linePad, NewMulti): the base keeps
# its own, which carries the judged rows under the same names and shape.
# PublishFloor is measured, not judged: one store a write and nothing on the reader's side,
# the floor of a design that gives up Len and Full, a record beside the rows.
suite ring      normal internal/kernel/collections/ring ee1f48ba23cb193b13a91222a027326d91093811 ^Benchmark(TryWrite_Happy|TryRead_Happy|SCStorePair|PublishFloor)$ 50000000x 4 1 ubuntu-latest - internal/kernel/collections/ring/
suite ring-spsc normal internal/kernel/collections/ring ee1f48ba23cb193b13a91222a027326d91093811 ^BenchmarkSPSC_ProducerConsumer$/^size1024$ 20000000x 4 2 ubuntu-latest - internal/kernel/collections/ring/

# #1034 wrote 0.50 for the two happy rows and 0.60 for the hand-off. No design that keeps the
# ring's contract reaches them (the ring's BENCH.md, 2026-11-15, and 1034-floor-sc below), so
# each is the high bound of the 95 % interval this ring measured on the EPYC 7763 (run
# 43669032740: 0.952, 0.945 and 0.773), rounded up to the hundredth:
# relevé selon la règle du propriétaire du 2026-11-14.
# Kept `report`: less than 1 % above one runner family's interval.
rule 1034-trywrite-happy  ring      ab    ns/op     BenchmarkTryWrite_Happy-4 - <= 0.96 #1034 report
rule 1034-tryread-happy   ring      ab    ns/op     BenchmarkTryRead_Happy-4 - <= 0.95 #1034 report
rule 1034-trywrite-allocs ring      value allocs/op BenchmarkTryWrite_Happy-4 - <= 0 #1034 report
rule 1034-tryread-allocs  ring      value allocs/op BenchmarkTryRead_Happy-4 - <= 0 #1034 report
rule 1034-spsc-1024       ring-spsc ab    ns/op     BenchmarkSPSC_ProducerConsumer/size1024-4 - <= 0.78 #1034 report
# The proof the raise rests on, not a bound of the issue: the head's two SC stores alone, the
# store from each side the contract needs, against the base's whole row stay above the original
# 0.50 (0.81-0.82 on the EPYC 7763): no design that keeps the contract reaches it on that box.
rule 1034-floor-sc        ring      cross ns/op     BenchmarkSCStorePair-4 BenchmarkTryWrite_Happy-4 >= 0.50 #1034 report

