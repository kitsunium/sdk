# The floor rows, not bounds of the issue: one copy and the CRC-32C (random), the decode and the
# CRC (json), against the block form. They are a measured base of this implementation: failing one
# on a family says the copy-and-CRC form exceeds the bound there, not that no stream could hold it.
rule 892-s2-random-floor        tstream ratio ns/op BenchmarkStreamFloor/random/s2-4 BenchmarkStream/random/s2/decompress/block-4 <= 1.10 #892 report
rule 892-s2-json-floor          tstream ratio ns/op BenchmarkStreamFloor/json/s2-4   BenchmarkStream/json/s2/decompress/block-4   <= 1.10 #892 report

# ── internal/service/app/consensus (#912, #1364) ────────────────────────────
# The leader's loop turn at 1 000 proposals/s of 256 B, three and five nodes over loopback mTLS,
# memory logs: a test Meter keeps every consensus_loop_turn_seconds observation of the leader raw
# (the series' first bucket is 0.5 ms; the p99 is some 35 µs). One paced run of 5 s an op. The
# file is self-contained and uses nothing the base lacks, so the base runs the same rows: "not
# worse" is head over base at most 1.00. #1364 compares against the parent of #912's commit, which
# builds with one line of stream.go: a dispatch's base=bench/912-parent.
suite cturn normal internal/service/app/consensus ee1f48ba23cb193b13a91222a027326d91093811 ^BenchmarkLeaderLoopTurnAt1000PerSecond$ 1x 4 4 ubuntu-latest - internal/service/app/consensus/,internal/core/app/consensus/
# Where a turn spends: raft's Status cloning both memberships, the scheduler, the wake-ups (#912's step 0).
step0 cturn cpu -
# The bytes of a leader turn of 64 x 256 B to N followers: the shared body (#912) over the
# per-follower encoding the driver keeps for a transport without BatchSender — the base's code
# path byte for byte —, both rows of the head (the base has no BatchSender and drops the file).
# "Divided by the follower count": at most 1/N.
suite cenc normal internal/service/app/consensus ee1f48ba23cb193b13a91222a027326d91093811 ^BenchmarkLeaderTurnEncoding$ 20000x 4 1 ubuntu-latest - internal/service/app/consensus/

rule 912-turn-p99-2followers cturn ab    p99-us/turn BenchmarkLeaderLoopTurnAt1000PerSecond/followers=2-4 -                                                <= 1.00 #912 report
rule 912-turn-p99-4followers cturn ab    p99-us/turn BenchmarkLeaderLoopTurnAt1000PerSecond/followers=4-4 -                                                <= 1.00 #912 report
rule 912-bytes-2followers    cenc  ratio B/op        BenchmarkLeaderTurnEncoding/shared/followers=2-4 BenchmarkLeaderTurnEncoding/perpeer/followers=2-4 <= 0.50 #912 report
rule 912-bytes-4followers    cenc  ratio B/op        BenchmarkLeaderTurnEncoding/shared/followers=4-4 BenchmarkLeaderTurnEncoding/perpeer/followers=4-4 <= 0.25 #912 report

# ── internal/service/app/consensus (#920, #1365) ────────────────────────────
# The data lane's commit p99 while a paced snapshot stream runs: three voters over loopback mTLS
# on the device, 1 000 proposals/s of 256 B, a snapshot of 10 s of the rate written on the fly by
# a machine that keeps no state, a learner on tmpfs; windows A 4 s, B 8 s, A 4 s in one cluster
# an op, each A after 2 s of the same load dropped. `paced` is both A pooled, `paced+stream` B:
# both rows of the head (the base has no pacing and leaves the file out), so the ratio reads one
# cluster a round. 8 MiB/s is the rate #920 is judged at, fixed before measuring; 2 and 32 MiB/s
# are the curve, on a dispatch with mode=scale.
suite cstream       normal internal/service/app/consensus ee1f48ba23cb193b13a91222a027326d91093811 ^BenchmarkTCPCommitStream$/^(data-disk|tmpfs)$/^rate=8MiB$ 1x 4 4 ubuntu-latest - internal/service/app/consensus/,internal/core/app/consensus/
suite cstream-scale scale  internal/service/app/consensus ee1f48ba23cb193b13a91222a027326d91093811 ^BenchmarkTCPCommitStream$/^(data-disk|tmpfs)$/^rate=(2|32)MiB$ 1x 4 4 ubuntu-latest - -
# Where B spends: TLS, the pacer's timers, the learner's receiving side, the collections, the scheduler.
step0 cstream cpu -

rule 920-stream-8mib-tmpfs  cstream       ratio p99-ms/commit BenchmarkTCPCommitStream/tmpfs/rate=8MiB/paced+stream-4 BenchmarkTCPCommitStream/tmpfs/rate=8MiB/paced-4 <= 1.10 #920 report
rule 920-stream-8mib-disk   cstream       ratio p99-ms/commit BenchmarkTCPCommitStream/data-disk/rate=8MiB/paced+stream-4 BenchmarkTCPCommitStream/data-disk/rate=8MiB/paced-4 <= 1.10 #920 report
# Information, not the judged rate: the same bound read at 2 and 32 MiB/s.
rule 920-stream-2mib-tmpfs  cstream-scale ratio p99-ms/commit BenchmarkTCPCommitStream/tmpfs/rate=2MiB/paced+stream-4 BenchmarkTCPCommitStream/tmpfs/rate=2MiB/paced-4 <= 1.10 #920 report
rule 920-stream-32mib-tmpfs cstream-scale ratio p99-ms/commit BenchmarkTCPCommitStream/tmpfs/rate=32MiB/paced+stream-4 BenchmarkTCPCommitStream/tmpfs/rate=32MiB/paced-4 <= 1.10 #920 report
rule 920-stream-2mib-disk   cstream-scale ratio p99-ms/commit BenchmarkTCPCommitStream/data-disk/rate=2MiB/paced+stream-4 BenchmarkTCPCommitStream/data-disk/rate=2MiB/paced-4 <= 1.10 #920 report
rule 920-stream-32mib-disk  cstream-scale ratio p99-ms/commit BenchmarkTCPCommitStream/data-disk/rate=32MiB/paced+stream-4 BenchmarkTCPCommitStream/data-disk/rate=32MiB/paced-4 <= 1.10 #920 report
