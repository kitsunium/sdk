# bench-ab.conf — the suites .github/workflows/bench-ab.yml measures, base
# against head, and the threshold of every row an issue of the performance lot
# names, read by scripts/ci/bench-ab-conf.sh and judged by
# scripts/ci/bench-ab-verdict.sh. One record a line, fields separated by blanks,
# `-` for an empty field, a line opening with `#` a comment.
#
# A threshold is the one its issue's acceptance wrote, never amended here: a
# row that does not hold yet stays `report` (judged, written, never failing the
# job) and turns `gate` in the pull request that makes it hold — the shape of
# tools/netgate's inactive rows. bench-ab.bats pins every threshold below.
#
# suite NAME MODE DIR BASE PATTERN BENCHTIME CPU MINCPUS RUNNER ENV PATHS
#   MODE      normal (a pull request's run, a dispatch's default) or scale (the
#             large rows, on dispatch only)
#   DIR       the package directory, run from there as `go test` runs it
#   BASE      the commit the issues cite (all six were audited at ee1f48ba2,
#             2026-11-02); a dispatch's `base` input replaces it
#   PATTERN   the -test.bench expression; CPU the -test.cpu list, which names
#             the rows (`-4`, `-8`, none at 1)
#   MINCPUS   the CPUs a rule of the suite needs to be judged at all: fewer,
#             and its rows are measured and reported `unjudged`
#   ENV       one NAME=VALUE the binaries run with
#   PATHS     the path prefixes whose change runs the suite on a pull request
#
# rule ID SUITE KIND METRIC ROW ROW2 OP THRESHOLD ISSUE MODE
#   KIND      ab     — ROW's head over ROW's base, round by round
#             ratio  — ROW over ROW2, both the head's, round by round
#             diff   — ROW minus ROW2, both the head's, round by round
#             value  — ROW, the head's
#   The rule holds when the bound of the 95 % interval of those per-round
#   values — the high one for <=, the low one for >= — meets THRESHOLD.

# ── internal/kernel/collections/cache ───────────────────────────────────────
suite kcache        normal internal/kernel/collections/cache ee1f48ba23cb193b13a91222a027326d91093811 ^Benchmark(Set_NewKey|Fetch_Hit|Fetch_HitWithTTL|Fetch_Hit_S3FIFO)$ 10000000x 4 1 ubuntu-latest - internal/kernel/collections/cache/
suite kcache-policy normal internal/kernel/collections/cache ee1f48ba23cb193b13a91222a027326d91093811 ^BenchmarkHitRatio(_Scan)?$ 2000000x 4 1 ubuntu-latest - internal/kernel/collections/cache/
# #808 wants 8 dedicated cores: ubuntu-latest has 4 vCPU, so the -8 rows run
# oversubscribed and their rule reads `unjudged` until a dispatch names a
# runner of 8 CPUs or more (`runner` input).
suite kcache-par    normal internal/kernel/collections/cache ee1f48ba23cb193b13a91222a027326d91093811 ^Benchmark(Fetch_Hit|Striped_Fetch_Hit|Fetch_Parallel|Striped_Fetch_Parallel)$ 10000000x 1,2,4,8 8 ubuntu-latest - internal/kernel/collections/cache/
suite kcache-scale  scale  internal/kernel/collections/cache ee1f48ba23cb193b13a91222a027326d91093811 ^Benchmark.*_([0-9]+M|Scale)$ 10000000x 4 1 ubuntu-latest - -

rule 1038-set-newkey       kcache        ab   ns/op  BenchmarkSet_NewKey-4                     -                                   <= 1.05 #1038 report
rule 1038-fetch-hit        kcache        ab   ns/op  BenchmarkFetch_Hit-4                      -                                   <= 1.05 #1038 report
rule 1038-fetch-hit-ttl    kcache        ab   ns/op  BenchmarkFetch_HitWithTTL-4               -                                   <= 1.05 #1038 report
# +15 ns, a difference in ns/op.
rule 834-fetch-hit-s3fifo  kcache        diff ns/op  BenchmarkFetch_Hit_S3FIFO-4               BenchmarkFetch_Hit-4                <= 15   #834  report
# Points of hit ratio: hit/op is a share, so 5 points is 0.05.
rule 834-zipf-s1.0-cap10   kcache-policy diff hit/op BenchmarkHitRatio/s3fifo/zipf-s1.0/cap10%-4 BenchmarkHitRatio/lru/zipf-s1.0/cap10%-4 >= 0.05 #834 report
rule 834-scan-cap10        kcache-policy diff hit/op BenchmarkHitRatio_Scan/s3fifo/cap10%-4    BenchmarkHitRatio_Scan/lru/cap10%-4 >= 0.10 #834  report
# Its single-threaded Fetch_Hit: Cache's, at -cpu=1 (the owner's reading, ~2 × 64 ns).
rule 808-striped-parallel  kcache-par    ratio ns/op BenchmarkStriped_Fetch_Parallel-8         BenchmarkFetch_Hit                  <= 2    #808  report

# ── internal/service/data/cache ─────────────────────────────────────────────
suite dcache        normal internal/service/data/cache ee1f48ba23cb193b13a91222a027326d91093811 ^Benchmark(Fetch_Hit|Load_Hit)$ 10000000x 4 1 ubuntu-latest - internal/kernel/collections/cache/,internal/service/data/cache/
suite dcache-par    normal internal/service/data/cache ee1f48ba23cb193b13a91222a027326d91093811 ^Benchmark(Fetch_Hit|Fetch_Parallel)$ 10000000x 1,8 8 ubuntu-latest - internal/kernel/collections/cache/,internal/service/data/cache/
suite dcache-tag    normal internal/service/data/cache ee1f48ba23cb193b13a91222a027326d91093811 ^BenchmarkInvalidateTag_In100k$ 20000x 4 1 ubuntu-latest - internal/kernel/collections/cache/,internal/service/data/cache/
suite dcache-scale  scale  internal/service/data/cache ee1f48ba23cb193b13a91222a027326d91093811 ^Benchmark.*_([0-9]+M|Scale)$ 10000000x 4 1 ubuntu-latest - -

rule 1059-fetch-hit        dcache        ab    ns/op     BenchmarkFetch_Hit-4                  -                  <= 1.10 #1059 report
# The owner holds Load_Hit to the same bound (the issue's reopening).
rule 1059-load-hit         dcache        ab    ns/op     BenchmarkLoad_Hit-4                   -                  <= 1.10 #1059 report
rule 1059-fetch-hit-allocs dcache        value allocs/op BenchmarkFetch_Hit-4                  -                  <= 0    #1059 report
# The million-key rows of the scale suite (BenchmarkFetch_Hit_1M, BenchmarkLoad_Hit_1M).
rule 1059-fetch-hit-1m     dcache-scale  ab    ns/op     BenchmarkFetch_Hit_1M-4               -                  <= 1.10 #1059 report
rule 1059-load-hit-1m      dcache-scale  ab    ns/op     BenchmarkLoad_Hit_1M-4                -                  <= 1.10 #1059 report
# "Shards 8" is the store's Stripes: 8.
rule 808-shards8-parallel  dcache-par    ratio ns/op     BenchmarkFetch_Parallel/stripes=8-8   BenchmarkFetch_Hit <= 2    #808  report
# The unsharded figure: the base's store, which had no stripes.
rule 808-invalidate-100k   dcache-tag    ab    ns/op     BenchmarkInvalidateTag_In100k-4       -                  <= 1.3  #808  report

# ── internal/service/data/queue ─────────────────────────────────────────────
suite queue         normal internal/service/data/queue ee1f48ba23cb193b13a91222a027326d91093811 ^BenchmarkReceive(Backlog|Batch)$/^file$/^(depth10|depth1000|batch1)$ 2000x 4 1 ubuntu-latest - internal/service/data/queue/
# A backlog of a million messages, written without a flush by
# FillReadyForTest (scale_bench_test.go); a dispatch with mode=scale.
suite queue-scale   scale  internal/service/data/queue ee1f48ba23cb193b13a91222a027326d91093811 ^BenchmarkReceiveBacklog_Scale$ 20x 4 1 ubuntu-latest KITSUNIUM_BENCH_SCALE=10000,100000,1000000 -

rule 811-depth-ns          queue         ratio ns/op     BenchmarkReceiveBacklog/file/depth1000-4 BenchmarkReceiveBacklog/file/depth10-4 <= 2   #811 report
rule 811-depth-allocs      queue         ratio allocs/op BenchmarkReceiveBacklog/file/depth1000-4 BenchmarkReceiveBacklog/file/depth10-4 <= 2   #811 report
rule 811-batch1-allocs     queue         value allocs/op BenchmarkReceiveBatch/file/batch1-4      -                                      <= 200 #811 report

# ── internal/service/observe/logger ─────────────────────────────────────────
suite logger        normal internal/service/observe/logger ee1f48ba23cb193b13a91222a027326d91093811 ^BenchmarkEmit_Bound$ 2000000x 4 1 ubuntu-latest - internal/service/observe/logger/

rule 1016-text-8bound      logger        ratio ns/op BenchmarkEmit_Bound/text/8Bound-4  BenchmarkEmit_Bound/text/0Bound-4 <= 1.10 #1016 report
rule 1016-text-32bound     logger        ratio ns/op BenchmarkEmit_Bound/text/32Bound-4 BenchmarkEmit_Bound/text/0Bound-4 <= 1.10 #1016 report
rule 1016-json-8bound      logger        ratio ns/op BenchmarkEmit_Bound/json/8Bound-4  BenchmarkEmit_Bound/json/0Bound-4 <= 1.10 #1016 report
rule 1016-json-32bound     logger        ratio ns/op BenchmarkEmit_Bound/json/32Bound-4 BenchmarkEmit_Bound/json/0Bound-4 <= 1.10 #1016 report
