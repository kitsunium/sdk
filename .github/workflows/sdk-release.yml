name: SDK Release
# Auto-cut tags after the Bazel CI lane succeeds on main. WHETHER to release is
# impact-driven (bazel rdeps — ADR 0007); HOW BIG is the largest `release:*`
# label a maintainer set on the merged pull requests of the range, patch when
# there is none (ADR 0135). A `Release-bump:` line in a commit message no longer
# sizes anything: the squash message is composed from contributor text, so it
# could both bury a maintainer's request (#217) and set the size itself (#224).
#
# WHAT is released is every module go.work names that changed since its OWN
# last tag (ADR 0171, amending ADR 0162): the SDK module at the root (vX.Y.Z),
# a pkg family (pkg/v1/<family>/vX.Y.Z), the shared internal module
# (internal/vX.Y.Z) and each module that requires a vendor (third-party/*,
# framework/connectors/*), each at its OWN version, sized by the labels of the
# merges that touched it. compute-bumps.sh prints one module directory per
# line; cut-tags.sh tags them on one release commit in one atomic push and
# writes release-manifest.json, the release's identity. ONE GitHub release is
# made, on the first tag cut-tags.sh printed, with the manifest attached and
# every tag in its notes.
# The SDK module's first release — v0.18.0, after pkg/v0.17.0 — also cuts, in
# the same atomic push and never again, the tombstones pkg/v0.18.0 and
# framework/v0.18.0: the last version of each retired module, a go.mod that
# requires the release and holds no package, so an import of …/pkg/v1/… or
# …/framework/… resolves to the SDK module (ADR 0162). The notes list them
# apart.
#
# Triggered AFTER bazel-ci.yml succeeds (no race, no double-build).
# workflow_dispatch input force_bumps overrides the impact analysis when
# the rdeps cache is stale or a maintainer wants to cut a tag manually.
#
# WHEN THE SIZE IS REFUSED (ADR 0135). cut-tags.sh exits 65 when a merge's
# message asks for more than a patch and no label decides it — the #248 shape,
# whose squash carried a branch commit's `Release-bump: minor` mid-body. The
# refusal names the pull request. Either of these settles it, and neither is a
# hand-run script:
#
#   1. label the pull request release:minor (or release:patch to decline the
#      request), then re-run the failed job — the labels are read live;
#   2. dispatch this workflow with `bump` set to patch, minor or major, which
#      sizes the whole range and asks GitHub nothing.
#
# `release_base()` advances only when a release is cut, so a refused merge
# stays in every later range until one of the two happens.
#
# Firing on SUCCESS alone is what makes a run that the concurrency group
# cancelled produce no release at all — so the merge that was sized is
# routinely not the HEAD this job checks out. That is handled inside the
# scripts, which read the labels over the whole range since the last release
# rather than from HEAD (ADR 0085); nothing here needs to compensate, and
# fetch-depth: 0 below is what lets them walk that range.
#
# WHAT A GREEN RUN MEANS HERE (#227 defect 2). It used to mean nothing: run
# 34861207918 reported completed/success with step 6 green, step 7 SKIPPED and
# no tag cut, and pkg/v0.3.7 has never existed. "There was nothing to publish"
# and "the computation failed silently" looked identical from the run list.
# Three things now keep them apart, and none of them is a comment:
#
#   1. compute-bumps.sh --explain writes its verdict and the reason to stderr,
#      so this job's log says WHICH of the two happened (#226).
#   2. every run — including a no-op — writes a job summary and uploads it, so
#      "nothing was published, because X" is a recorded fact rather than an
#      absence of one.
#   3. once a bump HAS been computed, a run that pushes no tag FAILS. A release
#      that publishes nothing is never a success.
#
# LOCKED UNTIL A MAINTAINER SAYS OTHERWISE (ADR 0171). v0.19.6 and v0.19.7 were
# cut automatically on the day the module split was decided, and every version
# the proxy fetches is that version for good. So nothing is cut unless the
# repository variable RELEASE_ENABLED is exactly `true`:
#
#   - an automatic run (workflow_run) does not start without it — the job's
#     `if` reads the variable, so a locked repository shows a skipped job
#     rather than a red one;
#   - a dispatch always runs, and asks for a DRY RUN by default (`dry_run`):
#     both scripts run, cut-tags.sh with --dry-run, the tags it would cut are
#     printed in the step log and the summary, and nothing is tagged, pushed or
#     released;
#   - a dispatch with dry_run=false while the variable is not `true` fails in
#     its first step, naming the variable. The variable is the lock; the
#     dispatch form cannot lift it.
#
# `gh variable set RELEASE_ENABLED --body true` once a dry run has printed the
# tags that are meant; `gh variable delete RELEASE_ENABLED` locks again.
#
# And rule 2 is load-bearing here: a release lane where `bazel` is missing
# silently skips the rdeps half and reports "no release". --require-bazel below
# turns that into a refusal.

on:
  workflow_run:
    workflows: ["SDK CI (Bazel)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_bumps:
        description: 'Force the modules to release, space-separated: "." (the SDK module) or a module directory go.work names (pkg/v1/data, internal, third-party/aws…); "sdk" is the SDK module plus every module that changed since its own tag — ADR 0171 (empty = use compute-bumps.sh output).'
        required: false
        default: ""
      bump:
        description: 'Size the whole release range: patch, minor or major (empty = the release:* labels of its merged pull requests). The way past a refused size — ADR 0135.'
        required: false
        default: ""
      dry_run:
        description: 'Print the tags this release would cut and publish nothing. A real cut (false) also needs the repository variable RELEASE_ENABLED=true (ADR 0171).'
        type: boolean
        required: false
        default: true

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.repository == 'kitsunium/sdk'
      && (github.event_name == 'workflow_dispatch'
        || (github.event.workflow_run.conclusion == 'success'
            && github.event.workflow_run.event == 'push'
            && vars.RELEASE_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # The size is the `release:*` label of the merged pull request behind
      # each first-parent commit, read through `commits/<sha>/pulls` (ADR 0135).
      pull-requests: read

    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      GOWORK: "off"
      # 'true' on a dispatch that asked for a dry run (its default), 'false' on
      # every other run — and an automatic one only starts when releases are
      # enabled. A string, so a step's `if` compares it with 'true' alone.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}

    steps:
      - name: Refuse a cut while releases are locked
        # First, before anything is set up: a dispatch asking for a real cut
        # while the repository variable is not `true` stops here and names the
        # variable. A dry run needs no permission, and an automatic run never
        # reaches this step locked (the job's `if`).
        if: env.DRY_RUN != 'true'
        run: |
          if [ "${RELEASE_ENABLED:-}" != "true" ]; then
            echo "::error::releases are locked: the repository variable RELEASE_ENABLED is '${RELEASE_ENABLED:-}', not 'true' (ADR 0171). Dispatch with dry_run=true to see the tags, then 'gh variable set RELEASE_ENABLED --body true' to cut them."
            exit 1
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Setup Bazel
        # Same pinned action as bazel-ci.yml, and — unlike before — with its
        # caches. This lane ran setup-bazel with NO cache of any kind, so every
        # release resolved the whole module graph and every external repository
        # from cold before it could answer one `rdeps` question. #226 measured
        # step 6 at 31 s on a lane where a cold rdeps over this repository
        # cannot plausibly finish that fast, and got an empty answer; a cold,
        # network-bound fetch is the most likely thing that 31 s was. The caches
        # do not prove the query will succeed — nothing here can — but they
        # remove the failure surface that had no reason to be in this lane.
        #
        # Its own disk-cache namespace (the key starts with github.workflow, as
        # in bazel-ci.yml). Sharing the CI lane's warm cache would need both
        # files to agree on a literal key prefix, which changes bazel-ci.yml and
        # invalidates that lane's cache once — deliberately not bundled here.
        # `# 0.19.0` with NO `v`, on purpose: that is the tag as it exists
        # upstream. The other actions here read `# v5`, `# v6.4.0`, `# v7.0.1`
        # because THEIR tags carry one. Writing `# v0.19.0` to match the house
        # pattern would name a tag that does not exist, which is worse than an
        # inconsistent comment — the SHA is the pin either way, and the
        # comment's only job is to say which release it resolves to.
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ hashFiles('.bazelrc', '.bazelversion', 'MODULE.bazel', '**/go.mod', '**/go.sum') }}
          repository-cache: true

      - name: Report whether Bazel answers
        # Its own name in the step list, because rule 2 of compute-bumps.sh is a
        # `bazel query` and a Bazel that cannot start produces the same empty
        # answer as a module that reaches nothing. #227's d625975 row — step 6
        # in 0 s, green — is what that looks like from the outside.
        #
        # A WARNING and not a failure, deliberately. Failing here would block a
        # pkg/-only release, which needs no query at all, on an unrelated
        # toolchain problem — and the point of this file is that publication
        # stops being blocked silently, not that it starts being blocked loudly.
        # The refusal lives where the answer is load-bearing instead:
        # compute-bumps.sh --require-bazel refuses only when rule 1 did not fire
        # AND internal/ module dirs changed, i.e. exactly when a missing bazel
        # would change the verdict.
        continue-on-error: true
        run: |
          set -uo pipefail
          if ! command -v bazel >/dev/null 2>&1; then
            echo "::warning::bazel is not on PATH after Setup Bazel — an internal/-only change cannot be sized and will refuse (--require-bazel)"
            exit 0
          fi
          bazel --version || echo "::warning::bazel is on PATH but could not report its version"

      - name: Configure git identity
        # The owning account's GitHub noreply address, not a domain one.
        # post-commit accepts an author only as
        # `<id>+<login>@users.noreply.github.com` or an app/bot noreply, so
        # `ci@kitsunium.com` could never pass whatever the `authors` list said.
        # Every release commit it produced is tainted for good: the tags
        # pointing at them are cached by the module proxy and cannot be moved
        # without breaking `go get` for anyone who already fetched them. This
        # closes the source rather than chasing the consequence.
        #
        # The display name stays kitsunium-bot. Only the address is matched,
        # and the name is what makes a release commit legible as CI's work.
        run: |
          git config user.email "133899878+kodflow@users.noreply.github.com"
          git config user.name "kitsunium-bot"

      - name: Compute the release token
        id: compute
        env:
          # Route the workflow_dispatch input through an env var rather than
          # interpolating ${{ inputs.force_bumps }} straight into the shell —
          # direct interpolation is a template-injection sink (a value like
          # 'pkg"; rm -rf /; echo "' would execute before the grep filter).
          FORCE_BUMPS: ${{ inputs.force_bumps }}
        run: |
          set -euo pipefail
          # Computed into a FILE, then copied into GITHUB_OUTPUT. The previous
          # shape opened the `majors<<EOF` block, ran the producer, then closed
          # it — so a producer that failed mid-write left a half-written
          # heredoc in the file GitHub parses, on top of failing the step.
          majors=/tmp/sdk-release-majors.txt
          : > "$majors"

          if [ -n "$FORCE_BUMPS" ]; then
            # No `|| true` on the filter either: a force input that matches
            # nothing is a typo, and publishing nothing because of a typo is
            # the outcome this whole file now refuses to call a success.
            # A token is a module directory or a legacy word; cut-tags.sh
            # refuses one go.work does not name. The filter only keeps the
            # characters a directory may spell.
            printf '%s\n' "$FORCE_BUMPS" | tr ' ' '\n' | grep -E '^[A-Za-z0-9._/-]+$' > "$majors"
            reason="forced by workflow_dispatch: $(tr '\n' ' ' < "$majors")"
          else
            # No `|| true`: compute-bumps.sh exits 0 on a legitimate no-op
            # (empty output), so a non-zero exit is a real failure that must
            # fail the job — not be masked into a silent no-op release.
            #
            # --explain puts the verdict and its reason on stderr, which is this
            # step's log; --require-bazel refuses rather than skipping the rdeps
            # half when bazel is missing. Both exist because "nothing to
            # publish" and "nothing was measured" used to print the same zero
            # bytes (#226, #227).
            bash scripts/release/compute-bumps.sh --explain --require-bazel \
              > "$majors" 2> /tmp/compute.err
            cat /tmp/compute.err >&2
            # awk, not `grep | tail`: awk reads to EOF and exits 0 whether or
            # not it matched, so a missing verdict line cannot fail the step
            # under pipefail nor be read as an empty one.
            reason="$(awk '/verdict:/ { sub(/^.*verdict: */, ""); v = $0 } END { print v }' /tmp/compute.err)"
            [ -n "$reason" ] || reason="compute-bumps.sh printed no verdict line"
          fi

          {
            echo "majors<<SDK_RELEASE_MAJORS_EOF"
            cat "$majors"
            echo "SDK_RELEASE_MAJORS_EOF"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

      - name: Check the version floor
        # ADR 0171 §2: no module path is tagged at or below the highest version
        # proxy.golang.org lists for it. cut-tags.sh cuts the next version above
        # each module's last tag HERE, so the floor holds when no module's last
        # tag here is below the proxy's, and no module never tagged here is a
        # path the proxy already serves — which this asks the proxy, not the
        # clone. A proxy that cannot answer fails the step: "never published"
        # is the one reading that would let a v0.1.0 through.
        if: steps.compute.outputs.majors != ''
        run: bash scripts/release/check-version-floor.sh

      - name: Rehearse the release on a file proxy
        # The release guard (ADR 0171 §7): the same cut, made first in a
        # throwaway clone with --no-push, then rehearsed on a GOPROXY=file://
        # directory by proxy-rehearsal.sh — every family it cuts added to a
        # consumer of the monolithic root, `go get -u ./...` from that root, a
        # consumer on …/pkg v0.17.0, and every family it does NOT cut built at
        # its last tag against this release's internal and families. Nothing it
        # tags leaves the clone. A held bootstrap (3) and a refused size (65)
        # are the cut step's to report; any other failure stops the release.
        # Runs in a dry run too.
        if: steps.compute.outputs.majors != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAJORS: ${{ steps.compute.outputs.majors }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -uo pipefail
          args=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            args+=(--allow-bootstrap)
          fi
          case "${BUMP:-}" in
            "") ;;
            patch | minor | major) args+=("--bump=$BUMP") ;;
            *)
              echo "::error::the bump input must be patch, minor or major (or empty); got '$BUMP'"
              exit 64
              ;;
          esac
          rc=0
          printf '%s\n' "$MAJORS" | bash scripts/release/rehearse-release.sh ${args[@]+"${args[@]}"} || rc=$?
          case "$rc" in
            0) ;;
            3 | 65) echo "::notice::the rehearsal stopped where the cut will (exit $rc); the next step reports it" ;;
            *)
              echo "::error::the release rehearsal on a file proxy failed (exit $rc) — nothing was cut"
              exit "$rc"
              ;;
          esac

      - name: Cut and push tags
        id: cut
        if: steps.compute.outputs.majors != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through the environment, not `${{ }}` inside the shell string. The
          # value is our own script's stdout today, but it is multi-line by
          # contract and the file already argues this case for force_bumps.
          MAJORS: ${{ steps.compute.outputs.majors }}
          # Empty on every automatic run. cut-tags.sh validates it (a value
          # that is not a size exits 64), so a typo in the dispatch form cannot
          # read as "patch".
          BUMP: ${{ inputs.bump }}
        run: |
          set -uo pipefail
          # GitHub invokes this step as `bash -e`, which re-enables errexit even
          # though the line above deliberately omits it. Disable it explicitly:
          # the cut-tags pipeline below may exit 3 (a HELD bootstrap, not a
          # failure) and errexit would abort before the rc==3 handler runs.
          # Real failures still fail the job via the explicit `exit "$rc"` below.
          set +e
          # A manual workflow_dispatch authorises the bootstrap release — the
          # very first one, and the SDK module's first root tag after the
          # pkg/vX.Y.Z history (ADR 0162), the first release of its content;
          # automatic runs must NOT blind-cut it — cut-tags exits 3 to signal a
          # held bootstrap (ADR 0009: validate the module zip + a clean-room
          # go-get first).
          # An ARRAY, each element one argument. The `bump` input is free text
          # typed into a dispatch form, and expanding it unquoted inside a flags
          # string would split `patch --range=<other>` into two options that
          # cut-tags.sh accepts independently — a size and a range nobody meant.
          # The value is checked here, before it becomes an argument at all, and
          # then passed as exactly one.
          args=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            args+=(--allow-bootstrap)
          fi
          # The dry run (a dispatch's default): cut-tags.sh computes the
          # version and every tag, checks every go.mod it would publish, prints
          # `DRY-RUN: would tag: …` and pushes nothing.
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          case "${BUMP:-}" in
            "") ;;
            patch | minor | major) args+=("--bump=$BUMP") ;;
            *)
              echo "::error::the bump input must be patch, minor or major (or empty); got '$BUMP'"
              exit 64
              ;;
          esac
          # stderr is kept in a file, then shown: it carries the size and where
          # it came from — or the refusal and the two ways out of it — and the
          # summary below quotes it, so a refused run says why on its own page.
          # A plain redirect rather than `2> >(tee …)`: a process substitution
          # is not waited for, and the summary step could read a file its tee
          # had not finished writing.
          # --manifest: release-manifest.json, the release's identity (ADR
          # 0171) — written by the dry run too, as the release it would cut.
          args+=(--manifest=/tmp/release-manifest.json)
          printf '%s\n' "$MAJORS" | bash scripts/release/cut-tags.sh ${args[@]+"${args[@]}"} 2>/tmp/cut.err | tee /tmp/cut.log
          rc=${PIPESTATUS[1]}
          cat /tmp/cut.err >&2
          if [ "$rc" -eq 3 ]; then
            # A HELD bootstrap publishes nothing ON PURPOSE, so it is the one
            # case the publication assertion below must not fire on. Recorded as
            # an output rather than inferred from an empty cut.log, which is
            # also what a silent failure looks like.
            echo "held=true" >> "$GITHUB_OUTPUT"
            echo "::notice::First release of the SDK module held for manual validation (ADR 0009, ADR 0162). Dispatch this workflow manually, with bump=minor for v0.18.0, once the module zip + a clean-room 'go get' are verified."
            exit 0
          fi
          echo "held=false" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Check the dry run's tags against the version floor
        # The step before the cut asks the floor of each module's LAST tag; this
        # asks it of each tag the dry run would cut — modules and tombstones,
        # from the manifest it wrote —, so a dispatch's dry run shows a version
        # the proxy would refuse before anybody dispatches the real cut.
        if: steps.compute.outputs.majors != '' && steps.cut.outputs.held != 'true' && env.DRY_RUN == 'true'
        run: |
          set -euo pipefail
          if [ ! -s /tmp/release-manifest.json ]; then
            echo "::error::the dry run wrote no release-manifest.json"
            exit 1
          fi
          bash scripts/release/check-version-floor.sh --manifest=/tmp/release-manifest.json

      - name: Verify the computed release was actually published
        # #227 defect 2. A bump was computed, so a release IS happening — a run
        # that then pushes no tag is a failure, not a quiet success. This is the
        # assertion whose absence made run 34861207918 green.
        #
        # Reads the tag list cut-tags.sh wrote rather than re-deriving it: the
        # question is "did the publication happen", and only its own output can
        # answer that. A missing or empty list, a tag no anchored shape of
        # lib/tag-format.sh accepts (release-notes.sh refuses it), a missing
        # manifest, or a manifest that does not name exactly the tags pushed
        # are all failures; none of them is a release.
        if: steps.compute.outputs.majors != '' && steps.cut.outputs.held != 'true' && env.DRY_RUN != 'true'
        env:
          MAJORS: ${{ steps.compute.outputs.majors }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/cut.log ]; then
            echo "::error::cut-tags.sh published no tag for '$MAJORS'"
            exit 1
          fi
          counts="$(bash scripts/release/release-notes.sh count /tmp/cut.log)"
          if [ ! -s /tmp/release-manifest.json ]; then
            echo "::error::cut-tags.sh wrote no release-manifest.json"
            exit 1
          fi
          pushed="$(awk 'NF' /tmp/cut.log | LC_ALL=C sort)"
          listed="$(jq -r '(.modules[].tag), (.tombstones[])' /tmp/release-manifest.json | LC_ALL=C sort)"
          if [ "$pushed" != "$listed" ]; then
            echo "::error::the manifest does not name the tags pushed"
            diff <(echo "$pushed") <(echo "$listed") >&2 || true
            exit 1
          fi
          echo "::notice::published $(jq -r '.release' /tmp/release-manifest.json) — $counts"

      - name: Create the GitHub release
        # ONE release per run (ADR 0162, ADR 0171) — not one per module, which
        # made eighteen for a lockstep release. Every tag the run cut is listed
        # in its notes, ahead of the notes GitHub generates, and the manifest is
        # attached; the tombstones of the first release are listed apart. GitHub's
        # notes start at the primary module's previous tag (--notes-start-tag,
        # release-notes.sh start-tag). The notes are
        # scripts/release/release-notes.sh's, which classifies each tag by the
        # anchored shapes of lib/tag-format.sh and refuses one it does not know.
        if: steps.compute.outputs.majors != '' && steps.cut.outputs.held != 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # ONE release per run (ADR 0171), on the manifest's `release` — the
          # first tag cut-tags.sh printed, the SDK's when it was cut — with the
          # manifest attached, so the release names every module and version.
          primary="$(jq -r '.release' /tmp/release-manifest.json)"
          bash scripts/release/release-notes.sh notes /tmp/cut.log > /tmp/release-notes.md
          # The generated notes start at the primary module's own last tag, the
          # manifest's `previous`: every tag names a release commit made off
          # main, so the last one is never an ancestor and GitHub, left to pick,
          # picked none — v0.18.0 to v0.28.0 listed every pull request since
          # #130. Omitted only when the module was never tagged before.
          start="$(bash scripts/release/release-notes.sh start-tag /tmp/release-manifest.json)"
          from=()
          if [ -n "$start" ]; then
            from=(--notes-start-tag "$start")
          fi
          # --notes, which gh documents as PREPENDED to the generated notes.
          gh release create "$primary" /tmp/release-manifest.json --generate-notes ${from[@]+"${from[@]}"} --verify-tag --title "$primary" --notes "$(cat /tmp/release-notes.md)"

      - name: Check the release on the module proxy
        # A tag on origin is not yet a version a consumer resolves: the proxy
        # fetches it on the first request, and that can fail where every step
        # above is green. For each tag of the manifest, modules and tombstones,
        # proxy.golang.org must serve its .info (retried: the proxy keeps a
        # negative answer for minutes) and `go mod download` must fetch and
        # check it, the checksum database on. A failure is loud; the table goes
        # to the job summary (scripts/release/check-published.sh, ADR 0171 §7).
        # After the GitHub release, so a proxy that is slow to answer never
        # leaves pushed tags without their release record.
        if: steps.compute.outputs.majors != '' && steps.cut.outputs.held != 'true' && env.DRY_RUN != 'true'
        run: bash scripts/release/check-published.sh --manifest=/tmp/release-manifest.json

      - name: Emit release summary artifact
        # No longer gated on a bump having been computed. A run that published
        # nothing is exactly the run nobody could account for afterwards
        # (#226/#227): the summary is where it now says so, in the run page and
        # in a retained artifact, naming the reason compute-bumps.sh gave.
        if: always()
        env:
          MAJORS: ${{ steps.compute.outputs.majors }}
          REASON: ${{ steps.compute.outputs.reason }}
          HELD: ${{ steps.cut.outputs.held }}
          CUT_OUTCOME: ${{ steps.cut.outcome }}
        run: |
          set -uo pipefail
          # The size line cut-tags.sh wrote, if it got that far. awk reads to
          # EOF and prints nothing when there is no such line or no file.
          size="$(awk '/^cut-tags: size / { sub(/^cut-tags: size /, ""); v = $0 } END { print v }' /tmp/cut.err 2>/dev/null)"
          {
            echo "## SDK release summary"
            echo
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- Date: $(date -u +%FT%TZ)"
            echo "- Verdict: ${REASON:-(the compute step did not reach a verdict)}"
            if [ -n "$size" ]; then
              echo "- Size: $size"
            fi
            echo
            if [ "${CUT_OUTCOME:-}" = "failure" ]; then
              echo "### Nothing was published: the release was refused"
              echo
              echo "cut-tags.sh stopped before tagging. Its own words:"
              echo
              echo "\`\`\`"
              awk '/^cut-tags:/' /tmp/cut.err 2>/dev/null || true
              echo "\`\`\`"
              echo
              echo "A refused SIZE is settled by labelling the pull request it names"
              echo "(release:patch, release:minor or release:major) and re-running this"
              echo "job, or by dispatching SDK Release with \`bump\` — ADR 0135."
            elif [ -z "${MAJORS:-}" ]; then
              echo "### Nothing was published"
              echo
              echo "No bump token was computed for this range, so no tag was cut."
              echo "This is a legitimate outcome for a change that carries nothing"
              echo "consumer-visible. The reason above is the calculator's own; the"
              echo "full reasoning is in the \`Compute the release token\` step log."
            elif [ "${DRY_RUN:-}" = "true" ]; then
              echo "### Dry run: nothing was published"
              echo
              echo "Token \`${MAJORS}\`. The tags this release would cut, as"
              echo "cut-tags.sh --dry-run printed them:"
              echo
              echo "\`\`\`"
              awk '/^DRY-RUN: would tag:/' /tmp/cut.log 2>/dev/null || echo "(none)"
              echo "\`\`\`"
              echo
              echo "The manifest it would write:"
              echo
              echo "\`\`\`json"
              cat /tmp/release-manifest.json 2>/dev/null || echo "(none)"
              echo "\`\`\`"
              echo
              echo "A real cut is a dispatch with dry_run=false, and needs the"
              echo "repository variable RELEASE_ENABLED=true (ADR 0171)."
            elif [ "${HELD:-}" = "true" ]; then
              echo "### Held (bootstrap)"
              echo
              echo "Bump \`${MAJORS}\` computed; the first release of the SDK module is"
              echo "held for manual validation (ADR 0009, ADR 0162). Nothing was"
              echo "published, on purpose. Dispatch SDK Release with \`bump=minor\` —"
              echo "v0.18.0, after pkg/v0.17.0 — once the module zip and a clean-room"
              echo "\`go get\` are verified."
            else
              echo "### Release token"
              echo
              echo "\`\`\`"
              echo "${MAJORS}"
              echo "\`\`\`"
              echo
              echo "### Tags pushed"
              echo
              echo "\`\`\`"
              cat /tmp/cut.log 2>/dev/null || echo "(none)"
              echo "\`\`\`"
            fi
          } > /tmp/release-summary.md
          # Both destinations. The artifact survives 30 days for an audit; the
          # step summary is what a maintainer sees without downloading anything,
          # and not being able to see it was the whole of #227 defect 2.
          cat /tmp/release-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-summary-${{ github.run_number }}
          path: /tmp/release-summary.md
          retention-days: 30
