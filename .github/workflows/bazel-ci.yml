name: SDK CI (Bazel)

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue builds each entry on a gh-readonly-queue/main/pr-<n>-<sha>
  # ref and waits for the REQUIRED checks (`bazel`, here) to report on it; a
  # workflow without this trigger never reports and the entry waits until the
  # queue times it out. checks_requested is the only type the event has. The
  # push to main after the queue lands still runs this workflow, which is what
  # sdk-release.yml waits for (see .github/workflows/CLAUDE.md §Merge queue).
  merge_group:
    types: [checks_requested]

# Cancel in-progress runs when a newer commit on the same ref arrives so
# rapid re-pushes do not spawn parallel builds that corrupt bazel caches
# or upload duplicate artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bazel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # `bazel` and `post-commit` are the only required checks on main (the
    # branch protection names `bazel`, the ruleset `post-commit` — measured
    # with `gh api`). shell-gates (ci-gates-check and three BATS suites) and
    # lint-ktn (ktn-linter) and models (the behaviour models) are siblings; on
    # their own their failures block nothing. So this job waits for all three
    # and fails at once when any did not succeed — the gates they run are as blocking as the ones below
    # (#236).
    #
    # `needs:` alone would be worse than nothing: a job skipped because a job
    # it needs failed concludes `skipped`, and GitHub counts a skipped required
    # check as passing. `!cancelled()` keeps this job running when a needed
    # job fails, so the first step below is what turns the failure into a red
    # `bazel`. scripts/ci-gates-check.sh asserts all three pieces, per job.
    #
    # This job keeps the workflow's `contents: read` and nothing more. The
    # id-token ktn-linter needs is granted to lint-ktn alone: a job granted it
    # exports ACTIONS_ID_TOKEN_REQUEST_URL to every process, and the
    # entitlement suites `make test-framework` runs here read exactly that
    # variable to decide they are on CI (#300's first run).
    needs: [shell-gates, lint-ktn, models]
    if: ${{ !cancelled() }}
    steps:
      - name: shell-gates, lint-ktn and models succeeded
        env:
          SHELL_GATES_RESULT: ${{ needs.shell-gates.result }}
          LINT_KTN_RESULT: ${{ needs.lint-ktn.result }}
          MODELS_RESULT: ${{ needs.models.result }}
        run: |
          failed=0
          if [ "$SHELL_GATES_RESULT" != success ]; then
            echo "::error::the shell-gates job concluded '$SHELL_GATES_RESULT'; its gates block the merge through this required job"
            failed=1
          fi
          if [ "$LINT_KTN_RESULT" != success ]; then
            echo "::error::the lint-ktn job concluded '$LINT_KTN_RESULT'; ktn-linter blocks the merge through this required job"
            failed=1
          fi
          if [ "$MODELS_RESULT" != success ]; then
            echo "::error::the models job concluded '$MODELS_RESULT'; a behaviour model that is not the code's blocks the merge through this required job"
            failed=1
          fi
          exit "$failed"

      # SHA-pinned per the .github/workflows/CLAUDE.md policy — version
      # comments track the resolved human-readable tag.
      #
      # fetch-depth: 0 — full history. gomarkdoc needed it for the README
      # source links (ADR 0008); genindex, which writes the READMEs now (ADR
      # 0167), does not, and narrowing the clone is a change of its own,
      # measured against every other step of this job.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          # .bazelversion included so a Bazel version bump invalidates the
          # disk-cache (otherwise stale objects could survive the upgrade).
          disk-cache: ${{ github.workflow }}-${{ hashFiles('.bazelrc', '.bazelversion', 'MODULE.bazel', '**/go.mod', '**/go.sum') }}
          repository-cache: true

      # setup-bazel only provides a Bazel-sandboxed Go SDK; the README
      # drift gate, the lint gate and govulncheck run outside Bazel and need a
      # host Go toolchain on $PATH. SHA matches sdk-release.yml's pin. The go
      # line is the SDK module's, at the root (ADR 0162); it requires no other
      # module, so it has no go.sum, and the cache keys on every module's that
      # does — the vendor modules and the connectors `make test-framework` and
      # `make vuln-check` build.
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: drift check — bazel mod tidy + gazelle
        run: |
          bazel mod tidy
          bazel run //:gazelle
          # Catch both modifications to tracked files AND new untracked BUILD/go
          # files that gazelle created — `git diff --exit-code` alone misses
          # the untracked case (finding #11 from post-audit review).
          git diff --exit-code || {
            echo "::error::Run 'bazel mod tidy && bazel run //:gazelle' locally and commit."
            exit 1
          }
          if git ls-files --others --exclude-standard | grep -E '(BUILD\.bazel|go\.sum|go\.mod)$'; then
            echo "::error::Gazelle created untracked BUILD.bazel/go.mod/go.sum files — commit them."
            exit 1
          fi

      # README drift gate (ADR 0167, amending ADR 0008): every README under
      # pkg/ and framework/ is what tools/genindex -write-readmes writes from
      # the committed docs/api — the SDK's own stdlib-only tool, so there is
      # no binary to install and no determinism step to keep it honest. Sits
      # between the gazelle drift check and `bazel build` so a stale README
      # fails fast before the heavy build+test burn; `make lint` runs the
      # same script.
      - name: drift check — README.md regenerated
        run: bash scripts/pre-commit/check-readme-drift.sh

      - name: build
        run: bazel build --config=ci //...

      - name: test
        run: bazel test --config=ci //...

      # The framework's own suite reads its sources and asserts positions
      # relative to its module root, which a Bazel sandbox does not lay out:
      # //framework/internal/app:app_test is `manual` and this is its gate (rule 12,
      # ADR 0147). The framework's packages in the SDK module and its four
      # connector modules, `go test -race`, GOWORK=off.
      - name: framework suites (go test -race)
        run: make test-framework

      # Every target below carries at least one //go:build !race test
      # (testing.AllocsPerRun / testing.Benchmark report a spurious +1 under
      # -race), so the race suite above never compiles them. This race-off pass
      # is their ONLY gate — a `!race` test in a package missing from the list
      # runs nowhere at all. The list is shared with `make test-alloc` and with
      # check-alloc-lane-coverage.sh, which fails the build on an orphan.
      - name: alloc + zero-alloc gates (race off)
        run: |
          targets=$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' tools/alloc-lane-targets.txt | tr '\n' ' ')
          echo "alloc lane targets: $targets"
          bazel test --config=alloc $targets

      # Guards the invariant the step above depends on: no //go:build !race
      # test may exist outside the alloc lane's target list.
      - name: exemption invariant — alloc lane covers every !race test
        run: bash scripts/pre-commit/check-alloc-lane-coverage.sh

      # Guards the invariant the errs AST audit depends on: it judges only the
      # files staged as its runfiles via //:audit_sources, so a package that
      # declares codes but is missing from that list is audited by nothing AND
      # passes green. ADR 0020 records this gap once already; all five
      # internal/service/net/* packages had silently reopened it.
      - name: audit-coverage invariant — every code-declaring package is audited
        run: bash scripts/pre-commit/check-audit-coverage.sh

      # Guards the root CLAUDE.md against the drift parallel union merges
      # produce: a core/ tree that no longer matches internal/core, a domain
      # described twice, or two whole Purpose paragraphs coexisting. Both
      # checks key on the directories on disk rather than on a count.
      - name: domain-doc invariant — the root CLAUDE.md still describes the tree
        run: bash scripts/pre-commit/check-domain-docs.sh

      # Guards ADR 0160's symmetry, which six tracks applied by hand and which
      # reopens silently: a service package declaring its own error code still
      # compiles and is still audited (the audits ask that a package be listed,
      # not where it sits), and a codes-only core mirror whose engine moved
      # still compiles too. Fails when internal/service declares a code, when a
      # service domain has no core, or when a core package declares a code no
      # engine at its path owns.
      - name: core-symmetry invariant — every service domain has a core, and only the core declares codes
        run: bash scripts/pre-commit/check-core-symmetry.sh

      # Three guards the in-repo pre-commit hook used to be the only runner of
      # (ADR 0153): every Go package carries its CLAUDE.md / README.md, every
      # package with a *_bench_test.go commits a BENCH.md, and
      # docs/error-codes.yaml matches what scripts/gen-error-codes.sh produces.
      - name: package-doc invariant — every Go package is documented
        run: bash scripts/pre-commit/check-pkg-docs.sh

      - name: bench-doc invariant — every bench package commits a BENCH.md
        run: bash scripts/pre-commit/check-bench-md.sh

      - name: error-code registry drift — docs/error-codes.yaml is current
        run: bash scripts/pre-commit/check-error-codes-drift.sh

      # Guards the layer direction kernel → core → service → pkg/v1. ADR 0004
      # put it on Bazel visibility, but Gazelle gives every package under an
      # internal/ directory //:__subpackages__, which admits the whole
      # repository — a kernel package importing core was shown to build. The
      # direction is therefore asserted on the dependency graph (ADR 0068).
      - name: layer invariant — no layer depends on one above it
        run: bash scripts/check-layer-deps.sh

      # scripts/ci/platforms.sh is the table tools/genindex judges doc links
      # and writes docs/api on, and the cross-build matrix below is what CI
      # compiles. A job's matrix has to be written here, so the table is
      # written twice and this holds the two equal, cells and order.
      - name: platforms invariant — the platforms table is the cross-build matrix
        run: bash scripts/pre-commit/check-platforms.sh

      # The three checks of `make lint` that no lane ran (#236): `gofumpt -l`,
      # sdkguard and ktn-linter (the lint-ktn job, which this one needs). The
      # other five are the steps above — gazelle drift, alloc-lane,
      # audit-coverage, domain-docs, layer-deps — so this adds a class of
      # analysis, it does not repeat one. `make lint-check`
      # also runs `make doclinks` (ADR 0138) and `make api-check`: docs/api
      # regenerated from the code on every cell and compared byte for byte, the
      # code's surface held to the pins' markers and every generated file to
      # its design file's bytes (ADR 0163).
      #
      # These sit INSIDE the `bazel` job deliberately. `bazel` and `post-commit`
      # are the only required checks on main (the legacy branch protection and
      # the ruleset each name one, and they are additive); a sibling job blocks
      # only through this one, as shell-gates does. Making a new job required
      # is a merge-policy change, which is not this workflow's to decide.
      - name: install gofumpt (pinned)
        env:
          # Pinned, never `latest`. A lane that follows `latest` changes its
          # verdict with no commit of this repository moving. Moving the pin is
          # then a reviewable diff.
          GOFUMPT_VERSION: v0.12.0
        run: go install "mvdan.cc/gofumpt@${GOFUMPT_VERSION}"

      - name: lint gate — gofumpt + sdkguard + doclinks + docs/api
        run: make lint-check

      # govulncheck, in source mode, over every module of the census (#210,
      # ADR 0136). ADR 0004 retired the old pipeline's four govulncheck jobs
      # with it, `bazel test` carries no vulnerability database, and from then
      # on nothing scanned the runtime; Dependabot alerts on the manifest and
      # cannot tell a vulnerable symbol the SDK calls from one it never reaches.
      #
      # BLOCKING, in this job, deliberately. A vulnerability published between
      # two merges turns every pull request red until a dependency (or the Go
      # toolchain) moves — and that is the point: the SDK's requirements are the
      # floor every consumer inherits, so the fix is ours to ship and nothing
      # else should merge ahead of it. Only a REACHABLE symbol fails the step;
      # an imported-but-uncalled vulnerable package is reported and passes.
      # vuln-scan.yml runs the same target every day, so a finding surfaces
      # without waiting for somebody's pull request.
      - name: install govulncheck (pinned)
        run: make vuln-install

      - name: vulnerability gate — govulncheck over every module
        run: make vuln-check

      - name: coverage
        run: |
          bazel coverage --combined_report=lcov //...
          cp "$(bazel info output_path)/_coverage/_coverage_report.dat" coverage.lcov

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Unique per-run artifact name so concurrent runs never silently
          # deduplicate coverage reports (finding #28).
          name: coverage-${{ github.run_number }}
          path: coverage.lcov
          # The repo caps artifact retention at 1 day; request that explicitly so
          # the run does not emit a "retention-days greater than max" warning.
          retention-days: 1
          if-no-files-found: warn

  # ktn-linter — its own job, because it is the only one that needs an
  # id-token, and a job granted one exports ACTIONS_ID_TOKEN_REQUEST_URL to
  # every process it starts: the entitlement suites of the `bazel` job read
  # that variable and took the CI path when the grant sat there. Not a
  # required check itself; `bazel` needs it and fails when it did not succeed,
  # exactly as for shell-gates.
  lint-ktn:
    name: lint gate — ktn-linter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A job-level block REPLACES the workflow's, so contents: read is restated.
    # The id-token grant is for ktn-linter's licence check alone: the runner's
    # OIDC token is how a CI run proves it is one. No other job asks for it,
    # and the workflow root does not grant it.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # ktn-linter loads packages through the go command, so it needs the
      # toolchain and the module cache the `bazel` job sets up the same way.
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: '**/go.sum'

      # ktn-linter, through the vendor's PUBLIC channel (#236). kodflow/ktn
      # publishes the release binary and a setup action that installs it and
      # proves the licence with the runner's own OIDC token: no key and no
      # repository secret, and a CI run spends no device seat. That is what
      # the id-token grant in this job's permissions is for, and the only thing.
      # The licence covers this run when the published roster lists the
      # NUMERIC id of the repository's owner (`repository_owner_id` in the
      # token) — here the kitsunium organisation, not a person.
      #
      # This replaces a from-source build of the private repository, fetched
      # with a repository secret that was never created — so all three of its
      # steps were skipped on every run. `lint-ktn-check` is in
      # scripts/ci-gates-check.sh's GATES from this change on. `make lint-ktn-install` stays the local, from-source
      # alternative (Makefile).
      #
      # One pin holds and two cannot. The action is pinned by commit, so its
      # steps do not move under this lane; the installer it runs
      # (kodflow/ktn@main/install.sh, checksum-verified) and the binary are
      # rolling-latest by the vendor's design — exactly one release stays
      # downloadable, and the signed roster's minimum version makes an older
      # binary upgrade itself. The version the run used is printed by the
      # action's licence step and by the linter itself.
      #
      # The one skip is forced by GitHub: a pull request from a fork, and a
      # Dependabot one, receive no id-token, so the licence check cannot pass
      # there. Those two are skipped with a warning; every other run that
      # finds no token FAILS, because the token missing anywhere else means
      # the permission was lost, and a gate that skips itself quietly is not a
      # gate. A fork pull request cannot merge without a maintainer, whose own
      # pushes lint (scripts/CLAUDE.md §ktn-linter in CI).
      # A merge_group run is neither: it is a run of this repository's own
      # workflow on its own queue ref, so it receives an id-token like a push,
      # `github.event.pull_request` is empty (HEAD_REPO is '') and EVENT is not
      # pull_request, so the skip below does not apply and the token check does.
      - name: can this run prove it is CI (OIDC)
        id: ktnoidc
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$EVENT" = pull_request ] && { [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [ "$ACTOR" = 'dependabot[bot]' ]; }; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo "::warning title=ktn-linter gate did not run::this is a pull request from a fork (${HEAD_REPO}) or from Dependabot, and GitHub gives such a run no id-token, so ktn-linter cannot prove its licence here. The maintainer's push that lands it is linted (#236)."
            exit 0
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error title=ktn-linter has no OIDC token::this run is neither a fork nor a Dependabot pull request, yet no id-token is available — the lint-ktn job lost 'permissions: id-token: write'. Refusing to skip the gate."
            exit 1
          fi
          echo 'run=true' >> "$GITHUB_OUTPUT"

      # kodflow/ktn main, resolved 2026-10-13 with
      # `gh api repos/kodflow/ktn/commits/main --jq .sha`; setup/action.yml
      # last changed in 5a71b64b (#27, the OIDC licence). Its own last step
      # runs `ktn-linter license status` and fails unless it reads valid.
      - name: install ktn-linter + verify its licence (OIDC)
        if: steps.ktnoidc.outputs.run == 'true'
        uses: kodflow/ktn/setup@c04471fd26f73fc099b3acd6fd5305b3308003d9 # main @ 2026-09-28

      - name: lint gate — ktn-linter
        if: steps.ktnoidc.outputs.run == 'true'
        run: make lint-ktn-check

  # Shell gates — the checks that need neither Bazel nor Go. A sibling job, so
  # a broken release script is reported in seconds instead of behind a 120-minute
  # Bazel lane, and so the Bazel cache is irrelevant to it. It is not a required
  # check itself: the `bazel` job needs it and fails when it did not succeed,
  # which is how its gates block a merge.
  #
  # These are the first `make` invocations in this workflow. Everything else here
  # calls bazel or bash directly; ci-gates-check asserts the Makefile↔CI link for
  # the targets it lists, which only works if CI goes through the target name.
  shell-gates:
    name: shell gates — release scripts + gate enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # bats-core is not vendored and the test runner deliberately does not fetch
      # it: a gate that clones a third-party repository on every run is a flake.
      # The distro package is the one route CI takes, and it is one of the three
      # the runner names when bats is absent.
      - name: install bats-core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats

      - name: CI gate enforcement
        # A Makefile target CI never runs is documentation, not a gate. This
        # fails when a gate is renamed out from under its CI step, or when the
        # step is deleted and the target survives as advice. Its own target is in
        # the manifest, which catches every gate but itself: nothing that has
        # been deleted can report its own deletion. See ADR 0088 Deferred.
        run: make ci-gates-check

      - name: release script regression
        # scripts/release/*.bats guards the two scripts that decide which tag
        # every merge gets, and from the commit that added it (ADR 0085) until
        # this lane existed, nothing executed it. Three of the defects it covers
        # produce a plausible version rather than an error: `separator=,` in a
        # %(trailers:…) format concatenates two repeated trailers, so
        # `Release-bump: mi` + `Release-bump: nor` reads back as the single value
        # `minor` and cuts a minor release — measured on git 2.47.3, invisible on
        # review. See ADR 0088.
        run: make release-scripts-check

      - name: CI script regression
        # scripts/ci/ holds the module census every module-looping lane reads
        # and the govulncheck gate built on it (ADR 0136, ADR 0137). The census
        # replaced three hand-written module lists that had drifted apart —
        # none of them named tools/genindex or tools/sdkguard (#242) — and this
        # suite includes a row asserting the lanes below still read it.
        run: make ci-scripts-check

      - name: pre-commit guard regression
        # scripts/pre-commit/ holds the commit gates themselves, and ADR 0088
        # recorded its own sweep as INCOMPLETE: two of them pipe into an
        # early-exiting reader exactly as the former commit-msg hook did. They fail in
        # OPPOSITE directions, which is why reading did not catch either.
        # check-ktn-phases-1-7.sh:69 fails CLOSED — a clean linter run is
        # reported as "the linter did not complete" (measured, marker first:
        # 64 KB 4/40, 96 KB 24/40, 400 KB 40/40). check-audit-coverage.sh:89
        # fails OPEN — a package that declares error codes and is absent from
        # //:audit_sources passes the guard that exists to catch it (measured:
        # 200 declaring lines 40/40). Both suites carry a negative control at
        # the same shape below the threshold, green in both passes, which is
        # what identifies grep's early exit rather than the volume.
        run: make pre-commit-check

  # Cross-platform build matrix — folded in from the former standalone
  # cross-platform.yml so the SDK has ONE per-PR CI workflow, not two. Enforces
  # the invariant that every package BUILDS, and its tests COMPILE, on every
  # supported GOOS (a platform-specific low-level call must never silently drop a
  # package, nor a test only one GOOS can compile — ADR 0094). `go build` then
  # `go vet` per module across the matrix — no Bazel (Bazel is Linux-only), so it
  # runs as a sibling job, not inside the bazel job. Local equivalent:
  # `bash scripts/cross-platform-audit.sh`.
  cross-build:
    name: cross-build ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          # 32-bit guard (issue #94): the packed-uint32 Code type is
          # arch-portable, so the whole SDK must build on 386/arm; these cells
          # keep it from regressing back to a 64-bit-only build constraint.
          - { goos: linux, goarch: "386" }
          - { goos: linux, goarch: arm }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: openbsd, goarch: amd64 }
          - { goos: netbsd, goarch: amd64 }
          - { goos: dragonfly, goarch: amd64 }
          # illumos and Solaris are two GOOS values (the solaris build tag
          # selects both, runtime.GOOS tells them apart) — ADR 0144.
          - { goos: illumos, goarch: amd64 }
          - { goos: solaris, goarch: amd64 }
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      # Each module is built standalone (GOWORK=off) so its own go.mod + replace
      # directives resolve; CGO disabled so the cross-build is hermetic. `go
      # build` never compiles a _test.go; `go vet` type-checks them, so a test
      # calling a helper that one GOOS alone defines fails here (ADR 0094).
      #
      # The modules come from the census, never from a list (ADR 0137): `./...`
      # stops at a nested go.mod, so this lane reached only the six modules it
      # named and tools/genindex and tools/sdkguard were built by nothing here
      # (#242). A module git tracks is in this loop the moment it exists, and
      # none is skipped: the root is the SDK module since ADR 0162, the one
      # that holds internal/, pkg/ and framework/.
      - name: cross-build every module, tests included
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          fail=0
          modules="$(bash scripts/ci/go-modules.sh)"
          for mod in $modules; do
            echo "::group::$mod ($GOOS/$GOARCH)"
            if (cd "$mod" && go build ./... && go vet ./...); then
              echo "ok"
            else
              echo "::error::$mod fails to build, or its tests to compile, on $GOOS/$GOARCH"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

  # 32-bit RUNTIME guard. cross-build above proves the SDK COMPILES on 386; it
  # cannot prove it behaves. The two are different questions, and the gap is
  # where a 64-bit assumption survives: `int(0xffffffff)` is -1 where int is 32
  # bits and passes every "> cap" check, which is exactly the bound
  # internal/service/security/session's at-rest frame relies on — two of its malformed
  # frames can only fail here. Found by adding this job: a bench helper that did
  # not compile (Statfs_t.Type is int32 on 386, int64 elsewhere) and a test
  # synthesising a slice longer than a 32-bit len can hold.
  #
  # Linux/amd64 runners execute 386 binaries natively, so this needs no
  # emulation. It runs WITHOUT -race, which has no 386 support at all, and that
  # is also what makes it the second lane to run the `//go:build !race` files
  # (rule 12's alloc lane is the first).
  test-386:
    name: test linux/386
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      # Each module standalone (GOWORK=off) so its own replace directives
      # resolve, exactly as cross-build does; CGO off because a 386 cgo
      # toolchain is not installed and nothing here needs one.
      #
      # Every module of the census (ADR 0137). This loop named four and the
      # other four had never run a test on 386: tools/genindex and
      # tools/sdkguard (477 passing tests, #242), the root module's
      # third-party/ tests and e2e's. All four were run on linux/386 before
      # being added, and pass. Those third-party/ tests now live in one module
      # per vendor (ADR 0157), which the census reaches like any other, and the
      # root is the SDK module since ADR 0162 — tested, never skipped.
      - name: test every module on linux/386
        env:
          GOARCH: "386"
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          fail=0
          modules="$(bash scripts/ci/go-modules.sh)"
          for mod in $modules; do
            echo "::group::$mod (linux/386)"
            if (cd "$mod" && go test ./...); then
              echo "ok"
            else
              echo "::error::$mod fails its tests on linux/386"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

  # The vector forms of internal/kernel/swar. They are compiled only with
  # GOEXPERIMENT=simd on amd64 (`//go:build goexperiment.simd && amd64`), a
  # tag no other lane sets, so nothing else compiles them and a Go upgrade can
  # break simd/archsimd (outside the Go 1 promise, ADR 0159) unseen: this lane
  # shows it first. The suite holds the AVX2 and SWAR forms to one scalar
  # oracle, race on, then runs the allocation budgets race off. It fails
  # closed on a runner without AVX2: a pass that exercised only the SWAR forms
  # would say nothing about the others, and TestVectorFormsRunHere logs which.
  # The submission itself builds WITHOUT the experiment; this is the one lane
  # that does.
  test-simd:
    name: test internal/kernel/swar with GOEXPERIMENT=simd
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: vet, then test the vector forms race on and race off
        env:
          GOEXPERIMENT: simd
          GOWORK: "off"
        run: |
          set -euo pipefail
          cd internal
          go vet ./kernel/swar/
          go test -race -count=1 -v -run '^TestVectorFormsRunHere$' ./kernel/swar/ | tee "$RUNNER_TEMP/vector.log"
          grep -q 'AVX2 vector forms exercised: true' "$RUNNER_TEMP/vector.log" \
            || { echo "::error::this runner reports no AVX2: the vector forms were not exercised"; exit 1; }
          go test -race -count=1 ./kernel/swar/
          go test -count=1 ./kernel/swar/

  # The docs portal, held to the code. docs/api is the
  # exported API tools/genindex reads from the code, and `make api-check` (in
  # the bazel job's lint gate) holds it byte for byte; the portal turns it into
  # the ⌘K symbol index and the API section of every package page. This job
  # builds the working tree's release alone — no release snapshot, no network,
  # about a minute — and fails unless the ⌘K entries and the anchors of the API
  # sections equal docs/api, counted by a script that shares no code with the
  # writer, and every link and ⌘K entry of the build resolves under the deploy
  # base, fragments included. Node only: the docs build runs no go command.
  # fetch-depth: 0 because the Home page's feature catalogue dates each feature
  # by the commit that added its anchor (git log --follow).
  docs-site:
    name: docs site — ⌘K and API sections equal docs/api, every link resolves
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: docs site — build the working tree, check it against docs/api
        run: make docs-check

  # The behaviour models, held to the code (kitsunium/studio ADR 0013): `make
  # models-check` runs the pinned kit's `kit design derive -check` and fails on
  # a model of design/behaviour that is missing, is not what the current code
  # derives, or is left over — a body changed without `make models`. kit lives
  # in kitsunium/studio, which is private: installing it needs the repository
  # secret KIT_READ_TOKEN (read access to kitsunium/studio). The `bazel` job
  # needs this one and checks its result, so a stale model blocks the merge.
  #
  # The one skip is forced by GitHub, as for lint-ktn: a pull request from a
  # fork, and a Dependabot one, receive no repository secret. Those two warn
  # and pass, the models NOT checked; the maintainer's push that lands them is
  # checked. Every other run that finds no secret FAILS, because the secret
  # missing anywhere else means it was removed, and a gate that skips itself
  # quietly is not a gate.
  models:
    name: models — design/behaviour is what the code derives
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Only the tool's repository is private: the SDK's own modules and
      # their requirements come from the module proxy.
      GOPRIVATE: github.com/kitsunium/studio
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: install the pinned kit
        id: kit
        env:
          KIT_READ_TOKEN: ${{ secrets.KIT_READ_TOKEN }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          . scripts/kit-pinned.sh
          version="$(kit_pin)"
          if [ -z "$version" ]; then
            echo "::error::design/sdk.yaml pins no kit (project.kit.version)"
            exit 1
          fi
          if [ -z "$KIT_READ_TOKEN" ]; then
            if [ "$EVENT" = pull_request ] && { [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [ "$ACTOR" = 'dependabot[bot]' ]; }; then
              echo "::warning title=models gate did not run::this is a pull request from a fork (${HEAD_REPO}) or from Dependabot, and GitHub gives such a run no repository secret, so kit $version cannot be installed from the private kitsunium/studio. The maintainer's push that lands it is checked."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error title=models has no KIT_READ_TOKEN::this run is neither a fork nor a Dependabot pull request, yet the repository secret KIT_READ_TOKEN is empty — kitsunium/studio is private, kit $version cannot be installed. Refusing to skip the gate."
            exit 1
          fi
          git config --global url."https://x-access-token:${KIT_READ_TOKEN}@github.com/kitsunium/".insteadOf "https://github.com/kitsunium/"
          go install "github.com/kitsunium/studio/cmd/kit@$version"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: the models are what the code derives
        if: steps.kit.outputs.ready == 'true'
        run: make models-check
