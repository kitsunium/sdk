name: SDK CI (Bazel)

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs when a newer commit on the same ref arrives so
# rapid re-pushes do not spawn parallel builds that corrupt bazel caches
# or upload duplicate artifacts. Matches docker-images.yml policy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bazel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # SHA-pinned per the .github/workflows/CLAUDE.md policy — version
      # comments track the resolved human-readable tag.
      #
      # fetch-depth: 0 — gomarkdoc resolves the repository URL + default
      # branch via `git symbolic-ref refs/remotes/origin/HEAD` to build
      # the source links in READMEs. A shallow clone (depth=1) makes
      # that lookup fail and gomarkdoc falls back to a bare-name link
      # shape that drifts from what local regen produces — the README
      # drift gate then fails on a phantom diff. Full history kills
      # the variability.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          # .bazelversion included so a Bazel version bump invalidates the
          # disk-cache (otherwise stale objects could survive the upgrade).
          disk-cache: ${{ github.workflow }}-${{ hashFiles('.bazelrc', '.bazelversion', 'MODULE.bazel', '**/go.mod', '**/go.sum') }}
          repository-cache: true

      # setup-bazel only provides a Bazel-sandboxed Go SDK; the README
      # drift gate + govulncheck run outside Bazel and need a host Go
      # toolchain on $PATH. SHA matches sdk-release.yml's pin.
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: pkg/go.mod
          cache: true
          cache-dependency-path: pkg/go.sum

      - name: drift check — bazel mod tidy + gazelle
        run: |
          bazel mod tidy
          bazel run //:gazelle
          # Catch both modifications to tracked files AND new untracked BUILD/go
          # files that gazelle created — `git diff --exit-code` alone misses
          # the untracked case (finding #11 from post-audit review).
          git diff --exit-code || {
            echo "::error::Run 'bazel mod tidy && bazel run //:gazelle' locally and commit."
            exit 1
          }
          if git ls-files --others --exclude-standard | grep -E '(BUILD\.bazel|go\.sum|go\.mod)$'; then
            echo "::error::Gazelle created untracked BUILD.bazel/go.mod/go.sum files — commit them."
            exit 1
          fi

      # gomarkdoc is the SOT for the README drift gate (ADR 0008). The
      # devcontainer ships it pre-installed, but a fresh CI runner does
      # not — install it here so the drift + determinism + govulncheck
      # steps below all see the same binary the local pre-commit hook
      # uses. Pinned to v1.1.0, matching .devcontainer/features/languages/go/install.sh.
      - name: install gomarkdoc
        run: go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@v1.1.0

      # README drift gate (ADR 0008). Sits between the gazelle drift
      # check and `bazel build` so a stale README fails fast before the
      # heavy build+test burn. The script is the canonical spec (also
      # used by `make lint` and the local pre-commit hook).
      - name: drift check — README.md regenerated
        run: bash scripts/pre-commit/check-readme-drift.sh

      - name: determinism check — gomarkdoc reproducible
        run: bash scripts/pre-commit/check-readme-determinism.sh

      # govulncheck on the gomarkdoc binary was removed: gomarkdoc@v1.1.0
      # (the last released tag) bundles golang.org/x/crypto < v0.52.0 and
      # github.com/go-git/v5 < v5.17.1, both carrying historical CVEs in
      # SSH / knownhosts / repo-write paths gomarkdoc never reaches. We
      # can't bump the deps without a new gomarkdoc release, so scanning
      # the binary blocks every SDK PR on a waiting-for-upstream signal.
      # The SDK runtime is gated by bazel test (ADR 0004 SoT). Re-enable
      # this step when gomarkdoc ships a refreshed release.

      - name: build
        run: bazel build --config=ci //...

      - name: test
        run: bazel test --config=ci //...

      # Every target below carries at least one //go:build !race test
      # (testing.AllocsPerRun / testing.Benchmark report a spurious +1 under
      # -race), so the race suite above never compiles them. This race-off pass
      # is their ONLY gate — a `!race` test in a package missing from the list
      # runs nowhere at all. The list is shared with `make test-alloc` and with
      # check-alloc-lane-coverage.sh, which fails the build on an orphan.
      - name: alloc + zero-alloc gates (race off)
        run: |
          targets=$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' tools/alloc-lane-targets.txt | tr '\n' ' ')
          echo "alloc lane targets: $targets"
          bazel test --config=alloc $targets

      # Guards the invariant the step above depends on: no //go:build !race
      # test may exist outside the alloc lane's target list.
      - name: exemption invariant — alloc lane covers every !race test
        run: bash scripts/pre-commit/check-alloc-lane-coverage.sh

      # Guards the invariant the errs AST audit depends on: it judges only the
      # files staged as its runfiles via //:audit_sources, so a package that
      # declares codes but is missing from that list is audited by nothing AND
      # passes green. ADR 0020 records this gap once already; all five
      # internal/service/net/* packages had silently reopened it.
      - name: audit-coverage invariant — every code-declaring package is audited
        run: bash scripts/pre-commit/check-audit-coverage.sh

      # Guards the root CLAUDE.md against the drift parallel union merges
      # produce: a core/ tree that no longer matches internal/core, a domain
      # described twice, or two whole Purpose paragraphs coexisting. Both
      # checks key on the directories on disk rather than on a count.
      - name: domain-doc invariant — the root CLAUDE.md still describes the tree
        run: bash scripts/pre-commit/check-domain-docs.sh

      - name: coverage
        run: |
          bazel coverage --combined_report=lcov //...
          cp "$(bazel info output_path)/_coverage/_coverage_report.dat" coverage.lcov

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Unique per-run artifact name so concurrent runs never silently
          # deduplicate coverage reports (finding #28).
          name: coverage-${{ github.run_number }}
          path: coverage.lcov
          # The repo caps artifact retention at 1 day; request that explicitly so
          # the run does not emit a "retention-days greater than max" warning.
          retention-days: 1
          if-no-files-found: warn

  # Cross-platform build matrix — folded in from the former standalone
  # cross-platform.yml so the SDK has ONE per-PR CI workflow, not two. Enforces
  # the invariant that every package BUILDS on every supported GOOS (a
  # platform-specific low-level call must never silently drop a package). Pure
  # `go build` per module across the matrix — no Bazel (Bazel is Linux-only), so
  # it runs as a sibling job, not inside the bazel job. Local equivalent:
  # `bash scripts/cross-platform-audit.sh`.
  cross-build:
    name: cross-build ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          # 32-bit guard (issue #94): the packed-uint32 Code type is
          # arch-portable, so the whole SDK must build on 386/arm; these cells
          # keep it from regressing back to a 64-bit-only build constraint.
          - { goos: linux, goarch: "386" }
          - { goos: linux, goarch: arm }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: openbsd, goarch: amd64 }
          - { goos: netbsd, goarch: amd64 }
          - { goos: dragonfly, goarch: amd64 }
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: pkg/go.mod

      # Each module is built standalone (GOWORK=off) so its own go.mod + replace
      # directives resolve; CGO disabled so the cross-build is hermetic.
      - name: cross-build every module
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          fail=0
          for mod in internal/kernel internal/core internal/service pkg . e2e; do
            echo "::group::$mod ($GOOS/$GOARCH)"
            if (cd "$mod" && go build ./...); then
              echo "ok"
            else
              echo "::error::$mod fails to build on $GOOS/$GOARCH"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
