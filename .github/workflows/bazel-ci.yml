name: SDK CI (Bazel)

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs when a newer commit on the same ref arrives so
# rapid re-pushes do not spawn parallel builds that corrupt bazel caches
# or upload duplicate artifacts. Matches docker-images.yml policy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bazel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # SHA-pinned per the .github/workflows/CLAUDE.md policy — version
      # comments track the resolved human-readable tag.
      #
      # fetch-depth: 0 — gomarkdoc resolves the repository URL + default
      # branch via `git symbolic-ref refs/remotes/origin/HEAD` to build
      # the source links in READMEs. A shallow clone (depth=1) makes
      # that lookup fail and gomarkdoc falls back to a bare-name link
      # shape that drifts from what local regen produces — the README
      # drift gate then fails on a phantom diff. Full history kills
      # the variability.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          # .bazelversion included so a Bazel version bump invalidates the
          # disk-cache (otherwise stale objects could survive the upgrade).
          disk-cache: ${{ github.workflow }}-${{ hashFiles('.bazelrc', '.bazelversion', 'MODULE.bazel', '**/go.mod', '**/go.sum') }}
          repository-cache: true

      # setup-bazel only provides a Bazel-sandboxed Go SDK; the README
      # drift gate + govulncheck run outside Bazel and need a host Go
      # toolchain on $PATH. SHA matches sdk-release.yml's pin.
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: pkg/go.mod
          cache: true
          cache-dependency-path: pkg/go.sum

      - name: drift check — bazel mod tidy + gazelle
        run: |
          bazel mod tidy
          bazel run //:gazelle
          # Catch both modifications to tracked files AND new untracked BUILD/go
          # files that gazelle created — `git diff --exit-code` alone misses
          # the untracked case (finding #11 from post-audit review).
          git diff --exit-code || {
            echo "::error::Run 'bazel mod tidy && bazel run //:gazelle' locally and commit."
            exit 1
          }
          if git ls-files --others --exclude-standard | grep -E '(BUILD\.bazel|go\.sum|go\.mod)$'; then
            echo "::error::Gazelle created untracked BUILD.bazel/go.mod/go.sum files — commit them."
            exit 1
          fi

      # gomarkdoc is the SOT for the README drift gate (ADR 0008). The
      # devcontainer ships it pre-installed, but a fresh CI runner does
      # not — install it here so the drift + determinism + govulncheck
      # steps below all see the same binary the local pre-commit hook
      # uses. Pinned to v1.1.0, matching .devcontainer/features/languages/go/install.sh.
      - name: install gomarkdoc
        run: go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@v1.1.0

      # README drift gate (ADR 0008). Sits between the gazelle drift
      # check and `bazel build` so a stale README fails fast before the
      # heavy build+test burn. The script is the canonical spec (also
      # used by `make lint` and the local pre-commit hook).
      - name: drift check — README.md regenerated
        run: bash scripts/pre-commit/check-readme-drift.sh

      - name: determinism check — gomarkdoc reproducible
        run: bash scripts/pre-commit/check-readme-determinism.sh

      # govulncheck on the gomarkdoc binary was removed: gomarkdoc@v1.1.0
      # (the last released tag) bundles golang.org/x/crypto < v0.52.0 and
      # github.com/go-git/v5 < v5.17.1, both carrying historical CVEs in
      # SSH / knownhosts / repo-write paths gomarkdoc never reaches. We
      # can't bump the deps without a new gomarkdoc release, so scanning
      # the binary blocks every SDK PR on a waiting-for-upstream signal.
      # The SDK runtime is gated by bazel test (ADR 0004 SoT). Re-enable
      # this step when gomarkdoc ships a refreshed release.

      - name: build
        run: bazel build --config=ci //...

      - name: test
        run: bazel test --config=ci //...

      # Every target below carries at least one //go:build !race test
      # (testing.AllocsPerRun / testing.Benchmark report a spurious +1 under
      # -race), so the race suite above never compiles them. This race-off pass
      # is their ONLY gate — a `!race` test in a package missing from the list
      # runs nowhere at all. The list is shared with `make test-alloc` and with
      # check-alloc-lane-coverage.sh, which fails the build on an orphan.
      - name: alloc + zero-alloc gates (race off)
        run: |
          targets=$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' tools/alloc-lane-targets.txt | tr '\n' ' ')
          echo "alloc lane targets: $targets"
          bazel test --config=alloc $targets

      # Guards the invariant the step above depends on: no //go:build !race
      # test may exist outside the alloc lane's target list.
      - name: exemption invariant — alloc lane covers every !race test
        run: bash scripts/pre-commit/check-alloc-lane-coverage.sh

      # Guards the invariant the errs AST audit depends on: it judges only the
      # files staged as its runfiles via //:audit_sources, so a package that
      # declares codes but is missing from that list is audited by nothing AND
      # passes green. ADR 0020 records this gap once already; all five
      # internal/service/net/* packages had silently reopened it.
      - name: audit-coverage invariant — every code-declaring package is audited
        run: bash scripts/pre-commit/check-audit-coverage.sh

      # Guards the root CLAUDE.md against the drift parallel union merges
      # produce: a core/ tree that no longer matches internal/core, a domain
      # described twice, or two whole Purpose paragraphs coexisting. Both
      # checks key on the directories on disk rather than on a count.
      - name: domain-doc invariant — the root CLAUDE.md still describes the tree
        run: bash scripts/pre-commit/check-domain-docs.sh

      # Guards the layer direction kernel → core → service → pkg/v1. ADR 0004
      # put it on Bazel visibility, but Gazelle gives every package under an
      # internal/ directory //:__subpackages__, which admits the whole
      # repository — a kernel package importing core was shown to build. The
      # direction is therefore asserted on the dependency graph (ADR 0068).
      - name: layer invariant — no layer depends on one above it
        run: bash scripts/check-layer-deps.sh

      # The three checks of `make lint` that no lane ran (#236): `gofumpt -l`,
      # sdkguard and ktn-linter. The other five are the steps above — gazelle
      # drift, alloc-lane, audit-coverage, domain-docs, layer-deps — so this
      # adds a class of analysis, it does not repeat one.
      #
      # These sit INSIDE the `bazel` job deliberately. `bazel` and `post-commit`
      # are the only required checks on main (the legacy branch protection and
      # the ruleset each name one, and they are additive); a sibling job would
      # run and report but block nothing. Making a new job required is a
      # merge-policy change, which is not this workflow's to decide.
      - name: install gofumpt (pinned)
        env:
          # Pinned, never `latest`. A lane that follows `latest` changes its
          # verdict with no commit of this repository moving. Moving the pin is
          # then a reviewable diff.
          GOFUMPT_VERSION: v0.12.0
        run: go install "mvdan.cc/gofumpt@${GOFUMPT_VERSION}"

      - name: lint gate — gofumpt + sdkguard
        run: make lint-check

      # The ktn-linter half needs a credential this repository does not have,
      # so it is asked for rather than assumed. Measured on this lane, not
      # argued: `gh release download v1.11.2 --repo kodflow/ktn-linter` answered
      #
      #     release not found
      #
      # under `secrets.GITHUB_TOKEN`, while the same command run by a
      # credentialed account downloads ktn-linter_linux_amd64.tar.gz (10.7 MB).
      # The release exists; a workflow token is scoped to the repository that
      # issued it and cannot read another owner's private releases.
      #
      # The secret is read in its own step so it is not exposed to the rest of
      # the job, and the `secrets` context is not available in a step-level
      # `if:` — only `env` and `steps` are, hence the output.
      - name: is the ktn-linter credential configured
        id: ktncred
        env:
          KTN_LINTER_TOKEN: ${{ secrets.KTN_LINTER_TOKEN }}
        run: |
          if [ -n "${KTN_LINTER_TOKEN:-}" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo "::warning title=ktn-linter gate did not run::KTN_LINTER_TOKEN is unset, so the ktn-linter half of the lint gate was skipped. It is NOT in scripts/ci-gates-check.sh's GATES for that reason — a step a missing secret can skip is not a gate. Set the secret to a token with Contents:read on kodflow/ktn-linter and add lint-ktn-check to GATES (#236)."
          fi

      - name: install ktn-linter (pinned)
        if: steps.ktncred.outputs.present == 'true'
        env:
          KTN_LINTER_VERSION: v1.11.2
          # The archive's digest, pinned HERE and not read from the
          # checksums.txt published beside it. Whoever can replace the archive
          # can replace the manifest next to it, so a checksum fetched from the
          # same release verifies nothing — ADR 0077 records that argument in
          # this repository already. Pinned in the workflow, it is the same
          # trust model as the SHA-pinned actions above: the artefact this
          # commit was reviewed against is the artefact CI runs.
          #
          # Measured: two independent downloads of v1.11.2 produced this digest,
          # and it matches the release manifest — which is a cross-check, not
          # the proof.
          KTN_LINTER_SHA256: 7a05c0558a897c27c1ac98eed8f16713f87bf22e75106d09ec254c8a7c597898
          GH_TOKEN: ${{ secrets.KTN_LINTER_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/ktn"
          gh release download "$KTN_LINTER_VERSION" \
            --repo kodflow/ktn-linter \
            --pattern 'ktn-linter_linux_amd64.tar.gz' \
            --dir "$RUNNER_TEMP/ktn"
          printf '%s  %s\n' "$KTN_LINTER_SHA256" \
            "$RUNNER_TEMP/ktn/ktn-linter_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/ktn/ktn-linter_linux_amd64.tar.gz" -C "$RUNNER_TEMP/ktn"
          install -m 0755 "$RUNNER_TEMP/ktn/ktn-linter" "$(go env GOPATH)/bin/ktn-linter"

      # A separate step so the downloaded binary's FIRST execution happens with
      # no GH_TOKEN in the environment. Raised by Qodo on this PR and correct: a
      # step that both holds a private-release credential and runs the artefact
      # it has just fetched hands that credential to the artefact.
      #
      # The assertion itself is a compatibility check, not an integrity one —
      # integrity is the digest above. It exists because 1.9.11 exits 0 with
      # "No issues found! Code is compliant." on a tree 1.11.2 rejects, measured
      # on this tree with zero commits between the two runs, so a binary that is
      # merely present proves nothing about what was analysed.
      - name: assert ktn-linter is the pinned build
        if: steps.ktncred.outputs.present == 'true'
        env:
          KTN_LINTER_VERSION: v1.11.2
        run: |
          got="$(ktn-linter --version)"
          case "$got" in
            *"${KTN_LINTER_VERSION#v}"*) printf 'ktn-linter pinned: %s\n' "$got" ;;
            *) printf '::error::expected %s, got %s\n' "$KTN_LINTER_VERSION" "$got"; exit 1 ;;
          esac

      - name: lint gate — ktn-linter
        if: steps.ktncred.outputs.present == 'true'
        run: make lint-ktn-check

      - name: coverage
        run: |
          bazel coverage --combined_report=lcov //...
          cp "$(bazel info output_path)/_coverage/_coverage_report.dat" coverage.lcov

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Unique per-run artifact name so concurrent runs never silently
          # deduplicate coverage reports (finding #28).
          name: coverage-${{ github.run_number }}
          path: coverage.lcov
          # The repo caps artifact retention at 1 day; request that explicitly so
          # the run does not emit a "retention-days greater than max" warning.
          retention-days: 1
          if-no-files-found: warn

  # Shell gates — the checks that need neither Bazel nor Go. A sibling job, so
  # a broken release script is reported in seconds instead of behind a 120-minute
  # Bazel lane, and so the Bazel cache is irrelevant to it.
  #
  # These are the first `make` invocations in this workflow. Everything else here
  # calls bazel or bash directly; ci-gates-check asserts the Makefile↔CI link for
  # the targets it lists, which only works if CI goes through the target name.
  shell-gates:
    name: shell gates — release scripts + gate enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # bats-core is not vendored and the test runner deliberately does not fetch
      # it: a gate that clones a third-party repository on every run is a flake.
      # The distro package is the one route CI takes, and it is one of the three
      # the runner names when bats is absent.
      - name: install bats-core
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats

      - name: CI gate enforcement
        # A Makefile target CI never runs is documentation, not a gate. This
        # fails when a gate is renamed out from under its CI step, or when the
        # step is deleted and the target survives as advice. Its own target is in
        # the manifest, which catches every gate but itself: nothing that has
        # been deleted can report its own deletion. See ADR 0088 Deferred.
        run: make ci-gates-check

      - name: release script regression
        # scripts/release/*.bats guards the two scripts that decide which tag
        # every merge gets, and from the commit that added it (ADR 0085) until
        # this lane existed, nothing executed it. Three of the defects it covers
        # produce a plausible version rather than an error: `separator=,` in a
        # %(trailers:…) format concatenates two repeated trailers, so
        # `Release-bump: mi` + `Release-bump: nor` reads back as the single value
        # `minor` and cuts a minor release — measured on git 2.47.3, invisible on
        # review. See ADR 0088.
        run: make release-scripts-check

      - name: git hook regression
        # .githooks/commit-msg is this repository's no-AI-attribution
        # enforcement, and it shipped with the same `printf | grep -q` — but
        # with a worse failure mode, because the pipeline is the condition of an
        # `if`. grep exits on its first match, the writer takes SIGPIPE,
        # pipefail reports 141, 141 is false, and the hook ALLOWS the
        # attribution it exists to refuse. Measured before the fix with the
        # pattern near the top and a 400 KB body: 40 bypasses out of 40 runs.
        # After: 0 out of 40. See ADR 0088.
        run: make hooks-check

      - name: pre-commit guard regression
        # scripts/pre-commit/ holds the commit gates themselves, and ADR 0088
        # recorded its own sweep as INCOMPLETE: two of them pipe into an
        # early-exiting reader exactly as .githooks/commit-msg did. They fail in
        # OPPOSITE directions, which is why reading did not catch either.
        # check-ktn-phases-1-7.sh:69 fails CLOSED — a clean linter run is
        # reported as "the linter did not complete" (measured, marker first:
        # 64 KB 4/40, 96 KB 24/40, 400 KB 40/40). check-audit-coverage.sh:89
        # fails OPEN — a package that declares error codes and is absent from
        # //:audit_sources passes the guard that exists to catch it (measured:
        # 200 declaring lines 40/40). Both suites carry a negative control at
        # the same shape below the threshold, green in both passes, which is
        # what identifies grep's early exit rather than the volume.
        run: make pre-commit-check

  # Cross-platform build matrix — folded in from the former standalone
  # cross-platform.yml so the SDK has ONE per-PR CI workflow, not two. Enforces
  # the invariant that every package BUILDS, and its tests COMPILE, on every
  # supported GOOS (a platform-specific low-level call must never silently drop a
  # package, nor a test only one GOOS can compile — ADR 0094). `go build` then
  # `go vet` per module across the matrix — no Bazel (Bazel is Linux-only), so it
  # runs as a sibling job, not inside the bazel job. Local equivalent:
  # `bash scripts/cross-platform-audit.sh`.
  cross-build:
    name: cross-build ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          # 32-bit guard (issue #94): the packed-uint32 Code type is
          # arch-portable, so the whole SDK must build on 386/arm; these cells
          # keep it from regressing back to a 64-bit-only build constraint.
          - { goos: linux, goarch: "386" }
          - { goos: linux, goarch: arm }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: openbsd, goarch: amd64 }
          - { goos: netbsd, goarch: amd64 }
          - { goos: dragonfly, goarch: amd64 }
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: pkg/go.mod

      # Each module is built standalone (GOWORK=off) so its own go.mod + replace
      # directives resolve; CGO disabled so the cross-build is hermetic. `go
      # build` never compiles a _test.go; `go vet` type-checks them, so a test
      # calling a helper that one GOOS alone defines fails here (ADR 0094).
      - name: cross-build every module, tests included
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          fail=0
          for mod in internal/kernel internal/core internal/service pkg . e2e; do
            echo "::group::$mod ($GOOS/$GOARCH)"
            if (cd "$mod" && go build ./... && go vet ./...); then
              echo "ok"
            else
              echo "::error::$mod fails to build, or its tests to compile, on $GOOS/$GOARCH"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

  # 32-bit RUNTIME guard. cross-build above proves the SDK COMPILES on 386; it
  # cannot prove it behaves. The two are different questions, and the gap is
  # where a 64-bit assumption survives: `int(0xffffffff)` is -1 where int is 32
  # bits and passes every "> cap" check, which is exactly the bound
  # internal/service/session's at-rest frame relies on — two of its malformed
  # frames can only fail here. Found by adding this job: a bench helper that did
  # not compile (Statfs_t.Type is int32 on 386, int64 elsewhere) and a test
  # synthesising a slice longer than a 32-bit len can hold.
  #
  # Linux/amd64 runners execute 386 binaries natively, so this needs no
  # emulation. It runs WITHOUT -race, which has no 386 support at all, and that
  # is also what makes it the second lane to run the `//go:build !race` files
  # (rule 12's alloc lane is the first).
  test-386:
    name: test linux/386
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: pkg/go.mod

      # Each module standalone (GOWORK=off) so its own replace directives
      # resolve, exactly as cross-build does; CGO off because a 386 cgo
      # toolchain is not installed and nothing here needs one.
      - name: test every module on linux/386
        env:
          GOARCH: "386"
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          fail=0
          for mod in internal/kernel internal/core internal/service pkg; do
            echo "::group::$mod (linux/386)"
            if (cd "$mod" && go test ./...); then
              echo "ok"
            else
              echo "::error::$mod fails its tests on linux/386"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
