name: Docs Deploy

# Build + deploy the versioned docs portal (docs/site) to GitHub Pages.
#
# Deliberately SEPARATE from sdk-release.yml: that workflow owns the release
# cycle (compute bump -> cut tag -> GitHub release). Publishing the docs is a
# CONSEQUENCE of a release, not a step of it, so it lives in its own lane.
#
# Triggers:
#   - workflow_run after "SDK Release" succeeds -> a freshly cut tag enters the
#     version dropdown (sync-versions reads `gh release list` at prebuild and
#     snapshots each tag via `git worktree`);
#   - push to main touching docs sources -> ship doc fixes that do not cut a
#     release;
#   - workflow_dispatch -> manual redeploy.
on:
  workflow_run:
    workflows: ["SDK Release"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "CLAUDE.md"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

# Least privilege: read the repo, write the Pages deployment, and mint the
# OIDC token actions/deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# A single live Pages deployment — serialise, and never cancel one mid-flight.
concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    # On the workflow_run trigger, only build when the upstream release passed.
    # push / workflow_dispatch always proceed.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # `gh release list` inside sync-versions authenticates via GH_TOKEN; the
    # default GITHUB_TOKEN (contents: read) is enough to enumerate releases.
    # Set at job level so both the explicit prebuild and npm's build lifecycle
    # have it.
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Full history + all tags so sync-versions' `git tag -l 'pkg/v*/v*'`
          # and `git worktree add --detach <tag>` resolve every release
          # snapshot — a shallow clone would silently produce an empty dropdown.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install (locked)
        run: npm ci
      - name: Test versioning logic
        run: npm test
      # Run prebuild EXPLICITLY rather than relying solely on npm's build
      # lifecycle: the version-snapshot regeneration (sync-versions + symbols)
      # is then visible and unambiguous in the log, robust against future
      # runner/package-manager quirks. npm will also run it before `build`;
      # the repeat is idempotent.
      - name: Regenerate versioned content (sync-versions + symbols)
        run: npm run prebuild
      - name: Build site (astro + pagefind)
        run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
