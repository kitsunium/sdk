# TEMPORARY — removed before #329 is merged. Runs e2e/integration/sql's
# suites (docstore, its versions and its trash among them) on SQLite, PostgreSQL 17 and
# MySQL 8.4, per e2e/integration/sql/CLAUDE.md's run procedure.
name: tmp docstore integration
on:
  workflow_dispatch:
  push:
    branches: [feat/274-docstore-tombstone]
permissions:
  contents: read
jobs:
  docstore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.27.2
          cache: false
      - name: docstore integration on every engine
        working-directory: e2e
        env:
          GOWORK: "off"
        run: go test -tags integration -race -count=1 -v ./integration/sql/ 2>&1 | tee ../integration.log; test "${PIPESTATUS[0]}" -eq 0
      - name: no engine skipped
        run: |
          grep -E -- '--- (PASS|FAIL|SKIP)' integration.log | sort | uniq -c | tail -80
          if grep -E -- '--- SKIP' integration.log; then echo "an engine was skipped"; exit 1; fi
