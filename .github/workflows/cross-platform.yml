name: Cross-platform build matrix

# Enforces the SDK invariant: every package must BUILD on every supported target
# OS, so a platform-specific low-level call never silently drops a package. Pure
# `go build` (no cgo, no Bazel) per module across the GOOS/GOARCH matrix — the
# proc syscalls are stdlib `syscall`, so a clean cross-compile is a faithful
# portability signal. The local equivalent is `bash scripts/cross-platform-audit.sh`.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: openbsd, goarch: amd64 }
          - { goos: netbsd, goarch: amd64 }
          - { goos: dragonfly, goarch: amd64 }
    name: ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
    steps:
      # SHA-pinned per .github/workflows/CLAUDE.md; matches bazel-ci.yml's pin.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: pkg/go.mod

      # Each module is built standalone (GOWORK=off) so its own go.mod + replace
      # directives resolve; CGO disabled so the cross-build is hermetic.
      - name: cross-build every module
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          fail=0
          for mod in internal/kernel internal/core internal/service pkg .; do
            echo "::group::$mod ($GOOS/$GOARCH)"
            if (cd "$mod" && go build ./...); then
              echo "ok"
            else
              echo "::error::$mod fails to build on $GOOS/$GOARCH"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
