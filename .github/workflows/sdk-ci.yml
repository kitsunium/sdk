name: SDK CI

on:
  push:
    branches: [main]
    paths:
      - "internal/**"
      - "pkg/**"
      - "go.work"
      - "go.mod"
      - ".golangci.yml"
      - ".github/workflows/sdk-ci.yml"
      - "Makefile"
  pull_request:
    paths:
      - "internal/**"
      - "pkg/**"
      - "go.work"
      - "go.mod"
      - ".golangci.yml"
      - ".github/workflows/sdk-ci.yml"
      - "Makefile"

env:
  # Test each module as an external consumer via its go.mod + replace
  # directives, NOT via the workspace.
  GOWORK: off

permissions:
  contents: read

jobs:
  test:
    name: test / ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - internal/kernel
          - internal/core
          - internal/service
          - pkg/v1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: go mod download
        working-directory: ${{ matrix.module }}
        run: go mod download
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: go test
        working-directory: ${{ matrix.module }}
        run: >-
          go test -race -cover -coverprofile=coverage.out
          -ldflags "-X github.com/kitsunium/sdk/pkg/v1/logger.Version=ci-${{ github.sha }}"
          ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.module }}
          path: ${{ matrix.module }}/coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62
          args: --timeout=5m

  vulncheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - internal/kernel
          - internal/core
          - internal/service
          - pkg/v1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: scan
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...
