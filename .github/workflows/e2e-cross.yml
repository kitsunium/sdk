name: Cross-platform runtime tests (real kernels)

# ADR 0018 runtime bar, on GitHub-hosted runners only (ADR 0177). EVERY test of
# EVERY module of the census (scripts/ci/go-modules.sh, ADR 0137) + the e2e
# conformance binary run on the REAL kernel of each target OS, driven by
# `go test` — the uniform cross-platform driver, because Bazel cannot host the
# BSDs (bazelisk #150 refuses freebsd; bazel #9397/#10250 OpenBSD port
# unresolved). Bazel stays the canonical Linux gate in bazel-ci.yml; this lane
# is the off-Linux runtime proof.
#
#   - macOS / Windows : GitHub-hosted native runners (Go preinstalled),
#     `go test ./...` in every module of the census, in place.
#   - Linux : the native leg runs the kernel-sensitive packages below (Bazel
#     runs every package, race on, and test-386 every module again); the
#     linux-init job runs the same packages as root under a real init.
#   - FreeBSD / OpenBSD / NetBSD : cross-platform-actions boots a real BSD kernel
#     VM (KVM) on the ubuntu host. scripts/ci/test-binaries.sh cross-compiles a
#     `go test -c` binary for EVERY package with tests, in every module, on the
#     host (fast, exact Go version), and scripts/ci/run-test-binaries.sh runs
#     each from its package directory inside the VM, so the guest needs no Go
#     toolchain. (DragonFly has no guest here: cross-build compiles it.)
#   - illumos / Solaris : the same cross-compile-and-run, in an OmniOS r151054
#     and an Oracle Solaris 11.4 guest that vmactions boots (ADR 0144).
#
# No `-short` anywhere: a suite that shrinks itself under -short (the reaper's
# hand-off count) runs its full size on every kernel, so no lane has to make up
# for one that skipped (rule 12).
#
# The Go build cache (GOCACHE + GOMODCACHE) is kept per job and target by
# actions/cache, keyed on every go.sum and the ISO week: restored on every run,
# saved only by a push to main, so a branch reuses main's objects and the
# repository's 10 GB cache is not filled by one entry per commit. vmactions'
# own image cache is disabled (`disable-cache`): it saved 3 GB per BRANCH and
# was evicting the Bazel disk cache the required job lives on.
#
# fail-fast: false everywhere — the point is to see ALL platforms' real behaviour
# in one run, not stop at the first divergence.

on:
  # Every branch and every tag but `pin/**`: a pin tag marks a commit for a
  # consumer of the design (#296) and builds nothing, and pushing two of them
  # ran this lane twice for nothing. `branches` is spelled out because a push
  # trigger that names a tag filter alone runs for no branch at all.
  push:
    branches: ['main'] # diag-768 branch: not run here
    tags-ignore: ['pin/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-cross-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kernel-sensitive packages, run by the two LINUX jobs only — the native
  # Linux leg and linux-init (as root, under systemd and OpenRC, on four
  # distro kernels). Every other platform of this workflow runs every package
  # of every module; on Linux the rest is Bazel's (bazel-ci.yml), race on, and
  # test-386's. The reasons each package is here are kept below: they are why
  # it must run as root under a real init too.
  #
  # `lock` joins them for the same reason: its file backend is a build-tag
  # split over a kernel primitive — flock(2) on Unix, LockFileEx on Windows
  # (ADR 0081) — and the two kernels give OPPOSITE answers to what a second
  # lock inside one process does. A green cross-compile proves neither. The
  # Windows leg's every-package run executes internal/service/app/lock's
  # Windows suite; the Linux Bazel gate compiles neither that suite nor the
  # backend it covers.
  #
  # The primitive itself is a kernel package since ADR 0159 — `fs/flock`, which
  # session's file store takes too — and it joins for the same reason, with a
  # suite that asserts on every GOOS: the lock where one exists, the refusal
  # (errors.ErrUnsupported) on illumos and Solaris. `fs/winacl` joins with it:
  # the Windows DACL reader lock's and queue's directory rules both stand on,
  # whose walk tests ran here inside ./app/lock until it left that package.
  # Everywhere but Windows it compiles to its constants and has no test to run.
  #
  # `entitlement` joins for a narrower reason: its offline cache installs a
  # refreshed roster with write-then-rename, and Windows refuses to replace a
  # destination another handle holds open — which is exactly what that cache's
  # own reader does from a second process. The defect was deferred twice (ADR
  # 0078, then ADR 0079) on the stated grounds that it was "not reachable from
  # this CI matrix". Listing one more package here is what made that false;
  # every platform's every-package run reaches it now. It is a package of the
  # framework (ADR 0158), so it is listed in FRAMEWORK_PKGS and run from
  # framework/ rather than from internal/service.
  #
  # `proc/childwait` joins them because the one wait4(-1) in the SDK lives
  # there, and which waiter a kernel hands a zombie to is exactly the per-kernel
  # behaviour this lane exists to prove (ADR 0093); `proc/reaper`'s hand-off
  # suite drives it end to end beside `exec`.
  #
  # `pathchain` joins them because what it measures IS the platform: os.Root's
  # component walk is openat(2) on Unix and O_NOFOLLOW_ANY on Windows, a
  # junction and a symbolic link are one bit on one kernel and two mechanisms
  # on the other, and a volume root is only a path on one of them (ADR 0083).
  #
  # `proc/self` joins them because its CPU time IS a kernel question:
  # getrusage(2) where a Unix has it, the Go runtime's GC-refreshed estimate
  # where it does not, and a flag saying which (ADR 0100).
  #
  # `proc/ipc` joins them because its endpoint IS the platform: a Unix socket gated
  # by its directory, SO_PEERCRED on Linux, a named pipe with its own DACL on
  # Windows (ADR 0148).
  #
  # `proc/internal/rlim` joins them because the struct it builds IS the platform:
  # FreeBSD and DragonFly declare syscall.Rlimit's fields int64, every other Unix
  # uint64, and its signed variant and that variant's test compile on those two
  # kernels alone. It is the constructor `exec` and `rlimit` share; its tests ran
  # here inside those two packages before it moved.
  #
  # `security/session` joins them because its file store's path rules ARE the
  # platform: `Dir` is walked with `fs/pathchain`, judged by the mode of the
  # directory holding each component, then held as an os.Root, and the lock is
  # `fs/flock`. Its path suites (pathsafety_*_test.go) plant a link at a
  # record, at the lock file, at a parent of `Dir` and at `Dir` itself, and
  # assert what each Unix kernel does with it — every attack was first run, and
  # worked, against the store as it shipped (ADR 0154, as built). Listed here,
  # it also runs as root under a real init; on illumos and Solaris, where the
  # store is not built, its suite pins that it is built only where the kernel
  # can lock.
  KERNEL_PKGS: "./fs/flock ./fs/pathchain ./fs/winacl"
  CORE_PKGS: "./proc"
  # `net/loop` joins them because its backends ARE the kernel: epoll here, and
  # io_uring after a staged probe of the running kernel (ADR 0186). Its suite
  # fails closed on Linux: LOOP_GOFLAGS compiles in the backends each lane
  # must find, and the loopdebug thread check; a backend missing fails the
  # lane, and the binary's log names the backends, the kernel included.
  SERVICE_PKGS: "./app/lock ./net/loop ./proc/childwait ./proc/exec ./proc/cgroup ./proc/internal/rlim ./proc/ipc ./proc/reaper ./proc/rlimit ./proc/self ./proc/signal ./proc/systemd/listen ./proc/systemd/notify ./security/session"
  # Unix file-security packages: their suites assert 0600 perms and inject
  # failures by chmod-freezing a directory — both are Unix mechanics. The
  # shared hardened open both sinks call, internal/logfile, carries the one
  # O_NOFOLLOW proof (a link planted after the Lstat check) they used to copy.
  # Every other platform runs them in its every-package run; on Windows their
  # suites assert what a mode means on that platform (the one read-only bit,
  # not an ACL) and skip the chmod injections, naming why (ADR 0095). ACL
  # hardening of the Windows file sinks — a security descriptor at creation —
  # is named in their CLAUDE.md, not done.
  SERVICE_FILE_PKGS: "./observe/logger/sink/file ./observe/logger/writer/rotfile ./observe/logger/internal/logfile"
  # Framework packages whose runtime is a kernel question — see `entitlement`
  # above. Relative to framework/, a directory of the SDK module (ADR 0162),
  # as the three lists above are relative to the layer directories.
  FRAMEWORK_PKGS: "./internal/service/entitlement"
  # Quoted: one -ldflags carrying both -X, the backends and the capabilities
  # (none required here; net-kernel-gate.yml's legs declare theirs).
  LOOP_GOFLAGS: "-tags=loopdebug '-ldflags=-X=github.com/kitsunium/sdk/internal/service/net/loop.requiredBackends=iouring,epoll -X=github.com/kitsunium/sdk/internal/service/net/loop.requiredCaps=none'"

jobs:
  # ── Native hosted runners: Go runs in place, no cross-compile ──────────────
  native:
    name: ${{ matrix.name }}${{ matrix.shard && format(' ({0})', matrix.shard) || '' }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows run every module of the census in three shards,
        # so the two modules that hold most of the packages — `internal` (the
        # kernel, core and service layers) and `.` (the framework) — run
        # beside the twenty-seven others rather than after them: the shards
        # are `internal`, `root` and `rest`, and `rest` is the census minus
        # the other two, so no module is left out by construction.
        include:
          - { name: linux, runs-on: ubuntu-latest }
          # macOS = darwin; proc syscall behaviour is arch-independent, so the
          # arm64 runner (macos-15) covers the darwin runtime bar. The Intel
          # runner (macos-13) is dropped: GitHub's Intel-mac pool is so contended
          # that the job sits queued indefinitely and never lets a run complete.
          - { name: macos-arm64, runs-on: macos-15, shard: internal }
          - { name: macos-arm64, runs-on: macos-15, shard: root }
          - { name: macos-arm64, runs-on: macos-15, shard: rest }
          - { name: windows, runs-on: windows-latest, shard: internal }
          - { name: windows, runs-on: windows-latest, shard: root }
          - { name: windows, runs-on: windows-latest, shard: rest }
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # The build cache is this workflow's own (see the header), so setup-go's
      # — one key per runner OS, whichever job saved it first — is off.
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Go cache paths and week
        id: gocache
        shell: bash
        run: |
          {
            echo "build=$(go env GOCACHE)"
            echo "mod=$(go env GOMODCACHE)"
            echo "week=$(date -u +%G-W%V)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the Go build cache
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-native-${{ matrix.name }}-${{ matrix.shard || 'kernel' }}-${{ hashFiles('**/go.sum') }}-${{ steps.gocache.outputs.week }}
          restore-keys: |
            go-native-${{ matrix.name }}-${{ matrix.shard || 'kernel' }}-${{ hashFiles('**/go.sum') }}-
            go-native-${{ matrix.name }}-${{ matrix.shard || 'kernel' }}-

      # Linux only: Bazel runs every package on Linux (bazel-ci.yml), so this
      # leg runs the kernel-sensitive list — the same packages linux-init runs
      # as root — and the conformance program below.
      - name: Unit tests — kernel-sensitive packages on linux
        if: matrix.name == 'linux'
        shell: bash
        env:
          GOWORK: "off"
          CGO_ENABLED: "0"
          GOFLAGS: ${{ env.LOOP_GOFLAGS }}
        run: |
          set -uo pipefail
          fail=0
          echo "::group::internal/kernel $KERNEL_PKGS"
          (cd internal/kernel  && go test -count=1 $KERNEL_PKGS)  || fail=1
          echo "::endgroup::"
          echo "::group::internal/core $CORE_PKGS"
          (cd internal/core    && go test -count=1 $CORE_PKGS)    || fail=1
          echo "::endgroup::"
          echo "::group::internal/service $SERVICE_PKGS $SERVICE_FILE_PKGS"
          (cd internal/service && go test -count=1 $SERVICE_PKGS $SERVICE_FILE_PKGS) || fail=1
          echo "::endgroup::"
          echo "::group::framework $FRAMEWORK_PKGS"
          (cd framework && go test -count=1 $FRAMEWORK_PKGS) || fail=1
          echo "::endgroup::"
          exit $fail

      # Every package, not only the kernel-sensitive ones. ADR 0018 kept the
      # pure-Go packages on the Linux lane because they "behave identically
      # everywhere"; their TESTS did not — on macOS a Unix socket path past the
      # 104-byte sun_path, a temporary directory under a link (ADR 0094). It
      # gates on Windows too: ADR 0094 ran it there as an inventory
      # (continue-on-error) until a clean run, its first run failed in 19
      # packages, and ADR 0095 records how each was resolved — production bugs
      # fixed, Unix premises replaced by what Windows actually promises — and
      # the first clean runs. The kernel-sensitive list is a subset of this, so
      # it is not run a second time here. No -short: every suite at full size.
      - name: Unit tests — every package on ${{ matrix.name }}
        if: matrix.name != 'linux'
        # A test that hangs on a kernel it never ran on must not eat the job.
        timeout-minutes: 20
        shell: bash
        env:
          GOWORK: "off"
          CGO_ENABLED: "0"
          SHARD: ${{ matrix.shard }}
        run: |
          set -uo pipefail
          fail=0
          # Every module of the census (ADR 0137) — this loop named six, and
          # tools/genindex and tools/sdkguard never ran on macOS or Windows.
          # The root is the SDK module (ADR 0162) and is tested like the rest.
          census="$(bash scripts/ci/go-modules.sh)" || { echo "::error::the module census failed"; exit 1; }
          case "$SHARD" in
            internal) modules="internal" ;;
            root) modules="." ;;
            rest) modules="$(printf '%s\n' "$census" | grep -vx -e internal -e '[.]')" ;;
            *) echo "::error::unknown shard '$SHARD'"; exit 1 ;;
          esac
          for mod in $modules; do
            echo "::group::$mod"
            (cd "$mod" && go test -count=1 ./...) || { fail=1; echo "::error::$mod has failing tests on ${{ matrix.name }}"; }
            echo "::endgroup::"
          done
          exit $fail

      - name: E2E conformance — whole public API on ${{ matrix.name }}
        if: ${{ !cancelled() && (matrix.shard == '' || matrix.shard == 'rest') }}
        shell: bash
        env:
          GOWORK: "off"
        run: |
          set -uo pipefail
          cd e2e && go run .

      # Saved by a push to main only, and only when this week's entry does
      # not exist yet: a branch restores main's, and the 10 GB the repository
      # shares is not spent on one entry per commit.
      - name: Save the Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-native-${{ matrix.name }}-${{ matrix.shard || 'kernel' }}-${{ hashFiles('**/go.sum') }}-${{ steps.gocache.outputs.week }}

  # ── Linux with a REAL init, and a real distro kernel: root, cgroup v2 delegated ──
  # Issue #118 / ADR 0177. The unprivileged `native` leg above cannot reach root,
  # a delegated cgroup v2 subtree (cgroup.Available is an honest write probe, so
  # `native` reports NotSupported for the cgroup rows), a real systemd or OpenRC
  # as PID 1 (the reaper and sd_notify rows), nor the distro's userland (glibc,
  # musl) and kernel. Hosted runners give all of it, in two shapes:
  #
  #   - ubuntu-systemd : the runner itself. Its PID 1 is systemd on cgroup v2;
  #                      `systemd-run -p Delegate=yes` hands the suites a
  #                      delegated subtree, as a real service unit would.
  #   - debian-systemd, fedora-systemd : a privileged container whose PID 1 is
  #                      the distro's own systemd.
  #   - alpine-openrc  : a privileged container whose PID 1 is busybox init
  #                      running OpenRC (sysinit, boot, default), musl userland.
  #     (a container shares the runner's kernel; the three legs below do not)
  #   - debian-kernel, fedora-kernel, alpine-kernel : the distro's official
  #                      cloud image booted under QEMU/KVM (/dev/kvm is exposed
  #                      on ubuntu-latest), digest pinned, configured by
  #                      cloud-init, the binaries run over ssh as root. The
  #                      guest runs the distro's OWN kernel with its own init
  #                      as PID 1 from power-on.
  linux-init:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-systemd, kind: host }
          - { name: debian-systemd, kind: systemd, image: "debian:trixie" }
          - { name: fedora-systemd, kind: systemd, image: "fedora:42" }
          - { name: alpine-openrc, kind: openrc, image: "alpine:3.22" }
          # Images are pinned by URL AND digest: a republished file fails the
          # download step instead of changing what is tested. Debian and
          # Alpine keep a release's images in place; Fedora's are read from
          # its archive tree, which does not move. Alpine's sshd refuses root,
          # so that guest is entered as its cloud-init user and escalated by doas.
          - name: debian-kernel
            kind: vm
            init: systemd
            user: root
            pre: ""
            url: https://cloud.debian.org/images/cloud/trixie/20261001-2618/debian-13-genericcloud-amd64-20261001-2618.qcow2
            algo: sha512
            sum: f46f0671a6e5bdec5291ab8972bae2f10e5408c2f64a74078f11efc2f06a436a9d0313ed50e0472542eeabf780e9f7c792ac0a314c6c20507fcd9fd81b468c3d
          - name: fedora-kernel
            kind: vm
            init: systemd
            user: root
            pre: ""
            url: https://dl.fedoraproject.org/pub/archive/fedora/linux/releases/42/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-42-1.1.x86_64.qcow2
            algo: sha256
            sum: e401a4db2e5e04d1967b6729774faa96da629bcf3ba90b67d8d9cce9906bec0f
          # Ubuntu noble at its own kernel, the one the loop engine's io_uring is
          # sized against (ADR 0186): serial 20261017 ships 6.8.0-147-generic
          # (its .manifest), at or past the 6.8.0-117 floor; the run prints
          # `uname -r` of the guest.
          - name: ubuntu-kernel
            kind: vm
            init: systemd
            user: root
            pre: ""
            url: https://cloud-images.ubuntu.com/noble/20261017/noble-server-cloudimg-amd64.img
            algo: sha256
            sum: 04e8f2461a16a44e78a370284471f29616cdd9baf1893df25807b71f985b6c94
          - name: alpine-kernel
            kind: vm
            init: openrc
            user: alpine
            pre: doas
            url: https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/cloud/alpine-3.22.6-x86_64-bios-cloudinit-r0.qcow2
            algo: sha512
            sum: 864ad8b9e3d14272d592f380c814c647bb6666fcd5b73c86dc21528da71306a93f2ce29b89ea8e6099b76786bb7835f0e27ca1824ec7f4b0b243160a13ba262d
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Cross-compile test binaries + conformance for linux/amd64
        shell: bash
        env:
          GOOS: linux
          GOARCH: amd64
          GOWORK: "off"
          CGO_ENABLED: "0"
          GOFLAGS: ${{ env.LOOP_GOFLAGS }}
        run: |
          set -euo pipefail
          mkdir -p bins
          compile() { # dir  pkg-list
            local mod="$1"; shift
            for pkg in $@; do
              local out="bins/$(echo "${mod#internal/}_${pkg#./}" | tr '/ ' '__').test"
              if (cd "$mod" && go test -c -o "$GITHUB_WORKSPACE/$out" "$pkg") 2>/tmp/c.log; then
                [ -f "$out" ] && echo "built $out" || echo "no tests in $mod/$pkg (skip)"
              else
                echo "::error::compile $mod/$pkg for $GOOS failed"; cat /tmp/c.log; exit 1
              fi
            done
          }
          compile internal/kernel  $KERNEL_PKGS
          compile internal/core    $CORE_PKGS
          compile internal/service $SERVICE_PKGS
          compile internal/service $SERVICE_FILE_PKGS
          compile framework        $FRAMEWORK_PKGS
          compile pkg/v1/proc      ./
          (cd e2e && go build -o "$GITHUB_WORKSPACE/bins/conformance.run" .)
          # What runs inside the guest: POSIX sh, the same for all four legs.
          # A test binary run directly has no timeout of its own, so each gets
          # -test.timeout (a hang panics with every stack, and the next suite
          # still runs, #118). A failure is tried again only to name it, as
          # run-test-binaries.sh does: one that passes on a retry is flaky
          # and fails the job like one that never passes — CI detects a
          # flake, it never masks one.
          cat > bins/run.sh <<'SH'
          set -u
          cd "$(dirname "$0")/.."
          echo "== host: $(uname -srm) | pid1=$(cat /proc/1/comm) | uid=$(id -u) =="
          echo "== cgroup: $(stat -fc %T /sys/fs/cgroup 2>/dev/null) | self=$(cat /proc/self/cgroup) =="
          echo "== cgroup.controllers: $(cat /sys/fs/cgroup/cgroup.controllers 2>/dev/null) =="
          [ -r /etc/os-release ] && . /etc/os-release && echo "== distro: ${PRETTY_NAME:-?} =="
          attempts() { # name command...
            name=$1
            shift
            i=1
            while [ "$i" -le 3 ]; do
              if "$@"; then
                [ "$i" -eq 1 ] && return 0
                echo "::error::$name is flaky on $(uname -sr): it failed, then passed on attempt $i"
                return 1
              fi
              echo "  (attempt $i of $name failed)"
              i=$((i + 1))
            done
            echo "::error::$name fails on $(uname -sr)"
            return 1
          }
          fail=0
          echo "== conformance =="
          attempts conformance ./bins/conformance.run || fail=1
          for b in bins/*.test; do
            echo "== $b =="
            attempts "$b" ./"$b" -test.v -test.timeout=5m || fail=1
          done
          exit $fail
          SH
          ls -la bins/

      - name: Run under the runner's own systemd, as root, cgroup delegated
        if: matrix.kind == 'host'
        run: |
          set -uo pipefail
          ls -l /dev/kvm 2>&1 || true
          sudo systemd-run --quiet --wait --pipe --collect \
            -p Delegate=yes -p WorkingDirectory="$PWD" \
            sh bins/run.sh

      - name: Build the ${{ matrix.name }} image
        if: matrix.kind == 'systemd' || matrix.kind == 'openrc'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          case "$IMAGE" in
            debian:*)
              install='apt-get update && apt-get install -y --no-install-recommends systemd systemd-sysv dbus && rm -rf /var/lib/apt/lists/*'
              init='/sbin/init' ;;
            fedora:*)
              install='dnf install -y systemd && dnf clean all'
              init='/usr/sbin/init' ;;
            alpine:*)
              # rc_sys=docker keeps OpenRC off the clock, the modules and the
              # devices a container has no business touching; the inittab is
              # the sysinit/boot/default sequence busybox init needs to run it.
              install='apk add --no-cache openrc && sed -i "s/^#\?rc_sys=.*/rc_sys=\"docker\"/" /etc/rc.conf && printf "%s\n" "::sysinit:/sbin/openrc sysinit" "::sysinit:/sbin/openrc boot" "::wait:/sbin/openrc default" "::shutdown:/sbin/openrc shutdown" > /etc/inittab'
              init='/sbin/init' ;;
            *) echo "::error::no recipe for $IMAGE"; exit 1 ;;
          esac
          docker build -t sdk-e2e-init - <<DOCKERFILE
          FROM $IMAGE
          RUN $install
          STOPSIGNAL SIGRTMIN+3
          CMD ["$init"]
          DOCKERFILE

      - name: Boot ${{ matrix.name }} with its own init as PID 1
        if: matrix.kind == 'systemd' || matrix.kind == 'openrc'
        env:
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          docker run -d --name init --privileged --tmpfs /run --tmpfs /tmp -v "$PWD":/work:ro sdk-e2e-init
          for _ in $(seq 1 60); do
            if [ "$KIND" = systemd ]; then
              state=$(docker exec init systemctl is-system-running 2>/dev/null || true)
              case "$state" in running|degraded) echo "systemd: $state"; exit 0 ;; esac
            else
              if docker exec init rc-status -r 2>/dev/null | grep -q .; then
                docker exec init rc-status -a || true; exit 0
              fi
            fi
            sleep 2
          done
          echo "::error::init never came up"; docker logs init | tail -50; exit 1

      - name: Run inside ${{ matrix.name }}
        if: matrix.kind == 'systemd' || matrix.kind == 'openrc'
        env:
          KIND: ${{ matrix.kind }}
        run: |
          set -uo pipefail
          if [ "$KIND" = systemd ]; then
            docker exec init systemd-run --quiet --wait --pipe --collect \
              -p Delegate=yes -p WorkingDirectory=/work sh /work/bins/run.sh
          else
            # No systemd here to delegate a subtree: do what a container
            # entrypoint does. Move every process of the container's cgroup
            # into a leaf (cgroup v2 forbids a cgroup holding processes AND
            # controllers for its children), then enable the controllers.
            docker exec -w /work init sh -c '
              set -e
              cd /sys/fs/cgroup
              mkdir -p init
              for p in $(cat cgroup.procs); do echo "$p" > init/cgroup.procs 2>/dev/null || true; done
              echo "+cpu +memory +pids +io" > cgroup.subtree_control
              exec sh /work/bins/run.sh'
          fi

      # ── The distro's own kernel: its cloud image under QEMU/KVM ───────────────
      - name: Fetch the ${{ matrix.name }} image and verify its digest
        if: matrix.kind == 'vm'
        env:
          URL: ${{ matrix.url }}
          ALGO: ${{ matrix.algo }}
          SUM: ${{ matrix.sum }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
          mkdir -p vm
          curl -fsSL --retry 5 --retry-all-errors -o vm/base.qcow2 "$URL"
          echo "$SUM  vm/base.qcow2" | "${ALGO}sum" -c -
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Boot ${{ matrix.name }} (cloud-init seed, ssh key)
        if: matrix.kind == 'vm'
        env:
          GUEST_USER: ${{ matrix.user }}
        run: |
          set -euo pipefail
          cd vm
          ssh-keygen -q -t ed25519 -N '' -f key
          # The key goes to the distro's default user and to root (disable_root
          # false: Debian's default prefixes root's key with a refusal); no password.
          {
            echo '#cloud-config'
            echo 'disable_root: false'
            echo 'ssh_pwauth: false'
            echo 'ssh_authorized_keys:'
            echo "  - $(cat key.pub)"
            echo 'users:'
            echo '  - default'
            echo '  - name: root'
            echo '    ssh_authorized_keys:'
            echo "      - $(cat key.pub)"
          } > user-data
          printf 'instance-id: sdk-e2e\nlocal-hostname: sdk-e2e\n' > meta-data
          cloud-localds seed.iso user-data meta-data
          qemu-img create -q -f qcow2 -F qcow2 -b base.qcow2 disk.qcow2
          # Room for the checkout: cloud-init grows the root partition into it.
          qemu-img resize -q disk.qcow2 8G
          qemu-system-x86_64 -enable-kvm -cpu host -smp 2 -m 3072 \
            -display none -serial file:console.log -daemonize -pidfile qemu.pid \
            -drive file=disk.qcow2,if=virtio -drive file=seed.iso,if=virtio,format=raw,readonly=on \
            -netdev user,id=n0,hostfwd=tcp:127.0.0.1:2222-:22 -device virtio-net-pci,netdev=n0
          for _ in $(seq 1 60); do
            if ssh -i key -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                 -o ConnectTimeout=5 "$GUEST_USER@127.0.0.1" true 2>/dev/null; then
              echo "guest is up"; exit 0
            fi
            sleep 5
          done
          echo "::error::guest never accepted ssh"
          ssh -v -i key -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=5 "$GUEST_USER@127.0.0.1" true 2>&1 | tail -25 || true
          tail -60 console.log; exit 1

      - name: Run inside ${{ matrix.name }} on the guest's own kernel
        if: matrix.kind == 'vm'
        env:
          INIT: ${{ matrix.init }}
          GUEST_USER: ${{ matrix.user }}
          PRE: ${{ matrix.pre }}
        run: |
          set -uo pipefail
          cd vm
          s="ssh -i key -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $GUEST_USER@127.0.0.1"
          echo "runner kernel: $(uname -r)"
          echo "guest kernel : $($s uname -r)"
          W="$($s pwd)/work"
          # The whole checkout, as the containers mount it: some suites audit the
          # sources above the working directory (they look for go.work).
          tar -C .. --exclude=./.git --exclude=./vm -cf - . | $s "rm -rf '$W' && mkdir '$W' && tar -C '$W' -xf -"
          if [ "$INIT" = systemd ]; then
            $s $PRE systemd-run --quiet --wait --pipe --collect -p Delegate=yes -p WorkingDirectory="$W" sh bins/run.sh
          else
            # OpenRC is PID 1 here and root's session sits in the cgroup root,
            # which may hold processes and enable controllers. Make sure the
            # unified hierarchy is mounted and the controllers are on.
            $s $PRE sh -s <<GUEST
          rc-service cgroups start >/dev/null 2>&1 || true
          grep -q " /sys/fs/cgroup cgroup2 " /proc/mounts || mount -t cgroup2 none /sys/fs/cgroup
          echo "+cpu +memory +pids +io" > /sys/fs/cgroup/cgroup.subtree_control || true
          cd '$W' && sh bins/run.sh
          GUEST
          fi

      - name: Guest console (on failure)
        if: ${{ failure() && matrix.kind == 'vm' }}
        run: tail -120 vm/console.log || true

      - name: Container log (on failure)
        if: ${{ failure() && (matrix.kind == 'systemd' || matrix.kind == 'openrc') }}
        run: docker logs init 2>&1 | tail -80 || true

  # ── BSD via cross-platform-actions: cross-compile on host, run in the VM ────
  bsd:
    name: ${{ matrix.os }}
    runs-on: ubuntu-latest
    # Two caps, because the job now does two different things. The tests of
    # every package take what they take, and are capped by their own step
    # (25 min) and this job (40 min). Booting the guest is the part that hangs,
    # and the measurement below — taken when the job WAS little more than a
    # boot (the platform-sensitive suites ran in under a minute) — is the cap
    # of the boot step alone: 8 minutes.
    #
    # Why 8 — and why neither 12 nor 5. Re-measured job-level over 100
    # consecutive runs / 300 BSD jobs, 2026-09-13T18:53Z .. 2026-09-15T07:51Z,
    # none of them re-triggered for the measurement (issue #127 carries the
    # earlier witnesses; this supersedes the 57-run figures it quotes):
    #
    #   freebsd  94 successes  1m39s .. 2m11s   p50 1m50s
    #   openbsd  89 successes  2m03s .. 3m58s   p50 2m25s   <- worst of the three
    #   netbsd   79 successes  1m55s .. 2m36s   p50 2m13s
    #
    # 8 min leaves a x2.02 margin over that 3m58s worst case.
    #
    # The earlier pass put the worst success at 2m46s and the margin at x2.89.
    # Both are stale: openbsd has since succeeded three times above 3m40s
    # (3m58s / 3m47s / 3m44s) at three unrelated moments, on three branches,
    # every one at `run_attempt=1`. The slowest is run 34878358811, all steps
    # `success`, step 5 alone 194s — a genuine slow success, not an artifact.
    #
    # The distribution is BIMODAL, and that is still the whole argument. The
    # empty band is 4..8 min, not 3..8: of 300 jobs, 3 landed in 3..4 min (the
    # three openbsd above), and 4..5 and 5..8 hold ZERO — no successes, no
    # cancellations, nothing. Either the guest comes up and the leg finishes in
    # ~2 min, or it never comes up and the job runs to whatever ceiling is in
    # place. A job at 8m49s is not a slow success a bigger sample would have
    # caught; it is a hang that met the cap. Doubling the sample moved the
    # worst success by 72s and left the 4..8 band exactly as empty.
    #
    # And the overruns are not slow work: the guest NEVER BOOTS. Witness from
    # run 34940900311, step 5, verbatim — `VM is ready` appears 0 times:
    #
    #   Waiting for VM to be ready...
    #   kex_exchange_identification: read: Connection reset by peer   (x5, ~75s apart)
    #   ##[error]The operation was canceled.
    #
    # Negative control, the slowest netbsd SUCCESS in the same window (run
    # 34860751100): `VM is ready` after 23.8s, ONE wait, ZERO kex. Nothing in
    # between has ever been observed.
    #
    # So do NOT raise this "to be safe". Nine hangs observed, ZERO recovered,
    # and two of them had the full 30 minutes of the old cap to do it in:
    #
    #   run 34785397486  netbsd  30m04s  cap 30  no verdict
    #   run 34781660291  netbsd  30m03s  cap 30  no verdict
    #   run 34781015219  netbsd   8m56s  cap 30  still hung when a push cut it
    #   run 34853381050  netbsd   8m49s  cap  8  no verdict
    #   run 34857766102  netbsd   8m49s  cap  8  no verdict
    #   run 34897461740  netbsd   8m49s  cap  8  no verdict
    #   run 34895986195  netbsd   8m16s  cap  8  no verdict
    #   run 34940900311  netbsd   8m03s  cap  8  no verdict
    #   run 34941622606  netbsd   8m03s  cap  8  no verdict
    #
    # In all nine the two sibling BSD jobs are green, which is what separates a
    # hang from a `cancel-in-progress` sweep. Denominator: 90 runs reached a
    # verdict or hung (10 were cut wholesale by a newer push), so 9/90 = 10%.
    # Do NOT quote that as a stable rate — it rests on NINE events. What the 160
    # successes settle is the MECHANISM, not the frequency.
    #
    # Raising the cap does not convert a hang into a verdict — it buys burned
    # runner minutes. Raise only if the three ranges above actually move, and
    # re-measure before you do.
    #
    # Do NOT lower it either. A 5-minute cap would cut a hang ~3 min earlier —
    # considered, and rejected: it leaves 62s of headroom over the worst real
    # success, LESS than the 72s that worst case already moved when the sample
    # doubled, for a margin of x1.26. The trade does not pay.
    #
    # Budget the real cost: a timeout costs cap + 3s .. cap + 49s, over the six
    # that met the 8m00s cap (483s, 483s, 496s, 529s, 529s, 529s), because the
    # cancel waits for the QEMU guest to tear down. The overshoot was only 3-4s
    # at 30 min, when the guest had long since died.
    #
    # These are genuine step-5 hangs, not the cross-platform-actions 504 that
    # fails other BSD legs inside `Setting up VM`: they completed steps 1-4 in
    # under 45s, and no log carries a 504 or a download error. A 504 fails fast;
    # these ran to the cap.
    #
    # All of the above is the PRE-BUMP baseline: it was measured against
    # cross-platform-actions v1.2.0. The pin below is now v1.6.0, whose changelog
    # bounds exactly the loop these logs show. Re-measure before reusing these
    # numbers as current.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: freebsd, version: "15.0" }
          - { os: openbsd, version: "7.9" }
          - { os: netbsd, version: "10.1" }
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Go cache paths and week
        id: gocache
        run: |
          {
            echo "build=$(go env GOCACHE)"
            echo "mod=$(go env GOMODCACHE)"
            echo "week=$(date -u +%G-W%V)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the Go build cache
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-guest-${{ matrix.os }}-${{ hashFiles('**/go.sum') }}-${{ steps.gocache.outputs.week }}
          restore-keys: |
            go-guest-${{ matrix.os }}-${{ hashFiles('**/go.sum') }}-
            go-guest-${{ matrix.os }}-

      # Every package with tests, in every module of the census — not a list:
      # the "platform-sensitive" list this lane compiled left 300 of 333 test
      # packages unexecuted on the BSDs.
      - name: Cross-compile every test binary + conformance for ${{ matrix.os }}
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: amd64
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          bash scripts/ci/test-binaries.sh bins
          # Conformance is a real program (not a -c suite): build it normally.
          (cd e2e && go build -o "$GITHUB_WORKSPACE/bins/conformance.run" .)

      - name: Save the Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-guest-${{ matrix.os }}-${{ hashFiles('**/go.sum') }}-${{ steps.gocache.outputs.week }}

      # Boots a real ${{ matrix.os }} kernel VM and syncs the workspace (incl.
      # bins/) into it, once; the step below runs inside it through cpa.sh.
      # The 8-minute cap measured above is this step's: a guest that never
      # boots is cut here, without waiting for the tests' own budget.
      #
      # v1.2.0 -> v1.6.0 because v1.2.0 waits for the guest by COUNTING SSH
      # attempts, with no clock on the loop. That is the shape of every overrun
      # above: step 5 retries `kex_exchange_identification: read: Connection
      # reset by peer` at ~75s a go, never prints `VM is ready`, and only
      # `timeout-minutes` ends it. Upstream bounded it, and removed three
      # reasons the guest never comes up in the first place:
      #
      #   v1.4.0  waiting for readiness is bounded by a wall clock instead of an
      #           attempt count, and one SSH attempt by `ConnectTimeout`; AMX is
      #           no longer exposed to x86-64 guests, which is what made NetBSD
      #           9.4/10.1 fault as userland started on the runners that have it
      #   v1.5.0  LA57 (5-level paging) and always-on STIBP likewise withheld;
      #           NetBSD guests log in without a credential, so no key pair and
      #           no resources disk are built for them
      #   v1.6.0  DragonFly networking (not a platform this lane runs)
      #
      # Input schema across v1.2.0..v1.6.0 diffs by exactly one ADDITIVE key,
      # `variant` (default `default`, boots as before). Nothing used here was
      # renamed. `microvm` is NetBSD 11 only, so 10.1 cannot opt in; not taken.
      #
      # This pin is a cause-shaped fix, not a measured one: the failure runs at
      # ~9% on netbsd, so no single green run can confirm it. What the next
      # weeks measure is whether overruns stop, not whether one run passed.
      - name: Boot the real ${{ matrix.os }} kernel
        timeout-minutes: 8
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          # KVM-accelerated on hosted runners (the action's log: "falling back
          # to KVM"); the runner's four cores and 6 GB keep the timing-sensitive
          # proc suites (stdio pumping, the trampoline handshake, signal-relay
          # deadlines) off the hypervisor's latency.
          cpu_count: 4
          memory: 6G
          sync_files: runner-to-vm

      # framework/internal/service/git hardens the git invocations it makes,
      # and its suites build their fixtures with git itself: a guest without
      # it cannot run them. The images ship none, so the guest's own package
      # manager installs it — the suite then runs on this kernel's git.
      # NetBSD's `git` is a meta-package that pulls perl and 28 others (29 MB,
      # 138 s); `git-base` is the git binary alone.
      - name: git in the ${{ matrix.os }} guest
        timeout-minutes: 5
        shell: cpa.sh {0} --sync-files none
        run: |
          set -e
          if ! command -v git >/dev/null 2>&1; then
            case "$(uname -s)" in
              FreeBSD) sudo env ASSUME_ALWAYS_YES=yes pkg install -y git ;;
              OpenBSD) sudo pkg_add git ;;
              NetBSD) sudo pkgin -y install git-base ;;
            esac
          fi
          git --version

      - name: Every test on the real ${{ matrix.os }} kernel
        timeout-minutes: 25
        shell: cpa.sh {0} --sync-files none
        run: |
          set -u
          fail=0
          echo "== conformance on ${{ matrix.os }} =="
          # Tried again only to name a failure: a pass on a retry is a flake,
          # and fails the job (run-test-binaries.sh's rule).
          ok=0
          for i in 1 2 3; do
            ./bins/conformance.run && { ok=$i; break; }
            echo "  (attempt $i of conformance failed)"
          done
          case "$ok" in
            1) ;;
            0) echo "::error::conformance fails on $(uname -sr)"; fail=1 ;;
            *) echo "::error::conformance is flaky on $(uname -sr): it failed, then passed on attempt $ok"; fail=1 ;;
          esac
          sh scripts/ci/run-test-binaries.sh bins || fail=1
          exit $fail

  # ── illumos / Solaris via vmactions: cross-compile on host, run in the guest ─
  # ADR 0144. cross-platform-actions ships no illumos or Solaris image; vmactions
  # boots OmniOS r151054 (illumos) and Oracle Solaris 11.4 on the ubuntu host.
  # Same shape as the BSD lane: the `go test -c` binaries and the conformance
  # program are cross-compiled here (no cgo — the Go runtime itself reaches both
  # kernels through libc), synced into the guest and executed there as root.
  # The two kernels are separate GOOS values (runtime.GOOS is "illumos" on the
  # first, "solaris" on the second) and diverge below libc, so each gets its own
  # leg. Every package of every module runs here, the pkg/v1/proc module's root
  # suite among them: it asserts the capability matrix for the GOOS it runs on,
  # which is the claim this lane exists to back.
  #
  # The boot step is capped at 8 min: the one green run per kernel this lane
  # was sized on booted in about 1m45s (OmniOS) and 1m30s (Solaris). The tests
  # of every package have their own step cap (25 min) and the job 40: measure
  # before moving them. A red leg takes longer than a green one: the reaper
  # suite's cases wait 30s for a collection before failing, three attempts each.
  solarish:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: illumos, goos: illumos, guest: omnios, release: r151054 }
          - { name: solaris, goos: solaris, guest: solaris, release: "11.4" }
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Go cache paths and week
        id: gocache
        run: |
          {
            echo "build=$(go env GOCACHE)"
            echo "mod=$(go env GOMODCACHE)"
            echo "week=$(date -u +%G-W%V)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the Go build cache
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-guest-${{ matrix.goos }}-${{ hashFiles('**/go.sum') }}-${{ steps.gocache.outputs.week }}
          restore-keys: |
            go-guest-${{ matrix.goos }}-${{ hashFiles('**/go.sum') }}-
            go-guest-${{ matrix.goos }}-

      # Every package with tests, in every module of the census — the
      # pkg/v1/proc module's root suite among them, which asserts the
      # capability matrix for the GOOS it runs on.
      - name: Cross-compile every test binary + conformance for ${{ matrix.goos }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          bash scripts/ci/test-binaries.sh bins
          (cd e2e && go build -o "$GITHUB_WORKSPACE/bins/conformance.run" .)

      - name: Save the Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-guest-${{ matrix.goos }}-${{ hashFiles('**/go.sum') }}-${{ steps.gocache.outputs.week }}

      # Boot only; the tests run in the step after, through the `guest` shell
      # both actions install (`custom-shell-name`), each step with its own cap.
      # disable-cache: the image is downloaded rather than kept in the
      # repository's Actions cache, where it took 3 GB per branch.
      - name: Boot the OmniOS guest
        if: matrix.guest == 'omnios'
        timeout-minutes: 8
        uses: vmactions/omnios-vm@9576f0b6d15e7696548409baa533bc0a339caf42 # v1.3.7
        with:
          release: ${{ matrix.release }}
          cpu: 4
          copyback: false
          disable-cache: true
          custom-shell-name: guest

      - name: Boot the Oracle Solaris guest
        if: matrix.guest == 'solaris'
        timeout-minutes: 8
        uses: vmactions/solaris-vm@87d3c436511cef802cd1637f86f73b1a97715c8c # v1.4.1
        with:
          release: ${{ matrix.release }}
          cpu: 4
          copyback: false
          disable-cache: true
          custom-shell-name: guest

      # framework/internal/service/git's suites build their fixtures with git
      # (see the bsd job). OmniOS ships it in its own publisher; Solaris 11.4
      # in Oracle's, with OpenCSW's as the fallback the action documents.
      - name: git in the ${{ matrix.name }} guest
        timeout-minutes: 5
        shell: guest {0}
        run: |
          set -e
          if ! command -v git >/dev/null 2>&1; then
            pkg install -q developer/versioning/git || pkgutil -y -i git
          fi
          PATH="$PATH:/opt/csw/bin" git --version

      - name: Every test on the ${{ matrix.name }} kernel
        timeout-minutes: 25
        shell: guest {0}
        run: |
          set -u
          PATH="$PATH:/opt/csw/bin"
          export PATH
          fail=0
          echo "== conformance on $(uname -sv) =="
          # Tried again only to name a failure: a pass on a retry is a flake,
          # and fails the job (run-test-binaries.sh's rule).
          ok=0
          for i in 1 2 3; do
            ./bins/conformance.run && { ok=$i; break; }
            echo "  (attempt $i of conformance failed)"
          done
          case "$ok" in
            1) ;;
            0) echo "::error::conformance fails on $(uname -sr)"; fail=1 ;;
            *) echo "::error::conformance is flaky on $(uname -sr): it failed, then passed on attempt $ok"; fail=1 ;;
          esac
          sh scripts/ci/run-test-binaries.sh bins || fail=1
          exit $fail
