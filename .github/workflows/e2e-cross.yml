name: Cross-platform runtime tests (real kernels, no lab)

# ADR 0018 runtime bar WITHOUT the Proxmox lab. Every platform-sensitive proc
# package's unit tests + the e2e conformance binary run on the REAL kernel of
# each target OS, driven by `go test` — the uniform cross-platform driver,
# because Bazel cannot host the BSDs (bazelisk #150 refuses freebsd; bazel
# #9397/#10250 OpenBSD port unresolved). Bazel stays the canonical Linux gate in
# bazel-ci.yml; this lane is the off-Linux runtime proof, never a duplicate unit
# matrix.
#
#   - Linux / macOS / Windows : GitHub-hosted native runners (Go preinstalled),
#     `go test` runs in place — Go auto-selects the build-tag variant per GOOS.
#   - FreeBSD / OpenBSD / NetBSD : cross-platform-actions boots a real BSD kernel
#     VM on the ubuntu host. We cross-compile `go test -c` binaries + conformance
#     on the host (fast, exact Go version) and execute them inside the VM, so the
#     guest needs no Go toolchain. (DragonFly intentionally omitted.)
#
# fail-fast: false everywhere — the point is to see ALL platforms' real behaviour
# in one run, not stop at the first divergence.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-cross-${{ github.ref }}
  cancel-in-progress: true

env:
  # Platform-sensitive packages whose RUNTIME behaviour must be proven per kernel.
  # Pure-Go packages (codec/crypto/logger/errs) behave identically everywhere and
  # are covered by the Linux Bazel gate, so they stay off this lane.
  #
  # `lock` joins them for the same reason: its file backend is a build-tag
  # split over a kernel primitive — flock(2) on Unix, LockFileEx on Windows
  # (ADR 0081) — and the two kernels give OPPOSITE answers to what a second
  # lock inside one process does. A green cross-compile proves neither. This is
  # the lane that executes internal/service/lock's Windows suite; the Linux
  # Bazel gate compiles neither that suite nor the backend it covers.
  #
  # `entitlement` joins for a narrower reason: its offline cache installs a
  # refreshed roster with write-then-rename, and Windows refuses to replace a
  # destination another handle holds open — which is exactly what that cache's
  # own reader does from a second process. The defect was deferred twice (ADR
  # 0078, then ADR 0079) on the stated grounds that it was "not reachable from
  # this CI matrix". Listing one more package here is what made that false.
  #
  # `proc/childwait` joins them because the one wait4(-1) in the SDK lives
  # there, and which waiter a kernel hands a zombie to is exactly the per-kernel
  # behaviour this lane exists to prove (ADR 0093); `proc/reaper`'s hand-off
  # suite drives it end to end beside `exec`.
  #
  # `pathchain` joins them because what it measures IS the platform: os.Root's
  # component walk is openat(2) on Unix and O_NOFOLLOW_ANY on Windows, a
  # junction and a symbolic link are one bit on one kernel and two mechanisms
  # on the other, and a volume root is only a path on one of them (ADR 0083).
  KERNEL_PKGS: "./pathchain"
  CORE_PKGS: "./proc"
  SERVICE_PKGS: "./entitlement ./lock ./proc/childwait ./proc/exec ./proc/cgroup ./proc/reaper ./proc/rlimit ./proc/sdlisten ./proc/sdnotify ./proc/signal"
  # Unix file-security packages: their suites assert 0600 perms and inject
  # failures by chmod-freezing a directory — both are Unix mechanics with no
  # Windows equivalent (Windows uses ACLs; chmod 0555 doesn't block the owner).
  # Run them on the Unix lanes only; the sink still compiles + logs on Windows,
  # and ACL-based hardening of the Windows file sink is tracked as future work.
  SERVICE_FILE_PKGS: "./logger/sink/file ./writer/rotfile"

jobs:
  # ── Native hosted runners: Go runs in place, no cross-compile ──────────────
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, runs-on: ubuntu-latest }
          # macOS = darwin; proc syscall behaviour is arch-independent, so the
          # arm64 runner (macos-15) covers the darwin runtime bar. The Intel
          # runner (macos-13) is dropped: GitHub's Intel-mac pool is so contended
          # that the job sits queued indefinitely and never lets a run complete.
          - { name: macos-arm64, runs-on: macos-15 }
          - { name: windows, runs-on: windows-latest }
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: pkg/go.mod

      - name: Unit tests — platform-sensitive packages on ${{ matrix.name }}
        shell: bash
        env:
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: |
          set -uo pipefail
          fail=0
          echo "::group::internal/kernel $KERNEL_PKGS"
          (cd internal/kernel  && go test -count=1 -short $KERNEL_PKGS)  || fail=1
          echo "::endgroup::"
          echo "::group::internal/core $CORE_PKGS"
          (cd internal/core    && go test -count=1 -short $CORE_PKGS)    || fail=1
          echo "::endgroup::"
          echo "::group::internal/service $SERVICE_PKGS"
          (cd internal/service && go test -count=1 -short $SERVICE_PKGS) || fail=1
          echo "::endgroup::"
          # Unix-only file-security packages (see SERVICE_FILE_PKGS comment).
          if [ "${{ matrix.name }}" != "windows" ]; then
            echo "::group::internal/service $SERVICE_FILE_PKGS"
            (cd internal/service && go test -count=1 -short $SERVICE_FILE_PKGS) || fail=1
            echo "::endgroup::"
          fi
          exit $fail

      - name: E2E conformance — whole public API on ${{ matrix.name }}
        shell: bash
        env:
          GOWORK: "off"
        run: |
          set -uo pipefail
          cd e2e && go run .

  # ── BSD via cross-platform-actions: cross-compile on host, run in the VM ────
  bsd:
    name: ${{ matrix.os }}
    runs-on: ubuntu-latest
    # Why 8 — and why neither 12 nor 5. Re-measured job-level over 100
    # consecutive runs / 300 BSD jobs, 2026-09-13T18:53Z .. 2026-09-15T07:51Z,
    # none of them re-triggered for the measurement (issue #127 carries the
    # earlier witnesses; this supersedes the 57-run figures it quotes):
    #
    #   freebsd  94 successes  1m39s .. 2m11s   p50 1m50s
    #   openbsd  89 successes  2m03s .. 3m58s   p50 2m25s   <- worst of the three
    #   netbsd   79 successes  1m55s .. 2m36s   p50 2m13s
    #
    # 8 min leaves a x2.02 margin over that 3m58s worst case.
    #
    # The earlier pass put the worst success at 2m46s and the margin at x2.89.
    # Both are stale: openbsd has since succeeded three times above 3m40s
    # (3m58s / 3m47s / 3m44s) at three unrelated moments, on three branches,
    # every one at `run_attempt=1`. The slowest is run 34878358811, all steps
    # `success`, step 5 alone 194s — a genuine slow success, not an artifact.
    #
    # The distribution is BIMODAL, and that is still the whole argument. The
    # empty band is 4..8 min, not 3..8: of 300 jobs, 3 landed in 3..4 min (the
    # three openbsd above), and 4..5 and 5..8 hold ZERO — no successes, no
    # cancellations, nothing. Either the guest comes up and the leg finishes in
    # ~2 min, or it never comes up and the job runs to whatever ceiling is in
    # place. A job at 8m49s is not a slow success a bigger sample would have
    # caught; it is a hang that met the cap. Doubling the sample moved the
    # worst success by 72s and left the 4..8 band exactly as empty.
    #
    # And the overruns are not slow work: the guest NEVER BOOTS. Witness from
    # run 34940900311, step 5, verbatim — `VM is ready` appears 0 times:
    #
    #   Waiting for VM to be ready...
    #   kex_exchange_identification: read: Connection reset by peer   (x5, ~75s apart)
    #   ##[error]The operation was canceled.
    #
    # Negative control, the slowest netbsd SUCCESS in the same window (run
    # 34860751100): `VM is ready` after 23.8s, ONE wait, ZERO kex. Nothing in
    # between has ever been observed.
    #
    # So do NOT raise this "to be safe". Nine hangs observed, ZERO recovered,
    # and two of them had the full 30 minutes of the old cap to do it in:
    #
    #   run 34785397486  netbsd  30m04s  cap 30  no verdict
    #   run 34781660291  netbsd  30m03s  cap 30  no verdict
    #   run 34781015219  netbsd   8m56s  cap 30  still hung when a push cut it
    #   run 34853381050  netbsd   8m49s  cap  8  no verdict
    #   run 34857766102  netbsd   8m49s  cap  8  no verdict
    #   run 34897461740  netbsd   8m49s  cap  8  no verdict
    #   run 34895986195  netbsd   8m16s  cap  8  no verdict
    #   run 34940900311  netbsd   8m03s  cap  8  no verdict
    #   run 34941622606  netbsd   8m03s  cap  8  no verdict
    #
    # In all nine the two sibling BSD jobs are green, which is what separates a
    # hang from a `cancel-in-progress` sweep. Denominator: 90 runs reached a
    # verdict or hung (10 were cut wholesale by a newer push), so 9/90 = 10%.
    # Do NOT quote that as a stable rate — it rests on NINE events. What the 160
    # successes settle is the MECHANISM, not the frequency.
    #
    # Raising the cap does not convert a hang into a verdict — it buys burned
    # runner minutes. Raise only if the three ranges above actually move, and
    # re-measure before you do.
    #
    # Do NOT lower it either. A 5-minute cap would cut a hang ~3 min earlier —
    # considered, and rejected: it leaves 62s of headroom over the worst real
    # success, LESS than the 72s that worst case already moved when the sample
    # doubled, for a margin of x1.26. The trade does not pay.
    #
    # Budget the real cost: a timeout costs cap + 3s .. cap + 49s, over the six
    # that met the 8m00s cap (483s, 483s, 496s, 529s, 529s, 529s), because the
    # cancel waits for the QEMU guest to tear down. The overshoot was only 3-4s
    # at 30 min, when the guest had long since died.
    #
    # These are genuine step-5 hangs, not the cross-platform-actions 504 that
    # fails other BSD legs inside `Setting up VM`: they completed steps 1-4 in
    # under 45s, and no log carries a 504 or a download error. A 504 fails fast;
    # these ran to the cap.
    #
    # All of the above is the PRE-BUMP baseline: it was measured against
    # cross-platform-actions v1.2.0. The pin below is now v1.6.0, whose changelog
    # bounds exactly the loop these logs show. Re-measure before reusing these
    # numbers as current.
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: freebsd, version: "15.0" }
          - { os: openbsd, version: "7.9" }
          - { os: netbsd, version: "10.1" }
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: pkg/go.mod

      - name: Cross-compile test binaries + conformance for ${{ matrix.os }}
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: amd64
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p bins
          compile() { # module  pkg-list
            local mod="$1"; shift
            for pkg in $@; do
              local out="bins/$(echo "${mod#internal/}_${pkg#./}" | tr '/ ' '__').test"
              # A package with no _test.go produces no binary; tolerate that.
              if (cd "$mod" && go test -c -o "$GITHUB_WORKSPACE/$out" "$pkg") 2>/tmp/c.log; then
                [ -f "$out" ] && echo "built $out" || echo "no tests in $mod/$pkg (skip)"
              else
                echo "::error::compile $mod/$pkg for $GOOS failed"; cat /tmp/c.log; exit 1
              fi
            done
          }
          compile internal/kernel  $KERNEL_PKGS
          compile internal/core    $CORE_PKGS
          compile internal/service $SERVICE_PKGS
          # BSD is Unix, so the file-security suites apply here too.
          compile internal/service $SERVICE_FILE_PKGS
          # Conformance is a real program (not a -c suite): build it normally.
          (cd e2e && go build -o "$GITHUB_WORKSPACE/bins/conformance.run" .)
          ls -la bins/

      # Boots a real ${{ matrix.os }} kernel VM and syncs the workspace (incl.
      # bins/) into it. pin to a SHA before promoting this lane to a PR gate.
      #
      # v1.2.0 -> v1.6.0 because v1.2.0 waits for the guest by COUNTING SSH
      # attempts, with no clock on the loop. That is the shape of every overrun
      # above: step 5 retries `kex_exchange_identification: read: Connection
      # reset by peer` at ~75s a go, never prints `VM is ready`, and only
      # `timeout-minutes` ends it. Upstream bounded it, and removed three
      # reasons the guest never comes up in the first place:
      #
      #   v1.4.0  waiting for readiness is bounded by a wall clock instead of an
      #           attempt count, and one SSH attempt by `ConnectTimeout`; AMX is
      #           no longer exposed to x86-64 guests, which is what made NetBSD
      #           9.4/10.1 fault as userland started on the runners that have it
      #   v1.5.0  LA57 (5-level paging) and always-on STIBP likewise withheld;
      #           NetBSD guests log in without a credential, so no key pair and
      #           no resources disk are built for them
      #   v1.6.0  DragonFly networking (not a platform this lane runs)
      #
      # Input schema across v1.2.0..v1.6.0 diffs by exactly one ADDITIVE key,
      # `variant` (default `default`, boots as before). Nothing used here was
      # renamed. `microvm` is NetBSD 11 only, so 10.1 cannot opt in; not taken.
      #
      # This pin is a cause-shaped fix, not a measured one: the failure runs at
      # ~9% on netbsd, so no single green run can confirm it. What the next
      # weeks measure is whether overruns stop, not whether one run passed.
      - name: Run on real ${{ matrix.os }} kernel
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          # The BSD guests run under QEMU/TCG (no KVM on hosted runners), so they
          # execute far slower than a native kernel. Give them the runner's full
          # core count + memory to keep timing-sensitive proc tests (stdio
          # pumping, the trampoline handshake, signal-relay deadlines) from
          # flaking on emulation latency rather than a real defect.
          cpu_count: 4
          memory: 6G
          shell: bash
          run: |
            set -uo pipefail
            # Under QEMU/TCG (no KVM on hosted runners) a timing-sensitive test
            # occasionally flakes on emulation latency; a real defect fails every
            # attempt. Retry each binary up to 3x so a transient hiccup does not
            # red the lane, while a genuine bug still surfaces.
            retry() {
              local i
              for i in 1 2 3; do
                "$@" && return 0
                echo "  (attempt $i failed on ${{ matrix.os }}, retrying)"
              done
              return 1
            }
            fail=0
            echo "== conformance on ${{ matrix.os }} =="
            retry ./bins/conformance.run || fail=1
            for b in bins/*.test; do
              echo "== $b =="
              # -test.short keeps each per-OS run quick; suites self-gate on
              # UnsupportedPlatform / missing /bin/sh and skip cleanly.
              retry ./"$b" -test.v -test.short || fail=1
            done
            exit $fail
