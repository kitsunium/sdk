name: E2E VM tests (real OS kernels)

# Runs the platform-sensitive test suites on REAL operating systems — not
# cross-compile-only. The proc domain (spawn, cgroup, rlimit, signals, reaper,
# sd_notify) exercises live syscalls whose behaviour only a real kernel can
# validate, so a green `go build` is necessary but not sufficient.
#
# Mechanism (kodflow/labs infra — see labs/docs/ci-runner-usage.md):
#   1. A `kitsunium-runner` ARC runner cross-compiles a standalone test binary
#      per package per GOOS with `go test -c` (no Go needed on the target VM).
#   2. Each target OS has a persistent Proxmox test VM with a `base` ZFS snapshot;
#      the runner rolls it back (~3s), boots it, finds its IP via the dnsmasq
#      lease, SCPs the test binaries in, and runs them over SSH on the real kernel.
#
# Prerequisites (provisioned by the org owner, not this repo):
#   - The labs ARC runner scale set registered for this repo (label
#     `kitsunium-runner`, added by kodflow/labs arc_orgs), with ~/.ssh/id_rsa_vms
#     reachable to the VM subnet.
#   - Secrets: CI_RUNNER_API_TOKEN_ID, CI_RUNNER_API_TOKEN_SECRET, PROXMOX_NODE,
#     ADMIN_USERNAME.
# Manual-trigger only (workflow_dispatch) so a missing-infra org never hard-fails
# every PR; promote to `pull_request` once the runners are wired.

on:
  workflow_dispatch:

# The matrix entries roll back + drive fixed persistent VMIDs in place, so two
# concurrent dispatches must never touch the same guest — serialise the whole
# workflow (never cancel a run mid-rollback).
concurrency:
  group: e2e-vm-proxmox
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Two-host split (kodflow/labs#185): the runners live on a dedicated CI
  # Proxmox whose local gateway is NOT the bench anymore — a direct
  # https://192.168.100.1:8006 call reaches the wrong host. The API is now
  # consumed through a local SSH tunnel to the bench (opened in the first
  # step; the runner image's SSH config remaps 192.168.100.1 to the bench
  # bastion's public IP with the right key).
  PROXMOX_API_URL: "https://127.0.0.1:18006/api2/json"
  PVE_AUTH: "PVEAPIToken=${{ secrets.CI_RUNNER_API_TOKEN_ID }}=${{ secrets.CI_RUNNER_API_TOKEN_SECRET }}"
  NODE: ${{ secrets.PROXMOX_NODE }}
  SSH_OPTS: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10"
  # Platform-sensitive packages whose runtime behaviour must be validated on a
  # real kernel. Pure-Go packages (codec/crypto/logger/errs) behave identically
  # everywhere and are covered by the Linux Bazel lane, so they are excluded.
  PROC_PKGS_CORE: "./proc"
  PROC_PKGS_SERVICE: "./proc/exec ./proc/cgroup ./proc/reaper ./proc/rlimit ./proc/sdlisten ./proc/sdnotify ./proc/signal ./logger/sink/file ./writer/rotfile"

jobs:
  e2e:
    runs-on: kitsunium-runner
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          # name : Proxmox test VMID (template+100) : GOOS/GOARCH : SSH user : exe suffix
          - {
              name: debian-systemd,
              vmid: 204,
              goos: linux,
              goarch: amd64,
              user: root,
              ext: "",
            }
          - {
              name: alpine-openrc,
              vmid: 200,
              goos: linux,
              goarch: amd64,
              user: root,
              ext: "",
            }
          - {
              name: fedora-systemd,
              vmid: 206,
              goos: linux,
              goarch: amd64,
              user: root,
              ext: "",
            }
          - {
              name: freebsd,
              vmid: 209,
              goos: freebsd,
              goarch: amd64,
              user: root,
              ext: "",
            }
          - {
              name: openbsd,
              vmid: 210,
              goos: openbsd,
              goarch: amd64,
              user: root,
              ext: "",
            }
          - {
              name: netbsd,
              vmid: 211,
              goos: netbsd,
              goarch: amd64,
              user: root,
              ext: "",
            }
          - {
              name: windows-11,
              vmid: 213,
              goos: windows,
              goarch: amd64,
              user: kodflow,
              ext: ".exe",
            }
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      # ── 0. Tunnel the bench Proxmox API through the SSH bastion ─────────────
      - name: Open Proxmox API tunnel (bench host)
        run: |
          set -euo pipefail
          # Control socket so the always() cleanup can terminate the forward
          # deterministically (a bare `ssh -f -N` would leak past the job).
          ssh ${SSH_OPTS} -f -N -M -S /tmp/pve-tunnel.sock \
            -L 18006:127.0.0.1:8006 root@192.168.100.1
          code=000
          for i in $(seq 1 10); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "${PROXMOX_API_URL}/version" -H "Authorization: $PVE_AUTH" || echo 000)
            [ "$code" = "200" ] && { echo "tunnel up, API auth OK"; exit 0; }
            sleep 2
          done
          case "$code" in
            000) echo "::error::tunnel never came up (no TCP path to the bench API)";;
            401|403) echo "::error::tunnel is up but the PVE token was refused (HTTP $code) — check CI_RUNNER_API_TOKEN_*";;
            *) echo "::error::unexpected API answer through the tunnel (HTTP $code)";;
          esac
          exit 1

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: pkg/go.mod

      # ── 1. Cross-compile standalone test binaries (no Go on the VM) ──────────
      - name: Compile test binaries for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p bins
          compile() { # module  pkg-list
            local mod="$1"; shift
            for pkg in $@; do
              # Suffix order matters: the executable extension MUST be last, so a
              # Windows binary is <name>.test.exe (runnable), not <name>.exe.test.
              local out="bins/$(echo "${mod#internal/}_${pkg#./}" | tr '/ ' '__').test${{ matrix.ext }}"
              # A package with no _test.go produces no binary; tolerate that.
              if (cd "$mod" && go test -c -o "$GITHUB_WORKSPACE/$out" "$pkg") 2>/tmp/c.log; then
                [ -f "$out" ] && echo "built $out" || echo "no tests in $mod/$pkg (skip)"
              else
                echo "::error::compile $mod/$pkg for $GOOS failed"; cat /tmp/c.log; exit 1
              fi
            done
          }
          compile internal/core    $PROC_PKGS_CORE
          compile internal/service $PROC_PKGS_SERVICE
          # The headline artifact: the conformance binary exercises the WHOLE
          # public SDK API and exits non-zero if any supported behaviour is wrong
          # on this kernel. It is a real program (not a -c test binary), so build
          # it normally; it is named conformance.run${ext} so the run step can
          # tell it apart from the .test suites.
          (cd e2e && go build -o "$GITHUB_WORKSPACE/bins/conformance.run${{ matrix.ext }}" .) \
            || { echo "::error::conformance build for $GOOS failed"; exit 1; }
          ls -la bins/

      # ── 2. Roll the VM back to its clean base snapshot ──────────────────────
      - name: Rollback ${{ matrix.name }} to base snapshot
        run: |
          set -euo pipefail
          VMID=${{ matrix.vmid }}
          curl -sk -X POST -H "Authorization: $PVE_AUTH" \
            "${PROXMOX_API_URL}/nodes/${NODE}/qemu/${VMID}/status/stop" || true
          sleep 5
          # Rollback is async: it returns a UPID. Poll the task to completion
          # before starting, else the VM boots mid-rollback (a race / corruption).
          UPID=$(curl -sk -X POST -H "Authorization: $PVE_AUTH" \
            "${PROXMOX_API_URL}/nodes/${NODE}/qemu/${VMID}/snapshot/base/rollback" | jq -r '.data')
          for i in $(seq 1 60); do
            st=$(curl -sk -H "Authorization: $PVE_AUTH" \
              "${PROXMOX_API_URL}/nodes/${NODE}/tasks/${UPID}/status" | jq -r '.data.status' 2>/dev/null || true)
            [ "$st" = "stopped" ] && break
            sleep 2
          done
          [ "$st" = "stopped" ] || { echo "::error::rollback task did not finish ($UPID)"; exit 1; }
          curl -sk -X POST -H "Authorization: $PVE_AUTH" \
            "${PROXMOX_API_URL}/nodes/${NODE}/qemu/${VMID}/status/start"

      # ── 3. Detect the VM IP via the dnsmasq lease + wait for SSH ────────────
      - name: Detect VM IP
        id: ip
        run: |
          set -euo pipefail
          VMID=${{ matrix.vmid }}
          MAC=$(curl -sk -H "Authorization: $PVE_AUTH" \
            "${PROXMOX_API_URL}/nodes/${NODE}/qemu/${VMID}/config" \
            | jq -r '.data.net0' | grep -oiE '([0-9a-f]{2}:){5}[0-9a-f]{2}')
          for i in $(seq 1 30); do
            IP=$(ssh ${SSH_OPTS} root@192.168.100.1 \
              "grep -i '${MAC}' /var/lib/misc/dnsmasq.leases 2>/dev/null | awk '{print \$3}'" 2>/dev/null || true)
            [ -n "$IP" ] && { echo "ip=${IP}" >> "$GITHUB_OUTPUT"; echo "IP=$IP"; break; }
            sleep 5
          done
          [ -n "${IP:-}" ] || { echo "::error::no IP after 150s"; exit 1; }

      - name: Wait for SSH
        run: |
          for i in $(seq 1 30); do
            ssh ${SSH_OPTS} ${{ matrix.user }}@${{ steps.ip.outputs.ip }} true 2>/dev/null && exit 0
            sleep 5
          done
          echo "::error::SSH never came up"; exit 1

      # ── 4. Ship the binaries to the VM and run them on the real kernel ──────
      - name: Run conformance + test suites on ${{ matrix.name }}
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          IP=${{ steps.ip.outputs.ip }}
          USER=${{ matrix.user }}
          EXT='${{ matrix.ext }}'
          # All artifacts: the conformance binary + the per-package -c test suites.
          all=(bins/conformance.run"${EXT}" bins/*.test"${EXT}")
          if [ ${#all[@]} -eq 0 ]; then
            echo "no binaries for ${{ matrix.name }} — nothing to run"; exit 0
          fi
          scp ${SSH_OPTS} "${all[@]}" "${USER}@${IP}:" || { echo "::error::scp failed"; exit 1; }
          run_one() { # display-name  remote-invocation
            echo "::group::$1 on ${{ matrix.name }}"
            if ssh ${SSH_OPTS} "${USER}@${IP}" "$2 2>&1"; then echo "PASS $1"; return 0; fi
            echo "::error::$1 failed on ${{ matrix.name }}"; return 1
          }
          launch() { # basename -> ./name (unix) or name (windows)
            if [ -n "$EXT" ]; then echo "$1"; else echo "./$1"; fi
          }
          fail=0
          # Headline: the conformance binary exercises the WHOLE public API and
          # exits non-zero if any supported behaviour is wrong on this kernel.
          conf="conformance.run${EXT}"
          run_one "conformance" "$(launch "$conf")" || fail=1
          # Then the per-package test suites (a target with only Unix-only suites
          # produces none for a Windows lane — a clean skip).
          for bin in bins/*.test"${EXT}"; do
            name=$(basename "$bin")
            # -test.short keeps each per-OS run quick; suites self-gate on /bin/sh
            # and UnsupportedPlatform and skip cleanly where unsupported.
            run_one "$name" "$(launch "$name") -test.v -test.short" || fail=1
            echo "::endgroup::"
          done
          echo "::endgroup::"
          exit $fail
      # ── 5. Leave the VM stopped: a running VM races the bench nightly jobs
      # (snapshot rebuild / reclone); the next run rolls back + starts anyway. ──
      - name: Stop VM (always)
        if: always()
        run: |
          # stop is async (returns a UPID): poll it to completion so the runner
          # never releases while the VM is still stopping (bench nightly race).
          # Best-effort by design — a dead tunnel must not fail the cleanup.
          VMID=${{ matrix.vmid }}
          UPID=$(curl -sk -X POST -H "Authorization: $PVE_AUTH" \
            "${PROXMOX_API_URL}/nodes/${NODE}/qemu/${VMID}/status/stop" | jq -r '.data // empty' 2>/dev/null || true)
          if [ -n "$UPID" ]; then
            for i in $(seq 1 30); do
              st=$(curl -sk -H "Authorization: $PVE_AUTH" \
                "${PROXMOX_API_URL}/nodes/${NODE}/tasks/${UPID}/status" | jq -r '.data.status' 2>/dev/null || true)
              [ "$st" = "stopped" ] && break
              sleep 2
            done
            final=$(curl -sk -H "Authorization: $PVE_AUTH" \
              "${PROXMOX_API_URL}/nodes/${NODE}/qemu/${VMID}/status/current" | jq -r '.data.status' 2>/dev/null || true)
            echo "VM ${VMID} final status: ${final:-unknown}"
          else
            echo "stop request not accepted (tunnel down?) — leaving VM as-is"
          fi

      - name: Close API tunnel (always)
        if: always()
        run: ssh -S /tmp/pve-tunnel.sock -O exit root@192.168.100.1 2>/dev/null || true
