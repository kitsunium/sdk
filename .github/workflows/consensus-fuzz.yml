name: Consensus fuzz
# The long fuzz lane of ADR 0152 (D15): every fuzz target of the consensus
# domain, a bounded time each, nightly and on demand. The seed corpus runs
# on every push already, as plain tests inside the `bazel` job; this is the
# exploration that is too long for a pull request.
#
# An alarm, not a gate: it blocks nothing by itself. A crasher is uploaded
# as an artefact, and the fix commits it under testdata/fuzz as a
# regression case.

on:
  schedule:
    # 03:41 UTC — off the hour, where scheduled runs queue behind everyone
    # else's.
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "time per target (go test -fuzztime)"
        required: false
        default: "8m"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: consensus fuzz targets
    if: github.repository == 'kitsunium/sdk'
    runs-on: ubuntu-latest
    # Six targets at 8 minutes each, plus the build and the corpus.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: fuzz every consensus target
        env:
          FUZZ_TIME: ${{ github.event.inputs.fuzztime || '8m' }}
        run: bash scripts/ci/consensus-fuzz.sh

      - name: collect crashers
        if: failure()
        run: |
          mkdir -p fuzz-crashers
          git ls-files --others --exclude-standard -- '*/testdata/fuzz/*' | while IFS= read -r f; do
            mkdir -p "fuzz-crashers/$(dirname "$f")"
            cp "$f" "fuzz-crashers/$f"
          done

      - name: upload crashers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: consensus-fuzz-crashers-${{ github.run_number }}
          path: fuzz-crashers
          if-no-files-found: warn
