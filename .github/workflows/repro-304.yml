# Temporary: reproduces the two Windows rows of #304. Removed before the PR.
name: repro-304
on:
  push:
    branches: [fix/304-windows]
permissions:
  contents: read
jobs:
  rlimit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: probes
        shell: bash
        env: { GOWORK: "off", CGO_ENABLED: "0" }
        run: |
          cd internal/service
          go test -count=1 -v -run 'Repro304' ./proc/exec 2>&1 | grep -E 'PROBE304|^(ok|FAIL|---)' || true
      - name: TestWindowsRlimitMemoryMapped x 3000
        shell: bash
        env: { GOWORK: "off", CGO_ENABLED: "0" }
        run: |
          cd internal/service
          go test -c -o exec.test.exe ./proc/exec
          fails=0
          for i in $(seq 1 300); do
            ./exec.test.exe -test.run 'TestWindows' -test.count=10 > out.txt 2>&1 || { fails=$((fails+1)); grep -E 'FAIL|exec_windows_test' out.txt | head -5; }
          done
          echo "RESULT rlimit: $fails failing invocations of 300 (x10 counts, whole TestWindows set)"

  harness:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, race, loaded]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: loop
        shell: bash
        env: { GOWORK: "off", GOTRACEBACK: "all" }
        run: |
          cd e2e
          if [ "${{ matrix.mode }}" = race ]; then
            CGO_ENABLED=1 go test -race -c -o h.exe ./harness
          else
            CGO_ENABLED=0 go test -c -o h.exe ./harness
          fi
          run_loop() {
            local tag=$1 n=$2 fails=0
            for i in $(seq 1 "$n"); do
              ./h.exe -test.count=10 > "out-$tag-$i.txt" 2>&1 || { fails=$((fails+1)); echo "=== $tag run $i failed"; head -c 20000 "out-$tag-$i.txt"; }
              rm -f "out-$tag-$i.txt"
            done
            echo "RESULT $tag: $fails failing invocations of $n (x10 counts)"
          }
          if [ "${{ matrix.mode }}" = loaded ]; then
            run_loop a 300 & run_loop b 300 & run_loop c 300 & run_loop d 300 &
            wait
          else
            run_loop one 600
          fi
