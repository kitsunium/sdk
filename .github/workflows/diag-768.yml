name: diag-768 (never merged)

# Diagnostic for kitsunium/sdk#768 on the Windows runner, round 2: the
# metadata tests of protocol 2 run forty times each, with the full error of
# a refused start, on origin/main's store (diag/raft-loop-768) and on the
# store made exclusive (diag/raft-loop-768-fixed).

on:
  push:
    branches: ['diag/raft-loop-768', 'diag/raft-loop-768-fixed']

permissions:
  contents: read

jobs:
  win:
    name: windows tmp-${{ matrix.tmp }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        tmp: [c, d]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Go cache paths and week
        id: gocache
        shell: bash
        run: |
          {
            echo "build=$(go env GOCACHE)"
            echo "mod=$(go env GOMODCACHE)"
            echo "week=$(date -u +%G-W%V)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-native-windows-internal-${{ hashFiles('**/go.sum') }}-${{ steps.gocache.outputs.week }}
          restore-keys: |
            go-native-windows-internal-${{ hashFiles('**/go.sum') }}-
            go-native-windows-internal-

      - name: Temporary directory
        shell: bash
        run: |
          out="$(cygpath -u "$RUNNER_TEMP")/out"
          mkdir -p "$out"
          if [ "${{ matrix.tmp }}" = d ]; then
            d="$(cygpath -u "$RUNNER_TEMP")/gotmp"
            mkdir -p "$d"
            w="$(cygpath -w "$d")"
            echo "TMP=$w" >> "$GITHUB_ENV"
            echo "TEMP=$w" >> "$GITHUB_ENV"
          fi

      - name: The metadata tests, forty times each
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: |
          out="$(cygpath -u "$RUNNER_TEMP")/out"
          cd internal
          for t in TestAVersion2MetaThatRottedIsNotRestored TestTheRestartedNodeCutsItsRottedNewestAgainFromItsOwnLog TestASnapshotMetaOfVersion2IsRestored TestAListingNeverMeetsAPublicationOrARemovalOfTheSameStore; do
            echo "::group::$t"
            go test -count=40 -timeout 30m -run "^${t}\$" ./service/app/consensus/ > "$out/$t.txt" 2>&1
            echo "exit $?"
            grep -c -- '--- FAIL' "$out/$t.txt" || true
            grep -E -- '--- FAIL|_test.go:[0-9]+:|^(ok|FAIL)' "$out/$t.txt" | sort | uniq -c | sort -rn | head -20
            echo "::endgroup::"
          done

      - name: Upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diag-768-r2-${{ matrix.tmp }}
          path: ${{ runner.temp }}/out
          retention-days: 7
